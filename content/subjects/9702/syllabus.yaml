# Cambridge International AS & A Level Physics (9702), syllabus for exams in 2025, 2026 and 2027.
# Transcribed from the official syllabus document (see syllabus.sourceUrl) and checked against it.
# Objective text is a paraphrase that keeps the official command words (define, recall and use,
# derive, sketch ...), technical terms, conditions and formulae. Codes match the official
# learning outcome numbers.
subject:
  code: "9702"
  slug: physics
  name: Physics
  shortName: Physics
  description: >-
    Physics uses a handful of powerful ideas (forces, energy, waves and fields) to explain how
    everything from quarks to galaxies behaves, and teaches you to test those ideas against real
    measurements.

syllabus:
  id: 9702-2025-2027
  label: "2025–2027"
  examYears: [2025, 2026, 2027]
  sourceUrl: https://www.cambridgeinternational.org/Images/664565-2025-2027-syllabus.pdf
  sourceVersion: Version 1, published September 2022
  checkedAt: "2026-10-19"
  wording: paraphrased
  notes: >-
    Sections 1–25 are the syllabus's numbered topics: 1–11 are AS Level content (assessed in
    Paper 1 Multiple Choice and Paper 2 AS Level Structured Questions) and 12–25 are A Level
    content (assessed in Paper 4 A Level Structured Questions, which also requires knowledge of the
    AS Level content). Objective codes are the official learning outcome numbers. This syllabus has
    no separate notes column, so parenthetical scope statements inside outcomes ("not required",
    "it will be assumed that", examples) and the sub-bullets of 20.5.4 are given in guidance.
    Several topic introductions state assumed prior knowledge from Cambridge IGCSE/O Level Physics or
    equivalent: forces (3), forms of energy and energy transfers (5), colour (7), energy (16), and the
    practical and economic advantages of transmitting power by electricity (21). The syllabus also
    includes required data and formulae (printed on page 2 of Papers 1 and 2 and pages 2–3 of Paper
    4), mathematical requirements, a summary of key quantities, symbols and units, and circuit
    symbols (all in section 6 of the document); these are not transcribed as objectives. Practical
    skills are assessed separately, in Paper 3 Advanced Practical Skills (AS Level) and Paper 5
    Planning, Analysis and Evaluation (A Level), from the Practical assessment section; they are
    not transcribed here. The document notes that the wording of outcomes 3.3.3, 7.5.2, 15.3.4 and
    25.3.1 was updated in this version.

sections:
  # ---------------------------------------------------------------------------
  # AS Level subject content
  # ---------------------------------------------------------------------------
  - code: "1"
    title: Physical quantities and units
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "1.1"
        title: Physical quantities
        objectives:
          - code: "1.1.1"
            text: Understand that any physical quantity is expressed as a numerical magnitude together with a unit.
          - code: "1.1.2"
            text: Make sensible estimates of the values of physical quantities that appear in the syllabus.
      - code: "1.2"
        title: SI units
        objectives:
          - code: "1.2.1"
            text: >-
              Recall these SI base quantities together with their units: mass (kg), length (m),
              time (s), current (A) and temperature (K).
          - code: "1.2.2"
            text: >-
              Write derived units as products or quotients of SI base units, and use the appropriate
              derived units for the quantities in this syllabus.
          - code: "1.2.3"
            text: Check whether a physical equation is homogeneous by using SI base units.
          - code: "1.2.4"
            text: >-
              Recall and use the following prefixes, with their symbols, for decimal multiples and
              submultiples of base and derived units alike: pico (p), nano (n), micro (μ), milli (m),
              centi (c), deci (d), kilo (k), mega (M), giga (G) and tera (T).
      - code: "1.3"
        title: Errors and uncertainties
        objectives:
          - code: "1.3.1"
            text: >-
              Understand and explain how measurements are affected by random errors and by systematic
              errors, including zero errors.
          - code: "1.3.2"
            text: Understand how precision differs from accuracy.
          - code: "1.3.3"
            text: >-
              Assess the uncertainty in a derived quantity by simply adding the absolute
              uncertainties or the percentage uncertainties involved.
      - code: "1.4"
        title: Scalars and vectors
        objectives:
          - code: "1.4.1"
            text: >-
              Understand what distinguishes scalar quantities from vector quantities, and give
              examples of each from the syllabus.
          - code: "1.4.2"
            text: Add and subtract coplanar vectors.
          - code: "1.4.3"
            text: Represent a vector as two components at right angles to each other.

  - code: "2"
    title: Kinematics
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "2.1"
        title: Equations of motion
        objectives:
          - code: "2.1.1"
            text: Define distance, displacement, speed, velocity and acceleration, and use these quantities.
          - code: "2.1.2"
            text: Represent distance, displacement, speed, velocity and acceleration using graphical methods.
          - code: "2.1.3"
            text: Determine displacement by finding the area under a velocity–time graph.
          - code: "2.1.4"
            text: Determine velocity by finding the gradient of a displacement–time graph.
          - code: "2.1.5"
            text: Determine acceleration by finding the gradient of a velocity–time graph.
          - code: "2.1.6"
            text: >-
              Starting from the definitions of velocity and acceleration, derive the equations for
              uniformly accelerated motion in a straight line.
          - code: "2.1.7"
            text: >-
              Use the equations of uniformly accelerated motion in a straight line to solve problems,
              including problems on bodies falling without air resistance in a uniform gravitational
              field.
          - code: "2.1.8"
            text: Describe an experiment in which a falling object is used to determine the acceleration of free fall.
          - code: "2.1.9"
            text: >-
              Describe and explain the motion produced by a uniform velocity in one direction
              combined with a uniform acceleration at right angles to it.

  - code: "3"
    title: Dynamics
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "3.1"
        title: Momentum and Newton’s laws of motion
        objectives:
          - code: "3.1.1"
            text: Understand that mass is the property of an object that opposes any change in its motion.
          - code: "3.1.2"
            text: >-
              Recall F = ma and use it in problem solving, understanding that the resultant force
              and the acceleration always act in the same direction.
          - code: "3.1.3"
            text: Define linear momentum as mass multiplied by velocity, and use this definition.
          - code: "3.1.4"
            text: Define force as the rate of change of momentum, and use this definition.
          - code: "3.1.5"
            text: State Newton’s laws of motion and apply each one.
          - code: "3.1.6"
            text: >-
              Describe weight as the effect of a gravitational field acting on a mass and use this
              idea, recalling that an object’s weight is its mass multiplied by the acceleration of
              free fall.
      - code: "3.2"
        title: Non-uniform motion
        objectives:
          - code: "3.2.1"
            text: >-
              Show a qualitative understanding of friction and of viscous (drag) forces, air
              resistance among them.
            guidance: >-
              No treatment of the coefficients of friction and of viscosity is required; a simple
              model in which drag force increases as speed increases is sufficient.
          - code: "3.2.2"
            text: >-
              Describe and explain, qualitatively, the motion of an object in a uniform gravitational
              field when air resistance acts on it.
          - code: "3.2.3"
            text: >-
              Understand that, when an object moves against a resistive force, it may reach a
              terminal (constant) velocity.
      - code: "3.3"
        title: Linear momentum and its conservation
        objectives:
          - code: "3.3.1"
            text: State the principle of conservation of momentum.
          - code: "3.3.2"
            text: >-
              Solve simple problems by applying the principle of conservation of momentum, including
              elastic and inelastic interactions between objects in one and in two dimensions.
            guidance: The concept of coefficient of restitution is not required.
          - code: "3.3.3"
            text: >-
              Recall that an elastic collision conserves total kinetic energy, and that in such a
              collision the relative speed of approach equals the relative speed of separation.
          - code: "3.3.4"
            text: >-
              Understand that the momentum of a system is always conserved when objects interact,
              but that its kinetic energy may change.

  - code: "4"
    title: Forces, density and pressure
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "4.1"
        title: Turning effects of forces
        objectives:
          - code: "4.1.1"
            text: Understand that an object’s weight may be treated as acting at one point, its centre of gravity.
          - code: "4.1.2"
            text: Define the moment of a force and apply the definition.
          - code: "4.1.3"
            text: Understand that a couple is a pair of forces whose only effect is to produce rotation.
          - code: "4.1.4"
            text: Define the torque of a couple and apply the definition.
      - code: "4.2"
        title: Equilibrium of forces
        objectives:
          - code: "4.2.1"
            text: State the principle of moments and apply it.
          - code: "4.2.2"
            text: >-
              Understand that a system with no resultant force and no resultant torque acting on it
              is in equilibrium.
          - code: "4.2.3"
            text: Represent coplanar forces in equilibrium using a vector triangle.
      - code: "4.3"
        title: Density and pressure
        objectives:
          - code: "4.3.1"
            text: Define density and use the definition.
          - code: "4.3.2"
            text: Define pressure and use the definition.
          - code: "4.3.3"
            text: >-
              Starting from the definitions of pressure and density, derive the hydrostatic pressure
              equation Δp = ρgΔh.
          - code: "4.3.4"
            text: Use Δp = ρgΔh.
          - code: "4.3.5"
            text: Understand that the upthrust on an object in a fluid arises from a difference in hydrostatic pressure.
          - code: "4.3.6"
            text: Use F = ρgV (Archimedes’ principle) to calculate the upthrust on an object in a fluid.

  - code: "5"
    title: Work, energy and power
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "5.1"
        title: Energy conservation
        objectives:
          - code: "5.1.1"
            text: >-
              Understand what work is, and recall and use work done = force × displacement in the
              direction of the force.
          - code: "5.1.2"
            text: Recall the principle of conservation of energy and apply it.
          - code: "5.1.3"
            text: >-
              Recall and understand that efficiency is the ratio of a system’s useful energy output
              to its total energy input.
          - code: "5.1.4"
            text: Solve problems using the concept of efficiency.
          - code: "5.1.5"
            text: Define power as the work done per unit time.
          - code: "5.1.6"
            text: Solve problems using P = W / t.
          - code: "5.1.7"
            text: Derive P = Fv and use it to solve problems.
      - code: "5.2"
        title: Gravitational potential energy and kinetic energy
        objectives:
          - code: "5.2.1"
            text: >-
              Use W = Fs to derive ΔE_P = mgΔh for a change in gravitational potential energy in a
              uniform gravitational field.
          - code: "5.2.2"
            text: >-
              Recall and use ΔE_P = mgΔh for a change in gravitational potential energy in a uniform
              gravitational field.
          - code: "5.2.3"
            text: Use the equations of motion to derive the kinetic energy formula E_K = ½mv².
          - code: "5.2.4"
            text: Recall and use E_K = ½mv².

  - code: "6"
    title: Deformation of solids
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "6.1"
        title: Stress and strain
        objectives:
          - code: "6.1.1"
            text: Understand that tensile or compressive forces cause deformation.
            guidance: Forces and deformations are taken to be one-dimensional only.
          - code: "6.1.2"
            text: Understand and use the terms load, extension, compression and limit of proportionality.
          - code: "6.1.3"
            text: Recall and use Hooke’s law.
          - code: "6.1.4"
            text: Recall and use k = F / x for the spring constant.
          - code: "6.1.5"
            text: Define stress, strain and the Young modulus, and use these terms.
          - code: "6.1.6"
            text: Describe an experiment to find the Young modulus of a metal using a sample in the form of a wire.
      - code: "6.2"
        title: Elastic and plastic behaviour
        objectives:
          - code: "6.2.1"
            text: Understand and use the terms elastic deformation, plastic deformation and elastic limit.
          - code: "6.2.2"
            text: Understand that the work done is represented by the area under a force–extension graph.
          - code: "6.2.3"
            text: >-
              Use the area under a force–extension graph to determine the elastic potential energy
              of a material deformed within its limit of proportionality.
          - code: "6.2.4"
            text: For a material deformed within its limit of proportionality, recall and use E_P = ½Fx = ½kx².

  - code: "7"
    title: Waves
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "7.1"
        title: Progressive waves
        objectives:
          - code: "7.1.1"
            text: >-
              Describe what wave motion means, using vibrations in ropes, springs and ripple tanks as
              illustrations.
          - code: "7.1.2"
            text: >-
              Understand and use the terms displacement, amplitude, phase difference, period,
              frequency, wavelength and speed.
          - code: "7.1.3"
            text: >-
              Understand how the time-base and y-gain settings of a cathode-ray oscilloscope (CRO) are
              used to find frequency and amplitude.
          - code: "7.1.4"
            text: Use the definitions of speed, frequency and wavelength to derive the wave equation v = fλ.
          - code: "7.1.5"
            text: Recall and use v = fλ.
          - code: "7.1.6"
            text: Understand that a progressive wave transfers energy.
          - code: "7.1.7"
            text: For a progressive wave, recall and use intensity = power / area and intensity ∝ (amplitude)².
      - code: "7.2"
        title: Transverse and longitudinal waves
        objectives:
          - code: "7.2.1"
            text: Compare transverse and longitudinal waves.
          - code: "7.2.2"
            text: Analyse and interpret graphs that represent transverse and longitudinal waves.
      - code: "7.3"
        title: Doppler effect for sound waves
        objectives:
          - code: "7.3.1"
            text: >-
              Understand that, when a source of sound waves moves relative to a stationary observer,
              the frequency the observer detects differs from the frequency of the source.
            guidance: The case of a stationary source and a moving observer is not required.
          - code: "7.3.2"
            text: >-
              For a source of sound waves moving relative to a stationary observer, use
              f_o = f_s v / (v ± v_s) for the observed frequency.
      - code: "7.4"
        title: Electromagnetic spectrum
        objectives:
          - code: "7.4.1"
            text: >-
              State that every electromagnetic wave is transverse and that all electromagnetic waves
              travel at the same speed c in free space.
          - code: "7.4.2"
            text: >-
              Recall the approximate range of free-space wavelengths covered by each principal region
              of the electromagnetic spectrum, from radio waves to γ-rays.
          - code: "7.4.3"
            text: Recall that the human eye can see free-space wavelengths in the range 400–700 nm.
      - code: "7.5"
        title: Polarisation
        objectives:
          - code: "7.5.1"
            text: Understand that polarisation is a phenomenon associated with transverse waves.
          - code: "7.5.2"
            text: >-
              Recall Malus’s law (I = I₀ cos²θ) and use it to calculate the intensity of a
              plane-polarised electromagnetic wave transmitted through one polarising filter or a
              series of them.
            guidance: >-
              Calculations of the effect of a polarising filter on the intensity of an unpolarised
              wave are not required.

  - code: "8"
    title: Superposition
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "8.1"
        title: Stationary waves
        objectives:
          - code: "8.1.1"
            text: Explain the principle of superposition and use it.
          - code: "8.1.2"
            text: >-
              Show an understanding of experiments demonstrating stationary waves with microwaves,
              stretched strings and air columns.
            guidance: >-
              End corrections are treated as negligible, and the concept of end corrections is not
              required.
          - code: "8.1.3"
            text: >-
              Use a graphical method to explain how a stationary wave forms, and identify its nodes
              and antinodes.
          - code: "8.1.4"
            text: >-
              Understand how the positions of the nodes or antinodes of a stationary wave can be used
              to determine the wavelength.
      - code: "8.2"
        title: Diffraction
        objectives:
          - code: "8.2.1"
            text: Explain what is meant by diffraction.
          - code: "8.2.2"
            text: >-
              Show an understanding of experiments demonstrating diffraction, including,
              qualitatively, how the gap width compared with the wavelength affects the diffraction.
            guidance: One example is the diffraction of water waves in a ripple tank.
      - code: "8.3"
        title: Interference
        objectives:
          - code: "8.3.1"
            text: Understand the terms interference and coherence.
          - code: "8.3.2"
            text: >-
              Show an understanding of experiments demonstrating two-source interference with water
              waves in a ripple tank, with sound, with light and with microwaves.
          - code: "8.3.3"
            text: Understand what conditions are needed for two-source interference fringes to be observed.
          - code: "8.3.4"
            text: For double-slit interference using light, recall and use λ = ax / D.
      - code: "8.4"
        title: The diffraction grating
        objectives:
          - code: "8.4.1"
            text: Recall and use d sin θ = nλ.
          - code: "8.4.2"
            text: Describe how a diffraction grating is used to determine the wavelength of light.
            guidance: The structure and use of a spectrometer are excluded.

  - code: "9"
    title: Electricity
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "9.1"
        title: Electric current
        objectives:
          - code: "9.1.1"
            text: Understand that an electric current is a flow of charge carriers.
          - code: "9.1.2"
            text: Understand that charge carriers have quantised charge.
          - code: "9.1.3"
            text: Recall and use Q = It.
          - code: "9.1.4"
            text: >-
              For a current-carrying conductor, use I = Anvq, where n is the number density of charge
              carriers.
      - code: "9.2"
        title: Potential difference and power
        objectives:
          - code: "9.2.1"
            text: Define the potential difference across a component as the energy transferred per unit charge.
          - code: "9.2.2"
            text: Recall and use V = W / Q.
          - code: "9.2.3"
            text: Recall and use P = VI, P = I²R and P = V² / R.
      - code: "9.3"
        title: Resistance and resistivity
        objectives:
          - code: "9.3.1"
            text: Define resistance.
          - code: "9.3.2"
            text: Recall and use V = IR.
          - code: "9.3.3"
            text: >-
              Sketch the I–V characteristics of a metallic conductor at constant temperature, a
              semiconductor diode and a filament lamp.
          - code: "9.3.4"
            text: >-
              Explain that a filament lamp’s resistance rises as the current increases, because its
              temperature rises.
          - code: "9.3.5"
            text: State Ohm’s law.
          - code: "9.3.6"
            text: Recall and use R = ρL / A.
          - code: "9.3.7"
            text: Understand that the resistance of a light-dependent resistor (LDR) falls as the light intensity rises.
          - code: "9.3.8"
            text: Understand that the resistance of a thermistor falls as the temperature rises.
            guidance: Thermistors are assumed to have a negative temperature coefficient.

  - code: "10"
    title: D.C. circuits
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "10.1"
        title: Practical circuits
        objectives:
          - code: "10.1.1"
            text: Recall and use the circuit symbols given in section 6 of the syllabus.
          - code: "10.1.2"
            text: Draw and interpret circuit diagrams that use the circuit symbols given in section 6 of the syllabus.
          - code: "10.1.3"
            text: >-
              Define the electromotive force (e.m.f.) of a source as the energy transferred per unit
              charge in driving charge round a complete circuit, and use this definition.
          - code: "10.1.4"
            text: Use energy considerations to distinguish between e.m.f. and potential difference (p.d.).
          - code: "10.1.5"
            text: Understand how the internal resistance of a source of e.m.f. affects its terminal potential difference.
      - code: "10.2"
        title: Kirchhoff’s laws
        objectives:
          - code: "10.2.1"
            text: Recall Kirchhoff’s first law and understand that it follows from conservation of charge.
          - code: "10.2.2"
            text: Recall Kirchhoff’s second law and understand that it follows from conservation of energy.
          - code: "10.2.3"
            text: >-
              Use Kirchhoff’s laws to derive a formula for the combined resistance of two or more
              resistors in series.
          - code: "10.2.4"
            text: Use the series formula for the combined resistance of two or more resistors.
          - code: "10.2.5"
            text: >-
              Use Kirchhoff’s laws to derive a formula for the combined resistance of two or more
              resistors in parallel.
          - code: "10.2.6"
            text: Use the parallel formula for the combined resistance of two or more resistors.
          - code: "10.2.7"
            text: Solve simple circuit problems using Kirchhoff’s laws.
      - code: "10.3"
        title: Potential dividers
        objectives:
          - code: "10.3.1"
            text: Understand the principle of a potential divider circuit.
          - code: "10.3.2"
            text: Recall and use the principle of the potentiometer as a way of comparing potential differences.
          - code: "10.3.3"
            text: Understand how a galvanometer is used in null methods.
          - code: "10.3.4"
            text: >-
              Explain how thermistors and light-dependent resistors can be used in potential dividers
              to give a potential difference that depends on temperature and on light intensity
              respectively.

  - code: "11"
    title: Particle physics
    level: AS
    papers: [Paper 1, Paper 2]
    topics:
      - code: "11.1"
        title: Atoms, nuclei and radiation
        objectives:
          - code: "11.1.1"
            text: >-
              Infer from the results of the α-particle scattering experiment that the nucleus exists
              and is small.
          - code: "11.1.2"
            text: Describe a simple nuclear model of the atom made up of protons, neutrons and orbital electrons.
          - code: "11.1.3"
            text: Distinguish between nucleon number and proton number.
          - code: "11.1.4"
            text: >-
              Understand that isotopes are forms of one element whose nuclei contain different
              numbers of neutrons.
          - code: "11.1.5"
            text: >-
              Understand and use the nuclide notation A over Z X (nucleon number A as a superscript
              and proton number Z as a subscript, written before the element symbol X) to represent
              nuclides.
          - code: "11.1.6"
            text: Understand that charge and nucleon number are both conserved in nuclear processes.
          - code: "11.1.7"
            text: Describe the composition of α-, β- and γ-radiations, together with their mass and charge.
            guidance: Includes both β⁻ (electrons) and β⁺ (positrons).
          - code: "11.1.8"
            text: >-
              Understand that an antiparticle has the same mass as its corresponding particle but the
              opposite charge, and that the positron is the electron’s antiparticle.
          - code: "11.1.9"
            text: State that β⁻ decay produces (electron) antineutrinos and β⁺ decay produces (electron) neutrinos.
          - code: "11.1.10"
            text: >-
              Understand that α-particles are emitted with discrete energies, while β-particles have
              a continuous range of energies because (anti)neutrinos are also emitted in β-decay.
          - code: "11.1.11"
            text: >-
              Represent α- and β-decay with radioactive decay equations of the form
              ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂α.
          - code: "11.1.12"
            text: Use the unified atomic mass unit (u) as a unit of mass.
      - code: "11.2"
        title: Fundamental particles
        objectives:
          - code: "11.2.1"
            text: >-
              Understand that quarks are fundamental particles, and that quarks come in six flavours
              (types): up, down, strange, charm, top and bottom.
          - code: "11.2.2"
            text: >-
              Recall and use the charge of each quark flavour, and understand that each antiquark has
              the opposite charge to its quark.
            guidance: No other properties of quarks are required.
          - code: "11.2.3"
            text: >-
              Recall that protons and neutrons are not fundamental particles, and describe their
              quark composition.
          - code: "11.2.4"
            text: >-
              Understand that a hadron is either a baryon (three quarks) or a meson (one quark and
              one antiquark).
          - code: "11.2.5"
            text: Describe how quark composition changes in β⁻ decay and in β⁺ decay.
          - code: "11.2.6"
            text: Recall that electrons and neutrinos are fundamental particles known as leptons.

  # ---------------------------------------------------------------------------
  # A Level subject content
  # ---------------------------------------------------------------------------
  - code: "12"
    title: Motion in a circle
    level: A
    papers: [Paper 4]
    topics:
      - code: "12.1"
        title: Kinematics of uniform circular motion
        objectives:
          - code: "12.1.1"
            text: Define the radian, and express angular displacement in radians.
          - code: "12.1.2"
            text: Understand and use the concept of angular speed.
          - code: "12.1.3"
            text: Recall and use ω = 2π / T and v = rω.
      - code: "12.2"
        title: Centripetal acceleration
        objectives:
          - code: "12.2.1"
            text: >-
              Understand that centripetal acceleration is produced by a force of constant magnitude
              that always acts perpendicular to the direction of motion.
          - code: "12.2.2"
            text: Understand that centripetal acceleration results in circular motion at a constant angular speed.
          - code: "12.2.3"
            text: Recall and use a = rω² and a = v² / r.
          - code: "12.2.4"
            text: Recall and use F = mrω² and F = mv² / r.

  - code: "13"
    title: Gravitational fields
    level: A
    papers: [Paper 4]
    topics:
      - code: "13.1"
        title: Gravitational field
        objectives:
          - code: "13.1.1"
            text: >-
              Understand that a gravitational field is one example of a field of force, and define
              gravitational field as force per unit mass.
          - code: "13.1.2"
            text: Use field lines to represent a gravitational field.
      - code: "13.2"
        title: Gravitational force between point masses
        objectives:
          - code: "13.2.1"
            text: >-
              Understand that, at points outside a uniform sphere, the sphere’s mass can be treated as
              a point mass at its centre.
          - code: "13.2.2"
            text: >-
              Recall and use Newton’s law of gravitation, F = Gm₁m₂ / r², for the force between two
              point masses.
          - code: "13.2.3"
            text: >-
              Analyse circular orbits in gravitational fields by linking the gravitational force to
              the centripetal acceleration that it produces.
          - code: "13.2.4"
            text: >-
              Understand that a satellite in a geostationary orbit circles directly above the Equator,
              from west to east, with an orbital period of 24 hours, so that it stays above the same
              point on the Earth’s surface.
      - code: "13.3"
        title: Gravitational field of a point mass
        objectives:
          - code: "13.3.1"
            text: >-
              Starting from Newton’s law of gravitation and the definition of gravitational field,
              derive g = GM / r² for the gravitational field strength of a point mass.
          - code: "13.3.2"
            text: Recall and use g = GM / r².
          - code: "13.3.3"
            text: Understand why g is roughly constant for small changes in height close to the Earth’s surface.
      - code: "13.4"
        title: Gravitational potential
        objectives:
          - code: "13.4.1"
            text: >-
              Define the gravitational potential at a point as the work done per unit mass to bring a
              small test mass from infinity to that point.
          - code: "13.4.2"
            text: For the field of a point mass, use ϕ = −GM / r for the gravitational potential.
          - code: "13.4.3"
            text: >-
              Understand how the idea of gravitational potential leads to the gravitational potential
              energy of two point masses, and use E_P = −GMm / r.

  - code: "14"
    title: Temperature
    level: A
    papers: [Paper 4]
    topics:
      - code: "14.1"
        title: Thermal equilibrium
        objectives:
          - code: "14.1.1"
            text: >-
              Understand that (thermal) energy is transferred from a region at higher temperature to
              one at lower temperature.
          - code: "14.1.2"
            text: Understand that regions at the same temperature are in thermal equilibrium.
      - code: "14.2"
        title: Temperature scales
        objectives:
          - code: "14.2.1"
            text: >-
              Understand that any physical property that varies with temperature can be used to
              measure temperature, and state examples of such properties, including the density of a
              liquid, the volume of a gas at constant pressure, the resistance of a metal and the
              e.m.f. of a thermocouple.
          - code: "14.2.2"
            text: >-
              Understand that the thermodynamic temperature scale is independent of the property of
              any particular substance.
          - code: "14.2.3"
            text: >-
              Convert between temperatures in kelvin and in degrees Celsius, and recall that
              T / K = θ / °C + 273.15.
          - code: "14.2.4"
            text: >-
              Understand that zero kelvin on the thermodynamic temperature scale is the lowest
              possible temperature, called absolute zero.
      - code: "14.3"
        title: Specific heat capacity and specific latent heat
        objectives:
          - code: "14.3.1"
            text: Define specific heat capacity and use the definition.
          - code: "14.3.2"
            text: >-
              Define specific latent heat and use the definition, distinguishing the specific latent
              heat of fusion from the specific latent heat of vaporisation.

  - code: "15"
    title: Ideal gases
    level: A
    papers: [Paper 4]
    topics:
      - code: "15.1"
        title: The mole
        objectives:
          - code: "15.1.1"
            text: Understand that amount of substance is an SI base quantity, whose base unit is the mol.
          - code: "15.1.2"
            text: >-
              Use molar quantities, knowing that one mole of any substance contains a number of its
              particles equal to the Avogadro constant N_A.
      - code: "15.2"
        title: Equation of state
        objectives:
          - code: "15.2.1"
            text: >-
              Understand that an ideal gas is one that obeys pV ∝ T, where T is the thermodynamic
              temperature.
          - code: "15.2.2"
            text: >-
              Recall and use the equation of state for an ideal gas in two forms: pV = nRT, where n is
              the amount of substance (number of moles), and pV = NkT, where N is the number of
              molecules.
          - code: "15.2.3"
            text: Recall that the Boltzmann constant is k = R / N_A.
      - code: "15.3"
        title: Kinetic theory of gases
        objectives:
          - code: "15.3.1"
            text: State the basic assumptions of the kinetic theory of gases.
          - code: "15.3.2"
            text: >-
              Explain how the movement of molecules produces the pressure of a gas, and derive and
              use pV = ⅓Nm⟨c²⟩, where ⟨c²⟩ is the mean-square speed.
            guidance: >-
              A simple model is sufficient: consider one-dimensional collisions, then extend to three
              dimensions using ⅓⟨c²⟩ = ⟨cₓ²⟩.
          - code: "15.3.3"
            text: Understand that the root-mean-square speed c_r.m.s. equals √⟨c²⟩.
          - code: "15.3.4"
            text: >-
              By comparing pV = ⅓Nm⟨c²⟩ with pV = NkT, deduce that the average translational kinetic
              energy of a molecule is (3/2)kT, and recall and use this expression.

  - code: "16"
    title: Thermodynamics
    level: A
    papers: [Paper 4]
    topics:
      - code: "16.1"
        title: Internal energy
        objectives:
          - code: "16.1.1"
            text: >-
              Understand that the internal energy of a system is determined by its state, and that it
              can be expressed as the sum of a random distribution of the kinetic and potential
              energies of the system’s molecules.
          - code: "16.1.2"
            text: Relate an increase in an object’s temperature to an increase in its internal energy.
      - code: "16.2"
        title: The first law of thermodynamics
        objectives:
          - code: "16.2.1"
            text: >-
              Recall and use W = pΔV for the work done when a gas changes volume at constant
              pressure, and understand how work done by the gas differs from work done on the gas.
          - code: "16.2.2"
            text: >-
              Recall and use the first law of thermodynamics in the form ΔU = q + W, where ΔU is the
              increase in internal energy, q is the heating of the system (energy transferred to it by
              heating) and W is the work done on the system.

  - code: "17"
    title: Oscillations
    level: A
    papers: [Paper 4]
    topics:
      - code: "17.1"
        title: Simple harmonic oscillations
        objectives:
          - code: "17.1.1"
            text: >-
              Understand and use the terms displacement, amplitude, period, frequency, angular
              frequency and phase difference for oscillations, and write the period in terms of the
              frequency and in terms of the angular frequency.
          - code: "17.1.2"
            text: >-
              Understand that simple harmonic motion happens when the acceleration is proportional to
              the displacement from a fixed point and directed opposite to it.
          - code: "17.1.3"
            text: Use a = −ω²x, and recall and use x = x₀ sin ωt as a solution of this equation.
          - code: "17.1.4"
            text: Use v = v₀ cos ωt and v = ±ω√(x₀² − x²).
          - code: "17.1.5"
            text: >-
              Analyse and interpret graphs of how displacement, velocity and acceleration vary during
              simple harmonic motion.
      - code: "17.2"
        title: Energy in simple harmonic motion
        objectives:
          - code: "17.2.1"
            text: Describe how energy is interchanged between kinetic and potential forms in simple harmonic motion.
          - code: "17.2.2"
            text: Recall and use E = ½mω²x₀² for the total energy of a system in simple harmonic motion.
      - code: "17.3"
        title: Damped and forced oscillations, resonance
        objectives:
          - code: "17.3.1"
            text: Understand that damping is caused by a resistive force acting on an oscillating system.
          - code: "17.3.2"
            text: >-
              Understand and use the terms light, critical and heavy damping, and sketch
              displacement–time graphs showing each type of damping.
          - code: "17.3.3"
            text: >-
              Understand that resonance involves the maximum amplitude of oscillation, which occurs
              when an oscillating system is forced to oscillate at its natural frequency.

  - code: "18"
    title: Electric fields
    level: A
    papers: [Paper 4]
    topics:
      - code: "18.1"
        title: Electric fields and field lines
        objectives:
          - code: "18.1.1"
            text: >-
              Understand that an electric field is one example of a field of force, and define
              electric field as force per unit positive charge.
          - code: "18.1.2"
            text: Recall and use F = qE for the force on a charge in an electric field.
          - code: "18.1.3"
            text: Use field lines to represent an electric field.
      - code: "18.2"
        title: Uniform electric fields
        objectives:
          - code: "18.2.1"
            text: >-
              Recall and use E = ΔV / Δd to find the strength of the uniform field between charged
              parallel plates.
          - code: "18.2.2"
            text: Describe how a uniform electric field affects the motion of charged particles.
      - code: "18.3"
        title: Electric force between point charges
        objectives:
          - code: "18.3.1"
            text: >-
              Understand that, at points outside a spherical conductor, the charge on the sphere can
              be treated as a point charge at its centre.
          - code: "18.3.2"
            text: >-
              Recall and use Coulomb’s law, F = Q₁Q₂ / (4πε₀r²), for the force between two point
              charges in free space.
      - code: "18.4"
        title: Electric field of a point charge
        objectives:
          - code: "18.4.1"
            text: Recall and use E = Q / (4πε₀r²) for the electric field strength of a point charge in free space.
      - code: "18.5"
        title: Electric potential
        objectives:
          - code: "18.5.1"
            text: >-
              Define the electric potential at a point as the work done per unit positive charge to
              bring a small test charge from infinity to that point.
          - code: "18.5.2"
            text: >-
              Recall and use the fact that the electric field at a point equals the negative of the
              potential gradient there.
          - code: "18.5.3"
            text: For the field of a point charge, use V = Q / (4πε₀r) for the electric potential.
          - code: "18.5.4"
            text: >-
              Understand how the idea of electric potential leads to the electric potential energy of
              two point charges, and use E_P = Qq / (4πε₀r).

  - code: "19"
    title: Capacitance
    level: A
    papers: [Paper 4]
    topics:
      - code: "19.1"
        title: Capacitors and capacitance
        objectives:
          - code: "19.1.1"
            text: Define capacitance, both for isolated spherical conductors and for parallel plate capacitors.
          - code: "19.1.2"
            text: Recall and use C = Q / V.
          - code: "19.1.3"
            text: >-
              Use C = Q / V to derive formulae for the combined capacitance of capacitors in series and
              in parallel.
          - code: "19.1.4"
            text: Use the formulae for the combined capacitance of capacitors in series and in parallel.
      - code: "19.2"
        title: Energy stored in a capacitor
        objectives:
          - code: "19.2.1"
            text: >-
              Determine the electric potential energy stored in a capacitor from the area under its
              potential–charge graph.
          - code: "19.2.2"
            text: Recall and use W = ½QV = ½CV².
      - code: "19.3"
        title: Discharging a capacitor
        objectives:
          - code: "19.3.1"
            text: >-
              For a capacitor discharging through a resistor, analyse graphs showing how the potential
              difference, the charge and the current change with time.
          - code: "19.3.2"
            text: Recall and use τ = RC as the time constant for a capacitor discharging through a resistor.
          - code: "19.3.3"
            text: >-
              For a capacitor discharging through a resistor, use equations of the form
              x = x₀e^(−t / RC), where x may stand for current, charge or potential difference.

  - code: "20"
    title: Magnetic fields
    level: A
    papers: [Paper 4]
    topics:
      - code: "20.1"
        title: Concept of a magnetic field
        objectives:
          - code: "20.1.1"
            text: >-
              Understand that a magnetic field is one example of a field of force, and that it is
              produced either by moving charges or by permanent magnets.
          - code: "20.1.2"
            text: Use field lines to represent a magnetic field.
      - code: "20.2"
        title: Force on a current-carrying conductor
        objectives:
          - code: "20.2.1"
            text: Understand that a current-carrying conductor placed in a magnetic field may experience a force.
          - code: "20.2.2"
            text: Recall and use F = BIL sin θ, interpreting directions with Fleming’s left-hand rule.
          - code: "20.2.3"
            text: >-
              Define magnetic flux density as the force per unit current per unit length acting on a
              wire placed at right angles to the magnetic field.
      - code: "20.3"
        title: Force on a moving charge
        objectives:
          - code: "20.3.1"
            text: Determine the direction of the force on a charge moving through a magnetic field.
          - code: "20.3.2"
            text: Recall and use F = BQv sin θ.
          - code: "20.3.3"
            text: >-
              Understand how the Hall voltage arises, and derive and use V_H = BI / (ntq), where t is
              the thickness.
          - code: "20.3.4"
            text: Understand how magnetic flux density is measured with a Hall probe.
          - code: "20.3.5"
            text: >-
              Describe how a charged particle moves in a uniform magnetic field that is perpendicular
              to its direction of motion.
          - code: "20.3.6"
            text: Explain how velocity selection can be achieved using electric and magnetic fields.
      - code: "20.4"
        title: Magnetic fields due to currents
        objectives:
          - code: "20.4.1"
            text: >-
              Sketch the patterns of the magnetic fields produced by currents in a long straight wire,
              a flat circular coil and a long solenoid.
          - code: "20.4.2"
            text: Understand that a ferrous core increases the magnetic field produced by the current in a solenoid.
          - code: "20.4.3"
            text: >-
              Explain why forces act between current-carrying conductors, and determine the
              directions of these forces.
      - code: "20.5"
        title: Electromagnetic induction
        objectives:
          - code: "20.5.1"
            text: >-
              Define magnetic flux as the magnetic flux density multiplied by the cross-sectional area
              perpendicular to the direction of the magnetic flux density.
          - code: "20.5.2"
            text: Recall and use Φ = BA.
          - code: "20.5.3"
            text: Understand and use the concept of magnetic flux linkage.
          - code: "20.5.4"
            text: >-
              Understand and explain experiments showing that a changing magnetic flux can induce an
              e.m.f. in a circuit, that the induced e.m.f. acts in a direction that opposes the change
              producing it, and which factors affect the magnitude of the induced e.m.f.
            guidance: >-
              The experiments should show three things: that a changing magnetic flux can induce an
              e.m.f. in a circuit; that the induced e.m.f. acts in a direction that opposes the change
              producing it; and the factors that affect the magnitude of the induced e.m.f.
          - code: "20.5.5"
            text: Recall and use Faraday’s law and Lenz’s law of electromagnetic induction.

  - code: "21"
    title: Alternating currents
    level: A
    papers: [Paper 4]
    topics:
      - code: "21.1"
        title: Characteristics of alternating currents
        objectives:
          - code: "21.1.1"
            text: Understand and use the terms period, frequency and peak value for an alternating current or voltage.
          - code: "21.1.2"
            text: >-
              Use equations of the form x = x₀ sin ωt to represent a sinusoidally alternating current
              or voltage.
          - code: "21.1.3"
            text: >-
              Recall and use the fact that, for a sinusoidal alternating current, the mean power in a
              resistive load is half of the maximum power.
          - code: "21.1.4"
            text: >-
              Distinguish between root-mean-square (r.m.s.) values and peak values, and recall and use
              I_r.m.s. = I₀ / √2 and V_r.m.s. = V₀ / √2 for a sinusoidal alternating current.
      - code: "21.2"
        title: Rectification and smoothing
        objectives:
          - code: "21.2.1"
            text: Distinguish between half-wave and full-wave rectification using graphs.
          - code: "21.2.2"
            text: Explain how a single diode is used to give half-wave rectification of an alternating current.
          - code: "21.2.3"
            text: >-
              Explain how four diodes arranged as a bridge rectifier are used to give full-wave
              rectification of an alternating current.
          - code: "21.2.4"
            text: >-
              Analyse the smoothing effect of a single capacitor, including how the values of the
              capacitance and the load resistance affect it.

  - code: "22"
    title: Quantum physics
    level: A
    papers: [Paper 4]
    topics:
      - code: "22.1"
        title: Energy and momentum of a photon
        objectives:
          - code: "22.1.1"
            text: Understand that electromagnetic radiation has a particulate nature.
          - code: "22.1.2"
            text: Understand that a photon is a quantum of electromagnetic energy.
          - code: "22.1.3"
            text: Recall and use E = hf.
          - code: "22.1.4"
            text: Use the electronvolt (eV) as a unit of energy.
          - code: "22.1.5"
            text: Understand that photons carry momentum, given by p = E / c.
      - code: "22.2"
        title: Photoelectric effect
        objectives:
          - code: "22.2.1"
            text: >-
              Understand that electromagnetic radiation falling on a metal surface may cause
              photoelectrons to be emitted from it.
          - code: "22.2.2"
            text: Understand and use the terms threshold frequency and threshold wavelength.
          - code: "22.2.3"
            text: Explain photoelectric emission in terms of the photon energy and the work function energy.
          - code: "22.2.4"
            text: Recall and use hf = Φ + ½mv_max².
          - code: "22.2.5"
            text: >-
              Explain why the photoelectric current is proportional to intensity, whereas the maximum
              kinetic energy of the photoelectrons does not depend on intensity.
      - code: "22.3"
        title: Wave-particle duality
        objectives:
          - code: "22.3.1"
            text: >-
              Understand that the photoelectric effect is evidence that electromagnetic radiation has
              a particulate nature, while effects such as interference and diffraction are evidence of
              a wave nature.
          - code: "22.3.2"
            text: >-
              Describe and interpret qualitatively how electron diffraction provides evidence that
              particles have a wave nature.
          - code: "22.3.3"
            text: Understand the de Broglie wavelength as the wavelength associated with a moving particle.
          - code: "22.3.4"
            text: Recall and use λ = h / p.
      - code: "22.4"
        title: Energy levels in atoms and line spectra
        objectives:
          - code: "22.4.1"
            text: Understand that isolated atoms (for example, atomic hydrogen) have discrete electron energy levels.
          - code: "22.4.2"
            text: Understand how emission and absorption line spectra are formed and what they look like.
          - code: "22.4.3"
            text: Recall and use hf = E₁ − E₂.

  - code: "23"
    title: Nuclear physics
    level: A
    papers: [Paper 4]
    topics:
      - code: "23.1"
        title: Mass defect and nuclear binding energy
        objectives:
          - code: "23.1.1"
            text: >-
              Understand that energy and mass are equivalent, as expressed by E = mc², and recall and
              use this equation.
          - code: "23.1.2"
            text: >-
              Represent simple nuclear reactions using nuclear equations of the form
              ¹⁴₇N + ⁴₂He → ¹⁷₈O + ¹₁H.
          - code: "23.1.3"
            text: Define and use the terms mass defect and binding energy.
          - code: "23.1.4"
            text: Sketch how binding energy per nucleon varies with nucleon number.
          - code: "23.1.5"
            text: Explain what nuclear fusion and nuclear fission mean.
          - code: "23.1.6"
            text: >-
              Explain how binding energy per nucleon is relevant to nuclear reactions, including
              nuclear fusion and nuclear fission.
          - code: "23.1.7"
            text: Use E = c²Δm to calculate the energy released in nuclear reactions.
      - code: "23.2"
        title: Radioactive decay
        objectives:
          - code: "23.2.1"
            text: Understand that fluctuations in count rate are evidence that radioactive decay is random.
          - code: "23.2.2"
            text: Understand that radioactive decay is both spontaneous and random.
          - code: "23.2.3"
            text: Define activity and decay constant, and recall and use A = λN.
          - code: "23.2.4"
            text: Define half-life.
          - code: "23.2.5"
            text: Use λ = 0.693 / t½.
          - code: "23.2.6"
            text: >-
              Understand that radioactive decay is exponential, and sketch and use x = x₀e^(−λt),
              where x may be the activity, the number of undecayed nuclei or the received count rate.

  - code: "24"
    title: Medical physics
    level: A
    papers: [Paper 4]
    topics:
      - code: "24.1"
        title: Production and use of ultrasound
        objectives:
          - code: "24.1.1"
            text: >-
              Understand that applying a p.d. across a piezo-electric crystal changes its shape, and
              that changing the crystal’s shape makes it generate an e.m.f.
          - code: "24.1.2"
            text: Understand how a piezo-electric transducer generates and detects ultrasound waves.
          - code: "24.1.3"
            text: >-
              Understand how diagnostic information about internal structures can be obtained from
              the reflection of ultrasound pulses at boundaries between tissues.
          - code: "24.1.4"
            text: >-
              Define the specific acoustic impedance of a medium as Z = ρc, where c is the speed of
              sound in that medium.
          - code: "24.1.5"
            text: >-
              Use I_R / I₀ = (Z₁ − Z₂)² / (Z₁ + Z₂)² for the intensity reflection coefficient at a
              boundary between two media.
          - code: "24.1.6"
            text: Recall and use I = I₀e^(−μx) for the attenuation of ultrasound in matter.
      - code: "24.2"
        title: Production and use of X-rays
        objectives:
          - code: "24.2.1"
            text: >-
              Explain that X-rays are produced when electrons bombard a metal target, and calculate
              the minimum wavelength of the X-rays produced from the accelerating p.d.
          - code: "24.2.2"
            text: >-
              Understand how X-rays are used to image internal body structures, including the meaning
              of the term contrast in X-ray imaging.
          - code: "24.2.3"
            text: Recall and use I = I₀e^(−μx) for the attenuation of X-rays in matter.
          - code: "24.2.4"
            text: >-
              Understand that computed tomography (CT) scanning builds a 3D image of an internal
              structure in two stages: many X-ray images of one section, taken from different angles,
              are combined into a 2D image of that section; this is then repeated along an axis and
              the 2D images of many sections are combined.
      - code: "24.3"
        title: PET scanning
        objectives:
          - code: "24.3.1"
            text: >-
              Understand that a tracer is a substance containing radioactive nuclei which can be
              introduced into the body and is then absorbed by the tissue under study.
          - code: "24.3.2"
            text: >-
              Recall that positron emission tomography (PET scanning) uses a tracer that decays by β⁺
              decay.
          - code: "24.3.3"
            text: >-
              Understand that annihilation happens when a particle and its antiparticle interact, and
              that mass–energy and momentum are conserved in this process.
          - code: "24.3.4"
            text: >-
              Explain that, in PET scanning, positrons emitted by the decay of the tracer annihilate
              when they interact with electrons in the tissue, giving a pair of gamma-ray photons
              travelling in opposite directions.
          - code: "24.3.5"
            text: >-
              Calculate the energy of the gamma-ray photons produced when an electron–positron pair
              annihilates.
          - code: "24.3.6"
            text: >-
              Understand that the gamma-ray photons from an annihilation event leave the body and can
              be detected, and that processing their arrival times allows an image of the tracer
              concentration in the tissue to be created.

  - code: "25"
    title: Astronomy and cosmology
    level: A
    papers: [Paper 4]
    topics:
      - code: "25.1"
        title: Standard candles
        objectives:
          - code: "25.1.1"
            text: Understand the term luminosity as the total power of radiation emitted by a star.
          - code: "25.1.2"
            text: >-
              Recall and use the inverse square law F = L / (4πd²), which relates the radiant flux
              intensity F to the luminosity L of the source.
          - code: "25.1.3"
            text: Understand that a standard candle is an object whose luminosity is known.
          - code: "25.1.4"
            text: Understand how standard candles are used to find the distances to galaxies.
      - code: "25.2"
        title: Stellar radii
        objectives:
          - code: "25.2.1"
            text: >-
              Recall and use Wien’s displacement law, λ_max ∝ 1 / T, to estimate the peak surface
              temperature of a star.
          - code: "25.2.2"
            text: Use the Stefan–Boltzmann law, L = 4πσr²T⁴.
          - code: "25.2.3"
            text: Estimate the radius of a star using Wien’s displacement law together with the Stefan–Boltzmann law.
      - code: "25.3"
        title: Hubble’s law and the Big Bang theory
        objectives:
          - code: "25.3.1"
            text: >-
              Understand that the lines in the emission and absorption spectra of distant objects are
              shifted to longer wavelengths than their known values.
          - code: "25.3.2"
            text: >-
              Use Δλ / λ ≈ Δf / f ≈ v / c for the redshift of electromagnetic radiation from a source
              that moves relative to an observer.
          - code: "25.3.3"
            text: Explain why redshift suggests that the Universe is expanding.
          - code: "25.3.4"
            text: >-
              Recall and use Hubble’s law, v ≈ H₀d, and explain how it leads to the Big Bang
              theory.
            guidance: Only SI units will be required.
