blocks:
  - type: objective
    body: |-
      By the end you can calculate **intensity** from power and area, use the fact that intensity is proportional to **amplitude squared**, and explain why doubling the amplitude does not merely double the intensity.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $A_2$ | second amplitude |
      | $A_1$ | first amplitude |
      | $I_2$ | second (or new) intensity |
      | $I_1$ | first (or original) intensity |
      | $I_3$ | third intensity |

  - type: explain
    title: The same power over a bigger area
    body: |-
      A loudspeaker emits a fixed amount of sound energy every second. That is its **power**.

      Stand close and the sound is loud; stand further away and it is quieter, even though the speaker has not changed. The same power is now spread over a larger area.

      **Intensity** measures how concentrated that power is.

  - type: definition
    term: Intensity
    body: |-
      The **intensity** of a wave is the **power** transmitted per unit **area** perpendicular to the direction of travel:

      $$I = \frac{P}{A}$$

      where $P$ is the power in watts and $A$ is the area in square metres.

      The unit is therefore $\text{W m}^{-2}$.

      Intensity is a measure of how much energy arrives per second on each square metre, so it is closely related to loudness (for sound) and brightness (for light).

  - type: example
    title: "Worked example: intensity from power and area"
    problem: |-
      A small loudspeaker emits a total power of $2.0\ \text{W}$, spread evenly over an area of $0.50\ \text{m}^2$.

      Calculate the intensity.
    steps:
      - |-
        Write the definition:

        $$I = \frac{P}{A}$$
      - |-
        Substitute the values:

        $$I = \frac{2.0}{0.50}$$
      - |-
        $$I = 4.0\ \text{W m}^{-2}$$
      - |-
        Check the units: $\text{W}/\text{m}^2 = \text{W m}^{-2}$. ✔
    answer: |-
      $4.0\ \text{W m}^{-2}$.

  - type: check
    title: Quick check
    questions: [intensity-calc, intensity-units, intensity-cloze]

  - type: explain
    title: Why amplitude squared
    body: |-
      For a wave, the energy carried is proportional to the **square** of the amplitude:

      $$I \propto A^2$$

      This holds when comparing waves of the same kind in the same medium.

      The reason is that a particle oscillating with amplitude $A$ moves further and faster. Both its maximum kinetic energy and the work done to displace it scale with $A^2$ — the same pattern as the energy stored in a stretched spring, $\tfrac12 kx^2$. Since power is energy per second, intensity scales the same way.

      So:

      | Change in amplitude | Change in intensity |
      | --- | --- |
      | doubled | $\times 4$ |
      | tripled | $\times 9$ |
      | halved | $\times \tfrac14$ |
      | unchanged | unchanged |

  - type: example
    title: "Worked example: doubling the amplitude"
    problem: |-
      A wave has intensity $3.0\ \text{W m}^{-2}$ and amplitude $0.10\ \text{m}$.

      The amplitude is increased to $0.20\ \text{m}$ without changing anything else.

      Find the new intensity.
    steps:
      - |-
        The amplitude has doubled:

        $$\frac{A_2}{A_1} = \frac{0.20}{0.10} = 2$$
      - |-
        Intensity is proportional to amplitude squared, so the intensity changes by the square of
        this factor:

        $$\frac{I_2}{I_1} = 2^2 = 4$$
      - |-
        Multiply the original intensity:

        $$I_2 = 4 \times 3.0 = 12\ \text{W m}^{-2}$$
      - |-
        The amplitude doubled, but the intensity quadrupled.
    answer: |-
      $12\ \text{W m}^{-2}$.

  - type: example
    title: "Worked example: a ratio without the original intensity"
    problem: |-
      Two otherwise identical waves have amplitudes in the ratio $3:1$.

      What is the ratio of their intensities?
    steps:
      - |-
        $I \propto A^2$, so the ratio of intensities is the ratio of the squares of the amplitudes.
      - |-
        $$\frac{I_3}{I_1} = \left(\frac{3}{1}\right)^2 = 9$$
      - |-
        The wave with three times the amplitude has nine times the intensity.
    answer: |-
      $9:1$.

  - type: check
    title: Practice
    questions: [intensity-doubled, intensity-ratio, intensity-spot-error]

  - type: misconceptions
    items:
      - wrong: Doubling the amplitude doubles the intensity.
        right: |-
          Intensity is proportional to amplitude **squared**, so doubling the amplitude multiplies
          the intensity by four.
      - wrong: Intensity is measured in watts.
        right: |-
          Watts measure power. Intensity is power per unit area, in $\text{W m}^{-2}$.
      - wrong: Intensity and amplitude are the same thing.
        right: |-
          Amplitude is a displacement; intensity is power per unit area. They are linked by
          $I \propto A^2$ but are different quantities.
      - wrong: If the area doubles, the intensity doubles.
        right: |-
          For the same power, doubling the area halves the intensity, because $I = P/A$.
      - wrong: $I \propto A^2$ applies between any two different waves.
        right: |-
          It compares waves of the same kind in the same medium. Different wave types or media
          need their own constants.

  - type: exam
    body: |-
      - Write $I = P/A$ with the units, and check that the area is in square metres.
      - For a change in amplitude, use the square of the ratio: $I_2/I_1 = (A_2/A_1)^2$.
      - Do not use $I \propto A$ — the square is the whole point of the relationship.
      - If the question asks for a ratio, the original intensity is not needed; use the amplitude ratio squared.

  - type: takeaways
    items:
      - '**Intensity** is power per unit area: $I = P/A$, in $\text{W m}^{-2}$.'
      - 'For the same power, a larger area means a smaller intensity.'
      - 'For a wave, $I \propto A^2$ (same wave type and medium).'
      - 'Doubling the amplitude multiplies the intensity by 4; tripling it multiplies it by 9.'
      - 'Intensity ratios are the squares of amplitude ratios.'

questions:
  - id: intensity-calc
    format: numeric
    difficulty: 1
    objectives: ["7.1.7"]
    prompt: |-
      A wave carries a power of $2.0\ \text{W}$ through an area of $0.50\ \text{m}^2$.

      Calculate the intensity, in $\text{W m}^{-2}$.
    fields:
      - label: "I ="
        answer: 4
        unit: "W m⁻²"
        tolerance: { abs: 0.05 }
    explanation: |-
      $I = P/A = 2.0/0.50 = 4.0\ \text{W m}^{-2}$.

  - id: intensity-units
    format: mcq
    difficulty: 1
    objectives: ["7.1.7"]
    prompt: |-
      What is the unit of intensity?
    options:
      - text: $\text{W m}^{-2}$
        correct: true
        why: |-
          Intensity is power (watts) divided by area (square metres).
      - text: $\text{W}$
        why: |-
          That is power, not power per area.
      - text: $\text{J m}^{-2}$
        why: |-
          That would be energy per area, not power per area.
      - text: $\text{m s}^{-1}$
        why: |-
          That is a speed.
    explanation: |-
      Intensity is power per unit area, so its unit is $\text{W m}^{-2}$.

  - id: intensity-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.1.7"]
    prompt: |-
      Intensity is defined as {{1}} divided by area, and for a wave it is proportional to the square of the {{2}}.
    blanks:
      - accept: [power]
      - accept: [amplitude]
    explanation: |-
      $I = P/A$ and $I \propto A^2$.

  - id: intensity-doubled
    format: numeric
    difficulty: 2
    objectives: ["7.1.7"]
    prompt: |-
      A wave has intensity $3.0\ \text{W m}^{-2}$. Its amplitude is doubled while everything else stays the same.

      What is the new intensity, in $\text{W m}^{-2}$?
    fields:
      - label: "I ="
        answer: 12
        unit: "W m⁻²"
        tolerance: { abs: 0.2 }
    explanation: |-
      $I \propto A^2$, so doubling the amplitude multiplies the intensity by $2^2 = 4$: $3.0 \times 4 = 12\ \text{W m}^{-2}$.

  - id: intensity-ratio
    format: numeric
    difficulty: 2
    objectives: ["7.1.7"]
    prompt: |-
      Two identical waves have amplitudes in the ratio $3:1$.

      What is the ratio of their intensities, $I_3/I_1$?
    fields:
      - label: "ratio ="
        answer: 9
        tolerance: { abs: 0.1 }
    explanation: |-
      Intensity is proportional to amplitude squared, so the ratio is $3^2 = 9$.

  - id: intensity-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.7"]
    prompt: |-
      A student compares two waves. Wave B has twice the amplitude of wave A, and both are the same kind of wave in the same medium. Which line contains the first error?
    lines:
      - For the same kind of wave in the same medium, intensity is proportional to amplitude squared.
      - Wave B has twice the amplitude of wave A.
      - So wave B has twice the intensity of wave A.
      - The intensity ratio is therefore 2:1.
    errorLine: 3
    fix: |-
      Doubling the amplitude multiplies the intensity by $2^2 = 4$, not 2. The intensity ratio is $4:1$.
    explanation: |-
      Lines 1 and 2 are correct. Line 3 (and line 4) forget to square the amplitude ratio.
