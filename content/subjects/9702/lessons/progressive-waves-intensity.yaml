id: progressive-waves-intensity
subject: "9702"
topic: "7.1"
title: "Intensity: power spread over an area"
summary: Intensity is power per unit area, measured in W m⁻². For a wave, doubling the amplitude multiplies the intensity by four.
order: 6
minutes: 7
kind: core
objectives: ["7.1.7"]
prerequisites: [progressive-waves-key-terms, energy-conservation-what-is-work]
