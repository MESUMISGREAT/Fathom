id: kirchhoffs-laws-first-law
subject: "9702"
topic: "10.2"
title: "Kirchhoff's first law: charge doesn't pile up"
summary: The junction rule — the current into a junction equals the current out — and why it is conservation of charge in disguise.
order: 1
minutes: 6
kind: core
objectives: ["10.2.1"]
prerequisites: ["electric-current-flow-of-charge"]
