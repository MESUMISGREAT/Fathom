id: energy-conservation-power-definition
subject: "9702"
topic: "5.1"
title: "Power: the rate of energy transfer"
summary: Power is the work done per unit time, or the rate of energy transfer, measured in watts, where 1 W = 1 J s⁻¹.
order: 6
minutes: 4
kind: core
objectives: ["5.1.5"]
prerequisites: [energy-conservation-what-is-work]
