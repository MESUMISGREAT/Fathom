blocks:
  - type: objective
    body: |
      By the end you can **define power** as work done per unit time (the rate of
      energy transfer), use $P = \dfrac{W}{t}$, and give the unit as the
      **watt (W)**, where $1\ \text{W} = 1\ \text{J s}^{-1}$.

  - type: explain
    title: Same job, different speed
    body: |
      Two cranes lift identical loads from the ground to the same height. Each
      transfers the **same energy** — the same work is done.

      But one takes $10\ \text{s}$ and the other takes $40\ \text{s}$. The faster
      crane is more **powerful**, even though it did the same amount of work.

      Power is not how much energy is transferred; it is **how fast** the
      transfer happens.

  - type: definition
    term: Power
    body: |
      Power is the **work done per unit time**, or equivalently the **rate of
      transfer of energy**:

      $$P = \dfrac{W}{t}$$

      $W$ is the work done (or energy transferred), in joules, and $t$ is the
      time taken, in seconds.

      Unit: the **watt (W)**, where $1\ \text{W} = 1\ \text{J s}^{-1}$.

  - type: explain
    title: Watt, kilowatt and megawatt
    body: |
      A watt is small: a torch bulb is a few W, a kettle about $2\ \text{kW}$, a
      car engine tens of kW, a power station hundreds of MW.

      | Unit | Symbol | In watts |
      | --- | --- | --- |
      | watt | W | $1\ \text{W}$ |
      | kilowatt | kW | $10^3\ \text{W}$ |
      | megawatt | MW | $10^6\ \text{W}$ |

      Energy and power often get mixed up in one sentence: a $2\ \text{kW}$
      kettle is a statement about **power**, while the number of joules it
      transfers is a statement about **energy**.

  - type: diagram
    diagram: phys-energy-conservation-power-rate
    alt: >-
      Two identical hoists lifting identical 600 J loads to the same height. The
      left hoist is labelled "lifts 600 J in 4.0 s" with the calculation
      P = 600 ÷ 4.0 = 150 W. The right hoist is labelled "lifts 600 J in 12 s"
      with P = 600 ÷ 12 = 50 W. Below both, a note: "same work done, different
      power".
    caption: The work is identical; only the time differs, so the powers differ by a factor of three.

  - type: example
    title: "Worked example: a motor at work"
    problem: |
      A motor does $9.0\ \text{kJ}$ of work in $1.5$ minutes. Calculate its
      power output.
    steps:
      - |
        Convert to SI units: $W = 9.0\ \text{kJ} = 9000\ \text{J}$ and
        $t = 1.5\ \text{min} = 90\ \text{s}$.
      - |
        $$P = \dfrac{W}{t} = \dfrac{9000}{90} = 100\ \text{W}$$
      - |
        Sanity check with units: $\dfrac{\text{J}}{\text{s}} = \text{W}$ ✓
    answer: |
      $100\ \text{W}$. A second motor that did the same $9000\ \text{J}$ in
      $45\ \text{s}$ would be twice as powerful ($200\ \text{W}$).

  - type: check
    title: Quick check
    questions: [power-cloze, motor-power, watt-text]
  - type: misconceptions
    items:
      - wrong: Power and energy are the same thing.
        right: |
          Energy is measured in joules and says **how much**; power is measured
          in watts and says **how fast**. Two motors can transfer the same energy,
          but the quicker one has more power.
      - wrong: A more powerful machine always does more work.
        right: |
          It does work **faster**. A powerful engine and a weak engine can both
          lift the same load to the same height; the powerful one takes less time.
      - wrong: The unit of power is the joule per second, which is written J/s².
        right: |
          The joule per second is the watt: $1\ \text{W} = 1\ \text{J s}^{-1}$.
          The second is raised to the power $-1$, not squared.
      - wrong: Since P = W/t, a long time means a large power.
        right: |
          Time is on the **bottom**. For a fixed amount of work, a longer time
          gives a **smaller** power.

  - type: exam
    body: |
      - "Define power" (1 mark): *work done per unit time* (or *rate of energy
        transfer*) — a definition that only says "how fast something happens" is
        too vague for the mark.
      - Convert minutes to seconds and kJ to J before dividing, then quote the
        answer in W. A missing conversion typically loses one of two marks.
      - If the answer is in the hundreds or thousands of watts, a kW answer
        ($\div 1000$) is usually acceptable — but state the unit.

  - type: check
    title: Check yourself
    questions: [hoist-compare, explain-power]
  - type: takeaways
    items:
      - >-
        Power is the rate of energy transfer: $P = \dfrac{W}{t}$.
      - >-
        The unit is the watt: $1\ \text{W} = 1\ \text{J s}^{-1}$.
      - Same work in less time means more power.
      - Power measures how fast; energy measures how much.

questions:
  - id: power-cloze
    format: cloze
    difficulty: 1
    objectives: ["5.1.5"]
    prompt: |
      Power is the work done per unit {{1}}, or the rate of {{2}} of energy.
      Its SI unit is the {{3}}, which equals one joule per second.
    blanks:
      - accept: [time]
      - accept: [transfer, transformation, energy transfer]
      - accept: [watt, watts, W]
    explanation: |
      Power = work done per unit time, i.e. the rate of energy transfer,
      measured in watts ($1\ \text{W} = 1\ \text{J s}^{-1}$).

  - id: motor-power
    format: numeric
    difficulty: 1
    objectives: ["5.1.5"]
    prompt: |
      A motor does $3600\ \text{J}$ of work in $12\ \text{s}$.

      Calculate its power output.
    fields:
      - answer: 300
        tolerance: { abs: 1 }
        unit: W
    explanation: |
      $P = \dfrac{W}{t} = \dfrac{3600}{12} = 300\ \text{W}$, that is
      $300\ \text{J s}^{-1}$.

  - id: watt-text
    format: text
    difficulty: 1
    objectives: ["5.1.5"]
    prompt: |
      State what is meant by a power of one watt.
    style: short
    accept:
      - one joule per second
      - a joule per second
      - 1 joule per second
      - joule per second
      - one joule of energy transferred each second
      - a rate of energy transfer of one joule per second
      - 1 J per second
      - J per second
      - joule per second (J/s)
    model: |
      One watt is a rate of energy transfer (or work done) of **one joule per
      second**.
    explanation: |
      The watt is a rate: $1\ \text{W} = 1\ \text{J s}^{-1}$. Say "per second" —
      that is the mark.

  - id: hoist-compare
    format: mcq
    difficulty: 2
    objectives: ["5.1.5"]
    prompt: |
      Two hoists lift identical loads through the same height. Hoist A takes
      $20\ \text{s}$; hoist B takes $25\ \text{s}$. Which statement is correct?
    options:
      - text: Hoist A is more powerful, because it does the same work in less time
        correct: true
        why: |
          Correct. The work done is the same, so the smaller time gives the
          larger power: $P = W/t$.
      - text: Hoist B is more powerful, because it runs for longer
        why: |
          Time is in the denominator. A longer time for the same work means
          **less** power.
      - text: The two hoists have the same power, because they do the same work
        why: |
          Equal work does not mean equal power; the times differ, so the powers
          differ.
      - text: Hoist A does more work, because it is quicker
        why: |
          Both hoists lift identical loads through the same height, so both do
          the same amount of work.
    explanation: |
      $P = W/t$. With $W$ the same, A's power is $\tfrac{W}{20}$ and B's is
      $\tfrac{W}{25}$, so A is the more powerful hoist.

  - id: explain-power
    format: explain
    difficulty: 3
    objectives: ["5.1.5"]
    prompt: |
      Two students of equal weight run up the same flight of stairs. Student P
      reaches the top in $8.0\ \text{s}$ and student Q in $11\ \text{s}$.
      Explain which student develops the greater power, and why the work done is
      the same for both.
    model: |
      Both students move the same weight through the same vertical height, so
      both do the same work against gravity — the work depends only on the force
      and the distance moved along it, not on the time taken. Power is the work
      done per unit time, P = W/t. Since student P does this work in a shorter
      time (8.0 s rather than 11.0 s), P's power is greater: dividing the same
      work by a smaller time gives a larger value.
    keyPoints:
      - Same force (equal weights) and same distance, so same work done by both
      - Work done does not depend on the time taken
      - Power is work done per unit time, P = W/t
      - Student P takes less time for the same work, so develops the greater power
    explanation: |
      The examiner's two ideas: work is the same because force and distance are
      the same, and power is greater for the shorter time.
