id: turning-effects-torque-of-a-couple
subject: "9702"
topic: "4.1"
title: The torque of a couple
summary: The torque of a couple is one of the forces times the perpendicular distance between their lines of action, and it's the same about every point.
order: 5
minutes: 5
objectives: ["4.1.4"]
prerequisites: [turning-effects-couples, turning-effects-forces-at-angles]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 4.1.4, define the torque of a couple and apply the definition).
    The right-hand panel of the diagram is drawn to scale (forces at 50° to the rod). Forces and
    distances are illustrative values; all worked values and answer keys were computed with
