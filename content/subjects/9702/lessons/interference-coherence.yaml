blocks:
  - type: objective
    body: |
      By the end you can explain **interference** in terms of superposition and **path difference**,
      and say what makes two sources **coherent** — and why two ordinary lamps are not.

  - type: explain
    title: Two ripples meeting
    body: |
      Drop two stones into a pond at the same moment. Where the two sets of ripples cross, some
      places are unusually calm and others are unusually lively.

      The waves are doing what waves always do: **superposing**. Where a crest meets a crest the
      displacements add and the water moves more; where a crest meets a trough they cancel and the
      water barely moves.

      This pattern of strong and weak regions is **interference**. It is the same superposition you
      met with two pulses, applied to two continuous waves.

  - type: definition
    term: Interference
    body: |
      **Interference** is the superposition of waves from two or more sources, producing regions of
      **maximum** disturbance (constructive interference) and **minimum** disturbance (destructive
      interference).

  - type: explain
    title: Path difference is the deciding number
    body: |
      Take a point P and two sources. The wave from each source travels a different distance to
      reach P. The difference between those distances is the **path difference**.

      - If the path difference is a whole number of wavelengths, $0, \lambda, 2\lambda, \ldots$, the
        waves arrive **in phase**: crest meets crest, and P is a **maximum**.
      - If the path difference is an odd number of half wavelengths, $\dfrac{\lambda}{2},
        \dfrac{3\lambda}{2}, \ldots$, they arrive **in antiphase**: crest meets trough, and P is a
        **minimum**.

      The same rule in terms of phase: a phase difference of $0, 2\pi, 4\pi, \ldots$ gives a maximum,
      and $\pi, 3\pi, \ldots$ gives a minimum. A path difference of $\dfrac{\lambda}{4}$ corresponds
      to a phase difference of $\dfrac{\pi}{2}$, or $90^\circ$.

  - type: diagram
    diagram: phys-interference-path-difference
    alt: >-
      Two sources S1 and S2 send waves to a point P. The distances are labelled 5.0 wavelengths and
      4.5 wavelengths, so the path difference is 0.5 wavelength. A note says this puts the waves in
      antiphase, making P a minimum.
    caption: >-
      Equal distances give a maximum; here the half-wavelength difference gives a minimum.

  - type: definition
    term: Coherence
    body: |
      Two sources are **coherent** if they have a **constant phase difference** and the **same
      frequency**. Coherent waves keep the same relationship forever, so the interference pattern
      they make stays in fixed positions.

  - type: explain
    title: Why two lamps will not do
    body: |
      Put two identical lamps side by side and you do **not** see a stable pattern of bright and dark
      bands. You see uniform illumination.

      The reason is that each lamp emits light in countless tiny bursts, and the phase of each burst
      is random and changes billions of times a second. The interference pattern is real, but it
      jumps to a new position far too quickly for your eye to follow, so you see the average.

      A **laser** is different: its output is coherent, so the pattern stands still and can be
      photographed.

      The practical trick is to make both waves come from **one** source — for example, pass a laser
      beam through two narrow slits. Whatever the source does, both waves do it together, so they
      stay in step.

  - type: misconceptions
    items:
      - wrong: "Interference destroys energy at the dark points."
        right: >-
          Energy is conserved. At a minimum the wave displacements cancel, but the energy is
          redistributed to the maxima; it is not lost.
      - wrong: "Any two sources of the same frequency will interfere visibly."
        right: >-
          They must also keep a constant phase difference. Independent lamps drift randomly out of
          step.
      - wrong: "Coherence means the two waves have the same amplitude."
        right: >-
          Coherence is about a constant phase difference and equal frequency. Equal amplitudes only
          make the fringes higher in contrast.
      - wrong: "Interference and stationary waves are unrelated."
        right: >-
          A stationary wave is a special case of interference between two identical waves travelling
          in opposite directions.

  - type: exam
    body: |
      "State what is meant by coherent" is worth two marks: **constant phase difference** and
      **same frequency**.

      For path-difference questions, write the condition explicitly: $n\lambda$ for a maximum,
      $(n + \tfrac{1}{2})\lambda$ for a minimum. Then substitute the distances.

      If a question asks why two separate light sources give no pattern, the answer is that their
      phases vary randomly, so the pattern moves too quickly to be seen.

  - type: check
    title: Check yourself
    questions: [coherence-mcq, path-difference-classify]

  - type: check
    title: Phase and sources
    questions: [quarter-wave-phase, why-lamps-fail]

  - type: check
    title: Explain it
    questions: [define-coherence, constructive-cloze]

  - type: takeaways
    items:
      - Interference is superposition from two or more sources, giving maxima and minima.
      - 'Path difference $n\lambda$ gives a maximum; $(n+\tfrac{1}{2})\lambda$ gives a minimum.'
      - Coherent sources have the same frequency and a constant phase difference.
      - Two independent lamps are incoherent, so their pattern changes too fast to see.

questions:
  - id: coherence-mcq
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      What is meant by saying that two sources are **coherent**?
    options:
      - text: "They have the same frequency and a constant phase difference."
        correct: true
        why: "Correct: both conditions are needed for a stable interference pattern."
      - text: "They have the same amplitude."
        why: "Equal amplitudes improve contrast but do not make sources coherent."
      - text: "They emit waves in the same direction."
        why: "Direction does not make the waves stay in step."
      - text: "They are the same distance from the observer."
        why: "Distance affects the phase at one point, but not whether the sources stay in step over time."
    explanation: |
      Coherence requires a constant phase difference, which in practice means the same frequency and
      a common origin for the waves.

  - id: path-difference-classify
    format: mcq
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      Waves from two coherent sources arrive at a point with a path difference of
      $2.5\lambda$. What is observed at that point?
    options:
      - text: "A minimum, because the waves arrive in antiphase."
        correct: true
        why: "Correct: 2.5 wavelengths is an odd number of half wavelengths, so the waves cancel."
      - text: "A maximum, because the path difference is more than one wavelength."
        why: "Whole wavelengths give maxima; 2.5 is a half wavelength past two, so the waves are in antiphase."
      - text: "A maximum, because 2.5 is a whole number."
        why: "2.5 is not a whole number, and the extinction rule uses halves of a wavelength."
      - text: "Nothing, because interference cannot happen beyond one wavelength."
        why: "Interference happens at any path difference; the condition repeats every wavelength."
    explanation: |
      $2.5\lambda = (2 + \tfrac{1}{2})\lambda$, an odd number of half wavelengths, so the waves are
      in antiphase and the point is a minimum.

  - id: quarter-wave-phase
    format: numeric
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      Two coherent waves arrive at a point with a path difference of
      $\dfrac{\lambda}{4}$.

      Find the phase difference between them, in degrees.
    fields:
      - answer: 90
        tolerance: { abs: 0.5 }
        unit: °
    explanation: |
      A path difference of $\lambda$ corresponds to $360^\circ$ (or $2\pi$), so
      $\dfrac{\lambda}{4}$ corresponds to $90^\circ$ (or $\dfrac{\pi}{2}$).

  - id: why-lamps-fail
    format: mcq
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      Two identical lamps illuminate the same screen. Why is no steady interference pattern seen?
    options:
      - text: "The lamps are incoherent: their phases vary randomly, so the pattern moves too fast to see."
        correct: true
        why: "Correct: independent sources constantly change their phase relationship."
      - text: "Light from a lamp cannot interfere at all."
        why: "Light interferes; the problem is that two independent lamps are incoherent."
      - text: "The screen is too far away for interference."
        why: "Distance does not prevent interference if the sources are coherent."
      - text: "The two lamps have different wavelengths."
        why: "Identical lamps emit the same range of wavelengths; the issue is random phase."
    explanation: |
      Each lamp's emission changes phase randomly many times per second. The interference pattern
      exists but jumps about, so the eye averages it to uniform brightness.

  - id: define-coherence
    format: text
    style: definition
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      State what is meant by **coherent** sources.
    accept:
      - "sources with a constant phase difference and the same frequency"
      - "sources that maintain a constant phase difference"
      - "they have the same frequency and a constant phase difference"
      - "constant phase difference"
    model: |
      Two sources are coherent if they have the same frequency and a constant phase difference, so
      the interference pattern they produce is stable.
    explanation: |
      Both parts matter: same frequency, and a phase difference that does not drift.

  - id: constructive-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Constructive interference occurs when the path difference is a whole number of
      **{{1}}**, while destructive interference occurs when it is an odd number of
      **{{2}}**.
    blanks:
      - accept: ["wavelengths", "wavelength"]
      - accept: ["half wavelengths", "half-wavelengths", "half a wavelength"]
    explanation: |
      $n\lambda$ gives a maximum; $(n + \tfrac{1}{2})\lambda$ gives a minimum.
