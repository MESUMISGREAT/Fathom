id: interference-coherence
subject: "9702"
topic: "8.3"
title: "Interference and coherence"
summary: "Two waves can add to brightness or cancel to darkness. That only stays still if the sources are coherent."
order: 1
minutes: 7
kind: core
objectives: ["8.3.1"]
prerequisites: ["stationary-waves-superposition", "diffraction-basics-what-is-diffraction"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.3
    Interference, learning outcome 8.3.1 (understand the terms interference and coherence). All
    questions are original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by
