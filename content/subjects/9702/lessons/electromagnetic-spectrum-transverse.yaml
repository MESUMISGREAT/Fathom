id: electromagnetic-spectrum-transverse
subject: "9702"
topic: "7.4"
title: Electromagnetic waves are transverse
summary: What is actually waving in light, why every electromagnetic wave is transverse, and why they all travel at the same speed in space.
order: 1
minutes: 8
kind: core
objectives: ["7.4.1"]
prerequisites: [progressive-waves-key-terms, transverse-longitudinal-compare]
