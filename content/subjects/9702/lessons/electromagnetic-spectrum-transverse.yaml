blocks:
  - type: objective
    body: |-
      By the end you can describe what oscillates in an electromagnetic wave, state that all electromagnetic waves are transverse, and use $c = f\lambda$ with the speed of light in free space.

  - type: explain
    title: Something has to be waving
    body: |-
      A sound wave is easy to picture: bits of air move, and you can point at them. Light has no such bits. It crosses the vacuum between the Sun and your face, where there is nothing to push.

      So what is oscillating? Two **fields**: an electric field and a magnetic field.

      A field is a region where something feels a force — a charged particle feels a force from an electric field, and a magnet feels a force from a magnetic field. You do not need the full theory here. What matters is the geometry:

      - both fields oscillate;
      - they oscillate at right angles to each other;
      - both oscillate at right angles to the direction the wave travels.

      That last point is the definition of transverse. **Every electromagnetic wave is transverse.**

  - type: definition
    term: Electromagnetic wave
    body: |-
      A wave made of oscillating electric and magnetic fields, with the oscillations **perpendicular** to the direction of energy transfer.

      All electromagnetic waves are transverse, and in free space (a vacuum) they all travel at the same speed:

      $$c = 3.00 \times 10^8\ \text{m s}^{-1}$$

      Radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays are all electromagnetic waves. They differ in frequency and wavelength, not in the kind of wave they are.

  - type: diagram
    diagram: phys-electromagnetic-spectrum-transverse-wave
    alt: >-
      An electromagnetic wave drawn along a horizontal direction-of-travel arrow. A blue sine
      curve labelled E oscillates vertically about the axis, and a second curve labelled B
      oscillates about the same axis at a slant, suggesting a direction into the page. Both are
      at right angles to the direction of travel. A label gives the speed as three point zero
      zero times ten to the eight metres per second in free space.
    caption: |-
      The electric field and the magnetic field oscillate at right angles to each other, and both are perpendicular to the direction of travel.

  - type: explain
    title: Same speed, different wavelengths
    body: |-
      Because every electromagnetic wave travels at the same speed $c$ in free space, the wave equation becomes a fixed link between frequency and wavelength:

      $$c = f\lambda$$

      This is the whole reason the electromagnetic spectrum is a spectrum. A radio wave and a gamma ray are the same kind of wave; the radio wave has a long wavelength and a low frequency, and the gamma ray has a short wavelength and a high frequency. Their product is always $c$.

      The speed is only $c$ in free space. In glass, water or air, electromagnetic waves travel slightly slower, and that change of speed is what makes lenses and prisms work. The syllabus statement is about free space.

  - type: example
    title: "Worked example: frequency from wavelength"
    problem: |-
      A radio station broadcasts at a wavelength of $0.60\ \text{m}$ in free space.

      Find the frequency of the wave.
    steps:
      - |-
        Start from $c = f\lambda$, with $c = 3.00 \times 10^8\ \text{m s}^{-1}$ and $\lambda = 0.60\ \text{m}$.
      - |-
        Rearrange by dividing both sides by $\lambda$:

        $$f = \frac{c}{\lambda}$$
      - |-
        Substitute:

        $$f = \frac{3.00 \times 10^8}{0.60}$$
      - |-
        $3.00 \div 0.60 = 5.0$, and the power of ten stays as $10^8$, so $f = 5.0 \times 10^8\ \text{Hz}$.

        Check: $5.0 \times 10^8\ \text{Hz} \times 0.60\ \text{m} = 3.0 \times 10^8\ \text{m s}^{-1}$. ✔
    answer: |-
      $f = 5.0 \times 10^8\ \text{Hz}$, which is $500\ \text{MHz}$.

  - type: example
    title: "Worked example: wavelength from frequency"
    problem: |-
      An FM station broadcasts at $100\ \text{MHz}$.

      Find its wavelength in free space.
    steps:
      - |-
        Convert the frequency to hertz first. "Mega" means $10^6$:

        $$100\ \text{MHz} = 100 \times 10^6\ \text{Hz} = 1.00 \times 10^8\ \text{Hz}$$
      - |-
        Rearrange $c = f\lambda$ for wavelength:

        $$\lambda = \frac{c}{f}$$
      - |-
        Substitute:

        $$\lambda = \frac{3.00 \times 10^8}{1.00 \times 10^8} = 3.0\ \text{m}$$
      - |-
        A wavelength of a few metres is typical of FM radio, which is a useful sanity check. ✔
    answer: |-
      $\lambda = 3.0\ \text{m}$.

  - type: misconceptions
    items:
      - wrong: Radio waves must be longitudinal because sound waves are.
        right: |-
          Sound is mechanical and longitudinal; radio is electromagnetic and transverse. Sharing the word "wave" does not make them the same kind of wave.
      - wrong: Light needs air to travel through.
        right: |-
          Electromagnetic waves need no medium at all. That is why sunlight reaches us through space.
      - wrong: Gamma rays travel faster than radio waves in a vacuum.
        right: |-
          In free space they all travel at exactly $c$. Gamma rays have a higher frequency and a shorter wavelength, not a greater speed.
      - wrong: Red light and blue light travel at different speeds in a vacuum, which is why a prism splits them.
        right: |-
          A prism works because the speed **in glass** depends slightly on frequency. In a vacuum both travel at $c$.

  - type: exam
    body: |-
      - Learn the statement word for word: every electromagnetic wave is **transverse**, and all travel at the **same speed $c$ in free space**. Both halves are regularly examined.
      - State the value as $3.00 \times 10^8\ \text{m s}^{-1}$, and use $c = f\lambda$ rather than $v = f\lambda$ for electromagnetic waves in a vacuum.
      - Convert MHz and GHz before substituting. $1\ \text{GHz} = 10^9\ \text{Hz}$.
      - If a question asks what is the same for all electromagnetic waves, the answer is the speed in free space — not the wavelength, the frequency or the energy.

  - type: takeaways
    items:
      - 'Electromagnetic waves are oscillating electric and magnetic fields, at right angles to each other and to the direction of travel.'
      - 'Every electromagnetic wave is transverse.'
      - 'In free space all electromagnetic waves travel at $c = 3.00 \times 10^8\ \text{m s}^{-1}$.'
      - 'Use $c = f\lambda$: the regions of the spectrum differ in $f$ and $\lambda$, not in speed in a vacuum.'

  - type: check
    title: Practice
    questions: [em-all-transverse, em-frequency, em-wavelength, em-same-quantity, em-cloze]
questions:
  - id: em-all-transverse
    format: mcq
    difficulty: 1
    objectives: ["7.4.1"]
    prompt: |-
      Which statement about electromagnetic waves is correct?
    options:
      - text: All are transverse, and all travel at the same speed in a vacuum.
        correct: true
        why: |-
          Both halves are required: the fields oscillate at right angles to travel, and the free-space speed is $c$ for every region.
      - text: All are longitudinal, because they can travel through space.
        why: |-
          Travelling without a medium has nothing to do with being longitudinal. Electromagnetic waves are transverse.
      - text: They need a medium, so they cannot cross a vacuum.
        why: |-
          They cross a vacuum; that is why we receive sunlight.
      - text: Gamma rays travel faster than radio waves in a vacuum.
        why: |-
          Every electromagnetic wave travels at $c$ in free space.
    explanation: |-
      Electromagnetic waves are transverse and share the same free-space speed $c$.

  - id: em-frequency
    format: numeric
    difficulty: 2
    objectives: ["7.4.1"]
    prompt: |-
      A radio wave has a wavelength of $0.60\ \text{m}$ in free space.

      Find its frequency, in Hz.
    fields:
      - label: "f ="
        answer: 500000000
        unit: Hz
        tolerance: { rel: 0.01 }
    explanation: |-
      $f = c/\lambda = 3.00 \times 10^8 / 0.60 = 5.0 \times 10^8\ \text{Hz}$.

  - id: em-wavelength
    format: numeric
    difficulty: 2
    objectives: ["7.4.1"]
    prompt: |-
      An FM radio station broadcasts at $100\ \text{MHz}$.

      Find its wavelength in free space, in metres.
    fields:
      - label: "λ ="
        answer: 3.0
        unit: m
        tolerance: { abs: 0.05 }
    explanation: |-
      $100\ \text{MHz} = 1.00 \times 10^8\ \text{Hz}$, so $\lambda = c/f = 3.00 \times 10^8 / 1.00 \times 10^8 = 3.0\ \text{m}$.

  - id: em-same-quantity
    format: mcq
    difficulty: 2
    objectives: ["7.4.1"]
    prompt: |-
      Which quantity is the same for a radio wave and a gamma ray travelling in a vacuum?
    options:
      - text: Their speed
        correct: true
        why: |-
          Every electromagnetic wave travels at $c$ in free space.
      - text: Their wavelength
        why: |-
          Wavelengths differ enormously, from kilometres to picometres.
      - text: Their frequency
        why: |-
          Frequencies differ by many orders of magnitude.
      - text: The direction of their oscillations relative to their direction of travel
        why: |-
          Both are transverse, so in each case the oscillations are at right angles to the direction of travel.
    explanation: |-
      In a vacuum they share the same speed; everything else differs.

  - id: em-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.4.1"]
    prompt: |-
      Electromagnetic waves are {{1}} waves, and in free space they all travel at the same {{2}}.
    blanks:
      - accept: [transverse]
      - accept: [speed, velocity, speed c, speed of light]
    explanation: |-
      Every electromagnetic wave is transverse, and all have the same free-space speed $c$.
