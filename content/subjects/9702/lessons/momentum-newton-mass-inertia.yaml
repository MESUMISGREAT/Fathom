id: momentum-newton-mass-inertia
subject: "9702"
topic: "3.1"
title: Mass, inertia and Newton's first law
summary: Mass is the property of an object that opposes any change in its motion; with no resultant force, an object stays at rest or keeps a constant velocity.
order: 1
minutes: 5
objectives: ["3.1.1", "3.1.5"]
prerequisites: [equations-motion-acceleration]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 3.1.1, mass as the property of an object that resists change in
    motion, and learning outcome 3.1.5, stating and applying Newton's laws of motion; this lesson
    covers the first law). The diagram uses illustrative forces (600 N driving force and drag on a
    car at 30 m s⁻¹). All worked values and answer keys checked with Python. All questions are
    original; the masses, weights and speeds in them are illustrative values.
blocks:
  - type: objective
    body: |
      By the end you can say what **mass** really measures (how strongly an object opposes a change in its motion), and state and apply **Newton's first law**.

  - type: explain
    title: The tablecloth trick
    body: |
      Yank a tablecloth out from under a full dinner set fast enough and the plates barely move. Not magic: **mass**.

      Every object resists having its motion changed. The cloth only drags on the plates for a split second, and that brief, weak tug can't get them moving much. (Pull too slowly and you'll need a dustpan.)

  - type: definition
    term: Mass
    body: |
      Mass is the property of an object that **opposes (resists) any change in its motion**. The bigger the mass, the harder it is to speed the object up, slow it down or change its direction.

      This resistance to change is called **inertia**. Mass is a **scalar** and an SI base quantity, measured in **kilograms (kg)**.

  - type: intuition
    title: Mass is stubbornness
    body: |
      - Push an empty shopping trolley and one loaded with 40 bottles of water equally hard. The full one speeds up far less, and it's just as hard to stop once it's rolling.
      - On the International Space Station everything floats, yet a big storage crate still takes a hefty shove to start and another to stop. No weight is involved there: that's pure mass.
      - The station even measures its astronauts' masses this way: a device pulls them with a known force, measures their acceleration and works out the mass.

      Where the analogy breaks: "stubborn" sounds as if the object pushes back with a force of its own. It doesn't. Mass is a **property** of the object, not a force.

  - type: check
    questions: [mass-cloze, space-crate]

  - type: explain
    title: Newton's first law
    body: |
      For 2000 years people assumed (fair enough) that moving things need a push to **keep** moving. Stop pedalling and your bike stops, right?

      The plot twist: your bike stops because of **friction and air resistance**, forces you can't see. Take them away and a moving object just keeps going, in a straight line, at the same speed. A force is needed to **change** motion, not to maintain it.

  - type: definition
    term: Newton's first law
    body: |
      An object remains at rest, or continues to move with constant velocity, unless it is acted on by a **resultant force**.

  - type: explain
    title: Read it like an examiner
    body: |
      - **Constant velocity** means constant speed **and** constant direction. A car going round a roundabout at a steady $8\ \text{m s}^{-1}$ is changing velocity, so a resultant force must act on it.
      - "At rest" is just the special case where the constant velocity is zero.
      - The **resultant** force is the vector sum of all the forces. An object can have several forces on it and still obey the first law, as long as they **balance**.

      Put the two ideas together: a resultant force is what it takes to change an object's motion, and mass is how strongly the object resists that change.

  - type: diagram
    diagram: phys-momentum-newton-first-law
    alt: >-
      Three panels, each ending with "resultant force = 0". Left, "At rest": a book on a table, with
      an upward arrow N (contact force) and a downward arrow W (weight) of equal length from its
      centre; so it stays at rest. Middle, "Constant velocity": a car on a road with a dashed arrow
      above it reading v = 30 m s⁻¹, steady. A 600 N driving force arrow points forwards from its
      front and an equal 600 N drag + friction arrow points backwards from its rear; a note says
      the vertical forces balance too; so its velocity stays the same. Right, "No forces at all": a
      space probe far from any star or planet, shown at five positions one second apart. The gaps
      between the positions are all equal, so it coasts in a straight line at constant velocity.
    caption: Balanced forces and no forces at all have the same effect. The velocity doesn't change (and zero is a perfectly good constant velocity).

  - type: example
    title: A lift at constant velocity
    problem: |
      A lift and its passengers have a total weight of $9800\ \text{N}$. The lift is moving upwards at a constant $2.0\ \text{m s}^{-1}$. What is the tension in the cable?
    steps:
      - |
        Constant velocity, so by Newton's first law the **resultant force is zero**.
      - |
        Only two vertical forces act: the tension $T$ upwards and the weight, $9800\ \text{N}$, downwards. A zero resultant means they balance.
      - |
        So $T = 9800\ \text{N}$. The speed, $2.0\ \text{m s}^{-1}$, plays no part at all.
    answer: |
      $T = 9800\ \text{N}$, exactly equal to the weight. It would be the same moving **down** at constant velocity, or standing still. The cable pulls harder than the weight only while the lift is speeding up on the way up (or slowing down on the way down).

  - type: check
    questions: [lift-steady, first-law-cloze]

  - type: misconceptions
    items:
      - wrong: A moving object needs a resultant force to keep it moving.
        right: A resultant force is needed to **change** the velocity. Things that "stop on their own" are being slowed by friction or air resistance.
      - wrong: An object at rest has no forces acting on it.
        right: It can have plenty of forces on it; they just add up to zero. A book on a table has its weight and the contact force from the table.
      - wrong: Constant speed means the resultant force is zero.
        right: Only constant **velocity** means that. Changing direction at a steady speed (a car on a roundabout, a satellite in orbit) needs a resultant force.
      - wrong: Mass is how heavy something is.
        right: Mass measures **inertia**, in kg. Heaviness (weight) is a force caused by gravity, in newtons: a separate idea with its own lesson.

  - type: exam
    body: |
      - "State Newton's first law" is a 1-mark gift if you include both key words: **resultant** force (not just "a force") and constant **velocity** (not "constant speed").
      - Multiple-choice papers love "which object has a resultant force on it?". Hunt for **any** change of speed **or** direction: circular motion, braking, a ball at the top of its flight.
      - "Constant velocity", "steady speed in a straight line", "terminal velocity" and "at rest" are all code for: resultant force = 0, so the forces balance.

  - type: check
    questions: [which-resultant, bus-lurch]

  - type: takeaways
    items:
      - Mass is the property of an object that opposes any change in its motion (its inertia). It is a scalar, measured in kg.
      - "Newton's first law: an object stays at rest or moves with constant velocity unless a resultant force acts on it."
      - Resultant force zero means constant velocity (including zero velocity), and the other way round.
      - Constant velocity means constant speed **and** constant direction.

questions:
  - id: mass-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.1"]
    prompt: |
      Complete the definition: mass is the property of an object that {{1}} any change in its {{2}}.
    blanks:
      - accept: [opposes, resists, oppose, resist]
      - accept: [motion, velocity, state of motion, movement]
    explanation: |
      Mass measures inertia: how strongly an object resists being speeded up, slowed down or turned. "Opposes" and "resists" are both fine; the key idea is a **change in motion**.

  - id: space-crate
    format: mcq
    difficulty: 2
    objectives: ["3.1.1", "3.1.5"]
    prompt: |
      On the International Space Station, a $50\ \text{kg}$ crate and a $5\ \text{kg}$ box are floating at rest. An astronaut gives each of them an identical push (the same force for the same time). Which statement is correct?
    options:
      - text: The crate ends up moving more slowly, because its larger mass opposes the change in its motion more.
        correct: true
        why: Correct. Same push, ten times the mass, so the crate's velocity changes by only a tenth as much.
      - text: Both end up moving at the same speed, because nothing has any weight in orbit.
        why: Weight isn't what resists the push; mass is. The crate still has ten times the mass of the box.
      - text: The crate ends up moving faster, because heavier objects carry more force.
        why: Objects don't "carry" force. A bigger mass means a **smaller** change in velocity for the same push.
      - text: Both slow down and stop soon after the push ends.
        why: With no friction or air resistance there is no resultant force after the push, so each keeps moving at constant velocity (first law).
    explanation: |
      Mass (inertia) has nothing to do with gravity. Floating in orbit, the crate is just as hard to get moving, and just as hard to stop, as it would be on frictionless ice on Earth.

  - id: lift-steady
    format: numeric
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      A lift and its passengers have a total weight of $12\,000\ \text{N}$. The lift is moving **downwards** at a constant speed of $3.0\ \text{m s}^{-1}$. What is the tension in the lift cable?
    fields:
      - answer: 12000
        tolerance: { abs: 1 }
        unit: N
    explanation: |
      Constant velocity means zero resultant force (Newton's first law), so the tension balances the weight: $T = 12\,000\ \text{N}$. Neither the direction of motion nor the speed matters.

  - id: first-law-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.5"]
    prompt: |
      Newton's first law: an object remains at {{1}} or continues to move with constant {{2}} unless it is acted on by a {{3}} force.
    blanks:
      - accept: [rest]
      - accept: [velocity]
      - accept: [resultant, net, unbalanced]
    explanation: |
      Two words carry the marks: **velocity** (not speed, because direction counts) and **resultant** (the vector sum of all the forces). "Net" and "unbalanced" mean the same thing, but "resultant" is the safest word to write in the exam.

  - id: which-resultant
    format: mcq
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      Which of these has a resultant force acting on it?
    options:
      - text: A raindrop falling at a constant (terminal) velocity.
        why: Constant velocity, so its weight and the air resistance balance. Resultant zero.
      - text: A car going round a roundabout at a steady $8\ \text{m s}^{-1}$.
        correct: true
        why: Correct. Its direction keeps changing, so its velocity is changing. By the first law that needs a resultant force (here, towards the centre of the roundabout).
      - text: A book resting on a table.
        why: At rest and staying at rest. Its weight and the contact force from the table balance.
      - text: A cyclist riding along a straight road at a steady $6\ \text{m s}^{-1}$.
        why: Constant speed in a straight line is constant velocity, so the driving force balances the resistive forces.
    explanation: |
      Look for any change in speed **or** direction. Only the car's velocity is changing.

  - id: bus-lurch
    format: explain
    difficulty: 2
    objectives: ["3.1.1", "3.1.5"]
    prompt: |
      A passenger is standing in a bus that is moving at a steady speed. The driver brakes hard and the passenger lurches forwards. Use the ideas of mass and Newton's first law to explain why.
    model: |
      Before braking, the passenger moves forwards with the same velocity as the bus. When the driver brakes, a large backward resultant force acts on the bus, so the bus decelerates. Very little force acts on the passenger's body (only some friction at their feet), and their mass opposes any change in their motion, so by Newton's first law their body carries on forwards at almost the same velocity. The bus slows down underneath them, so relative to the bus they move forwards. Nothing pushes them forwards: the bus slows and they don't.
    keyPoints:
      - The passenger is initially moving forwards with the same velocity as the bus
      - Braking gives the bus a backward resultant force, so the bus decelerates
      - Little resultant force acts on the passenger, so by the first law their body keeps moving forwards
      - The passenger's mass (inertia) opposes the change in their motion
      - No forward force acts on the passenger; they move forwards relative to the bus because it slows down
    explanation: |
      The "force throwing you forwards" is an illusion. What really happens is that the bus stops sharing its motion with you. Seatbelts exist to supply the resultant backward force your body needs.
