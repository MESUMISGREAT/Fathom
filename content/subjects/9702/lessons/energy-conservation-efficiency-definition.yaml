blocks:
  - type: objective
    body: |
      By the end you can **define efficiency** as the ratio of useful energy
      output to total energy input, write it as a fraction or a percentage, and
      explain why it cannot reach $100\%$ for a real machine.

  - type: explain
    title: Two numbers to compare
    body: |
      Every machine takes energy in and gives energy out. Some of the output does
      the job you wanted; the rest is **dissipated**, usually warming the
      surroundings.

      A filament lamp fed with $100\ \text{J}$ might radiate $5\ \text{J}$ as
      visible light and warm the room with $95\ \text{J}$. Lighting the room is
      the job, so only $5\ \text{J}$ is useful.

      **Efficiency** is the single number that captures how well the machine
      does its job.

  - type: definition
    term: Efficiency
    body: |
      $$\text{efficiency} = \dfrac{\text{useful energy output}}{\text{total energy input}}$$

      Both quantities are energies, measured in joules (J), so efficiency is a
      **ratio with no unit** — a number between $0$ and $1$.

      Multiply by $100$ to quote it as a **percentage**.

  - type: explain
    title: Deciding what is useful
    body: |
      "Useful" depends on what the device is **for**:

      - an electric **motor**: the kinetic energy it gives the load is useful;
        the thermal energy warming its coils is wasted;
      - an electric **heater**: the thermal energy delivered to the room is
        useful, so a heater can be almost $100\%$ efficient;
      - a **lamp**: the light is useful, even though far more thermal energy
        comes out.

      Always ask: what was the machine built to do?

  - type: diagram
    diagram: phys-energy-conservation-efficiency-blocks
    alt: >-
      A block diagram. A box on the left labelled "energy input: 100 J" sends an
      arrow into a motor labelled "electric motor". Two arrows leave the motor:
      one labelled "useful output: kinetic energy 60 J" and one labelled
      "dissipated: thermal energy + sound 40 J". Underneath, the calculation:
      efficiency = 60 ÷ 100 = 0.60 = 60%.
    caption: The input always splits into useful output plus dissipated energy; efficiency watches the useful branch.

  - type: example
    title: "Worked example: an electric winch"
    problem: |
      An electric winch is supplied with $400\ \text{J}$ of electrical energy and
      transfers $300\ \text{J}$ of energy to the load as the load is lifted.
      The rest warms the motor and the air.

      Calculate the efficiency of the winch as a fraction and as a percentage.
    steps:
      - |
        Useful energy output $= 300\ \text{J}$; total energy input
        $= 400\ \text{J}$.
      - |
        $$\text{efficiency} = \dfrac{300}{400} = 0.75$$
      - |
        As a percentage: $0.75 \times 100\% = 75\%$.
      - |
        Check with the books: $300\ \text{J}$ useful $+$ $100\ \text{J}$
        dissipated $=$ $400\ \text{J}$ in. ✓
    answer: |
      $0.75$, or $75\%$. The other $100\ \text{J}$ (25%) went to the thermal
      store of the motor and the surroundings.

  - type: check
    title: Quick check
    questions: [efficiency-cloze, lamp-useful, winch-efficiency]
  - type: explain
    title: Fraction or percentage?
    body: |
      Exam answers accept either, but be consistent:

      - a **fraction** between 0 and 1: "the efficiency is $0.75$";
      - a **percentage**: "the efficiency is $75\%$".

      Converting one to the other is just multiplying or dividing by $100$. A value
      like $1.25$ or $125\%$ means the useful output was bigger than the input,
      which would create energy — impossible.

  - type: misconceptions
    items:
      - wrong: Efficiency is useful energy output divided by energy wasted.
        right: |
          Divide by the **total energy input**, not by the wasted energy.
          $300\ \text{J}$ useful out of $400\ \text{J}$ in is $75\%$; dividing by
          the $100\ \text{J}$ wasted would give a meaningless $3$.
      - wrong: Efficiency has the unit of joules.
        right: |
          Both quantities are energies, so the units cancel. Efficiency is a
          ratio with **no unit**.
      - wrong: A machine with 100% efficiency is common at home.
        right: |
          Every real machine dissipates some energy, usually as thermal energy,
          so real efficiencies are below $100\%$. An electric heater is the closest
          to $100\%$, because warming the room is exactly its job.
      - wrong: Wasted energy has been destroyed.
        right: |
          It is dissipated to the surroundings as thermal energy. Energy is still
          conserved; it just does not do the job you wanted.

  - type: exam
    body: |
      - "Define efficiency" (1 mark): *useful energy output divided by total
        energy input* — say **useful** and **total**, or the mark is lost.
      - Include the $\times 100\%$ if the question asks for a percentage. Leaving
        the answer as $0.75$ when the question asks for a percentage loses the
        final mark.
      - If the question gives two energies, check which is the input: the input is
        the **larger** value (the useful output cannot exceed it).

  - type: check
    title: Check yourself
    questions: [drill-efficiency, explain-efficiency-limit]
  - type: takeaways
    items:
      - >-
        efficiency = useful energy output ÷ total energy input.
      - Efficiency is a ratio with no unit; multiply by 100 for a percentage.
      - Decide "useful" by asking what the device is designed to do.
      - Real efficiencies are always less than 100%, because some energy is always dissipated.

questions:
  - id: efficiency-cloze
    format: cloze
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      Efficiency is the useful energy {{1}} divided by the total energy
      {{2}}.
    blanks:
      - accept: [output, out]
      - accept: [input, in, supplied]
    explanation: |
      $\text{efficiency} = \dfrac{\text{useful energy output}}{\text{total energy input}}$.
      Both the words "useful" and "total" matter.

  - id: lamp-useful
    format: mcq
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      A filament lamp is supplied with electrical energy. Which energy transfer is
      the **useful** output when working out its efficiency?
    options:
      - text: The energy transferred by heating to the room
        why: |
          Heating the room is a by-product for a lamp: it is the dissipated
          output, not the useful one.
      - text: The energy transferred as light
        correct: true
        why: |
          Correct. A lamp is built to produce light, so the radiant (light)
          energy is the useful output, even though it is the smaller share.
      - text: The energy stored chemically in the lamp's filament
        why: |
          The filament stores almost no energy; energy passes through it and is
          transferred onwards.
      - text: The energy carried by the current in the wires
        why: |
          That energy is part of the input to the lamp, not an output from it.
    explanation: |
      "Useful" means "what the device is for". For a lamp that is the light; the
      thermal transfer is dissipated energy.

  - id: winch-efficiency
    format: numeric
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      An electric winch is supplied with $2.4\ \text{kJ}$ of energy and
      transfers $1.8\ \text{kJ}$ to the load it lifts.

      Calculate the efficiency of the winch as a percentage.
    fields:
      - answer: 75
        tolerance: { abs: 0.6 }
        unit: "%"
    explanation: |
      $\text{efficiency} = \dfrac{1.8}{2.4} = 0.75 = 75\%$. The units cancel, so
      any matching units (here kJ and kJ) can be used.

  - id: drill-efficiency
    format: numeric
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      An electric drill is supplied with $800\ \text{J}$ of electrical energy.
      It transfers $520\ \text{J}$ of energy to the drill bit as kinetic energy
      and dissipates the rest.

      Calculate the efficiency of the drill as a percentage.
    fields:
      - answer: 65
        tolerance: { abs: 0.5 }
        unit: "%"
    explanation: |
      $520 \div 800 = 0.65 = 65\%$. The remaining $280\ \text{J}$ warms the motor
      and the surroundings.

  - id: explain-efficiency-limit
    format: explain
    difficulty: 3
    objectives: ["5.1.3"]
    prompt: |
      Explain why the efficiency of a real machine cannot be greater than $100\%$.
    model: |
      Efficiency compares the useful energy output with the total energy input.
      Because energy cannot be created or destroyed, the machine can only give
      out energy that came in, so the useful output can never be more than the
      total input. In fact it is always less, because some energy is always
      dissipated to the surroundings, usually as thermal energy. A value above
      100% would mean more energy came out than went in, which would break the
      principle of conservation of energy.
    keyPoints:
      - Energy cannot be created or destroyed
      - The useful output comes only from the input, so it cannot exceed it
      - Some energy is always dissipated, usually as thermal energy
      - Efficiency above 100% would create energy, contradicting conservation
    explanation: |
      The examiner wants conservation of energy as the reason, plus the idea that
      some input is always dissipated.
