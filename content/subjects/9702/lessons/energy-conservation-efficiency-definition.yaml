id: energy-conservation-efficiency-definition
subject: "9702"
topic: "5.1"
title: "Efficiency: how much of what you put in comes out useful"
summary: Efficiency compares the useful energy output with the total energy input as a fraction or percentage, and is always less than 100% for real machines.
order: 4
minutes: 4
kind: core
objectives: ["5.1.3"]
prerequisites: [energy-conservation-principle]
