    Re-checked in a second adversarial pass by the same agent on 2026-10-28. Every numeric key was recomputed independently in Python from the question's own data, every MCQ was checked for exactly one correct option with plausible distractors, and every diagram was rendered and inspected in light and dark (labels, arrows, overlaps and scale). Two real errors were found and fixed in that pass: a wrong 'strain falls by 2' reasoning in a stress/strain comparison question, and a garbled sentence in the elastic-vs-strong enrichment. No separate reviewer model was available here. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can explain how a **tensile** force and a **compressive** force deform an object, and use the words **load**, **extension**, **compression** and **limit of proportionality** correctly.

  - type: explain
    title: Pull it, and it gets longer
    body: |-
      Hang a mass on a vertical wire and the wire gets longer. The force pulling it is a **tensile** force: two forces pulling outwards, along the wire, at each end.

      Push down on a short pillar and it gets shorter. The force squashing it is a **compressive** force: two forces pushing inwards, along the pillar.

      Both are examples of **deformation** — a change of shape or size caused by a force. In this topic we only study deformation along one direction (the length), because that is what the syllabus measures.

  - type: explain
    title: The four words you need
    body: |-
      - **Load** — the force applied to the object. Hanging a 2.0 N weight on a wire means the load is 2.0 N.
      - **Extension** — how much **longer** the object becomes than its original length.
      - **Compression** — how much **shorter** the object becomes than its original length.
      - **Limit of proportionality** — the load beyond which extension is no longer **directly proportional** to load.

      Extension and compression are both lengths, so they are measured in metres (often quoted in mm for a wire).

  - type: diagram
    diagram: phys-stress-strain-tension-compression
    alt: >-
      Two panels. Left: a vertical wire of original length L held at the top, with a weight hanging
      from the bottom; arrows point outwards at both ends labelled "tensile forces", and the
      stretched length is marked with the extension x between the old and new bottom ends. Right:
      a short pillar resting on the ground with a heavy block on top; arrows point inwards at both
      ends labelled "compressive forces", and the shortening is marked with the compression x. A
      dashed outline in each panel shows the original, undeformed shape.
    caption: |-
      A tensile force lengthens an object; a compressive force shortens it. In both cases the change in length is called $x$.

  - type: intuition
    title: Why the same force can lengthen or shorten
    body: |-
      What matters is the **direction** of the forces relative to the object.

      - Forces pulling **away** from each other, along the object: it stretches.
      - Forces pushing **towards** each other, along the object: it squashes.

      A rubber band and a sponge behave in the same two ways — the rubber band when you pull it, the sponge when you press it. The material does not decide which happens; the direction of the forces does.

  - type: example
    title: "Worked example: reading extension off a measurement"
    problem: |-
      A vertical wire is 1.800 m long with no load. A 4.0 N weight is hung on it, and the wire is then measured as 1.804 m long.

      State the load and the extension, in mm.
    steps:
      - |-
        The **load** is the force applied, so the load is $4.0\ \text{N}$.
      - |-
        The extension is the change in length:

        $$x = 1.804\ \text{m} - 1.800\ \text{m} = 0.004\ \text{m}$$
      - |-
        Convert to millimetres: $0.004\ \text{m} = 4\ \text{mm}$.
    answer: |-
      Load $= 4.0\ \text{N}$; extension $x = 4\ \text{mm}$ (0.004 m).

  - type: explain
    title: The limit of proportionality
    body: |-
      For small loads, doubling the load doubles the extension. A graph of load against extension is a straight line through the origin.

      Push the load far enough and the line starts to **curve**. The extension still increases, but no longer in proportion to the load.

      The point where the straight line ends is the **limit of proportionality**. Beyond it you can no longer use "load is proportional to extension", so any calculation that assumes a straight-line graph stops working there.

      Every spring and every wire has one; a very stiff steel wire simply reaches it at a bigger load than a slinky does.

  - type: check
    title: Quick check
    questions: [tensile-or-compressive, load-and-extension, lop-meaning]

  - type: check
    title: Practice
    questions: [extension-from-lengths, compression-sign, lop-graph]

  - type: misconceptions
    items:
      - wrong: Extension and length are the same thing.
        right: |-
          Extension is the **change** in length. A wire of length 2.000 m that becomes 2.003 m has
          an extension of 3 mm, not 2.003 m.
      - wrong: A compressive force always breaks an object.
        right: |-
          A compressive force simply shortens it. Whether it then cracks or buckles depends on how
          big the force is and on the material — that is a different question.
      - wrong: Only springs can be deformed by a force.
        right: |-
          Any solid deforms: wires stretch, pillars compress, beams bend. Springs are just the
          easiest case to see.
      - wrong: Beyond the limit of proportionality the object must be permanently damaged.
        right: |-
          Not necessarily. Proportionality can end while the object still returns to its original
          length when the load is removed — that change is called the elastic limit, and it comes
          later (topic 6.2).
      - wrong: A bigger load always gives a bigger extension, so the graph is always straight.
        right: |-
          A bigger load does usually give a bigger extension, but the graph is only straight up to
          the limit of proportionality.

  - type: exam
    body: |-
      - "State what is meant by extension" needs the idea of **change in length**: the difference between the stretched and unstretched lengths.
      - In a table of measurements, the first row is the load, and extension is always found by **subtracting** the original length — examiners give a mark for that subtraction.
      - Do not write "the wire stretches by 2.003 m" when you mean its length is 2.003 m.

  - type: takeaways
    items:
      - 'A tensile force pulls an object longer; a compressive force pushes it shorter.'
      - 'Load is the force applied; extension and compression are changes in length, measured in metres.'
      - 'Extension is found by subtracting the original length from the new length.'
      - 'Up to the limit of proportionality, extension is directly proportional to load.'
      - 'Beyond the limit of proportionality, the load–extension graph curves.'

  - type: deeper
    title: Why deformation happens at all
    body: |-
      On the atomic scale, a solid is a lattice of atoms held at a preferred spacing by attractive and repulsive forces.

      Pull the ends apart and the spacing grows slightly; push them together and it shrinks. The forces between atoms act like tiny stiff springs, which is why a whole wire behaves like a spring.

questions:
  - id: tensile-or-compressive
    format: mcq
    difficulty: 1
    objectives: ["6.1.2"]
    prompt: |-
      A short concrete pillar supports the roof of a building. Which describes the force the roof exerts on the pillar, and its effect?
    options:
      - text: A compressive force, which makes the pillar shorter
        correct: true
        why: |-
          The roof pushes down along the pillar, so the pillar is squashed and becomes slightly
          shorter.
      - text: A tensile force, which makes the pillar longer
        why: |-
          A tensile force pulls outwards; here the forces push inwards along the pillar.
      - text: A tensile force, which makes the pillar shorter
        why: |-
          The direction is wrong: a tensile force would lengthen it.
      - text: No deformation occurs, because concrete is rigid
        why: |-
          All solids deform slightly under load; concrete is stiff, not perfectly rigid.
    explanation: |-
      Forces pushing along the pillar squash it, so the deformation is compression.

  - id: load-and-extension
    format: numeric
    difficulty: 1
    objectives: ["6.1.2"]
    prompt: |-
      A wire has an unstretched length of 2.500 m. With a weight hanging on it, its length is 2.504 m.

      Give the extension in millimetres.
    fields:
      - label: "x ="
        answer: 4
        unit: mm
        tolerance: { abs: 0.01 }
    explanation: |-
      $x = 2.504 - 2.500 = 0.004\ \text{m} = 4\ \text{mm}$.

  - id: lop-meaning
    format: mcq
    difficulty: 2
    objectives: ["6.1.2"]
    prompt: |-
      What is meant by the limit of proportionality?
    options:
      - text: The load beyond which the extension is no longer directly proportional to the load
        correct: true
        why: |-
          It is the end of the straight-line part of the load–extension graph.
      - text: The largest load the object can hold before breaking
        why: |-
          That is the breaking (fracture) point, which is much further along the graph.
      - text: The extension at which the object first bends
        why: |-
          Bending is a different kind of deformation; the limit of proportionality is about the end
          of proportionality.
      - text: The load needed to double the original length
        why: |-
          There is no such fixed rule; it would depend entirely on the object.
    explanation: |-
      The limit of proportionality marks the end of the straight, origin-to-point part of the
      graph.

  - id: extension-from-lengths
    format: numeric
    difficulty: 2
    objectives: ["6.1.2"]
    prompt: |-
      A spring is 12.0 cm long with no load, 13.4 cm long with a 2.0 N load, and 16.2 cm long with a 4.0 N load.

      What is the total extension with the 4.0 N load, in cm?
    fields:
      - label: "x ="
        answer: 4.2
        unit: cm
        tolerance: { abs: 0.05 }
    explanation: |-
      $x = 16.2 - 12.0 = 4.2\ \text{cm}$. (The 13.4 cm reading shows the first 2.0 N added
      1.4 cm, and the next 2.0 N added another 2.8 cm — so this spring is already past its limit
      of proportionality.)

  - id: compression-sign
    format: mcq
    difficulty: 1
    objectives: ["6.1.1"]
    prompt: |-
      A foam block is 8.0 cm thick. A 60 N weight placed on it makes it 7.4 cm thick. What is the compression?
    options:
      - text: 0.6 cm
        correct: true
        why: |-
          The thickness fell by $8.0 - 7.4 = 0.6\ \text{cm}$.
      - text: 7.4 cm
        why: |-
          That is the new thickness, not the change.
      - text: 8.0 cm
        why: |-
          That is the original thickness.
      - text: 15.4 cm
        why: |-
          Adding the lengths is meaningless here; compression is a difference.
    explanation: |-
      Compression is the decrease in length: $8.0 - 7.4 = 0.6\ \text{cm}$.

  - id: lop-graph
    format: mcq
    difficulty: 2
    objectives: ["6.1.1"]
    prompt: |-
      A student plots load against extension for a rubber band. The graph is a straight line through the origin, then curves upwards. What does the curving tell the student?
    options:
      - text: The limit of proportionality has been passed, so extension is no longer proportional to load
        correct: true
        why: |-
          Proportionality means a straight line through the origin; the curve ends that.
      - text: The rubber band has broken
        why: |-
          A break would show as the extension jumping while the load stays constant, or the graph
          stopping.
      - text: The measurements must be wrong, because rubber always obeys proportionality
        why: |-
          No material obeys proportionality for ever; rubber is especially stretchy.
      - text: The load is now measured in the wrong units
        why: |-
          A unit error would not produce a smooth curve that starts straight.
    explanation: |-
      A straight line through the origin means proportionality; the point where it curves is the
      limit of proportionality.
