id: stress-strain-deformation
subject: "9702"
topic: "6.1"
title: "Tension and compression: how forces change shape"
summary: A stretched wire gets longer, a squashed pillar gets shorter — and the words load, extension, compression and limit of proportionality describe exactly how.
order: 1
minutes: 6
kind: core
objectives: ["6.1.1", "6.1.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027, topic 6.1, learning outcomes 6.1.1 (tensile and compressive forces cause
    deformation) and 6.1.2 (load, extension, compression and limit of proportionality). The
    numbers in the worked example are illustrative and chosen so the arithmetic is exact. All
