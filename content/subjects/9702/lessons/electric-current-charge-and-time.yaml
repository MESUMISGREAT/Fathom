id: electric-current-charge-and-time
subject: "9702"
topic: "9.1"
title: Using I = Q/t — charge, current and time
summary: Calculate charge, current or time from the other two quantities. Work with coulombs, amperes, seconds, minutes, hours. Convert between units.
order: 2
minutes: 5
objectives: ["9.1.3"]
prerequisites: ["electric-current-flow-of-charge"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against Cambridge 9702 syllabus outcome 9.1.3. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can confidently use $I = Q/t$ to find any one of current, charge or time, with unit conversions (mA, μA, minutes, hours, etc.).

  - type: explain
    title: The formula triangle
    body: |
      The relationship $I = Q/t$ is simple but appears constantly in exams. Think of it as a triangle:

      ```
           Q
         /   \
        I  ×  t
      ```

      - To find **charge**: $Q = I \times t$
      - To find **current**: $I = Q / t$
      - To find **time**: $t = Q / I$

      **Always work in SI base units**: amperes (A), coulombs (C), seconds (s).

  - type: example
    title: Basic charge calculation
    problem: |
      A current of 0.50 A flows for 2.0 minutes. What charge passes?
    steps:
      - |
        Convert time to seconds: $2.0\ \text{min} = 2.0 \times 60 = 120\ \text{s}$.
      - |
        Use $Q = I \times t = 0.50 \times 120 = 60\ \text{C}$.
    answer: |
      60 C

  - type: example
    title: Finding time
    problem: |
      A charger delivers a constant current of 2.0 A. How long (in hours) to deliver 3600 C of charge?
    steps:
      - |
        $t = Q / I = 3600 / 2.0 = 1800\ \text{s}$.
      - |
        Convert to hours: $1800\ \text{s} = 1800 / 3600 = 0.50\ \text{h}$.
    answer: |
      0.50 h (or 30 minutes)

  - type: check
    questions: [current-from-charge, time-from-charge, charge-from-current]

  - type: intuition
    title: Unit prefixes you'll meet
    body: |
      | Prefix | Symbol | Factor | Example |
      | --- | --- | --- | --- |
      | kilo | k | $10^3$ | kA = 1000 A |
      | milli | m | $10^{-3}$ | mA = 0.001 A |
      | micro | μ | $10^{-6}$ | μA = 0.000001 A |
      | nano | n | $10^{-9}$ | nA = $10^{-9}$ A |

      **Always convert to base units (A, s) before calculating**, then convert the answer back if the question asks for minutes, hours, mA, etc.

  - type: example
    title: Mixed units — a typical exam question
    problem: |
      A car battery supplies a current of 250 mA for 4.0 hours. Calculate the total charge that passes, in coulombs.
    steps:
      - |
        Current: $250\ \text{mA} = 250 \times 10^{-3}\ \text{A} = 0.250\ \text{A}$.
      - |
        Time: $4.0\ \text{h} = 4.0 \times 3600\ \text{s} = 14400\ \text{s}$.
      - |
        $Q = I \times t = 0.250 \times 14400 = 3600\ \text{C}$.
    answer: |
      3600 C

  - type: check
    questions: [mixed-units-charge, current-in-ma]

  - type: explain
    title: Non-constant current (extension)
    body: |
      The formula $I = Q/t$ gives the **average current** over time $t$. If the current varies, the total charge is the **area under the $I$–$t$ graph**.

      For a **constant** current that area is just the rectangle $Q = I \times t$. For a varying current you find the area by counting squares or by splitting the shape into a rectangle, a triangle or a trapezium — no calculus needed at this level.

  - type: example
    title: Charge from a current–time graph
    problem: |
      The graph shows current (mA) vs time (s). Current rises linearly from 0 to 40 mA in 10 s, then stays constant at 40 mA for 20 s. Find the total charge.
    steps:
      - |
        Area 1 (triangle, 0–10 s): $\frac{1}{2} \times 10 \times 40 \times 10^{-3} = 0.20\ \text{C}$.
      - |
        Area 2 (rectangle, 10–30 s): $20 \times 40 \times 10^{-3} = 0.80\ \text{C}$.
      - |
        Total: $Q = 0.20 + 0.80 = 1.00\ \text{C}$.
    answer: |
      1.00 C

  - type: check
    questions: [charge-from-graph]

  - type: check
    questions: [spot-unit-error, explain-average-current]

  - type: misconceptions
    items:
      - wrong: "Current is measured in coulombs."
        right: Current is in **amperes (A)**. **Charge** is in **coulombs (C)**.
      - wrong: "I = Q/t so if t = 0 the current is infinite."
        right: The formula gives **average** current over a time interval. Instantaneous current at an instant is a derivative, not a division by zero.
      - wrong: "Charge and current are the same quantity measured in different units."
        right: "Current is the **rate** at which charge flows (A = C s⁻¹); charge is **how much** has flowed (C). A current of 2 A for 3 s delivers 6 C of charge, not 6 A."

  - type: exam
    body: |
      - Unit conversions are the most common trap: mA → A, hours → seconds, μC → C.
      - "Calculate the charge" → $Q = I \times t$. "Calculate the time" → $t = Q / I$.
      - Graph questions: area under $I$–$t$ graph = charge. Count squares or use geometry.
      - Watch for "average current" phrasing — it's total charge / total time.

  - type: takeaways
    items:
      - '$I = Q/t$; $Q = I \times t$; $t = Q / I$.'
      - "Always convert to A, C, s before calculating."
      - "Common prefixes: m ($10^{-3}$), μ ($10^{-6}$), n ($10^{-9}$), k ($10^3$)."
      - "For varying current, charge = area under $I$–$t$ graph."

questions:
  - id: current-from-charge
    format: numeric
    difficulty: 1
    objectives: ["9.1.3"]
    prompt: |
      A charge of 120 C passes through a wire in 30 s. What is the current in amperes?
    fields:
      - answer: 4.0
        tolerance: { rel: 0.01 }
        unit: A
    explanation: |
      $I = Q/t = 120 / 30 = 4.0\ \text{A}$.

  - id: time-from-charge
    format: numeric
    difficulty: 1
    objectives: ["9.1.3"]
    prompt: |
      How many seconds does it take for a current of 0.25 A to deliver a charge of 50 C?
    fields:
      - answer: 200
        tolerance: { rel: 0.01 }
        unit: s
    explanation: |
      $t = Q/I = 50 / 0.25 = 200\ \text{s}$.

  - id: charge-from-current
    format: numeric
    difficulty: 1
    objectives: ["9.1.3"]
    prompt: |
      A current of 3.5 mA flows for 2.0 minutes. Calculate the charge in coulombs.
    fields:
      - answer: 0.42
        tolerance: { rel: 0.02 }
        unit: C
    explanation: |
      $I = 3.5 \times 10^{-3}\ \text{A}$, $t = 2.0 \times 60 = 120\ \text{s}$. $Q = I \times t = 3.5 \times 10^{-3} \times 120 = 0.42\ \text{C}$.

  - id: mixed-units-charge
    format: numeric
    difficulty: 2
    objectives: ["9.1.3"]
    prompt: |
      A battery charger supplies 500 mA for 6.0 hours. What charge is delivered in coulombs?
    fields:
      - answer: 10800
        tolerance: { rel: 0.01 }
        unit: C
    explanation: |
      $I = 0.500\ \text{A}$, $t = 6.0 \times 3600 = 21600\ \text{s}$. $Q = 0.500 \times 21600 = 10800\ \text{C}$.

  - id: current-in-ma
    format: numeric
    difficulty: 2
    objectives: ["9.1.3"]
    prompt: |
      A charge of 7.2 mC passes in 1.2 s. What is the current in mA?
    fields:
      - answer: 6.0
        tolerance: { rel: 0.01 }
        unit: mA
    explanation: |
      $Q = 7.2 \times 10^{-3}\ \text{C}$, $t = 1.2\ \text{s}$. $I = Q/t = 6.0 \times 10^{-3}\ \text{A} = 6.0\ \text{mA}$.

  - id: charge-from-graph
    format: numeric
    difficulty: 2
    objectives: ["9.1.3"]
    prompt: |
      A current–time graph shows a constant current of 20 mA for 15 s, then the current drops linearly to 0 over the next 5 s. Calculate the total charge in coulombs.
    fields:
      - answer: 0.35
        tolerance: { rel: 0.02 }
        unit: C
    explanation: |
      Area 1 (rectangle): $20 \times 10^{-3} \times 15 = 0.30\ \text{C}$. Area 2 (triangle): $\frac{1}{2} \times 20 \times 10^{-3} \times 5 = 0.05\ \text{C}$. Total = $0.35\ \text{C}$.

  - id: spot-unit-error
    format: spot-error
    difficulty: 2
    objectives: ["9.1.3"]
    prompt: |
      A student calculates: "I = 250 mA, t = 4 hours. Q = I × t = 250 × 4 = 1000 C." Identify the error.
    lines:
      - "I = 250 mA, t = 4 hours."
      - "Q = I × t = 250 × 4 = 1000 C."
      - "Answer: 1000 C."
    errorLine: 2
    fix: |
      Convert to base units first: I = 0.250 A, t = 4 × 3600 = 14400 s. Then Q = 0.250 × 14400 = 3600 C.
    explanation: |
      The student used mA and hours directly. You must convert to amperes and seconds before multiplying.

  - id: explain-average-current
    format: explain
    difficulty: 3
    objectives: ["9.1.3"]
    prompt: |
      Explain what average current means and how to find it when the current varies with time.
    model: |
      Average current is total charge divided by total time: $I_{avg} = Q_{total}/t_{total}$. If the current varies, you can't use $I = Q/t$ with a single I value — you must either integrate (find area under the I–t graph) or use the average current if it's given or can be found from the graph. For a symmetrical triangle graph peaking at $I_{max}$, the average current is $I_{max}/2$. For a rectangle it's just the constant value.
    keyPoints:
      - "Average current = total charge / total time"
      - "Varying current: use area under I–t graph"
      - "Triangle graph: average current = half the peak"
      - "Rectangle graph: average = constant value"
    explanation: |
      The concept of average current is crucial when current isn't constant. The area under the I–t graph always gives total charge, and dividing by total time gives average current.