id: resistance-resistivity-definition
subject: "9702"
topic: "9.3"
title: Resistance and V = IR
summary: Resistance is the p.d. across a component divided by the current through it. Use V = IR to find R, V or I, and see why R belongs to the component, not the supply.
order: 1
minutes: 8
kind: core
objectives: ["9.3.1", "9.3.2"]
prerequisites: []
