blocks:
  - type: objective
    body: |
      By the end you can define resistance as the potential difference across a component divided by the current through it, state its unit, and use $V = IR$ in all three rearrangements to find the resistance, the potential difference or the current.

  - type: explain
    title: What resistance actually measures
    body: |
      Push the same potential difference across a short thick copper wire and across a long thin filament, and very different currents flow. The wire lets charge through easily; the filament holds it back. **Resistance** is the quantity that measures that opposition.

      For any component we measure two things at the same time:

      - the **potential difference** $V$ across it (in volts),
      - the **current** $I$ through it (in amperes).

      Resistance is the ratio of those two measurements. A component with a large resistance needs a large potential difference to drive even a small current through it.

      This is why resistance is measured in a unit built from volts and amperes rather than being a "basic" unit like the metre or the second.

  - type: definition
    term: Resistance
    body: |
      The **resistance** $R$ of a component is the potential difference $V$ across it divided by the current $I$ through it:

      $$R = \frac{V}{I}$$

      The unit is the **ohm** ($\Omega$), where $1\ \Omega = 1\ \text{V A}^{-1}$: one ohm is the resistance of a component that carries one ampere when one volt is across it.

  - type: example
    title: Finding a resistance from a voltmeter and an ammeter
    problem: |
      A resistor has a potential difference of $6.0\ \text{V}$ across it and carries a current of $0.25\ \text{A}$. Calculate its resistance.
    steps:
      - |
        Use the definition, with the p.d. on top:

        $$R = \frac{V}{I}$$
      - |
        Substitute the measured values:

        $$R = \frac{6.0}{0.25}$$
      - |
        A potential difference of $6.0\ \text{V}$ driving only $0.25\ \text{A}$ is a fairly large opposition, so expect a resistance of a few tens of ohms: $6.0 \div 0.25 = 24$.
    answer: |
      $R = 24\ \Omega$ (2 s.f.)

  - type: check
    questions: [resistance-definition, resistance-unit]

  - type: explain
    title: The same relationship rearranged
    body: |
      The definition is one equation with three quantities, so it can be written three ways. All three say exactly the same thing about the same component; you choose the form that puts the unknown on its own.

      $$V = IR \qquad R = \frac{V}{I} \qquad I = \frac{V}{R}$$

      Notice the shape of each: the potential difference is the **product**, while the resistance and the current are each the potential difference **divided** by the other quantity. If you remember $V = IR$, you never need to memorise the other two — rearrange it.

      When you substitute, convert prefixes first (mA to A, k$\Omega$ to $\Omega$). The relationship only works in base units.

  - type: example
    title: Finding a potential difference
    problem: |
      A $470\ \Omega$ resistor carries a current of $12\ \text{mA}$. Calculate the potential difference across it.
    steps:
      - |
        The unknown is $V$, so use the product form:

        $$V = IR$$
      - |
        Convert the current to amperes: $12\ \text{mA} = 12 \times 10^{-3}\ \text{A} = 0.012\ \text{A}$.
      - |
        Substitute:

        $$V = 0.012 \times 470 = 5.64$$
    answer: |
      $V = 5.6\ \text{V}$ (2 s.f., or $5.64\ \text{V}$ to 3 s.f.)

  - type: check
    questions: [pd-from-resistance, current-from-pd]

  - type: example
    title: Finding a current
    problem: |
      A potential difference of $12\ \text{V}$ is applied across a component of resistance $8.0\ \Omega$. Calculate the current through it.
    steps:
      - |
        The unknown is $I$, so divide the potential difference by the resistance:

        $$I = \frac{V}{R}$$
      - |
        Substitute:

        $$I = \frac{12}{8.0} = 1.5$$
    answer: |
      $I = 1.5\ \text{A}$

  - type: check
    questions: [current-simple, spot-resistance-error, explain-resistance-property]

  - type: intuition
    title: Resistance belongs to the component
    body: |
      It is tempting to read $R = V/I$ as "the resistance grows when the potential difference grows". That is a misreading. For a metal wire at constant temperature, doubling the potential difference doubles the current as well, so the **ratio** $V/I$ is unchanged.

      Think of resistance as a property of the object in front of you — its material, its length, its thickness, its temperature — not of the supply connected to it. What the supply sets is the potential difference; the component decides how much current that potential difference produces. A filament lamp is the exception that proves the rule, because its temperature changes as the current changes.

  - type: misconceptions
    items:
      - wrong: Resistance is the same thing as resistivity.
        right: "**Resistance** is a property of a particular object and is measured in ohms. **Resistivity** is a property of the material itself, measured in $\\Omega$ m, and does not change when you cut the object to a different size."
      - wrong: A component with a bigger resistance always has a bigger current through it.
        right: "The opposite, for a fixed potential difference. $I = V/R$, so a larger $R$ gives a **smaller** current from the same supply."
      - wrong: "The resistance of a wire increases because the potential difference across it increases."
        right: "For a metallic conductor at constant temperature the resistance stays constant; $V$ and $I$ rise together and their ratio does not change. Only a change in the wire (length, thickness, temperature) changes its resistance."
      - wrong: You can substitute milliamperes and kilohms straight into V = IR.
        right: "Convert to amperes and ohms first, otherwise the answer is wrong by a factor of a thousand."

  - type: exam
    body: |
      - "Define resistance" needs the words **potential difference** divided by **current**, not just "how hard it is for current to flow": $R = V/I$ with the unit ohm.
      - A definition question often carries a mark for the unit, so state $1\ \Omega = 1\ \text{V A}^{-1}$ as well.
      - In calculations, write the equation, substitute in base units, then round. An answer in mA or k$\Omega$ must be converted before substitution or converted back at the end.
      - Read the question to see which quantity is fixed. "A p.d. of 6.0 V is applied" fixes $V$; "a current of 0.25 A flows" fixes $I$.

  - type: takeaways
    items:
      - "Resistance is defined by $R = V/I$; its unit is the ohm, $1\ \\Omega = 1\ \\text{V A}^{-1}$."
      - "$V = IR$ rearranges to $R = V/I$ and $I = V/R$; pick the form with the unknown on its own."
      - "Convert prefixes to base units before substituting."
      - "Resistance is a property of the component; for a metal at constant temperature, changing the supply changes $V$ and $I$ together, not $R$."

questions:
  - id: resistance-definition
    format: mcq
    difficulty: 1
    objectives: ["9.3.1"]
    prompt: |
      Which statement defines the resistance of a component?
    options:
      - text: The potential difference across it divided by the current through it.
        correct: true
        why: This is the definition, $R = V/I$, with the unit ohm.
      - text: The current through it divided by the potential difference across it.
        why: That is the reciprocal, which measures how easily charge passes, not the resistance.
      - text: The product of the potential difference across it and the current through it.
        why: That product is the power dissipated, measured in watts.
      - text: The energy transferred per unit charge passing through it.
        why: Energy per unit charge is the potential difference itself, not the resistance.
    explanation: |
      Resistance is defined as the ratio of the potential difference across a component to the current through it, $R = V/I$. The product $VI$ is power, and energy per unit charge is potential difference.

  - id: resistance-unit
    format: text
    difficulty: 1
    objectives: ["9.3.1"]
    style: definition
    prompt: |
      State the unit of resistance and express it in terms of the units of potential difference and current.
    accept:
      - "ohm, 1 ohm = 1 volt per ampere"
      - "ohm (V/A)"
      - "ohm, V A^-1"
      - "ohm = volt/ampere"
    model: |
      The unit of resistance is the ohm ($\Omega$), where $1\ \Omega = 1\ \text{V A}^{-1}$.
    explanation: |
      Since $R = V/I$, the unit of resistance is the unit of potential difference divided by the unit of current: volts per ampere, which is given the name ohm.

  - id: pd-from-resistance
    format: numeric
    difficulty: 2
    objectives: ["9.3.2"]
    prompt: |
      A resistor of resistance $470\ \Omega$ carries a current of $12\ \text{mA}$. Calculate the potential difference across it, in volts.
    fields:
      - label: "V ="
        answer: 5.64
        tolerance: { rel: 0.01 }
        unit: "V"
    explanation: |
      Convert first: $12\ \text{mA} = 0.012\ \text{A}$. Then $V = IR = 0.012 \times 470 = 5.64\ \text{V}$. Forgetting the conversion gives $12 \times 470 = 5640\ \text{V}$, which is a factor of a thousand too large.

  - id: current-from-pd
    format: numeric
    difficulty: 2
    objectives: ["9.3.2"]
    prompt: |
      A potential difference of $12\ \text{V}$ is applied across a component of resistance $8.0\ \Omega$. Calculate the current through it, in amperes.
    fields:
      - label: "I ="
        answer: 1.5
        tolerance: { rel: 0.01 }
        unit: "A"
    explanation: |
      Rearrange to $I = V/R = 12 / 8.0 = 1.5\ \text{A}$.

  - id: current-simple
    format: numeric
    difficulty: 2
    objectives: ["9.3.2"]
    prompt: |
      A potential difference of $230\ \text{V}$ is across a $2.2\ \text{k}\Omega$ resistor. Calculate the current through it, in milliamperes.
    fields:
      - label: "I ="
        answer: 105
        tolerance: { rel: 0.02 }
        unit: "mA"
    explanation: |
      Convert the resistance: $2.2\ \text{k}\Omega = 2200\ \Omega$. Then $I = V/R = 230 / 2200 = 0.1045\ \text{A} \approx 105\ \text{mA}$. Using $2.2$ instead of $2200$ would give an answer about a thousand times too large.

  - id: spot-resistance-error
    format: spot-error
    difficulty: 2
    objectives: ["9.3.1", "9.3.2"]
    prompt: |
      A student measures a potential difference of $6.0\ \text{V}$ across a resistor carrying a current of $0.25\ \text{A}$ and calculates its resistance. Find the first error.
    lines:
      - "The potential difference across the resistor is 6.0 V."
      - "The current through the resistor is 0.25 A."
      - "So R = I / V = 0.25 / 6.0 = 0.042 Ω."
      - "Therefore the resistance is 0.042 Ω."
    errorLine: 3
    fix: |
      R = V / I = 6.0 / 0.25 = 24 Ω. The potential difference is divided by the current, not the other way round.
    explanation: |
      Resistance is the potential difference **divided by** the current. The student has inverted the ratio, which gives the reciprocal of the resistance (the conductance) rather than the resistance itself.

  - id: explain-resistance-property
    format: explain
    difficulty: 3
    objectives: ["9.3.2"]
    prompt: |
      A student says "the resistance of this wire is 5.0 Ω, so if I use a bigger battery its resistance will go up". Explain whether this is correct for a metal wire at constant temperature.
    model: |
      The statement is wrong for a metal conductor kept at constant temperature. Resistance is fixed by the wire itself: its material, length, cross-sectional area and temperature. A larger battery applies a larger potential difference, and the current rises in proportion, so the ratio $V/I$ stays at $5.0\ \Omega$. Only a change in the wire — a different length, a different thickness, or a different temperature — changes its resistance.
    keyPoints:
      - "Resistance is a property of the wire, not of the supply"
      - "V and I increase together, so the ratio V/I is unchanged"
      - "Only length, area, material or temperature change the resistance"
    explanation: |
      $R = V/I$ defines resistance as a ratio; it does not say that $R$ is caused by $V$. For a metallic conductor at constant temperature the ratio stays constant as the supply changes, which is exactly what makes the material useful.
