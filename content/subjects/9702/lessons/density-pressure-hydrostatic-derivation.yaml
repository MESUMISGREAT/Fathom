id: density-pressure-hydrostatic-derivation
subject: "9702"
topic: "4.3"
title: Where the liquid-pressure equation comes from
summary: Start with density and pressure definitions to derive the pressure increase through a liquid depth.
order: 3
minutes: 5
objectives: ["4.3.3"]
prerequisites: [density-pressure-density-basics, density-pressure-pressure-basics]
