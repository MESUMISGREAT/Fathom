id: linear-momentum-collisions-1d
subject: "9702"
topic: "3.3"
title: "Collisions in a straight line: signs are everything"
summary: Pick a positive direction, give every velocity a sign, set total momentum before equal to total momentum after, then read the sign of your answer.
order: 2
minutes: 5
objectives: ["3.3.2"]
prerequisites: [linear-momentum-conservation-principle]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 3.3.2, solving simple problems with the principle of conservation
    of momentum, here for interactions in one dimension). The diagram's velocity arrows are drawn
    to scale (0.40 kg at +5.0 m s⁻¹ and 0.60 kg at −3.0 m s⁻¹ before; −2.5 and +2.0 m s⁻¹ after;
    total +0.20 kg m s⁻¹ both times). Masses and speeds are illustrative; all worked values and
    answer keys were computed with Python. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-24. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can solve one-dimensional collision problems with conservation of momentum, using a **sign convention** for direction, whether the objects stick together or bounce apart.

  - type: explain
    title: In a straight line, a vector is a number with a sign
    body: |
      Two identical cars drive at each other at the same speed. What is their total momentum?

      **Zero.** One momentum is $+mv$, the other $-mv$, and they cancel.

      That's the whole trick of 1D momentum problems: along a line, a vector's direction is carried by its **sign**. Forget the sign and you get answers that are confidently, spectacularly wrong.

  - type: explain
    title: The four-step recipe
    body: |
      1. **Sketch** before and after, with an arrow for each velocity.
      2. **Choose a positive direction** (say "right is positive") and write it down.
      3. Write **total momentum before = total momentum after**, with signs:
         $$m_1u_1 + m_2u_2 = m_1v_1 + m_2v_2$$
         ($u$ = velocities before, $v$ = velocities after). If they stick together, the right-hand side is $(m_1 + m_2)v$.
      4. **Solve and interpret.** A negative answer isn't a mistake: it means the velocity is in the negative direction. Say the direction in words.

  - type: diagram
    diagram: phys-linear-momentum-collision-1d
    alt: >-
      Two rows, "Before" and "After", with an arrow showing right as positive. Before: ball A (0.40
      kg) moves right at 5.0 m s⁻¹, so p = +2.0; ball B (0.60 kg) moves left at 3.0 m s⁻¹, so p =
      −1.8. Total p = (+2.0) + (−1.8) = +0.20 kg m s⁻¹. After: A moves left at 2.5 m s⁻¹, so p =
      −1.0; B moves right at 2.0 m s⁻¹, so p = +1.2. Total p = (−1.0) + (+1.2) = +0.20 kg m s⁻¹, the
      same as before. Velocity arrows are drawn to scale.
    caption: Both balls reverse, yet the total momentum is +0.20 kg m s⁻¹ before and after.

  - type: example
    title: Head-on, locked together
    problem: |
      A car of mass $1500\ \text{kg}$ travelling east at $20\ \text{m s}^{-1}$ collides head-on with a van of mass $2500\ \text{kg}$ travelling west at $10\ \text{m s}^{-1}$. They lock together. Find their velocity just after the collision.
    steps:
      - |
        Take **east as positive**. Then $u_\text{car} = +20\ \text{m s}^{-1}$ and $u_\text{van} = -10\ \text{m s}^{-1}$.
      - |
        Total momentum before $= 1500 \times 20 + 2500 \times (-10) = 30\,000 - 25\,000 = +5000\ \text{kg m s}^{-1}$.
      - |
        After: $(1500 + 2500)\,v = 4000\,v$.
      - |
        $4000\,v = 5000$, so $v = +1.25\ \text{m s}^{-1}$.
    answer: |
      $1.25\ \text{m s}^{-1}$ **east**. The car had more momentum, so the wreck carries on in the car's direction, but only just.

  - type: check
    questions: [total-momentum-signs, headon-stick]

  - type: example
    title: Bouncing apart
    problem: |
      In the diagram above, ball A ($0.40\ \text{kg}$) moves right at $5.0\ \text{m s}^{-1}$ and ball B ($0.60\ \text{kg}$) moves left at $3.0\ \text{m s}^{-1}$. After they collide, A moves left at $2.5\ \text{m s}^{-1}$. Find B's velocity after the collision.
    steps:
      - |
        Right is positive: $u_A = +5.0$, $u_B = -3.0$, $v_A = -2.5\ \text{m s}^{-1}$.
      - |
        Before: $0.40 \times 5.0 + 0.60 \times (-3.0) = 2.0 - 1.8 = +0.20\ \text{kg m s}^{-1}$.
      - |
        After: $0.40 \times (-2.5) + 0.60\,v_B = -1.0 + 0.60\,v_B$.
      - |
        $-1.0 + 0.60\,v_B = 0.20$, so $0.60\,v_B = 1.2$ and $v_B = +2.0\ \text{m s}^{-1}$.
    answer: |
      $2.0\ \text{m s}^{-1}$ **to the right**. Positive, so B has reversed direction.

  - type: check
    questions: [find-velocity-after, negative-answer]

  - type: misconceptions
    items:
      - wrong: The total momentum before a head-on collision is the sum of the two momenta as positive numbers.
        right: Objects moving in opposite directions have momenta of **opposite sign**. Add them with their signs, and they partly (or completely) cancel.
      - wrong: A negative velocity in my answer means I've gone wrong.
        right: It means the object moves in the **negative** direction you chose. Report it as a speed and a direction.
      - wrong: If the wreck ends up at rest, momentum has been lost.
        right: That only happens when the total momentum **before** was already zero, for example equal momenta in opposite directions.
      - wrong: The object with the bigger speed always "wins" a head-on collision.
        right: It's the bigger **momentum** that decides the final direction. A slow lorry beats a fast bike.

  - type: exam
    body: |
      - Write your sign convention at the start ("taking right as positive"). It costs one line and protects every later line.
      - Write the conservation equation with symbols or numbers **before** simplifying: method marks are available even if the arithmetic slips.
      - Give the final velocity as a magnitude **and** a direction, with units ($\text{m s}^{-1}$).
      - Units of momentum: $\text{kg m s}^{-1}$ or $\text{N s}$. Never $\text{N}$.

  - type: check
    questions: [sign-spot-error, find-mass]

  - type: takeaways
    items:
      - Choose a positive direction and give every velocity a sign.
      - "Total momentum before = total momentum after: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂."
      - If the objects stick together, they share one final velocity, with mass m₁ + m₂.
      - A negative answer means the negative direction; always state the direction in words.

questions:
  - id: total-momentum-signs
    format: mcq
    difficulty: 1
    objectives: ["3.3.2"]
    prompt: |
      Ball X, of mass $2.0\ \text{kg}$, moves right at $3.0\ \text{m s}^{-1}$. Ball Y, of mass $3.0\ \text{kg}$, moves left at $2.0\ \text{m s}^{-1}$. What is the total momentum of the two balls?
    options:
      - text: Zero
        correct: true
        why: Correct. X has $+6.0\ \text{kg m s}^{-1}$ and Y has $-6.0\ \text{kg m s}^{-1}$; they cancel.
      - text: $12\ \text{kg m s}^{-1}$
        why: This adds the two momenta as if they were in the same direction. They are opposite.
      - text: $6.0\ \text{kg m s}^{-1}$ to the right
        why: That's only X's momentum. Y's momentum, to the left, must be added with a negative sign.
      - text: $5.0\ \text{kg m s}^{-1}$ to the right
        why: This multiplies the total mass by the difference in speeds. Work out each object's momentum separately, then add them with signs.
    explanation: |
      Right positive: $2.0 \times 3.0 + 3.0 \times (-2.0) = 6.0 - 6.0 = 0$. If they stick together, the wreck will be at rest.

  - id: headon-stick
    format: numeric
    difficulty: 2
    objectives: ["3.3.2"]
    prompt: |
      A $2.0\ \text{kg}$ trolley moving right at $3.0\ \text{m s}^{-1}$ collides with a $1.0\ \text{kg}$ trolley moving left at $4.0\ \text{m s}^{-1}$. They stick together. Taking right as positive, find their velocity just after the collision (include the sign).
    fields:
      - answer: 0.6667
        tolerance: { abs: 0.005 }
        unit: m s⁻¹
    explanation: |
      Before: $2.0 \times 3.0 + 1.0 \times (-4.0) = +2.0\ \text{kg m s}^{-1}$. After: $3.0\,v$. So $v = \dfrac{2.0}{3.0} = +0.67\ \text{m s}^{-1}$: $0.67\ \text{m s}^{-1}$ to the right.

  - id: find-velocity-after
    format: numeric
    difficulty: 2
    objectives: ["3.3.2"]
    prompt: |
      A puck of mass $0.60\ \text{kg}$ moving right at $5.0\ \text{m s}^{-1}$ hits a stationary puck of mass $0.90\ \text{kg}$. The first puck rebounds to the left at $1.0\ \text{m s}^{-1}$. Taking right as positive, find the velocity of the $0.90\ \text{kg}$ puck after the collision.
    fields:
      - answer: 4.0
        tolerance: { abs: 0.02 }
        unit: m s⁻¹
    explanation: |
      Before: $0.60 \times 5.0 = 3.0\ \text{kg m s}^{-1}$. After: $0.60 \times (-1.0) + 0.90\,v = -0.60 + 0.90\,v$. So $0.90\,v = 3.6$ and $v = +4.0\ \text{m s}^{-1}$ (to the right). Because the first puck bounced back, the second one gets **more** than the original $3.0\ \text{kg m s}^{-1}$ of momentum.

  - id: negative-answer
    format: mcq
    difficulty: 1
    objectives: ["3.3.2"]
    prompt: |
      Taking right as positive, a student solves a collision problem and finds that a trolley's velocity after the collision is $-0.35\ \text{m s}^{-1}$. What does this mean?
    options:
      - text: The trolley moves to the left at $0.35\ \text{m s}^{-1}$
        correct: true
        why: Correct. The sign gives the direction relative to the chosen positive direction.
      - text: The calculation must be wrong, because a speed cannot be negative
        why: It's a **velocity**, not a speed. Velocities can be negative; the speed here is $0.35\ \text{m s}^{-1}$.
      - text: The trolley moves to the right but is slowing down
        why: Slowing down would show in the acceleration, not in the sign of the velocity. A negative velocity means motion to the left.
      - text: The trolley has lost momentum to its surroundings
        why: The sign tells you the direction of the momentum, not whether any has been lost.
    explanation: |
      With right positive, a negative velocity is to the left. Report it as "$0.35\ \text{m s}^{-1}$ to the left".

  - id: sign-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["3.3.2"]
    prompt: |
      A $1500\ \text{kg}$ car moving east at $12\ \text{m s}^{-1}$ collides head-on with a $1000\ \text{kg}$ car moving west at $18\ \text{m s}^{-1}$. They lock together. Which line of this solution contains the first error?
    lines:
      - |
        Take east as positive.
      - |
        Total momentum before $= 1500 \times 12 + 1000 \times 18 = 36\,000\ \text{kg m s}^{-1}$.
      - |
        Total momentum after $= (1500 + 1000)\,v = 2500\,v$.
      - |
        $v = \dfrac{36\,000}{2500} = 14.4\ \text{m s}^{-1}$ east.
    errorLine: 2
    fix: |
      The second car moves west, so its velocity is $-18\ \text{m s}^{-1}$: total momentum before $= 18\,000 - 18\,000 = 0$. The wreck stops dead: $v = 0$.
    explanation: |
      A wreck moving faster (14.4 m s⁻¹) than one of the cars was before should set off alarm bells. With signs, the two momenta cancel exactly.

  - id: find-mass
    format: numeric
    difficulty: 3
    objectives: ["3.3.2"]
    prompt: |
      A ball of mass $0.20\ \text{kg}$ moving right at $6.0\ \text{m s}^{-1}$ hits a block at rest on a smooth surface. The ball rebounds to the left at $2.0\ \text{m s}^{-1}$ and the block moves to the right at $0.40\ \text{m s}^{-1}$. Calculate the mass of the block.
    fields:
      - answer: 4.0
        tolerance: { abs: 0.02 }
        unit: kg
    explanation: |
      Right positive. Before: $0.20 \times 6.0 = 1.2\ \text{kg m s}^{-1}$. After: $0.20 \times (-2.0) + M \times 0.40 = -0.40 + 0.40M$. So $0.40M = 1.6$ and $M = 4.0\ \text{kg}$.
