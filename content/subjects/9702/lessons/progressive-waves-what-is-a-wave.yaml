blocks:
  - type: objective
    body: |-
      By the end you can explain what **wave motion** means, describe it with a rope, a spring and a ripple tank, and state clearly what a progressive wave transfers and what it does not.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $d$ | distance travelled by the wave |
      | $t$ | time |
      | $v$ | speed of the wave |

  - type: explain
    title: The duck that does not go anywhere
    body: |-
      Drop a stone into a pond. Rings spread outwards across the surface.

      Put a rubber duck where the rings will pass. The duck bobs **up and down** as each ring goes by, but it does not get carried to the edge of the pond.

      The pattern moves outwards. The water does not.

      That is the central idea of a wave: a **disturbance** travels through a medium, while the particles of the medium only vibrate about their own resting positions.

  - type: definition
    term: Progressive wave
    body: |-
      A **progressive wave** is a wave that transfers **energy** from one place to another without transferring matter.

      As it passes, each point of the medium oscillates about its **equilibrium position**. The oscillation reaches neighbouring points a little later, so the disturbance appears to travel.

  - type: diagram
    diagram: phys-progressive-waves-rope-pulse
    alt: >-
      A rope fixed at one end, with a single pulse travelling from left to right. A marked point on
      the rope is shown at three moments: on the equilibrium line, lifted as the pulse arrives, and
      back on the equilibrium line after it has passed. A horizontal arrow shows the pulse moving
      while a vertical double arrow shows the marked point oscillating about its equilibrium.
    caption: |-
      The pulse travels; the rope itself only moves up and down. Energy is carried along the rope, not the rope.

  - type: intuition
    title: Passing on a nudge
    body: |-
      Hold one end of a rope and flick it. The flick lifts the first short section of rope. That section pulls on the next one, lifting it slightly later, and so on down the rope.

      Each section does exactly what its neighbour did, just a moment later. The **shape** moves; the rope does not.

      A line of people passing a bucket along works the same way: the bucket moves from person to person, but each person stays put and only moves their arms.

      The analogy stops at the bucket, because a wave has no single object being passed — what is passed is energy and the pattern of vibration.

  - type: explain
    title: Three ways to make a wave
    body: |-
      The syllabus names three standard demonstrations. They all show the same physics.

      | Demonstration | What you do | What the medium does |
      | --- | --- | --- |
      | Rope | Flick or shake one end | Rope moves **across** the wave direction |
      | Spring | Push and pull one end along the spring | Coils move **along** the wave direction |
      | Ripple tank | Dip a vibrating bar into shallow water | Water surface moves up and down |

      In the rope, the oscillation is at right angles to the direction the wave travels. That is a **transverse** wave.

      In the spring, the coils oscillate along the same line as the wave travels. That is a **longitudinal** wave.

      Both are progressive waves, and both carry energy outwards.

  - type: example
    title: "Worked example: how fast does the disturbance travel?"
    problem: |-
      A pulse travels along a rope. It passes a mark $1.2\ \text{m}$ from the flicked end after $0.40\ \text{s}$.

      Calculate the speed of the pulse.
    steps:
      - |-
        The pulse has travelled a distance $d = 1.2\ \text{m}$ in a time $t = 0.40\ \text{s}$.
      - |-
        Use the definition of speed:

        $$v = \frac{d}{t}$$
      - |-
        Substitute:

        $$v = \frac{1.2}{0.40} = 3.0$$
      - |-
        The distance is in metres and the time in seconds, so the speed is in metres per second.
    answer: |-
      $3.0\ \text{m s}^{-1}$.

  - type: check
    title: Quick check
    questions: [wave-transfers, duck-motion, wave-definition]

  - type: explain
    title: Energy, not matter
    body: |-
      Why does it matter that a wave carries energy? Because that is what waves are *for* in physics.

      - Light from the Sun carries energy through space to warm the Earth.
      - Sound carries energy from a loudspeaker to your ear.
      - A seismic wave carries energy through the ground and can damage buildings far from the earthquake.

      In every case the **medium** (or, for light, the fields) stays where it is while energy moves through it.

      The energy of a wave depends on its **amplitude**: a bigger oscillation carries more energy. You will quantify that later in this topic.

  - type: misconceptions
    items:
      - wrong: A wave carries the medium along with it.
        right: |-
          The medium only oscillates about equilibrium. A floating duck bobs but is not carried
          outwards by a water wave.
      - wrong: Particles in a wave move from the source to the far end.
        right: |-
          Each particle passes the disturbance to the next; no particle makes the whole journey.
      - wrong: All waves need a material medium.
        right: |-
          Mechanical waves such as sound and water waves do, but electromagnetic waves travel
          through a vacuum.
      - wrong: A wave transfers both matter and energy.
        right: |-
          A progressive wave transfers **energy** only. That is the defining feature.
      - wrong: In a transverse wave the particles move along the wave direction.
        right: |-
          They move at right angles to it. Along the direction is longitudinal.

  - type: exam
    body: |-
      - Define a progressive wave as transferring **energy** (not matter) from one place to another. The word "energy" is the mark.
      - When describing a ripple-tank demonstration, say the cork or floating object moves **up and down about a fixed point**, not "moves with the wave".
      - Use the words **oscillation** and **equilibrium**; they show the examiner you understand the mechanism.
      - Do not confuse the speed of the wave with the speed of the particles. The particles oscillate; the wave pattern travels.

  - type: takeaways
    items:
      - 'A **progressive wave** transfers energy from place to place without transferring matter.'
      - 'The particles of the medium oscillate about their equilibrium positions.'
      - 'Rope: transverse (oscillation at right angles to travel). Spring: longitudinal (oscillation along travel).'
      - 'Ripple tank: floating objects bob up and down but are not carried outwards.'
      - 'A bigger amplitude means more energy is carried.'

  - type: check
    title: Practice
    questions: [pulse-speed, wave-motion-cloze, wave-spot-error]

questions:
  - id: wave-transfers
    format: mcq
    difficulty: 1
    objectives: ["7.1.1", "7.1.6"]
    prompt: |-
      What does a progressive wave transfer from one place to another?
    options:
      - text: Energy, without transferring matter
        correct: true
        why: |-
          The disturbance travels and carries energy, while the particles only oscillate about
          equilibrium.
      - text: Matter, without transferring energy
        why: |-
          It is the other way round: energy is transferred, not matter.
      - text: Both matter and energy
        why: |-
          The medium does not travel with the wave, so matter is not transferred.
      - text: Neither matter nor energy
        why: |-
          A wave definitely carries energy — that is why it can do work far from its source.
    explanation: |-
      A progressive wave carries energy through a medium while the medium itself stays in place.

  - id: duck-motion
    format: mcq
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |-
      A ripple tank wave passes a small cork floating on the water. What happens to the cork?
    options:
      - text: It moves up and down about its equilibrium position
        correct: true
        why: |-
          The water surface oscillates; the cork follows that vertical motion but is not carried
          along with the wave.
      - text: It travels across the tank with the wave
        why: |-
          If it did, the water itself would be moving across the tank, which it is not.
      - text: It stays completely still
        why: |-
          The passing wave lifts and lowers the surface, so the cork must move vertically.
      - text: It moves in a circle and ends up further from the source
        why: |-
          In a ripple tank the surface particles oscillate vertically, not in travelling circles.
    explanation: |-
      The cork shows that the medium oscillates but does not travel with the wave.

  - id: wave-definition
    format: text
    difficulty: 2
    style: definition
    objectives: ["7.1.6"]
    prompt: |-
      Define a progressive wave.
    accept:
      - a wave that transfers energy from one place to another without transferring matter
      - a wave that transfers energy without transferring matter
      - a wave that carries energy from place to place
    model: |-
      A wave that transfers energy from one place to another without transferring matter, with the particles of the medium oscillating about their equilibrium positions.
    explanation: |-
      The key phrase is "transfers energy without transferring matter".

  - id: pulse-speed
    format: numeric
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |-
      A wave pulse travels $3.0\ \text{m}$ along a spring in $2.0\ \text{s}$.

      Calculate the speed of the pulse, in $\text{m s}^{-1}$.
    fields:
      - label: "v ="
        answer: 1.5
        unit: "m s⁻¹"
        tolerance: { abs: 0.05 }
    explanation: |-
      $v = d/t = 3.0/2.0 = 1.5\ \text{m s}^{-1}$.

  - id: wave-motion-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.1.1", "7.1.6"]
    prompt: |-
      In wave motion, the disturbance travels and carries {{1}}, while the particles of the medium {{2}} about their equilibrium positions.
    blanks:
      - accept: [energy]
      - accept: [oscillate, vibrate]
    explanation: |-
      Energy is transferred; the particles only oscillate about fixed equilibrium positions.

  - id: wave-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |-
      A student describes a water wave in a ripple tank. Which line contains the first error?
    lines:
      - The vibrating bar disturbs the water surface.
      - The disturbance spreads outwards across the tank.
      - A cork on the surface is carried outwards with the wave.
      - The cork bobs up and down as each wave passes.
    errorLine: 3
    fix: |-
      The cork is **not** carried outwards. It oscillates up and down about its equilibrium position; only the disturbance and its energy travel across the tank.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 confuses the motion of the wave with the motion of the medium.
