id: progressive-waves-what-is-a-wave
subject: "9702"
topic: "7.1"
title: "What a wave actually moves"
summary: A progressive wave carries energy from place to place while the particles of the medium only oscillate about their equilibrium positions. Nothing travels along with the wave but the disturbance.
order: 1
minutes: 7
kind: core
objectives: ["7.1.1", "7.1.6"]
prerequisites: [equations-motion-deriving-suvat]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
