id: kirchhoffs-laws-parallel-resistance
subject: "9702"
topic: "10.2"
title: "Parallel resistors: deriving 1/R = 1/R₁ + 1/R₂"
summary: Use Kirchhoff's two laws to prove the parallel formula, then use it to find combined resistance and branch currents.
order: 4
