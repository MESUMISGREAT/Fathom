id: units-prefixes
subject: "9702"
topic: "1.2"
title: Prefixes and powers of ten
summary: Ten prefixes from pico to tera scale any unit by a power of ten; the traps are capital letters and squared or cubed units.
order: 3
minutes: 5
objectives: ["1.2.4"]
prerequisites: [units-si-base-and-derived]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 1.2.4, which lists exactly the ten prefixes taught here). Example
    lengths in the diagram are standard reference values (Earth radius, Earth-Moon and Earth-Sun
    distances, atomic diameter). Conversions checked by hand. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-19. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can recall the ten syllabus prefixes with their symbols and powers of ten, and convert confidently between them, including for squared and cubed units.

  - type: explain
    title: The ten prefixes
    body: |
      A prefix is a shorthand for a power of ten. It works on **any** unit, base or derived: km, mA, GHz, μF, MPa.

      | Prefix | Symbol | Factor |
      | --- | --- | --- |
      | tera | T | $10^{12}$ |
      | giga | G | $10^{9}$ |
      | mega | M | $10^{6}$ |
      | kilo | k | $10^{3}$ |
      | deci | d | $10^{-1}$ |
      | centi | c | $10^{-2}$ |
      | milli | m | $10^{-3}$ |
      | micro | μ | $10^{-6}$ |
      | nano | n | $10^{-9}$ |
      | pico | p | $10^{-12}$ |

      - Apart from centi and deci, they go up in **steps of 1000**.
      - **Case matters.** M (mega, $10^{6}$) and m (milli, $10^{-3}$) differ by $10^{9}$.
      - μ is the Greek letter mu. If you can't type it, "u" is a common stand-in.

  - type: diagram
    diagram: phys-prefix-ladder
    alt: >-
      A vertical powers-of-ten scale from 10 to the minus 12 at the bottom to 10 to the 12 at the
      top, with one tick per factor of ten. On the right, each prefix is marked at its power: tera
      T at 10^12, giga G at 10^9, mega M at 10^6, kilo k at 10^3, no prefix at 10^0, deci d at
      10^-1, centi c at 10^-2, milli m at 10^-3, micro μ at 10^-6, nano n at 10^-9 and pico p at
      10^-12. On the left, real lengths are placed on the same scale: the Earth to Sun distance
      (1.5 × 10^11 m), Earth to Moon (3.8 × 10^8 m), the radius of the Earth (6.4 × 10^6 m), the
      height of Everest (8.8 × 10^3 m), a person (1.7 m), a fingernail's width (1 × 10^-2 m), a
      human hair's width (8 × 10^-5 m), the wavelength of green light (5 × 10^-7 m) and the
      diameter of an atom (1 × 10^-10 m).
    caption: Each tick is ten times the one below. The prefixes are evenly spaced in steps of 1000, except for centi and deci.

  - type: check
    questions: [microamp-convert, prefix-names]

  - type: explain
    title: "Converting: swap the prefix for its power of ten"
    body: |
      Replace the prefix symbol with its factor, then tidy into standard form:

      - $470\ \text{nm} = 470 \times 10^{-9}\ \text{m} = 4.7 \times 10^{-7}\ \text{m}$
      - $3.6\ \text{MJ} = 3.6 \times 10^{6}\ \text{J}$
      - $1\ \text{mg} = 10^{-3}\ \text{g} = 10^{-6}\ \text{kg}$ (the kilogram already contains a prefix)

      Going the other way, pick the prefix that leaves a sensible number: $4.7 \times 10^{-7}\ \text{m} = 470\ \text{nm}$ or $0.47\ \text{μm}$.

  - type: example
    title: Squared and cubed units
    problem: |
      (a) Convert a wire's cross-sectional area of $0.50\ \text{mm}^2$ into $\text{m}^2$.
      (b) Convert the density of steel, $7.9\ \text{g cm}^{-3}$, into $\text{kg m}^{-3}$.
    steps:
      - |
        (a) The power applies to the prefix too: $1\ \text{mm}^2 = (10^{-3}\ \text{m})^2 = 10^{-6}\ \text{m}^2$.
      - |
        So $0.50\ \text{mm}^2 = 0.50 \times 10^{-6}\ \text{m}^2 = 5.0 \times 10^{-7}\ \text{m}^2$.
      - |
        (b) Convert top and bottom separately: $1\ \text{g} = 10^{-3}\ \text{kg}$ and $1\ \text{cm}^3 = (10^{-2}\ \text{m})^3 = 10^{-6}\ \text{m}^3$.
      - |
        $7.9\ \text{g cm}^{-3} = \dfrac{7.9 \times 10^{-3}\ \text{kg}}{10^{-6}\ \text{m}^3} = 7.9 \times 10^{3}\ \text{kg m}^{-3}$.
    answer: |
      (a) $5.0 \times 10^{-7}\ \text{m}^2$; (b) $7.9 \times 10^{3}\ \text{kg m}^{-3}$. Handy fact: $1\ \text{g cm}^{-3} = 1000\ \text{kg m}^{-3}$.

  - type: misconceptions
    items:
      - wrong: Since 1 cm = 10⁻² m, 1 cm² = 10⁻² m².
        right: Square the factor as well. 1 cm² = (10⁻² m)² = 10⁻⁴ m², and 1 cm³ = 10⁻⁶ m³.
      - wrong: M and m are the same prefix, and capitals don't matter.
        right: M is mega (10⁶) and m is milli (10⁻³). Mixing them up is an error of a factor of a billion.
      - wrong: A milligram is 10⁻³ kg.
        right: A milligram is 10⁻³ **g**, which is 10⁻⁶ kg.

  - type: check
    questions: [area-convert, density-convert, volume-spot-error]

  - type: intuition
    title: Orders of magnitude
    body: |
      The **order of magnitude** of a value is the power of ten nearest to it. An atom ($\sim 10^{-10}$ m) and the Earth ($\sim 10^{7}$ m) differ by 17 orders of magnitude. Prefixes are simply names for some of those powers, which is why they're so useful for estimates: "about a micrometre" or "about a gigawatt" already tells you the size.

  - type: exam
    body: |
      - **Convert to base units before you substitute.** A wavelength in nm or an area in mm² put straight into a formula is the most common avoidable mistake.
      - Paper 1 often hides a prefix in the data (μF, kΩ, mm²) and offers the unconverted answer as a distractor.
      - Take extra care with squared and cubed units: areas of wires and volumes of samples.

  - type: check
    questions: [power-station-chargers]

  - type: takeaways
    items:
      - "Smallest to largest: p, n, μ, m, c, d, then k, M, G, T ($10^{-12}$ up to $10^{12}$), mostly in steps of 1000."
      - "Case matters: m is milli, M is mega."
      - "Squared or cubed units: square or cube the prefix factor too (1 mm² = 10⁻⁶ m²)."
      - $1\ \text{g cm}^{-3} = 1000\ \text{kg m}^{-3}$.
      - Convert everything to base units before substituting into an equation.

questions:
  - id: microamp-convert
    format: mcq
    difficulty: 1
    objectives: ["1.2.4"]
    prompt: |
      A current is $25\ \text{μA}$. What is this in amperes?
    options:
      - text: $2.5 \times 10^{-5}\ \text{A}$
        correct: true
        why: "Correct: $25 \\times 10^{-6} = 2.5 \\times 10^{-5}$."
      - text: $2.5 \times 10^{-8}\ \text{A}$
        why: This uses nano ($10^{-9}$) instead of micro ($10^{-6}$).
      - text: $2.5 \times 10^{-2}\ \text{A}$
        why: This uses milli ($10^{-3}$) instead of micro ($10^{-6}$).
      - text: $2.5 \times 10^{7}\ \text{A}$
        why: This multiplies by $10^{6}$ instead of $10^{-6}$. Micro makes the number smaller in amperes.
    explanation: |
      Micro means $\times 10^{-6}$: $25\ \text{μA} = 25 \times 10^{-6}\ \text{A} = 2.5 \times 10^{-5}\ \text{A}$.

  - id: prefix-names
    format: cloze
    difficulty: 1
    objectives: ["1.2.4"]
    prompt: |
      The prefix that means $\times 10^{-9}$ is {{1}}, and the prefix that means $\times 10^{12}$ is {{2}}.
    blanks:
      - accept: [nano, nano-]
      - accept: [tera, tera-]
    explanation: |
      Nano (n) is $10^{-9}$, as in nanometres for wavelengths of light. Tera (T) is $10^{12}$, the largest prefix in the syllabus.

  - id: area-convert
    format: numeric
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |
      A copper wire has a cross-sectional area of $0.20\ \text{mm}^2$. Express this area in $\text{m}^2$.
    fields:
      - answer: 2.0e-7
        unit: m²
    explanation: |
      $1\ \text{mm}^2 = (10^{-3}\ \text{m})^2 = 10^{-6}\ \text{m}^2$, so $0.20\ \text{mm}^2 = 0.20 \times 10^{-6} = 2.0 \times 10^{-7}\ \text{m}^2$. If you got $2.0 \times 10^{-4}$, you forgot to square the prefix.

  - id: density-convert
    format: numeric
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |
      The density of aluminium is $2.7\ \text{g cm}^{-3}$. What is this in $\text{kg m}^{-3}$?
    fields:
      - answer: 2700
        unit: kg m⁻³
    explanation: |
      $\dfrac{2.7 \times 10^{-3}\ \text{kg}}{10^{-6}\ \text{m}^3} = 2.7 \times 10^{3}\ \text{kg m}^{-3} = 2700\ \text{kg m}^{-3}$. (Water: $1\ \text{g cm}^{-3} = 1000\ \text{kg m}^{-3}$, so aluminium is 2.7 times as dense as water.)

  - id: volume-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |
      A student converts $250\ \text{cm}^3$ into $\text{m}^3$. Which line contains the error?
    lines:
      - |
        $1\ \text{cm} = 10^{-2}\ \text{m}$
      - |
        so $1\ \text{cm}^3 = 10^{-2}\ \text{m}^3$
      - |
        $250\ \text{cm}^3 = 250 \times 10^{-2}\ \text{m}^3$
      - |
        $= 2.5\ \text{m}^3$
    errorLine: 2
    fix: |
      Cube the factor too: $1\ \text{cm}^3 = (10^{-2}\ \text{m})^3 = 10^{-6}\ \text{m}^3$, so $250\ \text{cm}^3 = 2.5 \times 10^{-4}\ \text{m}^3$.
    explanation: |
      A sanity check helps: 250 cm³ is a mug of tea, and 2.5 m³ would fill a small car. The prefix factor must be cubed along with the metre.

  - id: power-station-chargers
    format: numeric
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |
      A power station has an output of $2.0\ \text{GW}$. A phone charger uses $5.0\ \text{W}$. How many chargers could the power station supply at the same time?
    fields:
      - answer: 4.0e8
    explanation: |
      $2.0\ \text{GW} = 2.0 \times 10^{9}\ \text{W}$, and $\dfrac{2.0 \times 10^{9}}{5.0} = 4.0 \times 10^{8}$: four hundred million chargers.
