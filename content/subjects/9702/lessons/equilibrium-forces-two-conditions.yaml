id: equilibrium-forces-two-conditions
subject: "9702"
topic: "4.2"
title: "Equilibrium: no resultant force AND no resultant torque"
summary: An object is in equilibrium only when the resultant force on it is zero and the resultant torque on it is zero; you need both, and together they find unknown forces.
order: 2
minutes: 5
objectives: ["4.2.2"]
prerequisites: [equilibrium-forces-principle-of-moments, turning-effects-couples]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 4.2.2, a system with no resultant force and no resultant torque
    is in equilibrium). The plank diagram is drawn to scale (4.0 m plank of weight 200 N, 600 N
    person 1.0 m from one support). Weights and lengths are illustrative values; all worked
    values and answer keys were computed with Python. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can state the two conditions for equilibrium, explain why both are needed, and use them together to find unknown forces.

  - type: explain
    title: Balanced forces, still spinning
    body: |
      Two kids push a playground roundabout with equal forces in opposite directions, on opposite sides. The forces cancel, yet the roundabout spins faster and faster.

      Zero resultant force is **not** enough for equilibrium.

  - type: definition
    term: Equilibrium
    body: |
      An object is in **equilibrium** when:

      - the **resultant force** on it is zero, **and**
      - the **resultant torque** (resultant moment) on it is zero.

      Then its velocity doesn't change and it doesn't start, or stop, turning. Most AS problems are about objects at rest.

  - type: explain
    title: What each condition rules out
    body: |
      | Condition | Without it, the object… |
      | --- | --- |
      | no resultant force | accelerates: its centre of gravity speeds up, slows down or changes direction |
      | no resultant torque | starts to rotate, or changes how fast it rotates |

      For forces in one plane, "no resultant force" is two checks: total force left = total force right, and total force up = total force down.

  - type: intuition
    title: Two ways to fail
    body: |
      - A **couple**: resultant force zero, resultant torque not zero. It spins.
      - A single push **through the centre of gravity**: no torque about G, but a resultant force. It accelerates without turning.

      Equilibrium needs both boxes ticked.

  - type: check
    questions: [equilibrium-cloze, which-equilibrium]

  - type: explain
    title: Using both conditions together
    body: |
      Two unknown forces? Use one condition for each:

      1. Take moments about the point where one unknown force acts. That force has no moment there, so it drops out.
      2. Solve for the other unknown.
      3. Use "no resultant force" (total up = total down) to find the first one.

  - type: diagram
    diagram: phys-equilibrium-forces-plank
    alt: >-
      A uniform plank 4.0 m long resting on two triangular supports, A at the left end and B at
      the right end, drawn to scale. Upward arrows at the ends are labelled R_A (the longer) and
      R_B (the shorter). A 600 N arrow points down 1.0 m from A, labelled person, and a 200 N
      arrow points down at the centre, 2.0 m from A, labelled plank, at its centre. Dimension
      arrows under the plank mark 1.0 m from A to the person, 1.0 m from the person to the
      centre, and 2.0 m from the centre to B.
    caption: Four forces, two unknowns, two conditions.

  - type: example
    title: A person on a plank
    problem: |
      A uniform plank $4.0\ \text{m}$ long, of weight $200\ \text{N}$, rests on supports at its ends A and B. A $600\ \text{N}$ person stands $1.0\ \text{m}$ from A.

      Find the support forces $R_A$ and $R_B$.
    steps:
      - |
        Moments about A, so $R_A$ drops out.

        Clockwise: $600 \times 1.0 + 200 \times 2.0 = 1000\ \text{N m}$. Anticlockwise: $R_B \times 4.0$.
      - |
        $4.0R_B = 1000$, so $R_B = 250\ \text{N}$.
      - |
        No resultant force: $R_A + R_B = 600 + 200 = 800\ \text{N}$, so $R_A = 800 - 250 = 550\ \text{N}$.
      - |
        Check with moments about B: $R_A \times 4.0 = 600 \times 3.0 + 200 \times 2.0 = 2200$, so $R_A = 550\ \text{N}$. ✓
    answer: |
      $R_A = 550\ \text{N}$ and $R_B = 250\ \text{N}$. The support nearer the person takes more of the load.

  - type: check
    questions: [bench-legs, plank-spot-error]

  - type: misconceptions
    items:
      - wrong: If the forces balance, the object is in equilibrium.
        right: Only if the moments balance too. A couple has balanced forces and still spins things up.
      - wrong: You have to take moments about the pivot or a support.
        right: For an object in equilibrium, any point works. Choose the one that removes the most unknowns.
      - wrong: The plank's own weight can be ignored; only the load matters.
        right: A uniform plank's weight acts at its midpoint and has a moment about each support. Leave it out and both answers are wrong.

  - type: check
    questions: [diving-board]

  - type: deeper
    title: Why "about any point" is safe
    body: |
      When the resultant force is zero, the resultant moment comes out the same about every point (just as a couple's torque does). So if it's zero about one point, it's zero about all of them.

      That's why you're free to pick whichever point makes the algebra easiest.

  - type: exam
    body: |
      - **State the conditions for equilibrium**: *resultant force is zero* and *resultant torque (moment) is zero*. One mark each; "the forces balance" alone is incomplete.
      - In calculations, examiners look for a full moments equation (every force, every distance) and a correct force balance. Show both.
      - If you have time, check with moments about the other support. It catches most slips.

  - type: takeaways
    items:
      - "Equilibrium needs both: no resultant force and no resultant torque."
      - A couple has no resultant force but is not in equilibrium.
      - Take moments about an unknown force to make it vanish, then balance the forces.
      - Don't forget the object's own weight at its centre of gravity.

questions:
  - id: equilibrium-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      An object is in equilibrium when the resultant force on it is {{1}} and the resultant {{2}} on it is also zero.
    blanks:
      - accept: [zero, "0"]
      - accept: [torque, moment, turning effect, moment of force, torques, moments]
    explanation: |
      Equilibrium needs **zero** resultant force (no linear acceleration) and zero resultant **torque** (no change in rotation).

  - id: which-equilibrium
    format: mcq
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      Which of these objects is in equilibrium?
    options:
      - text: A skydiver falling at constant (terminal) velocity, without spinning
        correct: true
        why: Correct. Constant velocity and no change in rotation, so the resultant force and the resultant torque are both zero.
      - text: A ball at the top of its flight, momentarily at rest
        why: Its weight is unbalanced, so it's accelerating at $g$. Being at rest for an instant isn't equilibrium.
      - text: A car going round a bend at a steady speed
        why: Its direction is changing, so it's accelerating. There's a resultant force towards the centre of the bend.
      - text: A bicycle wheel spinning faster and faster on a fixed axle
        why: Its centre doesn't move, but there's a resultant torque making the spin speed up.
    explanation: |
      Equilibrium means no resultant force **and** no resultant torque: constant velocity (often zero) and no change in rotation. Only the skydiver at terminal velocity qualifies.

  - id: bench-legs
    format: numeric
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      A uniform bench $2.4\ \text{m}$ long, of weight $150\ \text{N}$, stands on two legs, one at each end. A $500\ \text{N}$ person sits $0.60\ \text{m}$ from the left leg.

      Find the upward force from each leg.
    fields:
      - label: "left leg ="
        answer: 450
        tolerance: { abs: 0.5 }
        unit: N
      - label: "right leg ="
        answer: 200
        tolerance: { abs: 0.5 }
        unit: N
    explanation: |
      Moments about the left leg: $R_{\text{right}} \times 2.4 = 500 \times 0.60 + 150 \times 1.2 = 480$, so $R_{\text{right}} = 200\ \text{N}$. Forces: $R_{\text{left}} = 500 + 150 - 200 = 450\ \text{N}$.

  - id: plank-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      A uniform plank $5.0\ \text{m}$ long, of weight $300\ \text{N}$, rests on supports at its ends P and Q. A $500\ \text{N}$ load sits $2.0\ \text{m}$ from P.

      A student finds the support forces. Which line contains the first error?
    lines:
      - |
        Take moments about P, so the force at P has no moment.
      - |
        Clockwise moments about P $= 500 \times 2.0 = 1000\ \text{N m}$
      - |
        Anticlockwise moment about P $= R_Q \times 5.0$, so $R_Q = 200\ \text{N}$
      - |
        Forces: $R_P = 500 + 300 - 200 = 600\ \text{N}$
    errorLine: 2
    fix: |
      The plank's weight also has a clockwise moment about P: $500 \times 2.0 + 300 \times 2.5 = 1750\ \text{N m}$. So $R_Q = 350\ \text{N}$ and $R_P = 800 - 350 = 450\ \text{N}$.
    explanation: |
      The student remembered the plank's weight in the force balance (line 4) but forgot its moment (line 2). A uniform plank's weight acts at its midpoint, $2.5\ \text{m}$ from P.

  - id: diving-board
    format: numeric
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      A uniform diving board is $4.0\ \text{m}$ long and weighs $300\ \text{N}$. It is held down by a bolt at end A and rests on a support $1.0\ \text{m}$ from A.

      A $600\ \text{N}$ diver stands at the other end. Find the downward force from the bolt and the upward force from the support.
    fields:
      - label: "bolt (downwards) ="
        answer: 2100
        tolerance: { abs: 1 }
        unit: N
      - label: "support (upwards) ="
        answer: 3000
        tolerance: { abs: 1 }
        unit: N
    explanation: |
      Take moments about the support, so its force drops out. Clockwise moments are $600 \times 3.0 = 1800\ \text{N m}$ from the diver and $300 \times 1.0 = 300\ \text{N m}$ from the board's weight.

      Anticlockwise moment from the bolt is $F \times 1.0$, so $F = 2100\ \text{N}$ downwards. Balancing vertical forces gives a support force of $600 + 300 + 2100 = 3000\ \text{N}$ upwards.

      Short lever arms mean huge forces.
