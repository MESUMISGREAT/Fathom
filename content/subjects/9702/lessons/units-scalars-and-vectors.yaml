id: units-scalars-and-vectors
subject: "9702"
topic: "1.4"
title: Scalars and vectors
summary: A scalar has magnitude only; a vector has magnitude and direction, and that one difference changes how quantities combine.
order: 1
minutes: 4
objectives: ["1.4.1"]
prerequisites: [units-quantities-and-estimates]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 1.4.1). Examples are taken from quantities in the syllabus's
    "Summary of key quantities, symbols and units". All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-19. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can explain the difference between scalar and vector quantities and sort the quantities in this syllabus into each group.

  - type: definition
    term: Scalar quantity
    body: |
      A quantity that has **magnitude only**, for example mass, time or energy.

  - type: definition
    term: Vector quantity
    body: |
      A quantity that has both **magnitude and direction**, for example displacement, velocity or force.

  - type: intuition
    title: Directions need a direction
    body: |
      "Walk 300 m" isn't much use as directions. "Walk 300 m north" is. The distance (300 m) is a scalar; the displacement (300 m north) is a vector. Draw a vector as an **arrow**: its length shows the magnitude, its direction shows… the direction.

  - type: explain
    title: Which is which?
    body: |
      | Scalars (magnitude only) | Vectors (magnitude and direction) |
      | --- | --- |
      | distance | displacement |
      | speed | velocity |
      | mass | weight (a force) |
      | time | acceleration |
      | energy, work done | force (tension, friction, drag, upthrust…) |
      | power | momentum |
      | pressure | electric field strength |
      | density, volume | gravitational field strength |
      | temperature | |
      | charge, current, potential difference, resistance | |

      Learn the **pairs** in the first three rows: they are the favourite exam traps.

  - type: check
    questions: [only-vectors, vector-partners]

  - type: explain
    title: Signs in one dimension
    body: |
      Along a straight line, a **sign** is enough to show direction. Choose one direction as positive: a velocity of $-4\ \text{m s}^{-1}$ means 4 m s⁻¹ in the negative direction.

      A minus sign on a **scalar** means something different. A temperature of $-5\ °\text{C}$ or a charge of $-1.6 \times 10^{-19}\ \text{C}$ has no direction; the sign just tells you which side of zero it is.

  - type: check
    questions: [negative-scalar]

  - type: misconceptions
    items:
      - wrong: Pressure is a vector, because it pushes in a direction.
        right: Pressure is a **scalar**. The **force** it produces on a surface is a vector, acting at right angles to that surface.
      - wrong: Anything that can be negative is a vector.
        right: Many scalars can be negative (temperature in °C, charge, work done). A vector is defined by having a direction.
      - wrong: Mass and weight are the same thing.
        right: Mass (kg) is a scalar. Weight is a force (N), so it is a vector acting towards the centre of the Earth.

  - type: deeper
    title: Why current counts as a scalar
    body: |
      Charge flows one way along a wire, so current sounds like a vector. But currents meeting at a junction combine by **simple addition** (2 A + 3 A in gives 5 A out), whatever the angles between the wires. Vectors don't add like that, so current is treated as a scalar.

  - type: exam
    body: |
      - Paper 1 classic: "Which list contains only vector (or only scalar) quantities?" Check every item: a single wrong one rules the option out.
      - "State the difference between a scalar and a vector": scalars have magnitude only; vectors have magnitude **and direction**. Both halves are needed.

  - type: check
    questions: [which-scalar, lap-of-track]

  - type: takeaways
    items:
      - Scalar = magnitude only. Vector = magnitude and direction.
      - "Pairs to learn: distance/displacement, speed/velocity, mass/weight."
      - Pressure, energy, power and current are scalars.
      - A minus sign does not make something a vector.

questions:
  - id: only-vectors
    format: mcq
    difficulty: 1
    objectives: ["1.4.1"]
    prompt: |
      Which list contains **only** vector quantities?
    options:
      - text: displacement, acceleration, weight
        correct: true
        why: Correct. Each has a direction. Weight is a force acting towards the centre of the Earth.
      - text: velocity, mass, force
        why: Mass is a scalar.
      - text: momentum, kinetic energy, force
        why: Kinetic energy is a scalar, even though velocity is a vector. Energy has no direction.
      - text: speed, displacement, acceleration
        why: Speed is a scalar. Its vector partner is velocity.
    explanation: |
      Check each item in turn; one scalar in a list rules it out.

  - id: vector-partners
    format: cloze
    difficulty: 1
    objectives: ["1.4.1"]
    prompt: |
      Speed is a scalar; its vector partner is {{1}}. Distance is a scalar; its vector partner is {{2}}.
    blanks:
      - accept: [velocity]
      - accept: [displacement]
    explanation: |
      Velocity is speed in a stated direction. Displacement is the distance in a straight line from start to finish, in a stated direction.

  - id: which-scalar
    format: mcq
    difficulty: 2
    objectives: ["1.4.1"]
    prompt: |
      Which of these is a **scalar** quantity?
    options:
      - text: pressure
        correct: true
        why: Correct. Pressure has magnitude only. The force it causes on a surface is the vector.
      - text: weight
        why: Weight is a force, so it has a direction (towards the centre of the Earth).
      - text: momentum
        why: Momentum is mass × velocity, and velocity has a direction, so momentum is a vector.
      - text: electric field strength
        why: Electric field strength is the force per unit charge, so it has a direction.
    explanation: |
      Pressure is the trap: it acts on surfaces facing any direction, but it is a scalar.

  - id: lap-of-track
    format: explain
    difficulty: 2
    objectives: ["1.4.1"]
    prompt: |
      An athlete runs exactly one lap of a 400 m track in 50 s and finishes where she started. Explain why her average speed is $8.0\ \text{m s}^{-1}$ but her average velocity is zero.
    model: |
      Average speed is total **distance** ÷ time $= 400 / 50 = 8.0\ \text{m s}^{-1}$. Distance is a scalar: it counts the whole path. Average velocity is **displacement** ÷ time. Displacement is a vector, the straight-line change in position from start to finish. She finishes where she started, so her displacement is zero and her average velocity is zero.
    keyPoints:
      - Average speed = distance ÷ time = 400 ÷ 50 = 8.0 m s⁻¹
      - Distance (scalar) is the total length of the path
      - Average velocity = displacement ÷ time
      - Displacement (vector) from start to finish is zero, so average velocity is zero
    explanation: |
      Speed and distance ignore direction; velocity and displacement don't.

  - id: negative-scalar
    format: text
    style: one-line
    difficulty: 2
    objectives: ["1.4.1"]
    prompt: |
      Name one **scalar** quantity that can have a negative value.
    accept:
      - temperature
      - Celsius temperature
      - temperature in °C
      - temperature in degrees Celsius
      - charge
      - electric charge
      - work
      - work done
      - potential energy
      - gravitational potential energy
      - electric potential
      - gravitational potential
      - potential
      - potential difference
    model: |
      For example **charge** (an electron's is $-1.6 \times 10^{-19}\ \text{C}$) or **temperature in °C** ($-5\ °\text{C}$ on a cold day).
    explanation: |
      A negative sign on a scalar shows which side of zero it is, not a direction. So "it can be negative" is never a reason to call something a vector.
