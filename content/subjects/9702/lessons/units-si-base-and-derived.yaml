id: units-si-base-and-derived
subject: "9702"
topic: "1.2"
title: SI base units and derived units
summary: Five SI base units (kg, m, s, A, K) build every other unit you need, by following each quantity's defining equation.
order: 1
minutes: 5
objectives: ["1.2.1", "1.2.2"]
prerequisites: [units-quantities-and-estimates]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcomes 1.2.1 and 1.2.2, and the "Summary of key quantities, symbols and
    units" for the base quantities and usual units). Derived-unit expansions checked by hand. All
    questions are original.
blocks:
  - type: objective
    body: |
      By the end you can recall the five SI base quantities and their units, and write any derived unit in this syllabus as a product or quotient of base units.

  - type: explain
    title: The five base units you must know
    body: |
      The SI (Système International) system builds everything from a few **base quantities**. You need these five:

      | Base quantity | Unit | Symbol |
      | --- | --- | --- |
      | mass | kilogram | kg |
      | length | metre | m |
      | time | second | s |
      | electric current | ampere | A |
      | (thermodynamic) temperature | kelvin | K |

      Two things to notice:

      - The base unit of mass is the **kilogram**, not the gram. It is the only base unit with a prefix built in.
      - The base unit of temperature is the **kelvin**. The degree Celsius is not an SI base unit.

  - type: definition
    term: SI base units
    body: |
      The units of the base quantities: kilogram (kg), metre (m), second (s), ampere (A) and kelvin (K). Every other SI unit is defined as a product or quotient of these.

  - type: check
    questions: [which-base-unit, base-unit-names]

  - type: explain
    title: "Derived units: follow the defining equation"
    body: |
      Every other unit is **derived** from the base units. The method always works:

      1. Write the quantity's **defining equation** in words (e.g. force = mass × acceleration).
      2. Replace each quantity with its **base units**.
      3. Tidy up the powers.

      | Quantity | Defining equation | Named unit | In base units |
      | --- | --- | --- | --- |
      | velocity | displacement ÷ time | | m s⁻¹ |
      | acceleration | change in velocity ÷ time | | m s⁻² |
      | force | mass × acceleration | newton, N | kg m s⁻² |
      | momentum | mass × velocity | (N s) | kg m s⁻¹ |
      | work, energy | force × distance | joule, J | kg m² s⁻² |
      | power | energy ÷ time | watt, W | kg m² s⁻³ |
      | pressure | force ÷ area | pascal, Pa | kg m⁻¹ s⁻² |
      | density | mass ÷ volume | | kg m⁻³ |
      | charge | current × time | coulomb, C | A s |
      | potential difference | energy ÷ charge | volt, V | kg m² s⁻³ A⁻¹ |
      | frequency | 1 ÷ period | hertz, Hz | s⁻¹ |

  - type: example
    title: The volt in base units
    problem: |
      Express the volt in SI base units.
    steps:
      - |
        Defining equation: potential difference $=$ energy transferred $\div$ charge, so $\text{V} = \text{J}\ \text{C}^{-1}$.
      - |
        Energy: $\text{J} = \text{N m} = (\text{kg m s}^{-2})(\text{m}) = \text{kg m}^2\ \text{s}^{-2}$.
      - |
        Charge: $Q = It$, so $\text{C} = \text{A s}$.
      - |
        Divide: $\dfrac{\text{kg m}^2\ \text{s}^{-2}}{\text{A s}} = \text{kg m}^2\ \text{s}^{-3}\ \text{A}^{-1}$.
    answer: |
      $\text{V} = \text{kg m}^2\ \text{s}^{-3}\ \text{A}^{-1}$

  - type: check
    questions: [pascal-base-units, joule-spot-error]

  - type: intuition
    title: Units obey algebra
    body: |
      Units multiply, divide and cancel exactly like algebra symbols: $\text{m s}^{-1} \times \text{s} = \text{m}$. Named units such as N, J and W are just **nicknames** for bundles of base units. A joule really *is* a $\text{kg m}^2\ \text{s}^{-2}$, in the same way a dozen really is twelve.

  - type: misconceptions
    items:
      - wrong: The newton is a base unit because it is so common.
        right: |
          The newton is **derived**: $1\ \text{N} = 1\ \text{kg m s}^{-2}$.
      - wrong: The base unit of mass is the gram.
        right: It is the **kilogram**. When you convert to base units, masses go in kg.
      - wrong: Writing "ms⁻¹" for metres per second is fine.
        right: |
          Put a space: "m s⁻¹". Without it, "ms⁻¹" reads as "per millisecond".

  - type: exam
    body: |
      - "Express … in SI base units" means the final answer may contain **only** kg, m, s, A and K. An answer that still contains N or J scores nothing.
      - Show the defining equation you used. That is often a mark on its own.
      - Write units in the Cambridge style, with negative powers: kg m⁻³ rather than kg/m³.

  - type: check
    questions: [motor-power, ohm-base-units]

  - type: takeaways
    items:
      - "Base units: kg, m, s, A, K. (Mass in **kilograms**, temperature in **kelvin**.)"
      - Derived units come from defining equations; substitute base units and simplify the powers.
      - N, J, W, Pa, C, V and Ω are shorthand for combinations of base units.
      - '"In SI base units" means no named derived units left in the answer.'

questions:
  - id: which-base-unit
    format: mcq
    difficulty: 1
    objectives: ["1.2.1"]
    prompt: |
      Which of these is an SI base unit?
    options:
      - text: kelvin
        correct: true
        why: Correct. The kelvin is the base unit of thermodynamic temperature.
      - text: newton
        why: The newton is derived from $F = ma$, so $\text{N} = \text{kg m s}^{-2}$.
      - text: gram
        why: The base unit of mass is the kilogram, not the gram.
      - text: coulomb
        why: The coulomb is derived from $Q = It$, so $\text{C} = \text{A s}$.
      - text: degree Celsius
        why: The base unit of temperature is the kelvin. The Celsius scale is defined from it.
    explanation: |
      The five SI base units you need are the kilogram, metre, second, ampere and kelvin. Everything else is derived from them.

  - id: base-unit-names
    format: cloze
    difficulty: 1
    objectives: ["1.2.1"]
    prompt: |
      The SI base unit of electric current is the {{1}}, and the SI base unit of temperature is the {{2}}.
    blanks:
      - accept: [ampere, amp, A, amperes, amps]
      - accept: [kelvin, K, kelvins]
    explanation: |
      Current is measured in amperes (A) and thermodynamic temperature in kelvin (K). Note: not "degrees kelvin", just kelvin.

  - id: pascal-base-units
    format: numeric
    difficulty: 2
    objectives: ["1.2.2"]
    prompt: |
      Pressure is force ÷ area. The pascal can be written in SI base units as $\text{kg}^{a}\ \text{m}^{b}\ \text{s}^{c}$. Find $a$, $b$ and $c$.
    fields:
      - label: "$a =$"
        answer: 1
      - label: "$b =$"
        answer: -1
      - label: "$c =$"
        answer: -2
    explanation: |
      $\text{Pa} = \dfrac{\text{N}}{\text{m}^2} = \dfrac{\text{kg m s}^{-2}}{\text{m}^2} = \text{kg m}^{-1}\ \text{s}^{-2}$, so $a = 1$, $b = -1$, $c = -2$.

  - id: joule-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["1.2.2"]
    prompt: |
      A student expresses the joule in SI base units. Which line contains the first error?
    lines:
      - |
        Work done $=$ force $\times$ distance moved in the direction of the force.
      - |
        Unit of force: $\text{N} = \text{kg m s}^{-1}$
      - |
        Unit of work: $\text{kg m s}^{-1} \times \text{m}$
      - |
        So $\text{J} = \text{kg m}^2\ \text{s}^{-1}$
    errorLine: 2
    fix: |
      From $F = ma$, the newton is $\text{kg} \times \text{m s}^{-2} = \text{kg m s}^{-2}$. Then $\text{J} = \text{kg m s}^{-2} \times \text{m} = \text{kg m}^2\ \text{s}^{-2}$.
    explanation: |
      The student used the unit of **velocity** (m s⁻¹) instead of **acceleration** (m s⁻²) in $F = ma$. Lines 3 and 4 are then wrong only because they carry that error forward. ($\text{kg m s}^{-1}$ is actually the unit of momentum.)

  - id: motor-power
    format: numeric
    difficulty: 1
    objectives: ["1.2.2"]
    prompt: |
      An electric motor transfers 4500 J of energy in 30 s. Calculate its power. Give your answer with its unit.
    fields:
      - answer: 150
        acceptUnits: ["W"]
    explanation: |
      Power $=$ energy $\div$ time $= 4500 \div 30 = 150\ \text{W}$. The watt is a joule per second, so $\text{J s}^{-1}$ is also correct. Writing "J" alone is not.

  - id: ohm-base-units
    format: numeric
    difficulty: 3
    objectives: ["1.2.2"]
    prompt: |
      Resistance is potential difference ÷ current. Write the ohm in SI base units as $\text{kg}^{a}\ \text{m}^{b}\ \text{s}^{c}\ \text{A}^{d}$. Find $a$, $b$, $c$ and $d$.
    fields:
      - label: "$a =$"
        answer: 1
      - label: "$b =$"
        answer: 2
      - label: "$c =$"
        answer: -3
      - label: "$d =$"
        answer: -2
    explanation: |
      From the worked example, $\text{V} = \text{kg m}^2\ \text{s}^{-3}\ \text{A}^{-1}$. Dividing by current (A):
      $\Omega = \dfrac{\text{kg m}^2\ \text{s}^{-3}\ \text{A}^{-1}}{\text{A}} = \text{kg m}^2\ \text{s}^{-3}\ \text{A}^{-2}$.
