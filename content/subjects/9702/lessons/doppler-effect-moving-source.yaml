id: doppler-effect-moving-source
subject: "9702"
topic: "7.3"
title: "The Doppler effect: a moving source"
summary: Why an ambulance siren drops in pitch as it passes you, and what is actually changing in the sound.
order: 1
minutes: 9
kind: core
objectives: ["7.3.1"]
prerequisites: [progressive-waves-what-is-a-wave, progressive-waves-key-terms, progressive-waves-wave-equation]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
