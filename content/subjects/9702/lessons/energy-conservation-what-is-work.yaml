blocks:
  - type: objective
    body: |
      By the end you can explain what **work** means in physics, calculate
      $W = Fs$ for a force that acts along the motion, and give the answer in
      **joules (J)**.

  - type: explain
    title: Effort is not work
    body: |
      Holding a heavy box still feels like hard work, but in physics you have
      done **no work** on it: you have not moved it.

      In physics, **work** is energy transferred by a force when the force
      **moves its point of application** — the place where the force acts.

      Push a trolley along a corridor and you have done work on it: the push
      moved with the trolley, and energy has been transferred to it.

  - type: definition
    term: Work done by a force
    body: |
      The work done by a force is the force multiplied by the distance moved
      **in the direction of the force**:

      $$W = Fs$$

      $F$ is the size of the force, $s$ is the distance moved along the
      direction of the force, and $W$ is the energy transferred.

      Unit: the **joule (J)**, where $1\ \text{J} = 1\ \text{N m}$.

  - type: explain
    title: Reading the formula
    body: |
      - $F$ is the force **doing** the work, in newtons (N).
      - $s$ is how far the object moves **while that force acts**, in metres (m) —
        measured **along** the force, not sideways.
      - $W$ is the energy transferred, in joules (J).

      Work is a way of counting energy: do $120\ \text{J}$ of work on a trolley
      and you have transferred $120\ \text{J}$ of energy to it.

      The unit $1\ \text{N m}$ is given its own name, $1\ \text{J}$, because
      work is an energy transfer.

  - type: diagram
    diagram: phys-energy-conservation-work-done
    alt: >-
      A crate on a floor, pushed by a horizontal force F of 45 N. A long arrow
      labelled "distance moved, s = 6.0 m" runs along the floor in the direction
      of the push. Below, the calculation W = F s = 45 N × 6.0 m = 270 J. Beside
      it, a small panel shows a person pressing on a solid wall that does not
      move, labelled s = 0, so W = 0 J.
    caption: Work = force × distance moved **along** the force. No movement, no work.

  - type: example
    title: "Easy one first: a crate along a corridor"
    problem: |
      A cleaner pushes a crate with a steady horizontal force of
      $45\ \text{N}$, and the crate slides $6.0\ \text{m}$ straight ahead.
      How much work does the cleaner do?
    steps:
      - |
        The push is horizontal and the crate moves horizontally, so the force
        and the motion are in the same direction: $s = 6.0\ \text{m}$.
      - |
        $$W = Fs = 45\ \text{N} \times 6.0\ \text{m} = 270\ \text{J}$$
      - |
        Sanity check: pushing twice as far should transfer twice the energy.
        $45\ \text{N} \times 12\ \text{m} = 540\ \text{J}$, which is indeed
        $2 \times 270\ \text{J}$.
    answer: |
      $270\ \text{J}$ of energy has been transferred to the crate (mostly to its
      store of kinetic energy, and a little to thermal energy in the floor).

  - type: check
    title: Quick check
    questions: [work-definition-cloze, crate-work, holding-box]

  - type: misconceptions
    items:
      - wrong: Holding a heavy bag still is doing work.
        right: |
          The bag does not move, so its point of application does not move.
          No displacement means **no work**, however tired your arm is.
      - wrong: Work and effort are the same thing.
        right: |
          Work is energy **transferred by a force that moves** something. If a
          force holds something still, it transfers no energy, so it does no work.
      - wrong: You can use any distance the object has ever travelled.
        right: |
          Use only the distance moved **while the force acts**. If the object
          coasts 20 m after you stop pushing, those 20 m contribute no work
          from your push.
      - wrong: The unit of work is the newton.
        right: |
          The newton is a unit of **force**. Work is force × distance, so its
          unit is the newton metre, the **joule (J)**.

  - type: exam
    body: |
      - "State what is meant by work" (1 mark): a force must **move** something —
        say *a force moving its point of application* or *force × distance moved in
        the direction of the force*.
      - In calculations, always write the equation, substitute with units, then
        give the answer with the unit. A missing unit often loses the last mark.
      - Distances often arrive in cm or km. **Convert to metres first**, or the
        answer will be out by powers of 100 or 1000.

  - type: check
    title: Check yourself
    questions: [crane-work, cm-to-metres]
  - type: takeaways
    items:
      - Work is done when a force **moves its point of application**.
      - >-
        $W = Fs$: force × distance moved **along** the force, in joules (J).
      - $1\ \text{J} = 1\ \text{N m}$.
      - A force that holds something still does no work, however big it is.

questions:
  - id: work-definition-cloze
    format: cloze
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      The work done by a force is the size of the force multiplied by the
      {{1}} moved in the {{2}} of the force.
    blanks:
      - accept: [distance, distance moved, displacement, distance travelled]
      - accept: [direction, same direction]
    explanation: |
      Work = force × distance moved **in the direction of the force**. Both parts
      matter: the size of the force and the distance it moves the object.

  - id: crate-work
    format: numeric
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      A worker pushes a crate with a horizontal force of $45\ \text{N}$ and the
      crate moves $6.0\ \text{m}$ along the floor in the same direction.

      What is the work done by the worker?
    fields:
      - answer: 270
        tolerance: { abs: 0.5 }
        unit: J
    explanation: |
      $W = Fs = 45 \times 6.0 = 270\ \text{J}$. Force and displacement are in the
      same direction, so the whole force does work.

  - id: holding-box
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      In which situation does the force mentioned do **no** work?
    options:
      - text: A girl holds a heavy box still in her arms
        correct: true
        why: |
          The box does not move, so there is no displacement. Work needs a force
          that moves its point of application.
      - text: A boy pushes a trolley $5\ \text{m}$ along a corridor
        why: |
          The push moves with the trolley, so work is done: $W = F \times 5$.
      - text: A crane lifts a load $3\ \text{m}$ upwards
        why: |
          The lifting force moves the load upwards, so it does work against
          gravity.
      - text: A rope pulls a sledge along the snow
        why: |
          The pull moves the sledge, so the rope does work on it.
    explanation: |
      Work needs both a force and a distance moved along that force. Holding
      something still gives no displacement, so no work is done on it.

  - id: crane-work
    format: numeric
    difficulty: 2
    objectives: ["5.1.1"]
    prompt: |
      A crane lifts a load of weight $850\ \text{N}$ straight up through
      $12\ \text{m}$ at a steady speed.

      How much work does the **lifting force** do on the load?
    fields:
      - answer: 10200
        tolerance: { abs: 20 }
        unit: J
    explanation: |
      The lifting force balances the weight, so it is $850\ \text{N}$ upwards, and
      it acts through $12\ \text{m}$ upwards: $W = Fs = 850 \times 12 = 10\,200\ \text{J}$.

      (Lifting at a steady speed means the lifting force equals the weight —
      topic 3.5's idea that forces balance when the velocity is constant.)

  - id: cm-to-metres
    format: spot-error
    difficulty: 2
    objectives: ["5.1.1"]
    prompt: |
      A student calculates the work done by a $60\ \text{N}$ force that pushes a
      box $45\ \text{cm}$ in the direction of the force. Which line contains the
      first error?
    lines:
      - "Step 1: W = F × s"
      - "Step 2: F = 60 N, s = 45 cm"
      - "Step 3: W = 60 × 45 = 2700"
      - "Step 4: W = 2700 J"
    errorLine: 3
    fix: |
      Convert the distance to metres **before** multiplying: $s = 0.45\ \text{m}$,
      so $W = 60 \times 0.45 = 27\ \text{J}$.
    explanation: |
      The formula needs SI units. Using 45 instead of 0.45 makes the answer 100
      times too large — the classic lost mark in work calculations.
