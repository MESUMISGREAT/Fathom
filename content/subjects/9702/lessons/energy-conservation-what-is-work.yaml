id: energy-conservation-what-is-work
subject: "9702"
topic: "5.1"
title: "Work: the energy a force transfers when it moves something"
summary: Work is done only when a force moves its point of application; work done = force × distance moved along the force, measured in joules.
order: 1
minutes: 4
kind: core
objectives: ["5.1.1"]
prerequisites: []
