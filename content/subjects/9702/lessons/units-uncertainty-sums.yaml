id: units-uncertainty-sums
subject: "9702"
topic: "1.3"
title: Uncertainty in sums and differences
summary: Write a measurement as value ± absolute uncertainty, convert to a percentage, and add absolute uncertainties whenever quantities are added or subtracted.
order: 3
minutes: 5
objectives: ["1.3.3"]
prerequisites: [units-precision-and-accuracy]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 1.3.3, "simple addition of absolute or percentage uncertainties",
    plus the Paper 3 expectations on absolute and percentage uncertainty and on taking half the
    range of repeated readings). All numerical results checked by calculation. All questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-19. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can write a measurement with its **absolute** and **percentage uncertainty**, estimate the uncertainty from repeated readings, and find the uncertainty in a **sum or difference**.

  - type: explain
    title: Value ± uncertainty
    body: |
      No measurement is exact, so we give a range:

      $$l = (25.0 \pm 0.1)\ \text{cm}$$

      This says the true length very probably lies between 24.9 cm and 25.1 cm.

      - Give the uncertainty to **1 significant figure** (2 at most).
      - Round the value to the **same decimal place** as the uncertainty: $(25.0 \pm 0.1)$ cm, not $(25.03 \pm 0.1)$ cm.

  - type: definition
    term: Absolute uncertainty
    body: |
      The size of the range either side of the measured value within which the true value is expected to lie, $\Delta x$. It has the **same unit** as the quantity.

  - type: definition
    term: Percentage uncertainty
    body: |
      The absolute uncertainty as a percentage of the measured value:
      $$\text{percentage uncertainty} = \frac{\Delta x}{x} \times 100\%$$
      Without the $\times 100\%$, $\dfrac{\Delta x}{x}$ is the **fractional uncertainty**. Neither has a unit.

  - type: explain
    title: Where does Δx come from?
    body: |
      - **A single reading:** usually the smallest scale division of the instrument (sometimes half of it, if you can read between the marks reliably).
      - **Repeated readings:** use the **mean** as the value and **half the range** as the uncertainty:
      $$\Delta x = \frac{x_{\max} - x_{\min}}{2}$$

  - type: example
    title: Uncertainty from repeated readings
    problem: |
      Four timings of a trolley's run are 2.34 s, 2.38 s, 2.30 s and 2.38 s. Write the time with its absolute and percentage uncertainty.
    steps:
      - |
        Mean: $\dfrac{2.34 + 2.38 + 2.30 + 2.38}{4} = \dfrac{9.40}{4} = 2.35\ \text{s}$.
      - |
        Range: $2.38 - 2.30 = 0.08\ \text{s}$, so half the range is $0.04\ \text{s}$.
      - |
        Percentage uncertainty: $\dfrac{0.04}{2.35} \times 100\% = 1.7\%$.
    answer: |
      $t = (2.35 \pm 0.04)\ \text{s}$, a percentage uncertainty of about 2%.

  - type: check
    questions: [percentage-uncertainty, half-range]

  - type: explain
    title: "Rule 1: adding or subtracting? Add the absolute uncertainties"
    body: |
      If $y = a + b$ **or** $y = a - b$, then

      $$\Delta y = \Delta a + \Delta b$$

      Yes, you **add** even when you subtract the values. In the worst case $a$ is at the top of its range while $b$ is at the bottom, and the two uncertainties pile up.

  - type: example
    title: A temperature rise
    problem: |
      Water warms from $(21.5 \pm 0.5)\ °\text{C}$ to $(34.0 \pm 0.5)\ °\text{C}$. Find the temperature rise with its absolute and percentage uncertainty.
    steps:
      - |
        Rise: $34.0 - 21.5 = 12.5\ °\text{C}$.
      - |
        It's a difference, so add the absolute uncertainties: $0.5 + 0.5 = 1.0\ °\text{C}$.
      - |
        Percentage uncertainty: $\dfrac{1.0}{12.5} \times 100\% = 8\%$.
    answer: |
      $\Delta\theta = (12.5 \pm 1.0)\ °\text{C}$, or $8\%$. Each thermometer reading was only about 2% uncertain, but the difference is 8% uncertain.

  - type: check
    questions: [difference-mcq, spring-extension]

  - type: deeper
    title: Why small differences are risky
    body: |
      Subtracting two **nearly equal** values keeps the absolute uncertainties but shrinks the value. Take two lengths of $(50.2 \pm 0.1)$ cm and $(49.8 \pm 0.1)$ cm. Their difference is $(0.4 \pm 0.2)$ cm, a **50%** uncertainty, from readings that were each only 0.2% uncertain. Good experiments are designed so that the quantity you need is not a small difference between two large readings.

  - type: misconceptions
    items:
      - wrong: For a difference, subtract the uncertainties.
        right: Always **add** absolute uncertainties, for differences as well as sums.
      - wrong: For a sum, add the percentage uncertainties.
        right: For sums and differences, add **absolute** uncertainties. Percentages are for products and quotients.
      - wrong: "$(12.53 \\pm 1)\\ °\\text{C}$ is a fine way to write it."
        right: Match the decimal places. With an uncertainty of 1 °C the value is $(13 \pm 1)\ °\text{C}$; with 1.0 °C it is $(12.5 \pm 1.0)\ °\text{C}$.

  - type: exam
    body: |
      - Uncertainty calculations appear in Paper 1, Paper 2 and both practical papers.
      - Show every step: the absolute uncertainties, the rule you used, and the conversion to a percentage.
      - Percentage uncertainty has no unit. Absolute uncertainty has the same unit as the value.

  - type: check
    questions: [temperature-spot-error]

  - type: takeaways
    items:
      - Write measurements as (value ± absolute uncertainty) unit, with matching decimal places.
      - Percentage uncertainty = Δx ÷ x × 100%; fractional uncertainty = Δx ÷ x.
      - For repeated readings, take the mean and half the range.
      - Sums **and** differences, add the **absolute** uncertainties.
      - A small difference between two large readings has a large percentage uncertainty.

questions:
  - id: percentage-uncertainty
    format: numeric
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |
      A length is recorded as $(25.0 \pm 0.5)\ \text{cm}$. What is its percentage uncertainty?
    fields:
      - answer: 2
        unit: "%"
    explanation: |
      $\dfrac{0.5}{25.0} \times 100\% = 2\%$. A percentage uncertainty has no unit apart from the % sign, because the centimetres cancel.

  - id: half-range
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |
      Four repeated measurements of the time for ten oscillations are 19.3 s, 18.7 s, 19.5 s and 18.9 s. Find the mean time and its absolute uncertainty.
    fields:
      - label: "mean ="
        answer: 19.1
        tolerance: { abs: 0.01 }
        unit: s
      - label: "uncertainty = ±"
        answer: 0.4
        tolerance: { abs: 0.01 }
        unit: s
    explanation: |
      Mean: $\dfrac{19.3 + 18.7 + 19.5 + 18.9}{4} = \dfrac{76.4}{4} = 19.1\ \text{s}$. Range: $19.5 - 18.7 = 0.8\ \text{s}$, so the uncertainty is half of that, $0.4\ \text{s}$. Result: $(19.1 \pm 0.4)\ \text{s}$.

  - id: difference-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |
      Two lengths are $(85.3 \pm 0.2)\ \text{cm}$ and $(24.6 \pm 0.1)\ \text{cm}$. What is the absolute uncertainty in their **difference**?
    options:
      - text: ±0.3 cm
        correct: true
        why: Correct. For a difference, add the absolute uncertainties, 0.2 + 0.1.
      - text: ±0.1 cm
        why: This subtracts the uncertainties. In the worst case they add up, so you always add.
      - text: ±0.2 cm
        why: Taking only the larger uncertainty ignores the uncertainty in the other length.
      - text: ±0.15 cm
        why: Averaging the uncertainties isn't a rule. For sums and differences, add them.
    explanation: |
      $\Delta(a - b) = \Delta a + \Delta b = 0.2 + 0.1 = 0.3\ \text{cm}$. The difference is $(60.7 \pm 0.3)\ \text{cm}$.

  - id: spring-extension
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |
      A spring is $(12.4 \pm 0.1)\ \text{cm}$ long with no load and $(19.8 \pm 0.1)\ \text{cm}$ long when loaded. Calculate the extension and its absolute uncertainty.
    fields:
      - label: "extension ="
        answer: 7.4
        tolerance: { abs: 0.01 }
        unit: cm
      - label: "uncertainty = ±"
        answer: 0.2
        tolerance: { abs: 0.001 }
        unit: cm
    explanation: |
      Extension $= 19.8 - 12.4 = 7.4\ \text{cm}$. It's a difference, so add the absolute uncertainties: $0.1 + 0.1 = 0.2\ \text{cm}$. The extension is $(7.4 \pm 0.2)\ \text{cm}$, about 3% uncertain.

  - id: temperature-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |
      A student works out a temperature rise and its uncertainty. Which line contains the error?
    lines:
      - |
        Initial temperature: $\theta_1 = (18.0 \pm 0.5)\ °\text{C}$
      - |
        Final temperature: $\theta_2 = (45.0 \pm 0.5)\ °\text{C}$
      - |
        Rise: $\Delta\theta = 45.0 - 18.0 = 27.0\ °\text{C}$
      - |
        Uncertainty: $0.5 - 0.5 = 0$, so $\Delta\theta = (27.0 \pm 0)\ °\text{C}$
    errorLine: 4
    fix: |
      Add the absolute uncertainties: $0.5 + 0.5 = 1.0\ °\text{C}$, so $\Delta\theta = (27.0 \pm 1.0)\ °\text{C}$.
    explanation: |
      An uncertainty of zero should ring alarm bells: no measured quantity is exact. Even when values are subtracted, their uncertainties add.
