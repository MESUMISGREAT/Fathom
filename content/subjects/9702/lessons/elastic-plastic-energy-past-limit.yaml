id: elastic-plastic-energy-past-limit
subject: "9702"
topic: "6.2"
title: "Energy past the elastic limit: stored or lost?"
summary: The area under the graph is always the work done, but beyond the elastic limit only part of it comes back — the rest heats the material.
order: 5
minutes: 8
kind: core
objectives: ["6.2.2", "6.2.3", "6.2.4"]
