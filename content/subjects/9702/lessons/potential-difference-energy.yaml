title: Potential difference and energy transfer
summary: How potential difference relates to energy transfer in circuits. Deriving W = VQ = VIt, and applying to components and batteries.
order: 2
minutes: 5
objectives: ["9.2.2"]
prerequisites: ["potential-difference-definition"]
