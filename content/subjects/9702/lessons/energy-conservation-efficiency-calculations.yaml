id: energy-conservation-efficiency-calculations
subject: "9702"
topic: "5.1"
title: "Efficiency calculations: output, input and percentages"
summary: Rearranging efficiency = useful output ÷ total input to find the useful output, the total input or the wasted energy, in fractions or percentages.
order: 5
minutes: 5
kind: core
objectives: ["5.1.4"]
prerequisites: [energy-conservation-efficiency-definition]
