id: turning-effects-couples
subject: "9702"
topic: "4.1"
title: "Couples: pure spin, no shove"
summary: A couple is a pair of equal, opposite, parallel forces whose lines of action are separated; the resultant force is zero, so its only effect is rotation.
order: 4
minutes: 4
objectives: ["4.1.3"]
prerequisites: [turning-effects-moment-of-a-force, turning-effects-centre-of-gravity]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 4.1.3, a couple is a pair of forces whose only effect is to
    produce rotation). The diagram compares one off-centre force, two equal and opposite forces
    along the same line, and a couple acting on the same rod. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can say what a **couple** is and explain why its only effect is to make something rotate.

  - type: explain
    title: The steering-wheel move
    body: |
      Turn a steering wheel with both hands: one pushes up, the other pulls down. The wheel spins, but it doesn't try to leave the dashboard.

      That pair of forces is a **couple**. It's the cleanest way there is to make something turn.

  - type: definition
    term: Couple
    body: |
      A **couple** is a pair of forces that are **equal in magnitude**, **opposite in direction** and **parallel**, but whose **lines of action are separated** (not the same line).

      Its only effect is to produce **rotation**.

  - type: diagram
    diagram: phys-turning-effects-couple-effects
    alt: >-
      Three panels, each showing the same rod lying flat, seen from above, with its centre of
      gravity G marked at the middle. Every force has the same size F. Left, "One force, off
      centre": a single force F pushes up at the right-hand end, and a curved arrow shows the rod
      turning anticlockwise; text, resultant force F, plus a moment: moves and turns. Middle,
      "Equal, opposite, same line": one force F pulls the left end to the left and another pulls
      the right end to the right, both along the rod's length; text, resultant force 0, no
      moment: no motion. Right, "A couple": F pushes up at the right-hand end and F pushes down
      at the left-hand end, and a curved arrow shows the rod turning anticlockwise; text,
      resultant force 0, but a moment: turns only.
    caption: Only the couple gives rotation with no shove at all.

  - type: explain
    title: Why it only rotates
    body: |
      Check the two effects a set of forces can have:

      - **Resultant force:** $F$ one way plus $F$ the opposite way is zero. So there's no linear acceleration: the centre of gravity doesn't accelerate.
      - **Turning effect:** about the centre, each force turns the object the **same way**. Their moments add instead of cancelling.

      Zero resultant force plus a turning effect means rotation and nothing else.

  - type: explain
    title: The three cases side by side
    body: |
      | Forces on a free object | Resultant force | Turning effect | What happens |
      | --- | --- | --- | --- |
      | one force, not through G | $F$ | yes | moves **and** turns |
      | equal and opposite, same line | 0 | none | nothing (just stretched or squashed) |
      | a couple | 0 | yes | turns **only** |

  - type: check
    questions: [couple-pick, couple-cloze]

  - type: intuition
    title: Couples are everywhere
    body: |
      - Turning a tap or a key: finger and thumb push opposite ways on either side.
      - Unscrewing a bottle top or a jar lid.
      - A compass needle in the Earth's magnetic field: the field pushes its two poles in opposite directions, so the needle swings round to point north but doesn't fly off northwards.
      - The coil of an electric motor, which you'll meet later in the course.

  - type: misconceptions
    items:
      - wrong: The two forces of a couple are a Newton's third law pair.
        right: No. Both forces of a couple act on the **same** object. A third-law pair acts on two **different** objects.
      - wrong: Any two equal and opposite forces make a couple.
        right: Only if their lines of action are separated. Equal and opposite forces along the same line cancel completely and cause no rotation.
      - wrong: A couple also pushes the object along a little.
        right: The resultant force of a couple is zero, so it can't accelerate the centre of gravity. It only changes the rotation.

  - type: check
    questions: [couple-effect, third-law-couple, couple-explain]

  - type: exam
    body: |
      - **"What is meant by a couple?"**: *two forces, equal in size, opposite in direction, parallel, with lines of action that don't coincide*. Then add *produces rotation only*.
      - If a question describes forces that "cause rotation but no acceleration", it's talking about a couple.
      - The turning effect of a couple has its own name, the **torque**. That's the next lesson.

  - type: takeaways
    items:
      - "A couple: two equal, opposite, parallel forces whose lines of action are separated."
      - Its resultant force is zero, so the centre of gravity doesn't accelerate.
      - Its moments act in the same sense, so the object rotates.
      - Both forces act on the same object, so they are not a Newton's third law pair.

questions:
  - id: couple-pick
    format: mcq
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      Which pair of forces acting on a rod forms a couple?
    options:
      - text: $5\ \text{N}$ up at one end and $5\ \text{N}$ down at the other end
        correct: true
        why: Correct. Equal, opposite, parallel and separated by the length of the rod.
      - text: $5\ \text{N}$ up at one end and $5\ \text{N}$ up at the other end
        why: Both point the same way, giving a resultant of $10\ \text{N}$ upwards. A couple's forces are opposite.
      - text: $5\ \text{N}$ to the left at one end and $5\ \text{N}$ to the right at the other end, both along the rod
        why: Equal and opposite, but along the same line, so they cancel completely and cause no rotation.
      - text: $5\ \text{N}$ up at one end and $3\ \text{N}$ down at the other end
        why: Not equal, so there's a resultant force of $2\ \text{N}$ as well as a turning effect.
    explanation: |
      A couple needs equal, opposite, parallel forces whose lines of action are separated. Only the first pair has all four features.

  - id: couple-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      The two forces of a couple are equal in size and opposite in direction, so the resultant force is {{1}}. About the centre, their moments act in the {{2}} sense, so the object rotates.
    blanks:
      - accept: [zero, "0", "0 N", nothing, none, nil]
      - accept: [same]
    explanation: |
      The forces cancel as forces (resultant **zero**), but their moments act in the **same** sense and add up. That's why a couple gives rotation only.

  - id: couple-effect
    format: mcq
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      A space probe is at rest in deep space, with no other forces on it. Two small thrusters fire, producing a couple. What happens?
    options:
      - text: It starts to spin, and its centre of gravity stays where it was
        correct: true
        why: Correct. Zero resultant force, so no linear acceleration; a turning effect, so it rotates.
      - text: It moves off in a straight line without spinning
        why: That needs a resultant force through the centre of gravity. A couple's resultant force is zero.
      - text: It spins and also drifts off sideways
        why: That's what a single off-centre force does. A couple has zero resultant force, so G doesn't accelerate.
      - text: Nothing happens, because the two forces cancel
        why: The forces cancel as forces, but their moments don't; both turn the probe the same way.
    explanation: |
      A couple's only effect is rotation: the probe spins up about its centre of gravity, which stays put.

  - id: third-law-couple
    format: mcq
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      A student says: "The two forces in a couple are equal and opposite, so they must be a Newton's third law pair." Why is this wrong?
    options:
      - text: The forces of a couple both act on the same object; a third-law pair acts on two different objects
        correct: true
        why: Correct. That's the key difference, and why a couple can make an object turn.
      - text: Third-law pairs are never equal in size
        why: They always are equal in size, so that isn't the difference.
      - text: The forces of a couple are not opposite in direction
        why: They are opposite; that's part of the definition of a couple.
      - text: Third-law pairs only exist when objects are touching
        why: Gravitational and electric forces come in third-law pairs at a distance too.
    explanation: |
      Equal and opposite isn't enough to make a third-law pair. The two forces of a couple act on the same body, so they can add up to a turning effect on it.

  - id: couple-explain
    format: explain
    difficulty: 3
    objectives: ["4.1.3"]
    prompt: |
      A rod lies on a smooth, horizontal table. Explain why pushing one end sideways makes the rod both move and turn, whereas a couple makes it turn only.
    model: |
      A single force at one end gives the rod a resultant force, so its centre of gravity accelerates in the direction of the force. The force's line of action doesn't pass through the centre of gravity, so it also has a moment about G and the rod starts to rotate. In a couple the two forces are equal and opposite, so the resultant force is zero and G doesn't accelerate. Their lines of action are separated, though, so their moments act in the same sense and add, and the rod rotates only.
    keyPoints:
      - A single force gives a non-zero resultant force, so the centre of gravity accelerates
      - Its line of action misses the centre of gravity, so it also has a moment and the rod turns
      - In a couple the forces are equal and opposite, so the resultant force is zero
      - The couple's moments act in the same sense, so there is still a turning effect, giving rotation only
    explanation: |
      Think of the two jobs a set of forces can do: shove (resultant force) and turn (resultant moment). One off-centre force does both jobs; a couple does only the turning.
