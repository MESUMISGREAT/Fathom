id: electric-current-flow-of-charge
subject: "9702"
topic: "9.1"
title: Electric current as a flow of charge carriers
summary: Current is a flow of charge carriers; they have quantised charge (multiples of e). Conventional current flows positive to negative; electrons flow opposite.
order: 1
minutes: 5
objectives: ["9.1.1", "9.1.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcomes 9.1.1 and 9.1.2). All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can explain what electric current is, distinguish conventional current from electron flow, and state that charge is quantised in multiples of the elementary charge e = 1.60 × 10⁻¹⁹ C.

  - type: explain
    title: What is electric current?
    body: |
      **Electric current** is a flow of **charge carriers**. In a metal wire the charge carriers are **electrons** (negative). In an electrolyte (salt solution) they are **ions** (positive and negative). In a plasma or gas discharge they can be electrons and positive ions.

      Current is the **rate of flow of charge**:

      $$I = \frac{Q}{t}$$

      where $I$ is current in **amperes (A)**, $Q$ is charge in **coulombs (C)**, and $t$ is time in **seconds (s)**.
      **1 A = 1 C/s** — one ampere means one coulomb of charge passes a point every second.

  - type: diagram
    diagram: phys-electric-current-flow
    alt: |
      Left: a wire with a battery. Conventional current arrow points from + to − (positive to negative). Electron flow arrow points from − to + (negative to positive). Right: microscopic view of a wire cross-section showing fixed positive ions and drifting electrons. The formula I = Q/t is shown with units.
    caption: Conventional current is the direction positive charge would flow. Electrons actually drift the opposite way.

  - type: definition
    term: Electric current
    body: |
      The rate of flow of charge: $I = Q/t$. Unit: ampere (A), where 1 A = 1 C s⁻¹.

  - type: intuition
    title: Why "conventional" current?
    body: |
      Before electrons were discovered, early scientists (Franklin, Ampere) arbitrarily defined current as flowing from **positive to negative**. By the time J.J. Thomson found the electron (1897), the convention was everywhere — textbooks, instruments, circuit diagrams. Changing it would have caused chaos, so we stuck with it.

      **Conventional current** = direction a **positive** charge would move.
      **Electron flow** = direction **electrons** actually move (negative to positive).

      In most circuits this makes no difference to the maths — just be consistent. The syllabus and exam questions use **conventional current** unless explicitly stated otherwise.

  - type: check
    questions: [current-definition, conventional-direction]

  - type: explain
    title: Charge is quantised
    body: |
      **Charge comes in discrete packets.** You cannot have "half an electron's worth of charge." The smallest unit of charge is the **elementary charge**:

      $$e = 1.60 \times 10^{-19}\ \text{C}$$

      Every charge carrier carries a charge that is an **integer multiple of e**:

      | Carrier | Charge |
      | --- | --- |
      | Electron | $-e$ |
      | Proton | $+e$ |
      | Alpha particle (He²⁺) | $+2e$ |
      | Sodium ion Na⁺ | $+e$ |
      | Chloride ion Cl⁻ | $-e$ |

      **Quantised** means charge is like money in a currency with no subdivisions smaller than 1 cent — you can have 3 cents or 7 cents, but never 3.5 cents.

  - type: definition
    term: Elementary charge (e)
    body: |
      The magnitude of the charge of an electron (or proton): $e = 1.60 \times 10^{-19}\ \text{C}$. All free charges are integer multiples of $e$.

  - type: example
    title: How many electrons in 1 coulomb?
    problem: |
      Calculate how many electrons make up a charge of 1.00 C.
    steps:
      - |
        Each electron has charge $e = 1.60 \times 10^{-19}\ \text{C}$.
      - |
        Number of electrons $N = \frac{Q}{e} = \frac{1.00}{1.60 \times 10^{-19}} = 6.25 \times 10^{18}$.
      - |
        That's **6.25 quintillion electrons** — a huge number, which is why we use the coulomb as a practical unit.
    answer: |
      $6.25 \times 10^{18}$ electrons (to 3 s.f.)

  - type: check
    questions: [quantised-charge, electrons-per-coulomb]

  - type: check
    questions: [charge-carrier-types, spot-current-error, explain-current-vs-drift]

  - type: misconceptions
    items:
      - wrong: Current is used up as it goes through a component (like a bulb).
        right: "Current is the **same** everywhere in a series circuit. Charge carriers don't disappear — they transfer energy."
      - wrong: Electrons travel at the speed of light in a wire.
        right: "The **signal** (electric field) travels near light speed, but individual electrons **drift** at ~mm/s. Like water in a pipe: turn the tap, water comes out instantly, but each molecule moves slowly."
      - wrong: Conventional current is "wrong" because electrons are negative.
        right: "It's a **convention**, not a mistake. All circuit laws work perfectly with conventional current. Just don't mix the two in the same problem."

  - type: exam
    body: |
      - "State the unit of current" → ampere (A). "Define the ampere" → 1 A = 1 C/s (rate of flow of charge).
      - "What is the charge on an electron?" → $-1.60 \times 10^{-19}\ \text{C}$ (or just magnitude $1.60 \times 10^{-19}\ \text{C}$ if magnitude asked).
      - Questions may ask for the **number of charge carriers** given a total charge — divide by $e$.
      - Know the difference between conventional current and electron flow; label arrows correctly in diagrams.

  - type: takeaways
    items:
      - "Current $I = Q/t$; 1 A = 1 C/s."
      - "Conventional current: + to -. Electron flow: - to + (opposite)."
      - 'Charge is quantised: all charges are integer multiples of $e = 1.60 \times 10^{-19}\ \text{C}$.'
      - "In metals, electrons are the charge carriers; in electrolytes, it's ions."

questions:
  - id: current-definition
    format: text
    difficulty: 1
    objectives: ["9.1.1"]
    style: definition
    prompt: |
      Define electric current and state its unit.
    accept:
      - "rate of flow of charge, unit ampere (A)"
      - "I = Q/t, ampere"
      - "charge per unit time, ampere"
      - "flow of charge per second, ampere"
    model: |
      Electric current is the rate of flow of charge: $I = Q/t$. Its unit is the ampere (A), where 1 A = 1 C/s.
    explanation: |
      The definition must include "rate of flow of charge" (or "charge per unit time") and the unit ampere. $I = Q/t$ is the defining equation.

  - id: conventional-direction
    format: mcq
    difficulty: 1
    objectives: ["9.1.1"]
    prompt: |
      In a circuit with a battery, conventional current flows:
    options:
      - text: From the positive terminal to the negative terminal
        correct: true
        why: Conventional current is defined as the direction positive charge would flow.
      - text: From the negative terminal to the positive terminal
        why: That is the direction of electron flow, not conventional current.
      - text: In both directions at once
        why: Current has a single direction at any point in a series circuit.
      - text: Only inside the battery
        why: Current flows all round the closed circuit, not just in the battery.
    explanation: |
      Conventional current flows from positive to negative externally. This is the standard used in all circuit diagrams and exam questions unless electron flow is explicitly asked for.

  - id: quantised-charge
    format: mcq
    difficulty: 1
    objectives: ["9.1.2"]
    prompt: |
      Which statement about electric charge is correct?
    options:
      - text: All free charges are integer multiples of the elementary charge e.
        correct: true
        why: Charge is quantised — the smallest unit is e = 1.60 × 10⁻¹⁹ C.
      - text: Charge can take any continuous value.
        why: This would be true only if charge were not quantised, but it is.
      - text: The charge of an electron is +1.60 × 10⁻¹⁹ C.
        why: "The electron charge is negative: −e. The proton is +e."
      - text: Quarks have charge ±e so they are the fundamental unit.
        why: Quarks have charges ±⅓e and ±⅔e, but free charges are always integer multiples of e.
    explanation: |
      Charge quantisation means any isolated charge is $ne$ where $n$ is an integer. Quarks have fractional charges but are never found in isolation (confinement).

  - id: electrons-per-coulomb
    format: numeric
    difficulty: 2
    objectives: ["9.1.2"]
    prompt: |
      A charge of 4.80 μC passes a point in a wire. How many electrons does this correspond to?
    fields:
      - label: "Number of electrons"
        answer: 3.00e13
        tolerance: { rel: 0.01 }
        unit: "electrons"
    explanation: |
      $N = Q/e = (4.80 \times 10^{-6}) / (1.60 \times 10^{-19}) = 3.00 \times 10^{13}$ electrons.

  - id: charge-carrier-types
    format: cloze
    difficulty: 2
    objectives: ["9.1.1"]
    prompt: |
      In a metal wire the charge carriers are {{1}}. In an electrolyte the charge carriers are {{2}}.
    blanks:
      - accept: [electrons, free electrons, conduction electrons]
      - accept: [ions, positive and negative ions, cations and anions]
    explanation: |
      Metals conduct via delocalised (free) electrons. Electrolytes conduct via mobile positive and negative ions.

  - id: spot-current-error
    format: spot-error
    difficulty: 2
    objectives: ["9.1.1"]
    prompt: |
      A student writes: "A current of 2 A flows through a resistor. After the resistor the current is 1 A because the resistor uses up some current." Identify the error.
    lines:
      - "A current of 2 A flows through a resistor."
      - "After the resistor the current is 1 A because the resistor uses up some current."
      - "Therefore the current decreases across components."
    errorLine: 2
    fix: |
      After the resistor the current is still 2 A. Current is the same everywhere in a series circuit — charge is conserved.
    explanation: |
      Current is not "used up". The resistor transfers energy (the charge carriers lose kinetic energy as heat), but the same number of charge carriers pass per second before and after.

  - id: explain-current-vs-drift
    format: explain
    difficulty: 3
    objectives: ["9.1.1"]
    prompt: |
      Explain the difference between electron drift speed and the speed at which electric current appears to flow in a circuit.
    model: |
      Electric current is the rate of flow of charge ($I = Q/t$). In a typical wire the drift speed of electrons is only fractions of a mm/s, yet when you flip a switch the light comes on instantly. This is because the electric field that pushes the electrons propagates at close to the speed of light — all electrons in the circuit start moving almost simultaneously, like water in a full pipe where turning on the tap gives instant flow at the far end.
    keyPoints:
      - "Current is rate of flow of charge: I = Q/t"
      - "Drift speed is very slow (mm/s)"
      - "Electric field propagates near light speed"
      - "All electrons start moving together"
    explanation: |
      The key distinction is between the **drift velocity** of individual charge carriers (slow) and the **propagation of the electric field** (fast). The analogy of water in a pipe helps: the water molecules move slowly, but pressure waves travel fast.