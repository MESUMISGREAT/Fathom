id: diffraction-basics-gap-width
subject: "9702"
topic: "8.2"
title: "Gap width, wavelength and how much waves spread"
summary: "A wide gap barely spreads a wave; a gap about one wavelength wide spreads it into semicircles. Learn the three cases and the ripple-tank experiment."
order: 2
minutes: 7
kind: core
objectives: ["8.2.2"]
prerequisites: ["diffraction-basics-what-is-diffraction"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.2
    Diffraction, learning outcome 8.2.2 (experiments demonstrating diffraction, including how the
    gap width compared with the wavelength affects diffraction qualitatively; ripple tank). All
    questions are original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by
    the same AI model. No separate reviewer model and no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can describe how the **amount of diffraction** depends on the **gap width
      compared with the wavelength**, describe the **ripple-tank** demonstration, and apply the
      idea to edges and obstacles.

  - type: explain
    title: It is a ratio, not a size
    body: |
      "Does a 2 cm gap diffract waves?" is the wrong question. What matters is the **ratio** of the
      gap width to the wavelength.

      A 2 cm gap is tiny for a 10 m radio wave but enormous for a 0.0005 mm light wave, and the two
      cases behave completely differently.

      So compare $w$ (gap width) with $\lambda$. There are three useful cases.

  - type: explain
    title: "Case 1: gap much wider than the wavelength"
    body: |
      When $w \gg \lambda$, most of the wavefront passes straight through. The beam stays almost as
      wide as the gap and travels nearly straight ahead.

      Behind the barrier there is a **shadow** region that is only slightly blurred at its edges.
      The wave bends a little into the shadow, but not much.

      This is why a torch beam through a doorway stays a beam, and why light from a window makes a
      fairly sharp patch on the floor.

  - type: explain
    title: "Case 2: gap about one wavelength wide"
    body: |
      When $w \approx \lambda$, the spreading is at its most dramatic. The wavefronts leave the gap
      as **semicircles** and the wave fans out widely on the far side.

      The gap now behaves like a small **point source**. The wave's energy is spread over a much
      larger region, so the amplitude away from the gap is smaller than it was in the beam.

      This is the case examiners usually mean by "diffraction is greatest when the gap is
      comparable with the wavelength".

  - type: explain
    title: "Case 3: gap narrower than the wavelength"
    body: |
      When $w < \lambda$, the wave spreads out through almost all of the region behind the barrier —
      it no longer looks like a beam at all.

      But there is a catch: a very narrow gap lets only a small fraction of the wave's energy
      through. The transmitted wave is widely spread **and** weak.

      So "narrower gap means more diffraction" is true for the **angle** of spreading, not for the
      intensity you receive.

  - type: diagram
    diagram: phys-diffraction-basics-gap-width
    alt: >-
      Three panels with identical incoming plane wavefronts striking barriers. With a gap much
      wider than the wavelength, the wavefronts continue almost straight. With a gap about one
      wavelength wide, semicircular wavefronts fan out widely. With a gap narrower than the
      wavelength, faint dashed wavefronts spread in almost all directions.
    caption: >-
      The narrower the gap relative to the wavelength, the wider the spread — but the weaker the
      transmitted wave.

  - type: explain
    title: "The ripple tank demonstration"
    body: |
      A ripple tank shows this in real time.

      1. A vibrating bar (a **dipper**) makes straight, parallel water waves of fixed wavelength.
      2. Place a barrier across the tank with a **gap** in it.
      3. Shine light from above so the wave crests cast shadows you can see (or project them).
      4. Watch the wavefronts after the gap.

      **What to do:** keep the dipper frequency — and so the wavelength — **constant**, and change
      only the gap width.

      **What you see:**

      - Wide gap: the wavefronts stay nearly straight; the beam continues with sharp-ish edges.
      - Gap about one wavelength: the wavefronts become strongly curved semicircles.
      - Narrower gap: the curvature spreads over a wider angle, and the pattern is fainter.

      **The control experiment:** with the gap fixed, increase the frequency. The wavelength
      shortens, so the gap becomes "wide" compared with $\lambda$ and the spreading **decreases**.

  - type: explain
    title: Edges and obstacles count too
    body: |
      Diffraction is not only about gaps. A wave passing the **edge of an obstacle** spreads into
      the region behind it.

      Sea waves passing a harbour wall or a headland fan out into the sheltered water. Sound from a
      source hidden behind a building still reaches you. Radio waves of long wavelength reach
      valleys that are screened from the transmitter by hills.

      The same rule applies: the longer the wavelength compared with the obstacle, the more the wave
      spreads into the "shadow".

  - type: misconceptions
    items:
      - wrong: "Diffraction only happens when the gap is exactly one wavelength wide."
        right: >-
          It happens at every gap. The spreading is simply greatest, and most obvious, when the gap
          is comparable with the wavelength.
      - wrong: "A narrower gap always gives a stronger diffracted wave."
        right: >-
          A narrower gap spreads the wave through a wider angle, but less energy gets through, so
          the amplitude is smaller.
      - wrong: "A wider gap makes the wave spread more."
        right: >-
          The opposite: a wide gap lets the wave continue almost straight, with little spreading.
      - wrong: "Changing the gap width changes the wavelength."
        right: >-
          Wavelength is set by the source and the medium. The gap only changes how the wavefronts
          spread after passing through.

  - type: exam
    body: |
      "State and explain how the diffraction depends on the width of the gap" wants a comparison
      with the **wavelength**, not just "big gap" or "small gap".

      Use the pattern: *when the gap is much wider than $\lambda$, little spreading; when the gap is
      comparable with $\lambda$, maximum spreading; when narrower still, the wave spreads through a
      very wide angle but with reduced amplitude.*

      For the ripple tank, describe changing **one** variable: keep the frequency constant and vary
      the gap (or keep the gap constant and vary the frequency).

  - type: check
    title: Check yourself
    questions: [smallest-gap, wide-gap-shadow]

  - type: check
    title: The ripple tank and edges
    questions: [ripple-tank-method, wavelength-effect]

  - type: check
    title: Spot the slip
    questions: [gap-equals-error, amplitude-cloze]

  - type: takeaways
    items:
      - "Compare the gap width with the wavelength; the ratio decides how much the wave spreads."
      - 'Gap $\gg \lambda$: almost straight, slight edge blurring. Gap $\approx \lambda$: semicircular spreading. Gap $< \lambda$: wide spreading but weak.'
      - "Longer wavelength (or narrower gap) means more spreading."
      - "Ripple tank: keep the frequency fixed and vary the gap to see the effect cleanly."

questions:
  - id: smallest-gap
    format: mcq
    difficulty: 1
    objectives: ["8.2.2"]
    prompt: |
      Water waves of wavelength $2.0\ \text{cm}$ pass through gaps of different widths. Which gap
      produces the **greatest** spreading?
    options:
      - text: '$1.0\ \text{cm}$'
        correct: true
        why: "Correct: this gap is comparable with (and smaller than) the wavelength, giving the widest spreading."
      - text: '$2.0\ \text{cm}$'
        why: "This also spreads strongly (about one wavelength), but the narrower gap spreads through a wider angle."
      - text: '$8.0\ \text{cm}$'
        why: "Four wavelengths wide: the wave passes almost straight through."
      - text: '$20\ \text{cm}$'
        why: "Ten wavelengths wide: almost no spreading at all."
    explanation: |
      Spreading increases as the gap becomes comparable with, then smaller than, the wavelength.
      Of these, $1.0\ \text{cm}$ gives the widest spread, though the transmitted wave is weaker.

  - id: wide-gap-shadow
    format: mcq
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      A wave of wavelength $3\ \text{cm}$ passes through a gap $60\ \text{cm}$ wide. What is
      observed on the far side?
    options:
      - text: "The wavefronts continue almost straight, with a fairly sharp shadow behind the barrier."
        correct: true
        why: "Correct: the gap is 20 wavelengths wide, so there is very little spreading."
      - text: "Semicircular wavefronts spread out from the gap."
        why: "That needs a gap comparable with one wavelength."
      - text: "The wave spreads evenly in all directions behind the barrier."
        why: "That needs a gap narrower than the wavelength."
      - text: "No wave passes through the gap at all."
        why: "The gap is wide, so most of the wave passes straight through."
    explanation: |
      With $w = 60\ \text{cm}$ and $\lambda = 3\ \text{cm}$, the gap is 20 wavelengths wide:
      $w \gg \lambda$, so the wave travels almost straight and the diffraction is slight.

  - id: ripple-tank-method
    format: text
    style: short
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      In a ripple-tank demonstration of diffraction, what should be kept constant while the gap
      width is changed, so that the effect of gap width alone is seen?
    accept:
      - "the frequency"
      - "the wavelength"
      - "the frequency of the dipper"
      - "frequency"
      - "wavelength"
    model: |
      The frequency of the dipper (and hence the wavelength) should be kept constant, so that only
      the gap width changes.
    explanation: |
      Diffraction depends on the ratio of gap width to wavelength. To isolate the effect of gap
      width, the wavelength must stay fixed — so keep the dipper frequency constant.

  - id: wavelength-effect
    format: mcq
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      Sound of frequency $200\ \text{Hz}$ and sound of frequency $2000\ \text{Hz}$ pass through the
      same doorway. Which spreads more, and why?
    options:
      - text: "The 200 Hz sound, because its longer wavelength is more comparable with the doorway."
        correct: true
        why: "Correct: lower frequency means longer wavelength, so the doorway is closer to a wavelength in size."
      - text: "The 2000 Hz sound, because it has more energy."
        why: "Energy does not decide the amount of diffraction; the wavelength-to-gap ratio does."
      - text: "Both spread equally, because the doorway is the same."
        why: "The doorway is fixed, but the two sounds have different wavelengths, so the ratios differ."
      - text: "Neither spreads, because sound does not diffract."
        why: "Sound diffracts — that is why you can hear around corners."
    explanation: |
      Lower frequency means longer wavelength. The doorway is then closer in size to the
      wavelength, so the low note spreads more — which is why bass is harder to localise through a
      doorway.

  - id: gap-equals-error
    format: spot-error
    difficulty: 3
    objectives: ["8.2.2"]
    prompt: |
      A student describes diffraction through a gap. One line is wrong.
    lines:
      - |
        Diffraction is the spreading of waves after passing through a gap or past an edge.
      - |
        Diffraction only happens when the gap width is exactly equal to the wavelength.
      - |
        The spreading becomes more noticeable as the gap width is made closer to the wavelength.
    errorLine: 2
    fix: |
      Diffraction happens at **every** gap; the spreading is simply **most noticeable** when the
      gap width is comparable with the wavelength.
    explanation: |
      There is no threshold at exactly one wavelength. All waves diffract at all gaps; the ratio of
      gap width to wavelength controls how obvious the spreading is.

  - id: amplitude-cloze
    format: cloze
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      As the gap is made narrower relative to the wavelength, the wavefronts spread through a
      **{{1}}** range of angles, but the **{{2}}** of the transmitted wave decreases.
    blanks:
      - accept: ["wider", "greater", "larger"]
      - accept: ["amplitude", "intensity"]
    explanation: |
      A narrower gap spreads the wave more widely, but less energy passes through the gap, so the
      transmitted amplitude (and intensity) is smaller.
