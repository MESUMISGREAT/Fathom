blocks:
  - type: objective
    body: |
      By the end you can explain how a **stationary wave** forms, use **snapshots** to add the two
      waves, and identify **nodes** and **antinodes** — including how far apart they are.

  - type: explain
    title: Two waves trapped in the same space
    body: |
      Send a pulse along a rope and let it reflect from the far end. Now the rope carries **two**
      waves: the one you sent, and its reflection, travelling in opposite directions.

      The two waves have the same frequency and speed, and roughly the same amplitude. Where they
      overlap, they superpose.

      The result looks nothing like a wave sliding along the rope. Instead the pattern stays in
      one place and oscillates up and down. We call it a **stationary wave** (or standing wave).

      Anything that reflects a wave can make one: a string, the air in a pipe, microwaves bouncing
      off a metal plate.

  - type: definition
    term: Stationary (standing) wave
    body: |
      A wave pattern formed when two waves of the **same frequency** travel in **opposite
      directions** through the same region and **superpose**. Its **nodes** and **antinodes** stay
      in fixed positions, so the pattern does not travel along the medium.

  - type: explain
    title: The graphical method, step by step
    body: |
      A stationary wave is just superposition, done at every point at once. Here is the recipe:

      1. Draw wave 1 at one instant.
      2. Draw wave 2 at the same instant, travelling the other way.
      3. Add their displacements point by point — that is the resultant.
      4. Repeat a quarter of a period later, then a half period later.

      You find two special kinds of point:

      - Points where the waves are **always in antiphase**: displacements always cancel, so the
        point never moves. These are **nodes**.
      - Points where the waves are **always in phase**: displacements always reinforce, so the
        point oscillates with maximum amplitude. These are **antinodes**.

      The diagram shows the result. At $t = 0$ the pattern has its full height. At
      $t = \dfrac{T}{4}$ the two waves are in antiphase everywhere and the string is flat. At
      $t = \dfrac{T}{2}$ the pattern has flipped over.

  - type: diagram
    diagram: phys-stationary-waves-formation
    alt: >-
      Three snapshots of the resultant of two identical waves travelling in opposite directions.
      At t = 0 a full sine pattern with five marked nodes. At t = T/4 the resultant is a flat line
      on the axis. At t = T/2 the same pattern is upside down, with the nodes in the same places.
    caption: >-
      The nodes never move; the antinodes swing between $+2A$ and $-2A$. The pattern flips every
      half period.

  - type: explain
    title: Nodes, antinodes and the gaps between them
    body: |
      A **node** is a point of **zero displacement at all times**. A **antinode** is a point of
      **maximum amplitude**.

      The spacing follows from the pattern:

      - Neighbouring nodes are $\dfrac{\lambda}{2}$ apart.
      - Neighbouring antinodes are also $\dfrac{\lambda}{2}$ apart.
      - A node and the nearest antinode are $\dfrac{\lambda}{4}$ apart.

      Between a node and an antinode, the medium oscillates with an amplitude somewhere between
      zero and the maximum — but every point oscillates with the **same frequency**.

      Unlike a progressive wave, a stationary wave transfers **no net energy** along the medium.
      Energy sloshes back and forth between kinetic energy of the moving string and elastic
      potential energy of the stretched string.

  - type: example
    title: Amplitudes at a node and an antinode
    problem: |
      Two identical waves of amplitude $2.4\ \text{mm}$ travel in opposite directions and form a
      stationary wave.

      (a) What is the amplitude at an antinode? (b) What is it at a node? (c) What would the
      minimum amplitude be if the second wave had amplitude $1.5\ \text{mm}$ instead?
    steps:
      - |
        At an antinode the waves are always in phase, so the displacements add:
        $2.4 + 2.4 = 4.8\ \text{mm}$.
      - |
        At a node they are always in antiphase and the amplitudes are equal, so the displacements
        always cancel: amplitude $0$.
      - |
        With unequal amplitudes the cancellation is only partial:
        $|2.4 - 1.5| = 0.9\ \text{mm}$. The nodes are no longer perfectly still.
    answer: |
      (a) $4.8\ \text{mm}$  (b) $0$  (c) $0.9\ \text{mm}$ — partial cancellation only.

  - type: misconceptions
    items:
      - wrong: "In a stationary wave the string stops moving."
        right: >-
          Only the nodes are still. Every other point oscillates, and antinodes oscillate with the
          largest amplitude. It is the **pattern** that stays in place.
      - wrong: "Nodes are points the waves never reach."
        right: >-
          Both waves are present at a node — they simply always arrive in antiphase there, so the
          displacements cancel.
      - wrong: "A stationary wave carries energy from one end to the other."
        right: >-
          There is no net transfer of energy along a stationary wave. Energy is stored in the
          oscillating medium and swaps between kinetic and elastic potential energy.
      - wrong: "Any two waves travelling in opposite directions make a stationary wave."
        right: >-
          They must have the same frequency. For completely still nodes they must also have equal
          amplitudes.

  - type: exam
    body: |
      Definitions matter here. "State what is meant by a stationary wave" wants: formed by
      **superposition** of two waves of the **same frequency** travelling in **opposite
      directions**, giving fixed nodes and antinodes.

      "State what is meant by a node" wants: a point where the displacement is **always zero**
      (permanent destructive superposition).

      When you are shown a snapshot, remember that a quarter of a period later every point is at
      its rest position. Do not confuse the motion of the pattern with the motion of the medium.

  - type: check
    title: Check yourself
    questions: [conditions-mcq, node-antinode-cloze]

  - type: check
    title: Amplitudes and snapshots
    questions: [antinode-amplitude, half-period-mcq, extra-node-spacing]

  - type: check
    title: Explain it
    questions: [define-node, stationary-energy]

  - type: takeaways
    items:
      - "A stationary wave forms when two waves of the same frequency travel in opposite directions and superpose."
      - "Nodes: zero displacement at all times. Antinodes: maximum amplitude."
      - 'Nodes and antinodes are alternately $\dfrac{\lambda}{4}$ apart; neighbouring nodes are $\dfrac{\lambda}{2}$ apart.'
      - "No net energy is transferred along a stationary wave."

questions:
  - id: conditions-mcq
    format: mcq
    difficulty: 1
    objectives: ["8.1.3"]
    prompt: |
      Which pair of waves can superpose to form a stationary wave?
    options:
      - text: "Two waves of the same frequency travelling in the same direction."
        why: "Waves travelling the same way produce a progressive wave with a moving pattern, not a stationary one."
      - text: "Two waves of the same frequency travelling in opposite directions."
        correct: true
        why: "Correct: opposite directions plus the same frequency give fixed nodes and antinodes."
      - text: "Two waves of different frequencies travelling in opposite directions."
        why: "Different frequencies make the pattern move; nodes would not stay in fixed positions."
      - text: "Two waves of different amplitudes travelling at right angles."
        why: "The waves must travel along the same line, in opposite directions."
    explanation: |
      The pattern is fixed only if the two waves have the same frequency and travel in opposite
      directions along the same line.

  - id: node-antinode-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.1.3"]
    prompt: |
      At a **{{1}}** the displacement is always zero. At an **{{2}}** the displacement oscillates
      between $+A$ and $-A$.
    blanks:
      - accept: ["node"]
      - accept: ["antinode", "anti-node"]
    explanation: |
      Nodes are points of permanent destructive superposition; antinodes are points of permanent
      constructive superposition and have maximum amplitude.

  - id: antinode-amplitude
    format: numeric
    difficulty: 2
    objectives: ["8.1.3"]
    prompt: |
      Two identical waves, each of amplitude $2.4\ \text{mm}$, travel in opposite directions and
      form a stationary wave.

      Calculate the amplitude of the stationary wave at an antinode.
    fields:
      - answer: 4.8
        tolerance: { abs: 0.05 }
        unit: mm
    explanation: |
      At an antinode the waves are always in phase, so their displacements always add:
      $2.4 + 2.4 = 4.8\ \text{mm}$.

  - id: half-period-mcq
    format: mcq
    difficulty: 2
    objectives: ["8.1.3"]
    prompt: |
      A stationary wave on a string is photographed at $t = 0$ and again at $t = \dfrac{T}{2}$.
      What has changed?
    options:
      - text: "Every displacement has reversed, and the nodes are in the same positions."
        correct: true
        why: "Correct: after half a period each point is at the opposite displacement, while nodes stay at zero."
      - text: 'The whole pattern has moved along by $\dfrac{\lambda}{2}$.'
        why: "That is what a progressive wave does; a stationary wave's pattern does not travel."
      - text: 'The nodes have moved by $\dfrac{\lambda}{4}$.'
        why: "Nodes are fixed points; they never move."
      - text: "Nothing has changed at all."
        why: "The shape is the same, but it is inverted: crests have become troughs."
    explanation: |
      After half a period each point has completed half an oscillation, so its displacement is
      reversed. The nodes remain at zero and never move, and the antinodes are now on the opposite
      side.

  - id: define-node
    format: text
    style: definition
    difficulty: 1
    objectives: ["8.1.3"]
    prompt: |
      State what is meant by a **node** of a stationary wave.
    accept:
      - "a point of zero displacement"
      - "a point where the displacement is always zero"
      - "a point where the displacement never changes"
      - "a point of permanently zero displacement"
      - "a point where the waves always cancel"
    model: |
      A point at which the displacement is always zero, because the two superposing waves are
      permanently in antiphase there.
    explanation: |
      The key idea is **always** zero — not just zero at one instant.

  - id: stationary-energy
    format: explain
    difficulty: 3
    objectives: ["8.1.3"]
    prompt: |
      A student claims that a stationary wave on a string carries energy along the string from the
      vibrator to the fixed end. Explain why this is not correct.
    keyPoints:
      - "There is no net transfer of energy along a stationary wave."
      - "Energy is stored in the oscillating string and swaps between kinetic and elastic potential energy."
      - "The pattern stays in place; the energy does not travel along with a moving pattern."
    model: |
      In a stationary wave the two travelling waves carry energy in opposite directions, so the
      net energy flow along the string is zero. The energy that the vibrator supplies is stored in
      the oscillating string and continually swaps between kinetic energy (as the string moves
      fastest) and elastic potential energy (as the string is most stretched). The pattern itself
      does not travel, so it cannot transport energy from one end to the other.
    explanation: |
      A progressive wave transports energy; a stationary wave stores it and exchanges it between
      kinetic and potential forms.

  - id: extra-node-spacing
    format: mcq
    difficulty: 2
    objectives: ["8.1.3"]
    prompt: |
      In a stationary wave, what is the distance between a node and the nearest antinode?
    options:
      - text: '$\dfrac{\lambda}{4}$'
        correct: true
        why: "Correct: nodes and antinodes alternate every quarter wavelength."
      - text: '$\dfrac{\lambda}{2}$'
        why: "That is the distance between two neighbouring nodes (or two neighbouring antinodes)."
      - text: '$\lambda$'
        why: "A whole wavelength spans two node-to-node intervals."
      - text: '$2\lambda$'
        why: "Far too large: a whole wavelength already contains two nodes and two antinodes."
    explanation: |
      The pattern repeats every $\dfrac{\lambda}{2}$, and a node and an antinode alternate within
      that repeat, so they are $\dfrac{\lambda}{4}$ apart.
