id: stationary-waves-formation
subject: "9702"
topic: "8.1"
title: "How a stationary wave forms"
summary: "Two identical waves travelling in opposite directions superpose to make a pattern that stays put: nodes, antinodes, and no net energy flow."
order: 2
minutes: 7
kind: core
objectives: ["8.1.3"]
prerequisites: ["stationary-waves-superposition", "progressive-waves-wave-equation"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.1
    Stationary waves, learning outcome 8.1.3 (use a graphical method to explain how a stationary
    wave forms, and identify its nodes and antinodes). All questions are original. Re-checked line
