id: progressive-waves-cro
subject: "9702"
topic: "7.1"
title: "Reading a cathode-ray oscilloscope"
summary: The time-base turns horizontal squares into time, and the y-gain turns vertical squares into volts. Together they give period (then frequency) and amplitude.
order: 5
minutes: 8
kind: core
objectives: ["7.1.3"]
prerequisites: [progressive-waves-key-terms]
