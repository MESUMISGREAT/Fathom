blocks:
  - type: objective
    body: |
      By the end you can **state the principle of conservation of energy**, and
      use it to work out how much energy has been transferred or dissipated in a
      process.

  - type: explain
    title: Energy is a currency, not a fuel
    body: |
      A torch battery goes "flat"; a bouncing ball stops bouncing. It is tempting
      to say the energy was used up.

      Physics says something stronger and more useful: the energy is still
      **somewhere**. It has been **transferred** to another store or
      **transformed** into another form, often warming the surroundings.

      Because nothing is lost, you can always balance the books.

  - type: definition
    term: Principle of conservation of energy
    body: |
      Energy cannot be **created** or **destroyed**; it can only be
      **transferred** from one store to another, or transformed from one form
      into another.

      For any closed system, the **total energy stays the same**.

  - type: explain
    title: Keeping the books
    body: |
      Write the energy going in on the left and everything coming out on the
      right:

      $$\text{total energy in} = \text{useful energy out} + \text{energy dissipated}$$

      **Dissipated** energy has spread out into the surroundings, usually as
      **thermal energy** (often with a little sound). It has not vanished — it is
      simply no longer useful for the job.

      Two everyday balances:

      - a motor: electrical energy in = kinetic energy of the load + thermal
        energy in the motor;
      - a ball falling: stored energy at the top = kinetic energy at the bottom +
        thermal energy from the air.

  - type: diagram
    diagram: phys-energy-conservation-principle
    alt: >-
      Two panels. Left: a ball falling from a release height, shown at three
      moments, each with a horizontal bar of the same total length 100 J but
      split differently: at release, 100 J stored (labelled "height"); halfway
      down, 60 J kinetic plus 40 J thermal; just before landing, 80 J kinetic
      plus 20 J thermal. Every bar's total stays 100 J. Right: a ball bouncing on
      a floor with three decreasing bounce heights, labelled "each bounce: less
      height, more thermal energy", with the note that the total energy is still
      100 J.
    caption: >-
      The split changes, the total does not: 60 + 40 = 80 + 20 = 100 J.

  - type: example
    title: "Worked example: where did the energy go?"
    problem: |
      A ball is released with $100\ \text{J}$ of stored (gravitational) energy.
      Just before it lands it has $80\ \text{J}$ of kinetic energy.

      How much energy has been dissipated, and where did it go?
    steps:
      - |
        Total before = total after.
        Before: $100\ \text{J}$ stored. After: kinetic energy plus dissipated
        energy.
      - |
        $$100\ \text{J} = 80\ \text{J} + E_\text{dissipated}$$
      - |
        $$E_\text{dissipated} = 100 - 80 = 20\ \text{J}$$
      - |
        The air resistance force acts **opposite** to the motion, so it does
        negative work on the ball: $20\ \text{J}$ of energy is transferred to the
        thermal store of the air.
    answer: |
      $20\ \text{J}$ dissipated to the surroundings as thermal energy (plus a
      trace of sound). The ball's mechanical energy fell, but the total energy
      did not.

  - type: check
    title: Quick check
    questions: [conservation-statement, dissipated-energy, motor-transfer]
  - type: explain
    title: Why the principle is so useful
    body: |
      Conservation of energy is the reason questions in this topic can be
      answered at all. You can count energy **before** and **after** an event
      without knowing the details of the forces in between.

      When something moves, energy is shuffled between stores:

      - a **kinetic energy** store, for movement;
      - a **gravitational** store, for height;
      - a **thermal** store, for temperature;
      - **chemical** and **elastic** stores, for fuels and stretched springs.

      Conservation lets you write one equation linking the starting store to the
      energy that arrives somewhere else.

  - type: misconceptions
    items:
      - wrong: Energy is used up when a battery goes flat.
        right: |
          The chemical store empties because the energy has been **transferred**
          elsewhere (light, sound, thermal). The total amount of energy in the
          universe is unchanged.
      - wrong: Friction destroys energy.
        right: |
          Friction **transfers** kinetic energy to the thermal store of the
          surfaces. The surfaces get slightly warmer — the energy is still there.
      - wrong: A bouncing ball loses energy because energy leaks out of the universe.
        right: |
          Each bounce passes some energy to the thermal store of the ball and the
          floor. Count that energy and the books still balance.
      - wrong: Efficiency below 100% means energy has disappeared.
        right: |
          It means part of the input went somewhere not useful (usually thermal).
          Energy is conserved even when efficiency is low.

  - type: exam
    body: |
      - "State the principle of conservation of energy" (1–2 marks): say
        **energy cannot be created or destroyed**, and that it is **transferred**
        or **transformed**. Naming both halves earns both marks.
      - In calculation questions, start from
        $\text{total in} = \text{useful out} + \text{dissipated}$ and fill in what
        you know — do not guess which quantity is wanted.
      - If a question says "the rest of the energy is dissipated", subtract; the
        commonest slip is to add the dissipated energy to the useful output
        instead of subtracting it from the total.

  - type: check
    title: Check yourself
    questions: [pendulum-balance, explain-bounce]
  - type: takeaways
    items:
      - Energy cannot be created or destroyed; it is transferred or transformed.
      - >-
        total energy in = useful energy out + energy dissipated.
      - Dissipated energy has spread to the surroundings, usually as thermal energy.
      - >-
        Energy that leaves one store always arrives in another: the books balance.

questions:
  - id: conservation-statement
    format: mcq
    difficulty: 1
    objectives: ["5.1.2"]
    prompt: |
      Which statement is the **principle of conservation of energy**?
    options:
      - text: Energy cannot be created or destroyed, only transferred or transformed
        correct: true
        why: |
          That is the principle: the total amount of energy stays the same, while
          transfers and transformations happen constantly.
      - text: Energy is always converted into thermal energy
        why: |
          Many processes end up with thermal energy, but that is a consequence,
          not the principle itself — and some processes (a swinging pendulum) are
          mostly reversible.
      - text: The useful energy output always equals the total energy input
        why: |
          That would mean 100% efficiency, which never happens; part of the input
          is always dissipated.
      - text: Energy can be destroyed by friction
        why: |
          Friction transfers energy to the thermal store of the surfaces. Nothing
          is destroyed.
    explanation: |
      The principle is a statement about accounting: the total is fixed, so
      energy that leaves one store must arrive in another.

  - id: dissipated-energy
    format: numeric
    difficulty: 1
    objectives: ["5.1.2"]
    prompt: |
      A ball is released with $100\ \text{J}$ of stored energy. Just before it
      lands, its kinetic energy is $80\ \text{J}$.

      How much energy has been dissipated to the thermal store of the air?
    fields:
      - answer: 20
        tolerance: { abs: 0.1 }
        unit: J
    explanation: |
      $\text{total in} = \text{useful out} + \text{dissipated}$, so
      $100 = 80 + E_\text{dissipated}$, giving $E_\text{dissipated}
      = 20\ \text{J}$.

  - id: motor-transfer
    format: numeric
    difficulty: 2
    objectives: ["5.1.2"]
    prompt: |
      An electric motor is supplied with $450\ \text{J}$ of electrical energy.
      $130\ \text{J}$ of this is dissipated to the thermal store of the motor.

      How much useful energy does the motor transfer to the load it drives?
    fields:
      - answer: 320
        tolerance: { abs: 0.5 }
        unit: J
    explanation: |
      $450 - 130 = 320\ \text{J}$ of useful energy is transferred to the load.
      Keep the books balanced: $320\ \text{J}$ useful $+$ $130\ \text{J}$
      dissipated $=$ $450\ \text{J}$ in.

  - id: pendulum-balance
    format: numeric
    difficulty: 2
    objectives: ["5.1.2"]
    prompt: |
      A pendulum bob is held at its highest point with $80\ \text{J}$ of stored
      energy and released. As it sweeps through the lowest point, $4.0\ \text{J}$
      has been dissipated to the surroundings.

      How much kinetic energy does the bob have at the lowest point?
    fields:
      - answer: 76
        tolerance: { abs: 0.2 }
        unit: J
    explanation: |
      $80 - 4.0 = 76\ \text{J}$. The rest is thermal energy in the air and at the
      pivot, so the swinging bob will not return to the same height.

  - id: explain-bounce
    format: explain
    difficulty: 3
    objectives: ["5.1.2"]
    prompt: |
      A ball dropped from a height of $1.5\ \text{m}$ bounces back to only about
      $0.9\ \text{m}$. Explain this using the conservation of energy.
    model: |
      When the ball is released it has a fixed amount of stored energy. As it
      falls, that energy is transferred to the kinetic energy store. On impact,
      some of the energy is transferred to the thermal store of the ball and the
      floor, and some to sound, so less energy remains in the mechanical stores.
      After the bounce the ball can therefore only reach a lower height: the
      energy it has left is not enough to take it back to $1.5\ \text{m}$. The
      energy has not been destroyed — the ball and floor have warmed slightly,
      so the total is unchanged.
    keyPoints:
      - The stored energy at release is fixed
      - Falling transfers that energy to the kinetic energy store
      - On impact some energy is transferred to thermal stores of ball and floor and to sound
      - With less mechanical energy left, the ball reaches a lower height
      - The missing energy has not been destroyed, only dissipated
    explanation: |
      The examiner wants: energy transferred to thermal/sound on impact, less
      mechanical energy remaining, and the total still conserved.
