id: energy-conservation-principle
subject: "9702"
topic: "5.1"
title: "The conservation of energy: nothing is created or destroyed"
summary: Energy can be transferred between stores and transformed from one form to another, but the total never changes — which makes energy bookkeeping possible.
order: 3
minutes: 5
kind: core
objectives: ["5.1.2"]
prerequisites: [energy-conservation-what-is-work]
