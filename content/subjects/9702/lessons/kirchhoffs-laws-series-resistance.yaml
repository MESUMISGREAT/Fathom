id: kirchhoffs-laws-series-resistance
subject: "9702"
topic: "10.2"
title: "Series resistors: deriving R = R₁ + R₂"
summary: Use Kirchhoff's two laws to prove that resistors in series simply add, then use the result to find currents and p.d.s.
