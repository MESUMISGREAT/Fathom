id: interference-double-slit
subject: "9702"
topic: "8.3"
title: "Young's double slit: λ = ax / D"
summary: "Two slits lit by one source give equally spaced fringes, and their spacing measures the wavelength."
order: 4
minutes: 8
kind: core
objectives: ["8.3.2", "8.3.4"]
prerequisites: ["interference-fringe-conditions", "interference-two-source-experiments"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.3
    Interference, learning outcomes 8.3.2 (experiments demonstrating two-source interference with
    light) and 8.3.4 (recall and use lambda = ax/D for double-slit interference). All questions are
    original; the quoted measurements are illustrative. Re-checked line by line on 2026-10-29 in a
    separate adversarial pass by the same AI model. No separate reviewer model and no teacher have
    reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can describe **Young's double-slit experiment**, explain why the fringes are
      equally spaced, and use

      $$\lambda = \frac{ax}{D}$$

      to find a wavelength or a fringe spacing.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\lambda$ | wavelength |

  - type: explain
    title: Young's trick
    body: |
      Shine monochromatic light through a **single narrow slit**, and then through **two** narrow
      slits close together. A screen some distance away shows a row of equally spaced bright and
      dark bands.

      The single slit matters: it makes the light arriving at the double slit coherent. The two
      slits then act as two coherent sources, and their waves overlap on the screen.

      This was strong evidence that light behaves as a wave — something particles could not explain.

  - type: diagram
    diagram: phys-interference-double-slit
    alt: >-
      Two slits S1 and S2 separated by a, with a screen a distance D away. Rays from both slits meet
      at P, a distance x from the centre. Notes give the path difference as approximately ax over D
      and the formula lambda equals ax over D.
    caption: >-
      For small angles the extra distance travelled from the lower slit is about ax/D.

  - type: explain
    title: Where the formula comes from
    body: |
      Look at the geometry. The two slits are a distance $a$ apart, the screen is a distance $D$
      away, and the point P is a distance $x$ from the centre of the pattern.

      The ray from the lower slit travels slightly further. For $x$ much smaller than $D$, that extra
      distance is

      $$\text{path difference} \approx \frac{ax}{D}.$$

      A bright fringe occurs where the waves arrive in phase, so the path difference must be a whole
      number of wavelengths:

      $$\frac{ax}{D} = n\lambda.$$

      For the spacing between **neighbouring** bright fringes, the path difference changes by one
      wavelength, so $n$ increases by 1 and

      $$x = \frac{\lambda D}{a}, \qquad \text{or} \qquad \lambda = \frac{ax}{D}.$$

  - type: definition
    term: Double-slit formula
    body: |
      $$\lambda = \frac{ax}{D}$$
      where $a$ is the separation of the slits, $x$ is the spacing between neighbouring bright
      fringes (centre to centre), and $D$ is the distance from the slits to the screen.

      All three lengths must be in the **same unit** before you divide.

  - type: example
    title: Finding the wavelength
    problem: |
      In a double-slit experiment the slits are $0.50\ \text{mm}$ apart and the screen is
      $2.0\ \text{m}$ away. The bright fringes are $2.4\ \text{mm}$ apart.

      Calculate the wavelength of the light.
    steps:
      - |
        Convert to metres: $a = 0.50 \times 10^{-3}\ \text{m}$,
        $x = 2.4 \times 10^{-3}\ \text{m}$, $D = 2.0\ \text{m}$.
      - |
        $$\lambda = \frac{ax}{D} = \frac{(0.50 \times 10^{-3})(2.4 \times 10^{-3})}{2.0}.$$
      - |
        $\lambda = \dfrac{1.2 \times 10^{-6}}{2.0} = 6.0 \times 10^{-7}\ \text{m}$.
      - |
        That is $600\ \text{nm}$ — orange-red light, a sensible answer.
    answer: |
      $\lambda = 6.0 \times 10^{-7}\ \text{m} = 600\ \text{nm}$

  - type: example
    title: Predicting the fringe spacing
    problem: |
      Light of wavelength $6.0 \times 10^{-7}\ \text{m}$ passes through slits
      $0.40\ \text{mm}$ apart onto a screen $1.5\ \text{m}$ away.

      Calculate the fringe spacing.
    steps:
      - |
        Rearrange: $x = \dfrac{\lambda D}{a}$.
      - |
        $x = \dfrac{(6.0 \times 10^{-7})(1.5)}{0.40 \times 10^{-3}}$.
      - |
        $x = \dfrac{9.0 \times 10^{-7}}{4.0 \times 10^{-4}} = 2.25 \times 10^{-3}\ \text{m}$.
      - |
        So the fringes are about $2.3\ \text{mm}$ apart.
    answer: |
      $x \approx 2.3\ \text{mm}$

  - type: explain
    title: What changes the pattern
    body: |
      From $x = \dfrac{\lambda D}{a}$:

      - **Longer wavelength** → wider spacing. Red fringes are further apart than blue ones.
      - **Larger slit separation** → narrower spacing.
      - **Further screen** → wider spacing.

      With white light, each wavelength makes its own pattern at a different spacing. The central
      fringe is white (all colours in phase there), and the fringes on either side are coloured and
      soon overlap.

      The fringes are equally spaced near the centre because the small-angle approximation holds
      there. Further out they become slightly uneven.

  - type: misconceptions
    items:
      - wrong: "x in the formula is the distance from the centre to the first fringe."
        right: >-
          $x$ is the spacing between **neighbouring** bright fringes. The distance from the centre to
          the first bright fringe equals $x$ only because the central fringe is itself a maximum.
      - wrong: "a is the width of each slit."
        right: >-
          $a$ is the distance **between** the two slits, measured centre to centre.
      - wrong: "You can mix millimetres and metres in the formula."
        right: >-
          Convert everything to the same unit first; mixing units is the most common arithmetic
          error.
      - wrong: "The single slit is unnecessary."
        right: >-
          It makes the light coherent. Without it, the two slits are not reliably in step and the
          fringes wash out.

  - type: exam
    body: |
      Write the formula, substitute with powers of ten, and give the wavelength in metres (or
      nanometres if asked). A unit slip of $10^3$ is the usual way to lose the mark.

      If the question gives the distance across several fringes, divide by the number of **gaps**
      between them to get $x$, just as with stationary waves.

      State what $a$, $x$ and $D$ are if the question asks you to define them.

  - type: check
    title: Check yourself
    questions: [wavelength-from-fringes, spacing-from-wavelength]

  - type: check
    title: Changing the set-up
    questions: [double-distance, wavelength-420]

  - type: check
    title: Why the single slit
    questions: [single-slit-purpose, unit-slip-error]

  - type: takeaways
    items:
      - "Young's double slit: one source, two slits, equally spaced fringes."
      - "λ = ax/D, with a the slit separation, x the fringe spacing and D the slit-screen distance."
      - "Bigger λ or D widens the fringes; bigger a narrows them."
      - "Convert every length to the same unit before dividing."

questions:
  - id: wavelength-from-fringes
    format: numeric
    difficulty: 2
    objectives: ["8.3.4"]
    prompt: |
      In a double-slit experiment the slit separation is $0.50\ \text{mm}$, the screen is
      $2.0\ \text{m}$ from the slits, and neighbouring bright fringes are $2.4\ \text{mm}$ apart.

      Calculate the wavelength of the light, in nanometres.
    fields:
      - answer: 600
        tolerance: { abs: 5 }
        unit: nm
    explanation: |
      $\lambda = \dfrac{ax}{D} = \dfrac{(0.50 \times 10^{-3})(2.4 \times 10^{-3})}{2.0} =
      6.0 \times 10^{-7}\ \text{m} = 600\ \text{nm}$.

  - id: spacing-from-wavelength
    format: numeric
    difficulty: 2
    objectives: ["8.3.4"]
    prompt: |
      Light of wavelength $6.0 \times 10^{-7}\ \text{m}$ is used with slits
      $0.40\ \text{mm}$ apart and a screen $1.5\ \text{m}$ away.

      Calculate the fringe spacing in millimetres.
    fields:
      - answer: 2.25
        tolerance: { abs: 0.05 }
        unit: mm
    explanation: |
      $x = \dfrac{\lambda D}{a} = \dfrac{(6.0 \times 10^{-7})(1.5)}{0.40 \times 10^{-3}} =
      2.25 \times 10^{-3}\ \text{m} = 2.25\ \text{mm}$.

  - id: double-distance
    format: mcq
    difficulty: 2
    objectives: ["8.3.4"]
    prompt: |
      In a double-slit experiment the screen is moved twice as far from the slits, with everything
      else unchanged. What happens to the fringe spacing?
    options:
      - text: "It doubles."
        correct: true
        why: "Correct: x is proportional to D, so doubling D doubles x."
      - text: "It halves."
        why: "That would happen if D were halved."
      - text: "It stays the same."
        why: "The geometry of the path difference changes with D."
      - text: "It becomes four times larger."
        why: "x is proportional to D, not to D squared."
    explanation: |
      $x = \dfrac{\lambda D}{a}$, so $x \propto D$.

  - id: wavelength-420
    format: numeric
    difficulty: 2
    objectives: ["8.3.4"]
    prompt: |
      Slits $0.25\ \text{mm}$ apart are illuminated and a screen is placed $1.2\ \text{m}$ away.
      Neighbouring bright fringes are $2.0\ \text{mm}$ apart.

      Calculate the wavelength of the light in metres, in scientific notation.
    fields:
      - answer: 4.2e-7
        tolerance: { rel: 0.02 }
        unit: m
    explanation: |
      $\lambda = \dfrac{ax}{D} = \dfrac{(0.25 \times 10^{-3})(2.0 \times 10^{-3})}{1.2} =
      4.17 \times 10^{-7}\ \text{m} \approx 4.2 \times 10^{-7}\ \text{m}$.

  - id: single-slit-purpose
    format: mcq
    difficulty: 2
    objectives: ["8.3.2"]
    prompt: |
      Why is a single narrow slit placed before the double slit in Young's experiment?
    options:
      - text: "To make the light reaching the two slits coherent."
        correct: true
        why: "Correct: the two slits then act as coherent sources with a constant phase difference."
      - text: "To make the light brighter."
        why: "A single narrow slit reduces the intensity rather than increasing it."
      - text: "To separate the colours of white light."
        why: "That would need a prism or grating, and monochromatic light is used anyway."
      - text: "To stop the light spreading out."
        why: "The slit itself diffracts the light, spreading it towards the double slit."
    explanation: |
      Light from one slit has a stable phase relationship across the double slit, so the two slits
      are coherent.

  - id: unit-slip-error
    format: spot-error
    difficulty: 3
    objectives: ["8.3.4"]
    prompt: |
      A student calculates a wavelength from double-slit data. One line is wrong.
    lines:
      - |
        The slit separation is $0.50\ \text{mm}$, the fringe spacing is $2.4\ \text{mm}$ and the
        screen distance is $2.0\ \text{m}$.
      - |
        $\lambda = \dfrac{ax}{D} = \dfrac{(0.50)(2.4)}{2.0} = 0.60\ \text{m}$.
      - |
        This is far too large for visible light, which should be a few hundred nanometres.
    errorLine: 2
    fix: |
      The millimetre values must be converted first:
      $\lambda = \dfrac{(0.50 \times 10^{-3})(2.4 \times 10^{-3})}{2.0} = 6.0 \times
      10^{-7}\ \text{m}$.
    explanation: |
      Substituting millimetres directly gives a result $10^6$ times too large. Convert every length
      to metres before dividing.
