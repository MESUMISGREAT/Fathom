id: momentum-newton-third-law
subject: "9702"
topic: "3.1"
title: "Newton's third law: forces come in pairs"
summary: If A exerts a force on B, then B exerts a force on A that is equal in magnitude, opposite in direction and of the same type.
order: 4
minutes: 5
objectives: ["3.1.5"]
prerequisites: [momentum-newton-weight]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 3.1.5, stating Newton's laws of motion and applying each one; this
    lesson covers the third law, with F = ma from 3.1.2 used to compare accelerations). The diagram
    shows the two third-law pairs for a book resting on a table, with all four forces drawn the
    same length. All worked values and answer keys computed with Python. All questions are
    original; masses and forces are illustrative values. Independently re-checked line by line
    (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet
    reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can state **Newton's third law**, find the partner of any force, and dodge the classic trap of pairing weight with the normal contact force.

  - type: explain
    title: You can't touch without being touched
    body: |
      Push on a wall and the wall pushes back on your hand: that push is what you feel. Two skaters shove each other and **both** glide away. A rocket throws gas backwards and the gas throws the rocket forwards.

      Forces never come alone. They come in **pairs**, one on each of the two objects that are interacting.

  - type: definition
    term: Newton's third law
    body: |
      If body A exerts a force on body B, then body B exerts a force on body A that is **equal in magnitude** and **opposite in direction**.

      The two forces are always of the **same type**.

  - type: explain
    title: Four checks for a genuine pair
    body: |
      A Newton's third law pair is two forces that:

      1. act on **different** objects (A on B, and B on A);
      2. are **equal** in magnitude;
      3. are **opposite** in direction, along the same line;
      4. are the **same type** of force (both gravitational, both contact, both frictional, both electric...).

      They also start and stop at the same instant; neither one comes "first".

      Quick trick: write the force as "**force of A on B**", then swap the letters. "Earth pulls book down" becomes "book pulls Earth up". Done.

  - type: diagram
    diagram: phys-momentum-newton-third-law-pairs
    alt: >-
      Separate force diagrams for a book resting on a table, in three columns. "On the book": an
      upward arrow N (table pushes book up) and a downward arrow W (Earth pulls book down). "On the
      table", shown without the book: a downward arrow (book pushes table down). "On the Earth",
      shown as the top of a large curved surface: an upward arrow (book pulls Earth up). All four
      arrows are the same length. A key explains that the two gravitational forces (Earth on book
      down, book on Earth up) are pair 1, and the two contact forces (table on book up, book on
      table down) are pair 2. A bold note says N and W both act on the book, so they are not a
      third-law pair.
    caption: Each pair is split across two different objects. The two forces on the book are from **different** pairs.

  - type: check
    questions: [third-law-cloze, book-pair]

  - type: intuition
    title: If the forces are equal, how does anything move?
    body: |
      A horse pulls a cart forwards; the cart pulls the horse backwards just as hard. So how do they ever get going?

      The two forces act on **different** objects, so they never cancel each other. To decide whether something accelerates, look only at the forces **on it**:

      - **On the horse:** the ground's forward friction on its hooves against the cart's backward pull. The friction is bigger, so the horse accelerates.
      - **On the cart:** the horse's forward pull against the friction on the cart's wheels. The pull is bigger, so the cart accelerates.

      Third-law partners never appear on the same free-body diagram.

  - type: example
    title: Skaters pushing apart
    problem: |
      On ice with negligible friction, Ana ($50\ \text{kg}$) pushes Ben ($75\ \text{kg}$) with a force of $150\ \text{N}$. Find the force on Ana and the acceleration of each skater while they push.
    steps:
      - |
        Third law: Ben pushes Ana with $150\ \text{N}$, in the opposite direction.
      - |
        Ben: $a = \dfrac{F}{m} = \dfrac{150}{75} = 2.0\ \text{m s}^{-2}$, in the direction of Ana's push.
      - |
        Ana: $a = \dfrac{150}{50} = 3.0\ \text{m s}^{-2}$, the opposite way.
    answer: |
      Equal forces, opposite directions, but **different accelerations**: the lighter skater accelerates more. The third law fixes the forces; $F = ma$ then turns each force into an acceleration.

  - type: check
    questions: [astronaut-push, truck-car]

  - type: misconceptions
    items:
      - wrong: The weight of a book and the normal contact force on it are a third-law pair.
        right: Both act on the **same** object (the book) and they are different types (gravitational and contact). They are equal only because the book isn't accelerating (first law). In a lift accelerating upwards, the contact force is bigger than the weight.
      - wrong: Third-law forces cancel out, so nothing could ever accelerate.
        right: They act on **different** objects, so they can't cancel. Each object accelerates according to the resultant of the forces on it alone.
      - wrong: In a crash, a lorry pushes harder on a car than the car pushes on the lorry.
        right: The two forces are exactly equal in size. The car comes off worse because its smaller mass gives it a much bigger acceleration.
      - wrong: The action force happens first and the reaction follows.
        right: The two forces exist at exactly the same time, for exactly as long.

  - type: exam
    body: |
      - Stating the law (usually 1–2 marks): **equal in magnitude**, **opposite in direction**, and acting on **different bodies**. Adding "of the same type" protects you.
      - "Identify the pair" questions: write each force as "force of X on Y" and swap X and Y. If the letters don't simply swap, it isn't a pair.
      - Never put both forces of a third-law pair on one free-body diagram; if you have, one of them is on the wrong object.

  - type: check
    questions: [horse-spot-error, n-w-explain]

  - type: takeaways
    items:
      - If A exerts a force on B, then B exerts an equal and opposite force of the same type on A.
      - The two forces of a pair act on different objects, so they never cancel each other.
      - Weight and normal contact force on the same object are **not** a third-law pair.
      - Equal forces on different masses give different accelerations ($a = F/m$ for each).

questions:
  - id: third-law-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.5"]
    prompt: |
      Newton's third law: if body A exerts a force on body B, then body B exerts a force on body {{1}} that is equal in {{2}} and opposite in {{3}}.
    blanks:
      - accept: [A]
      - accept: [magnitude, size]
      - accept: [direction]
    explanation: |
      The partner force acts on the **other** body (A), with the same magnitude and the opposite direction. The two forces are also of the same type.

  - id: book-pair
    format: mcq
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      A book rests on a table. Its weight is the gravitational pull of the Earth on the book. Which force is the Newton's third law partner of the book's weight?
    options:
      - text: The gravitational pull of the book on the Earth, upwards.
        correct: true
        why: Correct. Same type (gravitational), equal size, opposite direction, and it acts on the other body, the Earth.
      - text: The normal contact force of the table on the book, upwards.
        why: That force also acts on the book, and it's a contact force. A pair must act on two different objects and be the same type.
      - text: The push of the book on the table, downwards.
        why: That's the partner of the table's contact force on the book. It is a contact force, and it points the same way as the weight.
      - text: It has no partner, because the book is not moving.
        why: Third-law pairs exist whether or not anything moves.
    explanation: |
      Swap the letters: "Earth pulls book down" becomes "book pulls Earth up". The book really does pull the Earth upwards with a force equal to its weight; the Earth's enormous mass means its acceleration is far too small to notice.

  - id: astronaut-push
    format: numeric
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      An astronaut of mass $90\ \text{kg}$ (including her suit) floats beside a satellite of mass $1800\ \text{kg}$ in deep space. She pushes on the satellite with a force of $360\ \text{N}$. Calculate the size of the acceleration of the astronaut and of the satellite while she pushes.
    fields:
      - label: "astronaut ="
        answer: 4.0
        tolerance: { abs: 0.01 }
        unit: m s⁻²
      - label: "satellite ="
        answer: 0.20
        tolerance: { abs: 0.002 }
        unit: m s⁻²
    explanation: |
      By the third law the satellite pushes her back with $360\ \text{N}$. Astronaut: $a = \dfrac{360}{90} = 4.0\ \text{m s}^{-2}$. Satellite: $a = \dfrac{360}{1800} = 0.20\ \text{m s}^{-2}$, in the opposite direction. Equal forces; twenty times the mass gives one-twentieth of the acceleration.

  - id: truck-car
    format: mcq
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      A $12\,000\ \text{kg}$ lorry and a $1000\ \text{kg}$ car collide head-on. During the collision, how does the force of the lorry on the car compare with the force of the car on the lorry?
    options:
      - text: They are equal in magnitude and opposite in direction.
        correct: true
        why: Correct. They are a Newton's third law pair, so they are always equal and opposite.
      - text: The force on the car is 12 times bigger.
        why: It's the car's **acceleration** that is 12 times bigger, because the same force acts on one-twelfth of the mass.
      - text: The force on the lorry is 12 times bigger.
        why: The forces are a third-law pair, so they are equal whatever the masses.
      - text: It depends on which vehicle was moving faster.
        why: The speeds affect how big the pair of forces is, but never make the two forces unequal.
    explanation: |
      Third-law forces are equal and opposite whatever the masses or speeds. The difference in damage comes from $a = F/m$: the car's acceleration is twelve times the lorry's.

  - id: horse-spot-error
    format: spot-error
    difficulty: 3
    objectives: ["3.1.5"]
    prompt: |
      A student tries to explain how a horse pulls a cart. Which line contains the first error?
    lines:
      - |
        The horse pulls the cart forwards with a force $F$.
      - |
        By Newton's third law, the cart pulls the horse backwards with a force of the same size, $F$.
      - |
        These two forces are equal and opposite, so they cancel and the resultant force on the cart is zero.
      - |
        So the cart can never accelerate, however hard the horse pulls.
    errorLine: 3
    fix: |
      The two forces act on **different** objects (one on the cart, one on the horse), so they can't cancel. The cart accelerates if the horse's forward pull on it is bigger than the friction acting on the cart.
    explanation: |
      Lines 1 and 2 are a perfectly good statement of the third law. Line 3 adds together two forces that act on different bodies, which is never allowed.

  - id: n-w-explain
    format: explain
    difficulty: 2
    objectives: ["3.1.5"]
    prompt: |
      A box rests on a floor. Its weight and the normal contact force from the floor are equal in size and opposite in direction. Explain why they are **not** a Newton's third law pair.
    model: |
      A third-law pair is two forces of the same type that act on two different objects, each exerted by the other. The weight and the normal contact force both act on the same object, the box, and they are different types of force (gravitational and contact). They are equal only because the box is not accelerating (Newton's first law), not because of the third law: in a lift accelerating upwards, the contact force would be bigger than the weight. The weight's partner is the box's gravitational pull on the Earth (upwards); the contact force's partner is the box's push on the floor (downwards).
    keyPoints:
      - Both forces act on the same object (the box); a third-law pair acts on two different objects
      - They are different types of force (gravitational and contact); a pair is always the same type
      - They are equal only because the box is not accelerating (first law), not because of the third law
      - The weight's partner is the box pulling the Earth up; the contact force's partner is the box pushing the floor down
    explanation: |
      "Equal and opposite" is not enough to make a third-law pair. The test is: same type of force, on two different objects, with the letters swapped.
