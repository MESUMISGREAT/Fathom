id: elastic-plastic-work-done-area
subject: "9702"
topic: "6.2"
title: "Work done is the area under the force–extension graph"
summary: The stretching force changes as the object extends, so work is found by adding up thin strips of force × extra extension — the area under the graph.
order: 3
minutes: 8
kind: core
objectives: ["6.2.2"]
prerequisites: [elastic-plastic-deformation, stress-strain-hookes-law]
