id: diffraction-basics-what-is-diffraction
subject: "9702"
topic: "8.2"
title: "What diffraction actually is"
summary: "Waves spread out when they pass a gap or an edge. That is diffraction, it happens for every wave, and it leaves the wavelength untouched."
order: 1
minutes: 6
kind: core
objectives: ["8.2.1"]
prerequisites: ["progressive-waves-what-is-a-wave"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.2
    Diffraction, learning outcome 8.2.1 (explain what is meant by diffraction). All questions are
    original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by the same AI
    model. No separate reviewer model and no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can **define diffraction**, explain why it happens to **all** waves, say which
      quantities stay the same when a wave diffracts, and give everyday examples.

  - type: explain
    title: You hear it before you see it
    body: |
      Someone is talking in the corridor. You cannot see them — there is a wall and a doorway
      between you — but you can hear them perfectly well.

      Sound waves reach you by spreading out as they pass through the doorway. They do not just
      travel in a straight line like a torch beam.

      That spreading is **diffraction**. Light does it too: look at the soft edges of a shadow, or
      at the bright fringe that spills into the dark region behind a narrow slit.

  - type: definition
    term: Diffraction
    body: |
      The **spreading of waves** as they pass through an **aperture (gap)** or past an **obstacle
      or edge**.

  - type: explain
    title: What changes, and what does not
    body: |
      When a wave passes through a gap in the **same medium**, these stay the same:

      - **Wavelength** — set by the source and the medium.
      - **Frequency** — set by the source.
      - **Speed** — set by the medium.

      What changes is the **direction** the wavefronts travel in and how the wave's energy is
      spread. The wave fans out into a wider region, so its **amplitude** (and intensity) usually
      drops.

      Careful with a common slip: the wave does not "slow down" in a gap unless it enters a
      different medium.

  - type: intuition
    title: Why a gap turns into a new source
    body: |
      A useful model: treat every point on a wavefront as a tiny source of circular wavelets, and
      the next wavefront as the envelope of those wavelets.

      At a wide gap, many such point-sources sit side by side. Their wavelets add mostly forward,
      so the wave continues almost straight.

      At a narrow gap, there is effectively only **one** point-source left. It radiates circular
      waves in all forward directions, so the wave spreads out.

      This model is a picture, not a proof — but it predicts the right behaviour, and it explains
      why the gap width compared with the wavelength is what matters.

  - type: explain
    title: Why light does not seem to do it
    body: |
      Diffraction is only obvious when the gap or obstacle is **similar in size to the
      wavelength**.

      Visible light has a wavelength of about $5 \times 10^{-7}\ \text{m}$ — half a micrometre.
      Doorways, windows and letterboxes are millions of times wider, so a light beam passes through
      them almost unchanged.

      Shrink the gap to a fraction of a millimetre and light does spread noticeably. That is why
      diffraction of light is demonstrated with a **narrow slit** or a **diffraction grating**,
      where the slits are comparable with the wavelength.

      Sound has wavelengths of centimetres to metres, comparable with doorways, which is why you
      hear around corners every day.

  - type: misconceptions
    items:
      - wrong: "Only light diffracts."
        right: >-
          Every wave diffracts: sound, water waves, microwaves, radio waves, seismic waves. Light is
          simply the hardest to notice because its wavelength is so small.
      - wrong: "Diffraction changes the wavelength of the wave."
        right: >-
          The wavelength stays the same in the same medium. Diffraction changes the direction and
          spread of the wavefronts, not their wavelength or frequency.
      - wrong: "A wave only diffracts if the gap is exactly one wavelength wide."
        right: >-
          All waves diffract at every gap. The spreading is simply most noticeable when the gap is
          comparable with the wavelength.
      - wrong: "Diffraction makes the wave speed up as it squeezes through."
        right: >-
          Speed depends on the medium, not on the gap. In the same medium it is unchanged.

  - type: exam
    body: |
      The definition is worth two marks: the **spreading** of waves as they pass through a **gap**
      or past an **obstacle**.

      If asked to explain an observation, name the wave, state that it spreads after the gap or
      edge, and compare the gap width with the wavelength.

      Do not write "the waves bend" on its own — bending at a boundary is refraction. Diffraction
      is spreading **after** a gap or around an edge.

  - type: check
    title: Check yourself
    questions: [diffraction-definition, spreading-cloze]

  - type: check
    title: What stays the same
    questions: [wavelength-unchanged, light-why-not]

  - type: check
    title: Explain an observation
    questions: [everyday-examples]

  - type: takeaways
    items:
      - "Diffraction is the spreading of waves after a gap or past an edge."
      - "It happens to all waves; it is most noticeable when the gap is similar in size to the wavelength."
      - "In the same medium, wavelength, frequency and speed are unchanged; direction and amplitude change."

questions:
  - id: diffraction-definition
    format: mcq
    difficulty: 1
    objectives: ["8.2.1"]
    prompt: |
      Which statement best defines diffraction?
    options:
      - text: "The spreading of waves as they pass through a gap or past an obstacle."
        correct: true
        why: "Correct: this is the standard definition."
      - text: "The change in direction of a wave when it enters a new medium."
        why: "That is refraction, which involves a change of speed."
      - text: "The bouncing of waves from a surface."
        why: "That is reflection."
      - text: "The splitting of white light into colours."
        why: "That is dispersion, caused by different refractive indices for different wavelengths."
    explanation: |
      Diffraction is spreading after a gap or around an edge. Refraction, reflection and dispersion
      are different effects.

  - id: spreading-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.2.1"]
    prompt: |
      Diffraction is most noticeable when the width of the gap is similar to the **{{1}}** of the
      wave.
    blanks:
      - accept: ["wavelength", "wave length"]
    explanation: |
      The closer the gap width is to the wavelength, the greater the spreading. All waves diffract,
      but the effect is only obvious when these two sizes are comparable.

  - id: wavelength-unchanged
    format: mcq
    difficulty: 2
    objectives: ["8.2.1"]
    prompt: |
      A water wave passes through a gap in a barrier and spreads out on the other side, staying in
      the same depth of water. Which quantity is **unchanged**?
    options:
      - text: "The wavelength."
        correct: true
        why: "Correct: same medium, same speed and frequency, so the wavelength is unchanged."
      - text: "The direction of travel of the wavefronts."
        why: "Spreading means the wavefronts travel in a wider range of directions."
      - text: "The amplitude."
        why: "The energy is spread over a wider region, so the amplitude generally falls."
      - text: "The width of the beam."
        why: "Diffraction makes the beam wider, not narrower."
    explanation: |
      In the same medium the speed and frequency are unchanged, so $\lambda = \dfrac{v}{f}$ is
      unchanged. What changes is direction and amplitude.

  - id: light-why-not
    format: mcq
    difficulty: 2
    objectives: ["8.2.1"]
    prompt: |
      Why is diffraction of light hard to observe in everyday life?
    options:
      - text: "The wavelength of light is far smaller than everyday gaps and obstacles."
        correct: true
        why: "Correct: noticeable spreading needs a gap comparable with the wavelength, about 5 × 10⁻⁷ m."
      - text: "Light is a transverse wave and only longitudinal waves diffract."
        why: "Both transverse and longitudinal waves diffract."
      - text: "Light travels too fast to spread out."
        why: "Speed does not prevent diffraction; the wavelength-to-gap ratio is what matters."
      - text: "Light is absorbed by air before it can spread."
        why: "Air absorbs very little visible light over everyday distances."
    explanation: |
      Everyday gaps are enormous compared with the wavelength of light, so the spreading is tiny.
      Use a narrow slit or a grating to make the slits comparable with $\lambda$.

  - id: everyday-examples
    format: text
    style: short
    difficulty: 1
    objectives: ["8.2.1"]
    prompt: |
      Give **one** everyday example of diffraction.
    accept:
      - "hearing sound around a corner"
      - "hearing someone through a doorway"
      - "sound passing through a doorway"
      - "radio waves diffracting around hills"
      - "radio reception behind a hill"
      - "water waves spreading through a harbour entrance"
      - "light spreading through a narrow slit"
    model: |
      Any one of: hearing sound through a doorway or around a corner; radio waves reaching a valley
      behind a hill; water waves spreading after a harbour entrance; light spreading through a very
      narrow slit.
    explanation: |
      The key is that the wave spreads after passing a gap or edge whose size is comparable with
      its wavelength.
