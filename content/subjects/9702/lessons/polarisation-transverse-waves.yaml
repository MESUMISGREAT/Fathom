  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 7.5
    Polarisation, learning outcome 7.5.1 (polarisation as a phenomenon associated with
    transverse waves). All questions are original; the rope and microwave examples are
