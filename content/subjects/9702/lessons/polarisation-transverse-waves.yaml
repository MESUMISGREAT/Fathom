blocks:
  - type: objective
    body: |
      By the end you can explain what **polarisation** is, describe the difference between **unpolarised** and **plane-polarised** waves, and explain why only **transverse** waves can be polarised.

  - type: explain
    title: A wave that wiggles in every direction
    body: |
      Light is a **transverse** electromagnetic wave: its electric and magnetic field oscillations are perpendicular to the direction the wave travels.

      But "perpendicular" leaves a whole plane of directions. Imagine looking along the beam: the electric field could oscillate up and down, left and right, or at any angle in between.

      In **unpolarised** light, the oscillations are spread across all of those directions, and the direction changes randomly from moment to moment.

      **Polarisation** forces the oscillations into **one** direction. The wave still travels forward, but it now wiggles in a single plane.

  - type: definition
    term: Plane-polarised wave
    body: |
      A transverse wave whose oscillations are confined to a **single plane** containing the direction of propagation. The orientation of that plane is the **plane of polarisation**.

  - type: explain
    title: The rope through a fence
    body: |
      Imagine shaking a rope so that it wiggles randomly up, down and sideways. That is an unpolarised transverse wave.

      Now pass the rope through a narrow vertical gap between two fence boards. Only the up-and-down wiggles get through; the side-to-side wiggles hit the boards and are stopped.

      The wave emerging from the gap is **plane-polarised**: it oscillates in one plane only.

      A **polarising filter** does exactly this to light. It transmits the component of the electric field along its **transmission axis** and absorbs the perpendicular component.

      The analogy breaks in one way: a real filter does not physically block a rope, it absorbs light whose electric field is perpendicular to its axis. But the idea — keep one direction, remove the rest — is the same.

  - type: diagram
    diagram: phys-polarisation-transverse-planes
    alt: Three panels. A transverse wave with oscillations in many randomly oriented planes is labelled unpolarised. A transverse wave with oscillations in a single vertical plane is labelled plane-polarised. A longitudinal wave with compressions along the direction of travel is labelled not polarisable, because its oscillations are along the direction of travel.
    caption: |
      Polarisation selects one plane of oscillation. A longitudinal wave has no perpendicular plane to select, so it cannot be polarised.

  - type: explain
    title: Why sound is left out
    body: |
      Sound is a **longitudinal** wave. Its particles oscillate **along** the direction the wave travels: backwards and forwards, not side to side.

      There is no perpendicular plane in which the oscillation could be confined, so there is nothing to polarise. You cannot polarise sound in air, and no "sound Polaroid" exists.

      This gives a neat test. If a wave can be polarised, it must be transverse. The fact that light can be polarised was historically important evidence that light is a transverse wave, not a longitudinal one.

  - type: misconceptions
    items:
      - wrong: Polarisation makes a wave travel in one direction.
        right: |
          The wave already travels in one direction. Polarisation restricts the **oscillations**, not the direction of travel. The beam still moves forward; it just wiggles in one plane.
      - wrong: Polarised light is brighter than unpolarised light.
        right: |
          A filter removes some of the light, so the transmitted beam is usually **less** intense. Polarisation changes the direction of oscillation, not the amount of energy in a helpful way.
      - wrong: Sound can be polarised if it passes through a narrow slit.
        right: |
          A slit can diffract sound, spreading it out, but it cannot polarise it. Sound is longitudinal, and polarisation is a property of transverse waves only.
      - wrong: Only light can be polarised.
        right: |
          Any transverse wave can be polarised, including microwaves, radio waves and waves on a string. Light is just the most familiar example.

  - type: exam
    body: |
      - A definition question wants the key phrase: oscillations are confined to **one plane**. "The wave goes in one direction" scores nothing, because every wave does that.
      - To explain why sound cannot be polarised, say that its oscillations are **parallel** to the direction of propagation, so there is no perpendicular plane to restrict.
      - If asked how you could show that a wave is transverse, polarisation is the standard answer: pass it through a polarising filter and rotate a second filter; the transmitted intensity changes.
      - Do not confuse polarisation with reflection or diffraction. They are different phenomena, even though a reflected wave can become partly polarised.

  - type: deeper
    title: Which way does the electric field point?
    body: |
      Light is an electromagnetic wave with an oscillating **electric field** and an oscillating **magnetic field**, at right angles to each other and both perpendicular to the direction of travel.

      By convention, the **plane of polarisation** of an electromagnetic wave is the plane containing the electric field oscillation and the direction of propagation. The magnetic field oscillates in the perpendicular plane.

      When light reflects from a non-metallic surface such as water or glass, the reflected beam is partly polarised parallel to the surface. That is why polarising sunglasses, with their transmission axis vertical, reduce glare from horizontal surfaces: the reflected glare is mostly horizontally polarised, so the vertical filter absorbs it.

  - type: takeaways
    items:
      - Polarisation confines a transverse wave's oscillations to one plane.
      - Unpolarised waves oscillate in many planes; plane-polarised waves oscillate in one.
      - A polarising filter transmits the component along its axis and absorbs the perpendicular component.
      - Longitudinal waves cannot be polarised, because their oscillations are along the direction of travel.
      - Polarisation is evidence that light is a transverse wave.

  - type: check
    title: Transverse or not?
    questions: [which-can-be-polarised, unpolarised-meaning, plane-polarised-definition]

  - type: check
    title: Explain it
    questions: [sound-cannot-polarise, spot-the-error, polarisation-explanation, filter-action]

questions:
  - id: which-can-be-polarised
    format: mcq
    difficulty: 1
    objectives: ["7.5.1"]
    prompt: |
      Which of these waves can be polarised?
    options:
      - text: Light travelling through a vacuum
        correct: true
        why: |
          Light is a transverse electromagnetic wave, so its oscillations can be confined to one plane.
      - text: Sound travelling through air
        why: |
          Sound in air is longitudinal: the air particles oscillate along the direction of travel, so there is no perpendicular plane to select.
      - text: A longitudinal wave travelling along a spring
        why: |
          Its oscillations are along the spring, in the direction of travel, so there is no perpendicular plane to select.
      - text: A water wave travelling straight towards a beach
        why: |
          A water wave has a vertical oscillation, but it is not an electromagnetic transverse wave and is not polarised by a filter in the way light is.
    explanation: |
      Polarisation is a property of transverse waves. Light is transverse; sound is longitudinal.

  - id: unpolarised-meaning
    format: mcq
    difficulty: 1
    objectives: ["7.5.1"]
    prompt: |
      What does it mean to say that a beam of light is **unpolarised**?
    options:
      - text: Its oscillations occur in many planes, with no single preferred plane
        correct: true
        why: |
          Unpolarised light has electric-field oscillations spread across all directions perpendicular to the beam.
      - text: Its oscillations are confined to one plane
        why: |
          That describes plane-polarised light, not unpolarised light.
      - text: It is travelling in several directions at once
        why: |
          A beam travels in one direction. Polarisation is about the direction of oscillation, not the direction of travel.
      - text: It has no oscillations at all
        why: |
          A wave with no oscillation carries no energy. Unpolarised light certainly oscillates; it just does so in many planes.
    explanation: |
      Unpolarised means many planes of oscillation; plane-polarised means one.

  - id: plane-polarised-definition
    format: text
    difficulty: 2
    objectives: ["7.5.1"]
    style: definition
    prompt: |
      Define a **plane-polarised** wave.
    accept:
      - a transverse wave whose oscillations are confined to a single plane
      - a wave whose oscillations are confined to one plane
      - a transverse wave with oscillations in one plane only
      - oscillations confined to one plane
    model: |
      A transverse wave whose oscillations are confined to a single plane containing the direction of propagation.
    explanation: |
      The essential idea is one plane of oscillation. Mentioning that the wave is transverse makes the definition precise.

  - id: sound-cannot-polarise
    format: explain
    difficulty: 2
    objectives: ["7.5.1"]
    prompt: |
      Explain why a sound wave cannot be polarised.
    model: |
      Sound is a longitudinal wave: the particles oscillate backwards and forwards along the same line as the wave travels. Polarisation means restricting oscillations to one plane perpendicular to the direction of travel. Because a longitudinal wave has no oscillation perpendicular to its direction of travel, there is no plane to restrict, so it cannot be polarised.
    keyPoints:
      - Sound is longitudinal
      - The oscillations are along the direction of propagation
      - Polarisation requires oscillations perpendicular to the direction of travel
      - With no perpendicular oscillation, there is nothing to confine to a plane
    explanation: |
      The contrast with a transverse wave is the mark-winning point: transverse waves oscillate across the direction of travel, so those oscillations can be filtered to one plane.

  - id: spot-the-error
    format: spot-error
    difficulty: 2
    objectives: ["7.5.1"]
    prompt: |
      A student explains polarisation. Which line contains the first error?
    lines:
      - "A transverse wave oscillates perpendicular to its direction of travel."
      - "In unpolarised light, the oscillations are in many different planes."
      - "A polarising filter makes the light travel in a single direction."
      - "After the filter, the oscillations are confined to one plane."
      - "A longitudinal wave cannot be polarised because its oscillations are along the direction of travel."
    errorLine: 3
    fix: |
      The filter does not change the direction of travel; the light already travelled in one direction. It restricts the **oscillations** to one plane.
    explanation: |
      Polarisation is about the plane of oscillation, not the direction of the beam. This is the most common definition error.

  - id: polarisation-explanation
    format: explain
    difficulty: 2
    objectives: ["7.5.1"]
    prompt: |
      A student shines a beam of light through a polarising filter and rotates a second filter placed after it. The brightness seen through both changes. Explain what this shows about light.
    model: |
      The first filter plane-polarises the light, so its oscillations are confined to one plane. The second filter only transmits the component of the oscillation along its own axis. When the second filter's axis is parallel to the first, the light passes through strongly; when it is rotated to 90 degrees, the component along the axis is zero and no light passes. This shows that light is a transverse wave whose oscillations can be confined to a plane, which is what polarisation means.
    keyPoints:
      - The first filter plane-polarises the light
      - The second filter transmits only the component along its axis
      - Parallel axes transmit maximum light; crossed axes transmit none
      - This demonstrates that light is transverse
    explanation: |
      The changing brightness as the analyser rotates is the classic evidence for polarisation, and therefore for light being transverse.

  - id: filter-action
    format: mcq
    difficulty: 2
    objectives: ["7.5.1"]
    prompt: |
      What does a polarising filter do to unpolarised light?
    options:
      - text: It transmits the component of oscillation along its axis and absorbs the perpendicular component
        correct: true
        why: |
          The filter selects one direction of oscillation, so the transmitted light is plane-polarised.
      - text: It reflects all the light that does not match its axis
        why: |
          A filter mainly absorbs the unwanted component rather than reflecting it.
      - text: It slows the light down so that it travels in one plane
        why: |
          The speed of light in the filter changes, but that is refraction. Polarisation is about the direction of oscillation.
      - text: It changes unpolarised light into a longitudinal wave
        why: |
          Light remains a transverse electromagnetic wave. A filter cannot change its fundamental type.
    explanation: |
      A polarising filter acts like a gate for one direction of oscillation, transmitting that component and absorbing the rest.
