id: polarisation-transverse-waves
subject: "9702"
topic: "7.5"
title: Polarisation and transverse waves
summary: What it means for a wave to be plane-polarised, and why only transverse waves can be polarised.
order: 1
minutes: 5
kind: core
objectives: ["7.5.1"]
prerequisites: []
