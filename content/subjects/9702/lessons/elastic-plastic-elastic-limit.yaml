id: elastic-plastic-elastic-limit
subject: "9702"
topic: "6.2"
title: "The elastic limit: the point of no return"
summary: The elastic limit is the largest deformation that still springs back completely. It is not the same as the limit of proportionality.
order: 2
minutes: 7
kind: core
objectives: ["6.2.1"]
prerequisites: [elastic-plastic-deformation, stress-strain-hookes-law]
