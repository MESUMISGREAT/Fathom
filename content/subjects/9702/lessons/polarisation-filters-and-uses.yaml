id: polarisation-filters-and-uses
subject: "9702"
topic: "7.5"
title: Polarising filters in series and in use
summary: How filters select a plane, why a third filter can let light through crossed filters, and where polarisation matters in real devices.
order: 3
minutes: 6
kind: core
objectives: ["7.5.1", "7.5.2"]
prerequisites: [polarisation-malus-law]
