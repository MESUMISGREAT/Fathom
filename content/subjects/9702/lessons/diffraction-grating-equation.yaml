id: diffraction-grating-equation
subject: "9702"
topic: "8.4"
title: "The diffraction grating equation"
summary: "A grating has thousands of equally spaced slits. Maxima appear only at angles that satisfy d sin θ = nλ."
order: 1
minutes: 8
kind: core
objectives: ["8.4.1"]
prerequisites: ["interference-double-slit"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.4 The
    diffraction grating, learning outcome 8.4.1 (recall and use d sin theta = n lambda). All
    questions are original; the quoted wavelengths are illustrative. Re-checked line by line on
    2026-10-29 in a separate adversarial pass by the same AI model. No separate reviewer model and
    no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can use $d\sin\theta = n\lambda$, find the slit spacing from the grating's
      lines per millimetre, and work out the highest order that can be seen.

  - type: explain
    title: Thousands of slits, not two
    body: |
      A **diffraction grating** is a transparent plate ruled with thousands of equally spaced
      parallel slits, typically several hundred per millimetre.

      With two slits the fringes are broad and rather fuzzy. With thousands, the maxima become
      **narrow, sharp bright lines** on a dark background, because only at very precise angles do the
      waves from every slit arrive in phase. At every other angle they cancel.

      That sharpness is why a grating measures wavelength so accurately.

  - type: definition
    term: Slit spacing
    body: |
      If a grating has $N$ lines per metre, the spacing between neighbouring slits is

      $$d = \frac{1}{N}.$$

      For a grating quoted in lines per millimetre, $d$ in metres is
      $\dfrac{1}{N \times 10^{3}}$. For example, $500$ lines per millimetre gives
      $d = \dfrac{1}{500 \times 10^{3}} = 2.0 \times 10^{-6}\ \text{m}$.

  - type: diagram
    diagram: phys-diffraction-grating-paths
    alt: >-
      Three slits of a grating separated by d. Parallel rays arrive from the left and leave at angle
      theta to the straight-through direction. A dashed perpendicular marks the extra path d sin
      theta for the neighbouring slit, and the equation d sin theta equals n lambda is shown.
    caption: >-
      Waves from neighbouring slits differ in path by d sin θ, so they reinforce only when that is a
      whole number of wavelengths.

  - type: explain
    title: Where the equation comes from
    body: |
      Neighbouring slits are a distance $d$ apart. Rays leaving them at an angle $\theta$ to the
      straight-through direction differ in path length by $d\sin\theta$.

      For a maximum, every slit must be in step with its neighbour, so that path difference must be a
      whole number of wavelengths:

      $$d\sin\theta = n\lambda, \qquad n = 0, 1, 2, \ldots$$

      - $n = 0$ is the **central maximum**, straight through at $\theta = 0$.
      - $n = 1$ gives the **first order**, $n = 2$ the second order, and so on.

      The angle $\theta$ is always measured from the **straight-through direction**, not from the
      grating surface.

  - type: example
    title: Angles for a standard grating
    problem: |
      A grating has $500$ lines per millimetre. Light of wavelength $6.0 \times 10^{-7}\ \text{m}$
      is incident normally.

      Find (a) the slit spacing and (b) the angle of the first-order maximum.
    steps:
      - |
        $N = 500\ \text{mm}^{-1} = 5.0 \times 10^{5}\ \text{m}^{-1}$, so
        $d = \dfrac{1}{5.0 \times 10^{5}} = 2.0 \times 10^{-6}\ \text{m}$.
      - |
        For $n = 1$: $\sin\theta = \dfrac{n\lambda}{d} = \dfrac{6.0 \times 10^{-7}}{2.0 \times
        10^{-6}} = 0.30$.
      - |
        $\theta = \sin^{-1}(0.30) \approx 17.5^\circ$.
    answer: |
      (a) $d = 2.0 \times 10^{-6}\ \text{m}$ (b) $\theta \approx 17.5^\circ$

  - type: explain
    title: How many orders can you see?
    body: |
      Since $\sin\theta$ cannot exceed 1, the equation requires

      $$n \le \frac{d}{\lambda}.$$

      For the grating above, $\dfrac{d}{\lambda} = \dfrac{2.0 \times 10^{-6}}{5.0 \times 10^{-7}} = 4$,
      so $n$ can be 0, 1, 2, 3 — but not 4.

      At $n = 4$ the equation would need $\sin\theta = 1$, which means $\theta = 90^\circ$: the light
      would have to travel along the surface of the grating, where no maximum is observed.

      So the **highest visible order is 3**, and with $n = 3$ the angle is
      $\sin^{-1}(0.9) \approx 64^\circ$.

  - type: explain
    title: What a grating shows with white light
    body: |
      With monochromatic light every order is a sharp line of the same colour.

      With white light, the central maximum ($n = 0$) is white, because every wavelength has zero
      path difference there. But the other orders disperse: longer wavelengths diffract through
      larger angles, so each order becomes a **spectrum** with red on the outside and violet on the
      inside.

      That is exactly how a grating separates light into colours — and why it can be used to measure
      wavelength.

  - type: misconceptions
    items:
      - wrong: "d is the width of the grating."
        right: >-
          $d$ is the spacing between neighbouring slits, not the size of the whole grating.
      - wrong: "Use d = N when the grating is quoted in lines per millimetre."
        right: >-
          $d = 1/N$, and the units must be converted. 500 lines per mm gives
          $d = 2.0 \times 10^{-6}\ \text{m}$, not 500 or $5.0 \times 10^{5}$.
      - wrong: "θ is measured from the plane of the grating."
        right: >-
          It is measured from the straight-through direction (the normal to the grating).
      - wrong: "There is no limit to the order you can observe."
        right: >-
          Since $\sin\theta \le 1$, you need $n \le d/\lambda$. Higher orders do not exist.

  - type: exam
    body: |
      Write $d\sin\theta = n\lambda$ first, then substitute. Show the conversion from lines per mm to
      $d$ in metres explicitly; that is where most marks are lost.

      For the highest order, set $\sin\theta = 1$ and take the largest integer **strictly** below
      $d/\lambda$ if $d/\lambda$ is itself a whole number.

      Quote angles to a sensible precision (usually 3 significant figures) and remember that
      $\theta$ is measured from the centre of the pattern.

  - type: check
    title: Check yourself
    questions: [slit-spacing, first-order-angle]

  - type: check
    title: Orders and colours
    questions: [highest-order, longer-wavelength]

  - type: check
    title: Spot the slip
    questions: [d-equals-n-error, grating-cloze]

  - type: takeaways
    items:
      - "$d = 1/N$, where N is the number of lines per metre."
      - '$d\sin\theta = n\lambda$, with θ measured from the straight-through direction.'
      - '$n = 0$ is the central maximum; $n = 1, 2, \ldots$ are the orders.'
      - 'The highest order satisfies $n \le d/\lambda$; at equality the maximum is at 90° and is not seen.'

questions:
  - id: slit-spacing
    format: numeric
    difficulty: 1
    objectives: ["8.4.1"]
    prompt: |
      A diffraction grating has $500$ lines per millimetre.

      Calculate the spacing between neighbouring slits, in metres.
    fields:
      - answer: 2.0e-6
        tolerance: { rel: 0.02 }
        unit: m
    explanation: |
      $N = 500\ \text{mm}^{-1} = 5.0 \times 10^{5}\ \text{m}^{-1}$, so
      $d = \dfrac{1}{N} = 2.0 \times 10^{-6}\ \text{m}$.

  - id: first-order-angle
    format: numeric
    difficulty: 2
    objectives: ["8.4.1"]
    prompt: |
      A grating with slit spacing $2.0 \times 10^{-6}\ \text{m}$ is illuminated with light of
      wavelength $6.0 \times 10^{-7}\ \text{m}$.

      Find the angle of the first-order maximum, in degrees.
    fields:
      - answer: 17.5
        tolerance: { abs: 0.3 }
        unit: °
    explanation: |
      $\sin\theta = \dfrac{n\lambda}{d} = \dfrac{6.0 \times 10^{-7}}{2.0 \times 10^{-6}} = 0.30$,
      so $\theta = \sin^{-1}(0.30) \approx 17.5^\circ$.

  - id: highest-order
    format: numeric
    difficulty: 3
    objectives: ["8.4.1"]
    prompt: |
      A grating has slit spacing $2.0 \times 10^{-6}\ \text{m}$. Light of wavelength
      $5.0 \times 10^{-7}\ \text{m}$ passes through it.

      Find the highest order of maximum that can be observed.
    fields:
      - answer: 3
        tolerance: { abs: 0.01 }
    explanation: |
      $n \le \dfrac{d}{\lambda} = \dfrac{2.0 \times 10^{-6}}{5.0 \times 10^{-7}} = 4$. At $n = 4$,
      $\sin\theta = 1$ and $\theta = 90^\circ$, which is not observed, so the highest visible order
      is $n = 3$.

  - id: longer-wavelength
    format: mcq
    difficulty: 2
    objectives: ["8.4.1"]
    prompt: |
      Light of two wavelengths passes through the same grating. What happens to the angle of the
      first-order maximum?
    options:
      - text: "It is larger for the longer wavelength."
        correct: true
        why: "Correct: sin θ = λ/d, so a larger λ gives a larger angle."
      - text: "It is larger for the shorter wavelength."
        why: "The relationship is the other way round: shorter wavelength, smaller angle."
      - text: "It is the same for both."
        why: "The angle depends on wavelength, which is why a grating disperses light."
      - text: "It is zero for both."
        why: "Only the central (n = 0) maximum is at zero angle."
    explanation: |
      $\sin\theta = \dfrac{n\lambda}{d}$, so the angle increases with wavelength. This is how a
      grating splits white light into a spectrum.

  - id: d-equals-n-error
    format: spot-error
    difficulty: 3
    objectives: ["8.4.1"]
    prompt: |
      A student uses a grating's specification. One line is wrong.
    lines:
      - |
        The grating has $300$ lines per millimetre, so $d = 300\ \text{m}$.
      - |
        For light of wavelength $6.0 \times 10^{-7}\ \text{m}$, $\sin\theta = \dfrac{\lambda}{d}$.
      - |
        With the correct spacing of $3.3 \times 10^{-6}\ \text{m}$, the first-order angle is about
        $10.4^\circ$.
    errorLine: 1
    fix: |
      $d = \dfrac{1}{N} = \dfrac{1}{300\ \text{mm}^{-1}} = 3.3 \times 10^{-3}\ \text{mm} =
      3.3 \times 10^{-6}\ \text{m}$.
    explanation: |
      The spacing is the reciprocal of the number of lines per unit length, not the number itself.
      The third line shows the correct value.

  - id: grating-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.4.1"]
    prompt: |
      For a diffraction grating, maxima occur when $d\sin\theta = n$**{{1}}**, and the slit spacing
      is $d = 1/$**{{2}}**, where N is the number of lines per metre.
    blanks:
      - accept: ["λ", "lambda", "λ (wavelength)"]
      - accept: ["N"]
    explanation: |
      $d\sin\theta = n\lambda$ and $d = 1/N$.
