id: interference-two-source-experiments
subject: "9702"
topic: "8.3"
title: "Two-source interference in the lab"
summary: "Ripple tanks, loudspeakers and microwave horns all show the same thing: overlapping coherent waves make fixed maxima and minima."
order: 2
minutes: 7
kind: core
objectives: ["8.3.2"]
prerequisites: ["interference-coherence"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.3
    Interference, learning outcome 8.3.2 (experiments demonstrating two-source interference with
    water waves, sound and microwaves; light is covered in the double-slit lesson). All questions are
    original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by the same AI
    model. No separate reviewer model and no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can describe **three experiments** that demonstrate two-source interference,
      explain how each produces **coherent** waves, and say what is observed.

  - type: explain
    title: One source, two paths
    body: |
      Every experiment in this lesson uses the same trick. Instead of two independent sources, take
      **one** source and split its output into two paths.

      Whatever the source does — every flicker, every change of phase — happens to both waves at
      once. They therefore stay in step: they are **coherent**.

      Then let the two waves overlap and look for the pattern: places where they always reinforce,
      and places where they always cancel.

  - type: explain
    title: Water waves in a ripple tank
    body: |
      A ripple tank has a vibrating bar with **two small dippers** hanging from it. Both dippers
      touch the water and move up and down together, so they are coherent sources of circular
      ripples.

      The two sets of circular wavefronts cross. Where a crest from one meets a crest from the other,
      the water moves strongly; where crest meets trough, it stays almost still.

      **What you see:** a pattern of **nodal lines** — straight or curved lines radiating out from
      between the dippers, along which the water hardly moves. Between them are regions of large
      amplitude. The pattern is fixed in space while the dippers vibrate.

      Changing the dipper frequency changes the wavelength, and the spacing of the nodal lines
      changes with it.

  - type: explain
    title: Sound from two loudspeakers
    body: |
      Connect two loudspeakers to the **same signal generator**, so they emit the same frequency in
      phase. Walk along a line a few metres away, or move a microphone along it.

      The sound alternates between **loud** and **quiet** as you move: maxima where the path
      difference is a whole number of wavelengths, minima where it is an odd number of half
      wavelengths.

      The positions of the loud and quiet spots are fixed, because the sources are coherent. If you
      drove the speakers from two separate signal generators, the pattern would wander and you would
      hear no steady alternation.

  - type: explain
    title: Microwaves from two horns
    body: |
      Two small horn antennas are fed from the same microwave oscillator and point at a detector.

      Move the detector across the region where the beams overlap. Its reading rises and falls:
      **maxima** at points where the waves arrive in phase, **minima** where they arrive in
      antiphase.

      This works well because microwaves have wavelengths of a few centimetres, so the maxima are
      far enough apart to locate with a probe. It is the microwave version of the double-slit
      experiment.

  - type: explain
    title: Why light needs a different arrangement
    body: |
      You cannot simply put two lamps side by side: they are incoherent.

      Light also has a wavelength of only about $5 \times 10^{-7}\ \text{m}$, so the maxima are
      extremely close together unless the sources are very close and the screen is far away.

      The solution, used by Young, is to pass light from **one** source through two very narrow
      slits. The slits act as two coherent sources. That experiment is the subject of the next
      lesson but one.

  - type: misconceptions
    items:
      - wrong: "Two loudspeakers playing the same note always interfere."
        right: >-
          They must be driven from the same source so that they are coherent. Two separate players
          drift out of step and the pattern wanders.
      - wrong: "The nodal lines in a ripple tank are places where no waves arrive."
        right: >-
          Both waves arrive there; they cancel because they are in antiphase. The water is still, not
          empty of waves.
      - wrong: "Switching off one dipper leaves the same pattern but fainter."
        right: >-
          The pattern disappears entirely: with one source there is no interference, just a single
          set of circular ripples.
      - wrong: "Microwaves cannot show interference because they are not light."
        right: >-
          Any waves interfere if they are coherent. Microwaves are ideal because their wavelength is
          convenient for the apparatus.

  - type: exam
    body: |
      For each experiment, be ready to state: the **source**, how the two waves are made
      **coherent**, what is **observed**, and how the observation depends on wavelength.

      "Why are the sources coherent?" is answered by "they come from a single source" — not by "they
      have the same frequency" alone.

      When describing the ripple tank, say that the dippers are attached to the **same vibrating
      bar**; for sound, that both loudspeakers are driven by the **same signal generator**.

  - type: check
    title: Check yourself
    questions: [ripple-tank-observation, sound-alternation]

  - type: check
    title: Coherence in practice
    questions: [same-generator, one-source-cloze]

  - type: check
    title: Spot the slip
    questions: [separate-oscillators, switch-off]

  - type: takeaways
    items:
      - All three experiments split one source into two paths, making the waves coherent.
      - 'Ripple tank: two dippers on one bar give fixed nodal lines.'
      - 'Sound: two loudspeakers on one signal generator give loud and quiet positions.'
      - 'Microwaves: two horns on one oscillator give maxima and minima along a line.'

questions:
  - id: ripple-tank-observation
    format: mcq
    difficulty: 1
    objectives: ["8.3.2"]
    prompt: |
      Two dippers attached to the same vibrating bar touch the surface of a ripple tank. What is
      observed?
    options:
      - text: "A fixed pattern of nodal lines where the water hardly moves, with strong vibration between them."
        correct: true
        why: "Correct: the two sets of coherent ripples superpose, giving lines of destructive interference."
      - text: "A single set of circular ripples spreading from the midpoint."
        why: "Two separate dippers produce two sets of ripples, which then overlap."
      - text: "The water surface becomes completely still everywhere."
        why: "Cancellation happens only along the nodal lines, not everywhere."
      - text: "The ripples move in a single straight line away from the dippers."
        why: "Each dipper produces circular ripples; their overlap creates the pattern."
    explanation: |
      The dippers are coherent, so the interference pattern is fixed: nodal lines of cancellation
      alternate with regions of large amplitude.

  - id: sound-alternation
    format: mcq
    difficulty: 2
    objectives: ["8.3.2"]
    prompt: |
      Two loudspeakers are driven in phase by one signal generator. A microphone is moved along a
      line in front of them. What is heard?
    options:
      - text: "Alternating loud and quiet positions, fixed in space."
        correct: true
        why: "Correct: maxima and minima occur where the path difference is a whole or half number of wavelengths."
      - text: "A steady volume everywhere, because both speakers play the same note."
        why: "Overlapping coherent waves reinforce at some points and cancel at others."
      - text: "A note that rises and falls in pitch."
        why: "Both waves have the same frequency, so the pitch does not change."
      - text: "Silence everywhere, because the two waves cancel."
        why: "Complete cancellation happens only at the minima, not at every point."
    explanation: |
      Moving along the line changes the path difference, so the point alternates between maximum and
      minimum. The positions are fixed because the sources are coherent.

  - id: same-generator
    format: text
    style: short
    difficulty: 1
    objectives: ["8.3.2"]
    prompt: |
      In the sound experiment, why are both loudspeakers connected to the **same** signal generator?
    accept:
      - "so that the sources are coherent"
      - "to make the waves coherent"
      - "so they have a constant phase difference"
      - "so they stay in phase"
      - "so the waves are in step"
    model: |
      So that the two loudspeakers are coherent: they have the same frequency and a constant phase
      difference, which gives a steady interference pattern.
    explanation: |
      A shared source guarantees that any change in phase happens to both waves at once.

  - id: one-source-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.3.2"]
    prompt: |
      In each experiment the two waves come from a **{{1}}** source, which makes them
      **{{2}}**.
    blanks:
      - accept: ["single", "same", "common"]
      - accept: ["coherent"]
    explanation: |
      Splitting one source guarantees a constant phase difference, so the pattern is stable.

  - id: separate-oscillators
    format: spot-error
    difficulty: 3
    objectives: ["8.3.2"]
    prompt: |
      A student plans a microwave interference experiment. One line is wrong.
    lines:
      - |
        Two microwave horns are connected to separate oscillators and aimed at a detector.
      - |
        The detector reading will show a fixed pattern of maxima and minima as it is moved.
      - |
        To make the pattern steady, both horns should be fed from the same oscillator.
    errorLine: 2
    fix: |
      With separate oscillators the sources are **incoherent**, so the maxima and minima drift and no
      fixed pattern is observed. The third line has the right fix.
    explanation: |
      Microwave oscillators are not locked together unless they share a source, so the phase
      difference between the two beams changes constantly.

  - id: switch-off
    format: mcq
    difficulty: 2
    objectives: ["8.3.2"]
    prompt: |
      In the ripple-tank experiment, one dipper is lifted out of the water. What happens to the
      interference pattern?
    options:
      - text: "It disappears, leaving a single set of circular ripples."
        correct: true
        why: "Correct: interference needs two coherent waves; with one source there is nothing to superpose."
      - text: "It stays the same but half as bright."
        why: "The pattern is not just a brightness effect; removing one source removes the superposition entirely."
      - text: "The nodal lines become closer together."
        why: "The spacing depends on the wavelength and the source separation, and there is now only one source."
      - text: "The remaining ripples become plane waves."
        why: "A single point dipper still produces circular ripples."
    explanation: |
      Removing one source removes one of the two superposing waves, so the interference pattern
      disappears.
