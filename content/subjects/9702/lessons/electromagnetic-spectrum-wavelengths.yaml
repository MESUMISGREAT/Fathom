id: electromagnetic-spectrum-wavelengths
subject: "9702"
topic: "7.4"
title: The order of the electromagnetic spectrum
summary: The seven regions in wavelength order, their approximate ranges, and the tiny 400–700 nm slice your eye can see.
order: 2
minutes: 10
kind: core
objectives: ["7.4.2", "7.4.3"]
prerequisites: [electromagnetic-spectrum-transverse]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027, topic 7.4, learning outcomes 7.4.2 (approximate free-space wavelength ranges of
    the principal regions) and 7.4.3 (visible range 400-700 nm). The ranges are the conventional
