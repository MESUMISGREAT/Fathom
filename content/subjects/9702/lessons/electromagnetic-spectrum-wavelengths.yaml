    Re-checked line by line in a second, adversarial pass by the same agent on 2026-10-28: every worked answer and every answer key was recomputed in Python from the question's own data, each MCQ was checked for exactly one defensible correct option, and every objective was re-read against the syllabus wording. Chromium cannot launch in this environment, so the diagrams were checked by reading their coordinates and label boxes rather than by viewing a render, and that caught four label and stroke faults that were fixed. No separate reviewer model was available and no teacher has reviewed this lesson.

blocks:
  - type: objective
    body: |-
      By the end you can list the seven regions of the electromagnetic spectrum in order, give an approximate wavelength range for each, and state the wavelength range the human eye can detect.

  - type: explain
    title: One spectrum, seven names
    body: |-
      Electromagnetic waves are all the same kind of wave. We split them into regions because they are **produced and detected in different ways**, and because our eyes happen to respond to only a tiny slice.

      The regions, in order of **decreasing wavelength**, are radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays.

      Because $c = f\lambda$ and $c$ is fixed, frequency runs the other way: radio waves have the lowest frequencies and gamma rays the highest.

      The ranges below are **approximate**. Real sources do not check which box they belong in, so the boundaries are fuzzy and the regions overlap slightly. Learn the order and the approximate sizes, not a precise cut-off.

      | Region | Approximate free-space wavelength |
      | --- | --- |
      | Radio waves | longer than $0.1\ \text{m}$ |
      | Microwaves | $0.1\ \text{m}$ to $1\ \text{mm}$ |
      | Infrared | $1\ \text{mm}$ to $700\ \text{nm}$ |
      | Visible light | $700\ \text{nm}$ to $400\ \text{nm}$ |
      | Ultraviolet | $400\ \text{nm}$ to $10\ \text{nm}$ |
      | X-rays | $10\ \text{nm}$ to $0.01\ \text{nm}$ |
      | Gamma rays | shorter than $0.01\ \text{nm}$ |

  - type: diagram
    diagram: phys-electromagnetic-spectrum-wavelength-ladder
    alt: >-
      Seven stacked rows, one per region of the electromagnetic spectrum, from radio waves at
      the top to gamma rays at the bottom. Each row names the region and gives its approximate
      wavelength range, from longer than zero point one metres for radio waves down to shorter
      than zero point zero one nanometres for gamma rays. The visible light row is highlighted
      and gives the range seven hundred to four hundred nanometres.
    caption: |-
      Wavelength decreases going down the ladder, and frequency increases. The rows are equal lengths: the order and the ranges carry the meaning, not the bar size.

  - type: explain
    title: Read the ranges as powers of ten
    body: |-
      The numbers look messy until you notice they are mostly powers of ten:

      - $1\ \text{mm} = 10^{-3}\ \text{m}$
      - $1\ \text{nm} = 10^{-9}\ \text{m}$, so $700\ \text{nm} = 7.0 \times 10^{-7}\ \text{m}$
      - $0.01\ \text{nm} = 10^{-11}\ \text{m}$

      Doing that conversion first makes the comparisons easy. A microwave at $1\ \text{mm}$ is $10^{-3}\ \text{m}$ and a visible wave at $1\ \text{nm}$ is $10^{-9}\ \text{m}$, so the microwave is $10^{-3} \div 10^{-9} = 10^{6}$ times longer — a million times. Powers of ten keep you honest; guessing from the units alone is where mistakes creep in.

      Put another way, the whole visible band from $400$ to $700\ \text{nm}$ spans less than one factor of two in wavelength, while the spectrum as a whole spans more than ten powers of ten.

  - type: intuition
    title: A mnemonic that earns its keep
    body: |-
      In wavelength order, longest first:

      **R**adio, **M**icrowave, **I**nfrared, **V**isible, **U**ltraviolet, **X**-ray, **G**amma.

      One way to hold it: **R**un **M**y **I**ncredible **V**ehicle **U**nder **X**-ray **G**oggles. Silly, which is exactly why it sticks.

      A second check that needs no mnemonic: work outwards from visible light. Infrared sits just beyond the red end (infra means below), and ultraviolet just beyond the violet end (ultra means beyond). Everything else falls into place around them.

      Where the memory aids stop helping: they give the order, not the ranges. You still need the approximate boundaries in the table.

  - type: check
    title: Quick check
    questions: [spectrum-order, visible-range, spectrum-cloze]

  - type: example
    title: "Worked example: which region is this?"
    problem: |-
      Identify the region of the electromagnetic spectrum for each wavelength.

      1. $\lambda = 0.05\ \text{m}$
      2. $\lambda = 2.0 \times 10^{-10}\ \text{m}$
      3. $\lambda = 3.0 \times 10^{-7}\ \text{m}$
    steps:
      - |-
        For (1), $0.05\ \text{m}$ is $5\ \text{cm}$. That sits between $0.1\ \text{m}$ and $1\ \text{mm}$, so it is a **microwave**.
      - |-
        For (2), convert to nanometres: $2.0 \times 10^{-10}\ \text{m} = 0.20\ \text{nm}$. That is between $10\ \text{nm}$ and $0.01\ \text{nm}$, so it is an **X-ray**.
      - |-
        For (3), convert to nanometres: $3.0 \times 10^{-7}\ \text{m} = 300\ \text{nm}$. Visible light stops at $400\ \text{nm}$, and ultraviolet runs from $400\ \text{nm}$ down to $10\ \text{nm}$, so this is **ultraviolet**.
    answer: |-
      1 microwave, 2 X-ray, 3 ultraviolet. Converting to nanometres first makes each comparison immediate.

  - type: example
    title: "Worked example: visible light in numbers"
    problem: |-
      Green light has a wavelength of $550\ \text{nm}$ in free space.

      Find its frequency.
    steps:
      - |-
        Convert to metres, using $1\ \text{nm} = 10^{-9}\ \text{m}$:

        $$\lambda = 550\ \text{nm} = 550 \times 10^{-9}\ \text{m} = 5.50 \times 10^{-7}\ \text{m}$$
      - |-
        Use $c = f\lambda$ and rearrange:

        $$f = \frac{c}{\lambda} = \frac{3.00 \times 10^8}{5.50 \times 10^{-7}}$$
      - |-
        Divide the numbers and subtract the indices: $3.00 \div 5.50 = 0.545$, and $10^{8} \div 10^{-7} = 10^{15}$.

        So $f = 0.545 \times 10^{15}\ \text{Hz} = 5.45 \times 10^{14}\ \text{Hz}$.
      - |-
        Check the order of magnitude: visible frequencies are a few hundred terahertz, and $5.45 \times 10^{14}\ \text{Hz}$ is $545\ \text{THz}$. ✔
    answer: |-
      $f \approx 5.45 \times 10^{14}\ \text{Hz}$.

  - type: misconceptions
    items:
      - wrong: Microwaves have shorter wavelengths than infrared.
        right: |-
          Microwaves are **longer** than infrared. Order matters: radio, microwave, infrared, visible.
      - wrong: Visible light is a large part of the electromagnetic spectrum.
        right: |-
          It is a tiny sliver, from $400$ to $700\ \text{nm}$, out of a spectrum that runs from picometres to kilometres.
      - wrong: X-rays and gamma rays are completely different kinds of wave.
        right: |-
          Both are electromagnetic and their wavelength ranges overlap. The names reflect how they are produced, not a hard physical difference.
      - wrong: The ranges have exact boundaries, so $699\ \text{nm}$ and $701\ \text{nm}$ are different regions.
        right: |-
          The boundaries are approximate. Learn the order and the rough sizes, and treat a value near a boundary with care.
      - wrong: Violet light has a longer wavelength than red light.
        right: |-
          Violet is the short-wavelength end at about $400\ \text{nm}$; red is the long-wavelength end at about $700\ \text{nm}$.

  - type: exam
    body: |-
      - Learn the order in one direction and reverse it when asked. "Longest wavelength first" is the version most questions use.
      - Quote the visible range as $400$ to $700\ \text{nm}$ — the syllabus gives exactly those numbers, so do not round them to $350$–$750$.
      - Convert to metres before using $c = f\lambda$. A wavelength in nm and a speed in $\text{m s}^{-1}$ will otherwise give an answer wrong by a factor of $10^9$.
      - For "which region" questions, convert the wavelength to nanometres and compare with the table.

  - type: takeaways
    items:
      - 'Wavelength order, longest first: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.'
      - 'Frequency order is the reverse of the wavelength order.'
      - 'Approximate ranges: radio $> 0.1\ \text{m}$, microwave $0.1\ \text{m}$ to $1\ \text{mm}$, infrared $1\ \text{mm}$ to $700\ \text{nm}$, visible $700$–$400\ \text{nm}$, ultraviolet $400$–$10\ \text{nm}$, X-ray $10$–$0.01\ \text{nm}$, gamma $< 0.01\ \text{nm}$.'
      - 'The human eye detects only $400$ to $700\ \text{nm}$.'

  - type: check
    title: Practice
    questions: [green-nm, green-frequency, ultraviolet-region]
questions:
  - id: spectrum-order
    format: mcq
    difficulty: 1
    objectives: ["7.4.2"]
    prompt: |-
      Which list gives the regions of the electromagnetic spectrum in order of decreasing wavelength?
    options:
      - text: Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma
        correct: true
        why: |-
          This is the standard order from longest wavelength to shortest.
      - text: Radio, infrared, microwave, visible, ultraviolet, gamma, X-ray
        why: |-
          Microwaves are longer than infrared, and X-rays are longer than gamma rays.
      - text: Gamma, X-ray, ultraviolet, visible, infrared, microwave, radio
        why: |-
          This is the correct order of increasing wavelength, which is the reverse of what was asked.
      - text: Microwave, radio, infrared, ultraviolet, visible, X-ray, gamma
        why: |-
          Radio waves are longer than microwaves, and visible is longer than ultraviolet.
    explanation: |-
      Longest to shortest: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.

  - id: visible-range
    format: mcq
    difficulty: 1
    objectives: ["7.4.3"]
    prompt: |-
      The human eye detects which range of free-space wavelengths?
    options:
      - text: $400$ to $700\ \text{nm}$
        correct: true
        why: |-
          This is the visible band, roughly violet at $400\ \text{nm}$ to red at $700\ \text{nm}$.
      - text: $10$ to $400\ \text{nm}$
        why: |-
          This is the ultraviolet range.
      - text: $700\ \text{nm}$ to $1\ \text{mm}$
        why: |-
          This is the infrared range.
      - text: $0.1\ \text{m}$ to $1\ \text{mm}$
        why: |-
          This is the microwave range.
    explanation: |-
      Visible light runs from about $400\ \text{nm}$ (violet) to about $700\ \text{nm}$ (red).

  - id: spectrum-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.4.2"]
    prompt: |-
      In order of decreasing wavelength, the spectrum runs radio, {{1}}, infrared, {{2}}, ultraviolet, X-rays and gamma rays.
    blanks:
      - accept: [microwave, microwaves]
      - accept: [visible, visible light]
    explanation: |-
      Microwaves sit between radio and infrared, and visible light sits between infrared and ultraviolet.

  - id: green-nm
    format: numeric
    difficulty: 2
    objectives: ["7.4.3"]
    prompt: |-
      Green light has a wavelength of $550\ \text{nm}$.

      What is this wavelength in metres?
    fields:
      - label: "λ ="
        answer: 0.00000055
        unit: m
        tolerance: { rel: 0.01 }
    explanation: |-
      $1\ \text{nm} = 10^{-9}\ \text{m}$, so $550\ \text{nm} = 550 \times 10^{-9}\ \text{m} = 5.5 \times 10^{-7}\ \text{m}$.

  - id: green-frequency
    format: numeric
    difficulty: 2
    objectives: ["7.4.3"]
    prompt: |-
      Green light has a wavelength of $550\ \text{nm}$ in free space.

      Find its frequency, in units of $10^{14}\ \text{Hz}$.
    fields:
      - label: "f ="
        answer: 5.45
        unit: × 10¹⁴ Hz
        tolerance: { rel: 0.01 }
    explanation: |-
      $\lambda = 5.50 \times 10^{-7}\ \text{m}$, so $f = c/\lambda = 3.00 \times 10^8 / 5.50 \times 10^{-7} = 5.45 \times 10^{14}\ \text{Hz}$.

  - id: ultraviolet-region
    format: mcq
    difficulty: 3
    objectives: ["7.4.2"]
    prompt: |-
      A wave has a free-space wavelength of $3.0 \times 10^{-7}\ \text{m}$. Which region does it belong to?
    options:
      - text: Ultraviolet
        correct: true
        why: |-
          $3.0 \times 10^{-7}\ \text{m} = 300\ \text{nm}$, which is shorter than the visible range and longer than $10\ \text{nm}$.
      - text: Visible light
        why: |-
          Visible runs from $400$ to $700\ \text{nm}$; $300\ \text{nm}$ is too short.
      - text: Infrared
        why: |-
          Infrared is longer than visible, above $700\ \text{nm}$.
      - text: X-rays
        why: |-
          X-rays are shorter than $10\ \text{nm}$; $300\ \text{nm}$ is far too long.
    explanation: |-
      Convert first: $3.0 \times 10^{-7}\ \text{m} = 300\ \text{nm}$, which lies in the ultraviolet.
