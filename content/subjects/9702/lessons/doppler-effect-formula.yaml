id: doppler-effect-formula
subject: "9702"
topic: "7.3"
title: "The Doppler formula, sign by sign"
summary: Where f-o equals f-s v over (v plus or minus v-s) comes from, how to choose the sign every time, and how to use it backwards.
order: 2
minutes: 10
kind: core
objectives: ["7.3.2"]
prerequisites: [doppler-effect-moving-source, progressive-waves-key-terms]
