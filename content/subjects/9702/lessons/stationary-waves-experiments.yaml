    2026-10-29 in a separate adversarial pass by the same AI model. No separate reviewer model and
    no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can describe the **stretched-string**, **microwave** and **air-column**
      experiments, explain where the nodes form in each, and say what you measure to find the
      wavelength.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\lambda$ | wavelength |
      | $L_2$ | second length |

  - type: explain
    title: Every one of them uses a reflection
    body: |
      A stationary wave needs two identical waves travelling in opposite directions. In practice
      you make the second wave by **reflecting** the first.

      - On a string, the wave reflects at the fixed end (or at the pulley).
      - For microwaves, a metal plate reflects the beam straight back.
      - In a tube, the sound reflects at the water surface.

      In each case the incident and reflected waves have the same frequency and travel in opposite
      directions, so they superpose into a stationary pattern.

  - type: explain
    title: "Experiment 1: the stretched string"
    body: |
      A string is stretched horizontally over a pulley, with masses hanging on the end to provide
      tension. A **vibration generator** (or a tuning fork) vibrates the other end.

      Adjust the length, the tension or the driving frequency until the string settles into a
      clear pattern of **loops**. Each loop is one half-wavelength.

      **What you see:** nodes at the two fixed ends and between the loops; an antinode in the
      middle of every loop. The string in each loop swings while the nodes stay still.

      **What you measure:** the length $L$ between the fixed ends and the number of loops $n$.

      $$L = n\frac{\lambda}{2} \quad\Rightarrow\quad \lambda = \frac{2L}{n}$$

      The wave speed follows from $v = f\lambda$, with $f$ the driving frequency.

  - type: diagram
    diagram: phys-stationary-waves-string-modes
    alt: >-
      A string fixed at both ends carrying one, two and three loops. Nodes are marked at the ends
      and between loops. Beside each pattern are the relations L = lambda/2, L = lambda and
      L = 3 lambda/2, and the frequencies f1, 2f1 and 3f1.
    caption: >-
      A string of length $L$ fits a whole number of half-wavelengths. More loops means a shorter
      wavelength and a higher frequency.

  - type: explain
    title: "Experiment 2: microwaves"
    body: |
      A microwave transmitter sends a beam towards a **metal plate**, which reflects it straight
      back. The incident and reflected waves superpose in the space between, forming a stationary
      wave.

      A small **probe** (a diode detector) is moved along the line between transmitter and plate.
      Its reading rises and falls.

      - **Maximum reading:** the probe is at an antinode.
      - **Minimum reading:** the probe is at a node.

      Consecutive maxima are separated by $\dfrac{\lambda}{2}$, so

      $$\lambda = 2 \times (\text{distance between consecutive maxima})$$

      The metal plate is a node (a fixed boundary), and the pattern is fixed in space — which is
      exactly why the probe reading depends on position.

  - type: explain
    title: "Experiment 3: the air column"
    body: |
      A tube is partly filled with water, so the water surface seals the bottom end. A loudspeaker
      or tuning fork of known frequency sounds above the open top.

      Raise or lower the water level to change the length $L$ of the air column. At certain lengths
      the note suddenly becomes much **louder**: the air column is in **resonance**.

      **Where the nodes are:** the water surface is a fixed boundary, so there is a **node** there.
      The open top is free to move, so there is an **antinode** there.

      That means the shortest resonating column is a quarter of a wavelength:

      $$L_1 = \frac{\lambda}{4}$$

      The next resonance adds another half-wavelength:

      $$L_2 = \frac{3\lambda}{4}$$

      So $L_2 - L_1 = \dfrac{\lambda}{2}$, giving $\lambda = 2(L_2 - L_1)$.

      In this course, **end corrections are negligible**: treat the antinode as exactly at the open
      end.

  - type: diagram
    diagram: phys-stationary-waves-air-column
    alt: >-
      Two resonance tubes. In the first the water level is high, giving a short air column with a
      node at the water and an antinode at the open top, labelled L1 = lambda/4. In the second the
      water is lower, labelled L2 = 3 lambda/4.
    caption: >-
      The water surface is always a node and the open end an antinode, so successive resonances
      differ in length by half a wavelength.

  - type: example
    title: Finding the wavelength from two resonances
    problem: |
      In a resonance tube, the first loud note is heard when the air column is
      $0.17\ \text{m}$ long. The second loud note is heard when it is $0.51\ \text{m}$ long.

      Calculate the wavelength of the sound.
    steps:
      - |
        The difference between successive resonances is half a wavelength:
        $L_2 - L_1 = \dfrac{\lambda}{2}$.
      - |
        $L_2 - L_1 = 0.51 - 0.17 = 0.34\ \text{m}$.
      - |
        $\lambda = 2 \times 0.34 = 0.68\ \text{m}$.
      - |
        Check with the first resonance: $4L_1 = 4 \times 0.17 = 0.68\ \text{m}$. It agrees, as it
        must if end corrections are negligible.
    answer: |
      $\lambda = 0.68\ \text{m}$

  - type: misconceptions
    items:
      - wrong: "The air column resonates at every length."
        right: >-
          It resonates only when the length fits the pattern: an odd number of quarter
          wavelengths, $L = \dfrac{\lambda}{4}, \dfrac{3\lambda}{4}, \ldots$
      - wrong: "The open end of the tube is a node."
        right: >-
          The open end is free to move, so it is an **antinode**. The water surface, which cannot
          move, is the node.
      - wrong: "In the microwave experiment the maxima are one wavelength apart."
        right: >-
          Consecutive maxima are half a wavelength apart, so the wavelength is twice their
          separation.

  - type: exam
    body: |
      Descriptions of these experiments are common in practical and written papers. Include the
      **apparatus**, what you **change**, what you **observe**, and what you **measure**.

      For the string, quote $\lambda = \dfrac{2L}{n}$ and count loops carefully — a loop is a
      half-wavelength.

      For the air column, state clearly that the water surface is a node and the open end an
      antinode, then use $\lambda = 4L_1$ or $\lambda = 2(L_2 - L_1)$.

      For microwaves, say that the probe detects maxima at antinodes and that the wavelength is
      twice the distance between successive maxima.

  - type: check
    title: Check yourself
    questions: [string-loops, microwave-lambda]

  - type: check
    title: Tubes and nodes
    questions: [water-surface-node, first-resonance-lambda]

  - type: check
    title: Stretch
    questions: [microwave-probe-move, adjust-string]

  - type: takeaways
    items:
      - "All three experiments use a reflected wave to make two waves travelling in opposite directions."
      - 'String: $\lambda = \dfrac{2L}{n}$, with $n$ loops; speed $v = f\lambda$.'
      - 'Microwaves: $\lambda = 2 \times$ spacing between consecutive maxima.'
      - 'Air column: water surface is a node, open end an antinode; $L_1 = \dfrac{\lambda}{4}$, $L_2 = \dfrac{3\lambda}{4}$.'

questions:
  - id: string-loops
    format: numeric
    difficulty: 1
    objectives: ["8.1.2"]
    prompt: |
      A string of length $1.20\ \text{m}$ is fixed at both ends and vibrates with three loops.

      Calculate the wavelength of the wave on the string.
    fields:
      - answer: 0.8
        tolerance: { abs: 0.005 }
        unit: m
    explanation: |
      Three loops means three half-wavelengths fit on the string:
      $3 \times \dfrac{\lambda}{2} = 1.20$, so $\lambda = \dfrac{2 \times 1.20}{3} = 0.80\ \text{m}$.

  - id: microwave-lambda
    format: numeric
    difficulty: 1
    objectives: ["8.1.2"]
    prompt: |
      In a microwave experiment, the detector reading is a maximum at one position and at the next
      maximum $1.5\ \text{cm}$ further along.

      Calculate the wavelength of the microwaves.
    fields:
      - answer: 3.0
        tolerance: { abs: 0.05 }
        unit: cm
    explanation: |
      Consecutive maxima are half a wavelength apart, so
      $\lambda = 2 \times 1.5 = 3.0\ \text{cm}$.

  - id: water-surface-node
    format: mcq
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      In a resonance tube, why is there a node at the water surface?
    options:
      - text: "The water surface is a fixed boundary, so the reflected wave is in antiphase with the incident wave there."
        correct: true
        why: "Correct: a hard reflection at a fixed boundary gives a node."
      - text: "The water absorbs all the sound, so the displacement is zero."
        why: "Absorption would reduce the amplitude, but the node comes from superposition at a fixed boundary."
      - text: "The open end of the tube reflects the sound back."
        why: "The open end is an antinode; the reflection that matters for the pattern happens at the water surface."
      - text: "The loudspeaker is placed exactly at the water surface."
        why: "The loudspeaker sits above the open end of the tube."
    explanation: |
      The water surface cannot move, so it is a fixed boundary. The reflected wave returns in
      antiphase there and the displacements cancel, giving a node.

  - id: first-resonance-lambda
    format: numeric
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      The first resonance in a tube closed by a water surface occurs when the air column is
      $0.17\ \text{m}$ long. End corrections are negligible.

      Calculate the wavelength of the sound.
    fields:
      - answer: 0.68
        tolerance: { abs: 0.005 }
        unit: m
    explanation: |
      The shortest resonating column is a quarter wavelength:
      $\lambda = 4L_1 = 4 \times 0.17 = 0.68\ \text{m}$.

  - id: microwave-probe-move
    format: mcq
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      In the microwave experiment, the probe is moved along the line between the transmitter and
      the metal plate. What does a minimum reading show?
    options:
      - text: "The probe is at a node, where the two waves always cancel."
        correct: true
        why: "Correct: minimum amplitude means destructive superposition at a node."
      - text: "The probe is at an antinode, where the two waves always reinforce."
        why: "An antinode gives a maximum reading, not a minimum."
      - text: "The metal plate is absorbing the microwaves."
        why: "The plate reflects them; the minima come from the stationary pattern."
      - text: "The microwaves have been polarised by the probe."
        why: "Polarisation is a different phenomenon and does not explain a position-dependent reading."
    explanation: |
      Maxima occur at antinodes and minima at nodes. Moving between them changes the reading
      because the pattern is fixed in space.

  - id: adjust-string
    format: text
    style: short
    difficulty: 1
    objectives: ["8.1.2"]
    prompt: |
      In the stretched-string experiment, the pattern is messy and keeps changing. Name **one**
      quantity you could adjust to obtain a steady pattern of loops.
    accept:
      - "the length of the string"
      - "the tension"
      - "the frequency"
      - "the driving frequency"
      - "the length"
      - "tension"
      - "frequency"
    model: |
      Any one of: the length of the string, the tension (hanging mass), or the driving frequency.
    explanation: |
      A steady pattern needs the string length to fit a whole number of half-wavelengths at the
      driving frequency, so changing length, tension or frequency can bring it into resonance.
