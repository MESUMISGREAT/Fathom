id: stationary-waves-experiments
subject: "9702"
topic: "8.1"
title: "Stationary waves in the lab: strings, microwaves and air columns"
summary: "Three standard experiments that produce stationary waves, what you measure in each, and why the pattern appears."
order: 3
minutes: 8
kind: core
objectives: ["8.1.2"]
prerequisites: ["stationary-waves-formation"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.1
    Stationary waves, learning outcome 8.1.2 (experiments demonstrating stationary waves with
    microwaves, stretched strings and air columns; end corrections treated as negligible). All
