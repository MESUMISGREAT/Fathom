id: units-quantities-and-estimates
subject: "9702"
topic: "1.1"
title: Physical quantities and sensible estimates
summary: Every physical quantity is a number multiplied by a unit, and a few memorised reference values let you estimate almost anything.
order: 1
minutes: 5
objectives: ["1.1.1", "1.1.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcomes 1.1.1 and 1.1.2, plus the "Summary of key quantities, symbols and
    units" and the data sheet for g). Reference values are standard textbook orders of magnitude.
    All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain why a physical quantity needs **both** a number and a unit, and make **sensible estimates** of everyday quantities from a handful of reference values.

  - type: explain
    title: A number on its own means nothing
    body: |
      A **physical quantity** is anything you can measure: mass, time, current, pressure… It is always written as a **numerical magnitude multiplied by a unit**:

      $$g = 9.81\ \text{m s}^{-2}$$

      "9.81" is the magnitude; $\text{m s}^{-2}$ is the unit. Drop the unit and the number is useless. "The bench is 2.4 long" could mean 2.4 mm or 2.4 km, which differ by a factor of a million.

      Because the unit is literally multiplied by the number, you can treat it like an algebra symbol. If $l = 2.4\ \text{m}$ then $l / \text{m} = 2.4$. That is why table headings and graph axes are written as **quantity / unit**, such as "$l$ / m" or "$t$ / s".

  - type: definition
    term: Physical quantity
    body: |
      A measurable property, expressed as a numerical magnitude multiplied by a unit, for example $v = 25\ \text{m s}^{-1}$.

  - type: check
    questions: [missing-unit]

  - type: explain
    title: Estimating like a physicist
    body: |
      Paper 1 regularly asks "Which is a reasonable estimate of…?". You are not expected to know the exact answer. You are expected to get the **order of magnitude** (the nearest power of ten) right.

      The trick: memorise a few **anchor values**, then reason from them.

      | Quantity | Sensible value |
      | --- | --- |
      | mass of an adult | 70 kg |
      | height of a door | 2 m |
      | walking speed | 1.5 m s⁻¹ |
      | speed of sound in air | 330 m s⁻¹ |
      | speed of light | 3.0 × 10⁸ m s⁻¹ |
      | density of water | 1000 kg m⁻³ (1 g cm⁻³) |
      | density of air | 1.2 kg m⁻³ |
      | atmospheric pressure | 1.0 × 10⁵ Pa |
      | weight of an apple | 1 N |
      | wavelength of visible light | 400 nm to 700 nm |
      | diameter of an atom | 10⁻¹⁰ m |
      | power of a kettle | 2 kW |
      | e.m.f. of a single cell | 1.5 V |

  - type: intuition
    title: Why bother estimating?
    body: |
      Estimates are your **error alarm**. If a calculation says a sprinter runs at 300 m s⁻¹, you have not discovered a superhero. You have dropped a prefix or a power of ten. A quick "is this the right size?" check catches most slips before the examiner does.

  - type: check
    questions: [reasonable-estimate, human-volume]

  - type: example
    title: How heavy is the air in your bedroom?
    problem: |
      Estimate the mass of air in a bedroom.
    steps:
      - |
        Pick sensible dimensions: about $4\ \text{m} \times 3\ \text{m}$ of floor and a $2.5\ \text{m}$ ceiling.
      - |
        Volume: $V \approx 4 \times 3 \times 2.5 = 30\ \text{m}^3$.
      - |
        Recall an anchor value: the density of air is about $1.2\ \text{kg m}^{-3}$.
      - |
        Mass $= \text{density} \times \text{volume} \approx 1.2 \times 30 \approx 36\ \text{kg}$.
      - |
        Round sensibly, because the inputs were rough: about $40\ \text{kg}$, roughly half the mass of an adult.
    answer: |
      About 40 kg (anything from about 20 kg to 80 kg is a sensible estimate).

  - type: misconceptions
    items:
      - wrong: An estimate is just a guess.
        right: An estimate is **reasoned** from values you know, with every assumption stated.
      - wrong: More significant figures make an estimate better.
        right: Give an estimate to 1 or 2 significant figures. Extra figures claim a precision you don't have.
      - wrong: Air is so light it has hardly any mass.
        right: Air has a density of about 1.2 kg m⁻³, so a room full of it has a mass of tens of kilograms.

  - type: exam
    body: |
      - **Paper 1:** "reasonable estimate" questions. Usually only one option has the right order of magnitude, so eliminate options that are out by factors of 10 or more.
      - **Paper 2:** if you are asked to *estimate*, write down every value you assumed (with its unit) and show the calculation. Mark schemes accept a range of sensible values, so clear assumptions matter more than one exact number.
      - A final answer without a unit usually loses the mark.

  - type: deeper
    title: Quantities that seem to have no unit
    body: |
      A few quantities are **ratios of two quantities with the same unit**, such as strain (extension ÷ original length) or efficiency (useful energy ÷ total energy). The units cancel, so these are quoted as pure numbers (or as percentages). They still follow the rule: the "unit" is just 1.

  - type: check
    questions: [bath-estimate, bottle-weight]

  - type: takeaways
    items:
      - A physical quantity = numerical magnitude × unit. Never write one without the other.
      - Label table columns and graph axes as quantity / unit, e.g. $t$ / s.
      - Estimates need the right order of magnitude, not the exact value.
      - Learn the anchor values, then reason from them and state your assumptions.
      - Use estimates to sanity-check every calculated answer.

questions:
  - id: missing-unit
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.1.1"]
    prompt: |
      A student writes in her results table: "mass of trolley = 0.85". What is missing?
    accept:
      - unit
      - the unit
      - a unit
      - units
      - its unit
      - the units
      - kg
      - unit kg
      - the unit kg
    model: |
      The **unit** (probably kg). A physical quantity is a number multiplied by a unit, so "0.85" on its own has no meaning.
    explanation: |
      Without a unit, 0.85 could be 0.85 g or 0.85 kg: a factor of 1000 apart. Every recorded quantity needs its unit, either after the value or in the column heading as "$m$ / kg".

  - id: reasonable-estimate
    format: mcq
    difficulty: 1
    objectives: ["1.1.2"]
    prompt: |
      Which of these is a reasonable estimate?
    options:
      - text: The power of an electric kettle is about 2 kW.
        correct: true
        why: Correct. Kettles are typically rated between about 1.5 kW and 3 kW.
      - text: The speed of sound in air is about $3 \times 10^{8}\ \text{m s}^{-1}$.
        why: That is the speed of light. Sound in air travels at about 330 m s⁻¹, a million times slower.
      - text: The diameter of an atom is about $10^{-6}\ \text{m}$.
        why: That is about the size of a bacterium. Atoms are around $10^{-10}\ \text{m}$ across, ten thousand times smaller.
      - text: The weight of an apple is about 10 N.
        why: 10 N is the weight of about 1 kg. An apple has a mass of about 0.1 kg, so it weighs about 1 N.
    explanation: |
      Check each option against an anchor value. Only the kettle has the right order of magnitude; each of the others is out by a factor of 10 or more.

  - id: human-volume
    format: numeric
    difficulty: 2
    objectives: ["1.1.2"]
    prompt: |
      Estimate the volume of an adult human. People only just float in water, so their average density is close to that of water.

      Give your answer with its unit.
    fields:
      - answer: 0.07
        tolerance: { abs: 0.03 }
        acceptUnits: ["m³"]
    explanation: |
      Mass ≈ 70 kg and density ≈ 1000 kg m⁻³, so
      $V = \dfrac{m}{\rho} \approx \dfrac{70}{1000} = 0.07\ \text{m}^3$.
      Anything from about 0.04 m³ to 0.10 m³ is a sensible estimate (that's 40 to 100 litres).

  - id: bath-estimate
    format: spot-error
    difficulty: 2
    objectives: ["1.1.2"]
    prompt: |
      A student estimates the mass of water in a full bath. Which line contains the error?
    lines:
      - |
        The inside of the bath is about $1.5\ \text{m} \times 0.6\ \text{m}$, filled to a depth of about $0.3\ \text{m}$.
      - |
        Volume $\approx 1.5 \times 0.6 \times 0.3 \approx 0.27\ \text{m}^3$.
      - |
        The density of water is about $1\ \text{kg m}^{-3}$.
      - |
        Mass $=$ density $\times$ volume $\approx 1 \times 0.27 \approx 0.3\ \text{kg}$.
    errorLine: 3
    fix: |
      The density of water is about $1000\ \text{kg m}^{-3}$ (that is, $1\ \text{g cm}^{-3}$). The mass is about $1000 \times 0.27 \approx 300\ \text{kg}$.
    explanation: |
      The student mixed up $1\ \text{g cm}^{-3}$ with $1\ \text{kg m}^{-3}$. The answer should have set off the error alarm: 0.3 kg is a mugful of water, not a bathful.

  - id: bottle-weight
    format: numeric
    difficulty: 2
    objectives: ["1.1.2"]
    prompt: |
      Estimate the weight of a full 1 litre bottle of water. Ignore the mass of the bottle. Give your answer with its unit.
    fields:
      - answer: 9.81
        tolerance: { abs: 0.5 }
        acceptUnits: ["N"]
    explanation: |
      1 litre $= 1000\ \text{cm}^3$ of water has a mass of about 1 kg. Weight $= mg \approx 1 \times 9.81 \approx 10\ \text{N}$. Weight is a force, so its unit is the newton, not the kilogram.
