id: interference-fringe-conditions
subject: "9702"
topic: "8.3"
title: "When do you actually see fringes?"
summary: "Coherence, similar amplitudes, monochromatic light and fringes far enough apart: the four conditions that make a visible pattern."
order: 3
minutes: 7
kind: core
objectives: ["8.3.3"]
prerequisites: ["interference-coherence", "interference-two-source-experiments"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.3
    Interference, learning outcome 8.3.3 (conditions needed for two-source interference fringes to
    be observed). All questions are original. Re-checked line by line on 2026-10-29 in a separate
    adversarial pass by the same AI model. No separate reviewer model and no teacher have reviewed
    it.
blocks:
  - type: objective
    body: |
      By the end you can list the **conditions** needed for two-source interference fringes to be
      seen, and explain what goes wrong when each one is missing.

  - type: explain
    title: A pattern you can actually see
    body: |
      Interference happens whenever two waves overlap. Seeing a **stable pattern of fringes** is
      harder. On a screen, fringes are alternating bright and dark bands, and for them to be visible
      several things must be true at once.

      Miss any one of them and the pattern either vanishes, blurs into uniform light, or shifts too
      fast to see.

  - type: diagram
    diagram: phys-interference-fringes
    alt: >-
      A graph of intensity against position across a screen, showing evenly spaced peaks and troughs.
      A dashed line marks each bright maximum, and an arrow between neighbouring peaks is labelled
      fringe spacing x.
    caption: >-
      Fringes are equally spaced maxima, with darkness between them.

  - type: explain
    title: "Condition 1: coherent sources"
    body: |
      The two sources must have the **same frequency** and a **constant phase difference**. If the
      phase difference drifts, the maxima move, and the screen shows a blur rather than fringes.

      In practice this means both waves come from **one** source — two slits lit by one lamp, or two
      loudspeakers on one signal generator.

  - type: explain
    title: "Condition 2: similar amplitudes"
    body: |
      If the two waves have very different amplitudes, the cancellation at a minimum is only partial.
      The dark fringes become grey and the pattern loses contrast.

      Equal amplitudes give complete cancellation, so the minima are truly dark and the fringes stand
      out. This affects **contrast**, not the positions of the fringes.

  - type: explain
    title: "Condition 3: monochromatic light and a short coherence length"
    body: |
      Real light is not a perfect sine wave; it comes in short bursts, and its phase is only
      predictable over a certain distance called the **coherence length**.

      If the path difference between the two waves is larger than the coherence length, the waves
      arrive with an unpredictable phase difference and the fringes wash out.

      Using **monochromatic** light — one wavelength, ideally from a laser — keeps the fringes sharp.
      White light contains many wavelengths; each colour makes its own pattern at a slightly
      different spacing, so away from the centre they overlap and blur into white.

  - type: explain
    title: "Condition 4: fringes far enough apart"
    body: |
      The fringes must be separated by more than the width of a detector or the eye can resolve.
      Fringe spacing grows when:

      - the slits are **closer together**,
      - the screen is **further away**,
      - the wavelength is **longer**.

      That is why light needs slits a fraction of a millimetre apart and a screen a metre or more
      away. Microwaves, with centimetre wavelengths, need far less.

  - type: misconceptions
    items:
      - wrong: "Any two bright sources will produce visible fringes."
        right: >-
          Two independent lamps are incoherent; their fringes move randomly and blur out.
      - wrong: "White light gives the sharpest fringes."
        right: >-
          White light is a mixture of wavelengths, so the patterns for different colours overlap and
          blur. Monochromatic light gives sharp fringes.
      - wrong: "Unequal amplitudes move the fringes."
        right: >-
          Amplitude affects contrast only. The positions are set by the path difference.
      - wrong: "Moving the screen further away always makes the fringes easier to see."
        right: >-
          It increases their spacing but also spreads and dims the light; there is a practical
          trade-off.

  - type: exam
    body: |
      A typical question gives a flawed experiment and asks why no fringes are seen. Answer by
      naming the missing condition: incoherent sources, unequal amplitudes, too broad a range of
      wavelengths, or fringes too close together.

      For "state two conditions", write two distinct ones — for example "coherent sources" and
      "similar amplitudes" — not two versions of the same point.

      Be precise: coherence means constant phase difference **and** same frequency.

  - type: check
    title: Check yourself
    questions: [conditions-mcq, unequal-amplitude]

  - type: check
    title: Geometry and colour
    questions: [slit-separation-effect, monochromatic-mcq]

  - type: check
    title: Explain and spot the slip
    questions: [state-conditions, white-light-error]

  - type: takeaways
    items:
      - Coherent sources (same frequency, constant phase difference) are essential.
      - Similar amplitudes give dark minima and high contrast.
      - Monochromatic light keeps fringes sharp; white light blurs them away from the centre.
      - 'Fringes must be far enough apart: closer slits, further screen, longer wavelength.'

questions:
  - id: conditions-mcq
    format: mcq
    difficulty: 1
    objectives: ["8.3.3"]
    prompt: |
      Which set of conditions is needed to observe a stable two-source interference pattern?
    options:
      - text: "Coherent sources of similar amplitude, with fringes far enough apart to resolve."
        correct: true
        why: "Correct: coherence, comparable amplitudes and resolvable spacing are all required."
      - text: "Two sources of equal brightness, whatever their frequencies."
        why: "Different frequencies give no fixed pattern; coherence is essential."
      - text: "A single wide slit and a white-light source."
        why: "A single wide slit does not provide two coherent sources, and white light blurs the fringes."
      - text: "Sources with very different amplitudes, so one wave dominates."
        why: "Very different amplitudes reduce contrast, making the minima grey rather than dark."
    explanation: |
      A visible pattern needs coherent sources, comparable amplitudes, and fringes spaced widely
      enough to see.

  - id: unequal-amplitude
    format: mcq
    difficulty: 2
    objectives: ["8.3.3"]
    prompt: |
      Two coherent sources produce interference, but one wave has a much larger amplitude than the
      other. What is the effect on the pattern?
    options:
      - text: "The minima are not completely dark, so the contrast is reduced."
        correct: true
        why: "Correct: unequal amplitudes cannot cancel completely, so minima are grey rather than black."
      - text: "The fringe spacing changes."
        why: "Spacing depends on wavelength and geometry, not on amplitude."
      - text: "The fringes disappear completely."
        why: "They remain, but with lower contrast."
      - text: "The pattern shifts sideways."
        why: "Positions are set by path difference, not amplitude."
    explanation: |
      At a minimum the resultant amplitude is the difference of the two amplitudes. If they are
      unequal, this is not zero, so the dark fringes are grey.

  - id: slit-separation-effect
    format: mcq
    difficulty: 2
    objectives: ["8.3.3"]
    prompt: |
      In a double-slit experiment the slits are moved further apart, with everything else unchanged.
      What happens to the fringes?
    options:
      - text: "They become closer together and harder to resolve."
        correct: true
        why: "Correct: fringe spacing is proportional to 1/a, so a larger separation gives smaller spacing."
      - text: "They become further apart."
        why: "That happens when the slits are moved closer together or the screen is moved further away."
      - text: "They stay in the same place but become brighter."
        why: "Changing the slit separation changes the geometry of the path difference."
      - text: "They disappear entirely."
        why: "They remain visible, but with smaller spacing, until they become too close to resolve."
    explanation: |
      Fringe spacing is inversely proportional to the slit separation, so moving the slits apart
      squeezes the fringes together.

  - id: monochromatic-mcq
    format: mcq
    difficulty: 2
    objectives: ["8.3.3"]
    prompt: |
      Why does monochromatic light give sharper fringes than white light?
    options:
      - text: "All the light has one wavelength, so all the fringes have the same spacing and stay in step."
        correct: true
        why: "Correct: with one wavelength there is a single fringe pattern instead of many overlapping ones."
      - text: "Monochromatic light is brighter."
        why: "Brightness is not the issue; the range of wavelengths is."
      - text: "Monochromatic light travels faster."
        why: "All light travels at the same speed in air."
      - text: "White light cannot interfere."
        why: "White light does interfere, but the patterns for different colours overlap and blur."
    explanation: |
      Each wavelength produces its own fringe pattern. With white light these patterns have different
      spacings and overlap, so only the central fringe stays clear.

  - id: state-conditions
    format: text
    style: short
    difficulty: 2
    objectives: ["8.3.3"]
    prompt: |
      State **two** conditions necessary for two-source interference fringes to be observed.
    accept:
      - "coherent sources and similar amplitudes"
      - "the sources must be coherent and have similar amplitudes"
      - "coherent sources and monochromatic light"
      - "the sources are coherent and the fringes are far enough apart"
      - "coherent sources with similar amplitude"
    model: |
      Any two of: the sources are coherent (same frequency, constant phase difference); the
      amplitudes are similar; the light is monochromatic (path difference within the coherence
      length); the fringes are far enough apart to resolve.
    explanation: |
      Coherence is essential; the others determine whether the pattern is visible and sharp.

  - id: white-light-error
    format: spot-error
    difficulty: 3
    objectives: ["8.3.3"]
    prompt: |
      A student explains a double-slit experiment. One line is wrong.
    lines:
      - |
        Light from a single lamp passes through two narrow slits, giving two coherent sources.
      - |
        Using white light gives the sharpest possible fringes, because all colours add together.
      - |
        With monochromatic light, the fringes would be sharper and easier to measure.
    errorLine: 2
    fix: |
      White light contains many wavelengths, so the fringe patterns for different colours have
      different spacings and overlap, blurring the fringes. **Monochromatic** light gives the
      sharpest pattern.
    explanation: |
      Sharp fringes need a single wavelength. White light produces a white central fringe with
      coloured, overlapping fringes on either side.
