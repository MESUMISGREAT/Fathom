id: gpe-ke-work-to-gpe
subject: "9702"
topic: "5.2"
title: "Lifting things: turning work into stored energy"
summary: Lifting a mass at steady speed means pushing up with a force equal to its weight, so the work you do (Fs) becomes mgΔh of stored gravitational energy.
order: 1
minutes: 6
kind: core
objectives: ["5.2.1"]
prerequisites: [energy-conservation-what-is-work, momentum-newton-weight]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 5.2.1, use W = Fs to derive ΔE_P = mgΔh for a change in
    gravitational potential energy in a uniform gravitational field). The shopping-bag numbers
    are illustrative and consistent by construction; every answer key was checked with Python.
    All questions are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can **derive** $\Delta E_P = mg\Delta h$ from $W = Fs$, and explain in words why lifting something stores energy.

  - type: explain
    title: Your arms are doing bookkeeping
    body: |
      Hold a bag of shopping at arm's length for a minute. Nothing moves, yet your arm aches — annoying, but physics has a neat explanation.

      Now lift that bag from the floor to a shelf. You push **up**, the bag moves **up**, so you do **work** on it.

      Where does that work go? Not into speed (the bag ends up still). It goes into a store: the bag is now higher, and if you let go, that height turns back into motion.

      This lesson shows that the energy stored is exactly the work you did, and that it comes out as a beautifully simple formula.

  - type: explain
    title: Step 1 — what force is needed?
    body: |
      To lift a mass $m$ **at a steady speed**, your upward force must exactly balance the downward pull of gravity.

      The gravitational force on a mass $m$ is its **weight**, $W_\text{weight} = mg$, where $g = 9.81\ \text{m s}^{-2}$ near the Earth's surface.

      So the lifting force you must apply has size

      $$F = mg$$

      Push any harder and the bag accelerates; push any less and it stays on the floor. For a steady lift, $F = mg$ exactly.

  - type: definition
    term: Work done
    body: |
      Work done by a constant force is the **product of the force and the displacement in the direction of the force**:

      $$W = Fs\cos\theta$$

      where $\theta$ is the angle between the force and the displacement. Lift straight up with the force and the motion in the same direction, so $\theta = 0^\circ$ and $\cos 0^\circ = 1$, giving $W = Fs$.

  - type: explain
    title: Step 2 — what displacement?
    body: |
      The bag moves vertically through a distance equal to its **change in height**, which we write $\Delta h$.

      The Greek letter $\Delta$ (delta) just means "change in". So $\Delta h = h_\text{final} - h_\text{initial}$.

      Only the **vertical** change matters here, because the lifting force and the weight both point vertically. Carrying the bag sideways at constant height does no work against gravity at all — more on that in a moment.

  - type: explain
    title: Step 3 — put them together
    body: |
      Work done by the lifting force:

      $$W = Fs$$

      Substitute the force $F = mg$ and the displacement $s = \Delta h$:

      $$W = mg\Delta h$$

      All of that work is transferred to the bag's **gravitational potential energy** store, so the change in that store is

      $$\Delta E_P = mg\Delta h$$

      That is the whole derivation. Three lines, one idea: **the work you do lifting becomes stored energy**.

  - type: diagram
    diagram: phys-gpe-ke-work-to-gpe
    alt: >-
      Left panel: a box of mass m on the ground, lifted vertically a height Δh to a shelf, with
      an upward arrow labelled "applied force F = mg" and a downward arrow labelled "weight mg",
      and a bracket on the right marking the displacement Δh. Below it the working reads
      W = Fs = mgΔh = ΔE_P. Right panel: the same box taken up a sloped ramp of length s,
      reaching the same height Δh, with the note that the vertical rise, not the distance
      travelled, fixes the energy stored.
    caption: >-
      Push up with mg over a height Δh and you have stored mgΔh — however you got it up there.

  - type: example
    title: "Worked example: a bag of shopping"
    problem: |
      A bag of shopping has mass $4.0\ \text{kg}$. It is lifted from the floor onto a table, a vertical rise of $1.2\ \text{m}$.

      Calculate the work done lifting it, and the energy stored.
    steps:
      - |
        The lifting force must balance the weight:
        $$F = mg = 4.0 \times 9.81 = 39.24\ \text{N}$$
      - |
        The displacement is the height gained, $\Delta h = 1.2\ \text{m}$, in the same direction as the force, so
        $$W = Fs = 39.24 \times 1.2$$
      - |
        $$W = 47.088\ \text{J} \approx 47\ \text{J}$$
      - |
        Since the bag is not moving faster at the end, all of that work is stored as gravitational potential energy: $\Delta E_P = 47\ \text{J}$.
      - |
        The shortcut gives the same answer directly: $mg\Delta h = 4.0 \times 9.81 \times 1.2 = 47\ \text{J}$ ✓
    answer: |
      Work done $\approx 47\ \text{J}$, and $\Delta E_P \approx 47\ \text{J}$.

  - type: check
    title: Quick check
    questions: [gpe-formula-mcq, lift-work-numeric, force-equals-weight]

  - type: explain
    title: The sneaky bit — the path doesn't matter
    body: |
      Suppose you slide the same bag up a ramp $3.0\ \text{m}$ long instead of lifting it straight up. The ramp is gentler, so the force along the ramp is smaller — but you push over a longer distance.

      The two effects cancel exactly. The work done **against gravity** depends only on the **vertical rise**, not on the route taken.

      That is why the formula has $\Delta h$ in it and not "distance travelled":

      - lift straight up $1.2\ \text{m}$: work $= mg \times 1.2$;
      - wheel up a ramp to the same shelf: still $mg \times 1.2$.

      A ramp does not save energy. It saves **force**, by spreading the same energy over a longer distance.

  - type: example
    title: "Worked example: the ramp"
    problem: |
      The $4.0\ \text{kg}$ bag is pushed up a frictionless ramp to the same $1.2\ \text{m}$-high table. The ramp is $3.0\ \text{m}$ long.

      What force along the ramp is needed, and how much work is done?
    steps:
      - |
        The energy needed is fixed by the height:
        $$\Delta E_P = mg\Delta h = 4.0 \times 9.81 \times 1.2 = 47.088\ \text{J}$$
      - |
        That energy is supplied by a force $F$ acting over the $3.0\ \text{m}$ length of the ramp:
        $$W = Fs \quad\Rightarrow\quad 47.088 = F \times 3.0$$
      - |
        $$F = \frac{47.088}{3.0} = 15.696\ \text{N} \approx 16\ \text{N}$$
      - |
        Compare with the $39\ \text{N}$ needed to lift it straight up. The ramp needs less than half the force, but you push over a longer distance, so the **work is the same**.
    answer: |
      About $16\ \text{N}$ along the ramp, doing the same $47\ \text{J}$ of work.

  - type: misconceptions
    items:
      - wrong: Lifting a bag higher off the floor always stores more energy.
        right: |
          It is the **change** in height that matters. Carrying a bag horizontally across a
          room stores no extra gravitational energy, however far you walk, because $\Delta h
          = 0$.
      - wrong: $\Delta E_P = mg\Delta h$ uses the distance along the slope.
        right: |
          Use the **vertical** height gained. On a ramp, the distance up the slope is longer
          than the height gained; using the slope length would over-count the energy.
      - wrong: The formula has the weight in it, so I should substitute $F = mg$ and also multiply by $g$ again.
        right: |
          $mg$ **is** the weight. $\Delta E_P = mg\Delta h$ already contains one $g$; multiplying
          by $g$ a second time gives an answer too small by a factor of $9.81$.
      - wrong: Holding a heavy box still does work, which is why my arms hurt.
        right: |
          In physics, no displacement means no work done **on the box** — $s = 0$, so $W = 0$.
          Your muscles still burn chemical energy holding it (they are constantly contracting
          microscopic fibres), but that energy does not go into the box.
      - wrong: Lifting the same mass on the Moon takes the same energy.
        right: |
          $g$ is smaller on the Moon ($1.62\ \text{m s}^{-2}$), so the weight is smaller and the
          work needed is smaller too — about a sixth as much.

  - type: exam
    body: |
      - "**Derive** $\Delta E_P = mg\Delta h$" is worth 2–3 marks: state $W = Fs$, state that the
        lifting force equals the weight $mg$, and that $s = \Delta h$. Write the three lines;
        do not just quote the answer.
      - When a question gives a slope length and an angle, find the vertical rise with
        $\Delta h = s\sin\theta$ before using $mg\Delta h$.
      - Keep $g = 9.81\ \text{m s}^{-2}$ unless told otherwise, and give 2 or 3 significant
        figures.
      - A quick check on your answer: $1\ \text{kg}$ raised $1\ \text{m}$ stores about
        $10\ \text{J}$. If your answer is wildly different, you have slipped a factor of $g$
        or used a distance instead of a height.

  - type: check
    title: Check yourself
    questions: [ramp-angle-height, path-independence, spot-g-double]

  - type: takeaways
    items:
      - Work done by a constant force is $W = Fs\cos\theta$.
      - To lift at steady speed the applied force must equal the weight, $F = mg$.
      - Therefore the energy stored is $\Delta E_P = mg\Delta h$.
      - 'Only the vertical rise counts: the route up does not change the energy stored.'
      - A ramp trades force for distance; the work done against gravity is unchanged.

  - type: deeper
    title: Why "uniform field" is in the syllabus
    body: |
      The derivation assumes $g$ is **constant** over the whole lift. That is an excellent
      approximation near the Earth's surface, where $g$ changes by less than $0.1\%$ over a
      kilometre of height.

      Over very large distances — a satellite climbing thousands of kilometres — $g$ falls off
      as $1/r^2$ and the simple $mg\Delta h$ fails. A Level Physics replaces it with
      gravitational potential, $V = -GM/r$, but everything in this AS topic may safely assume a
      **uniform** field.

questions:
  - id: gpe-formula-mcq
    format: mcq
    difficulty: 1
    objectives: ["5.2.1"]
    prompt: |
      A box of mass $m$ is lifted steadily through a height $\Delta h$ in a uniform gravitational field. Which expression gives the energy stored?
    options:
      - text: $mg\Delta h$
        correct: true
        why: |
          The lifting force equals the weight $mg$ and acts through a displacement $\Delta h$,
          so $W = Fs = mg\Delta h$, all of which is stored as gravitational potential energy.
      - text: $\dfrac{1}{2}mg\Delta h$
        why: |
          The half belongs to kinetic energy, $\frac{1}{2}mv^2$. Here the force is constant from
          start to finish, so there is no averaging to do.
      - text: $m\Delta h$
        why: |
          That has the wrong units (kg m, not joules). Mass alone is not a force; the weight
          $mg$ is.
      - text: $mg$
        why: |
          That is the weight — a force in newtons, not an energy in joules.
    explanation: |
      Weight is $mg$, the displacement is $\Delta h$, and they point the same way, so
      $W = mg\Delta h$. Multiplying a force by a distance gives energy.

  - id: lift-work-numeric
    format: numeric
    difficulty: 1
    objectives: ["5.2.1"]
    prompt: |
      A suitcase of mass $12\ \text{kg}$ is lifted steadily from the floor onto a luggage rack $1.8\ \text{m}$ above the floor.

      Calculate the work done lifting it.
    fields:
      - answer: 212
        tolerance: { rel: 0.02 }
        unit: J
    explanation: |
      The lifting force equals the weight, $mg = 12 \times 9.81 = 117.72\ \text{N}$, acting
      through $1.8\ \text{m}$:
      $W = Fs = 117.72 \times 1.8 = 211.9\ \text{J} \approx 212\ \text{J}$.
      The same answer comes from $mg\Delta h$.

  - id: force-equals-weight
    format: mcq
    difficulty: 1
    objectives: ["5.2.1"]
    prompt: |
      Why does the derivation of $\Delta E_P = mg\Delta h$ use $F = mg$?
    options:
      - text: Because lifting at steady speed needs an upward force equal to the weight
        correct: true
        why: |
          The forces on the box balance when it moves at constant velocity, so the applied force
          has the same size as the weight, $mg$.
      - text: Because the box accelerates upward at $g$
        why: |
          If it accelerated at $g$ upward the applied force would be $2mg$. Lifting steadily
          means no acceleration.
      - text: Because $mg$ is the kinetic energy of the box
        why: |
          $mg$ is a force (newtons), not an energy (joules).
      - text: Because work is always force divided by distance
        why: |
          Work is force **multiplied** by distance. Dividing would give newtons per metre,
          which is a spring constant, not an energy.
    explanation: |
      At constant velocity the resultant force is zero, so applied force $=$ weight $= mg$. Then
      $W = Fs = mg\Delta h$.

  - id: ramp-angle-height
    format: numeric
    difficulty: 2
    objectives: ["5.2.1"]
    prompt: |
      A crate of mass $25\ \text{kg}$ is pushed $4.0\ \text{m}$ up a frictionless ramp inclined at $15^\circ$ to the horizontal.

      Calculate the gain in gravitational potential energy.
    fields:
      - answer: 254
        tolerance: { rel: 0.02 }
        unit: J
    explanation: |
      Only the vertical rise counts:
      $\Delta h = 4.0\sin 15^\circ = 1.0353\ \text{m}$, so
      $\Delta E_P = mg\Delta h = 25 \times 9.81 \times 1.0353 = 253.9\ \text{J} \approx 254\ \text{J}$.

  - id: path-independence
    format: mcq
    difficulty: 2
    objectives: ["5.2.1"]
    prompt: |
      A $2.0\ \text{kg}$ box is moved from the floor to a shelf $1.5\ \text{m}$ high, once lifted straight up and once pushed up a rough ramp.

      Ignoring the energy wasted against friction on the ramp, how do the two gains in gravitational potential energy compare?
    options:
      - text: They are equal, because both boxes rise through the same height
        correct: true
        why: |
          $\Delta E_P = mg\Delta h$ depends only on the vertical rise, so both give
          $2.0 \times 9.81 \times 1.5 = 29\ \text{J}$.
      - text: The ramp gives more, because the box travels further
        why: |
          Distance along the ramp does not enter the formula. The extra work on the ramp is
          wasted against friction, not stored.
      - text: The lift gives more, because the force is larger
        why: |
          The lifting force is larger, but it acts over a shorter distance. The product — the
          work done against gravity — is the same.
      - text: It depends on how fast the box is moved
        why: |
          The energy stored depends on the height gained, not on the speed. Moving faster would
          need extra work to provide kinetic energy, which is not stored as height.
    explanation: |
      Gravitational potential energy depends only on the vertical position, so the same rise
      means the same gain. The ramp also needs extra work to overcome friction, but that energy
      goes to thermal stores, not to height.

  - id: spot-g-double
    format: spot-error
    difficulty: 3
    objectives: ["5.2.1"]
    prompt: |
      A student lifts a $3.0\ \text{kg}$ box through $2.0\ \text{m}$ and calculates the energy stored. Which line contains the first error?
    lines:
      - The weight of the box is $mg = 3.0 \times 9.81 = 29.43\ \text{N}$
      - The work done is $W = Fs = 29.43 \times 2.0 = 58.86\ \text{J}$
      - The energy stored is $\Delta E_P = mg\Delta h \times g = 3.0 \times 9.81 \times 2.0 \times 9.81$
      - So the energy stored is $577\ \text{J}$
    errorLine: 3
    fix: |
      $\Delta E_P = mg\Delta h$ already contains $g$ inside $mg$. The correct value is
      $58.86\ \text{J} \approx 59\ \text{J}$.
    explanation: |
      Lines 1 and 2 are correct. Line 3 multiplies by $g$ a second time — the weight $mg$ is
      already a force, so there is nothing left to convert. The give-away is the size: $59\ \text{J}$
      versus $577\ \text{J}$.
