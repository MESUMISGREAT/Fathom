blocks:
  - type: objective
    body: |
      By the end you can **state the principle of superposition**, use it to work out the
      **resultant displacement** where two waves meet, and explain what happens when identical
      waves arrive **in phase** or **in antiphase**.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $A_1$ | amplitude of the first wave |
      | $A_2$ | amplitude of the second wave |

  - type: explain
    title: Two people, one rope
    body: |
      Imagine two friends shaking opposite ends of a long rope at the same time. Two pulses race
      towards each other across the rope.

      What happens when they meet? Nothing dramatic — the rope simply does **both** motions at
      once. Its actual displacement is the sum of the two separate displacements.

      That one idea is the **principle of superposition**, and it explains interference, stationary
      waves, noise-cancelling headphones and the colours in a soap bubble.

  - type: definition
    term: Principle of superposition
    body: |
      When two or more waves meet at a point, the **resultant displacement** at that point is the
      **vector sum** of the displacements of the individual waves.

  - type: intuition
    title: Displacement is a signed number
    body: |
      Displacement tells you how far a point on the wave sits **above or below** its rest position.
      Up is positive, down is negative.

      So "add the displacements" is ordinary arithmetic with signs:

      | wave 1 | wave 2 | resultant |
      | --- | --- | --- |
      | $+3\ \text{mm}$ | $+3\ \text{mm}$ | $+6\ \text{mm}$ |
      | $+3\ \text{mm}$ | $-3\ \text{mm}$ | $0$ |
      | $+4\ \text{mm}$ | $-1\ \text{mm}$ | $+3\ \text{mm}$ |

      The waves do not bounce off each other or push each other aside. They pass **through** each
      other and carry on with their original shapes.

  - type: diagram
    diagram: phys-stationary-waves-superposition
    alt: >-
      Three snapshots of two pulses on a string. At the top the pulses approach each other. In the
      middle they overlap, and the solid resultant curve is twice as high as either dashed pulse.
      At the bottom they have separated again, each unchanged.
    caption: >-
      Where the pulses overlap, the displacements add. Afterwards each pulse is exactly as it was.

  - type: explain
    title: In phase and in antiphase
    body: |
      When two waves at a point are **in phase** — crest meets crest — their displacements have the
      same sign, so the resultant amplitude is

      $$A = A_1 + A_2$$

      This is **constructive superposition**, and it gives the largest possible resultant.

      When they are **in antiphase** — crest meets trough — the displacements have opposite signs,
      so the resultant amplitude is

      $$A = |A_1 - A_2|$$

      This is **destructive superposition**. If the amplitudes are equal, the resultant is zero and
      that point does not move at all.

      Two identical waves are in phase when the path difference is $0, \lambda, 2\lambda, \ldots$
      and in antiphase when it is $\dfrac{\lambda}{2}, \dfrac{3\lambda}{2}, \ldots$

  - type: example
    title: Adding two displacements at a point
    problem: |
      At point P, a pulse on a spring gives a displacement of $+6.0\ \text{mm}$. A second pulse
      arrives at P and gives $-2.5\ \text{mm}$.

      (a) Find the resultant displacement. (b) Repeat if the second pulse had instead given
      $+2.5\ \text{mm}$.
    steps:
      - |
        Superposition says: add the displacements, keeping their signs.
      - |
        (a) $y = (+6.0) + (-2.5) = +3.5\ \text{mm}$, so 3.5 mm **above** the rest position.
      - |
        (b) $y = (+6.0) + (+2.5) = +8.5\ \text{mm}$, so 8.5 mm **above** the rest position.
      - |
        Same point, same first pulse — only the second wave changed, and the answer changed with it.
    answer: |
      (a) $+3.5\ \text{mm}$  (b) $+8.5\ \text{mm}$

  - type: misconceptions
    items:
      - wrong: "When two waves cancel, their energy disappears."
        right: >-
          The displacement is momentarily zero, but energy is not destroyed. It is stored in the
          medium or shifted to neighbouring points, and it reappears as the waves move on.
      - wrong: "The larger wave always wins, so the resultant can never be zero."
        right: >-
          Displacements add as signed numbers. Equal and opposite displacements give zero, however
          large each wave is.
      - wrong: "Superposition only works if the two waves are identical."
        right: >-
          It works for all waves, whatever their amplitudes, frequencies or directions. Identical
          waves just give the neat cases of doubling or complete cancellation.

  - type: exam
    body: |
      "State the principle of superposition" is usually worth **two marks**: the displacements of
      the individual waves **add**, at a point, as **vectors**.

      For a diagram of two pulses, show the addition with signs — for example
      $+5 - 3 = +2\ \text{mm}$ — and state the direction.

      If the question says the waves are in phase or antiphase, quote the amplitude rule
      $A_1 + A_2$ or $|A_1 - A_2|$ and say which one applies.

  - type: check
    title: Check yourself
    questions: [superposition-cloze, pulse-addition]

  - type: check
    title: Signs and cancellation
    questions: [antiphase-energy, sign-error]

  - type: check
    title: Stretch
    questions: [doubling-pulse, cancellation-energy]

  - type: takeaways
    items:
      - "**Superposition:** at a point, resultant displacement = vector sum of the individual displacements."
      - "**In phase:** amplitudes add, $A_1 + A_2$. **In antiphase:** amplitudes subtract, $|A_1 - A_2|$."
      - "Waves pass through each other unchanged; only the displacement where they overlap is affected."

questions:
  - id: superposition-cloze
    format: cloze
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: |
      When two or more waves meet at a point, the resultant **{{1}}** is the **{{2}}** sum of the
      displacements of the individual waves.
    blanks:
      - accept: ["displacement", "displacements"]
      - accept: ["vector"]
    explanation: |
      That is the principle of superposition. "Vector sum" matters because displacements have
      direction as well as size: up and down count with opposite signs.

  - id: pulse-addition
    format: numeric
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: |
      Two pulses meet at point P. At one instant, pulse A has displacement $+2.4\ \text{mm}$ and
      pulse B has displacement $+2.4\ \text{mm}$.

      Calculate the resultant displacement at P.
    fields:
      - answer: 4.8
        tolerance: { abs: 0.05 }
        unit: mm
    explanation: |
      The displacements are in the same direction, so they add:
      $+2.4 + 2.4 = +4.8\ \text{mm}$ (constructive superposition).

  - id: antiphase-energy
    format: mcq
    difficulty: 2
    objectives: ["8.1.1"]
    prompt: |
      Two identical waves arrive at a point in antiphase. Which statement about that instant is
      correct?
    options:
      - text: "The resultant displacement is zero, and the waves' energy has been destroyed."
        why: "The displacement is zero, but energy cannot be destroyed. It is stored or moved elsewhere."
      - text: "The resultant displacement is zero, but the energy is not destroyed."
        correct: true
        why: "Correct: equal and opposite displacements cancel, while energy is conserved."
      - text: "The resultant displacement is twice the amplitude of one wave."
        why: "That is what happens in phase, not in antiphase."
      - text: "The waves reflect off each other and travel back the way they came."
        why: "Waves pass through each other; they do not bounce off one another."
    explanation: |
      Antiphase means crest meets trough, so the displacements add to zero. Energy is conserved: it
      is stored in the medium or redistributed to other points, not destroyed.

  - id: sign-error
    format: spot-error
    difficulty: 2
    objectives: ["8.1.1"]
    prompt: |
      A student works out the resultant displacement where two waves meet. One line is wrong.
    lines:
      - |
        At point P, wave 1 has displacement $+4.0\ \text{mm}$ and wave 2 has displacement
        $-6.0\ \text{mm}$.
      - |
        Resultant displacement $= 4.0 + 6.0 = 10.0\ \text{mm}$.
      - |
        The waves are in antiphase at P, so this is destructive superposition.
    errorLine: 2
    fix: |
      Resultant displacement $= (+4.0) + (-6.0) = -2.0\ \text{mm}$, i.e. $2.0\ \text{mm}$ in the
      direction of wave 2.
    explanation: |
      The displacement of wave 2 is negative, so it must be added with its sign. Ignoring the minus
      sign turns destructive superposition into apparent constructive superposition.

  - id: doubling-pulse
    format: numeric
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: |
      Two identical pulses travel towards each other on a rope. At the moment they completely
      overlap at point P, each pulse has displacement $+1.8\ \text{mm}$ at P.

      Calculate the resultant displacement at P at that moment.
    fields:
      - answer: 3.6
        tolerance: { abs: 0.05 }
        unit: mm
    explanation: |
      Both displacements are $+1.8\ \text{mm}$, so they add: $+1.8 + 1.8 = +3.6\ \text{mm}$. The
      pulses then pass through each other unchanged.

  - id: cancellation-energy
    format: explain
    difficulty: 3
    objectives: ["8.1.1"]
    prompt: |
      A student says: "If two waves cancel at a point, the energy at that point must have
      disappeared." Explain why this is wrong.
    keyPoints:
      - "Superposition adds displacements, not energies; energy is conserved."
      - "At the instant of cancellation the medium at that point is at rest, but energy is stored nearby or carried by other parts of the wave."
      - "The waves pass through each other, so the energy moves on and the displacement changes again."
    model: |
      Superposition adds the displacements of the waves, not their energies. When two displacements
      cancel, that point of the medium is momentarily at rest, but the energy is still present: it
      is stored in the medium (elastic and kinetic energy) or has been redistributed to
      neighbouring points where the waves reinforce. Since the waves travel on through each other,
      the energy is carried away and the displacement at the point changes again. Energy is
      conserved throughout.
    explanation: |
      Destructive superposition is about displacement, not about destroying energy.
