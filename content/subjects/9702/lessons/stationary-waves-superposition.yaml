id: stationary-waves-superposition
subject: "9702"
topic: "8.1"
title: "The principle of superposition"
summary: "Waves pass through each other and their displacements add. Learn the rule, then use it to predict what happens where two waves meet."
order: 1
minutes: 6
kind: core
objectives: ["8.1.1"]
prerequisites: ["progressive-waves-what-is-a-wave", "progressive-waves-key-terms"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Physics 9702 syllabus, topic 8.1
    Stationary waves, learning outcome 8.1.1 (explain the principle of superposition and use it).
    All questions are original; the pulse heights are illustrative. Re-checked line by line on
