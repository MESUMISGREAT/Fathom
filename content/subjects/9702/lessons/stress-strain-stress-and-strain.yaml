id: stress-strain-stress-and-strain
subject: "9702"
topic: "6.1"
title: "Stress and strain: making the comparison fair"
summary: A thick wire stretches less than a thin one and a long wire stretches more than a short one — so engineers divide out the size and compare the material itself.
order: 4
minutes: 7
kind: core
objectives: ["6.1.5"]
prerequisites: [stress-strain-spring-constant]
