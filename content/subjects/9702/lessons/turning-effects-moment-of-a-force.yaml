id: turning-effects-moment-of-a-force
subject: "9702"
topic: "4.1"
title: "Moments: why door handles live far from the hinge"
summary: The moment of a force is the force times the perpendicular distance from the pivot to its line of action, measured in N m.
order: 1
minutes: 5
objectives: ["4.1.2"]
prerequisites: [momentum-newton-f-equals-ma]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027 (learning outcome 4.1.2, define the moment of a force and apply the definition).
    The door in the diagram is drawn to scale (0.80 m wide, three 20 N pushes). Forces and
    distances in examples and questions are illustrative values; all worked values and answer
    keys were computed with Python. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can **define** the moment of a force, calculate it with its unit, and say whether it turns things clockwise or anticlockwise.

  - type: explain
    title: Same push, different result
    body: |
      Push a door right next to its hinges and it barely budges. Push just as hard at the handle and it swings open.

      Same force, very different **turning effect**. Physicists call that turning effect the **moment** of the force.

      Two things set its size:

      - how big the force is;
      - how far the force's line of action is from the pivot.

      Double either one and the moment doubles.

  - type: definition
    term: Moment of a force
    body: |
      The moment of a force about a point is the product of the force and the **perpendicular distance** from the point to the **line of action** of the force.

      $$\text{moment} = F \times d$$

      Unit: **N m** (newton metre).

  - type: explain
    title: What's a line of action?
    body: |
      The **line of action** of a force is the straight line along the force, extended as far as you like in both directions.

      The distance $d$ is measured from the pivot to that line, at right angles to it. When the force is at right angles to a lever, $d$ is simply the distance along the lever from the pivot to where the force acts.

  - type: diagram
    diagram: phys-turning-effects-spanner-door
    alt: >-
      Two panels. Left, "A spanner on a nut": a spanner lies horizontally with its ring around a
      hexagonal nut, labelled pivot, on the left. A force F pushes straight down on the far end of
      the handle. A dashed vertical line through F is labelled line of action, and a dimension
      arrow d runs horizontally from the centre of the nut to that line. Below: moment = F × d.
      Right, "A door, seen from above", every push is 20 N: a door drawn as a bar with the hinge
      at its left end. Push A presses at right angles on the far edge, push B presses at right
      angles close to the hinge, and push C presses along the door from its free edge straight
      towards the hinge. A table underneath reads: A, 20 N × 0.80 m = 16 N m; B, 20 N × 0.20 m =
      4.0 N m; C, aimed at the hinge, so d = 0 and the moment is 0.
    caption: Far from the hinge beats close to it, and a push aimed **at** the hinge does nothing at all.

  - type: example
    title: "Easy one first: a spanner"
    problem: |
      You push with $40\ \text{N}$ at right angles to a spanner, $0.25\ \text{m}$ from the centre of the nut. What is the moment about the nut?
    steps:
      - |
        The force is at right angles to the spanner, so $d = 0.25\ \text{m}$.
      - |
        Moment $= F \times d = 40 \times 0.25 = 10\ \text{N m}$.
      - |
        Check another way: $80\ \text{N}$ at half the distance gives $80 \times 0.125 = 10\ \text{N m}$ too. Same turning effect, half the distance, twice the effort.
    answer: |
      $10\ \text{N m}$. That's why a longer spanner makes a stiff nut easier: more $d$, so less $F$ for the same moment.

  - type: check
    questions: [define-moment-cloze, wrench-moment, door-push-force]

  - type: explain
    title: Clockwise or anticlockwise?
    body: |
      Every moment has a **sense**: it tries to turn things either **clockwise** or **anticlockwise** about the point.

      With several forces, work out each moment separately and label its sense. Moments in the same sense add up; moments in opposite senses fight each other.

  - type: example
    title: Who wins on the see-saw?
    problem: |
      A $300\ \text{N}$ child sits $1.5\ \text{m}$ to the left of a see-saw's pivot. A $600\ \text{N}$ parent sits $1.0\ \text{m}$ to the right.

      Which way does the see-saw turn?
    steps:
      - |
        Child: $300 \times 1.5 = 450\ \text{N m}$, anticlockwise (a weight to the left of the pivot turns it anticlockwise).
      - |
        Parent: $600 \times 1.0 = 600\ \text{N m}$, clockwise.
      - |
        Resultant moment: $600 - 450 = 150\ \text{N m}$ clockwise.
    answer: |
      $150\ \text{N m}$ clockwise, so the parent's end goes down. To balance, the two moments would have to be equal: that's the principle of moments, in topic 4.2.

  - type: check
    questions: [seesaw-resultant]

  - type: misconceptions
    items:
      - wrong: The unit of a moment is the joule, because N × m = J.
        right: Moments are measured in **N m**. The joule is kept for energy, where the distance is moved **along** the force. In a moment the distance is **perpendicular** to the force, and nothing has to move at all.
      - wrong: A bigger force always has a bigger turning effect.
        right: Only at the same distance. $15\ \text{N}$ at $0.60\ \text{m}$ ($9.0\ \text{N m}$) beats $40\ \text{N}$ at $0.20\ \text{m}$ ($8.0\ \text{N m}$).
      - wrong: Any force on a door helps to turn it.
        right: A force whose line of action passes through the hinge has $d = 0$, so its moment is zero, however big it is.

  - type: check
    questions: [moment-unit, biggest-moment]

  - type: exam
    body: |
      - **Define the moment of a force** (1–2 marks): say *force × perpendicular distance*, and say the distance is *from the point (pivot) to the line of action of the force*. Leaving out "perpendicular" is the classic lost mark.
      - Give the unit as **N m** and, when it matters, the sense (clockwise or anticlockwise).
      - Distances often arrive in cm. Convert to m before you multiply, or your answer is 100 times too big.

  - type: takeaways
    items:
      - Moment = force × perpendicular distance from the pivot to the force's line of action.
      - The unit is N m, not J.
      - Each moment is either clockwise or anticlockwise about the chosen point.
      - A force whose line of action passes through the pivot has zero moment.

questions:
  - id: define-moment-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.1.2"]
    prompt: |
      The moment of a force about a point is the force multiplied by the {{1}} distance from the point to the {{2}} of the force.
    blanks:
      - accept: [perpendicular]
      - accept: [line of action, line-of-action]
    explanation: |
      Moment = force × **perpendicular** distance from the point to the **line of action** of the force. Both words earn marks in a definition.

  - id: wrench-moment
    format: numeric
    difficulty: 1
    objectives: ["4.1.2"]
    prompt: |
      A mechanic pushes at right angles on the end of a wheel wrench with a force of $75\ \text{N}$. The end of the wrench is $0.40\ \text{m}$ from the centre of the wheel nut.

      What is the moment of the force about the nut?
    fields:
      - answer: 30
        tolerance: { abs: 0.05 }
        unit: N m
    explanation: |
      The force is at right angles to the wrench, so $d = 0.40\ \text{m}$. Moment $= 75 \times 0.40 = 30\ \text{N m}$.

  - id: door-push-force
    format: numeric
    difficulty: 2
    objectives: ["4.1.2"]
    prompt: |
      A heavy door needs a moment of $6.0\ \text{N m}$ about its hinge to start it opening. What force, applied at right angles to the door, is needed (a) at the handle, $0.75\ \text{m}$ from the hinge, and (b) at a point $0.15\ \text{m}$ from the hinge?
    fields:
      - label: "(a) F ="
        answer: 8.0
        tolerance: { abs: 0.05 }
        unit: N
      - label: "(b) F ="
        answer: 40
        tolerance: { abs: 0.1 }
        unit: N
    explanation: |
      Rearrange moment $= F \times d$ to $F = \dfrac{\text{moment}}{d}$. (a) $\dfrac{6.0}{0.75} = 8.0\ \text{N}$.

      (b) $\dfrac{6.0}{0.15} = 40\ \text{N}$: five times closer to the hinge needs five times the force.

  - id: seesaw-resultant
    format: mcq
    difficulty: 2
    objectives: ["4.1.2"]
    prompt: |
      A $250\ \text{N}$ child sits $2.0\ \text{m}$ to the left of a see-saw's pivot and a $400\ \text{N}$ adult sits $1.0\ \text{m}$ to the right. What is the resultant moment about the pivot?
    options:
      - text: $100\ \text{N m}$ anticlockwise
        correct: true
        why: Correct. Child $250 \times 2.0 = 500\ \text{N m}$ anticlockwise; adult $400 \times 1.0 = 400\ \text{N m}$ clockwise; $500 - 400 = 100\ \text{N m}$ anticlockwise.
      - text: $100\ \text{N m}$ clockwise
        why: The adult is heavier, but the child's moment ($500\ \text{N m}$) is bigger. Compare moments, not forces.
      - text: $900\ \text{N m}$ anticlockwise
        why: You added two moments that act in opposite senses. They work against each other, so subtract.
      - text: $150\ \text{N}$ towards the adult
        why: That compares the forces. A moment is a turning effect in N m, and here the child's side wins.
    explanation: |
      Work out each moment, label its sense, then combine: $500\ \text{N m}$ anticlockwise minus $400\ \text{N m}$ clockwise leaves $100\ \text{N m}$ anticlockwise, so the child's end goes down.

  - id: moment-unit
    format: mcq
    difficulty: 1
    objectives: ["4.1.2"]
    prompt: |
      Which is the correct SI unit for the moment of a force?
    options:
      - text: N m
        correct: true
        why: Correct. Force (N) × perpendicular distance (m).
      - text: J
        why: The base units match ($\text{kg m}^2\ \text{s}^{-2}$), but the joule is kept for energy and work, where the distance is moved along the force. Moments use N m.
      - text: N m⁻¹
        why: That's force **divided** by distance (the unit of a spring constant), not force × distance.
      - text: N
        why: That's just a force. A moment also depends on the distance from the pivot.
    explanation: |
      Moment = force × perpendicular distance, so its unit is the newton metre, N m. Write it as N m, not J, even though the base units are the same.

  - id: biggest-moment
    format: mcq
    difficulty: 2
    objectives: ["4.1.2"]
    prompt: |
      Four people push on the same door. Which push has the largest moment about the hinge?
    options:
      - text: $40\ \text{N}$ at right angles to the door, $0.20\ \text{m}$ from the hinge
        why: $40 \times 0.20 = 8.0\ \text{N m}$. A big force, but close to the hinge.
      - text: $15\ \text{N}$ at right angles to the door, $0.60\ \text{m}$ from the hinge
        correct: true
        why: Correct. $15 \times 0.60 = 9.0\ \text{N m}$, the largest of the four.
      - text: $60\ \text{N}$ at right angles to the door, $0.10\ \text{m}$ from the hinge
        why: $60 \times 0.10 = 6.0\ \text{N m}$. The biggest force, but the smallest distance.
      - text: $100\ \text{N}$ on the door's edge, $0.80\ \text{m}$ from the hinge, pushing along the door straight towards the hinge
        why: Its line of action passes through the hinge, so $d = 0$ and the moment is zero.
    explanation: |
      Multiply each force by its perpendicular distance from the hinge: $8.0$, $9.0$, $6.0$ and $0\ \text{N m}$. The smallest force wins because it's furthest out.
