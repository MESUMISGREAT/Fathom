id: progressive-waves-wave-equation
subject: "9702"
topic: "7.1"
title: "Where v = fλ comes from"
summary: A wave travels one wavelength in one period. Divide distance by time and the wave equation falls out — no memorising required.
order: 4
minutes: 7
kind: core
objectives: ["7.1.4", "7.1.5"]
prerequisites: [progressive-waves-key-terms]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
