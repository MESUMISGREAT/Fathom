blocks:
  - type: objective
    body: |-
      By the end you can **derive** $v = f\lambda$ from the definitions of speed, frequency and wavelength, and use it to find any one of $v$, $f$ or $\lambda$ given the other two.

  - type: explain
    title: One wavelength per period
    body: |-
      Watch a single crest. To move from one crest position to the next, the wave must travel exactly **one wavelength**, $\lambda$.

      The time it takes to do that is exactly **one period**, $T$, because the pattern repeats every period.

      So in one period, the wave covers a distance $\lambda$. That is all the derivation needs.

  - type: intuition
    title: The derivation in three lines
    body: |-
      Start from the definition of speed:

      $$v = \frac{\text{distance travelled}}{\text{time taken}}$$

      A crest travels one wavelength $\lambda$ in one period $T$, so

      $$v = \frac{\lambda}{T}$$

      Frequency is the reciprocal of period, $f = 1/T$, so replacing $1/T$ by $f$:

      $$v = f\lambda$$

      That is the wave equation. It is not a new law — it is the definition of speed applied to one cycle of the wave.

  - type: definition
    term: The wave equation
    body: |-
      For a progressive wave,

      $$v = f\lambda$$

      where $v$ is the wave speed in $\text{m s}^{-1}$, $f$ is the frequency in Hz, and $\lambda$ is the wavelength in metres.

      It can be rearranged:

      $$f = \frac{v}{\lambda} \qquad \lambda = \frac{v}{f}$$

      The equation works for any progressive wave: water, sound, light, seismic.

  - type: example
    title: "Worked example: speed from frequency and wavelength"
    problem: |-
      A water wave has frequency $50\ \text{Hz}$ and wavelength $0.20\ \text{m}$.

      Calculate its speed.
    steps:
      - |-
        Write the wave equation:

        $$v = f\lambda$$
      - |-
        Substitute the values, both already in SI units:

        $$v = 50 \times 0.20$$
      - |-
        $$v = 10\ \text{m s}^{-1}$$
      - |-
        Check the units: $\text{Hz} \times \text{m} = \text{s}^{-1} \times \text{m} = \text{m s}^{-1}$. ✔
    answer: |-
      $10\ \text{m s}^{-1}$.

  - type: check
    title: Quick check
    questions: [wave-speed-calc, wave-frequency-calc, wave-equation-mcq]

  - type: example
    title: "Worked example: wavelength from speed and frequency"
    problem: |-
      A sound wave travels at $340\ \text{m s}^{-1}$ and has frequency $170\ \text{Hz}$.

      Calculate its wavelength.
    steps:
      - |-
        Rearrange $v = f\lambda$ for wavelength:

        $$\lambda = \frac{v}{f}$$
      - |-
        Substitute:

        $$\lambda = \frac{340}{170} = 2.0\ \text{m}$$
      - |-
        Check: $170 \times 2.0 = 340\ \text{m s}^{-1}$. ✔
    answer: |-
      $2.0\ \text{m}$.

  - type: example
    title: "Worked example: watch the units"
    problem: |-
      A ripple tank wave has frequency $8.0\ \text{Hz}$ and wavelength $25\ \text{cm}$.

      Calculate its speed in $\text{m s}^{-1}$.
    steps:
      - |-
        Convert the wavelength to metres first:

        $$25\ \text{cm} = 0.25\ \text{m}$$
      - |-
        Now use $v = f\lambda$:

        $$v = 8.0 \times 0.25 = 2.0\ \text{m s}^{-1}$$
      - |-
        If you had left the wavelength in centimetres, you would have got $200$, which is $100$
        times too big.
    answer: |-
      $2.0\ \text{m s}^{-1}$.

  - type: check
    title: Practice
    questions: [wave-wavelength-cm, wave-speed-cm, wave-spot-error]

  - type: explain
    title: What changes when a wave enters a new medium
    body: |-
      When a wave passes from one medium into another, its **speed** changes, and so does its **wavelength**. Its **frequency** stays the same.

      Why? The frequency is set by the source: the source oscillates a certain number of times per second, and every wave crest produced must arrive at the boundary at that same rate.

      Since $v = f\lambda$ and $f$ is fixed, a change in $v$ forces a matching change in $\lambda$:

      - into a slower medium: $v$ falls, so $\lambda$ falls;
      - into a faster medium: $v$ rises, so $\lambda$ rises.

      This is exactly what happens when light passes from air into glass: it slows down and its wavelength shortens, but its colour (frequency) does not change.

  - type: misconceptions
    items:
      - wrong: $v = f/\lambda$.
        right: |-
          It is $v = f\lambda$. Check with units: hertz times metres gives $\text{m s}^{-1}$;
          hertz divided by metres does not.
      - wrong: Wave speed is measured in hertz.
        right: |-
          Hertz is the unit of frequency. Speed is in $\text{m s}^{-1}$.
      - wrong: Wavelength can be left in centimetres when using $v = f\lambda$.
        right: |-
          Convert to metres. A centimetre value makes the answer $100$ times too large.
      - wrong: When a wave enters a new medium, its frequency changes.
        right: |-
          Frequency is fixed by the source. Speed and wavelength change.
      - wrong: The wave equation only applies to water waves.
        right: |-
          It applies to every progressive wave, including sound and electromagnetic waves.

  - type: exam
    body: |-
      - Write the equation, rearrange it **before** substituting, then substitute. That sequence earns method marks.
      - Convert centimetres or millimetres to metres before calculating.
      - Quote the unit with the answer and check it with the unit algebra: $\text{Hz} \times \text{m} = \text{m s}^{-1}$.
      - For a wave crossing a boundary, state clearly that frequency stays constant while speed and wavelength change.

  - type: takeaways
    items:
      - 'A wave travels one wavelength in one period.'
      - '$v = \dfrac{\lambda}{T}$ and, since $f = 1/T$, $v = f\lambda$.'
      - 'Rearranged: $f = v/\lambda$ and $\lambda = v/f$.'
      - 'Convert wavelength to metres before using the equation.'
      - 'Across a boundary, frequency stays constant; speed and wavelength change.'

  - type: check
    title: One more check
    questions: [wave-medium-change]

questions:
  - id: wave-speed-calc
    format: numeric
    difficulty: 1
    objectives: ["7.1.5"]
    prompt: |-
      A wave has frequency $50\ \text{Hz}$ and wavelength $0.20\ \text{m}$.

      Calculate its speed, in $\text{m s}^{-1}$.
    fields:
      - label: "v ="
        answer: 10
        unit: "m s⁻¹"
        tolerance: { abs: 0.1 }
    explanation: |-
      $v = f\lambda = 50 \times 0.20 = 10\ \text{m s}^{-1}$.

  - id: wave-frequency-calc
    format: numeric
    difficulty: 2
    objectives: ["7.1.5"]
    prompt: |-
      A sound wave travels at $340\ \text{m s}^{-1}$ and has wavelength $2.0\ \text{m}$.

      Calculate its frequency, in Hz.
    fields:
      - label: "f ="
        answer: 170
        unit: Hz
        tolerance: { abs: 1 }
    explanation: |-
      $f = v/\lambda = 340/2.0 = 170\ \text{Hz}$.

  - id: wave-equation-mcq
    format: mcq
    difficulty: 1
    objectives: ["7.1.4"]
    prompt: |-
      Which equation follows from the definition of speed applied to one complete wave cycle?
    options:
      - text: $v = f\lambda$
        correct: true
        why: |-
          One wavelength is travelled in one period, so $v = \lambda/T = f\lambda$.
      - text: $v = f/\lambda$
        why: |-
          The units do not work: $\text{Hz}/\text{m}$ is not a speed.
      - text: $v = \lambda/f$
        why: |-
          That would give metres squared per second, not a speed.
      - text: $v = f + \lambda$
        why: |-
          Adding a frequency to a length has no physical meaning.
    explanation: |-
      $v = \lambda/T$ and $T = 1/f$, so $v = f\lambda$.

  - id: wave-wavelength-cm
    format: numeric
    difficulty: 2
    objectives: ["7.1.5"]
    prompt: |-
      A ripple tank wave has frequency $8.0\ \text{Hz}$ and wavelength $25\ \text{cm}$.

      Calculate its speed, in $\text{m s}^{-1}$.
    fields:
      - label: "v ="
        answer: 2
        unit: "m s⁻¹"
        tolerance: { abs: 0.05 }
    explanation: |-
      $\lambda = 0.25\ \text{m}$, so $v = 8.0 \times 0.25 = 2.0\ \text{m s}^{-1}$.

  - id: wave-speed-cm
    format: numeric
    difficulty: 2
    objectives: ["7.1.5"]
    prompt: |-
      A wave travels at $12\ \text{m s}^{-1}$ with frequency $60\ \text{Hz}$.

      Calculate its wavelength, in cm.
    fields:
      - label: "λ ="
        answer: 20
        unit: cm
        tolerance: { abs: 0.5 }
    explanation: |-
      $\lambda = v/f = 12/60 = 0.20\ \text{m} = 20\ \text{cm}$.

  - id: wave-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.5"]
    prompt: |-
      A student calculates the speed of a wave with frequency $8.0\ \text{Hz}$ and wavelength $25\ \text{cm}$. Which line contains the first error?
    lines:
      - The frequency is 8.0 Hz.
      - The wavelength is 25 cm.
      - "v = fλ = 8.0 × 25 = 200 m s⁻¹."
      - So the wave travels at 200 m s⁻¹.
    errorLine: 3
    fix: |-
      The wavelength must be converted to metres: $25\ \text{cm} = 0.25\ \text{m}$. Then $v = 8.0 \times 0.25 = 2.0\ \text{m s}^{-1}$.
    explanation: |-
      Lines 1 and 2 are correct. Line 3 uses centimetres in an equation that needs metres, making the answer 100 times too large.

  - id: wave-medium-change
    format: mcq
    difficulty: 2
    objectives: ["7.1.5"]
    prompt: |-
      A sound wave passes from air into water. Which quantity stays the same?
    options:
      - text: Frequency
        correct: true
        why: |-
          The source sets the frequency, so the number of waves arriving per second does not change
          at the boundary.
      - text: Speed
        why: |-
          Sound travels faster in water than in air, so the speed changes.
      - text: Wavelength
        why: |-
          Because the speed changes while the frequency stays fixed, the wavelength must change too.
      - text: Amplitude
        why: |-
          Some energy is reflected at the boundary, so the transmitted amplitude generally changes.
    explanation: |-
      Frequency is determined by the source; speed and wavelength change when the medium changes.
