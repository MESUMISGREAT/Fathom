id: energy-conservation-power-force-velocity
subject: "9702"
topic: "5.1"
title: "P = Fv: power from force and speed"
summary: Substituting W = Fs and s = vt into P = W/t gives P = Fv, the power needed to keep moving against a steady resistive force.
order: 8
minutes: 5
kind: core
objectives: ["5.1.7"]
prerequisites: [energy-conservation-power-definition, energy-conservation-work-at-an-angle]
