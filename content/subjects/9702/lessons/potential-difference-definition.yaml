id: potential-difference-definition
subject: "9702"
topic: "9.2"
title: Potential difference — definition and the volt
summary: Define potential difference as work done per unit charge. Understand the volt (J/C). Distinguish p.d. from e.m.f. (covered later). Energy transfer in circuits.
order: 1
minutes: 5
objectives: ["9.2.1", "9.2.2"]
prerequisites: ["electric-current-flow-of-charge", "electric-current-charge-and-time"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
    Drafted against the official Cambridge International AS & A Level Physics 9702
    syllabus 2025-2027 (topic 9.2, learning outcomes 9.2.1 and 9.2.2). All questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can define potential difference as energy transferred per unit charge, state the unit (volt = joule/coulomb), and calculate energy, charge or p.d. from the other two.

  - type: explain
    title: What is potential difference?
    body: |
      When charge moves through a component (like a lamp), it **transfers energy** — electrical energy becomes heat and light. The **potential difference (p.d.)** across the component tells you how much energy each coulomb of charge gives up:

      $$V = \frac{W}{Q}$$

      - $V$ = potential difference in **volts (V)**
      - $W$ = work done / energy transferred in **joules (J)**
      - $Q$ = charge in **coulombs (C)**

      **1 V = 1 J/C** — one volt means one joule of energy per coulomb of charge.

  - type: diagram
    diagram: phys-potential-difference-definition
    alt: |
      A battery connected to a lamp. Charge carriers (electrons) enter the lamp with higher energy, leave with lower energy. Energy is transferred to the lamp (heat/light). Arrow showing energy per coulomb = V. Formula V = W/Q with units J/C = V.
    caption: Potential difference = energy lost per coulomb passing through a component.

  - type: definition
    term: Potential difference (p.d.)
    body: |
      The work done (energy transferred) per unit charge passing between two points: $V = W/Q$. Unit: volt (V) = joule per coulomb (J/C).

  - type: example
    title: Energy from p.d. and charge
    problem: |
      A charge of 5.0 C passes through a resistor with a p.d. of 12 V across it. How much energy is transferred?
    steps:
      - |
        $W = V \times Q = 12 \times 5.0 = 60\ \text{J}$.
    answer: |
      60 J

  - type: check
    questions: [pd-definition, volt-definition, energy-from-pd]

  - type: intuition
    title: Voltage as "electrical pressure"
    body: |
      Think of water in pipes: **pressure difference** pushes water through a narrow section. **Potential difference** pushes charge through a resistor.

      - High p.d. → more energy per coulomb → more "push"
      - Current is the flow *rate* (coulombs per second)
      - Power is energy *per second* (watts)

      The water analogy works well for intuition but remember: charge doesn't "leak out" like water — circuits must be closed.

  - type: explain
    title: p.d. vs e.m.f. — a preview
    body: |
      You'll meet **e.m.f. (electromotive force)** soon. The distinction matters:

      | | **Potential difference (p.d.)** | **E.m.f. (ℰ)** |
      |---|---|---|
      | **Where** | Across a component (lamp, resistor) | Across a *source* (battery, cell) |
      | **What it does** | Energy *released* per coulomb | Energy *supplied* per coulomb |
      | **Symbol** | $V$ | $\mathcal{E}$ |
      | **Unit** | Volt (V) | Volt (V) |

      For now, just know: p.d. is energy **given up** by charge; e.m.f. is energy **given to** charge by a source. A battery has e.m.f.; a lamp has p.d.

  - type: example
    title: Finding charge from energy and p.d.
    problem: |
      A 9.0 V battery supplies 180 J of energy. How much charge flows?
    steps:
      - |
        $Q = W / V = 180 / 9.0 = 20\ \text{C}$.
    answer: |
      20 C

  - type: check
    questions: [charge-from-energy, pd-from-energy]

  - type: check
    title: Extension — error-spotting and explanation
    questions: [spot-pd-error, explain-pd-vs-emf]

  - type: misconceptions
    items:
      - wrong: "Voltage is a force."
        right: "Voltage is the everyday name for potential difference. It is not a force - it is energy per charge (J/C). The 'force' in electromotive force is a historical misnomer."
      - wrong: "p.d. is the energy of one electron."
        right: "p.d. is energy per coulomb (per 6.25 x 10^18 electrons). Energy of one electron = e x V (in joules) or just V (in electronvolts)."
      - wrong: "A 12 V battery gives 12 J to each electron."
        right: "It gives 12 J to each coulomb. Each electron gets 12 x e = 1.92 x 10^-18 J (or 12 eV)."

  - type: exam
    body: |
      - "Define the volt" → 1 V = 1 J/C (or 1 W/A, but J/C is the fundamental definition).
      - $V = W/Q$ rearrangements: $W = VQ$, $Q = W/V$.
      - Watch units: energy in J, charge in C, p.d. in V.
      - p.d. is measured **in parallel** across a component (voltmeter connection).
      - Distinguish p.d. (across a load) from e.m.f. (across a source).

  - type: takeaways
    items:
      - "$V = W/Q$; 1 V = 1 J/C."
      - "p.d. = energy transferred **per coulomb** through a component."
      - "Energy transferred: $W = V \times Q$."
      - "p.d. is measured in parallel (voltmeter across component)."
      - "p.d. ≠ e.m.f. — p.d. is energy *out*, e.m.f. is energy *in* (from a source)."

questions:
  - id: pd-definition
    format: text
    difficulty: 1
    objectives: ["9.2.1"]
    style: definition
    prompt: |
      Define potential difference and state its unit.
    accept:
      - "work done per unit charge, volt"
      - "energy transferred per coulomb, volt"
      - "W/Q, volt"
      - "joule per coulomb, volt"
    model: |
      Potential difference is the work done (energy transferred) per unit charge passing between two points: $V = W/Q$. Its unit is the volt (V), where 1 V = 1 J/C.
    explanation: |
      The definition V = W/Q is the fundamental definition. The volt is the derived unit (J/C).

  - id: volt-definition
    format: mcq
    difficulty: 1
    objectives: ["9.2.1"]
    prompt: |
      Which statement defines the volt in terms of energy and charge?
    options:
      - text: 1 V = 1 J/C
        correct: true
        why: Potential difference is energy transferred per unit charge, so one volt is one joule per coulomb.
      - text: 1 V = 1 C/J
        why: "The units are inverted; that would be coulombs per joule, which is not the volt."
      - text: 1 V = 1 J s⁻¹
        why: A joule per second is a watt, which is a rate of energy transfer, not energy per charge.
      - text: 1 V = 1 J A
        why: Multiplying by the ampere instead of dividing by the coulomb gives the wrong units; V = W/Q, and Q = It.
    explanation: |
      From $V = W/Q$, one volt is one joule of energy transferred per coulomb of charge: 1 V = 1 J/C.

  - id: energy-from-pd
    format: numeric
    difficulty: 1
    objectives: ["9.2.1", "9.2.2"]
    prompt: |
      A charge of 3.0 C moves through a potential difference of 20 V. How much energy is transferred?
    fields:
      - label: "Energy"
        answer: 60
        tolerance: { rel: 0.01 }
        unit: J
    explanation: |
      $W = V \times Q = 20 \times 3.0 = 60\ \text{J}$.

  - id: charge-from-energy
    format: numeric
    difficulty: 2
    objectives: ["9.2.2"]
    prompt: |
      A 12 V car battery delivers 2.4 kJ of energy to the starter motor. What charge flows through the battery?
    fields:
      - label: "Charge"
        answer: 200
        tolerance: { rel: 0.01 }
        unit: C
    explanation: |
      $W = 2.4 \times 10^3\ \text{J}$. $Q = W/V = 2400/12 = 200\ \text{C}$.

  - id: pd-from-energy
    format: numeric
    difficulty: 2
    objectives: ["9.2.2"]
    prompt: |
      50 mC of charge transfers 15 J of energy in a resistor. What is the potential difference across the resistor?
    fields:
      - label: "p.d."
        answer: 300
        tolerance: { rel: 0.01 }
        unit: V
    explanation: |
      $Q = 50 \times 10^{-3}\ \text{C}$. $V = W/Q = 15 / (50 \times 10^{-3}) = 300\ \text{V}$.

  - id: spot-pd-error
    format: spot-error
    difficulty: 2
    objectives: ["9.2.1"]
    prompt: |
      A student writes: "A 6 V battery gives 6 J of energy to each electron that passes through it." Identify the error.
    lines:
      - "A 6 V battery gives 6 J of energy to each electron that passes through it."
      - "The student confuses per-coulomb with per-electron energy."
      - "1 V = 1 J/C, not 1 J/electron."
    errorLine: 1
    fix: |
      A 6 V battery gives 6 J of energy to each coulomb of charge (6.25 x 10^18 electrons). Each electron receives 6 x e = 9.6 x 10^-19 J (or 6 eV).
    explanation: |
      The volt is joules per coulomb, not per electron. This is a very common confusion - always distinguish per-coulomb from per-electron.

  - id: explain-pd-vs-emf
    format: explain
    difficulty: 2
    objectives: ["9.2.1"]
    prompt: |
      Explain the difference between potential difference and electromotive force (e.m.f.).
    model: |
      Potential difference (p.d.) is the energy transferred per coulomb across a component (like a lamp or resistor) - energy comes out of the circuit. E.m.f. is the energy supplied per coulomb by a source (like a battery) - energy goes into the circuit. Both are measured in volts (J/C), but they occur at different places in the circuit and represent energy flow in opposite directions.
    keyPoints:
      - "p.d.: energy out per coulomb, across a load"
      - "e.m.f.: energy in per coulomb, across a source"
      - "Both in volts (J/C)"
      - "p.d. measured in parallel across component"
    explanation: |
      The distinction is about the direction of energy transfer: sources supply energy (e.m.f.), components dissipate/store it (p.d.). A battery has both an e.m.f. (internal chemistry) and a terminal p.d. (what the external circuit sees).