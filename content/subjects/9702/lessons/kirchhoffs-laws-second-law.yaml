id: kirchhoffs-laws-second-law
subject: "9702"
topic: "10.2"
title: "Kirchhoff's second law: energy around a loop"
summary: The loop rule — the e.m.f. around a closed loop equals the total p.d. — and why it is conservation of energy in disguise.
order: 2
minutes: 9
kind: core
objectives: ["10.2.2"]
prerequisites: ["electric-current-flow-of-charge", "resistance-resistivity-definition"]
