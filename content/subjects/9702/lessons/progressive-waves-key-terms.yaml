blocks:
  - type: objective
    body: |-
      By the end you can define **displacement**, **amplitude**, **wavelength**, **period**, **frequency** and **speed**, and read the first four from a displacement–distance or displacement–time graph.

  - type: explain
    title: Two different snapshots
    body: |-
      A wave can be photographed in two ways, and mixing them up causes most of the confusion in this topic.

      **Displacement against distance** is a photograph of the whole wave at one instant. It shows the shape of the wave along the medium.

      **Displacement against time** is a video of one point. It shows how a single particle moves as the wave goes past.

      Both graphs look like sine waves. They are not the same graph.

      | Graph | Horizontal axis | What one full cycle gives you |
      | --- | --- | --- |
      | Displacement–distance | distance along the medium | **wavelength** $\lambda$ |
      | Displacement–time | time at one point | **period** $T$ |

  - type: definition
    term: The key terms
    body: |-
      - **Displacement** $x$: the distance of a point from its equilibrium position, in a stated direction. It is a vector, so it can be positive or negative.
      - **Amplitude** $A$: the **maximum** displacement from equilibrium. Always positive.
      - **Wavelength** $\lambda$: the distance between two consecutive points that are in phase — for example crest to crest, or trough to trough.
      - **Period** $T$: the time for one complete oscillation of a point, or the time for the wave to travel one wavelength.
      - **Frequency** $f$: the number of complete oscillations per unit time. Measured in hertz (Hz), where $1\ \text{Hz} = 1\ \text{s}^{-1}$.
      - **Speed** $v$: the distance travelled by the wave pattern per unit time.

      Period and frequency are reciprocals:

      $$f = \frac{1}{T} \qquad T = \frac{1}{f}$$

  - type: diagram
    diagram: phys-progressive-waves-key-terms
    alt: >-
      A sine wave drawn on displacement against distance axes. The equilibrium line is horizontal
      through the middle. A vertical arrow from the equilibrium line to a crest is labelled
      amplitude. A horizontal arrow from one crest to the next is labelled wavelength. The vertical
      axis is labelled displacement and the horizontal axis distance. A crest and a trough are
      labelled, and a point is marked at a non-zero displacement.
    caption: |-
      A displacement–distance snapshot. Amplitude is measured from the equilibrium line, and wavelength from one crest to the next.

  - type: intuition
    title: Amplitude is not the height of the wave
    body: |-
      The **height** of a water wave is often quoted as the vertical distance from trough to crest. That is **twice** the amplitude.

      Amplitude is measured from the **equilibrium** line to a crest (or to a trough), not from the bottom to the top.

      This matters in calculations. If a question says a wave has amplitude $0.15\ \text{m}$, the crest is $0.15\ \text{m}$ above equilibrium and the trough is $0.15\ \text{m}$ below it.

      The same trap appears on an oscilloscope: the peak voltage is the amplitude, while the peak-to-peak voltage is twice that.

  - type: example
    title: "Worked example: reading a snapshot"
    problem: |-
      A displacement–distance graph shows crests at $0.20\ \text{m}$ and $0.68\ \text{m}$ from the source, and the wave has amplitude $0.040\ \text{m}$.

      Find the wavelength and the distance from a crest to the nearest trough.
    steps:
      - |-
        Wavelength is the distance between consecutive crests:

        $$\lambda = 0.68 - 0.20 = 0.48\ \text{m}$$
      - |-
        A crest and the next trough are half a wavelength apart:

        $$\frac{\lambda}{2} = \frac{0.48}{2} = 0.24\ \text{m}$$
      - |-
        The amplitude tells you the height above equilibrium, not the crest-to-trough height. Crest to trough is $2A = 0.080\ \text{m}$ vertically.
    answer: |-
      $\lambda = 0.48\ \text{m}$; crest to nearest trough $= 0.24\ \text{m}$ along the wave.

  - type: example
    title: "Worked example: from period to frequency"
    problem: |-
      A point on a wave completes one oscillation in $0.025\ \text{s}$.

      Find the frequency of the wave.
    steps:
      - |-
        The period is $T = 0.025\ \text{s}$.
      - |-
        Frequency is the reciprocal of period:

        $$f = \frac{1}{T} = \frac{1}{0.025}$$
      - |-
        $1/0.025 = 40$, so $f = 40\ \text{Hz}$.
      - |-
        Check: $40$ oscillations each lasting $0.025\ \text{s}$ take $40 \times 0.025 = 1.0\ \text{s}$. ✔
    answer: |-
      $f = 40\ \text{Hz}$.

  - type: check
    title: Quick check
    questions: [term-amplitude, term-wavelength, term-frequency]

  - type: explain
    title: Speed is about the pattern, not the particles
    body: |-
      The **speed** of a wave is how fast the crests advance. It is **not** the speed of the particles, which oscillate back and forth about equilibrium.

      For a water wave, the crests may travel several metres per second while each water particle only moves a few centimetres up and down.

      That is why a duck bobs gently while the wave crosses the pond quickly.

  - type: misconceptions
    items:
      - wrong: Amplitude is the crest-to-trough height.
        right: |-
          That is twice the amplitude. Amplitude is measured from equilibrium to a crest.
      - wrong: Wavelength is the distance from a crest to the next trough.
        right: |-
          That is half a wavelength. Wavelength is crest to crest, or any two consecutive points
          in phase.
      - wrong: A displacement–time graph shows the wavelength.
        right: |-
          It shows the period. Wavelength comes from a displacement–distance graph.
      - wrong: Frequency is the time for one oscillation.
        right: |-
          That is the period. Frequency is the number of oscillations per second, $f = 1/T$.
      - wrong: The wave speed equals the maximum particle speed.
        right: |-
          They are different quantities. The wave pattern can travel fast while the particles move
          slowly, and vice versa.

  - type: exam
    body: |-
      - Quote definitions precisely: amplitude is the **maximum displacement from equilibrium**; wavelength is the distance between **consecutive points in phase**.
      - State units: wavelength in metres, period in seconds, frequency in hertz, speed in $\text{m s}^{-1}$.
      - Say which graph you are reading. "From the displacement–distance graph, one cycle is $0.48\ \text{m}$, so $\lambda = 0.48\ \text{m}$."
      - If a distance is given in centimetres, convert to metres before combining it with a frequency in hertz.

  - type: takeaways
    items:
      - '**Amplitude** is the maximum displacement from equilibrium; crest-to-trough is $2A$.'
      - '**Wavelength** is the distance between consecutive points in phase (crest to crest).'
      - '**Period** is the time for one oscillation; **frequency** is $1/T$, measured in hertz.'
      - 'A displacement–distance graph gives wavelength; a displacement–time graph gives period.'
      - 'Wave speed is the speed of the pattern, not the speed of the particles.'

  - type: check
    title: Practice
    questions: [graph-choice, term-cloze, term-spot-error]

questions:
  - id: term-amplitude
    format: mcq
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      Which statement defines the amplitude of a wave?
    options:
      - text: The maximum displacement from the equilibrium position
        correct: true
        why: |-
          Amplitude is measured from equilibrium to a crest (or trough), so it is always positive.
      - text: The distance from a crest to the next trough
        why: |-
          That is twice the amplitude.
      - text: The distance between two consecutive crests
        why: |-
          That is the wavelength.
      - text: The time for one complete oscillation
        why: |-
          That is the period.
    explanation: |-
      Amplitude is the maximum displacement from equilibrium.

  - id: term-wavelength
    format: numeric
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      On a displacement–distance graph, consecutive crests are at $0.20\ \text{m}$ and $0.68\ \text{m}$.

      What is the wavelength, in metres?
    fields:
      - label: "λ ="
        answer: 0.48
        unit: m
        tolerance: { abs: 0.005 }
    explanation: |-
      $\lambda = 0.68 - 0.20 = 0.48\ \text{m}$.

  - id: term-frequency
    format: numeric
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      A point on a wave completes one oscillation in $0.025\ \text{s}$.

      What is the frequency, in Hz?
    fields:
      - label: "f ="
        answer: 40
        unit: Hz
        tolerance: { abs: 0.5 }
    explanation: |-
      $f = 1/T = 1/0.025 = 40\ \text{Hz}$.

  - id: graph-choice
    format: mcq
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A displacement–time graph for a single point on a wave directly gives which quantity?
    options:
      - text: The period
        correct: true
        why: |-
          One complete cycle on the time axis is the time for one oscillation, which is the period.
      - text: The wavelength
        why: |-
          Wavelength requires a displacement–distance graph.
      - text: The wave speed
        why: |-
          Speed needs both wavelength and frequency, so it cannot be read from this graph alone.
      - text: The amplitude only
        why: |-
          The graph also gives the period; amplitude is only one of the quantities shown.
    explanation: |-
      The time axis gives the period; the vertical axis gives displacement and hence amplitude.

  - id: term-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      The period is the time for one complete {{1}}, and frequency is the number of oscillations per {{2}}.
    blanks:
      - accept: [oscillation, vibration, cycle]
      - accept: [second, unit time, s]
    explanation: |-
      Period is time per oscillation; frequency is oscillations per second.

  - id: term-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A student reads a displacement–distance graph. Which line contains the first error?
    lines:
      - The equilibrium line runs through the middle of the wave.
      - The crest is 2.0 cm above equilibrium, so the amplitude is 2.0 cm.
      - The next crest is 16 cm away, so the wavelength is 8 cm.
      - Therefore the wave has a wavelength of 8 cm.
    errorLine: 3
    fix: |-
      The distance between consecutive crests **is** the wavelength, so it is $16\ \text{cm}$, not $8\ \text{cm}$. Halving it would give the crest-to-trough distance.
    explanation: |-
      Lines 1 and 2 are correct. Line 3 halves the wavelength by mistake, and line 4 repeats it.
