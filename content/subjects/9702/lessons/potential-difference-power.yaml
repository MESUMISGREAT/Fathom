id: potential-difference-power
subject: "9702"
topic: "9.2"
title: Power in electrical circuits
summary: Deriving P = VI = I²R = V²/R from energy transfer. Calculating power in components and circuits.
order: 3
minutes: 5
objectives: ["9.2.3"]
prerequisites: ["potential-difference-energy"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
    Drafted against the official Cambridge International AS & A Level Physics 9702
    syllabus 2025-2027 (topic 9.2, learning outcome 9.2.3).
