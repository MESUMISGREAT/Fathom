id: progressive-waves-phase-difference
subject: "9702"
topic: "7.1"
title: "Phase difference: how far behind is that point?"
summary: Two points on a wave are out of step by a fraction of a cycle. That fraction, in degrees or radians, is the phase difference.
order: 3
minutes: 8
kind: core
objectives: ["7.1.2"]
prerequisites: [progressive-waves-key-terms]
