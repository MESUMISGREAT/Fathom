blocks:
  - type: objective
    body: |-
      By the end you can explain what **phase difference** means, decide whether two points are in phase or in antiphase, and calculate the phase difference from their separation and the wavelength.

  - type: explain
    title: Runners on a circular track
    body: |-
      Imagine two runners going round a circular track at the same speed, but one started later than the other.

      They are always doing the same thing — running — but at any moment one is further round the lap. We could say they are **out of step** by a certain fraction of a lap.

      Two points on a wave are like that. They oscillate with the same frequency, but one reaches its crest slightly after the other.

      The fraction of a cycle between them is their **phase difference**.

  - type: definition
    term: Phase difference
    body: |-
      The **phase difference** between two points on a wave is the fraction of a cycle by which one oscillation leads or lags the other.

      It is measured in **degrees** or **radians**:

      - one complete cycle $= 360° = 2\pi$ radians;
      - half a cycle $= 180° = \pi$ radians.

      Two points **in phase** have a phase difference of $0°$ (or $360°$): they reach their crests at the same time. Points one wavelength apart are in phase.

      Two points **in antiphase** have a phase difference of $180°$ (or $\pi$): when one is at a crest, the other is at a trough. Points half a wavelength apart are in antiphase.

  - type: diagram
    diagram: phys-progressive-waves-phase-difference
    alt: >-
      A sine wave on displacement against distance axes. Two points are marked on the wave: one at
      a crest and one a quarter of a wavelength further along, at the equilibrium position heading
      downwards. A double arrow marks the separation as one quarter of a wavelength, and a curved
      arrow labels the phase difference as 90 degrees or pi over 2 radians.
    caption: |-
      A quarter of a wavelength apart means a quarter of a cycle, which is $90°$ or $\pi/2$ radians.

  - type: intuition
    title: From distance to angle
    body: |-
      A wave repeats every wavelength. So a separation of one wavelength corresponds to one full cycle, $360°$.

      If two points are a distance $\Delta x$ apart, the fraction of a cycle between them is

      $$\frac{\Delta x}{\lambda}$$

      Multiply that fraction by a full cycle to get the phase difference:

      $$\Delta\phi = \frac{\Delta x}{\lambda} \times 360°$$

      or, in radians,

      $$\Delta\phi = \frac{\Delta x}{\lambda} \times 2\pi$$

      The second form is the one used later in interference, where radians are standard.

  - type: example
    title: "Worked example: two points a quarter-wavelength apart"
    problem: |-
      Two points on a wave are separated by $0.15\ \text{m}$. The wavelength is $0.60\ \text{m}$.

      Find the phase difference in degrees and in radians.
    steps:
      - |-
        Find the fraction of a wavelength between the points:

        $$\frac{\Delta x}{\lambda} = \frac{0.15}{0.60} = 0.25$$
      - |-
        A quarter of a cycle in degrees:

        $$0.25 \times 360° = 90°$$
      - |-
        A quarter of a cycle in radians:

        $$0.25 \times 2\pi = \frac{\pi}{2}\ \text{rad}$$
      - |-
        Check: $90°$ is indeed a quarter of $360°$, and $\pi/2$ is a quarter of $2\pi$. ✔
    answer: |-
      $90°$, or $\dfrac{\pi}{2}$ radians.

  - type: check
    title: Quick check
    questions: [phase-degrees, phase-radians, in-phase]

  - type: explain
    title: In phase, antiphase, and everything between
    body: |-
      | Separation | Phase difference | Description |
      | --- | --- | --- |
      | $0$, $\lambda$, $2\lambda$, … | $0°$, $360°$, … | in phase |
      | $\lambda/4$ | $90°$ ($\pi/2$) | quarter cycle out of step |
      | $\lambda/2$ | $180°$ ($\pi$) | in antiphase |
      | $3\lambda/4$ | $270°$ ($3\pi/2$) | three-quarters out of step |

      Phase difference is usually quoted as the smallest angle between $0°$ and $360°$ (or $0$ and $2\pi$). A separation of $1.25\lambda$ gives the same phase difference as $0.25\lambda$, because the wave repeats.

      The same idea applies to two separate waves from two sources: if their crests arrive together they are in phase; if a crest of one arrives with a trough of the other, they are in antiphase.

  - type: example
    title: "Worked example: finding a separation from a phase difference"
    problem: |-
      A wave has wavelength $0.80\ \text{m}$. Two points have a phase difference of $135°$.

      How far apart are they?
    steps:
      - |-
        Convert the phase difference to a fraction of a cycle:

        $$\frac{135°}{360°} = 0.375$$
      - |-
        Multiply by the wavelength:

        $$\Delta x = 0.375 \times 0.80 = 0.30\ \text{m}$$
      - |-
        Check: $0.30/0.80 = 0.375$, and $0.375 \times 360° = 135°$. ✔
    answer: |-
      $0.30\ \text{m}$ apart.

  - type: check
    title: Practice
    questions: [phase-separation, antiphase, phase-cloze]

  - type: misconceptions
    items:
      - wrong: Two points one wavelength apart are $360°$ out of phase, so they are not in phase.
        right: |-
          $360°$ is a full cycle, which is the same as $0°$. They are in phase.
      - wrong: Phase difference can be greater than $360°$.
        right: |-
          It can be written that way for a separation of several wavelengths, but it is usually
          reduced to the equivalent angle between $0°$ and $360°$.
      - wrong: Points at a crest and a trough are in phase because they are both at maximum displacement.
        right: |-
          They are in antiphase: their displacements have opposite signs, $180°$ apart.
      - wrong: Phase difference depends only on distance, not on wavelength.
        right: |-
          It depends on the **fraction** of a wavelength, $\Delta x/\lambda$. The same separation
          gives a different phase difference on a different wavelength.
      - wrong: Radians and degrees can be mixed in the same calculation.
        right: |-
          Choose one. $360° = 2\pi$ radians; do not add degrees to radians.

  - type: exam
    body: |-
      - Show the fraction $\Delta x/\lambda$ before converting to degrees or radians. That is the method mark.
      - State the unit: $90°$ or $\pi/2$ rad, not just "90".
      - Remember that a full cycle is $360°$ or $2\pi$; a half cycle is $180°$ or $\pi$.
      - If the separation is more than one wavelength, subtract whole wavelengths before converting if the question asks for the smallest phase difference.

  - type: takeaways
    items:
      - '**Phase difference** is the fraction of a cycle by which one oscillation leads or lags another.'
      - 'One cycle is $360°$ or $2\pi$ radians; half a cycle is $180°$ or $\pi$.'
      - 'Points one wavelength apart are in phase; points half a wavelength apart are in antiphase.'
      - '$\Delta\phi = \dfrac{\Delta x}{\lambda} \times 360°$ (degrees) or $\dfrac{\Delta x}{\lambda} \times 2\pi$ (radians).'
      - 'The same separation gives different phase differences on different wavelengths.'

  - type: deeper
    title: Why radians are useful
    body: |-
      A wave can be described by a sine function whose argument is an angle that grows with time and distance. In that description the natural unit is the radian, because one cycle corresponds to $2\pi$ radians.

      That is why the phase difference between two points a distance $\Delta x$ apart is often written

      $$\Delta\phi = \frac{2\pi\Delta x}{\lambda}$$

      Interference calculations later in the course use this form to add waves: crests reinforce when the phase difference is a whole number of $2\pi$, and cancel when it is an odd number of $\pi$.

questions:
  - id: phase-degrees
    format: numeric
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      Two points on a wave are $0.15\ \text{m}$ apart. The wavelength is $0.60\ \text{m}$.

      What is the phase difference, in degrees?
    fields:
      - label: "Δφ ="
        answer: 90
        unit: °
        tolerance: { abs: 1 }
    explanation: |-
      $\Delta x/\lambda = 0.15/0.60 = 0.25$, so the phase difference is $0.25 \times 360° = 90°$.

  - id: phase-radians
    format: numeric
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      Two points on a wave are separated by $0.10\ \text{m}$. The wavelength is $0.80\ \text{m}$.

      What is the phase difference, in radians? Give your answer as a decimal.
    fields:
      - label: "Δφ ="
        answer: 0.785
        tolerance: { abs: 0.01 }
    explanation: |-
      $\Delta x/\lambda = 0.10/0.80 = 0.125$, so $\Delta\phi = 0.125 \times 2\pi = \pi/4 \approx 0.785$ rad.

  - id: in-phase
    format: mcq
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      Two points on a progressive wave are in phase. What is the smallest possible distance between them, in terms of the wavelength $\lambda$?
    options:
      - text: $\lambda$
        correct: true
        why: |-
          A separation of one wavelength corresponds to a full cycle, so the points behave
          identically.
      - text: $\lambda/2$
        why: |-
          That separation puts the points in antiphase.
      - text: $\lambda/4$
        why: |-
          That is a quarter-cycle phase difference, $90°$.
      - text: $2\lambda$
        why: |-
          That is also a separation for points in phase, but not the smallest.
    explanation: |-
      The smallest separation for points in phase is one wavelength.

  - id: antiphase
    format: mcq
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      A point on a wave is at a crest. Which point is in antiphase with it?
    options:
      - text: The next trough, half a wavelength away
        correct: true
        why: |-
          Half a cycle later the displacement is opposite, so the points are $180°$ apart.
      - text: The next crest, one wavelength away
        why: |-
          That point is in phase, not antiphase.
      - text: A point a quarter-wavelength away
        why: |-
          That point is $90°$ out of phase, not $180°$.
      - text: A point at equilibrium
        why: |-
          A point at equilibrium has zero displacement; antiphase depends on the phase, not on
          being at zero.
    explanation: |-
      Antiphase means $180°$, which is half a wavelength.

  - id: phase-separation
    format: numeric
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A wave has wavelength $0.80\ \text{m}$. Two points on it have a phase difference of $135°$.

      How far apart are they, in metres?
    fields:
      - label: "Δx ="
        answer: 0.3
        unit: m
        tolerance: { abs: 0.005 }
    explanation: |-
      $135°/360° = 0.375$, so $\Delta x = 0.375 \times 0.80 = 0.30\ \text{m}$.

  - id: phase-cloze
    format: cloze
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |-
      A phase difference of half a cycle is {{1}} degrees, which equals {{2}} radians.
    blanks:
      - accept: ["180", "180°"]
      - accept: ["π", "pi", "3.14", "3.142"]
    explanation: |-
      Half a cycle is $180°$, or $\pi$ radians.
