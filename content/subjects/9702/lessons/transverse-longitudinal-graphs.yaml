blocks:
  - type: objective
    body: |-
      By the end you can read amplitude and wavelength from a displacement–distance graph, read period from a displacement–time graph, and explain why a graph of a longitudinal wave is a plot rather than a picture.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\lambda$ | wavelength |

  - type: explain
    title: One kind of graph is a photograph
    body: |-
      Take a wave on a rope and photograph it. What you see is a wavy line: up, down, up, down along the rope.

      Plot displacement against distance for that moment and you get the same wavy line. For a transverse wave, the displacement–distance graph **is** the shape of the wave.

      That is not true for sound. You cannot photograph a compression. Sound is a pattern of squeezes inside the air, and a graph of it can only plot *numbers*: how far each particle has been pushed from its rest position, and in which direction.

      So the same sine curve can mean two very different things. Always check which wave you are reading about.

  - type: diagram
    diagram: phys-transverse-longitudinal-graphs
    alt: >-
      Two stacked displacement-distance graphs. The top one is a sine curve labelled crest,
      trough and one wavelength, described as the shape of a transverse wave. The bottom one
      plots displacement for a longitudinal wave. Above that lower graph is a row of dots bunched
      into compressions, with dashed lines dropping from each compression to the steepest
      zero-crossing of the sine curve, showing that compressions are not at the crests.
    caption: |-
      The upper graph is what the wave looks like. The lower graph is a set of measurements of particle displacements.

  - type: explain
    title: What you can read from each graph
    body: |-
      | Graph | Horizontal axis | Gives you |
      | --- | --- | --- |
      | Displacement–distance | distance along the wave | **wavelength** $\lambda$ and amplitude $A$ |
      | Displacement–time | time at one fixed point | **period** $T$ and amplitude $A$ |

      Amplitude is measured from the equilibrium line to a crest, or to a trough. It is never crest-to-trough, which is $2A$.

      Wavelength is the distance between two consecutive points that are in phase: crest to crest, trough to trough, or from one zero crossing with a rising slope to the next zero crossing with a rising slope. For a longitudinal wave it is also the distance from one compression to the next.

      Frequency is not on either graph directly. Get it from $f = 1/T$ after reading the period.

  - type: explain
    title: Displacement–time graphs cannot tell the two apart
    body: |-
      Watch one air particle in a sound wave and plot its displacement against time. You get a sine curve.

      Watch one point on a rope and do the same. You get a sine curve too.

      The two graphs are indistinguishable. A displacement–time graph tells you the period, the amplitude and the frequency, but **not** whether the wave is transverse or longitudinal. For that you need to know what the wave is travelling through, or you need a displacement–distance graph where you also know what the medium is doing.

  - type: check
    title: Quick check
    questions: [graph-wavelength, graph-time-cannot, graph-longitudinal-meaning]

  - type: deeper
    title: Where exactly are the compressions?
    body: |-
      On the displacement–distance graph of a longitudinal wave, the compressions are **not** at the crests. They are where the graph is **steepest**.

      Here is the reasoning in one line. Between two neighbouring particles, the spacing changes by the amount the displacement changes along the wave. Where the graph falls steeply, each particle is pushed further back than the one to its right, so the gap between them closes up: that is a compression.

      Two consequences follow. First, the compressions sit half a wavelength apart, as they must, because they are consecutive points in phase. Second, a crest on the graph is a place where the particles are displaced furthest but are still spaced out normally — it is not a compression.

      This matters because examiners write questions such as "mark, on the graph, the positions of two compressions". The answer is never the crests.

  - type: example
    title: "Worked example: from a sound graph to a frequency"
    problem: |-
      A displacement–distance graph for a sound wave in air shows one compression at $0.34\ \text{m}$ from the source and the next compression at $0.51\ \text{m}$.

      Take the speed of sound in air as $340\ \text{m s}^{-1}$. Find the wavelength and the frequency.
    steps:
      - |-
        Consecutive compressions are consecutive points in phase, so the gap between them is one wavelength:

        $$\lambda = 0.51 - 0.34 = 0.17\ \text{m}$$
      - |-
        The wave equation links speed, frequency and wavelength:

        $$v = f\lambda$$
      - |-
        Rearrange for frequency:

        $$f = \frac{v}{\lambda} = \frac{340}{0.17}$$
      - |-
        $340 \div 0.17 = 2000$, so the frequency is $2000\ \text{Hz}$.

        Check: $2000\ \text{Hz} \times 0.17\ \text{m} = 340\ \text{m s}^{-1}$. ✔
    answer: |-
      $\lambda = 0.17\ \text{m}$ and $f = 2000\ \text{Hz}$ (2.0 kHz).

  - type: example
    title: "Worked example: using a displacement–time graph"
    problem: |-
      A displacement–time graph for one particle of a sound wave repeats every $2.0\ \text{ms}$.

      Find the frequency of the wave.
    steps:
      - |-
        The repeat time on a displacement–time graph is the period. Convert it to seconds first:

        $$T = 2.0\ \text{ms} = 2.0 \times 10^{-3}\ \text{s}$$
      - |-
        Frequency is the reciprocal of period:

        $$f = \frac{1}{T} = \frac{1}{2.0 \times 10^{-3}}$$
      - |-
        $1 \div (2.0 \times 10^{-3}) = 500$, so $f = 500\ \text{Hz}$.

        Check: $500$ oscillations per second each take $2.0\ \text{ms}$. ✔
    answer: |-
      $f = 500\ \text{Hz}$.

  - type: misconceptions
    items:
      - wrong: The crest of a sound-wave graph is a compression.
        right: |-
          The crest is where particles are displaced furthest. Compressions are where the graph is steepest, at zero crossings.
      - wrong: A displacement–distance graph of a longitudinal wave shows the shape of the wave.
        right: |-
          It shows a set of displacements. The shape of a sound wave is not something you can draw as a curve.
      - wrong: You can tell whether a wave is transverse or longitudinal from its displacement–time graph.
        right: |-
          Both give a sine curve. The type of wave is not encoded on that graph.
      - wrong: Amplitude is the height from trough to crest.
        right: |-
          That is twice the amplitude. Amplitude is measured from the equilibrium line.

  - type: exam
    body: |-
      - Say which graph you are using. "From the displacement–distance graph, consecutive compressions are $0.17\ \text{m}$ apart, so $\lambda = 0.17\ \text{m}$" is a complete, mark-earning sentence.
      - Convert milliseconds and centimetres before substituting. A period in ms and a wavelength in cm is the most common arithmetic slip on this topic.
      - If asked to mark compressions on a graph of a longitudinal wave, put them at the steepest zero crossings, never at the crests.
      - If asked which wave a displacement–time graph represents, say that it could be either, and give the reason.

  - type: takeaways
    items:
      - 'A displacement–distance graph gives wavelength and amplitude; a displacement–time graph gives period and amplitude.'
      - 'For a transverse wave the displacement–distance graph is the shape of the wave.'
      - 'For a longitudinal wave the same graph is a plot of displacements, and compressions sit where the curve is steepest.'
      - 'A displacement–time graph cannot tell you whether a wave is transverse or longitudinal.'

  - type: check
    title: Practice
    questions: [graph-frequency, graph-compressions, graph-spot-error]

questions:
  - id: graph-wavelength
    format: numeric
    difficulty: 1
    objectives: ["7.2.2"]
    prompt: |-
      On a displacement–distance graph of a sound wave, one compression is at $0.34\ \text{m}$ and the next is at $0.51\ \text{m}$.

      What is the wavelength, in metres?
    fields:
      - label: "λ ="
        answer: 0.17
        unit: m
        tolerance: { abs: 0.005 }
    explanation: |-
      Consecutive compressions are one wavelength apart, so $\lambda = 0.51 - 0.34 = 0.17\ \text{m}$.

  - id: graph-time-cannot
    format: mcq
    difficulty: 2
    objectives: ["7.2.2"]
    prompt: |-
      A displacement–time graph is drawn for a single particle of a wave. Which quantity can you **not** read from it?
    options:
      - text: The wavelength
        correct: true
        why: |-
          Wavelength needs a distance axis, so it comes from a displacement–distance graph.
      - text: The amplitude
        why: |-
          The maximum height above the equilibrium line is the amplitude.
      - text: The period
        why: |-
          One complete cycle on the time axis is the period.
      - text: The frequency
        why: |-
          Frequency is $1/T$, so it follows once you have the period.
    explanation: |-
      The time axis gives period and frequency; the vertical axis gives amplitude. Wavelength is not on this graph.

  - id: graph-longitudinal-meaning
    format: mcq
    difficulty: 2
    objectives: ["7.2.2"]
    prompt: |-
      For a transverse wave, a displacement–distance graph is the shape of the wave. For a longitudinal wave, the same kind of graph
    options:
      - text: is a plot of how far each particle is displaced along the direction of travel
        correct: true
        why: |-
          The vertical axis still shows displacement, but that displacement is along the direction the wave travels, so the curve is a plot rather than a picture.
      - text: shows the compressions and rarefactions directly, as visible bumps
        why: |-
          Compressions are regions of squeezed particles. They appear on the graph only as places where the curve is steep.
      - text: is a straight horizontal line, because sound particles do not move sideways
        why: |-
          The particles still oscillate, so their displacements still vary along the wave.
      - text: shows the pressure at every point, so the crests are pressure maxima
        why: |-
          A displacement–distance graph plots displacement, not pressure. The two are not in step.
    explanation: |-
      A longitudinal displacement–distance graph plots displacement along the travel direction, so it is a graph of numbers, not a drawing of the wave.

  - id: graph-frequency
    format: numeric
    difficulty: 2
    objectives: ["7.2.2"]
    prompt: |-
      A sound wave in air has wavelength $0.25\ \text{m}$. Take the speed of sound as $340\ \text{m s}^{-1}$.

      What is its frequency, in Hz?
    fields:
      - label: "f ="
        answer: 1360
        unit: Hz
        tolerance: { rel: 0.01 }
    explanation: |-
      $f = v/\lambda = 340/0.25 = 1360\ \text{Hz}$.

  - id: graph-compressions
    format: mcq
    difficulty: 3
    objectives: ["7.2.2"]
    prompt: |-
      A sound wave travelling to the right is shown on a displacement–distance graph, with displacement to the right taken as positive.

      Where are the compressions?
    options:
      - text: Where the graph crosses zero with a falling displacement
        correct: true
        why: |-
          There the displacement falls steeply, so each particle is pushed back further than its neighbour and the gap closes into a compression.
      - text: At the crests of the graph
        why: |-
          At a crest the particles are displaced furthest, but their spacing is the undisturbed spacing, so the density is at its normal value.
      - text: At the troughs of the graph
        why: |-
          The same reasoning as for a crest: the spacing is undisturbed there too.
      - text: Where the graph is flat
        why: |-
          A flat part means neighbouring particles are displaced by the same amount, so the spacing is unchanged.
    explanation: |-
      Compressions are where the graph is steepest, which happens at the zero crossings with a falling displacement.

  - id: graph-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.2.2"]
    prompt: |-
      A student reads a displacement–distance graph of a sound wave. Which line contains the first error?
    lines:
      - The vertical axis shows how far each air particle is displaced along the direction of travel.
      - One complete cycle of the graph is one wavelength.
      - The crest of the graph marks a compression, where the air is squeezed together.
      - Half a wavelength further along, the graph shows a trough.
    errorLine: 3
    fix: |-
      The crest marks the largest displacement, not a compression. Compressions are where the graph is steepest, at the zero crossings.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 confuses a feature of the graph with a physical compression.
