id: transverse-longitudinal-graphs
subject: "9702"
topic: "7.2"
title: Reading graphs of transverse and longitudinal waves
summary: A graph of a transverse wave looks like the wave; a graph of a longitudinal wave does not. Here is how to read both without mixing them up.
order: 2
minutes: 10
kind: core
objectives: ["7.2.2"]
prerequisites: [progressive-waves-key-terms, transverse-longitudinal-compare]
