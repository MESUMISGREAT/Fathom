id: density-pressure-density-basics
subject: "9702"
topic: "4.3"
title: "Density: mass packed into space"
summary: Density is mass per unit volume; use rho = m / V to compare how much matter fits into a space.
order: 1
minutes: 4
objectives: ["4.3.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027, learning outcome 4.3.1 (define density and use the definition). All questions
    are original. Numerical values and the illustrative particle dots are teaching examples,
    not measured data. Independently re-checked line by line (facts, worked examples, every
    answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end, you can define **density** as mass per unit volume and use the definition to find density, mass or volume.

  - type: definition
    term: Density
    body: |
      **Density** is the **mass per unit volume** of a substance. Its symbol is the Greek letter rho, written $\rho$.

  - type: explain
    title: Same space, different amount of matter
    body: |
      Picture two equal-sized boxes. If one contains more mass, its contents are more densely packed: its density is greater.

      $$\rho = \dfrac{m}{V}$$

      Here $m$ is mass and $V$ is volume. In SI units, use kilograms for mass and cubic metres for volume, giving density in $\text{kg m}^{-3}$.

  - type: check
    questions: [density-meaning, density-basic-calc]

  - type: example
    title: A quick density calculation
    problem: |
      A sample has mass $540\ \text{g}$ and volume $200\ \text{cm}^3$. Find its density in $\text{g cm}^{-3}$.
    steps:
      - |
        Start with the definition: $\rho = \dfrac{m}{V}$. We have both mass and volume, so divide mass by volume.
      - |
        Substitute the values: $\rho = \dfrac{540}{200} = 2.7\ \text{g cm}^{-3}$.
      - |
        The units divide too: grams divided by cubic centimetres gives $\text{g cm}^{-3}$.
    answer: |
      $2.7\ \text{g cm}^{-3}$

  - type: diagram
    diagram: phys-density-pressure-density-cubes
    alt: >-
      Two equal-sized cubes are shown. The low-density cube contains three separated particle dots;
      the higher-density cube contains nine dots in the same volume. The diagram states that more
      mass in the same volume means higher density and shows rho equals mass divided by volume.
    caption: "Particle dots are a model; compare the mass in the same volume."

  - type: explain
    title: Rearrange without changing the meaning
    body: |
      The same definition can find any one of its three quantities:

      - Density: $\rho = \dfrac{m}{V}$
      - Mass: $m = \rho V$
      - Volume: $V = \dfrac{m}{\rho}$

      The SI unit conversion matters: $1\ \text{cm}^3 = 10^{-6}\ \text{m}^3$, and $1\ \text{g} = 10^{-3}\ \text{kg}$. Convert both quantities before finding an SI density.

  - type: check
    questions: [density-mass, density-compare, density-si]

  - type: misconceptions
    items:
      - wrong: A larger object must have a larger density.
        right: Density compares mass with volume. A larger object can have the same density, or less density, if its mass grows differently.
      - wrong: Density is volume divided by mass.
        right: Density is mass per unit volume; divide mass by volume.

  - type: exam
    body: |
      - Write the equation before substituting, and include the unit in your final answer.
      - If the question asks for SI density, convert mass to kilograms and volume to cubic metres first. Don't convert only one of them.

  - type: takeaways
    items:
      - Density means mass per unit volume.
      - $\rho = m/V$; rearrange to $m=\rho V$ or $V=m/\rho$.
      - The SI unit is $\text{kg m}^{-3}$.

questions:
  - id: density-meaning
    format: mcq
    difficulty: 1
    objectives: ["4.3.1"]
    prompt: |
      Which statement defines density?
    options:
      - text: Mass per unit volume.
        correct: true
        why: Density tells you the mass in each unit of volume.
      - text: Volume per unit mass.
        why: This is the reciprocal of density, not density itself.
      - text: Mass multiplied by volume.
        why: The definition uses division; mass is divided by volume.
      - text: Weight per unit volume.
        why: Density uses mass, not weight.
    explanation: |
      Density is mass per unit volume, $\rho=m/V$.

  - id: density-basic-calc
    format: numeric
    difficulty: 1
    objectives: ["4.3.1"]
    prompt: |
      A sample has mass $150\ \text{g}$ and volume $50\ \text{cm}^3$. Calculate its density.
    fields:
      - answer: 3
        unit: g cm^{-3}
    explanation: |
      $\rho=m/V=150/50=3.0\ \text{g cm}^{-3}$.

  - id: density-mass
    format: numeric
    difficulty: 2
    objectives: ["4.3.1"]
    prompt: |
      A material has density $800\ \text{kg m}^{-3}$. What is the mass of a $2.0\times10^{-3}\ \text{m}^3$ piece?
    fields:
      - answer: 1.6
        unit: kg
    explanation: |
      Rearrange $\rho=m/V$ to $m=\rho V$: $800\times2.0\times10^{-3}=1.6\ \text{kg}$.

  - id: density-compare
    format: mcq
    difficulty: 2
    objectives: ["4.3.1"]
    prompt: |
      Two objects have the same mass. Object B has twice the volume of object A. How does B's density compare with A's?
    options:
      - text: B has half A's density.
        correct: true
        why: With the same mass, doubling the volume halves mass per unit volume.
      - text: B has twice A's density.
        why: This reverses the effect of volume in $\rho=m/V$.
      - text: They have equal density.
        why: Equal mass alone is not enough; their volumes differ.
      - text: B has four times A's density.
        why: No square or other power of volume appears in the density definition.
    explanation: |
      Density is mass divided by volume. Keeping mass fixed while doubling volume halves the density.

  - id: density-si
    format: numeric
    difficulty: 3
    objectives: ["4.3.1"]
    prompt: |
      Convert a density of $2.7\ \text{g cm}^{-3}$ into $\text{kg m}^{-3}$.
    fields:
      - answer: 2700
        unit: kg m^{-3}
    explanation: |
      Convert both units: $2.7\ \text{g}=0.0027\ \text{kg}$ and $1\ \text{cm}^3=10^{-6}\ \text{m}^3$. Thus $0.0027/(10^{-6})=2700\ \text{kg m}^{-3}$.
