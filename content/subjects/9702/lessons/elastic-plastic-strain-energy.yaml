id: elastic-plastic-strain-energy
subject: "9702"
topic: "6.2"
title: "Elastic potential energy: the ½ in ½Fx and ½kx²"
summary: Within the limit of proportionality the graph is a triangle, so the energy stored is half the final force times the extension — and that half is not optional.
