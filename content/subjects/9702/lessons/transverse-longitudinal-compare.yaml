id: transverse-longitudinal-compare
subject: "9702"
topic: "7.2"
title: Transverse and longitudinal waves
summary: What makes a wave transverse or longitudinal, how to tell which one you are looking at, and the comparison examiners ask for.
order: 1
minutes: 9
kind: core
objectives: ["7.2.1"]
prerequisites: [progressive-waves-what-is-a-wave, progressive-waves-key-terms]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027, topic 7.2, learning outcome 7.2.1 (compare transverse and longitudinal waves).
    All examples are invented and all questions are original.
    Re-checked line by line in a second, adversarial pass by the same agent on 2026-10-28: every worked answer and every answer key was recomputed in Python from the question's own data, each MCQ was checked for exactly one defensible correct option, and every objective was re-read against the syllabus wording. Chromium cannot launch in this environment, so the diagrams were checked by reading their coordinates and label boxes rather than by viewing a render, and that caught four label and stroke faults that were fixed. No separate reviewer model was available and no teacher has reviewed this lesson.

blocks:
  - type: objective
    body: |-
      By the end you can say what makes a wave **transverse** or **longitudinal**, decide which one a given wave is, and give the paired comparison that examiners ask for.

  - type: explain
    title: Two ways to shake a slinky
    body: |-
      Hold one end of a slinky and flick it sideways. A kink races to the other end.

      Now push the same slinky along its length instead. A squeezed patch races along it.

      Both carry energy from your hand to the far end, but the material moves in different directions. That single difference is what the words **transverse** and **longitudinal** describe.

      Two directions matter:

      - The **direction of travel** is the way the wave, and the energy it carries, moves.
      - The **direction of oscillation** is the way the particles of the medium move about their rest positions.

      Compare those two directions and you have classified the wave. There is no third option: they are either at right angles or along the same line.

  - type: definition
    term: Transverse wave
    body: |-
      A wave in which the **oscillations are perpendicular to the direction of energy transfer**.

      Examples: light and every other electromagnetic wave, waves on a rope or a guitar string, ripples on water (treated as transverse at this level), and S-waves in an earthquake.

  - type: definition
    term: Longitudinal wave
    body: |-
      A wave in which the **oscillations are parallel to the direction of energy transfer**.

      A longitudinal wave is made of **compressions**, where the particles are pushed closer together, and **rarefactions**, where they are spread further apart.

      Examples: sound in air, water or steel, ultrasound, and P-waves in an earthquake.

  - type: diagram
    diagram: phys-transverse-longitudinal-compare
    alt: >-
      Two stacked panels. The top panel shows a transverse wave as a wavy rope of dots around a
      straight equilibrium line, with a vertical double arrow labelled oscillation and a
      horizontal arrow labelled travel. The bottom panel shows a longitudinal wave as a row of
      evenly spaced dots that bunch together in some places and spread out in others, with a
      short horizontal double arrow labelled oscillation, three labelled compressions and a
      horizontal arrow labelled travel.
    caption: |-
      In both pictures the energy travels left to right. Only the direction of the wobble is different.

  - type: explain
    title: The same ingredients, arranged differently
    body: |-
      | Feature | Transverse | Longitudinal |
      | --- | --- | --- |
      | Oscillation compared with travel | perpendicular | parallel |
      | What you see | crests and troughs | compressions and rarefactions |
      | Examples | light, rope waves, S-waves | sound, ultrasound, P-waves |
      | Needs a medium? | not always — light crosses empty space | yes |

      Everything else is shared. Both transfer **energy** from one place to another, without carrying the medium along for good. Both have an amplitude, a wavelength, a frequency and a period, and both obey $v = f\lambda$.

      That shared list is worth learning, because "state one similarity" is a standard one-mark question.

  - type: check
    title: Quick check
    questions: [which-is-longitudinal, oscillation-direction, compression-blank]

  - type: intuition
    title: The Mexican wave
    body: |-
      Picture a packed football stadium doing a Mexican wave. Each fan stands up and sits down again. Nobody walks around the stadium, yet the wave sweeps all the way round.

      That is the key idea behind every wave: **the pattern travels, the material stays put**.

      For a transverse wave the fans stand up — motion at right angles to the way the wave moves. For a longitudinal wave they would have to shuffle forwards and backwards along the row instead.

      Where the analogy stops: a real crowd drifts and a real wave loses energy as it spreads out. A wave still carries energy past every point, even though each particle only wobbles about a fixed rest position.

  - type: misconceptions
    items:
      - wrong: In a sound wave, the air travels from the speaker to your ear.
        right: |-
          The air particles oscillate about fixed positions; the **energy** travels. That is why a loudspeaker does not blow you over, and why you do not feel a gust of wind from a shout.
      - wrong: Longitudinal waves have crests and troughs.
        right: |-
          The wave itself has compressions and rarefactions. A *graph* of a longitudinal wave can have crests, but a graph is a plot, not the wave.
      - wrong: Light must need a medium, because it is a wave.
        right: |-
          Electromagnetic waves are transverse and can travel through empty space. Sound cannot, which is why space is silent.
      - wrong: Water ripples are purely transverse.
        right: |-
          At this level we treat them as transverse, but the water surface actually moves in small circles. The syllabus examples to quote are light, rope waves, sound and seismic waves.

  - type: example
    title: Sort these four waves
    problem: |-
      Classify each wave and say how you know.

      1. A wave on a skipping rope, shaken up and down.
      2. A sound wave travelling from a loudspeaker to your ear.
      3. A light wave from a torch.
      4. An ultrasound pulse used to scan a baby.
    steps:
      - |-
        The rope moves up and down while the wave runs along it. Perpendicular, so it is **transverse**.
      - |-
        The air particles vibrate back and forth along the line the sound travels. Parallel, so it is **longitudinal**.
      - |-
        Light is an electromagnetic wave, and every electromagnetic wave is transverse.
      - |-
        Ultrasound is simply sound with a frequency above what you can hear. Changing the frequency does not change the wave type, so it is still **longitudinal**.
    answer: |-
      1 transverse, 2 longitudinal, 3 transverse, 4 longitudinal.

  - type: exam
    body: |-
      - A comparison question wants **two paired statements**, one for each type. "In a transverse wave the oscillations are perpendicular to the direction of travel, whereas in a longitudinal wave they are parallel" earns the marks.
      - "Sound is longitudinal and light is transverse" earns very little by itself, because it never says what those words mean.
      - For "state one similarity", safe answers are that both transfer energy, both can be reflected and refracted, or both have a frequency and a wavelength.
      - Do not write that a longitudinal wave has crests. Say compressions and rarefactions.

  - type: takeaways
    items:
      - 'A **transverse** wave oscillates perpendicular to its direction of travel.'
      - 'A **longitudinal** wave oscillates parallel to its direction of travel, in compressions and rarefactions.'
      - 'Both transfer energy without carrying matter along for good.'
      - 'Sound, ultrasound and P-waves are longitudinal; light, other electromagnetic waves and S-waves are transverse.'

  - type: check
    title: Practice
    questions: [shared-property, compare-spot-error]

questions:
  - id: which-is-longitudinal
    format: mcq
    difficulty: 1
    objectives: ["7.2.1"]
    prompt: |-
      Which of these is a longitudinal wave?
    options:
      - text: Sound travelling through air
        correct: true
        why: |-
          The air particles oscillate along the line the sound travels, bunching into compressions and spreading into rarefactions.
      - text: Light from a lamp
        why: |-
          Light is an electromagnetic wave, and all electromagnetic waves are transverse.
      - text: A wave on a guitar string
        why: |-
          The string moves at right angles to the direction the wave travels along it, so the wave is transverse.
      - text: A radio wave
        why: |-
          Radio waves are electromagnetic, so they are transverse.
    explanation: |-
      Sound is the standard longitudinal example: the particles vibrate **along** the direction the wave travels.

  - id: oscillation-direction
    format: mcq
    difficulty: 1
    objectives: ["7.2.1"]
    prompt: |-
      In a transverse wave, the particles of the medium oscillate
    options:
      - text: at right angles to the direction of energy transfer
        correct: true
        why: |-
          "Transverse" means the oscillation is perpendicular to the direction the wave travels.
      - text: along the direction of energy transfer
        why: |-
          That is the definition of a longitudinal wave.
      - text: in small circles about fixed points
        why: |-
          Water surface particles do move in small circles, but that is not the definition of a transverse wave.
      - text: in the same direction as the wave, but faster than the wave travels
        why: |-
          No particle of the medium travels along with the wave at all.
    explanation: |-
      Transverse means perpendicular: the particles wobble at right angles to the way the energy moves.

  - id: compression-blank
    format: cloze
    difficulty: 1
    objectives: ["7.2.1"]
    prompt: |-
      In a longitudinal wave, regions where the particles are pushed closer together are called {{1}}, and regions where they are further apart are called {{2}}.
    blanks:
      - accept: [compression, compressions]
      - accept: [rarefaction, rarefactions]
    explanation: |-
      Compressions are squeezed regions; rarefactions are stretched regions. Together they make up a longitudinal wave.

  - id: shared-property
    format: mcq
    difficulty: 2
    objectives: ["7.2.1"]
    prompt: |-
      Which statement is true of **both** transverse and longitudinal waves?
    options:
      - text: Both transfer energy without transferring matter permanently.
        correct: true
        why: |-
          The pattern and its energy move on, while each particle returns to its rest position.
      - text: Both can be polarised.
        why: |-
          Only transverse waves can be polarised, because polarisation depends on the oscillation having a direction at right angles to travel.
      - text: Both need a medium to travel through.
        why: |-
          Light is transverse and crosses empty space, so this is not true of all transverse waves.
      - text: Both have particles that travel along with the wave.
        why: |-
          Particles oscillate about fixed positions; they do not travel with the wave.
    explanation: |-
      The shared property is energy transfer without bulk movement of matter.

  - id: compare-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.2.1"]
    prompt: |-
      A student compares sound and light. Which line contains the first error?
    lines:
      - Sound is a longitudinal wave and light is a transverse wave.
      - In sound, the air particles oscillate parallel to the direction the sound travels.
      - In light, the oscillations are parallel to the direction the light travels.
      - Both waves transfer energy from one place to another without carrying matter along.
    errorLine: 3
    fix: |-
      In a transverse wave the oscillations are **perpendicular** to the direction of travel, so the oscillations in light are at right angles to the direction the light travels.
    explanation: |-
      Line 1 is right, line 2 correctly describes a longitudinal wave, and line 4 is a genuine similarity. Line 3 describes light as if it were longitudinal.
