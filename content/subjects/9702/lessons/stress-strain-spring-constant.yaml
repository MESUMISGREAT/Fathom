id: stress-strain-spring-constant
subject: "9702"
topic: "6.1"
title: "The spring constant: how stiff is it?"
summary: The constant in Hooke's law is a measure of stiffness — the gradient of the load–extension graph — and it is the same for a spring, a wire or a rubber band.
order: 3
minutes: 6
kind: core
objectives: ["6.1.4"]
prerequisites: [stress-strain-hookes-law]
