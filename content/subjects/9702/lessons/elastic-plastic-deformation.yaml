id: elastic-plastic-deformation
subject: "9702"
topic: "6.2"
title: "Elastic and plastic: does it spring back?"
summary: Elastic deformation reverses when the force is removed; plastic deformation is permanent. The unloading curve is what tells them apart.
order: 1
minutes: 8
kind: core
objectives: ["6.2.1"]
prerequisites: [stress-strain-deformation, stress-strain-hookes-law]
