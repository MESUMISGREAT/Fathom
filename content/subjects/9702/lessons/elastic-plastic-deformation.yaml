blocks:
  - type: objective
    body: |-
      By the end you can define **elastic deformation** and **plastic deformation**, and decide which one has happened by comparing an object's length before loading, at maximum load, and after the load is removed.

  - type: explain
    title: Two different endings to the same story
    body: |-
      Stretch a rubber band and let go. It snaps back to the length it started with. Nothing has changed permanently.

      Bend a paper clip and let go. It stays bent. The shape has changed for good.

      Both objects were deformed — their shape changed while a force acted. The difference is what happens **afterwards**, when the force is removed.

      That single difference gives us the two key words for this topic.

  - type: definition
    term: Elastic deformation
    body: |-
      **Elastic deformation** is deformation in which the object **returns to its original shape and size** when the deforming force is removed.

      The change is reversible. The energy used to stretch the object is given back when it relaxes.

  - type: definition
    term: Plastic deformation
    body: |-
      **Plastic deformation** is deformation in which the object **does not return to its original shape and size** when the deforming force is removed. A permanent change remains.

      Plastic deformation is also called permanent deformation. Some of the energy put in is not recovered: it ends up heating the material.

  - type: diagram
    diagram: phys-elastic-plastic-loading-unloading
    alt: >-
      A force against extension graph for a metal wire. The loading curve rises in a straight line
      from the origin and then bends over as the force increases. A small load is removed from a
      point on the straight part: the unloading line retraces the loading line back to the origin.
      A large load is removed from beyond the bend: its unloading line is parallel to the straight
      part but lands on the extension axis to the right of the origin, leaving a permanent
      extension. The point where the graph first bends is labelled the elastic limit.
    caption: |-
      Load it gently and it comes back to the origin. Load it too far and the unloading line misses the origin — that gap is the permanent stretch.

  - type: intuition
    title: What the atoms are doing
    body: |-
      A solid is held together by forces between its atoms. Those atoms sit at a separation where the forces pull and push equally, like a tiny spring at its natural length.

      A small stretch pulls the atoms slightly apart. Let go and the interatomic forces push them back to where they were. That is elastic behaviour.

      Stretch far enough and whole layers of atoms can slide past one another into new positions. The forces can no longer pull them back to the old arrangement, so the new shape stays. That is plastic behaviour.

      The analogy is a pile of coins: nudge the pile gently and it settles back; push a layer so far that it slides over the one below, and it stays in its new place. The analogy stops at the atomic scale — atoms do not slide as whole blocks — but the idea of a one-way rearrangement is the same.

  - type: example
    title: "Worked example: reading a length test"
    problem: |-
      A wire has an unstretched length of $1.500\ \text{m}$.

      A load stretches it to $1.512\ \text{m}$. When the load is removed, the wire is $1.504\ \text{m}$ long.

      Was the deformation elastic, plastic, or both? Give the permanent extension.
    steps:
      - |-
        Compare the final length with the original length. They are not equal, so something permanent has happened.
      - |-
        Permanent extension $= 1.504 - 1.500 = 0.004\ \text{m} = 4\ \text{mm}$.
      - |-
        At maximum load the extension was $1.512 - 1.500 = 0.012\ \text{m} = 12\ \text{mm}$.
      - |-
        Of that $12\ \text{mm}$, $4\ \text{mm}$ stayed and $12 - 4 = 8\ \text{mm}$ sprang back.
      - |-
        So the wire deformed **plastically** (the $4\ \text{mm}$ that stayed) and also **elastically** (the $8\ \text{mm}$ that recovered).
    answer: |-
      Both: $4\ \text{mm}$ of permanent (plastic) extension and $8\ \text{mm}$ of recovered (elastic) extension.

  - type: explain
    title: A material can do both at once
    body: |-
      The two words describe what happens to **parts** of the deformation, not two separate types of object.

      Once a material has been stretched beyond its elastic limit, some of the stretch is permanent and some is still elastic. Release it and the elastic part springs back, leaving the plastic part behind.

      That is why the wire above ended up $4\ \text{mm}$ longer instead of returning to $1.500\ \text{m}$ or staying at $1.512\ \text{m}$.

  - type: check
    title: Quick check
    questions: [ep-which-elastic, ep-definition-text, ep-permanent]

  - type: misconceptions
    items:
      - wrong: A material is either elastic or plastic.
        right: |-
          Most materials behave elastically for small forces and plastically for large ones. The
          behaviour depends on how far you deform them, not just on what they are made of.
      - wrong: Plastic deformation means the material is a plastic (like polythene).
        right: |-
          In physics, "plastic" describes a permanent change of shape. Metals, rocks and bones can
          all deform plastically.
      - wrong: If an object stretches a lot, it must have deformed plastically.
        right: |-
          A long elastic stretch is still elastic if it fully recovers. Rubber stretches enormously
          and still springs back. What matters is the length after unloading, not the size of the
          extension.
      - wrong: Elastic deformation stores no energy.
        right: |-
          Elastic deformation stores energy that is released when the object returns to shape.
          That stored energy is the subject of the next two lessons.
      - wrong: The permanent extension equals the maximum extension.
        right: |-
          It equals the maximum extension minus the part that sprang back. Only the unrecovered
          part is permanent.

  - type: exam
    body: |-
      - Use the phrase **"returns to its original shape and size when the force is removed"** for elastic, and **"does not return"** / **"permanent change"** for plastic. Those are the mark-scheme ideas.
      - When a question gives three lengths (before, at maximum load, after), calculate both the maximum extension and the permanent extension, then subtract to find the elastic part.
      - Do not call a material elastic just because it stretched. Say what happened when the load was removed.

  - type: takeaways
    items:
      - '**Elastic deformation** is reversible: the object returns to its original shape and size when the force is removed.'
      - '**Plastic deformation** is permanent: the object stays deformed after the force is removed.'
      - 'The same object can deform elastically at small loads and plastically at large loads.'
      - 'Permanent extension = length after unloading − original length.'

  - type: check
    title: Practice
    questions: [ep-cloze, ep-explain, ep-spot-error]

questions:
  - id: ep-which-elastic
    format: mcq
    difficulty: 1
    objectives: ["6.2.1"]
    prompt: |-
      Which of these is an example of **elastic** deformation?
    options:
      - text: A rubber band returns to its original length after being stretched and released
        correct: true
        why: |-
          The band recovers its original shape when the force is removed, which is the definition of elastic deformation.
      - text: A paper clip stays bent after being opened out
        why: |-
          The clip does not return to its original shape, so this is plastic deformation.
      - text: A car bumper stays dented after a collision
        why: |-
          The dent is permanent, so the deformation is plastic.
      - text: A metal spoon stays twisted after being bent
        why: |-
          The twist remains after the force is removed, so it is plastic.
    explanation: |-
      Elastic deformation is reversible. Only the rubber band returns to its original shape.

  - id: ep-definition-text
    format: text
    difficulty: 1
    style: definition
    objectives: ["6.2.1"]
    prompt: |-
      Define **plastic deformation**.
    accept:
      - permanent deformation
      - deformation that is permanent
      - the object does not return to its original shape when the force is removed
      - the object does not return to its original shape and size when the force is removed
      - permanent change of shape
      - a permanent change in shape when a force is removed
    model: |-
      Deformation in which the object does not return to its original shape and size when the deforming force is removed; a permanent change remains.
    explanation: |-
      The key idea is that the change is **not reversed** when the force is removed.

  - id: ep-permanent
    format: numeric
    difficulty: 2
    objectives: ["6.2.1"]
    prompt: |-
      A wire is $1.200\ \text{m}$ long with no load. A load stretches it to $1.260\ \text{m}$. When the load is removed, the wire is $1.210\ \text{m}$ long.

      What is the permanent extension, in mm?
    fields:
      - label: "permanent extension ="
        answer: 10
        unit: mm
        tolerance: { abs: 0.5 }
    explanation: |-
      The permanent extension is the difference between the final length and the original length: $1.210 - 1.200 = 0.010\ \text{m} = 10\ \text{mm}$. The other $50\ \text{mm}$ of the $60\ \text{mm}$ maximum extension sprang back.

  - id: ep-cloze
    format: cloze
    difficulty: 1
    objectives: ["6.2.1"]
    prompt: |-
      When the force is removed, an object that has deformed {{1}} returns to its original shape and size, while an object that has deformed {{2}} keeps a permanent change.
    blanks:
      - accept: [elastically, elastic]
      - accept: [plastically, plastic]
    explanation: |-
      Elastic deformation is reversible; plastic deformation is permanent.

  - id: ep-explain
    format: explain
    difficulty: 2
    objectives: ["6.2.1"]
    prompt: |-
      A metal wire is loaded until it is $8.0\ \text{mm}$ longer, then the load is removed. Its final length is $3.0\ \text{mm}$ longer than before.

      Explain what this tells you about the deformation of the wire.
    model: |-
      The wire has deformed both plastically and elastically. The $3.0\ \text{mm}$ that remains is permanent plastic extension, because the wire did not return to its original length. The other $5.0\ \text{mm}$ of the $8.0\ \text{mm}$ maximum extension sprang back when the load was removed, so that part was elastic.
    keyPoints:
      - The final length is greater than the original length, so some deformation is permanent.
      - The permanent extension is 3.0 mm.
      - The wire recovered 5.0 mm of the 8.0 mm extension when unloaded.
      - The recovered part is elastic deformation; the permanent part is plastic deformation.
    explanation: |-
      Compare the length after unloading with the original length to find the plastic part, then subtract from the maximum extension to find the elastic part.

  - id: ep-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["6.2.1"]
    prompt: |-
      A student describes a test on a spring. Which line contains the first error?
    lines:
      - The spring's original length is 12.0 cm.
      - A 5.0 N load stretches it to 15.0 cm.
      - When the load is removed, the spring is 13.0 cm long.
      - The spring has deformed elastically, because it returned to its original length.
    errorLine: 4
    fix: |-
      The spring ended at 13.0 cm, not 12.0 cm, so it did **not** return to its original length. The 1.0 cm that remained is permanent, so the spring deformed plastically (as well as elastically).
    explanation: |-
      Lines 1–3 are measurements and are consistent. Line 4 draws the wrong conclusion: elastic deformation requires the **original** length to be recovered.
