id: density-pressure-pressure-basics
subject: "9702"
topic: "4.3"
title: "Pressure: force spread over area"
summary: Pressure is normal force per unit area, so the same force creates more pressure over a smaller area.
order: 2
minutes: 4
objectives: ["4.3.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Physics 9702 syllabus
    2025-2027, learning outcome 4.3.2 (define pressure and use the definition). All questions
    are original. Numerical values and diagrams are illustrative teaching examples, not measured
    data. Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end, you can define **pressure** as normal force per unit area and calculate pressure, force or area.

  - type: definition
    term: Pressure
    body: |
      **Pressure** is the **force acting normally per unit area**. “Normally” means at right angles to the surface.

  - type: explain
    title: The area changes the pressure
    body: |
      Push the same way on a wide pad and a narrow pin. The force can be the same, but the pin applies it to a much smaller area, so its pressure is greater.

      Call the pressure $p$. Let $F$ be the force at right angles to the surface and $A$ the area it acts on. Then:

      $$p = \dfrac{F}{A}$$

      Pressure is measured in pascals, $\text{Pa}$; $1\ \text{Pa}=1\ \text{N m}^{-2}$.

  - type: diagram
    diagram: phys-density-pressure-pressure-area
    alt: >-
      Two blocks each have the same downward normal force F. One rests on a wide contact area and
      the other on a narrow contact area. The formula p equals F divided by A is shown; the same
      force concentrated on the smaller area gives greater pressure.
    caption: "The same force over less area gives greater pressure."

  - type: check
    questions: [pressure-meaning, pressure-calc]

  - type: example
    title: A crate on the floor
    problem: |
      A crate pushes down on the floor with a normal force of $240\ \text{N}$ over an area of $0.012\ \text{m}^2$. Find the pressure.
    steps:
      - |
        Use pressure equals normal force divided by area: $p=F/A$.
      - |
        Substitute: $p=240/0.012=20\,000\ \text{Pa}$.
      - |
        The result is a pressure, not a force. Its unit is the pascal: $1\ \text{Pa}=1\ \text{N m}^{-2}$.
    answer: |
      $2.0\times10^4\ \text{Pa}$

  - type: explain
    title: Find force or area instead
    body: |
      Rearranging the same definition gives $F=pA$ and $A=F/p$. The units check each version: pressure times area is $\text{Pa m}^2=\text{N}$.

  - type: check
    questions: [pressure-force, pressure-area, pressure-small-area]

  - type: misconceptions
    items:
      - wrong: Pressure is force multiplied by area.
        right: Pressure is force divided by area, $p=F/A$.
      - wrong: Any force on a surface counts in full.
        right: Use the component of force acting normally, at right angles, to that surface.

  - type: exam
    body: |
      - State the force direction and contact area you use; pressure depends on both.
      - A smaller area raises pressure only when the normal force stays the same.

  - type: takeaways
    items:
      - Pressure is normal force per unit area.
      - $p=F/A$; rearrange to $F=pA$ or $A=F/p$.
      - $1\ \text{Pa}=1\ \text{N m}^{-2}$.

questions:
  - id: pressure-meaning
    format: mcq
    difficulty: 1
    objectives: ["4.3.2"]
    prompt: |
      Which quantity belongs in the definition of pressure?
    options:
      - text: Force acting normally per unit area.
        correct: true
        why: Pressure is the normal force divided by the area it acts on.
      - text: Any force per unit length.
        why: Pressure is force per area, not force per length.
      - text: Force multiplied by area.
        why: Pressure uses division by area.
      - text: Mass per unit area.
        why: Pressure uses force; mass per area is a different quantity.
    explanation: |
      The definition is normal force per unit area: $p=F/A$.

  - id: pressure-calc
    format: numeric
    difficulty: 2
    objectives: ["4.3.2"]
    prompt: |
      A normal force of $240\ \text{N}$ acts over $0.012\ \text{m}^2$. Calculate the pressure.
    fields:
      - answer: 20000
        unit: Pa
    explanation: |
      $p=F/A=240/0.012=20\,000\ \text{Pa}$.

  - id: pressure-force
    format: numeric
    difficulty: 2
    objectives: ["4.3.2"]
    prompt: |
      A pressure of $35\ \text{kPa}$ acts normally over $0.020\ \text{m}^2$. Calculate the normal force.
    fields:
      - answer: 700
        unit: N
    explanation: |
      Convert $35\ \text{kPa}$ to $35\,000\ \text{Pa}$, then use $F=pA=35\,000\times0.020=700\ \text{N}$.

  - id: pressure-area
    format: numeric
    difficulty: 2
    objectives: ["4.3.2"]
    prompt: |
      A normal force of $500\ \text{N}$ produces a pressure of $25\ \text{kPa}$. Find the area.
    fields:
      - answer: 0.02
        unit: m^2
    explanation: |
      Convert pressure to pascals: $25\ \text{kPa}=25\,000\ \text{Pa}$. Then $A=F/p=500/25\,000=0.020\ \text{m}^2$.

  - id: pressure-small-area
    format: mcq
    difficulty: 1
    objectives: ["4.3.2"]
    prompt: |
      The same perpendicular force is applied first over a large area and then over a smaller area. What happens to the pressure?
    options:
      - text: It increases over the smaller area.
        correct: true
        why: Dividing the same force by a smaller area gives a larger pressure.
      - text: It decreases over the smaller area.
        why: This reverses $p=F/A$ when force is unchanged.
      - text: It stays the same because the force is unchanged.
        why: Pressure depends on area as well as force.
    explanation: |
      With the force fixed, pressure is inversely proportional to area.
