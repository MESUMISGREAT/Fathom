id: functions-inverse-graphs
subject: "9709"
topic: "1.2"
title: Graphs of a function and its inverse
summary: The graph of y = f⁻¹(x) is the reflection of y = f(x) in the line y = x, because every point (a, b) becomes (b, a).
order: 6
minutes: 4
kind: core
objectives: ["1.2.4"]
prerequisites: [functions-inverse-functions]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.2 learning outcome "illustrate in graphical
    terms the relationship between a one-one function and its inverse" and its note that sketches
    should show the mirror line y = x. All examples and questions are original; every point and
    intersection checked in Python.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can sketch $y = f(x)$ and $y = f^{-1}(x)$ on the same axes, explain why they are reflections of each other in $y = x$, and find where they meet.

  - type: explain
    title: Swap the coordinates, flip the graph
    body: |-
      If $f(2) = 7$, the point $(2, 7)$ is on $y = f(x)$. The inverse undoes it, $f^{-1}(7) = 2$, so $(7, 2)$ is on $y = f^{-1}(x)$.

      That happens to **every** point: $(a, b)$ on one graph becomes $(b, a)$ on the other. And swapping coordinates is exactly what a reflection in the line $y = x$ does.

  - type: definition
    term: Graph of an inverse function
    body: |-
      The graph of $y = f^{-1}(x)$ is the **reflection** of the graph of $y = f(x)$ in the line $y = x$.

  - type: diagram
    diagram: functions-inverse-reflection
    alt: >-
      Graph with equal scales on both axes. The blue curve y = f(x), where f(x) = (x − 1)² + 1 for
      x ≥ 1, starts at (1, 1) and rises steeply. The orange curve y = f inverse of x,
      1 + √(x − 1) for x ≥ 1, also starts at (1, 1) and rises gently. A dashed line y = x, labelled
      mirror line, lies between them. The point (3, 5) on f is joined by a dashed segment to (5, 3)
      on the inverse; the segment crosses y = x at right angles. The two curves meet at (1, 1) and
      (2, 2), both on the line y = x.
    caption: |-
      $f(x) = (x - 1)^2 + 1$ for $x \geqslant 1$ and $f^{-1}(x) = 1 + \sqrt{x - 1}$. Fold the page along $y = x$ and the two curves land on top of each other.

  - type: intuition
    title: Why (a, b) and (b, a) are mirror images
    body: |-
      The segment from $(a, b)$ to $(b, a)$ has gradient $\dfrac{a - b}{b - a} = -1$. That's perpendicular to $y = x$ (gradient 1).

      Its midpoint is $\left(\tfrac{a + b}{2}, \tfrac{a + b}{2}\right)$, which sits on $y = x$. So the line $y = x$ cuts the segment in half at right angles: it's a perfect mirror.

  - type: check
    questions: [ig-point, ig-mirror]

  - type: explain
    title: How to sketch the pair
    body: |-
      1. Use **equal scales** on both axes, or the reflection will look wrong.
      2. Draw the line $y = x$ (dashed is fine) and label it.
      3. Reflect the **key points**: swap the coordinates of end points and intercepts. An end point $(1, 3)$ becomes $(3, 1)$; a $y$-intercept $(0, c)$ becomes an $x$-intercept $(c, 0)$.
      4. Draw $y = f^{-1}(x)$ as the mirror image, over the range of $f$ only.

  - type: example
    title: A pair that never meets
    problem: |-
      $f(x) = x^2 + 1$ for $x \geqslant 0$. Find $f^{-1}(x)$, describe the sketch of both graphs, and decide whether they meet.
    steps:
      - |-
        $y = x^2 + 1 \Rightarrow x = \sqrt{y - 1}$ (positive root, since $x \geqslant 0$). So $f^{-1}(x) = \sqrt{x - 1}$ for $x \geqslant 1$.
      - |-
        $y = f(x)$ starts at $(0, 1)$ on the $y$-axis and curves up steeply. $y = f^{-1}(x)$ starts at the swapped point $(1, 0)$ on the $x$-axis and curves gently to the right.
      - |-
        Both graphs are increasing, so if they met, they'd meet on $y = x$. Try solving $f(x) = x$: $x^2 + 1 = x$, i.e. $x^2 - x + 1 = 0$.
      - |-
        The discriminant is $(-1)^2 - 4(1)(1) = -3 < 0$, so there are no real roots: the parabola stays above $y = x$, and its reflection stays below.
    answer: |-
      $f^{-1}(x) = \sqrt{x - 1}$ for $x \geqslant 1$. The graphs are mirror images in $y = x$ and **do not meet**.

  - type: explain
    title: Where do they meet?
    body: |-
      For an **increasing** function (the usual exam case), the graphs of $f$ and $f^{-1}$ can only meet **on the line $y = x$**. So solve $f(x) = x$, which is usually much easier than $f(x) = f^{-1}(x)$.

      Diagram check: $(x - 1)^2 + 1 = x$ gives $x^2 - 3x + 2 = 0$, so $x = 1$ or $x = 2$. Meeting points $(1, 1)$ and $(2, 2)$ ✓

  - type: check
    questions: [ig-start, ig-meet]

  - type: misconceptions
    items:
      - wrong: |-
          The inverse graph is the reflection in the $y$-axis.
        right: |-
          Reflecting in the $y$-axis gives $y = f(-x)$. The inverse is the reflection in the line $y = x$.
      - wrong: |-
          The graphs of $f$ and $f^{-1}$ always cross somewhere.
        right: |-
          Not always. $x^2 + 1$ for $x \geqslant 0$ and its inverse never meet, because $x^2 + 1 = x$ has no real roots.
      - wrong: |-
          Drawing $y = f^{-1}(x)$ over the same $x$-values as $y = f(x)$.
        right: |-
          Its $x$-values are the **range** of $f$. An end point $(0, 1)$ on $f$ means the inverse starts at $(1, 0)$.

  - type: deeper
    title: Decreasing functions can surprise you
    body: |-
      The "meet on $y = x$" shortcut is safe for increasing functions. A **decreasing** function and its inverse can also meet at pairs of points off the mirror line.

      Example: $f(x) = -x^3$ has $f^{-1}(x) = -\sqrt[3]{x}$. They meet at $(0, 0)$ on $y = x$, but also at $(1, -1)$ and $(-1, 1)$, which are reflections of each other. If a question involves a decreasing function, solve $f(x) = f^{-1}(x)$ properly.

  - type: exam
    body: |-
      - Typical wording: *Sketch, on the same diagram, the graphs of $y = f(x)$ and $y = f^{-1}(x)$, showing clearly the relationship between them.* Usually 2–3 marks.
      - "Showing the relationship" means **draw and label the line $y = x$**, and make the two graphs look like true mirror images (same shape, swapped end points).
      - Mark end points and axis intercepts with their coordinates. Don't let $f^{-1}$ wander outside the range of $f$.
      - Insider hack: lightly sketch $y = x$ first, then reflect two or three points by swapping coordinates. Join the dots. Done.

  - type: check
    questions: [ig-asymptote, ig-recover, ig-explain]

  - type: takeaways
    items:
      - |-
        $y = f^{-1}(x)$ is the reflection of $y = f(x)$ in the line $y = x$: every $(a, b)$ becomes $(b, a)$.
      - |-
        Sketch with equal scales, draw and label $y = x$, and swap the coordinates of key points.
      - |-
        For an increasing function, $f$ and $f^{-1}$ meet only on $y = x$: solve $f(x) = x$.
      - |-
        The inverse graph lives over the range of $f$, not the domain.

questions:
  - id: ig-point
    format: numeric
    difficulty: 1
    objectives: ["1.2.4"]
    prompt: |-
      The point $(2, 7)$ lies on the graph of $y = f(x)$, where $f$ is one-one. Which point must lie on the graph of $y = f^{-1}(x)$?
    fields:
      - label: "x ="
        answer: 7
      - label: "y ="
        answer: 2
    explanation: |-
      $f(2) = 7$ means $f^{-1}(7) = 2$, so $(7, 2)$ is on $y = f^{-1}(x)$. Swap the coordinates: that's the reflection in $y = x$.

  - id: ig-mirror
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.2.4"]
    prompt: |-
      The graph of $y = f^{-1}(x)$ is the reflection of the graph of $y = f(x)$ in which line? Give its equation.
    accept:
      - y = x
      - y=x
      - the line y = x
      - line y = x
      - the line y=x
      - x = y
      - y equals x
    model: |-
      The line $y = x$.
    explanation: |-
      Every point $(a, b)$ on $y = f(x)$ becomes $(b, a)$ on $y = f^{-1}(x)$, and swapping coordinates is reflection in $y = x$.

  - id: ig-start
    format: mcq
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |-
      $f(x) = (x - 2)^2 + 3$ for $x \geqslant 2$. The graph of $y = f(x)$ starts at its vertex $(2, 3)$. Where does the graph of $y = f^{-1}(x)$ start?
    explanation: |-
      Reflect the end point in $y = x$ by swapping its coordinates: $(2, 3)$ becomes $(3, 2)$. That fits: the domain of $f^{-1}$ is the range of $f$, $x \geqslant 3$.
    options:
      - text: |-
          $(2, 3)$
        why: |-
          That's where $f$ starts. The inverse starts at the mirror image in $y = x$.
      - text: |-
          $(3, 2)$
        correct: true
        why: |-
          Swap the coordinates of $(2, 3)$. The inverse is defined for $x \geqslant 3$, the range of $f$.
      - text: |-
          $(-2, 3)$
        why: |-
          That's a reflection in the $y$-axis, which gives $y = f(-x)$, not the inverse.
      - text: |-
          $(2, -3)$
        why: |-
          That's a reflection in the $x$-axis, which gives $y = -f(x)$, not the inverse.

  - id: ig-meet
    format: numeric
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |-
      $f(x) = x^2 - 6$ for $x \geqslant 0$, an increasing function. Find the coordinates of the point where the graphs of $y = f(x)$ and $y = f^{-1}(x)$ meet.
    fields:
      - label: "x ="
        answer: 3
      - label: "y ="
        answer: 3
    explanation: |-
      An increasing function meets its inverse on $y = x$, so solve $f(x) = x$: $x^2 - 6 = x$, so $x^2 - x - 6 = 0$ and $(x - 3)(x + 2) = 0$.

      $x = -2$ is outside the domain $x \geqslant 0$, so the only meeting point is $(3, 3)$.

  - id: ig-asymptote
    format: cloze
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |-
      The graph of a one-one function $y = f(x)$ has a vertical asymptote $x = 2$ and a horizontal asymptote $y = 5$. The graph of $y = f^{-1}(x)$ has a vertical asymptote $x =$ {{1}} and a horizontal asymptote $y =$ {{2}}.
    blanks:
      - accept: ["5"]
      - accept: ["2"]
    explanation: |-
      Reflecting in $y = x$ swaps $x$ and $y$ everywhere, so the line $x = 2$ becomes $y = 2$ and the line $y = 5$ becomes $x = 5$. Vertical becomes horizontal and vice versa.

  - id: ig-recover
    format: numeric
    difficulty: 3
    objectives: ["1.2.4"]
    prompt: |-
      $f(x) = ax + b$, where $a$ and $b$ are constants. The graph of $y = f^{-1}(x)$ passes through the points $(7, 2)$ and $(1, -1)$. Find $a$ and $b$.
    fields:
      - label: "a ="
        answer: 2
      - label: "b ="
        answer: 3
    explanation: |-
      Reflect the two points in $y = x$ by swapping their coordinates: $(2, 7)$ and $(-1, 1)$ lie on $y = f(x)$.

      Gradient: $a = \dfrac{7 - 1}{2 - (-1)} = \dfrac63 = 2$. Then $7 = 2(2) + b$, so $b = 3$.

      Check: $f(x) = 2x + 3$ has $f^{-1}(x) = \dfrac{x - 3}{2}$, and $f^{-1}(7) = 2$ ✓, $f^{-1}(1) = -1$ ✓

  - id: ig-explain
    format: explain
    difficulty: 2
    objectives: ["1.2.4"]
    prompt: |-
      Explain why the graph of $y = f^{-1}(x)$ is the reflection of the graph of $y = f(x)$ in the line $y = x$.
    explanation: |-
      The argument is: inverse ⇒ coordinates swap ⇒ swapped points are mirror images in $y = x$ ⇒ the whole graph reflects.
    model: |-
      If $(a, b)$ is on $y = f(x)$, then $f(a) = b$, so $f^{-1}(b) = a$ and $(b, a)$ is on $y = f^{-1}(x)$. The segment joining $(a, b)$ and $(b, a)$ has gradient $-1$, so it is perpendicular to $y = x$, and its midpoint $\left(\tfrac{a+b}{2}, \tfrac{a+b}{2}\right)$ lies on $y = x$. So $(b, a)$ is the reflection of $(a, b)$ in $y = x$. This works for every point, so the whole graph of $f^{-1}$ is the reflection of the graph of $f$.
    keyPoints:
      - If f(a) = b then f⁻¹(b) = a, so (a, b) on f gives (b, a) on f⁻¹
      - The points (a, b) and (b, a) are reflections of each other in y = x
      - A reason, such as the segment joining them is perpendicular to y = x and its midpoint lies on y = x
      - This holds for every point, so the whole graph is reflected
