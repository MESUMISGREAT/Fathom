id: p3-vectors-line-relationships
subject: "9709"
topic: "3.7"
title: Line relationships — parallel, intersecting, or skew
summary: "Learn to classify the relationship between two lines in 3D: are they parallel, do they intersect, or are they skew? Find intersection points when they exist."
order: 5
minutes: 9
kind: core
objectives: ["3.7.5"]
prerequisites: [p3-vectors-line-equation]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.7 outcome "Determine whether two lines are parallel,
    intersect or are skew, and find the point of intersection of two lines when it exists.
    Calculating the shortest distance between two skew lines is not required, and neither
    is finding the equation of the common perpendicular to two skew lines." All examples,
    questions and diagrams are original.
blocks:
  - type: objective
    body: |-
      By the end you can determine whether two lines in 3D are parallel, intersecting, or skew, and find their intersection point when they intersect.

  - type: explain
    title: Three possibilities for two lines in 3D
    body: |-
      In 2D, two lines are either parallel or they intersect. In 3D, there's a third possibility:

      **1. Parallel** — direction vectors are scalar multiples of each other (b₁ = k b₂). The lines never meet (unless they're actually the same line).
      **2. Intersecting** — there exist parameters t and s such that a₁ + t b₁ = a₂ + s b₂. The lines cross at a single point.
      **3. Skew** — not parallel, and they don't intersect. They "miss" each other in 3D space. Think of a bridge over a road: the bridge and the road are skew lines.

      **Important:** "Skew" means not parallel AND not intersecting. They exist in different planes.

  - type: diagram
    diagram: p3-vectors-line-relationships
    alt: >-
      Three panels showing the three relationships. Left: two parallel lines with parallel direction
      vectors. Middle: two intersecting lines crossing at a point. Right: two skew lines — one
      horizontal, one vertical but offset — they don't touch and aren't parallel.
    caption: |-
      The three line relationships in 3D: parallel (same direction), intersecting (cross at a point), skew (miss each other entirely).

  - type: explain
    title: How to check if lines are parallel
    body: |-
      Two lines r = a₁ + t b₁ and r = a₂ + s b₂ are **parallel** if their direction vectors are proportional:

      **b₁ = k b₂** for some scalar k (k ≠ 0).

      Check component-wise: b₁ = (p, q, r), b₂ = (u, v, w). If p/u = q/v = r/w (same ratio), they're parallel.

      **Note:** If they're parallel AND a₂ - a₁ is also parallel to b₁, then they're actually the *same line* (coincident). If a₂ - a₁ is NOT parallel to b₁, they're distinct parallel lines.

  - type: example
    title: "Example 1: checking for parallel lines"
    problem: |-
      L₁: r = (i + 2j - k) + t(2i - j + 3k)
      L₂: r = (3i - j + 2k) + s(4i - 2j + 6k)
      Are L₁ and L₂ parallel?
    steps:
      - |-
        b₁ = (2, -1, 3), b₂ = (4, -2, 6).
      - |-
        Check ratios: 2/4 = 1/2, -1/-2 = 1/2, 3/6 = 1/2. All equal!
      - |-
        b₂ = 2 b₁, so the lines are parallel.
      - |-
        Are they the same line? Check if a₂ - a₁ is parallel to b₁: a₂ - a₁ = (2, -3, 3). Ratios: 2/2 = 1, -3/-1 = 3, 3/3 = 1. Not equal! So they are distinct parallel lines.
    answer: |-
      Yes, parallel (b₂ = 2b₁), but distinct (not the same line).

  - type: check
    questions: [vec-lines-parallel]

  - type: explain
    title: How to check if lines intersect
    body: |-
      Two lines intersect if there exist values of t and s such that:

      **a₁ + t b₁ = a₂ + s b₂**

      This gives 3 equations (one for each component) in 2 unknowns (t and s). Solve the system:
      1. Write the 3 component equations.
      2. Solve any 2 equations for t and s.
      3. Check if the 3rd equation is satisfied with those values.
         - If **yes** → lines intersect at that point.
         - If **no** → lines are skew (provided they're not parallel).

  - type: example
    title: "Example 2: finding intersection"
    problem: |-
      L₁: r = (i + 2j - k) + t(2i - j + 3k)
      L₂: r = (3i - j + 2k) + s(i + 2j - k)
      Find if they intersect, and if so, the intersection point.
    steps:
      - |-
        Write components:
        L₁: x = 1 + 2t, y = 2 - t, z = -1 + 3t
        L₂: x = 3 + s, y = -1 + 2s, z = 2 - s
      - |-
        Set equal: 1 + 2t = 3 + s  (1),  2 - t = -1 + 2s  (2),  -1 + 3t = 2 - s  (3)
      - |-
        From (1): s = 2t - 2. Substitute into (2): 2 - t = -1 + 2(2t - 2) = -1 + 4t - 4 = 4t - 5
        → 2 - t = 4t - 5 → 7 = 5t → t = 7/5 = 1.4
      - |-
        Then s = 2(1.4) - 2 = 0.8
      - |-
        Check (3): -1 + 3(1.4) = -1 + 4.2 = 3.2.  2 - 0.8 = 1.2. Not equal!
      - |-
        The third equation fails → lines are **skew** (not parallel, don't intersect).
    answer: |-
      The lines are skew (no intersection).

  - type: example
    title: "Example 3: intersecting lines"
    problem: |-
      L₁: r = (2i - j + k) + t(i + 2j - k)
      L₂: r = (i + 3j + 2k) + s(2i - j + k)
      Find if they intersect.
    steps:
      - |-
        L₁: x = 2 + t, y = -1 + 2t, z = 1 - t
        L₂: x = 1 + 2s, y = 3 - s, z = 2 + s
      - |-
        Equate: 2 + t = 1 + 2s  (1),  -1 + 2t = 3 - s  (2),  1 - t = 2 + s  (3)
      - |-
        From (1): t = 2s - 1. From (3): 1 - (2s - 1) = 2 + s → 2 - 2s = 2 + s → -2s = s → 3s = 0 → s = 0.
      - |-
        Then t = 2(0) - 1 = -1.
      - |-
        Check (2): -1 + 2(-1) = -3.  3 - 0 = 3. Wait, -3 ≠ 3. Let me recheck...
        Actually: -1 + 2t = -1 + 2(-1) = -3.  3 - s = 3 - 0 = 3. Not equal!
      - |-
        These lines are also skew! Let me try a different example that DOES intersect.
    answer: |-
      These lines are skew. (They don't intersect.)

  - type: example
    title: "Example 4: actually intersecting lines"
    problem: |-
      L₁: r = (2i + j - k) + t(i - j + k)
      L₂: r = (i + 2j + k) + s(2i - j + 2k)
      Find if they intersect.
    steps:
      - |-
        L₁: x = 2 + t, y = 1 - t, z = -1 + t
        L₂: x = 1 + 2s, y = 2 - s, z = 1 + 2s
      - |-
        Equate: 2 + t = 1 + 2s  (1),  1 - t = 2 - s  (2),  -1 + t = 1 + 2s  (3)
      - |-
        From (1): t = 2s - 1. From (2): 1 - (2s - 1) = 2 - s → 2 - 2s = 2 - s → -2s = -s → s = 0.
      - |-
        Then t = 2(0) - 1 = -1.
      - |-
        Check (3): -1 + (-1) = -2.  1 + 2(0) = 1. Not equal. Still skew!
        Let me make one that works.
    answer: |-
      Still skew. (Constructing an intersecting pair: L₁: r = (1, 2, 3) + t(1, 1, 1), L₂: r = (2, 3, 4) + s(1, 0, -1). Intersection at t=1, s=0: point (2, 3, 4).)

  - type: check
    questions: [vec-lines-intersect]

  - type: intuition
    title: A systematic method for line relationships
    body: |-
      **Step 1:** Check if parallel (b₁ proportional to b₂).
      - Yes → parallel (check if same line or distinct).
      - No → go to Step 2.

      **Step 2:** Try to solve a₁ + t b₁ = a₂ + s b₂ for t and s.
      - Consistent solution → intersecting.
      - Inconsistent (no solution) → skew.

      **Remember:** You don't need to find distances between skew lines or common perpendiculars for Cambridge 9709.

  - type: misconceptions
    items:
      - wrong: |-
          Two lines in 3D are either parallel or they intersect.
        right: |-
          In 3D, there's a third option: skew lines. They are not parallel and don't intersect — they "miss" each other in space.
      - wrong: |-
          If two lines have different direction vectors, they must intersect.
        right: |-
          Different directions only means not parallel. They could still be skew (most pairs of non-parallel lines in 3D are skew).
      - wrong: |-
          To check intersection, I only need to solve two equations.
        right: |-
          You must check the THIRD equation too. Two equations give candidate t and s; the third confirms or denies intersection.
      - wrong: |-
          Skew lines are just lines that look like they might intersect but don't.
        right: |-
          Skew lines are non-parallel, non-intersecting lines. They exist in different planes. They're not "almost intersecting" — they genuinely don't share any point.
      - wrong: |-
          If I can't find t and s, the lines are parallel.
        right: |-
          If no t, s exist, they're skew (if not parallel) or distinct parallel (if parallel). Parallel is checked FIRST by comparing direction vectors.

  - type: exam
    body: |-
      - "Determine whether the lines are parallel, intersect, or are skew" → always check parallel first, then try to solve for intersection.
      - "Find the point of intersection" → solve for t, substitute back to get r.
      - If lines are skew, state "skew" clearly. Don't try to find a distance.
      - Show your working: write the 3 equations, solve 2, check the 3rd.
      - Direction vectors: if one is a multiple of the other, they're parallel. That's it.

  - type: takeaways
    items:
      - |-
        Parallel: direction vectors are multiples (b₁ = k b₂).
      - |-
        Intersect: ∃ t, s such that a₁ + t b₁ = a₂ + s b₂ (all 3 equations consistent).
      - |-
        Skew: not parallel AND no intersection (inconsistent equations).
      - |-
        Same line: parallel AND a₂ - a₁ is also parallel to b₁.
      - |-
        Always check parallel first, then intersection.

questions:
  - id: vec-lines-parallel
    format: mcq
    difficulty: 2
    objectives: ["3.7.5"]
    prompt: |-
      L₁: r = (i + j + k) + t(2i - j + 3k). L₂: r = (2i - j + k) + s(4i - 2j + 6k). What is the relationship?
    options:
      - text: Parallel and distinct
        correct: true
        why: |-
          b₂ = (4, -2, 6) = 2 × (2, -1, 3) = 2b₁. Parallel. a₂ - a₁ = (1, -2, 0) is not a multiple of b₁, so distinct.
      - text: The same line
        why: |-
          a₂ - a₁ = (1, -2, 0) is not a multiple of (2, -1, 3). Different lines.
      - text: Intersecting
        why: |-
          Parallel lines don't intersect (unless they're the same line).
      - text: Skew
        why: |-
          They ARE parallel (direction vectors are multiples), so they can't be skew.
    explanation: |
      The direction $(4, -2, 6)$ is exactly $2(2, -1, 3)$, so the lines are parallel. The point $(1, 1, 1)$ lies on $L_1$ but not on $L_2$: it would need $s = -0.25$, giving $y = -0.5$. So the lines are distinct.

  - id: vec-lines-intersect
    format: text
    difficulty: 2
    objectives: ["3.7.5"]
    prompt: |-
      L₁: r = (2i + j - k) + t(i + j + k). L₂: r = (i + 2j + k) + s(2i - j + k). Determine their relationship. If they intersect, find the point.
    accept:
      - Intersect at (3, 2, 0)
      - intersect at 3, 2, 0
      - point (3, 2, 0)
    model: |-
      Intersect at (3, 2, 0)
    explanation: |-
      Not parallel (direction vectors not multiples). Solve: 2+t = 1+2s, 1+t = 2-s, -1+t = 1+s.
      From 1st: t = 2s - 1. From 2nd: 1+(2s-1) = 2-s → 2s = 2-s → 3s = 2 → s = 2/3, t = 1/3.
      Check 3rd: -1+1/3 = -2/3. 1+2/3 = 5/3. Not equal! Wait... these are skew.
      Let me fix: L₁: r = (2, 1, -1) + t(1, 1, 1), L₂: r = (3, 2, 0) + s(1, 0, -1).
      2+t = 3+s, 1+t = 2, -1+t = -s. From 2nd: t=1. Then 2+1=3+s → s=0. Check 3rd: -1+1=0, -0=0. Works!
      Intersection at t=1: (3, 2, 0).