id: work-energy-power-power
subject: "9709"
topic: "4.5"
title: "Power: how fast work is done"
summary: "What power means, why P = Fv for a force pushing along the direction of motion, and how to find the power or top speed of a vehicle on a level road or a hill."
order: 4
minutes: 10
kind: core
objectives: ["4.5.4"]
prerequisites: ["work-energy-power-work-done", "newtons-laws-inclined-planes"]
