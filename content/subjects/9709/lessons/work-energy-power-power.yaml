blocks:
  - type: objective
    body: |
      By the end you can explain what power is, use $P = \dfrac{W}{t}$ and $P = Fv$, and find the power of a
      vehicle, or its top speed, on level ground and on a hill.

  - type: explain
    title: Key to the symbols
    body: |
      | Symbol | Meaning |
      | --- | --- |
      | $P$ | power, in **watts** (W) |
      | $W$ | work done, in joules (J). (Careful: the unit "W" for watts is a different thing.) |
      | $t$ | time, in seconds (s) |
      | $F$ | a force, in newtons (N) |
      | $v$ | speed, in $\text{m s}^{-1}$ |
      | $D$ | the **driving force** of an engine (the push it gives the vehicle forwards) |
      | $R$ | the **resistance** to motion (air resistance, friction and so on), opposing the motion |

  - type: explain
    title: What power means
    body: |
      Two people each carry an identical box up the same flight of stairs. They do exactly the **same work**,
      because they lift the same weight through the same height. But one runs up in 5 seconds and the other
      walks up in 20 seconds. The runner is more **powerful**: they do the work **faster**.

      **Power is the rate of doing work**, meaning the work done per second:

      $$P = \frac{W}{t}$$

      The unit is the **watt**: $1\ \text{W} = 1\ \text{J s}^{-1}$, one joule of work every second. Engines are
      usually measured in kilowatts: $1\ \text{kW} = 1000\ \text{W}$. **Always convert kW to W** before
      calculating.

      If the work isn't done at a steady rate, $\dfrac{W}{t}$ gives the **average** power over that time.

  - type: example
    title: Average power on the stairs
    problem: |
      A $60$ kg student climbs a flight of stairs $3$ m high. Find the work done against gravity, and the
      average power if the climb takes (a) $5$ seconds, (b) $20$ seconds. Use $g = 10\ \text{m s}^{-2}$.
    steps:
      - "To lift the student, the force needed equals their weight, $mg = 60 \\times 10 = 600$ N."
      - "Work done $=$ force $\\times$ distance moved upwards $= 600 \\times 3 = 1800$ J."
      - "(a) Average power $= \\dfrac{1800}{5} = 360$ W."
      - "(b) Average power $= \\dfrac{1800}{20} = 90$ W."
      - "Same work, but running up needs four times the power, because it is done in a quarter of the time."
    answer: |
      The work done is $1800$ J. The average power is (a) $360$ W and (b) $90$ W.

  - type: explain
    title: Why P = Fv
    body: |
      Suppose a force $F$ pushes an object along, in the direction it is moving, at speed $v$.

      - In one second the object moves $v$ metres (that's what a speed of $v\ \text{m s}^{-1}$ means).
      - Work done $=$ force $\times$ distance moved in the direction of the force, so in that one second the
        force does $F \times v$ joules of work.
      - Work done per second is power. So:

      $$P = Fv$$

      This is the formula you will use most. It links the power of an engine to the force it produces and the
      speed it is going. Notice the trade-off: for a fixed power, **the faster you go, the smaller the force**
      the engine can produce, because $F = \dfrac{P}{v}$. That is why a car accelerates hard at low speed but
      struggles to gain speed near its top speed.

  - type: explain
    title: Vehicles at constant speed
    body: |
      Most questions involve a car, lorry or cyclist. Two forces matter along the road: the engine's **driving
      force** $D$ pushing forwards, and the **resistance** $R$ holding it back.

      **At constant speed the forces balance.** Constant speed means no acceleration, so by Newton's first law
      the forces along the road cancel. On level ground that simply means $D = R$.

      On a hill, part of the weight also pulls the vehicle back down the slope. On a slope at angle $\theta$,
      that part (the component of the weight down the slope) is $mg\sin\theta$. Going **up** the hill at
      constant speed, the engine has to beat both: $D = R + mg\sin\theta$.

      Then the engine's power is $P = Dv$.

      **Top speed.** An engine has a maximum power. As speed increases, the driving force $D = \dfrac{P}{v}$ gets
      smaller, until it only just equals the resistance. Then the vehicle can't accelerate any more: that is
      its top speed. So at top speed, set $D$ equal to the resistance and solve $v = \dfrac{P}{D}$.

  - type: example
    title: The power of a car at steady speed
    problem: |
      A car of mass $1200$ kg travels at a constant speed of $25\ \text{m s}^{-1}$ on a level road. The total
      resistance to motion is $800$ N. Find the power output of the engine.
    steps:
      - "Constant speed, so the forces along the road balance: the driving force equals the resistance, $D = 800$ N."
      - "Power: $P = Dv = 800 \\times 25 = 20\\,000$ W."
      - "The mass wasn't needed: on level ground at constant speed, only the resistance matters."
    answer: |
      $P = 20\,000\ \text{W} = 20\ \text{kW}$.

  - type: example
    title: Top speed from a maximum power
    problem: |
      A van's engine has a maximum power of $50$ kW. It travels on a level road against a constant resistance
      of $1200$ N. Find its maximum speed.
    steps:
      - "Convert the power to watts: $50\\ \\text{kW} = 50\\,000$ W."
      - "At top speed the van can't accelerate, so the driving force has dropped to equal the resistance: $D = 1200$ N."
      - "$P = Dv$ rearranges to $v = \\dfrac{P}{D} = \\dfrac{50\\,000}{1200} \\approx 41.7\\ \\text{m s}^{-1}$."
    answer: |
      The maximum speed is about $41.7\ \text{m s}^{-1}$.

  - type: example
    title: Climbing a hill at steady speed
    problem: |
      A car of mass $1000$ kg climbs a hill inclined at $5°$ to the horizontal at a constant speed of
      $15\ \text{m s}^{-1}$. The resistance to motion is $600$ N. Find the power of the engine. Use
      $g = 10\ \text{m s}^{-2}$.
    steps:
      - "The weight is $mg = 1000 \\times 10 = 10\\,000$ N. The part pulling the car back down the slope is $mg\\sin 5° = 10\\,000 \\times 0.08716 \\approx 872$ N."
      - "Constant speed, so along the slope the forces balance. The engine must beat both the resistance and the slope: $D = 600 + 872 = 1472$ N."
      - "Power: $P = Dv = 1472 \\times 15 \\approx 22\\,100$ W."
    answer: |
      The engine's power is about $22.1$ kW.

  - type: check
    title: Check power
    questions: [power-average, power-constant, power-max-speed, power-hill]

  - type: misconceptions
    items:
      - wrong: "A car going at constant speed isn't doing any work, so its power is zero."
        right: "The engine is still pushing against the resistance. The **resultant** force is zero, but the driving force isn't, so $P = Dv > 0$."
      - wrong: "I can put kilowatts straight into $P = Fv$."
        right: "Convert to watts first: multiply kW by 1000."
      - wrong: "At top speed the driving force is zero."
        right: "At top speed the driving force **equals** the resistance (plus $mg\\sin\\theta$ on a hill), so there is no **resultant** force left to accelerate."

  - type: exam
    body: |
      - Write $D = \dfrac{P}{v}$ as a separate line; it is often worth a method mark on its own.
      - On a hill, write the component $mg\sin\theta$ explicitly and say which way it acts.
      - If the vehicle is **accelerating**, the forces don't balance: use $D - R = ma$ instead. That is the next lesson.

  - type: takeaways
    items:
      - "Power is the rate of doing work: $P = \\dfrac{W}{t}$, in watts ($1\\ \\text{W} = 1\\ \\text{J s}^{-1}$)."
      - "For a force in the direction of motion, $P = Fv$, so the driving force is $D = \\dfrac{P}{v}$."
      - "Constant speed: forces balance. Level road $D = R$; uphill $D = R + mg\\sin\\theta$."
      - "Top speed: the driving force has fallen to equal the resistance, so $v_{\\max} = \\dfrac{P}{D}$."

questions:
  - id: power-constant
    format: numeric
    difficulty: 1
    objectives: ["4.5.4"]
    prompt: |
      A lorry of mass $20000\text{ kg}$ travels at a constant speed of $20\text{ m s}^{-1}$ on a level road. The resistance to motion is $5000\text{ N}$. Find the power output of the engine in kW.
    fields:
      - answer: 100
        unit: kW
        tolerance: { abs: 0.1 }
    explanation: |
      Constant speed → driving force $D = R = 5000\text{ N}$.
      $P = Dv = 5000 \times 20 = 100000\text{ W} = 100\text{ kW}$.

  - id: power-max-speed
    format: numeric
    difficulty: 2
    objectives: ["4.5.4"]
    prompt: |
      A car has maximum engine power $80\text{ kW}$. On a level road, the resistance to motion is constant at $1500\text{ N}$. Find the maximum speed of the car.
    fields:
      - answer: 53.3
        unit: "m s⁻¹"
        tolerance: { abs: 0.5 }
    explanation: |
      At max speed, $D = R = 1500\text{ N}$.
      $P = Dv_{\text{max}} \Rightarrow v_{\text{max}} = P/D = 80000/1500 = 53.3\text{ m s}^{-1}$.

  - id: power-hill
    format: numeric
    difficulty: 2
    objectives: ["4.5.4"]
    prompt: |
      A cyclist and bike of total mass $80\text{ kg}$ ride up a hill inclined at $8^\circ$ at a steady speed of $6\text{ m s}^{-1}$. The air resistance and rolling resistance total $40\text{ N}$. Find the power the cyclist must produce. Use $g = 10\text{ m s}^{-2}$.
    fields:
      - answer: 908
        unit: W
        tolerance: { abs: 5 }
    explanation: |
      Weight component down slope = $mg\sin 8^\circ = 80 \times 10 \times \sin 8^\circ = 800 \times 0.1392 = 111.3\text{ N}$.
      Total opposing force = $111.3 + 40 = 151.3\text{ N}$.
      Power $P = Fv = 151.3 \times 6 = 908\text{ W}$ (to 3 s.f.).
  - id: power-average
    format: numeric
    difficulty: 1
    objectives: ["4.5.4"]
    prompt: |
      A crane lifts a load of weight $2000$ N through a height of $15$ m in $25$ s. Find the average power of the crane, in watts.
    fields:
      - label: "P ="
        answer: 1200
        unit: W
    explanation: |
      Work done $= 2000 \times 15 = 30\,000$ J. Average power $= \dfrac{30\,000}{25} = 1200$ W.
