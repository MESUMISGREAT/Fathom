blocks:
  - type: objective
    body: |
      By the end you can define power as the rate of doing work (P = W/t), use P = Fv for a constant force acting in the direction of motion, and solve problems involving power, force, and velocity.

  - type: definition
    term: Power
    body: |
      **Power** is the rate at which work is done, or the rate at which energy is transferred:
      $$P = \\frac{W}{t} = \\frac{\\Delta E}{t}$$
      where $W$ is work done (J), $t$ is time (s), and $P$ is power (W).
      - Unit: **watt (W)**. $1\\text{ W} = 1\\text{ J s}^{-1}$.
      - Power is a scalar.
      - $1\\text{ kW} = 1000\\text{ W}$, $1\\text{ hp} \\approx 746\\text{ W}$ (horsepower, sometimes seen in older texts).

  - type: explain
    title: P = Fv for constant force and velocity
    body: |
      If a constant force $F$ acts in the direction of motion, and the object moves at constant velocity $v$:
      - In time $t$, the object travels distance $d = vt$.
      - Work done $W = Fd = Fvt$.
      - Power $P = W/t = Fv$.

      More generally, if the force and velocity are at angle $\\theta$:
      $$P = Fv \\cos\\theta$$
      (This is the rate of work done **by** that force.)

      **Important:** $P = Fv$ gives the power **delivered by a specific force** $F$. The net power equals the rate of change of KE: $P_{\\text{net}} = \\frac{d}{dt}(\\frac{1}{2}mv^2) = F_{\\text{net}}v$.

  - type: example
    title: Power of a car engine
    problem: |
      A car of mass $1200\text{ kg}$ travels at a constant speed of $25\text{ m s}^{-1}$ on a level road. The total resistance to motion is $800\text{ N}$. Find the power output of the engine.
    steps:
      - 'Constant speed → acceleration = 0 → net force = 0'
      - 'Driving force $D$ = resistance $R = 800\text{ N}$ (since balanced)'
      - 'Power $P = Dv = 800 \times 25 = 20000\text{ W} = 20\text{ kW}$'
    answer: |
      $P = 20\text{ kW}$

  - type: example
    title: Maximum speed with given power
    problem: |
      A van has an engine power of $50\text{ kW}$. It travels on a level road against a constant resistance of $1200\text{ N}$. Find its maximum possible speed.
    steps:
      - 'At max speed, acceleration = 0, so driving force $D$ = resistance $R = 1200\text{ N}$'
      - 'Power $P = Dv \Rightarrow v = P/D = 50000 / 1200 = 41.7\text{ m s}^{-1}$'
    answer: |
      $v \approx 41.7\text{ m s}^{-1}$

  - type: example
    title: Power going up a hill
    problem: |
      A car of mass $1000\text{ kg}$ climbs a hill inclined at $5^\circ$ at a constant speed of $15\text{ m s}^{-1}$. The resistance to motion is $600\text{ N}$. Find the engine power. Use $g = 10\text{ m s}^{-2}$.
    steps:
      - 'Constant speed → net force parallel to slope = 0'
      - 'Component of weight down slope = $mg \sin 5^\circ = 1000 \times 10 \times 0.0872 = 872\text{ N}$'
      - 'Driving force $D$ up slope must balance: $D = 872 + 600 = 1472\text{ N}$'
      - 'Power $P = Dv = 1472 \times 15 = 22080\text{ W} = 22.1\text{ kW}$'
    answer: |
      $P \approx 22.1\text{ kW}$

  - type: check
    title: Check yourself
    questions: [power-constant, power-max-speed, power-hill]

  - type: misconceptions
    items:
      - wrong: 'P = Fv works for any force and any velocity.'
        right: |
          $P = Fv$ gives the power **of that specific force**. For the engine, use the driving force $D$. For friction, use $F_{\text{friction}}$ (giving negative power = energy dissipation rate).
      - wrong: 'Maximum power = maximum force × maximum speed.'
        right: |
          An engine has a **maximum power** (power curve). At low speed it can provide high force (high torque); at high speed, force is lower. $P_{\text{max}} = Fv$ at every point on the curve, but $F$ and $v$ vary inversely.
      - wrong: 'Power is a vector.'
        right: |
          Power is a scalar. It can be positive (energy input) or negative (energy output/dissipation), but has no direction.
      - wrong: 'A car at constant speed has zero power output.'
        right: |
          The engine does work against resistance. $P = Dv > 0$. The net force is zero, but the engine force is not zero.

  - type: exam
    body: |
      - For constant speed on level ground: $D = R$, so $P = Rv$.
      - For constant speed on a slope: $D = R + mg\sin\theta$ (uphill) or $D + mg\sin\theta = R$ (downhill, if engine braking).
      - Maximum speed: set $D = R$ (level) or $D = R + mg\sin\theta$ (uphill), then $v_{\text{max}} = P/D$.
      - If asked for acceleration at a given speed: $P = Dv \Rightarrow D = P/v$. Then $D - R = ma$ (level) or $D - R - mg\sin\theta = ma$ (uphill).
      - Always use watts for power, m/s for speed, newtons for force.

  - type: takeaways
    items:
      - 'Power = rate of doing work: $P = W/t = \Delta E/t$ (unit: watt = J/s)'
      - 'For constant force parallel to velocity: $P = Fv$'
      - 'Constant speed on level: $P = Rv$ (driving force = resistance)'
      - 'Constant speed uphill: $P = (R + mg\sin\theta)v$'
      - 'Max speed at power $P$: $v_{\text{max}} = P/D_{\text{required}}$'

questions:
  - id: power-constant
    format: numeric
    difficulty: 1
    objectives: ["4.5.4"]
    prompt: |
      A lorry of mass $20000\text{ kg}$ travels at a constant speed of $20\text{ m s}^{-1}$ on a level road. The resistance to motion is $5000\text{ N}$. Find the power output of the engine in kW.
    fields:
      - answer: 100
        unit: kW
        tolerance: { abs: 0.1 }
    explanation: |
      Constant speed → driving force $D = R = 5000\text{ N}$.
      $P = Dv = 5000 \times 20 = 100000\text{ W} = 100\text{ kW}$.

  - id: power-max-speed
    format: numeric
    difficulty: 2
    objectives: ["4.5.4"]
    prompt: |
      A car has maximum engine power $80\text{ kW}$. On a level road, the resistance to motion is constant at $1500\text{ N}$. Find the maximum speed of the car.
    fields:
      - answer: 53.3
        unit: "m s⁻¹"
        tolerance: { abs: 0.5 }
    explanation: |
      At max speed, $D = R = 1500\text{ N}$.
      $P = Dv_{\text{max}} \Rightarrow v_{\text{max}} = P/D = 80000/1500 = 53.3\text{ m s}^{-1}$.

  - id: power-hill
    format: numeric
    difficulty: 2
    objectives: ["4.5.4"]
    prompt: |
      A cyclist and bike of total mass $80\text{ kg}$ ride up a hill inclined at $8^\circ$ at a steady speed of $6\text{ m s}^{-1}$. The air resistance and rolling resistance total $40\text{ N}$. Find the power the cyclist must produce. Use $g = 10\text{ m s}^{-2}$.
    fields:
      - answer: 908
        unit: W
        tolerance: { abs: 5 }
    explanation: |
      Weight component down slope = $mg\sin 8^\circ = 80 \times 10 \times \sin 8^\circ = 800 \times 0.1392 = 111.3\text{ N}$.
      Total opposing force = $111.3 + 40 = 151.3\text{ N}$.
      Power $P = Fv = 151.3 \times 6 = 908\text{ W}$ (to 3 s.f.).