id: p2-trigonometry-reciprocal-functions
subject: "9709"
topic: "2.3"
title: "Three more trig graphs: sec, cosec and cot"
summary: Connect sec, cosec and cot to cos, sin and tan, then sketch their repeating branches and asymptotes.
order: 1
minutes: 5
kind: core
objectives: ["2.3.1"]
prerequisites: [p1-trigonometry-graphs-of-sin-cos-tan]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027, topic 2.3 learning outcome 2.3.1: relationships, properties and graphs of all
    six trigonometric functions for angles of any magnitude. All questions are original; no
    illustrative data are used. Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end, you can explain how sec, cosec and cot are built from cos, sin and tan, and sketch their key graph features for any angle.
  - type: explain
    title: Three names, three reciprocals
    body: |-
      You already know sine, cosine and tangent. The new functions are their reciprocals: one divided by the old value.

      - sec x = 1/cos x
      - cosec x = 1/sin x
      - cot x = cos x/sin x; where tan x is defined, this is also 1/tan x

      Example: if cos x = 1/2, then sec x = 2. If the old value is zero, its reciprocal is undefined.
  - type: check
    questions: [reciprocal-values, reciprocal-cot]
  - type: diagram
    diagram: p2-trigonometry-reciprocal-graphs
    alt: >-
      Three graph panels for sec x, cosec x and cot x from minus pi to pi. Sec has upward branches
      with minimum 1 at zero and downward branches with maximum minus 1 at plus or minus pi, with
      asymptotes where cos x is zero. Cosec has asymptotes where sin x is zero. Cot decreases between
      asymptotes at multiples of pi and crosses zero at plus or minus pi over 2.
    caption: |-
      The gaps are real: a reciprocal cannot exist where its denominator is zero. The patterns repeat outside this window.
  - type: explain
    title: Read the graph without memorising six curves
    body: |-
      Start from the familiar graph underneath. Where its value is near zero, the reciprocal shoots far away; where its value is 1 or -1, the reciprocal is the same.

      | Function | Period | Range | Undefined where |
      | --- | --- | --- | --- |
      | sec x | 2pi | y >= 1 or y <= -1 | cos x = 0 |
      | cosec x | 2pi | y >= 1 or y <= -1 | sin x = 0 |
      | cot x | pi | all real values | sin x = 0 |

      Sec and cosec have repeating U-shaped branches; cot has decreasing branches between its asymptotes.
  - type: example
    title: Finding a value and a gap
    problem: |-
      Find sec 60 degrees and state whether cosec 180 degrees exists.
    steps:
      - |-
        cos 60 degrees = 1/2, so sec is its reciprocal: sec 60 degrees = 2.
      - |-
        sin 180 degrees = 0. Cosec would require dividing 1 by 0, which is not allowed.
      - |-
        Therefore cosec 180 degrees is undefined; x = 180 degrees is a vertical asymptote on its graph.
    answer: |-
      sec 60 degrees = 2; cosec 180 degrees is undefined.
  - type: check
    questions: [sec-asymptote, cosec-range]
  - type: misconceptions
    items:
      - wrong: |-
          sec x means 1 - cos x.
        right: |-
          It means the reciprocal, 1/cos x; it is not subtraction.
      - wrong: |-
          cot x is undefined when cos x = 0.
        right: |-
          cot x = cos x/sin x, so its gaps occur when sin x = 0.
  - type: exam
    body: |-
      - Mark the period and asymptotes before drawing branches.
      - State the excluded angles as well as the period; asymptotes are not points on the curve.
      - Angles may be negative or larger than one turn. Repeat the pattern rather than stopping at 0 or 2pi.
  - type: takeaways
    items:
      - |-
        sec x = 1/cos x, cosec x = 1/sin x, and cot x = cos x/sin x.
      - |-
        Reciprocal graphs are undefined wherever the original denominator is zero.
      - |-
        Sec and cosec have period 2pi and ranges y >= 1 or y <= -1; cot has period pi and all real values.
  - type: check
    questions: [cot-period, reciprocal-definition]
questions:
  - id: reciprocal-values
    format: numeric
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |-
      Given sin x = 2/5, find cosec x.
    fields: [{answer: 2.5}]
    explanation: |-
      Cosec is 1 divided by sine: 1/(2/5) = 5/2 = 2.5.
  - id: reciprocal-cot
    format: mcq
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |-
      Which expression equals cot x?
    options:
      - text: |-
          cos x/sin x
        correct: true
        why: |-
          Cot is the reciprocal of tan, so it is cos divided by sin.
      - text: |-
          sin x/cos x
        why: |-
          That is tan x, not cot x.
      - text: |-
          1/cos x
        why: |-
          That is sec x.
      - text: |-
          1/sin x
        why: |-
          That is cosec x.
    explanation: |-
      cot x = 1/tan x = cos x/sin x.
  - id: sec-asymptote
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |-
      At which angles from 0 degrees to 360 degrees is sec x undefined?
    options:
      - text: |-
          90 degrees and 270 degrees
        correct: true
        why: |-
          Cosine is zero at both angles, so its reciprocal is undefined.
      - text: |-
          0 degrees and 180 degrees
        why: |-
          Cosine is 1 and -1 there, so sec is defined.
      - text: |-
          60 degrees and 300 degrees
        why: |-
          Cosine is not zero at these angles.
    explanation: |-
      Sec x = 1/cos x, so it is undefined where cos x = 0.
  - id: cosec-range
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |-
      Which is the range of cosec x?
    options:
      - text: |-
          y >= 1 or y <= -1
        correct: true
        why: |-
          Since sine lies between -1 and 1, its reciprocal has magnitude at least 1.
      - text: |-
          -1 < y < 1
        why: |-
          Sine has this range, but cosec cannot take values strictly between -1 and 1.
      - text: |-
          All real values
        why: |-
          Cosec cannot take values strictly between -1 and 1.
    explanation: |-
      cosec x = 1/sin x, and |sin x| <= 1, so the reciprocal has magnitude at least 1.
  - id: cot-period
    format: text
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |-
      State the period of cot x in radians.
    accept: ["pi"]
    model: |-
      pi radians.
    explanation: |-
      Cot repeats after pi radians, half a full turn.
  - id: reciprocal-definition
    format: cloze
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |-
      sec x = 1/{{1}} and cosec x = 1/{{2}}.
    blanks:
      - accept: ["cos x", "cos"]
      - accept: ["sin x", "sin"]
    explanation: |-
      Sec is the reciprocal of cosine; cosec is the reciprocal of sine.
