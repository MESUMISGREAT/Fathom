id: series-sum-to-infinity
subject: "9709"
topic: "1.6"
title: Sum to infinity of a geometric progression
summary: A geometric progression converges exactly when |r| < 1, and then its sum to infinity is a/(1 − r).
order: 7
minutes: 5
kind: core
objectives: ["1.6.4"]
prerequisites: [series-geometric-sum]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.6 learning outcome "use the condition for
    the convergence of a geometric progression, and the formula for the sum to infinity of a
    convergent geometric progression". Limits are treated informally, as in the syllabus. All
    examples and questions are original; all arithmetic checked in Python. Not yet
    teacher-reviewed.

blocks:
  - type: objective
    body: |-
      By the end you can say when a geometric progression is **convergent** ($|r| < 1$) and find its **sum to infinity** $S_\infty = \dfrac{a}{1 - r}$.

  - type: explain
    title: Infinitely many slices, one pizza
    body: |-
      Eat half a pizza. Then half of what's left. Then half of *that*. You'll go on forever (in theory), but you'll never eat more than one pizza:

      $$\tfrac12 + \tfrac14 + \tfrac18 + \tfrac1{16} + \dots = 1$$

      Adding infinitely many numbers can give a **finite** answer, as long as the numbers shrink fast enough. For a GP, "fast enough" has a very clean test.

  - type: intuition
    title: Watch rⁿ disappear
    body: |-
      You already know $S_n = \dfrac{a(1 - r^n)}{1 - r}$.

      If $-1 < r < 1$, then $r^n$ gets closer and closer to 0 as $n$ grows: $0.5^{10} \approx 0.001$, $0.5^{20} \approx 0.000\,001$. So the $r^n$ in the formula fades away and

      $$S_n \to \frac{a(1 - 0)}{1 - r} = \frac{a}{1 - r}.$$

      If $|r| \geqslant 1$, $r^n$ doesn't fade, so there's no finite limit.

  - type: diagram
    diagram: series-sum-to-infinity
    alt: >-
      Two side-by-side graphs of the partial sums Sₙ against n for n = 1 to 8, both for a GP with
      first term 8, on the same scale. Left, r = ½: the points 8, 12, 14, 15 and then 15.5, 15.75,
      15.875, 15.9375 rise and level off just under a dashed horizontal line labelled S∞ = 16; the
      note says creeps up, never passes 16. Right, r = −½: the points 8, 4, 6, 5 and then 5.5,
      5.25, 5.375, 5.3125 zigzag above and below a dashed line labelled S∞ = 16/3, closing in on
      it; the note says overshoots, undershoots, closes in.
    caption: |-
      Both GPs converge. With $r = \tfrac12$ the partial sums climb towards 16; with $r = -\tfrac12$ they zigzag towards $\tfrac{16}{3}$.

  - type: definition
    term: Convergent GP and sum to infinity
    body: |-
      A geometric progression is **convergent** if and only if $|r| < 1$, that is $-1 < r < 1$ (with $r \neq 0$). Its **sum to infinity** is

      $$S_\infty = \frac{a}{1 - r}.$$

      If $|r| \geqslant 1$ the progression is not convergent and the sum to infinity does not exist.

  - type: explain
    title: What goes wrong when |r| ≥ 1
    body: |-
      | $r$ | Example | What the partial sums do |
      | --- | --- | --- |
      | $r = 1$ | $2 + 2 + 2 + \dots$ | grow forever: $S_n = 2n$ |
      | $r = -1$ | $2 - 2 + 2 - \dots$ | flip between 2 and 0, never settle |
      | $r > 1$ | $1 + 2 + 4 + \dots$ | grow faster and faster |
      | $r < -1$ | $1 - 2 + 4 - \dots$ | swing wider and wider |

  - type: check
    questions: [which-converges, sinf-basic]

  - type: example
    title: A negative ratio
    problem: |-
      Find the sum to infinity of $24 - 12 + 6 - 3 + \dots$
    steps:
      - |-
        $a = 24$, $r = \dfrac{-12}{24} = -\tfrac12$. Since $|r| = \tfrac12 < 1$, the GP is convergent.
      - |-
        $S_\infty = \dfrac{24}{1 - (-\tfrac12)} = \dfrac{24}{\tfrac32} = 16$.
    answer: |-
      $S_\infty = 16$

  - type: example
    title: Working backwards
    problem: |-
      A convergent geometric progression has first term 15 and sum to infinity 45. Find the common ratio.
    steps:
      - |-
        $\dfrac{15}{1 - r} = 45$, so $1 - r = \dfrac{15}{45} = \tfrac13$.
      - |-
        $r = \tfrac23$, which satisfies $|r| < 1$ ✓
    answer: |-
      $r = \tfrac23$

  - type: check
    questions: [find-r-sinf, two-conditions]

  - type: explain
    title: When the ratio contains x
    body: |-
      *For which values of $x$ is $1 + 2x + 4x^2 + 8x^3 + \dots$ convergent?*

      Here $a = 1$ and $r = 2x$. Convergent means $|2x| < 1$, i.e. $-1 < 2x < 1$, so $-\tfrac12 < x < \tfrac12$. For those values, $S_\infty = \dfrac{1}{1 - 2x}$.

  - type: deeper
    title: Recurring decimals are GPs in disguise
    body: |-
      $0.272727\ldots = 0.27 + 0.0027 + 0.000027 + \dots$, a GP with $a = 0.27$ and $r = 0.01$.

      $$S_\infty = \frac{0.27}{1 - 0.01} = \frac{0.27}{0.99} = \frac{27}{99} = \frac{3}{11}.$$

      So $0.\dot{2}\dot{7} = \tfrac{3}{11}$. (Try it on your calculator.)

  - type: check
    questions: [x-range, recurring]

  - type: misconceptions
    items:
      - wrong: |-
          The GP converges if $r < 1$.
        right: |-
          It needs $-1 < r < 1$. With $r = -2$, $r < 1$ but the terms $1, -2, 4, -8, \dots$ swing wider and wider.
      - wrong: |-
          $S_\infty = \dfrac{a}{r - 1}$
        right: |-
          It's $\dfrac{a}{1 - r}$. For a positive GP with $0 < r < 1$ the sum must be positive, and $r - 1$ would be negative.
      - wrong: |-
          An infinite sum must be infinite.
        right: |-
          Not if the terms shrink fast enough. Every convergent GP has a finite sum to infinity.

  - type: exam
    body: |-
      - "Give a reason why the progression is convergent": write the ratio and compare it with 1, e.g. "$r = -\tfrac12$ and $|r| < 1$". One line, one mark.
      - Sum-to-infinity questions often hide a quadratic in $r$. After solving, **reject** any root with $|r| \geqslant 1$ and say why.
      - Questions combining $S_\infty$ with $S_n$ or a term are common: each fact is one equation in $a$ and $r$.

  - type: takeaways
    items:
      - |-
        A GP is convergent exactly when $|r| < 1$, i.e. $-1 < r < 1$.
      - |-
        Then $S_\infty = \dfrac{a}{1 - r}$, because $r^n \to 0$.
      - |-
        If $|r| \geqslant 1$, there is no sum to infinity.
      - |-
        If $r$ contains $x$, solve $|r| < 1$ to find where the GP converges.

questions:
  - id: which-converges
    format: mcq
    difficulty: 1
    objectives: ["1.6.4"]
    prompt: |-
      Which of these geometric progressions is convergent?
    explanation: |-
      Convergent means $-1 < r < 1$. Only $5, -4.5, 4.05, \dots$ qualifies: $r = \dfrac{-4.5}{5} = -0.9$.
    options:
      - text: $5, -4.5, 4.05, \dots$
        correct: true
        why: |-
          $r = -0.9$ and $|r| = 0.9 < 1$. The terms alternate in sign but shrink.
      - text: $2, 2, 2, \dots$
        why: |-
          $r = 1$, so $|r| < 1$ fails. The sum $2n$ grows forever.
      - text: $1, -1.2, 1.44, \dots$
        why: |-
          $r = -1.2$. It *is* less than 1, but $|r| = 1.2 > 1$, so the terms grow. You need $-1 < r < 1$.
      - text: $100, 105, 110.25, \dots$
        why: |-
          $r = 1.05 > 1$. Slow growth is still growth; the sum has no limit.

  - id: sinf-basic
    format: numeric
    difficulty: 1
    objectives: ["1.6.4"]
    prompt: |-
      Find the sum to infinity of the geometric progression $18 + 6 + 2 + \dots$
    fields:
      - label: "S∞ ="
        answer: 27
    explanation: |-
      $a = 18$, $r = \tfrac13$, and $|r| < 1$: $\;S_\infty = \dfrac{18}{1 - \tfrac13} = \dfrac{18}{\tfrac23} = 27$.

  - id: find-r-sinf
    format: numeric
    difficulty: 2
    objectives: ["1.6.4"]
    prompt: |-
      A convergent geometric progression has first term 8 and sum to infinity 20. Find the common ratio.
    fields:
      - label: "r ="
        answer: 0.6
    explanation: |-
      $\dfrac{8}{1 - r} = 20$, so $1 - r = 0.4$ and $r = 0.6$. Since $|0.6| < 1$ it is convergent ✓

  - id: two-conditions
    format: numeric
    difficulty: 3
    objectives: ["1.6.3", "1.6.4"]
    prompt: |-
      A geometric progression with positive common ratio has sum to infinity 12, and the sum of its first two terms is 9. Find the common ratio and the first term.
    fields:
      - label: "r ="
        answer: 0.5
      - label: "a ="
        answer: 6
    explanation: |-
      $\dfrac{a}{1 - r} = 12$ gives $a = 12(1 - r)$. The first two terms: $a + ar = a(1 + r) = 9$.

      Substitute: $12(1 - r)(1 + r) = 9$, so $1 - r^2 = \tfrac34$ and $r^2 = \tfrac14$. With $r > 0$, $r = \tfrac12$ and $a = 12 \times \tfrac12 = 6$. Check: $6 + 3 = 9$ ✓

  - id: x-range
    format: numeric
    difficulty: 3
    objectives: ["1.6.4"]
    prompt: |-
      The geometric progression $1 + (3x - 1) + (3x - 1)^2 + \dots$ is convergent. Find the set of possible values of $x$, in the form $p < x < q$.
    fields:
      - label: "p ="
        answer: 0
      - label: "q ="
        answer: 0.6666666667
        tolerance: { abs: 0.002 }
    explanation: |-
      $r = 3x - 1$. Convergent means $-1 < 3x - 1 < 1$. Add 1: $0 < 3x < 2$. Divide by 3: $0 < x < \tfrac23$.

  - id: recurring
    format: numeric
    difficulty: 2
    objectives: ["1.6.4"]
    prompt: |-
      By treating $0.454545\ldots$ as the sum to infinity of a geometric progression, write it as a fraction in its lowest terms.
    fields:
      - answer: 0.4545454545454545
    explanation: |-
      $0.45 + 0.0045 + \dots$ has $a = 0.45$ and $r = 0.01$:

      $$S_\infty = \frac{0.45}{1 - 0.01} = \frac{0.45}{0.99} = \frac{45}{99} = \frac{5}{11}.$$
