id: p1-differentiation-curve-sketching
subject: "9709"
topic: "1.7"
title: Sketching curves with stationary points
summary: Sketch a curve in four steps (stationary points, axes, ends, join), then use the sketch to count the roots of an equation or find a range.
order: 8
minutes: 5
kind: core
objectives: ["1.7.4"]
prerequisites: [p1-differentiation-stationary-points]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.7 learning outcome "locate stationary
    points and determine their nature, and use information about stationary points in sketching
    graphs". All examples and questions are original; all arithmetic checked in Python. Not yet
    teacher-reviewed.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
    Rewritten on 2026-10-23 at the student's request in a one-question-type, one-method style; needs a fresh independent review.

blocks:
  - type: objective
    body: |-
      By the end you can answer *"sketch the curve, showing the stationary points"*, and the *"hence"* part that often follows: how many roots, or what range.

  - type: explain
    title: What they ask
    body: |-
      A typical question: *Sketch the curve $y = x^3 - 6x^2 + 9x$, showing the coordinates of the stationary points and where the curve meets the axes.*

      Giveaway words: **sketch**, **showing the coordinates**, **where the curve meets the axes**.

      A sketch is not an accurate graph. It needs the right **shape** and the key points **labelled**, nothing more.

  - type: explain
    title: The method
    body: |-
      The same four steps every time:

      1. Stationary points: find them and their nature (the five steps from the last lesson).
      2. Axes: put $x = 0$ to see where it meets the $y$-axis. Solve $y = 0$, by factorising, for the $x$-axis.
      3. **Ends: use the highest power of $x$ to see where the curve goes on the far left and the far right.**
      4. Join: mark the points, then draw one smooth curve that turns only at the stationary points. Label the coordinates.

  - type: explain
    title: Step 3 at a glance
    body: |-
      For large $x$ (positive or negative), the highest power wins:

      | Highest power | Far left | Far right |
      | --- | --- | --- |
      | $+x^2$ | up | up |
      | $-x^2$ | down | down |
      | $+x^3$ | down | up |
      | $-x^3$ | up | down |

      In symbols, "as $x \to \infty$, $y \to -\infty$" just means: on the far right, the curve heads down forever.

  - type: example
    title: "Example 1: the easiest case"
    problem: |-
      Sketch $y = x^2 - 2x - 3$, showing the stationary point and where the curve meets the axes.
    steps:
      - |-
        Stationary points: $\dfrac{dy}{dx} = 2x - 2 = 0$, so $x = 1$ and $y = 1 - 2 - 3 = -4$. Then $\dfrac{d^2y}{dx^2} = 2 > 0$, so $(1, -4)$ is a minimum.
      - |-
        Axes: $x = 0$ gives $y = -3$. For $y = 0$: $(x - 3)(x + 1) = 0$, so $x = 3$ or $x = -1$.
      - |-
        Ends: the highest power is $+x^2$, so the curve goes **up** at both ends.
      - |-
        Join: a ∪ shape through $(-1, 0)$, $(0, -3)$, down to its lowest point $(1, -4)$, then up through $(3, 0)$.
    answer: |-
      A ∪-shaped curve with minimum point $(1, -4)$. It meets the $y$-axis at $(0, -3)$ and the $x$-axis at $(-1, 0)$ and $(3, 0)$.

      Check: the minimum is halfway between the two roots, at $x = 1$, just as it should be for a quadratic.

  - type: check
    questions: [sketch-min, crossings-mcq]

  - type: example
    title: "Example 2: exam-style"
    problem: |-
      Sketch $y = x^3 - 6x^2 + 9x$, showing the coordinates of the stationary points and where the curve meets the axes.
    steps:
      - |-
        Stationary points: $\dfrac{dy}{dx} = 3x^2 - 12x + 9 = 3(x - 1)(x - 3) = 0$, so $x = 1$ or $x = 3$. That gives $(1, 4)$ and $(3, 0)$.
      - |-
        Stationary points, nature: $\dfrac{d^2y}{dx^2} = 6x - 12$. It's $-6$ at $x = 1$ (maximum) and $6$ at $x = 3$ (minimum).
      - |-
        Axes: $x = 0$ gives $y = 0$, so it goes through the origin. For $y = 0$: $x(x - 3)^2 = 0$, so $x = 0$ or $x = 3$.
      - |-
        Ends: the highest power is $+x^3$, so it starts bottom left and ends top right.
      - |-
        Join: up from the bottom left through $O$, over the maximum $(1, 4)$, down to **touch** the $x$-axis at the minimum $(3, 0)$, then up to the top right.
    answer: |-
      See the sketch below. The minimum $(3, 0)$ sits on the $x$-axis, so the curve touches the axis there instead of crossing it. That's the picture of the repeated root $(x - 3)^2$.

  - type: diagram
    diagram: p1-differentiation-curve-sketch
    alt: >-
      Sketch of y = x(x − 3)², a cubic. It comes up from the bottom left, passes through the origin,
      rises to a maximum at (1, 4), labelled with d²y/dx² = −6, falls to a minimum at (3, 0) where
      it touches the x-axis, labelled touches the x-axis: repeated root, and then rises steeply to
      the top right. A note near the bottom left says as x → −∞, y → −∞. Dashed guide lines mark
      x = 1 and y = 4.
    caption: |-
      Four steps gave everything: the two stationary points and their nature, where it meets the axes, and the ends.

  - type: check
    questions: [shape-mcq]

  - type: explain
    title: "The follow-up: how many roots?"
    body: |-
      The next part often says: *Hence find the values of $k$ for which $x^3 - 6x^2 + 9x = k$ has three distinct roots.*

      The method:

      1. Draw: the flat line $y = k$ across your sketch.
      2. Count: each place it meets the curve is one root.
      3. **Boundaries: the count changes at the $y$-values of the stationary points.**

  - type: diagram
    diagram: p1-differentiation-count-roots
    alt: >-
      The curve y = x(x − 3)², with its maximum (1, 4) and minimum (3, 0) labelled, crossed by
      dashed horizontal lines y = k. Dots mark every point where a line meets the curve. Labels on
      the right, under the heading "count the meeting points": k = 5: 1 root. k = 4: 2 roots
      (touches), as the line touches the curve at the maximum and crosses it once more on the
      right. k = 2, highlighted: 3 roots. k = 0, the x-axis itself: 2 roots (touches), crossing at
      the origin and touching at the minimum. k = −1: 1 root, just left of the origin.
    caption: |-
      Slide the line up and down. It meets the curve three times only while it's strictly between the minimum's height, 0, and the maximum's height, 4.

  - type: example
    title: "Example 3: the hence part"
    problem: |-
      Hence find the values of $k$ for which $x^3 - 6x^2 + 9x = k$ has three distinct roots.
    steps:
      - |-
        Draw: the line $y = k$ across the sketch from Example 2.
      - |-
        Count: it meets the curve three times when it cuts through both the hill and the valley.
      - |-
        Boundaries: the stationary $y$-values are $0$ and $4$. At exactly $k = 0$ or $k = 4$ the line only touches, giving 2 roots, so leave them out.
    answer: |-
      $0 < k < 4$.

  - type: check
    questions: [count-roots, roots-range]

  - type: deeper
    title: "Harder: the range on a restricted domain"
    body: |-
      *Find the range of $f(x) = x^3 - 3x$ for $-2 \leqslant x \leqslant 3$.*

      Here the curve stops at both ends. So check the **endpoints** as well as the stationary points.

      - Stationary points: $f'(x) = 3x^2 - 3 = 0$ at $x = \pm 1$. $\;f(-1) = 2$ (maximum) and $f(1) = -2$ (minimum).
      - Endpoints: $f(-2) = -8 + 6 = -2$ and $f(3) = 27 - 9 = 18$.
      - Compare: the greatest value is $18$, at an endpoint, not at the maximum. The least is $-2$.

      Range: $-2 \leqslant f(x) \leqslant 18$.

  - type: check
    questions: [restricted-range]

  - type: misconceptions
    items:
      - wrong: |-
          A sketch needs lots of plotted points.
        right: |-
          It needs the right shape and the labelled points from steps 1 and 2. Extra points just waste time.
      - wrong: |-
          Every cubic starts bottom left and ends top right.
        right: |-
          Only if the $x^3$ term is positive. With $-x^3$ it starts top left and ends bottom right.
      - wrong: |-
          A minimum at $(3, 0)$ means the curve crosses the $x$-axis at $x = 3$.
        right: |-
          It **touches** the axis there and turns back. That's what a repeated root looks like.
      - wrong: |-
          $k = 4$ gives three roots, so the answer is $0 \leqslant k \leqslant 4$.
        right: |-
          At a stationary value the line only touches, giving 2 distinct roots. Use strict inequalities: $0 < k < 4$.
      - wrong: |-
          The maximum point always gives the greatest value of $f(x)$.
        right: |-
          Only nearby. On a restricted domain an endpoint can be higher, so check the endpoints.

  - type: exam
    body: |-
      - "Sketch" means the right shape with labelled points. No scale or graph paper needed.
      - The marks are for the shape, the stationary points and where it meets the axes.
      - Round off maxima and minima (not pointed), and don't let the curve turn anywhere else.
      - In the *hence* part, the stationary $y$-values are the boundaries. Watch $<$ against $\leqslant$.

  - type: takeaways
    items:
      - |-
        The method: stationary points, axes, **ends** (from the highest power), then one smooth join.
      - |-
        A stationary point on the $x$-axis means the curve touches it: a repeated root.
      - |-
        Roots of $f(x) = k$: count where the line $y = k$ meets the curve. The stationary $y$-values are the boundaries.
      - |-
        On a restricted domain, compare the stationary values with the values at the endpoints.

questions:
  - id: crossings-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      A cubic curve $y = f(x)$ with a positive $x^3$ coefficient has a maximum point at $(1, 5)$ and a minimum point at $(4, -2)$, and no other stationary points. How many times does it cross the $x$-axis?
    explanation: |-
      - Ends: positive $x^3$, so it starts bottom left and ends top right.
      - Join: from the bottom left it rises through the axis to the maximum at height 5 (crossing 1). It falls through the axis to the minimum at $-2$ (crossing 2). Then it rises through the axis to the top right (crossing 3).
    options:
      - text: "3"
        correct: true
        why: |-
          The maximum is above the axis and the minimum below, and the ends go down on the left and up on the right. So there's a crossing on each of the three stretches.
      - text: "2"
        why: |-
          That's the number of stationary points, not crossings. Don't forget the stretch on the far left, which comes up from below.
      - text: "1"
        why: |-
          One crossing would need both stationary points on the same side of the axis. Here one is above and one is below.
      - text: "0"
        why: |-
          A cubic always crosses the $x$-axis at least once, because one end goes down and the other goes up.

  - id: sketch-min
    format: numeric
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      Find the coordinates of the minimum point of $y = x^3 - 3x^2$.
    fields:
      - label: "x ="
        answer: 2
      - label: "y ="
        answer: -4
    explanation: |-
      Stationary points (step 1), using the five steps:

      - $\dfrac{dy}{dx} = 3x^2 - 6x = 3x(x - 2) = 0$ at $x = 0$ and $x = 2$.
      - $\dfrac{d^2y}{dx^2} = 6x - 6$ is $-6$ at $x = 0$ (maximum at the origin) and $6$ at $x = 2$ (minimum).
      - $y = 8 - 12 = -4$, so the minimum is $(2, -4)$.

  - id: shape-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      Which description fits the curve $y = 3x^2 - x^3$?
    explanation: |-
      - Stationary points: $\dfrac{dy}{dx} = 6x - 3x^2 = 3x(2 - x)$, zero at $x = 0$ and $x = 2$. $\;\dfrac{d^2y}{dx^2} = 6 - 6x$ is $+6$ at $x = 0$ (minimum $(0, 0)$) and $-6$ at $x = 2$ (maximum $(2, 4)$).
      - Axes: $y = x^2(3 - x)$, so it touches the $x$-axis at 0 and crosses it at 3.
      - Ends: the highest power is $-x^3$, so on the far right the curve heads down: $y \to -\infty$ as $x \to \infty$.
    options:
      - text: Minimum at $(0, 0)$, maximum at $(2, 4)$, crosses the $x$-axis at $x = 3$, and $y \to -\infty$ as $x \to \infty$
        correct: true
        why: |-
          All four features check out, including the ends from the $-x^3$.
      - text: Maximum at $(0, 0)$, minimum at $(2, 4)$, crosses the $x$-axis at $x = 3$
        why: |-
          The natures are swapped. $\dfrac{d^2y}{dx^2} = 6 > 0$ at $x = 0$ means minimum.
      - text: Minimum at $(0, 0)$, maximum at $(2, 4)$, and $y \to +\infty$ as $x \to \infty$
        why: |-
          Check the ends: the highest power is $-x^3$, so on the far right the curve heads down, not up.
      - text: Minimum at $(3, 0)$, maximum at $(2, 4)$
        why: |-
          At $x = 3$, $\dfrac{dy}{dx} = 18 - 27 = -9 \neq 0$. So $(3, 0)$ is just where the curve crosses the axis, not a stationary point.

  - id: count-roots
    format: numeric
    difficulty: 1
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = x^3 - 3x^2$ has a maximum at $(0, 0)$ and a minimum at $(2, -4)$. How many real roots does the equation $x^3 - 3x^2 = -5$ have?
    fields:
      - label: "roots ="
        answer: 1
    explanation: |-
      - Draw: the line $y = -5$.
      - Count: $-5$ is below the minimum's height, $-4$, so the line passes under the valley. It meets the curve once, on the far left.
      - So there is **1** real root.

  - id: roots-range
    format: numeric
    difficulty: 3
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = x^3 - 3x^2$ has a maximum at $(0, 0)$ and a minimum at $(2, -4)$. The equation $x^3 - 3x^2 = k$ has three distinct real roots for $a < k < b$. Find $a$ and $b$.
    fields:
      - label: "a ="
        answer: -4
      - label: "b ="
        answer: 0
    explanation: |-
      - Draw and count: the line $y = k$ meets the curve three times when it lies strictly between the two stationary heights.
      - Boundaries: the stationary $y$-values are $-4$ and $0$, so $-4 < k < 0$.

      At $k = 0$ or $k = -4$ the line only touches at a stationary point, giving 2 distinct roots.

  - id: restricted-range
    format: numeric
    difficulty: 3
    objectives: ["1.7.4"]
    prompt: |-
      Find the range of $f(x) = x^3 - 12x$ for $0 \leqslant x \leqslant 3$, in the form $p \leqslant f(x) \leqslant q$.
    fields:
      - label: "p ="
        answer: -16
      - label: "q ="
        answer: 0
    explanation: |-
      - Stationary points: $f'(x) = 3x^2 - 12 = 0$ at $x = \pm 2$. Only $x = 2$ is in the domain, with $f(2) = 8 - 24 = -16$ (a minimum, since $f''(2) = 12 > 0$).
      - Endpoints: $f(0) = 0$ and $f(3) = 27 - 36 = -9$.
      - Compare: least value $-16$, greatest $0$, so $-16 \leqslant f(x) \leqslant 0$.
