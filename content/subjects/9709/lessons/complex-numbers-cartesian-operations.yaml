blocks:
  - type: objective
    body: |
      By the end you can add, subtract, multiply and divide complex numbers in Cartesian form
      $x + iy$, showing full working for multiplication and division.

  - type: explain
    title: Addition and subtraction — just collect like terms
    body: |
      $$(a + ib) + (c + id) = (a + c) + i(b + d)$$
      $$(a + ib) - (c + id) = (a - c) + i(b - d)$$
      Real with real, imaginary with imaginary. No surprises.

  - type: explain
    title: Multiplication — FOIL and use i² = −1
    body: |
      $$(a + ib)(c + id) = ac + iad + ibc + i^2bd = (ac - bd) + i(ad + bc)$$
      Do it step by step: multiply each term, then replace $i^2$ with $-1$.

  - type: example
    title: Multiply (3 + 2i)(1 − 4i)
    problem: "Find the product, showing full working."
    steps:
      - "$(3 + 2i)(1 - 4i) = 3(1) + 3(-4i) + 2i(1) + 2i(-4i)$"
      - "$= 3 - 12i + 2i - 8i^2$"
      - "$= 3 - 10i - 8(-1)$  (since $i^2 = -1$)"
      - "$= 3 - 10i + 8$"
      - "$= 11 - 10i$"
    answer: |
      $(3 + 2i)(1 - 4i) = 11 - 10i$

  - type: explain
    title: Division — multiply by the conjugate
    body: |
      To divide $\dfrac{a + ib}{c + id}$, multiply top and bottom by the **conjugate of the denominator**:
      $$\frac{a + ib}{c + id} = \frac{(a + ib)(c - id)}{(c + id)(c - id)} = \frac{(ac + bd) + i(bc - ad)}{c^2 + d^2}$$
      The denominator becomes real: $(c + id)(c - id) = c^2 + d^2$.

  - type: example
    title: Divide (3 + 4i) by (1 − 2i)
    problem: "Simplify, showing full working."
    steps:
      - "Multiply numerator and denominator by the conjugate of the denominator, $1 + 2i$:"
      - '$\frac{3 + 4i}{1 - 2i} \times \frac{1 + 2i}{1 + 2i} = \frac{(3 + 4i)(1 + 2i)}{(1 - 2i)(1 + 2i)}$'
      - "Numerator: $(3 + 4i)(1 + 2i) = 3 + 6i + 4i + 8i^2 = 3 + 10i - 8 = -5 + 10i$"
      - "Denominator: $(1 - 2i)(1 + 2i) = 1^2 + 2^2 = 1 + 4 = 5$"
      - 'Result: $\frac{-5 + 10i}{5} = -1 + 2i$'
    answer: |
      $\frac{3 + 4i}{1 - 2i} = -1 + 2i$

  - type: check
    title: Practice operations
    questions: [cn-add-sub, cn-multiply, cn-divide]

  - type: intuition
    title: Why the conjugate trick works
    body: |
      $(c + id)(c - id) = c^2 - i^2d^2 = c^2 + d^2$ — a **real number**.
      Multiplying by the conjugate is like multiplying by 1 in disguise: $\frac{c - id}{c - id} = 1$.
      It turns division into multiplication, and the denominator becomes a harmless real number.

  - type: deeper
    title: Connection to vectors
    body: |
      Addition of complex numbers is exactly vector addition of $(a, b)$ and $(c, d)$.
      Multiplication is different: it scales by $|z|$ and rotates by $\arg z$.
      You'll see this clearly in polar form (next lesson).

  - type: misconceptions
    items:
      - wrong: 'To divide, just divide real parts and imaginary parts separately: $\frac{a + ib}{c + id} = \frac{a}{c} + i\frac{b}{d}$.'
        right: "Division does NOT distribute like that. You must multiply by the conjugate to make the denominator real."
      - wrong: "In $(a + ib)(c + id)$, the real part is $ac$ and the imaginary part is $bd$."
        right: "Cross terms matter! Real part is $ac - bd$, imaginary part is $ad + bc$."
      - wrong: "The conjugate of the denominator is $c - id$? No, it's $-c + id$."
        right: "The conjugate of $c + id$ is $c - id$ (change the sign of the imaginary part only)."

  - type: exam
    body: |
      - **Show full working** for multiplication and division. The syllabus says "full details of the working should be shown."
      - For division, explicitly write the step: "multiply numerator and denominator by the conjugate of the denominator".
      - Keep $i^2 = -1$ visible in your working — it shows you know what you're doing.
      - Final answer must be in $x + iy$ form (or $x - iy$ if $y$ is negative).

  - type: takeaways
    items:
      - "Add/subtract: real with real, imaginary with imaginary."
      - "Multiply: FOIL, then replace $i^2$ with $-1$."
      - "Divide: multiply top and bottom by the conjugate of the denominator."
      - "Denominator becomes $c^2 + d^2$ (always real, always positive for non-zero $z$)."
      - "Show all steps — Cambridge expects full working for multiplication and division."

questions:
  - id: cn-add-sub
    format: text
    style: short
    difficulty: 1
    objectives: ["3.9.2"]
    prompt: |
      Simplify $(5 - 3i) + (2 + 7i) - (4 - i)$. Give your answer in the form $a + bi$.
    accept:
      - "3 + 5i"
      - "3+5i"
      - "3 + 5 i"
    model: "$3 + 5i$"
    explanation: |
      $(5 - 3i) + (2 + 7i) - (4 - i) = (5 + 2 - 4) + (-3 + 7 + 1)i = 3 + 5i$.

  - id: cn-multiply
    format: text
    style: short
    difficulty: 2
    objectives: ["3.9.2"]
    prompt: |
      Simplify $(2 - 3i)(4 + i)$. Give your answer in the form $a + bi$.
    accept:
      - "11 - 10i"
      - "11-10i"
      - "11 - 10 i"
    model: "$11 - 10i$"
    explanation: |
      $(2 - 3i)(4 + i) = 8 + 2i - 12i - 3i^2 = 8 - 10i + 3 = 11 - 10i$.

  - id: cn-divide
    format: text
    style: short
    difficulty: 2
    objectives: ["3.9.2"]
    prompt: |
      Simplify $\frac{1 + 2i}{3 - i}$. Give your answer in the form $a + bi$, using decimals.
    accept:
      - "0.1 + 0.7i"
      - "0.1+0.7i"
      - "1/10 + 7/10 i"
      - "0.1 + 0.7 i"
    model: '$0.1 + 0.7i$ (that is, $\frac{1}{10} + \frac{7}{10}i$)'
    explanation: |
      Multiply by conjugate: $\frac{1 + 2i}{3 - i} \times \frac{3 + i}{3 + i} = \frac{(1 + 2i)(3 + i)}{9 + 1} = \frac{3 + i + 6i + 2i^2}{10} = \frac{3 + 7i - 2}{10} = \frac{1 + 7i}{10} = 0.1 + 0.7i$.