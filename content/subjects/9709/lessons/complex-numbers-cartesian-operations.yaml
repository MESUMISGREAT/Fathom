  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 3.9 learning outcome 2 (addition, subtraction,
    multiplication and division in Cartesian form). Examples and questions are original; all
