id: complex-numbers-cartesian-operations
subject: "9709"
topic: "3.9"
title: Complex arithmetic — add, subtract, multiply, divide
summary: "Performing the four operations on complex numbers in Cartesian form x + iy, with full working shown."
order: 2
minutes: 5
kind: core
objectives: ["3.9.2"]
prerequisites: ["complex-numbers-introduction"]
