id: discrete-rv-probability-distributions
subject: "9709"
topic: "5.4"
title: Probability distributions for discrete random variables
summary: Build a probability distribution table for a discrete random variable, use the fact that the probabilities total 1 to find an unknown constant, and read events such as X >= 2 off the table.
order: 1
minutes: 8
kind: core
objectives: ["5.4.1"]
prerequisites: ["probability-sample-space", "probability-counting-permutations-combinations"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 5.4 Discrete random variables, outcome 5.4.1 "Draw up a
    probability distribution table for a given situation involving a discrete random
    variable X, and calculate E(X) and Var(X)." This lesson covers the distribution table;
    E(X) and Var(X) are in the two lessons that follow. All examples, questions and diagrams
    are original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can define a discrete random variable, write its **probability
      distribution table**, use the fact that the probabilities always total $1$ to find an
      unknown value, and read a probability such as $P(X \geq 2)$ from the table.

  - type: definition
    term: Discrete random variable
    body: |-
      A **random variable** is a variable whose value is the numerical outcome of a random
      experiment.

      A random variable is **discrete** when its possible values can be listed, one by one,
      with a gap between consecutive values — typically counting values such as
      $0, 1, 2, 3, \dots$.

      The **probability distribution** of a discrete random variable $X$ lists every possible
      value $x$ together with its probability $P(X = x)$.

  - type: intuition
    title: Turning an experiment into numbers
    body: |-
      Random variables are how we attach numbers to outcomes so we can calculate with them.

      Coin tosses are heads and tails, which is awkward. But "the number of heads in three
      tosses" is a number: $0$, $1$, $2$ or $3$. Now we can average it, measure its spread,
      and ask questions like $P(X \geq 2)$.

      A continuous quantity such as the exact height of a student is **not** discrete,
      because its value cannot be listed one by one. Heights also need a different theory,
      which comes later in the course.

  - type: diagram
    diagram: discrete-rv-bar-chart
    alt: A bar chart showing the probability distribution of a discrete random variable taking values zero, one, two and three with probabilities zero point one, zero point two, zero point three and zero point four. The bars rise steadily to the right and their heights total one.
    caption: |-
      The same distribution in picture form. The heights are probabilities, so they must
      total $1$; a bar chart makes it obvious when a distribution is complete and when
      something is missing.

  - type: explain
    title: The two rules every distribution obeys
    body: |-
      For a discrete random variable $X$ with possible values $x_1, x_2, \dots, x_n$:

      - Every probability is between $0$ and $1$: $0 \leq P(X = x_i) \leq 1$.
      - The probabilities over **all** possible values total exactly $1$:
        $\sum_{i} P(X = x_i) = 1$.

      The second rule is the workhorse. It is what lets you find an unknown constant in a
      distribution, and it is the check that you have not missed a value out.

  - type: example
    title: "Example 1: from an experiment to a table"
    problem: |-
      A fair coin is tossed $3$ times. Let $X$ be the number of heads. Write down the
      probability distribution of $X$.
    steps:
      - |-
        The possible values are $x = 0, 1, 2, 3$, since there can be no heads, one head, two
        heads or three heads. Nothing else is possible.
      - |-
        The sample space has $2^3 = 8$ equally likely sequences: HHH, HHT, HTH, HTT, THH,
        THT, TTH, TTT.
      - |-
        Count the sequences with each number of heads. No heads: TTT, so $1$ sequence. One
        head: HTT, THT, TTH, so $3$ sequences. Two heads: HHT, HTH, THH, so $3$ sequences.
        Three heads: HHH, so $1$ sequence.
      - |-
        Turn the counts into probabilities out of $8$, giving
        $\frac{1}{8}, \frac{3}{8}, \frac{3}{8}, \frac{1}{8}$.
      - |-
        Check the total: $\frac{1}{8} + \frac{3}{8} + \frac{3}{8} + \frac{1}{8}
        = \frac{8}{8} = 1$. The distribution is complete.
    answer: |-
      | $x$ | $0$ | $1$ | $2$ | $3$ |
      | --- | --- | --- | --- | --- |
      | $P(X = x)$ | $\frac{1}{8}$ | $\frac{3}{8}$ | $\frac{3}{8}$ | $\frac{1}{8}$ |

  - type: check
    title: Check 1 — building a table
    questions: [drv-three-tosses-two-heads, drv-valid-distribution]

  - type: example
    title: "Example 2: finding an unknown constant"
    problem: |-
      The discrete random variable $X$ takes the values $0, 1, 2, 3$ with
      $P(X = x) = kx$ for $x = 0, 1, 2, 3$. Find $k$, the full distribution, and
      $P(X \geq 2)$.
    steps:
      - |-
        Substitute each value: $P(X = 0) = 0$, $P(X = 1) = k$, $P(X = 2) = 2k$ and
        $P(X = 3) = 3k$.
      - |-
        The probabilities must total $1$, so
        $0 + k + 2k + 3k = 1$.
      - |-
        Collect the terms: $6k = 1$, so $k = \dfrac{1}{6}$.
      - |-
        The distribution is $P(X = 0) = 0$, $P(X = 1) = \frac{1}{6}$, $P(X = 2) = \frac{2}{6}
        = \frac{1}{3}$ and $P(X = 3) = \frac{3}{6} = \frac{1}{2}$.
      - |-
        For $P(X \geq 2)$ add the values $2$ and $3$, because $X$ can only take whole numbers:
        $\frac{1}{3} + \frac{1}{2} = \frac{5}{6}$.
    answer: |-
      $k = \dfrac{1}{6}$ and $P(X \geq 2) = \dfrac{5}{6} \approx 0.833$.

  - type: check
    title: Check 2 — unknown constants and events
    questions: [drv-find-k, drv-at-least-two]

  - type: misconceptions
    items:
      - wrong: |-
          "A probability in the table may be $0$ or even negative if the value is unlikely."
        right: |-
          Probabilities are never negative. They may be $0$ — as in $P(X = 0) = 0$ in
          Example 2, where the outcome is impossible — but not below it.
      - wrong: |-
          "The probabilities only need to add to $1$ if the variable has two possible values."
        right: |-
          They add to $1$ for every discrete random variable, because the listed values cover
          every possible outcome of the experiment.
      - wrong: |-
          "$P(X \geq 2)$ means $1 - P(X = 2)$."
        right: |-
          The complement of "$X \geq 2$" is "$X < 2$", that is $X = 0$ or $X = 1$. You must
          include or exclude every value below the threshold.
      - wrong: |-
          "The value $x$ has to start at $1$."
        right: |-
          The possible values depend on the experiment. Counting how many heads appear starts
          at $0$; counting how many rolls until a six appears starts at $1$.

  - type: exam
    body: |-
      Questions on this objective usually begin by describing an experiment and end with a
      request for a probability. They often carry a statement such as "show that $k = \dots$".

      - Present the distribution as a **table** with a row of values and a row of
        probabilities; it earns marks and makes later parts easier.
      - When two arrows appear as $X$ and $Y$, keep two separate tables and do not mix them.
      - For an event such as $X \geq 2$ or $1 < X \leq 3$, list the qualifying values
        explicitly before adding, and watch whether the inequality is strict.
      - Check the total is $1$ before moving on; an error there will spoil every later part.

  - type: takeaways
    items:
      - "A discrete random variable has values you can list; its distribution gives $P(X = x)$ for each."
      - "Every probability is between $0$ and $1$, and they all total exactly $1$."
      - "Use $\\sum P(X = x) = 1$ to find an unknown constant in a distribution."
      - "The complement of $X \\geq 2$ is $X < 2$, which here means $X = 0$ or $X = 1$."

  - type: check
    title: Check 3 — consolidation
    questions: [drv-complement-event]

questions:
  - id: drv-valid-distribution
    format: mcq
    difficulty: 1
    objectives: ["5.4.1"]
    prompt: |-
      $X$ takes the values $1, 2, 3$. Which set of probabilities could be the distribution of
      $X$?
    options:
      - text: |-
          $0.2$, $0.3$, $0.5$
        correct: true
        why: |-
          All three lie between $0$ and $1$ and they total $1$, so this is a valid
          distribution.
      - text: |-
          $0.4$, $0.4$, $0.4$
        why: |-
          These total $1.2$, and a total greater than $1$ is impossible.
      - text: |-
          $0.5$, $0.6$, $-0.1$
        why: |-
          A probability can never be negative.
      - text: |-
          $0.5$, $0.5$, $0.5$
        why: |-
          These total $1.5$; the probabilities must account for the whole sample space exactly
          once.
    explanation: |-
      A valid distribution needs every probability between $0$ and $1$ and a total of
      exactly $1$. Only $0.2 + 0.3 + 0.5 = 1$ satisfies both.

  - id: drv-three-tosses-two-heads
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      A fair coin is tossed $3$ times and $X$ is the number of heads. Find $P(X = 2)$.
    fields:
      - answer: 0.375
        tolerance:
          abs: 0.002
    explanation: |-
      There are $2^3 = 8$ equally likely sequences, and exactly two heads occur in HHT, HTH
      and THH. So $P(X = 2) = \frac{3}{8} = 0.375$.

  - id: drv-find-k
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      $X$ takes the values $0, 1, 2, 3$ with $P(X = x) = kx$. Find $k$.
    fields:
      - answer: 0.1667
        tolerance:
          abs: 0.001
    explanation: |-
      The probabilities are $0$, $k$, $2k$ and $3k$, so $0 + k + 2k + 3k = 6k = 1$. Hence
      $k = \frac{1}{6} \approx 0.167$.

  - id: drv-at-least-two
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      Using the distribution $P(X = 1) = \frac{1}{6}$, $P(X = 2) = \frac{2}{6}$ and
      $P(X = 3) = \frac{3}{6}$, find $P(X \geq 2)$.
    fields:
      - answer: 0.8333
        tolerance:
          abs: 0.002
    explanation: |-
      $X \geq 2$ means $X = 2$ or $X = 3$, so the probability is
      $\frac{2}{6} + \frac{3}{6} = \frac{5}{6} \approx 0.833$.

  - id: drv-complement-event
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      A discrete random variable satisfies $P(X = 0) = 0.25$ and $P(X = 1) = 0.4$. Find
      $P(X \geq 2)$.
    fields:
      - answer: 0.35
        tolerance:
          abs: 0.0005
    explanation: |-
      All the probabilities total $1$, so
      $P(X \geq 2) = 1 - 0.25 - 0.4 = 0.35$.
