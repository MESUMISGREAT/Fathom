id: p2-numerical-solution-approximations
subject: "9709"
topic: "2.6"
title: Approximations that home in
summary: What x₁, x₂, x₃ … mean, and what it looks like when a sequence of approximations settles on a root — or fails to.
order: 2
minutes: 6
kind: core
objectives: ["2.6.2"]
prerequisites: [p2-numerical-solution-sign-change]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 2.6 outcome "Understand the idea of, and use the notation
    for, a sequence of approximations that converges to a root of an equation". Covers the
    syllabus note that an iteration may fail to converge, without teaching a convergence
    condition. All values computed in Python; questions are original.

    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
    agent as the writer, not a human teacher): every algebraic step checked, every
    iteration table and answer key recomputed in Python, syllabus coverage confirmed
    against 9709 topic 2.6, and all three diagrams rendered and inspected in light
    and dark.
blocks:
  - type: objective
    body: |-
      By the end you can read the notation $x_1, x_2, x_3, \ldots, x_n$ for a sequence of approximations, say what it means for the sequence to **converge** to a root, and recognise an iteration that fails to converge.

  - type: explain
    title: What they ask
    body: |-
      An **iteration** is a recipe that turns one guess into a better guess. Cambridge writes it like this:

      $$x_{n+1} = \sqrt{x_n + 2}, \qquad x_1 = 1.$$

      Read it slowly, in words:

      - $x_1$ is your **first guess**, the starting value (here $1$).
      - $x_2$ is what you get by putting $x_1$ into the recipe.
      - $x_3$ comes from putting $x_2$ in, and so on.
      - $x_n$ is the $n$th approximation, and $x_{n+1}$ is the **next** one after it.

      The subscript is a counter, not a multiplication. $x_3$ is "the third approximation", never "$x$ times $3$".

      The question is usually: *what do these numbers do as you keep going?*

  - type: explain
    title: The method
    body: |-
      Build a table and do the arithmetic honestly, keeping 4 or 5 decimal places so you can see the movement.

      1. **Write down $x_1$**, the starting value you were given.
      2. **Substitute** to get the next value: replace every $x_n$ in the formula with the number you have.
      3. **Repeat**, feeding each answer into the next line.
      4. **Watch the pattern.** Are the values bunching together, or running away?

      On a calculator, type the starting value, press `=` once (so the calculator holds it as `Ans`), then enter the formula with `Ans` in place of $x_n$ and press `=` again and again. That is exactly what the subscripts mean.

  - type: diagram
    diagram: p2-numerical-solution-staircase
    alt: >-
      The graph of y = √(x + 2) together with the line y = x, drawn from x = 0.6 to 2.3.
      A staircase path starts on the x-axis at x = 1, goes vertically up to the curve, then
      horizontally to the line y = x, then vertically up to the curve again, and so on. The
      steps get shorter and shorter, closing in on the point (2, 2) where the curve meets the
      line, which is marked and labelled x = 2, the root.
    caption: |-
      Each vertical hop is "apply the formula"; each horizontal hop carries the answer across to become the next input. The steps shrink towards the point where the curve meets $y = x$.

  - type: example
    title: "Example 1: watching a sequence settle"
    problem: |-
      The iteration $x_{n+1} = \sqrt{x_n + 2}$ starts with $x_1 = 1$. Find $x_2$, $x_3$ and $x_4$, and describe what the numbers are doing.
    steps:
      - |-
        $x_1 = 1$ (given).
      - |-
        $x_2 = \sqrt{1 + 2} = \sqrt{3} = 1.73205$.
      - |-
        $x_3 = \sqrt{1.73205 + 2} = \sqrt{3.73205} = 1.93185$.
      - |-
        $x_4 = \sqrt{1.93185 + 2} = \sqrt{3.93185} = 1.98289$.
      - |-
        Keep going: $x_5 = 1.99572$, $x_6 = 1.99893$, $x_7 = 1.99973$.
      - |-
        The values climb, but by smaller and smaller amounts. They are closing in on $2$, which is a root of $x = \sqrt{x + 2}$ (square both sides: $x^2 = x + 2$, so $(x - 2)(x + 1) = 0$, and $x = 2$ here).
    answer: |-
      $x_2 = 1.73205$, $x_3 = 1.93185$, $x_4 = 1.98289$. The values approach $2$, so the sequence **converges** to the root $x = 2$.

  - type: definition
    term: Convergence
    body: |-
      A sequence of approximations $x_1, x_2, x_3, \ldots$ **converges** to a root $\alpha$ if the values get closer and closer to $\alpha$ as $n$ increases. We write

      $$x_n \to \alpha \quad \text{as } n \to \infty.$$

      In practice: if the values settle down and stop changing in the decimal places you care about, you have found the root to that accuracy.

  - type: check
    questions: [approx-next, approx-limit]

  - type: example
    title: "Example 2: an iteration that refuses"
    problem: |-
      The iteration $x_{n+1} = 2x_n + 1$ starts with $x_1 = 1$. Find the first four values. Does it converge?
    steps:
      - |-
        $x_1 = 1$.
      - |-
        $x_2 = 2(1) + 1 = 3$.
      - |-
        $x_3 = 2(3) + 1 = 7$.
      - |-
        $x_4 = 2(7) + 1 = 15$, and $x_5 = 31$.
      - |-
        Each value doubles (and a bit) instead of settling. The numbers run away to infinity, so the sequence **diverges**.
    answer: |-
      $x_1 = 1$, $x_2 = 3$, $x_3 = 7$, $x_4 = 15$. The values grow without limit, so the iteration does **not** converge.

  - type: check
    questions: [approx-diverge, approx-notation]

  - type: misconceptions
    items:
      - wrong: |-
          $x_3$ means $3x$.
        right: |-
          The subscript labels which approximation it is: $x_3$ is the third one. Nothing is being multiplied.
      - wrong: |-
          If two values agree to 2 decimal places, the root is exactly that number.
        right: |-
          You have found the root **to 2 decimal places**. The true root may carry on: $1.99973$ agrees with $2.00$ but is not $2$.
      - wrong: |-
          Every iteration eventually finds the root.
        right: |-
          Some wander off ($x_{n+1} = 2x_n + 1$), and some bounce between values for ever. Cambridge expects you to notice and say "this iteration does not converge".
      - wrong: |-
          Starting with a worse guess means the iteration cannot work.
        right: |-
          A different start usually just means a few extra steps. It can, however, tip a borderline iteration into converging to a **different** root, or into failing.

  - type: exam
    body: |-
      - Show the table with every substitution: $x_1$, $x_2$, $x_3$, … — examiners look for the arithmetic, not just the final number.
      - Keep at least 4 decimal places while calculating; round only in your final answer.
      - Use the words **converge** / **does not converge**, and give the value it converges to.
      - If a question says "describe the behaviour of the sequence", say both what happens (values increase, decrease, oscillate) and where it ends up.

  - type: check
    questions: [approx-root-claim, approx-table]

  - type: takeaways
    items:
      - |-
        $x_1, x_2, x_3, \ldots$ are successive approximations; the subscript is a label, not a multiplier.
      - |-
        The sequence **converges** to a root when the values close in on it ($x_n \to \alpha$).
      - |-
        An iteration can converge, diverge or oscillate. "It fails to converge" is a valid, examinable answer.
      - |-
        More decimal places kept while working means a more trustworthy final answer.

questions:
  - id: approx-next
    format: numeric
    difficulty: 1
    objectives: ["2.6.2"]
    prompt: |-
      The iteration $x_{n+1} = \sqrt{x_n + 2}$ has $x_1 = 1$. Find $x_2$, correct to 3 decimal places.
    fields:
      - label: "x₂ ="
        answer: 1.732
        tolerance: { rel: 0.005 }
        sigFigs: 4
    explanation: |-
      $x_2 = \sqrt{1 + 2} = \sqrt{3} = 1.73205\ldots$, so $x_2 = 1.732$ to 3 d.p.

  - id: approx-limit
    format: numeric
    difficulty: 2
    objectives: ["2.6.2"]
    prompt: |-
      The sequence from $x_{n+1} = \sqrt{x_n + 2}$ converges to a root of $x = \sqrt{x + 2}$. Square both sides and solve to find that root.
    fields:
      - label: "x ="
        answer: 2
    explanation: |-
      $x = \sqrt{x + 2}$ gives $x^2 = x + 2$, so $x^2 - x - 2 = 0$ and $(x - 2)(x + 1) = 0$. The square root is never negative, so $x = 2$ is the root the sequence approaches.

  - id: approx-diverge
    format: mcq
    difficulty: 1
    objectives: ["2.6.2"]
    prompt: |-
      The iteration $x_{n+1} = 2x_n + 1$ starts at $x_1 = 1$, giving $1, 3, 7, 15, \ldots$ What is happening?
    explanation: |-
      Each value is more than double the one before, so the numbers grow without limit. The sequence does not approach any fixed number, so it diverges (does not converge).
    options:
      - text: "The sequence diverges: the values grow without limit."
        correct: true
        why: |-
          The values keep doubling and never settle, so there is no root being approached.
      - text: The sequence converges to $1$.
        why: |-
          It starts at $1$ but immediately leaves it ($x_2 = 3$). A limit must be approached, not just visited once.
      - text: The sequence converges to $0$.
        why: |-
          The values are heading upwards, away from $0$, not towards it.
      - text: The sequence oscillates between two values.
        why: |-
          Oscillation means bouncing back and forth. Here every term is bigger than the last.

  - id: approx-notation
    format: cloze
    difficulty: 1
    objectives: ["2.6.2"]
    prompt: |-
      In the iteration $x_{n+1} = \sqrt{x_n + 2}$, the symbol $x_1$ stands for the {{1}} approximation, and $x_{n+1}$ means the approximation {{2}} $x_n$.
    blanks:
      - accept: [first, 1st, initial, starting]
      - accept: [after, following, next, coming after, that comes after]
    explanation: |-
      $x_1$ is the starting (first) value. The subscript $n+1$ labels the term after the $n$th one, so $x_{n+1}$ is the next approximation.

  - id: approx-root-claim
    format: text
    difficulty: 2
    objectives: ["2.6.2"]
    prompt: |-
      A student says: "I stopped when $x_8 = 1.99973$, so the root is exactly $2$." What is wrong with the reasoning, and what should they say instead?
    accept:
      - the values only get close to 2, they never reach it, so the root is 2 to the accuracy used, not exactly 2
      - an iteration gives approximations, so they have found the root to 3 decimal places (2.000) but not exactly
      - 1.99973 is close to 2 but not equal to 2, so the root is approximately 2, or 2 to the required accuracy
      - they have only shown the root is 2 to some accuracy, not exactly 2, because the iteration never reaches the limit
      - the sequence converges to 2, but every term is only an approximation, so the root is 2 to the accuracy they kept
    model: |-
      Stopping at $1.99973$ only shows the root is **close** to $2$: the sequence converges to $2$ but never actually equals it. They should say the root is $2.000$ to $3$ decimal places (or to whatever accuracy the question asked for), not that the root is exactly $2$.
    explanation: |-
      Approximations approach the root without landing on it, so the honest statement is "the root is $2$ to $3$ decimal places". The phrase "to the required accuracy" is what examiners want.

  - id: approx-table
    format: numeric
    difficulty: 2
    objectives: ["2.6.2"]
    prompt: |-
      For $x_{n+1} = \sqrt{x_n + 2}$ with $x_1 = 1$, find $x_4$ correct to 4 decimal places.
    fields:
      - label: "x₄ ="
        answer: 1.9829
        tolerance: { rel: 0.005 }
        sigFigs: 5
    explanation: |-
      $x_2 = 1.73205$, $x_3 = 1.93185$, so $x_4 = \sqrt{3.93185} = 1.98289\ldots = 1.9829$ to 4 d.p.
