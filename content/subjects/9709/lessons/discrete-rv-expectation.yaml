id: discrete-rv-expectation
subject: "9709"
topic: "5.4"
title: Expectation of a discrete random variable
summary: Calculate E(X) for a discrete random variable by weighting each value by its probability, and interpret it as the long-run average, including in a game with a payout.
order: 2
minutes: 7
kind: core
objectives: ["5.4.1"]
prerequisites: ["discrete-rv-probability-distributions"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 5.4 Discrete random variables, outcome 5.4.1, covering
    calculation of E(X). All examples, questions and diagrams are original; the game and
    die situations are invented for teaching and are not taken from any past paper.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can calculate $E(X)$ from a probability distribution table, explain what
      the number means, and use it to decide whether a game is fair.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\mu$ | the mean |

  - type: explain
    title: A weighted average
    body: |-
      The **expectation** $E(X)$ is the average value of $X$ in the long run. It is also
      called the **mean** of $X$, written $\mu$.

      You already know how to average numbers. But in a distribution, $0.1$ is not as common
      as $0.4$, so the values cannot count equally. Instead, each value $x$ is weighted by how
      often it occurs:

      $$E(X) = \sum x\,P(X = x)$$

      In words: multiply each value by its probability, then add.

      Notice that $E(X)$ need not be a possible value of $X$. A single die has expected score
      $3.5$, though no roll ever shows $3.5$.

  - type: intuition
    title: Why weighting by probability is fair
    body: |-
      Imagine rolling a die $6000$ times. A $6$ turns up about $1000$ times, not $6000$, so
      counting it six times in an average would be absurd.

      By weighting each score by $\frac{1}{6}$, you get exactly the balance a long run of
      rolls produces: every score contributes in proportion to how often it appears.

      So $E(X)$ is where the average would settle if you repeated the experiment endlessly.
      For a single trial it is a prediction of the centre, not of the outcome.

  - type: example
    title: "Example 1: expectation from a table"
    problem: |-
      The discrete random variable $X$ has the distribution below. Find $E(X)$.

      | $x$ | $0$ | $1$ | $2$ | $3$ |
      | --- | --- | --- | --- | --- |
      | $P(X = x)$ | $0.1$ | $0.2$ | $0.3$ | $0.4$ |
    steps:
      - |-
        Multiply each value by its probability:
        $0 \times 0.1 = 0$, $1 \times 0.2 = 0.2$, $2 \times 0.3 = 0.6$ and
        $3 \times 0.4 = 1.2$.
      - |-
        Add the products: $0 + 0.2 + 0.6 + 1.2 = 2.0$.
      - |-
        Sanity check: the most likely value is $3$, but the smaller values pull the average
        down, so an answer of $2$ is plausible. It lies between the smallest and largest
        values, as every expectation must.
    answer: |-
      $E(X) = 2$.

  - type: check
    title: Check 1 — weighting values
    questions: [drv-e-table, drv-die-expectation]

  - type: example
    title: "Example 2: is the game fair?"
    problem: |-
      A game costs nothing to play. A fair die is rolled: if it shows a $6$ you win $£5$, and
      otherwise you lose $£1$. Find the expected gain per game and say whether the game is
      fair.
    steps:
      - |-
        Let $X$ be your gain in pounds. The possible values are $+5$ and $-1$, so it is a
        discrete random variable. Use a sign convention: wins positive, losses negative.
      - |-
        The probabilities come from the die: $P(X = 5) = \dfrac{1}{6}$ and
        $P(X = -1) = \dfrac{5}{6}$.
      - |-
        Apply the formula:
        $E(X) = 5 \times \dfrac{1}{6} + (-1) \times \dfrac{5}{6} = \dfrac{5}{6}
        - \dfrac{5}{6} = 0$.
      - |-
        An expectation of $0$ means that over many games your gains and losses cancel. That is
        the definition of a fair game.
    answer: |-
      $E(X) = 0$, so the game is fair.

  - type: check
    title: Check 2 — games and payouts
    questions: [drv-fair-game]

  - type: misconceptions
    items:
      - wrong: |-
          "$E(X)$ is the value of $X$ most likely to occur."
        right: |-
          The most likely value is the **mode**. $E(X)$ is the long-run average; for a die it
          is $3.5$, which can never occur.
      - wrong: |-
          "$E(X)$ must be one of the values in the table."
        right: |-
          Expectation is an average, and averages of whole numbers can be fractional. It must
          lie between the smallest and largest values, but not necessarily equal one of them.
      - wrong: |-
          "A fair game is one where you win as often as you lose."
        right: |-
          Fairness is about the **expected gain** being $0$. You can win rarely but by a large
          amount, and the game can still be fair.

  - type: exam
    body: |-
      Expectation questions are usually straightforward marks once the table exists, so the
      risk is arithmetic rather than method.

      - Write the products out in a row before adding: $x \times P(X = x)$ for every value.
        This shows the method and protects against slips.
      - Keep a clear sign convention for gains and losses, and state it. Mixing the two up is
        the most common error in game questions.
      - Check your answer lies between the smallest and largest possible values.
      - If a question says "hence" or "comment", it wants the interpretation: for a game, say
        whether $E(X)$ is positive, negative or zero and what that means for the player.

  - type: takeaways
    items:
      - "$E(X) = \\sum x\\,P(X = x)$: multiply each value by its probability, then add."
      - "$E(X)$ is the long-run average, not the most likely value."
      - "$E(X)$ can be a value that $X$ never takes, such as $3.5$ for a die."
      - "$E(X) = 0$ for a fair game; a positive expectation favours the player."

  - type: check
    title: Check 3 — consolidation
    questions: [drv-e-small-table, drv-e-interpretation]

questions:
  - id: drv-e-table
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      $X$ has the distribution $P(X = 0) = 0.1$, $P(X = 1) = 0.2$, $P(X = 2) = 0.3$ and
      $P(X = 3) = 0.4$. Find $E(X)$.
    fields:
      - answer: 2
        tolerance:
          abs: 0.005
    explanation: |-
      $E(X) = 0(0.1) + 1(0.2) + 2(0.3) + 3(0.4) = 0 + 0.2 + 0.6 + 1.2 = 2$.

  - id: drv-die-expectation
    format: numeric
    difficulty: 1
    objectives: ["5.4.1"]
    prompt: |-
      A fair six-sided die is rolled and $X$ is the score. Find $E(X)$.
    fields:
      - answer: 3.5
        tolerance:
          abs: 0.005
    explanation: |-
      Each score has probability $\frac{1}{6}$, so
      $E(X) = \frac{1}{6}(1 + 2 + 3 + 4 + 5 + 6) = \frac{21}{6} = 3.5$. The expectation need
      not be a possible score.

  - id: drv-fair-game
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      A fair die is rolled. You win $£5$ if it shows a $6$ and lose $£1$ otherwise. Find the
      expected gain per game, in pounds.
    fields:
      - answer: 0
        tolerance:
          abs: 0.005
    explanation: |-
      $E(X) = 5 \times \frac{1}{6} - 1 \times \frac{5}{6} = \frac{5}{6} - \frac{5}{6} = 0$.
      A zero expectation means the game is fair.

  - id: drv-e-small-table
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      $X$ takes the values $1, 2, 3$ with probabilities $0.2$, $0.5$ and $0.3$ respectively.
      Find $E(X)$.
    fields:
      - answer: 2.1
        tolerance:
          abs: 0.005
    explanation: |-
      $E(X) = 1(0.2) + 2(0.5) + 3(0.3) = 0.2 + 1.0 + 0.9 = 2.1$.

  - id: drv-e-interpretation
    format: mcq
    difficulty: 1
    objectives: ["5.4.1"]
    prompt: |-
      A discrete random variable has $E(X) = 4.2$. What does this tell you?
    options:
      - text: |-
          Over many repetitions the average value of $X$ tends towards $4.2$.
        correct: true
        why: |-
          Expectation is the long-run mean, so repeated trials average out to about $4.2$.
      - text: |-
          The most common value of $X$ is $4.2$.
        why: |-
          The most likely value is the mode, which may be quite different from the mean.
      - text: |-
          Every outcome of the experiment gives $X = 4.2$.
        why: |-
          Expectation predicts the centre of the distribution, not the result of one trial.
      - text: |-
          $X$ cannot take a value below $4.2$.
        why: |-
          Values on either side of the mean are normal; the mean is a balance point, not a
          lower bound.
    explanation: |-
      $E(X)$ is the average value in the long run. It is a centre for the distribution, so it
      does not fix individual outcomes and is not necessarily the most likely value.
