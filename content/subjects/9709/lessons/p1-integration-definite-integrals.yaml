id: p1-integration-definite-integrals
subject: "9709"
topic: "1.8"
title: Definite integrals
summary: Integrate, put it in square brackets, then work out top limit in minus bottom limit in. No + c needed.
order: 4
minutes: 5
kind: core
objectives: ["1.8.3"]
prerequisites: [p1-integration-brackets]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.8 learning outcome "evaluate definite
    integrals" (ordinary limits; the improper cases in the syllabus guidance are in
    p1-integration-improper-integrals). All examples and questions are original; all arithmetic
    checked in Python. Written in the one-question-type, one-method style. Not yet independently
    reviewed; not reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can **evaluate a definite integral**, like $\displaystyle\int_1^3 (3x^2 - 2)\,dx$, and get a number.

  - type: explain
    title: What they ask
    body: |-
      *Evaluate $\displaystyle\int_1^3 (3x^2 - 2)\,dx$*, or *find the exact value of …*.

      - The numbers are the **limits**: 3 is the **upper limit** (top) and 1 the **lower limit** (bottom).
      - The answer is a number, not a function of $x$.

  - type: explain
    title: The method
    body: |-
      1. Integrate as usual, but skip the $+\,c$.
      2. Write the result in square brackets with the limits: $\Big[\;\ldots\;\Big]_1^3$.
      3. **Put the top limit in, then subtract the bottom limit put in. Keep each in its own bracket**, so the minus sign hits all of the second one.
      4. Simplify. If they say *exact*, keep fractions and roots.

      In symbols: if $F$ integrates to give $f$, then $\displaystyle\int_a^b f(x)\,dx = \Big[F(x)\Big]_a^b = F(b) - F(a)$.

  - type: intuition
    title: Why no + c?
    body: |-
      It cancels: $\big(F(b) + c\big) - \big(F(a) + c\big) = F(b) - F(a)$.

      So leave it out of definite integrals. It's still needed in every *indefinite* one (no limits).

  - type: example
    title: "The easiest one: check it with a triangle"
    problem: |-
      Evaluate $\displaystyle\int_0^2 2x\,dx$.
    steps:
      - |-
        **Integrate:** $2x \to x^2$.
      - |-
        **Square brackets:** $\Big[x^2\Big]_0^2$.
      - |-
        **Top in, minus bottom in:** $\big(2^2\big) - \big(0^2\big) = 4 - 0$.
    answer: |-
      $4$

  - type: diagram
    diagram: p1-integration-definite-triangle
    alt: >-
      Graph of the line y = 2x on equal-scale axes, with the triangle under it from x = 0 to x = 2
      shaded: its corners are the origin, (2, 0) and (2, 4). Beside it, the triangle's area is half
      times 2 times 4, which is 4. Below that, the integral from 0 to 2 of 2x dx equals x² in square
      brackets from 0 to 2, which is 4 minus 0, which is 4, with a tick.
    caption: |-
      The integral matches the triangle's area. That's no accident: areas get their own lesson soon.

  - type: example
    title: "Watch the bottom limit"
    problem: |-
      Evaluate $\displaystyle\int_1^3 (3x^2 - 2)\,dx$.
    steps:
      - |-
        **Integrate:** $\Big[x^3 - 2x\Big]_1^3$.
      - |-
        **Top in:** $\big(27 - 6\big) = 21$.
      - |-
        **Bottom in:** $\big(1 - 2\big) = -1$.
      - |-
        **Subtract:** $21 - (-1) = 22$.
    answer: |-
      $22$

      The bottom bracket was negative, so subtracting it **added** 1. That's why each limit gets its own bracket.

  - type: check
    questions: [definite-poly, definite-mcq]

  - type: example
    title: "Exam-style: a root and a fraction"
    problem: |-
      Evaluate $\displaystyle\int_1^4 \left(3\sqrt{x} - \dfrac{4}{x^2}\right)dx$.
    steps:
      - |-
        **Powers:** $3x^{\frac12} - 4x^{-2}$.
      - |-
        **Integrate:** $\dfrac{3x^{\frac32}}{\frac32} - \dfrac{4x^{-1}}{-1} = 2x^{\frac32} + \dfrac{4}{x}$.
      - |-
        **Square brackets:** $\Big[2x^{\frac32} + \dfrac{4}{x}\Big]_1^4$.
      - |-
        **Top in:** $4^{\frac32} = (\sqrt4)^3 = 8$, so $\big(2 \times 8 + 1\big) = 17$.
      - |-
        **Bottom in, then subtract:** $\big(2 + 4\big) = 6$, so $17 - 6 = 11$.
    answer: |-
      $11$

  - type: check
    questions: [definite-bracket, spot-definite, definite-unknown]

  - type: misconceptions
    items:
      - wrong: |-
          $\Big[x^4 - 3x\Big]_1^2 = (16 - 6) - 1 - 3 = 6$
        right: |-
          The bottom limit needs its own bracket: $(16 - 6) - (1 - 3) = 10 + 2 = 12$.
      - wrong: |-
          $\Big[F(x)\Big]_a^b = F(a) - F(b)$
        right: |-
          It's **top minus bottom**: $F(b) - F(a)$. The other way round flips the sign.
      - wrong: |-
          Put the limits into the original $f(x)$ and subtract.
        right: |-
          Integrate first. The limits go into the **integrated** expression in the square brackets.

  - type: exam
    body: |-
      - Write the square-bracket line, then both substitutions. Each one is worth a mark.
      - "Exact value" means fractions, roots or $\pi$, not a rounded decimal.
      - Your calculator can evaluate definite integrals: use it to **check**, but always show the working.

  - type: takeaways
    items:
      - |-
        Integrate (no $+\,c$), square brackets, then top limit in minus bottom limit in.
      - |-
        Give each substitution its own bracket: $\big(\ldots\big) - \big(\ldots\big)$.
      - |-
        A definite integral is a number.

questions:
  - id: definite-poly
    format: numeric
    difficulty: 1
    objectives: ["1.8.3"]
    prompt: |-
      Evaluate $\displaystyle\int_1^2 (6x^2 + 1)\,dx$.
    fields:
      - answer: 15
    explanation: |-
      $\Big[2x^3 + x\Big]_1^2 = (16 + 2) - (2 + 1) = 18 - 3 = 15$.

  - id: definite-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.8.3"]
    prompt: |-
      What is $\displaystyle\int_1^2 (4x^3 - 3)\,dx$?
    explanation: |-
      $\Big[x^4 - 3x\Big]_1^2 = (16 - 6) - (1 - 3) = 10 - (-2) = 12$.
    options:
      - text: $12$
        correct: true
        why: |-
          Top gives $10$, bottom gives $-2$, and $10 - (-2) = 12$.
      - text: $6$
        why: |-
          That's $10 - 1 - 3$: the bottom limit wasn't kept in a bracket, so the $-3$ didn't flip.
      - text: $10$
        why: |-
          That's only the top limit. You still subtract the bottom one.
      - text: $-12$
        why: |-
          Bottom minus top. It's always top minus bottom.

  - id: definite-bracket
    format: numeric
    difficulty: 2
    objectives: ["1.8.3"]
    prompt: |-
      Evaluate $\displaystyle\int_0^4 \sqrt{2x + 1}\,dx$. Give the exact value (you can type a fraction like 7/2) or 3 significant figures.
    fields:
      - answer: 8.666666666666666
        tolerance: { rel: 0.005 }
    explanation: |-
      Integrate $(2x + 1)^{\frac12}$: power up to $\dfrac32$, divide by $\dfrac32$ and by 2, giving $\dfrac13(2x + 1)^{\frac32}$.

      $\Big[\dfrac13(2x + 1)^{\frac32}\Big]_0^4 = \dfrac13 \times 9^{\frac32} - \dfrac13 \times 1^{\frac32} = 9 - \dfrac13 = \dfrac{26}{3} \approx 8.67$.

  - id: spot-definite
    format: spot-error
    difficulty: 2
    objectives: ["1.8.3"]
    prompt: |-
      A student evaluates $\displaystyle\int_{-1}^{2} (3x^2 + 4x)\,dx$. Which line has the first error?
    lines:
      - |-
        $= \Big[x^3 + 2x^2\Big]_{-1}^{2}$
      - |-
        $= \big(2^3 + 2(2)^2\big) - \big((-1)^3 + 2(-1)^2\big)$
      - |-
        $= 16 - (-1 - 2)$
      - |-
        $= 19$
    errorLine: 3
    fix: |-
      $2(-1)^2 = +2$, so the bottom bracket is $(-1 + 2) = 1$. The answer is $16 - 1 = 15$.
    explanation: |-
      Lines 1 and 2 are right. In line 3, $(-1)^2 = 1$ is positive, so $2(-1)^2 = 2$, not $-2$. Negative limits need extra care with powers.

  - id: definite-unknown
    format: numeric
    difficulty: 3
    objectives: ["1.8.3"]
    prompt: |-
      Given that $\displaystyle\int_0^k (2x + 3)\,dx = 10$ and $k > 0$, find $k$.
    fields:
      - label: "k ="
        answer: 2
    explanation: |-
      $\Big[x^2 + 3x\Big]_0^k = k^2 + 3k - 0$.

      So $k^2 + 3k = 10$, which gives $k^2 + 3k - 10 = 0$, so $(k + 5)(k - 2) = 0$.

      $k > 0$, so $k = 2$.
