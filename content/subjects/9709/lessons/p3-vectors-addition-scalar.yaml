id: p3-vectors-addition-scalar
subject: "9709"
topic: "3.7"
title: Adding vectors and multiplying by scalars
summary: "Add and subtract vectors, multiply them by numbers, and see what each does to the arrows: triangle and parallelogram laws, parallel vectors and midpoints."
order: 2
minutes: 8
kind: core
objectives: ["3.7.2"]
prerequisites: [p3-vectors-notation]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.7 outcome "Carry out addition and subtraction of vectors
    and multiplication of a vector by a scalar, and interpret these operations in geometrical
    terms. For example, 'OABC is a parallelogram' is equivalent to the vector OB being equal
    to the vector OA plus the vector OC. The general form of the ratio theorem is not included,
    but candidates are expected to understand that the midpoint of AB has position vector
    1/2(OA + OB), where OA and OB are vectors." All examples, questions and diagrams are original.
    Revised on 2026-10-31 for beginners (terms defined, steps explained, maths typeset). Independently re-checked in separate AI reviews on 2026-10-31 (every worked step and answer key recomputed); their findings were applied. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can add and subtract vectors, multiply them by numbers, and say what each of these does to the arrows in a diagram.

  - type: explain
    title: Adding moves
    body: |-
      Think of a vector as a move. Walk 2 east and 1 north, then 3 east and 4 north. Altogether you've gone $2 + 3 = 5$ east and $1 + 4 = 5$ north. That's all vector addition is: **add the matching components**.

      $$\begin{pmatrix} 2 \\ 1 \end{pmatrix} + \begin{pmatrix} 3 \\ 4 \end{pmatrix} = \begin{pmatrix} 2 + 3 \\ 1 + 4 \end{pmatrix} = \begin{pmatrix} 5 \\ 5 \end{pmatrix}$$

      The same works in 3D (three rows) and in $\mathbf{i}, \mathbf{j}, \mathbf{k}$ form, where you collect like terms: $(2\mathbf{i} + \mathbf{j}) + (3\mathbf{i} + 4\mathbf{j}) = 5\mathbf{i} + 5\mathbf{j}$.

      **Subtracting** works the same way, row by row: $\begin{pmatrix} 5 \\ 5 \end{pmatrix} - \begin{pmatrix} 3 \\ 4 \end{pmatrix} = \begin{pmatrix} 2 \\ 1 \end{pmatrix}$.

      **Multiplying by a number** $k$ (a **scalar**) multiplies every component: $3\begin{pmatrix} 2 \\ 1 \end{pmatrix} = \begin{pmatrix} 6 \\ 3 \end{pmatrix}$, "the same move, three times over".

  - type: example
    title: "Example 1: working with components"
    problem: |-
      $\mathbf{a} = \begin{pmatrix} 2 \\ -3 \\ 1 \end{pmatrix}$ and $\mathbf{b} = \begin{pmatrix} -1 \\ 4 \\ 2 \end{pmatrix}$. Find (a) $\mathbf{a} + \mathbf{b}$, (b) $2\mathbf{a} - \mathbf{b}$, (c) $-\tfrac12\mathbf{b}$.
    steps:
      - |-
        (a) Add row by row: $\begin{pmatrix} 2 + (-1) \\ -3 + 4 \\ 1 + 2 \end{pmatrix} = \begin{pmatrix} 1 \\ 1 \\ 3 \end{pmatrix}$.
      - |-
        (b) Do the multiplying first: $2\mathbf{a} = \begin{pmatrix} 4 \\ -6 \\ 2 \end{pmatrix}$. Then subtract $\mathbf{b}$ row by row: $\begin{pmatrix} 4 - (-1) \\ -6 - 4 \\ 2 - 2 \end{pmatrix} = \begin{pmatrix} 5 \\ -10 \\ 0 \end{pmatrix}$.
      - |-
        (c) Multiply every component by $-\tfrac12$: $\begin{pmatrix} 0.5 \\ -2 \\ -1 \end{pmatrix}$.
    answer: |-
      (a) $\begin{pmatrix} 1 \\ 1 \\ 3 \end{pmatrix}$, (b) $\begin{pmatrix} 5 \\ -10 \\ 0 \end{pmatrix}$, (c) $\begin{pmatrix} 0.5 \\ -2 \\ -1 \end{pmatrix}$. Watch the signs: subtracting $-1$ is adding 1.

  - type: check
    questions: [vec-add-comps]

  - type: explain
    title: What adding looks like
    body: |-
      Words for an arrow: its **tail** is where it starts and its **tip** is where it ends (the pointy end).

      A vector only records a length and a direction, not a position. So you can slide an arrow anywhere without changing it, and two arrows with the same length and direction are **equal** vectors, wherever they're drawn.

      **Triangle law.** Draw $\mathbf{a}$. From its tip, draw $\mathbf{b}$. The arrow from the start of $\mathbf{a}$ to the tip of $\mathbf{b}$ is $\mathbf{a} + \mathbf{b}$: doing one move and then the other gets you to the same place as doing the combined move.

      That's why $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$: going $A \to B$ then $B \to C$ ends at $C$.

      **Parallelogram law.** If $\mathbf{a}$ and $\mathbf{b}$ both start at the same point, slide a copy of $\mathbf{b}$ to the tip of $\mathbf{a}$ (and a copy of $\mathbf{a}$ to the tip of $\mathbf{b}$). You've drawn a parallelogram, and its diagonal from the shared starting point is $\mathbf{a} + \mathbf{b}$. It's the triangle law with the arrows drawn from one corner.

  - type: diagram
    diagram: p3-vectors-addition-scalar
    alt: >-
      Three panels. Left, triangle law: arrow a, then arrow b starting at the tip of a; the arrow
      from the start of a to the tip of b is a + b. Middle, parallelogram law: a and b start at the
      same point, dashed copies complete a parallelogram, and its diagonal is a + b. Right, scalar
      multiples: parallel arrows labelled a, 2a (twice as long), half a (half as long) and minus a
      (same length, pointing the other way), with the note parallel, new length. The a in this panel
      is a separate example, drawn level. The middle panel also shows a dashed grey arrow from the tip
      of b to the tip of a, labelled a − b: the parallelogram's other diagonal.
    caption: |-
      Left and middle: the triangle and parallelogram laws give the same $\mathbf{a} + \mathbf{b}$, and the other diagonal is $\mathbf{a} - \mathbf{b}$. Right: multiplying by a scalar stretches, shrinks or reverses an arrow, but it always stays parallel.

  - type: explain
    title: What subtracting looks like
    body: |-
      $\mathbf{a} - \mathbf{b}$ is $\mathbf{a} + (-\mathbf{b})$: do $\mathbf{a}$, then do $\mathbf{b}$ backwards.

      There's a handy picture for it. Draw $\mathbf{a}$ and $\mathbf{b}$ from the same point. Then $\mathbf{a} - \mathbf{b}$ is the arrow **from the tip of $\mathbf{b}$ to the tip of $\mathbf{a}$**. (Check with the triangle law: $\mathbf{b} + (\mathbf{a} - \mathbf{b}) = \mathbf{a}$.)

      That's the same idea as $\overrightarrow{AB} = \mathbf{b} - \mathbf{a}$ from the last lesson: the arrow between two tips is "end minus start".

  - type: intuition
    title: What multiplying by a number does
    body: |-
      $k\mathbf{a}$ points along the same line as $\mathbf{a}$:

      - $k = 2$: twice as long, same direction. $k = \tfrac12$: half as long.
      - $k = -1$: same length, opposite direction. Any negative $k$ reverses the arrow, and the size of $k$ (ignoring its sign) stretches or shrinks it.
      - $k = 0$: the **zero vector** $\mathbf{0}$, "no move at all".

      **Parallel vectors.** Because $k\mathbf{a}$ always lies along the same line as $\mathbf{a}$, two non-zero vectors are parallel exactly when one is a number times the other (the number can be negative; then they point opposite ways). For example $\begin{pmatrix} 6 \\ -9 \\ 3 \end{pmatrix} = 3\begin{pmatrix} 2 \\ -3 \\ 1 \end{pmatrix}$, so these two are parallel.

  - type: check
    questions: [vec-scalar-mult, vec-parallel]

  - type: example
    title: "Example 2: a parallelogram"
    problem: |-
      $OABC$ is a parallelogram, with its corners in that order going round: $O$, then $A$, then $B$, then $C$. So $OA$ and $OC$ are two neighbouring sides, and $OB$ is the diagonal. $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OC} = \mathbf{c}$. Write $\overrightarrow{OB}$ and $\overrightarrow{AC}$ in terms of $\mathbf{a}$ and $\mathbf{c}$.
    steps:
      - |-
        Opposite sides of a parallelogram are equal and parallel, so $\overrightarrow{AB} = \overrightarrow{OC} = \mathbf{c}$.
      - |-
        $\overrightarrow{OB}$: go $O \to A$ then $A \to B$: $\mathbf{a} + \mathbf{c}$ (the triangle law; this is exactly the parallelogram law for $OABC$).
      - |-
        $\overrightarrow{AC}$: go $A \to O$ (that's $-\mathbf{a}$), then $O \to C$ ($+\mathbf{c}$): $\mathbf{c} - \mathbf{a}$. End minus start again.
    answer: |-
      $\overrightarrow{OB} = \mathbf{a} + \mathbf{c}$ and $\overrightarrow{AC} = \mathbf{c} - \mathbf{a}$.

  - type: check
    questions: [vec-parallelogram]

  - type: explain
    title: The midpoint of two points
    body: |-
      $M$ is the midpoint of $AB$, and $A$, $B$ have position vectors $\mathbf{a}$, $\mathbf{b}$. To reach $M$: go to $A$, then half of the way along $\overrightarrow{AB}$.

      $$\overrightarrow{OM} = \mathbf{a} + \tfrac12(\mathbf{b} - \mathbf{a}) = \mathbf{a} + \tfrac12\mathbf{b} - \tfrac12\mathbf{a} = \tfrac12(\mathbf{a} + \mathbf{b}).$$

      In words: **average the two position vectors**, the same as averaging coordinates for a midpoint.

  - type: example
    title: "Example 3: a midpoint in 3D"
    problem: |-
      $A = (2, -3, 5)$ and $B = (8, 1, -1)$. Find the position vector of the midpoint $M$ of $AB$.
    steps:
      - |-
        Add the position vectors: $\begin{pmatrix} 2 + 8 \\ -3 + 1 \\ 5 + (-1) \end{pmatrix} = \begin{pmatrix} 10 \\ -2 \\ 4 \end{pmatrix}$.
      - |-
        Halve: $\overrightarrow{OM} = \begin{pmatrix} 5 \\ -1 \\ 2 \end{pmatrix}$.
    answer: |-
      $\overrightarrow{OM} = \begin{pmatrix} 5 \\ -1 \\ 2 \end{pmatrix}$, so $M$ is the point $(5, -1, 2)$.

  - type: check
    questions: [vec-midpoint]

  - type: misconceptions
    items:
      - wrong: |-
          The length of $\mathbf{a} + \mathbf{b}$ is the length of $\mathbf{a}$ plus the length of $\mathbf{b}$.
        right: |-
          Only if they point the same way. In the triangle law the third side is shorter than the other two put together.
      - wrong: |-
          $-\begin{pmatrix} 2 \\ -3 \\ 1 \end{pmatrix} = \begin{pmatrix} -2 \\ -3 \\ 1 \end{pmatrix}$ (only the first entry changes).
        right: |-
          Every component changes sign: $\begin{pmatrix} -2 \\ 3 \\ -1 \end{pmatrix}$. The whole arrow reverses.
      - wrong: |-
          $\overrightarrow{AB} = \overrightarrow{OA} + \overrightarrow{OB}$.
        right: |-
          $\overrightarrow{AB} = \overrightarrow{OB} - \overrightarrow{OA}$: end minus start.

  - type: exam
    body: |-
      - *Express $\overrightarrow{AC}$ in terms of $\mathbf{a}$ and $\mathbf{c}$*: find a route from $A$ to $C$ through points you know, and add up the moves.
      - *Show that two vectors are parallel*: show one is a number times the other.
      - *Simplify $3(\mathbf{a} - 2\mathbf{b}) + 4\mathbf{b}$*: expand and collect like ordinary algebra: $3\mathbf{a} - 6\mathbf{b} + 4\mathbf{b} = 3\mathbf{a} - 2\mathbf{b}$.

  - type: takeaways
    items:
      - |-
        Add, subtract and multiply by a scalar one component at a time.
      - |-
        Triangle law: one move then the other. Parallelogram law: the diagonal from the shared start.
      - |-
        $\mathbf{a} - \mathbf{b}$ goes from the tip of $\mathbf{b}$ to the tip of $\mathbf{a}$ (both drawn from one point).
      - |-
        $k\mathbf{a}$ is parallel to $\mathbf{a}$; a negative $k$ reverses it. Vectors are parallel when one is a multiple of the other.
      - |-
        Midpoint of $AB$: $\tfrac12(\mathbf{a} + \mathbf{b})$.

questions:
  - id: vec-add-comps
    format: numeric
    difficulty: 1
    objectives: ["3.7.2"]
    prompt: |-
      $\mathbf{a} = \begin{pmatrix} 3 \\ -2 \\ 1 \end{pmatrix}$, $\mathbf{b} = \begin{pmatrix} -1 \\ 4 \\ -2 \end{pmatrix}$. Find $\mathbf{a} - 2\mathbf{b} = \begin{pmatrix} p \\ q \\ r \end{pmatrix}$.
    fields:
      - label: "p ="
        answer: 5
      - label: "q ="
        answer: -10
      - label: "r ="
        answer: 5
    explanation: |-
      $2\mathbf{b} = \begin{pmatrix} -2 \\ 8 \\ -4 \end{pmatrix}$, so $\mathbf{a} - 2\mathbf{b} = \begin{pmatrix} 3 - (-2) \\ -2 - 8 \\ 1 - (-4) \end{pmatrix} = \begin{pmatrix} 5 \\ -10 \\ 5 \end{pmatrix}$.

  - id: vec-scalar-mult
    format: mcq
    difficulty: 1
    objectives: ["3.7.2"]
    prompt: |-
      What does multiplying a vector by $-2$ do geometrically?
    options:
      - text: Reverses the direction and doubles the length
        correct: true
        why: |-
          The minus sign reverses the direction, and the size of $-2$ ignoring its sign is 2, so the length doubles.
      - text: Reverses the direction but keeps the length the same
        why: |-
          That would be multiplying by $-1$.
      - text: Keeps the direction but doubles the length
        why: |-
          That would be multiplying by $2$.
      - text: Halves the length and reverses direction
        why: |-
          That would be multiplying by $-\frac{1}{2}$.
    explanation: |
      A negative scalar reverses the arrow, and its size (ignoring the sign) scales the length: multiplying by $-2$ doubles the length and points the vector the opposite way.

  - id: vec-parallelogram
    format: text
    difficulty: 2
    objectives: ["3.7.2"]
    prompt: |-
      OABC is a parallelogram. $\overrightarrow{OA} = \mathbf{a}$, $\overrightarrow{OC} = \mathbf{c}$. Write $\overrightarrow{CA}$ in terms of $\mathbf{a}$ and $\mathbf{c}$.
    accept:
      - a - c
      - -c + a
      - a-c
      - \mathbf{a} - \mathbf{c}
    model: |-
      $\mathbf{a} - \mathbf{c}$
    explanation: |-
      $\overrightarrow{CA} = \overrightarrow{OA} - \overrightarrow{OC} = \mathbf{a} - \mathbf{c}$ (end minus start: from $C$ to $A$).

  - id: vec-midpoint
    format: numeric
    difficulty: 2
    objectives: ["3.7.2"]
    prompt: |-
      $A$ has position vector $3\mathbf{i} - 2\mathbf{j} + \mathbf{k}$ and $B$ has position vector $-\mathbf{i} + 4\mathbf{j} - 3\mathbf{k}$. The midpoint of $AB$ has position vector $p\mathbf{i} + q\mathbf{j} + r\mathbf{k}$. Find $p$, $q$ and $r$.
    fields:
      - label: "p ="
        answer: 1
      - label: "q ="
        answer: 1
      - label: "r ="
        answer: -1
    explanation: |-
      Midpoint $= \tfrac12(\mathbf{a} + \mathbf{b}) = \tfrac12(2\mathbf{i} + 2\mathbf{j} - 2\mathbf{k}) = \mathbf{i} + \mathbf{j} - \mathbf{k}$.

  - id: vec-parallel
    format: numeric
    difficulty: 2
    objectives: ["3.7.2"]
    prompt: |-
      The vectors $\begin{pmatrix} 2 \\ k \\ -4 \end{pmatrix}$ and $\begin{pmatrix} 1 \\ 3 \\ -2 \end{pmatrix}$ are parallel. Find $k$.
    fields:
      - label: "k ="
        answer: 6
    explanation: |-
      Parallel means one is a number times the other. Compare the first entries: $2 = 2 \times 1$, so the first vector must be $2$ times the second. Then $k = 2 \times 3 = 6$ (and the last entries agree: $-4 = 2 \times (-2)$ ✓).
