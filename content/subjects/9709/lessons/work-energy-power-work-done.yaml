blocks:
  - type: objective
    body: |
      By the end you can define work done by a constant force, calculate work using W = Fd cos θ, and understand when work is positive, negative, or zero.

  - type: explain
    title: What is work?
    body: |
      In physics, **work** has a precise meaning: it is the energy transferred **by a force** when its point of application moves. The definition:
      $$W = Fd \cos\theta$$

      where:
      - $F$ = magnitude of the **constant** force (N)
      - $d$ = magnitude of the **displacement** of the point of application (m)
      - $\theta$ = angle between the **force vector** and the **displacement vector**

      **Key points:**
      - Work is a **scalar** (has magnitude, no direction).
      - Unit: **joule (J)**. $1\text{ J} = 1\text{ N m}$.
      - Only the component of force **in the direction of displacement** does work.
      - If the force varies, we need calculus (not in this syllabus). Here, forces are constant.

  - type: intuition
    title: Why cos θ?
    body: |
      Imagine pulling a sled with a rope at an angle.
      - If you pull horizontally ($\theta = 0^\circ$), all your force goes into moving the sled: $W = Fd$.
      - If you pull straight up ($\theta = 90^\circ$), the sled doesn't move vertically — no work against gravity: $\cos 90^\circ = 0$, so $W = 0$.
      - If you pull backwards ($\theta = 180^\circ$), you oppose the motion: $\cos 180^\circ = -1$, so $W = -Fd$ (negative work).

      The force component **parallel** to the displacement is $F\cos\theta$. Work = (parallel component) × distance.

  - type: explain
    title: Positive, negative, zero work
    body: |
      | Angle $\theta$ | $\cos\theta$ | Work $W$ | Meaning |
      |----------------|----------------|----------|---------|
      | $0^\circ$     | $+1$           | $+Fd$    | Force helps motion |
      | $0^\circ < \theta < 90^\circ$ | $>0$ | positive | Force partly helps |
      | $90^\circ$    | $0$            | $0$      | Force perpendicular — no energy transfer |
      | $90^\circ < \theta < 180^\circ$ | $<0$ | negative | Force partly opposes |
      | $180^\circ$   | $-1$           | $-Fd$    | Force directly opposes |

      **Negative work** means energy is taken **away** from the object (e.g., friction, braking).
      **Zero work** means the force transfers no energy (e.g., normal reaction, tension in a pendulum string).

  - type: example
    title: Work at an angle
    problem: |
      A force of $20\text{ N}$ acts at $30^\circ$ to the horizontal. The object moves $5\text{ m}$ horizontally. Find the work done by the force.
    steps:
      - 'Identify: $F = 20$, $d = 5$, $\theta = 30^\circ$ (angle between force and displacement)'
      - 'Use $W = Fd \cos\theta = 20 \times 5 \times \cos 30^\circ$'
      - '$\cos 30^\circ = \sqrt{3}/2 \approx 0.866$'
      - '$W = 100 \times 0.866 = 86.6\text{ J}$'
    answer: |
      $W = 86.6\text{ J}$ (to 3 s.f.)

  - type: example
    title: Work done by friction
    problem: |
      A block slides $4\text{ m}$ along a rough horizontal surface. The frictional force is $8\text{ N}$. Find the work done by friction.
    steps:
      - 'Friction opposes motion: angle between friction force and displacement = $180^\circ$'
      - '$W = Fd \cos 180^\circ = 8 \times 4 \times (-1) = -32\text{ J}$'
    answer: |
      $W = -32\text{ J}$ (negative — energy removed from the block)

  - type: check
    title: Check yourself
    questions: [work-angle, work-friction, work-normal]

  - type: misconceptions
    items:
      - wrong: 'Work = force × distance always.'
        right: |
          Only when force and displacement are **parallel** ($\theta = 0$). In general, $W = Fd \cos\theta$.
      - wrong: 'The normal reaction does work when an object moves horizontally.'
        right: |
          Normal reaction is vertical; displacement is horizontal. Angle = $90^\circ$, so $W = 0$. It does no work.
      - wrong: 'Tension in a string does work on a pendulum bob.'
        right: |
          Tension is always perpendicular to the displacement (tangential). Angle = $90^\circ$, so $W = 0$. Only gravity does work.
      - wrong: 'Work is a vector.'
        right: |
          Work is a scalar. It can be positive, negative, or zero, but it has no direction.

  - type: exam
    body: |
      - Always identify the angle between the **force** and the **displacement** — not the angle of the force to the horizontal unless the displacement is horizontal.
      - If a force has components, only the component parallel to displacement does work.
      - "Work done **by** a force" vs "work done **against** a force": work done against friction = $+Fd$ (magnitude), work done by friction = $-Fd$.
      - Questions may give the angle or expect you to find it from geometry.

  - type: takeaways
    items:
      - 'Work done by a constant force: $W = Fd \cos\theta$'
      - 'Unit: joule (J) = N m'
      - 'Work is a scalar: positive (helps), negative (opposes), zero (perpendicular)'
      - 'Only the component of force parallel to displacement does work'
      - 'Normal reaction, tension in a pendulum string → zero work'

questions:
  - id: work-angle
    format: numeric
    difficulty: 2
    objectives: ["4.5.1"]
    prompt: |
      A force of $15\text{ N}$ acts at $60^\circ$ to the direction of motion. The object moves $8\text{ m}$. Find the work done by the force.
    fields:
      - answer: 60
        unit: J
        tolerance: { abs: 0.1 }
    explanation: |
      $W = Fd \cos\theta = 15 \times 8 \times \cos 60^\circ = 120 \times 0.5 = 60\text{ J}$.

  - id: work-friction
    format: numeric
    difficulty: 1
    objectives: ["4.5.1"]
    prompt: |
      A block is pulled $6\text{ m}$ across a rough floor. The frictional force is $12\text{ N}$. What is the work done **by** friction?
    fields:
      - answer: -72
        unit: J
        tolerance: { abs: 0.1 }
    explanation: |
      Friction opposes motion: $\theta = 180^\circ$, $\cos 180^\circ = -1$. $W = 12 \times 6 \times (-1) = -72\text{ J}$.

  - id: work-normal
    format: mcq
    difficulty: 1
    objectives: ["4.5.1"]
    prompt: |
      A box of mass $m$ slides a distance $d$ along a horizontal floor. The normal reaction force is $R = mg$. What is the work done by the normal reaction?
    options:
      - text: $mgd$
        why: That would be the work if the force were in the direction of motion. Normal reaction is vertical; displacement is horizontal.
      - text: $-mgd$
        why: Negative work implies the force opposes motion. Normal reaction is perpendicular.
      - text: $0$
        correct: true
        why: Normal reaction is vertical, displacement is horizontal. Angle = $90^\circ$, so $W = 0$.
      - text: $mgd/2$
        why: No basis for this value.
    explanation: |
      Work is zero when the force is perpendicular to the displacement ($\cos 90^\circ = 0$).