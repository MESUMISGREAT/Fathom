blocks:
  - type: objective
    body: |
      By the end you can explain the difference between mass and weight, use $W = mg$ with
      $g = 10\ \text{m s}^{-2}$, and include weight correctly in force diagrams and $F = ma$ problems.

  - type: explain
    title: Mass vs weight — not the same thing
    body: |
      **Mass** is the amount of matter in an object. It's a scalar, measured in kilograms (kg), and
      it does not change when you move the object — a 70 kg person has mass 70 kg on Earth, on the
      Moon, and in deep space.

      **Weight** is the force with which gravity pulls on that mass. It's a vector, measured in
      newtons (N), and it **does** depend on where you are. On Earth it's about 700 N; on the Moon
      it's about 115 N; in deep space it's nearly zero.

      The link is simple:

      $$W = mg$$

      | Symbol | Meaning |
      | --- | --- |
      | $W$ | weight, a force, in newtons (N) |
      | $m$ | mass, in kilograms (kg) |
      | $g$ | the acceleration of a freely falling object, in $\text{m s}^{-2}$ |

      **Where does $W = mg$ come from?** Drop an object and ignore air resistance. The only force on it is its
      weight, and every object falling freely near the Earth speeds up at the same rate, $g$ (about
      $10\ \text{m s}^{-2}$: each second it falls, it goes $10\ \text{m s}^{-1}$ faster). Newton's second law says
      force $=$ mass $\times$ acceleration. With force $W$ and acceleration $g$, that is exactly $W = mg$.

      It also explains why heavy and light objects fall together. A 10 kg rock has ten times the weight of a
      1 kg rock, but also ten times the mass to get moving, so the acceleration comes out the same.

      In 9709, always use $g = 10\ \text{m s}^{-2}$ unless the question explicitly says otherwise.

  - type: definition
    term: Weight
    body: |
      The weight of a body of mass $m$ is the force $W = mg$ exerted on it by gravity. It acts
      vertically downwards. In 9709, use $g = 10\ \text{m s}^{-2}$.

  - type: intuition
    title: Why g = 10, not 9.81
    body: |
      Physics uses $g = 9.81\ \text{m s}^{-2}$ (or 9.8). Mathematics uses $g = 10\ \text{m s}^{-2}$
      because it makes the arithmetic clean and the ideas clear. Cambridge explicitly states this for
      9709. If you use 9.81 in a 9709 exam, you may not get the exact expected answer and could
      lose accuracy marks.

      Think of it as "Cambridge gravity" — a defined constant for this syllabus, like $\pi = 3.14$
      in some old textbook problems. It's not a mistake; it's the convention.

  - type: example
    title: Finding weight from mass
    problem: |
      A crate has mass $40\ \text{kg}$. Find its weight. Take $g = 10\ \text{m s}^{-2}$.
    steps:
      - |
        Use $W = mg$: $W = 40 \times 10 = 400\ \text{N}$.
      - |
        Weight acts vertically downwards.
    answer: |
      Weight $= 400\ \text{N}$ downwards.

  - type: example
    title: Finding mass from weight
    problem: |
      A rock weighs $250\ \text{N}$. Find its mass. Take $g = 10\ \text{m s}^{-2}$.
    steps:
      - |
        Rearrange $W = mg$ to $m = W/g$: $m = 250/10 = 25\ \text{kg}$.
    answer: |
      Mass $= 25\ \text{kg}$.

  - type: example
    title: Weight in an F = ma problem
    problem: |
      A stone of mass $2\ \text{kg}$ falls vertically through air. The air resistance is a
      constant $3\ \text{N}$ upwards. Find its acceleration. Take $g = 10\ \text{m s}^{-2}$.
    steps:
      - |
        Draw the force diagram: weight $W = mg = 2 \times 10 = 20\ \text{N}$ down, air resistance
        $3\ \text{N}$ up.
      - |
        Take downwards as positive, because that is the way the stone is moving. Forces pointing down
        count as positive and forces pointing up count as negative.
      - |
        The **resultant force** is the overall force left over after the forces partly cancel:
        $F = 20 - 3 = 17\ \text{N}$ downwards.
      - |
        Newton's second law, $F = ma$, links the resultant force to the acceleration: $17 = 2a$, so
        $a = 8.5\ \text{m s}^{-2}$ downwards.
      - |
        Sense check: without air resistance it would accelerate at $g = 10\ \text{m s}^{-2}$. Air resistance
        holds it back a little, so a bit less than 10 makes sense ✓
    answer: |
      Acceleration $= 8.5\ \text{m s}^{-2}$ downwards.

  - type: check
    title: Check yourself
    questions: [mw-weight, mw-mass, mw-falling]

  - type: misconceptions
    items:
      - wrong: '"Mass" and "weight" mean the same thing in everyday language, so they do in physics too.'
        right: |
          They are completely different physical quantities. Mass is a scalar (kg); weight is a
          vector force (N). In 9709, questions often test whether you know the difference.
      - wrong: 'A 50 kg person "weighs" 50 kg.'
        right: |
          They have a mass of 50 kg. Their weight is 500 N (on Earth, with g = 10). Never say
          "weight = 50 kg" — it's a force, so the unit is newtons.
      - wrong: "Use g = 9.81 because that's the real value."
        right: |
          In 9709, use g = 10 m s⁻². The syllabus says so. Using 9.81 will give a different
          numerical answer and may lose the accuracy mark.

  - type: exam
    body: |
      - Every 9709 mechanics question with gravity says "Take g = 10 m s⁻²" or just expects it.
      - Weight always acts vertically downwards. Don't confuse it with the normal reaction (which
        acts perpendicular to a surface).
      - On an inclined plane, weight has components parallel and perpendicular to the plane — we'll
        do that in the next lesson.
      - If you're asked for mass, give kg. If asked for weight, give N. Mixing units is an easy
        mark to lose.

  - type: takeaways
    items:
      - "Mass is scalar (kg); weight is vector force (N)."
      - "W = mg, with g = 10 m s⁻² in 9709."
      - "Weight always acts vertically downwards."
      - "Don't confuse mass and weight — it's a common exam trap."

questions:
  - id: mw-weight
    format: numeric
    difficulty: 1
    objectives: ["4.4.2"]
    prompt: |
      A bag of cement has mass $25\ \text{kg}$. Calculate its weight. Take $g = 10\ \text{m s}^{-2}$.
    fields:
      - answer: 250
        unit: N
        tolerance: { abs: 0.5 }
    explanation: |
      $W = mg = 25 \times 10 = 250\ \text{N}$.

  - id: mw-mass
    format: numeric
    difficulty: 1
    objectives: ["4.4.2"]
    prompt: |
      A weight of $340\ \text{N}$ acts on a particle. Find its mass. Take $g = 10\ \text{m s}^{-2}$.
    fields:
      - answer: 34
        unit: kg
        tolerance: { abs: 0.1 }
    explanation: |
      $m = W/g = 340/10 = 34\ \text{kg}$.

  - id: mw-falling
    format: numeric
    difficulty: 2
    objectives: ["4.4.2", "4.4.1"]
    prompt: |
      A ball of mass $0.5\ \text{kg}$ falls vertically. The air resistance is $1.5\ \text{N}$.
      Find the acceleration of the ball. Take $g = 10\ \text{m s}^{-2}$.
    fields:
      - answer: 7
        unit: "m s⁻²"
        tolerance: { abs: 0.1 }
    explanation: |
      Weight $W = 0.5 \times 10 = 5\ \text{N}$ down. Air resistance $= 1.5\ \text{N}$ up.
      Take down as positive: $F = 5 - 1.5 = 3.5\ \text{N}$. $F = ma$: $3.5 = 0.5a$, so $a = 7\ \text{m s}^{-2}$ down.