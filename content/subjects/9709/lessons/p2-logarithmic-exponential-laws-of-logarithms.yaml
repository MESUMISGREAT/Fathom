id: p2-logarithmic-exponential-laws-of-logarithms
subject: "9709"
topic: "2.2"
title: Laws of logarithms and indices
summary: Use the relationship between logarithms and indices together with the log laws to simplify expressions and solve problems.
order: 1
minutes: 5
kind: core
objectives: ["2.2.1"]
prerequisites: []
