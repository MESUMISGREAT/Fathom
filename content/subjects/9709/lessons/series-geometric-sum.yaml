id: series-geometric-sum
subject: "9709"
topic: "1.6"
title: Summing a geometric progression
summary: Use Sₙ = a(1 − rⁿ)/(1 − r) to add the first n terms of a GP, see why it works, and work backwards to find n or r.
order: 6
minutes: 6
kind: core
objectives: ["1.6.3"]
prerequisites: [series-geometric-nth-term]
