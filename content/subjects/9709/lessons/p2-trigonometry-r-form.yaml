id: p2-trigonometry-r-form
subject: "9709"
topic: "2.3"
title: Combine sine and cosine into one wave
summary: Rewrite a sine-plus-cosine expression as one shifted sine or cosine, then use it to solve equations.
order: 4
minutes: 5
kind: core
objectives: ["2.3.2"]
prerequisites: [p2-trigonometry-compound-angles]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027, topic 2.3 learning outcome 2.3.2: express a sin x + b cos x in the forms
    R sin(x + alpha) and R cos(x +/- alpha), and use identities in simplification and equations. All
    questions are original; no illustrative data are used. Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end, you can combine a sin x + b cos x into one shifted sine or cosine and use that form to solve an equation.
  - type: explain
    title: Choose R to match both coefficients
    body: |-
      In a sin x + b cos x, a and b are the given coefficients. R is the positive amplitude of the new wave, and alpha is its angle shift.

      For a sin x + b cos x = R sin(x + alpha), expand the right side:

      R sin(x + alpha) = R sin x cos alpha + R cos x sin alpha

      Match the coefficients of sin x and cos x: a = R cos alpha and b = R sin alpha.

      Squaring and adding gives R^2 = a^2 + b^2. Use the signs of a and b to choose the correct angle.

      For the other sine form, R sin(x - alpha) = R sin x cos alpha - R cos x sin alpha. The minus sign changes the sign of the cos x coefficient.
  - type: diagram
    diagram: p2-trigonometry-r-form
    alt: >-
      A right triangle with perpendicular sides 3 and 4, hypotenuse 5, and alpha at the upper-left
      angle illustrates R squared equals 3 squared plus 4 squared. Beside it, the diagram shows
      R equals 5, cos alpha equals 3 over 5, and sin alpha equals 4 over 5.
    caption: |-
      Matching coefficients gives R = 5, cos alpha = 3/5 and sin alpha = 4/5, so alpha is in the first quadrant.
  - type: example
    title: A worked R form
    problem: |-
      Write 3 sin x + 4 cos x as R sin(x + alpha), where R > 0 and 0 degrees < alpha < 90 degrees.
    steps:
      - |-
        Expand the proposed form: R sin x cos alpha + R cos x sin alpha.
      - |-
        Match the coefficients: R cos alpha = 3 and R sin alpha = 4.
      - |-
        Square and add: R^2 = 3^2 + 4^2 = 25, so R = 5 (the question says R is positive).
      - |-
        Divide the matched equations: tan alpha = 4/3, so alpha = 53.1 degrees to 3 s.f.
    answer: |-
      3 sin x + 4 cos x = 5 sin(x + 53.1 degrees), with the angle rounded to 3 s.f.
  - type: check
    questions: [r-value, match-alpha, cosine-angle]
  - type: explain
    title: Sine form or cosine form?
    body: |-
      For R cos(x - alpha), expand to R cos x cos alpha + R sin x sin alpha. The sin x coefficient is R sin alpha, and the cos x coefficient is R cos alpha.

      For R cos(x + alpha), the sin x coefficient is negative: -R sin alpha.

      Example: 3 sin x + 4 cos x = 5 cos(x - alpha), where sin alpha = 3/5 and cos alpha = 4/5, so alpha = 36.9 degrees. Expand first, then match; do not reuse the angle from a sine form without checking.

      The maximum height of the combined wave is R = sqrt(a^2 + b^2) and its minimum is -R. This lets you check whether an equation such as a sin x + b cos x = k can have any solutions.
  - type: example
    title: Use the wave to solve
    problem: |-
      Solve 3 cos x + 2 sin x = 1 for 0 degrees <= x < 360 degrees.
    steps:
      - |-
        Write the left side as R sin(x + alpha). Then R = sqrt(3^2 + 2^2) = sqrt(13), cos alpha = 2/sqrt(13) and sin alpha = 3/sqrt(13).
      - |-
        So alpha = 56.3 degrees and the equation becomes sqrt(13) sin(x + 56.3 degrees) = 1.
      - |-
        Divide by sqrt(13): sin(x + 56.3 degrees) = 1/sqrt(13). The reference angle is 16.1 degrees.
      - |-
        The positive sine angles in one turn are 16.1 degrees and 163.9 degrees. Subtract 56.3 degrees and keep answers in the interval: x = 107.6 degrees or 319.8 degrees (3 s.f.).
    answer: |-
      x = 108 degrees or 320 degrees to 3 s.f.
  - type: check
    questions: [r-solve-count, no-solution-range]
  - type: misconceptions
    items:
      - wrong: |-
          R = a + b.
        right: |-
          Square and add the matched coefficients: R = sqrt(a^2 + b^2).
      - wrong: |-
          alpha = tan^-1(a/b) for every chosen form.
        right: |-
          Match both coefficients from the expansion first; the signs and chosen sine/cosine form determine the angle.
  - type: exam
    body: |-
      - State the matching equations, not just the final R and angle.
      - If the coefficients have different signs, use those signs to select the quadrant before rounding.
      - For an equation, keep every solution in the requested interval and give the requested accuracy.
  - type: takeaways
    items:
      - |-
        R = sqrt(a^2 + b^2).
      - |-
        Match coefficients after expanding the chosen shifted sine or cosine.
      - |-
        Use signs to choose the angle; inverse tangent alone does not know the quadrant.
      - |-
        Solve in the shifted angle, then undo the shift and check the original interval.
questions:
  - id: r-value
    format: numeric
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |-
      Write 5 sin x + 12 cos x as one shifted sine with positive amplitude R. Find R.
    fields: [{answer: 13}]
    explanation: |-
      R = sqrt(5^2 + 12^2) = 13.
  - id: match-alpha
    format: numeric
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |-
      For 3 sin x + 4 cos x = 5 sin(x + alpha), find alpha in degrees to 3 significant figures.
    fields: [{answer: 53.1, tolerance: {abs: 0.01}, sigFigs: 3}]
    explanation: |-
      Matching gives tan alpha = 4/3, so alpha = 53.1 degrees to 3 s.f.
  - id: cosine-angle
    format: numeric
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |-
      Write 3 sin x + 4 cos x as 5 cos(x - alpha), where alpha is acute. Find alpha in degrees to 3 significant figures.
    fields: [{answer: 36.9, tolerance: {abs: 0.01}, sigFigs: 3}]
    explanation: |-
      Expanding gives 5 cos x cos alpha + 5 sin x sin alpha. Match 5 sin alpha = 3 and 5 cos alpha = 4, so alpha = 36.9 degrees.
  - id: r-solve-count
    format: numeric
    difficulty: 3
    objectives: ["2.3.2"]
    prompt: |-
      How many solutions does 3 sin x + 4 cos x = 6 have for 0 degrees <= x < 360 degrees?
    fields: [{answer: 0}]
    explanation: |-
      The combined wave has amplitude R = 5, so its values stay between -5 and 5. It cannot reach 6.
  - id: no-solution-range
    format: mcq
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |-
      Which equation has no real solution?
    options:
      - text: |-
          6 sin x + 8 cos x = 11
        correct: true
        why: |-
          Its amplitude is 10, so the left side cannot be 11.
      - text: |-
          6 sin x + 8 cos x = 9
        why: |-
          9 lies within the possible range from -10 to 10.
      - text: |-
          6 sin x + 8 cos x = 0
        why: |-
          Zero is within the possible range.
    explanation: |-
      The greatest possible value is sqrt(6^2 + 8^2) = 10.
