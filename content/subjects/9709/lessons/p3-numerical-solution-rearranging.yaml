id: p3-numerical-solution-rearranging
subject: "9709"
topic: "3.6"
title: Rearranging equations into iteration form
summary: Learn to rearrange f(x) = 0 into x = F(x) to create your own iterative formula, and understand why some rearrangements converge while others diverge.
order: 4
minutes: 9
kind: core
objectives: ["3.6.3"]
prerequisites: [p3-numerical-solution-using-iteration]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.6 outcome "Understand how a given simple iterative formula
    of the form xₙ₊₁ = F(xₙ) relates to the equation being solved, and use a given iteration,
    or an iteration based on a given rearrangement of an equation, to determine a root to a
    prescribed degree of accuracy". All examples, questions and diagrams are original; every
    value and answer key was computed in Python.
blocks:
  - type: objective
    body: |-
      By the end you can rearrange f(x) = 0 into x = F(x) in different ways, choose a starting value, and predict whether the iteration will converge.

  - type: explain
    title: The link between equation and iteration
    body: |-
      If α is a root of f(x) = 0, then f(α) = 0. If you can rearrange this to **α = F(α)**, then α is a **fixed point** of F — it satisfies x = F(x).

      The iteration xₙ₊₁ = F(xₙ) tries to find that fixed point by repeated substitution. If it converges, the limit satisfies L = F(L), which means f(L) = 0. So the limit *is* a root.

      **Key insight:** every rearrangement x = F(x) gives a *different* iteration. Some converge; some don't. Your job is to pick a good one.

  - type: example
    title: "Example 1: multiple rearrangements of the same equation"
    problem: |-
      The equation x³ − 2x − 5 = 0 has a root near 2. Rearrange it in three different ways as x = F(x).
    steps:
      - |-
        Add 2x + 5: x³ = 2x + 5 → x = ∛(2x + 5)  (take cube root)
      - |-
        Factor x: x(x² − 2) = 5 → x = 5/(x² − 2)  (divide by x² − 2)
      - |-
        Add 5: x³ − 2x = 5 → x = (x³ − 5)/2  (divide by 2)
    answer: |-
      Three valid rearrangements: x = ∛(2x + 5), x = 5/(x² − 2), x = (x³ − 5)/2.

  - type: diagram
    diagram: p3-numerical-solution-rearranging-cobweb
    alt: >-
      Cobweb diagram showing two iterations for x³ − 2x − 5 = 0. Left: x = ∛(2x + 5) spirals
      in to the root (converges). Right: x = (x³ − 5)/2 spirals out (diverges). Both are
      cobweb plots of y = F(x) against y = x.
    caption: |-
      Same equation, two rearrangements. One spirals in (converges), the other spirals out (diverges).

  - type: check
    questions: [rearrange-ways, rearrange-which-converges]

  - type: explain
    title: How to tell if it will converge (the gradient rule)
    body: |-
      A rearrangement x = F(x) converges **locally** near a root α if:

      > |F'(α)| < 1

      That is, the **magnitude of the derivative at the root is less than 1**.

      - If |F'(α)| < 1: the iteration converges (staircase or spiral).
      - If |F'(α)| > 1: the iteration diverges (spirals away).
      - If |F'(α)| = 1: inconclusive (may converge slowly or not at all).

      **In the exam:** you are not asked to differentiate F and check |F'(α)| < 1. But you *are* expected to understand that "an iteration may fail to converge" and to recognise a divergent cobweb diagram when you see one.

      **Practical tip:** if you have to choose a rearrangement, avoid dividing by something that gets small near the root (that makes F' large). Taking roots (∛, √) or using the form that "isolates x on the smaller side" usually works better.

  - type: intuition
    title: Why the derivative matters
    body: |-
      Imagine you are at xₙ, near the root α. The next step is xₙ₊₁ = F(xₙ). The error is eₙ = xₙ − α. Then:

      eₙ₊₁ = xₙ₊₁ − α = F(xₙ) − F(α) ≈ F'(α)(xₙ − α) = F'(α) eₙ.

      So the error gets multiplied by roughly F'(α) each step. If |F'(α)| < 1, the error shrinks. If |F'(α)| > 1, the error grows. This is the whole story.

  - type: example
    title: "Example 2: choosing a starting value for a given rearrangement"
    problem: |-
      For x³ − 2x − 5 = 0, the iteration xₙ₊₁ = ∛(2xₙ + 5) is used.
      (a) Show that this rearrangement is valid.
      (b) With x₁ = 2, find the root to 3 d.p.
      (c) Explain why x₁ = −2 would be a poor choice.
    steps:
      - |-
        (a) x³ − 2x − 5 = 0 → x³ = 2x + 5 → x = ∛(2x + 5). Valid.
      - |-
        (b) x₂ = ∛(4 + 5) = ∛9 = 2.08008…; x₃ = ∛(4.16016… + 5) = 2.0929…; x₄ = 2.0943…; x₅ = 2.0945…; x₆ = 2.0945…. Root = 2.095 (3 d.p.).
      - |-
        (c) x₁ = −2 → x₂ = ∛(−4 + 5) = ∛1 = 1 → x₃ = ∛7 ≈ 1.91 → x₄ = ∛8.82 ≈ 2.07… It eventually converges but takes longer and jumps across zero. A starting value far from the root works, but closer is faster.
    answer: |-
      (a) x³ = 2x + 5 → x = ∛(2x + 5). (b) Root = 2.095 (3 d.p.). (c) x₁ = −2 gives a longer, oscillating path; starting near the root is faster.

  - type: check
    questions: [rearrange-valid, rearrange-start]

  - type: misconceptions
    items:
      - wrong: |-
          Any rearrangement x = F(x) will work as an iteration.
        right: |-
          Some converge, some diverge. You must check (or the question tells you which one to use). The derivative condition |F'(α)| < 1 is the theoretical test.
      - wrong: |-
          The rearrangement x = (x³ − 5)/2 is simpler (no roots), so it must be better.
        right: |-
          Simpler algebra ≠ better convergence. For x³ − 2x − 5 = 0 near 2, F'(x) = 3x²/2, so |F'(2)| = 6 > 1. This iteration **diverges**.
      - wrong: |-
          If the iteration diverges, the equation has no root.
        right: |-
          The equation has a root (sign change proves it). The *formula* just fails to find it. A different rearrangement would work.
      - wrong: |-
          You must always derive the iteration formula yourself in the exam.
        right: |-
          Most questions **give** you the formula. Only "rearrange the equation… hence use the iteration" questions ask you to do the algebra step.

  - type: exam
    body: |-
      - "Rearrange the equation… to the form x = F(x)" — do the algebra, show the steps.
      - "Hence use the iteration… with x₁ = … to find the root…" — now just compute.
      - If asked "State, with a reason, whether the iteration will converge", draw or describe the cobweb: if the curve y = F(x) crosses y = x with slope less than 1 (in magnitude), it converges.
      - You may be given two rearrangements and asked which one to use. Sketch or reason: the one with the gentler slope near the root wins.

  - type: takeaways
    items:
      - |-
        A root of f(x) = 0 is a fixed point of x = F(x). Different rearrangements give different F.
      - |-
        Convergence depends on |F'(α)|: less than 1 converges; greater than 1 diverges.
      - |-
        Cube roots, square roots, and "isolate x on the side with smaller powers" usually work.
      - |-
        In the exam: if given the formula, just run it. If asked to rearrange, do the algebra then run it.

questions:
  - id: rearrange-ways
    format: text
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      The equation x² − 4x + 1 = 0 can be rearranged to x = F(x) in at least two ways. Write down two different valid forms.
    accept:
      - x = (x^2 + 1)/4 and x = sqrt(4x - 1)
      - x = 4 - 1/x and x = (x^2 + 1)/4
      - x = 4 - 1/x and x = sqrt(4x - 1)
      - x = (x^2 + 1)/4
      - x = sqrt(4x - 1)
      - x = 4 - 1/x
    model: |-
      Three common forms: (1) x = (x² + 1)/4, (2) x = √(4x − 1) (for the larger root), (3) x = 4 − 1/x. Any two are correct.
    explanation: |-
      x² − 4x + 1 = 0 → x² + 1 = 4x → x = (x² + 1)/4. Also x² = 4x − 1 → x = √(4x − 1). Also 4x = x² + 1 → 4 = x + 1/x → x = 4 − 1/x.

  - id: rearrange-which-converges
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      For x³ − 2x − 5 = 0 near x = 2, which rearrangement is likely to converge?
    options:
      - text: x = ∛(2x + 5)
        correct: true
        why: |-
          F(x) = (2x + 5)^(1/3). F'(x) = 2/3 (2x + 5)^(-2/3). At x = 2, F'(2) = 2/3 × 9^(-2/3) = 2/3 × 1/∛81 ≈ 0.09 < 1. Converges.
      - text: x = (x³ − 5)/2
        why: |-
          F(x) = (x³ − 5)/2. F'(x) = 3x²/2. At x = 2, F'(2) = 6 > 1. Diverges.
      - text: x = 5/(x² − 2)
        why: |-
          F(x) = 5(x² − 2)^(-1). F'(x) = −10x(x² − 2)^(-2). At x = 2, F'(2) = −20/4 = −5, |F'(2)| = 5 > 1. Diverges.
      - text: All three converge
        why: |-
          Only the cube root form has |F'(α)| < 1 at the root.

  - id: rearrange-valid
    format: cloze
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      Rearrange x³ + 3x − 2 = 0 into the form x = F(x) by taking a cube root.
    blanks:
      - accept: ["x = \\sqrt[3]{2 - 3x}", "x = (2 - 3x)^{1/3}", "cube root of (2 - 3x)"]
    explanation: |-
      x³ + 3x − 2 = 0 → x³ = 2 − 3x → x = ∛(2 − 3x).

  - id: rearrange-start
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      The iteration xₙ₊₁ = ∛(2xₙ + 5) with x₁ = 2 converges to the root of x³ − 2x − 5 = 0. If you started with x₁ = −2 instead, what would happen?
    options:
      - text: It would still converge, but take more steps
        correct: true
        why: |-
          The sequence would go: −2 → 1 → 1.91 → 2.07 → … and eventually approach 2.095. The basin of attraction includes negative starts, but closer is faster.
      - text: It would diverge to infinity
        why: |-
          The cube root function is defined for all real numbers; it cannot blow up.
      - text: It would converge to a different root
        why: |-
          The cubic x³ − 2x − 5 = 0 has only one real root (≈ 2.095). There is no other real root to converge to.
      - text: It would oscillate between two values forever
        why: |-
          The iteration does not have a period-2 cycle; it converges.