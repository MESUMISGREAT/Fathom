id: p3-numerical-solution-rearranging
subject: "9709"
topic: "3.6"
title: Rearranging equations into iteration form
summary: Learn to rearrange f(x) = 0 into x = F(x) to create your own iterative formula, and understand why some rearrangements converge while others diverge.
order: 4
minutes: 9
kind: core
objectives: ["3.6.3"]
prerequisites: [p3-numerical-solution-using-iteration]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.6 outcome "Understand how a given simple iterative formula
    of the form xₙ₊₁ = F(xₙ) relates to the equation being solved, and use a given iteration,
    or an iteration based on a given rearrangement of an equation, to determine a root to a
    prescribed degree of accuracy". All examples, questions and diagrams are original; every
    value and answer key was computed in Python.
    Revised on 2026-10-31 for beginners (terms defined, steps explained, maths typeset). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can rearrange an equation $f(x) = 0$ into the form $x = F(x)$, link a given iteration back to the equation it solves, use it to find a root to a stated accuracy, and recognise when an iteration fails.

  - type: explain
    title: Where iteration formulas come from
    body: |-
      Take the equation $x^3 - 2x - 5 = 0$. Rearrange it so that $x$ is on its own on the left:

      $$x^3 = 2x + 5 \quad\Longrightarrow\quad x = \sqrt[3]{2x + 5}.$$

      This is still the same equation, just written as $x = F(x)$, with $F(x) = \sqrt[3]{2x + 5}$.

      Now turn it into an iteration by putting labels on the two $x$'s: $x_{n+1} = \sqrt[3]{2x_n + 5}$. You put a guess in on the right and get a new guess out on the left.

      **Why does the limit solve the equation?** If the guesses settle down to some value $\alpha$, then eventually $x_n$ and $x_{n+1}$ are both (almost exactly) $\alpha$. So $\alpha = \sqrt[3]{2\alpha + 5}$. Cube both sides: $\alpha^3 = 2\alpha + 5$, i.e. $\alpha^3 - 2\alpha - 5 = 0$. The limit is a root of the original equation.

  - type: example
    title: "Example 1: one equation, many rearrangements"
    problem: |-
      Rearrange $x^3 - 2x - 5 = 0$ into the form $x = F(x)$ in three different ways.
    steps:
      - |-
        Move $-2x - 5$ across: $x^3 = 2x + 5$. Take the cube root: $x = \sqrt[3]{2x + 5}$.
      - |-
        Move $-5$ across and take out $x$ as a factor: $x(x^2 - 2) = 5$. Divide by $x^2 - 2$: $x = \dfrac{5}{x^2 - 2}$.
      - |-
        Move $-2x$ across instead: $x^3 - 5 = 2x$. Divide by 2: $x = \dfrac{x^3 - 5}{2}$.
    answer: |-
      $x = \sqrt[3]{2x + 5}$, $\;x = \dfrac{5}{x^2 - 2}$ and $x = \dfrac{x^3 - 5}{2}$. All three are true for the root, but they behave very differently as iterations.

  - type: check
    questions: [rearrange-ways, rearrange-valid]

  - type: explain
    title: Run it and watch
    body: |-
      The syllabus does **not** ask you to prove whether an iteration converges. It does expect you to know that an iteration **can fail**, and to spot it when it does.

      So run a few steps from the same start, $x_1 = 2$:

      | Rearrangement | $x_2$ | $x_3$ | $x_4$ | What happens |
      | --- | --- | --- | --- | --- |
      | $x = \sqrt[3]{2x + 5}$ | $2.0801$ | $2.0924$ | $2.0942$ | settles near $2.095$ |
      | $x = \dfrac{x^3 - 5}{2}$ | $1.5$ | $-0.8125$ | $-2.7682$ | runs away |
      | $x = \dfrac{5}{x^2 - 2}$ | $2.5$ | $1.1765$ | $-8.118$ | jumps about |

      - **Settling:** each step changes the value by less than the one before. The iteration is working.
      - **Running away or jumping about:** the values never close in. The iteration has failed, even though the equation still has a root at $2.095$ (a sign change proves it).

  - type: diagram
    diagram: p3-numerical-solution-rearranging-cobweb
    alt: >-
      A chart of value against step number, x1 to x6, with a dashed horizontal line at the root 2.095.
      The iteration x = cube root of (2x + 5) starts at 2 and stays almost flat along the dashed line,
      labelled settles. The iteration x = (x³ − 5)/2 starts at 2 and falls: 1.5, −0.81, −2.77, then a
      dashed line heads off the bottom of the chart, labelled next: −13.1, off the chart. This one is
      labelled runs away.
    caption: |-
      Same equation, same start, two rearrangements. One settles on the root; the other runs away from it.

  - type: enrichment
    title: Beyond the syllabus — why some rearrangements fail
    body: |-
      Near the root $\alpha$, each step multiplies the error by roughly the gradient of $y = F(x)$ at $\alpha$. If that gradient is between $-1$ and $1$, the error shrinks and the iteration settles; if it is steeper than that, the error grows.

      $F(x) = \sqrt[3]{2x + 5}$ is very flat near the root (gradient about $0.15$), so it settles fast. $F(x) = \dfrac{x^3 - 5}{2}$ is very steep there (gradient about $6.6$), so it runs away. You won't be asked to use this in 9709; it just explains the table.

  - type: check
    questions: [rearrange-which-converges]

  - type: example
    title: "Example 2: from a given iteration back to the equation"
    problem: |-
      The sequence defined by $x_{n+1} = \dfrac12\left(x_n + \dfrac{7}{x_n}\right)$, $x_1 = 3$, converges to $\alpha$. Find an equation satisfied by $\alpha$, and hence find the exact value of $\alpha$.
    steps:
      - |-
        At the limit, $x_n$ and $x_{n+1}$ are both $\alpha$. Replace both with $\alpha$: $\alpha = \dfrac12\left(\alpha + \dfrac{7}{\alpha}\right)$.
      - |-
        Multiply by 2: $2\alpha = \alpha + \dfrac{7}{\alpha}$.
      - |-
        Take $\alpha$ from both sides: $\alpha = \dfrac{7}{\alpha}$.
      - |-
        Multiply by $\alpha$: $\alpha^2 = 7$.
      - |-
        The terms start at 3 and stay positive, so take the positive root.
    answer: |-
      $\alpha^2 = 7$, so $\alpha = \sqrt7$. This is a favourite exam question: "replace every $x_n$ and $x_{n+1}$ by $\alpha$, then simplify".

  - type: check
    questions: [rearrange-limit]

  - type: example
    title: "Example 3: a full exam-style question"
    problem: |-
      (a) Show that the equation $x^3 - 2x - 5 = 0$ can be written as $x = \sqrt[3]{2x + 5}$.

      (b) Use the iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$ with $x_1 = 2$ to find the root correct to 3 decimal places. Give each iterate to 4 decimal places.
    steps:
      - |-
        (a) $x^3 - 2x - 5 = 0 \;\Rightarrow\; x^3 = 2x + 5 \;\Rightarrow\; x = \sqrt[3]{2x + 5}$. Each step can be reversed, so the two equations have exactly the same solutions.
      - |-
        (b) $x_2 = \sqrt[3]{9} = 2.0801$, $x_3 = 2.0924$, $x_4 = 2.0942$, $x_5 = 2.0945$, $x_6 = 2.0945$.
      - |-
        To 3 d.p., $x_5$ and $x_6$ both give $2.095$ (keep the unrounded calculator values: $2.09450\ldots$ and $2.09454\ldots$). Stop.
      - |-
        $2.09450\ldots$ sits right on a rounding boundary, so it's worth a sign-change check: with $f(x) = x^3 - 2x - 5$, $f(2.0945) \approx -0.0004 < 0$ and $f(2.0955) \approx 0.009 > 0$, so the root really is between them and rounds to $2.095$ ✓
    answer: |-
      (a) shown above. (b) The root is $2.095$ to 3 d.p.

  - type: check
    questions: [rearrange-start]

  - type: misconceptions
    items:
      - wrong: |-
          Any rearrangement $x = F(x)$ will work as an iteration.
        right: |-
          Some settle and some run away. Run a few steps and check that the values close in, or use the rearrangement the question gives.
      - wrong: |-
          $x = \dfrac{x^3 - 5}{2}$ has no roots or fractions in it, so it must be the better choice.
        right: |-
          Simpler-looking algebra says nothing about whether the iteration settles. From $x_1 = 2$ this one runs away.
      - wrong: |-
          If an iteration fails, the equation has no root.
        right: |-
          The root is still there; that particular formula just can't find it. Another rearrangement may work.
      - wrong: |-
          To find the equation for the limit, replace only $x_{n+1}$ by $\alpha$.
        right: |-
          Replace **both** $x_n$ and $x_{n+1}$ by $\alpha$: at the limit they are the same number.

  - type: exam
    body: |-
      - *Show that the equation … can be written as …*: show each algebra step from the given equation to the given form.
      - *Use the iteration … to determine the root correct to 3 d.p.*: write every iterate to 4 d.p., stop when two in a row round to the same 3 d.p. value, then state the root.
      - *The sequence converges to $\alpha$. Find the exact value of $\alpha$*: put $\alpha$ in place of $x_n$ and $x_{n+1}$, then solve.

  - type: takeaways
    items:
      - |-
        Rearrange $f(x) = 0$ into $x = F(x)$, then iterate with $x_{n+1} = F(x_n)$.
      - |-
        If it settles at $\alpha$, then $\alpha = F(\alpha)$, so $\alpha$ is a root of $f(x) = 0$.
      - |-
        Different rearrangements behave differently: some settle, some run away. Check by running a few steps.
      - |-
        For a given iteration, replace $x_n$ and $x_{n+1}$ by $\alpha$ to find the equation it solves.

questions:
  - id: rearrange-ways
    format: text
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      Rearrange $x^2 - 4x + 1 = 0$ into the form $x = F(x)$ by moving the $4x$ term to one side on its own and then dividing by 4. Type it like `x = (x^2 + 1)/4`.
    accept:
      - x = (x^2 + 1)/4
      - x = (x^2+1)/4
      - x = (1 + x^2)/4
      - x = x^2/4 + 1/4
      - x = (1+x^2)/4
      - x = 0.25x^2 + 0.25
    model: |-
      $x = \dfrac{x^2 + 1}{4}$
    explanation: |-
      $x^2 - 4x + 1 = 0 \Rightarrow x^2 + 1 = 4x \Rightarrow x = \dfrac{x^2 + 1}{4}$. Other valid forms include $x = \sqrt{4x - 1}$ and $x = 4 - \dfrac1x$.

  - id: rearrange-which-converges
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      For $x^3 - 2x - 5 = 0$, each rearrangement is run from $x_1 = 2$. Which one settles on the root?
    options:
      - text: $x = \sqrt[3]{2x + 5}$
        correct: true
        why: |-
          It gives $2.0801, 2.0924, 2.0942, 2.0945, \dots$: each change is smaller than the last, so it settles on $2.095$.
      - text: $x = \dfrac{x^3 - 5}{2}$
        why: |-
          It gives $1.5, -0.8125, -2.7682, -13.1, \dots$: the values run away.
      - text: $x = \dfrac{5}{x^2 - 2}$
        why: |-
          It gives $2.5, 1.1765, -8.118, \dots$: the values jump about and never close in.
      - text: All three settle on the root
        why: |-
          Only the cube-root form settles; the other two move away from $x_1 = 2$.
    explanation: |-
      Run each formula for a few steps. Only $x = \sqrt[3]{2x + 5}$ produces values that change by less and less.

  - id: rearrange-valid
    format: cloze
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      Rearrange $x^3 + 3x - 2 = 0$ into the form $x = $ {{1}} by taking a cube root.
    blanks:
      - accept: ["(2-3x)^(1/3)", "(2 - 3x)^(1/3)", "cbrt(2-3x)", "cbrt(2 - 3x)", "x = (2 - 3x)^(1/3)", "\\sqrt[3]{2 - 3x}", "(2 - 3x)^{1/3}", "cube root of (2 - 3x)", "x = \\sqrt[3]{2 - 3x}", "x = (2 - 3x)^{1/3}"]
    explanation: |-
      $x^3 + 3x - 2 = 0 \Rightarrow x^3 = 2 - 3x \Rightarrow x = \sqrt[3]{2 - 3x}$.

  - id: rearrange-limit
    format: numeric
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      The sequence $x_{n+1} = \dfrac{x_n^2 + 6}{5}$, $x_1 = 1$, converges to $\alpha$. Find an equation satisfied by $\alpha$ and solve it. The sequence starts at 1 and increases towards the **smaller** solution. What is $\alpha$?
    fields:
      - label: "α ="
        answer: 2
    explanation: |-
      Replace $x_n$ and $x_{n+1}$ by $\alpha$: $\alpha = \dfrac{\alpha^2 + 6}{5}$, so $5\alpha = \alpha^2 + 6$ and $\alpha^2 - 5\alpha + 6 = 0$.

      Factorise: $(\alpha - 2)(\alpha - 3) = 0$, so $\alpha = 2$ or $3$. The terms go $1, 1.4, 1.592, 1.707, \dots$, creeping up to 2, so $\alpha = 2$.

  - id: rearrange-start
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      The iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$ with $x_1 = 2$ settles on the root of $x^3 - 2x - 5 = 0$. What happens if you start at $x_1 = -2$ instead?
    options:
      - text: It still settles on the same root, after a few extra steps
        correct: true
        why: |-
          It goes $-2, 1, 1.913, 2.067, 2.090, \dots$ and still settles on $2.095$.
      - text: It runs away to infinity
        why: |-
          Try it: the values head straight towards $2.095$.
      - text: It settles on a different root
        why: |-
          $x^3 - 2x - 5 = 0$ has only one real root (about $2.095$), so there is no other to find.
      - text: It jumps between two values forever
        why: |-
          Run it and you'll see the values close in on $2.095$.
    explanation: |-
      $x_2 = \sqrt[3]{-4 + 5} = 1$, $x_3 = \sqrt[3]{7} = 1.913$, $x_4 = 2.067$, $x_5 = 2.090$. It closes in on $2.095$, just from further away.
