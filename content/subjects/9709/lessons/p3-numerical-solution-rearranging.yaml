id: p3-numerical-solution-rearranging
subject: "9709"
topic: "3.6"
title: Rearranging equations into iteration form
summary: Learn to rearrange f(x) = 0 into x = F(x) to create your own iterative formula, and understand why some rearrangements converge while others diverge.
order: 4
minutes: 9
kind: core
objectives: ["3.6.3"]
prerequisites: [p3-numerical-solution-using-iteration]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.6 outcome "Understand how a given simple iterative formula
    of the form xₙ₊₁ = F(xₙ) relates to the equation being solved, and use a given iteration,
    or an iteration based on a given rearrangement of an equation, to determine a root to a
    prescribed degree of accuracy". All examples, questions and diagrams are original; every
    value and answer key was computed in Python.
blocks:
  - type: objective
    body: |-
      By the end you can rearrange f(x) = 0 into x = F(x) in different ways, choose a starting value, and predict whether the iteration will converge.

  - type: explain
    title: The link between equation and iteration
    body: |-
      If α is a root of f(x) = 0, then f(α) = 0. If you can rearrange this to **α = F(α)**, then α is a **fixed point** of F — it satisfies x = F(x).

      The iteration xₙ₊₁ = F(xₙ) tries to find that fixed point by repeated substitution. If it converges, the limit satisfies L = F(L), which means f(L) = 0. So the limit *is* a root.

      **Key insight:** every rearrangement x = F(x) gives a *different* iteration. Some converge; some don't. Your job is to pick a good one.

  - type: example
    title: "Example 1: multiple rearrangements of the same equation"
    problem: |-
      The equation x³ − 2x − 5 = 0 has a root near 2. Rearrange it in three different ways as x = F(x).
    steps:
      - |-
        Add 2x + 5: x³ = 2x + 5 → x = ∛(2x + 5)  (take cube root)
      - |-
        Factor x: x(x² − 2) = 5 → x = 5/(x² − 2)  (divide by x² − 2)
      - |-
        Add 5: x³ − 2x = 5 → x = (x³ − 5)/2  (divide by 2)
    answer: |-
      Three valid rearrangements: x = ∛(2x + 5), x = 5/(x² − 2), x = (x³ − 5)/2.

  - type: diagram
    diagram: p3-numerical-solution-rearranging-cobweb
    alt: >-
      Cobweb diagram showing two iterations for x³ − 2x − 5 = 0. Left: x = ∛(2x + 5) spirals
      in to the root (converges). Right: x = (x³ − 5)/2 spirals out (diverges). Both are
      cobweb plots of y = F(x) against y = x.
    caption: |-
      Same equation, two rearrangements. One spirals in (converges), the other spirals out (diverges).

  - type: check
    questions: [rearrange-ways, rearrange-which-converges]

  - type: explain
    title: How to tell whether it works — run it and watch
    body: |-
      The syllabus does **not** ask you to prove whether an iteration converges. It asks you to
      understand that an iteration **may fail**, and to recognise failure when you see it.

      So run a few steps and look at the numbers:

      - **Settling:** the values change by less and less each step. That iteration is working.
      - **Running away or bouncing:** the values grow, jump about, or never close in. That
        iteration has failed, even though the equation still has a root.

      For $x^3 - 2x - 5 = 0$ with $x_1 = 2$, the three rearrangements behave like this:

      | Rearrangement | $x_1$ | $x_2$ | $x_3$ | $x_4$ | Verdict |
      | --- | --- | --- | --- | --- | --- |
      | $x = \sqrt[3]{2x + 5}$ | $2$ | $2.0801$ | $2.0924$ | $2.0942$ | settles near $2.095$ |
      | $x = \dfrac{x^3 - 5}{2}$ | $2$ | $1.5$ | $-0.8125$ | $-2.7682$ | runs away |
      | $x = \dfrac{5}{x^2 - 2}$ | $2$ | $2.5$ | $1.1765$ | $-8.118$ | jumps about |

      Same equation, same starting value, three very different outcomes. If a question tells
      you which rearrangement to use, it will be one that works; if you choose, try one and
      check that it settles.

  - type: enrichment
    title: Beyond the syllabus — why some rearrangements fail
    body: |-
      Near a root $\alpha$, each step multiplies the error by roughly $F'(\alpha)$, the gradient of
      $y = F(x)$ at the root. If $|F'(\alpha)| < 1$ the error shrinks and the iteration settles; if
      $|F'(\alpha)| > 1$ it grows.

      For $F(x) = \sqrt[3]{2x + 5}$, $F'(\alpha) \approx 0.15$ near the root, so the error shrinks fast.
      For $F(x) = \dfrac{x^3 - 5}{2}$, the gradient is far bigger than 1 (even at $x = 2$, $F'(2) = 6$),
      so each step makes the error bigger.

      You will not be asked to use this test in 9709; it is here to explain the table above.

  - type: example
    title: "Example 2: choosing a starting value for a given rearrangement"
    problem: |-
      For x³ − 2x − 5 = 0, the iteration xₙ₊₁ = ∛(2xₙ + 5) is used.
      (a) Show that this rearrangement is valid.
      (b) With x₁ = 2, find the root to 3 d.p.
      (c) Show that the rearrangement x = (x³ − 5)/2, started at x₁ = 2, does not find the root.
    steps:
      - |-
        (a) x³ − 2x − 5 = 0 → x³ = 2x + 5 → x = ∛(2x + 5). Every step is reversible, so a value that
        satisfies x = ∛(2x + 5) also satisfies the original equation.
      - |-
        (b) x₂ = ∛(4 + 5) = ∛9 = 2.0801; x₃ = ∛(9.1602) = 2.0924; x₄ = 2.0942; x₅ = 2.0945; x₆ = 2.0945.
        x₅ and x₆ both round to 2.095, so the root is 2.095 (3 d.p.).
      - |-
        (c) x₂ = (8 − 5)/2 = 1.5, x₃ = (3.375 − 5)/2 = −0.8125, x₄ = −2.7682, x₅ = −13.106. The values
        move further from 2.095 every step, so this iteration fails to converge.
    answer: |-
      (a) x³ = 2x + 5 → x = ∛(2x + 5). (b) Root = 2.095 (3 d.p.). (c) The values run away
      (1.5, −0.81, −2.77, −13.1, …), so that rearrangement does not converge to the root.

  - type: check
    questions: [rearrange-valid, rearrange-start]

  - type: misconceptions
    items:
      - wrong: |-
          Any rearrangement x = F(x) will work as an iteration.
        right: |-
          Some settle, some run away. Run a few steps and check that the values close in (or use
          the rearrangement the question gives you).
      - wrong: |-
          The rearrangement x = (x³ − 5)/2 is simpler (no roots), so it must be better.
        right: |-
          Simpler algebra is not better convergence. From x₁ = 2 it gives 1.5, −0.81, −2.77, −13.1:
          it runs away from the root instead of settling.
      - wrong: |-
          If the iteration diverges, the equation has no root.
        right: |-
          The equation has a root (sign change proves it). The *formula* just fails to find it. A different rearrangement would work.
      - wrong: |-
          You must always derive the iteration formula yourself in the exam.
        right: |-
          Most questions **give** you the formula. Only "rearrange the equation… hence use the iteration" questions ask you to do the algebra step.

  - type: exam
    body: |-
      - "Rearrange the equation… to the form x = F(x)" — do the algebra, show the steps.
      - "Hence use the iteration… with x₁ = … to find the root…" — now just compute.
      - Keep at least 4 decimal places in every iterate, and stop when two in a row agree to the
        accuracy asked for.
      - If your values grow or jump about, recheck your arithmetic and the formula. If they are
        right, say plainly that the iteration does not converge.

  - type: takeaways
    items:
      - |-
        A root of f(x) = 0 is a fixed point of x = F(x). Different rearrangements give different F.
      - |-
        Some rearrangements settle on the root and some run away: run a few steps and check.
      - |-
        If a question gives you the rearrangement, use it; if you choose one, check that its values settle.
      - |-
        In the exam: if given the formula, just run it. If asked to rearrange, do the algebra then run it.

questions:
  - id: rearrange-ways
    format: text
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      The equation x² − 4x + 1 = 0 can be rearranged to x = F(x) in at least two ways. Write down two different valid forms.
    accept:
      - x = (x^2 + 1)/4 and x = sqrt(4x - 1)
      - x = 4 - 1/x and x = (x^2 + 1)/4
      - x = 4 - 1/x and x = sqrt(4x - 1)
      - x = (x^2 + 1)/4
      - x = sqrt(4x - 1)
      - x = 4 - 1/x
    model: |-
      Three common forms: (1) x = (x² + 1)/4, (2) x = √(4x − 1) (for the larger root), (3) x = 4 − 1/x. Any two are correct.
    explanation: |-
      x² − 4x + 1 = 0 → x² + 1 = 4x → x = (x² + 1)/4. Also x² = 4x − 1 → x = √(4x − 1). Also 4x = x² + 1 → 4 = x + 1/x → x = 4 − 1/x.

  - id: rearrange-which-converges
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      For x³ − 2x − 5 = 0, each rearrangement is run from x₁ = 2. Which one settles on the root?
    options:
      - text: x = ∛(2x + 5)
        correct: true
        why: |-
          It gives 2.0801, 2.0924, 2.0942, 2.0945, … — the changes shrink each step, so it settles on 2.095.
      - text: x = (x³ − 5)/2
        why: |-
          It gives 1.5, −0.8125, −2.7682, −13.106, … — the values run away from the root.
      - text: x = 5/(x² − 2)
        why: |-
          It gives 2.5, 1.1765, −8.118, … — the values jump about and never close in.
      - text: All three settle on the root
        why: |-
          Only the cube-root form settles; the other two run away from x₁ = 2.
    explanation: |
      Run each formula for a few steps. Only $x = \sqrt[3]{2x + 5}$ produces values that change by less and less ($2.0801, 2.0924, 2.0942, \dots$). The other two move further from the root, which is what "fails to converge" looks like.

  - id: rearrange-valid
    format: cloze
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |-
      Rearrange x³ + 3x − 2 = 0 into the form x = {{1}} by taking a cube root.
    blanks:
      - accept: ["x = \\sqrt[3]{2 - 3x}", "x = (2 - 3x)^{1/3}", "cube root of (2 - 3x)"]
    explanation: |-
      x³ + 3x − 2 = 0 → x³ = 2 − 3x → x = ∛(2 − 3x).

  - id: rearrange-start
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: |-
      The iteration xₙ₊₁ = ∛(2xₙ + 5) with x₁ = 2 converges to the root of x³ − 2x − 5 = 0. If you started with x₁ = −2 instead, what would happen?
    options:
      - text: It would still converge, but take more steps
        correct: true
        why: |-
          The sequence goes −2 → 1 → 1.913 → 2.067 → 2.090 → … and still settles on 2.095. Starting further away only costs a few extra steps.
      - text: It would diverge to infinity
        why: |-
          The cube root function is defined for all real numbers; it cannot blow up.
      - text: It would converge to a different root
        why: |-
          The cubic x³ − 2x − 5 = 0 has only one real root (≈ 2.095). There is no other real root to converge to.
      - text: It would oscillate between two values forever
        why: |-
          The iteration does not have a period-2 cycle; it converges.
    explanation: |
      Run it: $x_2 = \sqrt[3]{-4 + 5} = 1$, $x_3 = \sqrt[3]{7} \approx 1.913$, $x_4 \approx 2.067$, $x_5 \approx 2.090$. The values close in on $2.095$, just from further away, so it takes a few more steps.