id: quadratics-discriminant
subject: "9709"
topic: "1.1"
title: The discriminant and the nature of roots
summary: Use b² − 4ac to decide whether ax² + bx + c = 0 has two distinct real roots, a repeated root or no real roots.
order: 3
minutes: 7
kind: core
objectives: ["1.1.2"]
prerequisites: [quadratics-solving-equations]
