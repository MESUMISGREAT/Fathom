id: probability-sample-space
subject: "9709"
topic: "5.3"
title: Sample spaces and equally likely outcomes
summary: List the sample space of a simple experiment and use it to find probabilities by counting equally likely outcomes, including the probability that an event does not happen.
order: 1
minutes: 7
kind: core
objectives: ["5.3.1"]
prerequisites: []
