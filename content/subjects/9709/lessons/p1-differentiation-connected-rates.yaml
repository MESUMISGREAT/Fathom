id: p1-differentiation-connected-rates
subject: "9709"
topic: "1.7"
title: Rates of change and connected rates
summary: Find how fast one thing changes from how fast another changes. Differentiate the formula that links them, write the chain, then multiply or divide. Circles, balloons and cubes.
order: 6
minutes: 5
kind: core
objectives: ["1.7.3"]
prerequisites: [p1-differentiation-chain-rule]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.7 learning outcome "apply differentiation
    to ... rates of change", including connected rates of change such as finding the rate of
    increase of the area of a circle from the rate of increase of its radius. The sphere volume
    formula V = (4/3)πr³ is stated in the questions. All examples and questions are original,
    with made-up illustrative rates; all arithmetic checked in Python. Not yet teacher-reviewed.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
    Rewritten on 2026-10-24 at the student's request in a one-question-type, one-method style; needs a fresh independent review.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-24. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can answer *"the radius is increasing at 0.5 cm per second; find the rate of increase of the area"*, and say what a rate like $\dfrac{dV}{dt} = -3$ means.

  - type: explain
    title: What they ask
    body: |-
      A typical question: *The radius of a circle is increasing at $0.5\ \text{cm s}^{-1}$. Find the rate of increase of its area when the radius is 6 cm.*

      Giveaway words: **rate of change**, **rate of increase**, **per second**, **at the instant when**.

      - A **rate** is how fast something changes with time $t$. It has $dt$ on the bottom: $\dfrac{dr}{dt}$ is how fast $r$ changes.
      - Increasing means a positive rate. **Decreasing** means a **negative** rate.

  - type: explain
    title: The method
    body: |-
      The same four steps every time:

      1. Know and want: write the rate you're given and the rate you want, e.g. know $\dfrac{dr}{dt} = 0.5$, want $\dfrac{dA}{dt}$.
      2. Differentiate the formula that links the two letters, e.g. $A = \pi r^2$ gives $\dfrac{dA}{dr} = 2\pi r$.
      3. **Chain: write $\dfrac{dA}{dt} = \dfrac{dA}{dr} \times \dfrac{dr}{dt}$ with your letters, before any numbers.** Check it like fractions: the $dr$s cancel to leave $\dfrac{dA}{dt}$.
      4. Numbers: put the values in and solve for the rate you want.

  - type: diagram
    diagram: p1-differentiation-rates-chain
    alt: >-
      Two rows showing the same chain. Top row, circle (area from radius): dA/dt = dA/dr × dr/dt,
      with dA/dt labelled want, dA/dr labelled differentiate and dr/dt labelled know. Beside it:
      want is on the left, so multiply. Bottom row, balloon (radius from volume): dV/dt = dV/dr ×
      dr/dt, with dV/dt labelled know, dV/dr labelled differentiate and dr/dt labelled want. Beside
      it: want is on the right, so divide. Bottom line: right way round? The dr's cancel: dA/dr
      times dr/dt equals dA/dt, with both dr's crossed out.
    caption: |-
      You never have to guess whether to multiply or divide. Write the chain, then see where the rate you want sits.

  - type: example
    title: "Example 1: the easiest case"
    problem: |-
      The radius of a circle is increasing at $0.5\ \text{cm s}^{-1}$. Find the rate at which its area is increasing when the radius is 6 cm.
    steps:
      - |-
        Know and want: know $\dfrac{dr}{dt} = 0.5$. Want $\dfrac{dA}{dt}$ when $r = 6$.
      - |-
        Differentiate: $A = \pi r^2$, so $\dfrac{dA}{dr} = 2\pi r$.
      - |-
        Chain: $\dfrac{dA}{dt} = \dfrac{dA}{dr} \times \dfrac{dr}{dt}$.
      - |-
        Numbers: $\dfrac{dA}{dt} = 2\pi(6) \times 0.5 = 6\pi$.
    answer: |-
      The area is increasing at $6\pi \approx 18.8\ \text{cm}^2\,\text{s}^{-1}$.

  - type: check
    questions: [rate-meaning, rate-of-y, circle-rate]

  - type: diagram
    diagram: p1-differentiation-growing-circle
    alt: >-
      A shaded circle of radius r, labelled area A = πr², surrounded by a thin ring with a dashed
      outer edge; a small double arrow marks the ring's width. Text beside it: the new ring is
      approximately a strip 2πr long and very thin, so the extra area is approximately 2πr times
      the extra radius, so A grows 2πr times as fast as r: dA/dr = 2πr, the circumference. Below a
      line: if r grows with time t, dA/dt = dA/dr × dr/dt.
    caption: |-
      Why is $\dfrac{dA}{dr} = 2\pi r$? A tiny bit more radius adds a thin ring, which is almost a strip as long as the circumference, $2\pi r$.

  - type: example
    title: "Example 2: exam-style"
    problem: |-
      Air is pumped into a spherical balloon at $10\ \text{cm}^3\,\text{s}^{-1}$. Find the rate at which the radius is increasing when the radius is 5 cm. (The volume of a sphere is $V = \dfrac{4}{3}\pi r^3$.)
    steps:
      - |-
        Know and want: know $\dfrac{dV}{dt} = 10$. Want $\dfrac{dr}{dt}$ when $r = 5$.
      - |-
        Differentiate: $V = \dfrac{4}{3}\pi r^3$, so $\dfrac{dV}{dr} = 4\pi r^2$. At $r = 5$ that's $100\pi$.
      - |-
        Chain: $\dfrac{dV}{dt} = \dfrac{dV}{dr} \times \dfrac{dr}{dt}$.
      - |-
        Numbers: $10 = 100\pi \times \dfrac{dr}{dt}$, so $\dfrac{dr}{dt} = \dfrac{10}{100\pi} = \dfrac{1}{10\pi}$.
    answer: |-
      $\dfrac{dr}{dt} = \dfrac{1}{10\pi} \approx 0.0318\ \text{cm s}^{-1}$.

      The rate you wanted was on the right of the chain, so you divided. Writing the chain first meant no guessing.

  - type: check
    questions: [sphere-rate, spot-divide]

  - type: misconceptions
    items:
      - wrong: |-
          Put $r = 6$ into $A = \pi r^2$ first: $A = 36\pi$, so $\dfrac{dA}{dr} = 0$.
        right: |-
          Differentiate the **formula** first (step 2), *then* put $r = 6$ in (step 4). A number always differentiates to 0.
      - wrong: |-
          $\dfrac{dr}{dt} = \dfrac{dV}{dt} \times \dfrac{dV}{dr}$
        right: |-
          Write the chain first: $\dfrac{dV}{dt} = \dfrac{dV}{dr} \times \dfrac{dr}{dt}$. Then $\dfrac{dr}{dt} = \dfrac{dV}{dt} \div \dfrac{dV}{dr}$.
      - wrong: |-
          "The volume is decreasing at 3 cm³ per second", so $\dfrac{dV}{dt} = 3$.
        right: |-
          Decreasing means a negative rate: $\dfrac{dV}{dt} = -3$.

  - type: exam
    body: |-
      - Usually 3–4 marks.
      - Write the chain with the real letters, e.g. $\dfrac{dA}{dt} = \dfrac{dA}{dr} \times \dfrac{dr}{dt}$, before any numbers. That line earns the method mark.
      - Give units, and an exact answer ($6\pi$) or 3 significant figures ($18.8$), as asked.

  - type: takeaways
    items:
      - |-
        The method: know and want, differentiate the formula, **write the chain**, put the numbers in.
      - |-
        $\dfrac{dV}{dt}$ is how fast $V$ changes each second. Negative means decreasing.
      - |-
        Differentiate the formula first, put numbers in second.
      - |-
        The chain decides multiply or divide, so never guess.

questions:
  - id: rate-meaning
    format: mcq
    difficulty: 1
    objectives: ["1.7.3"]
    prompt: |-
      $V\ \text{cm}^3$ is the volume of water in a tank $t$ seconds after a tap is opened.

      At one moment $\dfrac{dV}{dt} = -3$. What does this mean?
    explanation: |-
      Know and want (step 1) starts with reading rates like this. $\dfrac{dV}{dt}$ is how fast the volume changes each second, and negative means it's going down: by $3\ \text{cm}^3$ every second.
    options:
      - text: The volume is decreasing at $3\ \text{cm}^3$ per second.
        correct: true
        why: |-
          A rate of $-3\ \text{cm}^3\,\text{s}^{-1}$: the volume falls by about $3\ \text{cm}^3$ each second.
      - text: The volume is $-3\ \text{cm}^3$.
        why: |-
          $\dfrac{dV}{dt}$ is how fast $V$ changes, not $V$ itself (and a volume can't be negative).
      - text: The volume is increasing at $3\ \text{cm}^3$ per second.
        why: |-
          The minus sign means decreasing.
      - text: Time is going down by 3 seconds per cm³.
        why: |-
          That reads the rate upside down. $\dfrac{dV}{dt}$ is the change in $V$ for each second.

  - id: rate-of-y
    format: numeric
    difficulty: 2
    objectives: ["1.7.3"]
    prompt: |-
      A point moves along the curve $y = x^2 + 4x$ so that its $x$-coordinate increases at $0.3$ units per second. Find the rate at which its $y$-coordinate is increasing when $x = 2$.
    fields:
      - answer: 2.4
        unit: units per second
    explanation: |-
      - Know and want: know $\dfrac{dx}{dt} = 0.3$. Want $\dfrac{dy}{dt}$ when $x = 2$.
      - Differentiate: $\dfrac{dy}{dx} = 2x + 4 = 8$ at $x = 2$.
      - Chain: $\dfrac{dy}{dt} = \dfrac{dy}{dx} \times \dfrac{dx}{dt}$.
      - Numbers: $\dfrac{dy}{dt} = 8 \times 0.3 = 2.4$.

  - id: circle-rate
    format: numeric
    difficulty: 2
    objectives: ["1.7.3"]
    prompt: |-
      The radius of a circle increases at $0.4\ \text{cm s}^{-1}$. Find the rate of increase of its area when the radius is 10 cm.

      Give an exact answer or 3 significant figures.
    fields:
      - answer: 25.132741228718345
        tolerance: { abs: 0.05 }
        unit: cm² s⁻¹
    explanation: |-
      - Know and want: know $\dfrac{dr}{dt} = 0.4$. Want $\dfrac{dA}{dt}$ when $r = 10$.
      - Differentiate: $\dfrac{dA}{dr} = 2\pi r = 20\pi$ at $r = 10$.
      - Chain: $\dfrac{dA}{dt} = \dfrac{dA}{dr} \times \dfrac{dr}{dt}$.
      - Numbers: $\dfrac{dA}{dt} = 20\pi \times 0.4 = 8\pi \approx 25.1\ \text{cm}^2\,\text{s}^{-1}$.

  - id: sphere-rate
    format: numeric
    difficulty: 3
    objectives: ["1.7.3"]
    prompt: |-
      The volume of a sphere, $V = \tfrac43\pi r^3$, is increasing at $20\ \text{cm}^3\,\text{s}^{-1}$. Find the rate of increase of the radius when $r = 4$ cm, to 3 significant figures.
    fields:
      - answer: 0.0994718394324346
        sigFigs: 3
        unit: cm s⁻¹
    explanation: |-
      - Know and want: know $\dfrac{dV}{dt} = 20$. Want $\dfrac{dr}{dt}$ when $r = 4$.
      - Differentiate: $\dfrac{dV}{dr} = 4\pi r^2 = 64\pi$ at $r = 4$.
      - Chain: $\dfrac{dV}{dt} = \dfrac{dV}{dr} \times \dfrac{dr}{dt}$.
      - Numbers: $20 = 64\pi \times \dfrac{dr}{dt}$, so $\dfrac{dr}{dt} = \dfrac{20}{64\pi} = \dfrac{5}{16\pi} = 0.0995\ \text{cm s}^{-1}$ (3 s.f.).

  - id: spot-divide
    format: spot-error
    difficulty: 2
    objectives: ["1.7.3"]
    prompt: |-
      The volume of a cube of side $x$ cm is increasing at $6\ \text{cm}^3\,\text{s}^{-1}$. A student finds the rate of increase of $x$ when $x = 2$.

      Which line contains the first error?
    lines:
      - |-
        $V = x^3$, so $\dfrac{dV}{dx} = 3x^2 = 12$ when $x = 2$.
      - |-
        $\dfrac{dx}{dt} = \dfrac{dV}{dt} \times \dfrac{dV}{dx} = 6 \times 12$
      - |-
        $= 72\ \text{cm s}^{-1}$
    errorLine: 2
    fix: |-
      $\dfrac{dV}{dt} = \dfrac{dV}{dx} \times \dfrac{dx}{dt}$, so $\dfrac{dx}{dt} = \dfrac{dV}{dt} \div \dfrac{dV}{dx} = \dfrac{6}{12} = 0.5\ \text{cm s}^{-1}$.
    explanation: |-
      Line 1 is step 2, done right. Line 2 skips step 3: it never writes the chain, so it multiplies when it should divide.

      Sanity check: a cube of side 2 cm gaining only $6\ \text{cm}^3$ a second can't have its side growing at 72 cm a second.
