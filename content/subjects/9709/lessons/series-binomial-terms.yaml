id: series-binomial-terms
subject: "9709"
topic: "1.6"
title: Finding one term of a binomial expansion
summary: Pick out a single term or coefficient of (a + b)ⁿ, including the term independent of x and terms of a product like (2 + x)(1 − 2x)⁵.
order: 2
minutes: 7
kind: core
objectives: ["1.6.1"]
prerequisites: [series-binomial-expansion]
