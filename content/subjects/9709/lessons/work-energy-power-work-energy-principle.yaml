id: work-energy-power-work-energy-principle
subject: "9709"
topic: "4.5"
title: "Work-energy principle and conservation of mechanical energy"
summary: "Apply the work-energy principle: net work = change in kinetic energy. Understand conservation of mechanical energy when only conservative forces act."
order: 3
minutes: 8
kind: core
objectives: ["4.5.3"]
prerequisites: ["work-energy-power-gpe-ke"]
