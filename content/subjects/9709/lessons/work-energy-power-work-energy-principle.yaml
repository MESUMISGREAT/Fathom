blocks:
  - type: objective
    body: |-
      By the end you can use energy as a bookkeeping system: link the work done by forces to the change in kinetic and potential energy, and use conservation of energy when nothing else does work.

  - type: explain
    title: The pieces you already have
    body: |-
      Quick recap of the three ideas this lesson joins together (all measured in joules, J):

      - **Work done by a force** $= Fd\cos\theta$, where $F$ is the force in newtons, $d$ is the distance moved in metres, and $\theta$ is the angle between the force and the direction of motion. If the force is along the motion, $\cos 0 = 1$ and the work is just $Fd$.
      - **Kinetic energy** (KE), the energy of movement: $\tfrac12 mv^2$, where $m$ is the mass in kg and $v$ the speed in m s⁻¹.
      - **Gravitational potential energy** (GPE), the energy of height: $mgh$, where $h$ is the height above a level you choose as zero. Take $g = 10\text{ m s}^{-2}$.

      The symbol $\Delta$ ("delta") means "change in", so $\Delta\text{KE}$ is the final KE minus the initial KE.

  - type: explain
    title: Energy as a bank account
    body: |-
      Think of an object's energy (its KE plus its GPE) as a bank balance.

      - A force that pushes **with** the motion (an engine, a pull, a push) does positive work: it **pays in**.
      - A force that acts **against** the motion (friction, air resistance) **takes money out**, turning energy into heat and sound. We write this as a positive amount, the *work done against* the resistance (force × distance), and subtract it.
      - Gravity is already counted in the GPE, so don't count it again as work. (Equivalently, the work done by gravity equals the GPE lost; use one or the other, never both.) Normal reactions are at right angles to the motion, so they do no work at all ($\cos 90^\circ = 0$).

      That gives the one equation this lesson is about, the **work–energy principle**:

      $$\text{work done by driving forces} - \text{work done against resistances} = \Delta\text{KE} + \Delta\text{GPE}.$$

      Here "driving forces" means anything except gravity that helps the motion: an engine, a push or a pull. In words: what you pay in, minus what's taken out, equals how much the balance changed.

  - type: intuition
    title: Why is this true?
    body: |-
      It comes from $F = ma$ and the equation $v^2 = u^2 + 2as$ (where $u$ is the start speed and $s$ the distance).

      For a resultant force $F$ along the motion, $a = \tfrac{F}{m}$, so $v^2 = u^2 + 2\tfrac{F}{m}s$. Multiply through by $\tfrac12 m$:

      $$\tfrac12 mv^2 - \tfrac12 mu^2 = Fs.$$

      The left side is the change in KE; the right side is the work done by the resultant force. Moving gravity's share of that work over to the GPE side gives the bank-account equation.

  - type: explain
    title: The special case — conservation of energy
    body: |-
      If no forces other than gravity do any work (the surface is **smooth**, there's no air resistance and no engine), nothing is paid in or taken out. The balance stays the same:

      $$\text{KE}_{\text{start}} + \text{GPE}_{\text{start}} = \text{KE}_{\text{end}} + \text{GPE}_{\text{end}}.$$

      This is the **principle of conservation of energy**. Energy just swaps between height and speed.

      A big bonus: it only cares about the start and the end, not the path. So it works for **curved** slides and ramps, where $F = ma$ would be very hard because the forces keep changing direction.

  - type: example
    title: A smooth curved slide
    problem: |-
      A child of mass $30\text{ kg}$ starts from rest at the top of a smooth curved slide and comes off the bottom, $3.2\text{ m}$ lower. Find the child's speed at the bottom.
    steps:
      - |-
        Smooth, so no friction: energy is conserved. Measure heights from the bottom of the slide.
      - |-
        Start: KE $= 0$ (at rest), GPE $= 30 \times 10 \times 3.2 = 960\text{ J}$.
      - |-
        End: KE $= \tfrac12 \times 30 \times v^2 = 15v^2$, GPE $= 0$.
      - |-
        Conservation: $0 + 960 = 15v^2 + 0$, so $v^2 = 64$ and $v = 8\text{ m s}^{-1}$.
    answer: |-
      $8\text{ m s}^{-1}$. The shape of the slide doesn't matter, only the drop in height. (The mass cancels too: $mgh = \tfrac12 mv^2$ gives $v = \sqrt{2gh}$ for any $m$.)

  - type: example
    title: The same slide, but not smooth
    problem: |-
      On a real slide the child arrives at the bottom with speed $7\text{ m s}^{-1}$. How much work was done against resistance?
    steps:
      - |-
        GPE lost $= 960\text{ J}$ (as before).
      - |-
        KE gained $= \tfrac12 \times 30 \times 7^2 = 735\text{ J}$.
      - |-
        The rest was taken out by resistance: $960 - 735 = 225\text{ J}$.
    answer: |-
      $225\text{ J}$ of work was done against resistance. In bank-account form: $0 - W = \Delta\text{KE} + \Delta\text{GPE} = 735 - 960$, so $W = 225$.

  - type: example
    title: Sliding down a rough slope
    problem: |-
      A block of mass $2\text{ kg}$ slides $5\text{ m}$ down a rough slope inclined at $30^\circ$ to the horizontal, starting from rest. The frictional force is a constant $4\text{ N}$. Find its speed at the bottom.
    steps:
      - |-
        Height lost: the block moves $5\text{ m}$ along the slope, so it drops $5\sin 30^\circ = 2.5\text{ m}$ vertically (opposite side of the right-angled triangle).
      - |-
        GPE lost $= 2 \times 10 \times 2.5 = 50\text{ J}$. This is paid into KE.
      - |-
        Work done against friction $= 4 \times 5 = 20\text{ J}$. Friction acts along the whole $5\text{ m}$ path, so use the distance along the slope, not the height.
      - |-
        KE gained $= 50 - 20 = 30\text{ J}$, so $\tfrac12 \times 2 \times v^2 = 30$, $v^2 = 30$.
    answer: |-
      $v = \sqrt{30} \approx 5.48\text{ m s}^{-1}$.

  - type: example
    title: A pull at an angle
    problem: |-
      A crate of mass $10\text{ kg}$ is moving at $1\text{ m s}^{-1}$ along a rough horizontal floor. It is pulled $8\text{ m}$ by a rope with tension $50\text{ N}$ at $20^\circ$ above the horizontal. The friction is $20\text{ N}$. Find its new speed.
    steps:
      - |-
        Work done by the pull $= Fd\cos\theta = 50 \times 8 \times \cos 20^\circ = 375.9\text{ J}$ (only the horizontal part of the pull does work).
      - |-
        Work done against friction $= 20 \times 8 = 160\text{ J}$.
      - |-
        Level floor, so $\Delta\text{GPE} = 0$. Work–energy: $375.9 - 160 = \tfrac12 \times 10 \times v^2 - \tfrac12 \times 10 \times 1^2$.
      - |-
        $215.9 = 5v^2 - 5$, so $v^2 = 44.18$.
    answer: |-
      $v \approx 6.65\text{ m s}^{-1}$.

  - type: check
    title: Check yourself
    questions: [wep-friction, wep-conservation, wep-signs]

  - type: misconceptions
    items:
      - wrong: |-
          Energy is always conserved, so KE + GPE is always constant.
        right: |-
          Total energy is conserved, but friction turns some into heat. KE + GPE stays constant only if no resistances or driving forces do work.
      - wrong: |-
          Work done against friction on a slope is friction × height.
        right: |-
          Friction acts along the path, so use the distance travelled along the slope.
      - wrong: |-
          Count the work done by gravity **and** the change in GPE.
        right: |-
          They're the same thing. Use one or the other, never both.
      - wrong: |-
          The normal reaction does work on a slope.
        right: |-
          It's at right angles to the motion, so it does no work.

  - type: exam
    body: |-
      - Say which principle you're using: "by conservation of energy" (smooth) or "by the work–energy principle" (rough or driven).
      - Choose a zero level for GPE and say what it is, often the lowest point.
      - Write each energy term separately before combining: "PE loss $= 50$, WD against friction $= 20$, KE gain $= 30$". Each is often worth a mark.
      - For curved paths, energy is usually the only sensible method.

  - type: takeaways
    items:
      - |-
        Work done by driving forces $-$ work done against resistances $= \Delta\text{KE} + \Delta\text{GPE}$.
      - |-
        No resistances or driving forces (smooth): KE + GPE stays constant.
      - |-
        Energy only cares about start and end, so it works on curved paths.
      - |-
        Friction's work uses the distance along the path; GPE uses the vertical height.

questions:
  - id: wep-friction
    format: numeric
    difficulty: 2
    objectives: ["4.5.3"]
    prompt: |-
      A box of mass $3\text{ kg}$ slides $4\text{ m}$ down a rough slope inclined at $30^\circ$ to the horizontal, starting from rest. The frictional force is a constant $5.2\text{ N}$. Find its speed at the bottom. Use $g = 10\text{ m s}^{-2}$.
    fields:
      - answer: 5.11
        unit: "m s⁻¹"
        tolerance: { abs: 0.05 }
    explanation: |-
      Height lost: $4\sin 30^\circ = 2\text{ m}$, so PE loss $= 3 \times 10 \times 2 = 60\text{ J}$.

      Work done against friction $= 5.2 \times 4 = 20.8\text{ J}$ (distance along the slope).

      KE gain $= 60 - 20.8 = 39.2\text{ J}$, so $\tfrac12 \times 3 \times v^2 = 39.2$, $v^2 = 26.13$ and $v \approx 5.11\text{ m s}^{-1}$.

  - id: wep-conservation
    format: numeric
    difficulty: 2
    objectives: ["4.5.3"]
    prompt: |
      A particle is projected up a smooth plane inclined at $25^\circ$ with speed $10\text{ m s}^{-1}$. Find the distance it travels up the plane before stopping. Use $g = 10\text{ m s}^{-2}$.
    fields:
      - answer: 11.8
        unit: m
        tolerance: { abs: 0.1 }
    explanation: |
      Smooth, so energy is conserved: $\tfrac12 m(10^2) = mgh$. The mass cancels, so $50 = 10h$ and $h = 5\text{ m}$.

      That's the height gained. Along the slope, height $= d\sin 25^\circ$, so $d = \dfrac{5}{\sin 25^\circ} \approx 11.8\text{ m}$.

  - id: wep-signs
    format: mcq
    difficulty: 2
    objectives: ["4.5.3"]
    prompt: |
      A block slides down a rough slope. Which statement about the work done by the forces is correct?
    options:
      - text: Work done by gravity is negative; work done by friction is positive.
        why: Gravity acts down the slope (same direction as displacement when sliding down) → positive work. Friction opposes motion → negative work.
      - text: Work done by gravity is positive; work done by friction is negative.
        correct: true
        why: Gravity has a component down the slope (direction of motion) → positive work. Friction opposes motion → negative work.
      - text: Work done by both gravity and friction is positive.
        why: Friction always opposes motion, so its work is negative.
      - text: Work done by both gravity and friction is negative.
        why: Gravity's component along the slope is in the direction of motion when sliding down → positive work.
    explanation: |
      When sliding down: gravity component is in direction of motion → positive work. Friction opposes motion → negative work.