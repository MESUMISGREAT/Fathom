id: work-energy-power-work-energy-principle
subject: "9709"
topic: "4.5"
title: "Work-energy principle and conservation of mechanical energy"
summary: "Treat energy like a bank account: work done by driving forces minus work done against resistances equals the change in kinetic plus potential energy. With no resistances, energy is conserved."
order: 3
minutes: 8
kind: core
objectives: ["4.5.3"]
prerequisites: ["work-energy-power-gpe-ke"]
