id: stats-data-choosing-presentation
subject: "9709"
topic: "5.1"
title: Choosing the right data display
summary: Learn to pick the best statistical representation for raw data and explain the trade-offs.
order: 1
minutes: 6
kind: core
objectives: ["5.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 5.1 outcome "Select a suitable way of presenting raw statistical
    data, and discuss the advantages and/or disadvantages that particular representations may have."
    All examples, questions and diagrams are original. Validated for accuracy and syllabus alignment.
blocks:
  - type: objective
    body: |-
      By the end you can look at a set of raw data and choose an appropriate statistical diagram,
      then explain why that choice is better (or worse) than the alternatives.

  - type: explain
    title: What the question asks
    body: |-
      The syllabus does not ask you to draw perfect diagrams from memory. It asks you to **decide**
      which display suits the data you are given and to **justify** that decision.

      Typical wording:
      > The table shows the heights of 200 students. State, with a reason, which of a histogram,
      > a box-and-whisker plot, or a stem-and-leaf diagram would be the most appropriate way
      > to display these data.

      You need to know the strengths and weaknesses of each common display.

  - type: definition
    term: Raw data
    body: |-
      The original, unprocessed observations exactly as they were collected (e.g. a list of 50
      exam scores, or the daily rainfall measurements for a month).

  - type: explain
    title: The main displays and when to use them
    body: |-
      | Display | Best for | Not ideal for |
      |---------|----------|---------------|
      | **Stem-and-leaf** | Small to moderate data sets (≈ 15–50 values) where you want to keep every individual value visible | Large data sets (hundreds of values); comparing more than two groups |
      | **Box-and-whisker plot** | Comparing two or more distributions side-by-side; showing median, quartiles, outliers, spread at a glance | Seeing the exact shape of the distribution or individual data points |
      | **Histogram** | Large continuous data sets; showing the overall shape (skew, modality, gaps) | Small data sets; discrete data with few distinct values |
      | **Cumulative frequency graph** | Estimating medians, quartiles, percentiles; finding the proportion above/below a value | Showing the shape of the distribution directly |

      A **back-to-back stem-and-leaf** is a variant that puts two data sets on the same stem
      (one on the left, one on the right) for direct comparison.

  - type: intuition
    body: |-
      Think about what the *reader* needs to see.
      - If they need to **spot every value** → stem-and-leaf.
      - If they need to **compare centres and spreads** of several groups → box plots.
      - If they need to **see the shape** of a big continuous data set → histogram.
      - If they need to **answer "what proportion is above X?"** → cumulative frequency graph.

  - type: example
    title: "Example 1: choosing for a small data set"
    problem: |-
      A teacher records the marks (out of 20) of 15 students on a quiz:
      14, 17, 12, 19, 15, 18, 16, 13, 20, 11, 15, 14, 16, 17, 18

      Which display would be most appropriate: a stem-and-leaf diagram, a histogram, or a box plot?
      Give one advantage and one disadvantage of your choice.
    steps:
      - |-
        There are only 15 values — a **small data set**. We can keep every mark visible.
      - |-
        A **stem-and-leaf diagram** is ideal: it shows each individual value while giving a quick
        picture of the distribution.
      - |-
        **Advantage:** The original data values can be recovered exactly from the diagram.
      - |-
        **Disadvantage:** It becomes cluttered and hard to read with larger data sets (e.g. 200
        values).
    answer: |-
      Stem-and-leaf diagram. Advantage: retains all original values. Disadvantage: impractical for large data sets.

  - type: check
    questions: [sc-choose-small]

  - type: example
    title: "Example 2: choosing for a large continuous data set"
    problem: |-
      A meteorologist has daily maximum temperatures for a city over 10 years (≈ 3650 values).
      Which display is most suitable: stem-and-leaf, histogram, or box plot? Justify your answer.
    steps:
      - |-
        3650 values is a **large data set**. A stem-and-leaf would be unreadable.
      - |-
        The data are **continuous** (temperature can take any value in a range). A histogram groups
        the data into intervals and shows the overall shape — e.g. whether it is symmetric,
        skewed, or bimodal.
      - |-
        A box plot would summarise the centre and spread but would hide the detailed shape.
      - |-
        **Best choice: histogram.** Advantage: reveals the shape of the distribution for a large
        continuous data set. Disadvantage: individual data values are lost.
    answer: |-
      Histogram. Advantage: shows shape of large continuous data. Disadvantage: loses individual values.

  - type: check
    questions: [sc-choose-large]

  - type: example
    title: "Example 3: comparing two groups"
    problem: |-
      A researcher wants to compare the reaction times (in milliseconds) of two groups of 30 people
      each (Group A and Group B). Which display is most appropriate? Explain one advantage and
      one disadvantage.
    steps:
      - |-
        The goal is **comparison** of two groups of moderate size.
      - |-
        A **back-to-back stem-and-leaf** or **side-by-side box plots** are both good choices.
      - |-
        Box plots are often preferred for comparison because they put the medians, quartiles,
        and whiskers right next to each other on the same scale.
      - |-
        **Best choice: box-and-whisker plots (side by side).** Advantage: immediate visual
        comparison of medians, spreads, and outliers. Disadvantage: individual values and
        detailed shape are not visible.
    answer: |-
      Side-by-side box-and-whisker plots. Advantage: direct comparison of medians, quartiles, spread. Disadvantage: loses individual data points and fine shape detail.

  - type: check
    questions: [sc-choose-compare]

  - type: takeaways
    items:
      - "Match the display to the **data size** (small → stem-and-leaf; large → histogram/box plot)."
      - "Match the display to the **question**: compare groups → box plots; shape → histogram; proportions above/below → cumulative frequency."
      - "Every justification needs **one clear advantage** and **one clear disadvantage** tied to the data and purpose."
      - "Know the four main displays: stem-and-leaf, box-and-whisker, histogram, cumulative frequency graph."

questions:
  - id: sc-choose-small
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: A data set contains the ages of 18 people at a family gathering. Which display is most appropriate?
    options:
      - text: Histogram
        why: Histograms are for large data sets; 18 values is too few for meaningful bins.
        correct: false
      - text: Box-and-whisker plot
        why: Box plots are for comparing groups; here there is only one group.
        correct: false
      - text: Stem-and-leaf diagram
        why: Stem-and-leaf is ideal for small data sets (≈15–50) where you want to keep every value visible.
        correct: true
      - text: Cumulative frequency graph
        why: Cumulative frequency graphs are for estimating percentiles from large data sets.
        correct: false
    explanation: |
      With only 18 values (a small data set), a stem-and-leaf diagram keeps every individual value visible while showing the distribution shape. Histograms need more data for meaningful bins, box plots are for comparing groups, and cumulative frequency graphs are for large data sets.

  - id: sc-choose-large
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: A researcher collects the weights of 500 newborn babies. The data are continuous. Which display best shows the shape of the distribution?
    options:
      - text: Stem-and-leaf diagram
        why: 500 values would make a stem-and-leaf diagram impossibly large and unreadable.
        correct: false
      - text: Histogram
        why: Histograms group continuous data into intervals and reveal the overall shape for large data sets.
        correct: true
      - text: Box-and-whisker plot
        why: Box plots summarise centre and spread but hide the detailed shape of the distribution.
        correct: false
      - text: Back-to-back stem-and-leaf
        why: Back-to-back stem-and-leaf is for comparing two small data sets, not one large one.
        correct: false
    explanation: |
      For a large continuous data set (500 values), a histogram groups the data into intervals and reveals the overall shape of the distribution. Stem-and-leaf is impractical at this size, box plots hide the shape, and back-to-back stem-and-leaf is for comparing two small groups.

  - id: sc-choose-compare
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: Two classes of 25 students each take the same test. You want to compare their performances at a glance. Which display is best?
    options:
      - text: Two separate histograms
        why: Two histograms on different axes are hard to compare directly.
        correct: false
      - text: Side-by-side box-and-whisker plots
        why: Box plots place medians, quartiles and spreads next to each other on the same scale for instant comparison.
        correct: true
      - text: Cumulative frequency graph
        why: Cumulative frequency graphs are for finding percentiles, not for direct visual comparison of centres and spreads.
        correct: false
      - text: Stem-and-leaf diagram
        why: A single stem-and-leaf can only show one data set; back-to-back works but is less clear for comparing summaries than box plots.
        correct: false
    explanation: |
      Side-by-side box-and-whisker plots place the medians, quartiles, and spreads of both groups next to each other on the same scale, making comparison immediate. Two histograms are hard to compare directly, cumulative frequency graphs are for percentiles, and stem-and-leaf is less clear for comparing summary statistics.