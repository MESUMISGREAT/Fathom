id: quadratics-inequalities
subject: "9709"
topic: "1.1"
title: Quadratic inequalities
summary: Solve quadratic inequalities by finding the critical values, sketching the parabola and choosing the right region.
order: 4
minutes: 5
kind: core
objectives: ["1.1.3"]
prerequisites: [quadratics-solving-equations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025; update notice checked): topic 1.1 outcome "solve
    quadratic equations, and quadratic inequalities, in one unknown". Inequality symbols follow
    the Cambridge notation (⩽, ⩾). Examples and questions are original; all arithmetic and sign
