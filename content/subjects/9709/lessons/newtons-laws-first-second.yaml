blocks:
  - type: objective
    body: |
      By the end you can state Newton's first and second laws, draw force diagrams for accelerating
      particles, and use F = ma to find acceleration, force or mass.

  - type: explain
    title: What Newton actually said
    body: |
      **First law (the law of inertia):** A particle remains at rest or moves with constant velocity
      in a straight line unless acted on by a resultant force. "No resultant force" means the forces
      are balanced — they cancel out. That is exactly what we did in the forces-equilibrium topic:
      balanced forces → zero acceleration.

      **Second law:** The rate of change of momentum is proportional to the resultant force and takes
      place in the direction of that force. For a particle of **constant mass**, this simplifies to
      the famous equation:

      $$F = ma$$

      where $F$ is the **resultant force** (the vector sum of all forces), $m$ is the mass in kg,
      and $a$ is the acceleration in m s⁻².

      The unit of force, the newton (N), is defined so that $1\\ \\text{N} = 1\\ \\text{kg m s}^{-2}$.

  - type: definition
    term: Newton's second law
    body: |
      For a particle of constant mass $m$, the resultant force $F$ and acceleration $a$ satisfy
      $F = ma$. $F$ and $a$ are vectors; their direction is the same.

  - type: intuition
    title: Why mass matters
    body: |
      Imagine pushing a shopping trolley and a car with the same force. The trolley shoots off; the
      car barely moves. The car has more **inertia** — it resists changes to its motion more
      strongly. Mass measures that resistance.

      The second law quantifies it: for a given force, acceleration is inversely proportional to
      mass. Double the mass, halve the acceleration. That's why $a = F/m$ makes intuitive sense.

  - type: example
    title: Finding acceleration from forces
    problem: |
      A particle of mass $3\\ \\text{kg}$ is acted on by a horizontal force of $12\\ \\text{N}$ to the
      right and a frictional force of $3\\ \\text{N}$ to the left. Find its acceleration.
    steps:
      - |
        Draw the force diagram: a dot, an arrow right labelled $12\\ \\text{N}$, an arrow left
        labelled $3\\ \\text{N}$.
      - |
        Take right as positive. Resultant force $F = 12 - 3 = 9\\ \\text{N}$.
      - |
        Apply $F = ma$: $9 = 3a$, so $a = 3\\ \\text{m s}^{-2}$ to the right.
    answer: |
      $a = 3\\ \\text{m s}^{-2}$ to the right.

  - type: example
    title: Finding a force when acceleration is known
    problem: |
      A car of mass $800\\ \\text{kg}$ accelerates at $2.5\\ \\text{m s}^{-2}$. The resistance to
      motion is $600\\ \\text{N}$. Find the driving force of the engine.
    steps:
      - |
        Take the direction of motion as positive. We know $m = 800$, $a = 2.5$, resistance $= 600$.
      - |
        Resultant force $F = ma = 800 \\times 2.5 = 2000\\ \\text{N}$.
      - |
        Driving force $D$ acts forward, resistance $R = 600$ acts backward. $F = D - R$.
        So $2000 = D - 600$, giving $D = 2600\\ \\text{N}$.
    answer: |
      Driving force $= 2600\\ \\text{N}$.

  - type: explain
    title: Forces that appear in 9709 mechanics
    body: |
      The syllabus mentions these specifically:

      - **Weight** $W = mg$: acts vertically downwards. Use $g = 10\\ \\text{m s}^{-2}$.
      - **Normal reaction** $R$: perpendicular to the contact surface.
      - **Friction** $F$: along the surface, opposes sliding (or tendency to slide). On a rough
        horizontal surface, $F = \\mu R$ where $\\mu$ is the coefficient of friction.
      - **Tension** $T$: in a taut string or rope, pulls along its length.
      - **Thrust** (or compression): in a rigid rod, pushes along its length. A string cannot push,
        a rod can push or pull.

      In every problem, draw the force diagram first, then apply $F = ma$ in the direction of
      motion (or the direction you're analysing).

  - type: check
    title: Check yourself
    questions: [n2-acceleration, n2-driving-force, n2-mass]

  - type: misconceptions
    items:
      - wrong: "F in F = ma is any force acting on the particle."
        right: |
          F is the **resultant** force (the vector sum of all forces). You must add up all the
          forces, with correct signs, before using the equation.
      - wrong: "A particle moving at constant velocity has no forces acting on it."
        right: |
          It has no *resultant* force acting on it. The forces are balanced — their vector sum is
          zero. That is Newton's first law.
      - wrong: "F = ma works for rockets losing mass."
        right: |
          The simple form $F = ma$ only applies when mass is **constant**. The full form is
          $F = \\frac{d}{dt}(mv)$. Rockets and jet engines need the full version.

  - type: exam
    body: |
      - Always draw a force diagram first. Label every force with its symbol and value.
      - Write down your positive direction. Keep signs consistent.
      - $F = ma$ is a vector equation. If motion is in 2D, resolve into components (x and y) and
        apply $F = ma$ to each component separately. At this level, motion is linear (one
        dimension), so you just pick the line of motion.
      - Don't forget friction and resistance! The question will say "smooth" (no friction) or
        "rough" (friction present, often with $\\mu$ given).
      - Examiner favourite: "Find the driving force" — remember $F_{\\text{net}} = \\text{driving} -
        \\text{resistance}$.

  - type: takeaways
    items:
      - "Newton's first law: balanced forces → zero acceleration (equilibrium)."
      - "Newton's second law: resultant force $F = ma$. $F$ is the vector sum of all forces."
      - "Unit of force: 1 N = 1 kg m s⁻²."
      - "Draw the force diagram, pick a positive direction, sum forces, then apply F = ma."
      - "Common forces: weight (mg), normal reaction, friction (μR), tension, thrust."

questions:
  - id: n2-acceleration
    format: numeric
    difficulty: 1
    objectives: ["4.4.1"]
    prompt: |
      A box of mass $5\\ \\text{kg}$ is pulled horizontally by a force of $30\\ \\text{N}$. The
      frictional force opposing the motion is $5\\ \\text{N}$. Find the acceleration of the box.
    fields:
      - answer: 5
        unit: "m s⁻²"
        tolerance: { abs: 0.1 }
    explanation: |
      Resultant force $= 30 - 5 = 25\\ \\text{N}$. $F = ma$ gives $25 = 5a$, so $a = 5\\ \\text{m s}^{-2}$.

  - id: n2-driving-force
    format: numeric
    difficulty: 2
    objectives: ["4.4.1"]
    prompt: |
      A van of mass $1200\\ \\text{kg}$ has a driving force of $4000\\ \\text{N}$ and experiences
      a constant resistance of $1000\\ \\text{N}$. Find its acceleration.
    fields:
      - answer: 2.5
        unit: "m s⁻²"
        tolerance: { abs: 0.1 }
    explanation: |
      Net force $= 4000 - 1000 = 3000\\ \\text{N}$. $3000 = 1200a$, so $a = 2.5\\ \\text{m s}^{-2}$.

  - id: n2-mass
    format: numeric
    difficulty: 2
    objectives: ["4.4.1"]
    prompt: |
      A resultant force of $45\\ \\text{N}$ acts on a particle and produces an acceleration of
      $3\\ \\text{m s}^{-2}$. Find the mass of the particle.
    fields:
      - answer: 15
        unit: kg
        tolerance: { abs: 0.1 }
    explanation: |
      $F = ma$, so $m = F/a = 45/3 = 15\\ \\text{kg}$.