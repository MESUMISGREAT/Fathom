id: p1-differentiation-tangents-and-normals
subject: "9709"
topic: "1.7"
title: Tangents and normals
summary: Find the equation of a tangent or normal in five steps. Find the point, differentiate, put x in to get the gradient, flip it and change its sign for a normal, then use the straight-line formula.
order: 4
minutes: 5
kind: core
objectives: ["1.7.3"]
prerequisites: [p1-differentiation-chain-rule, coordinate-geometry-equation-of-a-line, coordinate-geometry-parallel-and-perpendicular]
