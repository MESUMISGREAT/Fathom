id: discrete-rv-variance
subject: "9709"
topic: "5.4"
title: Variance of a discrete random variable
summary: Measure the spread of a discrete random variable with Var(X) = E(X squared) - (E(X)) squared, and take the square root to get the standard deviation.
order: 3
minutes: 8
kind: core
objectives: ["5.4.1"]
prerequisites: ["discrete-rv-expectation"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 5.4 Discrete random variables, outcome 5.4.1, covering
    calculation of Var(X). All examples, questions and diagrams are original. The
    alternative definitional formula is mentioned as a check but the calculation formula
    E(X²) − (E(X))² is the one examiners normally expect.
    Independently re-checked line by line (facts, worked examples, every answer key)
