blocks:
  - type: objective
    body: |-
      By the end you can calculate $E(X^2)$, use it to find $Var(X) = E(X^2) - (E(X))^2$, and
      take the square root to obtain the standard deviation.

  - type: explain
    title: Why the mean is not the whole story
    body: |-
      Two random variables can share the same expectation and still behave completely
      differently. One might always give a value near its mean; the other might swing wildly.

      **Variance** measures that difference. It is the average squared distance of $X$ from
      its mean, so a small variance means the values cluster tightly around $E(X)$, and a
      large variance means they spread out.

      Squaring does two jobs: it removes the sign, so values above and below the mean both
      count as distance, and it punishes large deviations more heavily than small ones.

  - type: definition
    term: Variance and standard deviation
    body: |-
      For a discrete random variable $X$,

      $$Var(X) = E(X^2) - \left(E(X)\right)^2$$

      where $E(X^2) = \sum x^2 P(X = x)$, computed by squaring each value **before**
      multiplying by its probability.

      The **standard deviation** is $\sigma = \sqrt{Var(X)}$, which returns to the original
      units of $X$.

      Variance is never negative, because a squared distance cannot be negative. If you get a
      negative answer, the arithmetic is wrong.

  - type: intuition
    title: Why this formula measures spread
    body: |-
      The definition of variance is $E\left((X - \mu)^2\right)$: find the distance from the
      mean, square it, and average. That is exactly "average squared distance".

      Expanding the bracket gives
      $E(X^2 - 2\mu X + \mu^2) = E(X^2) - 2\mu E(X) + \mu^2$. Since $E(X) = \mu$, this
      becomes $E(X^2) - 2\mu^2 + \mu^2 = E(X^2) - \mu^2$.

      So the two forms are the same quantity. The calculation form is preferred because it
      needs only two sums, and because subtracting a rounded $\mu$ from a large $E(X^2)$ can
      lose accuracy.

  - type: example
    title: "Example 1: variance from a table"
    problem: |-
      $X$ has the distribution below. Find $E(X)$, $E(X^2)$, $Var(X)$ and the standard
      deviation.

      | $x$ | $0$ | $1$ | $2$ | $3$ |
      | --- | --- | --- | --- | --- |
      | $P(X = x)$ | $0.1$ | $0.2$ | $0.3$ | $0.4$ |
    steps:
      - |-
        First find $E(X) = 0(0.1) + 1(0.2) + 2(0.3) + 3(0.4) = 2$.
      - |-
        Now square each value **and then** multiply by its probability:
        $0^2(0.1) = 0$, $1^2(0.2) = 0.2$, $2^2(0.3) = 1.2$ and $3^2(0.4) = 3.6$.
      - |-
        Add: $E(X^2) = 0 + 0.2 + 1.2 + 3.6 = 5$.
      - |-
        Apply the formula:
        $Var(X) = E(X^2) - (E(X))^2 = 5 - 2^2 = 5 - 4 = 1$.
      - |-
        Standard deviation: $\sigma = \sqrt{1} = 1$.
    answer: |-
      $E(X) = 2$, $E(X^2) = 5$, $Var(X) = 1$ and $\sigma = 1$.

  - type: check
    title: Check 1 — the calculation
    questions: [drv-e-x-squared, drv-variance-table]

  - type: explain
    title: Reading the answer
    body: |-
      A variance of $1$ in Example 1 means the **average squared distance** from the mean of
      $2$ is $1$. Squared units are awkward to picture, so the number alone is hard to read.

      The standard deviation of $1$ is easier to interpret: it is in the same units as $X$,
      and it measures a typical distance from the mean. When a question asks you to compare two distributions, quote the standard
      deviation: "the second has the larger standard deviation, so its values are more
      spread out".

      A variance of $0$ is possible only when $X$ always takes the same value, so there is no
      spread at all.

  - type: example
    title: "Example 2: a distribution with a different spread"
    problem: |-
      $Y$ takes the values $1, 2, 3$ with probabilities $0.2$, $0.5$ and $0.3$. Find $Var(Y)$
      and its standard deviation.
    steps:
      - |-
        Find the mean: $E(Y) = 1(0.2) + 2(0.5) + 3(0.3) = 0.2 + 1.0 + 0.9 = 2.1$.
      - |-
        Square first, then weight:
        $1^2(0.2) = 0.2$, $2^2(0.5) = 2.0$ and $3^2(0.3) = 2.7$.
      - |-
        Add: $E(Y^2) = 0.2 + 2.0 + 2.7 = 4.9$.
      - |-
        Subtract the square of the mean:
        $Var(Y) = 4.9 - (2.1)^2 = 4.9 - 4.41 = 0.49$.
      - |-
        Standard deviation: $\sigma = \sqrt{0.49} = 0.7$.
    answer: |-
      $Var(Y) = 0.49$ and $\sigma = 0.7$.

  - type: check
    title: Check 2 — a second distribution
    questions: [drv-variance-second, drv-standard-deviation]

  - type: misconceptions
    items:
      - wrong: |-
          "$E(X^2)$ means squaring $E(X)$."
        right: |-
          They are different. $E(X^2)$ weights the **squared values**; $(E(X))^2$ squares the
          mean afterwards. In Example 1 they are $5$ and $4$, and their difference is the
          variance.
      - wrong: |-
          "$Var(X) = E(X^2) + (E(X))^2$."
        right: |-
          The mean squared is subtracted, not added. Adding would give $9$ in Example 1
          instead of the correct $1$.
      - wrong: |-
          "A variance of $4$ means the values are typically $4$ units from the mean."
        right: |-
          Variance is in **squared** units. The typical distance is the standard deviation,
          $\sqrt{4} = 2$.
      - wrong: |-
          "You can have a negative variance if the values are mostly below the mean."
        right: |-
          Distances are squared before averaging, so variance cannot be negative. A negative
          answer signals an arithmetic error, usually in $E(X^2)$.

  - type: exam
    body: |-
      A question on this objective typically asks for $E(X)$ and $Var(X)$ from a table, or
      gives a short distribution and requests both in one part.

      - Build a working table with columns for $x$, $P(X = x)$, $xP(X = x)$ and $x^2P(X = x)$.
        Exam solutions are marked on these columns, and they prevent the squaring error.
      - Round only at the end. Rounding $E(X)$ before squaring can change the last figure of
        the variance.
      - Give the variance as an exact fraction or decimal where the data allows, and quote the
        units of the standard deviation as the units of $X$.
      - If a "comment on the spread" part appears, answer with the standard deviation, not the
        variance.

  - type: takeaways
    items:
      - "$E(X^2) = \\sum x^2 P(X = x)$: square each value first, then weight it."
      - "$Var(X) = E(X^2) - (E(X))^2$, and it is never negative."
      - "Standard deviation $\\sigma = \\sqrt{Var(X)}$ is in the same units as $X$."
      - "Variance measures spread; a small variance means values cluster near the mean."

  - type: check
    title: Check 3 — consolidation
    questions: [drv-variance-interpretation]

questions:
  - id: drv-e-x-squared
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      $X$ has the distribution $P(X = 0) = 0.1$, $P(X = 1) = 0.2$, $P(X = 2) = 0.3$ and
      $P(X = 3) = 0.4$. Find $E(X^2)$.
    fields:
      - answer: 5
        tolerance:
          abs: 0.005
    explanation: |-
      Square each value before weighting:
      $0^2(0.1) + 1^2(0.2) + 2^2(0.3) + 3^2(0.4) = 0 + 0.2 + 1.2 + 3.6 = 5$.

  - id: drv-variance-table
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      For the same distribution, $E(X) = 2$ and $E(X^2) = 5$. Find $Var(X)$.
    fields:
      - answer: 1
        tolerance:
          abs: 0.005
    explanation: |-
      $Var(X) = E(X^2) - (E(X))^2 = 5 - 2^2 = 5 - 4 = 1$.

  - id: drv-variance-second
    format: numeric
    difficulty: 3
    objectives: ["5.4.1"]
    prompt: |-
      $Y$ takes the values $1, 2, 3$ with probabilities $0.2$, $0.5$ and $0.3$. Find $Var(Y)$.
    fields:
      - answer: 0.49
        tolerance:
          abs: 0.005
    explanation: |-
      $E(Y) = 1(0.2) + 2(0.5) + 3(0.3) = 2.1$ and
      $E(Y^2) = 1(0.2) + 4(0.5) + 9(0.3) = 4.9$. So
      $Var(Y) = 4.9 - 2.1^2 = 4.9 - 4.41 = 0.49$.

  - id: drv-standard-deviation
    format: numeric
    difficulty: 2
    objectives: ["5.4.1"]
    prompt: |-
      A discrete random variable has $Var(Y) = 0.49$. Find its standard deviation.
    fields:
      - answer: 0.7
        tolerance:
          abs: 0.005
    explanation: |-
      The standard deviation is the square root of the variance:
      $\sqrt{0.49} = 0.7$.

  - id: drv-variance-interpretation
    format: mcq
    difficulty: 1
    objectives: ["5.4.1"]
    prompt: |-
      Two random variables have the same mean but $Var(Y) = 0.5$ while $Var(Z) = 4$. What can
      you conclude?
    options:
      - text: |-
          $Z$ has the larger standard deviation, so its values are more spread out about the
          common mean.
        correct: true
        why: |-
          Variance measures spread about the mean, so the larger variance means the more
          spread-out distribution.
      - text: |-
          $Z$ has a larger mean than $Y$.
        why: |-
          The question states that the means are equal; the variances differ.
      - text: |-
          $Y$ takes a wider range of values than $Z$.
        why: |-
          This is the wrong way round: $Y$ has the smaller variance, so it is more tightly
          clustered.
      - text: |-
          $Z$ must take more possible values than $Y$.
        why: |-
          The number of possible values does not determine the variance; a variable with two
          widely separated values can have a larger variance than one with four close values.
    explanation: |-
      Both distributions have the same centre, so the difference is spread. $Var(Z) = 4$ is
      larger than $Var(Y) = 0.5$, and its standard deviation $\sqrt{4} = 2$ exceeds
      $\sqrt{0.5} \approx 0.71$, so $Z$'s values lie further from the mean.
