id: complex-numbers-argand-diagram
subject: "9709"
topic: "3.9"
title: Argand diagrams — complex numbers as geometry
summary: "Representing complex numbers geometrically on the Argand diagram, and interpreting addition, subtraction, and conjugation as transformations."
order: 4
minutes: 5
kind: core
objectives: ["3.9.4"]
prerequisites: ["complex-numbers-introduction"]
