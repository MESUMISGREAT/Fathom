id: p3-numerical-solution-approximations
subject: "9709"
topic: "3.6"
title: When the sequence settles down
summary: Understand how a sequence of approximations converges to a root, and use the notation x₁, x₂, x₃… to track the values.
order: 2
minutes: 7
kind: core
objectives: ["3.6.2"]
prerequisites: [p3-numerical-solution-sign-change]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.6 outcome "Understand the idea of, and use the notation for,
    a sequence of approximations that converges to a root of an equation". All examples,
    questions and diagrams are original; every value and answer key was computed in Python.
    Revised on 2026-10-31 for beginners (terms defined, steps explained, maths typeset). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can read and write the notation for a **sequence of approximations** ($x_1, x_2, x_3, \dots$), work out its terms, and tell when the terms have settled down to a root.

  - type: explain
    title: Guess, improve, repeat
    body: |-
      Many equations, like $x^3 - 2x - 5 = 0$, have no neat algebraic way to solve them. The previous lesson used a **sign change** to show roughly *where* a root is. This lesson is about *closing in* on it.

      The plan:

      1. Make a first guess.
      2. Feed it into a formula that produces a better guess.
      3. Feed that back into the same formula. Repeat.

      Each pass is called an **iteration**. If the formula is a good one, the guesses get closer and closer to the root.

  - type: explain
    title: The notation
    body: |-
      - $x_1$ is the **first guess** (the starting value). The small number underneath is just a counter: $x_1$ is "guess number 1".
      - $x_2, x_3, x_4, \dots$ are the next guesses, in order.
      - $x_n$ means "guess number $n$", any one of them, and $x_{n+1}$ is the guess straight after it.
      - The formula is written $x_{n+1} = F(x_n)$: "the next guess is $F$ of the current guess". So $x_2 = F(x_1)$, $x_3 = F(x_2)$, and so on.
      - The exact root is usually called $\alpha$ (the Greek letter "alpha").

      If the guesses get as close to $\alpha$ as you like, the sequence **converges** to $\alpha$.

  - type: example
    title: "Example 1: an iteration for √2"
    problem: |-
      The iteration $x_{n+1} = \dfrac12\left(x_n + \dfrac{2}{x_n}\right)$ with $x_1 = 1$ converges to $\sqrt2$. Find $x_2$, $x_3$ and $x_4$.
    steps:
      - |-
        Put $x_1 = 1$ into the formula: $x_2 = \tfrac12\left(1 + \tfrac21\right) = \tfrac12 \times 3 = 1.5$.
      - |-
        Now put $x_2 = 1.5$ in: $x_3 = \tfrac12\left(1.5 + \tfrac{2}{1.5}\right) = \tfrac12(1.5 + 1.3333\ldots) = 1.416666\ldots$
      - |-
        Now put $x_3 = 1.416666\ldots$ in: $x_4 = \tfrac12\left(1.416666\ldots + \tfrac{2}{1.416666\ldots}\right) = \tfrac12(1.416666\ldots + 1.411764\ldots) = 1.414215\ldots$
      - |-
        Compare with $\sqrt2 = 1.414213\ldots$: after only three steps, $x_4$ differs from $\sqrt2$ by about $0.000002$.
    answer: |-
      $x_2 = 1.5$, $x_3 = 1.416667$, $x_4 = 1.414216$ (6 d.p.). **Calculator tip:** type 1, press =, then type the formula using Ans in place of $x_n$. Each press of = gives the next term.

  - type: diagram
    diagram: p3-numerical-solution-approximations
    alt: >-
      A number line from 0.95 to 1.55 with the formula x(n+1) = ½(x(n) + 2/x(n)), x1 = 1, above it.
      Points are marked at x1 = 1, x2 = 1.5 and x3 ≈ 1.4167, and a coloured mark shows α = √2. A long
      curved arrow labelled step 1 jumps from 1 to 1.5, and a much shorter one labelled step 2 jumps
      back from 1.5 to 1.4167. A note says x4 ≈ 1.4142, too close to α = √2 to tell apart.
    caption: |-
      The steps shrink fast: from 1 to 1.5, back to about 1.4167, and then so close to $\sqrt2$ that the next point can't be seen separately.

  - type: intuition
    title: Why this formula works
    body: |-
      $\tfrac12\left(x_n + \tfrac{2}{x_n}\right)$ is the **average** of $x_n$ and $\tfrac{2}{x_n}$.

      If $x_n$ is a bit too small, then $\tfrac{2}{x_n}$ is a bit too big, because their product is always exactly 2, just like $\sqrt2 \times \sqrt2$. So one is below $\sqrt2$ and the other is above. Their average lands in between. For a reasonable guess it lands much closer to $\sqrt2$ than either of them, which is why the errors shrink so fast.

      You don't need to invent formulas like this; exam questions give them to you. You just need to use them correctly.

  - type: check
    questions: [approx-notation, approx-compute]

  - type: explain
    title: When to stop, and what to write
    body: |-
      1. **Keep plenty of decimal places** while working (at least 2 more than the answer needs). Use Ans on your calculator so nothing gets rounded early.
      2. **Write down each term** you calculate, e.g. $x_2 = 2.0801$, $x_3 = 2.0924$. These are your method marks.
      3. **Stop** when two terms in a row round to the same value at the accuracy asked for.
      4. **State the root** to that accuracy.

      This is the standard exam convention. (Why it's reasonable: once the terms stop changing at that accuracy, the later ones are even closer to $\alpha$ and almost always round the same way. If a value sits right on a rounding boundary, a sign-change check settles it.)

  - type: example
    title: "Example 2: using a given iteration"
    problem: |-
      The iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$ with $x_1 = 2$ converges to a root of $x^3 - 2x - 5 = 0$. Find the root correct to 2 decimal places, showing each iterate.
    steps:
      - |-
        $x_2 = \sqrt[3]{2(2) + 5} = \sqrt[3]{9} = 2.0801$
      - |-
        $x_3 = \sqrt[3]{2(2.0801) + 5} = 2.0924$ (keep using the unrounded value from your calculator)
      - |-
        $x_4 = 2.0942$
      - |-
        $x_3$ and $x_4$ both round to $2.09$, so by our rule we can stop here. ($x_5 = 2.0945$ also rounds to $2.09$, which confirms it.)
    answer: |-
      The root is $2.09$ to 2 d.p. (Check it's a root: rearranging $x = \sqrt[3]{2x + 5}$ gives $x^3 = 2x + 5$, i.e. $x^3 - 2x - 5 = 0$ ✓)

  - type: check
    questions: [approx-given-iteration, approx-stop]

  - type: misconceptions
    items:
      - wrong: |-
          $x_1$ is the root.
        right: |-
          $x_1$ is only the starting guess. The root $\alpha$ is what the guesses close in on.
      - wrong: |-
          The terms must go steadily up (or steadily down).
        right: |-
          They can land on either side of the root: in Example 1 the first guess, 1, is below $\sqrt2$ and the later ones are above it. What matters is that the distance from the root keeps shrinking.
      - wrong: |-
          Round each term before working out the next.
        right: |-
          Rounding early lets errors build up. Keep the full calculator value (Ans) and only round what you write down.
      - wrong: |-
          Every iteration formula converges.
        right: |-
          Some formulas send the terms flying away from the root. A later lesson in this topic shows how to spot this.

  - type: exam
    body: |-
      - Typical wording: *Use the iterative formula … with $x_1 = 2$ to determine the root correct to 2 decimal places. Give the result of each iteration to 4 decimal places.*
      - Show **each** iterate to the number of decimal places asked for, then the final answer.
      - The answer is the root, rounded, not the last iterate written to 4 d.p.

  - type: takeaways
    items:
      - |-
        $x_1$ is the starting guess; $x_{n+1} = F(x_n)$ makes each new guess from the last one.
      - |-
        Converging means the guesses get closer and closer to the root $\alpha$.
      - |-
        Keep full accuracy with Ans; write each term down.
      - |-
        Stop when two successive terms agree to the accuracy required, then state the root.

questions:
  - id: approx-notation
    format: mcq
    difficulty: 1
    objectives: ["3.6.2"]
    prompt: |-
      In the iteration $x_{n+1} = F(x_n)$, what is $x_{n+1}$?
    options:
      - text: The next approximation after $x_n$
        correct: true
        why: |-
          You get $x_{n+1}$ by putting $x_n$ into $F$. So $x_2 = F(x_1)$, $x_3 = F(x_2)$, and so on.
      - text: The previous approximation before $x_n$
        why: |-
          That would be $x_{n-1}$.
      - text: The exact root $\alpha$
        why: |-
          The root is what the sequence closes in on, not a particular term.
      - text: $x_n$ plus 1
        why: |-
          The $n + 1$ is a label (which guess it is), not something added to the value.
    explanation: |-
      $x_n$ is the current guess and $x_{n+1}$ is the next one, made by applying $F$ to $x_n$.

  - id: approx-compute
    format: numeric
    difficulty: 1
    objectives: ["3.6.2"]
    prompt: |-
      $x_{n+1} = \dfrac12\left(x_n + \dfrac{10}{x_n}\right)$ with $x_1 = 3$. Find $x_2$ and $x_3$.
    fields:
      - label: "x₂ ="
        answer: 3.1666666667
        tolerance: { rel: 0.001 }
      - label: "x₃ ="
        answer: 3.1622807018
        tolerance: { rel: 0.001 }
    explanation: |-
      $x_2 = \tfrac12\left(3 + \tfrac{10}{3}\right) = 3.16667$ and $x_3 = \tfrac12\left(3.16667 + \tfrac{10}{3.16667}\right) = 3.16228$. The sequence converges to $\sqrt{10} = 3.16228\ldots$

  - id: approx-given-iteration
    format: numeric
    difficulty: 2
    objectives: ["3.6.2"]
    prompt: |-
      The iteration $x_{n+1} = \sqrt{2x_n + 3}$ with $x_1 = 2$ converges to a root of $x^2 - 2x - 3 = 0$. Find $x_2$, $x_3$ and $x_4$.
    fields:
      - label: "x₂ ="
        answer: 2.645751311
        tolerance: { rel: 0.001 }
      - label: "x₃ ="
        answer: 2.879496939
        tolerance: { rel: 0.001 }
      - label: "x₄ ="
        answer: 2.959559744
        tolerance: { rel: 0.001 }
    explanation: |-
      $x_2 = \sqrt{2(2) + 3} = \sqrt7 = 2.64575$, $x_3 = \sqrt{2(2.64575) + 3} = 2.87950$, $x_4 = \sqrt{2(2.87950) + 3} = 2.95956$.

      They are creeping up towards 3, which is the positive root: $x^2 - 2x - 3 = (x - 3)(x + 1) = 0$.

  - id: approx-stop
    format: mcq
    difficulty: 2
    objectives: ["3.6.2"]
    prompt: |-
      An iteration gives $x_4 = 1.41421$ and $x_5 = 1.41421$. The question asks for the root correct to 3 decimal places. What should you write?
    options:
      - text: The root is 1.414 (3 d.p.)
        correct: true
        why: |-
          The two terms agree well beyond 3 d.p., so the root rounds to 1.414.
      - text: The root is 1.41 (2 d.p.)
        why: |-
          The question asked for 3 decimal places; give exactly that.
      - text: The root is 1.41421
        why: |-
          That's 5 decimal places. Round to the accuracy asked for.
      - text: Keep iterating until $x_6$
        why: |-
          Two successive terms already agree to the required accuracy, so you can stop.
    explanation: |-
      Once two successive terms agree at the accuracy asked for, stop and round: $1.41421$ is $1.414$ to 3 d.p.
