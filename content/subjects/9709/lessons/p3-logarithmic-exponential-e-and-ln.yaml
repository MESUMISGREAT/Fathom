id: p3-logarithmic-exponential-e-and-ln
subject: "9709"
topic: "3.2"
title: '$e^x$ and $\ln x$: a pair of inverses'
summary: $e \approx 2.718$ is the natural base; $e^x$ and $\ln x$ undo each other, their graphs are mirror images in $y = x$, and $\ln$ only accepts positive inputs.
order: 2
minutes: 8
kind: core
objectives: ["3.2.2"]
prerequisites: [p3-logarithmic-exponential-logs-and-indices]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    (2026-2027), topic 3.2 outcome 3.2.2, including the graphs of e^x and ln x and of y = e^(kx)
    for positive and negative k. Diagrams plot the real functions. All questions are original.
    Reviewed against the official 9709 syllabus wording; every numeric answer key and
