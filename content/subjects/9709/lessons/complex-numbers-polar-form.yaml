id: complex-numbers-polar-form
subject: "9709"
topic: "3.9"
title: Polar form — multiply by scaling, divide by shrinking
summary: "Writing complex numbers in polar form r(cos θ + i sin θ) = re^(iθ), and multiplying/dividing by combining moduli and arguments."
order: 5
minutes: 5
kind: core
objectives: ["3.9.5"]
prerequisites: ["complex-numbers-argand-diagram"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 3.9 learning outcome 5 (polar form
    multiplication and division, modulus-argument properties). Examples and questions are original;
