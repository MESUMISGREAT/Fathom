blocks:
  - type: objective
    body: |
      By the end you can convert between Cartesian and polar forms, and multiply/divide complex
      numbers in polar form using $|z_1z_2| = |z_1||z_2|$ and $\arg(z_1z_2) = \arg z_1 + \arg z_2$
      (and the corresponding division rules).

  - type: explain
    title: Polar form
    body: |
      Any non-zero complex number $z = x + iy$ can be written as
      $$z = r(\cos \theta + i \sin \theta) \equiv r e^{i\theta}$$
      where $r = |z| = \sqrt{x^2 + y^2} > 0$ and $\theta = \arg z$ with $-\pi < \theta \le \pi$.
      
      **Euler's formula**: $e^{i\theta} = \cos \theta + i \sin \theta$ — this is why the two forms are equivalent.

  - type: example
    title: Cartesian to polar
    problem: "Express $z = 1 + i\\sqrt{3}$ in polar form $re^{i\\theta}$."
    steps:
      - '$r = |z| = \sqrt{1^2 + (\sqrt{3})^2} = \sqrt{1 + 3} = 2$'
      - '$\tan \theta = \frac{\sqrt{3}}{1} = \sqrt{3}$, and $z$ is in the 1st quadrant, so $\theta = \frac{\pi}{3}$'
      - 'Polar form: $z = 2e^{i\pi/3}$ (or $2(\cos \frac{\pi}{3} + i \sin \frac{\pi}{3})$)'
    answer: |
      $z = 2e^{i\pi/3}$

  - type: explain
    title: Multiplication in polar form — scale and rotate
    body: |
      If $z_1 = r_1 e^{i\theta_1}$ and $z_2 = r_2 e^{i\theta_2}$, then
      $$z_1 z_2 = r_1 r_2 e^{i(\theta_1 + \theta_2)}$$
      
      **Modulus multiplies**: $|z_1 z_2| = |z_1| |z_2|$
      
      **Argument adds**: $\arg(z_1 z_2) = \arg z_1 + \arg z_2$ (adjust to principal range if needed)
      
      Geometrically: multiplying by $z_2$ scales by $|z_2|$ and rotates by $\arg z_2$.

  - type: example
    title: Multiply in polar form
    problem: 'Find $z_1 z_2$ where $z_1 = 3e^{i\pi/6}$ and $z_2 = 2e^{i\pi/3}$. Give answer in polar form.'
    steps:
      - 'Modulus: $3 \times 2 = 6$'
      - 'Argument: $\frac{\pi}{6} + \frac{\pi}{3} = \frac{\pi}{6} + \frac{2\pi}{6} = \frac{3\pi}{6} = \frac{\pi}{2}$'
      - 'Result: $6e^{i\pi/2}$ (which is $6i$ in Cartesian)'
    answer: |
      $z_1 z_2 = 6e^{i\pi/2}$

  - type: explain
    title: Division in polar form — shrink and rotate backwards
    body: |
      $$\frac{z_1}{z_2} = \frac{r_1}{r_2} e^{i(\theta_1 - \theta_2)}$$
      
      **Modulus divides**: $\left|\frac{z_1}{z_2}\right| = \frac{|z_1|}{|z_2|}$
      
      **Argument subtracts**: $\arg\left(\frac{z_1}{z_2}\right) = \arg z_1 - \arg z_2$ (adjust to principal range)
      
      Geometrically: dividing by $z_2$ shrinks by $|z_2|$ and rotates by $-\arg z_2$.

  - type: example
    title: Divide in polar form
    problem: 'Find $\frac{z_1}{z_2}$ where $z_1 = 8e^{i2\pi/3}$ and $z_2 = 2e^{i\pi/4}$. Give answer in polar form.'
    steps:
      - 'Modulus: $\frac{8}{2} = 4$'
      - 'Argument: $\frac{2\pi}{3} - \frac{\pi}{4} = \frac{8\pi}{12} - \frac{3\pi}{12} = \frac{5\pi}{12}$'
      - 'Result: $4e^{i5\pi/12}$'
    answer: |
      $\frac{z_1}{z_2} = 4e^{i5\pi/12}$

  - type: check
    title: Polar operations
    questions: [cn-polar-convert, cn-polar-multiply, cn-polar-divide]

  - type: intuition
    title: Why polar form makes multiplication easy
    body: |
      In Cartesian form, multiplication is messy: $(a+ib)(c+id) = (ac-bd) + i(ad+bc)$.
      In polar form, it's just **multiply the lengths, add the angles**.
      This is because $e^{i\theta_1} e^{i\theta_2} = e^{i(\theta_1+\theta_2)}$ — the exponential
      turns addition of angles into multiplication of rotations.
      Division reverses it: divide lengths, subtract angles.

  - type: diagram
    diagram: complex-numbers-polar-multiply
    alt: |
      Argand diagram showing z1 = 2e^(iπ/6) (length 2, angle 30°) and z2 = 3e^(iπ/3)
      (length 3, angle 60°). Their product z1*z2 = 6e^(iπ/2) has length 6 and angle 90°.
      The product vector is the result of scaling z1 by 3 and rotating by 60°.
    caption: |
      Multiplication in polar form: scale by $r_2$, rotate by $\theta_2$.

  - type: misconceptions
    items:
      - wrong: 'The argument of $e^{i\theta}$ is always $\theta$.'
        right: 'The **principal** argument must be in $(-\pi, \pi]$. If $\theta = 3\pi/2$, the principal argument is $-\pi/2$.'
      - wrong: "$|z_1/z_2| = |z_1|/|z_2|$ only works if $z_2$ is real."
        right: "It works for **any** non-zero $z_2$. The denominator's modulus is always real and positive."
      - wrong: 'To convert $x + iy$ to polar, just use $\theta = \arctan(y/x)$.'
        right: '$\arctan$ only gives angles in $(-\pi/2, \pi/2)$. You MUST check the quadrant and adjust.'

  - type: exam
    body: |
      - "Write $z = 1 + i\sqrt{3}$ in the form $re^{i\theta}$." — standard conversion.
      - "Given $z_1 = 2e^{i\pi/4}$, $z_2 = 3e^{i\pi/6}$, find $z_1z_2$ and $z_1/z_2$ in polar form." — multiply/divide moduli, add/subtract arguments.
      - Always ensure final argument is in the principal range $(-\pi, \pi]$ (or $[0, 2\pi)$ if specified).
      - You may need to convert the result back to Cartesian form: $r(\cos\theta + i\sin\theta) = r\cos\theta + ir\sin\theta$.

  - type: takeaways
    items:
      - 'Polar form: $z = re^{i\theta} = r(\cos\theta + i\sin\theta)$ with $r = |z|$, $\theta = \arg z$.'
      - 'Multiplication: $z_1z_2 = r_1r_2 e^{i(\theta_1+\theta_2)}$ — multiply moduli, add arguments.'
      - 'Division: $z_1/z_2 = \frac{r_1}{r_2} e^{i(\theta_1-\theta_2)}$ — divide moduli, subtract arguments.'
      - "Geometrically: multiply = scale and rotate; divide = shrink and rotate backwards."
      - 'Check argument is in the principal range $(-\pi, \pi]$.'

questions:
  - id: cn-polar-convert
    format: numeric
    difficulty: 2
    objectives: ["3.9.5"]
    prompt: |
      Express $z = -2 + 2i$ in polar form $re^{i\theta}$. Give $r$ and $\theta$ in radians.
    fields:
      - label: "r ="
        answer: 2.828
        tolerance:
          abs: 0.001
      - label: "θ ="
        answer: 2.356
        tolerance:
          abs: 0.001
    explanation: |
      $r = \sqrt{(-2)^2 + 2^2} = \sqrt{8} = 2\sqrt{2} \approx 2.828$.
      Point $(-2, 2)$ is in 2nd quadrant. $\tan \theta = \frac{2}{-2} = -1$.
      $\theta = \pi - \frac{\pi}{4} = \frac{3\pi}{4} \approx 2.356$ rad.

  - id: cn-polar-multiply
    format: mcq
    difficulty: 2
    objectives: ["3.9.5"]
    prompt: |
      If $z_1 = 4e^{i\pi/3}$ and $z_2 = 5e^{i\pi/6}$, what is $z_1 z_2$ in polar form?
    options:
      - text: '$20e^{i\pi/2}$'
        correct: true
        why: '$r = 4 \times 5 = 20$, $\theta = \frac{\pi}{3} + \frac{\pi}{6} = \frac{\pi}{2}$.'
      - text: '$20e^{i\pi/9}$'
        why: "Added arguments incorrectly."
      - text: '$9e^{i\pi/2}$'
        why: "Added moduli instead of multiplying."
      - text: '$20e^{i\pi}$'
        why: "Wrong argument sum."
    explanation: |
      $r = 4 \times 5 = 20$, $\theta = \frac{\pi}{3} + \frac{\pi}{6} = \frac{2\pi}{6} + \frac{\pi}{6} = \frac{\pi}{2}$.

  - id: cn-polar-divide
    format: text
    style: short
    difficulty: 2
    objectives: ["3.9.5"]
    prompt: |
      If $z_1 = 6e^{i\pi/4}$ and $z_2 = 2e^{i\pi/3}$, express $z_1/z_2$ in the form $re^{i\theta}$.
      Give $\theta$ in radians as a multiple of $\pi$.
    accept:
      - "3e^(-iπ/12)"
      - "3e^{-iπ/12}"
      - "3e^(−iπ/12)"
      - "3e^{-iπ/12}"
    model: '$3e^{-i\pi/12}$'
    explanation: |
      $r = \frac{6}{2} = 3$.
      $\theta = \frac{\pi}{4} - \frac{\pi}{3} = \frac{3\pi}{12} - \frac{4\pi}{12} = -\frac{\pi}{12}$.
      Result: $3e^{-i\pi/12}$. The argument is in $(-\pi, \pi]$ as required.