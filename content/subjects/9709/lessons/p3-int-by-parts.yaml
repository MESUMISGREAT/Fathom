id: p3-int-by-parts
subject: '9709'
topic: '3.5'
title: 'Integration by parts: undo the product rule'
summary: Keep one factor, swap the other — the formula trades a hard integral for an easier one, and picking u correctly
  decides whether things improve.
order: 5
minutes: 9
kind: core
objectives:
- 3.5.5
prerequisites:
- p3-int-standard-integrals
- p3-diff-products-quotients
