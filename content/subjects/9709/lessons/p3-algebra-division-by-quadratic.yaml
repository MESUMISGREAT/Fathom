id: p3-algebra-division-by-quadratic
subject: "9709"
topic: "3.1"
title: "Dividing by a quadratic"
summary: When the divisor is quadratic the quotient is two degrees lower and the remainder is linear — the same grid, one extra column.
order: 4
minutes: 6
kind: core
objectives: ["3.1.2"]
prerequisites: [p3-algebra-long-division]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    (2026-2027), topic 3.1, for the case where the divisor is quadratic and the dividend has degree
    up to 4. Divisions verified by multiplying back and with numpy.polydiv in Python. All questions
    are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can divide a quartic by a quadratic, write the answer in the form
      $\text{quotient} + \dfrac{\text{remainder}}{\text{divisor}}$, and check it.

  - type: explain
    title: What changes when the divisor is quadratic
    body: |-
      Two things:

      - the **quotient** is two degrees lower than the dividend (a quartic gives a quadratic quotient);
      - the **remainder** can now be linear, $px + q$, because you stop when the remaining degree is less than 2.

      So for a quartic ÷ quadratic the answer looks like

      $$P(x) = (ax^2 + bx + c)Q(x) + (px + q)$$

  - type: explain
    title: The method
    body: |-
      1. **Set out** the dividend in descending powers, with zeros for missing terms.
      2. **Divide leading terms** to get the first quotient term.
      3. **Multiply the whole quadratic** by it and subtract.
      4. **Repeat** until the leftover has degree 1 or 0 — that leftover is the remainder.
      5. **Check** by substituting two convenient values of $x$, or by expanding.

      **The forgotten step:** subtracting a *quadratic* multiple each time, not just a single term.
      Multiplying only by the leading term of the divisor is the classic error.

  - type: example
    title: "Example 1: a quartic by a quadratic"
    problem: |-
      Divide $x^4 + 3x^2 - 2x + 1$ by $x^2 + 1$.
    steps:
      - |-
        Write the dividend with all powers: $x^4 + 0x^3 + 3x^2 - 2x + 1$.
      - |-
        $x^4 \div x^2 = x^2$. Multiply: $x^2(x^2 + 1) = x^4 + x^2$. Subtract:
        $$(x^4 + 3x^2) - (x^4 + x^2) = 2x^2$$
      - |-
        Bring down the rest: $2x^2 - 2x + 1$. Now $2x^2 \div x^2 = 2$. Multiply:
        $2(x^2 + 1) = 2x^2 + 2$. Subtract:
        $$(2x^2 - 2x + 1) - (2x^2 + 2) = -2x - 1$$
      - |-
        The leftover has degree 1, so stop. Quotient $x^2 + 2$, remainder $-2x - 1$.
      - |-
        Check by expanding:
        $$(x^2 + 1)(x^2 + 2) - 2x - 1 = x^4 + 3x^2 + 2 - 2x - 1 = x^4 + 3x^2 - 2x + 1 ✓$$
    answer: |-
      $x^2 + 2$ with remainder $-2x - 1$, i.e. $x^2 + 2 - \dfrac{2x + 1}{x^2 + 1}$.

  - type: check
    title: Quick check
    questions: [quadratic-remainder, remainder-degree, quotient-form]

  - type: example
    title: "Example 2: an exam-style one"
    problem: |-
      Find the quotient and remainder when $2x^4 - 3x^3 + x - 5$ is divided by $x^2 - 2x + 1$.
    steps:
      - |-
        $2x^4 \div x^2 = 2x^2$. Multiply: $2x^2(x^2 - 2x + 1) = 2x^4 - 4x^3 + 2x^2$. Subtract from $2x^4 - 3x^3 + 0x^2$:
        $$x^3 - 2x^2$$
      - |-
        Bring down $+x$: $x^3 - 2x^2 + x$. Now $x^3 \div x^2 = x$. Multiply:
        $x(x^2 - 2x + 1) = x^3 - 2x^2 + x$. Subtract: $0$.
      - |-
        Bring down $-5$: the leftover is $-5$, of degree 0, so stop.
      - |-
        Quotient $2x^2 + x$, remainder $-5$.
      - |-
        Check with $x = 1$: left side $2 - 3 + 1 - 5 = -5$; right side
        $(1 - 2 + 1)(2 + 1) - 5 = 0 - 5 = -5$ ✓
    answer: |-
      Quotient $2x^2 + x$, remainder $-5$.

  - type: misconceptions
    items:
      - wrong: Dividing a quartic by a quadratic gives a quadratic remainder.
        right: |-
          The remainder must have degree **less than the divisor's**, so at most degree 1: a linear
          expression or a constant.
      - wrong: The quotient from quartic ÷ quadratic is linear.
        right: |-
          It is quadratic. Degrees subtract: $4 - 2 = 2$.
      - wrong: You can stop as soon as a zero appears.
        right: |-
          Stop only when the leftover has degree less than the divisor. A zero in one column just
          means that term is absent.
      - wrong: A linear remainder means the division "failed".
        right: |-
          It is the normal outcome. Only dividing by a factor gives remainder zero.
      - wrong: Multiplying back is unnecessary.
        right: |-
          With two columns to track, expansion is the fastest way to catch a sign slip, and it costs
          one line.

  - type: exam
    body: |-
      - Write the final answer as $\text{quotient} + \dfrac{\text{remainder}}{\text{divisor}}$ if the question asks for a single expression.
      - Keep the remainder's degree below the divisor's degree — going further is wasted work and usually wrong.
      - Use a substitution check with the easiest $x$ (often $x = 0$ or $x = 1$).
      - If the question gives a form to aim for (e.g. "$A x^2 + Bx + C + \frac{Dx + E}{x^2 + 1}$"), match coefficients rather than guessing.

  - type: check
    title: Exam-style check
    questions: [matching-coefficients, zero-remainder-quadratic]

  - type: takeaways
    items:
      - 'Dividing by a quadratic: quotient two degrees lower, remainder at most linear.'
      - 'Subtract the whole quadratic multiple at each step.'
      - 'Stop when the leftover degree is below the divisor degree.'
      - 'Check by expanding or by substituting two values.'
      - 'Write the answer as quotient $+$ remainder over divisor when asked for one expression.'

  - type: deeper
    title: The same division, done by matching
    body: |-
      Long division is not the only route. For

      $$x^4 + 3x^2 - 2x + 1 = (x^2 + 1)(Ax^2 + Bx + C) + (Dx + E)$$

      expand the right side and compare coefficients:

      - $x^4$: $A = 1$;
      - $x^3$: $B = 0$;
      - $x^2$: $A + C = 3$, so $C = 2$;
      - $x^1$: $B + D = -2$, so $D = -2$;
      - constant: $C + E = 1$, so $E = -1$.

      Same answer, $x^2 + 2$ remainder $-2x - 1$. When the divisor is simple, matching is often
      quicker and less error-prone than the grid.

questions:
  - id: quadratic-remainder
    format: numeric
    difficulty: 2
    objectives: ["3.1.2"]
    prompt: |-
      When $x^4 + 3x^2 - 2x + 1$ is divided by $x^2 + 1$, the remainder is $-2x - 1$. Give its value at $x = 0$.
    fields:
      - answer: -1
        tolerance: { abs: 0.01 }
    explanation: |-
      The remainder is $-2x - 1$, so at $x = 0$ it equals $-1$ (which is also the constant term of
      the dividend, as expected).

  - id: remainder-degree
    format: mcq
    difficulty: 1
    objectives: ["3.1.2"]
    prompt: |-
      A quartic is divided by a quadratic. What is the highest possible degree of the remainder?
    options:
      - text: 1 (a linear expression)
        correct: true
        why: |-
          The remainder must have degree strictly less than the divisor, and the divisor has degree
          2, so the remainder has degree at most 1.
      - text: '2'
        why: |-
          A degree-2 remainder could be divided further by the quadratic, so division would not have
          finished.
      - text: '3'
        why: |-
          That is the degree of the quotient when dividing a **quartic** by a **linear** expression.
      - text: 0, always
        why: |-
          A constant remainder happens only in special cases; generally it is linear.
    explanation: |-
      The remainder's degree is always less than the divisor's degree.

  - id: quotient-form
    format: numeric
    difficulty: 3
    objectives: ["3.1.2"]
    prompt: |-
      Divide $2x^4 - 3x^3 + x - 5$ by $x^2 - 2x + 1$. The quotient is $2x^2 + bx$. Give $b$.
    fields:
      - answer: 1
        tolerance: { abs: 0.01 }
    explanation: |-
      The quotient is $2x^2 + x$ with remainder $-5$, so $b = 1$.

  - id: matching-coefficients
    format: numeric
    difficulty: 3
    objectives: ["3.1.2"]
    prompt: |-
      Given $x^4 + 3x^2 - 2x + 1 = (x^2 + 1)(x^2 + 2) + (Dx + E)$, find $E$.
    fields:
      - answer: -1
        tolerance: { abs: 0.01 }
    explanation: |-
      Expanding gives $x^4 + 3x^2 + 2 + Dx + E$. Comparing constants: $2 + E = 1$, so $E = -1$; and
      comparing $x$ terms gives $D = -2$.

  - id: zero-remainder-quadratic
    format: mcq
    difficulty: 2
    objectives: ["3.1.2"]
    prompt: |-
      If dividing a quartic by $x^2 + 1$ leaves remainder $0$, what can you conclude?
    options:
      - text: $x^2 + 1$ is a factor, so the quartic is $(x^2 + 1) \times$ a quadratic
        correct: true
        why: |-
          Remainder zero means the division is exact, and the quotient is quadratic by the degree
          rule.
      - text: The quartic has no real roots
        why: |-
          The factor $x^2 + 1$ has no real roots, but the quartic also has the quotient's roots,
          which may be real.
      - text: The quotient is a constant
        why: |-
          The quotient is quadratic: $4 - 2 = 2$.
      - text: $x = 1$ is a root
        why: |-
          $x^2 + 1 = 0$ gives $x = \pm i$, which are not real; substituting $x = 1$ gives
          $2 \times \text{quotient}(1)$, generally not zero.
    explanation: |-
      Exact division by a quadratic means the quadratic is a factor and the quotient is quadratic.
