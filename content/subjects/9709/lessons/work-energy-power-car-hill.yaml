blocks:
  - type: objective
    body: |
      By the end you can find the acceleration, the resistance or the top speed of a vehicle moving up or down
      a hill, by combining $D = \dfrac{P}{v}$ with Newton's second law.

  - type: explain
    title: Key to the symbols
    body: |
      | Symbol | Meaning |
      | --- | --- |
      | $m$ | mass of the vehicle, in kg |
      | $P$ | power of the engine, in watts (convert kW by multiplying by 1000) |
      | $v$ | the speed **at the moment we are interested in**, in $\text{m s}^{-1}$ |
      | $D$ | the engine's driving force at that moment, $D = \dfrac{P}{v}$ |
      | $R$ | the resistance to motion, opposing the direction the vehicle moves |
      | $\alpha$ | the angle of the slope to the horizontal |
      | $a$ | the acceleration, in $\text{m s}^{-2}$ |

  - type: explain
    title: The three forces along the slope
    body: |
      In the last lesson you saw that an engine working at power $P$ while moving at speed $v$ pushes with a
      driving force

      $$D = \frac{P}{v}$$

      On a slope, three forces act **along** the road:

      1. **The driving force** $D = \dfrac{P}{v}$, forwards.
      2. **The resistance** $R$, always against the direction of motion.
      3. **Part of the weight**, $mg\sin\alpha$, always pointing **down** the slope.

      Why $mg\sin\alpha$? Look at the diagram below. Split the weight $mg$ into a part along the slope and a part pressing into it. The
      angle between the weight (straight down) and the line at right angles to the slope is $\alpha$, so the
      part along the slope is the side opposite that angle: $mg\sin\alpha$. On a flat road $\alpha = 0$ and
      $\sin 0 = 0$, so this force disappears, as it should.

      (The other part of the weight, $mg\cos\alpha$, presses into the road and is balanced by the road's push.
      It doesn't affect motion along the slope.)

  - type: diagram
    diagram: mech-car-on-slope
    alt: "A car on a slope inclined at angle alpha to the horizontal, moving up the slope. The driving force D = P/v points up the slope, the resistance R points down the slope, and the weight mg points straight down. The weight is split into mg sin alpha down the slope and mg cos alpha into the slope, and the angle between the weight and the line at right angles to the slope is marked alpha."
    caption: |
      The angle between the weight and the line at right angles to the slope is the same $\alpha$ as the slope
      itself, so the part of the weight along the slope is $mg\sin\alpha$.

  - type: explain
    title: Newton's second law along the slope
    body: |
      Newton's second law says **resultant force $=$ mass $\times$ acceleration**. Pick the direction of motion as
      positive, add up the forces along the slope with signs, and set the total equal to $ma$.

      **Going up the hill:** the driving force is forwards (up), while the resistance and the weight component
      both point down the slope:

      $$\frac{P}{v} - mg\sin\alpha - R = ma$$

      **Going down the hill:** now the weight component points the same way as the motion, so it **helps**.
      Only the resistance opposes:

      $$\frac{P}{v} + mg\sin\alpha - R = ma$$

      If the engine is off (the car **coasts**), $P = 0$ and the first term disappears.

      **Constant speed or top speed** means $a = 0$, so the forces balance: put $0$ on the right-hand side.

  - type: example
    title: Finding the resistance at constant speed
    problem: |
      A car of mass $1200$ kg travels up a hill inclined at $15°$ at a constant speed of $25\ \text{m s}^{-1}$.
      The engine's power is $80$ kW. Find the resistance to motion. Use $g = 10\ \text{m s}^{-2}$.
    steps:
      - "Driving force: $D = \\dfrac{P}{v} = \\dfrac{80\\,000}{25} = 3200$ N, up the slope."
      - "Weight component down the slope: $mg\\sin 15° = 1200 \\times 10 \\times 0.2588 \\approx 3106$ N."
      - "Constant speed, so $a = 0$: $3200 - 3106 - R = 0$."
      - "So $R \\approx 94$ N."
    answer: |
      The resistance is about $94$ N.

  - type: example
    title: Acceleration going up a hill
    problem: |
      A car of mass $1000$ kg is travelling at $20\ \text{m s}^{-1}$ up a hill inclined at $10°$. The engine's
      power is $60$ kW and the resistance is $400$ N. Find the acceleration at this instant. Use
      $g = 10\ \text{m s}^{-2}$.
    steps:
      - "Driving force at this speed: $D = \\dfrac{60\\,000}{20} = 3000$ N up the slope."
      - "Weight component: $1000 \\times 10 \\times \\sin 10° = 10\\,000 \\times 0.1736 \\approx 1736$ N down the slope."
      - "Newton's second law, up the slope positive: $3000 - 1736 - 400 = 1000a$."
      - "So $864 = 1000a$ and $a = 0.864\\ \\text{m s}^{-2}$."
      - "It's called the acceleration **at this instant** because as the car speeds up, $D = \\dfrac{P}{v}$ falls, so the acceleration falls too."
    answer: |
      $a \approx 0.864\ \text{m s}^{-2}$, up the slope.

  - type: example
    title: Top speed up a hill
    problem: |
      A car of mass $1500$ kg has a maximum power of $90$ kW. It climbs a hill inclined at $12°$ against a
      constant resistance of $600$ N. Find its greatest possible steady speed up the hill. Use
      $g = 10\ \text{m s}^{-2}$.
    steps:
      - "At top speed the car can't accelerate, so $a = 0$ and the forces balance: $\\dfrac{P}{v} = mg\\sin 12° + R$."
      - "Weight component: $1500 \\times 10 \\times \\sin 12° = 15\\,000 \\times 0.2079 \\approx 3119$ N."
      - "So $\\dfrac{90\\,000}{v} = 3119 + 600 = 3719$."
      - "Rearrange: $v = \\dfrac{90\\,000}{3719} \\approx 24.2\\ \\text{m s}^{-1}$."
    answer: |
      The greatest steady speed is about $24.2\ \text{m s}^{-1}$.

  - type: example
    title: Coasting down a hill
    problem: |
      A car of mass $1200$ kg coasts down a hill inclined at $8°$ with its engine off. The resistance is
      $300$ N. Find its acceleration. Use $g = 10\ \text{m s}^{-2}$.
    steps:
      - "Engine off, so $P = 0$: no driving force."
      - "Moving down the slope, so take down as positive. The weight component helps: $1200 \\times 10 \\times \\sin 8° = 12\\,000 \\times 0.1392 \\approx 1670$ N."
      - "The resistance opposes the motion, so it points up the slope: $-300$ N."
      - "Newton's second law: $1670 - 300 = 1200a$, so $a = \\dfrac{1370}{1200} \\approx 1.14\\ \\text{m s}^{-2}$."
    answer: |
      $a \approx 1.14\ \text{m s}^{-2}$, down the slope.

  - type: check
    title: Check the set-up
    questions: [car-hill-force-equation, max-speed-cloze, downhill-signs]

  - type: check
    title: Check the calculations
    questions: [car-accelerating-hill, car-max-speed-hill, car-coasting-down]

  - type: misconceptions
    items:
      - wrong: "The driving force stays the same as the car speeds up."
        right: "At constant power, $D = \\dfrac{P}{v}$ gets **smaller** as $v$ grows. Only treat it as constant if the question says the driving force is constant."
      - wrong: "At top speed the acceleration is at its biggest."
        right: "At top speed the acceleration is **zero**: the driving force has fallen until the forces balance."
      - wrong: "Resistance always acts down the slope."
        right: "Resistance opposes the **motion**. Going up, it points down the slope; going down, it points up the slope."
      - wrong: "The weight component is $mg\\cos\\alpha$."
        right: "Along the slope it is $mg\\sin\\alpha$. The $mg\\cos\\alpha$ part presses into the road."

  - type: exam
    body: |
      - Say which direction is positive, then write the full equation, such as $\dfrac{P}{v} - mg\sin\alpha - R = ma$, before putting numbers in.
      - Use the speed **at that instant** in $\dfrac{P}{v}$.
      - Use $g = 10\ \text{m s}^{-2}$ in Paper 4 unless the question says otherwise.

  - type: takeaways
    items:
      - "Driving force $D = \\dfrac{P}{v}$, using the speed at that instant."
      - "Along the slope: the weight component $mg\\sin\\alpha$ always points down the slope; resistance opposes the motion."
      - "Up the slope: $\\dfrac{P}{v} - mg\\sin\\alpha - R = ma$. Down the slope: $\\dfrac{P}{v} + mg\\sin\\alpha - R = ma$."
      - "Constant or top speed means $a = 0$, so the forces balance."

questions:
  - id: car-hill-force-equation
    format: cloze
    difficulty: 1
    objectives: ["4.5.5"]
    prompt: |
      A car of mass $m$ moves **up** a slope at angle $\alpha$ with engine power $P$, speed $v$ and resistance $R$. The resultant force up the slope is $\dfrac{P}{v}$ minus {{1}} minus $R$.
    blanks:
      - accept: ["mg sin α", "mg sin a", "mg sin alpha", "mgsinα", "mg sinα", "weight component"]
    explanation: |
      The part of the weight along the slope is $mg\sin\alpha$, pointing down the slope. The resistance also points down the slope, because the car is moving up. So the resultant is $\dfrac{P}{v} - mg\sin\alpha - R$.

  - id: max-speed-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.5.5"]
    prompt: |
      At the greatest steady speed up a hill, the acceleration is {{1}}, so the resultant force is {{2}}.
    blanks:
      - accept: ["zero", "0"]
      - accept: ["zero", "0"]
    explanation: |
      A steady (constant) speed means no acceleration, and by Newton's second law no acceleration means no resultant force.

  - id: downhill-signs
    format: mcq
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A car moves **down** a slope at angle $\alpha$ with its engine working at power $P$. Resistance $R$ opposes the motion. Taking down the slope as positive, what is the resultant force?
    options:
      - text: "$\\dfrac{P}{v} + mg\\sin\\alpha - R$"
        correct: true
        why: "The driving force and the weight component both point down the slope (positive); the resistance points up the slope (negative)."
      - text: "$\\dfrac{P}{v} - mg\\sin\\alpha - R$"
        why: "That is the equation for going **up** the slope, where the weight component opposes the motion."
      - text: "$\\dfrac{P}{v} - mg\\sin\\alpha + R$"
        why: "The resistance opposes the motion, so it is negative here, and the weight component helps, so it is positive."
      - text: "$mg\\sin\\alpha - \\dfrac{P}{v} - R$"
        why: "The engine drives the car in the direction it moves, so the driving force is positive."
    explanation: |
      Down the slope is positive. The driving force $\dfrac{P}{v}$ and the weight component $mg\sin\alpha$ point down the slope; the resistance points up the slope.

  - id: car-accelerating-hill
    format: numeric
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A car of mass $800$ kg travels at $15\ \text{m s}^{-1}$ up a hill inclined at $10°$. The engine's power is $40$ kW and the resistance is $250$ N. Find the acceleration at this instant. Use $g = 10\ \text{m s}^{-2}$.
    fields:
      - label: "a ="
        answer: 1.28
        tolerance: { abs: 0.01 }
        unit: "m s⁻²"
    explanation: |
      $D = \dfrac{40\,000}{15} = 2666.7$ N. Weight component $= 800 \times 10 \times \sin 10° = 1389.2$ N. Resultant $= 2666.7 - 1389.2 - 250 = 1027.5$ N, so $a = \dfrac{1027.5}{800} \approx 1.28\ \text{m s}^{-2}$. (Rounding the forces to whole numbers first gives 1.29, which is why you keep full accuracy until the end.)

  - id: car-max-speed-hill
    format: numeric
    difficulty: 3
    objectives: ["4.5.5"]
    prompt: |
      A car of mass $1200$ kg has a maximum power of $70$ kW. It climbs a hill inclined at $15°$ against a resistance of $500$ N. Find its greatest steady speed. Use $g = 10\ \text{m s}^{-2}$.
    fields:
      - label: "v ="
        answer: 19.4
        tolerance: { abs: 0.5 }
        unit: "m s⁻¹"
    explanation: |
      At top speed $\dfrac{70\,000}{v} = 1200 \times 10 \times \sin 15° + 500 \approx 3106 + 500 = 3606$, so $v = \dfrac{70\,000}{3606} \approx 19.4\ \text{m s}^{-1}$.

  - id: car-coasting-down
    format: numeric
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A car of mass $1000$ kg coasts down a hill inclined at $12°$ with its engine off. The resistance is $350$ N. Find its acceleration. Use $g = 10\ \text{m s}^{-2}$.
    fields:
      - label: "a ="
        answer: 1.73
        tolerance: { abs: 0.05 }
        unit: "m s⁻²"
    explanation: |
      No driving force. Weight component $= 1000 \times 10 \times \sin 12° \approx 2079$ N down the slope, resistance $350$ N up the slope. $a = \dfrac{2079 - 350}{1000} \approx 1.73\ \text{m s}^{-2}$.
