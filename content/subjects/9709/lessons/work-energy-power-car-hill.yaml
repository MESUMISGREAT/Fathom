blocks:
  - type: objective
    body: |
      By the end you can solve problems involving a car (or other vehicle) moving on a hill,
      using the engine power P, driving force F = P/v, resistive forces, the weight component
      along the slope, and Newton's second law to find instantaneous acceleration.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $F$ | force |
      | $P$ | power |
      | $v$ | final velocity |
      | $\alpha$ | an angle |
      | $R$ | resistance to motion |

  - type: explain
    title: Engine force from power
    body: |
      The engine produces a power output P. At a given instantaneous speed v, the driving force
      (tractive force) exerted by the engine at the wheels is

      $$F_{\text{engine}} = \frac{P}{v}.$$

      This comes from P = Fv. Note: as speed increases, the driving force for a given power
      decreases. This is why cars accelerate less quickly at high speed.

  - type: explain
    title: Forces on a car on a slope
    body: |
      A car of mass m on a hill inclined at angle α. Taking up the slope as positive:

      - Driving force: F = P/v (up the slope)
      - Weight component: mg sin α (down the slope)
      - Resistive forces: R (down the slope, usually given as a constant or function of speed)

      Net force up the slope:
      $$F_{\text{net}} = \frac{P}{v} - mg\sin\alpha - R.$$

      Newton's second law:
      $$ma = \frac{P}{v} - mg\sin\alpha - R.$$

      This gives the instantaneous acceleration a.

  - type: example
    title: Car climbing a hill at constant speed
    problem: |
      A car of mass 1200 kg travels up a hill at 15° at a constant speed of 25 m/s.
      The engine power is 80 kW. Find the total resistive force. (Use g = 10 m/s².)
    steps:
      - |
        Constant speed → a = 0 → net force = 0.
      - |
        F_engine = P/v = 80000/25 = 3200 N (up the slope).
      - |
        Weight component = mg sin 15° = 1200 × 10 × sin 15° = 3106 N (down).
      - |
        F_engine = mg sin 15° + R → 3200 = 3106 + R → R = 94 N.
    answer: |
      94 N (3 s.f.)

  - type: example
    title: Car accelerating up a hill
    problem: |
      A car of mass 1000 kg is travelling at 20 m/s up a hill at 10°.
      The engine power is 60 kW and the total resistance is 400 N.
      Find the instantaneous acceleration. (Use g = 10 m/s².)
    steps:
      - |
        F_engine = P/v = 60000/20 = 3000 N (up).
      - |
        Weight component = 1000 × 10 × sin 10° = 1736 N (down).
      - |
        Net force = 3000 − 1736 − 400 = 864 N (up).
      - |
        a = F_net/m = 864/1000 = 0.864 m/s².
    answer: |
      0.864 m/s² up the slope (3 s.f.)

  - type: example
    title: Maximum speed on a hill
    problem: |
      A car of mass 1500 kg has maximum engine power 90 kW. It climbs a hill at 12°
      against a constant resistance of 600 N. Find its maximum steady speed up the hill. (Use g = 10 m/s².)
    steps:
      - |
        At maximum steady speed, a = 0, so F_engine = mg sin α + R.
      - |
        P/v_max = mg sin α + R.
      - |
        mg sin 12° = 1500 × 10 × sin 12° = 3119 N.
      - |
        90000/v_max = 3119 + 600 = 3719.
      - |
        v_max = 90000/3719 ≈ 24.2 m/s.
    answer: |
      24.2 m/s (3 s.f.)

  - type: explain
    title: Car going downhill
    body: |
      If the car is moving **down** the slope, the weight component helps the motion.
      Taking down the slope as positive:

      - Driving force: F = P/v (down the slope, if engine is driving the wheels)
      - Weight component: mg sin α (down the slope)
      - Resistive forces: R (up the slope, opposing motion)

      Net force: F_net = P/v + mg sin α − R.
      (If the engine is not providing power, P = 0 and the car coasts.)

  - type: example
    title: Car coasting downhill
    problem: |
      A car of mass 1200 kg coasts down a hill at 8° (engine off, P = 0).
      The resistance is 300 N. Find the acceleration when the speed is 15 m/s. (Use g = 10 m/s².)
    steps:
      - |
        P = 0, so no driving force.
      - |
        Weight component = 1200 × 10 × sin 8° = 1668 N (down).
      - |
        Net force = 1668 − 300 = 1368 N (down).
      - |
        a = 1368/1200 = 1.14 m/s².
    answer: |
      1.14 m/s² down the slope (3 s.f.)

  - type: misconceptions
    items:
      - wrong: "The driving force F = P/v is constant."
        right: |
          F = P/v varies with speed. For constant power, force decreases as speed increases.
          Only if the question says "constant driving force" is F constant.
      - wrong: "At maximum speed, acceleration is maximum."
        right: |
          At maximum steady speed, acceleration is ZERO. Maximum speed is when net force = 0.
      - wrong: "Resistance always acts up the slope."
        right: |
          Resistance always opposes the **direction of motion**. If the car moves up, R is down.
          If the car moves down, R is up.
      - wrong: "Use g = 9.8 unless told otherwise, even in mechanics."
        right: |
          In Paper 4 (Mechanics), the syllabus says g = 10 m/s² is expected. Check the paper.

  - type: exam
    body: |
      - Write the force equation clearly: ma = P/v − mg sin α − R (for up the slope).
      - State the direction you are taking as positive.
      - At constant speed: a = 0, so P/v = mg sin α + R.
      - At maximum speed: a = 0, same equation.
      - If speed is changing, use instantaneous v in P/v.
      - In Paper 4, use g = 10 m/s² unless the question specifies g = 9.8.

  - type: check
    title: Check yourself
    questions: [car-hill-force-equation, max-speed-cloze, downhill-signs]

  - type: check
    title: Calculations
    questions: [car-accelerating-hill, car-max-speed-hill, car-coasting-down]

  - type: takeaways
    items:
      - "Driving force: F = P/v (from P = Fv)."
      - "Up the slope: ma = P/v − mg sin α − R."
      - "Down the slope: ma = P/v + mg sin α − R (if engine driving)."
      - "At max steady speed: a = 0, so P/v_max = mg sin α + R."
      - "Paper 4 uses g = 10 m/s² unless stated otherwise."

questions:
  - id: car-hill-force-equation
    format: cloze
    difficulty: 1
    objectives: ["4.5.5"]
    prompt: |
      For a car of mass m moving UP a slope at angle α with engine power P, speed v,
      and resistance R, the net force up the slope is F_net = P/v − {{1}} − R.
    blanks:
      - accept: ["mg sin α", "mg sin a", "mg sin alpha", "weight component"]
    explanation: |
      Weight component down the slope is mg sin α. Resistance R also acts down the slope
      (opposing motion up).

  - id: max-speed-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.5.5"]
    prompt: |
      At maximum steady speed up a hill, the acceleration is {{1}}, so the net force is {{2}}.
    blanks:
      - accept: ["zero", "0"]
      - accept: ["zero", "0"]
    explanation: |
      Maximum steady speed means constant velocity → a = 0 → F_net = 0.

  - id: downhill-signs
    format: mcq
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A car moves DOWN a slope at angle α. The engine provides power P (driving the wheels).
      Resistance R opposes motion. Taking DOWN the slope as positive, what is the net force?
    options:
      - text: "P/v + mg sin α − R"
        correct: true
        why: "Weight component and driving force are down (+), resistance is up (−)."
      - text: "P/v − mg sin α − R"
        why: "That is for moving UP the slope."
      - text: "P/v − mg sin α + R"
        why: "Wrong signs for weight and resistance."
      - text: "mg sin α − P/v − R"
        why: "Engine force is in the direction of motion, so it adds to the net force."
    explanation: |
      Down the slope positive: weight component (mg sin α) and driving force (P/v) are positive.
      Resistance opposes motion, so it is negative.

  - id: car-accelerating-hill
    format: numeric
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A car of mass 800 kg travels at 15 m/s up a hill at 10°. Engine power is 40 kW.
      Resistance is 250 N. Find the instantaneous acceleration. (Use g = 10 m/s².)
    fields:
      - answer: 1.29
        tolerance: { abs: 0.05 }
        unit: m/s²
    explanation: |
      F_engine = 40000/15 = 2667 N. Weight component = 800 × 10 × sin 10° = 1389 N.
      Net force = 2667 − 1389 − 250 = 1028 N. a = 1028/800 = 1.285 m/s² ≈ 1.29 m/s².

  - id: car-max-speed-hill
    format: numeric
    difficulty: 3
    objectives: ["4.5.5"]
    prompt: |
      A car of mass 1200 kg has maximum power 70 kW. It climbs a 15° hill against 500 N
      resistance. Find its maximum steady speed. (Use g = 10 m/s².)
    fields:
      - answer: 19.4
        tolerance: { abs: 0.5 }
        unit: m/s
    explanation: |
      At max speed: 70000/v = 1200 × 10 × sin 15° + 500 = 3106 + 500 = 3606.
      v = 70000/3606 ≈ 19.4 m/s.

  - id: car-coasting-down
    format: numeric
    difficulty: 2
    objectives: ["4.5.5"]
    prompt: |
      A 1000 kg car coasts down a 12° hill (engine off). Resistance is 350 N.
      Find the acceleration when speed is 20 m/s. (Use g = 10 m/s².)
    fields:
      - answer: 1.73
        tolerance: { abs: 0.05 }
        unit: m/s²
    explanation: |
      P = 0. Weight component = 1000 × 10 × sin 12° = 2079 N (down).
      Net force = 2079 − 350 = 1729 N. a = 1729/1000 = 1.73 m/s².