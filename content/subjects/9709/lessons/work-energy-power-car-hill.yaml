id: work-energy-power-car-hill
subject: "9709"
topic: "4.5"
title: "Car on a hill: power, force and acceleration"
summary: "Combining P = Fv with Newton's second law to find the acceleration, resistance or top speed of a vehicle going up or down a slope."
order: 5
minutes: 10
kind: core
objectives: ["4.5.5"]
prerequisites: ["work-energy-power-power", "work-energy-power-gpe-ke", "work-energy-power-work-energy-principle"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
