id: p2-algebra-factor-remainder-theorem
subject: "9709"
topic: "2.1"
title: Factor theorem and remainder theorem
summary: Use the factor and remainder theorems to find factors, solve polynomial equations and unknown coefficients, and calculate remainders.
order: 3
minutes: 5
kind: core
objectives: ["2.1.3"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): learning outcome 2.1.3, "Use the factor theorem and
    the remainder theorem." The guidance includes factors of the form $(ax + b)$ and calculating
