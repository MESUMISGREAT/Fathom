blocks:
  - type: objective
    body: |-
      By the end you can use the factor theorem and the remainder theorem to test whether a linear expression is a factor and to find unknown coefficients.

  - type: explain
    title: What they ask
    body: |-
      *Factor* $x^3 - 6x^2 + 11x - 6$ or *find the value of $k$* so that $x + 2$ is a factor of $x^3 + kx^2 - 5x + 6$.

      - A linear factor tells you a root.
      - A remainder tells you the polynomial value at the matching $x$-value.

  - type: definition
    term: Factor theorem
    body: |-
      For a polynomial $P(x)$, $(x-a)$ is a factor of $P(x)$ if and only if $P(a) = 0$.

      For $a\ne0$, $(ax+b)$ is a factor if $P\left(-\dfrac{b}{a}\right)=0$.

  - type: definition
    term: Remainder theorem
    body: |-
      When $P(x)$ is divided by $(x-a)$, the remainder is $P(a)$.

      For $a\ne0$, division by $(ax+b)$ has remainder $P\left(-\dfrac{b}{a}\right)$.

  - type: explain
    title: The method
    body: |-
      1. **Forgotten step: use the zero of the whole linear factor.** For $(x-a)$, substitute $x=a$; for $(ax+b)$, use $x=-\dfrac{b}{a}$.
      2. If the value is $0$, the factor works.
      3. To solve a polynomial equation, use a root to divide out a factor, then solve the lower-degree equation.
      4. If the value is not $0$, it is the remainder; no long division is needed.
      5. If a coefficient is unknown, set the value equal to the required remainder and solve for it.

      This is the shortcut: the factor theorem is the “check the root” version of polynomial division.

  - type: example
    title: Easy example with a check
    problem: |-
      Show that $(x - 2)$ is a factor of $x^3 - 7x + 6$.
    steps:
      - |-
        Evaluate $P(2) = 2^3 - 7(2) + 6$.
      - |-
        $P(2) = 8 - 14 + 6 = 0$.
      - |-
        So $(x - 2)$ is a factor.
    answer: |-
      $P(2) = 0$, so by the factor theorem, $(x - 2)$ is a factor of $x^3 - 7x + 6$.

      Check: $(x-2)(x^2+2x-3)=x^3-7x+6$.

  - type: check
    questions: [factor-theorem-test, factor-ax-plus-b]

  - type: example
    title: "Exam-style: solve a polynomial equation"
    problem: |-
      Solve $x^3-7x+6=0$.
    steps:
      - |-
        Try $x=1$, a factor of the constant term. $P(1)=1-7+6=0$, so $(x-1)$ is a factor.
      - |-
        Dividing gives $x^2+x-6=(x+3)(x-2)$.
      - |-
        So $(x-1)(x+3)(x-2)=0$.
    answer: |-
      $x=-3$, $x=1$ or $x=2$.

      Check: each value makes one factor zero.

      The factorisation also expands back to $x^3-7x+6$.

  - type: check
    questions: [factor-k-value, remainder-theorem-value, factor-solve-cubic]

  - type: misconceptions
    items:
      - wrong: |-
          If $P(2)=0$, then $(2x-4)$ is not a factor because the factor theorem only gives $(x-2)$.
        right: |-
          Since $2x-4=2(x-2)$, both $(x-2)$ and $(2x-4)$ divide $P(x)$ when $P(2)=0$. The factor theorem is usually stated using the monic factor $(x-2)$.
      - wrong: |-
          $(3x - 2)$ gives a root at $x = -\dfrac{2}{3}$.
        right: |-
          Set $3x - 2 = 0$, so $x = \dfrac{2}{3}$.
      - wrong: |-
          The remainder theorem is only for division by $(x-a)$.
        right: |-
          It works for any linear divisor: if you divide by $(ax + b)$, the remainder is $P\left(-\dfrac{b}{a}\right)$.

  - type: exam
    body: |-
      - If a question says “show that $(x-a)$ is a factor”, substitute $x=a$ and check the value is $0$.
      - If it says “find the value of $k$” and gives a factor, set the polynomial equal to $0$ at the matching root value.
      - For a factor like $(ax + b)$, the root is $x = -\dfrac{b}{a}$, not $-b$.

  - type: takeaways
    items:
      - |-
        $(x-a)$ is a factor of $P(x)$ exactly when $P(a) = 0$.
      - |-
        The remainder theorem says the remainder from dividing by $(x-a)$ is $P(a)$.
      - |-
        For $(ax + b)$, use $x = -\dfrac{b}{a}$.
      - |-
        A zero remainder means a factor; a non-zero remainder gives the exact remainder without long division.

questions:
  - id: factor-theorem-test
    format: mcq
    difficulty: 1
    objectives: ["2.1.3"]
    prompt: |-
      Which statement is correct for $P(x) = x^3 - 7x + 6$?
    explanation: |-
      Check the value at $x = 2$: $P(2) = 8 - 14 + 6 = 0$, so $(x - 2)$ is a factor.
    options:
      - text: $(x - 2)$ is a factor because $P(2) = 0$
        correct: true
        why: |-
          The factor theorem says $(x-a)$ is a factor exactly when $P(a)=0$.
      - text: $(x - 2)$ is a factor because $P(2) = 2$
        why: |-
          If $P(2)=2$, then $x=2$ is not a root, so it is not a factor.
      - text: $(x + 2)$ is a factor because $P(-2)=0$
        why: |-
          $P(-2) = -8 + 14 + 6 = 12$, so this is not correct.
      - text: $(x - 3)$ is a factor because the coefficient of $x$ is $-7$
        why: |-
          The coefficient of $x$ does not decide the factor; the root test does.

  - id: factor-ax-plus-b
    format: numeric
    difficulty: 2
    objectives: ["2.1.3"]
    prompt: |-
      Find the root of the factor $3x - 2$.
    fields:
      - label: "x ="
        answer: 0.6666666666666666
        tolerance:
          abs: 0.0005
    explanation: |-
      Set $3x - 2 = 0$.

      $3x = 2$, so $x = \dfrac{2}{3}$.

  - id: factor-k-value
    format: numeric
    difficulty: 2
    objectives: ["2.1.3"]
    prompt: |-
      Find $k$ so that $(x + 1)$ is a factor of $x^3 + kx^2 + 2x + 1$.
    fields:
      - label: "k ="
        answer: 2
    explanation: |-
      By the factor theorem, substitute $x=-1$:

      $(-1)^3 + k(-1)^2 + 2(-1) + 1 = 0$

      so $-1 + k - 2 + 1 = 0$, giving $k = 2$.

  - id: remainder-theorem-value
    format: numeric
    difficulty: 1
    objectives: ["2.1.3"]
    prompt: |-
      Use the remainder theorem to find the remainder when $x^3 - 4x + 7$ is divided by $x - 3$.
    fields:
      - label: "remainder ="
        answer: 22
    explanation: |-
      The remainder is $P(3) = 3^3 - 4(3) + 7 = 27 - 12 + 7 = 22$.

  - id: factor-solve-cubic
    format: numeric
    difficulty: 3
    objectives: ["2.1.3"]
    prompt: |-
      Solve $x^3-7x+6=0$. Give the roots in increasing order.
    fields:
      - label: "x_1 ="
        answer: -3
      - label: "x_2 ="
        answer: 1
      - label: "x_3 ="
        answer: 2
    explanation: |-
      $x^3-7x+6=(x-1)(x+3)(x-2)$.

      Set each factor equal to zero and order the roots: $-3$, $1$, $2$.
