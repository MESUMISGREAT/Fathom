    Revised on 2026-10-31 for beginners to the Fathom layout rules (short paragraphs, one step per line, every symbol explained). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can explain why $(x - a)^2 + (y - b)^2 = r^2$ is a circle, read off its **centre** and **radius**, and write the equation of a circle from the information you're given.

  - type: explain
    title: A circle is a distance rule
    body: |-
      Tie a goat to a post with a 5 m rope and let it wander to the very end in every direction. The path it traces is a circle: every point exactly 5 m from the post.

      That's the definition. A **circle** is the set of all points at a fixed distance $r$ (the **radius**) from a fixed point (the **centre**).

      Where the goat analogy breaks: real goats wander *inside* the circle too. The circle is only the edge.

  - type: diagram
    diagram: coordinate-geometry-circle-pythagoras
    alt: >-
      Square grid with a blue circle of radius 5 centred at C(2, 1). A general point P(x, y) on
      the circle, drawn at (5, 5), is joined to C by a line labelled r = 5. A shaded right-angled
      triangle under CP has a horizontal side labelled x − 2 and a vertical side labelled y − 1,
      with the right angle at (5, 1). The equation (x − 2)² + (y − 1)² = 5² is written below.
    caption: |-
      For any point $P(x, y)$ on the circle, the triangle has legs $x - 2$ and $y - 1$ and hypotenuse 5. Pythagoras does the rest: $(x - 2)^2 + (y - 1)^2 = 25$.

  - type: explain
    title: Turning the rule into an equation
    body: |-
      Take the circle with centre $C(2, 1)$ and radius 5. Let $P(x, y)$ be **any** point on it.

      Draw a right-angled triangle with $CP$ as the long side (the hypotenuse):

      - across: from $x = 2$ to $x$, a distance of $x - 2$
      - up: from $y = 1$ to $y$, a distance of $y - 1$
      - hypotenuse: $CP = 5$, the radius

      Pythagoras says (across)² + (up)² = (hypotenuse)²:

      $$(x - 2)^2 + (y - 1)^2 = 5^2$$

      If $P$ is to the left of or below $C$, these come out negative. Squaring makes them positive, so the equation still works.

      This is true for every point on the circle, and for no other point. So it **is** the equation of the circle.

  - type: definition
    term: Equation of a circle
    body: |-
      The circle with **centre $(a, b)$** and **radius $r$** has equation

      $$(x - a)^2 + (y - b)^2 = r^2$$

      - $(x, y)$ is any point on the circle.
      - $x - a$ and $y - b$ are how far across and up that point is from the centre.

      A point lies on the circle exactly when its coordinates satisfy the equation.

      A circle centred at the origin $(0, 0)$ has equation $x^2 + y^2 = r^2$.

  - type: explain
    title: Reading one off
    body: |-
      Two traps, both about signs and squares:

      - The centre's coordinates have the **opposite sign** to the numbers in the brackets: $(x + 3)^2 + (y - 1)^2 = 16$ has centre $(-3, 1)$.
      - The right-hand side is $r^2$, so take the **square root**: radius $\sqrt{16} = 4$, not 16.

      Think of $(x + 3)$ as $(x - (-3))$, and the sign flip stops being mysterious.

  - type: check
    questions: [ce-read, ce-write]

  - type: example
    title: Centre and a point on the circle
    problem: |-
      A circle has centre $(-1, 2)$ and passes through $(3, 5)$. Find its equation.
    steps:
      - |-
        The radius is the distance from the centre $(-1, 2)$ to the point $(3, 5)$ on the circle.

        By Pythagoras, $r^2$ = (difference in $x$)² + (difference in $y$)²:

        $$r^2 = (3 - (-1))^2 + (5 - 2)^2$$

        $$= 4^2 + 3^2 = 16 + 9 = 25$$
      - |-
        The equation needs $r^2$, not $r$, so there's no need to square-root. (Here $r = 5$ anyway.)
      - |-
        Substitute $a = -1$, $b = 2$ and $r^2 = 25$:

        $$(x - (-1))^2 + (y - 2)^2 = 25$$

        And $x - (-1) = x + 1$.
    answer: |-
      $(x + 1)^2 + (y - 2)^2 = 25$.

  - type: example
    title: Ends of a diameter
    problem: |-
      $A(-2, 1)$ and $B(4, 9)$ are the ends of a diameter of a circle. Find the equation of the circle.
    steps:
      - |-
        A **diameter** is a line through the centre from one side of the circle to the other. So the centre is its **midpoint**:

        $$\left(\frac{-2 + 4}{2}, \frac{1 + 9}{2}\right) = (1, 5)$$
      - |-
        The radius is **half** the diameter. First find the length $AB$. Across: $4 - (-2) = 6$. Up: $9 - 1 = 8$.

        $$AB = \sqrt{6^2 + 8^2} = \sqrt{100} = 10$$

        So $r = 5$ and $r^2 = 25$.
      - |-
        Substitute $a = 1$, $b = 5$, $r^2 = 25$ into $(x - a)^2 + (y - b)^2 = r^2$:

        $$(x - 1)^2 + (y - 5)^2 = 25$$
      - |-
        (Or find the distance from the centre to $A$: $\sqrt{3^2 + 4^2} = 5$ ✓)
    answer: |-
      $(x - 1)^2 + (y - 5)^2 = 25$.

  - type: check
    questions: [ce-through-point, ce-diameter]

  - type: explain
    title: Inside, on or outside?
    body: |-
      Substitute the point into the left-hand side, $(x - a)^2 + (y - b)^2$. That's the **squared distance** from the centre. Then compare it with $r^2$:

      | Result | The point is |
      | --- | --- |
      | less than $r^2$ | inside the circle |
      | equal to $r^2$ | on the circle |
      | greater than $r^2$ | outside the circle |

  - type: misconceptions
    items:
      - wrong: |-
          $(x - 1)^2 + (y + 4)^2 = 9$ has radius 9.
        right: |-
          The right-hand side is $r^2$, so $r = \sqrt9 = 3$.
      - wrong: |-
          $(x + 2)^2 + (y - 5)^2 = 36$ has centre $(2, -5)$.
        right: |-
          Opposite signs: the centre is $(-2, 5)$. Check by substituting: the brackets are both 0 at $(-2, 5)$.
      - wrong: |-
          The circle with centre $(4, -1)$ and radius 6 is $(x - 4)^2 + (y + 1)^2 = 6$.
        right: |-
          Square the radius: $(x - 4)^2 + (y + 1)^2 = 36$.

  - type: exam
    body: |-
      - Typical wording: *Find the equation of the circle with centre $C$ which passes through $A$*, or with $AB$ as a diameter. About 3 marks: centre, $r^2$, equation.
      - Leave $r^2$ as a number (often not a perfect square): $(x - 2)^2 + (y + 1)^2 = 13$ is perfect. No need for $(\sqrt{13})^2$.
      - Insider hack: plug the given point into your final equation. If it doesn't satisfy it, recheck your signs.
      - "The circle **touches** the $x$-axis" is a radius in disguise. The axis touches the circle at exactly one point (it is a **tangent**), so the radius is the distance from the centre straight down (or up) to it.
        - Centre $(a, b)$ touching the $x$-axis: $r = |b|$.
        - Touching the $y$-axis: $r = |a|$.
        - The bars $|\;|$ mean "size, ignoring the sign", e.g. $|-3| = 3$. A distance can't be negative.

  - type: check
    questions: [ce-inside, ce-spot, ce-touches]

  - type: takeaways
    items:
      - |-
        $(x - a)^2 + (y - b)^2 = r^2$: centre $(a, b)$, radius $r$. It's Pythagoras for every point on the circle.
      - |-
        Centre: opposite signs to the brackets. Radius: square-root the right-hand side.
      - |-
        From a diameter: centre = midpoint, radius = half the length.
      - |-
        Compare $(x - a)^2 + (y - b)^2$ with $r^2$ to tell inside, on or outside.

questions:
  - id: ce-read
    format: numeric
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |-
      Find the centre and radius of the circle $(x + 4)^2 + (y - 7)^2 = 36$.
    fields:
      - label: "centre x ="
        answer: -4
      - label: "centre y ="
        answer: 7
      - label: "radius ="
        answer: 6
    explanation: |-
      $(x + 4)^2 = (x - (-4))^2$, so the centre is $(-4, 7)$. The radius is $\sqrt{36} = 6$.

  - id: ce-write
    format: mcq
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |-
      Which is the equation of the circle with centre $(3, -2)$ and radius 5?
    explanation: |-
      $(x - a)^2 + (y - b)^2 = r^2$ with $a = 3$, $b = -2$, $r = 5$: $(x - 3)^2 + (y + 2)^2 = 25$.
    options:
      - text: |-
          $(x - 3)^2 + (y + 2)^2 = 25$
        correct: true
        why: |-
          Brackets have the opposite signs to the centre, and the right-hand side is $5^2$.
      - text: |-
          $(x + 3)^2 + (y - 2)^2 = 25$
        why: |-
          Signs the wrong way round: this circle has centre $(-3, 2)$.
      - text: |-
          $(x - 3)^2 + (y + 2)^2 = 5$
        why: |-
          The right-hand side must be $r^2 = 25$. This one has radius $\sqrt5$.
      - text: |-
          $(x + 3)^2 + (y - 2)^2 = 5$
        why: |-
          Both mistakes at once: wrong centre $(-3, 2)$ and radius $\sqrt5$.

  - id: ce-through-point
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      A circle has centre $(-2, 3)$ and passes through $(4, -5)$. Its equation is $(x + 2)^2 + (y - 3)^2 = k$. Find $k$.
    fields:
      - label: "k ="
        answer: 100
    explanation: |-
      $k = r^2 = (4 - (-2))^2 + (-5 - 3)^2 = 36 + 64 = 100$. (So the radius is 10.)

  - id: ce-diameter
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      $A(-3, 4)$ and $B(5, -2)$ are the ends of a diameter of a circle. Its equation is $(x - a)^2 + (y - b)^2 = r^2$. Find $a$, $b$ and $r^2$.
    fields:
      - label: "a ="
        answer: 1
      - label: "b ="
        answer: 1
      - label: "r² ="
        answer: 25
    explanation: |-
      Centre = midpoint of $AB$: $\left(\dfrac{-3 + 5}{2}, \dfrac{4 + (-2)}{2}\right) = (1, 1)$.

      $AB = \sqrt{8^2 + 6^2} = 10$, so $r = 5$ and $r^2 = 25$. Check with $A$: $(-3 - 1)^2 + (4 - 1)^2 = 16 + 9 = 25$ ✓

  - id: ce-inside
    format: mcq
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      Where is the point $(5, 1)$ relative to the circle $(x - 1)^2 + (y + 3)^2 = 25$?
    explanation: |-
      $(5 - 1)^2 + (1 + 3)^2 = 16 + 16 = 32$. That's the squared distance from the centre, and $32 > 25$, so the point is outside.
    options:
      - text: |-
          On the circle
        why: |-
          That needs the left-hand side to equal 25 exactly. It's 32.
      - text: |-
          Outside the circle
        correct: true
        why: |-
          Squared distance from the centre is 32, which is more than $r^2 = 25$.
      - text: |-
          Inside the circle
        why: |-
          Inside needs a squared distance less than 25. If you got $4^2 + (-2)^2 = 20$, check the second bracket: $1 + 3 = 4$, not $1 - 3$.
      - text: |-
          You can't tell without a sketch
        why: |-
          You can: substitute into $(x - 1)^2 + (y + 3)^2$ and compare with 25.

  - id: ce-spot
    format: spot-error
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      A student finds the equation of the circle with centre $(5, -1)$ that passes through $(1, 2)$. Which line contains the first error?
    lines:
      - |-
        The radius is the distance from $(5, -1)$ to $(1, 2)$.
      - |-
        $r^2 = (1 - 5)^2 + (2 - (-1))^2 = 16 + 9 = 25$
      - |-
        So $r = 5$.
      - |-
        The equation is $(x - 5)^2 + (y - 1)^2 = 25$.
    errorLine: 4
    fix: |-
      The centre's $y$-coordinate is $-1$, so the bracket is $(y - (-1)) = (y + 1)$: $(x - 5)^2 + (y + 1)^2 = 25$.
    explanation: |-
      Test the student's equation with the given point: $(1 - 5)^2 + (2 - 1)^2 = 16 + 1 = 17 \neq 25$. The radius work is right; the sign of $b$ slipped in the last line.

  - id: ce-touches
    format: numeric
    difficulty: 3
    objectives: ["1.3.3"]
    prompt: |-
      A circle has centre $(-3, 4)$ and touches the $x$-axis. Find $r^2$, and the $y$-coordinates of the two points where the circle crosses the $y$-axis. Give exact answers (such as `2 − √3`) or decimals to 3 significant figures.
    fields:
      - label: "r² ="
        answer: 16
      - label: "upper point: y ="
        answer: 6.645751311064591
        tolerance: { abs: 0.005 }
      - label: "lower point: y ="
        answer: 1.3542486889354093
        tolerance: { abs: 0.005 }
    explanation: |-
      The $x$-axis is a tangent, so the radius is the distance from $(-3, 4)$ down to the axis: $r = 4$ and $r^2 = 16$. The circle is $(x + 3)^2 + (y - 4)^2 = 16$.

      On the $y$-axis, $x = 0$: $9 + (y - 4)^2 = 16$, so $(y - 4)^2 = 7$ and $y = 4 \pm \sqrt7$.

      That's $4 + \sqrt7 \approx 6.65$ and $4 - \sqrt7 \approx 1.35$.
