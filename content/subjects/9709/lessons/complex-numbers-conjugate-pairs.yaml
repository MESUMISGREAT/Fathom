id: complex-numbers-conjugate-pairs
subject: "9709"
topic: "3.9"
title: Conjugate pairs — non-real roots come in twos
summary: "Why complex roots of real polynomials appear in conjugate pairs, and using this to solve cubic and quartic equations."
order: 3
minutes: 4
kind: core
objectives: ["3.9.3"]
prerequisites: ["complex-numbers-cartesian-operations"]
