blocks:
  - type: objective
    body: |
      By the end you can explain why non-real roots of a polynomial with real coefficients occur
      in conjugate pairs, and use a given complex root to find the remaining roots of a cubic or
      quartic equation.

  - type: explain
    title: The conjugate pair theorem
    body: |
      If a polynomial $P(x)$ has **real coefficients** and the non-real number $z$ is a root, then its
      conjugate $z^*$ is also a root.

      **Why?** Conjugating flips the sign of every imaginary part, and it behaves well with
      arithmetic: the conjugate of a sum is the sum of the conjugates, and the conjugate of a power
      is the power of the conjugate, $(z^k)^* = (z^*)^k$. A real number is its own conjugate.

      So start from $P(z) = a_n z^n + \dots + a_1 z + a_0 = 0$ and take the conjugate of both sides.
      Each real coefficient stays the same and each $z$ becomes $z^*$:

      $$a_n (z^*)^n + \dots + a_1 z^* + a_0 = 0^* = 0$$

      That says exactly $P(z^*) = 0$. So $z^*$ is a root too, and non-real roots come in
      **conjugate pairs**.

  - type: explain
    title: Turning a conjugate pair into a factor
    body: |
      If $z$ and $z^*$ are roots, then $(x - z)$ and $(x - z^*)$ are factors. Multiply them and the
      imaginary parts cancel, leaving a **quadratic with real coefficients**.

      For the pair $1 \pm 2i$:

      $$\big(x - (1 + 2i)\big)\big(x - (1 - 2i)\big) = \big((x - 1) - 2i\big)\big((x - 1) + 2i\big) = (x - 1)^2 - (2i)^2$$

      Since $(2i)^2 = -4$, this is $(x - 1)^2 + 4 = x^2 - 2x + 5$.

      That quadratic is the key. Divide the polynomial by it (or compare coefficients) and what is
      left is a polynomial you can already solve.

  - type: example
    title: A cubic with one complex root
    problem: |
      One root of $x^3 - 3x^2 + 4x - 12 = 0$ is $2i$. Find the other two roots.
    steps:
      - "The coefficients are real and $2i$ is a root, so its conjugate $-2i$ is also a root."
      - "The quadratic factor from the pair is $(x - 2i)(x + 2i) = x^2 - (2i)^2 = x^2 + 4$."
      - "A cubic is a quadratic times a linear factor, so write $x^3 - 3x^2 + 4x - 12 = (x^2 + 4)(x + k)$."
      - "Expand the right side: $x^3 + kx^2 + 4x + 4k$. Compare constant terms: $4k = -12$, so $k = -3$."
      - "Check the other coefficients: $x^2$ gives $k = -3$ ✓ and $x$ gives $4 = 4$ ✓. So the factorisation is $(x^2 + 4)(x - 3)$."
      - "The linear factor $x - 3$ gives the third root, $x = 3$. Check: $27 - 27 + 12 - 12 = 0$ ✓"
    answer: |
      The three roots are $2i$, $-2i$ and $3$.

  - type: example
    title: A quartic with one complex root
    problem: |
      One root of $x^4 - 4x^3 + 11x^2 - 14x + 10 = 0$ is $1 + 2i$. Find all the roots.
    steps:
      - "Real coefficients, so $1 - 2i$ is also a root."
      - "Their quadratic factor is $x^2 - 2x + 5$ (worked out above)."
      - "Write $x^4 - 4x^3 + 11x^2 - 14x + 10 = (x^2 - 2x + 5)(x^2 + px + q)$ and expand the right side: $x^4 + (p - 2)x^3 + (q - 2p + 5)x^2 + (5p - 2q)x + 5q$."
      - "Compare the $x^3$ terms: $p - 2 = -4$, so $p = -2$. Compare the constants: $5q = 10$, so $q = 2$."
      - "Check the two middle terms: $x^2$: $2 + 4 + 5 = 11$ ✓; $x$: $-10 - 4 = -14$ ✓."
      - "Solve $x^2 - 2x + 2 = 0$ with the formula: $x = \\dfrac{2 \\pm \\sqrt{4 - 8}}{2} = \\dfrac{2 \\pm 2i}{2} = 1 \\pm i$. Notice that these two roots are a conjugate pair as well."
    answer: |
      The four roots are $1 + 2i$, $1 - 2i$, $1 + i$ and $1 - i$.

  - type: check
    title: Conjugate pairs in action
    questions: [cn-cubic-root, cn-quartic-roots, cn-construct-poly]

  - type: misconceptions
    items:
      - wrong: "All roots of a real polynomial come in conjugate pairs."
        right: "Only **non-real** roots come in conjugate pairs. Real roots are their own conjugates and can appear alone."
      - wrong: "If $2 + 3i$ is a root, the other root is $-2 - 3i$."
        right: "The conjugate is $2 - 3i$ (change the sign of the imaginary part only)."
      - wrong: "This works for polynomials with complex coefficients too."
        right: "The theorem **requires real coefficients**. $x - i = 0$ has root $i$ but not $-i$."

  - type: exam
    body: |
      - Typical wording: *One root of the equation $x^3 + \dots = 0$ is $1 + 2i$. Find the other roots.*
      - You **must** state: "Since the coefficients are real, the conjugate $1 - 2i$ is also a root."
      - Multiply out $(x - z)(x - z^*)$ to get a real quadratic factor, then divide or compare
        coefficients to find the remaining factor.
      - Check your factorisation by expanding it, or by substituting the final root.

  - type: takeaways
    items:
      - 'Real coefficients $\Rightarrow$ non-real roots occur in conjugate pairs: $z$ and $z^*$.'
      - "Real roots are their own conjugates and can appear singly."
      - "A conjugate pair gives a real quadratic factor $(x - z)(x - z^*)$."
      - "Divide, or compare coefficients, to find what is left, then solve it."
      - "Always state 'since the coefficients are real': it is a required justification."

questions:
  - id: cn-cubic-root
    format: mcq
    difficulty: 2
    objectives: ["3.9.3"]
    prompt: |
      One root of $x^3 - 6x^2 + 13x - 10 = 0$ is $2 + i$. What is the real root?
    options:
      - text: "$2$"
        correct: true
        why: 'The pair $2 \pm i$ gives the factor $x^2 - 4x + 5$. Then $(x^2 - 4x + 5)(x + k)$ has constant term $5k = -10$, so $k = -2$ and the real root is $2$.'
      - text: "$3$"
        why: "$(x^2 - 4x + 5)(x - 3)$ has constant term $-15$, not $-10$."
      - text: "$1$"
        why: "$(x^2 - 4x + 5)(x - 1)$ has constant term $-5$, not $-10$."
      - text: "$-2$"
        why: "That is $k$, not the root: the factor $x - 2$ gives $x = 2$."
    explanation: |
      Real coefficients $\Rightarrow$ $2 - i$ is also a root. The quadratic factor is
      $\big((x - 2) - i\big)\big((x - 2) + i\big) = (x - 2)^2 + 1 = x^2 - 4x + 5$. Write the cubic as
      $(x^2 - 4x + 5)(x + k)$; the constant terms give $5k = -10$, so $k = -2$, the factor is $x - 2$
      and the real root is $2$.

  - id: cn-quartic-roots
    format: mcq
    difficulty: 2
    objectives: ["3.9.3"]
    prompt: |
      One root of $x^4 - 2x^3 + 3x^2 - 2x + 2 = 0$ is $i$. The other three roots are:
    options:
      - text: "$-i, 1+i, 1-i$"
        correct: true
        why: 'Conjugate gives $-i$. Quadratic factor for $i, -i$ is $x^2 + 1$. Division gives $x^2 - 2x + 2$ with roots $1 \pm i$.'
      - text: "$-i, -1+i, -1-i$"
        why: "Those come from $x^2 + 2x + 2$, but $(x^2 + 1)(x^2 + 2x + 2)$ has $x^3$ coefficient $+2$, not $-2$."
      - text: "$-i, 2+i, 2-i$"
        why: "Those come from $x^2 - 4x + 5$, but $(x^2 + 1)(x^2 - 4x + 5)$ has $x^3$ coefficient $-4$, not $-2$."
      - text: "$-i, i, 1$"
        why: "Only three roots, and $i$ is listed twice."
    explanation: |
      Conjugate gives $-i$. Quadratic $(x-i)(x+i) = x^2+1$. Divide the quartic by $x^2+1$: quotient
      $x^2 - 2x + 2$, and $x^2 - 2x + 2 = 0 \Rightarrow x = 1 \pm i$. Roots: $i, -i, 1+i, 1-i$.

  - id: cn-construct-poly
    format: text
    style: short
    difficulty: 2
    objectives: ["3.9.3"]
    prompt: |
      Find the cubic equation with real coefficients whose roots are $3$, $1+2i$, and $1-2i$.
      Give your answer in the form $x^3 + ax^2 + bx + c = 0$.
    accept:
      - "x^3 - 5x^2 + 11x - 15 = 0"
      - "x³ - 5x² + 11x - 15 = 0"
      - "x^3-5x^2+11x-15=0"
      - "x^3 − 5x^2 + 11x − 15 = 0"
    model: "$x^3 - 5x^2 + 11x - 15 = 0$"
    explanation: |
      Each root gives a factor. The pair $1 \pm 2i$ gives $x^2 - 2x + 5$, and the root $3$ gives $x - 3$.
      Multiply: $(x - 3)(x^2 - 2x + 5) = x^3 - 2x^2 + 5x - 3x^2 + 6x - 15 = x^3 - 5x^2 + 11x - 15$.
      So the equation is $x^3 - 5x^2 + 11x - 15 = 0$.
