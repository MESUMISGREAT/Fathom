id: kinematics-displacement-time-graphs
subject: "9709"
topic: "4.2"
title: "Reading a displacement–time graph"
summary: "The gradient of a displacement–time graph is velocity. Steep, flat and downhill sections each tell a different story."
order: 2
minutes: 7
kind: core
objectives: ["4.2.2"]
prerequisites: ["kinematics-scalars-and-vectors"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Mathematics 9709 syllabus, topic 4.2
    Kinematics of motion in a straight line, learning outcome 4.2.2 (sketch and interpret
    displacement-time graphs; the gradient represents velocity). All questions and examples are
    original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by the same AI
    model. No separate reviewer model and no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can read a **displacement–time graph**, use its **gradient** to find velocity,
      and sketch a graph from a description of a journey.

  - type: explain
    title: A graph that answers "where?"
    body: |
      A displacement–time graph plots **displacement** on the vertical axis and **time** on the
      horizontal axis. Each point answers the question "where was the particle at this moment?"

      You have already met the key idea without the name: on a straight-line graph, the gradient is
      the change in the vertical quantity divided by the change in the horizontal quantity.

      Here that is

      $$\text{gradient} = \frac{\Delta s}{\Delta t} = \text{velocity}$$

      So the geometry of the graph *is* the motion.

  - type: definition
    term: Gradient of a displacement–time graph
    body: |
      The gradient of a displacement–time graph at a point equals the **velocity** there. On a
      straight section the gradient is constant, so the velocity is constant.

  - type: explain
    title: What the shapes mean
    body: |
      | Feature of the graph | What it means |
      | --- | --- |
      | Straight line sloping up | constant positive velocity |
      | Horizontal line | at rest ($v = 0$) |
      | Straight line sloping down | constant negative velocity (moving back) |
      | Steeper line | larger speed |
      | Curve | changing velocity (accelerating or decelerating) |
      | Two graphs crossing | the particles are at the same displacement at that time |

      The **sign** of the gradient gives the direction; the **size** of the gradient gives the
      speed.

      For a curved graph, the gradient at a single instant is the gradient of the **tangent** at
      that point. That is the instantaneous velocity. The gradient of a **chord** between two points
      gives the average velocity over that interval.

  - type: diagram
    diagram: kinematics-graphs
    alt: >-
      Top panel: a displacement-time graph that curves upward to 16 m at 4 s, rises in a straight
      line to 48 m at 8 s and then flattens off to 56 m at 10 s, with gradients labelled 8 and
      falling to 0. Bottom panel: the matching velocity-time graph rising to 8 m/s at 4 s, staying
      flat, then falling to 0 at 10 s, with areas 16 m, 32 m and 8 m marked.
    caption: >-
      On the displacement–time graph, the gradient is the velocity plotted underneath.

  - type: example
    title: Three sections, three velocities
    problem: |
      A particle has displacement $0\ \text{m}$ at $t = 0$, $12\ \text{m}$ at $t = 4\ \text{s}$,
      $12\ \text{m}$ at $t = 10\ \text{s}$ and $2\ \text{m}$ at $t = 14\ \text{s}$. Each section is
      a straight line.

      Find the velocity in each section, and the average velocity over the whole $14\ \text{s}$.
    steps:
      - |
        First section: $\dfrac{12 - 0}{4 - 0} = 3\ \text{m s}^{-1}$.
      - |
        Second section: $\dfrac{12 - 12}{10 - 4} = 0\ \text{m s}^{-1}$ — the particle is at rest.
      - |
        Third section: $\dfrac{2 - 12}{14 - 10} = -2.5\ \text{m s}^{-1}$ — moving in the negative
        direction.
      - |
        Whole journey: average velocity $= \dfrac{\text{final} - \text{initial displacement}}{\text{time}}
        = \dfrac{2 - 0}{14} \approx 0.14\ \text{m s}^{-1}$.
    answer: |
      $3\ \text{m s}^{-1}$, then $0$, then $-2.5\ \text{m s}^{-1}$; average velocity
      $\approx 0.14\ \text{m s}^{-1}$.

  - type: explain
    title: Sketching from a story
    body: |
      To sketch a displacement–time graph:

      1. Mark the starting displacement at $t = 0$.
      2. Break the journey into stages where the velocity is constant.
      3. For each stage, draw a straight line whose **gradient** is that velocity.
      4. Where the particle stops, draw a horizontal line.
      5. Where it turns round, the gradient changes sign.

      A common task is a cyclist who rides away, waits, then returns past the start. The graph rises,
      flattens, then falls, and the falling line may cross the axis if the cyclist goes beyond the
      starting point.

  - type: misconceptions
    items:
      - wrong: "A horizontal section means the particle has stopped accelerating."
        right: >-
          A horizontal section means the displacement is not changing, so the particle is at rest:
          velocity zero and acceleration zero.
      - wrong: "The graph shows the path the particle took through space."
        right: >-
          It shows displacement against time. A particle moving in a straight line can produce a
          graph that goes up and down.
      - wrong: "A steeper line means a larger displacement."
        right: >-
          Steepness measures how fast the displacement changes: it is the velocity, not the size of
          the displacement.
      - wrong: "The average velocity is the total distance divided by the time."
        right: >-
          Average velocity uses the net displacement. Distance divided by time is the average speed.

  - type: exam
    body: |
      When asked for a velocity from a graph, show the division: $\dfrac{\Delta s}{\Delta t}$ with the
      two readings. Method marks are for using the gradient.

      For an instantaneous velocity on a curve, draw the tangent and use two points on it. For an
      average velocity, use the two endpoints of the interval, not the tangent.

      If the graph crosses the time axis, the particle has passed the starting point; the velocity
      does not suddenly become zero there.

  - type: check
    title: Check yourself
    questions: [gradient-basic, average-velocity-chord]

  - type: check
    title: Interpreting shapes
    questions: [rest-section, steepest-speed, gradient-cloze]

  - type: check
    title: Spot the slip
    questions: [distance-for-velocity]

  - type: takeaways
    items:
      - "Gradient of a displacement–time graph = velocity; size gives speed, sign gives direction."
      - "Horizontal line: at rest. Straight line: constant velocity. Curve: changing velocity."
      - "Tangent gradient gives instantaneous velocity; chord gradient gives average velocity."
      - "Average velocity uses net displacement, not total distance."

questions:
  - id: gradient-basic
    format: numeric
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      On a displacement–time graph, a straight line passes through $(0, 0)$ and $(8, 24)$, with
      displacement in metres and time in seconds.

      Find the velocity.
    fields:
      - answer: 3
        tolerance: { abs: 0.05 }
        unit: m s⁻¹
    explanation: |
      The gradient is $\dfrac{24 - 0}{8 - 0} = 3\ \text{m s}^{-1}$.

  - id: average-velocity-chord
    format: numeric
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      A particle has displacement $5\ \text{m}$ at $t = 1\ \text{s}$ and $17\ \text{m}$ at
      $t = 7\ \text{s}$.

      Find its average velocity over this interval.
    fields:
      - answer: 2
        tolerance: { abs: 0.05 }
        unit: m s⁻¹
    explanation: |
      Average velocity is the chord gradient:
      $\dfrac{17 - 5}{7 - 1} = \dfrac{12}{6} = 2\ \text{m s}^{-1}$.

  - id: rest-section
    format: mcq
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      A displacement–time graph is horizontal between $t = 3\ \text{s}$ and $t = 7\ \text{s}$. What
      is happening?
    options:
      - text: "The particle is at rest."
        correct: true
        why: "Correct: the displacement is not changing, so the velocity is zero."
      - text: "The particle is moving at constant speed."
        why: "Constant non-zero speed would give a sloping straight line, not a horizontal one."
      - text: "The particle is accelerating."
        why: "Acceleration would show as a curve, and here the displacement is constant."
      - text: "The particle has returned to the origin."
        why: "It is stationary at whatever displacement the horizontal line is drawn at, not necessarily zero."
    explanation: |
      A horizontal displacement–time graph has zero gradient, so the velocity is zero.

  - id: steepest-speed
    format: mcq
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Four particles have straight-line displacement–time graphs. Which particle has the greatest
      speed?
    options:
      - text: 'One whose displacement rises $6\ \text{m}$ in $2\ \text{s}$.'
        correct: true
        why: "Correct: speed = 6/2 = 3 m/s, the largest of the four."
      - text: 'One whose displacement rises $10\ \text{m}$ in $5\ \text{s}$.'
        why: "That is 2 m/s."
      - text: 'One whose displacement falls $4\ \text{m}$ in $2\ \text{s}$.'
        why: "That is a speed of 2 m/s (velocity −2 m/s)."
      - text: "One whose displacement stays constant."
        why: "That particle is at rest."
    explanation: |
      Speed is the size of the gradient. The gradients here are $3$, $2$, $-2$ and $0$, so the
      first is fastest.

  - id: distance-for-velocity
    format: spot-error
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      A student works out an average velocity from a displacement–time graph. One line is wrong.
    lines:
      - |
        At $t = 0$ the displacement is $12\ \text{m}$ and at $t = 10\ \text{s}$ it is
        $2\ \text{m}$, having travelled a total distance of $16\ \text{m}$.
      - |
        Average velocity $= \dfrac{16}{10} = 1.6\ \text{m s}^{-1}$.
      - |
        The displacement over the interval is $2 - 12 = -10\ \text{m}$.
    errorLine: 2
    fix: |
      Average velocity $= \dfrac{2 - 12}{10} = -1.0\ \text{m s}^{-1}$; the value
      $1.6\ \text{m s}^{-1}$ is the average **speed**.
    explanation: |
      Average velocity uses net displacement, which is $-10\ \text{m}$ here, so the average velocity
      is $-1.0\ \text{m s}^{-1}$. Dividing the total distance by the time gives the average speed.

  - id: gradient-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      On a displacement–time graph, the gradient of the line equals the **{{1}}** of the particle,
      and a negative gradient means it is moving in the **{{2}}** direction.
    blanks:
      - accept: ["velocity"]
      - accept: ["negative", "opposite"]
    explanation: |
      Gradient is velocity; its sign gives the direction of motion.
