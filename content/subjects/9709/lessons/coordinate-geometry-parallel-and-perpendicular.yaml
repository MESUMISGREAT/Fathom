id: coordinate-geometry-parallel-and-perpendicular
subject: "9709"
topic: "1.3"
title: Parallel and perpendicular lines
summary: Parallel lines share a gradient; perpendicular gradients multiply to −1. Use them to build parallel lines, perpendicular lines and perpendicular bisectors.
order: 3
minutes: 5
kind: core
objectives: ["1.3.1", "1.3.2"]
prerequisites: [coordinate-geometry-equation-of-a-line]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.3 learning outcomes "find the equation of a
    straight line given sufficient information" and "interpret and use any of the forms ...",
    whose note includes using the relationship between the gradients of parallel and
    perpendicular lines. All examples and questions are original; every equation checked in
    Python.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can use the gradient rules for **parallel** and **perpendicular** lines to find equations, including the **perpendicular bisector** of a line segment.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $m_1$ | gradient of the first line |
      | $m_2$ | gradient of the second line |

  - type: explain
    title: Two rules, one of them sneaky
    body: |-
      - **Parallel** lines have **equal gradients**: $m_1 = m_2$. Easy.
      - **Perpendicular** lines have gradients that **multiply to $-1$**: $m_1 m_2 = -1$.

      For the second one, "flip it and change the sign": the perpendicular gradient to $m$ is $-\dfrac{1}{m}$.

      | Gradient | Perpendicular gradient |
      | --- | --- |
      | $2$ | $-\tfrac12$ |
      | $-\tfrac34$ | $\tfrac43$ |
      | $\tfrac25$ | $-\tfrac52$ |

      The exception: horizontal lines ($m = 0$) are perpendicular to vertical lines (no gradient at all). The product rule needs two actual gradients.

  - type: diagram
    diagram: coordinate-geometry-perpendicular-gradients
    alt: >-
      Square grid with two lines crossing at right angles at (1, 1). The blue line
      y = ½x + ½ has a shaded gradient triangle from (1, 1): run 2, rise 1, labelled gradient
      1 ÷ 2 = ½. The orange line y = −2x + 3 has a shaded triangle from (1, 1) up to (0, 3):
      run −1, rise 2, labelled gradient 2 ÷ (−1) = −2. A right-angle mark sits at (1, 1). A note
      reads ½ × (−2) = −1.
    caption: |-
      Rotate the blue gradient triangle through 90° and you get the orange one. Run and rise **swap places** and one of them **changes sign**. That's exactly "flip and change the sign".

  - type: intuition
    title: Why it's −1
    body: |-
      A line with gradient $\tfrac{\text{rise}}{\text{run}}$ turned through 90° has its run and rise swapped, and one of them reversed. So its gradient is $-\tfrac{\text{run}}{\text{rise}}$.

      Multiply the two: $\dfrac{\text{rise}}{\text{run}} \times \left(-\dfrac{\text{run}}{\text{rise}}\right) = -1$. Everything cancels except the minus sign.

  - type: check
    questions: [pp-cloze, pp-perp-gradient]

  - type: example
    title: Parallel through a point
    problem: |-
      Find the equation of the line through $(2, -1)$ that is parallel to $3x + 2y = 5$.
    steps:
      - |-
        Gradient of $3x + 2y = 5$: $y = -\tfrac32 x + \tfrac52$, so $m = -\tfrac32$.
      - |-
        Same gradient through $(2, -1)$: $y + 1 = -\tfrac32(x - 2)$.
      - |-
        Multiply by 2: $2y + 2 = -3x + 6$, so $3x + 2y = 4$.
    answer: |-
      $3x + 2y = 4$. Shortcut: a parallel line keeps the **same $x$ and $y$ coefficients**, $3x + 2y = k$. Substitute the point to get $k = 3(2) + 2(-1) = 4$.

  - type: example
    title: Perpendicular through a point
    problem: |-
      Find the equation of the line through $(4, 1)$ that is perpendicular to $y = 2x - 3$.
    steps:
      - |-
        The given gradient is 2, so the perpendicular gradient is $-\tfrac12$. Check: $2 \times \left(-\tfrac12\right) = -1$ ✓
      - |-
        $y - 1 = -\tfrac12(x - 4)$.
      - |-
        Multiply by 2: $2y - 2 = -x + 4$, so $x + 2y - 6 = 0$.
    answer: |-
      $x + 2y - 6 = 0$.

  - type: check
    questions: [pp-parallel, pp-perp-line]

  - type: definition
    term: Perpendicular bisector
    body: |-
      The **perpendicular bisector** of a line segment $AB$ is the line that passes through the **midpoint** of $AB$ and is **perpendicular** to $AB$. Every point on it is the same distance from $A$ as from $B$.

  - type: example
    title: The perpendicular bisector recipe
    problem: |-
      Find the equation of the perpendicular bisector of $A(-1, 2)$ and $B(5, 6)$.
    steps:
      - |-
        **Midpoint:** $M = \left(\dfrac{-1 + 5}{2}, \dfrac{2 + 6}{2}\right) = (2, 4)$.
      - |-
        **Gradient of $AB$:** $\dfrac{6 - 2}{5 - (-1)} = \dfrac46 = \dfrac23$.
      - |-
        **Perpendicular gradient:** $-\dfrac32$.
      - |-
        **Line through $M$:** $y - 4 = -\tfrac32(x - 2)$. Multiply by 2: $2y - 8 = -3x + 6$, so $3x + 2y = 14$.
    answer: |-
      $3x + 2y = 14$. Check that $M$ fits: $3(2) + 2(4) = 14$ ✓

  - type: diagram
    diagram: coordinate-geometry-perpendicular-bisector
    alt: >-
      Square grid with points A(−1, 2) and B(5, 6) joined by a blue segment with gradient 2/3.
      Its midpoint M(2, 4) is marked, with small tick marks on AM and MB showing they are equal.
      An orange line through M, labelled 3x + 2y = 14 with gradient −3/2, crosses AB at right
      angles, shown by a right-angle mark at M.
    caption: |-
      Through the **midpoint**, at **right angles**. Miss either one and it's just "a line".

  - type: misconceptions
    items:
      - wrong: |-
          The gradient perpendicular to $\tfrac23$ is $\tfrac32$.
        right: |-
          Flip **and** change the sign: $-\tfrac32$. Check: $\tfrac23 \times \tfrac32 = 1$, not $-1$.
      - wrong: |-
          The perpendicular bisector of $AB$ passes through $A$.
        right: |-
          It passes through the **midpoint** of $AB$. "Bisector" means it cuts $AB$ in half.
      - wrong: |-
          $AB \perp BC$ because their gradients, 3 and $-3$, have opposite signs.
        right: |-
          Test the product: $3 \times (-3) = -9 \neq -1$. Perpendicular to 3 would be $-\tfrac13$.

  - type: exam
    body: |-
      - "Find the equation of the perpendicular bisector of $AB$" is a Paper 1 favourite, usually 3–4 marks: midpoint, gradient, perpendicular gradient, equation.
      - "Show that angle $ABC$ is a right angle": find both gradients and **write** "$m_{AB} \times m_{BC} = -1$, so $AB$ is perpendicular to $BC$". The sentence is part of the answer.
      - Insider hack: perpendicular bisectors turn up again with circles, because the centre of a circle lies on the perpendicular bisector of every chord.

  - type: check
    questions: [pp-bisector, pp-right-angle]

  - type: takeaways
    items:
      - |-
        Parallel: equal gradients. A parallel line to $ax + by = c$ is $ax + by = k$.
      - |-
        Perpendicular: $m_1 m_2 = -1$, so the new gradient is $-\dfrac{1}{m}$.
      - |-
        Perpendicular bisector: through the midpoint, with the perpendicular gradient.
      - |-
        To prove a right angle, show the product of the gradients is $-1$ and say so in words.

questions:
  - id: pp-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.3.2"]
    prompt: |-
      Two lines with gradients $m_1$ and $m_2$ are parallel if $m_1$ and $m_2$ are {{1}}. They are perpendicular if $m_1 m_2 =$ {{2}}.
    blanks:
      - accept: [equal, the same, same, equal to each other]
      - accept: ["-1", "−1", minus 1, negative 1, minus one, negative one]
    explanation: |-
      Parallel lines have **equal** gradients. Perpendicular gradients multiply to **$-1$**.

  - id: pp-perp-gradient
    format: mcq
    difficulty: 1
    objectives: ["1.3.2"]
    prompt: |-
      A line has gradient $-\tfrac43$. What is the gradient of a line perpendicular to it?
    explanation: |-
      Flip and change the sign: $-\tfrac43 \to \tfrac34$. Check: $-\tfrac43 \times \tfrac34 = -1$ ✓
    options:
      - text: |-
          $\tfrac43$
        why: |-
          Only the sign changed. The product is $-\tfrac{16}{9}$, not $-1$.
      - text: |-
          $-\tfrac34$
        why: |-
          Only flipped. The product is $+1$, not $-1$.
      - text: |-
          $-\tfrac43$
        why: |-
          That's the same gradient: a parallel line, not a perpendicular one.
      - text: |-
          $\tfrac34$
        correct: true
        why: |-
          Flipped and sign changed; the product is $-1$.

  - id: pp-parallel
    format: numeric
    difficulty: 2
    objectives: ["1.3.1"]
    prompt: |-
      The line $l$ passes through $(-1, 6)$ and is parallel to $y = 5 - 2x$. Its equation is $y = mx + c$. Find $m$ and $c$.
    fields:
      - label: "m ="
        answer: -2
      - label: "c ="
        answer: 4
    explanation: |-
      $y = 5 - 2x$ has gradient $-2$, so $l$ does too. Then $6 = -2(-1) + c = 2 + c$, so $c = 4$.

      $l$: $y = -2x + 4$.

  - id: pp-perp-line
    format: numeric
    difficulty: 2
    objectives: ["1.3.1", "1.3.2"]
    prompt: |-
      The line through $(3, -2)$ perpendicular to $2x - 5y = 1$ has equation $5x + by + c = 0$. Find the integers $b$ and $c$.
    fields:
      - label: "b ="
        answer: 2
      - label: "c ="
        answer: -11
    explanation: |-
      $2x - 5y = 1 \Rightarrow y = \tfrac25 x - \tfrac15$, gradient $\tfrac25$. Perpendicular gradient: $-\tfrac52$.

      $y + 2 = -\tfrac52(x - 3)$. Multiply by 2: $2y + 4 = -5x + 15$, so $5x + 2y - 11 = 0$.

      Check: $5(3) + 2(-2) - 11 = 0$ ✓

  - id: pp-bisector
    format: numeric
    difficulty: 2
    objectives: ["1.3.1", "1.3.2"]
    prompt: |-
      The perpendicular bisector of $A(1, 7)$ and $B(5, -1)$ has equation $x + by + c = 0$. Find $b$ and $c$.
    fields:
      - label: "b ="
        answer: -2
      - label: "c ="
        answer: 3
    explanation: |-
      Midpoint $(3, 3)$. Gradient of $AB$: $\dfrac{-1 - 7}{5 - 1} = -2$, so the perpendicular gradient is $\tfrac12$.

      $y - 3 = \tfrac12(x - 3) \Rightarrow 2y - 6 = x - 3 \Rightarrow x - 2y + 3 = 0$.

      Check the midpoint: $3 - 6 + 3 = 0$ ✓

  - id: pp-right-angle
    format: numeric
    difficulty: 3
    objectives: ["1.3.2"]
    prompt: |-
      The points are $A(-2, 1)$, $B(1, 3)$ and $C(k, 0)$. Angle $ABC$ is a right angle. Find $k$.
    fields:
      - label: "k ="
        answer: 3
    explanation: |-
      $m_{AB} = \dfrac{3 - 1}{1 - (-2)} = \dfrac23$ and $m_{BC} = \dfrac{0 - 3}{k - 1} = \dfrac{-3}{k - 1}$.

      Right angle at $B$: $\dfrac23 \times \dfrac{-3}{k - 1} = -1$, so $\dfrac{-2}{k - 1} = -1$, giving $k - 1 = 2$ and $k = 3$.

      Check: $m_{BC} = \dfrac{-3}{2}$, and $\dfrac23 \times \left(-\dfrac32\right) = -1$ ✓
