id: p2-logarithmic-exponential-e-and-ln
subject: "9709"
topic: "2.2"
title: Exponential functions and natural logs
summary: Understand what e^x and ln x are, how they are inverses, and how their graphs behave for positive and negative k.
order: 2
minutes: 5
kind: core
objectives: ["2.2.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): learning outcome 2.2.2, "Understand the definition
    and properties of e^x and ln x, including their relationship as inverse functions and their
