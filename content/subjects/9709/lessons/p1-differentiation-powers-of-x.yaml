id: p1-differentiation-powers-of-x
subject: "9709"
topic: "1.7"
title: Differentiating powers of x
summary: Differentiate any sum of powers of x, roots and fractions included. Rewrite each term as a power, bring the power down and take one off, then do it all again for the second derivative.
order: 2
minutes: 5
kind: core
objectives: ["1.7.2", "1.7.1"]
prerequisites: [p1-differentiation-gradient-of-a-curve]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.7 learning outcomes "use the derivative of
    xⁿ (for any rational n), together with constant multiples, sums and differences of functions"
    and the notations f′(x), f″(x), dy/dx and d²y/dx² for first and second derivatives. All
    examples and questions are original; all arithmetic checked in Python. Not yet
    teacher-reviewed.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
    Power-rule table diagram (p1-differentiation-power-rule) added on 2026-10-23 at the
    student's request; needs a fresh independent review.
    Changes of 2026-10-23 independently re-checked line by line in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
    Rewritten on 2026-10-23 at the student's request in a one-question-type, one-method style; needs a fresh independent review.

blocks:
  - type: objective
    body: |-
      By the end you can answer "**find $\dfrac{dy}{dx}$**" for any mix of powers of $x$, roots and fractions, and find the **second derivative** $\dfrac{d^2y}{dx^2}$ or $f''(x)$.

  - type: explain
    title: What they ask
    body: |-
      *Find $\dfrac{dy}{dx}$*, *find $f'(x)$*, *differentiate with respect to $x$*, or *find $\dfrac{d^2y}{dx^2}$*.

      The function is a mix of powers, roots and fractions, like $y = 4x^3 - 6\sqrt{x} + \dfrac{2}{x^2}$.

  - type: explain
    title: The method
    body: |-
      Same three steps for every term:

      1. **Rewrite every term as a number times a power of $x$, roots and fractions included.** This is the step people skip.
      2. Power down, one off: multiply by the power, then take 1 off the power.
      3. Tidy up: a number on its own disappears, and you can turn negative powers back into fractions.

      In symbols: $y = kx^n$ gives $\dfrac{dy}{dx} = knx^{n-1}$, for any rational $n$ (negative and fraction powers too).

  - type: diagram
    diagram: p1-differentiation-power-rule
    alt: >-
      A table with four rows under the column headings y and dy/dx. Each row starts with a power of x, then an arrow to the same power
      brought down in front with one taken off it, then the derivative. x² becomes 2x to the power
      2 − 1, which is 2x. x³ becomes 3x to the power 3 − 1, which is 3x². x⁵ becomes 5x to the power
      5 − 1, which is 5x⁴. x to the power one half becomes one half times x to the power one half
      minus 1, which is one half times x to the power minus one half. The power that comes down is
      in one colour and the "− 1" in another, matching the headings "bring the power down" and
      "then take one off it".
    caption: |-
      Step 2 is the same two moves every time, even for a fraction power.

  - type: example
    title: "The easiest one: nothing to rewrite"
    problem: |-
      Find $\dfrac{dy}{dx}$ when $y = 2x^3 - 5x + 4$.
    steps:
      - |-
        **Rewrite:** it's already powers. Think of it as $2x^3 - 5x^1 + 4$.
      - |-
        **Power down, one off:** $\;2x^3 \to 2 \times 3x^{2} = 6x^2$, and $\;-5x^1 \to -5 \times 1x^{0} = -5$.
      - |-
        **Tidy up:** the $4$ on its own disappears. (On its own, $y = 4$ is a flat line with gradient 0.)
    answer: |-
      $\dfrac{dy}{dx} = 6x^2 - 5$

  - type: check
    questions: [diff-poly]

  - type: explain
    title: "Step 1 cheat sheet: rewriting"
    body: |-
      | Looks like | Rewrite as |
      | --- | --- |
      | $\sqrt{x}$ | $x^{\frac12}$ |
      | $\dfrac{1}{x^3}$ | $x^{-3}$ |
      | $\dfrac{5}{\sqrt{x}}$ | $5x^{-\frac12}$ |
      | $\dfrac{x^2 + 3}{x}$ | $x + 3x^{-1}$ (split the fraction) |
      | $(x + 2)(x - 5)$ | $x^2 - 3x - 10$ (expand) |

      There's **no** rule here for a product or a fraction as a whole. Expand it or split it first.

  - type: example
    title: "Exam-style: a fraction and a root"
    problem: |-
      Find $\dfrac{dy}{dx}$ when $y = \dfrac{x^3 - 4}{x^2} + 6\sqrt{x}$.
    steps:
      - |-
        **Rewrite:** split the fraction, $\;\dfrac{x^3}{x^2} - \dfrac{4}{x^2} = x - 4x^{-2}$, and $\;6\sqrt{x} = 6x^{\frac12}$. So $y = x - 4x^{-2} + 6x^{\frac12}$.
      - |-
        **Power down, one off:** $\;x \to 1$.
      - |-
        $-4x^{-2} \to -4 \times (-2)x^{-3} = 8x^{-3}$. One less than $-2$ is $-3$.
      - |-
        $6x^{\frac12} \to 6 \times \tfrac12 x^{-\frac12} = 3x^{-\frac12}$. One less than $\tfrac12$ is $-\tfrac12$.
      - |-
        **Tidy up:** $\;\dfrac{dy}{dx} = 1 + 8x^{-3} + 3x^{-\frac12}$.
    answer: |-
      $\dfrac{dy}{dx} = 1 + \dfrac{8}{x^3} + \dfrac{3}{\sqrt{x}}$

  - type: check
    questions: [diff-roots, diff-fraction, spot-power]

  - type: explain
    title: "Then: a value, or the second derivative"
    body: |-
      $\dfrac{dy}{dx}$ is a **gradient function**: put in an $x$, and out comes the gradient there.

      - "Find $f'(4)$": do the method first, **then** put $x = 4$ in.
      - "Find $\dfrac{d^2y}{dx^2}$" or "$f''(x)$": do power down, one off **again**, on $\dfrac{dy}{dx}$. This is the **second derivative**.

  - type: diagram
    diagram: p1-differentiation-gradient-function
    alt: >-
      Two graphs stacked with the same x-scale. Top: the parabola y = x² with short tangent lines at
      x = −2, −1, 0, 1 and 2, labelled gradient −4, −2, 0, 2 and 4. Bottom: the straight line
      dy/dx = 2x, labelled the gradient function, with points (−2, −4), (−1, −2), (0, 0), (1, 2) and
      (2, 4). Dashed vertical guides link each tangent point on the parabola to the matching point
      on the line.
    caption: |-
      Read the tangent gradients off $y = x^2$ and plot them: they lie on the line $\dfrac{dy}{dx} = 2x$. The derivative is a whole new function.

  - type: example
    title: Differentiate twice, then put the number in
    problem: |-
      Given $f(x) = x^4 - 2x^3 + 5x$, find $f''(2)$.
    steps:
      - |-
        **Power down, one off:** $\;f'(x) = 4x^3 - 6x^2 + 5$.
      - |-
        **Power down, one off again:** $\;f''(x) = 12x^2 - 12x$. The $5$ on its own disappears.
      - |-
        **Then put the number in:** $\;f''(2) = 12(4) - 12(2) = 48 - 24 = 24$.
    answer: |-
      $f''(2) = 24$

  - type: check
    questions: [notation-mcq, gradient-value, second-derivative]

  - type: misconceptions
    items:
      - wrong: |-
          $\dfrac{d}{dx}\left(x^{\frac12}\right) = \tfrac12 x^{\frac32}$
        right: |-
          One **off** the power: $\tfrac12 - 1 = -\tfrac12$, so it's $\tfrac12 x^{-\frac12}$.
      - wrong: |-
          $\dfrac{d}{dx}\left(x^{-2}\right) = -2x^{-1}$
        right: |-
          One less than $-2$ is $-3$, so it's $-2x^{-3}$. Negative powers get *more* negative.
      - wrong: |-
          $\dfrac{d}{dx}(7) = 7$, or $\dfrac{d}{dx}(5x) = 5x$
        right: |-
          A number on its own disappears. And $5x = 5x^1$ goes to $5x^0 = 5$.
      - wrong: |-
          $\dfrac{d^2y}{dx^2}$ means $\left(\dfrac{dy}{dx}\right)^2$.
        right: |-
          It means differentiate twice. For $y = x^3$: $\dfrac{d^2y}{dx^2} = 6x$, but $\left(\dfrac{dy}{dx}\right)^2 = 9x^4$.

  - type: exam
    body: |-
      - **Write the rewrite line** (step 1) before you differentiate. If a later step slips, that line can still earn a method mark.
      - Then one line for power down, one off. Both $-3x^{-\frac12}$ and $-\dfrac{3}{\sqrt{x}}$ are fine as final answers.
      - For $f'(4)$ or $\dfrac{d^2y}{dx^2}$ at $x = 2$: differentiate first, put the number in second. Put it into $y$ first and you're differentiating a plain number, which gives 0.

  - type: takeaways
    items:
      - |-
        The method: **rewrite as powers**, power down and one off, tidy up.
      - |-
        $\dfrac{d}{dx}(x^n) = nx^{n-1}$ for any rational $n$. A number on its own goes to 0.
      - |-
        No rule here for products or fractions as a whole: expand or split first.
      - |-
        Second derivative: do it again. A value like $f'(4)$: differentiate first, then put 4 in.

questions:
  - id: diff-poly
    format: expression
    difficulty: 1
    objectives: ["1.7.2"]
    prompt: |-
      Find $\dfrac{dy}{dx}$ when $y = 5x^4 - 3x^2 + 7x - 2$.
    answer: 20x^3 - 6x + 7
    variables: [x]
    display: |-
      $20x^3 - 6x + 7$
    explanation: |-
      - **Rewrite:** already powers.
      - **Power down, one off:** $5x^4 \to 20x^3$, $\;-3x^2 \to -6x$, $\;7x \to 7$.
      - **Tidy up:** the $-2$ on its own disappears.

  - id: notation-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      For the curve $y = f(x)$, which of these means the gradient of the curve at the point where $x = 3$?
    explanation: |-
      $f'(x)$ is the gradient function. Put $x = 3$ into it: $f'(3)$.
    options:
      - text: $f'(3)$
        correct: true
        why: |-
          The derivative $f'(x)$ gives the gradient at any $x$. Put $x = 3$ in it.
      - text: $f(3)$
        why: |-
          That's the $y$-coordinate of the point, not how steep the curve is there.
      - text: $f''(3)$
        why: |-
          That's the second derivative at $x = 3$: how fast the gradient is changing, not the gradient itself.
      - text: $\dfrac{f(3)}{3}$
        why: |-
          That's the gradient of the line from the origin to the point, which is usually different.

  - id: diff-roots
    format: expression
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      Differentiate $y = 6\sqrt{x} - \dfrac{4}{x}$ with respect to $x$.
    answer: 3x^(-1/2) + 4x^(-2)
    variables: [x]
    domain: { min: 0.2, max: 5 }
    display: |-
      $3x^{-\frac12} + 4x^{-2} = \dfrac{3}{\sqrt{x}} + \dfrac{4}{x^2}$
    explanation: |-
      - **Rewrite:** $y = 6x^{\frac12} - 4x^{-1}$.
      - **Power down, one off:** $6 \times \tfrac12 x^{-\frac12} = 3x^{-\frac12}$, and $-4 \times (-1)x^{-2} = 4x^{-2}$.
      - **Tidy up:** $\dfrac{dy}{dx} = 3x^{-\frac12} + 4x^{-2} = \dfrac{3}{\sqrt{x}} + \dfrac{4}{x^2}$.

  - id: diff-fraction
    format: expression
    difficulty: 3
    objectives: ["1.7.2"]
    prompt: |-
      Find $\dfrac{dy}{dx}$ when $y = \dfrac{(\sqrt{x} + 3)^2}{x}$.
    answer: -3x^(-3/2) - 9x^(-2)
    variables: [x]
    domain: { min: 0.3, max: 5 }
    display: |-
      $-3x^{-\frac32} - 9x^{-2}$
    explanation: |-
      - **Rewrite:** expand the top, $(\sqrt{x} + 3)^2 = x + 6\sqrt{x} + 9$. Then split: $y = 1 + 6x^{-\frac12} + 9x^{-1}$.
      - **Power down, one off:** $6 \times (-\tfrac12)x^{-\frac32} = -3x^{-\frac32}$, and $9 \times (-1)x^{-2} = -9x^{-2}$.
      - **Tidy up:** the $1$ disappears, so $\dfrac{dy}{dx} = -3x^{-\frac32} - 9x^{-2}$.

  - id: spot-power
    format: spot-error
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      A student differentiates $y = \dfrac{8}{x^2} + \sqrt{x}$. Which line contains the first error?
    lines:
      - |-
        $y = 8x^{-2} + x^{\frac12}$
      - |-
        $\dfrac{dy}{dx} = -16x^{-1} + \tfrac12 x^{-\frac12}$
      - |-
        $= -\dfrac{16}{x} + \dfrac{1}{2\sqrt{x}}$
    errorLine: 2
    fix: |-
      $8x^{-2}$ differentiates to $8 \times (-2)x^{-3} = -16x^{-3}$, so $\dfrac{dy}{dx} = -16x^{-3} + \tfrac12 x^{-\frac12} = -\dfrac{16}{x^3} + \dfrac{1}{2\sqrt{x}}$.
    explanation: |-
      Line 1, the rewrite, is right. In line 2 the power went from $-2$ up to $-1$.

      "One off" means one less: $-2 - 1 = -3$.

  - id: gradient-value
    format: numeric
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      Given $f(x) = x^3 - 4\sqrt{x}$, find $f'(4)$.
    fields:
      - label: "f′(4) ="
        answer: 47
    explanation: |-
      - **Rewrite:** $f(x) = x^3 - 4x^{\frac12}$.
      - **Power down, one off:** $f'(x) = 3x^2 - 2x^{-\frac12} = 3x^2 - \dfrac{2}{\sqrt{x}}$.
      - **Then put the number in:** $f'(4) = 3(16) - \dfrac{2}{2} = 48 - 1 = 47$.

  - id: second-derivative
    format: numeric
    difficulty: 2
    objectives: ["1.7.1", "1.7.2"]
    prompt: |-
      Given $y = 2x^3 - 9x^2 + 5$, find the value of $\dfrac{d^2y}{dx^2}$ when $x = 2$.
    fields:
      - label: "d²y/dx² ="
        answer: 6
    explanation: |-
      - **Power down, one off:** $\dfrac{dy}{dx} = 6x^2 - 18x$.
      - **Again:** $\dfrac{d^2y}{dx^2} = 12x - 18$.
      - **Then put the number in:** at $x = 2$, $\;24 - 18 = 6$.
