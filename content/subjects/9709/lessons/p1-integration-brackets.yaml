id: p1-integration-brackets
subject: "9709"
topic: "1.8"
title: Integrating (ax + b)ⁿ
summary: Integrate a bracket like (3x − 2)⁴ in one line. Power up, divide by the new power, then divide by the number in front of x.
order: 2
minutes: 5
kind: core
objectives: ["1.8.1"]
prerequisites: [p1-integration-powers-of-x, p1-differentiation-chain-rule]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.8 learning outcome "understand integration
    as the reverse process of differentiation, and integrate (ax + b)ⁿ (for any rational n except
    −1), together with constant multiples, sums and differences" (the (ax + b)ⁿ part, including
    the syllabus's example type ∫ 1/(2x + 3)² dx, met here as a question with different numbers).
    All examples and questions are original; all arithmetic checked in Python. Written in the
    one-question-type, one-method style.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-24. Not yet reviewed by a teacher.
    Revised on 2026-10-31 for beginners to the Fathom layout rules (short paragraphs, one step per line, every symbol explained). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can integrate a **bracket raised to a power**, like $(3x - 2)^4$ or $\dfrac{1}{(2x + 3)^2}$, without expanding it.

  - type: explain
    title: What they ask
    body: |-
      *Find $\displaystyle\int (3x - 2)^4\,dx$*, or $\displaystyle\int \dfrac{1}{(2x + 3)^2}\,dx$, or $\displaystyle\int \sqrt{4x + 1}\,dx$.

      Inside the bracket there's always a number times $x$, plus a number: $ax + b$. Expanding $(3x - 2)^4$ would take ages, so here's the one-line way.

  - type: explain
    title: The method
    body: |-
      1. Write it as a bracket to a power. Roots and fractions too: $\sqrt{4x + 1} = (4x + 1)^{\frac12}$.
      2. Add 1 to the power. The bracket stays **exactly** the same.
      3. Divide by the new power.
      4. **Divide by the number in front of $x$.** This is the step people forget.
      5. Add $+\,c$.

      In symbols:

      $$\int (ax + b)^n\,dx = \dfrac{(ax + b)^{n+1}}{a(n+1)} + c \qquad (n \neq -1)$$

      - $a$ is the number in front of $x$ (it can be negative), and $b$ is the number added.
      - $n$ is the power. $n = -1$ is excluded because then $n + 1 = 0$, and you can't divide by 0.

      In words: power up, divide by the new power, divide by $a$, add $c$.

  - type: intuition
    title: Why divide by the number in front of x?
    body: |-
      When you differentiate a bracket, the chain rule **multiplies** by the derivative of the bracket. For $ax + b$, that's $a$.

      Integration undoes differentiation, so it **divides** by $a$.

  - type: diagram
    diagram: p1-integration-bracket-steps
    alt: >-
      The integral of (2x + 1)² dx, with the 2 in front of x coloured. Four numbered steps. Step 1,
      add 1 to the power, bracket the same: (2x + 1)³. Step 2, divide by the new power: (2x + 1)³
      over 3. Step 3, highlighted, divide by the number in front of x: (2x + 1)³ over 3 times 2,
      which is (2x + 1)³ over 6. Step 4, add + c: (2x + 1)³ over 6, plus c. Below a line, a check
      with the chain rule: the derivative of (2x + 1)³ over 6 is 3(2x + 1)² times 2, over 6, which
      is (2x + 1)², with a tick.
    caption: |-
      The method on an easy one. Differentiating the answer (power down, times 2) gets you back to the start.

  - type: example
    title: "The easy one, checked by expanding"
    problem: |-
      Find $\displaystyle\int (2x + 1)^2\,dx$.
    steps:
      - |-
        **Add 1 to the power:** $(2x + 1)^3$.
      - |-
        **Divide by the new power, 3, and by the 2 in front of $x$:** $\dfrac{(2x + 1)^3}{3 \times 2} = \dfrac{(2x + 1)^3}{6}$.
      - |-
        **Add $+\,c$:** $\;\dfrac{(2x + 1)^3}{6} + c$.
      - |-
        **Check by expanding first:** $\displaystyle\int (4x^2 + 4x + 1)\,dx = \dfrac43 x^3 + 2x^2 + x + c$.
    answer: |-
      $\dfrac{(2x + 1)^3}{6} + c$

      Expand it and you get $\dfrac43 x^3 + 2x^2 + x + \dfrac16$. That matches the check, apart from the constant $\dfrac16$, which the $+\,c$ swallows ✓.

  - type: check
    questions: [bracket-power, bracket-mcq]

  - type: example
    title: "Exam-style: a bracket on the bottom"
    problem: |-
      Find $\displaystyle\int \dfrac{6}{(3x - 1)^3}\,dx$.
    steps:
      - |-
        **Write it as a power:** $6(3x - 1)^{-3}$.
      - |-
        **Add 1 to the power:** $-3 + 1 = -2$, so $6(3x - 1)^{-2}$.
      - |-
        **Divide by the new power, $-2$:** $\dfrac{6(3x - 1)^{-2}}{-2} = -3(3x - 1)^{-2}$.
      - |-
        **Divide by 3, the number in front of $x$:** $-(3x - 1)^{-2}$.
      - |-
        **Add $+\,c$.**
    answer: |-
      $-\dfrac{1}{(3x - 1)^2} + c$

  - type: check
    questions: [bracket-reciprocal, bracket-root, spot-bracket]

  - type: deeper
    title: Working backwards to a missing number
    body: |-
      *Given $\displaystyle\int k(4x + 1)^{\frac12}\,dx = (4x + 1)^{\frac32} + c$, find $k$.*

      - Integrate the left side: $\dfrac{k(4x + 1)^{\frac32}}{\frac32 \times 4} = \dfrac{k}{6}(4x + 1)^{\frac32}$.
      - Match it to the right side: $\dfrac{k}{6} = 1$, so $k = 6$.

      Or differentiate the right side: $\dfrac32(4x + 1)^{\frac12} \times 4 = 6(4x + 1)^{\frac12}$. That must equal $k(4x + 1)^{\frac12}$, so again $k = 6$.

  - type: check
    questions: [bracket-unknown]

  - type: misconceptions
    items:
      - wrong: |-
          $\displaystyle\int (5x + 1)^3\,dx = \dfrac{5(5x + 1)^4}{4} + c$
        right: |-
          That's the chain-rule habit: multiplying by 5. Integration **divides** by 5: $\dfrac{(5x + 1)^4}{20} + c$.
      - wrong: |-
          $\displaystyle\int (1 - 2x)^5\,dx = \dfrac{(1 - 2x)^6}{12} + c$
        right: |-
          The number in front of $x$ is $-2$, not $2$. So it's $\dfrac{(1 - 2x)^6}{6 \times (-2)} + c = -\dfrac{(1 - 2x)^6}{12} + c$.
      - wrong: |-
          $\displaystyle\int (x^2 + 1)^3\,dx = \dfrac{(x^2 + 1)^4}{4 \times 2x} + c$
        right: |-
          The shortcut only works when the bracket is $ax + b$. With $x^2$ inside, expand first and integrate term by term.

  - type: exam
    body: |-
      - Bracket integrals turn up inside bigger questions: finding a curve from its gradient, or a definite integral.
      - Write the division you're doing, like $\dfrac{(3x - 1)^{-2}}{-2 \times 3}$, so a slip still earns the method mark.
      - Check by differentiating with the chain rule. It takes seconds.

  - type: takeaways
    items:
      - |-
        Bracket $(ax + b)^n$: add 1 to the power, keep the bracket, divide by the new power, **then divide by $a$**, then $+\,c$.
      - |-
        Write roots and fractions as powers first: $\dfrac{1}{(2x + 3)^2} = (2x + 3)^{-2}$.
      - |-
        Watch the sign of $a$: in $(1 - 2x)$, $a = -2$.
      - |-
        Only for brackets of the form $ax + b$. Anything else, expand.

questions:
  - id: bracket-power
    format: expression
    difficulty: 1
    objectives: ["1.8.1"]
    prompt: |-
      Find $\displaystyle\int (3x - 2)^4\,dx$. Include $+\,c$.
    answer: (3x - 2)^5/15 + c
    variables: [x, c]
    display: |-
      $\dfrac{(3x - 2)^5}{15} + c$
    explanation: |-
      - Add 1 to the power: $(3x - 2)^5$.
      - Divide by the new power, 5, and by the 3 in front of $x$: $\dfrac{(3x - 2)^5}{5 \times 3} = \dfrac{(3x - 2)^5}{15}$.
      - Add $+\,c$.

  - id: bracket-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.8.1"]
    prompt: |-
      What is $\displaystyle\int (5x + 1)^3\,dx$?
    explanation: |-
      Add 1 to the power, then divide by the new power (4) and by the number in front of $x$ (5): $\dfrac{(5x + 1)^4}{20} + c$.
    options:
      - text: $\dfrac{(5x + 1)^4}{20} + c$
        correct: true
        why: |-
          Divided by 4 and by 5. Check: differentiating gives $\dfrac{4(5x + 1)^3 \times 5}{20} = (5x + 1)^3$ ✓.
      - text: $\dfrac{(5x + 1)^4}{4} + c$
        why: |-
          The step people forget: you also divide by 5, the number in front of $x$.
      - text: $\dfrac{5(5x + 1)^4}{4} + c$
        why: |-
          That multiplies by 5, like the chain rule does. Integration goes the other way, so divide.
      - text: $15(5x + 1)^2$
        why: |-
          That's the derivative, not the integral.

  - id: bracket-reciprocal
    format: expression
    difficulty: 2
    objectives: ["1.8.1"]
    prompt: |-
      Find $\displaystyle\int \dfrac{1}{(2x + 5)^2}\,dx$. Include $+\,c$.
    answer: -1/(2(2x + 5)) + c
    variables: [x, c]
    domain: { min: 0, max: 4 }
    display: |-
      $-\dfrac{1}{2(2x + 5)} + c$
    explanation: |-
      Write it as a power: $(2x + 5)^{-2}$.

      - Add 1 to the power: $(2x + 5)^{-1}$.
      - Divide by the new power, $-1$, and by 2: $\dfrac{(2x + 5)^{-1}}{-1 \times 2} = -\dfrac{1}{2(2x + 5)}$.
      - Add $+\,c$.

  - id: bracket-root
    format: expression
    difficulty: 2
    objectives: ["1.8.1"]
    prompt: |-
      Find $\displaystyle\int \dfrac{3}{\sqrt{6x + 1}}\,dx$. Include $+\,c$.
    answer: sqrt(6x + 1) + c
    variables: [x, c]
    domain: { min: 0, max: 4 }
    display: |-
      $\sqrt{6x + 1} + c$
    explanation: |-
      Write it as a power: $3(6x + 1)^{-\frac12}$.

      - Add 1 to the power: $3(6x + 1)^{\frac12}$.
      - Divide by the new power, $\dfrac12$, and by 6: $\dfrac{3(6x + 1)^{\frac12}}{\frac12 \times 6} = \dfrac{3(6x + 1)^{\frac12}}{3} = (6x + 1)^{\frac12}$.
      - Add $+\,c$.

  - id: spot-bracket
    format: spot-error
    difficulty: 2
    objectives: ["1.8.1"]
    prompt: |-
      A student finds $\displaystyle\int (1 - 2x)^5\,dx$. Which line has the first error?
    lines:
      - |-
        Add 1 to the power: $(1 - 2x)^6$
      - |-
        Divide by the new power: $\dfrac{(1 - 2x)^6}{6}$
      - |-
        Divide by the number in front of $x$: $\dfrac{(1 - 2x)^6}{12}$
      - |-
        So $\displaystyle\int (1 - 2x)^5\,dx = \dfrac{(1 - 2x)^6}{12} + c$
    errorLine: 3
    fix: |-
      The number in front of $x$ is $-2$: $\;\dfrac{(1 - 2x)^6}{6 \times (-2)} = -\dfrac{(1 - 2x)^6}{12}$, so the answer is $-\dfrac{(1 - 2x)^6}{12} + c$.
    explanation: |-
      Lines 1 and 2 are right. Line 3 divides by $2$, but the bracket is $1 - 2x$, so the number in front of $x$ is $-2$.

      Check: differentiating the student's answer gives $-(1 - 2x)^5$, the wrong sign.

  - id: bracket-unknown
    format: numeric
    difficulty: 3
    objectives: ["1.8.1"]
    prompt: |-
      Find the constant $k$ such that $\displaystyle\int k(2x + 3)^{4}\,dx = (2x + 3)^5 + c$.
    fields:
      - label: "k ="
        answer: 10
    explanation: |-
      Integrate the left side: $\dfrac{k(2x + 3)^5}{5 \times 2} = \dfrac{k}{10}(2x + 3)^5$.

      This must equal $(2x + 3)^5$, so $\dfrac{k}{10} = 1$ and $k = 10$.

      Check by differentiating $(2x + 3)^5$: $5(2x + 3)^4 \times 2 = 10(2x + 3)^4$ ✓.
