id: p2-numerical-solution-rearranging
subject: "9709"
topic: "2.6"
title: Where iterations come from (and when they fail)
summary: See how xₙ₊₁ = F(xₙ) is just the equation rewritten as x = F(x), build your own iteration from a rearrangement, and recognise one that will not converge.
order: 4
minutes: 7
kind: core
objectives: ["2.6.3"]
prerequisites: [p2-numerical-solution-using-iteration]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 2.6 outcome "Understand how a given simple iterative formula
    of the form x(n+1) = F(x(n)) relates to the equation being solved, and use a given
    iteration, or an iteration based on a given rearrangement of an equation". The syllabus
    excludes a convergence condition, but expects candidates to understand that an iteration
    may fail; this lesson shows failure by example only. All values computed in Python;
    questions are original.

    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
    agent as the writer, not a human teacher): every algebraic step checked, every
    iteration table and answer key recomputed in Python, syllabus coverage confirmed
    against 9709 topic 2.6, and all three diagrams rendered and inspected in light
    and dark.
blocks:
  - type: objective
    body: |-
      By the end you can take an equation, rearrange it into the form $x = F(x)$, turn that into an iteration, and explain why $\alpha = F(\alpha)$ at the root — plus spot an iteration that will not settle.

  - type: explain
    title: "The idea: a root that stays put"
    body: |-
      Suppose $x_{n+1} = \sqrt{x_n + 3}$ converges to a root $\alpha$. When the values have settled, feeding $\alpha$ back in must return $\alpha$ itself, because nothing is changing any more:

      $$\alpha = \sqrt{\alpha + 3}.$$

      A value like this is called a **fixed point** of the formula. Now square both sides:

      $$\alpha^2 = \alpha + 3 \qquad\Longrightarrow\qquad \alpha^2 - \alpha - 3 = 0.$$

      That is exactly the equation we were solving. So the iteration is not magic: it is a **rearrangement of the equation into the form $x = F(x)$**, used as a machine.

  - type: explain
    title: "The method: making an iteration"
    body: |-
      1. **Start from the equation** with everything on one side, $f(x) = 0$ — or from the form the question gives you.
      2. **Rearrange until one $x$ stands alone**: $x = F(x)$. There is usually more than one way (add, divide, take a root, …).
      3. **Add subscripts**: the $x$ on the left becomes $x_{n+1}$, every $x$ on the right becomes $x_n$.
      4. **Choose a starting value** near the root (questions usually give one).
      5. **Iterate** and check that it settles.

      **The forgotten step:** the rearrangement must be algebraically exact. A small slip here makes the iteration converge to a root of the *wrong* equation.

  - type: example
    title: "Example 1: building one from scratch"
    problem: |-
      The equation $x^3 - 2x - 5 = 0$ has a root near $2$. Show that it can be written as $x = \sqrt[3]{2x + 5}$, then use that iteration from $x_1 = 2.3$ to find the root correct to $3$ decimal places.
    steps:
      - |-
        Start with $x^3 - 2x - 5 = 0$ and move the $2x$ and the $5$ across: $x^3 = 2x + 5$.
      - |-
        Take the cube root of both sides: $x = \sqrt[3]{2x + 5}$. This is the form $x = F(x)$ with $F(x) = \sqrt[3]{2x + 5}$.
      - |-
        Add subscripts: $x_{n+1} = \sqrt[3]{2x_n + 5}$.
      - |-
        $x_1 = 2.3$.
      - |-
        $x_2 = \sqrt[3]{2(2.3) + 5} = \sqrt[3]{9.6} = 2.125317$.
      - |-
        $x_3 = \sqrt[3]{2(2.125317) + 5} = \sqrt[3]{9.250634} = 2.099216$.
      - |-
        $x_4 = 2.095260$ and $x_5 = 2.094659$. To 3 d.p. both are $2.095$, so the root is $2.095$ (3 d.p.).
      - |-
        Check: $2.095^3 - 2(2.095) - 5 = 9.195 - 4.19 - 5 = 0.005$, close to zero, as it should be.
    answer: |-
      $x = \sqrt[3]{2x + 5}$; the root is $2.095$ (3 d.p.).

  - type: check
    questions: [rearrange-form, iter-cube-x2]

  - type: explain
    title: When the machine runs backwards
    body: |-
      Not every rearrangement works. Take the equation from the last lesson, $x^2 - x - 3 = 0$.

      - Rearranged as $x = \sqrt{x + 3}$, the values settled on $2.303$.
      - Rearranged as $x = x^2 - 3$, starting at $x_1 = 2$, the values go $2 \to 1 \to -2 \to 1 \to -2 \to \cdots$ and never settle.

      Same equation, different machine, completely different behaviour. The second one keeps throwing the values further from the root instead of towards it, so it **diverges** (here it oscillates between two values).

      If a given iteration behaves like this, say so: *"the iteration does not converge"*. If you have a choice, try a different rearrangement.

  - type: diagram
    diagram: p2-numerical-solution-divergence
    alt: >-
      The graph of y = x² − 3 with the line y = x, drawn for x from −2.6 to 2.6. A cobweb path
      starts at x = 2 on the x-axis, goes vertically to the curve at (2, 1), horizontally to
      the line y = x at (1, 1), vertically down to the curve at (1, −2), horizontally to
      (−2, −2) on the line, then vertically up to the curve at (−2, 1) and back, retracing the
      same square for ever. Labels mark x₁ = 2, x₂ = 1 and x₃ = −2. The two points where the
      curve meets the line, x ≈ 2.30 and x ≈ −1.30, are the roots the iteration is failing to
      reach.
    caption: |-
      The path loops around the same square instead of spiralling in. The roots are where the curve meets $y = x$; this iteration never gets there.

  - type: check
    questions: [fail-mcq, fail-explain]

  - type: misconceptions
    items:
      - wrong: |-
          Any rearrangement of the equation gives a working iteration.
        right: |-
          Some rearrangements converge and some do not. $x = \sqrt{x + 3}$ works for $x^2 - x - 3 = 0$; $x = x^2 - 3$ fails.
      - wrong: |-
          The iteration solves a different equation, since it has subscripts.
        right: |-
          At the root, $\alpha = F(\alpha)$, which rearranges back to the original equation. The subscripts just describe the repeated substitution.
      - wrong: |-
          If the values stop changing, I have made an arithmetic mistake.
        right: |-
          That is the goal: a fixed point. Two identical values in a row mean you have reached the root to that accuracy.
      - wrong: |-
          A diverging iteration means the equation has no root.
        right: |-
          The equation still has roots (where the curve meets $y = x$). The *iteration* has failed, not the equation. Try another rearrangement.

  - type: exam
    body: |-
      - "Show that the equation can be written as $x = \ldots$" — do the algebra line by line, ending in exactly that form.
      - Then write the iteration with subscripts; the first line of working usually earns a mark by itself.
      - When asked to explain why an iteration fails, say what the values do (grow, shrink away, oscillate) and that they do not approach a fixed value.
      - Link the iteration to the equation explicitly: "at the root $\alpha = F(\alpha)$, so $\alpha^2 = \alpha + 3$, which is the equation".
      - If a question asks for a suitable starting value, pick one near the root found by the sign-change method.

  - type: check
    questions: [iter-cube-root, fixed-point]

  - type: takeaways
    items:
      - |-
        An iteration $x_{n+1} = F(x_n)$ comes from writing the equation as $x = F(x)$.
      - |-
        At the root $\alpha = F(\alpha)$; rearranging that gives back the original equation.
      - |-
        Different rearrangements of the same equation can converge or fail.
      - |-
        "The iteration does not converge" is a complete, examinable answer.

questions:
  - id: rearrange-form
    format: text
    difficulty: 1
    objectives: ["2.6.3"]
    prompt: |-
      Rearrange $x^3 - 2x - 5 = 0$ into the form $x = F(x)$ by taking a cube root.
    accept:
      - x = cbrt(2x + 5)
      - x = ∛(2x + 5)
      - x = (2x + 5)^(1/3)
      - x = (2x+5)^(1/3)
      - x = cube root of (2x + 5)
      - x = the cube root of 2x + 5
      - ∛(2x+5)
      - (2x+5)^(1/3)
    model: |-
      Move the other terms across: $x^3 = 2x + 5$, then take the cube root of both sides:
      $$x = \sqrt[3]{2x + 5}.$$
    explanation: |-
      The cube root undoes the cube. This is the rearrangement used to build the iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$.

  - id: iter-cube-x2
    format: numeric
    difficulty: 1
    objectives: ["2.6.3"]
    prompt: |-
      The iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$ starts at $x_1 = 2.3$. Find $x_2$ correct to 4 decimal places.
    fields:
      - label: "x₂ ="
        answer: 2.1253
        tolerance: { rel: 0.002 }
        sigFigs: 5
    explanation: |-
      $x_2 = \sqrt[3]{2(2.3) + 5} = \sqrt[3]{9.6} = 2.125317\ldots = 2.1253$ to 4 d.p.

  - id: fail-mcq
    format: mcq
    difficulty: 1
    objectives: ["2.6.3"]
    prompt: |-
      An iteration produces the values $2,\ 1,\ -2,\ 1,\ -2,\ 1,\ldots$ What does this tell you?
    explanation: |-
      The values repeat a cycle instead of approaching a single value, so there is no fixed point being reached: the iteration does not converge. The equation itself may still have roots.
    options:
      - text: The iteration does not converge; it oscillates between two values.
        correct: true
        why: |-
          A converging sequence settles on one value. This one cycles for ever between $1$ and $-2$.
      - text: The iteration converges to $-2$.
        why: |-
          It visits $-2$ but immediately leaves it again. Converging means approaching a value, not just passing through it.
      - text: The equation has no roots.
        why: |-
          The failure is in the iteration, not the equation. A different rearrangement may still find the root.
      - text: The starting value was wrong, so the answer is $1$.
        why: |-
          Changing the start may change the behaviour, but the observation here is oscillation, and the answer is not one of the visited values.

  - id: fail-explain
    format: text
    difficulty: 2
    objectives: ["2.6.3"]
    prompt: |-
      For $x^2 - x - 3 = 0$, the iteration $x_{n+1} = x_n^2 - 3$ with $x_1 = 2$ gives $2, 1, -2, 1, -2, \ldots$ Explain why this shows the iteration fails.
    accept:
      - the values repeat and do not approach a single fixed value, so the iteration does not converge to a root
      - it oscillates between 1 and -2 instead of settling, so there is no limit and the iteration fails
      - the sequence does not converge because it keeps cycling between two values rather than getting closer to one number
      - because the values bounce back and forth and never settle on a single value, so it cannot find the root
      - it never approaches a fixed point, it just cycles between 1 and -2, so the iteration diverges
    model: |-
      The values cycle between $1$ and $-2$ and never settle on one number. A converging iteration must approach a fixed point, so this one does not converge and cannot give the root.
    explanation: |-
      Convergence means the values close in on one limit. A repeating cycle has no limit, so the iteration fails even though the equation still has roots.

  - id: fixed-point
    format: cloze
    difficulty: 2
    objectives: ["2.6.3"]
    prompt: |-
      If the iteration $x_{n+1} = F(x_n)$ converges to a root $\alpha$, then $\alpha = $ {{1}}. Rearranging this equation gives back the equation being solved.
    blanks:
      - accept: [F(α), F(alpha), F of α, F of alpha]
    explanation: |-
      At the root nothing changes when the formula is applied, so $\alpha = F(\alpha)$. Rearranging that fixed-point equation returns the original equation.

  - id: iter-cube-root
    format: numeric
    difficulty: 2
    objectives: ["2.6.3"]
    prompt: |-
      The iteration $x_{n+1} = \sqrt[3]{2x_n + 5}$ from $x_1 = 2.3$ settles on the root of $x^3 - 2x - 5 = 0$. Find that root correct to $3$ decimal places.
    fields:
      - label: "root ="
        answer: 2.095
        tolerance: { rel: 0.0005 }
        sigFigs: 4
    explanation: |-
      The values go $2.3,\ 2.1253,\ 2.0992,\ 2.0953,\ 2.0947,\ 2.0946,\ldots$; $x_4$ and $x_5$ both round to $2.095$, so the root is $2.095$ (3 d.p.).
