id: p2-algebra-modulus-graph
subject: "9709"
topic: "2.1"
title: Modulus graphs and inequalities
summary: Sketch y = |ax + b| and use the modulus rules to solve equations and inequalities without guessing.
order: 1
minutes: 5
kind: core
objectives: ["2.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): learning outcome 2.1.1, "Understand the meaning
    of |x|, sketch the graph of y = |ax + b|, and use relations such as |a| = |b| ⇔ a² = b² and
    |x − a| < b ⇔ a − b < x < a + b when solving equations and inequalities." The examples and
    questions are original; any arithmetic has been checked in Python. Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can sketch $y = |ax + b|$ and use the modulus rules to solve equations and inequalities without guessing.

  - type: explain
    title: What they ask
    body: |-
      *Solve* $|2x - 5| = 9$ or *find the values of $x$* such that $|x - 4| < 3$.

      - The bars mean “distance from zero”.
      - A modulus equation or inequality is really a “two-sided” question.

  - type: definition
    term: Modulus
    body: |-
      $$|x| = \begin{cases}x, & x \ge 0 \\-x, & x < 0\end{cases}$$

      It is the distance of $x$ from $0$, so it is always non-negative.

      For real expressions $u$ and $v$, $|u|=|v|$ exactly when $u^2=v^2$, equivalently when $u=v$ or $u=-v$.

      If $b>0$, then $|x-a|<b$ exactly when $a-b<x<a+b$.

  - type: explain
    title: The method
    body: |-
      1. **Forgotten step: find where the expression inside the bars is zero.** This is the vertex of the $V$.
      2. For $a\ne0$, sketch $y=|ax+b|$ as a $V$ whose vertex is where $ax+b=0$.
      3. For $|u|=|v|$, solve both $u=v$ and $u=-v$.
      4. For $|x-a|<b$, rewrite it as $a-b<x<a+b$.
      5. For a linear expression compared with a modulus, split into cases at the point where the inside changes sign.

      When squaring an equation with modulus, use $|u|=|v|$ only when both sides are non-negative.

  - type: diagram
    diagram: p2-algebra-modulus-graph
    alt: >-
      A coordinate grid showing two upward V-shaped graphs: y = |x| has its vertex at (0, 0),
      while y = |2x + 4| has its vertex at (−2, 0). The x-axis marks −2 and 0.
    caption: |-
      The graph of $y = |ax + b|$ is a $V$ shape. The vertex sits where the inside is zero, and the arms rise away from the axis.

  - type: example
    title: Easy example with a check
    problem: |-
      Solve $|x - 3| = 5$.
    steps:
      - |-
        The inside is zero when $x = 3$, so the turning point is at $x = 3$.
      - |-
        A distance of $5$ from $3$ means $x = 3 \pm 5$.
      - |-
        So $x = 8$ or $x = -2$.
    answer: |-
      $x = -2$ or $x = 8$.

      Check: $|-2 - 3| = 5$ and $|8 - 3| = 5$.

  - type: check
    questions: [modulus-solve, modulus-endpoint, modulus-equal-magnitude]

  - type: example
    title: Exam-style inequality
    problem: |-
      Solve $3x-2>|x+4|$.
    steps:
      - |-
        The expression inside the modulus is zero at $x=-4$, so split there.
      - |-
        If $x\ge-4$, then $|x+4|=x+4$, giving $3x-2>x+4$, so $x>3$.
      - |-
        If $x<-4$, then $|x+4|=-(x+4)$, giving $3x-2>-x-4$, or $x>-\dfrac12$. This case has no solutions because it also requires $x<-4$.
    answer: |-
      $x>3$.

      Check: at $x=4$, $10>8$ is true; at the boundary $x=3$, $7>7$ is false.

  - type: check
    questions: [modulus-rule, modulus-graph, modulus-case-inequality]

  - type: misconceptions
    items:
      - wrong: |-
          $|x - 4| = 3$ gives $x - 4 = 3$ only.
        right: |-
          A modulus equation is a distance equation, so the inside can be $+3$ or $-3$. That gives $x = 7$ or $x = 1$.
      - wrong: |-
          $2x+5<|x+1|$ can be solved by replacing $|x+1|$ with $x+1$ for every $x$.
        right: |-
          The expression $x+1$ changes sign at $x=-1$. Check both cases: only $x<-2$ works.
      - wrong: |-
          $|x| = -2$ has a solution.
        right: |-
          A modulus is never negative. So $|x| = -2$ has no solution.

  - type: exam
    body: |-
      - In a “solve” question, always find the critical point first. That is the key step that makes the question easy.
      - If the question says “less than” or “greater than”, write the interval carefully instead of splitting it by instinct.
      - Sketch the $V$ if you are unsure; the graph tells you the answer very quickly.

  - type: takeaways
    items:
      - |-
        The modulus $|x|$ is distance from zero, so it is never negative.
      - |-
        The graph of $y = |ax + b|$ is a $V$ with its vertex where $ax + b = 0$.
      - |-
        $|x - a| = b$ gives $x = a \pm b$.
      - |-
        $|x - a| < b$ gives $a - b < x < a + b$.
      - |-
        $|u|=|v|$ means $u=v$ or $u=-v$.

questions:
  - id: modulus-solve
    format: numeric
    difficulty: 1
    objectives: ["2.1.1"]
    prompt: |-
      Solve $|2x - 5| = 9$. Give the larger solution.
    fields:
      - label: "x ="
        answer: 7
    explanation: |-
      $2x - 5 = 9$ gives $x = 7$, and $2x - 5 = -9$ gives $x = -2$.

      The larger solution is $7$.

  - id: modulus-endpoint
    format: numeric
    difficulty: 1
    objectives: ["2.1.1"]
    prompt: |-
      Find the left endpoint of the solution set for $|x - 4| < 3$.
    fields:
      - label: "left endpoint ="
        answer: 1
    explanation: |-
      $|x - 4| < 3$ means $-3 < x - 4 < 3$, so $1 < x < 7$.

      The left endpoint is $1$.

  - id: modulus-rule
    format: text
    style: definition
    difficulty: 2
    objectives: ["2.1.1"]
    prompt: |-
      Assume $b>0$. Complete the rule: $|x-a|<b$ if and only if …
    accept:
      - a - b < x < a + b
      - a-b < x < a+b
      - x is between a - b and a + b
      - a-b < x and x < a+b
    model: |-
      $a - b < x < a + b$
    explanation: |-
      A value is within distance $b$ of $a$ exactly when it lies between $a-b$ and $a+b$.

  - id: modulus-graph
    format: mcq
    difficulty: 1
    objectives: ["2.1.1"]
    prompt: |-
      Which graph is $y = |x + 2|$?
    explanation: |-
      The inside is zero when $x = -2$, so the $V$ touches the $x$-axis at $x = -2$ and opens upwards.
    options:
      - text: A $V$ with its vertex at $(-2, 0)$
        correct: true
        why: |-
          The inside is zero at $x = -2$, so that is where the graph turns.
      - text: A $V$ with its vertex at $(2, 0)$
        why: |-
          The sign inside has changed, so the turning point would be at $x = -2$, not $2$.
      - text: A parabola opening downwards
        why: |-
          A modulus graph is not a parabola; it is a $V$-shape.
      - text: A line with positive gradient only
        why: |-
          The modulus makes the graph reflect the negative side, creating a $V$.

  - id: modulus-equal-magnitude
    format: numeric
    difficulty: 2
    objectives: ["2.1.1"]
    prompt: |-
      Solve $|5x-1|=|2x+8|$. Give the smaller root and then the larger root.
    fields:
      - label: "smaller root ="
        answer: -1
      - label: "larger root ="
        answer: 3
    explanation: |-
      Equal moduli mean the expressions are equal or opposites.

      $5x-1=2x+8$ gives $x=3$, while $5x-1=-(2x+8)$ gives $x=-1$.

  - id: modulus-case-inequality
    format: text
    style: one-line
    difficulty: 2
    objectives: ["2.1.1"]
    prompt: |-
      Solve $4x+1>|x-5|$.
    accept:
      - x > 0.8
      - x>0.8
      - x is greater than 0.8
    model: |-
      $x>\dfrac45$
    explanation: |-
      Split at $x=5$, where $x-5$ changes sign.

      If $x\ge5$, the inequality is true. If $x<5$, it reduces to $5x>4$, so $x>\dfrac45$.
