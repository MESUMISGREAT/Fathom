blocks:
  - type: objective
    body: |-
      By the end you can find the **set of values of $x$** for which a function is increasing or decreasing, and **show** that a function is increasing for every $x$.

  - type: explain
    title: What they ask
    body: |-
      - *Find the set of values of $x$ for which $f$ is decreasing* (or increasing).
      - *Show that $f$ is an increasing function.*

      Giveaway words: **increasing**, **decreasing**, **set of values**.

  - type: explain
    title: The one fact you need
    body: |-
      Walk along the graph from left to right. Uphill means **increasing**, and the gradient is positive: $f'(x) > 0$.

      Downhill means **decreasing**, and the gradient is negative: $f'(x) < 0$.

  - type: diagram
    diagram: p1-differentiation-increasing-decreasing
    alt: >-
      Two graphs stacked with the same x-scale. Top: y = x³ − 3x, with a maximum at (−1, 2) and a
      minimum at (1, −2). The parts for x < −1 and x > 1 are drawn in one colour and labelled
      increasing; the part between −1 and 1 is in a second colour and labelled decreasing. Bottom:
      f′(x) = 3x² − 3, a U-shaped parabola crossing the x-axis at −1 and 1, labelled f′(x) > 0
      outside that interval and f′(x) < 0 between. Dashed vertical lines at x = −1 and x = 1 join
      the two graphs.
    caption: |-
      Where $f'(x) > 0$ (outside $-1 < x < 1$) the curve climbs. Where $f'(x) < 0$ it falls.

  - type: explain
    title: The method
    body: |-
      Same four steps every time:

      1. Differentiate.
      2. Write the inequality: increasing means $f'(x) > 0$, decreasing means $f'(x) < 0$.
      3. Solve it. If $f'(x)$ is a quadratic, factorise it, then **sketch it to see which part you need.** For a U shape (positive $x^2$ term) it's below the axis between the roots and above it outside them. For an ∩ (negative $x^2$ term) it's the other way round.
      4. Answer with an inequality in $x$, like $1 < x < 3$.

      For "show that $f$ is increasing", step 3 is completing the square instead, and step 4 is a sentence.

  - type: example
    title: "The easiest one: a straight-line derivative"
    problem: |-
      Find the set of values of $x$ for which $f(x) = x^2 - 8x + 3$ is increasing.
    steps:
      - |-
        **Differentiate:** $\;f'(x) = 2x - 8$.
      - |-
        **Write the inequality:** increasing, so $\;2x - 8 > 0$.
      - |-
        **Solve it:** $\;2x > 8$, so $x > 4$.
      - |-
        **Answer in $x$:** $f$ is increasing for $x > 4$.
    answer: |-
      $x > 4$

      Check another way: $f(x) = (x - 4)^2 - 13$ is a U with its lowest point at $x = 4$. It climbs to the right of that ✓

  - type: check
    questions: [inc-dec-mcq, least-k]

  - type: example
    title: "Exam-style: a quadratic derivative"
    problem: |-
      Find the set of values of $x$ for which $y = x^3 - 6x^2 + 9x + 1$ is decreasing.
    steps:
      - |-
        **Differentiate:** $\;\dfrac{dy}{dx} = 3x^2 - 12x + 9$.
      - |-
        **Write the inequality:** decreasing, so $\;3x^2 - 12x + 9 < 0$.
      - |-
        **Solve it.** Take out the common factor 3, then factorise:

        $$3(x^2 - 4x + 3) = 3(x - 1)(x - 3) < 0$$

        The roots are $1$ and $3$.
      - |-
        Sketch the U (positive $x^2$ term). It's below the axis **between** the roots, which is where the expression is negative.
      - |-
        **Answer in $x$:** $\;1 < x < 3$.
    answer: |-
      $y$ is decreasing for $1 < x < 3$.

  - type: check
    questions: [decreasing-set]

  - type: example
    title: "The other type: show it's increasing for every x"
    problem: |-
      Show that $f(x) = x^3 + 3x^2 + 5x$ is an increasing function.
    steps:
      - |-
        **Differentiate:** $\;f'(x) = 3x^2 + 6x + 5$.
      - |-
        **Write the inequality:** you need $f'(x) > 0$ for **every** $x$.
      - |-
        **Solve it, by completing the square.** Take the 3 out of the $x$ terms:

        $$3x^2 + 6x + 5 = 3(x^2 + 2x) + 5$$
      - |-
        Complete the square inside: $x^2 + 2x = (x + 1)^2 - 1$.

        $$= 3\left[(x + 1)^2 - 1\right] + 5 = 3(x + 1)^2 - 3 + 5 = 3(x + 1)^2 + 2$$
      - |-
        **Answer with a sentence.** A square is never negative, so $(x + 1)^2 \geqslant 0$.

        That makes $f'(x) \geqslant 0 + 2 = 2 > 0$ for all $x$. So $f$ is an increasing function.
    answer: |-
      Shown.

      Another way for step 3: the discriminant of $3x^2 + 6x + 5$ is $36 - 60 < 0$, and the $x^2$ term is positive, so $f'(x)$ is always positive.

  - type: check
    questions: [complete-square-cloze, increasing-explain]

  - type: example
    title: "Exam-style: increasing on a given domain"
    problem: |-
      Show that $f(x) = x + \dfrac{4}{x}$ is increasing for $x > 2$.
    steps:
      - |-
        **Differentiate:** $\;f(x) = x + 4x^{-1}$, so $f'(x) = 1 - 4x^{-2} = 1 - \dfrac{4}{x^2}$.
      - |-
        **Write the inequality:** you need $f'(x) > 0$ for every $x > 2$.
      - |-
        **Solve it.** For $x > 2$, squaring gives $x^2 > 4$ (both sides are positive, so squaring keeps the inequality).

        Dividing 4 by something bigger than 4 gives less than 1, so $\dfrac{4}{x^2} < 1$.

        That makes $1 - \dfrac{4}{x^2} > 0$.
      - |-
        **Answer with a sentence:** $f'(x) > 0$ for all $x > 2$, so $f$ is increasing for $x > 2$.
    answer: |-
      Shown.

      Why they ask: an increasing (or decreasing) function is **one-one** (each output comes from only one input), so it has an inverse. That's why this often comes with an inverse-function question.

  - type: check
    questions: [restricted-domain]

  - type: deeper
    title: "Detail: a zero gradient at a single point"
    body: |-
      A function still counts as increasing if $f'(x) = 0$ only at single points.

      For example, $y = x^3$ has $\dfrac{dy}{dx} = 3x^2$, which is 0 only at $x = 0$. It's increasing for every $x$.

  - type: misconceptions
    items:
      - wrong: |-
          "Increasing" means the $y$-values are positive.
        right: |-
          Increasing is about the **gradient**: $y$ goes up as $x$ goes up. $y = x^3 - 3x$ is increasing for $x < -1$, even though $y$ is negative there.
      - wrong: |-
          $f'(0) > 0$, so $f$ is increasing.
        right: |-
          One point proves nothing. You need $f'(x) > 0$ for **every** $x$, which is why step 3 uses completing the square.
      - wrong: |-
          $(x - 1)(x - 3) < 0$ gives $x < 1$ or $x > 3$.
        right: |-
          Sketch the U: it's below the axis **between** the roots. So $1 < x < 3$.

  - type: exam
    body: |-
      Show every step, so each method mark is visible:

      - *Set of values* (typically 3–4 marks): $f'(x)$, the inequality, the factorised form, then the answer as an inequality in $x$.
      - *Show increasing*: $f'(x)$, the completed square (or the discriminant), then the sentence "$f'(x) > 0$ for all $x$, so $f$ is increasing". Skip the sentence and you can lose the last mark.
      - *Explain why $f^{-1}$ exists*: "$f$ is increasing, so it is one-one".

  - type: takeaways
    items:
      - |-
        The method: differentiate, write the inequality ($> 0$ increasing, $< 0$ decreasing), solve it, answer in $x$.
      - |-
        Quadratic $f'(x)$ with a positive $x^2$ term? **Sketch the U**: negative between the roots, positive outside.
      - |-
        To show "increasing for every $x$", complete the square on $f'(x)$ and say why it's always positive.
      - |-
        An increasing (or decreasing) function is one-one.

questions:
  - id: inc-dec-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.7.3"]
    prompt: |-
      For every $x$ in an interval, $f'(x) < 0$. What can you say about $f$ on that interval?
    explanation: |-
      $f'(x) < 0$ is the decreasing inequality from step 2. A negative gradient means the graph goes downhill all the way.
    options:
      - text: $f$ is decreasing
        correct: true
        why: |-
          Negative gradient: as $x$ increases, $f(x)$ decreases.
      - text: $f(x)$ is negative
        why: |-
          That mixes up $f$ and $f'$. A function can be positive and still decreasing, like $\dfrac{1}{x}$ for $x > 0$.
      - text: $f$ is increasing
        why: |-
          Increasing needs $f'(x) > 0$. Here the gradient is negative.
      - text: $f$ has a stationary point
        why: |-
          Stationary points need $f'(x) = 0$, which never happens on this interval.

  - id: least-k
    format: numeric
    difficulty: 1
    objectives: ["1.7.3"]
    prompt: |-
      The function $f(x) = x^2 - 10x + 3$ is increasing for $x > k$. Find the smallest possible value of $k$.
    fields:
      - label: "k ="
        answer: 5
    explanation: |-
      - **Differentiate:** $f'(x) = 2x - 10$.
      - **Write the inequality:** $2x - 10 > 0$.
      - **Solve it:** $x > 5$.

      So $f$ is increasing for $x > 5$, and the smallest $k$ is 5.

  - id: decreasing-set
    format: numeric
    difficulty: 2
    objectives: ["1.7.3"]
    prompt: |-
      The function $y = 2x^3 - 3x^2 - 12x + 4$ is decreasing for $p < x < q$. Find $p$ and $q$.
    fields:
      - label: "p ="
        answer: -1
      - label: "q ="
        answer: 2
    explanation: |-
      - **Differentiate:** $\dfrac{dy}{dx} = 6x^2 - 6x - 12$.
      - **Write the inequality:** $6x^2 - 6x - 12 < 0$.
      - **Solve it:** $6(x - 2)(x + 1) < 0$. Sketch the U: it's below the axis between the roots $-1$ and $2$.
      - **Answer in $x$:** $-1 < x < 2$.

  - id: complete-square-cloze
    format: cloze
    difficulty: 2
    objectives: ["1.7.3"]
    prompt: |-
      For $f(x) = x^3 + 3x^2 + 7x$, completing the square gives $f'(x) = 3(x + p)^2 + q$, where $p =$ {{1}} and $q =$ {{2}}. Since $q > 0$, $f'(x)$ is always positive and $f$ is increasing.
    blanks:
      - accept: ["1"]
      - accept: ["4"]
    explanation: |-
      - **Differentiate:** $f'(x) = 3x^2 + 6x + 7$.
      - **Complete the square:** $3(x^2 + 2x) + 7 = 3\left[(x + 1)^2 - 1\right] + 7 = 3(x + 1)^2 + 4$.
      - **Answer with a sentence:** $3(x + 1)^2 \geqslant 0$, so $f'(x) \geqslant 4 > 0$ for all $x$.

  - id: increasing-explain
    format: explain
    difficulty: 3
    objectives: ["1.7.3"]
    prompt: |-
      Show that $f(x) = x^3 - 6x^2 + 15x$ is an increasing function for all real $x$.
    explanation: |-
      Step 3 has to prove $f'(x) > 0$ for **every** $x$, not just check a few values. Completing the square does that in one line, and step 4 is the sentence.
    model: |-
      $f'(x) = 3x^2 - 12x + 15 = 3(x^2 - 4x + 5) = 3\left[(x - 2)^2 + 1\right] = 3(x - 2)^2 + 3$.

      Since $(x - 2)^2 \geqslant 0$ for all $x$, $f'(x) \geqslant 3 > 0$ for all $x$. So $f$ is an increasing function.
    keyPoints:
      - Correct derivative f′(x) = 3x² − 12x + 15
      - Completed square 3(x − 2)² + 3 (or discriminant 144 − 180 < 0 with positive x² coefficient)
      - Reason that this is always positive, since a square is never negative
      - Conclusion that f′(x) > 0 for all x, so f is increasing

  - id: restricted-domain
    format: numeric
    difficulty: 3
    objectives: ["1.7.3"]
    prompt: |-
      The function $f(x) = x + \dfrac{9}{x}$, defined for $x > 0$, is increasing for $x > a$. Find the smallest possible value of $a$.
    fields:
      - label: "a ="
        answer: 3
    explanation: |-
      - **Differentiate:** $f'(x) = 1 - \dfrac{9}{x^2}$.
      - **Write the inequality:** $1 - \dfrac{9}{x^2} > 0$, so $\dfrac{9}{x^2} < 1$.
      - **Solve it:** $x^2 > 9$. With $x > 0$, that means $x > 3$.

      So $a = 3$.
