id: p1-differentiation-increasing-decreasing
subject: "9709"
topic: "1.7"
title: Increasing and decreasing functions
summary: Differentiate, make the derivative greater than or less than zero, solve, and answer in x. Complete the square to show a function is increasing for every x.
order: 5
minutes: 6
kind: core
objectives: ["1.7.3"]
prerequisites: [p1-differentiation-powers-of-x, quadratics-inequalities, quadratics-completing-the-square]
