id: p2-integration-standard-functions
subject: "9709"
topic: "2.5"
title: Integrate e, logarithms and trig functions
summary: Reverse the chain rule to integrate exponential, reciprocal, sine, cosine and secant-squared brackets.
order: 1
minutes: 5
kind: core
objectives: ["2.5.1"]
prerequisites: [p1-integration-powers-of-x, p2-differentiation-standard-derivatives]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027, topic 2.5 learning outcome 2.5.1: integrate e^(ax+b), 1/(ax+b), sin(ax+b),
    cos(ax+b) and sec^2(ax+b) as reverse differentiation; general integration by substitution is
    not required. All questions are original; no illustrative data are used. Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end, you can integrate the five standard bracket functions and explain why the coefficient inside the bracket changes the answer.
  - type: explain
    title: Check by differentiating backwards
    body: |-
      Trigonometric integrals use radians, just like trigonometric derivatives.

      If the inside is just x, you already know the pairs: e^x integrates to e^x, sin x to -cos x, cos x to sin x, and sec^2x to tan x.

      When the inside is ax + b, differentiation would multiply by a. Integration must undo that multiplication, so divide by a.
  - type: example
    title: The five bracket rules
    problem: |-
      Integrate each of e^(ax+b), 1/(ax+b), sin(ax+b), cos(ax+b), and sec^2(ax+b), where a is not zero.
    steps:
      - |-
        Exponential: integral e^(ax+b) dx = e^(ax+b)/a + c, because differentiating the answer brings down a.
      - |-
        Reciprocal: the integral of 1/(ax+b) with respect to x is ln|ax+b|/a + c. The absolute value allows either sign of the non-zero bracket.
      - |-
        Sine: the integral of sin(ax+b) with respect to x is -cos(ax+b)/a + c.
      - |-
        Cosine: the integral of cos(ax+b) with respect to x is sin(ax+b)/a + c.
      - |-
        Secant squared: integral sec^2(ax+b) dx = tan(ax+b)/a + c.
    answer: |-
      Divide by the inside coefficient a, and add the constant c.
  - type: check
    questions: [exp-integral, reciprocal-integral]
  - type: example
    title: Several standard terms together
    problem: |-
      Find the integral of 3e^(2x+1) + 4/(2x + 3) + sin(5x) with respect to x.
    steps:
      - |-
        Integrate each term separately; the inside coefficients are 2, 2 and 5.
      - |-
        3e^(2x+1) gives (3/2)e^(2x+1). The factor 4/(2x + 3) gives 2 ln|2x + 3|.
      - |-
        sin(5x) gives -cos(5x)/5.
      - |-
        Join the terms and add one constant: (3/2)e^(2x+1) + 2 ln|2x + 3| - cos(5x)/5 + c.
    answer: |-
      (3/2)e^(2x+1) + 2 ln|2x + 3| - cos(5x)/5 + c.
  - type: check
    questions: [sine-integral, sec-integral]
  - type: misconceptions
    items:
      - wrong: |-
          The integral of e^(3x) with respect to x = e^(3x) + c.
        right: |-
          Divide by the inside coefficient: integral e^(3x) dx = e^(3x)/3 + c.
      - wrong: |-
          The integral of sin x is cos x + c.
        right: |-
          The derivative of cos x is -sin x, so the integral is -cos x + c.
      - wrong: |-
          The integral of 1/(2x+1) is ln(2x+1) + c for every x.
        right: |-
          Include the factor 1/2 and absolute value: (1/2)ln|2x+1| + c.
  - type: exam
    body: |-
      - Differentiate your answer quickly to check the sign and the inside coefficient.
      - Use ln|ax+b| for the reciprocal rule.
      - Include + c for an indefinite integral.
  - type: takeaways
    items:
      - |-
        The coefficient of the bracket's x-term becomes a divisor.
      - |-
        sin integrates to -cos; cos integrates to sin; sec^2 integrates to tan.
      - |-
        1/(ax+b) integrates to ln|ax+b|/a.
      - |-
        Differentiate to check, and add + c.
  - type: check
    questions: [exp-factor, cosine-integral]
questions:
  - id: exp-integral
    format: expression
    difficulty: 1
    objectives: ["2.5.1"]
    prompt: |-
      Find integral e^(4x) dx.
    answer: "exp(4*x)/4"
    variables: [x]
    display: |-
      e^(4x)/4 + c
    explanation: |-
      Divide by 4, since differentiating e^(4x) brings down a factor 4.
  - id: reciprocal-integral
    format: expression
    difficulty: 2
    objectives: ["2.5.1"]
    prompt: |-
      Find the integral of 1/(3x + 2) with respect to x.
    answer: "ln(abs(3*x+2))/3"
    variables: [x]
    domain: {min: 0, max: 4}
    display: |-
      ln|3x + 2|/3 + c
    explanation: |-
      The result is ln|3x + 2| divided by the inside coefficient 3, plus c.
  - id: sine-integral
    format: expression
    difficulty: 2
    objectives: ["2.5.1"]
    prompt: |-
      Find the integral of sin(5x - 1) with respect to x.
    answer: "-cos(5*x-1)/5"
    variables: [x]
    display: |-
      -cos(5x - 1)/5 + c
    explanation: |-
      Sine integrates to negative cosine; divide by the inside coefficient 5.
  - id: sec-integral
    format: expression
    difficulty: 2
    objectives: ["2.5.1"]
    prompt: |-
      Find integral sec^2(2x + 3) dx.
    answer: "tan(2*x+3)/2"
    variables: [x]
    display: |-
      tan(2x + 3)/2 + c
    explanation: |-
      Secant squared integrates to tangent; divide by 2.
  - id: exp-factor
    format: numeric
    difficulty: 1
    objectives: ["2.5.1"]
    prompt: |-
      In integral e^(7x) dx = Ke^(7x) + c, find K.
    fields: [{answer: 0.142857142857, tolerance: {abs: 0.000001}}]
    explanation: |-
      K = 1/7 because the inside coefficient 7 must be divided out.
  - id: cosine-integral
    format: expression
    difficulty: 2
    objectives: ["2.5.1"]
    prompt: |-
      Find the integral of cos(3x) with respect to x.
    answer: "sin(3*x)/3"
    variables: [x]
    display: |-
      sin(3x)/3 + c
    explanation: |-
      Cosine integrates to sine, and the bracket coefficient 3 is a divisor.
