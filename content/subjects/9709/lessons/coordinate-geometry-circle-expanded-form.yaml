id: coordinate-geometry-circle-expanded-form
subject: "9709"
topic: "1.3"
title: Circles in expanded form
summary: Turn x² + y² + 2gx + 2fy + c = 0 back into (x − a)² + (y − b)² = r² by completing the square twice, then read off the centre and radius.
order: 6
minutes: 5
kind: core
objectives: ["1.3.3"]
prerequisites: [coordinate-geometry-equation-of-a-circle, quadratics-completing-the-square]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.3 learning outcome "understand that the
    equation (x − a)² + (y − b)² = r² represents the circle with centre (a, b) and radius r",
    including the note on using the expanded form x² + y² + 2gx + 2fy + c = 0. All examples and
    questions are original; every centre, radius and intercept checked in Python. Not yet
    reviewed by a teacher.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can take a circle in **expanded form**, $x^2 + y^2 + 2gx + 2fy + c = 0$, and find its centre and radius by completing the square.

  - type: explain
    title: Same circle, scrambled
    body: |-
      Expand $(x - 3)^2 + (y + 2)^2 = 25$ and tidy up:

      $$x^2 - 6x + 9 + y^2 + 4y + 4 = 25 \;\Rightarrow\; x^2 + y^2 - 6x + 4y - 12 = 0.$$

      Same circle, but now the centre and radius are scrambled. Your job is to **unscramble** it: complete the square in $x$, and separately in $y$.

  - type: example
    title: Unscrambling
    problem: |-
      Find the centre and radius of the circle $x^2 + y^2 + 8x - 2y - 8 = 0$.
    steps:
      - |-
        Group the $x$ terms and the $y$ terms: $(x^2 + 8x) + (y^2 - 2y) - 8 = 0$.
      - |-
        Complete each square: $x^2 + 8x = (x + 4)^2 - 16$ and $y^2 - 2y = (y - 1)^2 - 1$.
      - |-
        Substitute: $(x + 4)^2 - 16 + (y - 1)^2 - 1 - 8 = 0$.
      - |-
        Move the numbers across: $(x + 4)^2 + (y - 1)^2 = 25$.
    answer: |-
      Centre $(-4, 1)$, radius 5.

  - type: diagram
    diagram: coordinate-geometry-circle-expanded
    alt: >-
      Square grid showing the blue circle x² + y² − 6x + 4y − 12 = 0, with centre (3, −2) marked
      and a radius line labelled r = 5. The circle cuts the y-axis at (0, 2) and (0, −6), both
      marked, and cuts the x-axis at points labelled 3 − √21 and 3 + √21, about −1.58 and 7.58.
    caption: |-
      $x^2 + y^2 - 6x + 4y - 12 = 0$ unscrambles to $(x - 3)^2 + (y + 2)^2 = 25$. To find where it cuts the $y$-axis, put $x = 0$: $y^2 + 4y - 12 = 0$, so $y = 2$ or $y = -6$.

  - type: check
    questions: [cx-centre, cx-g-f]

  - type: explain
    title: The formula version
    body: |-
      Do the unscrambling once with letters and you get a shortcut:

      $$x^2 + y^2 + 2gx + 2fy + c = 0 \quad\text{has centre } (-g, -f) \text{ and radius } \sqrt{g^2 + f^2 - c}.$$

      For $x^2 + y^2 - 6x + 4y - 12 = 0$: $2g = -6$ so $g = -3$, and $2f = 4$ so $f = 2$. Centre $(3, -2)$, radius $\sqrt{9 + 4 + 12} = 5$ ✓

      Halve **first**, then flip the signs. Completing the square is safer when you're tired; the formula is a quick check.

  - type: example
    title: When x² and y² have a coefficient
    problem: |-
      Find the centre and radius of the circle $2x^2 + 2y^2 - 12x + 8y + 6 = 0$.
    steps:
      - |-
        The formula needs $x^2$ and $y^2$ on their own, so **divide everything by 2** first: $x^2 + y^2 - 6x + 4y + 3 = 0$.
      - |-
        Complete the squares: $(x - 3)^2 - 9 + (y + 2)^2 - 4 + 3 = 0$.
      - |-
        So $(x - 3)^2 + (y + 2)^2 = 10$.
    answer: |-
      Centre $(3, -2)$, radius $\sqrt{10}$. Leave it exact.

  - type: check
    questions: [cx-radius-surd, cx-scaled]

  - type: explain
    title: Is it even a circle?
    body: |-
      An equation is a circle of this kind only if:

      - $x^2$ and $y^2$ have the **same** coefficient (divide it out to make it 1),
      - there's **no $xy$ term**, and
      - the right-hand side after completing the square is **positive**, i.e. $g^2 + f^2 - c > 0$.

      $x^2 + y^2 + 2x - 4y + 10 = 0$ becomes $(x + 1)^2 + (y - 2)^2 = -5$. A sum of squares can't be negative, so no point satisfies it: **not a circle**.

  - type: misconceptions
    items:
      - wrong: |-
          $x^2 + y^2 - 6x + 4y - 12 = 0$ has centre $(-6, 4)$.
        right: |-
          Halve the coefficients and flip the signs: $g = -3$, $f = 2$, centre $(3, -2)$.
      - wrong: |-
          Radius $= \sqrt{g^2 + f^2 + c}$.
        right: |-
          It's $\sqrt{g^2 + f^2 - c}$. With $c = -12$: $\sqrt{9 + 4 - (-12)} = \sqrt{25} = 5$. Or skip the formula and complete the square.
      - wrong: |-
          For $3x^2 + 3y^2 - 12x + \dots = 0$, use $2g = -12$ straight away.
        right: |-
          Divide by 3 first so that $x^2$ and $y^2$ have coefficient 1. Then $2g = -4$.

  - type: exam
    body: |-
      - Typical wording: *Find the coordinates of the centre and the radius of the circle with equation …*, about 3 marks. Completing the square earns method marks even if one number slips.
      - Expanded form often arrives inside a bigger question: tangents, intersections with a line, or where the circle cuts an axis.
      - Insider hack: substitute the centre's coordinates into the expanded equation. You should get $-r^2$. For $x^2 + y^2 - 6x + 4y - 12 = 0$ at $(3, -2)$: $9 + 4 - 18 - 8 - 12 = -25 = -5^2$ ✓

  - type: check
    questions: [cx-not-circle, cx-intercepts]

  - type: takeaways
    items:
      - |-
        Complete the square in $x$ and in $y$ to get $(x - a)^2 + (y - b)^2 = r^2$.
      - |-
        Shortcut: $x^2 + y^2 + 2gx + 2fy + c = 0$ has centre $(-g, -f)$ and radius $\sqrt{g^2 + f^2 - c}$.
      - |-
        Make the coefficients of $x^2$ and $y^2$ equal to 1 first.
      - |-
        If the right-hand side comes out zero or negative, it isn't a circle.

questions:
  - id: cx-centre
    format: numeric
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |-
      Find the centre and radius of the circle $x^2 + y^2 - 10x + 6y + 9 = 0$.
    fields:
      - label: "centre x ="
        answer: 5
      - label: "centre y ="
        answer: -3
      - label: "radius ="
        answer: 5
    explanation: |-
      $(x - 5)^2 - 25 + (y + 3)^2 - 9 + 9 = 0$, so $(x - 5)^2 + (y + 3)^2 = 25$.

      Centre $(5, -3)$, radius 5.

  - id: cx-g-f
    format: mcq
    difficulty: 1
    objectives: ["1.3.3"]
    prompt: |-
      What is the centre of the circle $x^2 + y^2 + 4x - 8y - 5 = 0$?
    explanation: |-
      $2g = 4$ so $g = 2$; $2f = -8$ so $f = -4$. The centre is $(-g, -f) = (-2, 4)$.

      By completing the square: $(x + 2)^2 + (y - 4)^2 = 4 + 16 + 5 = 25$ ✓
    options:
      - text: |-
          $(2, -4)$
        why: |-
          Halved but didn't flip. $(x + 2)^2$ is zero when $x = -2$.
      - text: |-
          $(4, -8)$
        why: |-
          Neither halved nor flipped. The coefficient of $x$ is $2g$, not $g$.
      - text: |-
          $(-2, 4)$
        correct: true
        why: |-
          Halve the coefficients of $x$ and $y$, then flip the signs.
      - text: |-
          $(-4, 8)$
        why: |-
          Flipped but didn't halve. Remember $x^2 + 4x = (x + 2)^2 - 4$.

  - id: cx-radius-surd
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      Find the radius of the circle $x^2 + y^2 - 2x + 6y - 2 = 0$. Give an exact surd (such as `3√2`) or a decimal to 3 significant figures.
    fields:
      - label: "radius ="
        answer: 3.4641016151377544
        tolerance: { abs: 0.005 }
    explanation: |-
      $(x - 1)^2 - 1 + (y + 3)^2 - 9 - 2 = 0$, so $(x - 1)^2 + (y + 3)^2 = 12$.

      Radius $= \sqrt{12} = 2\sqrt3 \approx 3.46$.

  - id: cx-scaled
    format: numeric
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |-
      Find the centre and radius of the circle $3x^2 + 3y^2 - 12x + 18y - 9 = 0$.
    fields:
      - label: "centre x ="
        answer: 2
      - label: "centre y ="
        answer: -3
      - label: "radius ="
        answer: 4
    explanation: |-
      Divide by 3: $x^2 + y^2 - 4x + 6y - 3 = 0$.

      $(x - 2)^2 - 4 + (y + 3)^2 - 9 - 3 = 0$, so $(x - 2)^2 + (y + 3)^2 = 16$. Centre $(2, -3)$, radius 4.

  - id: cx-not-circle
    format: mcq
    difficulty: 3
    objectives: ["1.3.3"]
    prompt: |-
      Which one of these equations does **not** represent a circle?
    explanation: |-
      Complete the square on each. For $x^2 + y^2 - 6x + 2y + 12 = 0$ you get $(x - 3)^2 + (y + 1)^2 = 9 + 1 - 12 = -2$. A sum of two squares can't equal a negative number, so no real point satisfies it.
    options:
      - text: |-
          $x^2 + y^2 - 6x + 2y + 6 = 0$
        why: |-
          $(x - 3)^2 + (y + 1)^2 = 9 + 1 - 6 = 4$: centre $(3, -1)$, radius 2. A perfectly good circle.
      - text: |-
          $x^2 + y^2 - 6x + 2y + 12 = 0$
        correct: true
        why: |-
          $g^2 + f^2 - c = 9 + 1 - 12 = -2 < 0$, so there's no radius.
      - text: |-
          $x^2 + y^2 + 8y = 0$
        why: |-
          No $x$ term just means $g = 0$: $x^2 + (y + 4)^2 = 16$, centre $(0, -4)$, radius 4.
      - text: |-
          $3x^2 + 3y^2 - 12 = 0$
        why: |-
          Divide by 3: $x^2 + y^2 = 4$, centre the origin, radius 2.

  - id: cx-intercepts
    format: numeric
    difficulty: 3
    objectives: ["1.3.3"]
    prompt: |-
      The circle $x^2 + y^2 - 4x + 2y - 8 = 0$ cuts the $y$-axis at $A$ and $B$, where $A$ is above $B$. Find the $y$-coordinates of $A$ and $B$.
    fields:
      - label: "A: y ="
        answer: 2
      - label: "B: y ="
        answer: -4
    explanation: |-
      On the $y$-axis, $x = 0$: $y^2 + 2y - 8 = 0$, so $(y + 4)(y - 2) = 0$.

      $A$ is $(0, 2)$ and $B$ is $(0, -4)$, so $AB = 6$. (The circle has centre $(2, -1)$; the chord $AB$ is bisected at $(0, -1)$, level with the centre. Symmetry!)
