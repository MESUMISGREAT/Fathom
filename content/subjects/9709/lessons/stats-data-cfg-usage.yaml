id: stats-data-cfg-usage
subject: "9709"
topic: "5.1"
title: Using cumulative frequency graphs
summary: Use cumulative frequency graphs to estimate medians, quartiles, percentiles, and proportions of a distribution.
order: 4
minutes: 9
kind: core
objectives: ["5.1.4"]
prerequisites: ["stats-data-drawing-displays"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 5.1 outcome "Use a cumulative frequency graph. For example,
    to estimate medians, quartiles and percentiles, the proportion of a distribution above
    (or below) a given value, or the proportion between two values." All examples, questions
    and diagrams are original. Rebuilt on 2026-10-30 by Claude Opus 5.5: the previous
    worked examples referred to a graph the lesson never showed ("exact values depend on the
    graph"), so every example now reads from one drawn graph of 80 parcel masses, with each
    reading recomputed by linear interpolation. Independently reviewed on 2026-10-30 by a separate Claude agent, which recomputed every example and answer key; its findings (syllabus scope of the interpolation formula, notation in the questions) were fixed. Not reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can read a cumulative frequency graph to estimate the median, the
      quartiles, any percentile, and the proportion of the data above, below or between given
      values.

  - type: explain
    title: What the graph is counting
    body: |-
      **Cumulative frequency** means "how many so far". For each value on the horizontal axis,
      the graph tells you how many data items are **at or below** that value.

      Here is the running data set for this lesson: the masses of 80 parcels at a depot.

      | Mass $m$ (kg) | $0 < m \le 1$ | $1 < m \le 2$ | $2 < m \le 3$ | $3 < m \le 4$ | $4 < m \le 5$ | $5 < m \le 6$ |
      | --- | --- | --- | --- | --- | --- | --- |
      | Frequency | 6 | 14 | 24 | 20 | 12 | 4 |
      | Cumulative frequency | 6 | 20 | 44 | 64 | 76 | 80 |

      Each cumulative frequency is the previous one plus the next frequency: $6$, then
      $6 + 14 = 20$, then $20 + 24 = 44$, and so on. The last value is the total, $n = 80$.

      Each cumulative frequency is plotted at the **upper end** of its class. "20 parcels weigh
      2 kg or less" belongs at mass 2, because only once you reach 2 kg have all 20 been counted.

  - type: diagram
    diagram: stats-cfg-parcels
    alt: >-
      A cumulative frequency graph for the masses of 80 parcels. Mass in kilograms from 0 to 6
      is on the horizontal axis and cumulative frequency from 0 to 80 on the vertical axis. The
      points (0, 0), (1, 6), (2, 20), (3, 44), (4, 64), (5, 76) and (6, 80) are joined by straight
      lines. Dashed reading lines go across from cumulative frequencies 20, 40 and 60 to the
      graph and down to the mass axis at 2.0, about 2.83 and 3.8 kilograms, labelled lower
      quartile, median and upper quartile.
    caption: |-
      Across from the cumulative frequency you want, down to the mass. The steepest part of the
      graph is where the data is most crowded: lots of parcels between 2 and 4 kg.

  - type: explain
    title: Where to read the median and quartiles
    body: |-
      If you lined all $n$ parcels up from lightest to heaviest:

      - the **median** is the one halfway along, at cumulative frequency $\tfrac{1}{2}n$;
      - the **lower quartile** $Q_1$ is a quarter of the way along, at $\tfrac{1}{4}n$;
      - the **upper quartile** $Q_3$ is three quarters of the way along, at $\tfrac{3}{4}n$.

      For $n = 80$ those positions are $40$, $20$ and $60$.

      **The method:** find the position on the cumulative frequency axis, go **across** to the
      graph, then **down** to the horizontal axis and read the value. In an exam, draw those
      lines on the graph: they are your working.

  - type: example
    title: "Example 1: median and quartiles from the graph"
    problem: |-
      Use the graph of the 80 parcel masses to estimate the median, the lower quartile, the upper
      quartile and the interquartile range.
    steps:
      - |-
        **Positions:** median at $\tfrac{1}{2} \times 80 = 40$, $Q_1$ at $\tfrac{1}{4} \times 80 = 20$,
        $Q_3$ at $\tfrac{3}{4} \times 80 = 60$.
      - |-
        **$Q_1$:** across from 20, the graph is reached exactly at a plotted point, $(2, 20)$, so
        $Q_1 = 2.0$ kg.
      - |-
        **Median:** across from 40 lands between the points $(2, 20)$ and $(3, 44)$. On that
        stretch the graph climbs $24$ in $1$ kg, and we need to climb $40 - 20 = 20$ of those $24$.
        So we go $\tfrac{20}{24}$ of the way from 2 to 3: median $= 2 + \tfrac{20}{24} \approx 2.83$ kg.
      - |-
        **$Q_3$:** across from 60 lands between $(3, 44)$ and $(4, 64)$. We need $60 - 44 = 16$ of
        the $20$ on that stretch: $Q_3 = 3 + \tfrac{16}{20} = 3.8$ kg.
      - |-
        **Interquartile range:** $Q_3 - Q_1 = 3.8 - 2.0 = 1.8$ kg. The middle half of the parcels
        lie within a 1.8 kg band.
    answer: |-
      Median $\approx 2.83$ kg, $Q_1 = 2.0$ kg, $Q_3 = 3.8$ kg, interquartile range $1.8$ kg.
      (A smooth curve through the points would give very similar readings; straight lines make
      the arithmetic checkable.)

  - type: check
    title: Check 1 — reading positions
    questions: [sc-cfg-median-quartiles]

  - type: explain
    title: Percentiles are the same idea
    body: |-
      The **$k$th percentile** is the value below which $k\%$ of the data lies, so you read it at
      cumulative frequency $\dfrac{k}{100} \times n$.

      The quartiles are just special percentiles: $Q_1$ is the 25th, the median the 50th and $Q_3$
      the 75th.

  - type: example
    title: "Example 2: the 90th percentile"
    problem: |-
      Estimate the 90th percentile of the parcel masses.
    steps:
      - |-
        **Position:** $\dfrac{90}{100} \times 80 = 72$.
      - |-
        **Across from 72:** this is between $(4, 64)$ and $(5, 76)$, where the graph climbs $12$
        per kg.
      - |-
        **Interpolate:** we need $72 - 64 = 8$ of those $12$, so the value is
        $4 + \tfrac{8}{12} \approx 4.67$ kg.
    answer: |-
      About $4.67$ kg: 90% of the parcels weigh less than this.

  - type: check
    title: Check 2 — percentiles
    questions: [sc-cfg-percentile]

  - type: explain
    title: Proportions above, below and between values
    body: |-
      Now go the other way: start from a value on the **horizontal** axis, go **up** to the
      graph and **across** to read how many items are at or below it.

      - **Below** a value $X$: the cumulative frequency at $X$, out of $n$.
      - **Above** $X$: everything else, $n - (\text{CF at } X)$, out of $n$.
      - **Between** $A$ and $B$: $(\text{CF at } B) - (\text{CF at } A)$, out of $n$, because the
        items up to $B$ include all the items up to $A$, and subtracting removes them.

      Always divide by the total $n$, the top value of the cumulative frequency axis.

  - type: example
    title: "Example 3: heavier than 4.5 kg"
    problem: |-
      Estimate the percentage of parcels that weigh more than 4.5 kg.
    steps:
      - |-
        **Up from 4.5:** halfway between $(4, 64)$ and $(5, 76)$, so the cumulative frequency is
        halfway between 64 and 76: $64 + \tfrac{1}{2}(12) = 70$. About 70 parcels weigh 4.5 kg or less.
      - |-
        **Above:** $80 - 70 = 10$ parcels.
      - |-
        **Percentage:** $\dfrac{10}{80} \times 100 = 12.5\%$.
    answer: |-
      About $12.5\%$ of the parcels weigh more than 4.5 kg.

  - type: example
    title: "Example 4: between 1.5 kg and 3.5 kg"
    problem: |-
      Estimate the proportion of parcels with mass between 1.5 kg and 3.5 kg.
    steps:
      - |-
        **CF at 1.5:** halfway between $(1, 6)$ and $(2, 20)$: $6 + \tfrac{1}{2}(14) = 13$.
      - |-
        **CF at 3.5:** halfway between $(3, 44)$ and $(4, 64)$: $44 + \tfrac{1}{2}(20) = 54$.
      - |-
        **Between:** $54 - 13 = 41$ parcels, so the proportion is $\dfrac{41}{80} \approx 0.51$.
    answer: |-
      About $0.51$, so roughly half of the parcels.

  - type: check
    title: Check 3 — proportions
    questions: [sc-cfg-proportion-above, sc-cfg-proportion-between, sc-cfg-parcels-heavy]

  - type: enrichment
    title: Beyond this objective — the same reading as a formula
    body: |-
      Every reading above was "how far along the straight piece do I go?". Written as a formula
      for the median from a grouped table:

      $$\text{median} \approx L + \frac{\tfrac{1}{2}n - F}{f} \times w$$

      - $L$ is the lower boundary of the class containing the median;
      - $F$ is the cumulative frequency **before** that class;
      - $f$ is the frequency **of** that class;
      - $w$ is the class width.

      Check it on the parcels: $L = 2$, $F = 20$, $f = 24$, $w = 1$ gives
      $2 + \tfrac{40 - 20}{24} \times 1 \approx 2.83$ kg, exactly the reading from the graph. It
      assumes the items are spread evenly through the class, which is what the straight line
      assumes too.

  - type: takeaways
    items:
      - "Cumulative frequency is a running total, plotted at the upper end of each class."
      - "Median, quartiles and percentiles: across from the position ($\\tfrac12 n$, $\\tfrac14 n$, $\\tfrac34 n$, $\\tfrac{k}{100}n$), then down."
      - "Proportions: up from the value, across to the CF, then divide by the total $n$."
      - "Between two values: subtract the two cumulative frequencies."
      - "Draw your reading lines on the graph; they are your working."

questions:
  - id: sc-cfg-median-quartiles
    format: mcq
    difficulty: 1
    objectives: ["5.1.4"]
    prompt: |-
      A cumulative frequency graph represents 60 observations. At what cumulative frequency do you read the upper quartile $Q_3$?
    options:
      - text: "15"
        why: |-
          That is $\tfrac{1}{4}n$, the position of $Q_1$.
        correct: false
      - text: "30"
        why: |-
          That is $\tfrac{1}{2}n$, the position of the median.
        correct: false
      - text: "45"
        why: |-
          $Q_3$ is three quarters of the way along: $\tfrac{3}{4} \times 60 = 45$.
        correct: true
      - text: "60"
        why: |-
          That is the total frequency $n$, the top of the graph.
        correct: false
    explanation: |-
      $Q_3$ is read at $\tfrac{3}{4}n = \tfrac{3}{4} \times 60 = 45$ on the cumulative frequency axis.

  - id: sc-cfg-percentile
    format: mcq
    difficulty: 1
    objectives: ["5.1.4"]
    prompt: |-
      For a data set of 250 values, at which cumulative frequency is the 80th percentile read?
    options:
      - text: "20"
        why: |-
          That would be the 8th percentile, $\tfrac{8}{100} \times 250$.
        correct: false
      - text: "200"
        why: |-
          $\tfrac{80}{100} \times 250 = 200$.
        correct: true
      - text: "250"
        why: |-
          That is the total frequency $n$.
        correct: false
      - text: "80"
        why: |-
          That is the percentile number, not its position on the cumulative frequency axis.
        correct: false
    explanation: |-
      The $k$th percentile is read at $\tfrac{k}{100} \times n = \tfrac{80}{100} \times 250 = 200$.

  - id: sc-cfg-proportion-above
    format: numeric
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |-
      A cumulative frequency graph for 160 observations reads $112$ at the value $50$. What percentage of the data is greater than $50$?
    fields:
      - label: "percentage ="
        answer: 30
    explanation: |-
      $112$ items are at or below $50$, so $160 - 112 = 48$ are above it, and $\tfrac{48}{160} \times 100 = 30\%$.

  - id: sc-cfg-proportion-between
    format: numeric
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |-
      For 200 observations, the cumulative frequency is $60$ at the value $30$ and $150$ at the value $70$. What proportion of the data lies between $30$ and $70$?
    fields:
      - label: "proportion ="
        answer: 0.45
    explanation: |-
      Between the two values: $150 - 60 = 90$ items, and $\tfrac{90}{200} = 0.45$.

  - id: sc-cfg-parcels-heavy
    format: numeric
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |-
      Using the graph of the 80 parcel masses, estimate how many parcels weigh more than $3.5$ kg.
    fields:
      - label: "number ="
        answer: 26
        tolerance: { abs: 1 }
    explanation: |-
      Up from $3.5$ kg: halfway between the points $(3, 44)$ and $(4, 64)$, so the cumulative frequency is $44 + 10 = 54$. That many weigh $3.5$ kg or less, so $80 - 54 = 26$ weigh more.
