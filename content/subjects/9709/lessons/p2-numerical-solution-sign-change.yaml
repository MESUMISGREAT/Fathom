blocks:
  - type: objective
    body: |-
      By the end you can show that an equation has a root between two values by checking the **sign** of a function, and you can explain why that works using the graph.

  - type: explain
    title: What they ask
    body: |-
      Some equations are impossible to solve exactly. For example, there is no neat formula for the root of

      $$x^3 + x - 3 = 0.$$

      Cambridge does not ask you to invent one. It asks this instead:

      > Show that the equation $x^3 + x - 3 = 0$ has a root between $1$ and $2$.

      "A root between 1 and 2" means: somewhere in that interval, the curve crosses the $x$-axis. You do not need to say where. You only need to prove it must happen.

  - type: explain
    title: The method
    body: |-
      Write the equation as $f(x) = 0$, then follow four steps.

      1. **Name the function.** Move everything to one side: $f(x) = x^3 + x - 3$.
      2. **Evaluate at both ends.** Work out $f(1)$ and $f(2)$ — no rounding to 0 d.p., keep the signs visible.
      3. **Compare the signs.** One value is negative and the other is positive.
      4. **Write the conclusion.** Say *"$f(1) < 0$ and $f(2) > 0$, and $f$ is continuous, so there is a root between $1$ and $2$."*

      **Why it works:** a continuous curve cannot get from below the $x$-axis to above it without passing through it. Changing sign forces a crossing.

      **The forgotten step:** that word **continuous**. A curve with a break can jump from negative to positive without ever being zero, so the conclusion needs continuity stated (or a graph that plainly has no break).

  - type: diagram
    diagram: p2-numerical-solution-sign-change
    alt: >-
      The curve y = x³ + x − 3 drawn from x = 0 to x = 2.2. At x = 1 the curve is below the
      x-axis, at y = −1, marked with a hollow point and the label f(1) = −1. At x = 2 it is
      above the axis at y = 7, marked with a hollow point and the label f(2) = 7. The curve
      crosses the x-axis between the two marked points, at about x = 1.21, and the crossing
      is circled with the label root between 1 and 2.
    caption: |-
      One end is below the axis, the other is above it. The curve is unbroken, so it has to cross somewhere in between.

  - type: example
    title: "Example 1: the easiest case"
    problem: |-
      Show that $x^3 + x - 3 = 0$ has a root between $1$ and $2$.
    steps:
      - |-
        Let $f(x) = x^3 + x - 3$. A root of the equation is a value where $f(x) = 0$.
      - |-
        $f(1) = 1^3 + 1 - 3 = -1$, which is **negative**.
      - |-
        $f(2) = 2^3 + 2 - 3 = 7$, which is **positive**.
      - |-
        The sign changes from negative to positive as $x$ goes from $1$ to $2$.
      - |-
        $f$ is a polynomial, so it is continuous. Therefore the curve crosses the $x$-axis between $x = 1$ and $x = 2$: the equation has a root there.
    answer: |-
      $f(1) = -1 < 0$ and $f(2) = 7 > 0$; with $f$ continuous, a root lies between $1$ and $2$.

  - type: check
    questions: [sc-evaluate, sc-conclusion]

  - type: example
    title: "Example 2: exam-style, with a table"
    problem: |-
      (a) Show that $x^3 - 3x - 6 = 0$ has a root between $2$ and $3$.

      (b) The table shows values of $g(x) = x^3 - 4x + 1$. Use it to find an interval of length 1 containing a root.

      | $x$ | $-3$ | $-2$ | $-1$ | $0$ | $1$ | $2$ |
      | --- | --- | --- | --- | --- | --- | --- |
      | $g(x)$ | $-14$ | $1$ | $4$ | $1$ | $-2$ | $1$ |
    steps:
      - |-
        (a) Let $f(x) = x^3 - 3x - 6$. Then $f(2) = 8 - 6 - 6 = -4$ (negative).
      - |-
        $f(3) = 27 - 9 - 6 = 12$ (positive).
      - |-
        The sign changes, and $f$ is continuous, so a root lies between $2$ and $3$.
      - |-
        (b) Look for a sign change in the table. $g(-3) = -14$ and $g(-2) = 1$: a root between $-3$ and $-2$.
      - |-
        $g(0) = 1$ and $g(1) = -2$: a root between $0$ and $1$.
      - |-
        $g(1) = -2$ and $g(2) = 1$: a root between $1$ and $2$.
    answer: |-
      (a) $f(2) = -4 < 0$ and $f(3) = 12 > 0$, so a root lies between $2$ and $3$.

      (b) Three roots: between $-3$ and $-2$, between $0$ and $1$, and between $1$ and $2$.

  - type: intuition
    title: Why a sign change is enough (and when it is not)
    body: |-
      Draw any continuous curve that starts below the $x$-axis and finishes above it. There is no way to do it without crossing the axis. That is the whole idea, and it is worth saying out loud in an exam.

      Two cautions:

      - A sign change proves **at least one** root in the interval. There could be three (a wiggly cubic can do that). It does not promise exactly one.
      - No sign change does **not** prove there is no root. A curve can cross twice in the same interval and come back to the same side, or just touch the axis. The test is a one-way guarantee.

  - type: check
    questions: [sc-opposite-sign, sc-why-continuous]

  - type: misconceptions
    items:
      - wrong: |-
          $f(1) = -1$ and $f(2) = 7$, so the root is $1.5$ (half way).
        right: |-
          A sign change tells you *where the root is hiding*, not what it equals. The root of $x^3 + x - 3 = 0$ is about $1.213$, not half way. This lesson only locates it.
      - wrong: |-
          $f(1) < 0$ and $f(2) > 0$, so a root lies between $1$ and $2$. (No reason given.)
        right: |-
          Add the reason: "$f$ is continuous, so the curve must cross the $x$-axis". The continuity (or a sketch showing no break) is part of the mark.
      - wrong: |-
          Rounding $f(1) = -0.04$ to $0$ and calling it a sign change.
        right: |-
          Keep the sign of the actual value. $-0.04$ is negative; it is not zero and it is not positive.
      - wrong: |-
          $f(1)$ and $f(2)$ have the same sign, so there is definitely no root.
        right: |-
          Only a sign **change** proves a root exists. The same sign proves nothing either way.

  - type: exam
    body: |-
      - Write the function clearly: *"Let $f(x) = \ldots$"*. Then show both substitutions.
      - Give the actual values, with signs: "$f(1) = -1$ and $f(2) = 7$".
      - Finish with the words *"sign change, and $f$ is continuous, so there is a root between $1$ and $2$"*. The conclusion sentence earns the mark.
      - If the question gives a table, scan down the values for the sign change; do not re-evaluate every entry.
      - For "consecutive integers", list the integers in order and test them until the sign flips.

  - type: check
    questions: [sc-interval, sc-table]

  - type: takeaways
    items:
      - |-
        To locate a root: write $f(x) = 0$, evaluate at the two ends, look for a sign change.
      - |-
        A sign change plus continuity means the curve crosses the axis, so a root lies in the interval.
      - |-
        It proves **a** root exists; it does not find its value and does not promise only one.
      - |-
        Say "continuous" and write the conclusion sentence in full.

questions:
  - id: sc-evaluate
    format: numeric
    difficulty: 1
    objectives: ["2.6.1"]
    prompt: |-
      For $f(x) = x^3 + x - 3$, find $f(2)$.
    fields:
      - label: "f(2) ="
        answer: 7
    explanation: |-
      $f(2) = 2^3 + 2 - 3 = 8 + 2 - 3 = 7$.

  - id: sc-conclusion
    format: cloze
    difficulty: 1
    objectives: ["2.6.1"]
    prompt: |-
      For a continuous function $f$, if $f(1)$ and $f(2)$ have {{1}} signs, then the equation $f(x) = 0$ has a root between $1$ and $2$.
    blanks:
      - accept: [opposite, different, differing, opposite signs]
    explanation: |-
      The curve must cross the $x$-axis to get from one side to the other, so $f(x) = 0$ somewhere in between.

  - id: sc-interval
    format: mcq
    difficulty: 1
    objectives: ["2.6.1"]
    prompt: |-
      For $f(x) = x^3 - 3x - 6$: $f(0) = -6$, $f(1) = -8$, $f(2) = -4$, $f(3) = 12$ and $f(4) = 46$. Which interval definitely contains a root of $f(x) = 0$?
    explanation: |-
      Only $f(2) = -4$ and $f(3) = 12$ have opposite signs, so the root lies between $2$ and $3$. Every other pair of values given is negative, or both positive, which proves nothing either way.
    options:
      - text: Between $2$ and $3$
        correct: true
        why: |-
          $f(2) = -4$ is negative and $f(3) = 12$ is positive: the sign changes, so a continuous curve crosses the axis there.
      - text: Between $1$ and $2$
        why: |-
          $f(1) = -8$ and $f(2) = -4$ are both negative, so there is no sign change to justify a root.
      - text: Between $0$ and $1$
        why: |-
          $f(0) = -6$ and $f(1) = -8$ are both negative. A root may still exist there, but the values do not prove it.
      - text: Between $3$ and $4$
        why: |-
          $f(3) = 12$ and $f(4) = 46$ are both positive, so no sign change is shown.

  - id: sc-table
    format: numeric
    difficulty: 2
    objectives: ["2.6.1"]
    prompt: |-
      $f(x) = x^2 - 2$ has $f(1) = -1$ and $f(2) = 2$. The root is $\sqrt{2}$. Find the value of $f(1.4)$ and $f(1.5)$, and say which interval of length $0.1$ contains the root.
    fields:
      - label: "f(1.4) ="
        answer: -0.04
        tolerance: { rel: 0.05 }
      - label: "f(1.5) ="
        answer: 0.25
        tolerance: { rel: 0.05 }
    explanation: |-
      $f(1.4) = 1.96 - 2 = -0.04$ (negative) and $f(1.5) = 2.25 - 2 = 0.25$ (positive). The sign change happens between $1.4$ and $1.5$, so the root $\sqrt{2} \approx 1.414$ lies in that interval.

  - id: sc-why-continuous
    format: text
    difficulty: 2
    objectives: ["2.6.1"]
    prompt: |-
      Explain why the word *continuous* matters when you use a sign change to show a root exists.
    accept:
      - a continuous curve cannot move from below the x-axis to above it without crossing it, so a sign change forces a root
      - if the curve is continuous there is no break, so it must pass through zero to change sign
      - a discontinuous curve could jump over the axis without ever being zero, so continuity guarantees the crossing
      - because a curve with a break could jump from negative to positive without crossing the x-axis
      - continuity means no gaps, so the curve must cross the x-axis to change sign
    model: |-
      If a curve has no break (it is continuous), it cannot travel from below the $x$-axis to above it without passing through $f(x) = 0$. A curve with a jump could skip over the axis, so the sign change alone would not be enough.
    explanation: |-
      The sign change is the evidence; continuity is the reason the evidence works. Examiners want both, and the jump-counterexample is the justification.

  - id: sc-opposite-sign
    format: numeric
    difficulty: 2
    objectives: ["2.6.1"]
    prompt: |-
      $f(x) = x^3 + x - 3$. By testing integers, find the smallest integer $n$ such that $f(n) > 0$.
    fields:
      - label: "n ="
        answer: 2
    explanation: |-
      $f(0) = -3$, $f(1) = -1$ and $f(2) = 7$. The first positive value comes at $n = 2$, which is why the root is between $1$ and $2$.
