id: p2-numerical-solution-sign-change
subject: "9709"
topic: "2.6"
title: Spotting where a root hides
summary: Use a sign change (and the graph) to show that an equation has a root between two values, without solving it.
order: 1
minutes: 6
kind: core
objectives: ["2.6.1"]
prerequisites: [quadratics-solving-equations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
