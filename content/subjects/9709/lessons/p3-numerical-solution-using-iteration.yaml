id: p3-numerical-solution-using-iteration
subject: "9709"
topic: "3.6"
title: "Running an iteration to find a root"
summary: "What an iteration formula is, why its values home in on a root, and how to run one to the accuracy a question asks for."
order: 3
minutes: 10
kind: core
objectives: ["3.6.3"]
prerequisites: [p3-numerical-solution-approximations]
