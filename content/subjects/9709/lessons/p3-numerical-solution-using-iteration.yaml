blocks:
  - type: objective
    body: |
      By the end you can explain how an iteration formula is connected to the equation it solves, run the
      iteration accurately, and state the root to the number of decimal places a question asks for.

  - type: explain
    title: Why we need this
    body: |
      Some equations, such as $x^3 - 3x - 4 = 0$, can't be solved exactly with algebra you know. But we can
      still find the root as accurately as we like, by **improving a guess over and over**. That is what an
      **iteration** does.

  - type: explain
    title: Key to the symbols
    body: |
      | Symbol | Meaning |
      | --- | --- |
      | $x_1$ | the first guess (the question gives it to you) |
      | $x_2, x_3, x_4, \ldots$ | the second, third, fourth... approximations |
      | $x_n$ | the approximation at step $n$ (any step) |
      | $x_{n+1}$ | the **next** approximation, worked out from $x_n$ |
      | $F$ | the function in the iteration formula |
      | $\alpha$ | the true root we are aiming for (the Greek letter alpha) |

  - type: explain
    title: How an iteration formula works
    body: |
      An iteration formula looks like

      $$x_{n+1} = F(x_n)$$

      Read it as: **"to get the next value, put the current value into $F$."** Start with $x_1$, put it in to get
      $x_2$, put $x_2$ in to get $x_3$, and so on. Each output becomes the next input.

      **Where does $F$ come from?** From rearranging the equation into the form $x = F(x)$. For example:

      $$x^3 - 3x - 4 = 0 \;\Rightarrow\; x^3 = 3x + 4 \;\Rightarrow\; x = \sqrt[3]{3x + 4}$$

      So the iteration $x_{n+1} = \sqrt[3]{3x_n + 4}$ comes from this equation.

      **Why does it find the root?** If the values settle down to a single number $\alpha$, then for large $n$
      both $x_n$ and $x_{n+1}$ are (almost exactly) $\alpha$. Putting that into the formula gives
      $\alpha = F(\alpha)$, which is the rearranged equation. So the number the values settle at **is a root
      of the equation**.

      The diagram shows this as a "staircase". Each step goes up to the curve $y = F(x)$ (working out the next
      value) and across to the line $y = x$ (making that output the next input). The steps shrink as they close
      in on the point where the curve meets the line, and that point is the root.

  - type: diagram
    diagram: p3-iteration-staircase-cubic
    alt: "Graph of y = x and of y equals the cube root of 3x + 4 for x between 1.95 and 2.25, crossing at alpha about 2.196. A staircase starts at x1 = 2, goes up to the curve, across to the line at x2 about 2.154, up to the curve, across to x3 about 2.187, and so on, with the steps shrinking towards the crossing point."
    caption: |
      Up to the curve, across to the line: each step lands on the next value. The steps get smaller and close
      in on $\alpha$, where $x = \sqrt[3]{3x + 4}$.

  - type: explain
    title: Running it, and knowing when to stop
    body: |
      1. Put $x_1$ into $F$ to get $x_2$. Write it down. Use your calculator's **Ans** key so you never retype a
         rounded number: type $x_1$, press equals, then type the formula using Ans and press equals repeatedly.
      2. Write down each value to **more** decimal places than the final answer needs (two extra is plenty).
      3. **Stop when two values in a row round to the same answer** at the accuracy asked for. That rounded
         value is the root.

      Why does that rule work? Once two successive values agree to, say, 3 decimal places, the steps have
      become smaller than the size of that rounding, so later values are very unlikely to change the
      3-decimal-place answer. (If you need to be certain, a sign-change check either side of the answer, like
      the one in the first lesson of this topic, proves it.)

  - type: example
    title: Running a cube-root iteration
    problem: |
      Use the iteration $x_{n+1} = \sqrt[3]{3x_n + 4}$ with $x_1 = 2$ to find the root of $x^3 - 3x - 4 = 0$
      correct to 3 decimal places. Give each iterate to 5 decimal places.
    steps:
      - "$x_2 = \\sqrt[3]{3(2) + 4} = \\sqrt[3]{10} = 2.15443$."
      - "$x_3 = \\sqrt[3]{3(2.15443) + 4} = 2.18721$. (On a calculator, the value used is the unrounded Ans.)"
      - "$x_4 = 2.19404$, then $x_5 = 2.19545$, $x_6 = 2.19575$, $x_7 = 2.19581$."
      - "Round each to 3 d.p.: $x_5 \\to 2.195$, $x_6 \\to 2.196$, $x_7 \\to 2.196$. $x_6$ and $x_7$ agree, so stop."
      - "Check it really is a root: $2.196^3 - 3(2.196) - 4 = 10.590 - 6.588 - 4 \\approx 0.002$, very close to $0$ ✓"
    answer: |
      The root is $2.196$ to 3 decimal places.

  - type: check
    title: Check running an iteration
    questions: [iter-compute, iter-stop-rule]

  - type: example
    title: A root that is negative
    problem: |
      The equation $x^3 + 2x + 1 = 0$ has a root near $-0.5$. Show that the equation can be rearranged as
      $x = -\dfrac{x^3 + 1}{2}$, and use the iteration $x_{n+1} = -\dfrac{x_n^3 + 1}{2}$ with $x_1 = -0.5$ to find
      the root correct to 3 decimal places.
    steps:
      - "Rearrange: $x^3 + 2x + 1 = 0$ gives $2x = -(x^3 + 1)$, so $x = -\\dfrac{x^3 + 1}{2}$ ✓"
      - "$x_2 = -\\dfrac{(-0.5)^3 + 1}{2} = -\\dfrac{-0.125 + 1}{2} = -0.4375$. Brackets around the negative number matter: $(-0.5)^3 = -0.125$."
      - "$x_3 = -0.45813$, $x_4 = -0.45192$, $x_5 = -0.45385$, $x_6 = -0.45326$, $x_7 = -0.45344$."
      - "Notice the values go up and down alternately, but each swing is smaller: they are closing in from both sides."
      - "To 3 d.p.: $x_5 \\to -0.454$, $x_6 \\to -0.453$, $x_7 \\to -0.453$. $x_6$ and $x_7$ agree, so stop."
    answer: |
      The root is $-0.453$ to 3 decimal places.

  - type: intuition
    title: What if the values don't settle?
    body: |
      Not every rearrangement works. Sometimes the values wander off or jump about more and more wildly. That
      is called **failing to converge** (to **converge** means to settle down to a single value). If that
      happens with a formula an exam gives you, first check your typing, especially brackets around negative
      numbers. The next lesson shows how one equation can have several rearrangements, some that settle and
      some that don't.

  - type: misconceptions
    items:
      - wrong: "I'll round each value to 3 d.p. before putting it back in."
        right: "Keep full accuracy (use Ans). Rounding as you go adds errors that can change the final digit."
      - wrong: "I stop as soon as one value looks right."
        right: "Stop when **two successive** values round to the same answer at the required accuracy."
      - wrong: "$x_2$ is already a good estimate of the root."
        right: "$x_2$ is just the first improvement. It can still be well away from the root; keep going until the values settle."
      - wrong: "The value the iteration settles on might not be a root of the equation."
        right: "If it settles at $\\alpha$, then $\\alpha = F(\\alpha)$, and $x = F(x)$ is just the equation rearranged. So $\\alpha$ is a root."

  - type: exam
    body: |
      - Show every iterate, written to the number of decimal places the question asks for (often 4 or 5).
      - State the final answer clearly to the required accuracy, for example "$\alpha = 2.196$ (3 d.p.)".
      - Questions often ask you to "show that" an equation rearranges to the iteration formula first. Show each algebra step.

  - type: takeaways
    items:
      - "An iteration $x_{n+1} = F(x_n)$ feeds each output back in as the next input."
      - "$F$ comes from rearranging the equation into $x = F(x)$, so the value the iteration settles at is a root."
      - "Keep full accuracy in working (use Ans); stop when two successive values agree to the required accuracy."
      - "Some rearrangements don't settle (they fail to converge)."

questions:
  - id: iter-compute
    format: numeric
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |
      Use the iteration $x_{n+1} = \sqrt{2x_n + 5}$ with $x_1 = 2$ to find $x_2$ and $x_3$.
    fields:
      - label: "x₂ ="
        answer: 3
        tolerance: { rel: 0.001 }
      - label: "x₃ ="
        answer: 3.31662479
        tolerance: { rel: 0.001 }
    explanation: |
      $x_2 = \sqrt{2(2) + 5} = \sqrt9 = 3$. Then $x_3 = \sqrt{2(3) + 5} = \sqrt{11} \approx 3.3166$.

  - id: iter-stop-rule
    format: mcq
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: |
      You are finding a root correct to 2 decimal places. You have $x_4 = 1.41421$ and $x_5 = 1.41421$. What should you do?
    options:
      - text: "Stop, and state the root as $1.41$"
        correct: true
        why: "Two successive values agree to 5 decimal places, which is more than the 2 needed. The root is $1.41$ to 2 d.p."
      - text: "Work out $x_6$ to be safe"
        why: "There's no need: two successive values already agree to the required accuracy."
      - text: "State the root as $1.41421$"
        why: "The question asks for 2 decimal places, so round to $1.41$."
      - text: "Go back and check $x_3$"
        why: "The stopping test only compares successive values, and $x_4$ and $x_5$ already agree."
    explanation: |
      When two successive iterates agree to the required accuracy, stop: $1.41421$ is $1.41$ to 2 decimal places.
