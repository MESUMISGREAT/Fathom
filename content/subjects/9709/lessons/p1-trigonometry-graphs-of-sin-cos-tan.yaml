id: p1-trigonometry-graphs-of-sin-cos-tan
subject: "9709"
topic: "1.5"
title: The graphs of sin, cos and tan
summary: Sketch y = sin x, y = cos x and y = tan x for any interval in degrees or radians, and use their period, range, symmetry and asymptotes.
order: 2
minutes: 6
kind: core
objectives: ["1.5.1"]
prerequisites: [p1-trigonometry-angles-of-any-size]
