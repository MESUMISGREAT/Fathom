blocks:
  - type: objective
    body: |
      By the end you can define and calculate gravitational potential energy (GPE = mgh) and kinetic energy (KE = ½mv²), and understand energy as the capacity to do work.

  - type: explain
    title: Energy and work
    body: |
      **Energy** is the capacity to do work. When work is done **on** an object, its energy increases. When an object does work, its energy decreases.
      Energy and work share the same unit: the **joule (J)**.

      Two fundamental forms of **mechanical energy** in this topic:
      1. **Gravitational potential energy (GPE)** — energy due to position in a gravitational field
      2. **Kinetic energy (KE)** — energy due to motion

  - type: definition
    term: Gravitational potential energy (GPE)
    body: |
      For a mass $m$ raised a vertical height $h$ above a reference level:
      $$\\text{GPE} = mgh$$
      where $g = 10\\text{ m s}^{-2}$ (as specified in the 9709 syllabus).
      - GPE is relative to the chosen reference level (zero point).
      - Only **changes** in GPE are physically meaningful.
      - Gaining height → GPE increases. Losing height → GPE decreases.

  - type: definition
    term: Kinetic energy (KE)
    body: |
      For a particle of mass $m$ moving with speed $v$:
      $$\\text{KE} = \\frac{1}{2}mv^2$$
      - KE is always $\\ge 0$ (speed squared).
      - KE is a scalar — it depends on speed, not velocity direction.
      - If speed doubles, KE quadruples.

  - type: intuition
    title: Where do these formulas come from?
    body: |
      **GPE = mgh**: Lifting a mass $m$ through height $h$ at constant velocity requires an upward force $F = mg$. Work done by the lifting force: $W = Fh = mgh$. This work is stored as GPE.

      **KE = ½mv²**: Accelerate a mass $m$ from rest to speed $v$ using a constant force $F$. From $v^2 = 2as$ and $F = ma$:
      $$W = Fs = ma \\cdot \\frac{v^2}{2a} = \\frac{1}{2}mv^2$$
      The work done equals the kinetic energy gained. This is the **work-energy theorem** in action.

  - type: example
    title: Calculating GPE and KE
    problem: |
      A ball of mass $0.2\\text{ kg}$ is thrown vertically upwards from ground level with an initial speed of $15\\text{ m s}^{-1}$. Taking $g = 10\\text{ m s}^{-2}$, find:
      (a) its initial kinetic energy
      (b) its maximum height
      (c) its GPE at maximum height
    steps:
      - "(a) Initial KE = $½mv^2 = 0.5 \\times 0.2 \\times 15^2 = 0.1 \\times 225 = 22.5\\text{ J}$"
      - "(b) At max height, speed = 0 so KE = 0. Energy conserved: initial KE = max GPE → $22.5 = mgh = 0.2 \\times 10 \\times h$, so $h = 11.25\\text{ m}$"
      - "(c) GPE at max height = $mgh = 0.2 \\times 10 \\times 11.25 = 22.5\\text{ J}$"
    answer: |
      (a) $22.5\\text{ J}$ (b) $11.25\\text{ m}$ (c) $22.5\\text{ J}$

  - type: example
    title: Speed from height loss
    problem: |
      A skier of mass $70\\text{ kg}$ starts from rest at the top of a slope $50\\text{ m}$ high. Ignoring friction and air resistance, find the speed at the bottom.
    steps:
      - "Loss of GPE = gain in KE: $mg\\Delta h = ½mv^2$"
      - "$v^2 = 2g\\Delta h = 2 \\times 10 \\times 50 = 1000$"
      - "$v = \\sqrt{1000} = 10\\sqrt{10} \\approx 31.6\\text{ m s}^{-1}$"
    answer: |
      $v \\approx 31.6\\text{ m s}^{-1}$

  - type: check
    title: Check yourself
    questions: [gpe-change, ke-speed, gpe-ke-conversion]

  - type: misconceptions
    items:
      - wrong: "GPE = mgh gives absolute energy."
        right: |
          GPE depends on the chosen zero level. Only **changes** in GPE are physically meaningful. You can set the zero wherever is convenient.
      - wrong: "Kinetic energy is a vector."
        right: |
          KE = ½mv² uses speed (magnitude of velocity). It is a scalar — always positive or zero. Direction doesn't matter.
      - wrong: "A stationary object has no energy."
        right: |
          It has no *kinetic* energy, but it may have GPE (or other forms like elastic potential energy).
      - wrong: "Heavy objects fall faster because they have more GPE."
        right: |
          In the absence of air resistance, all objects fall with the same acceleration $g$, regardless of mass. $mg\\Delta h = ½mv^2$ → $v = \\sqrt{2g\\Delta h}$, independent of mass.

  - type: exam
    body: |
      - Always state the reference level for GPE (e.g., "taking ground level as zero").
      - Use $g = 10\\text{ m s}^{-2}$ unless the question says otherwise.
      - KE = ½mv², not mv². The half is essential.
      - In energy conservation problems, equate loss of GPE to gain in KE (or vice versa), accounting for work done by/against non-conservative forces (friction, air resistance).

  - type: takeaways
    items:
      - "Energy = capacity to do work (unit: joule)"
      - "GPE = mgh (h is vertical height above reference level)"
      - "KE = ½mv² (always ≥ 0, scalar)"
      - "Work done by gravity = -ΔGPE = mg(Δh)"
      - "Use $g = 10\\text{ m s}^{-2}$ for 9709"

questions:
  - id: gpe-change
    format: numeric
    difficulty: 1
    objectives: ["4.5.2"]
    prompt: |
      A box of mass $4\\text{ kg}$ is lifted from a shelf at height $1.5\\text{ m}$ to a shelf at height $3.2\\text{ m}$. Find the increase in its gravitational potential energy. Use $g = 10\\text{ m s}^{-2}$.
    fields:
      - answer: 68
        unit: J
        tolerance: { abs: 0.1 }
    explanation: |
      Δh = 3.2 - 1.5 = 1.7 m. ΔGPE = mgΔh = 4 × 10 × 1.7 = 68 J.

  - id: ke-speed
    format: numeric
    difficulty: 1
    objectives: ["4.5.2"]
    prompt: |
      A car of mass $1000\\text{ kg}$ has kinetic energy $200\\text{ kJ}$. Find its speed.
    fields:
      - answer: 20
        unit: "m s⁻¹"
        tolerance: { abs: 0.1 }
    explanation: |
      KE = ½mv² → v² = 2×KE/m = 2×200000/1000 = 400 → v = 20 m s⁻¹.

  - id: gpe-ke-conversion
    format: numeric
    difficulty: 2
    objectives: ["4.5.2"]
    prompt: |
      A stone of mass $0.5\\text{ kg}$ is dropped from a height of $20\\text{ m}$. Find its speed just before it hits the ground. Use $g = 10\\text{ m s}^{-2}$.
    fields:
      - answer: 20
        unit: "m s⁻¹"
        tolerance: { abs: 0.1 }
    explanation: |
      Loss of GPE = gain in KE: mgΔh = ½mv² → v² = 2gΔh = 2×10×20 = 400 → v = 20 m s⁻¹.