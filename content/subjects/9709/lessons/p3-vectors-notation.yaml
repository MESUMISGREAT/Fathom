id: p3-vectors-notation
subject: "9709"
topic: "3.7"
title: Vector notation — the language of vectors
summary: "The four ways Cambridge writes a vector (column, i/j/k, bold letter, arrow over AB), position vectors, and the vector from one point to another."
order: 1
minutes: 8
kind: core
objectives: ["3.7.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.7 outcome "Use standard notations for vectors: column
    vectors with components x, y or x, y, z; xi + yj; xi + yj + zk; AB with an arrow over
    it; and a bold letter such as a." All examples, questions and diagrams are original.
    Revised on 2026-10-31 for beginners (terms defined, steps explained, maths typeset). Independently re-checked in separate AI reviews on 2026-10-31 (every worked step and answer key recomputed); their findings were applied. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can read and write a vector in each of the four ways Cambridge uses, switch between them, and find the vector from one point to another.

  - type: explain
    title: What a vector is
    body: |-
      A **vector** is a quantity with a **size** and a **direction**, like "5 km north-east" or "a force of 20 N straight down". A plain number with no direction, like a mass of 3 kg, is called a **scalar**.

      In this topic a vector is usually a **move** (a displacement) from one place to another. Picture it as an arrow: its length is the size of the move, and it points the way you go. An arrow can be drawn anywhere; only its length and direction matter.

      To describe a move in 3D, say how far it goes in each of the three axis directions: $x$ (across), $y$ (back or forward) and $z$ (up). Those three numbers are the vector's **components**.

  - type: explain
    title: Four ways to write the same vector
    body: |-
      Take the move "3 along $x$, 2 along $y$, 4 up $z$". Cambridge writes it in any of these ways:

      1. **Column vector:** the components stacked in a bracket, $\begin{pmatrix} 3 \\ 2 \\ 4 \end{pmatrix}$. Top is $x$, middle is $y$, bottom is $z$. (In 2D there are just two rows, $x$ then $y$.)
      2. **$\mathbf{i}, \mathbf{j}, \mathbf{k}$ form:** $3\mathbf{i} + 2\mathbf{j} + 4\mathbf{k}$. Here $\mathbf{i}$, $\mathbf{j}$ and $\mathbf{k}$ are arrows of length 1 pointing along the $x$-, $y$- and $z$-axes. So $3\mathbf{i}$ means "3 steps along $x$", and so on. (Arrows of length 1 are called **unit vectors**.)
      3. **Bold letter:** give the vector a name, like $\mathbf{a}$. In handwriting you can't do bold, so underline it: $\underline{a}$.
      4. **Arrow over two letters:** $\overrightarrow{OA}$ means "the move from point $O$ to point $A$".

      They're four names for one thing, so you can swap between them freely: just read off the three numbers.

  - type: diagram
    diagram: p3-vectors-notation
    alt: >-
      3D axes with x to the right, y going back into the page and z up. A blue arrow goes from the
      origin O to the point A(3, 2, 4). A dashed path shows the same move in steps: 3 along x, 2 along
      y, then 4 up z. On the right, the same vector is written four ways: as a column vector with
      entries 3, 2, 4; as 3i + 2j + 4k; as a bold a; and as OA with an arrow over it.
    caption: |-
      One vector, four names. Drawn from the origin $O$, the move $\begin{pmatrix} 3 \\ 2 \\ 4 \end{pmatrix}$ ends at the point $(3, 2, 4)$.

  - type: example
    title: "Example 1: switching notation"
    problem: |-
      (a) Write $\begin{pmatrix} -2 \\ 5 \end{pmatrix}$ in $\mathbf{i}, \mathbf{j}$ form. (b) Write $4\mathbf{i} - \mathbf{k}$ as a column vector.
    steps:
      - |-
        (a) Top entry is the $x$-part, bottom is the $y$-part: $-2\mathbf{i} + 5\mathbf{j}$. That's "2 left, 5 up" (in 2D, $y$ is up the page).
      - |-
        (b) Read off the number in front of each of $\mathbf{i}$, $\mathbf{j}$, $\mathbf{k}$. There's no $\mathbf{j}$ term, so its component is 0. And $-\mathbf{k}$ means $-1\mathbf{k}$.
      - |-
        So $4\mathbf{i} - \mathbf{k} = 4\mathbf{i} + 0\mathbf{j} - 1\mathbf{k} = \begin{pmatrix} 4 \\ 0 \\ -1 \end{pmatrix}$.
    answer: |-
      (a) $-2\mathbf{i} + 5\mathbf{j}$; (b) $\begin{pmatrix} 4 \\ 0 \\ -1 \end{pmatrix}$. Watch for missing terms: they mean a 0 in the column.

  - type: check
    questions: [vec-col-to-ij, vec-ij-to-col]

  - type: explain
    title: Position vectors
    body: |-
      Any arrow can be drawn anywhere. But when you draw it starting at the origin $O$, it ends at a point, and the arrow tells you exactly where that point is.

      The vector $\overrightarrow{OA}$, from the origin to the point $A$, is called the **position vector** of $A$, and is usually written with the matching bold letter, $\mathbf{a}$. Its components are just $A$'s coordinates, because starting from $(0, 0, 0)$, "end minus start" is just the end: if $A$ is $(3, -1, 2)$ then $\mathbf{a} = \begin{pmatrix} 3 \\ -1 \\ 2 \end{pmatrix}$.

      So "the point $A$ has position vector $\mathbf{a}$" and "$A$ has coordinates …" carry the same information. That's the bridge between vectors and coordinate geometry.

  - type: explain
    title: The vector from one point to another
    body: |-
      $\overrightarrow{AB}$ is the move from point $A$ to point $B$. To get it, ask "how far across, back and up do I go from $A$ to $B$?" That's **end minus start**, one coordinate at a time.

      In letters: write $A = (x_A, y_A, z_A)$ and $B = (x_B, y_B, z_B)$ (the small letters underneath just say which point each coordinate belongs to). Then

      $$\overrightarrow{AB} = \begin{pmatrix} x_B - x_A \\ y_B - y_A \\ z_B - z_A \end{pmatrix} = \mathbf{b} - \mathbf{a}.$$

      **Why $\mathbf{b} - \mathbf{a}$?** Going from $A$ to $B$ is the same as going from $A$ back to $O$ and then out from $O$ to $B$. Going back from $A$ to $O$ is the move $\mathbf{a}$ reversed, written $-\mathbf{a}$ (every component changes sign). Doing two moves one after the other adds their components. So $\overrightarrow{AB} = -\mathbf{a} + \mathbf{b} = \mathbf{b} - \mathbf{a}$.

      **Order matters.** $\overrightarrow{BA}$ is the same move backwards, so $\overrightarrow{BA} = -\overrightarrow{AB}$: every component changes sign.

  - type: example
    title: "Example 2: the vector between two points"
    problem: |-
      $A = (3, -1, 2)$ and $B = (-1, 4, 5)$. Find $\overrightarrow{AB}$ as a column vector and in $\mathbf{i}, \mathbf{j}, \mathbf{k}$ form.
    steps:
      - |-
        End minus start, one coordinate at a time: $x$: $-1 - 3 = -4$; $\;y$: $4 - (-1) = 5$; $\;z$: $5 - 2 = 3$.
      - |-
        So $\overrightarrow{AB} = \begin{pmatrix} -4 \\ 5 \\ 3 \end{pmatrix}$: 4 back along $x$, 5 along $y$, 3 up.
      - |-
        Check: start at $A(3, -1, 2)$ and add the move: $(3 - 4,\ -1 + 5,\ 2 + 3) = (-1, 4, 5) = B$ ✓
    answer: |-
      $\overrightarrow{AB} = \begin{pmatrix} -4 \\ 5 \\ 3 \end{pmatrix} = -4\mathbf{i} + 5\mathbf{j} + 3\mathbf{k}$.

  - type: check
    questions: [vec-ab-from-coords, vec-ba-sign]

  - type: misconceptions
    items:
      - wrong: |-
          $\begin{pmatrix} 3 \\ 4 \end{pmatrix}$ and $3\mathbf{i} + 4\mathbf{j}$ are different vectors.
        right: |-
          Same vector, two notations: 3 across and 4 up either way.
      - wrong: |-
          $\overrightarrow{AB} = \mathbf{a} - \mathbf{b}$.
        right: |-
          It's end minus start: $\overrightarrow{AB} = \mathbf{b} - \mathbf{a}$. The first letter is where you start.
      - wrong: |-
          $\mathbf{i}$, $\mathbf{j}$, $\mathbf{k}$ are just letters, so $2i + 3j$ is fine.
        right: |-
          They're vectors, so they must be bold (or underlined by hand). Plain $i$ looks like a number; in complex numbers it even means $\sqrt{-1}$.
      - wrong: |-
          $4\mathbf{i} - \mathbf{k}$ is $\begin{pmatrix} 4 \\ -1 \end{pmatrix}$.
        right: |-
          There are three components and the missing $\mathbf{j}$ part is 0: $\begin{pmatrix} 4 \\ 0 \\ -1 \end{pmatrix}$.

  - type: exam
    body: |-
      - Use whichever notation the question uses, unless it asks for a particular form.
      - *Find $\overrightarrow{AB}$*: write $\mathbf{b} - \mathbf{a}$ and subtract, component by component.
      - In handwriting, underline vector letters ($\underline{a}$) and draw an arrow over $\overrightarrow{AB}$.

  - type: takeaways
    items:
      - |-
        Four notations, one vector: $\begin{pmatrix} 3 \\ 2 \\ 4 \end{pmatrix} = 3\mathbf{i} + 2\mathbf{j} + 4\mathbf{k}$, a bold letter $\mathbf{a}$, or $\overrightarrow{OA}$.
      - |-
        $\mathbf{i}, \mathbf{j}, \mathbf{k}$ are arrows of length 1 along the axes.
      - |-
        The position vector of $A$ is $\overrightarrow{OA} = \mathbf{a}$; its components are $A$'s coordinates.
      - |-
        $\overrightarrow{AB} = \mathbf{b} - \mathbf{a}$ (end minus start), and $\overrightarrow{BA} = -\overrightarrow{AB}$.

questions:
  - id: vec-col-to-ij
    format: numeric
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: |-
      Write $\begin{pmatrix} -3 \\ 7 \end{pmatrix}$ in the form $p\mathbf{i} + q\mathbf{j}$.
    fields:
      - label: "p ="
        answer: -3
      - label: "q ="
        answer: 7
    explanation: |-
      The top entry is the $\mathbf{i}$ part and the bottom entry is the $\mathbf{j}$ part: $-3\mathbf{i} + 7\mathbf{j}$.

  - id: vec-ij-to-col
    format: numeric
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: |-
      Write $5\mathbf{i} - 2\mathbf{j} + 4\mathbf{k}$ as a column vector $\begin{pmatrix} p \\ q \\ r \end{pmatrix}$.
    fields:
      - label: "p ="
        answer: 5
      - label: "q ="
        answer: -2
      - label: "r ="
        answer: 4
    explanation: |-
      The numbers in front of $\mathbf{i}$, $\mathbf{j}$ and $\mathbf{k}$ go into the column in that order: $\begin{pmatrix} 5 \\ -2 \\ 4 \end{pmatrix}$.

  - id: vec-ab-from-coords
    format: numeric
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: |-
      $A = (2, -1, 4)$ and $B = (-3, 5, 1)$. Find $\overrightarrow{AB} = \begin{pmatrix} p \\ q \\ r \end{pmatrix}$.
    fields:
      - label: "p ="
        answer: -5
      - label: "q ="
        answer: 6
      - label: "r ="
        answer: -3
    explanation: |-
      End minus start: $\overrightarrow{AB} = \begin{pmatrix} -3 - 2 \\ 5 - (-1) \\ 1 - 4 \end{pmatrix} = \begin{pmatrix} -5 \\ 6 \\ -3 \end{pmatrix}$.

  - id: vec-ba-sign
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: |-
      If $\overrightarrow{AB} = \begin{pmatrix} 2 \\ -3 \end{pmatrix}$, what is $\overrightarrow{BA}$?
    options:
      - text: $\begin{pmatrix} -2 \\ 3 \end{pmatrix}$
        correct: true
        why: |-
          $\overrightarrow{BA} = -\overrightarrow{AB}$. Reverse the signs.
      - text: $\begin{pmatrix} 2 \\ -3 \end{pmatrix}$
        why: |-
          That's $\overrightarrow{AB}$ itself, but $\overrightarrow{BA}$ points the opposite way, so every sign must flip.
      - text: $\begin{pmatrix} 3 \\ -2 \end{pmatrix}$
        why: |-
          That swaps the components, which is not the negative.
      - text: $\begin{pmatrix} -3 \\ 2 \end{pmatrix}$
        why: |-
          That is the negative with components swapped.
    explanation: |
      Reversing the arrow reverses the displacement, so every component changes sign: $\overrightarrow{BA} = -\overrightarrow{AB} = \begin{pmatrix} -2 \\ 3 \end{pmatrix}$.