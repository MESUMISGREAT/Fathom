id: p2-logarithmic-exponential-solving-indices
subject: "9709"
topic: "2.2"
title: Solving equations and inequalities with indices
summary: Use logarithms to solve equations and inequalities where the unknown appears in the exponent.
order: 3
minutes: 5
kind: core
objectives: ["2.2.3"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): learning outcome 2.2.3, "Use logarithms to solve
    equations and inequalities in which the unknown appears in indices." Examples and questions are
