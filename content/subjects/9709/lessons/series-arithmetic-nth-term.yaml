blocks:
  - type: objective
    body: |-
      By the end you can recognise an **arithmetic progression**, find any term with $u_n = a + (n - 1)d$, and use $2b = a + c$ to test whether three numbers are in arithmetic progression.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $n$ | the position of a term: 1st, 2nd, 3rd, … |
      | $u_n$ | the $n$th term, e.g. $u_4$ is the fourth term |
      | $u_{n+1}$ | the term straight after $u_n$ |
      | $a$ | the first term, $u_1$ |
      | $d$ | the **common difference**: the amount added each time |

  - type: explain
    title: Same step, every step
    body: |-
      - A staircase where every step is the same height.
      - A taxi meter that adds the same fare every kilometre.
      - A savings jar that gets \$5 every week.

      That's an **arithmetic progression** (AP): you get each term by **adding the same number** to the one before.

      Cambridge calls the first term $a$ and the fixed step $d$. Example: $3, 7, 11, 15, \dots$ has $a = 3$ and $d = 4$.

  - type: definition
    term: Arithmetic progression
    body: |-
      An **arithmetic progression** is a sequence in which each term after the first is obtained by adding a constant, the **common difference** $d$, to the previous term:

      $$u_{n+1} - u_n = d \quad \text{for every } n.$$

      $d$ can be positive, negative or a fraction. For example $20, 17, 14, 11, \dots$ is an AP with $a = 20$ and $d = -3$.

  - type: diagram
    diagram: series-ap-staircase
    alt: >-
      Bar chart of the arithmetic progression with a = 3 and d = 4. Bars for n = 1 to 6 have heights
      3, 7, 11, 15, 19 and 23; the first and last bars are highlighted. Between each pair of bars a
      dashed tread and a vertical riser show a step of +4, and a dashed straight line passes through
      the tops of all the bars. A panel reads: a = 3, d = 4, uₙ = a + (n − 1)d, u₆ = 3 + 5 × 4 = 23,
      6th term: 5 steps of d.
    caption: |-
      Equal steps means the tops of the bars lie on a straight line. To get from $u_1$ to $u_6$ you climb **5** steps, not 6.

  - type: explain
    title: The nth term
    body: |-
      The $n$th term is the first term plus $(n - 1)$ steps:

      $$u_n = a + (n - 1)d$$

      **See it with numbers.** In $3, 7, 11, 15, \dots$ (so $a = 3$, $d = 4$):

      - $u_1 = 3$ (no steps yet)
      - $u_2 = 3 + 4$ (one step)
      - $u_3 = 3 + 4 + 4 = 3 + 2 \times 4$ (two steps)
      - $u_4 = 3 + 3 \times 4 = 15$ (three steps)

      The number of steps is always one less than the position. So $u_n = a + (n - 1)d$.

      Same reason a 10 m fence with posts every metre needs 11 posts: the first post is already there before you take any steps.

      To **recognise** an AP, check that the difference between consecutive terms is the same *all the way along*, not just for the first pair.

  - type: check
    questions: [recognise-ap, twentieth-term]

  - type: example
    title: Two terms given
    problem: |-
      The 4th term of an arithmetic progression is 17 and the 10th term is 41. Find the first term and the common difference.
    steps:
      - |-
        Turn each fact into an equation using $u_n = a + (n - 1)d$:

        - 4th term: $u_4 = a + 3d$, so $a + 3d = 17$
        - 10th term: $u_{10} = a + 9d$, so $a + 9d = 41$
      - |-
        Subtract the first equation from the second. The $a$'s cancel:

        $$(a + 9d) - (a + 3d) = 41 - 17$$

        $$6d = 24, \quad\text{so}\quad d = 4$$
      - |-
        Put $d = 4$ back into $a + 3d = 17$:

        $$a + 12 = 17, \quad\text{so}\quad a = 5$$
    answer: |-
      $a = 5$ and $d = 4$. Check: $u_4 = 5 + 12 = 17$ ✓ and $u_{10} = 5 + 36 = 41$ ✓

  - type: example
    title: How many terms?
    problem: |-
      How many terms are there in the arithmetic progression $7, 11, 15, \dots, 203$?
    steps:
      - |-
        Read off: $a = 7$, $d = 11 - 7 = 4$. The last term is 203, so we want the $n$ with $u_n = 203$.
      - |-
        Write the equation:

        $$7 + (n - 1) \times 4 = 203$$

        Subtract 7: $\;(n - 1) \times 4 = 196$
      - |-
        Divide by 4: $\;n - 1 = 49$

        Add 1: $\;n = 50$
    answer: |-
      There are 50 terms. (Not 49: that's the number of steps.)

  - type: check
    questions: [two-terms, how-many]

  - type: explain
    title: Three numbers in AP
    body: |-
      $a$, $b$, $c$ are **in arithmetic progression** when the two gaps are equal:

      $$b - a = c - b$$

      Add $b$ and $a$ to both sides:

      $$2b = a + c$$

      Example: $4, 7, 10$. Check: $2 \times 7 = 14$ and $4 + 10 = 14$ ✓

      In words: the middle number is the **mean** of the other two. This is the fastest way to set up an equation when the terms contain an unknown.

  - type: example
    title: Using 2b = a + c
    problem: |-
      Find $x$ given that $x$, $2x + 3$ and $5x - 4$ are consecutive terms of an arithmetic progression.
    steps:
      - |-
        Middle term doubled equals the sum of the outer two:

        $$2(2x + 3) = x + (5x - 4)$$
      - |-
        Expand the left and collect the right:

        $$4x + 6 = 6x - 4$$
      - |-
        Subtract $4x$ and add 4 to both sides: $\;10 = 2x$

        So $x = 5$.
      - |-
        The terms are $5, 13, 21$.
    answer: |-
      $x = 5$, giving $5, 13, 21$ with common difference 8 ✓

  - type: check
    questions: [ap-condition, middle-term]

  - type: misconceptions
    items:
      - wrong: |-
          $u_n = a + nd$
        right: |-
          $u_n = a + (n - 1)d$. Test it on $n = 1$: you should get $a$ back, and $a + 1 \cdot d$ isn't $a$.
      - wrong: |-
          $2, 4, 8, \dots$ is an AP because $4 - 2 = 2$.
        right: |-
          Check every gap: $4 - 2 = 2$ but $8 - 4 = 4$. The differences aren't constant, so it's not an AP (it's geometric).
      - wrong: |-
          For a decreasing AP like $30, 26, 22, \dots$, $d = 4$.
        right: |-
          $d$ is "next minus previous": $26 - 30 = -4$. A decreasing AP has negative $d$.

  - type: exam
    body: |-
      - AP questions are usually 3–5 marks and almost always become **simultaneous equations** in $a$ and $d$. Write the two equations out in full before solving.
      - "Find $n$" answers must be **positive whole numbers**. If you get $n = 49.5$, the number isn't a term of the AP.
      - "Arithmetic sequence" means the same as arithmetic progression. An "arithmetic series" is the sum of its terms (next lesson).

  - type: takeaways
    items:
      - |-
        AP: add the same common difference $d$ each time; $d = u_{n+1} - u_n$.
      - |-
        $u_n = a + (n - 1)d$: first term plus $(n - 1)$ steps.
      - |-
        $a, b, c$ are in AP exactly when $2b = a + c$.
      - |-
        Two facts about terms → two equations in $a$ and $d$ → solve simultaneously.

questions:
  - id: recognise-ap
    format: mcq
    difficulty: 1
    objectives: ["1.6.2"]
    prompt: |-
      Which of these sequences is an arithmetic progression?
    explanation: |-
      Only $5, 2, -1, -4, \dots$ has a constant difference: each term is 3 less than the one before, so $d = -3$.
    options:
      - text: $5, 2, -1, -4, \dots$
        correct: true
        why: |-
          The differences are $-3, -3, -3$: constant, so it's an AP with $d = -3$.
      - text: $2, 4, 8, 16, \dots$
        why: |-
          The differences are $2, 4, 8$, not constant. Each term is *multiplied* by 2, so this is a geometric progression.
      - text: $1, 4, 9, 16, \dots$
        why: |-
          These are square numbers. The differences are $3, 5, 7$, which grow.
      - text: $3, 5, 8, 12, \dots$
        why: |-
          The first gap is 2, but the next gaps are 3 and 4. Checking only the first pair is a trap.

  - id: twentieth-term
    format: numeric
    difficulty: 1
    objectives: ["1.6.3"]
    prompt: |-
      Find the 20th term of the arithmetic progression $4, 9, 14, \dots$
    fields:
      - label: "u₂₀ ="
        answer: 99
    explanation: |-
      $a = 4$, $d = 5$: $\;u_{20} = 4 + 19 \times 5 = 99$.

  - id: two-terms
    format: numeric
    difficulty: 2
    objectives: ["1.6.3"]
    prompt: |-
      The 3rd term of an arithmetic progression is 11 and the 8th term is 31. Find the first term and the common difference.
    fields:
      - label: "a ="
        answer: 3
      - label: "d ="
        answer: 4
    explanation: |-
      $a + 2d = 11$ and $a + 7d = 31$. Subtracting: $5d = 20$, so $d = 4$, and then $a = 11 - 8 = 3$.

  - id: how-many
    format: numeric
    difficulty: 2
    objectives: ["1.6.3"]
    prompt: |-
      How many terms are there in the arithmetic progression $100, 97, 94, \dots, 1$?
    fields:
      - label: "n ="
        answer: 34
    explanation: |-
      $a = 100$, $d = -3$, last term 1: $\;100 - 3(n - 1) = 1$, so $3(n - 1) = 99$, $n - 1 = 33$ and $n = 34$.

  - id: ap-condition
    format: cloze
    difficulty: 1
    objectives: ["1.6.3"]
    prompt: |-
      Three numbers $a$, $b$, $c$ are in arithmetic progression if and only if $2b =$ {{1}}.
    blanks:
      - accept: ["a + c", "a+c", "c + a", "c+a"]
    explanation: |-
      Equal gaps: $b - a = c - b$, which rearranges to $2b = a + c$. The middle term is the mean of its neighbours.

  - id: middle-term
    format: numeric
    difficulty: 2
    objectives: ["1.6.3"]
    prompt: |-
      The numbers $k$, $3k - 1$ and $4k + 4$ are consecutive terms of an arithmetic progression. Find $k$.
    fields:
      - label: "k ="
        answer: 6
    explanation: |-
      $2(3k - 1) = k + (4k + 4)$, so $6k - 2 = 5k + 4$ and $k = 6$. The terms are $6, 17, 28$, with common difference 11 ✓
