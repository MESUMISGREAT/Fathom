id: series-arithmetic-nth-term
subject: "9709"
topic: "1.6"
title: "Arithmetic progressions: the nth term"
summary: Recognise an arithmetic progression by its common difference, use uₙ = a + (n − 1)d, and test whether three numbers are in AP.
order: 3
minutes: 6
kind: core
objectives: ["1.6.2", "1.6.3"]
prerequisites: []
