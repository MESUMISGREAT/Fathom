id: functions-combined-transformations
subject: "9709"
topic: "1.2"
title: "Transformations: combining two"
summary: Do two transformations in the right order. Outside the bracket, follow the order of operations; inside, undo it in reverse.
order: 10
minutes: 5
kind: core
objectives: ["1.2.5"]
prerequisites: [functions-translations, functions-reflections, functions-stretches]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.2 learning outcome "understand and use the
    transformations of the graph of y = f(x) given by y = f(x) + a, y = f(x + a), y = af(x) and
    y = f(ax), and simple combinations of these", including the note on using the terms
    translation, reflection and stretch. All examples and questions are original; every
    transformed point and equation checked in Python. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can describe a **combination of two transformations** in the right order, track where points go, and write down the new equation.

  - type: explain
    title: Order is the whole game
    body: |-
      You already know the moves: translations, reflections and stretches. Exam questions love to chain **two** of them, and then the only real question is: **which one happens first?**

      Sometimes it matters a lot. Take $y = 2f(x) - 3$:

      - **Stretch, then translate:** double every height, then drop it by 3. Point $(p, q) \to (p, 2q - 3)$ ✓
      - **Translate, then stretch:** drop by 3, then double. Point $(p, q) \to (p, 2q - 6)$ ✗

      Same two moves, different graph. So let's make the order automatic.

  - type: explain
    title: "Outside the bracket: follow the order of operations"
    body: |-
      For $y = af(x) + b$, read it as a calculation done **to the output** $f(x)$: multiply by $a$, *then* add $b$. Do the transformations in that same order:

      1. **Stretch** parallel to the $y$-axis with factor $a$.
      2. **Then** translate by $\begin{pmatrix} 0 \\ b \end{pmatrix}$.

      A minus sign counts as "multiply by $-1$": $y = 5 - f(x) = -f(x) + 5$ is a reflection in the $x$-axis, then a translation by $\begin{pmatrix} 0 \\ 5 \end{pmatrix}$.

  - type: diagram
    diagram: functions-combined-sequence
    alt: >-
      Graph of y = f(x) = x² − 2x in dark ink, a U-shaped curve through the origin and (2, 0) with
      vertex (1, −1). A dashed grey curve shows y = 2f(x), the same U stretched vertically so its
      vertex is at (1, −2). A blue curve shows y = 2f(x) − 3, the dashed curve moved down 3, with
      vertex (1, −5). Orange arrows show the vertex moving from (1, −1) down to (1, −2), labelled
      step 1, then from (1, −2) down to (1, −5), labelled step 2. A second arrow shows the root
      (2, 0), which the stretch does not move, going down to (2, −3). Captions: step 1, stretch
      parallel to the y-axis, factor 2; step 2, then translation by 3 units in the negative
      y-direction.
    caption: |-
      $f(x) = x^2 - 2x$. ① Stretch: the vertex $(1, -1)$ goes to $(1, -2)$. ② Translate: $(1, -2)$ goes to $(1, -5)$. The root $(2, 0)$ isn't moved by the stretch (twice zero is zero) and then drops to $(2, -3)$.

  - type: check
    questions: [ct-order-y, ct-point-y]

  - type: explain
    title: "Inside the bracket: undo it, in reverse"
    body: |-
      Inside the bracket everything happens to $x$, and (as always) it does the **opposite** of what it looks like. For $y = f(2x + 2)$, the bracket says "double $x$, then add 2". To find where a point goes, you **undo** that, last step first:

      1. Undo "add 2": **translate** by $\begin{pmatrix} -2 \\ 0 \end{pmatrix}$.
      2. Then undo "double": **stretch** parallel to the $x$-axis with factor $\tfrac12$.

      Algebra agrees. A point $(p, q)$ on $y = f(x)$ lands where $2x + 2 = p$, so $x = \dfrac{p - 2}{2}$: subtract 2 first, *then* halve.

  - type: diagram
    diagram: functions-combined-inside
    alt: >-
      Graph of y = f(x) = x² − 2x in dark ink, with vertex (1, −1). A dashed grey curve shows
      y = f(x + 2) = x² + 2x, the same U moved 2 to the left, with vertex (−1, −1). A blue curve
      shows y = f(2x + 2) = 4x² + 4x, the dashed curve squeezed towards the y-axis by a factor of
      one half, with vertex (−½, −1); all three curves pass through the origin. Along the line
      y = 3, orange arrows show the point (3, 3) on f moving left to (1, 3) on the dashed curve,
      labelled step 1, then on to (½, 3) on the blue curve, labelled step 2. Captions: step 1,
      translation by 2 units in the negative x-direction; step 2, then stretch parallel to the
      x-axis, factor ½.
    caption: |-
      $(3, 3)$: ① subtract 2 from $x$ to get $(1, 3)$, ② halve $x$ to get $\left(\tfrac12, 3\right)$. Check: $f\left(2 \times \tfrac12 + 2\right) = f(3) = 3$ ✓

  - type: intuition
    title: Why inside runs backwards
    body: |-
      Think of the bracket as a set of instructions $f$ follows *before* it does anything. To land on the old point, the new graph has to feed $f$ the old input, so it must start from an $x$ that the instructions turn into $p$. Working out that $x$ means undoing the instructions, and undoing always goes in reverse: shoes off before socks.

      Outside the bracket nothing needs undoing. The heights come out of $f$ and you just apply the steps in order, like any calculation.

  - type: example
    title: From a description to an equation
    problem: |-
      The graph of $y = x^2$ is stretched parallel to the $y$-axis with scale factor 3, and then translated by $\begin{pmatrix} 2 \\ -5 \end{pmatrix}$. Find the equation of the new graph in the form $y = ax^2 + bx + c$.
    steps:
      - |-
        Stretch, factor 3: $y = 3x^2$.
      - |-
        Translate by $\begin{pmatrix} 2 \\ -5 \end{pmatrix}$: replace $x$ with $x - 2$ and subtract 5: $y = 3(x - 2)^2 - 5$.
      - |-
        Expand: $3(x^2 - 4x + 4) - 5 = 3x^2 - 12x + 7$.
      - |-
        Check with a point: $(0, 0)$ goes to $(0, 0)$ under the stretch, then to $(2, -5)$. And $3(4) - 24 + 7 = -5$ ✓
    answer: |-
      $y = 3x^2 - 12x + 7$. In the other order you'd get $3\left[(x - 2)^2 - 5\right] = 3(x - 2)^2 - 15$: a different graph.

  - type: explain
    title: When the order doesn't matter
    body: |-
      Two transformations in **different directions** don't interfere. One changes only $x$-coordinates and the other only $y$-coordinates, so either order gives the same graph.

      | Combination | Does order matter? |
      | --- | --- |
      | both outside, e.g. $2f(x) - 3$ | **yes**: stretch, then translate |
      | both inside, e.g. $f(2x + 2)$ | **yes**: translate, then stretch |
      | one inside, one outside, e.g. $3f(x - 2)$ | no |

  - type: check
    questions: [ct-inside, ct-point-x]

  - type: misconceptions
    items:
      - wrong: |-
          $y = 2f(x) + 6$ is a translation by $\begin{pmatrix} 0 \\ 6 \end{pmatrix}$ followed by a stretch parallel to the $y$-axis, factor 2.
        right: |-
          That sends $(p, q)$ to $(p, 2q + 12)$. Stretch **first**, then translate: $(p, q) \to (p, 2q + 6)$. (Translating by $\begin{pmatrix} 0 \\ 3 \end{pmatrix}$ first, then stretching, also works, because $2(q + 3) = 2q + 6$.)
      - wrong: |-
          $y = f(2x + 4)$ is a stretch parallel to the $x$-axis with factor $\tfrac12$, followed by a translation by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$.
        right: |-
          That would be $f\left(2(x + 4)\right) = f(2x + 8)$. Either translate by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$ first and then stretch, or factorise to $f\left(2(x + 2)\right)$: stretch first, then translate by $\begin{pmatrix} -2 \\ 0 \end{pmatrix}$.
      - wrong: |-
          The order of two transformations never matters.
        right: |-
          It matters when both act in the same direction (both on $y$, or both on $x$). It doesn't matter when one acts on $x$ and the other on $y$.

  - type: exam
    body: |-
      - Typical wording: *Describe fully a sequence of two transformations that maps the graph of $y = f(x)$ onto the graph of $y = 3f(x) - 2$.* Usually 3–4 marks.
      - Each transformation needs its full description (word, direction or vector, factor), **and** the order must be clear. Write "… **followed by** …".
      - Insider hack: write the point rule first, e.g. $(p, q) \to (p, 3q - 2)$. The order of operations in it *is* the order of transformations.
      - Insider hack 2: for an inside bracket like $f(3x - 6)$, solve $3x - 6 = p$ to get $x = \dfrac{p + 6}{3}$. "Add 6, then divide by 3" tells you: translate, then stretch.

  - type: check
    questions: [ct-equation, ct-spot]

  - type: takeaways
    items:
      - |-
        **Outside** ($y = af(x) + b$): follow the order of operations, so stretch (or reflect) first, then translate.
      - |-
        **Inside** ($y = f(ax + b)$): undo in reverse, so translate by $\begin{pmatrix} -b \\ 0 \end{pmatrix}$ first, then stretch with factor $\tfrac1a$.
      - |-
        One transformation on $x$ and one on $y$: the order doesn't matter.
      - |-
        Write the point rule, e.g. $(p, q) \to (p, 2q - 3)$, then check one point through your answer.

questions:
  - id: ct-order-y
    format: mcq
    difficulty: 1
    objectives: ["1.2.5"]
    prompt: |-
      Which sequence of transformations maps the graph of $y = f(x)$ onto the graph of $y = 3f(x) + 1$?
    explanation: |-
      Outside the bracket, follow the order of operations on $f(x)$: multiply by 3, then add 1. So stretch parallel to the $y$-axis with factor 3, then translate by $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$. Point rule: $(p, q) \to (p, 3q + 1)$.
    options:
      - text: |-
          Stretch parallel to the $y$-axis, factor 3, followed by a translation by $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$
        correct: true
        why: |-
          Multiply first, then add: $(p, q) \to (p, 3q + 1)$.
      - text: |-
          Translation by $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$ followed by a stretch parallel to the $y$-axis, factor 3
        why: |-
          That gives $(p, q) \to (p, 3(q + 1)) = (p, 3q + 3)$, which is the graph of $y = 3f(x) + 3$.
      - text: |-
          Stretch parallel to the $x$-axis, factor $\tfrac13$, followed by a translation by $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$
        why: |-
          The 3 is outside the bracket, so it stretches heights (parallel to the $y$-axis), not widths.
      - text: |-
          Translation by $\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $y$-axis, factor 3
        why: |-
          The $+1$ is outside the bracket, so it moves the graph up, not sideways.

  - id: ct-point-y
    format: numeric
    difficulty: 1
    objectives: ["1.2.5"]
    prompt: |-
      The point $(2, 5)$ lies on the graph of $y = f(x)$. Find the corresponding point on the graph of $y = 2f(x) - 3$.
    fields:
      - label: "x ="
        answer: 2
      - label: "y ="
        answer: 7
    explanation: |-
      Both changes are outside the bracket, so $x$ stays at 2. The height goes through "double, then subtract 3": $2 \times 5 - 3 = 7$. The point is $(2, 7)$.

  - id: ct-inside
    format: mcq
    difficulty: 2
    objectives: ["1.2.5"]
    prompt: |-
      Which sequence of transformations maps the graph of $y = f(x)$ onto the graph of $y = f(2x + 4)$?
    explanation: |-
      A point $(p, q)$ lands where $2x + 4 = p$, so $x = \dfrac{p - 4}{2}$: subtract 4, then halve. That's a translation by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $x$-axis with factor $\tfrac12$.
    options:
      - text: |-
          Stretch parallel to the $x$-axis, factor $\tfrac12$, followed by a translation by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$
        why: |-
          That gives $x = \dfrac{p}{2} - 4$, which is the graph of $y = f(2x + 8)$. After stretching first, the translation would need to be $\begin{pmatrix} -2 \\ 0 \end{pmatrix}$.
      - text: |-
          Translation by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $x$-axis, factor $\tfrac12$
        correct: true
        why: |-
          Undo "add 4" first, then undo "double": $x = \dfrac{p - 4}{2}$.
      - text: |-
          Translation by $\begin{pmatrix} 4 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $x$-axis, factor $\tfrac12$
        why: |-
          Inside the bracket does the opposite: $+4$ moves the graph 4 to the **left**.
      - text: |-
          Translation by $\begin{pmatrix} -4 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $x$-axis, factor 2
        why: |-
          A 2 inside the bracket gives a factor of $\tfrac12$, not 2: the graph gets narrower.

  - id: ct-point-x
    format: numeric
    difficulty: 2
    objectives: ["1.2.5"]
    prompt: |-
      The point $(6, 3)$ lies on the graph of $y = f(x)$. Find the corresponding point on the graph of $y = f(2x + 4)$.
    fields:
      - label: "x ="
        answer: 1
      - label: "y ="
        answer: 3
    explanation: |-
      Solve $2x + 4 = 6$: $x = 1$. The height doesn't change, so the point is $(1, 3)$.

      Same thing as two steps: translate left 4 to get $(2, 3)$, then halve the $x$-coordinate to get $(1, 3)$. Check: $f(2 \times 1 + 4) = f(6) = 3$ ✓

  - id: ct-equation
    format: expression
    difficulty: 2
    objectives: ["1.2.5"]
    prompt: |-
      The graph of $y = x^2 - 4x$ is reflected in the $x$-axis and then translated by $\begin{pmatrix} 0 \\ 5 \end{pmatrix}$. Find the equation of the new graph, $y = \dots$
    answer: -x^2 + 4x + 5
    variables: [x]
    display: |-
      $y = -x^2 + 4x + 5$
    explanation: |-
      Reflect in the $x$-axis: $y = -(x^2 - 4x) = -x^2 + 4x$. Then up 5: $y = -x^2 + 4x + 5$.

      The other order would give $-\left[(x^2 - 4x) + 5\right] = -x^2 + 4x - 5$. Check with a point: $(0, 0)$ reflects to $(0, 0)$, then moves to $(0, 5)$, and $-0 + 0 + 5 = 5$ ✓

  - id: ct-spot
    format: spot-error
    difficulty: 3
    objectives: ["1.2.5"]
    prompt: |-
      A student describes how the graph of $y = f(3x - 6)$ is obtained from the graph of $y = f(x)$. Which line contains the first error?
    lines:
      - |-
        $y = f(3x - 6)$ changes only the $x$-coordinates.
      - |-
        A point $(p, q)$ on $y = f(x)$ moves to the place where $3x - 6 = p$.
      - |-
        So the new $x$-coordinate is $\dfrac{p + 6}{3}$.
      - |-
        That is a stretch parallel to the $x$-axis with factor $\tfrac13$, followed by a translation by $\begin{pmatrix} 6 \\ 0 \end{pmatrix}$.
    errorLine: 4
    fix: |-
      $\dfrac{p + 6}{3}$ means add 6 **first**, then divide by 3: a translation by $\begin{pmatrix} 6 \\ 0 \end{pmatrix}$ followed by a stretch parallel to the $x$-axis with factor $\tfrac13$. (Equivalently: stretch with factor $\tfrac13$, then translate by $\begin{pmatrix} 2 \\ 0 \end{pmatrix}$.)
    explanation: |-
      Lines 1–3 are right. Test line 4 with $p = 9$: stretching first gives $3$, then translating gives $9$. But the correct new $x$-coordinate is $\dfrac{9 + 6}{3} = 5$. The order in line 4 is backwards.
