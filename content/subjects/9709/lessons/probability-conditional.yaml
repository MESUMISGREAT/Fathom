id: probability-conditional
subject: "9709"
topic: "5.3"
title: Conditional probability
summary: Find the probability of an event given that another has happened, using a reduced sample space or the formula P(A|B) = P(A and B) / P(B).
order: 5
minutes: 8
kind: core
objectives: ["5.3.4", "5.3.3"]
prerequisites: ["probability-sample-space", "probability-independent-events-multiplication"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 5.3 Probability, outcome 5.3.4 "Calculate and use
    conditional probabilities in simple cases", with guidance that this may use a sample
    space of equiprobable elementary events, a tree diagram, or P(A|B) = P(A ∩ B)/P(B) in
