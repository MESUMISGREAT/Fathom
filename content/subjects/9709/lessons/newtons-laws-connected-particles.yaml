blocks:
  - type: objective
    body: |
      By the end you can model connected particles with a light inextensible string over a smooth
      pulley, or a car and trailer connected by a rope or tow-bar, and find acceleration and
      tension/thrust.

  - type: explain
    title: What "connected" means
    body: |
      **Light** means the string/rod has negligible mass. **Inextensible** means it doesn't stretch.
      **Smooth pulley** means no friction at the pulley — the tension is the same on both sides.

      The key consequence: **both particles have the same acceleration magnitude** (they move
      together). If one speeds up, the other does too, by the same amount. The string/rod
      transmits the force.

      Two approaches work:
      1. **Separate particles:** Apply F = ma to each particle. You get two equations with two
         unknowns (acceleration a and tension T or thrust). Solve them simultaneously.
      2. **Whole system:** Treat the connected particles as one system. Internal forces (tension/
         thrust) cancel out. The net external force = (total mass) × a. This often gives a
         directly, then substitute back to find T.

      Both are valid. The system method is faster for finding a; the separate method is needed
      when you want the internal force.

  - type: example
    title: Two masses on a smooth pulley
    problem: |
      Two particles A (mass 3 kg) and B (mass 5 kg) are connected by a light inextensible string
      passing over a smooth fixed pulley. They are released from rest. Find (a) the acceleration of
      the system and (b) the tension in the string. Take g = 10 m s⁻².
    steps:
      - |
        Draw force diagrams. A: weight 30 N down, tension T up. B: weight 50 N down, tension T up.
        B is heavier, so B goes down, A goes up. Take the direction of motion as positive for each:
        for A, up is positive; for B, down is positive.
      - |
        **System method:** Net external force = 50 - 30 = 20 N (down on B). Total mass = 8 kg.
        20 = 8a → a = 2.5 m s⁻².
      - |
        **Separate method (to find T):** For A (up positive): T - 30 = 3a. For B (down positive):
        50 - T = 5a.
        Add: 20 = 8a → a = 2.5 m s⁻² (same).
        Substitute: T - 30 = 3(2.5) = 7.5 → T = 37.5 N.
    answer: |
      (a) a = 2.5 m s⁻². (b) T = 37.5 N.

  - type: example
    title: Car and trailer — rope and tow-bar
    problem: |
      A car of mass 1000 kg tows a trailer of mass 600 kg by a light inextensible rope. The car's
      engine provides a driving force of 3000 N. Resistances: car 500 N, trailer 300 N. Find (a)
      the acceleration and (b) the tension in the rope.
    steps:
      - |
        System method: Net external force = driving force - total resistance = 3000 - (500 + 300)
        = 2200 N. Total mass = 1600 kg. 2200 = 1600a → a = 1.375 m s⁻².
      - |
        Separate for tension: For trailer (forward positive): T - 300 = 600a = 600 × 1.375 = 825.
        So T = 1125 N.
        (Check with car: 3000 - 500 - T = 1000a → 2500 - 1125 = 1375 = 1000 × 1.375 ✓)
    answer: |
      (a) a = 1.375 m s⁻². (b) T = 1125 N.

  - type: explain
    title: Rope vs tow-bar — the crucial difference
    body: |
      A **rope** can only pull (tension). If the car brakes, the rope goes slack — it cannot push
      the trailer. The trailer would then decelerate only due to its own resistance.

      A **rigid tow-bar** can both pull (tension) and push (thrust/compression). If the car brakes,
      the tow-bar pushes the trailer forward (thrust), so both still have the same acceleration.

      The syllabus says "light rope or light rigid tow-bar". If it's a rope, tension ≥ 0 always. If
      it's a tow-bar, the internal force can be tension (pull) or thrust (push).

  - type: example
    title: Car and trailer with tow-bar — braking
    problem: |
      A car (mass 1000 kg) and trailer (mass 600 kg) are connected by a light rigid tow-bar. They
      move at constant speed with the engine providing 800 N driving force. The resistances are
      500 N (car) and 300 N (trailer). The driver then applies the brakes, exerting a braking force
      of 1200 N on the car (backwards). Find (a) the acceleration and (b) the force in the tow-bar,
      stating whether it is tension or thrust.
    steps:
      - |
        First, check constant speed: driving 800 N = total resistance 500 + 300 = 800 N. Net force
        zero, so a = 0. Consistent.
      - |
        Now braking: forces on system = driving force - braking force - resistances = 800 - 1200
        - 800 = -1200 N. Total mass = 1600 kg. a = -1200/1600 = -0.75 m s⁻² (deceleration).
      - |
        Force in tow-bar (on trailer, forward positive): T - 300 = 600(-0.75) = -450. So T = -150 N.
        Negative means the force on the trailer is backwards — the tow-bar is pushing it. This is
        **thrust** of 150 N.
    answer: |
      (a) a = -0.75 m s⁻² (deceleration). (b) Thrust = 150 N (force in tow-bar is a push).

  - type: check
    title: Check yourself
    questions: [pulley-two-mass, car-trailer-rope, car-trailer-brake, tow-bar-thrust]

  - type: misconceptions
    items:
      - wrong: "Tension is different on each side of a smooth pulley."
        right: |
          A smooth pulley means no friction. The tension is the same throughout a light inextensible
          string. That's a key modelling assumption.
      - wrong: "In a tow-bar problem, the force is always tension."
        right: |
          A rigid tow-bar can transmit thrust (a push) as well as tension (a pull). If the car
          brakes, the tow-bar pushes the trailer. The force can be negative in your chosen
          positive direction.
      - wrong: "The acceleration of the two particles might be different if one is heavier."
        right: |
          The string/rod is inextensible — it doesn't stretch. The particles must have the same
          acceleration magnitude. Different masses mean different net forces, not different
          accelerations.

  - type: exam
    body: |
      - Draw separate force diagrams for each particle. Label tension T (or thrust) on both.
      - Write your sign convention for each particle (usually direction of motion = positive).
      - System method: external forces only, total mass. Finds a quickly.
      - Separate method: includes internal forces. Needed for T or thrust.
      - "Light inextensible string" = same tension both sides, same acceleration magnitude.
      - "Smooth pulley" = same tension both sides.
      - Rope: tension only (≥ 0). Tow-bar: tension or thrust (can be negative).
      - If the rope goes slack, the particles separate — they no longer move together. The
        question will usually ask about the moment it becomes taut again.

  - type: takeaways
    items:
      - "Light inextensible string + smooth pulley → same tension, same acceleration magnitude."
      - "System method: ΣF_external = (total mass) × a. Fast for finding a."
      - "Separate method: F = ma for each particle. Needed for internal force (T or thrust)."
      - "Rope = tension only (≥ 0). Tow-bar = tension or thrust (can push)."
      - "If car brakes with tow-bar, thrust appears in the bar."

questions:
  - id: pulley-two-mass
    format: numeric
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |
      Particles of mass 2 kg and 7 kg are connected by a light inextensible string over a smooth
      pulley. Find (a) the acceleration of the system and (b) the tension in the string. Take
      g = 10 m s⁻².
    fields:
      - label: "a (m s⁻²)"
        answer: 5.56
        tolerance: { abs: 0.05 }
      - label: "T (N)"
        answer: 31.1
        tolerance: { abs: 0.2 }
    explanation: |
      System: net force = 70 - 20 = 50 N. Total mass = 9 kg. a = 50/9 ≈ 5.56 m s⁻².
      For the 2 kg mass (up positive): T - 20 = 2(50/9) = 100/9. T = 20 + 100/9 = 280/9 ≈ 31.1 N.

  - id: car-trailer-rope
    format: numeric
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |
      A car of mass 1200 kg tows a trailer of mass 400 kg by a light inextensible rope. The
      driving force is 2000 N. Resistances: car 600 N, trailer 200 N. Find (a) the acceleration
      and (b) the tension in the rope.
    fields:
      - label: "a (m s⁻²)"
        answer: 0.75
        tolerance: { abs: 0.05 }
      - label: "T (N)"
        answer: 500
        tolerance: { abs: 1 }
    explanation: |
      System: net force = 2000 - 600 - 200 = 1200 N. Total mass = 1600 kg. a = 1200/1600 = 0.75 m s⁻².
      Trailer: T - 200 = 400 × 0.75 = 300. T = 500 N.

  - id: car-trailer-brake
    format: numeric
    difficulty: 3
    objectives: ["4.4.4"]
    prompt: |
      A car (mass 900 kg) and trailer (mass 300 kg) are connected by a light rigid tow-bar. The
      resistances are 450 N on the car and 150 N on the trailer. They move at constant speed with
      a driving force of 600 N. The driver applies brakes giving a braking force of 800 N on the
      car. Find the deceleration and the force in the tow-bar (state tension or thrust).
    fields:
      - label: "deceleration (m s⁻²)"
        answer: 0.6667
        tolerance: { abs: 0.02 }
      - label: "force in tow-bar (N)"
        answer: -50
        tolerance: { abs: 1 }
    explanation: |
      Net force on system = driving - braking - total resistance = 600 - 800 - 600 = -800 N.
      Total mass = 1200 kg. a = -800/1200 = -2/3 ≈ -0.667 m s⁻² (deceleration).
      Trailer (forward positive): T - 150 = 300 × (-2/3) = -200. T = -50 N. The negative sign
      means the force on the trailer is backwards — the tow-bar pushes it. This is thrust of 50 N.

  - id: tow-bar-thrust
    format: mcq
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |
      A car and trailer are connected by a light rigid tow-bar and are moving forwards. The car
      brakes. What is the force in the tow-bar acting on the trailer?
    options:
      - text: "Tension (pulling the trailer forwards)"
        why: "This would be true if the car were accelerating, not braking."
      - text: "Thrust (pushing the trailer forwards)"
        correct: true
        why: "The car slows down, the trailer tends to keep moving forward, so the tow-bar pushes it forward."
      - text: "Zero — the tow-bar goes slack"
        why: "A rigid tow-bar does not go slack; only a rope does. The tow-bar pushes (thrust)."
      - text: "Tension (pulling the trailer backwards)"
        why: "The tow-bar is rigid, not a rope. It pushes, it doesn't pull backwards."
    explanation: |
      When the car brakes, it decelerates. The trailer's inertia makes it tend to continue at the
      original speed, so it pushes against the tow-bar. The tow-bar, being rigid, pushes back on
      the trailer (thrust) and the trailer pushes on the car. This is the key difference from a
      rope, which would go slack.