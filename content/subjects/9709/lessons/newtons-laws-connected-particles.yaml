id: newtons-laws-connected-particles
subject: "9709"
topic: "4.4"
title: "Connected particles: pulleys and tow-bars"
summary: "When particles are connected by a string or rod, they move together. Apply F = ma to each particle separately, or to the whole system — both work if you do it carefully."
order: 4
minutes: 10
kind: core
objectives: ["4.4.4"]
prerequisites: ["newtons-laws-first-second", "newtons-laws-mass-weight"]
