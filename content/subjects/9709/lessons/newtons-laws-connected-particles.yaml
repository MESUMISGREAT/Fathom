blocks:
  - type: objective
    body: |-
      By the end you can handle two objects joined together, either by a string over a pulley or by a rope or tow-bar between a car and a trailer, and find their acceleration and the force in the connection.

  - type: explain
    title: The words the question uses
    body: |-
      Connected-particle questions come with a short list of modelling words. Each one tells you something you can use:

      - **Light** string or rod: its mass is ignored, so it doesn't need any force to accelerate it. The pull is the same all along it.
      - **Inextensible**: it doesn't stretch. So the two objects always move together, with the **same speed** and the **same size of acceleration**.
      - **Smooth pulley**: no friction at the pulley, so the **tension** (the pulling force in the string, $T$) is the same on both sides.
      - **Particle**: treat each object as a dot, so you ignore its size and rotation.
      - **Driving force**: the forward push from a car's engine. **Resistance**: the backward forces (air resistance, friction) that oppose the motion.

      Throughout, we use Newton's second law, $F = ma$: the **resultant** (overall) force on an object equals its mass times its acceleration. Take $g = 10\text{ m s}^{-2}$, as Cambridge 9709 does unless a question says otherwise.

  - type: diagram
    diagram: mech-connected-particles
    alt: >-
      Two panels. Left: a smooth pulley hanging from a ceiling, with a string over it. Particle A, 3 kg,
      hangs on the left and particle B, 5 kg, hangs lower on the right. Each has tension T pointing up
      the string and its weight (3g and 5g) pointing down. An acceleration arrow a points up beside A and
      down beside B. Caption: smooth pulley, same T both sides. Right: a trailer of 600 kg joined by a bar
      to a car of 1000 kg on a road. The car has a 3000 N driving force forwards. Resistances of 500 N
      on the car and 300 N on the trailer point backwards. In the bar, tension T acts forwards on the
      trailer and backwards on the car. Caption: the bar pulls the trailer forward and the car back.
    caption: |-
      Draw a separate force diagram for each object. The connection pulls **both** objects towards each other with the same $T$.

  - type: explain
    title: Two ways to get the answers
    body: |-
      **Method 1: one object at a time.** Apply $F = ma$ to each object separately, using only the forces on *that* object. You get two equations in two unknowns (usually $a$ and $T$). Solve them together.

      **Method 2: the whole system.** Treat the two objects as one big object of mass $m_1 + m_2$. The tension pulls one forward and the other back by the same amount, so inside the system it **cancels**. Only the outside (external) forces count:

      $$\text{resultant external force} = (m_1 + m_2)\,a.$$

      Method 2 gets $a$ in one line, but it can't give you $T$, because $T$ has cancelled. So a good routine is: whole system for $a$, then one object for $T$.

      **Choose a positive direction for each object: the way it moves.** For the pulley, that's up for the lighter object and down for the heavier one.

  - type: example
    title: Two particles over a pulley
    problem: |-
      Particles $A$ (mass $3\text{ kg}$) and $B$ (mass $5\text{ kg}$) are joined by a light inextensible string over a smooth fixed pulley, as in the diagram, and released from rest. Find the acceleration and the tension.
    steps:
      - |-
        $B$ is heavier, so $B$ moves down and $A$ moves up. Weights: $A$ has $3g = 30\text{ N}$, $B$ has $5g = 50\text{ N}$.
      - |-
        **$A$ (up positive):** forces up minus forces down $=$ mass $\times a$: $\;T - 30 = 3a$.
      - |-
        **$B$ (down positive):** $\;50 - T = 5a$.
      - |-
        Add the two equations. The $T$ terms cancel: $50 - 30 = 8a$. (This is the whole-system method in disguise: taking "round the pulley" as the positive direction, $B$'s weight pulls the system round and $A$'s weight resists.) So $a = \dfrac{20}{8} = 2.5\text{ m s}^{-2}$.
      - |-
        Substitute into $A$'s equation: $T = 30 + 3(2.5) = 37.5\text{ N}$.
      - |-
        Check with $B$: $50 - 37.5 = 12.5 = 5 \times 2.5$ ✓
    answer: |-
      $a = 2.5\text{ m s}^{-2}$ and $T = 37.5\text{ N}$. Notice $T$ is between the two weights: bigger than $30$ (so $A$ speeds up going up) but less than $50$ (so $B$ speeds up going down).

  - type: example
    title: Car and trailer
    problem: |-
      A car of mass $1000\text{ kg}$ tows a trailer of mass $600\text{ kg}$ with a light inextensible rope, as in the diagram. The driving force is $3000\text{ N}$. The resistances are $500\text{ N}$ on the car and $300\text{ N}$ on the trailer. Find the acceleration and the tension in the rope.
    steps:
      - |-
        **Whole system (forwards positive):** external forces are the driving force and both resistances. $3000 - 500 - 300 = 1600a$, so $2200 = 1600a$ and $a = 1.375\text{ m s}^{-2}$.
      - |-
        **Trailer alone:** the only forward force on it is $T$; the backward force is its resistance. $T - 300 = 600 \times 1.375 = 825$, so $T = 1125\text{ N}$.
      - |-
        **Check with the car alone:** forward $3000$; backward $500$ and the rope's pull $T$. $3000 - 500 - 1125 = 1375 = 1000 \times 1.375$ ✓
    answer: |-
      $a = 1.375\text{ m s}^{-2}$ and $T = 1125\text{ N}$.

  - type: check
    title: Check yourself
    questions: [pulley-two-mass, car-trailer-rope]

  - type: explain
    title: Rope or tow-bar?
    body: |-
      A **rope** can only pull. If the car slows down sharply, the rope just goes slack; it can't push.

      A rigid **tow-bar** can pull *or* push. A push in a rod is called a **thrust**. When the car brakes hard, the trailer "wants" to keep going and runs up against the bar. The bar then pushes the trailer **backwards** (slowing it down) and pushes the car **forwards**.

      **How to handle it:** call the force in the bar $T$ and draw it as a tension (forwards on the trailer). Solve as usual. If $T$ comes out **negative**, your guess of direction was wrong: the bar is in thrust, with size $\lvert T \rvert$.

  - type: example
    title: Braking with a tow-bar
    problem: |-
      The same car ($1000\text{ kg}$) and trailer ($600\text{ kg}$) are now joined by a light rigid tow-bar. The driving force is $800\text{ N}$ and the resistances are still $500\text{ N}$ and $300\text{ N}$, so they move at constant speed. The driver then brakes, adding a backward braking force of $1200\text{ N}$ on the car (the driving force stays at $800\text{ N}$). Find the acceleration and the force in the tow-bar.
    steps:
      - |-
        Before braking: $800 - 500 - 300 = 0$, so no resultant force and constant speed ✓
      - |-
        **Whole system (forwards positive):** $800 - 1200 - 500 - 300 = 1600a$, so $-1200 = 1600a$ and $a = -0.75\text{ m s}^{-2}$. The minus sign means it's slowing down.
      - |-
        **Trailer alone**, with the bar force $T$ drawn forwards: $T - 300 = 600 \times (-0.75) = -450$, so $T = -150\text{ N}$.
      - |-
        $T$ is negative, so the bar actually pushes the trailer **backwards** with $150\text{ N}$. That's a thrust.
      - |-
        Does that make sense? On its own, the trailer's $300\text{ N}$ resistance would only slow it at $300 \div 600 = 0.5\text{ m s}^{-2}$. The car is slowing at $0.75\text{ m s}^{-2}$, so the bar must push back on the trailer to make it slow down just as fast.
    answer: |-
      Deceleration $0.75\text{ m s}^{-2}$; the tow-bar is in **thrust**, $150\text{ N}$. With a rope instead, it would go slack here.

  - type: check
    title: Check yourself
    questions: [car-trailer-brake, tow-bar-thrust]

  - type: misconceptions
    items:
      - wrong: |-
          The tension is different on each side of the pulley.
        right: |-
          With a light string over a smooth pulley, the tension is the same all the way along.
      - wrong: |-
          The heavier particle has a bigger acceleration.
        right: |-
          The string doesn't stretch, so both move together with the same size of acceleration. The heavier one simply has a bigger resultant force.
      - wrong: |-
          For the pulley, the resultant force on the system is $5g + 3g$.
        right: |-
          The weights pull in opposite directions around the pulley, one with the motion and one against it, so the resultant is $5g - 3g$.
      - wrong: |-
          The force in a tow-bar is always a tension.
        right: |-
          A rigid bar can push too. A negative answer for $T$ means thrust.
      - wrong: |-
          The tension in the rope equals the driving force.
        right: |-
          The rope only has to accelerate the trailer and overcome the trailer's resistance, so $T$ is much smaller than the driving force.

  - type: exam
    body: |-
      - Draw a separate force diagram for each object, with $T$ on both.
      - State your positive direction for each object (usually the direction of motion).
      - Whole system for $a$, then one object for $T$. Use the other object as a check.
      - Write the equations in words-and-numbers form, like "$T - 300 = 600a$". Each correct equation is worth a mark on its own.
      - If the force in a tow-bar comes out negative, say in words that it is a thrust of that size.

  - type: takeaways
    items:
      - |-
        Light inextensible string over a smooth pulley: same tension both sides, same size of acceleration.
      - |-
        Whole system: resultant external force $= (m_1 + m_2)a$. The tension cancels, so this finds $a$ only.
      - |-
        One object at a time: $F = ma$ with all the forces on that object, including $T$. This finds $T$.
      - |-
        A rope only pulls. A tow-bar can pull (tension) or push (thrust); a negative $T$ means thrust.

questions:
  - id: pulley-two-mass
    format: numeric
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |-
      Particles of mass $2\text{ kg}$ and $7\text{ kg}$ are connected by a light inextensible string over a smooth fixed pulley and released from rest. Take $g = 10\text{ m s}^{-2}$. Find the acceleration and the tension, to 3 significant figures.
    fields:
      - label: "a (m s⁻²)"
        answer: 5.56
        tolerance: { abs: 0.05 }
      - label: "T (N)"
        answer: 31.1
        tolerance: { abs: 0.2 }
    explanation: |-
      The $7\text{ kg}$ particle goes down and the $2\text{ kg}$ particle goes up.

      Whole system: $70 - 20 = 9a$, so $a = \dfrac{50}{9} \approx 5.56\text{ m s}^{-2}$.

      $2\text{ kg}$ particle (up positive): $T - 20 = 2 \times \dfrac{50}{9}$, so $T = 20 + \dfrac{100}{9} = \dfrac{280}{9} \approx 31.1\text{ N}$.

  - id: car-trailer-rope
    format: numeric
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |-
      A car of mass $1200\text{ kg}$ tows a trailer of mass $400\text{ kg}$ with a light inextensible rope. The driving force is $2000\text{ N}$, and the resistances are $600\text{ N}$ on the car and $200\text{ N}$ on the trailer. Find the acceleration and the tension in the rope.
    fields:
      - label: "a (m s⁻²)"
        answer: 0.75
        tolerance: { abs: 0.05 }
      - label: "T (N)"
        answer: 500
        tolerance: { abs: 1 }
    explanation: |-
      Whole system: $2000 - 600 - 200 = 1600a$, so $a = \dfrac{1200}{1600} = 0.75\text{ m s}^{-2}$.

      Trailer: $T - 200 = 400 \times 0.75 = 300$, so $T = 500\text{ N}$.

      Check with the car: $2000 - 600 - 500 = 900 = 1200 \times 0.75$ ✓

  - id: car-trailer-brake
    format: numeric
    difficulty: 3
    objectives: ["4.4.4"]
    prompt: |-
      A car (mass $900\text{ kg}$) and trailer (mass $300\text{ kg}$) are joined by a light rigid tow-bar. The resistances are $450\text{ N}$ on the car and $150\text{ N}$ on the trailer, and they move at constant speed with a driving force of $600\text{ N}$. The driver brakes, adding a backward braking force of $800\text{ N}$ on the car (the driving force stays at $600\text{ N}$). Find the deceleration and the size of the thrust in the tow-bar.
    fields:
      - label: "deceleration (m s⁻²)"
        answer: 0.6667
        tolerance: { abs: 0.02 }
      - label: "thrust (N)"
        answer: 50
        tolerance: { abs: 1 }
    explanation: |-
      Whole system (forwards positive): $600 - 800 - 450 - 150 = 1200a$, so $-800 = 1200a$ and $a = -\tfrac23 \approx -0.667\text{ m s}^{-2}$: a deceleration of $0.667\text{ m s}^{-2}$.

      Trailer, with the bar force $T$ drawn forwards: $T - 150 = 300 \times \left(-\tfrac23\right) = -200$, so $T = -50\text{ N}$.

      Negative, so the bar pushes the trailer backwards: a **thrust** of $50\text{ N}$.

  - id: tow-bar-thrust
    format: mcq
    difficulty: 2
    objectives: ["4.4.4"]
    prompt: |-
      A car and trailer are joined by a light rigid tow-bar. The car brakes hard, so the car slows down faster than the trailer's own resistance alone would slow the trailer. What does the tow-bar do to the **trailer**?
    options:
      - text: It pushes the trailer backwards (thrust).
        correct: true
        why: |-
          The trailer must slow down as fast as the car, and its own resistance isn't enough, so the bar pushes back on it. A push in a rod is a thrust.
      - text: It pulls the trailer forwards (tension).
        why: |-
          That's what happens when the car is speeding up or cruising, not braking hard.
      - text: Nothing, because the tow-bar goes slack.
        why: |-
          Only a rope goes slack. A rigid bar can push.
      - text: It pushes the trailer forwards.
        why: |-
          A forward push would make the trailer slow down *less*, but it has to slow down *more* to keep up with the car.
    explanation: |-
      Both vehicles must have the same deceleration. The trailer's resistance alone gives too little, so the bar supplies an extra backward push on the trailer, and by Newton's third law an equal forward push on the car. The bar is in thrust.
