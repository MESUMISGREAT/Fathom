id: kinematics-calculus
subject: "9709"
topic: "4.2"
title: "Calculus for motion: differentiating and integrating"
summary: "Velocity is the derivative of displacement and acceleration the derivative of velocity. Integration runs the chain backwards."
order: 4
minutes: 8
kind: core
objectives: ["4.2.3"]
prerequisites: ["kinematics-velocity-time-graphs"]
