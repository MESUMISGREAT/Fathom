id: p3-int-standard-integrals
subject: '9709'
topic: '3.5'
title: Standard integrals get chain-rule rules
summary: Reverse-differentiate $e^{ax+b}$, $\sin(ax+b)$, $\cos(ax+b)$, $\sec^2(ax+b)$, $\dfrac{1}{ax+b}$ and $\dfrac{1}{x^2+a^2}$
  — always dividing by the inner derivative.
order: 1
minutes: 4
kind: core
objectives:
- 3.5.1
prerequisites:
- p3-logarithmic-exponential-e-and-ln
