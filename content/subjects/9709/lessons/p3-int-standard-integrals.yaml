id: p3-int-standard-integrals
subject: "9709"
topic: "3.5"
title: "Standard integrals: e, ln, sin, cos, sec² and tan⁻¹ with a linear inside"
summary: "Integrating e^(ax+b), 1/(ax+b), sin(ax+b), cos(ax+b), sec²(ax+b) and 1/(x²+a²) by running differentiation backwards, and why you divide by a."
order: 1
minutes: 10
kind: core
objectives: ["3.5.1"]
prerequisites: ["p3-logarithmic-exponential-e-and-ln"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Redrafted from scratch on 2026-10-30 by Claude Opus 5.5 after a first-time-student read scored the
    previous version 5-6/10 (two examples, a garbled exam list, and a misleading claim that the tan⁻¹ result
    comes from the chain rule). Written against the official Cambridge International AS & A Level Mathematics
    9709 syllabus for 2026-2027, topic 3.5 outcome 1, including its guidance example of the form
    1/(2 + 3x²). Question reverse-diff had two equivalent correct options and arctan-form was ambiguous; both
    were rewritten. Every antiderivative was checked by differentiating it. Independently reviewed on 2026-10-30 by a separate Claude agent, which recomputed every value and answer key; its findings were fixed. Not reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can integrate $e^{ax+b}$, $\dfrac{1}{ax+b}$, $\sin(ax+b)$, $\cos(ax+b)$, $\sec^2(ax+b)$ and
      $\dfrac{1}{x^2+a^2}$, and explain where each result comes from.

  - type: explain
    title: Integration is differentiation run backwards
    body: |
      To **integrate** a function means to find a function whose **derivative** is the one you started with.
      The answer is called an **antiderivative**. For example, the derivative of $x^3$ is $3x^2$, so an
      antiderivative of $3x^2$ is $x^3$.

      Why "an" antiderivative and not "the"? Because $x^3 + 5$ and $x^3 - 2$ also differentiate to $3x^2$:
      constants vanish when you differentiate. So we write $+\,C$ (the **constant of integration**) to stand for
      "plus any constant":

      $$\int 3x^2\,dx = x^3 + C$$

      Read $\int \ldots\,dx$ as "integrate this with respect to $x$".

      That gives the golden rule for this whole lesson: **you can always check an integral by differentiating
      your answer.** If you get back what you started with, you are right.

  - type: explain
    title: Key to the symbols
    body: |
      | Symbol | Meaning |
      | --- | --- |
      | $x$ | the variable we integrate with respect to |
      | $a$, $b$ | fixed numbers (constants), with $a \neq 0$ |
      | $ax + b$ | a **linear** expression, such as $3x - 1$, sitting **inside** another function |
      | $C$ | the constant of integration |
      | $\ln$ | the natural logarithm (log to base $e$) |
      | $\tan^{-1}$ | the inverse tangent: $\tan^{-1} y$ is the angle whose tangent is $y$ |
      | $\lvert u \rvert$ | the absolute value of $u$ (its size, ignoring any minus sign) |

  - type: explain
    title: Why you divide by a
    body: |
      You already know these derivatives, from the differentiation lessons:

      | Differentiate this... | ...and you get |
      | --- | --- |
      | $e^x$ | $e^x$ |
      | $\ln x$ | $\dfrac{1}{x}$ |
      | $\sin x$ | $\cos x$ |
      | $\cos x$ | $-\sin x$ |
      | $\tan x$ | $\sec^2 x$ |

      Now suppose the inside is $3x$ instead of $x$. By the **chain rule** (differentiate the outside, then
      multiply by the derivative of the inside):

      $$\frac{d}{dx}\left(e^{3x}\right) = e^{3x} \times 3 = 3e^{3x}$$

      So if we guess $\int e^{3x}\,dx = e^{3x}$, our guess differentiates to $3e^{3x}$, which is **three times
      too big**. Fix it by dividing by 3:

      $$\frac{d}{dx}\left(\tfrac{1}{3}e^{3x}\right) = \tfrac{1}{3} \times 3e^{3x} = e^{3x} \quad ✓$$

      The same thing happens for every function with a linear inside $ax + b$: differentiating multiplies by
      $a$ (the derivative of $ax + b$), so integrating has to **divide by $a$**. The $b$ makes no difference,
      because it differentiates to 0.

  - type: definition
    term: The five chain-rule integrals
    body: |
      For constants $a \neq 0$ and $b$:

      $$\int e^{ax+b}\,dx = \frac{1}{a}e^{ax+b} + C$$

      $$\int \frac{1}{ax+b}\,dx = \frac{1}{a}\ln\lvert ax+b \rvert + C$$

      $$\int \cos(ax+b)\,dx = \frac{1}{a}\sin(ax+b) + C$$

      $$\int \sin(ax+b)\,dx = -\frac{1}{a}\cos(ax+b) + C$$

      $$\int \sec^2(ax+b)\,dx = \frac{1}{a}\tan(ax+b) + C$$

      Two details to notice:

      - **The minus sign for $\sin$.** Differentiating $\cos$ gives $-\sin$, so to get $+\sin$ back you need
        $-\cos$.
      - **The absolute value in $\ln\lvert ax+b \rvert$.** You can only take the log of a positive number. The
        absolute value bars make the result work even where $ax + b$ is negative.

  - type: example
    title: An exponential with a negative inside
    problem: |
      Find $\displaystyle\int e^{-2x}\,dx$.
    steps:
      - "The inside is $-2x$, which is $ax + b$ with $a = -2$ and $b = 0$."
      - "Use the rule: divide by $a = -2$. So $\\displaystyle\\int e^{-2x}\\,dx = \\frac{1}{-2}e^{-2x} + C = -\\tfrac{1}{2}e^{-2x} + C$."
      - "Check by differentiating: $\\dfrac{d}{dx}\\left(-\\tfrac12 e^{-2x}\\right) = -\\tfrac12 \\times (-2)e^{-2x} = e^{-2x}$ ✓"
    answer: |
      $-\dfrac{1}{2}e^{-2x} + C$

  - type: example
    title: Trig with a linear inside, and a number in front
    problem: |
      Find $\displaystyle\int 6\cos(3x + 1)\,dx$.
    steps:
      - "A number multiplying the whole function just comes along for the ride: $\\displaystyle\\int 6\\cos(3x+1)\\,dx = 6\\int \\cos(3x+1)\\,dx$."
      - "Here $a = 3$. The integral of $\\cos$ is $\\sin$, then divide by $3$: $\\displaystyle\\int \\cos(3x+1)\\,dx = \\tfrac13 \\sin(3x+1) + C$."
      - "Multiply by the 6: $6 \\times \\tfrac13 \\sin(3x+1) = 2\\sin(3x+1)$."
      - "Check: $\\dfrac{d}{dx}\\big(2\\sin(3x+1)\\big) = 2\\cos(3x+1) \\times 3 = 6\\cos(3x+1)$ ✓"
    answer: |
      $2\sin(3x + 1) + C$

  - type: example
    title: A log result with limits
    problem: |
      Find the exact value of $\displaystyle\int_0^1 \frac{1}{2x+1}\,dx$.
    steps:
      - "Here $a = 2$, so $\\displaystyle\\int \\frac{1}{2x+1}\\,dx = \\tfrac12 \\ln\\lvert 2x+1 \\rvert$. (With limits, the $+C$ cancels, so it is left out.)"
      - "Put in the top limit and subtract the bottom limit: $\\tfrac12 \\ln 3 - \\tfrac12 \\ln 1$."
      - "Since $\\ln 1 = 0$, this is $\\tfrac12 \\ln 3$."
    answer: |
      $\dfrac{1}{2}\ln 3$ (about $0.549$).

  - type: check
    title: Check the chain-rule integrals
    questions: [reverse-diff, linear-in-out, sec-squared, integral-stack, why-divide-by-k]

  - type: explain
    title: The odd one out — 1 over (x² + a²)
    body: |
      The last standard integral is different. There is no linear inside here; instead it comes from the
      derivative of the **inverse tangent**. You met this derivative in the differentiation topic:

      $$\frac{d}{dx}\left(\tan^{-1} x\right) = \frac{1}{1 + x^2}$$

      Now differentiate $\tan^{-1}\dfrac{x}{a}$ using the chain rule. The inside $\dfrac{x}{a}$ has derivative
      $\dfrac{1}{a}$:

      $$\frac{d}{dx}\left(\tan^{-1}\frac{x}{a}\right) = \frac{1}{1 + \frac{x^2}{a^2}} \times \frac{1}{a}$$

      Multiply the top and bottom of the first fraction by $a^2$ to tidy it up:

      $$= \frac{a^2}{a^2 + x^2} \times \frac{1}{a} = \frac{a}{x^2 + a^2}$$

      That is $a$ times too big, so divide by $a$:

      $$\int \frac{1}{x^2 + a^2}\,dx = \frac{1}{a}\tan^{-1}\frac{x}{a} + C$$

      **To use it**, the bottom must be exactly $x^2 + (\text{a number})$. Call that number $a^2$, and take its
      square root to find $a$. If the $x^2$ has a number in front of it, take that number out first.

  - type: example
    title: Spotting a²
    problem: |
      Find $\displaystyle\int \frac{4}{x^2 + 9}\,dx$.
    steps:
      - "Take the 4 outside: $\\displaystyle 4\\int \\frac{1}{x^2 + 9}\\,dx$."
      - "Match $x^2 + 9$ with $x^2 + a^2$: $a^2 = 9$, so $a = 3$."
      - "Use the result: $\\displaystyle\\int \\frac{1}{x^2+9}\\,dx = \\tfrac13 \\tan^{-1}\\frac{x}{3} + C$."
      - "Multiply by 4."
    answer: |
      $\dfrac{4}{3}\tan^{-1}\dfrac{x}{3} + C$

  - type: example
    title: When the x² has a number in front
    problem: |
      Find $\displaystyle\int \frac{1}{2 + 3x^2}\,dx$.
    steps:
      - "The bottom is not of the form $x^2 + a^2$ yet, because of the 3. Take 3 out of the bottom: $2 + 3x^2 = 3\\left(x^2 + \\tfrac{2}{3}\\right)$."
      - "So $\\displaystyle\\int \\frac{1}{2 + 3x^2}\\,dx = \\frac{1}{3}\\int \\frac{1}{x^2 + \\frac23}\\,dx$."
      - "Now $a^2 = \\tfrac23$, so $a = \\sqrt{\\tfrac23}$."
      - "Use the result: $\\dfrac{1}{3} \\times \\dfrac{1}{\\sqrt{2/3}}\\tan^{-1}\\dfrac{x}{\\sqrt{2/3}}$."
      - "Tidy the numbers. $3\\sqrt{\\tfrac23} = \\sqrt{9 \\times \\tfrac23} = \\sqrt{6}$, and $\\dfrac{x}{\\sqrt{2/3}} = x\\sqrt{\\tfrac32} = \\dfrac{\\sqrt6}{2}x$."
      - "Check by differentiating: $\\dfrac{1}{\\sqrt6} \\times \\dfrac{\\sqrt6/2}{1 + \\frac{6}{4}x^2} = \\dfrac{1/2}{1 + \\frac32 x^2} = \\dfrac{1}{2 + 3x^2}$ ✓"
    answer: |
      $\dfrac{1}{\sqrt6}\tan^{-1}\left(\dfrac{\sqrt6}{2}x\right) + C$

  - type: check
    title: Check the inverse tangent integral
    questions: [arctan-form]

  - type: misconceptions
    items:
      - wrong: "$\\displaystyle\\int e^{3x}\\,dx = e^{3x} + C$"
        right: "Differentiate $e^{3x}$ and you get $3e^{3x}$, three times too much. The answer is $\\tfrac13 e^{3x} + C$."
      - wrong: "$\\displaystyle\\int e^{3x}\\,dx = 3e^{3x} + C$"
        right: "Integrating **divides** by the inner derivative; differentiating multiplies by it."
      - wrong: "$\\displaystyle\\int \\sin(2x)\\,dx = \\tfrac12\\cos(2x) + C$"
        right: "The derivative of $\\cos$ is $-\\sin$, so the integral of $\\sin$ needs a minus: $-\\tfrac12\\cos(2x) + C$."
      - wrong: "$\\displaystyle\\int \\frac{1}{x^2 + 5}\\,dx = \\frac15\\tan^{-1}\\frac{x}{5} + C$"
        right: "The number is $a^2$, not $a$. Here $a = \\sqrt5$, giving $\\dfrac{1}{\\sqrt5}\\tan^{-1}\\dfrac{x}{\\sqrt5} + C$."
      - wrong: "These rules work for any inside, like $e^{x^2}$."
        right: "Dividing by $a$ only works when the inside is **linear** ($ax + b$). For $e^{x^2}$ the inside's derivative is $2x$, which is not a constant, so you cannot just divide by it."

  - type: exam
    body: |
      - Give exact answers (keep $\ln$, $e$, $\pi$ and surds) unless a decimal is asked for.
      - Write $+\,C$ on every indefinite integral. Leave it out when there are limits.
      - Learn all of these results, including the $\dfrac{1}{a}$ factor. Don't count on finding them in the formula booklet.
      - If in doubt, differentiate your answer. It takes ten seconds and catches most sign and factor slips.

  - type: takeaways
    items:
      - "Integrating undoes differentiating; check any answer by differentiating it."
      - "With a linear inside $ax + b$, integrate as normal and then **divide by $a$**."
      - "$\\int \\sin(ax+b)\\,dx = -\\tfrac1a\\cos(ax+b) + C$: note the minus. $\\int \\frac{1}{ax+b}\\,dx = \\tfrac1a\\ln\\lvert ax+b \\rvert + C$."
      - "$\\displaystyle\\int \\frac{1}{x^2+a^2}\\,dx = \\frac1a\\tan^{-1}\\frac{x}{a} + C$, where the number added to $x^2$ is $a^2$."

questions:
  - id: reverse-diff
    format: mcq
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Which of these is correct?
    options:
      - text: "$\\displaystyle\\int e^{3x}\\,dx = \\tfrac{1}{3}e^{3x} + C$"
        correct: true
        why: "Differentiating $\\tfrac13 e^{3x}$ gives $\\tfrac13 \\times 3e^{3x} = e^{3x}$, which is what we started with."
      - text: "$\\displaystyle\\int e^{3x}\\,dx = 3e^{3x} + C$"
        why: "Differentiating $3e^{3x}$ gives $9e^{3x}$. You divide by the inside's derivative, not multiply."
      - text: "$\\displaystyle\\int e^{3x}\\,dx = e^{3x} + C$"
        why: "Differentiating $e^{3x}$ gives $3e^{3x}$, three times too much."
      - text: "$\\displaystyle\\int e^{3x}\\,dx = \\tfrac{1}{3}e^{x} + C$"
        why: "The inside $3x$ must stay as it is. Differentiating $\\tfrac13 e^{x}$ gives $\\tfrac13 e^x$."
    explanation: |
      Divide by the derivative of the inside: $\displaystyle\int e^{3x}\,dx = \tfrac{1}{3}e^{3x} + C$.

  - id: integral-stack
    format: numeric
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      Evaluate $\displaystyle\int_{1}^{2} \frac{1}{2x}\,dx$, giving your answer to 3 decimal places.
    fields:
      - label: "value ="
        answer: 0.3466
        tolerance: { abs: 0.001 }
    explanation: |
      $\dfrac{1}{2x} = \dfrac12 \times \dfrac1x$, so the integral is $\tfrac12\big[\ln x\big]_1^2 = \tfrac12(\ln 2 - \ln 1) = \tfrac12 \ln 2 \approx 0.347$.

  - id: sec-squared
    format: expression
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      Find $\displaystyle\int \sec^2(4x)\,dx$. Leave out the $+\,C$, and type your answer using $x$, for example `0.5*tan(2*x)`.
    answer: 0.25*tan(4*x)
    variables: [x]
    display: "$\\dfrac{1}{4}\\tan(4x) + C$"
    explanation: |
      $\dfrac{d}{dx}\tan(4x) = 4\sec^2(4x)$, which is 4 times too much, so divide by 4: $\tfrac14\tan(4x) + C$.

  - id: linear-in-out
    format: mcq
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      $\displaystyle\int \sin(5x - 2)\,dx$ equals which expression?
    options:
      - text: "$-\\tfrac15\\cos(5x - 2) + C$"
        correct: true
        why: "Differentiating gives $-\\tfrac15 \\times (-\\sin(5x - 2)) \\times 5 = \\sin(5x - 2)$ ✓"
      - text: "$\\tfrac15\\cos(5x - 2) + C$"
        why: "This differentiates to $-\\sin(5x - 2)$. The integral of $\\sin$ needs a minus sign."
      - text: "$-\\cos(5x - 2) + C$"
        why: "This differentiates to $5\\sin(5x - 2)$. You need to divide by 5."
      - text: "$-\\tfrac15\\sin(5x - 2) + C$"
        why: "Integrating $\\sin$ gives $\\cos$, not $\\sin$."
    explanation: |
      For $\sin(ax+b)$ the antiderivative is $-\tfrac1a\cos(ax+b)$. Here $a = 5$.

  - id: arctan-form
    format: mcq
    difficulty: 3
    objectives: ["3.5.1"]
    prompt: |
      Which integral is equal to exactly $\tan^{-1}\dfrac{x}{3} + C$?
    options:
      - text: "$\\displaystyle\\int \\frac{3}{x^2 + 9}\\,dx$"
        correct: true
        why: "$\\displaystyle\\int \\frac{1}{x^2+9}\\,dx = \\tfrac13\\tan^{-1}\\frac{x}{3} + C$, and multiplying by 3 gives exactly $\\tan^{-1}\\frac{x}{3} + C$."
      - text: "$\\displaystyle\\int \\frac{1}{x^2 + 9}\\,dx$"
        why: "This gives $\\tfrac13\\tan^{-1}\\frac{x}{3} + C$, a third of what is wanted."
      - text: "$\\displaystyle\\int \\frac{1}{x^2 + 3}\\,dx$"
        why: "Here $a^2 = 3$, so $a = \\sqrt3$ and the answer involves $\\tan^{-1}\\frac{x}{\\sqrt3}$, not $\\tan^{-1}\\frac{x}{3}$."
      - text: "$\\displaystyle\\int \\frac{1}{(x + 3)^2}\\,dx$"
        why: "This is $(x+3)^{-2}$, which integrates to $-\\dfrac{1}{x+3} + C$. No inverse tangent appears."
    explanation: |
      With $a = 3$, $\displaystyle\int \frac{1}{x^2 + 9}\,dx = \frac{1}{3}\tan^{-1}\frac{x}{3} + C$. To remove the $\tfrac13$, the integrand needs a 3 on top.

  - id: why-divide-by-k
    format: explain
    difficulty: 3
    objectives: ["3.5.1"]
    prompt: |
      Explain, using the chain rule, why $\displaystyle\int e^{2x}\,dx = \tfrac12 e^{2x} + C$ and not $e^{2x} + C$.
    model: |
      Differentiating $e^{2x}$ with the chain rule gives $e^{2x} \times 2 = 2e^{2x}$, which is twice what we want. So the antiderivative must be divided by 2: $\tfrac12 e^{2x}$ differentiates to $\tfrac12 \times 2e^{2x} = e^{2x}$.
    keyPoints:
      - "Differentiating $e^{2x}$ gives an extra factor of 2 from the chain rule"
      - "Integrating has to undo that, so divide by 2"
      - "Checking: $\\tfrac12 e^{2x}$ differentiates back to $e^{2x}$"
    explanation: |
      Compare your answer with the key points: a full answer names the chain-rule factor of 2 and explains that integrating divides it out.
