id: discrete-rv-binomial-mean-variance
subject: "9709"
topic: "5.4"
title: Mean and variance of the binomial distribution
summary: Use E(X) = np and Var(X) = np(1 - p) for a binomial variable, and use them in reverse to find n or p from a given mean and variance.
order: 5
minutes: 7
kind: core
objectives: ["5.4.2", "5.4.3"]
prerequisites: ["discrete-rv-binomial-model", "discrete-rv-variance"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 5.4 Discrete random variables, outcomes 5.4.2 and 5.4.3
    "Use formulae for the expectation and variance of the binomial distribution and for the
    expectation of the geometric distribution", noting that the syllabus does not require
