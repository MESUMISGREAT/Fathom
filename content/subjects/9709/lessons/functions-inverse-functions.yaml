id: functions-inverse-functions
subject: "9709"
topic: "1.2"
title: Inverse functions
summary: The inverse f⁻¹ undoes f. Only one-one functions have one; find it by rearranging y = f(x), and swap the domain and range.
order: 5
minutes: 5
kind: core
objectives: ["1.2.1", "1.2.3"]
prerequisites: [functions-one-one-functions, functions-composite-functions]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.2 learning outcomes "understand the terms
    ... inverse function" and "find the inverse of a one-one function in simple cases", including
    the syllabus's note on a squared bracket on a restricted domain (choosing the correct sign of
    the square root). All examples and questions are original; every inverse was checked
    numerically in Python by composing it with the original function. Not yet reviewed by a
    teacher.

blocks:
  - type: objective
    body: |-
      By the end you can say what an **inverse function** is, find $f^{-1}(x)$ for a one-one function, pick the right sign when a square root appears, and state the domain of $f^{-1}$.

  - type: explain
    title: Ctrl+Z for functions
    body: |-
      A function takes an input and does something to it. Its **inverse** is the undo button: feed it the output, and it hands you back the input you started with.

      - $f(4) = 11$ means $f$ sends 4 to 11.
      - $f^{-1}(11) = 4$ means $f^{-1}$ sends 11 straight back to 4.

      Only **one-one** functions get an undo button. If two inputs shared the output 9, then "undo 9" would have two answers, and a function can't do that.

  - type: definition
    term: Inverse function
    body: |-
      If $f$ is a **one-one** function, its **inverse function** $f^{-1}$ maps each value in the range of $f$ back to the value in the domain it came from: if $f(a) = b$, then $f^{-1}(b) = a$.

      - The **domain of $f^{-1}$** is the **range of $f$**, and the range of $f^{-1}$ is the domain of $f$.
      - $f^{-1}f(x) = x$ for every $x$ in the domain of $f$, and $ff^{-1}(x) = x$ for every $x$ in the domain of $f^{-1}$.

  - type: diagram
    diagram: functions-inverse-undo
    alt: >-
      Two rows of function machines. Top row, labelled f(x) = 2x + 3, multiply by 2, then add 3:
      the input 4 goes into a box labelled times 2 and comes out as 8, then into a box labelled
      plus 3 and comes out as 11. Bottom row, labelled f inverse of x = (x − 3)/2, undo each step,
      last one first: the arrows run right to left, so 11 goes into a box labelled minus 3 and comes
      out as 8, then into a box labelled divide by 2 and comes out as 4. A note says f(4) = 11 and
      f inverse of 11 = 4: the inverse sends every output back home.
    caption: |-
      Socks then shoes going out; shoes off **first** coming home. The inverse undoes the steps in reverse order.

  - type: check
    questions: [inv-meaning, inv-domain-swap]

  - type: explain
    title: The four-step method
    body: |-
      1. Write $y = f(x)$.
      2. Rearrange to make $x$ the subject.
      3. Swap the letters: write the result as $f^{-1}(x) = \dots$
      4. State the **domain of $f^{-1}$**: it's the range of $f$.

      Step 4 is the one people skip, and it's often worth a mark on its own.

  - type: example
    title: A straight-line function
    problem: |-
      $f(x) = 7 - 2x$ for $x \in \mathbb{R}$. Find $f^{-1}(x)$.
    steps:
      - |-
        Write $y = 7 - 2x$.
      - |-
        Make $x$ the subject: $2x = 7 - y$, so $x = \dfrac{7 - y}{2}$.
      - |-
        Swap the letters: $f^{-1}(x) = \dfrac{7 - x}{2}$.
      - |-
        The range of $f$ is all of $\mathbb{R}$, so the domain of $f^{-1}$ is $x \in \mathbb{R}$.
      - |-
        Check with a number: $f(1) = 5$ and $f^{-1}(5) = \dfrac{7 - 5}{2} = 1$ ✓
    answer: |-
      $f^{-1}(x) = \dfrac{7 - x}{2}$ for $x \in \mathbb{R}$.

  - type: example
    title: When a square root turns up
    problem: |-
      $f(x) = (x + 2)^2 - 5$ for $x \leqslant -2$. Find $f^{-1}(x)$ and state its domain.
    steps:
      - |-
        The domain stops at the vertex $x = -2$, so $f$ is one-one and its range is $f(x) \geqslant -5$.
      - |-
        Write $y = (x + 2)^2 - 5$, so $(x + 2)^2 = y + 5$.
      - |-
        Square-root both sides: $x + 2 = \pm\sqrt{y + 5}$. Now choose. In this domain $x \leqslant -2$, so $x + 2 \leqslant 0$. Take the **negative** root: $x + 2 = -\sqrt{y + 5}$.
      - |-
        So $x = -2 - \sqrt{y + 5}$, and $f^{-1}(x) = -2 - \sqrt{x + 5}$.
      - |-
        Domain of $f^{-1}$ = range of $f$: $x \geqslant -5$.
      - |-
        Check: $f(-4) = 4 - 5 = -1$, and $f^{-1}(-1) = -2 - \sqrt{4} = -4$ ✓
    answer: |-
      $f^{-1}(x) = -2 - \sqrt{x + 5}$ for $x \geqslant -5$.

  - type: diagram
    diagram: functions-inverse-left-branch
    alt: >-
      Graph with equal scales. The blue curve y = f(x) for x ≤ −2 is the left half of a parabola,
      rising steeply up and to the left from its end point (−2, −5). The orange curve
      y = f inverse of x starts at (−5, −2) and falls gently to the right. A dashed line y = x is
      the mirror between them, and they cross on it at about (−3.3, −3.3). The point (−4, −1) on f
      is joined by a dashed segment to its mirror image (−1, −4) on the inverse. A shaded band on
      the x-axis marks the domain of f, x ≤ −2, and a shaded band on the y-axis marks the range of
      the inverse, y ≤ −2.
    caption: |-
      Every output of $f^{-1}$ has to be an old input of $f$, so it must be $\leqslant -2$. The **negative** root, $-2 - \sqrt{x + 5}$, is the one that never climbs above $-2$.

  - type: check
    questions: [inv-linear, inv-sign]

  - type: misconceptions
    items:
      - wrong: |-
          $f^{-1}(x)$ means $\dfrac{1}{f(x)}$.
        right: |-
          The $-1$ is notation for "inverse", not a power. For $f(x) = 2x + 3$, $f^{-1}(x) = \dfrac{x - 3}{2}$, but $\dfrac{1}{f(x)} = \dfrac{1}{2x + 3}$. Totally different.
      - wrong: |-
          $\sqrt{y + 5}$ is always positive, so the answer is $-2 + \sqrt{x + 5}$.
        right: |-
          Square-rooting gives $\pm$, and the domain decides. Here $x + 2 \leqslant 0$, so you need the negative root. Test a value: $-2 + \sqrt{4} = 0$, which isn't $\leqslant -2$.
      - wrong: |-
          The domain of $f^{-1}$ is the same as the domain of $f$.
        right: |-
          They swap: the domain of $f^{-1}$ is the **range** of $f$. For the example above, $f$ has domain $x \leqslant -2$ but $f^{-1}$ has domain $x \geqslant -5$.

  - type: deeper
    title: Fractions with x on top and bottom
    body: |-
      Take $f(x) = \dfrac{2x + 1}{x - 3}$ for $x > 3$. The trick is to collect the $x$ terms on one side and factorise:

      $$y(x - 3) = 2x + 1 \;\Rightarrow\; xy - 2x = 3y + 1 \;\Rightarrow\; x(y - 2) = 3y + 1 \;\Rightarrow\; x = \frac{3y + 1}{y - 2}.$$

      So $f^{-1}(x) = \dfrac{3x + 1}{x - 2}$. For the domain, write $f(x) = 2 + \dfrac{7}{x - 3}$: when $x > 3$ the fraction is positive, so $f(x) > 2$. Hence $f^{-1}$ has domain $x > 2$.

  - type: exam
    body: |-
      - "Find an expression for $f^{-1}(x)$" is usually 2–3 marks. Show the rearranging, and write the final answer as $f^{-1}(x) = \dots$ in terms of $x$.
      - "State the domain of $f^{-1}$" is a separate mark: it's the range of $f$, which you often found in an earlier part.
      - With a square root, justify the sign in a few words ("since $x \leqslant -2$, $x + 2 \leqslant 0$"). Examiners want to see the choice, not a lucky guess.
      - Insider hack: plug one number through $f$, then through your $f^{-1}$. If you don't land back where you started, the answer's wrong. It takes 20 seconds.

  - type: check
    questions: [inv-value, inv-spot, inv-rational]

  - type: takeaways
    items:
      - |-
        $f^{-1}$ undoes $f$: if $f(a) = b$ then $f^{-1}(b) = a$. Only **one-one** functions have inverses.
      - |-
        Method: $y = f(x)$, make $x$ the subject, swap letters, then state the domain.
      - |-
        **Domain of $f^{-1}$ = range of $f$** (and range of $f^{-1}$ = domain of $f$).
      - |-
        If a $\pm\sqrt{\ }$ appears, the domain of $f$ decides the sign.
      - |-
        $f^{-1}(x)$ is not $\dfrac{1}{f(x)}$.

questions:
  - id: inv-meaning
    format: mcq
    difficulty: 1
    objectives: ["1.2.1"]
    prompt: |-
      $f$ is a one-one function and $f(3) = 10$. Which of these must be true?
    explanation: |-
      The inverse sends each output back to its input. $f$ sends 3 to 10, so $f^{-1}$ sends 10 back to 3: $f^{-1}(10) = 3$.
    options:
      - text: |-
          $f^{-1}(10) = 3$
        correct: true
        why: |-
          Yes: undoing $f$ takes the output 10 back to the input 3.
      - text: |-
          $f^{-1}(3) = 10$
        why: |-
          That runs $f$ forwards again. The inverse starts from the **output**, 10.
      - text: |-
          $f^{-1}(10) = \tfrac{1}{10}$
        why: |-
          That treats $-1$ as a power. $f^{-1}$ is the inverse function, not the reciprocal.
      - text: |-
          $f^{-1}(3) = \tfrac13$
        why: |-
          Reciprocal again, and the wrong input too. The inverse undoes $f$; it doesn't flip fractions.

  - id: inv-domain-swap
    format: cloze
    difficulty: 1
    objectives: ["1.2.1"]
    prompt: |-
      For a one-one function $f$, the domain of $f^{-1}$ is the {{1}} of $f$, and the range of $f^{-1}$ is the {{2}} of $f$.
    blanks:
      - accept: [range, the range]
      - accept: [domain, the domain]
    explanation: |-
      The inverse runs the function backwards, so inputs and outputs trade places: domain of $f^{-1}$ = **range** of $f$, and range of $f^{-1}$ = **domain** of $f$.

  - id: inv-linear
    format: expression
    difficulty: 2
    objectives: ["1.2.3"]
    prompt: |-
      $f(x) = 8 - 3x$ for $x \in \mathbb{R}$. Find $f^{-1}(x)$.
    answer: (8 - x)/3
    variables: [x]
    display: |-
      $f^{-1}(x) = \dfrac{8 - x}{3}$
    explanation: |-
      $y = 8 - 3x \Rightarrow 3x = 8 - y \Rightarrow x = \dfrac{8 - y}{3}$. Swap letters: $f^{-1}(x) = \dfrac{8 - x}{3}$.

      Check: $f(2) = 2$ and $f^{-1}(2) = \tfrac63 = 2$ ✓. (Try $x = 1$ too: $f(1) = 5$, $f^{-1}(5) = 1$ ✓.)

  - id: inv-sign
    format: mcq
    difficulty: 2
    objectives: ["1.2.3"]
    prompt: |-
      $f(x) = (x - 3)^2 + 1$ for $x \leqslant 3$. Which of these is $f^{-1}$?
    explanation: |-
      $y - 1 = (x - 3)^2$, so $x - 3 = \pm\sqrt{y - 1}$. The domain $x \leqslant 3$ makes $x - 3 \leqslant 0$, so take the negative root: $x = 3 - \sqrt{y - 1}$. The range of $f$ is $f(x) \geqslant 1$, which becomes the domain of $f^{-1}$.
    options:
      - text: |-
          $f^{-1}(x) = 3 + \sqrt{x - 1}$ for $x \geqslant 1$
        why: |-
          Wrong root: this gives outputs $\geqslant 3$, but $f^{-1}$ must output values from the domain of $f$, which are $\leqslant 3$.
      - text: |-
          $f^{-1}(x) = 3 - \sqrt{x - 1}$ for $x \leqslant 3$
        why: |-
          Right rule, wrong domain. That's the domain of $f$ copied across; the domain of $f^{-1}$ is the range of $f$, $x \geqslant 1$.
      - text: |-
          $f^{-1}(x) = 3 \pm \sqrt{x - 1}$ for $x \geqslant 1$
        why: |-
          $\pm$ gives two outputs for each input, so it isn't a function. You must choose one sign.
      - text: |-
          $f^{-1}(x) = 3 - \sqrt{x - 1}$ for $x \geqslant 1$
        correct: true
        why: |-
          Negative root because $x - 3 \leqslant 0$, and the domain is the range of $f$.

  - id: inv-value
    format: numeric
    difficulty: 2
    objectives: ["1.2.3"]
    prompt: |-
      $g(x) = x^2 + 6x$ for $x \geqslant -3$. Without finding a formula for $g^{-1}$, find $g^{-1}(16)$.
    fields:
      - label: "g⁻¹(16) ="
        answer: 2
    explanation: |-
      $g^{-1}(16)$ is the input that $g$ sends to 16. Solve $x^2 + 6x = 16$: $x^2 + 6x - 16 = 0$, so $(x + 8)(x - 2) = 0$ and $x = -8$ or $x = 2$.

      Only $x = 2$ is in the domain $x \geqslant -3$, so $g^{-1}(16) = 2$.

  - id: inv-spot
    format: spot-error
    difficulty: 3
    objectives: ["1.2.3"]
    prompt: |-
      A student finds the inverse of $f(x) = (2x - 1)^2 + 3$ for $x \geqslant \tfrac12$. Which line contains the first error?
    lines:
      - |-
        $y = (2x - 1)^2 + 3$, so $y - 3 = (2x - 1)^2$.
      - |-
        Since $x \geqslant \tfrac12$, $2x - 1 \geqslant 0$, so $2x - 1 = \sqrt{y - 3}$.
      - |-
        $x = \dfrac{1 + \sqrt{y - 3}}{2}$
      - |-
        $f^{-1}(x) = \dfrac{1 + \sqrt{x - 3}}{2}$
      - |-
        The domain of $f^{-1}$ is $x \geqslant \tfrac12$.
    errorLine: 5
    fix: |-
      The domain of $f^{-1}$ is the range of $f$. Since $(2x - 1)^2 \geqslant 0$, $f(x) \geqslant 3$, so the domain of $f^{-1}$ is $x \geqslant 3$.
    explanation: |-
      Lines 1–4 are spot on, including the choice of the positive root. Line 5 copies the domain of $f$. You can see it's wrong because $\sqrt{x - 3}$ isn't even defined for $x = 1$, which "$x \geqslant \tfrac12$" would allow.

  - id: inv-rational
    format: expression
    difficulty: 3
    objectives: ["1.2.3"]
    prompt: |-
      $f(x) = \dfrac{3x + 2}{x - 4}$ for $x > 4$. Find $f^{-1}(x)$.
    answer: (4x + 2)/(x - 3)
    variables: [x]
    domain: { min: 3.5, max: 12 }
    display: |-
      $f^{-1}(x) = \dfrac{4x + 2}{x - 3}$
    explanation: |-
      $y(x - 4) = 3x + 2 \Rightarrow xy - 4y = 3x + 2 \Rightarrow xy - 3x = 4y + 2 \Rightarrow x(y - 3) = 4y + 2.$

      So $x = \dfrac{4y + 2}{y - 3}$ and $f^{-1}(x) = \dfrac{4x + 2}{x - 3}$. Since $f(x) = 3 + \dfrac{14}{x - 4} > 3$ for $x > 4$, its domain is $x > 3$.
