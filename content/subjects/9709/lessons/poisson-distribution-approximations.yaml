blocks:
  - type: objective
    body: |-
      By the end you can decide when a binomial can be replaced by a Poisson, and when a Poisson can be replaced by a normal, and carry out either approximation correctly, including the **continuity correction** (where most marks are lost).

  - type: explain
    title: The notation, and why approximate at all
    body: |-
      Quick reminder of the three distributions:

      - $X \sim \text{B}(n, p)$, **binomial**: the number of successes in $n$ independent trials, each with probability $p$ of success. Mean $np$, variance $np(1 - p)$.
      - $X \sim \text{Po}(\lambda)$, **Poisson**: the number of random events in a fixed interval when they happen at an average rate of $\lambda$ (the Greek letter "lambda"). Mean $\lambda$ **and** variance $\lambda$.
      - $Y \sim \text{N}(\mu, \sigma^2)$, **normal**: a continuous, bell-shaped distribution with mean $\mu$ ("mu") and standard deviation $\sigma$ ("sigma"). $\Phi(z)$ ("phi") is the table value $\text{P}(Z < z)$ for the standard normal $Z \sim \text{N}(0, 1)$.

      **Why approximate?** Exact binomial or Poisson sums can be huge. $\text{P}(X \leqslant 40)$ for $X \sim \text{B}(1000, 0.003)$ needs 41 messy terms. A simpler distribution with the same shape gives a very close answer in a line or two.

      | From | To | Use when (syllabus guide) | New parameters |
      | --- | --- | --- | --- |
      | $\text{B}(n, p)$ | Poisson | $n > 50$ and $np < 5$ | $\lambda = np$ |
      | $\text{Po}(\lambda)$ | normal | $\lambda > 15$ | $\mu = \lambda$, $\sigma^2 = \lambda$ |

  - type: explain
    title: Binomial → Poisson
    body: |-
      Picture 200 light bulbs, each with a $2\%$ chance of being faulty. Lots of trials, and a success (a fault) in any one is rare. "Rare events scattered among many opportunities" is exactly what a Poisson describes. So the binomial count of faults behaves almost like a Poisson with the **same mean**:

      $$\lambda = np = 200 \times 0.02 = 4.$$

      **Why must $np$ be small, not just $n$ large?** A Poisson always has variance equal to its mean. The binomial's variance is $np(1 - p)$, which is close to $np$ only when $p$ is small (so $1 - p \approx 1$). With $n = 1000$ and $p = 0.4$, the mean is 400 but the binomial variance is only 240: a Poisson would have the wrong spread. That's why the rule is about $np < 5$ too.

  - type: example
    title: "Example 1: how good is it?"
    problem: |-
      $X \sim \text{B}(200, 0.02)$. Compare the exact values of $\text{P}(X = 0)$ and $\text{P}(X = 3)$ with a Poisson approximation.
    steps:
      - |-
        Conditions: $n = 200 > 50$ and $np = 4 < 5$, so use $\text{Po}(4)$.
      - |-
        $\text{P}(X = 0)$. Binomial: every bulb is fine, $(0.98)^{200} = 0.0176$. Poisson: $e^{-4} = 0.0183$.
      - |-
        $\text{P}(X = 3)$. Binomial: $\binom{200}{3}(0.02)^3(0.98)^{197} = 0.1963$. Poisson: $e^{-4}\dfrac{4^3}{3!} = 0.1954$.
    answer: |-
      $0.0176$ vs $0.0183$, and $0.1963$ vs $0.1954$. Close enough for exam work, and the Poisson takes a fraction of the effort.

  - type: check
    questions: [pq-lambda-np, pq-pzero, pq-ready-conditions]

  - type: explain
    title: Poisson → normal
    body: |-
      For small $\lambda$ a Poisson is lopsided (skewed): most of its probability sits near 0 with a long tail to the right. As $\lambda$ grows, it spreads out into a symmetrical bell shape, and by about $\lambda > 15$ a normal curve fits it well.

      Match the mean and variance. A Poisson has both equal to $\lambda$, so

      $$Y \sim \text{N}(\lambda, \lambda), \qquad \sigma = \sqrt{\lambda}.$$

      Careful: the second number in $\text{N}(\mu, \sigma^2)$ is the **variance**. For standardising you need the standard deviation, $\sqrt{\lambda}$.

  - type: explain
    title: The continuity correction
    body: |-
      The Poisson $X$ is **discrete**: it only takes whole numbers 0, 1, 2, … The normal $Y$ is **continuous**: it can be any value, and the probability of hitting one exact value like 12.000… is zero.

      So picture each whole number as a bar of width 1 in a bar chart. The value 12 is the bar from $11.5$ to $12.5$. To turn a statement about $X$ into one about $Y$, decide which bars you want, then go to the **outer edge** of the last bar:

      | You want | Bars included | Use |
      | --- | --- | --- |
      | $\text{P}(X \leqslant 12)$ | up to and including 12 | $\text{P}(Y < 12.5)$ |
      | $\text{P}(X < 12)$ | up to 11 | $\text{P}(Y < 11.5)$ |
      | $\text{P}(X \geqslant 8)$ | 8 and above | $\text{P}(Y > 7.5)$ |
      | $\text{P}(X > 8)$ | 9 and above | $\text{P}(Y > 8.5)$ |
      | $\text{P}(X = 10)$ | just 10 | $\text{P}(9.5 < Y < 10.5)$ |

      Tip: rewrite strict inequalities first. "$X < 12$" means "$X \leqslant 11$", so its edge is $11.5$.

  - type: example
    title: "Example 2: a lower tail"
    problem: |-
      $X \sim \text{Po}(20)$. Use a suitable approximation to estimate $\text{P}(X \leqslant 12)$.
    steps:
      - |-
        $\lambda = 20 > 15$, so use $Y \sim \text{N}(20, 20)$, with $\sigma = \sqrt{20} = 4.472$.
      - |-
        Continuity correction: 12 is included, so go to the top of its bar: $\text{P}(Y < 12.5)$.
      - |-
        Standardise with $z = \dfrac{\text{value} - \mu}{\sigma}$: $\;z = \dfrac{12.5 - 20}{4.472} = -1.677$, so $-1.68$ to 2 d.p.
      - |-
        Tables give $\Phi(1.68) = 0.9535$, and by symmetry $\Phi(-1.68) = 1 - 0.9535 = 0.0465$.
    answer: |-
      $\text{P}(X \leqslant 12) \approx 0.0465$. (The exact Poisson value is $0.0390$: at $\lambda = 20$ the curve is still slightly skewed, so the far tail is the least accurate part.)

  - type: check
    questions: [pq-norm-25]

  - type: example
    title: "Example 3: an upper tail"
    problem: |-
      $X \sim \text{Po}(49)$. Estimate $\text{P}(X \geqslant 60)$.
    steps:
      - |-
        $\lambda = 49 > 15$, so $Y \sim \text{N}(49, 49)$ with $\sigma = \sqrt{49} = 7$.
      - |-
        "$\geqslant 60$" includes 60, so go to the bottom of its bar: $\text{P}(Y > 59.5)$.
      - |-
        $z = \dfrac{59.5 - 49}{7} = 1.5$.
      - |-
        $\text{P}(Z > 1.5) = 1 - \Phi(1.5) = 1 - 0.9332 = 0.0668$.
    answer: |-
      About $0.0668$.

  - type: example
    title: "Example 4: a single value needs both edges"
    problem: |-
      $X \sim \text{Po}(20)$. Estimate $\text{P}(X = 18)$ using a normal approximation.
    steps:
      - |-
        The value 18 is the bar from $17.5$ to $18.5$, so find $\text{P}(17.5 < Y < 18.5)$.
      - |-
        $z$-values: $\dfrac{17.5 - 20}{4.472} = -0.559$ and $\dfrac{18.5 - 20}{4.472} = -0.335$.
      - |-
        $\Phi(-0.335) = 0.3688$ and $\Phi(-0.559) = 0.2881$ (using the third-decimal \"add\" columns of the normal table).
      - |-
        Area between them: $0.3688 - 0.2881 = 0.0807$.
    answer: |-
      About $0.0807$. The exact Poisson value is $e^{-20}\dfrac{20^{18}}{18!} = 0.0844$.

  - type: check
    questions: [pq-single-value]

  - type: misconceptions
    items:
      - wrong: |-
          Use a Poisson whenever $n$ is large.
        right: |-
          You also need $np < 5$. $\text{B}(500, 0.2)$ has $np = 100$, so successes aren't rare and a Poisson has the wrong variance.
      - wrong: |-
          For $\text{B}(n, p) \to \text{Po}$, set $\lambda = n$.
        right: |-
          $\lambda = np$, the expected number of successes.
      - wrong: |-
          $\text{N}(20, 20)$ has standard deviation 20.
        right: |-
          The 20 in the second place is the variance. $\sigma = \sqrt{20} = 4.47$.
      - wrong: |-
          The continuity correction is optional.
        right: |-
          It's needed every time a continuous normal stands in for a whole-number count, and it carries a mark.
      - wrong: |-
          $\text{P}(X > 8)$ becomes $\text{P}(Y > 7.5)$.
        right: |-
          "More than 8" starts at 9, so the edge is the bottom of the 9 bar: $\text{P}(Y > 8.5)$.

  - type: exam
    body: |-
      - State the condition with the question's numbers, e.g. "$n = 200 > 50$ and $np = 4 < 5$, so a Poisson approximation is valid". It is often worth a mark on its own.
      - Write the corrected boundary explicitly: "$\text{P}(X \leqslant 12) \approx \text{P}(Y < 12.5)$".
      - Quote $z$ to at least 2 d.p. before using tables, and give probabilities to 3 s.f.

  - type: takeaways
    items:
      - |-
        Binomial → Poisson when $n > 50$ and $np < 5$, with $\lambda = np$.
      - |-
        Poisson → normal when $\lambda > 15$, with $Y \sim \text{N}(\lambda, \lambda)$ and $\sigma = \sqrt\lambda$.
      - |-
        Continuity correction: each whole number $r$ is the bar from $r - 0.5$ to $r + 0.5$; go to the outer edge of the bars you want.
      - |-
        State the condition and the corrected boundary in your working.

  - type: check
    questions: [pq-spot-continuity, pq-why-continuity]

questions:
  - id: pq-lambda-np
    format: numeric
    difficulty: 1
    objectives: ["6.1.4"]
    prompt: |-
      $X \sim \text{B}(300, 0.01)$ is approximated by a Poisson distribution. What is $\lambda$?
    fields:
      - answer: 3
    explanation: |-
      $\lambda = np = 300 \times 0.01 = 3$. The conditions hold: $n = 300 > 50$ and $np = 3 < 5$.

  - id: pq-pzero
    format: numeric
    difficulty: 2
    objectives: ["6.1.4"]
    prompt: |-
      Using the model $\text{Po}(3)$, find $\text{P}(X = 0)$ to 3 significant figures.
    fields:
      - answer: 0.0498
        tolerance: { abs: 0.0002 }
        sigFigs: 3
    explanation: |-
      $\text{P}(X = 0) = e^{-3}\dfrac{3^0}{0!} = e^{-3} = 0.049787\ldots = 0.0498$ to 3 s.f. The exact binomial value with $n = 300$, $p = 0.01$ is $(0.99)^{300} = 0.0490$: close, but not identical.

  - id: pq-ready-conditions
    format: mcq
    difficulty: 1
    objectives: ["6.1.4"]
    prompt: |-
      Which conditions make a Poisson distribution a suitable approximation to $\text{B}(n, p)$?
    options:
      - text: |-
          $n$ large and $p$ small: roughly $n > 50$ and $np < 5$
        correct: true
        why: |-
          Many trials, rare successes. The condition is on the expected number of successes $np$, not on $n$ alone.
      - text: |-
          $n$ small and $p$ large
        correct: false
        why: |-
          A Poisson models rare events among many opportunities, the opposite of this.
      - text: |-
          $n > 50$ and $p > 0.5$
        correct: false
        why: |-
          With $p$ that big, successes aren't rare and the variance $np(1 - p)$ is far from $np$.
      - text: |-
          $np > 5$
        correct: false
        why: |-
          A large $np$ means successes aren't rare; that's not the Poisson situation.
    explanation: |-
      A Poisson approximates a binomial when there are many trials and a small chance of success in each, about $n > 50$ and $np < 5$, with $\lambda = np$.

  - id: pq-norm-25
    format: numeric
    difficulty: 2
    objectives: ["6.1.5"]
    prompt: |-
      $X \sim \text{Po}(36)$. Using a normal approximation with a continuity correction, estimate $\text{P}(X \leqslant 25)$ to 3 significant figures.
    fields:
      - answer: 0.0401
        tolerance: { abs: 0.0005 }
        sigFigs: 3
    explanation: |-
      $Y \sim \text{N}(36, 36)$, so $\sigma = 6$. 25 is included, so use $\text{P}(Y < 25.5)$.

      $z = \dfrac{25.5 - 36}{6} = -1.75$, and $\Phi(-1.75) = 1 - 0.9599 = 0.0401$.

      Forgetting the correction gives $z = -1.83$ and $0.0336$, a very different answer.

  - id: pq-single-value
    format: numeric
    difficulty: 3
    objectives: ["6.1.5"]
    prompt: |-
      $X \sim \text{Po}(25)$. Estimate $\text{P}(X = 20)$ using a normal approximation with a continuity correction. Give your answer to 4 decimal places.
    fields:
      - answer: 0.0484
        tolerance: { abs: 0.0003 }
    explanation: |-
      $Y \sim \text{N}(25, 25)$, so $\sigma = 5$. The value 20 is the bar from $19.5$ to $20.5$.

      $z = \dfrac{19.5 - 25}{5} = -1.1$ and $z = \dfrac{20.5 - 25}{5} = -0.9$.

      $\text{P} = \Phi(-0.9) - \Phi(-1.1) = 0.1841 - 0.1357 = 0.0484$.

  - id: pq-spot-continuity
    format: spot-error
    difficulty: 3
    objectives: ["6.1.5"]
    prompt: |-
      A student estimates $\text{P}(X \leqslant 20)$ for $X \sim \text{Po}(30)$. Which line contains the first error?
    lines:
      - |-
        $X \sim \text{Po}(30)$, so use $Y \sim \text{N}(30, 30)$ with $\sigma = \sqrt{30} = 5.48$.
      - |-
        20 is the largest value allowed, so use $\text{P}(Y \leqslant 20)$.
      - |-
        $z = \dfrac{20 - 30}{5.48} = -1.82$.
      - |-
        $\Phi(-1.82) = 0.0344$, so $\text{P}(X \leqslant 20) \approx 0.0344$.
    errorLine: 2
    fix: |-
      20 is included, so go to the top of its bar: $\text{P}(Y < 20.5)$. Then $z = \dfrac{20.5 - 30}{5.48} = -1.73$ and $\Phi(-1.73) = 0.0418$.
    explanation: |-
      Line 1 is right: a Poisson's mean and variance are both $\lambda$, so $\sigma = \sqrt{30}$. Line 2 forgets the continuity correction, and everything after it inherits the mistake.

  - id: pq-why-continuity
    format: explain
    difficulty: 2
    objectives: ["6.1.5"]
    prompt: |-
      Explain why a continuity correction is needed when a normal distribution approximates a Poisson distribution, and give the corrected form of $\text{P}(X \leqslant 12)$.
    model: |-
      The Poisson variable $X$ is discrete: it takes whole-number values, each with its own probability. The normal variable $Y$ is continuous, so the probability of any single exact value is zero. Each whole number $r$ is therefore represented by the interval from $r - 0.5$ to $r + 0.5$. $\text{P}(X \leqslant 12)$ includes 12, so the continuous region must go up to the top of 12's interval: $\text{P}(Y < 12.5)$.
    keyPoints:
      - X is discrete (whole numbers); Y is continuous, so P(Y = 12) = 0
      - Each whole number r is represented by the interval from r − 0.5 to r + 0.5
      - P(X ≤ 12) becomes P(Y < 12.5)
    explanation: |-
      The correction turns each whole-number count into the strip of width 1 it stands for. Since 12 is included in $\text{P}(X \leqslant 12)$, the continuous region runs up to 12.5.
