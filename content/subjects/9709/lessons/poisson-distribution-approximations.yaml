id: poisson-distribution-approximations
subject: "9709"
topic: "6.1"
title: Poisson as an approximation, and the normal approximation
summary: When a binomial becomes a Poisson, and when a Poisson becomes normal - including the continuity correction.
order: 3
minutes: 10
kind: core
objectives: ["6.1.4", "6.1.5"]
prerequisites: ["poisson-distribution-mean-variance-events"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026-2027), topic 6.1, outcomes "Use the Poisson distribution as an
    approximation to the binomial distribution where appropriate" (6.1.4) and "Use the
    normal distribution, with continuity correction, as an approximation to the Poisson
    distribution where appropriate" (6.1.5). The syllabus guidance supplies both rules of
    thumb used here: n > 50 and np < 5 for the binomial-to-Poisson step, and lambda > 15
