id: series-binomial-expansion
subject: "9709"
topic: "1.6"
title: The binomial expansion of (a + b)ⁿ
summary: Expand (a + b)ⁿ for a positive integer n using Pascal's triangle or the binomial coefficients ⁿCᵣ = n!/(r!(n − r)!).
