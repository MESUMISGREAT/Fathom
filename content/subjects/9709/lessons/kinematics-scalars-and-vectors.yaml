id: kinematics-scalars-and-vectors
subject: "9709"
topic: "4.2"
title: "Distance, displacement, speed and velocity"
summary: "Scalars and vectors in one dimension: why a round trip can have zero displacement but a large distance."
order: 1
minutes: 7
kind: core
objectives: ["4.2.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Mathematics 9709 syllabus, topic 4.2
    Kinematics of motion in a straight line, learning outcome 4.2.1 (distance and speed as scalars;
    displacement, velocity and acceleration as vectors; motion in one dimension). All questions and
    examples are original. Re-checked line by line on 2026-10-29 in a separate adversarial pass by
    the same AI model. No separate reviewer model and no teacher have reviewed it.
blocks:
  - type: objective
    body: |
      By the end you can tell **scalars** from **vectors**, compute **average speed** and **average
      velocity**, and explain why a journey can have a large distance but a small (or zero)
      displacement.

  - type: explain
    title: Two runners, one finish line
    body: |
      A runner goes once around a 400 m track. Someone watching says "she ran 400 metres". Someone
      else says "she is back where she started, so she did not move at all".

      Both statements are about motion, and both can be useful. They are answering different
      questions:

      - How much ground did she cover? **400 m** — the **distance**.
      - How far is she from the start, in a particular direction? **0 m** — the **displacement**.

      Physics and mechanics keep the two ideas strictly separate, and the words tell you which one
      is meant.

  - type: definition
    term: Distance and displacement
    body: |
      **Distance** is the total length of the path travelled. It is a **scalar**: it has size but no
      direction, and it can never be negative.

      **Displacement** is the straight-line distance from the starting point to the finishing point,
      together with the direction. It is a **vector**.

      In one dimension, direction is handled by a **sign**: choose one direction as positive, and
      motion the other way has negative displacement.

  - type: diagram
    diagram: kinematics-distance-displacement
    alt: >-
      A path 12 m east, then 8 m north, then 6 m west. The blue path is marked with its three legs.
      A dashed arrow runs straight from start to finish, labelled displacement. Text shows distance
      = 26 m and displacement = 10 m, from the 6-8-10 triangle.
    caption: >-
      Distance adds up along the path; displacement is the single arrow from start to finish.

  - type: explain
    title: Speed and velocity
    body: |
      **Average speed** is distance divided by time:

      $$\text{average speed} = \frac{\text{distance}}{\text{time}}$$

      **Average velocity** is displacement divided by time:

      $$\text{average velocity} = \frac{\text{displacement}}{\text{time}}$$

      Velocity is a vector, so it carries a sign. A velocity of $-3\ \text{m s}^{-1}$ means $3\
      \text{m s}^{-1}$ in the negative direction.

      **Instantaneous** speed or velocity means the value at one particular moment. The speedometer
      in a car shows instantaneous speed.

      A useful fact: for a round trip, the displacement is zero, so the average velocity is zero —
      even though the average speed is definitely not.

  - type: example
    title: A walk with a change of direction
    problem: |
      A shopper walks $400\ \text{m}$ east, then turns round and walks $300\ \text{m}$ west. The
      whole trip takes $100\ \text{s}$. Take east as the positive direction.

      Find (a) the distance travelled, (b) the displacement, (c) the average speed and (d) the
      average velocity.
    steps:
      - |
        Distance: both legs count, whatever the direction.
        $400 + 300 = 700\ \text{m}$.
      - |
        Displacement: add the legs **with signs**.
        $+400 + (-300) = +100\ \text{m}$, so $100\ \text{m}$ east.
      - |
        Average speed $= \dfrac{700}{100} = 7.0\ \text{m s}^{-1}$.
      - |
        Average velocity $= \dfrac{+100}{100} = +1.0\ \text{m s}^{-1}$, i.e.
        $1.0\ \text{m s}^{-1}$ east.
    answer: |
      (a) $700\ \text{m}$ (b) $100\ \text{m}$ east (c) $7.0\ \text{m s}^{-1}$
      (d) $1.0\ \text{m s}^{-1}$ east

  - type: explain
    title: Acceleration
    body: |
      **Acceleration** is the rate of change of velocity:

      $$a = \frac{v - u}{t}$$

      where $u$ is the velocity at the start of the interval and $v$ at the end.

      Acceleration is a **vector**. In one dimension its sign tells you whether it points along the
      positive direction or against it.

      That gives a result people often find strange: when a car is **slowing down** while moving in
      the positive direction, its acceleration is **negative**. Negative acceleration is not a
      special kind of motion — it just points the other way.

      Confusingly, a negative acceleration can also make a particle **speed up**, if the particle is
      already moving in the negative direction. The test is not the sign of $a$ on its own, but
      whether $a$ and $v$ have the **same sign** (speeding up) or **opposite signs** (slowing down).

  - type: misconceptions
    items:
      - wrong: "Displacement and distance are the same thing."
        right: >-
          Distance is the total path length (scalar); displacement is the straight-line change in
          position with direction (vector). They are equal only for motion in a straight line
          without reversing.
      - wrong: "Velocity and speed are interchangeable."
        right: >-
          Speed is the magnitude of velocity. Average velocity uses displacement; average speed uses
          distance, so they can differ a lot.
      - wrong: "Negative acceleration always means slowing down."
        right: >-
          It means acceleration points in the negative direction. A particle moving in the negative
          direction with negative acceleration is speeding up.
      - wrong: "Displacement cannot be negative."
        right: >-
          Displacement has a sign that depends on the direction you chose as positive; distance
          cannot be negative.

  - type: exam
    body: |
      Read the words carefully: "speed" wants distance over time; "velocity" wants displacement over
      time, with a direction or a sign.

      When a question says "find the displacement", give a **direction** as well as a size (for
      example, "$12\ \text{m}$ to the left"), or state your positive direction and give a signed
      number.

      For an average velocity over an interval, use the **net** displacement, even if the particle
      turned round inside the interval.

  - type: check
    title: Check yourself
    questions: [shopper-journey, round-trip-mcq]

  - type: check
    title: Speed against velocity
    questions: [lap-speed-velocity, scalar-vector-cloze]

  - type: check
    title: Acceleration signs
    questions: [deceleration-direction, define-displacement]

  - type: takeaways
    items:
      - Distance and speed are scalars; displacement, velocity and acceleration are vectors.
      - "Average velocity = displacement ÷ time; average speed = distance ÷ time."
      - In one dimension, direction is a sign; a round trip has zero displacement and zero average velocity.
      - Acceleration is the rate of change of velocity; slowing down means $a$ and $v$ have opposite signs.

questions:
  - id: shopper-journey
    format: numeric
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      A shopper walks $400\ \text{m}$ east, then $300\ \text{m}$ west, taking $100\ \text{s}$ in
      total. Take east as positive.

      Find the distance, the displacement, the average speed and the average velocity.
    fields:
      - label: "distance (m)"
        answer: 700
        tolerance: { abs: 0.5 }
      - label: "displacement (m)"
        answer: 100
        tolerance: { abs: 0.5 }
      - label: "average speed (m s⁻¹)"
        answer: 7
        tolerance: { abs: 0.05 }
      - label: "average velocity (m s⁻¹)"
        answer: 1
        tolerance: { abs: 0.05 }
    explanation: |
      Distance $= 400 + 300 = 700\ \text{m}$. Displacement $= +400 - 300 = +100\ \text{m}$.
      Average speed $= 700/100 = 7.0\ \text{m s}^{-1}$; average velocity $= 100/100 =
      1.0\ \text{m s}^{-1}$ east.

  - id: round-trip-mcq
    format: mcq
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      A runner completes exactly one lap of a circular track and stops at the starting point. Which
      statement is correct?
    options:
      - text: "The displacement is zero and the average velocity is zero, but the distance is not zero."
        correct: true
        why: "Correct: the runner returns to the start, so displacement (and average velocity) is zero while the path length is not."
      - text: "The displacement is zero, so the distance must also be zero."
        why: "Distance counts the whole path; returning to the start does not undo the ground covered."
      - text: "The average speed is zero because the displacement is zero."
        why: "Average speed uses distance, which is the full circumference divided by the time."
      - text: "The average velocity equals the average speed."
        why: "They are equal only when motion is in one direction without reversing; here one is zero."
    explanation: |
      Displacement measures the change in position; after a full lap it is zero. Distance is the
      circumference, so average speed is not zero.

  - id: lap-speed-velocity
    format: numeric
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      A runner completes one lap of a $400\ \text{m}$ track in $50\ \text{s}$ and stops where she
      started.

      Find her average speed and her average velocity.
    fields:
      - label: "average speed (m s⁻¹)"
        answer: 8
        tolerance: { abs: 0.05 }
      - label: "average velocity (m s⁻¹)"
        answer: 0
        tolerance: { abs: 0.01 }
    explanation: |
      Average speed $= \dfrac{400}{50} = 8.0\ \text{m s}^{-1}$. The displacement is zero because she
      returns to the start, so the average velocity is $0$.

  - id: scalar-vector-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      Speed is a **{{1}}** because it has no direction, while velocity is a **{{2}}** because it
      does.
    blanks:
      - accept: ["scalar", "scalar quantity"]
      - accept: ["vector", "vector quantity"]
    explanation: |
      Speed is the magnitude of velocity; velocity carries a direction (or a sign in one
      dimension).

  - id: deceleration-direction
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      A car is moving in the positive direction and slowing down. What is the direction of its
      acceleration?
    options:
      - text: "In the negative direction, opposite to the velocity."
        correct: true
        why: "Correct: slowing down means acceleration opposes velocity, so here it is negative."
      - text: "In the positive direction, the same as the velocity."
        why: "That would make the car speed up, not slow down."
      - text: "Zero, because the car is slowing down."
        why: "A changing velocity always means non-zero acceleration."
      - text: "It has no direction, because acceleration is a scalar."
        why: "Acceleration is a vector, so it always has a direction."
    explanation: |
      The car's velocity is positive and decreasing, so the change in velocity is negative;
      acceleration is negative, i.e. directed opposite to the motion.

  - id: define-displacement
    format: text
    style: definition
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      State what is meant by the **displacement** of a particle.
    accept:
      - "the distance from the starting point in a given direction"
      - "the straight line distance from the start to the finish in a given direction"
      - "the change in position of the particle"
      - "distance moved in a specified direction"
      - "the vector from the starting position to the final position"
    model: |
      The straight-line distance from the starting point to the finishing point, together with the
      direction: the change in position, a vector quantity.
    explanation: |
      Displacement is about the change in position, not the length of the path travelled.
