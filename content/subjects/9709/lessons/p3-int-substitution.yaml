id: p3-int-substitution
subject: '9709'
topic: '3.5'
title: 'Integration by substitution: obey the given u'
summary: The question tells you what u is. Change variable, integrate the easy thing in u, and convert back — or
  convert the limits first for definite integrals.
order: 6
minutes: 9
kind: core
objectives:
- 3.5.6
prerequisites:
- p3-int-f-prime-over-f
- p3-int-standard-integrals
