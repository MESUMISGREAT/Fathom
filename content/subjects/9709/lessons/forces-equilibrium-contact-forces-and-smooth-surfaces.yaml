id: forces-equilibrium-contact-forces-and-smooth-surfaces
subject: "9709"
topic: "4.1"
title: Contact forces and smooth surfaces
summary: Separate contact force into normal reaction and friction, and use the smooth-contact model correctly.
order: 4
minutes: 8
kind: core
objectives: ["4.1.4", "4.1.5"]
prerequisites: ["forces-equilibrium-forces-and-force-diagrams"]
