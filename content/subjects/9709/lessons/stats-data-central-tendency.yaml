id: stats-data-central-tendency
subject: "9709"
topic: "5.1"
title: Measures of central tendency and variation
summary: Understand and use mean, median, mode, range, interquartile range, and standard deviation to summarise and compare data sets.
order: 3
minutes: 10
kind: core
objectives: ["5.1.3"]
prerequisites: ["stats-data-drawing-displays"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 5.1 outcome "Understand and use different measures of
    central tendency (mean, median, mode) and of variation (range, interquartile range,
    standard deviation)." All examples, questions and diagrams are original. Validated for accuracy and syllabus alignment. Independent review recomputed every worked figure (Σx = 148, Σx² = 2396, σ = 6.07; Q₁ = 8, Q₃ = 18, IQR = 10) and all five answer keys, confirmed the 9709 population-SD convention is stated explicitly, and narrowed an over-strong claim that the mode is the only measure for all non-numeric data to label (nominal) data.
blocks:
  - type: objective
    body: |-
      By the end you can calculate and interpret the mean, median, mode, range,
      interquartile range, and standard deviation for raw and grouped data,
      and use them to compare two or more data sets.

  - type: definition
    term: Central tendency
    body: |-
      A single value that represents the "centre" or "typical value" of a data set.
      The three common measures are **mean** (arithmetic average), **median** (middle value),
      and **mode** (most frequent value).

  - type: definition
    term: Variation (dispersion)
    body: |-
      A measure of how spread out the data values are. Common measures are **range**
      (max − min), **interquartile range** (Q₃ − Q₁), and **standard deviation**
      (root-mean-square deviation from the mean).

  - type: explain
    title: Mean (arithmetic mean)
    body: |-
      For raw data x₁, x₂, …, xₙ:
      **Mean = Σx / n**

      For grouped data with class midpoints xᵢ and frequencies fᵢ:
      **Mean = Σfᵢxᵢ / Σfᵢ**

      The mean uses every value, so it is sensitive to outliers. It is the only measure
      that can be used in further algebraic calculations (e.g. combining data sets).

  - type: example
    title: "Example 1: mean from raw data"
    problem: |-
      Find the mean of: 4, 7, 8, 10, 12, 13, 14, 15, 18, 22, 25
    steps:
      - |-
        Sum = 4+7+8+10+12+13+14+15+18+22+25 = 148.
      - |-
        n = 11.
      - |-
        Mean = 148 / 11 ≈ 13.45.
    answer: "13.45 (to 2 d.p.)"

  - type: check
    questions: [sc-mean-raw]

  - type: explain
    title: Median
    body: |-
      The **median** is the middle value when the data is ordered.
      - If n is odd: median = value at position (n+1)/2.
      - If n is even: median = average of values at positions n/2 and n/2 + 1.

      For grouped data, the median is estimated using linear interpolation on the cumulative
      frequency graph (see lesson 5.1.4) or the formula:
      **Median = L + ((n/2 − CF) / f) × w**
      where L = lower boundary of median class, CF = cumulative frequency before median class,
      f = frequency of median class, w = class width.

      The median is resistant to outliers.

  - type: example
    title: "Example 2: median from raw data"
    problem: |-
      Find the median of: 4, 7, 8, 10, 12, 13, 14, 15, 18, 22, 25
    steps:
      - |-
        n = 11 (odd). Position = (11+1)/2 = 6th value.
      - |-
        Ordered data: 4, 7, 8, 10, 12, **13**, 14, 15, 18, 22, 25.
      - |-
        Median = 13.
    answer: "13"

  - type: check
    questions: [sc-median-raw]

  - type: explain
    title: Mode
    body: |-
      The **mode** is the value that occurs most frequently.
      - A data set can have **no mode** (all values occur once), **one mode** (unimodal),
        or **multiple modes** (bimodal, trimodal, etc.).
      - For grouped data, the **modal class** is the class with the highest frequency.
        The mode can be estimated by interpolation, but this is rarely required.

      The mode is the only measure of central tendency that works for data which are simply
      **labels** (nominal data): you cannot add labels, so there is no mean, and they have no
      natural order, so there is no median.

  - type: example
    title: "Example 3: mode"
    problem: |-
      Find the mode of: 4, 7, 8, 10, 12, 13, 13, 14, 15, 18, 22, 25
    steps:
      - |-
        13 occurs twice; all others occur once.
      - |-
        Mode = 13.
    answer: "13"

  - type: check
    questions: [sc-mode]

  - type: explain
    title: Range
    body: |-
      **Range = Maximum − Minimum**
      Uses only the two extreme values. Very sensitive to outliers.

  - type: explain
    title: Interquartile range (IQR)
    body: |-
      **IQR = Q₃ − Q₁**
      Uses the middle 50% of the data. Resistant to outliers.
      Q₁ is the median of the lower half; Q₃ is the median of the upper half.
      (If n is odd, exclude the overall median from both halves; if even, split exactly in half.)

  - type: example
    title: "Example 4: range and IQR"
    problem: |-
      Data: 4, 7, 8, 10, 12, 13, 14, 15, 18, 22, 25
      Find the range and IQR.
    steps:
      - |-
        Range = 25 − 4 = 21.
      - |-
        n = 11. Median = 13 (6th value).
      - |-
        Lower half: 4, 7, 8, 10, 12 → Q₁ = 8.
      - |-
        Upper half: 14, 15, 18, 22, 25 → Q₃ = 18.
      - |-
        IQR = 18 − 8 = 10.
    answer: "Range = 21, IQR = 10"

  - type: check
    questions: [sc-range-iqr]

  - type: explain
    title: Standard deviation
    body: |-
      The **standard deviation** (σ for population, s for sample) measures the typical
      distance of values from the mean. It uses every data point.

      **Population formula (when data = entire population):**
      σ = √[ Σ(x − μ)² / n ] = √[ Σx²/n − μ² ]

      **Sample formula (when data = sample from a larger population):**
      s = √[ Σ(x − x̄)² / (n−1) ] = √[ (Σx² − n·x̄²) / (n−1) ]

      In A Level exams, **always use the population formula** unless the question explicitly
      says "sample" and asks for the sample standard deviation. The syllabus uses σ notation
      and expects the population version.

      For grouped data with midpoints xᵢ and frequencies fᵢ:
      σ = √[ Σfᵢ(xᵢ − μ)² / Σfᵢ ] = √[ Σfᵢxᵢ²/Σfᵢ − μ² ]

      **Coded data:** If data is coded as u = (x − a)/b, then:
      - Mean of x: μₓ = a + b·μᵤ
      - SD of x: σₓ = |b|·σᵤ

  - type: example
    title: "Example 5: standard deviation from raw data"
    problem: |-
      Find the standard deviation of: 4, 7, 8, 10, 12, 13, 14, 15, 18, 22, 25
    steps:
      - |-
        n = 11, Σx = 148, μ = 148/11 ≈ 13.4545.
      - |-
        Σx² = 16+49+64+100+144+169+196+225+324+484+625 = 2396.
      - |-
        σ² = Σx²/n − μ² = 2396/11 − (148/11)² = 217.818... − 181.024... = 36.794...
      - |-
        σ = √36.794... ≈ 6.066.
    answer: "6.07 (to 2 d.p.)"

  - type: check
    questions: [sc-sd-raw]

  - type: explain
    title: Comparing data sets
    body: |-
      Use measures of central tendency **and** variation together:
      - **Centre**: compare means (or medians if skewed/outliers).
      - **Spread**: compare standard deviations (or IQRs if outliers).
      - **Shape**: mean > median → right skew; mean < median → left skew; mean ≈ median → symmetric.
      - Always interpret in context: "Class A has a higher mean but also a larger spread,
        so while they scored higher on average, their performance was less consistent."

  - type: takeaways
    items:
      - "Mean = Σx/n (raw) or Σfx/Σf (grouped). Uses all data; sensitive to outliers."
      - "Median = middle value (ordered). Resistant to outliers. For grouped data, interpolate."
      - "Mode = most frequent value. Can be none, one, or many. Modal class for grouped data."
      - "Range = max − min. IQR = Q₃ − Q₁ (middle 50%). IQR resistant to outliers."
      - "Standard deviation = √[Σ(x−μ)²/n] (population). Uses all data; sensitive to outliers."
      - "Coded data: μₓ = a + b·μᵤ, σₓ = |b|·σᵤ."
      - "Compare data sets using both centre and spread; interpret in context."

questions:
  - id: sc-mean-raw
    format: numeric
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: "Find the mean of the data set 5, 8, 9, 12, 16."
    fields:
      - answer: 10
    explanation: |
      Mean = (5 + 8 + 9 + 12 + 16) / 5 = 50 / 5 = 10.

  - id: sc-median-raw
    format: numeric
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: "Find the median of 3, 7, 9, 12, 15, 18."
    fields:
      - answer: 10.5
    explanation: |
      n = 6 (even), so median = average of 3rd and 4th values = (9 + 12) / 2 = 10.5.

  - id: sc-mode
    format: mcq
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: "What is the mode of the data set: 2, 5, 5, 7, 9, 9, 9, 11?"
    options:
      - text: "5"
        why: 5 appears twice, but 9 appears three times.
        correct: false
      - text: "7"
        why: 7 appears once.
        correct: false
      - text: "9"
        why: 9 appears three times, more than any other value.
        correct: true
      - text: "No mode"
        why: There is a clear mode (9).
        correct: false
    explanation: |
      The mode is the value that occurs most frequently. In this data set, 9 appears three times, which is more than any other value.

  - id: sc-range-iqr
    format: numeric
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: "For the data 2, 4, 6, 8, 10, 12, 14, find the IQR."
    fields:
      - answer: 8
    explanation: |
      n = 7. Median = 8 (4th value). Lower half: 2, 4, 6 → Q₁ = 4. Upper half: 10, 12, 14 → Q₃ = 12. IQR = 12 - 4 = 8.

  - id: sc-sd-raw
    format: numeric
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: "Find the population standard deviation of 2, 4, 4, 4, 5, 5, 7, 9. Give your answer to 2 decimal places."
    fields:
      - answer: 2
        tolerance: { abs: 0.01 }
    explanation: |
      n = 8. Mean = (2+4+4+4+5+5+7+9)/8 = 40/8 = 5. Variance = [(2-5)²+3×(4-5)²+2×(5-5)²+(7-5)²+(9-5)²]/8 = [9+3+0+4+16]/8 = 32/8 = 4. SD = √4 = 2.