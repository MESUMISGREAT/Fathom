blocks:
  - type: objective
    body: |
      By the end you can use a **velocity–time graph** to find **acceleration** from the gradient and
      **displacement** from the area, including when part of the graph lies below the time axis.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\Delta$ | a change in, so $\Delta v$ means "the change in $v$" |

  - type: explain
    title: One graph, two questions
    body: |
      A velocity–time graph answers two different questions, and examiners test both.

      - **How fast is the velocity changing?** That is the **gradient**: acceleration.
      - **How far has the particle moved?** That is the **area** between the graph and the time
        axis: displacement.

      Why area? Because displacement is velocity multiplied by time, and on the graph that product
      is literally a rectangle's area. Curved or slanted boundaries just mean adding up many thin
      rectangles, which is exactly integration.

  - type: definition
    term: Velocity–time graph facts
    body: |
      - **Gradient** $= \dfrac{\Delta v}{\Delta t} =$ **acceleration**.
      - **Area** between the graph and the time axis $=$ **displacement**.
      - Area **below** the axis counts as **negative** displacement, because the velocity is
        negative there.
      - **Total distance** is the sum of the **sizes** of all the areas, ignoring signs.

  - type: explain
    title: What the shapes mean
    body: |
      | Feature of the graph | What it means |
      | --- | --- |
      | Horizontal line | constant velocity, so $a = 0$ |
      | Straight line sloping up | constant positive acceleration |
      | Straight line sloping down | constant negative acceleration |
      | Crossing the time axis | the particle reverses direction |
      | Touching the time axis | the particle is momentarily at rest |
      | Curve | changing acceleration |

      Do not confuse this with the displacement–time graph. There, a horizontal line meant "at
      rest"; here it means "moving at a steady speed".

  - type: diagram
    diagram: kinematics-vt-area
    alt: >-
      A velocity-time graph rising from 0 to 10 m/s in 4 s, staying at 10 m/s until 10 s, then
      falling to 0 at 12 s. The area beneath the graph is shaded and labelled area = 90 m, with the
      trapezium calculation one half times 12 plus 6 times 10 equals 90 m.
    caption: >-
      The shaded area is a trapezium: half the sum of the parallel sides times the height.

  - type: example
    title: Accelerate, cruise, brake
    problem: |
      A train accelerates uniformly from rest to $12\ \text{m s}^{-1}$ in $3\ \text{s}$, travels at
      a constant $12\ \text{m s}^{-1}$ for $5\ \text{s}$, then decelerates uniformly to rest in
      $4\ \text{s}$.

      Find (a) the acceleration in each stage, (b) the total displacement, (c) the total distance.
    steps:
      - |
        First stage: $a = \dfrac{12 - 0}{3} = 4\ \text{m s}^{-2}$.
      - |
        Second stage: $a = \dfrac{12 - 12}{5} = 0$.
      - |
        Third stage: $a = \dfrac{0 - 12}{4} = -3\ \text{m s}^{-2}$.
      - |
        Areas: triangle $\tfrac{1}{2}(3)(12) = 18\ \text{m}$; rectangle $5 \times 12 = 60\ \text{m}$;
        triangle $\tfrac{1}{2}(4)(12) = 24\ \text{m}$.
      - |
        Total displacement $= 18 + 60 + 24 = 102\ \text{m}$. The velocity never goes negative, so the
        distance is also $102\ \text{m}$.
    answer: |
      (a) $4\ \text{m s}^{-2}$, $0$, $-3\ \text{m s}^{-2}$ (b) $102\ \text{m}$ (c) $102\ \text{m}$

  - type: explain
    title: When the graph dips below the axis
    body: |
      Suppose a ball is thrown straight up at $20\ \text{m s}^{-1}$, taking $g = 10\ \text{m s}^{-2}$.
      Its velocity is $v = 20 - 10t$, so the graph is a straight line through $v = 0$ at $t = 2\
      \text{s}$ and $v = -20$ at $t = 4\ \text{s}$.

      - From $t = 0$ to $2$: area $= \tfrac{1}{2}(2)(20) = +20\ \text{m}$ (going up).
      - From $t = 2$ to $4$: area $= \tfrac{1}{2}(2)(-20) = -20\ \text{m}$ (coming back down).

      **Displacement** at $t = 4$ is $20 - 20 = 0$: the ball is back at the start.

      **Distance** travelled is $20 + 20 = 40\ \text{m}$: it really did go up and come back.

      This is the classic trap. A negative area is not a mistake in the arithmetic; it is the
      particle moving in the negative direction.

  - type: misconceptions
    items:
      - wrong: "The area under a velocity–time graph is the distance travelled."
        right: >-
          It is the **displacement**, signed. The distance is the sum of the sizes of the areas, so
          the two agree only if the velocity never changes sign.
      - wrong: "A horizontal velocity–time line means the particle is stationary."
        right: >-
          It means constant velocity. The particle is stationary only where the graph is **on** the
          axis.
      - wrong: "Where the graph crosses the time axis, the particle stops."
        right: >-
          It is momentarily at rest at that instant, then continues in the opposite direction.
      - wrong: "Negative acceleration means the particle is moving backwards."
        right: >-
          Negative acceleration means the acceleration points in the negative direction. Whether the
          particle moves backwards depends on the sign of its velocity.

  - type: exam
    body: |
      Always say which question you are answering: gradient for acceleration, area for displacement.

      Split the area into triangles, rectangles and trapezia and show the arithmetic. For a
      trapezium, $\tfrac{1}{2}(a + b)h$ is quicker and safer than three separate pieces.

      If part of the graph is below the axis, state clearly that this area is negative when finding
      displacement, and that you are taking the size of it when finding distance.

  - type: check
    title: Check yourself
    questions: [acceleration-gradient, displacement-area]

  - type: check
    title: Signed areas
    questions: [negative-area-distance, crossing-axis]

  - type: check
    title: Spot the slip
    questions: [area-sign-error, area-cloze]

  - type: takeaways
    items:
      - Gradient of a velocity–time graph = acceleration.
      - Area between the graph and the time axis = displacement, with areas below the axis negative.
      - Distance = sum of the sizes of all the areas.
      - Crossing the axis means the particle reverses direction; at the crossing it is momentarily at rest.

questions:
  - id: acceleration-gradient
    format: numeric
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      A particle's velocity falls from $12\ \text{m s}^{-1}$ to $4\ \text{m s}^{-1}$ in $4\ \text{s}$
      at a constant rate.

      Find its acceleration.
    fields:
      - answer: -2
        tolerance: { abs: 0.05 }
        unit: m s⁻²
    explanation: |
      Acceleration is the gradient:
      $\dfrac{4 - 12}{4} = -2\ \text{m s}^{-2}$.

  - id: displacement-area
    format: numeric
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      A train accelerates uniformly from rest to $12\ \text{m s}^{-1}$ in $3\ \text{s}$, travels at
      $12\ \text{m s}^{-1}$ for $5\ \text{s}$, then decelerates uniformly to rest in $4\ \text{s}$.

      Find the total displacement.
    fields:
      - answer: 102
        tolerance: { abs: 0.5 }
        unit: m
    explanation: |
      Areas: $\tfrac{1}{2}(3)(12) = 18$, $5(12) = 60$, $\tfrac{1}{2}(4)(12) = 24$. Total
      $= 18 + 60 + 24 = 102\ \text{m}$.

  - id: negative-area-distance
    format: numeric
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      A trolley moves at $+10\ \text{m s}^{-1}$ for $2\ \text{s}$, then at $-10\ \text{m s}^{-1}$ for
      $2\ \text{s}$.

      Find its final displacement and the total distance travelled.
    fields:
      - label: "displacement (m)"
        answer: 0
        tolerance: { abs: 0.01 }
      - label: "distance (m)"
        answer: 40
        tolerance: { abs: 0.5 }
    explanation: |
      Displacement is the signed area: $10(2) + (-10)(2) = 20 - 20 = 0$. Distance uses the sizes:
      $20 + 20 = 40\ \text{m}$.

  - id: crossing-axis
    format: mcq
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      A velocity–time graph crosses the time axis at $t = 5\ \text{s}$. What happens at that
      instant?
    options:
      - text: "The particle is momentarily at rest and then reverses direction."
        correct: true
        why: "Correct: v = 0 at the crossing, and the velocity changes sign afterwards."
      - text: "The particle stops permanently."
        why: "The graph continues past the axis, so the velocity becomes negative rather than staying zero."
      - text: "The particle has returned to its starting point."
        why: "Returning to the start needs zero net area, which is not the same as v = 0."
      - text: "The acceleration becomes zero."
        why: "The acceleration is the gradient, which need not be zero where the graph crosses the axis."
    explanation: |
      Crossing the axis means $v = 0$ at that instant, so the particle stops briefly and then moves
      the other way.

  - id: area-sign-error
    format: spot-error
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      A student uses a velocity–time graph to find a displacement. One line is wrong.
    lines:
      - |
        A particle has velocity $6\ \text{m s}^{-1}$ from $t = 0$ to $t = 3\ \text{s}$, then
        $-4\ \text{m s}^{-1}$ from $t = 3$ to $t = 5\ \text{s}$.
      - |
        The displacement is $6(3) + 4(2) = 26\ \text{m}$.
      - |
        The distance travelled is $6(3) + 4(2) = 26\ \text{m}$.
    errorLine: 2
    fix: |
      Displacement $= 6(3) + (-4)(2) = 18 - 8 = 10\ \text{m}$. The value $26\ \text{m}$ is the
      distance travelled.
    explanation: |
      The second area lies below the time axis, so it counts as negative displacement. For distance,
      take the size of each area, which does give $26\ \text{m}$.

  - id: area-cloze
    format: cloze
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      On a velocity–time graph, the area between the graph and the time axis represents
      **{{1}}**, while the gradient of the graph represents **{{2}}**.
    blanks:
      - accept: ["displacement"]
      - accept: ["acceleration"]
    explanation: |
      Area gives displacement (signed); gradient gives acceleration.
