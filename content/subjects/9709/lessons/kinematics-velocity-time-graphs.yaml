id: kinematics-velocity-time-graphs
subject: "9709"
topic: "4.2"
title: "Reading a velocity–time graph"
summary: "Gradient gives acceleration, area gives displacement, and area below the axis counts as negative."
order: 3
minutes: 8
kind: core
objectives: ["4.2.2"]
prerequisites: ["kinematics-displacement-time-graphs"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Mathematics 9709 syllabus, topic 4.2
    Kinematics of motion in a straight line, learning outcome 4.2.2 (interpret velocity-time graphs;
    the gradient represents acceleration and the area represents displacement). All questions and
