id: p1-differentiation-stationary-points
subject: "9709"
topic: "1.7"
title: Stationary points and their nature
summary: Find where a curve is flat (gradient zero), then use the second derivative to say whether each point is a maximum or a minimum. Five steps, the same every time.
order: 7
minutes: 5
kind: core
objectives: ["1.7.4"]
prerequisites: [p1-differentiation-increasing-decreasing]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.7 learning outcome "locate stationary
    points and determine their nature", including use of the second derivative to identify
    maxima and minima (other methods allowed where a question does not specify one). Points of
    inflexion are excluded by the syllabus and are only mentioned as "neither". All examples and
    questions are original; all arithmetic checked in Python. Not yet teacher-reviewed.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
    Rewritten on 2026-10-23 at the student's request in a one-question-type, one-method style; needs a fresh independent review.

blocks:
  - type: objective
    body: |-
      By the end you can answer *"find the stationary points and determine their nature"*: give each point's coordinates and say whether it's a **maximum** or a **minimum**.

  - type: explain
    title: What they ask
    body: |-
      A typical question: *Find the coordinates of the stationary points of $y = 2x^3 - 3x^2 - 12x + 7$, and determine their nature.*

      Giveaway words: **stationary point**, **turning point**, **determine the nature**, **maximum point**, **minimum point**.

      A **stationary point** is where the curve is flat for a moment, so the gradient is zero: $\dfrac{dy}{dx} = 0$.

      - A **maximum** is the top of a hill.
      - A **minimum** is the bottom of a valley.
      - "Nature" just means: which one is it?

  - type: explain
    title: The method
    body: |-
      The same five steps every time:

      1. Differentiate: find $\dfrac{dy}{dx}$.
      2. Solve: set $\dfrac{dy}{dx} = 0$ and find the $x$-values.
      3. **Find y: put each $x$ into the original equation, not the derivative.**
      4. Differentiate again: find $\dfrac{d^2y}{dx^2}$ and put each $x$ in.
      5. Decide: negative means **maximum**, positive means **minimum**.

      Memory hook for step 5: negative is a frown ∩ (a hilltop). Positive is a smile ∪ (a valley).

  - type: diagram
    diagram: p1-differentiation-stationary-points
    alt: >-
      Graph of y = x³ − 3x + 2 on a grid. The curve rises to a maximum point at (−1, 4), falls to a
      minimum point at (1, 0) where it touches the x-axis, then rises steeply. Short horizontal
      tangent lines mark both stationary points, each labelled dy/dx = 0. Labels give the sign of
      the gradient on each stretch: dy/dx > 0 on the left, dy/dx < 0 in the middle, dy/dx > 0 on the
      right. The maximum is labelled d²y/dx² = −6 < 0 and the minimum d²y/dx² = 6 > 0.
    caption: |-
      Both flat points have $\dfrac{dy}{dx} = 0$. Step 5 tells them apart: the second derivative is negative at the hilltop and positive at the valley.

  - type: example
    title: "Example 1: the easiest case"
    problem: |-
      Find the stationary point of $y = x^2 - 6x + 10$ and determine its nature.
    steps:
      - |-
        Differentiate: $\dfrac{dy}{dx} = 2x - 6$.
      - |-
        Solve: $2x - 6 = 0$, so $x = 3$.
      - |-
        Find y: $y = 3^2 - 6(3) + 10 = 1$.
      - |-
        Differentiate again: $\dfrac{d^2y}{dx^2} = 2$.
      - |-
        Decide: $2 > 0$, so it's a **minimum**.
    answer: |-
      $(3, 1)$ is a minimum point.

      Check another way: $y = (x - 3)^2 + 1$, which is smallest when $x = 3$, giving $y = 1$.

  - type: check
    questions: [nature-cloze, sp-quadratic]

  - type: example
    title: "Example 2: exam-style"
    problem: |-
      Find the coordinates of the stationary points of $y = 2x^3 - 3x^2 - 12x + 7$, and determine their nature.
    steps:
      - |-
        Differentiate: $\dfrac{dy}{dx} = 6x^2 - 6x - 12$.
      - |-
        Solve: $6x^2 - 6x - 12 = 0$. Divide by 6 and factorise: $(x - 2)(x + 1) = 0$, so $x = 2$ or $x = -1$.
      - |-
        Find y: at $x = 2$, $y = 16 - 12 - 24 + 7 = -13$. At $x = -1$, $y = -2 - 3 + 12 + 7 = 14$.
      - |-
        Differentiate again: $\dfrac{d^2y}{dx^2} = 12x - 6$.
      - |-
        Decide: at $x = 2$ it's $18 > 0$, so $(2, -13)$ is a **minimum**. At $x = -1$ it's $-18 < 0$, so $(-1, 14)$ is a **maximum**.
    answer: |-
      Maximum point $(-1, 14)$. Minimum point $(2, -13)$.

  - type: check
    questions: [max-point, nature-mcq, spot-nature]

  - type: deeper
    title: "Harder: negative powers"
    body: |-
      *Find the stationary points of $y = x + \dfrac{4}{x}$ and determine their nature.*

      Write it with powers first: $y = x + 4x^{-1}$. Then the same five steps:

      - Differentiate: $\dfrac{dy}{dx} = 1 - 4x^{-2} = 1 - \dfrac{4}{x^2}$.
      - Solve: $\dfrac{4}{x^2} = 1$, so $x^2 = 4$ and $x = 2$ or $x = -2$.
      - Find y: $y = 2 + 2 = 4$ and $y = -2 - 2 = -4$.
      - Differentiate again: $\dfrac{d^2y}{dx^2} = 8x^{-3} = \dfrac{8}{x^3}$.
      - Decide: at $x = 2$ it's $1 > 0$, a minimum $(2, 4)$. At $x = -2$ it's $-1 < 0$, a maximum $(-2, -4)$.

      Surprise: the maximum is **lower** than the minimum. That's fine, because a maximum is only the highest point **nearby**.

  - type: check
    questions: [sp-reciprocal, sp-root]

  - type: deeper
    title: When the second derivative is zero
    body: |-
      Sometimes step 4 gives $\dfrac{d^2y}{dx^2} = 0$. Then that test tells you nothing, so look at the gradient just either side instead.

      For $y = x^4$: $\dfrac{dy}{dx} = 4x^3 = 0$ at $x = 0$, and $\dfrac{d^2y}{dx^2} = 12x^2 = 0$ there too.

      - Just left, at $x = -0.1$: $\dfrac{dy}{dx} = -0.004$, negative (going down).
      - Just right, at $x = 0.1$: $\dfrac{dy}{dx} = 0.004$, positive (going up).
      - Down, flat, up: a **minimum** at $(0, 0)$.

      The sign test: $+, 0, -$ is a maximum and $-, 0, +$ is a minimum. If the question doesn't say which test to use, this one earns the marks too.

      It's also *why* step 5 works. A positive second derivative means the gradient is increasing, from $-$ to $+$, so the curve went down then up.

  - type: check
    questions: [sign-test-mcq]

  - type: misconceptions
    items:
      - wrong: |-
          Stationary points are where $y = 0$.
        right: |-
          They're where the **gradient** is zero: $\dfrac{dy}{dx} = 0$. Where $y = 0$ is just where the curve meets the $x$-axis.
      - wrong: |-
          Put the $x$-value into $\dfrac{dy}{dx}$ to get the $y$-coordinate.
        right: |-
          That always gives 0. Step 3: put $x$ into the **original** equation.
      - wrong: |-
          $\dfrac{d^2y}{dx^2} > 0$ means a maximum, because "positive is high".
        right: |-
          Positive means a ∪ shape, the bottom of a valley: a **minimum**. Negative means ∩: a maximum.
      - wrong: |-
          $\dfrac{d^2y}{dx^2} = 0$, so the point is neither a maximum nor a minimum.
        right: |-
          Not necessarily: $y = x^4$ has a minimum where $\dfrac{d^2y}{dx^2} = 0$. Use the sign test.

  - type: exam
    body: |-
      - Usually 5–6 marks, roughly one for each step.
      - Show the derivative, the factorised equation and both $x$-values.
      - Give **coordinates**: both $x$ and $y$ for each point.
      - For step 5, write the value, the sign and the conclusion: "$\dfrac{d^2y}{dx^2} = 18 > 0$, so minimum". Just "minimum" can lose the mark.
      - If the question doesn't name a method, the sign test is accepted too.

  - type: takeaways
    items:
      - |-
        The method: differentiate, solve $\dfrac{dy}{dx} = 0$, **find y from the original equation**, differentiate again, decide.
      - |-
        $\dfrac{d^2y}{dx^2} < 0$: maximum (∩). $\;\dfrac{d^2y}{dx^2} > 0$: minimum (∪).
      - |-
        If $\dfrac{d^2y}{dx^2} = 0$, check the sign of $\dfrac{dy}{dx}$ just either side.
      - |-
        Maxima and minima are local: a maximum can be lower than a minimum.

questions:
  - id: nature-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.7.4"]
    prompt: |-
      At a stationary point $\dfrac{dy}{dx} = 0$. If also $\dfrac{d^2y}{dx^2} > 0$, the stationary point is a {{1}} point.
    blanks:
      - accept: ["minimum", "min", "local minimum", "minimum turning", "turning minimum"]
    explanation: |-
      Decide (step 5): positive means a ∪ shape, the bottom of a valley, so it's a **minimum**.

      The reason: the gradient is increasing, from negative to positive, so the curve goes down then up.

  - id: sp-quadratic
    format: numeric
    difficulty: 1
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = 5 + 4x - x^2$ has one stationary point. Find its coordinates and the value of $\dfrac{d^2y}{dx^2}$ there. (Then decide its nature for yourself.)
    fields:
      - label: "x ="
        answer: 2
      - label: "y ="
        answer: 9
      - label: '$\dfrac{d^2y}{dx^2}$ ='
        answer: -2
    explanation: |-
      - Differentiate: $\dfrac{dy}{dx} = 4 - 2x$.
      - Solve: $4 - 2x = 0$, so $x = 2$.
      - Find y: $y = 5 + 8 - 4 = 9$.
      - Differentiate again: $\dfrac{d^2y}{dx^2} = -2$.
      - Decide: $-2 < 0$, so $(2, 9)$ is a **maximum**.

  - id: max-point
    format: numeric
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = x^3 - 12x + 1$ has a maximum point. Find its coordinates.
    fields:
      - label: "x ="
        answer: -2
      - label: "y ="
        answer: 17
    explanation: |-
      - Differentiate: $\dfrac{dy}{dx} = 3x^2 - 12$.
      - Solve: $3x^2 = 12$, so $x = 2$ or $x = -2$.
      - Find y: at $x = -2$, $y = -8 + 24 + 1 = 17$. At $x = 2$, $y = 8 - 24 + 1 = -15$.
      - Differentiate again: $\dfrac{d^2y}{dx^2} = 6x$.
      - Decide: at $x = -2$ it's $-12 < 0$, a maximum. At $x = 2$ it's $12 > 0$, a minimum.

      So the maximum point is $(-2, 17)$.

  - id: nature-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      $f(x) = x^3 - 6x^2 + 9x$ has stationary points at $x = 1$ and $x = 3$. Which statement about the stationary point at $x = 3$ is correct?
    explanation: |-
      - Differentiate: $f'(x) = 3x^2 - 12x + 9$.
      - Differentiate again: $f''(x) = 6x - 12$, so $f''(3) = 6$.
      - Decide: $6 > 0$, so $x = 3$ gives a minimum, at $(3, 0)$.
    options:
      - text: It is a minimum, because $f''(3) = 6 > 0$.
        correct: true
        why: |-
          Value, sign and conclusion. Positive second derivative means a ∪ shape: a minimum.
      - text: It is a maximum, because $f''(3) = 6 > 0$.
        why: |-
          Right value, wrong decision. Positive means **minimum** (∪-shaped).
      - text: It is a maximum, because $f''(3) = -6 < 0$.
        why: |-
          $f''(3) = 6(3) - 12 = 6$, not $-6$. The value $-6$ belongs to $x = 1$, which is the maximum.
      - text: It is neither, because $f(3) = 0$.
        why: |-
          The value of $f$ doesn't decide the nature. $f(3) = 0$ just means this minimum point sits on the $x$-axis.

  - id: spot-nature
    format: spot-error
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      A student finds and classifies the stationary points of $y = 2x^3 - 3x^2$. Which line contains the first error?
    lines:
      - |-
        $\dfrac{dy}{dx} = 6x^2 - 6x = 6x(x - 1)$
      - |-
        $\dfrac{dy}{dx} = 0$ gives $x = 0$ or $x = 1$; the points are $(0, 0)$ and $(1, -1)$.
      - |-
        $\dfrac{d^2y}{dx^2} = 12x - 6$
      - |-
        At $x = 0$: $\dfrac{d^2y}{dx^2} = -6 < 0$, so $(0, 0)$ is a minimum.
      - |-
        At $x = 1$: $\dfrac{d^2y}{dx^2} = 6 > 0$, so $(1, -1)$ is a minimum.
    errorLine: 4
    fix: |-
      A negative second derivative means a **maximum**: $(0, 0)$ is a maximum point.
    explanation: |-
      Lines 1–3 do differentiate, solve, find y and differentiate again correctly. Line 5 is right too.

      Line 4 is the decide step: right value, $-6$, but the wrong conclusion. Negative means ∩, a maximum.

  - id: sp-reciprocal
    format: numeric
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      Find the coordinates of the stationary point of $y = x + \dfrac{9}{x}$ for $x > 0$.
    fields:
      - label: "x ="
        answer: 3
      - label: "y ="
        answer: 6
    explanation: |-
      Write it with powers: $y = x + 9x^{-1}$.

      - Differentiate: $\dfrac{dy}{dx} = 1 - \dfrac{9}{x^2}$.
      - Solve: $x^2 = 9$, and $x > 0$, so $x = 3$.
      - Find y: $y = 3 + \dfrac{9}{3} = 6$.
      - Differentiate again: $\dfrac{d^2y}{dx^2} = \dfrac{18}{x^3} = \dfrac{18}{27}$ at $x = 3$.
      - Decide: positive, so $(3, 6)$ is a minimum.

  - id: sp-root
    format: numeric
    difficulty: 3
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = 4\sqrt{x} - x$ (for $x > 0$) has one stationary point. Find its coordinates and the value of $\dfrac{d^2y}{dx^2}$ there. (Decide its nature for yourself.)
    fields:
      - label: "x ="
        answer: 4
      - label: "y ="
        answer: 4
      - label: '$\dfrac{d^2y}{dx^2}$ ='
        answer: -0.125
    explanation: |-
      Write it with powers: $y = 4x^{\frac12} - x$.

      - Differentiate: $\dfrac{dy}{dx} = 2x^{-\frac12} - 1 = \dfrac{2}{\sqrt{x}} - 1$.
      - Solve: $\sqrt{x} = 2$, so $x = 4$.
      - Find y: $y = 4 \times 2 - 4 = 4$.
      - Differentiate again: $\dfrac{d^2y}{dx^2} = -x^{-\frac32} = -\dfrac{1}{8}$ at $x = 4$.
      - Decide: negative, so $(4, 4)$ is a **maximum**.

  - id: sign-test-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      The curve $y = 3 - x^4$ has a stationary point at $(0, 3)$, where $\dfrac{d^2y}{dx^2} = 0$. Use the sign of $\dfrac{dy}{dx}$ either side to decide its nature.
    explanation: |-
      $\dfrac{dy}{dx} = -4x^3$.

      - Just left, at $x = -0.1$: $\dfrac{dy}{dx} = 0.004$, positive (going up).
      - Just right, at $x = 0.1$: $\dfrac{dy}{dx} = -0.004$, negative (going down).
      - Up, flat, down: a **maximum**.
    options:
      - text: A maximum, because $\dfrac{dy}{dx}$ goes $+, 0, -$.
        correct: true
        why: |-
          Up, flat, down is a hilltop. $-4x^3$ is positive for negative $x$ and negative for positive $x$.
      - text: A minimum, because $\dfrac{dy}{dx}$ goes $-, 0, +$.
        why: |-
          Check the signs: at $x = -0.1$, $-4(-0.1)^3 = +0.004$. The curve goes up before $x = 0$, not down.
      - text: Neither, because $\dfrac{d^2y}{dx^2} = 0$.
        why: |-
          A zero second derivative only means that test fails. The sign test decides, and here it gives a maximum.
      - text: A maximum, because $y = 3$ is positive.
        why: |-
          Right answer, wrong reason. The value of $y$ never decides the nature; the gradient either side does.
