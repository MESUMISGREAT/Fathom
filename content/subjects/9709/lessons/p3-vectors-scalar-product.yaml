id: p3-vectors-scalar-product
subject: "9709"
topic: "3.7"
title: Scalar product — angles, perpendiculars and the foot of a perpendicular
summary: Learn the dot product (scalar product) of vectors. Use it to find angles between lines, test for perpendicularity, and find the foot of the perpendicular from a point to a line.
order: 6
minutes: 10
kind: core
objectives: ["3.7.6"]
prerequisites: [p3-vectors-line-relationships]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus (2026–2027), topic 3.7 outcome "Use formulae to calculate the scalar product
    of two vectors, and use scalar products in problems involving lines and points. For
    example, finding the angle between two lines, and finding the foot of the perpendicular
    from a point to a line; questions may involve 3D objects such as cuboids and tetrahedra
    (pyramids). Knowledge of the vector product is not required." All examples, questions
    and diagrams are original. Rewritten on 2026-10-31 for beginners (typeset maths, the
    foot-of-perpendicular method derived rather than quoted). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end you can work out the **scalar product** of two vectors, and use it to find the angle between two vectors or two lines, to test whether they are perpendicular, and to find the foot of the perpendicular from a point to a line.

  - type: explain
    title: Notation first
    body: |-
      - A **vector** has a size and a direction. We write vectors in bold: $\mathbf{a}$, $\mathbf{b}$. (By hand you underline them: $\underline{a}$.)
      - In 3D, $\mathbf{i}$, $\mathbf{j}$ and $\mathbf{k}$ are one-unit steps along the $x$-, $y$- and $z$-axes. So $\mathbf{a} = 2\mathbf{i} - 3\mathbf{j} + \mathbf{k}$ means "2 along $x$, 3 back along $y$, 1 up $z$". The same vector as a column is $\begin{pmatrix} 2 \\ -3 \\ 1 \end{pmatrix}$. The three numbers are its **components**; we'll call them $a_1, a_2, a_3$.
      - $\lvert \mathbf{a} \rvert$ is the **magnitude** (length) of $\mathbf{a}$: $\lvert \mathbf{a} \rvert = \sqrt{a_1^2 + a_2^2 + a_3^2}$, which is Pythagoras in 3D.
      - A **scalar** is an ordinary number, with no direction.

  - type: explain
    title: The scalar product
    body: |-
      The **scalar product** (also called the **dot product**) of $\mathbf{a}$ and $\mathbf{b}$ is written $\mathbf{a} \cdot \mathbf{b}$. You work it out by multiplying matching components and adding:

      $$\mathbf{a} \cdot \mathbf{b} = a_1 b_1 + a_2 b_2 + a_3 b_3.$$

      The answer is a single **number** (a scalar), not a vector. That's where the name comes from.

      It also has a geometric meaning. If $\theta$ is the angle between $\mathbf{a}$ and $\mathbf{b}$ when they are drawn from the same point (with $0 \leqslant \theta \leqslant 180^\circ$), then

      $$\mathbf{a} \cdot \mathbf{b} = \lvert \mathbf{a} \rvert \, \lvert \mathbf{b} \rvert \cos\theta.$$

      Both formulas give the same number. Putting them together is what makes the scalar product so useful: the first is easy to calculate, and the second contains the angle.

  - type: diagram
    diagram: p3-vectors-scalar-product
    alt: >-
      Two panels. Left: vectors a and b drawn from the same point with the angle θ between them marked,
      and the formula a · b = |a||b| cos θ underneath. Right: a straight line through a point A, with a
      direction vector d drawn along it from A. A point P lies off the line. A dashed line from P meets
      the line at right angles at the point F, the foot of the perpendicular; a right-angle mark is drawn
      at F. Underneath: the vector PF dotted with d equals 0.
    caption: |-
      Left: the angle $\theta$ between $\mathbf{a}$ and $\mathbf{b}$. Right: $F$ is the point on the line closest to $P$, so $\overrightarrow{PF}$ is at right angles to the line's direction $\mathbf{d}$.

  - type: intuition
    title: Why do the two formulas agree?
    body: |-
      Draw $\mathbf{a}$ and $\mathbf{b}$ from the same point. The third side of the triangle they make is $\mathbf{a} - \mathbf{b}$. The cosine rule says

      $$\lvert \mathbf{a} - \mathbf{b} \rvert^2 = \lvert \mathbf{a} \rvert^2 + \lvert \mathbf{b} \rvert^2 - 2\lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert \cos\theta.$$

      Now work out the left side with components instead: $(a_1 - b_1)^2 + (a_2 - b_2)^2 + (a_3 - b_3)^2$. The first bracket is $(a_1 - b_1)^2 = a_1^2 - 2a_1b_1 + b_1^2$, and the other two expand the same way. Collecting the squares, the total is $\lvert \mathbf{a} \rvert^2 + \lvert \mathbf{b} \rvert^2 - 2(a_1b_1 + a_2b_2 + a_3b_3)$.

      Compare the two lines: the only difference is the last term, so $a_1b_1 + a_2b_2 + a_3b_3 = \lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert \cos\theta$. That's the whole reason it works.

  - type: example
    title: "Example 1: computing a scalar product"
    problem: |-
      Find $\mathbf{a} \cdot \mathbf{b}$ for $\mathbf{a} = 2\mathbf{i} - 3\mathbf{j} + \mathbf{k}$ and $\mathbf{b} = \mathbf{i} + 4\mathbf{j} - 2\mathbf{k}$.
    steps:
      - |-
        Line up the components: $\mathbf{a} = \begin{pmatrix} 2 \\ -3 \\ 1 \end{pmatrix}$, $\mathbf{b} = \begin{pmatrix} 1 \\ 4 \\ -2 \end{pmatrix}$.
      - |-
        Multiply matching pairs: $2 \times 1 = 2$, $\;(-3) \times 4 = -12$, $\;1 \times (-2) = -2$.
      - |-
        Add: $2 - 12 - 2 = -12$.
    answer: |-
      $\mathbf{a} \cdot \mathbf{b} = -12$. A negative answer means $\cos\theta < 0$, so the angle between them is obtuse (more than $90^\circ$).

  - type: check
    questions: [vec-dot-product]

  - type: explain
    title: Finding an angle
    body: |-
      Rearrange $\mathbf{a} \cdot \mathbf{b} = \lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert \cos\theta$ by dividing both sides by $\lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert$:

      $$\cos\theta = \frac{\mathbf{a} \cdot \mathbf{b}}{\lvert \mathbf{a} \rvert \, \lvert \mathbf{b} \rvert}.$$

      The recipe:

      1. Work out $\mathbf{a} \cdot \mathbf{b}$ (multiply matching components, add).
      2. Work out both magnitudes.
      3. Divide, then use $\cos^{-1}$ on your calculator.

      **The sign tells you the type of angle.** A positive scalar product gives an acute angle, zero gives exactly $90^\circ$, and negative gives an obtuse angle.

  - type: example
    title: "Example 2: the angle between two lines"
    problem: |-
      Line $L_1$ has direction $\begin{pmatrix} 1 \\ -2 \\ 2 \end{pmatrix}$ and line $L_2$ has direction $\begin{pmatrix} 2 \\ 1 \\ -2 \end{pmatrix}$. Find the acute angle between the lines.
    steps:
      - |-
        The angle between two lines is the angle between their **direction** vectors. The position vectors (the points they pass through) play no part.
      - |-
        Scalar product: $1(2) + (-2)(1) + 2(-2) = 2 - 2 - 4 = -4$.
      - |-
        Magnitudes: $\sqrt{1 + 4 + 4} = 3$ and $\sqrt{4 + 1 + 4} = 3$.
      - |-
        $\cos\theta = \dfrac{-4}{3 \times 3} = -\dfrac{4}{9}$, so $\theta = 116.4^\circ$.
      - |-
        That's obtuse. Two crossing lines make two angles that add to $180^\circ$ (picture an X). Even when lines in 3D don't actually meet, the angle between them is defined by their directions in the same way. So the acute one is $180^\circ - 116.4^\circ = 63.6^\circ$.
    answer: |-
      $63.6^\circ$ (to 1 d.p.). Shortcut: use $\lvert \mathbf{a} \cdot \mathbf{b} \rvert$, ignoring the minus sign, and you get the acute angle straight away: $\cos^{-1}\tfrac49 = 63.6^\circ$.

  - type: check
    questions: [vec-angle]

  - type: explain
    title: The perpendicular test
    body: |-
      Two vectors are **perpendicular** (at right angles) when $\theta = 90^\circ$. Since $\cos 90^\circ = 0$, the formula gives $\mathbf{a} \cdot \mathbf{b} = \lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert \times 0 = 0$.

      So, for non-zero vectors:

      $$\mathbf{a} \perp \mathbf{b} \quad \Longleftrightarrow \quad \mathbf{a} \cdot \mathbf{b} = 0.$$

      ($\perp$ means "is perpendicular to", and $\Longleftrightarrow$ means "exactly when".) No angle or magnitude needed: just check whether the scalar product is zero. Two lines are perpendicular when their direction vectors are.

  - type: example
    title: "Example 3: finding a constant"
    problem: |-
      Line $L_1$ has direction $\begin{pmatrix} 2 \\ k \\ 1 \end{pmatrix}$ and line $L_2$ has direction $\begin{pmatrix} 1 \\ -2 \\ 3 \end{pmatrix}$. Find $k$ given that the lines are perpendicular.
    steps:
      - |-
        Perpendicular, so the scalar product of the directions is zero: $2(1) + k(-2) + 1(3) = 0$.
      - |-
        Simplify: $5 - 2k = 0$, so $k = 2.5$.
      - |-
        Check: $2 - 5 + 3 = 0$ ✓
    answer: |-
      $k = 2.5$

  - type: check
    questions: [vec-perpendicular]

  - type: explain
    title: Foot of the perpendicular from a point to a line
    body: |-
      A line has equation $\mathbf{r} = \mathbf{a} + t\mathbf{d}$: start at the point with position vector $\mathbf{a}$ (here $\mathbf{a}$ is a point on the line, not the general vector from earlier), then move $t$ steps of the direction vector $\mathbf{d}$. Every value of the number $t$ gives one point on the line.

      $P$ is a point **not** on the line, with position vector $\mathbf{p}$. The **foot of the perpendicular** is the point $F$ on the line where a line from $P$ meets it at right angles. It is the point on the line closest to $P$, and $PF$ is the shortest distance from $P$ to the line.

      **The method, and why it works:**

      1. $F$ is on the line, so for some unknown $t$ its position vector is $\mathbf{f} = \mathbf{a} + t\mathbf{d}$. Write it out in components; each will contain $t$.
      2. The vector from $P$ to $F$ is $\overrightarrow{PF} = \mathbf{f} - \mathbf{p}$ (end minus start). Again, components in terms of $t$.
      3. $PF$ is perpendicular to the line, so $\overrightarrow{PF} \cdot \mathbf{d} = 0$. This gives one simple equation in $t$.
      4. Solve for $t$, then put it back into $\mathbf{a} + t\mathbf{d}$ to get $F$.
      5. If you need the shortest distance, it is $\lvert \overrightarrow{PF} \rvert$.

  - type: example
    title: "Example 4: foot of the perpendicular"
    problem: |-
      The line $L$ has equation $\mathbf{r} = \begin{pmatrix} 1 \\ 2 \\ -1 \end{pmatrix} + t\begin{pmatrix} 2 \\ -1 \\ 2 \end{pmatrix}$ and $P$ has position vector $\begin{pmatrix} 3 \\ 1 \\ 4 \end{pmatrix}$. Find the foot of the perpendicular from $P$ to $L$, and the shortest distance from $P$ to $L$.
    steps:
      - |-
        **Step 1.** A general point on $L$: $\mathbf{f} = \begin{pmatrix} 1 + 2t \\ 2 - t \\ -1 + 2t \end{pmatrix}$.
      - |-
        **Step 2.** $\overrightarrow{PF} = \mathbf{f} - \mathbf{p} = \begin{pmatrix} 1 + 2t - 3 \\ 2 - t - 1 \\ -1 + 2t - 4 \end{pmatrix} = \begin{pmatrix} 2t - 2 \\ 1 - t \\ 2t - 5 \end{pmatrix}$.
      - |-
        **Step 3.** Dot with the direction $\mathbf{d} = \begin{pmatrix} 2 \\ -1 \\ 2 \end{pmatrix}$ and set it to zero: $2(2t - 2) - 1(1 - t) + 2(2t - 5) = 0$.
      - |-
        Expand: $4t - 4 - 1 + t + 4t - 10 = 0$, so $9t - 15 = 0$ and $t = \dfrac{15}{9} = \dfrac53$.
      - |-
        **Step 4.** Put $t = \tfrac53$ into $\mathbf{f}$: $\left(1 + \tfrac{10}{3},\ 2 - \tfrac53,\ -1 + \tfrac{10}{3}\right) = \left(\tfrac{13}{3},\ \tfrac13,\ \tfrac73\right)$.
      - |-
        **Step 5.** $\overrightarrow{PF} = \begin{pmatrix} 2t - 2 \\ 1 - t \\ 2t - 5 \end{pmatrix}$ at $t = \tfrac53$ is $\begin{pmatrix} 4/3 \\ -2/3 \\ -5/3 \end{pmatrix}$, so $\lvert \overrightarrow{PF} \rvert = \sqrt{\tfrac{16 + 4 + 25}{9}} = \sqrt{5}$.
    answer: |-
      $F = \left(\tfrac{13}{3}, \tfrac13, \tfrac73\right)$ and the shortest distance is $\sqrt5 \approx 2.24$. Check: $\overrightarrow{PF} \cdot \mathbf{d} = \tfrac83 + \tfrac23 - \tfrac{10}{3} = 0$ ✓

  - type: check
    questions: [vec-foot-perpendicular]

  - type: misconceptions
    items:
      - wrong: |-
          $\mathbf{a} \cdot \mathbf{b}$ is a vector.
        right: |-
          It's a single number. You add the three products together at the end.
      - wrong: |-
          To find the angle between two lines, use position vectors of points on them.
        right: |-
          Use the **direction** vectors. The position vectors only say where the lines are, not which way they point.
      - wrong: |-
          If $\mathbf{a} \cdot \mathbf{b} = 0$ then $\mathbf{a}$ or $\mathbf{b}$ must be zero.
        right: |-
          Not with vectors. $\begin{pmatrix} 1 \\ 0 \\ 0 \end{pmatrix} \cdot \begin{pmatrix} 0 \\ 1 \\ 0 \end{pmatrix} = 0$, yet neither is zero: they're perpendicular.
      - wrong: |-
          $\mathbf{a} \cdot \mathbf{a} = \lvert \mathbf{a} \rvert$.
        right: |-
          $\mathbf{a} \cdot \mathbf{a} = a_1^2 + a_2^2 + a_3^2 = \lvert \mathbf{a} \rvert^2$, the magnitude **squared** (the angle between a vector and itself is $0$, and $\cos 0 = 1$).
      - wrong: |-
          My angle came out as $116^\circ$, so that's the angle between the lines.
        right: |-
          Questions usually want the **acute** angle between lines: $180^\circ - 116^\circ = 64^\circ$.

  - type: exam
    body: |-
      - *Find the angle between the lines …*: use the direction vectors in $\cos\theta = \dfrac{\mathbf{a} \cdot \mathbf{b}}{\lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert}$, and give the acute angle unless told otherwise.
      - *Show that the lines are perpendicular*: show the scalar product of the directions is 0, with the working written out.
      - *Find the foot of the perpendicular*: write the general point, form $\overrightarrow{PF}$, dot with $\mathbf{d}$, set to 0. Each step earns a mark.
      - Cuboid and pyramid questions: label the corners with position vectors first, then get each vector you need as "end minus start".
      - The vector (cross) product is not needed for 9709.

  - type: takeaways
    items:
      - |-
        $\mathbf{a} \cdot \mathbf{b} = a_1b_1 + a_2b_2 + a_3b_3 = \lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert \cos\theta$, and the answer is a number.
      - |-
        Angle: $\cos\theta = \dfrac{\mathbf{a} \cdot \mathbf{b}}{\lvert \mathbf{a} \rvert \lvert \mathbf{b} \rvert}$. For lines, use direction vectors and give the acute angle.
      - |-
        Perpendicular exactly when the scalar product is 0.
      - |-
        Foot of the perpendicular: general point $\mathbf{a} + t\mathbf{d}$, then $\overrightarrow{PF} \cdot \mathbf{d} = 0$ to find $t$.

questions:
  - id: vec-dot-product
    format: numeric
    difficulty: 1
    objectives: ["3.7.6"]
    prompt: |-
      Find $\mathbf{a} \cdot \mathbf{b}$ for $\mathbf{a} = 3\mathbf{i} - 2\mathbf{j} + 4\mathbf{k}$ and $\mathbf{b} = \mathbf{i} + 5\mathbf{j} - 2\mathbf{k}$.
    fields:
      - label: "a · b ="
        answer: -15
    explanation: |-
      Multiply matching components and add: $3(1) + (-2)(5) + 4(-2) = 3 - 10 - 8 = -15$.

  - id: vec-angle
    format: mcq
    difficulty: 2
    objectives: ["3.7.6"]
    prompt: |-
      What is the angle between $\mathbf{a} = \mathbf{i} + \mathbf{j}$ and $\mathbf{b} = \mathbf{j} + \mathbf{k}$?
    options:
      - text: $60^\circ$
        correct: true
        why: |-
          $\mathbf{a} \cdot \mathbf{b} = 0 + 1 + 0 = 1$ and both magnitudes are $\sqrt2$, so $\cos\theta = \tfrac12$ and $\theta = 60^\circ$.
      - text: $45^\circ$
        why: |-
          $\cos 45^\circ = \tfrac{\sqrt2}{2} \approx 0.707$, but here $\cos\theta = \tfrac12$.
      - text: $90^\circ$
        why: |-
          The scalar product is 1, not 0, so they aren't perpendicular.
      - text: $30^\circ$
        why: |-
          $\cos 30^\circ = \tfrac{\sqrt3}{2} \approx 0.866$, not $0.5$.
    explanation: |-
      $\mathbf{a} \cdot \mathbf{b} = 1(0) + 1(1) + 0(1) = 1$, and $\lvert \mathbf{a} \rvert = \lvert \mathbf{b} \rvert = \sqrt2$, so $\cos\theta = \dfrac{1}{\sqrt2 \times \sqrt2} = \dfrac12$ and $\theta = 60^\circ$.

  - id: vec-perpendicular
    format: numeric
    difficulty: 2
    objectives: ["3.7.6"]
    prompt: |-
      The vectors $\begin{pmatrix} 2 \\ k \\ 3 \end{pmatrix}$ and $\begin{pmatrix} 1 \\ -2 \\ 4 \end{pmatrix}$ are perpendicular. Find $k$.
    fields:
      - label: "k ="
        answer: 7
    explanation: |-
      Perpendicular means the scalar product is 0: $2(1) + k(-2) + 3(4) = 0$, so $14 - 2k = 0$ and $k = 7$.

  - id: vec-foot-perpendicular
    format: numeric
    difficulty: 3
    objectives: ["3.7.6"]
    prompt: |-
      The line $L$ has equation $\mathbf{r} = \begin{pmatrix} 2 \\ 0 \\ 1 \end{pmatrix} + t\begin{pmatrix} 1 \\ 2 \\ -2 \end{pmatrix}$ and $P$ is the point $(7, 5, -5)$. Find the coordinates of the foot of the perpendicular from $P$ to $L$.
    fields:
      - label: "x ="
        answer: 5
      - label: "y ="
        answer: 6
      - label: "z ="
        answer: -5
    explanation: |-
      General point on $L$: $\mathbf{f} = \begin{pmatrix} 2 + t \\ 2t \\ 1 - 2t \end{pmatrix}$, so $\overrightarrow{PF} = \mathbf{f} - \mathbf{p} = \begin{pmatrix} t - 5 \\ 2t - 5 \\ 6 - 2t \end{pmatrix}$.

      Perpendicular to $\mathbf{d}$: $1(t - 5) + 2(2t - 5) - 2(6 - 2t) = 0$, so $t - 5 + 4t - 10 - 12 + 4t = 9t - 27 = 0$ and $t = 3$.

      So $F = (2 + 3,\ 6,\ 1 - 6) = (5, 6, -5)$. Check: $\overrightarrow{PF} = \begin{pmatrix} -2 \\ 1 \\ 0 \end{pmatrix}$ and $-2 + 2 + 0 = 0$ ✓
