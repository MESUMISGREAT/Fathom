id: p3-diff-implicit
subject: '9709'
topic: '3.4'
title: 'Implicit differentiation: when y cannot be freed'
summary: Curves like x² + y² = xy + 7 mix x and y. Differentiate term by term and let dy/dx ride along as an unknown.
order: 3
minutes: 8
kind: core
objectives:
- 3.4.3
prerequisites:
- p3-diff-products-quotients
