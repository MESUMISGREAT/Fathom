id: p1-trigonometry-exact-values
subject: "9709"
topic: "1.5"
title: Exact values of sin, cos and tan
summary: Get the exact values of sin, cos and tan of 30°, 45° and 60° from two triangles, then extend them to related angles like 210° or 5π/4.
order: 4
minutes: 5
kind: core
objectives: ["1.5.2"]
prerequisites: [p1-trigonometry-angles-of-any-size]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.5 learning outcome "use the exact values
    of the sine, cosine and tangent of 30°, 45°, 60°, and related angles". The worked examples
    and questions use different angles from the syllabus's own examples. All examples and
    questions are original; every value checked in Python. Independently re-checked line by line
    (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet
    reviewed by a teacher.
    Revised on 2026-10-31 for beginners to the Fathom layout rules (short paragraphs, one step per line, every symbol explained). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can write down the **exact** values of $\sin$, $\cos$ and $\tan$ of $30^\circ$, $45^\circ$ and $60^\circ$ (and $\tfrac{\pi}{6}$, $\tfrac{\pi}{4}$, $\tfrac{\pi}{3}$), and of related angles such as $210^\circ$ or $\tfrac{5\pi}{4}$, without a calculator.

  - type: explain
    title: Key to the symbols
    body: |
      The main symbols used in this lesson:

      | Symbol | Meaning |
      | --- | --- |
      | $\theta$ | an angle |
      | exact | written with fractions and surds like $\sqrt3$, never a rounded decimal |

  - type: explain
    title: Two triangles you can draw in 10 seconds
    body: |-
      No memorising a wall of surds. Everything comes from two triangles:

      **Half an equilateral triangle.**

      - Take an equilateral triangle with every side 2. All its angles are $60^\circ$.
      - Cut it down the middle. You get a right-angled triangle with hypotenuse 2 and base 1.
      - The top angle is halved, to $30^\circ$. The bottom angle stays $60^\circ$.
      - The height, by Pythagoras: $\sqrt{2^2 - 1^2} = \sqrt{4 - 1} = \sqrt3$.

      **Half a square.**

      - Take a square with sides 1. Cut it along a diagonal.
      - You get a right-angled triangle with two sides of 1 and two $45^\circ$ angles.
      - The hypotenuse, by Pythagoras: $\sqrt{1^2 + 1^2} = \sqrt2$.

      Then it's just SOH CAH TOA. For example, in the first triangle the side opposite $30^\circ$ is 1 and the hypotenuse is 2:

      $$\sin 30^\circ = \frac{\text{opposite}}{\text{hypotenuse}} = \frac12$$

  - type: diagram
    diagram: p1-trigonometry-exact-triangles
    alt: >-
      Two right-angled triangles drawn to scale. Left, labelled "half an equilateral triangle": the
      right half of an equilateral triangle of side 2 (the other half dashed), with base 1, height
      √3 and hypotenuse 2; the angle at the top is 30° and the angle at the bottom right is 60°;
      below it, 30° = π/6 and 60° = π/3. Right, labelled "half a square": a right-angled isosceles
      triangle with both shorter sides 1 and hypotenuse √2, angles 45° and 45°, inside a dashed unit
      square; below it, 45° = π/4.

  - type: explain
    title: The table
    body: |-
      | $\theta$ | $\sin\theta$ | $\cos\theta$ | $\tan\theta$ |
      | --- | --- | --- | --- |
      | $30^\circ = \tfrac{\pi}{6}$ | $\tfrac12$ | $\tfrac{\sqrt3}{2}$ | $\tfrac{1}{\sqrt3} = \tfrac{\sqrt3}{3}$ |
      | $45^\circ = \tfrac{\pi}{4}$ | $\tfrac{1}{\sqrt2} = \tfrac{\sqrt2}{2}$ | $\tfrac{1}{\sqrt2} = \tfrac{\sqrt2}{2}$ | $1$ |
      | $60^\circ = \tfrac{\pi}{3}$ | $\tfrac{\sqrt3}{2}$ | $\tfrac12$ | $\sqrt3$ |

      Why two forms like $\tfrac{1}{\sqrt3} = \tfrac{\sqrt3}{3}$? Multiply top and bottom by $\sqrt3$:

      $$\frac{1 \times \sqrt3}{\sqrt3 \times \sqrt3} = \frac{\sqrt3}{3}$$

      Same number, no root on the bottom. Either form is exact.

      Also handy, from the unit circle:

      - $\sin 0 = 0$ and $\cos 0 = 1$
      - $\sin 90^\circ = 1$ and $\cos 90^\circ = 0$
      - $\tan 90^\circ$ is undefined (it would mean dividing by $\cos 90^\circ = 0$)

  - type: intuition
    title: The memory hack
    body: |-
      Read the sine column as $\tfrac{\sqrt1}{2}, \tfrac{\sqrt2}{2}, \tfrac{\sqrt3}{2}$ for $30^\circ, 45^\circ, 60^\circ$. Cosine is the same list **backwards**. Then $\tan = \tfrac{\sin}{\cos}$.

      Sanity check: as an acute angle grows, sine grows and cosine shrinks. If your $\sin 60^\circ$ is smaller than your $\sin 30^\circ$, something's swapped.

  - type: check
    questions: [cos-30-mcq]

  - type: explain
    title: Related angles
    body: |-
      Combine the table with the basic-angle method:

      1. Find the basic angle (acute, to the $x$-axis). It must be $30^\circ$, $45^\circ$ or $60^\circ$ for an exact value.
      2. Read the value from the table.
      3. Attach the sign from CAST.

  - type: example
    title: Three related angles
    problem: |-
      Find the exact values of (a) $\cos 210^\circ$ (b) $\sin\tfrac{2\pi}{3}$ (c) $\tan\tfrac{7\pi}{4}$
    steps:
      - |-
        **(a) $\cos 210^\circ$**

        - Quadrant: 3rd ($210^\circ$ is between $180^\circ$ and $270^\circ$).
        - Basic angle: $210^\circ - 180^\circ = 30^\circ$.
        - Sign: cos is negative in the 3rd quadrant.

        $$\cos 210^\circ = -\cos 30^\circ = -\frac{\sqrt3}{2}$$
      - |-
        **(b) $\sin\tfrac{2\pi}{3}$**

        - Quadrant: $\tfrac{2\pi}{3} = \pi - \tfrac{\pi}{3}$, a bit short of a half turn, so the 2nd.
        - Basic angle: $\tfrac{\pi}{3}$ (that's $60^\circ$).
        - Sign: sin is positive in the 2nd quadrant.

        $$\sin\frac{2\pi}{3} = \sin\frac{\pi}{3} = \frac{\sqrt3}{2}$$
      - |-
        **(c) $\tan\tfrac{7\pi}{4}$**

        - Quadrant: $\tfrac{7\pi}{4} = 2\pi - \tfrac{\pi}{4}$, a bit short of a full turn, so the 4th.
        - Basic angle: $\tfrac{\pi}{4}$ (that's $45^\circ$).
        - Sign: tan is negative in the 4th quadrant.

        $$\tan\frac{7\pi}{4} = -\tan\frac{\pi}{4} = -1$$
    answer: |-
      $-\tfrac{\sqrt3}{2}$, $\;\tfrac{\sqrt3}{2}$, $\;-1$.

  - type: check
    questions: [cos-135, sin-4pi-3, tan-225]

  - type: example
    title: Combining exact values
    problem: |-
      Find the exact value of $\sin 240^\circ + \cos 300^\circ$.
    steps:
      - |-
        **$\sin 240^\circ$:** 3rd quadrant, basic angle $240^\circ - 180^\circ = 60^\circ$, and sin is negative there.

        $$\sin 240^\circ = -\frac{\sqrt3}{2}$$
      - |-
        **$\cos 300^\circ$:** 4th quadrant, basic angle $360^\circ - 300^\circ = 60^\circ$, and cos is positive there.

        $$\cos 300^\circ = \frac12$$
      - |-
        Add them. Both have a denominator of 2, so put them over one fraction:

        $$-\frac{\sqrt3}{2} + \frac12 = \frac{1 - \sqrt3}{2}$$
    answer: |-
      $\dfrac{1 - \sqrt3}{2}$ (about $-0.366$, which a calculator confirms).

  - type: misconceptions
    items:
      - wrong: |-
          $\cos 210^\circ = \tfrac{\sqrt3}{2}$
        right: |-
          The size is right but the sign isn't: cos is negative in the 3rd quadrant, so $\cos 210^\circ = -\tfrac{\sqrt3}{2}$.
      - wrong: |-
          $\tan 30^\circ = \sqrt3$
        right: |-
          That's $\tan 60^\circ$. In the half-equilateral triangle, opposite $30^\circ$ is 1 and adjacent is $\sqrt3$, so $\tan 30^\circ = \tfrac{1}{\sqrt3}$.
      - wrong: |-
          $\tfrac{1}{\sqrt2}$ and $\tfrac{\sqrt2}{2}$ are different values.
        right: |-
          They're equal (multiply top and bottom by $\sqrt2$). Either form is an exact answer.
      - wrong: |-
          $\sin 30^\circ = 0.5$ is exact, so $\cos 30^\circ = 0.866$ is too.
        right: |-
          $0.866$ is a rounded decimal. Exact means $\tfrac{\sqrt3}{2}$.

  - type: check
    questions: [sin-300-mcq, cos-5pi-4-spot, exact-combo]

  - type: exam
    body: |-
      - *"Find the exact value"* or *"without using a calculator"* means surds and fractions, with the working shown. A decimal loses the answer mark, however many places you give.
      - Exact values sneak into other topics: circle sectors with angle $\tfrac{\pi}{3}$, coordinates on trig graphs, solutions of trig equations in terms of $\pi$.
      - Draw the two triangles in the margin at the start of the exam. Ten seconds, and every exact value is on your page.

  - type: takeaways
    items:
      - |-
        Half an equilateral triangle ($1, \sqrt3, 2$) gives $30^\circ$ and $60^\circ$; half a square ($1, 1, \sqrt2$) gives $45^\circ$.
      - |-
        $\sin$: $\tfrac12, \tfrac{\sqrt2}{2}, \tfrac{\sqrt3}{2}$; $\cos$: the same backwards; $\tan$: $\tfrac{1}{\sqrt3}, 1, \sqrt3$.
      - |-
        Related angles: basic angle from the table, sign from CAST.
      - |-
        "Exact" means surds and fractions, never decimals.

questions:
  - id: cos-30-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.5.2"]
    prompt: |-
      What is the exact value of $\cos 30^\circ$?
    explanation: |-
      In the half-equilateral triangle, the side adjacent to $30^\circ$ is $\sqrt3$ and the hypotenuse is 2, so $\cos 30^\circ = \tfrac{\sqrt3}{2}$.
    options:
      - text: |-
          $\tfrac{\sqrt3}{2}$
        correct: true
        why: |-
          Adjacent $\sqrt3$ over hypotenuse $2$.
      - text: |-
          $\tfrac12$
        why: |-
          That's $\sin 30^\circ$ (or $\cos 60^\circ$).
      - text: |-
          $\tfrac{1}{\sqrt2}$
        why: |-
          That's for $45^\circ$.
      - text: |-
          $\sqrt3$
        why: |-
          That's $\tan 60^\circ$. A cosine can never be bigger than 1.

  - id: cos-135
    format: numeric
    difficulty: 1
    objectives: ["1.5.2"]
    prompt: |-
      Find the exact value of $\cos 135^\circ$. (Type a surd, for example `-√3/2`.)
    fields:
      - answer: -0.7071067811865475
        tolerance: { abs: 0.0005 }
    explanation: |-
      $135^\circ$ is in the 2nd quadrant with basic angle $45^\circ$, and cos is negative there:

      $$\cos 135^\circ = -\cos 45^\circ = -\tfrac{1}{\sqrt2} = -\tfrac{\sqrt2}{2}.$$

  - id: sin-4pi-3
    format: numeric
    difficulty: 1
    objectives: ["1.5.2"]
    prompt: |-
      Find the exact value of $\sin\tfrac{4\pi}{3}$.
    fields:
      - answer: -0.8660254037844386
        tolerance: { abs: 0.0005 }
    explanation: |-
      $\tfrac{4\pi}{3} = \pi + \tfrac{\pi}{3}$: 3rd quadrant, basic angle $\tfrac{\pi}{3}$, sin negative.

      $$\sin\tfrac{4\pi}{3} = -\sin\tfrac{\pi}{3} = -\tfrac{\sqrt3}{2}.$$

  - id: tan-225
    format: numeric
    difficulty: 2
    objectives: ["1.5.2"]
    prompt: |-
      Find the exact value of $\tan 225^\circ$.
    fields:
      - answer: 1
        tolerance: { abs: 0.0005 }
    explanation: |-
      $225^\circ = 180^\circ + 45^\circ$: 3rd quadrant, where tan is **positive**. So $\tan 225^\circ = \tan 45^\circ = 1$.

  - id: sin-300-mcq
    format: mcq
    difficulty: 2
    objectives: ["1.5.2"]
    prompt: |-
      What is the exact value of $\sin 300^\circ$?
    explanation: |-
      $300^\circ = 360^\circ - 60^\circ$: 4th quadrant, basic angle $60^\circ$, and only cos is positive there. So $\sin 300^\circ = -\sin 60^\circ = -\tfrac{\sqrt3}{2}$.
    options:
      - text: |-
          $-\tfrac{\sqrt3}{2}$
        correct: true
        why: |-
          Basic angle $60^\circ$, and sine is negative in the 4th quadrant.
      - text: |-
          $\tfrac{\sqrt3}{2}$
        why: |-
          Right size, wrong sign: in the 4th quadrant the $y$-coordinate is negative.
      - text: |-
          $-\tfrac12$
        why: |-
          That's $-\cos 60^\circ$. You need the **sine** of the basic angle $60^\circ$.
      - text: |-
          $\tfrac12$
        why: |-
          That's $\cos 300^\circ$, with both the ratio and the sign swapped.

  - id: cos-5pi-4-spot
    format: spot-error
    difficulty: 2
    objectives: ["1.5.2"]
    prompt: |-
      A student finds the exact value of $\cos\tfrac{5\pi}{4}$. Which line contains the first error?
    lines:
      - |-
        $\tfrac{5\pi}{4}$ is between $\pi$ and $\tfrac{3\pi}{2}$, so it's in the third quadrant.
      - |-
        The basic angle is $\tfrac{5\pi}{4} - \pi = \tfrac{\pi}{4}$.
      - |-
        Cos is positive in the third quadrant.
      - |-
        So $\cos\tfrac{5\pi}{4} = \cos\tfrac{\pi}{4} = \tfrac{1}{\sqrt2}$.
    errorLine: 3
    fix: |-
      Only tan is positive in the third quadrant, so $\cos\tfrac{5\pi}{4} = -\cos\tfrac{\pi}{4} = -\tfrac{1}{\sqrt2}$.
    explanation: |-
      In the third quadrant both coordinates are negative, so $\cos\theta$ (the $x$-coordinate) is negative. CAST: only **T**an is positive there.

  - id: exact-combo
    format: numeric
    difficulty: 3
    objectives: ["1.5.2"]
    prompt: |-
      Without a calculator, find the exact value of $2\sin\tfrac{5\pi}{6} + \sqrt3\tan\tfrac{7\pi}{6}$.
    fields:
      - answer: 2
        tolerance: { abs: 0.0005 }
    explanation: |-
      $\tfrac{5\pi}{6} = \pi - \tfrac{\pi}{6}$: sin positive, so $\sin\tfrac{5\pi}{6} = \tfrac12$ and $2 \times \tfrac12 = 1$.

      $\tfrac{7\pi}{6} = \pi + \tfrac{\pi}{6}$: tan positive, so $\tan\tfrac{7\pi}{6} = \tfrac{1}{\sqrt3}$ and $\sqrt3 \times \tfrac{1}{\sqrt3} = 1$.

      Total: $1 + 1 = 2$.
