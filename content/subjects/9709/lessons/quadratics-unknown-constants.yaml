blocks:
  - type: objective
    body: |-
      By the end you can find the values of an unknown constant $k$ that give a quadratic two distinct, equal or no real roots.

      That usually means solving a quadratic inequality **in $k$**.

  - type: explain
    title: What is going on here?
    body: |-
      Sometimes a quadratic contains a letter like $k$. It stands for an **unknown constant**: a fixed number we haven't been told.

      So $x^2 + kx + 9 = 0$ is really a whole **family** of equations, one for each value of $k$:

      - $k = 10$ gives $x^2 + 10x + 9 = 0$
      - $k = 6$ gives $x^2 + 6x + 9 = 0$
      - $k = 0$ gives $x^2 + 9 = 0$

      Some members of the family have two roots, some one, some none.

      The question is always: **which values of $k$ give the kind of roots we want?**

  - type: explain
    title: The tool - the discriminant
    body: |-
      The **discriminant** is $b^2 - 4ac$, the part under the square root in the quadratic formula:

      $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

      It decides how many roots there are:

      | Discriminant | What the $\pm$ does | Roots |
      | --- | --- | --- |
      | $b^2 - 4ac > 0$ | $\pm$ a positive number gives two different answers | **two distinct real roots** |
      | $b^2 - 4ac = 0$ | $\pm 0$ gives the same answer twice | **one repeated root** (also called **equal roots**) |
      | $b^2 - 4ac < 0$ | needs the square root of a negative, which isn't real | **no real roots** |

      So here's the plan. Instead of solving for $x$, write the discriminant **in terms of $k$**, then solve for $k$.

  - type: explain
    title: The recipe
    body: |-
      1. Get the equation into the form $ax^2 + bx + c = 0$.
      2. Write down $a$, $b$ and $c$ **in terms of $k$**. Use brackets.
      3. Turn the wording into a condition on $b^2 - 4ac$: $> 0$, $= 0$, $\geqslant 0$ or $< 0$.
      4. Simplify. You'll usually get a quadratic in $k$.
      5. Solve it. An equation if the condition is $= 0$; an inequality (with a sketch) otherwise.

      These are skills you already have, just stacked on top of each other. Like a lasagne.

  - type: example
    title: "Example 1: two distinct real roots"
    problem: |-
      Find the set of values of $k$ for which $x^2 + kx + k + 3 = 0$ has two distinct real roots.
    steps:
      - |-
        Match it to $ax^2 + bx + c = 0$:

        - the number in front of $x^2$: $a = 1$
        - the number in front of $x$: $b = k$
        - everything without an $x$: $c = k + 3$
      - |-
        "Two distinct real roots" means the discriminant is positive:

        $$b^2 - 4ac > 0$$
      - |-
        Substitute $a$, $b$ and $c$:

        $$k^2 - 4 \times 1 \times (k + 3) > 0$$

        Expand the bracket:

        $$k^2 - 4k - 12 > 0$$

        This is a quadratic **inequality in $k$**.
      - |-
        Factorise it like any quadratic. We need two numbers that multiply to $-12$ and add to $-4$: they are $-6$ and $2$.

        $$(k - 6)(k + 2) > 0$$
      - |-
        The **critical values** are where the expression equals zero: $k = 6$ and $k = -2$.

        They split the number line into three parts.
      - |-
        Sketch $y = k^2 - 4k - 12$. It's a ∪ shape (the $k^2$ is positive) crossing the axis at $-2$ and $6$.

        - It is **above** the axis (positive) to the left of $-2$ and to the right of $6$.
        - It is below the axis in between.

        We want positive, so we want the two outside parts.
      - |-
        Test a value in each region to be sure:

        - $k = -5$: $(-5 - 6)(-5 + 2) = 33 > 0$ ✓ (included)
        - $k = 10$: $(10 - 6)(10 + 2) = 48 > 0$ ✓ (included)
        - $k = 0$: $(0 - 6)(0 + 2) = -12$, not $> 0$ ✓ (excluded)
    answer: |-
      $k < -2$ or $k > 6$.

  - type: check
    questions: [k-disc-expression, k-no-real]

  - type: explain
    title: Does a line meet a curve?
    body: |-
      Same idea, with one extra step at the start.

      **Step 1: substitute.**

      - Where a line meets a curve, both have the same $x$ and the same $y$.
      - So set the two $y$-expressions equal. That gives one quadratic in $x$.

      **Step 2: count roots.**

      - Each real root is an $x$-coordinate where they meet.
      - So the discriminant counts the meeting points:

      | $b^2 - 4ac$ | The line… |
      | --- | --- |
      | $> 0$ | meets the curve at two distinct points |
      | $= 0$ | touches the curve at one point: it's a **tangent** |
      | $< 0$ | doesn't meet the curve |

      **Watch the wording:**

      - Plain "meets" includes touching, so it means $\geqslant 0$.
      - "At two distinct points" means $> 0$.
      - In "intersects, touches or does not meet", *intersects* means two points: $> 0$.

  - type: definition
    term: Tangent condition
    body: |-
      When a line is substituted into a quadratic curve, a **repeated root** ($b^2 - 4ac = 0$) means the line touches the curve at exactly one point without crossing it.

      The line is then a **tangent** to the curve. The repeated root is the $x$-coordinate of the point where they touch.

  - type: diagram
    diagram: line-curve-pivot
    alt: >-
      The curve y = x² − 2x + 2, a U shape with its vertex at (1, 1), and four straight lines
      y = kx − 2 that all pass through the point (0, −2). The line with k = 3 crosses the curve at
      (1, 1) and (4, 10). The lines with k = 2 and k = −6 are tangents, touching the curve at
      (2, 2) and (−2, 10). The dashed horizontal line with k = 0 passes below the curve and misses it.
    caption: |-
      Swing the line $y = kx - 2$ round the point $(0, -2)$. It's a tangent at $k = -6$ and $k = 2$, misses the curve for $-6 < k < 2$, and cuts it twice for $k < -6$ or $k > 2$.

  - type: check
    questions: [k-tangent-name, k-wording]

  - type: example
    title: "Example 2: when a line meets a curve"
    problem: |-
      Find the set of values of $k$ for which the line $y = kx - 2$ meets the curve $y = x^2 - 2x + 2$.
    steps:
      - |-
        Where they meet, the two $y$-values are equal:

        $$x^2 - 2x + 2 = kx - 2$$
      - |-
        Move everything to the left so one side is zero. Subtract $kx$ and add 2 to both sides:

        $$x^2 - 2x - kx + 4 = 0$$
      - |-
        Collect the two $x$ terms into one. Both have a minus sign, so take the minus outside a bracket:

        $$-2x - kx = -(k + 2)x$$

        So the equation is $x^2 - (k + 2)x + 4 = 0$.
      - |-
        Read off the numbers:

        $$a = 1, \quad b = -(k + 2), \quad c = 4$$
      - |-
        "Meets" means one or two points, so $b^2 - 4ac \geqslant 0$:

        $$(k + 2)^2 - 4 \times 1 \times 4 \geqslant 0$$

        $$(k + 2)^2 - 16 \geqslant 0$$

        (Squaring $-(k + 2)$ gives $(k + 2)^2$: the minus sign disappears.)
      - |-
        Expand and factorise:

        $$k^2 + 4k + 4 - 16 \geqslant 0$$

        $$k^2 + 4k - 12 \geqslant 0$$

        $$(k + 6)(k - 2) \geqslant 0$$
      - |-
        Critical values: $-6$ and $2$.

        It's a ∪ shape, and we want $\geqslant 0$, so we want the outside parts, **endpoints included**.
      - |-
        Sense check with the diagram: $k = 2$ and $k = -6$ give the tangents, and $k = 0$ (between them) misses ✓
    answer: |-
      $k \leqslant -6$ or $k \geqslant 2$.

  - type: misconceptions
    items:
      - wrong: |-
          From $x^2 - (k + 2)x + 4 = 0$: $b = -k + 2$.
        right: |-
          $b = -(k + 2) = -k - 2$. The minus applies to both terms in the bracket.

          Keep the bracket, then $b^2 = (k + 2)^2$.
      - wrong: |-
          "The line meets the curve" means $b^2 - 4ac > 0$.
        right: |-
          A tangent meets the curve too, so it's $\geqslant 0$.

          Only "at two distinct points" gives $> 0$.
      - wrong: |-
          $-4k^2 + 12k + 16 \geqslant 0$; divide by $-4$: $k^2 - 3k - 4 \geqslant 0$.
        right: |-
          Dividing by a negative number **reverses** the inequality: $k^2 - 3k - 4 \leqslant 0$.

  - type: deeper
    title: When k is the number in front of x²
    body: |-
      Take $kx^2 + 4x + k - 3 = 0$. Now $a = k$, $b = 4$ and $c = k - 3$.

      For real roots, $b^2 - 4ac \geqslant 0$:

      $$16 - 4k(k - 3) \geqslant 0$$

      Expand:

      $$16 - 4k^2 + 12k \geqslant 0$$

      Divide by $-4$. Dividing by a negative **flips** the sign:

      $$k^2 - 3k - 4 \leqslant 0$$

      Factorise:

      $$(k - 4)(k + 1) \leqslant 0$$

      A ∪ shape is $\leqslant 0$ **between** its roots, so $-1 \leqslant k \leqslant 4$.

      **One more check: can $a$ be zero?** If $k = 0$, the equation is $4x - 3 = 0$. That isn't a quadratic at all, but it still has a real root.

      - For "the equation has real roots", the answer $-1 \leqslant k \leqslant 4$ stands.
      - If the question insists on a *quadratic* equation, exclude $k = 0$.

  - type: exam
    body: |-
      - A Paper 1 favourite, often phrased as *intersects*, *touches* or *does not meet*. Turn the wording into $>$, $=$, $\geqslant$ or $<$ before doing anything else.
      - Marks typically go on the substituted quadratic, the discriminant condition, the critical values and the final set.
      - The final set needs the right shape:
        - two pieces, like "$k < -2$ or $k > 6$", or
        - a sandwich, like "$-3 < k < 5$".
      - Check your set with one test value.

  - type: check
    questions: [k-tangent, k-sign-spot]

  - type: takeaways
    items:
      - |-
        Write $a$, $b$, $c$ in terms of $k$ with brackets. Then turn the wording into a condition on $b^2 - 4ac$.
      - |-
        Line and curve: substitute first. The discriminant counts meeting points, and $= 0$ means tangent.
      - |-
        "Meets" is $\geqslant 0$. "Two distinct points" is $> 0$. "Does not meet" is $< 0$.
      - |-
        Solve the inequality in $k$ with a sketch. Flip the sign if you divide by a negative.

questions:
  - id: k-disc-expression
    format: expression
    difficulty: 1
    objectives: ["1.1.2"]
    prompt: |-
      For the equation $x^2 + (k - 1)x + 4 = 0$, find the discriminant in terms of $k$.
    answer: (k - 1)^2 - 16
    variables: [k]
    display: |-
      $(k - 1)^2 - 16$, which expands to $k^2 - 2k - 15$
    explanation: |-
      $a = 1$, $b = k - 1$, $c = 4$, so $b^2 - 4ac = (k - 1)^2 - 16$. Any equivalent form, such as $k^2 - 2k - 15$, is fine.

  - id: k-no-real
    format: numeric
    difficulty: 2
    objectives: ["1.1.2", "1.1.3"]
    prompt: |-
      Hence find the set of values of $k$ for which $x^2 + (k - 1)x + 4 = 0$ has no real roots. The answer has the form $a < k < b$. Enter $a$ and $b$.
    fields:
      - label: "a ="
        answer: -3
      - label: "b ="
        answer: 5
    explanation: |-
      No real roots: $(k - 1)^2 - 16 < 0$, i.e. $k^2 - 2k - 15 < 0$, so $(k - 5)(k + 3) < 0$.

      Critical values $-3$ and $5$; $< 0$ is between them: $-3 < k < 5$.

  - id: k-tangent-name
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.1.2"]
    prompt: |-
      You substitute a line into the equation of a curve, and the resulting quadratic has $b^2 - 4ac = 0$. What is the line called, in relation to the curve?
    accept:
      - tangent
      - a tangent
      - tangent line
      - tangent to the curve
      - a tangent to the curve
      - the tangent
    model: |-
      A **tangent** to the curve: it touches the curve at exactly one point.
    explanation: |-
      A zero discriminant means one repeated root, so one point of contact where the line touches without crossing: a tangent.

  - id: k-wording
    format: mcq
    difficulty: 1
    objectives: ["1.1.2"]
    prompt: |-
      A question asks for the values of $k$ for which a line **does not meet** a curve. After substituting, which condition do you need?
    explanation: |-
      "Does not meet" means no intersection points, so the quadratic must have no real roots: $b^2 - 4ac < 0$.
    options:
      - text: |-
          $b^2 - 4ac < 0$
        correct: true
        why: |-
          No real roots means no intersection points.
      - text: |-
          $b^2 - 4ac = 0$
        why: |-
          That's the tangent case: the line touches the curve once.
      - text: |-
          $b^2 - 4ac \geqslant 0$
        why: |-
          That's the condition for the line to **meet** the curve (once or twice), the exact opposite.
      - text: |-
          $b^2 - 4ac > 0$
        why: |-
          That's two distinct intersection points.

  - id: k-tangent
    format: numeric
    difficulty: 2
    objectives: ["1.1.2"]
    prompt: |-
      Find the value of the constant $k$ for which the line $y = 3x + k$ is a tangent to the curve $y = x^2 + x + 4$.
    fields:
      - label: "k ="
        answer: 3
    explanation: |-
      $x^2 + x + 4 = 3x + k \Rightarrow x^2 - 2x + (4 - k) = 0$.

      Tangent: $(-2)^2 - 4(1)(4 - k) = 0 \Rightarrow 4 - 16 + 4k = 0 \Rightarrow k = 3$.

      Then $x^2 - 2x + 1 = (x - 1)^2 = 0$, so the point of contact is $(1, 6)$.

  - id: k-sign-spot
    format: spot-error
    difficulty: 3
    objectives: ["1.1.2", "1.1.3"]
    prompt: |-
      A student finds the set of values of $k$ for which $kx^2 + 4x + k - 3 = 0$ has real roots. Which line contains the first error?
    lines:
      - |-
        $a = k$, $b = 4$, $c = k - 3$
      - |-
        Real roots: $16 - 4k(k - 3) \geqslant 0$
      - |-
        $16 - 4k^2 + 12k \geqslant 0$
      - |-
        Divide by $-4$: $k^2 - 3k - 4 \geqslant 0$
      - |-
        $(k - 4)(k + 1) \geqslant 0$, so $k \leqslant -1$ or $k \geqslant 4$
    errorLine: 4
    fix: |-
      Dividing by $-4$ reverses the inequality: $k^2 - 3k - 4 \leqslant 0$, so $(k - 4)(k + 1) \leqslant 0$ and $-1 \leqslant k \leqslant 4$.
    explanation: |-
      Test a value: $k = 1$ gives $x^2 + 4x - 2 = 0$, with $b^2 - 4ac = 16 + 8 = 24 > 0$, so it has real roots. But the student's answer excludes $k = 1$. Multiplying or dividing an inequality by a negative number always flips the sign.
