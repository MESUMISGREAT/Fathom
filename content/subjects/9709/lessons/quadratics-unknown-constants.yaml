id: quadratics-unknown-constants
subject: "9709"
topic: "1.1"
title: Finding the set of values of k
summary: Turn a condition on the roots into an inequality in k with the discriminant, then solve it, including when a line meets a curve.
order: 6
minutes: 9
kind: core
objectives: ["1.1.2", "1.1.3"]
prerequisites: [quadratics-discriminant, quadratics-inequalities, quadratics-simultaneous-equations]
