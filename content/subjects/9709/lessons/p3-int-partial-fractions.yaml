id: p3-int-partial-fractions
subject: '9709'
topic: '3.5'
title: 'Partial fractions in integration: split, then log'
summary: A single fraction rarely integrates cleanly — split it with the 3.1 partial-fraction toolkit and each piece
  becomes a log.
order: 3
minutes: 8
kind: core
objectives:
- 3.5.3
prerequisites:
- p3-algebra-partial-fractions-linear-factors
- p3-algebra-partial-fractions-repeated-quadratic
- p3-int-standard-integrals
