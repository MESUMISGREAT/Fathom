blocks:
- type: objective
  body: 'By the end you can decompose a rational integrand into partial fractions (as in topic 3.1) and

    integrate each piece, reading logs directly from $\displaystyle\int \frac{k}{ax + b}\,dx$.'
- type: explain
  title: What they ask
  body: "A question hands you something like $\\displaystyle\\int \\frac{3}{(x-1)(2x+1)}\\,dx$ — not a\nstandard\
    \ integral as it stands.\n\nThe plan is always:\n\n1. **Decompose** into the partial fractions you learned in\
    \ topic 3.1.\n2. **Integrate each piece**, which is $\\ln$ of the denominator (with a coefficient and the\n\
    \   $\\tfrac{1}{a}$ factor).\n3. **Combine logs** into a single log when the question wants a tidy answer.\n\
    4. **Apply limits** for definite integrals; use the log laws first so subtraction stays safe."
- type: explain
  title: The integration piece of the method
  body: 'The two patterns that matter:


    $$\int \frac{k}{ax + b}\,dx = \frac{k}{a}\ln|ax + b| + c$$


    and for a **repeated** linear factor:


    $$\int \frac{k}{(ax + b)^2}\,dx = -\frac{k}{a(ax+b)} + c$$


    (the second is the reverse of differentiating $(ax+b)^{-1}$).


    **The forgotten step:** the $\tfrac{1}{a}$ from the inside. In

    $\int \frac{2}{3x+1}\,dx$ the answer is $\tfrac{2}{3}\ln|3x+1|$, not $2\ln|3x+1|$.'
- type: example
  title: 'Example 1: two distinct linear factors'
  problem: Find $\displaystyle\int \frac{3}{(x - 1)(2x + 1)}\,dx$.
  steps:
  - 'Decompose:


    $$\frac{3}{(x-1)(2x+1)} = \frac{A}{x-1} + \frac{B}{2x+1}$$'
  - 'Cover-up: at $x = 1$, $A = \dfrac{3}{2(1) + 1} = 1$; at $x = -\tfrac12$,

    $B = \dfrac{3}{-1/2 - 1} = -2$.'
  - 'So


    $$\frac{3}{(x-1)(2x+1)} = \frac{1}{x-1} - \frac{2}{2x+1}$$'
  - 'Integrate each piece:


    $$\int \frac{1}{x-1}\,dx = \ln|x-1| + c_1, \qquad \int \frac{2}{2x+1}\,dx = \ln|2x+1| + c_2$$'
  - 'Combine:


    $$\int \frac{3}{(x-1)(2x+1)}\,dx = \ln|x-1| - \ln|2x+1| + c = \ln\left|\frac{x-1}{2x+1}\right| + c$$'
  - 'Check by differentiating:


    $$\frac{d}{dx}\left[\ln|x-1| - \ln|2x+1|\right] = \frac{1}{x-1} - \frac{2}{2x+1} = \frac{(2x+1) - 2(x-1)}{(x-1)(2x+1)}
    = \frac{3}{(x-1)(2x+1)} \ ✓$$'
  answer: $\ln\left|\dfrac{x - 1}{2x+1}\right| + c$.
- type: check
  title: Quick check
  questions:
  - spot-decomposition
  - cover-up
  - integrate-parts
- type: example
  title: 'Example 2: a definite integral with a repeated factor'
  problem: 'Given $\dfrac{4}{x(2 - x)^2} \equiv \dfrac{1}{x} + \dfrac{2}{2-x} + \dfrac{2}{(2-x)^2}$ (you

    may assume the decomposition), evaluate

    $\displaystyle\int_1^{\tfrac32} \frac{4}{x(2-x)^2}\,dx$.'
  steps:
  - 'Integrate each piece:


    $$\int \frac{1}{x}\,dx = \ln|x|, \qquad \int \frac{2}{2-x}\,dx = -2\ln|2-x|, \qquad \int \frac{2}{(2-x)^2}\,dx
    = \frac{2}{2-x}$$'
  - 'Assemble the antiderivative:


    $$F(x) = \ln x - 2\ln|2-x| + \frac{2}{2-x}$$'
  - 'At $x = \tfrac32$: $\ln\tfrac32 - 2\ln\tfrac12 + 4$.'
  - 'At $x = 1$: $\ln 1 - 2\ln 1 + 2 = 2$.'
  - 'Subtract:


    $$\ln\frac32 - 2\ln\frac12 + 4 - 2 = \ln\frac32 + 2\ln 2 + 2$$'
  - 'Combine the logs:


    $$\ln\frac32 + \ln 4 = \ln 6$$

    so the value is $2 + \ln 6 \approx 3.79$.'
  answer: $2 + \ln 6$.
- type: check
  title: Exam-style check
  questions:
  - cover-up-check
  - repeated-factor
  - why-decompose
- type: explain
  title: Sign traps with $(2 - x)$
  body: '$\displaystyle\int \frac{2}{2-x}\,dx$ is **not** $2\ln|2-x|$: differentiating

    $\ln|2-x|$ gives $\dfrac{-1}{2-x}$, so a factor $-1$ must be included, giving


    $$\int \frac{2}{2-x}\,dx = -2\ln|2-x| + c$$


    Whenever the denominator reads "$a - x$ rather than $ax + b$", the derivative of the inside is

    $-1$, so the sign of the log term flips. This single trap decides many "show that" marks.'
- type: misconceptions
  items:
  - wrong: $\displaystyle\int \frac{k}{ax+b}\,dx = k\ln|ax+b| + c$.
    right: 'Inside''s derivative, $a$, must divide: it is $\frac{k}{a}\ln|ax+b| + c$.'
  - wrong: The final answer should stay as separate logs "because log laws are not examinable here".
    right: 'Combining with log laws is expected when the question says "in the form ...", and it is

      what makes limit comparisons work.'
  - wrong: $\int \frac{2}{(2-x)^2}\,dx = \frac{-2}{2-x} + c$.
    right: 'Signs: differentiate $\frac{2}{2-x} = 2(2-x)^{-1}$ to get $\frac{2}{(2-x)^2}$, so the

      antiderivative is $\frac{2}{2-x} + c$.'
  - wrong: Partial fractions require the numerator to be 1.
    right: 'Any constant numerator splits with coefficients adjusted; the cover-up method handles

      $k \neq 1$ automatically.'
  - wrong: A quadratic factor followed by $\ln(x^2+1)$ needs no arctangent check.
    right: 'When a question is restricted "to the types in topic 3.1", the irreducible-quadratic case

      appears, and its constant piece still integrates to a multiple of $\tan^{-1}$, not a log.'
- type: exam
  body: '- Decompose first; the decomposition itself usually carries 2–3 method marks.

    - Show the cover-up (or multiplying-through) working, not just the coefficients.

    - Combine logs only at the end, and keep modulus signs where the integrand is odd about 0.

    - Definite integrals: substitute into the fully antiderivative form, one bracket per limit.'
- type: takeaways
  items:
  - $\int \frac{k}{ax+b}\,dx = \frac{k}{a}\ln|ax+b| + c$.
  - $\int \frac{k}{(ax+b)^2}\,dx = -\frac{k}{a(ax+b)} + c$.
  - A denominator of $a - x$ flips the sign of its log term.
  - Combine logs to a single fraction before substituting limits.
  - Differentiate your antiderivative to check — especially the $(2-x)$ sign traps.
- type: deeper
  title: Logs appear because products of factors do
  body: '$\ln(xy) = \ln x + \ln y$ and $\ln(x/y) = \ln x - \ln y$ are exactly the arithmetic of

    splitting a product denominator. Integration redistributes a big fraction into small ones,

    and the log''s algebra reflects that split.


    More deeply: $\int k f''(t)/f(t)\,dt = k\ln|f|$ (the f-over-f rule later in this unit), so

    every partial-fraction integral is a hidden $1/(\text{linear})$ case with different scalings.'
questions:
- id: spot-decomposition
  format: mcq
  difficulty: 1
  objectives:
  - 3.5.3
  prompt: What is the correct partial fraction form for $\dfrac{3x + 1}{(x + 1)(x + 2)}$?
  options:
  - text: $\dfrac{A}{x + 1} + \dfrac{B}{x + 2}$
    correct: true
    why: Distinct linear factors split into one term per factor.
  - text: $\dfrac{A}{(x+1)(x+2)}$
    why: One constant over the whole product cannot reproduce both a constant and an $x$ term in the numerator.
  - text: $\dfrac{A}{x+1} + \dfrac{B}{x+2} + C$
    why: The extra plain constant $C$ never appears for proper fractions with linear denominators.
  - text: $\dfrac{Ax + B}{x+1} + \dfrac{C}{x+2}$
    why: Linear numerators belong to irreducible quadratic factors, not linear ones.
  explanation: Each distinct linear factor $(x + a)$ gets its own constant numerator over it.
- id: cover-up
  format: numeric
  difficulty: 2
  objectives:
  - 3.5.3
  prompt: In the decomposition $\dfrac{5x - 4}{(x - 1)(x - 3)} = \dfrac{A}{x - 1} + \dfrac{B}{x - 3}$, find the
    constant $A$.
  fields:
  - answer: -0.5
    tolerance:
      abs: 0.001
  explanation: 'Clear denominators first: $5x - 4 = A(x - 3) + B(x - 1)$.

    Substitute $x = 1$: $5 - 4 = A(1 - 3)$, so $1 = -2A$ and $A = -0.5$. (For $B$, substitute $x = 3$: $11 = 2B$,
    so $B = 5.5$.)'
- id: integrate-parts
  format: expression
  difficulty: 2
  objectives:
  - 3.5.3
  prompt: 'Find $\displaystyle\int \dfrac{1}{(x+1)(x+3)}\,dx$ in the form of a partial-fraction decomposition result.


    Give the answer using `ln`, e.g. `0.5*ln((x+1)/(x+3))`.'
  answer: 0.5*ln((x+1)/(x+3))
  variables:
  - x
  display: $\dfrac12\ln\dfrac{x+1}{x+3} + C$
  explanation: '$\dfrac{1}{(x+1)(x+3)} = \dfrac12\left(\dfrac{1}{x+1} - \dfrac{1}{x+3}\right)$, so the

    integral is $\dfrac12(\ln|x+1| - \ln|x+3|) + C$.'
- id: cover-up-check
  format: mcq
  difficulty: 2
  objectives:
  - 3.5.3
  prompt: 'Why does substituting $x = 1$ into $\dfrac{5x - 4}{(x-1)(x-3)} = \dfrac{A}{x-1} + \dfrac{B}{x-3}$

    (after multiplying both sides by $(x-1)(x-3)$) instantly find $A$?'
  options:
  - text: The substitution makes the $B$ term vanish because its multiplier $(x-1)$ becomes zero
    correct: true
    why: With $x = 1$, the factor $(x - 1)$ kills everything containing it, leaving only $A$ times a known constant.
  - text: Because $x = 1$ makes the denominator zero, so the fraction is undefined and must equal $A$
    why: Undefined is not informative; the trick works because of the *zero*, not the undefinedness.
  - text: Because $x = 1$ is the average of the two roots 1 and 3
    why: Nothing about averages is involved; the cover-up trick works for any distinct roots.
  - text: Because substituting the root of one factor directly solves a quadratic for $A$
    why: No quadratic is solved — the identity is linear at each substitution point.
  explanation: 'After clearing denominators, substituting $x = 1$ makes the $B$-side $B(1 - 3)$ term vanish,

    isolating $A$: the "cover-up" method in disguise.'
- id: repeated-factor
  format: mcq
  difficulty: 3
  objectives:
  - 3.5.3
  prompt: A repeated linear factor $(x - 2)^2$ in a denominator needs which partial fraction form?
  options:
  - text: Both $\dfrac{A}{x - 2}$ and $\dfrac{B}{(x - 2)^2}$
    correct: true
    why: Repeated factors need one term per power from 1 up to the multiplicity.
  - text: Only $\dfrac{B}{(x - 2)^2}$
    why: Two constants are needed — a single squared denominator term has too few degrees of freedom to match any
      numerator.
  - text: $\dfrac{A}{(x - 2)} \times \dfrac{B}{(x - 2)^2}$
    why: The terms are added, not multiplied.
  - text: $\dfrac{Ax + B}{(x - 2)^2}$
    why: A summed pair of simple terms is the standard form; a linear numerator over the square is equivalent but
      is not the taught decomposition route.
  explanation: For $(x - a)^2$ write $\dfrac{A}{x - a} + \dfrac{B}{(x - a)^2}$ — one term per power of the repeated
    factor.
- id: why-decompose
  format: explain
  difficulty: 3
  objectives:
  - 3.5.3
  prompt: A classmate asks why we bother splitting $\dfrac{1}{(x+1)(x+3)}$ before integrating. Give the one-sentence
    reason.
  model: 'In one fraction neither factor can be integrated with the standard results, but after splitting,

    each piece is a simple $\dfrac{1}{x + a}$ whose integral is $\ln|x + a|$.'
  keyPoints:
  - The combined fraction is not a standard integral
  - Each split piece integrates to a logarithm
  - Splitting turns one impossible integral into two easy ones
  explanation: Compare your answer with the key points above; they are what a full-mark response must contain.
