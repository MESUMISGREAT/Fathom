id: p2-differentiation-standard-derivatives
subject: "9709"
topic: "2.4"
title: Derivatives of trig, exponential and logarithmic functions
summary: Differentiate sin x, cos x, tan x, e^x and ln x, including when their input is a simple bracket.
order: 1
minutes: 5
kind: core
objectives: ["2.4.1"]
prerequisites: [p1-differentiation-chain-rule]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027, topic 2.4 learning outcome 2.4.1: derivatives of e^x, ln x, sin x, cos x and
    tan x, and constant multiples, sums, differences and composites. All questions are original;
    no illustrative data are used. Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |-
      By the end, you can differentiate e^x, ln x, sin x, cos x and tan x, including a bracket such as sin(3x + 1).
  - type: explain
    title: The five starting rules
    body: |-
      These are the basic derivatives. Trigonometric derivatives use **radians**.

      | Function | Derivative |
      | --- | --- |
      | e^x | e^x |
      | ln x | 1/x, for x > 0 |
      | sin x | cos x |
      | cos x | -sin x |
      | tan x | sec^2x |

      A number multiplying a function stays in front: the derivative of 4 sin x is 4 cos x. For a sum or difference, differentiate each part separately.
  - type: check
    questions: [base-derivatives, radians-condition]
  - type: explain
    title: When the input is a bracket
    body: |-
      If the angle or input is more than just x, keep it inside the function, then multiply by the derivative of that inside expression.

      Example: for sin(3x + 1), the outside derivative is cos(3x + 1), and the inside derivative is 3. So the answer is 3 cos(3x + 1).

      The same idea works for e^(2x), ln(5x - 4), cos(4x) and tan(2x). For a logarithm, its inside must be positive.
  - type: example
    title: Three short chain-rule examples
    problem: |-
      Differentiate y = e^(2x) + ln(3x + 1) - cos(4x).
    steps:
      - |-
        For e^(2x), keep the exponential and multiply by the inside derivative 2: 2e^(2x).
      - |-
        For ln(3x + 1), divide the inside derivative 3 by the inside: 3/(3x + 1).
      - |-
        The derivative of cos(4x) is -4 sin(4x). Because the question subtracts cos(4x), this contributes +4 sin(4x).
      - |-
        Join the three pieces: dy/dx = 2e^(2x) + 3/(3x + 1) + 4 sin(4x).
    answer: |-
      dy/dx = 2e^(2x) + 3/(3x + 1) + 4 sin(4x), for 3x + 1 > 0.
  - type: check
    questions: [exponential-chain, log-chain]
  - type: misconceptions
    items:
      - wrong: |-
          The derivative of cos x is sin x.
        right: |-
          It is -sin x. The minus sign is part of the rule.
      - wrong: |-
          The derivative of sin(3x) is cos(3x).
        right: |-
          Multiply by the inside derivative 3: 3 cos(3x).
      - wrong: |-
          The derivative rules for sin x are unchanged if x is measured in degrees.
        right: |-
          The standard calculus rules assume radians. Convert degree angles to radians before using them.
  - type: exam
    body: |-
      - Keep brackets around a composite input until the chain-rule step is complete.
      - Check for the inside derivative; a coefficient such as 3 is easy to drop.
      - For ln(g(x)), check that g(x) > 0 on the domain being considered.
  - type: takeaways
    items:
      - |-
        (e^x)' = e^x and (ln x)' = 1/x.
      - |-
        (sin x)' = cos x, (cos x)' = -sin x, and (tan x)' = sec^2x.
      - |-
        For a bracket, multiply by the derivative of what is inside.
      - |-
        Trig differentiation uses radians.
  - type: check
    questions: [tangent-chain, cosine-chain]
questions:
  - id: base-derivatives
    format: mcq
    difficulty: 1
    objectives: ["2.4.1"]
    prompt: |-
      What is the derivative of cos x?
    options:
      - text: |-
          -sin x
        correct: true
        why: |-
          Cosine differentiates to negative sine.
      - text: |-
          sin x
        why: |-
          This misses the minus sign.
      - text: |-
          -cos x
        why: |-
          Cosine does not stay cosine when differentiated.
      - text: |-
          sec^2x
        why: |-
          That is the derivative of tan x.
    explanation: |-
      d(cos x)/dx = -sin x.
  - id: radians-condition
    format: text
    difficulty: 1
    objectives: ["2.4.1"]
    prompt: |-
      In what unit must the angle be measured for the standard derivative rule for sin x?
    accept: ["radians", "radian"]
    model: |-
      Radians.
    explanation: |-
      The standard rule d(sin x)/dx = cos x is for x measured in radians.
  - id: exponential-chain
    format: expression
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |-
      Differentiate y = e^(3x - 2).
    answer: "3*exp(3*x-2)"
    variables: [x]
    display: |-
      3e^(3x - 2)
    explanation: |-
      Keep the exponential and multiply by the inside derivative, 3.
  - id: log-chain
    format: expression
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |-
      Differentiate y = ln(5x + 1).
    answer: "5/(5*x+1)"
    variables: [x]
    domain: {min: 0, max: 5}
    display: |-
      5/(5x + 1)
    explanation: |-
      Differentiate the inside to get 5, then divide by the inside: 5/(5x + 1).
  - id: tangent-chain
    format: expression
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |-
      Differentiate y = tan(2x).
    answer: "2/(cos(2*x)^2)"
    variables: [x]
    display: |-
      2 sec^2(2x)
    explanation: |-
      The derivative of tan of the bracket is sec^2 of the bracket, multiplied by the inside derivative 2.
  - id: cosine-chain
    format: expression
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |-
      Differentiate y = cos(4x - 1).
    answer: "-4*sin(4*x-1)"
    variables: [x]
    display: |-
      -4 sin(4x - 1)
    explanation: |-
      Cos differentiates to negative sine, and the inside derivative is 4.
