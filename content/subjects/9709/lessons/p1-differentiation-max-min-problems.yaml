id: p1-differentiation-max-min-problems
subject: "9709"
topic: "1.7"
title: Maximum and minimum problems
summary: Turn a "largest" or "smallest" word problem into a formula in one letter, find its stationary point, prove it's a maximum or minimum, and answer the question with units.
order: 9
minutes: 6
kind: core
objectives: ["1.7.4"]
prerequisites: [p1-differentiation-stationary-points]
