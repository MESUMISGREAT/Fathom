    Revised on 2026-10-31 for beginners to the Fathom layout rules (short paragraphs, one step per line, every symbol explained). Independently re-checked in a separate AI review on 2026-10-31 (every worked step and answer key recomputed); its findings were applied. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can answer *"find the maximum volume"* (or the least area, or the greatest product) in a word problem, and **show** that it really is a maximum.

  - type: explain
    title: What they ask
    body: |-
      A typical question: *Show that the volume of the box is $V = 144x - 48x^2 + 4x^3$. Find the maximum volume, and show that it is a maximum.*

      Giveaway words: **greatest**, **least**, **maximum**, **minimum**, **largest possible**. There's often a **show that** first.

      It's the stationary-points method again, with a word problem wrapped round it.

  - type: explain
    title: The method
    body: |-
      The same four steps every time:

      1. Formula: write the thing they want (volume, area…) using **one** letter. Use the fixed fact they give you (a fixed perimeter, a fixed volume) to get rid of any second letter.
      2. Solve: differentiate, set it equal to 0 and solve. Throw out impossible values, like zero or negative lengths.
      3. Prove: differentiate again. Negative means maximum, positive means minimum. Say so in words.
      4. **Answer: put the value back in to get the maximum volume (or area, or cost) they asked for, with units.**

  - type: example
    title: "Example 1: the easiest case"
    problem: |-
      A rectangle has a perimeter of 20 m. Find its greatest possible area.
    steps:
      - |-
        Formula. Call the sides $x$ and $y$. The perimeter is fixed:

        $$2x + 2y = 20$$

        Divide by 2 and rearrange: $y = 10 - x$.
      - |-
        Write the area using only $x$:

        $$A = xy = x(10 - x) = 10x - x^2$$
      - |-
        Solve: differentiate and set it to 0.

        $$\frac{dA}{dx} = 10 - 2x = 0 \quad\Rightarrow\quad x = 5$$
      - |-
        Prove: $\dfrac{d^2A}{dx^2} = -2 < 0$, so this is a **maximum**.
      - |-
        Answer: $y = 10 - 5 = 5$, so $A = 5 \times 5 = 25\ \text{m}^2$.
    answer: |-
      The greatest area is $25\ \text{m}^2$, from a 5 m by 5 m square.

      Check by trying another rectangle: 4 m by 6 m gives only $24\ \text{m}^2$.

  - type: check
    questions: [product-max, spot-constraint]

  - type: diagram
    diagram: p1-differentiation-box-net
    alt: >-
      Left: a 12 cm square of card, drawn to scale, with an x by x square cut from each corner and
      dashed fold lines marking the base, labelled (12 − 2x) by (12 − 2x); the flaps fold up to a
      height x. Right: a graph of V = x(12 − 2x)² against x in centimetres for x from 0 to 6, with V
      in cubic centimetres. The curve rises from 0 to a maximum at x = 2, labelled maximum
      V = 128 at x = 2, and falls back to 0 at x = 6.
    caption: |-
      Cut too little and the box is shallow; cut too much and the base vanishes. The best cut is in between, at the stationary point.

  - type: example
    title: "Example 2: exam-style"
    problem: |-
      Squares of side $x$ cm are cut from the corners of a 12 cm by 12 cm sheet of card, and the sides are folded up to make an open box. Show that the volume is $V = 144x - 48x^2 + 4x^3$, and find the maximum volume.
    steps:
      - |-
        Formula. Cutting $x$ from **both** ends of each 12 cm side leaves a base of $(12 - 2x)$ by $(12 - 2x)$. The folded flaps make the height $x$.

        $$V = x(12 - 2x)^2$$
      - |-
        Expand the square, then multiply by $x$:

        $$(12 - 2x)^2 = 144 - 48x + 4x^2$$

        $$V = 144x - 48x^2 + 4x^3 \text{, as required.}$$
      - |-
        Solve. Differentiate and set it to 0:

        $$\frac{dV}{dx} = 144 - 96x + 12x^2 = 0$$

        Take out 12: $12(x^2 - 8x + 12) = 12(x - 2)(x - 6) = 0$, so $x = 2$ or $x = 6$.
      - |-
        Throw out $x = 6$: the base would be $12 - 12 = 0$ cm wide.
      - |-
        Prove. Differentiate again: $\dfrac{d^2V}{dx^2} = 24x - 96$.

        At $x = 2$: $48 - 96 = -48 < 0$. So it's a **maximum**.
      - |-
        Answer. Put $x = 2$ back into $V = x(12 - 2x)^2$:

        $$V = 2 \times (12 - 4)^2 = 2 \times 64 = 128$$
    answer: |-
      The maximum volume is $128\ \text{cm}^3$, when $x = 2$.

  - type: check
    questions: [justify-mcq, box-18]

  - type: deeper
    title: "Harder: a minimum, with a show that"
    body: |-
      *A closed cylinder has radius $r$ cm, height $h$ cm and volume $128\pi\ \text{cm}^3$. Show that its surface area is $S = 2\pi r^2 + \dfrac{256\pi}{r}$, and find the minimum value of $S$.*

      - Formula: the volume of a cylinder is $\pi r^2 h$, so $\pi r^2 h = 128\pi$, giving $h = \dfrac{128}{r^2}$.
      - The surface is two circles ($2\pi r^2$) plus the curved side ($2\pi r h$; it unrolls into a rectangle $2\pi r$ long and $h$ tall). Substitute $h$: $S = 2\pi r^2 + 2\pi r \times \dfrac{128}{r^2} = 2\pi r^2 + \dfrac{256\pi}{r}$, as required.
      - Solve: write $\dfrac{256\pi}{r}$ as $256\pi r^{-1}$. Then $\dfrac{dS}{dr} = 4\pi r - 256\pi r^{-2} = 4\pi r - \dfrac{256\pi}{r^2}$.
      - Set it to 0 and multiply by $r^2$: $4\pi r^3 = 256\pi$, so $r^3 = 64$ and $r = 4$.
      - Prove: $\dfrac{d^2S}{dr^2} = 4\pi + \dfrac{512\pi}{r^3}$, which is positive. So it's a **minimum**.
      - Answer: put $r = 4$ in. $2\pi r^2 = 2\pi(16) = 32\pi$, and $\dfrac{256\pi}{4} = 64\pi$.
      - So $S = 32\pi + 64\pi = 96\pi \approx 302\ \text{cm}^2$.

      Fun fact: then $h = 8$, so the best can is exactly as tall as it is wide.

  - type: check
    questions: [open-cylinder]

  - type: misconceptions
    items:
      - wrong: |-
          $\dfrac{dV}{dx} = 0$ at $x = 2$, so the maximum volume is 2.
        right: |-
          $x = 2$ is *where* the maximum happens. Step 4: put it back in to get $V = 128\ \text{cm}^3$.
      - wrong: |-
          It's a word problem, so it must be a maximum. No need to check.
        right: |-
          The marks need step 3: the second derivative's value or sign, and the word "maximum".
      - wrong: |-
          Keep both $x = 2$ and $x = 6$ as answers.
        right: |-
          Throw out $x = 6$, and say why: the box would have no base.
      - wrong: |-
          From $2x + y = 40$, $y = 40 - x$.
        right: |-
          Move **both** $x$'s: $y = 40 - 2x$. A slip in step 1 ruins everything after it.

  - type: exam
    body: |-
      - These usually start with *show that $V = \dots$*. The answer is given, so show every line of algebra.
      - Couldn't do the *show that*? Use the given formula for the rest; those marks are still there.
      - For step 3, write the second derivative's value or sign **and** the conclusion, e.g. "$-48 < 0$, so maximum".
      - Finish with the quantity asked for, with units, exact or to 3 significant figures.

  - type: takeaways
    items:
      - |-
        The method: formula in one letter, solve, prove, **answer the actual question**.
      - |-
        Use the fixed fact (perimeter, volume) to get rid of the second letter.
      - |-
        Throw out impossible values, and say why.
      - |-
        Finish with the value they asked for, with units, not just the $x$ where it happens.

questions:
  - id: justify-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.7.4"]
    prompt: |-
      A student finds that $\dfrac{dA}{dx} = 0$ when $x = 5$ and $\dfrac{d^2A}{dx^2} = -4$ for all $x$. Which statement completes the argument correctly?
    explanation: |-
      Prove (step 3): a negative second derivative at the stationary point means a ∩ shape, so it's a **maximum**.
    options:
      - text: $\dfrac{d^2A}{dx^2} = -4 < 0$ at $x = 5$, so $A$ has a maximum value there.
        correct: true
        why: |-
          Value, sign and conclusion: exactly what step 3 needs.
      - text: $\dfrac{d^2A}{dx^2} = -4$, so $A$ has a minimum value at $x = 5$.
        why: |-
          Backwards. Negative second derivative means maximum.
      - text: $A$ is positive at $x = 5$, so it is a maximum.
        why: |-
          The sign of $A$ itself says nothing about the nature. Step 3 uses the second derivative.
      - text: $\dfrac{dA}{dx} = 0$, so it must be a maximum.
        why: |-
          $\dfrac{dA}{dx} = 0$ only tells you it's stationary (step 2). It could be a minimum, so you still need step 3.

  - id: box-18
    format: numeric
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      An open box is made from an 18 cm by 18 cm square of card by cutting squares of side $x$ cm from each corner, so $V = x(18 - 2x)^2$. Find the value of $x$ that gives the maximum volume, and the maximum volume.
    fields:
      - label: "x ="
        answer: 3
        unit: cm
      - label: "V ="
        answer: 432
        unit: cm³
    explanation: |-
      - Formula: $V = x(18 - 2x)^2 = 324x - 72x^2 + 4x^3$.
      - Solve: $\dfrac{dV}{dx} = 324 - 144x + 12x^2 = 12(x - 3)(x - 9) = 0$. Throw out $x = 9$, which leaves no base, so $x = 3$.
      - Prove: $\dfrac{d^2V}{dx^2} = 24x - 144$, which is $-72 < 0$ at $x = 3$, so maximum.
      - Answer: $V = 3 \times 12^2 = 432\ \text{cm}^3$.

  - id: product-max
    format: numeric
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      Positive numbers $x$ and $y$ satisfy $x + y = 12$. Find the maximum value of $P = x^2y$.
    fields:
      - label: "P ="
        answer: 256
    explanation: |-
      - Formula: $y = 12 - x$, so $P = x^2(12 - x) = 12x^2 - x^3$.
      - Solve: $\dfrac{dP}{dx} = 24x - 3x^2 = 3x(8 - x) = 0$, so $x = 0$ or $x = 8$. $x$ is positive, so $x = 8$.
      - Prove: $\dfrac{d^2P}{dx^2} = 24 - 6x$, which is $-24 < 0$ at $x = 8$, so maximum.
      - Answer: $y = 4$, so $P = 64 \times 4 = 256$.

  - id: spot-constraint
    format: spot-error
    difficulty: 2
    objectives: ["1.7.4"]
    prompt: |-
      A rectangular pen is built against a long wall, using 40 m of fencing for the other three sides. The two sides perpendicular to the wall are each $x$ m and the side parallel to it is $y$ m.

      A student finds the maximum area. Which line contains the first error?
    lines:
      - |-
        Fencing: $2x + y = 40$
      - |-
        So $y = 40 - x$.
      - |-
        Area $A = xy = 40x - x^2$
      - |-
        $\dfrac{dA}{dx} = 40 - 2x = 0$ gives $x = 20$.
      - |-
        $\dfrac{d^2A}{dx^2} = -2 < 0$, so the maximum area is $20 \times 20 = 400\ \text{m}^2$.
    errorLine: 2
    fix: |-
      $y = 40 - 2x$, so $A = 40x - 2x^2$, $\dfrac{dA}{dx} = 40 - 4x = 0$ at $x = 10$, and the maximum area is $10 \times 20 = 200\ \text{m}^2$.
    explanation: |-
      The slip is in step 1, the formula. Line 1 is right, but rearranging it for $y$ must move **both** $x$'s.

      Check the student's answer: $x = 20$ and $y = 20$ would use $2(20) + 20 = 60$ m of fencing, not 40.

  - id: open-cylinder
    format: numeric
    difficulty: 3
    objectives: ["1.7.4"]
    prompt: |-
      An open cylinder (no lid) has volume $1000\ \text{cm}^3$, so its outer surface area is $S = \pi r^2 + \dfrac{2000}{r}$. Find the radius that minimises $S$, and the minimum value of $S$, both to 3 significant figures.
    fields:
      - label: "r ="
        answer: 6.827840632552956
        sigFigs: 3
        unit: cm
      - label: "S ="
        answer: 439.377566268457
        sigFigs: 3
        unit: cm²
    explanation: |-
      - Formula: given, $S = \pi r^2 + \dfrac{2000}{r}$.
      - Solve: $\dfrac{dS}{dr} = 2\pi r - \dfrac{2000}{r^2} = 0$ gives $r^3 = \dfrac{1000}{\pi}$, so $r = 6.8278\ldots \approx 6.83$ cm.
      - Prove: $\dfrac{d^2S}{dr^2} = 2\pi + \dfrac{4000}{r^3} > 0$, so minimum.
      - Answer: $S = \pi(6.8278\ldots)^2 + \dfrac{2000}{6.8278\ldots} = 146.46\ldots + 292.92\ldots = 439\ \text{cm}^2$ (3 s.f.).
