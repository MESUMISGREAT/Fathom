id: forces-equilibrium-friction-and-newtons-third-law
subject: "9709"
topic: "4.1"
title: Friction, limiting equilibrium and Newton's third law
summary: Use $F\leq\mu R$ and $F=\mu R$ at limiting equilibrium, then identify Newton's third-law pairs.
order: 5
minutes: 8
kind: core
objectives: ["4.1.6", "4.1.7"]
prerequisites: ["forces-equilibrium-contact-forces-and-smooth-surfaces", "forces-equilibrium-resolving-equilibrium"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
    syllabus objectives 4.1.6 and 4.1.7. All questions and examples are original; numerical
    values are illustrative. Use $g=10\text{ m s}^{-2}$ for 9709 mechanics. Not yet
    independently reviewed or reviewed by a teacher.
blocks:
  - type: objective
    body: By the end you can calculate friction in ordinary and limiting equilibrium, use the coefficient of friction, and identify Newton's third-law pairs.
  - type: definition
    term: Limiting friction
    body: >-
      Limiting friction is the greatest frictional force available between two surfaces, with
      magnitude $F=\mu R$, where $\mu$ is the coefficient of friction and $R$ is the normal
      reaction. Therefore, the coefficient of friction is the ratio of limiting friction to
      normal reaction: $\mu=F/R$.
  - type: explain
    title: Friction is helpful, but not unlimited
    body: |-
      Friction acts to oppose the tendency for surfaces to slide. Before sliding starts, it adjusts to whatever value is needed for equilibrium, up to a maximum:
      $$F\leq\mu R.$$

      If an object is **about to slip**, it is in limiting equilibrium. Then friction has reached its maximum and the equality applies:
      $$F=\mu R.$$
  - type: example
    title: A box just about to move
    problem: A $6\text{ kg}$ box is on a rough horizontal floor with coefficient of friction $\mu=0.4$. Find the limiting friction.
    steps:
      - |-
        There are no other vertical forces, so vertical equilibrium gives $R=mg=6(10)=60\text{ N}$.
      - |-
        At limiting equilibrium, use equality: $F=\mu R$.
      - |-
        Therefore $F=0.4(60)=24\text{ N}$.
    answer: The limiting friction is $24\text{ N}$.
  - type: check
    questions: [friction-inequality, limiting-friction, third-law-pair, third-law-direction]
  - type: explain
    title: "Newton's third law: pairs live on different objects"
    body: |-
      Newton's third law says that when object A exerts a force on object B, object B exerts a force of equal magnitude and opposite direction on object A.

      The two forces are a **pair**: they are the same type of interaction, act at the same time, and act on different objects. That last point is why they do not cancel on one force diagram.
  - type: example
    title: The table and the book
    problem: A book rests on a table. Describe the Newton's third-law pair associated with the table's normal reaction on the book.
    steps:
      - |-
        The table exerts an upward normal reaction on the book.
      - |-
        The matching force is the book's downward force on the table.
      - |-
        They are equal in magnitude and opposite in direction, but one acts on the book and the other acts on the table.
    answer: Table on book and book on table form the third-law pair.
  - type: misconceptions
    items:
      - wrong: Friction always equals $\mu R$.
        right: It equals $\mu R$ only at limiting equilibrium; otherwise $F$ can be smaller.
      - wrong: Weight and normal reaction on a resting book are a third-law pair.
        right: They act on the same book, so they can balance but are not a third-law pair.
  - type: exam
    body: Look for “about to slip”, “on the point of moving” or “limiting equilibrium” before using $F=\mu R$. For Newton's third law, name both objects and the interaction direction.
  - type: takeaways
    items:
      - In ordinary equilibrium, $F\leq\mu R$.
      - At impending slip, $F=\mu R$.
      - The coefficient of friction is $\mu=F/R$ at the limiting value.
      - Third-law forces are equal and opposite, same interaction, and act on different objects.
questions:
  - id: friction-inequality
    format: mcq
    difficulty: 1
    objectives: ["4.1.6"]
    prompt: A block is stationary on a rough surface and is not about to slip. Which relationship is always valid?
    options:
      - text: $F\leq\mu R$
        correct: true
        why: Friction adjusts up to, but cannot exceed, its limiting value.
      - text: $F=\mu R$
        correct: false
        why: Equality is required only when the block is at limiting equilibrium.
      - text: $F>\mu R$
        correct: false
        why: That would exceed the maximum friction available.
      - text: $F=R$
        correct: false
        why: Friction and normal reaction are different components and need not have equal magnitudes.
    explanation: Static friction can take any needed value up to $\mu R$.
  - id: limiting-friction
    format: numeric
    difficulty: 2
    objectives: ["4.1.6"]
    prompt: A $4\text{ kg}$ object is on a horizontal rough surface with $\mu=0.25$. It is about to slip. Using $g=10\text{ m s}^{-2}$, find the friction in newtons.
    fields:
      - answer: 10
        unit: N
    explanation: $R=mg=40\text{ N}$ and limiting friction is $F=\mu R=0.25(40)=10\text{ N}$.
  - id: third-law-pair
    format: explain
    difficulty: 2
    objectives: ["4.1.7"]
    prompt: Explain why the upward normal reaction of a table on a book and the downward force of the book on the table form a Newton's third-law pair.
    model: They are forces from the same contact interaction, equal in magnitude, opposite in direction and acting on different objects at the same time.
    keyPoints:
      - Same contact interaction
      - Equal magnitude
      - Opposite directions
      - Act on different objects
    explanation: Newton's third-law pairs are identified by the interaction and the two different objects, not merely by opposite arrows on one diagram.
  - id: third-law-direction
    format: mcq
    difficulty: 1
    objectives: ["4.1.7"]
    prompt: A student pushes a wall to the right. What is the force in the Newton's third-law pair?
    options:
      - text: The wall pushes the student to the left.
        correct: true
        why: It is the equal and opposite contact force from the same interaction.
      - text: The student's weight acts downwards.
        correct: false
        why: Weight is a different interaction with the Earth.
      - text: The wall's weight acts downwards.
        correct: false
        why: The wall's weight is not the reaction to the student's push.
      - text: The student moves to the right.
        correct: false
        why: Motion is not a force, and the reaction is a force exerted by the wall.
    explanation: The wall exerts an equal and opposite force on the student.
