id: forces-equilibrium-friction-and-newtons-third-law
subject: "9709"
topic: "4.1"
title: "Friction, limiting equilibrium and Newton's third law"
summary: "How friction adjusts itself up to a maximum of μR, what 'about to slip' means, and why third-law force pairs never cancel each other."
order: 5
minutes: 10
kind: core
objectives: ["4.1.6", "4.1.7"]
prerequisites: ["forces-equilibrium-contact-forces-and-smooth-surfaces", "forces-equilibrium-resolving-equilibrium"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Redrafted from scratch on 2026-10-30 by Claude Opus 5.5 after a first-time-student read scored the
    previous version 6/10 (formula stated without the idea behind it; one trivial example; a live diagram
    with overlapping, unreadable labels). Written against the official Cambridge International AS & A Level
    Mathematics 9709 syllabus for 2026-2027, objectives 4.1.6 (limiting friction, F = μR or F ≤ μR, "about to
