id: complex-numbers-regions-loci
subject: "9709"
topic: "3.9"
title: Regions and loci on the Argand diagram
summary: "Sketching and interpreting loci defined by equations and inequalities involving modulus and argument."
order: 8
minutes: 5
kind: core
objectives: ["3.9.8"]
prerequisites: ["complex-numbers-argand-diagram", "complex-numbers-geometric-effects"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 3.9 learning outcome 8 (loci and regions).
    Examples and questions are original; all arithmetic checked in Python. Not yet teacher-reviewed.
