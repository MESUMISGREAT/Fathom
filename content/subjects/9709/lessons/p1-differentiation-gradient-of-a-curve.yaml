blocks:
  - type: objective
    body: |-
      By the end you can find the gradient of a **chord** in terms of $h$, and use it to get the **gradient of the curve** at a point.

  - type: explain
    title: What they ask
    body: |-
      *$P(2, 8)$ is on $y = x^3$, and $Q$ is the point on the curve where $x = 2 + h$. Find the gradient of the chord $PQ$ in terms of $h$. Hence find the gradient of the curve at $P$.*

      Giveaway words: **chord**, **$x = 2 + h$**, **in terms of $h$**, **hence the gradient at $P$**.

  - type: explain
    title: The idea in two lines
    body: |-
      A **chord** is a straight line joining two points on a curve. The gradient of the curve at $P$ is the gradient of the **tangent** there, the line that just touches the curve at $P$.

      Slide $Q$ towards $P$ (make $h$ smaller and smaller) and the chord swings round onto the tangent. So the chord gradients close in on the gradient at $P$.

  - type: diagram
    diagram: p1-differentiation-chords-to-tangent
    alt: >-
      Graph of y = x³ for x from 0 to about 3.3, with the point P(2, 8) marked. Three chords run from
      P to points Q on the curve at x = 3, 2.5 and 2.2, labelled h = 1, h = 0.5 and h = 0.2. A
      tangent line at P is labelled tangent at P: gradient 12. A table in the top-left corner,
      headed chord PQ, Q at x = 2 + h, lists h and the chord gradient: 1 gives 19, 0.5 gives 15.25,
      0.2 gives 13.24, 0.01 gives 12.0601, and as h tends to 0 the gradient tends to 12.
    caption: |-
      As $Q$ slides down to $P$, the chord gradients $19, 15.25, 13.24, \dots$ close in on $12$: the gradient of the tangent at $P(2, 8)$.

  - type: explain
    title: The method
    body: |-
      Same four steps every time:

      1. Write $Q$: put its $x$-value (like $2 + h$) into the curve's equation to get its $y$-value.
      2. Chord gradient: $\dfrac{\text{rise}}{\text{run}}$. The run from $P$ to $Q$ is just $h$.
      3. **Cancel the $h$: expand the top, then divide every term by $h$.** This is the step people skip.
      4. Let $h \to 0$: every term with an $h$ in it vanishes. The number left is the gradient of the curve at $P$.

  - type: example
    title: "The easiest one: y = x² at P(1, 1)"
    problem: |-
      $P(1, 1)$ is on $y = x^2$, and $Q$ is the point on the curve where $x = 1 + h$. Find the gradient of $PQ$ in terms of $h$, and hence the gradient of the curve at $P$.
    steps:
      - |-
        **Write $Q$:** $\;Q = \big(1 + h,\ (1 + h)^2\big)$.
      - |-
        **Chord gradient:** $\;\dfrac{(1 + h)^2 - 1}{h}$.
      - |-
        **Cancel the $h$:** $\;(1 + h)^2 = 1 + 2h + h^2$, so the top is $2h + h^2$. Divide by $h$: $\;2 + h$.
      - |-
        **Let $h \to 0$:** $\;2 + h \to 2$.
    answer: |-
      The chord gradient is $2 + h$, and the gradient of the curve at $P$ is $2$.

      Check it another way: $h = 0.1$ puts $Q$ at $(1.1, 1.21)$, and $\dfrac{1.21 - 1}{0.1} = 2.1$, which is $2 + 0.1$ ✓

  - type: check
    questions: [chord-basic, chord-expression, chord-limit]

  - type: example
    title: "Exam-style: y = x³ at P(2, 8)"
    problem: |-
      $P(2, 8)$ is on $y = x^3$, and $Q$ is the point on the curve where $x = 2 + h$. Find the gradient of the chord $PQ$ in terms of $h$, and hence the gradient of the curve at $P$.
    steps:
      - |-
        **Write $Q$:** $\;Q = \big(2 + h,\ (2 + h)^3\big)$.
      - |-
        **Chord gradient:** $\;\dfrac{(2 + h)^3 - 8}{h}$.
      - |-
        **Cancel the $h$:** $\;(2 + h)^3 = 8 + 12h + 6h^2 + h^3$ (binomial expansion), so the top is $12h + 6h^2 + h^3$. Divide by $h$: $\;12 + 6h + h^2$.
      - |-
        **Let $h \to 0$:** $\;6h$ and $h^2$ both vanish, so the gradient $\to 12$.
    answer: |-
      The chord gradient is $12 + 6h + h^2$, and the gradient of the curve at $P$ is $12$.

      That matches the table in the picture: $h = 0.01$ gives $12.0601$.

  - type: check
    questions: [chord-find-h]

  - type: definition
    term: Gradient of a curve, and the derivative
    body: |-
      The **gradient of a curve** at $P$ is the gradient of the tangent at $P$. It is the **limit** of the chord gradients as $Q$ slides into $P$.

      Worked out at every $x$, it becomes a function called the **derivative**. It is written $\dfrac{dy}{dx}$ or $f'(x)$.

      So for $f(x) = x^3$, $\;f'(2) = 12$ means "the gradient at $x = 2$ is 12".

  - type: check
    questions: [limit-cloze, best-description]

  - type: deeper
    title: "Why it works: zoom in"
    body: |-
      Zoom in on a smooth curve again and again, and the bit around $P$ looks more and more like a straight line. That line is the tangent.

      It's like the Earth looking flat where you're standing.

      The idea breaks at a sharp corner. Zoom in on the point of a V shape and it never straightens out, so there's no single gradient there.

  - type: misconceptions
    items:
      - wrong: |-
          Skip the cancelling and put $h = 0$ straight into $\dfrac{(2 + h)^3 - 8}{h}$.
        right: |-
          That gives $\dfrac00$, which means nothing. **Cancel the $h$** first, *then* let $h \to 0$.
      - wrong: |-
          The chord from $(1, 1)$ to $(3, 27)$ on $y = x^3$ gives the gradient of the curve at $x = 2$.
        right: |-
          A chord only gives an *average* gradient over a stretch. For the gradient at a point, the chord has to shrink right down to that point.
      - wrong: |-
          $\dfrac{dy}{dx}$ means $dy$ divided by $dx$, so you can cancel the $d$s.
        right: |-
          Treat $\dfrac{dy}{dx}$ as one symbol: "the derivative of $y$ with respect to $x$". Nothing cancels.

  - type: exam
    body: |-
      Write one line for each step, so the examiner can tick each one:

      - **Write $Q$ and the chord gradient:** $\dfrac{(2 + h)^3 - 8}{h}$.
      - **Cancel the $h$:** show the expansion, then $12 + 6h + h^2$.
      - **Let $h \to 0$:** write "as $h \to 0$, gradient $\to 12$".

      You won't be asked to do this for a general curve. Everywhere else you'll use the quick rules in the next lesson.

  - type: takeaways
    items:
      - |-
        The method: write $Q$, chord gradient over $h$, **cancel the $h$**, then let $h \to 0$.
      - |-
        The gradient of a curve at $P$ is the gradient of the tangent at $P$: the limit of the chord gradients.
      - |-
        Never put $h = 0$ straight in. You get $\dfrac00$.
      - |-
        The gradient function is written $\dfrac{dy}{dx}$ or $f'(x)$, and $f'(2)$ is the gradient where $x = 2$.

questions:
  - id: chord-basic
    format: numeric
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      Find the gradient of the chord joining the points $(1, 1)$ and $(3, 9)$ on the curve $y = x^2$.
    fields:
      - answer: 4
    explanation: |-
      **Chord gradient:** $\;\dfrac{\text{rise}}{\text{run}} = \dfrac{9 - 1}{3 - 1} = \dfrac82 = 4$.

      That's the *average* steepness from $x = 1$ to $x = 3$, not the gradient at one point.

  - id: limit-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      As the point $Q$ slides along the curve towards $P$, the chord $PQ$ gets closer and closer to the {{1}} to the curve at $P$.
    blanks:
      - accept: ["tangent", "tangent line", "the tangent"]
    explanation: |-
      As $h \to 0$ the chords swing onto the **tangent** at $P$. So their gradients close in on the gradient of the tangent, which is the gradient of the curve at $P$.

  - id: chord-expression
    format: expression
    difficulty: 2
    objectives: ["1.7.1"]
    prompt: |-
      $P$ is the point $(3, 9)$ on $y = x^2$ and $Q$ is the point on the curve with $x$-coordinate $3 + h$. Find and simplify the gradient of the chord $PQ$ in terms of $h$.
    answer: 6 + h
    variables: [h]
    domain: { min: 0.1, max: 4 }
    display: |-
      $6 + h$
    explanation: |-
      - **Write $Q$:** $\;\big(3 + h,\ (3 + h)^2\big)$.
      - **Chord gradient:** $\;\dfrac{(3 + h)^2 - 9}{h}$.
      - **Cancel the $h$:** $\;\dfrac{9 + 6h + h^2 - 9}{h} = \dfrac{6h + h^2}{h} = 6 + h$.

  - id: chord-limit
    format: numeric
    difficulty: 2
    objectives: ["1.7.1"]
    prompt: |-
      On $y = x^2$, the chord from $(3, 9)$ to the point with $x$-coordinate $3 + h$ has gradient $6 + h$. State the gradient of the curve at $(3, 9)$.
    fields:
      - answer: 6
    explanation: |-
      **Let $h \to 0$:** $\;6 + h \to 6$. So the gradient of $y = x^2$ at $(3, 9)$ is 6.

      Check with $h = 0.1$: the chord gradient is $6.1$, just above 6.

  - id: best-description
    format: mcq
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      Which statement best describes the gradient of a curve at a point $P$?
    explanation: |-
      The gradient at $P$ is the limit of the chord gradients as $Q$ slides into $P$. That's the same as the gradient of the tangent at $P$.
    options:
      - text: The limit of the gradients of the chords $PQ$ as $Q$ approaches $P$ along the curve
        correct: true
        why: |-
          That's the definition: the chords close in on the tangent, and their gradients close in on the gradient at $P$.
      - text: The gradient of the line from the origin to $P$
        why: |-
          That line usually cuts through the curve. It has nothing to do with how steep the curve is at $P$.
      - text: The $y$-coordinate of $P$ divided by the $x$-coordinate of $P$
        why: |-
          That's the origin-line gradient in disguise. On $y = x^3$ at $(2, 8)$ it gives 4, but the true gradient is 12.
      - text: The gradient of the chord $PQ$ when $Q$ is exactly at $P$
        why: |-
          With $Q$ on top of $P$ there's only one point, so the gradient is $\dfrac00$. You need the *limit* as $h \to 0$, after cancelling the $h$.

  - id: chord-find-h
    format: numeric
    difficulty: 3
    objectives: ["1.7.1"]
    prompt: |-
      On $y = x^3$, the chord from the point $(1, 1)$ to the point with $x$-coordinate $1 + h$ has gradient $3 + 3h + h^2$. Find the positive value of $h$ for which the chord gradient is 7, and state the gradient of the curve at $(1, 1)$.
    fields:
      - label: "h ="
        answer: 1
      - label: "gradient at (1, 1) ="
        answer: 3
    explanation: |-
      **Chord gradient = 7:** $\;3 + 3h + h^2 = 7$ gives $h^2 + 3h - 4 = 0$, so $(h + 4)(h - 1) = 0$ and $h = 1$ (the positive one).

      Check: the chord from $(1, 1)$ to $(2, 8)$ has gradient $\dfrac{8 - 1}{2 - 1} = 7$ ✓

      **Let $h \to 0$:** $\;3 + 3h + h^2 \to 3$, so the gradient of the curve at $(1, 1)$ is 3.
