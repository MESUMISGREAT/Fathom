id: p1-differentiation-gradient-of-a-curve
subject: "9709"
topic: "1.7"
title: The gradient of a curve
summary: The gradient of a curve at a point is the limit of the gradients of chords as the second point slides in; we write it dy/dx or f′(x).
order: 1
minutes: 5
kind: core
objectives: ["1.7.1"]
prerequisites: [coordinate-geometry-gradient-distance-midpoint]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.7 learning outcome "understand the gradient
    of a curve at a point as the limit of the gradients of a suitable sequence of chords, and use
    the notations f′(x), f″(x), dy/dx and d²y/dx²", using the syllabus's own illustration (chord
    from x = 2 to x = 2 + h on y = x³) with only an informal idea of a limit; formal
    differentiation from first principles is not required. The second-derivative notation is
    taught in the next lesson. All examples and questions are original; all arithmetic checked in
    Python. Not yet teacher-reviewed.

blocks:
  - type: objective
    body: |-
      By the end you can explain the gradient of a curve at a point as the **limit of the gradients of chords**, work out chord gradients like the one on $y = x^3$ from $x = 2$ to $x = 2 + h$, and use the notations $\dfrac{dy}{dx}$ and $f'(x)$.

  - type: explain
    title: A hill doesn't have one gradient
    body: |-
      A straight line has one gradient, everywhere. A curve is more like a road over a hill: gentle at the bottom, steep halfway up, flat at the top.

      So for a curve we ask: *how steep is it right here, at this point?* The answer is the gradient of the **tangent** at that point, the line that just grazes the curve there.

      Snag: a gradient needs **two** points ($\frac{\text{rise}}{\text{run}}$), and a tangent only gives us one. Time for a trick.

  - type: explain
    title: Chords that close in
    body: |-
      Take the point $P$ you care about, and a second point $Q$ on the curve a little further along. The straight line $PQ$ is a **chord**, and you *can* find its gradient.

      Now slide $Q$ towards $P$. The chords swing round and get closer and closer to the tangent. Their gradients settle down to a single number: the gradient of the curve at $P$.

  - type: diagram
    diagram: p1-differentiation-chords-to-tangent
    alt: >-
      Graph of y = x³ for x from 0 to about 3.3, with the point P(2, 8) marked. Three chords run from
      P to points Q on the curve at x = 3, 2.5 and 2.2, labelled h = 1, h = 0.5 and h = 0.2. A
      tangent line at P is labelled tangent at P: gradient 12. A table in the top-left corner,
      headed chord PQ, Q at x = 2 + h, lists h and the chord gradient: 1 gives 19, 0.5 gives 15.25,
      0.2 gives 13.24, 0.01 gives 12.0601, and as h tends to 0 the gradient tends to 12.
    caption: |-
      As $Q$ slides down to $P$, the chord gradients $19, 15.25, 13.24, \dots$ close in on $12$: the gradient of the tangent at $P(2, 8)$.

  - type: check
    questions: [chord-basic, limit-cloze, best-description]

  - type: example
    title: The chord from x = 2 to x = 2 + h on y = x³
    problem: |-
      $P$ is the point $(2, 8)$ on $y = x^3$ and $Q$ is the point on the curve with $x$-coordinate $2 + h$. Find the gradient of the chord $PQ$ in terms of $h$, and hence the gradient of the curve at $P$.
    steps:
      - |-
        $Q$ is $\left(2 + h,\ (2 + h)^3\right)$. Gradient of $PQ$ $= \dfrac{(2 + h)^3 - 8}{(2 + h) - 2} = \dfrac{(2 + h)^3 - 8}{h}$.
      - |-
        Expand (binomial, row 3): $(2 + h)^3 = 8 + 12h + 6h^2 + h^3$.
      - |-
        So the gradient is $\dfrac{12h + 6h^2 + h^3}{h} = 12 + 6h + h^2$ (for $h \neq 0$).
      - |-
        As $Q$ slides towards $P$, $h \to 0$, so $6h + h^2 \to 0$ and the gradient $\to 12$.
    answer: |-
      The chord gradient is $12 + 6h + h^2$, and the gradient of $y = x^3$ at $(2, 8)$ is $12$. That matches the table: $h = 0.01$ gives $12.0601$.

  - type: intuition
    title: Zoom in far enough and it's straight
    body: |-
      Zoom in on a smooth curve, again and again, and the bit around $P$ looks more and more like a straight line. That line is the tangent; its gradient is what we're after.

      It's like the Earth looking flat from where you're standing. The analogy breaks at sharp corners: zoom in on the point of a V shape and it never straightens out, so there's no single gradient there.

  - type: definition
    term: Gradient of a curve and the derivative
    body: |-
      The **gradient of a curve** at a point $P$ is the gradient of the tangent at $P$. It is the **limit** of the gradients of the chords $PQ$ as $Q$ approaches $P$ along the curve.

      For $y = f(x)$, the gradient at a general point is a function of $x$, called the **derivative** (or gradient function). It is written

      $$\frac{dy}{dx} \quad \text{or} \quad f'(x).$$

      For example, if $f(x) = x^3$ then $f'(2) = 12$.

  - type: check
    questions: [chord-expression, chord-limit, chord-find-h]

  - type: misconceptions
    items:
      - wrong: |-
          Just put $h = 0$ into $\dfrac{(2 + h)^3 - 8}{h}$.
        right: |-
          That gives $\dfrac00$, which means nothing. Simplify first (cancel the $h$), *then* let $h \to 0$.
      - wrong: |-
          The gradient of the chord from $(1, 1)$ to $(3, 27)$ on $y = x^3$ is the gradient of the curve at $x = 2$.
        right: |-
          A chord gives an *average* gradient over a stretch. The gradient at a point needs the chord to shrink right down to that point.
      - wrong: |-
          $\dfrac{dy}{dx}$ means $dy$ divided by $dx$, so you can cancel the $d$s.
        right: |-
          At this level treat $\dfrac{dy}{dx}$ as one symbol meaning "the derivative of $y$ with respect to $x$". Nothing cancels.

  - type: exam
    body: |-
      - You won't be asked to differentiate from first principles in general, but a chord question like the example above can appear. Show the expansion, the cancelled $h$, and a clear "as $h \to 0$" step.
      - In almost every other question you'll use the rules for differentiating (next lesson). This lesson is *why* those rules mean "gradient".
      - Notation is examined: know that $f'(3)$ means the gradient of $y = f(x)$ where $x = 3$.

  - type: takeaways
    items:
      - |-
        The gradient of a curve at a point is the gradient of the tangent there.
      - |-
        It's the limit of chord gradients as the second point slides in: on $y = x^3$, $12 + 6h + h^2 \to 12$ at $x = 2$.
      - |-
        Simplify before letting $h \to 0$; putting $h = 0$ straight in gives $\frac00$.
      - |-
        The gradient function is written $\dfrac{dy}{dx}$ or $f'(x)$.

questions:
  - id: chord-basic
    format: numeric
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      Find the gradient of the chord joining the points $(1, 1)$ and $(3, 9)$ on the curve $y = x^2$.
    fields:
      - answer: 4
    explanation: |-
      Gradient $= \dfrac{9 - 1}{3 - 1} = \dfrac82 = 4$. That's the *average* steepness between $x = 1$ and $x = 3$, not the gradient at any one point (though for $y = x^2$ it happens to equal the gradient at the midpoint $x = 2$).

  - id: limit-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      As the point $Q$ slides along the curve towards $P$, the chord $PQ$ gets closer and closer to the {{1}} to the curve at $P$.
    blanks:
      - accept: ["tangent", "tangent line", "the tangent"]
    explanation: |-
      The chords approach the **tangent** at $P$, so their gradients approach the gradient of the tangent, which is the gradient of the curve at $P$.

  - id: chord-expression
    format: expression
    difficulty: 2
    objectives: ["1.7.1"]
    prompt: |-
      $P$ is the point $(3, 9)$ on $y = x^2$ and $Q$ is the point on the curve with $x$-coordinate $3 + h$. Find and simplify the gradient of the chord $PQ$ in terms of $h$.
    answer: 6 + h
    variables: [h]
    domain: { min: 0.1, max: 4 }
    display: |-
      $6 + h$
    explanation: |-
      $\dfrac{(3 + h)^2 - 9}{h} = \dfrac{9 + 6h + h^2 - 9}{h} = \dfrac{6h + h^2}{h} = 6 + h$.

  - id: chord-limit
    format: numeric
    difficulty: 2
    objectives: ["1.7.1"]
    prompt: |-
      On $y = x^2$, the chord from $(3, 9)$ to the point with $x$-coordinate $3 + h$ has gradient $6 + h$. State the gradient of the curve at $(3, 9)$.
    fields:
      - answer: 6
    explanation: |-
      As $h \to 0$, $6 + h \to 6$. So the gradient of $y = x^2$ at $(3, 9)$ is 6. (Check with $h = 0.1$: the chord gradient is $6.1$, just above 6.)

  - id: best-description
    format: mcq
    difficulty: 1
    objectives: ["1.7.1"]
    prompt: |-
      Which statement best describes the gradient of a curve at a point $P$?
    explanation: |-
      The gradient at $P$ is the limit of the chord gradients as $Q \to P$; equivalently, the gradient of the tangent at $P$.
    options:
      - text: The limit of the gradients of the chords $PQ$ as $Q$ approaches $P$ along the curve
        correct: true
        why: |-
          That's exactly the definition: the chords close in on the tangent, and their gradients close in on the gradient at $P$.
      - text: The gradient of the line from the origin to $P$
        why: |-
          That line usually cuts through the curve; it has nothing to do with how steep the curve is at $P$.
      - text: The $y$-coordinate of $P$ divided by the $x$-coordinate of $P$
        why: |-
          That's the same origin-line gradient in disguise. On $y = x^3$ at $(2, 8)$ it gives 4, but the true gradient is 12.
      - text: The gradient of the chord $PQ$ when $Q$ is exactly at $P$
        why: |-
          When $Q$ is at $P$ there's only one point, so the gradient formula gives $\frac00$. You need the *limit* as $Q$ gets close.

  - id: chord-find-h
    format: numeric
    difficulty: 3
    objectives: ["1.7.1"]
    prompt: |-
      On $y = x^3$, the chord from the point $(1, 1)$ to the point with $x$-coordinate $1 + h$ has gradient $3 + 3h + h^2$. Find the positive value of $h$ for which the chord gradient is 7, and state the gradient of the curve at $(1, 1)$.
    fields:
      - label: "h ="
        answer: 1
      - label: "gradient at (1, 1) ="
        answer: 3
    explanation: |-
      $3 + 3h + h^2 = 7$ gives $h^2 + 3h - 4 = 0$, so $(h + 4)(h - 1) = 0$ and $h = 1$ (positive). Check: the chord from $(1, 1)$ to $(2, 8)$ has gradient $7$ ✓

      As $h \to 0$, $3 + 3h + h^2 \to 3$, so the gradient of the curve at $(1, 1)$ is 3.
