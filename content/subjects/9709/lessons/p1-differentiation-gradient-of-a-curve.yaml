id: p1-differentiation-gradient-of-a-curve
subject: "9709"
topic: "1.7"
title: The gradient of a curve
summary: Find the gradient of a chord PQ in terms of h, cancel the h, then let h shrink to zero to get the gradient of the curve at P. That gradient is written d y by d x, or f′(x).
order: 1
minutes: 5
kind: core
objectives: ["1.7.1"]
prerequisites: [coordinate-geometry-gradient-distance-midpoint]
