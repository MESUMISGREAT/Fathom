blocks:
  - type: objective
    body: |-
      By the end you can differentiate a **bracket raised to a power**, like $(3x - 1)^5$ or $\sqrt{2x^3 + 5}$, in one line. This is called the **chain rule**.

  - type: explain
    title: Just one extra step
    body: |-
      You already know how to differentiate $x^3$: power down, take one off, so $3x^2$.

      When there's a **bracket** with $x$ inside it, think of the bracket as a **box**. Then:

      1. Differentiate as normal: power down, take one off, and keep the box **exactly the same**.
      2. **Multiply by the derivative of the box.**

      That second step is the only new thing. That's the whole chain rule.

  - type: definition
    term: The chain rule
    body: |-
      $$\frac{d}{dx}\big(\,\boxed{\;\text{box}\;}\,\big)^n = n\big(\,\boxed{\;\text{box}\;}\,\big)^{n-1} \times \big(\text{derivative of the box}\big)$$

      - The power comes down and drops by 1, like always.
      - The box doesn't change.
      - Then **multiply by the derivative of the box**.

  - type: diagram
    diagram: p1-differentiation-chain-box
    alt: >-
      At the top, y = (2x + 1)² with 2x + 1 drawn inside a coloured box. Three numbered steps
      follow. Step 1, power down, box stays the same: 2 times (2x + 1) to the power 1, with 2x + 1
      still boxed. Step 2, derivative of the box: 2x + 1 goes to 2. Step 3, multiply them: 2(2x +
      1) times 2 equals 4(2x + 1). The bottom line checks it by expanding: y = 4x² + 4x + 1, so
      dy/dx = 8x + 4 = 4(2x + 1), with a tick.
    caption: |-
      Start with an easy one. Expanding gives the same answer, so you can see the extra step works before you use it on harder ones.

  - type: example
    title: Now one you wouldn't want to expand
    problem: |-
      Differentiate $y = (3x - 1)^5$.
    steps:
      - |-
        Power down, box stays the same: $5(3x - 1)^4$.
      - |-
        Derivative of the box: $3x - 1 \to 3$.
      - |-
        Multiply: $5(3x - 1)^4 \times 3 = 15(3x - 1)^4$.
    answer: |-
      $\dfrac{dy}{dx} = 15(3x - 1)^4$.

      Expanding first would give six terms to differentiate. This took one line.

  - type: check
    questions: [chain-linear, chain-mcq]

  - type: example
    title: A square root
    problem: |-
      Find $\dfrac{dy}{dx}$ given $y = \sqrt{2x^3 + 5}$.
    steps:
      - |-
        Write the root as a power: $y = (2x^3 + 5)^{\frac12}$.
      - |-
        Power down, box stays the same: $\tfrac12(2x^3 + 5)^{-\frac12}$.
      - |-
        Derivative of the box: $2x^3 + 5 \to 6x^2$.
      - |-
        Multiply: $\tfrac12(2x^3 + 5)^{-\frac12} \times 6x^2 = 3x^2(2x^3 + 5)^{-\frac12}$.
    answer: |-
      $\dfrac{dy}{dx} = \dfrac{3x^2}{\sqrt{2x^3 + 5}}$

  - type: example
    title: A bracket on the bottom
    problem: |-
      Differentiate $y = \dfrac{4}{(1 - 2x)^2}$.
    steps:
      - |-
        Write it as a power: $y = 4(1 - 2x)^{-2}$.
      - |-
        Power down, box stays the same: $4 \times (-2)(1 - 2x)^{-3} = -8(1 - 2x)^{-3}$.
      - |-
        Derivative of the box: $1 - 2x \to -2$.
      - |-
        Multiply: $-8(1 - 2x)^{-3} \times (-2) = 16(1 - 2x)^{-3}$.
    answer: |-
      $\dfrac{dy}{dx} = \dfrac{16}{(1 - 2x)^3}$.

      Two negatives made a positive, so watch the signs.

  - type: check
    questions: [chain-root, chain-reciprocal, spot-chain]

  - type: deeper
    title: Gradient at a point
    body: |-
      *Find the gradient of $y = (x^2 + 1)^3$ at $x = 1$.*

      - Power down, box stays: $3(x^2 + 1)^2$.
      - Derivative of the box: $2x$.
      - Multiply: $\dfrac{dy}{dx} = 6x(x^2 + 1)^2$. At $x = 1$: $6 \times 1 \times 2^2 = 24$.

      Differentiate **first**, then put the number in. Put $x = 1$ in first and you get $y = 8$, a constant, whose derivative is a useless 0.

  - type: check
    questions: [chain-value]

  - type: misconceptions
    items:
      - wrong: |-
          $\dfrac{d}{dx}(5 - x^2)^3 = 3(5 - x^2)^2$
        right: |-
          You forgot the extra step: multiply by the derivative of the box, $-2x$. The answer is $-6x(5 - x^2)^2$.
      - wrong: |-
          $\dfrac{d}{dx}(5 - x^2)^3 = 3(5 - 2x)^2$
        right: |-
          The box stays **exactly** the same. Its derivative goes on the outside, as the multiplier.
      - wrong: |-
          $\dfrac{d}{dx}(x^3 + 1)^{-\frac12} = -\tfrac12(x^3 + 1)^{-\frac12} \times 3x^2$
        right: |-
          The power still drops by 1: $-\tfrac12 - 1 = -\tfrac32$. So it's $-\tfrac32 x^2(x^3 + 1)^{-\frac32}$.

  - type: exam
    body: |-
      - The chain rule turns up all over Paper 1: tangents, stationary points and rates of change often start with differentiating a bracket.
      - Write the "multiply by the derivative of the box" step in your working, so the examiner can see it.
      - Leave answers factorised, like $15(3x - 1)^4$. Expanding wastes time and invites mistakes.

  - type: deeper
    title: "Optional: how textbooks write it"
    body: |-
      Textbooks call the box $u$ and write the chain rule as $\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx}$.

      - It says exactly the same thing: (power down, box the same) × (derivative of the box).
      - You'll meet this form again in **connected rates of change**. For differentiating brackets, the box way is all you need.

  - type: takeaways
    items:
      - |-
        Bracket with $x$ inside? Power down, keep the box the same, then **multiply by the derivative of the box**.
      - |-
        Write roots and fractions as powers first: $\sqrt{2x + 1} = (2x + 1)^{\frac12}$ and $\dfrac{1}{(3x + 1)^2} = (3x + 1)^{-2}$.
      - |-
        If the box is $ax + b$, its derivative is just $a$: $\;\dfrac{d}{dx}(ax + b)^n = an(ax + b)^{n-1}$.
      - |-
        Differentiate first, put numbers in afterwards.

questions:
  - id: chain-linear
    format: expression
    difficulty: 1
    objectives: ["1.7.2"]
    prompt: |-
      Differentiate $y = (2x + 7)^4$.
    answer: 8(2x + 7)^3
    variables: [x]
    display: |-
      $8(2x + 7)^3$
    explanation: |-
      Power down, box stays: $4(2x + 7)^3$. Derivative of the box: 2. Multiply: $8(2x + 7)^3$.

  - id: chain-mcq
    format: mcq
    difficulty: 1
    objectives: ["1.7.2"]
    prompt: |-
      What is $\dfrac{d}{dx}(5 - x^2)^3$?
    explanation: |-
      Power down, box stays: $3(5 - x^2)^2$. Derivative of the box: $-2x$. Multiply: $-6x(5 - x^2)^2$.
    options:
      - text: $-6x(5 - x^2)^2$
        correct: true
        why: |-
          Power down with the box unchanged, $3(5 - x^2)^2$, times the derivative of the box, $-2x$.
      - text: $3(5 - x^2)^2$
        why: |-
          The derivative of the box, $-2x$, is missing. That's the most common chain-rule slip.
      - text: $6x(5 - x^2)^2$
        why: |-
          Sign slip: the box is $5 - x^2$, whose derivative is $-2x$, not $2x$.
      - text: $-6x(5 - 2x)^2$
        why: |-
          The box was changed. It must stay exactly as $(5 - x^2)$.

  - id: chain-root
    format: expression
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      Find $\dfrac{dy}{dx}$ when $y = \sqrt{4x - 3}$.
    answer: 2(4x - 3)^(-1/2)
    variables: [x]
    domain: { min: 1, max: 5 }
    display: |-
      $2(4x - 3)^{-\frac12} = \dfrac{2}{\sqrt{4x - 3}}$
    explanation: |-
      $y = (4x - 3)^{\frac12}$, so $\dfrac{dy}{dx} = \tfrac12(4x - 3)^{-\frac12} \times 4 = 2(4x - 3)^{-\frac12}$.

  - id: chain-reciprocal
    format: expression
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      Differentiate $y = \dfrac{6}{(3x + 1)^2}$.
    answer: -36(3x + 1)^(-3)
    variables: [x]
    domain: { min: 0, max: 4 }
    display: |-
      $-36(3x + 1)^{-3} = -\dfrac{36}{(3x + 1)^3}$
    explanation: |-
      $y = 6(3x + 1)^{-2}$, so $\dfrac{dy}{dx} = 6 \times (-2)(3x + 1)^{-3} \times 3 = -36(3x + 1)^{-3}$.

  - id: spot-chain
    format: spot-error
    difficulty: 2
    objectives: ["1.7.2"]
    prompt: |-
      A student differentiates $y = \dfrac{1}{\sqrt{x^3 + 1}}$. Which line contains the first error?
    lines:
      - |-
        $y = (x^3 + 1)^{-\frac12}$
      - |-
        $\dfrac{dy}{dx} = -\tfrac12(x^3 + 1)^{-\frac12} \times 3x^2$
      - |-
        $= -\dfrac{3x^2}{2\sqrt{x^3 + 1}}$
    errorLine: 2
    fix: |-
      The power should drop to $-\tfrac32$: $\;\dfrac{dy}{dx} = -\tfrac12(x^3 + 1)^{-\frac32} \times 3x^2 = -\dfrac{3x^2}{2(x^3 + 1)^{\frac32}}$.
    explanation: |-
      Line 1 rewrites correctly. In line 2 the student brought the $-\tfrac12$ down but forgot to subtract 1 from the power: $-\tfrac12 - 1 = -\tfrac32$.

  - id: chain-value
    format: numeric
    difficulty: 3
    objectives: ["1.7.2"]
    prompt: |-
      The curve $y = \sqrt{2x + 1}$ has gradient $\tfrac13$ at the point $P$. Find the coordinates of $P$.
    fields:
      - label: "x ="
        answer: 4
      - label: "y ="
        answer: 3
    explanation: |-
      $y = (2x + 1)^{\frac12}$, so $\dfrac{dy}{dx} = \tfrac12(2x + 1)^{-\frac12} \times 2 = \dfrac{1}{\sqrt{2x + 1}}$.

      $\dfrac{1}{\sqrt{2x + 1}} = \dfrac13$ gives $\sqrt{2x + 1} = 3$, so $2x + 1 = 9$, $x = 4$ and $y = 3$. So $P = (4, 3)$.
