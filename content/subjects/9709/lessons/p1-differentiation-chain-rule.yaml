id: p1-differentiation-chain-rule
subject: "9709"
topic: "1.7"
title: The chain rule
summary: Differentiate a bracket raised to a power, like (2x + 1)², in one line. Power down, then multiply by the derivative of the bracket.
order: 3
minutes: 5
kind: core
objectives: ["1.7.2"]
prerequisites: [p1-differentiation-powers-of-x, functions-composite-functions]
