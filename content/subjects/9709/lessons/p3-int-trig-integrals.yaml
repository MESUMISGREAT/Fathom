id: p3-int-trig-integrals
subject: '9709'
topic: '3.5'
title: 'Trig integrals: rewrite with an identity first'
summary: Squared sines and cosines, and products like $\sin 3x\cos 3x$, are not standard integrals — the double-angle
  identities turn them into ones that are.
order: 2
minutes: 5
kind: core
objectives:
- 3.5.2
prerequisites:
- p3-int-standard-integrals
