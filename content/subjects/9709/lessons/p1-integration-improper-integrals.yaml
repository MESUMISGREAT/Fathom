  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.8 learning outcome "evaluate definite
    integrals", including the guidance's simple cases of improper integrals (the syllabus's two
