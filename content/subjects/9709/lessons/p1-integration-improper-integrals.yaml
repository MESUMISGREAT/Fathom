id: p1-integration-improper-integrals
subject: "9709"
topic: "1.8"
title: Improper integrals
summary: When a limit is ∞, or the function blows up at a limit, integrate as normal, then ask what each term does there.
order: 5
minutes: 5
kind: core
objectives: ["1.8.3"]
prerequisites: [p1-integration-definite-integrals]
