id: circular-measure-radians
subject: "9709"
topic: "1.4"
title: Radians, the circle's own unit
summary: Define the radian, convert between radians and degrees, and know the key angles (π/6, π/4, π/3, π/2, π…) by heart.
order: 1
minutes: 6
kind: core
objectives: ["1.4.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus
    for 2026-2027 (Version 4, December 2025): topic 1.4 learning outcome "understand the
    definition of a radian, and use the relationship between radians and degrees". All examples
