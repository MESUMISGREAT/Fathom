id: probability-counting-permutations-combinations
subject: "9709"
topic: "5.3"
title: Counting outcomes with permutations and combinations
summary: Find probabilities when the sample space is too large to list, by counting outcomes with permutations when order matters and combinations when it does not.
order: 2
minutes: 7
kind: core
objectives: ["5.3.1"]
prerequisites: ["stats-permutations-combinations", "probability-sample-space"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Mathematics 9709
