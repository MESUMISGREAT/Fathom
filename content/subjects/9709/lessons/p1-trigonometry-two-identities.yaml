id: p1-trigonometry-two-identities
subject: "9709"
topic: "1.5"
title: "The two identities: tan θ ≡ sin θ ÷ cos θ and sin²θ + cos²θ ≡ 1"
summary: Use tan θ ≡ sin θ / cos θ and sin²θ + cos²θ ≡ 1 to find exact trig values from one given ratio and to simplify expressions.
order: 6
minutes: 5
kind: core
objectives: ["1.5.4"]
prerequisites: [p1-trigonometry-exact-values]
