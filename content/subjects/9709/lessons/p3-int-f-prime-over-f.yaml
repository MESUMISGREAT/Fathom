id: p3-int-f-prime-over-f
subject: '9709'
topic: '3.5'
title: 'k f′(x) / f(x): the missing numerator trick'
summary: When the top is (nearly) the derivative of the bottom, the integral is a log — and tan x and x/(x²+1) are
  both this trick in disguise.
order: 4
minutes: 8
kind: core
objectives:
- 3.5.4
prerequisites:
- p3-int-standard-integrals
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: "Drafted against the official Cambridge International AS & A Level Mathematics 9709 syllabus 2026-2027,\
    \ topic 3.5, learning outcome 3.5.4, including the syllabus examples x/(x² + 1) and tan x. Answers were verified\
    \ in Python. All questions are original.\n    Adversarially re-checked in this cloud session: every numeric\
