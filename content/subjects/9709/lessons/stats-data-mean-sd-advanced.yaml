id: stats-data-mean-sd-advanced
subject: "9709"
topic: "5.1"
title: "Mean and standard deviation from tables, totals and coded data"
summary: "Finding the mean and standard deviation when you are given a grouped table, only the totals, or coded totals, and combining two data sets."
order: 5
minutes: 10
kind: core
objectives: ["5.1.5"]
prerequisites: ["stats-data-central-tendency"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Redrafted from scratch on 2026-10-30 by Claude Opus 5.5 after a first-time-student read scored the
    previous version 5.5/10 (plain-text formula walls, steps without reasons). Written against the official
    Cambridge International AS & A Level Mathematics 9709 syllabus for 2026-2027, topic 5.1 outcome 5
    (mean and standard deviation from data, from totals, from coded totals of the form x - a, and for up to
    two data sets). Standard deviation uses the divisor n. Examples and questions are original; every worked
    figure was recomputed by hand. Awaiting independent review; not reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can find the mean and standard deviation of data given in a grouped frequency table,
      from the totals $\Sigma x$ and $\Sigma x^2$, and from coded totals $\Sigma(x - a)$ and $\Sigma(x - a)^2$,
      and you can combine two data sets into one.

  - type: explain
    title: Where we are starting from
    body: |
      In the last lesson you found the mean and standard deviation of a short list of numbers:

      $$\bar{x} = \frac{\Sigma x}{n} \qquad \sigma = \sqrt{\frac{\Sigma x^2}{n} - \bar{x}^2}$$

      Look closely at those two formulas. **Everything they need is three numbers:** how many values there
      are ($n$), their total ($\Sigma x$), and the total of their squares ($\Sigma x^2$). You never need the
      individual values themselves.

      That one observation is the key to this whole lesson. Exam questions often hide the data and give you
      something else instead: a frequency table, the totals, or "coded" totals. Each time, the job is the
      same: **get hold of $n$, $\Sigma x$ and $\Sigma x^2$ (or something equivalent), then use the two formulas.**

  - type: explain
    title: Key to the symbols
    body: |
      | Symbol | Meaning |
      | --- | --- |
      | $n$ | the number of data values |
      | $f$ | the **frequency**: how many values are in a class (a row of a table) |
      | $x$ | a data value; in a grouped table, the **midpoint** of a class |
      | $\Sigma x$ | the total of the values |
      | $\Sigma x^2$ | the total of the **squares** of the values (square each, then add) |
      | $\Sigma f x$, $\Sigma f x^2$ | the same totals worked out from a frequency table |
      | $\bar{x}$ | the mean |
      | $\sigma$ | the standard deviation |
      | $a$ | a convenient number subtracted from every value when data are **coded** |

  - type: explain
    title: Grouped data — use the midpoints
    body: |
      Sometimes the data come as a table of **classes** like "10 to 20 minutes: 12 people". You do not know
      exactly where each of those 12 values is, only that each is somewhere between 10 and 20.

      The standard trick is to **pretend every value in a class sits at the class midpoint** (15 here).
      Some are really above the midpoint and some below, so the errors roughly cancel. Because we have
      guessed, the answers are **estimates**, and you should say so.

      Now the 12 people in that class behave like the value 15 written down 12 times. Their total is
      $12 \times 15$, which is $f x$. Their squares total $12 \times 15^2$, which is $f x^2$. Adding these up over
      every class gives:

      $$\bar{x} = \frac{\Sigma f x}{\Sigma f} \qquad \sigma = \sqrt{\frac{\Sigma f x^2}{\Sigma f} - \bar{x}^2}$$

      These are exactly the old formulas. The only change is that $n$ is now $\Sigma f$ (the total frequency)
      and each total is built row by row. Set your working out as a table with columns $x$, $f$, $fx$ and $fx^2$.

  - type: example
    title: Mean and standard deviation from a grouped table
    problem: |
      The times taken by 50 people to finish a puzzle are shown below. Estimate the mean and standard deviation.

      | Time ($t$ minutes) | $0 \le t < 10$ | $10 \le t < 20$ | $20 \le t < 30$ | $30 \le t < 40$ | $40 \le t < 50$ |
      | --- | --- | --- | --- | --- | --- |
      | Frequency | 5 | 12 | 18 | 10 | 5 |
    steps:
      - "Find each midpoint by averaging the class ends: $5, 15, 25, 35, 45$."
      - "Multiply each midpoint by its frequency to get $fx$: $25, 180, 450, 350, 225$. Add them: $\\Sigma fx = 1230$."
      - "The total frequency is $\\Sigma f = 5 + 12 + 18 + 10 + 5 = 50$. So $\\bar{x} = \\dfrac{1230}{50} = 24.6$."
      - "For $fx^2$, square the midpoint first, then multiply by $f$: $5 \\times 25 = 125$, $12 \\times 225 = 2700$, $18 \\times 625 = 11250$, $10 \\times 1225 = 12250$, $5 \\times 2025 = 10125$. Add them: $\\Sigma fx^2 = 36450$."
      - "Variance: $\\dfrac{36450}{50} - 24.6^2 = 729 - 605.16 = 123.84$."
      - "Standard deviation: $\\sigma = \\sqrt{123.84} \\approx 11.1$."
    answer: |
      The mean is about $24.6$ minutes and the standard deviation is about $11.1$ minutes. Both are estimates,
      because we used midpoints instead of the real times.

  - type: explain
    title: When you are only given the totals
    body: |
      Sometimes the question just says something like "$n = 20$, $\Sigma x = 340$, $\Sigma x^2 = 6200$". That is
      not a trick. As we saw at the start, those three numbers are all the formulas need, so substitute
      straight in.

      You can also run this **backwards**. If you know $n$, the mean and the standard deviation, you can
      rebuild the totals:

      $$\Sigma x = n\bar{x} \qquad \Sigma x^2 = n(\sigma^2 + \bar{x}^2)$$

      The second one comes from rearranging $\sigma^2 = \dfrac{\Sigma x^2}{n} - \bar{x}^2$: add $\bar{x}^2$ to both
      sides, then multiply both sides by $n$. You will need these when combining two data sets.

  - type: example
    title: Mean and standard deviation from totals
    problem: |
      For 20 values, $\Sigma x = 340$ and $\Sigma x^2 = 6200$. Find the mean and the standard deviation.
    steps:
      - "Mean: $\\bar{x} = \\dfrac{\\Sigma x}{n} = \\dfrac{340}{20} = 17$."
      - "Variance: $\\dfrac{\\Sigma x^2}{n} - \\bar{x}^2 = \\dfrac{6200}{20} - 17^2 = 310 - 289 = 21$."
      - "Standard deviation: $\\sigma = \\sqrt{21} \\approx 4.58$."
    answer: |
      $\bar{x} = 17$ and $\sigma = \sqrt{21} \approx 4.58$.

  - type: check
    title: Check grouped data and totals
    questions: [sc-mean-sd-grouped, sc-mean-sd-sums]

  - type: explain
    title: Coded data — subtract a handy number first
    body: |
      Suppose you weigh 20 bags of flour and every mass is close to 50 kg: 52.1, 49.8, 53.0 and so on. Adding
      and squaring numbers like these is tedious. So people often **subtract 50 from every value first** and
      work with the small leftovers (2.1, -0.2, 3.0...). This is called **coding**, and the number you subtract
      (50 here) is $a$. The question then gives you the coded totals $\Sigma(x - a)$ and $\Sigma(x - a)^2$.

      What does subtracting $a$ from every value do?

      - **The mean goes down by exactly $a$.** Every value dropped by 50, so the average dropped by 50 too.
        To get back to the real mean, **add $a$ on again**.
      - **The standard deviation does not change at all.** Sliding every value down by the same amount does
        not move them closer together or further apart. The spread is identical.

      So the method is:

      1. Find the mean and standard deviation of the coded values $x - a$, using the coded totals in the
         usual formulas (with $\Sigma(x-a)$ in place of $\Sigma x$, and $\Sigma(x-a)^2$ in place of $\Sigma x^2$).
      2. Real mean $=$ coded mean $+ a$.
      3. Real standard deviation $=$ coded standard deviation. Do nothing to it.

  - type: example
    title: Working from coded totals
    problem: |
      The masses $x$ kg of 20 bags are summarised by $\Sigma(x - 50) = 46$ and $\Sigma(x - 50)^2 = 390$.
      Find the mean and standard deviation of the masses.
    steps:
      - "Here $a = 50$ and $n = 20$. Work with the coded values first."
      - "Coded mean: $\\dfrac{\\Sigma(x - 50)}{n} = \\dfrac{46}{20} = 2.3$."
      - "Coded variance: $\\dfrac{\\Sigma(x - 50)^2}{n} - 2.3^2 = \\dfrac{390}{20} - 5.29 = 19.5 - 5.29 = 14.21$."
      - "Coded standard deviation: $\\sqrt{14.21} \\approx 3.77$."
      - "Undo the coding for the mean: the real mean is $2.3 + 50 = 52.3$ kg."
      - "The standard deviation is unchanged by subtracting 50, so it is $3.77$ kg."
    answer: |
      Mean $= 52.3$ kg and standard deviation $\approx 3.77$ kg.

  - type: check
    title: Check coded data
    questions: [sc-mean-sd-coded]

  - type: explain
    title: Combining two data sets
    body: |
      Suppose you know the mean and standard deviation of two separate groups, and you want them for **everyone
      together**. You **cannot** just average the two means (unless the groups are the same size), and you
      definitely cannot average the two standard deviations.

      Instead, go back to totals, because **totals just add up**:

      1. For each group, rebuild $\Sigma x = n\bar{x}$ and $\Sigma x^2 = n(\sigma^2 + \bar{x}^2)$.
      2. Add the two $n$'s, add the two $\Sigma x$'s, and add the two $\Sigma x^2$'s.
      3. Use the usual formulas on the combined totals.

  - type: example
    title: Combining two groups
    problem: |
      A class of 12 students has a mean test mark of 64 and standard deviation 6. Another class of 8 students
      has mean 80 and standard deviation 10. Find the mean and standard deviation of all 20 marks.
    steps:
      - "Class 1 totals: $\\Sigma x = 12 \\times 64 = 768$ and $\\Sigma x^2 = 12(6^2 + 64^2) = 12 \\times 4132 = 49584$."
      - "Class 2 totals: $\\Sigma x = 8 \\times 80 = 640$ and $\\Sigma x^2 = 8(10^2 + 80^2) = 8 \\times 6500 = 52000$."
      - "Combine: $n = 20$, $\\Sigma x = 768 + 640 = 1408$, $\\Sigma x^2 = 49584 + 52000 = 101584$."
      - "Combined mean: $\\dfrac{1408}{20} = 70.4$. (Notice it is closer to 64 than to 80, because the first class is bigger.)"
      - "Combined variance: $\\dfrac{101584}{20} - 70.4^2 = 5079.2 - 4956.16 = 123.04$."
      - "Combined standard deviation: $\\sqrt{123.04} \\approx 11.1$. It is bigger than either class's own, because the two classes sit at different levels."
    answer: |
      The combined mean is $70.4$ and the combined standard deviation is about $11.1$.

  - type: check
    title: Check combining
    questions: [sc-mean-sd-combined, sc-mean-sd-missing]

  - type: misconceptions
    items:
      - wrong: "For $fx^2$ I multiply $f$ by $x$ and then square the answer."
        right: "Square the midpoint **first**, then multiply by $f$. $fx^2$ means $f \\times x^2$, not $(fx)^2$."
      - wrong: "With coded data I should also add $a$ back onto the standard deviation."
        right: "Subtracting the same number from every value does not change the spread. Only the mean shifts back by $a$."
      - wrong: "The combined mean is the average of the two means."
        right: "Only when the groups are the same size. Otherwise combine the totals: the bigger group pulls the mean towards itself."
      - wrong: "Answers from a grouped table are exact."
        right: "They are **estimates**, because every value was assumed to sit at its class midpoint."

  - type: exam
    body: |
      - Lay grouped data out as a table with columns $x$ (midpoint), $f$, $fx$, $fx^2$, and show the column totals.
      - Say "estimate" for answers from grouped data.
      - For coded data, write down the coded mean and coded standard deviation first, then convert.
      - When combining sets, write the rebuilt totals $\Sigma x$ and $\Sigma x^2$ for each set clearly: method marks are given for them.

  - type: takeaways
    items:
      - "The mean and standard deviation only need $n$, $\\Sigma x$ and $\\Sigma x^2$."
      - "Grouped data: use class midpoints, $\\bar{x} = \\dfrac{\\Sigma fx}{\\Sigma f}$ and $\\sigma^2 = \\dfrac{\\Sigma fx^2}{\\Sigma f} - \\bar{x}^2$. The results are estimates."
      - "Coded data $x - a$: add $a$ back to the mean; the standard deviation is unchanged."
      - "To combine two sets, rebuild $\\Sigma x = n\\bar{x}$ and $\\Sigma x^2 = n(\\sigma^2 + \\bar{x}^2)$ for each, add the totals, then use the formulas."

questions:
  - id: sc-mean-sd-grouped
    format: numeric
    difficulty: 1
    objectives: ["5.1.5"]
    prompt: |
      A grouped table has classes $0$–$10$ (frequency $4$), $10$–$20$ (frequency $6$) and $20$–$30$ (frequency $10$). Estimate the mean.
    fields:
      - label: "mean ≈"
        answer: 18
    explanation: |
      The midpoints are $5, 15, 25$. $\Sigma fx = 4 \times 5 + 6 \times 15 + 10 \times 25 = 20 + 90 + 250 = 360$ and $\Sigma f = 20$, so the mean is about $\dfrac{360}{20} = 18$.

  - id: sc-mean-sd-sums
    format: numeric
    difficulty: 2
    objectives: ["5.1.5"]
    prompt: |
      For $8$ values, $\Sigma x = 72$ and $\Sigma x^2 = 720$. Find the standard deviation.
    fields:
      - label: "σ ="
        answer: 3
    explanation: |
      The mean is $\dfrac{72}{8} = 9$. The variance is $\dfrac{720}{8} - 9^2 = 90 - 81 = 9$, so $\sigma = 3$.

  - id: sc-mean-sd-coded
    format: numeric
    difficulty: 2
    objectives: ["5.1.5"]
    prompt: |
      For $12$ values of $x$, $\Sigma(x - 30) = 36$ and $\Sigma(x - 30)^2 = 540$. Find the mean of $x$.
    fields:
      - label: "mean ="
        answer: 33
    explanation: |
      The coded mean is $\dfrac{36}{12} = 3$. Every value had $30$ subtracted, so add it back: the mean of $x$ is $3 + 30 = 33$.

  - id: sc-mean-sd-combined
    format: numeric
    difficulty: 2
    objectives: ["5.1.5"]
    prompt: |
      Set A has $10$ values with mean $50$. Set B has $15$ values with mean $60$. Find the mean of all $25$ values.
    fields:
      - label: "mean ="
        answer: 56
    explanation: |
      Rebuild the totals: Set A totals $10 \times 50 = 500$ and Set B totals $15 \times 60 = 900$. Altogether $\dfrac{500 + 900}{25} = \dfrac{1400}{25} = 56$. It is nearer $60$ because Set B is bigger.

  - id: sc-mean-sd-missing
    format: numeric
    difficulty: 2
    objectives: ["5.1.5"]
    prompt: |
      Set 1 has $8$ values with mean $15$. When Set 2 is added, there are $20$ values altogether with mean $18$. Find the mean of Set 2.
    fields:
      - label: "mean ="
        answer: 20
    explanation: |
      The combined total is $20 \times 18 = 360$ and Set 1's total is $8 \times 15 = 120$, so Set 2's total is $360 - 120 = 240$. Set 2 has $20 - 8 = 12$ values, so its mean is $\dfrac{240}{12} = 20$.
