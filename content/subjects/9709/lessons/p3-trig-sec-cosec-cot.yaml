id: p3-trig-sec-cosec-cot
subject: '9709'
topic: '3.3'
title: 'Sec, cosec and cot: the reciprocal three'
summary: Three new names, all built from the functions you already have — and each graph is just the inverse of
  one you know.
order: 1
minutes: 8
kind: core
objectives:
- 3.3.1
prerequisites: []
