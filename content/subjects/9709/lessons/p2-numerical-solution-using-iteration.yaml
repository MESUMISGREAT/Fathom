id: p2-numerical-solution-using-iteration
subject: "9709"
topic: "2.6"
title: Iterating to a root
summary: Use a given iteration formula repeatedly until the values agree to the required number of decimal places, then state the root to that accuracy.
order: 3
minutes: 7
kind: core
objectives: ["2.6.3"]
prerequisites: [p2-numerical-solution-approximations]
