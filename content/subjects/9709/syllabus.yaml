# Cambridge International AS & A Level Mathematics (9709), syllabus for 2026 and 2027.
# Transcribed (paraphrased) from the official syllabus PDF, Version 4, published December 2025.
# Sections = components (Papers 1-6); topics and their order follow the official content overview;
# objectives are the bullets under "Candidates should be able to", numbered by position.

subject:
  code: "9709"
  slug: mathematics
  name: Mathematics
  shortName: Maths
  description: >-
    Learn the pure maths, mechanics and statistics of Cambridge AS & A Level, from quadratics and
    calculus to forces, probability and hypothesis tests.

syllabus:
  id: 9709-2026-2027
  label: "2026–2027"
  examYears: [2026, 2027]
  sourceUrl: https://www.cambridgeinternational.org/Images/697427-2026-2027-syllabus.pdf
  sourceVersion: "Version 4, published December 2025"
  checkedAt: "2026-10-19"
  wording: paraphrased
  notes: >-
    Sections are the six components (Papers 1–6) and topic codes follow the official content
    overview. The official learning outcomes are unnumbered bullets, so objective codes are
    assigned by bullet position. Dash sub-points of an outcome stay inside that one objective (never
    split out), and the "Notes and examples" column is paraphrased in guidance. Levels come from the
    assessment overview: Papers 1, 2, 4 and 5 are assessed at AS Level (Paper 2 is offered only as
    part of AS Level and the Paper 1 + Paper 2 route cannot count towards A Level); Papers 3 and 6
    are A Level only. Candidates may not take Papers 2 and 3 in the same series, and Papers 4 and 6
    cannot be combined. Paper 2 content is largely a subset of Paper 3 content, so Fathom does not
    keep a separate Paper 2 section (removed on 2026-10-30 at the owner's request): its topics are
    taught by the Paper 3 lessons. Assumed knowledge
    stated in the syllabus (recorded here, not duplicated as objectives): Paper 1 is the foundation
    for all other components; Papers 2 and 3 assume the Paper 1 content and may require it in
    answers. Paper 4 (Mechanics) questions are mainly numerical and avoid difficult algebra or
    trigonometry, but candidates should know sin(90° − θ) ≡ cos θ, cos(90° − θ) ≡ sin θ,
    tan θ ≡ sin θ / cos θ and sin²θ + cos²θ ≡ 1; algebraic methods from Paper 1 are assumed; all
    bodies are modelled as particles (any force acts at a single point); and vector notation is not
    used in the question papers. Paper 5 questions are mainly numerical and need no algebra beyond
    Paper 1; the notation P(A), P(A ∪ B), P(A ∩ B), P(A|B) and A′ for the complement of A is
    assumed. Paper 6 assumes the Paper 5 content and the calculus in the Paper 3 content. Prior
    knowledge for the whole syllabus: Cambridge IGCSE Mathematics 0580 (Extended) or O Level
    4024/4029, compound-unit notation such as 5 m s⁻¹, simple manipulation of surds, and the shapes
    of graphs y = kxⁿ (k constant, n a positive or negative integer, or ±½). Maths is written as
    plain Unicode text because these fields are plain strings. The separate syllabus-update notice
    opens by calling version 3 the latest but then lists the version 4 (December 2025) changes; the
    PDF itself says version 4, which is used here. Versions 2–4 changed only page headers,
    typographical errors on content pages 21, 26 and 28, and a weblink; the PDF states there are no
    significant changes that affect teaching.

sections:
  # ---------------------------------------------------------------------------
  - code: "1"
    title: Pure Mathematics 1
    level: AS
    papers: ["Paper 1"]
    strand: Pure Mathematics
    topics:
      - code: "1.1"
        title: Quadratics
        objectives:
          - code: "1.1.1"
            text: >-
              Carry out the process of completing the square for a quadratic polynomial
              ax² + bx + c, and use a completed-square form.
            guidance: >-
              For example, to locate the vertex of the graph of y = ax² + bx + c or to sketch
              that graph.
          - code: "1.1.2"
            text: >-
              Find the discriminant of a quadratic polynomial ax² + bx + c and use the
              discriminant.
            guidance: >-
              For example, to decide how many real roots the equation ax² + bx + c = 0 has.
              Knowledge of the term 'repeated root' is included.
          - code: "1.1.3"
            text: >-
              Solve quadratic equations, and quadratic inequalities, in one unknown.
            guidance: >-
              By factorising, by completing the square and by using the formula.
          - code: "1.1.4"
            text: >-
              Solve by substitution a pair of simultaneous equations in which one equation is
              linear and the other is quadratic.
            guidance: >-
              Examples: x + y + 1 = 0 with x² + y² = 25; 2x + 3y = 7 with 3x² = 4 + 4xy.
          - code: "1.1.5"
            text: >-
              Recognise and solve equations in x that are quadratic in some function of x.
            guidance: >-
              Examples: x⁴ − 5x² + 4 = 0, 6x + √x − 1 = 0, tan²x = 1 + tan x.

      - code: "1.2"
        title: Functions
        objectives:
          - code: "1.2.1"
            text: >-
              Understand the terms function, domain, range, one-one function, inverse function
              and composition of functions.
          - code: "1.2.2"
            text: >-
              Identify the range of a given function in simple cases, and find the composition
              of two given functions.
            guidance: >-
              Examples: the range of f : x ↦ 1/x for x ≥ 1, and the range of g : x ↦ x² + 1 for
              x ∈ ℝ. Includes the condition that a composite function gf can only be formed when
              the range of f lies within the domain of g.
          - code: "1.2.3"
            text: >-
              Determine whether or not a given function is one-one, and find the inverse of a
              one-one function in simple cases.
            guidance: >-
              Example: finding the inverse of h : x ↦ (2x + 3)² − 4 for x < −3/2.
          - code: "1.2.4"
            text: >-
              Illustrate in graphical terms the relationship between a one-one function and its
              inverse.
            guidance: >-
              Sketches should indicate the mirror line y = x.
          - code: "1.2.5"
            text: >-
              Understand and use the transformations of the graph of y = f(x) given by
              y = f(x) + a, y = f(x + a), y = af(x) and y = f(ax), and simple combinations of
              these.
            guidance: >-
              Includes using the terms 'translation', 'reflection' and 'stretch' to describe
              transformations. Questions may involve algebraic or trigonometric functions, or
              other graphs with given features.

      - code: "1.3"
        title: Coordinate geometry
        objectives:
          - code: "1.3.1"
            text: >-
              Find the equation of a straight line given sufficient information.
            guidance: >-
              For example, given two points, or given one point and the gradient.
          - code: "1.3.2"
            text: >-
              Interpret and use any of the forms y = mx + c, y − y₁ = m(x − x₁) and
              ax + by + c = 0 in solving problems.
            guidance: >-
              Includes calculating distances, gradients, midpoints and points of intersection,
              and using the relationship between the gradients of parallel and perpendicular
              lines.
          - code: "1.3.3"
            text: >-
              Understand that the equation (x − a)² + (y − b)² = r² represents the circle with
              centre (a, b) and radius r.
            guidance: >-
              Includes using the expanded form x² + y² + 2gx + 2fy + c = 0.
          - code: "1.3.4"
            text: >-
              Use algebraic methods to solve problems involving lines and circles.
            guidance: >-
              Includes using elementary geometrical properties of circles, e.g. a tangent is
              perpendicular to the radius, the angle in a semicircle, symmetry. Implicit
              differentiation is not included.
          - code: "1.3.5"
            text: >-
              Understand the relationship between a graph and its associated algebraic equation,
              and use the relationship between points of intersection of graphs and solutions of
              equations.
            guidance: >-
              For example, finding the set of values of k for which the line y = x + k
              intersects, touches or does not meet a quadratic curve.

      - code: "1.4"
        title: Circular measure
        objectives:
          - code: "1.4.1"
            text: >-
              Understand the definition of a radian, and use the relationship between radians
              and degrees.
          - code: "1.4.2"
            text: >-
              Use the formulae s = rθ and A = ½r²θ in solving problems about the arc length and
              sector area of a circle.
            guidance: >-
              Includes calculating lengths and angles in triangles and areas of triangles.

      - code: "1.5"
        title: Trigonometry
        objectives:
          - code: "1.5.1"
            text: >-
              Sketch and use graphs of the sine, cosine and tangent functions, for angles of any
              size and using either degrees or radians.
            guidance: >-
              Includes, for example, y = 3 sin x, y = 1 − cos 2x and y = tan(x + ¼π).
          - code: "1.5.2"
            text: >-
              Use the exact values of the sine, cosine and tangent of 30°, 45° and 60°, and of
              related angles.
            guidance: >-
              Examples: cos 150° = −½√3; sin ¾π = 1/√2.
          - code: "1.5.3"
            text: >-
              Use the notations sin⁻¹x, cos⁻¹x and tan⁻¹x to denote the principal values of the
              inverse trigonometric relations.
            guidance: >-
              No specialised knowledge of these functions is required, but they should be
              understood as examples of inverse functions.
          - code: "1.5.4"
            text: >-
              Use the identities sin θ / cos θ ≡ tan θ and sin²θ + cos²θ ≡ 1.
            guidance: >-
              For example, in proving identities, simplifying expressions and solving equations.
          - code: "1.5.5"
            text: >-
              Find all the solutions of simple trigonometrical equations that lie in a specified
              interval (general forms of solution are not included).
            guidance: >-
              Examples: solve 3 sin 2x + 1 = 0 for −π < x < π; solve 3 sin²θ − 5 cos θ − 1 = 0
              for 0° ≤ θ ≤ 360°.

      - code: "1.6"
        title: Series
        objectives:
          - code: "1.6.1"
            text: >-
              Use the expansion of (a + b)ⁿ, where n is a positive integer.
            guidance: >-
              Includes the notations n! and the binomial coefficient written as n over r in
              brackets. Knowledge of the greatest term and of properties of the coefficients is
              not required.
          - code: "1.6.2"
            text: >-
              Recognise arithmetic and geometric progressions.
          - code: "1.6.3"
            text: >-
              Use the formulae for the nth term and for the sum of the first n terms to solve
              problems involving arithmetic or geometric progressions.
            guidance: >-
              Includes knowing that numbers a, b, c are 'in arithmetic progression' if
              2b = a + c (or equivalent) and 'in geometric progression' if b² = ac (or
              equivalent). Questions may involve more than one progression.
          - code: "1.6.4"
            text: >-
              Use the condition for the convergence of a geometric progression, and the formula
              for the sum to infinity of a convergent geometric progression.

      - code: "1.7"
        title: Differentiation
        objectives:
          - code: "1.7.1"
            text: >-
              Understand the gradient of a curve at a point as the limit of the gradients of a
              suitable sequence of chords, and use the notations f′(x), f″(x), dy/dx and
              d²y/dx² for first and second derivatives.
            guidance: >-
              Only an informal understanding of the idea of a limit is expected. Includes, for
              example, considering the gradient of the chord joining the points with
              x-coordinates 2 and (2 + h) on the curve y = x³. Formal use of the general method
              of differentiation from first principles is not required.
          - code: "1.7.2"
            text: >-
              Use the derivative of xⁿ (for any rational n), together with constant multiples,
              sums and differences of functions, and of composite functions using the chain
              rule.
            guidance: >-
              Example: find dy/dx given y = √(2x³ + 5).
          - code: "1.7.3"
            text: >-
              Apply differentiation to gradients, tangents and normals, increasing and
              decreasing functions, and rates of change.
            guidance: >-
              Includes connected rates of change, e.g. given the rate of increase of the radius
              of a circle, find the rate of increase of its area for a specific value of one of
              the variables.
          - code: "1.7.4"
            text: >-
              Locate stationary points and determine their nature, and use information about
              stationary points in sketching graphs.
            guidance: >-
              Includes using the second derivative to identify maxima and minima; other methods
              may be used where a question does not specify one. Knowledge of points of
              inflexion is not included.

      - code: "1.8"
        title: Integration
        objectives:
          - code: "1.8.1"
            text: >-
              Understand integration as the reverse process of differentiation, and integrate
              (ax + b)ⁿ (for any rational n except −1), together with constant multiples, sums
              and differences.
            guidance: >-
              Examples: ∫(2x³ − 5x + 1) dx and ∫ 1/(2x + 3)² dx.
          - code: "1.8.2"
            text: >-
              Solve problems involving the evaluation of a constant of integration.
            guidance: >-
              Example: find the equation of the curve through (1, −2) for which
              dy/dx = √(2x + 1).
          - code: "1.8.3"
            text: >-
              Evaluate definite integrals.
            guidance: >-
              Includes simple cases of 'improper' integrals, such as the integral of x^(−½) from
              0 to 1 and the integral of x^(−2) from 1 to ∞.
          - code: "1.8.4"
            text: >-
              Use definite integration to find the area of a region bounded by a curve and lines
              parallel to the axes, or between a curve and a line, or between two curves; and to
              find a volume of revolution about one of the axes.
            guidance: >-
              A volume of revolution may involve a region that is not bounded by the axis of
              rotation, e.g. the region between y = 9 − x² and y = 5 rotated about the x-axis.

  # ---------------------------------------------------------------------------
  - code: "3"
    title: Pure Mathematics 3
    level: A
    papers: ["Paper 3"]
    strand: Pure Mathematics
    topics:
      - code: "3.1"
        title: Algebra
        objectives:
          - code: "3.1.1"
            text: >-
              Understand the meaning of |x|, sketch the graph of y = |ax + b|, and use relations
              such as |a| = |b| ⇔ a² = b² and |x − a| < b ⇔ a − b < x < a + b when solving
              equations and inequalities.
            guidance: >-
              Graphs of y = |f(x)| and y = f(|x|) for non-linear functions f are not included.
              Examples: |3x − 2| = |2x + 7|; 2x + 5 < |x + 1|.
          - code: "3.1.2"
            text: >-
              Divide a polynomial of degree not exceeding 4 by a linear or quadratic polynomial,
              and identify the quotient and remainder (which may be zero).
          - code: "3.1.3"
            text: >-
              Use the factor theorem and the remainder theorem.
            guidance: >-
              For example, to find factors and remainders, solve polynomial equations or
              evaluate unknown coefficients. Includes factors of the form (ax + b) in which the
              coefficient of x is not unity, and includes calculating remainders.
          - code: "3.1.4"
            text: >-
              Recall an appropriate form for expressing rational functions in partial fractions,
              and carry out the decomposition, in cases where the denominator is no more
              complicated than (ax + b)(cx + d)(ex + f), (ax + b)(cx + d)² or (ax + b)(cx² + d).
            guidance: >-
              Cases where the degree of the numerator exceeds that of the denominator are
              excluded.
          - code: "3.1.5"
            text: >-
              Use the expansion of (1 + x)ⁿ, where n is a rational number and |x| < 1.
            guidance: >-
              Finding the general term in an expansion is not included. Adapting the standard
              series to expand, e.g., (2 − ½x)^(−1) is included, as is determining the set of
              values of x for which the expansion is valid in such cases.

      - code: "3.2"
        title: Logarithmic and exponential functions
        objectives:
          - code: "3.2.1"
            text: >-
              Understand the relationship between logarithms and indices, and use the laws of
              logarithms (excluding change of base).
          - code: "3.2.2"
            text: >-
              Understand the definition and properties of eˣ and ln x, including their
              relationship as inverse functions and their graphs.
            guidance: >-
              Includes knowing the graph of y = e^(kx) for both positive and negative values of
              k.
          - code: "3.2.3"
            text: >-
              Use logarithms to solve equations and inequalities in which the unknown appears in
              indices.
            guidance: >-
              Examples: 2ˣ < 5, 3 × 2^(3x − 1) < 5, 3^(x + 1) = 4^(2x − 1).
          - code: "3.2.4"
            text: >-
              Use logarithms to transform a given relationship to linear form, and hence
              determine unknown constants by considering the gradient and/or intercept.
            guidance: >-
              Examples: y = kxⁿ gives ln y = ln k + n ln x, which is linear in ln x and ln y;
              y = k(aˣ) gives ln y = ln k + x ln a, which is linear in x and ln y.

      - code: "3.3"
        title: Trigonometry
        objectives:
          - code: "3.3.1"
            text: >-
              Understand how the secant, cosecant and cotangent functions relate to cosine, sine
              and tangent, and use the properties and graphs of all six trigonometric functions
              for angles of any magnitude.
          - code: "3.3.2"
            text: >-
              Use trigonometrical identities to simplify and exactly evaluate expressions and in
              the course of solving equations, selecting an identity or identities appropriate to
              the context; in particular use sec²θ ≡ 1 + tan²θ and cosec²θ ≡ 1 + cot²θ, the
              expansions of sin(A ± B), cos(A ± B) and tan(A ± B), the formulae for sin 2A,
              cos 2A and tan 2A, and the expression of a sin θ + b cos θ in the forms
              R sin(θ ± α) and R cos(θ ± α).
            guidance: >-
              Examples: simplifying cos(x − 30°) − 3 sin(x − 60°); solving tan θ + cot θ = 4,
              2 sec²θ − tan θ = 5 and 3 cos θ + 2 sin θ = 1.

      - code: "3.4"
        title: Differentiation
        objectives:
          - code: "3.4.1"
            text: >-
              Use the derivatives of eˣ, ln x, sin x, cos x, tan x and tan⁻¹x, together with
              constant multiples, sums, differences and composites.
            guidance: >-
              The derivatives of sin⁻¹x and cos⁻¹x are not required.
          - code: "3.4.2"
            text: >-
              Differentiate products and quotients.
            guidance: >-
              Examples: (2x − 4)/(3x + 2), x² ln x, x e^(1 − x²).
          - code: "3.4.3"
            text: >-
              Find and use the first derivative of a function that is defined parametrically or
              implicitly.
            guidance: >-
              Examples: x = t − e^(2t), y = t + e^(2t); x² + y² = xy + 7. Includes use in
              problems involving tangents and normals.

      - code: "3.5"
        title: Integration
        objectives:
          - code: "3.5.1"
            text: >-
              Extend the idea of 'reverse differentiation' to include the integration of
              e^(ax + b), 1/(ax + b), sin(ax + b), cos(ax + b), sec²(ax + b) and 1/(x² + a²).
            guidance: >-
              Includes examples such as 1/(2 + 3x²).
          - code: "3.5.2"
            text: >-
              Use trigonometrical relationships in carrying out integration.
            guidance: >-
              For example, using double-angle formulae to integrate sin²x or cos²(2x).
          - code: "3.5.3"
            text: >-
              Integrate rational functions by decomposing them into partial fractions.
            guidance: >-
              Restricted to the types of partial fractions specified in topic 3.1.
          - code: "3.5.4"
            text: >-
              Recognise an integrand of the form k f′(x)/f(x), and integrate such functions.
            guidance: >-
              Examples: integrating x/(x² + 1) and tan x.
          - code: "3.5.5"
            text: >-
              Recognise when an integrand can usefully be regarded as a product, and use
              integration by parts.
            guidance: >-
              Examples: integrating x sin 2x, x²e^(−x), ln x and x tan⁻¹x.
          - code: "3.5.6"
            text: >-
              Use a given substitution to simplify and evaluate either a definite or an
              indefinite integral.
            guidance: >-
              For example, integrating sin²2x cos x using the substitution u = sin x.

      - code: "3.6"
        title: Numerical solution of equations
        objectives:
          - code: "3.6.1"
            text: >-
              Locate approximately a root of an equation, by means of graphical considerations
              and/or searching for a sign change.
            guidance: >-
              For example, finding a pair of consecutive integers between which a root lies.
          - code: "3.6.2"
            text: >-
              Understand the idea of, and use the notation for, a sequence of approximations
              that converges to a root of an equation.
          - code: "3.6.3"
            text: >-
              Understand how a given simple iterative formula of the form xₙ₊₁ = F(xₙ) relates to
              the equation being solved, and use a given iteration, or an iteration based on a
              given rearrangement of an equation, to determine a root to a prescribed degree of
              accuracy.
            guidance: >-
              Knowledge of the condition for convergence is not included, but candidates are
              expected to understand that an iteration may fail to converge.

      - code: "3.7"
        title: Vectors
        objectives:
          - code: "3.7.1"
            text: >-
              Use standard notations for vectors: column vectors with components x, y or x, y,
              z; xi + yj; xi + yj + zk; AB with an arrow over it; and a bold letter such as a.
          - code: "3.7.2"
            text: >-
              Carry out addition and subtraction of vectors and multiplication of a vector by a
              scalar, and interpret these operations in geometrical terms.
            guidance: >-
              For example, 'OABC is a parallelogram' is equivalent to the vector OB being equal
              to the vector OA plus the vector OC. The general form of the ratio theorem is not
              included, but candidates are expected to understand that the midpoint of AB has
              position vector ½(OA + OB), where OA and OB are vectors.
          - code: "3.7.3"
            text: >-
              Calculate the magnitude of a vector, and use unit vectors, displacement vectors
              and position vectors.
            guidance: >-
              In 2 or 3 dimensions.
          - code: "3.7.4"
            text: >-
              Understand the significance of all the symbols used when the equation of a
              straight line is written in the form r = a + tb, and find the equation of a line
              given sufficient information.
            guidance: >-
              For example, finding the equation of a line given the position vector of a point
              on it and a direction vector, or given the position vectors of two points on it.
          - code: "3.7.5"
            text: >-
              Determine whether two lines are parallel, intersect or are skew, and find the
              point of intersection of two lines when it exists.
            guidance: >-
              Calculating the shortest distance between two skew lines is not required, and
              neither is finding the equation of the common perpendicular to two skew lines.
          - code: "3.7.6"
            text: >-
              Use formulae to calculate the scalar product of two vectors, and use scalar
              products in problems involving lines and points.
            guidance: >-
              For example, finding the angle between two lines, and finding the foot of the
              perpendicular from a point to a line; questions may involve 3D objects such as
              cuboids and tetrahedra (pyramids). Knowledge of the vector product is not required.

      - code: "3.8"
        title: Differential equations
        objectives:
          - code: "3.8.1"
            text: >-
              Formulate a simple statement involving a rate of change as a differential
              equation.
            guidance: >-
              Includes introducing and evaluating a constant of proportionality where necessary.
          - code: "3.8.2"
            text: >-
              Find by integration a general form of solution for a first order differential
              equation in which the variables are separable.
            guidance: >-
              Includes any of the integration techniques from topic 3.5.
          - code: "3.8.3"
            text: >-
              Use an initial condition to find a particular solution.
          - code: "3.8.4"
            text: >-
              Interpret the solution of a differential equation in the context of a problem
              being modelled by the equation.
            guidance: >-
              Where a differential equation models a 'real-life' situation, no specialised
              knowledge of the context is required.

      - code: "3.9"
        title: Complex numbers
        objectives:
          - code: "3.9.1"
            text: >-
              Understand the idea of a complex number, recall the meaning of the terms real
              part, imaginary part, modulus, argument and conjugate, and use the fact that two
              complex numbers are equal if and only if both their real parts and their imaginary
              parts are equal.
            guidance: >-
              The notations Re z, Im z, |z|, arg z and z* should be known. The argument of a
              complex number usually means an angle θ with −π < θ ≤ π, but in some cases the
              interval 0 ≤ θ < 2π may be more convenient; answers may use either interval unless
              the question specifies otherwise.
          - code: "3.9.2"
            text: >-
              Carry out addition, subtraction, multiplication and division of two complex
              numbers expressed in Cartesian form x + iy.
            guidance: >-
              For calculations involving multiplication or division, full details of the working
              should be shown.
          - code: "3.9.3"
            text: >-
              Use the result that, for a polynomial equation with real coefficients, any
              non-real roots occur in conjugate pairs.
            guidance: >-
              For example, in solving a cubic or quartic equation where one complex root is
              given.
          - code: "3.9.4"
            text: >-
              Represent complex numbers geometrically by means of an Argand diagram.
          - code: "3.9.5"
            text: >-
              Carry out multiplication and division of two complex numbers expressed in polar
              form r(cos θ + i sin θ) ≡ re^(iθ).
            guidance: >-
              Includes the results |z₁z₂| = |z₁||z₂| and arg(z₁z₂) = arg(z₁) + arg(z₂), and the
              corresponding results for division.
          - code: "3.9.6"
            text: >-
              Find the two square roots of a complex number.
            guidance: >-
              For example, the square roots of 5 + 12i in exact Cartesian form. Full details of
              the working should be shown.
          - code: "3.9.7"
            text: >-
              Understand in simple terms the geometrical effects of conjugating a complex number
              and of adding, subtracting, multiplying and dividing two complex numbers.
          - code: "3.9.8"
            text: >-
              Illustrate simple equations and inequalities involving complex numbers by means of
              loci in an Argand diagram.
            guidance: >-
              Examples: |z − a| < k, |z − a| = |z − b|, arg(z − a) = α.

  # ---------------------------------------------------------------------------
  - code: "4"
    title: Mechanics
    level: AS
    papers: ["Paper 4"]
    strand: Mechanics
    topics:
      - code: "4.1"
        title: Forces and equilibrium
        objectives:
          - code: "4.1.1"
            text: >-
              Identify the forces acting in a given situation.
            guidance: >-
              For example, by drawing a force diagram.
          - code: "4.1.2"
            text: >-
              Understand the vector nature of force, and find and use components and resultants.
            guidance: >-
              Calculations are always required, rather than approximate solutions by scale
              drawing.
          - code: "4.1.3"
            text: >-
              Use the principle that, when a particle is in equilibrium, the vector sum of the
              forces acting on it is zero, or equivalently that the sum of the components in any
              direction is zero.
            guidance: >-
              Solutions by resolving are usually expected, but equivalent methods (e.g. triangle
              of forces, Lami's Theorem, where suitable) are also acceptable; these other methods
              are not required knowledge and will not be referred to in questions.
          - code: "4.1.4"
            text: >-
              Understand that a contact force between two surfaces can be represented by two
              components, the normal component and the frictional component.
          - code: "4.1.5"
            text: >-
              Use the model of a 'smooth' contact, and understand the limitations of this model.
          - code: "4.1.6"
            text: >-
              Understand the concepts of limiting friction and limiting equilibrium, recall the
              definition of coefficient of friction, and use the relationship F = μR or F ≤ μR,
              as appropriate.
            guidance: >-
              Questions may use terminology such as 'about to slip' to mean 'in limiting
              equilibrium'.
          - code: "4.1.7"
            text: >-
              Use Newton's third law.
            guidance: >-
              For example, the force exerted by a particle on the ground is equal and opposite
              to the force exerted by the ground on the particle.

      - code: "4.2"
        title: Kinematics of motion in a straight line
        objectives:
          - code: "4.2.1"
            text: >-
              Understand the concepts of distance and speed as scalar quantities, and of
              displacement, velocity and acceleration as vector quantities.
            guidance: >-
              Restricted to motion in one dimension only. The term 'deceleration' may sometimes
              be used when speed is decreasing.
          - code: "4.2.2"
            text: >-
              Sketch and interpret displacement–time graphs and velocity–time graphs, and in
              particular appreciate that the area under a velocity–time graph represents
              displacement, the gradient of a displacement–time graph represents velocity, and
              the gradient of a velocity–time graph represents acceleration.
          - code: "4.2.3"
            text: >-
              Use differentiation and integration with respect to time to solve simple problems
              concerning displacement, velocity and acceleration.
            guidance: >-
              The calculus required is restricted to techniques from the Paper 1: Pure
              Mathematics 1 content.
          - code: "4.2.4"
            text: >-
              Use appropriate formulae for motion with constant acceleration in a straight line.
            guidance: >-
              Questions may involve setting up more than one equation, using information about
              the motion of different particles.

      - code: "4.3"
        title: Momentum
        objectives:
          - code: "4.3.1"
            text: >-
              Use the definition of linear momentum and show understanding of its vector nature.
            guidance: >-
              For motion in one dimension only.
          - code: "4.3.2"
            text: >-
              Use conservation of linear momentum to solve problems that may be modelled as the
              direct impact of two bodies.
            guidance: >-
              Includes direct impact of two bodies where the bodies coalesce on impact.
              Knowledge of impulse and of the coefficient of restitution is not required.

      - code: "4.4"
        title: Newton’s laws of motion
        objectives:
          - code: "4.4.1"
            text: >-
              Apply Newton's laws of motion to the linear motion of a particle of constant mass
              moving under the action of constant forces, which may include friction, tension in
              an inextensible string and thrust in a connecting rod.
            guidance: >-
              If any other forces resisting motion (e.g. air resistance) are to be considered,
              the question will say so.
          - code: "4.4.2"
            text: >-
              Use the relationship between mass and weight.
            guidance: >-
              W = mg. Questions in this component are mainly numerical, and the approximate
              value g = 10 m s⁻² is expected to be used.
          - code: "4.4.3"
            text: >-
              Solve simple problems that may be modelled as the motion of a particle moving
              vertically or on an inclined plane with constant acceleration.
            guidance: >-
              Includes, for example, motion of a particle on a rough plane where the
              acceleration while moving up the plane differs from the acceleration while moving
              down it.
          - code: "4.4.4"
            text: >-
              Solve simple problems that may be modelled as the motion of connected particles.
            guidance: >-
              For example, particles connected by a light inextensible string passing over a
              smooth pulley, or a car towing a trailer by means of either a light rope or a light
              rigid tow-bar.

      - code: "4.5"
        title: Energy, work and power
        objectives:
          - code: "4.5.1"
            text: >-
              Understand the concept of the work done by a force, and calculate the work done by
              a constant force when its point of application undergoes a displacement not
              necessarily parallel to the force.
            guidance: >-
              W = Fd cos θ. Use of the scalar product is not required.
          - code: "4.5.2"
            text: >-
              Understand the concepts of gravitational potential energy and kinetic energy, and
              use appropriate formulae.
          - code: "4.5.3"
            text: >-
              Understand and use the relationship between the change in energy of a system and
              the work done by the external forces, and use the principle of conservation of
              energy in appropriate cases.
            guidance: >-
              Includes cases where the motion may not be linear (e.g. a child on a smooth curved
              'slide'), where only overall energy changes need to be considered.
          - code: "4.5.4"
            text: >-
              Use the definition of power as the rate at which a force does work, and use the
              relationship between power, force and velocity for a force acting in the direction
              of motion.
            guidance: >-
              Includes calculating (average) power as work done ÷ time taken, and P = Fv.
          - code: "4.5.5"
            text: >-
              Solve problems involving, for example, the instantaneous acceleration of a car
              moving on a hill against a resistance.

  # ---------------------------------------------------------------------------
  - code: "5"
    title: Probability & Statistics 1
    level: AS
    papers: ["Paper 5"]
    strand: Probability & Statistics
    topics:
      - code: "5.1"
        title: Representation of data
        objectives:
          - code: "5.1.1"
            text: >-
              Select a suitable way of presenting raw statistical data, and discuss the
              advantages and/or disadvantages that particular representations may have.
          - code: "5.1.2"
            text: >-
              Draw and interpret stem-and-leaf diagrams, box-and-whisker plots, histograms and
              cumulative frequency graphs.
            guidance: >-
              Includes back-to-back stem-and-leaf diagrams.
          - code: "5.1.3"
            text: >-
              Understand and use different measures of central tendency (mean, median, mode) and
              of variation (range, interquartile range, standard deviation).
            guidance: >-
              For example, in comparing and contrasting sets of data.
          - code: "5.1.4"
            text: >-
              Use a cumulative frequency graph.
            guidance: >-
              For example, to estimate medians, quartiles and percentiles, the proportion of a
              distribution above (or below) a given value, or the proportion between two values.
          - code: "5.1.5"
            text: >-
              Calculate and use the mean and standard deviation of a set of data (including
              grouped data), either from the data itself or from given totals Σx and Σx², or
              coded totals Σ(x − a) and Σ(x − a)², and use such totals in solving problems that
              may involve up to two data sets.

      - code: "5.2"
        title: Permutations and combinations
        objectives:
          - code: "5.2.1"
            text: >-
              Understand the terms permutation and combination, and solve simple problems
              involving selections.
          - code: "5.2.2"
            text: >-
              Solve problems about arrangements of objects in a line, including those involving
              repetition and those involving restriction.
            guidance: >-
              Repetition: e.g. the number of ways of arranging the letters of the word
              'NEEDLESS'. Restriction: e.g. the number of ways several people can stand in a line
              if two particular people must, or must not, stand next to each other. Questions may
              include cases such as people sitting in two (or more) rows. Questions about objects
              arranged in a circle will not be included.

      - code: "5.3"
        title: Probability
        objectives:
          - code: "5.3.1"
            text: >-
              Evaluate probabilities in simple cases by enumerating equiprobable elementary
              events, or by calculation using permutations or combinations.
            guidance: >-
              Examples: the total score when two fair dice are thrown; drawing balls at random
              from a bag containing balls of different colours.
          - code: "5.3.2"
            text: >-
              Use addition and multiplication of probabilities, as appropriate, in simple cases.
            guidance: >-
              Explicit use of the general formula P(A ∪ B) = P(A) + P(B) − P(A ∩ B) is not
              required.
          - code: "5.3.3"
            text: >-
              Understand the meaning of exclusive and independent events, including determining
              whether events A and B are independent by comparing the values of P(A ∩ B) and
              P(A) × P(B).
          - code: "5.3.4"
            text: >-
              Calculate and use conditional probabilities in simple cases.
            guidance: >-
              For example, situations that can be represented by a sample space of equiprobable
              elementary events, or by a tree diagram. Use of P(A|B) = P(A ∩ B)/P(B) may be
              required in simple cases.

      - code: "5.4"
        title: Discrete random variables
        objectives:
          - code: "5.4.1"
            text: >-
              Draw up a probability distribution table for a given situation involving a
              discrete random variable X, and calculate E(X) and Var(X).
          - code: "5.4.2"
            text: >-
              Use formulae for probabilities for the binomial and geometric distributions, and
              recognise practical situations in which these distributions are suitable models.
            guidance: >-
              Includes the notations B(n, p) and Geo(p). Geo(p) is the distribution with
              pᵣ = p(1 − p)^(r − 1) for r = 1, 2, 3, ….
          - code: "5.4.3"
            text: >-
              Use formulae for the expectation and variance of the binomial distribution and for
              the expectation of the geometric distribution.
            guidance: >-
              Proofs of the formulae are not required.

      - code: "5.5"
        title: The normal distribution
        objectives:
          - code: "5.5.1"
            text: >-
              Understand the use of a normal distribution to model a continuous random variable,
              and use normal distribution tables.
            guidance: >-
              Sketches of normal curves to illustrate distributions or probabilities may be
              required.
          - code: "5.5.2"
            text: >-
              Solve problems concerning a variable X, where X ~ N(μ, σ²), including finding the
              value of P(X > x₁), or a related probability, given the values of x₁, μ and σ, and
              finding a relationship between x₁, μ and σ given the value of P(X > x₁) or a
              related probability.
            guidance: >-
              For calculations involving standardisation, e.g. Z = (X − μ)/σ, full details of
              the working should be shown.
          - code: "5.5.3"
            text: >-
              Recall the conditions under which the normal distribution can be used as an
              approximation to the binomial distribution, and use this approximation, with a
              continuity correction, in solving problems.
            guidance: >-
              n must be large enough that both np > 5 and nq > 5.

  # ---------------------------------------------------------------------------
  - code: "6"
    title: Probability & Statistics 2
    level: A
    papers: ["Paper 6"]
    strand: Probability & Statistics
    topics:
      - code: "6.1"
        title: The Poisson distribution
        objectives:
          - code: "6.1.1"
            text: >-
              Use formulae to calculate probabilities for the distribution Po(λ).
          - code: "6.1.2"
            text: >-
              Use the fact that if X ~ Po(λ) then the mean and the variance of X are each equal
              to λ.
            guidance: >-
              Proofs are not required.
          - code: "6.1.3"
            text: >-
              Understand the relevance of the Poisson distribution to the distribution of random
              events, and use the Poisson distribution as a model.
          - code: "6.1.4"
            text: >-
              Use the Poisson distribution as an approximation to the binomial distribution
              where appropriate.
            guidance: >-
              The conditions that n is large and p is small should be known: approximately
              n > 50 and np < 5.
          - code: "6.1.5"
            text: >-
              Use the normal distribution, with continuity correction, as an approximation to
              the Poisson distribution where appropriate.
            guidance: >-
              The condition that λ is large should be known: approximately λ > 15.

      - code: "6.2"
        title: Linear combinations of random variables
        objectives:
          - code: "6.2.1"
            text: >-
              Use, when solving problems, the results that E(aX + b) = aE(X) + b and
              Var(aX + b) = a²Var(X); E(aX + bY) = aE(X) + bE(Y); Var(aX + bY) = a²Var(X) +
              b²Var(Y) for independent X and Y; if X has a normal distribution then so does
              aX + b; if X and Y have independent normal distributions then aX + bY has a normal
              distribution; and if X and Y have independent Poisson distributions then X + Y has
              a Poisson distribution.
            guidance: >-
              Proofs of these results are not required.

      - code: "6.3"
        title: Continuous random variables
        objectives:
          - code: "6.3.1"
            text: >-
              Understand the concept of a continuous random variable, and recall and use the
              properties of a probability density function.
            guidance: >-
              For density functions defined over a single interval only; the domain may be
              infinite, e.g. 3/x⁴ for x ≥ 1.
          - code: "6.3.2"
            text: >-
              Use a probability density function to solve problems involving probabilities, and
              to calculate the mean and variance of a distribution.
            guidance: >-
              Includes locating the median or other percentiles of a distribution by directly
              considering an area using the density function. Explicit knowledge of the
              cumulative distribution function is not included.

      - code: "6.4"
        title: Sampling and estimation
        objectives:
          - code: "6.4.1"
            text: >-
              Understand the distinction between a sample and a population, and appreciate the
              need for randomness in choosing samples.
          - code: "6.4.2"
            text: >-
              Explain in simple terms why a given sampling method may be unsatisfactory.
            guidance: >-
              Includes an elementary understanding of using random numbers to produce random
              samples. Knowledge of particular sampling methods, such as quota or stratified
              sampling, is not required.
          - code: "6.4.3"
            text: >-
              Recognise that a sample mean can be regarded as a random variable, and use the
              facts that E(X̄) = μ and Var(X̄) = σ²/n.
          - code: "6.4.4"
            text: >-
              Use the fact that X̄ has a normal distribution if X has a normal distribution.
          - code: "6.4.5"
            text: >-
              Use the Central Limit Theorem where appropriate.
            guidance: >-
              Only an informal understanding of the Central Limit Theorem (CLT) is required:
              for large sample sizes, the distribution of a sample mean is approximately normal.
          - code: "6.4.6"
            text: >-
              Calculate unbiased estimates of the population mean and variance from a sample,
              using either raw or summarised data.
            guidance: >-
              Only a simple understanding of the term 'unbiased' is required, e.g. that although
              individual estimates vary, the process gives an accurate result 'on average'.
          - code: "6.4.7"
            text: >-
              Determine and interpret a confidence interval for a population mean in cases where
              the population is normally distributed with known variance or where a large sample
              is used.
          - code: "6.4.8"
            text: >-
              Determine, from a large sample, an approximate confidence interval for a
              population proportion.

      - code: "6.5"
        title: Hypothesis tests
        objectives:
          - code: "6.5.1"
            text: >-
              Understand the nature of a hypothesis test, the difference between one-tailed and
              two-tailed tests, and the terms null hypothesis, alternative hypothesis,
              significance level, rejection region (or critical region), acceptance region and
              test statistic.
            guidance: >-
              Outcomes of hypothesis tests are expected to be interpreted in terms of the
              context in which the question is set.
          - code: "6.5.2"
            text: >-
              Formulate hypotheses and carry out a hypothesis test in the context of a single
              observation from a population that has a binomial or Poisson distribution, using
              direct evaluation of probabilities or, where appropriate, a normal approximation to
              the binomial or the Poisson distribution.
          - code: "6.5.3"
            text: >-
              Formulate hypotheses and carry out a hypothesis test concerning the population
              mean in cases where the population is normally distributed with known variance or
              where a large sample is used.
          - code: "6.5.4"
            text: >-
              Understand the terms Type I error and Type II error in relation to hypothesis
              tests.
          - code: "6.5.5"
            text: >-
              Calculate the probabilities of making Type I and Type II errors in specific
              situations involving tests based on a normal distribution or on direct evaluation
              of binomial or Poisson probabilities.
