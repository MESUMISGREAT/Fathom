# Cambridge International AS & A Level Computer Science (9618), syllabus for 2027-2029.
# Paraphrased transcription of the official syllabus (Version 2, published December 2025).
# Objective codes are <topic>.<n>, n = position of the bullet under 'Candidates should be able to'.

subject:
  code: "9618"
  slug: computer-science
  name: Computer Science
  shortName: Computer Science
  description: >-
    Find out how computers really work, from binary, logic gates and processors to networks,
    databases, security and AI, while building the problem-solving and programming skills to design,
    write and test your own solutions.

syllabus:
  id: 9618-2027-2029
  label: 2027–2029
  examYears: [2027, 2028, 2029]
  sourceUrl: https://www.cambridgeinternational.org/Images/721397-2027-2029-syllabus.pdf
  sourceVersion: Version 2, published December 2025
  checkedAt: "2026-10-19"
  wording: paraphrased
  notes: >-
    Sections are the 20 numbered top-level topics (1-12 AS Level, 13-20 A Level); topics are the
    numbered sub-topics. Objectives are the 'Candidates should be able to' bullets numbered by
    position; the 'Notes and guidance' column is paraphrased in guidance. Where a learning outcome
    itself ends in a list (5.2.1, 9.2.6, 9.2.7, 11.1.2, 11.2.1, 20.1.2) the list is kept in the
    objective text rather than split into separate objectives. Topic 1.2 runs its Graphics
    (1.2.1-1.2.5) and Sound (1.2.6-1.2.7) sub-headings together. The example instruction-set tables
    in 4.2 and 4.3 are summarised in guidance (4.2.3 and 4.3.2). Papers follow the assessment
    overview (Version 2 clarification): AS Level is Papers 1 and 2, A Level is all four papers;
    Paper 1 assesses sections 1-8, Paper 2 sections 9-12 (answers in pseudocode), Paper 3 sections
    13-20, and Paper 4 (practical, Java, Visual Basic or Python in console mode) sections 19-20
    except low-level and declarative programming. Section 9 refers to the Cambridge Pseudocode
    Guide. Calculators must not be used in any paper.

sections:
  # ----------------------------------------------------------------------
  # 1 Information representation (AS Level)
  - code: "1"
    title: Information representation
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "1.1"
        title: Data Representation
        objectives:
          - code: "1.1.1"
            text: >-
              Understand binary magnitudes and the difference between binary prefixes and decimal
              prefixes.
            guidance: >-
              Understand the difference between, and use, kibi and kilo, mebi and mega, gibi and
              giga, and tebi and tera.
          - code: "1.1.2"
            text: Understand different number systems.
            guidance: >-
              Use the binary, denary and hexadecimal number bases, Binary Coded Decimal (BCD), and
              one's and two's complement representation of binary numbers. Convert an integer value
              from one number base or representation to another.
          - code: "1.1.3"
            text: Carry out binary addition and subtraction.
            guidance: Using positive and negative binary integers. Understand how overflow can occur.
          - code: "1.1.4"
            text: >-
              Describe practical applications in which Binary Coded Decimal (BCD) and hexadecimal
              are used.
          - code: "1.1.5"
            text: >-
              Understand, and be able to represent, character data in its internal binary form,
              which depends on the character set used.
            guidance: >-
              Students should be familiar with ASCII (American Standard Code for Information
              Interchange), extended ASCII and Unicode. They will not be expected to memorise any
              particular character codes.
      - code: "1.2"
        title: Multimedia – Graphics, Sound
        objectives:
          - code: "1.2.1"
            text: Understand how the data for a bitmapped image are encoded.
            guidance: >-
              Use and understand the terms pixel, file header, image resolution, screen resolution
              and colour depth / bit depth.
          - code: "1.2.2"
            text: Carry out calculations to estimate the file size of a bitmap image.
          - code: "1.2.3"
            text: >-
              Understand how changing elements of a bitmap image affects the image quality and the
              file size.
            guidance: Use the terms image resolution and colour depth / bit depth.
          - code: "1.2.4"
            text: Understand how the data for a vector graphic are encoded.
            guidance: Use the terms drawing object, property and drawing list.
          - code: "1.2.5"
            text: Justify the choice of a bitmap image or a vector graphic for a given task.
          - code: "1.2.6"
            text: Understand how sound is represented and encoded.
            guidance: >-
              Use the terms sampling, sampling rate, sampling resolution, analogue data and digital
              data.
          - code: "1.2.7"
            text: Understand the impact of changing the sampling rate and the sampling resolution.
            guidance: Including the impact on file size and on accuracy.
      - code: "1.3"
        title: Compression
        objectives:
          - code: "1.3.1"
            text: Understand the need for compression and give examples of its use.
          - code: "1.3.2"
            text: >-
              Understand lossy and lossless compression, and justify the use of a method in a given
              situation.
          - code: "1.3.3"
            text: >-
              Understand how a text file, a bitmap image, a vector graphic and a sound file can be
              compressed.
            guidance: Including the use of run-length encoding (RLE).

  # ----------------------------------------------------------------------
  # 2 Communication (AS Level)
  - code: "2"
    title: Communication
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "2.1"
        title: Networks including the internet
        objectives:
          - code: "2.1.1"
            text: Understand the purpose and benefits of networking devices.
          - code: "2.1.2"
            text: Understand the characteristics of a LAN (local area network) and a WAN (wide area network).
          - code: "2.1.3"
            text: Explain the client-server and peer-to-peer models of networked computers.
            guidance: >-
              The roles of the different computers within the network and subnetwork models. The
              benefits and drawbacks of each model. Justify the use of a model for a given
              situation.
          - code: "2.1.4"
            text: Understand thin-client and thick-client, and the differences between them.
          - code: "2.1.5"
            text: Understand the bus, star, mesh and hybrid topologies.
            guidance: >-
              Understand how packets are transmitted between two hosts in a given topology. Justify
              the use of a topology for a given situation.
          - code: "2.1.6"
            text: Understand cloud computing.
            guidance: >-
              Including the use of public and private clouds, and the benefits and drawbacks of
              cloud computing.
          - code: "2.1.7"
            text: >-
              Understand the differences between wireless and wired networks and the implications of
              using each.
            guidance: >-
              Describe the characteristics of copper cable, fibre-optic cable, radio waves
              (including WiFi), microwaves and satellites.
          - code: "2.1.8"
            text: Describe the hardware used to support a LAN.
            guidance: >-
              Including switch, server, Network Interface Card (NIC), Wireless Network Interface
              Card (WNIC), Wireless Access Points (WAP), cables, bridge and repeater.
          - code: "2.1.9"
            text: Describe the role and function of a router in a network.
          - code: "2.1.10"
            text: Understand Ethernet and how collisions are detected and avoided.
            guidance: Including Carrier Sense Multiple Access / Collision Detection (CSMA / CD).
          - code: "2.1.11"
            text: Understand bit streaming.
            guidance: >-
              Methods of bit streaming: real-time and on-demand. The importance of bit rates /
              broadband speed for bit streaming.
          - code: "2.1.12"
            text: Understand the differences between the World Wide Web (WWW) and the internet.
          - code: "2.1.13"
            text: Describe the hardware used to support the internet.
            guidance: >-
              Including modems, PSTN (Public Switched Telephone Network), dedicated lines and the
              cell phone network.
          - code: "2.1.14"
            text: Explain how IP addresses are used in the transmission of data over the internet.
            guidance: >-
              Including: the format of an IP address, including IPv4 and IPv6; the use of subnetting
              in a network; how an IP address is associated with a device on a network; the
              difference between a public IP address and a private IP address, and the implications
              for security; the difference between a static IP address and a dynamic IP address.
          - code: "2.1.15"
            text: >-
              Explain how a Uniform Resource Locator (URL) is used to locate a resource on the World
              Wide Web (WWW), and the role of the Domain Name Service (DNS).

  # ----------------------------------------------------------------------
  # 3 Hardware (AS Level)
  - code: "3"
    title: Hardware
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "3.1"
        title: Computers and their components
        objectives:
          - code: "3.1.1"
            text: >-
              Understand the need for input, output, primary memory and secondary (including
              removable) storage.
          - code: "3.1.2"
            text: Understand embedded systems.
            guidance: Including the benefits and drawbacks of embedded systems.
          - code: "3.1.3"
            text: Describe the principal operations of hardware devices.
            guidance: >-
              Including laser printer, 3D printer, microphone, speakers, magnetic hard disk, solid
              state (flash) memory, optical disc reader/writer, touchscreen and virtual reality
              headset.
          - code: "3.1.4"
            text: Understand the use of buffers.
          - code: "3.1.5"
            text: Explain the differences between Random Access Memory (RAM) and Read Only Memory (ROM).
            guidance: Including their use in a range of devices and systems.
          - code: "3.1.6"
            text: Explain the differences between Static RAM (SRAM) and Dynamic RAM (DRAM).
            guidance: >-
              Including the use of SRAM and DRAM in a range of devices and systems, and the reasons
              for using one instead of the other depending on the device and its use.
          - code: "3.1.7"
            text: >-
              Explain the differences between Programmable ROM (PROM), Erasable Programmable ROM
              (EPROM) and Electrically Erasable Programmable ROM (EEPROM).
          - code: "3.1.8"
            text: Understand monitoring and control systems.
            guidance: >-
              Including: the difference between monitoring and control; the use of sensors
              (including temperature, pressure, infra-red and sound) and actuators; the importance
              of feedback.
      - code: "3.2"
        title: Logic Gates and Logic Circuits
        objectives:
          - code: "3.2.1"
            text: Use the logic gate symbols for NOT, AND, OR, NAND, NOR and XOR.
            guidance: The syllabus shows the symbol to be used for each of these six gates.
          - code: "3.2.2"
            text: Understand and define the functions of NOT, AND, OR, NAND, NOR and XOR (EOR) gates.
            guidance: Every gate except the NOT gate will have only two inputs.
          - code: "3.2.3"
            text: Construct the truth table for each of these logic gates.
          - code: "3.2.4"
            text: Construct a logic circuit.
            guidance: From a problem statement, a logic expression or a truth table.
          - code: "3.2.5"
            text: Construct a truth table.
            guidance: From a problem statement, a logic circuit or a logic expression.
          - code: "3.2.6"
            text: Construct a logic expression.
            guidance: From a problem statement, a logic circuit or a truth table.

  # ----------------------------------------------------------------------
  # 4 Processor Fundamentals (AS Level)
  - code: "4"
    title: Processor Fundamentals
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "4.1"
        title: Central Processing Unit (CPU) Architecture
        objectives:
          - code: "4.1.1"
            text: Understand the basic Von Neumann model for a computer system and the stored program concept.
          - code: "4.1.2"
            text: >-
              Understand the purpose and role of registers, including the difference between general
              purpose and special purpose registers.
            guidance: >-
              Special purpose registers including Program Counter (PC), Memory Data Register (MDR),
              Memory Address Register (MAR), the Accumulator (ACC), Index Register (IX), Current
              Instruction Register (CIR) and the Status Register.
          - code: "4.1.3"
            text: >-
              Understand the purpose and roles of the Arithmetic and Logic Unit (ALU), the Control
              Unit (CU), the system clock and the Immediate Access Store (IAS).
          - code: "4.1.4"
            text: >-
              Understand how data are transferred between the various components of the computer
              system using the address bus, data bus and control bus.
          - code: "4.1.5"
            text: Understand how different factors contribute to the performance of the computer system.
            guidance: >-
              Including processor type and number of cores, the bus width, clock speed and cache
              memory.
          - code: "4.1.6"
            text: Understand how different ports provide connection to peripheral devices.
            guidance: >-
              Including connection to Universal Serial Bus (USB), High Definition Multimedia
              Interface (HDMI) and Video Graphics Array (VGA).
          - code: "4.1.7"
            text: Describe the stages of the Fetch-Execute (F-E) cycle.
            guidance: Describe the F-E cycle using 'register transfer' notation, and use that notation.
          - code: "4.1.8"
            text: Understand the purpose of interrupts.
            guidance: >-
              Including: possible causes of interrupts; applications of interrupts; the use of an
              Interrupt Service handling Routine (ISR); when interrupts are detected during the
              fetch-execute cycle; how interrupts are handled.
      - code: "4.2"
        title: Assembly Language
        objectives:
          - code: "4.2.1"
            text: Understand the relationship between assembly language and machine code.
          - code: "4.2.2"
            text: Describe the different stages of the assembly process for a two-pass assembler.
            guidance: Apply the two-pass assembler process to a given simple assembly language program.
          - code: "4.2.3"
            text: Trace a given simple assembly language program.
            guidance: >-
              The syllabus gives an example instruction set: LDM, LDD, LDI, LDX and LDR (load, using
              immediate, direct, indirect or indexed addressing; LDR loads a number into IX), MOV,
              STO, ADD, SUB, INC, DEC, JMP, CMP, CMI, JPE and JPN (jump after a compare that was
              True or False), IN, OUT and END. Questions assume there is only one general purpose
              register, the Accumulator (ACC); IX is the Index Register; an address operand can be
              absolute or symbolic; # marks a denary number (e.g. #123), B a binary number (e.g.
              B01001010) and & a hexadecimal number (e.g. &4A).
          - code: "4.2.4"
            text: Understand that the instructions in a set of instructions are organised into groups.
            guidance: >-
              Including the groups: data movement; input and output of data; arithmetic operations;
              unconditional and conditional instructions; compare instructions.
          - code: "4.2.5"
            text: Understand, and be able to use, different modes of addressing.
            guidance: Including immediate, direct, indirect, indexed and relative addressing.
      - code: "4.3"
        title: Bit manipulation
        objectives:
          - code: "4.3.1"
            text: Understand and carry out binary shifts.
            guidance: Logical, arithmetic and cyclic shifts; left shift and right shift.
          - code: "4.3.2"
            text: Understand how bit manipulation can be used to monitor or control a device.
            guidance: >-
              Carry out bit manipulation operations. Test and set a bit using bit masking. The
              syllabus adds to the instruction set: bitwise AND, XOR and OR of the ACC with an
              operand (#n, Bn or &n) or with the contents of an address; LSL #n and LSR #n, which
              shift the bits in ACC logically n places left or right, introducing zeros at the
              vacated end; and labels, which name an instruction or give a symbolic address to a
              memory location holding data. Questions assume only one general purpose register
              (ACC).

  # ----------------------------------------------------------------------
  # 5 System Software (AS Level)
  - code: "5"
    title: System Software
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "5.1"
        title: Operating Systems
        objectives:
          - code: "5.1.1"
            text: Explain why a computer system needs an Operating System (OS).
          - code: "5.1.2"
            text: Explain the key management tasks carried out by the Operating System.
            guidance: >-
              Including memory management, file management, security management, hardware management
              (input / output / peripherals) and process management.
          - code: "5.1.3"
            text: Understand the need for the typical utility software provided with an Operating System.
            guidance: >-
              Including disk formatter, virus checker, defragmentation software, disk contents
              analysis / disk repair software, file compression and back-up software.
          - code: "5.1.4"
            text: Understand program libraries.
            guidance: >-
              Including: software under development is often built using existing code from program
              libraries; the benefits to the developer of software built using library files,
              including Dynamic Link Library (DLL) files.
      - code: "5.2"
        title: Language Translators
        objectives:
          - code: "5.2.1"
            text: >-
              Understand the need for: assembler software to translate an assembly language program;
              a compiler to translate a high-level language program; an interpreter to translate and
              execute a high-level language program.
          - code: "5.2.2"
            text: >-
              Explain the benefits and drawbacks of using either a compiler or an interpreter, and
              justify the use of each.
          - code: "5.2.3"
            text: >-
              Show awareness that high-level language programs may be partly compiled and partly
              interpreted, as with Java (console mode).
          - code: "5.2.4"
            text: Describe features found in a typical Integrated Development Environment (IDE).
            guidance: >-
              Including: features for coding, including context-sensitive prompts; features for
              initial error detection, including dynamic syntax checks; features for presentation,
              including prettyprint and expanding and collapsing code blocks; features for
              debugging, including single stepping, breakpoints, i.e. variables, expressions, and a
              report window.

  # ----------------------------------------------------------------------
  # 6 Security, privacy and data integrity (AS Level)
  - code: "6"
    title: Security, privacy and data integrity
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "6.1"
        title: Data Security
        objectives:
          - code: "6.1.1"
            text: Explain the difference between the terms security, privacy and integrity of data.
          - code: "6.1.2"
            text: Appreciate the need for both the security of data and the security of the computer system.
          - code: "6.1.3"
            text: >-
              Describe security measures designed to protect computer systems, ranging from the
              stand-alone PC to a network of computers.
            guidance: >-
              Including user accounts, passwords, authentication techniques such as digital
              signatures and biometrics, firewall, anti-virus software, anti-spyware and encryption.
          - code: "6.1.4"
            text: Understand the threats to computer and data security posed by networks and the internet.
            guidance: Including malware (virus, spyware), hackers, phishing and pharming.
          - code: "6.1.5"
            text: Describe methods that can be used to restrict the risks posed by threats.
          - code: "6.1.6"
            text: Describe security methods designed to protect the security of data.
            guidance: Including encryption and access rights.
      - code: "6.2"
        title: Data Integrity
        objectives:
          - code: "6.2.1"
            text: Describe how data validation and data verification help to protect the integrity of data.
          - code: "6.2.2"
            text: Describe and use methods of data validation.
            guidance: >-
              Including range check, format check, length check, presence check, existence check,
              limit check and check digit.
          - code: "6.2.3"
            text: Describe and use methods of data verification during data entry and data transfer.
            guidance: >-
              During data entry, including visual check and double entry. During data transfer,
              including parity check (byte and block) and checksum.

  # ----------------------------------------------------------------------
  # 7 Ethics and Ownership (AS Level)
  - code: "7"
    title: Ethics and Ownership
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "7.1"
        title: Ethics and Ownership
        objectives:
          - code: "7.1.1"
            text: Understand the need for, and purpose of, ethics as a computing professional.
            guidance: >-
              Understand the importance of joining a professional ethical body, including BCS
              (British Computer Society) and IEEE (Institute of Electrical and Electronic
              Engineers).
          - code: "7.1.2"
            text: >-
              Understand the need to act ethically, and the impact of acting ethically or
              unethically in a given situation.
          - code: "7.1.3"
            text: Understand the need for copyright legislation.
          - code: "7.1.4"
            text: >-
              Understand the different types of software licensing, and justify the use of a licence
              for a given situation.
            guidance: >-
              Licences to include Free Software Foundation, the Open Source Initiative, shareware
              and commercial software.
          - code: "7.1.5"
            text: Understand Artificial Intelligence (AI).
            guidance: >-
              Understand the impact of AI, including social, economic and environmental issues.
              Understand the applications of AI.

  # ----------------------------------------------------------------------
  # 8 Databases (AS Level)
  - code: "8"
    title: Databases
    level: AS
    papers: ["Paper 1"]
    topics:
      - code: "8.1"
        title: Database Concepts
        objectives:
          - code: "8.1.1"
            text: Understand the limitations of using a file-based approach to store and retrieve data.
          - code: "8.1.2"
            text: >-
              Describe the features of a relational database that address the limitations of a
              file-based approach.
          - code: "8.1.3"
            text: Understand and use the terminology associated with a relational database model.
            guidance: >-
              Including entity, table, record, field, tuple, attribute, primary key, candidate key,
              secondary key, foreign key, relationship (one-to-many, one-to-one, many-to-many),
              referential integrity and indexing.
          - code: "8.1.4"
            text: Use an entity-relationship (E-R) diagram to document a database design.
          - code: "8.1.5"
            text: Understand the normalisation process.
            guidance: First Normal Form (1NF), Second Normal Form (2NF) and Third Normal Form (3NF).
          - code: "8.1.6"
            text: Explain why a given set of database tables is, or is not, in 3NF.
          - code: "8.1.7"
            text: >-
              Produce a normalised database design for a description of a database, a given set of
              data or a given set of tables.
      - code: "8.2"
        title: Database Management Systems (DBMS)
        objectives:
          - code: "8.2.1"
            text: >-
              Understand the features provided by a Database Management System (DBMS) that address
              the issues of a file-based approach.
            guidance: >-
              Including: data management, including maintaining a data dictionary; data modelling;
              logical schema; data integrity; data security, including backup procedures and the use
              of access rights for individuals / groups of users.
          - code: "8.2.2"
            text: Understand how the software tools found within a DBMS are used in practice.
            guidance: Including the use and purpose of the developer interface and the query processor.
      - code: "8.3"
        title: Data Definition Language (DDL) and Data Manipulation Language (DML)
        objectives:
          - code: "8.3.1"
            text: >-
              Understand that the DBMS carries out all creation and modification of the database
              structure using its Data Definition Language (DDL).
          - code: "8.3.2"
            text: >-
              Understand that the DBMS carries out all queries and maintenance of data using its
              Data Manipulation Language (DML).
          - code: "8.3.3"
            text: >-
              Understand that Structured Query Language (SQL) is the industry standard for both DDL
              and DML.
            guidance: Understand a given SQL statement.
          - code: "8.3.4"
            text: >-
              Understand given SQL (DDL) statements, and write simple SQL (DDL) statements using a
              sub-set of statements.
            guidance: >-
              Create a database (CREATE DATABASE). Create a table definition (CREATE TABLE),
              including creating attributes with appropriate data types: CHARACTER, VARCHAR(n),
              BOOLEAN, INTEGER, REAL, DATE, TIME. Change a table definition (ALTER TABLE). Add a
              primary key to a table (PRIMARY KEY (field)). Add a foreign key to a table (FOREIGN
              KEY (field) REFERENCES Table (Field)).
          - code: "8.3.5"
            text: Write an SQL script to query or modify data (DML) stored in at most two database tables.
            guidance: >-
              Queries including SELECT ... FROM, WHERE, ORDER BY, GROUP BY, INNER JOIN, SUM, COUNT
              and AVG. Data maintenance including INSERT INTO, DELETE FROM and UPDATE.

  # ----------------------------------------------------------------------
  # 9 Algorithm Design and Problem-solving (AS Level)
  - code: "9"
    title: Algorithm Design and Problem-solving
    level: AS
    papers: ["Paper 2"]
    topics:
      - code: "9.1"
        title: Computational Thinking Skills
        objectives:
          - code: "9.1.1"
            text: Understand abstraction.
            guidance: >-
              The need for and benefits of using abstraction. Describe the purpose of abstraction.
              Produce an abstract model of a system by including only the essential details.
          - code: "9.1.2"
            text: Describe and use decomposition.
            guidance: >-
              Break problems down into sub-problems, leading to the concept of a program module
              (procedure / function).
      - code: "9.2"
        title: Algorithms
        objectives:
          - code: "9.2.1"
            text: >-
              Understand that an algorithm is a solution to a problem expressed as a sequence of
              defined steps.
          - code: "9.2.2"
            text: >-
              Use suitable identifier names to represent the data used by a problem, and represent
              these in an identifier table.
          - code: "9.2.3"
            text: Write pseudocode that contains input, process and output.
          - code: "9.2.4"
            text: >-
              Write pseudocode using the three basic constructs of sequence, selection and iteration
              (repetition).
          - code: "9.2.5"
            text: >-
              Document a simple algorithm using a structured English description, a flowchart or
              pseudocode.
          - code: "9.2.6"
            text: "Write pseudocode from: a structured English description; a flowchart."
          - code: "9.2.7"
            text: "Draw a flowchart from: a structured English description; pseudocode."
          - code: "9.2.8"
            text: >-
              Describe and use the process of stepwise refinement to express an algorithm to a level
              of detail from which the task may be programmed.
          - code: "9.2.9"
            text: Use logic statements to define parts of an algorithm solution.

  # ----------------------------------------------------------------------
  # 10 Data Types and Structures (AS Level)
  - code: "10"
    title: Data Types and Structures
    level: AS
    papers: ["Paper 2"]
    topics:
      - code: "10.1"
        title: Data Types and Records
        objectives:
          - code: "10.1.1"
            text: Select and use appropriate data types for a problem solution.
            guidance: >-
              Including integer, real, char, string, Boolean and date. Pseudocode uses the data
              types INTEGER, REAL, CHAR, STRING, BOOLEAN, DATE, ARRAY and FILE.
          - code: "10.1.2"
            text: >-
              Understand the purpose of a record structure to hold a set of data of different data
              types under one identifier.
            guidance: >-
              Write pseudocode to define a record structure. Write pseudocode to read data from a
              record structure and to save data to a record structure.
      - code: "10.2"
        title: Arrays
        objectives:
          - code: "10.2.1"
            text: Use the technical terms associated with arrays.
            guidance: Including index, upper bound and lower bound.
          - code: "10.2.2"
            text: Select a suitable data structure (1D or 2D array) to use for a given task.
          - code: "10.2.3"
            text: Write pseudocode for 1D and 2D arrays.
          - code: "10.2.4"
            text: Write pseudocode to process array data.
            guidance: Sort using a bubble sort. Search using a linear search.
      - code: "10.3"
        title: Files
        objectives:
          - code: "10.3.1"
            text: Understand why files are needed.
          - code: "10.3.2"
            text: Write pseudocode to handle text files that consist of one or more lines.
      - code: "10.4"
        title: Introduction to Abstract Data Types (ADT)
        objectives:
          - code: "10.4.1"
            text: Understand that an ADT is a collection of data and a set of operations on those data.
          - code: "10.4.2"
            text: Understand that a stack, a queue and a linked list are examples of ADTs.
            guidance: >-
              Describe the key features of a stack, queue and linked list, and justify their use for
              a given situation.
          - code: "10.4.3"
            text: Use a stack, a queue and a linked list to store data.
            guidance: >-
              Candidates will not be required to write pseudocode for these structures, but should
              be able to add, edit and delete data in them.
          - code: "10.4.4"
            text: Describe how a queue, a stack and a linked list can be implemented using arrays.

  # ----------------------------------------------------------------------
  # 11 Programming (AS Level)
  - code: "11"
    title: Programming
    level: AS
    papers: ["Paper 2"]
    topics:
      - code: "11.1"
        title: Programming Basics
        objectives:
          - code: "11.1.1"
            text: >-
              Implement, and write pseudocode from, a given design presented as either a program
              flowchart or structured English.
          - code: "11.1.2"
            text: >-
              Write pseudocode statements for: the declaration and initialisation of constants; the
              declaration of variables; the assignment of values to variables; expressions involving
              any of the arithmetic or logical operators; input from the keyboard and output to the
              console.
          - code: "11.1.3"
            text: Use built-in functions and library routines.
            guidance: >-
              Any functions not given in the pseudocode guide will be provided. String manipulation
              functions will always be given.
      - code: "11.2"
        title: Constructs
        objectives:
          - code: "11.2.1"
            text: >-
              Use pseudocode to write: an 'IF' statement, including the 'ELSE' clause and nested IF
              statements; a 'CASE' structure; a 'count-controlled' loop; a 'post-condition' loop; a
              'pre-condition' loop.
          - code: "11.2.2"
            text: Justify why one loop structure may be better suited than the others to solving a problem.
      - code: "11.3"
        title: Structured Programming
        objectives:
          - code: "11.3.1"
            text: Define and use a procedure.
          - code: "11.3.2"
            text: >-
              Explain where in the construction of an algorithm it would be appropriate to use a
              procedure.
          - code: "11.3.3"
            text: Use parameters.
            guidance: >-
              A procedure may have no parameters, one parameter or more than one. A parameter can be
              passed by reference or by value.
          - code: "11.3.4"
            text: Define and use a function.
          - code: "11.3.5"
            text: Explain where in the construction of an algorithm it is appropriate to use a function.
            guidance: A function is used in an expression; for example, the return value replaces the call.
          - code: "11.3.6"
            text: Use the terminology associated with procedures and functions.
            guidance: >-
              Including procedure / function header, procedure / function interface, parameter,
              argument and return value.
          - code: "11.3.7"
            text: Write efficient pseudocode.

  # ----------------------------------------------------------------------
  # 12 Software Development (AS Level)
  - code: "12"
    title: Software Development
    level: AS
    papers: ["Paper 2"]
    topics:
      - code: "12.1"
        title: Program Development Life cycle
        objectives:
          - code: "12.1.1"
            text: Understand the purpose of a development life cycle.
          - code: "12.1.2"
            text: >-
              Understand the need for different development life cycles depending on the program
              being developed.
            guidance: Including waterfall, iterative and rapid application development (RAD).
          - code: "12.1.3"
            text: Describe the principles, benefits and drawbacks of each type of life cycle.
          - code: "12.1.4"
            text: >-
              Understand the analysis, design, coding, testing and maintenance stages in the program
              development life cycle.
      - code: "12.2"
        title: Program Design
        objectives:
          - code: "12.2.1"
            text: >-
              Use a structure chart to decompose a problem into sub-tasks and to express the
              parameters passed between the various modules / procedures / functions that are part
              of the algorithm design.
            guidance: >-
              Describe the purpose of a structure chart. Construct a structure chart for a given
              problem. Derive equivalent pseudocode from a structure chart.
          - code: "12.2.2"
            text: Understand the purpose of state-transition diagrams for documenting an algorithm.
      - code: "12.3"
        title: Program Testing and Maintenance
        objectives:
          - code: "12.3.1"
            text: Understand ways of exposing and avoiding faults in programs.
          - code: "12.3.2"
            text: Locate and identify the different types of errors.
            guidance: Syntax errors, logic errors and run-time errors.
          - code: "12.3.3"
            text: Correct identified errors.
          - code: "12.3.4"
            text: Understand the methods of testing available, and select appropriate data for a given method.
            guidance: >-
              Including dry run, walkthrough, white-box, black-box, integration, alpha, beta,
              acceptance and stub testing.
          - code: "12.3.5"
            text: Understand the need for a test strategy and a test plan, and their likely contents.
          - code: "12.3.6"
            text: Choose appropriate test data for a test plan.
            guidance: Including normal, abnormal and extreme/boundary data.
          - code: "12.3.7"
            text: >-
              Understand the need for continuing maintenance of a system, and the differences
              between each type of maintenance.
            guidance: Including perfective, adaptive and corrective maintenance.
          - code: "12.3.8"
            text: Analyse an existing program and make amendments to enhance its functionality.

  # ----------------------------------------------------------------------
  # 13 Data Representation (A Level)
  - code: "13"
    title: Data Representation
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "13.1"
        title: User-defined data types
        objectives:
          - code: "13.1.1"
            text: Understand why user-defined types are necessary.
          - code: "13.1.2"
            text: Define and use non-composite types.
            guidance: Including enumerated and pointer types.
          - code: "13.1.3"
            text: Define and use composite data types.
            guidance: Including set, record and class/object.
          - code: "13.1.4"
            text: Choose and design an appropriate user-defined data type for a given problem.
      - code: "13.2"
        title: File organisation and access
        objectives:
          - code: "13.2.1"
            text: >-
              Understand the methods of file organisation, and select an appropriate method of file
              organisation and file access for a given problem.
            guidance: Including serial, sequential (using a key field) and random (using a record key).
          - code: "13.2.2"
            text: Understand the methods of file access.
            guidance: >-
              Including sequential access for serial and sequential files, and direct access for
              sequential and random files.
          - code: "13.2.3"
            text: Understand hashing algorithms.
            guidance: >-
              Describe and use different hashing algorithms to read data from, and write data to, a
              random / sequential file.
      - code: "13.3"
        title: Floating-point numbers, representation and manipulation
        objectives:
          - code: "13.3.1"
            text: Describe the format of binary floating-point real numbers.
            guidance: >-
              Use two's complement form. Understand the effects of changing the allocation of bits
              between the mantissa and the exponent in a floating-point representation.
          - code: "13.3.2"
            text: >-
              Convert binary floating-point real numbers into denary, and denary into binary
              floating-point.
          - code: "13.3.3"
            text: Normalise floating-point numbers.
            guidance: Understand the reasons for normalisation.
          - code: "13.3.4"
            text: >-
              Understand the consequences of a binary representation only being an approximation to
              the real number it represents (in certain cases).
            guidance: Understand how underflow and overflow can occur.
          - code: "13.3.5"
            text: Understand that binary representations can give rise to rounding errors.

  # ----------------------------------------------------------------------
  # 14 Communication and internet technologies (A Level)
  - code: "14"
    title: Communication and internet technologies
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "14.1"
        title: Protocols
        objectives:
          - code: "14.1.1"
            text: Understand why a protocol is essential for communication between computers.
          - code: "14.1.2"
            text: >-
              Understand how protocol implementation can be viewed as a stack, in which each layer
              has its own functionality.
          - code: "14.1.3"
            text: Understand the TCP / IP protocol suite.
            guidance: >-
              Its four layers (Application, Transport, Internet, Link). The purpose and function of
              each layer. How the suite is applied when a message is sent from one host to another
              on the internet.
          - code: "14.1.4"
            text: Understand the protocols HTTP, FTP, POP3, IMAP, SMTP and BitTorrent, and their purposes.
            guidance: The BitTorrent protocol provides peer-to-peer file sharing.
      - code: "14.2"
        title: Circuit switching, packet switching
        objectives:
          - code: "14.2.1"
            text: Understand circuit switching.
            guidance: Its benefits, drawbacks and where it is applicable.
          - code: "14.2.2"
            text: Understand packet switching.
            guidance: >-
              Its benefits, drawbacks and where it is applicable. Understand the function of a
              router in packet switching. Explain how packet switching is used to pass messages
              across a network, including the internet.

  # ----------------------------------------------------------------------
  # 15 Hardware and Virtual Machines (A Level)
  - code: "15"
    title: Hardware and Virtual Machines
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "15.1"
        title: Processors, Parallel Processing and Virtual Machines
        objectives:
          - code: "15.1.1"
            text: >-
              Understand Reduced Instruction Set Computers (RISC) and Complex Instruction Set
              Computers (CISC) processors.
            guidance: >-
              The differences between RISC and CISC. Understand interrupt handling on CISC and RISC
              processors.
          - code: "15.1.2"
            text: Understand the importance and use of pipelining and registers in RISC processors.
          - code: "15.1.3"
            text: Understand the four basic computer architectures.
            guidance: SISD, SIMD, MISD and MIMD.
          - code: "15.1.4"
            text: Understand the characteristics of massively parallel computers.
          - code: "15.1.5"
            text: Understand the concept of a virtual machine.
            guidance: >-
              Give examples of the role of virtual machines. Understand the benefits and limitations
              of virtual machines.
      - code: "15.2"
        title: Boolean Algebra and Logic Circuits
        objectives:
          - code: "15.2.1"
            text: Produce truth tables for logic circuits, including half adders and full adders.
            guidance: May include logic gates with more than two inputs.
          - code: "15.2.2"
            text: Understand a flip-flop (SR, JK).
            guidance: >-
              Draw a logic circuit and derive a truth table for a flip-flop. Understand the role of
              flip-flops as data storage elements.
          - code: "15.2.3"
            text: Understand Boolean algebra.
            guidance: >-
              Understand De Morgan's laws. Perform Boolean algebra using De Morgan's laws. Simplify
              a logic circuit / expression using Boolean algebra.
          - code: "15.2.4"
            text: Understand Karnaugh maps (K-maps).
            guidance: >-
              Understand the benefits of using Karnaugh maps. Solve logic problems using Karnaugh
              maps.

  # ----------------------------------------------------------------------
  # 16 System Software (A Level)
  - code: "16"
    title: System Software
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "16.1"
        title: Purposes of an Operating System (OS)
        objectives:
          - code: "16.1.1"
            text: Understand how an OS can maximise the use of resources.
          - code: "16.1.2"
            text: >-
              Describe the ways in which the user interface hides the complexities of the hardware
              from the user.
          - code: "16.1.3"
            text: Understand process management.
            guidance: >-
              The concept of multi-tasking and of a process. The process states: running, ready and
              blocked. The need for scheduling, and the function and benefits of different
              scheduling routines (including round robin, shortest job first, first come first
              served and shortest remaining time). How the kernel of the OS acts as an interrupt
              handler, and how interrupt handling is used to manage low-level scheduling.
          - code: "16.1.4"
            text: Understand virtual memory, paging and segmentation for memory management.
            guidance: >-
              The concepts of paging, virtual memory and segmentation. The difference between paging
              and segmentation. How pages can be replaced. How disk thrashing can occur.
      - code: "16.2"
        title: Translation Software
        objectives:
          - code: "16.2.1"
            text: Understand how an interpreter can execute programs without producing a translated version.
          - code: "16.2.2"
            text: Understand the various stages in the compilation of a program.
            guidance: Including lexical analysis, syntax analysis, code generation and optimisation.
          - code: "16.2.3"
            text: >-
              Understand how the grammar of a language can be expressed using syntax diagrams or
              Backus-Naur Form (BNF) notation.
          - code: "16.2.4"
            text: >-
              Understand how Reverse Polish Notation (RPN) can be used to carry out the evaluation
              of expressions.

  # ----------------------------------------------------------------------
  # 17 Security (A Level)
  - code: "17"
    title: Security
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "17.1"
        title: Encryption, Encryption Protocols and Digital Certificates
        objectives:
          - code: "17.1.1"
            text: Understand how encryption works.
            guidance: >-
              Including the use of public key, private key, plain text, cipher text, encryption,
              symmetric key cryptography and asymmetric key cryptography. How the keys can be used
              to send a private message from the public to an individual / organisation. How the
              keys can be used to send a verified message to the public. How data is encrypted and
              decrypted using symmetric and asymmetric cryptography. The purpose, benefits and
              drawbacks of quantum cryptography.
          - code: "17.1.2"
            text: Show awareness of the Secure Socket Layer (SSL) / Transport Layer Security (TLS).
            guidance: >-
              The purpose of SSL / TLS. The use of SSL / TLS in client-server communication.
              Situations in which using SSL / TLS would be appropriate.
          - code: "17.1.3"
            text: Understand digital certification.
            guidance: >-
              How a digital certificate is acquired. How a digital certificate is used to produce
              digital signatures.

  # ----------------------------------------------------------------------
  # 18 Artificial Intelligence (AI) (A Level)
  - code: "18"
    title: Artificial Intelligence (AI)
    level: A
    papers: ["Paper 3"]
    topics:
      - code: "18.1"
        title: Artificial Intelligence (AI)
        objectives:
          - code: "18.1.1"
            text: Understand how graphs can be used to aid Artificial Intelligence (AI).
            guidance: >-
              The purpose and structure of a graph. Use A* and Dijkstra's algorithms to perform
              searches on a graph. Candidates will not be required to write algorithms to set up,
              access or perform searches on graphs.
          - code: "18.1.2"
            text: Understand how artificial neural networks have helped with machine learning.
          - code: "18.1.3"
            text: >-
              Understand Deep Learning, Machine Learning and Reinforcement Learning, and the reasons
              for using these methods.
            guidance: >-
              Understand the categories of machine learning, including supervised learning and
              unsupervised learning.
          - code: "18.1.4"
            text: Understand back propagation of errors and regression methods in machine learning.

  # ----------------------------------------------------------------------
  # 19 Computational thinking and Problem-solving (A Level)
  - code: "19"
    title: Computational thinking and Problem-solving
    level: A
    papers: ["Paper 3", "Paper 4"]
    topics:
      - code: "19.1"
        title: Algorithms
        objectives:
          - code: "19.1.1"
            text: Understand linear and binary searching methods.
            guidance: >-
              Write an algorithm to implement a linear search. Write an algorithm to implement a
              binary search. The conditions necessary for the use of a binary search. How the
              performance of a binary search varies according to the number of data items.
          - code: "19.1.2"
            text: Understand insertion sort and bubble sort methods.
            guidance: >-
              Write an algorithm to implement an insertion sort. Write an algorithm to implement a
              bubble sort. The performance of a sorting routine may depend on the initial order of
              the data and the number of data items.
          - code: "19.1.3"
            text: Understand and use Abstract Data Types (ADT).
            guidance: >-
              Write algorithms to find an item in each of: linked list, binary tree. Write
              algorithms to insert an item into each of: stack, queue, linked list, binary tree.
              Write algorithms to delete an item from each of: stack, queue, linked list. Understand
              that a graph is an example of an ADT; describe the key features of a graph and justify
              its use for a given situation. Candidates will not be required to write code for a
              graph structure.
          - code: "19.1.4"
            text: Show how it is possible for ADTs to be implemented from another ADT.
            guidance: >-
              Describe the following ADTs and demonstrate how they can be implemented from
              appropriate built-in types or other ADTs: stack, queue, linked list, dictionary,
              binary tree.
          - code: "19.1.5"
            text: >-
              Understand that different algorithms that perform the same task can be compared using
              criteria (e.g. the time taken to complete the task and the memory used).
            guidance: Including the use of Big O notation to specify time and space complexity.
      - code: "19.2"
        title: Recursion
        objectives:
          - code: "19.2.1"
            text: Understand recursion.
            guidance: >-
              The essential features of recursion. How recursion is expressed in a programming
              language. Write and trace recursive algorithms. When the use of recursion is
              beneficial.
          - code: "19.2.2"
            text: Show awareness of what a compiler has to do to translate recursive programming code.
            guidance: The use of stacks and unwinding.

  # ----------------------------------------------------------------------
  # 20 Further Programming (A Level)
  - code: "20"
    title: Further Programming
    level: A
    papers: ["Paper 3", "Paper 4"]
    topics:
      - code: "20.1"
        title: Programming Paradigms
        objectives:
          - code: "20.1.1"
            text: Understand what is meant by a programming paradigm.
          - code: "20.1.2"
            text: >-
              Understand the characteristics of a number of programming paradigms: low-level;
              imperative (procedural); object-oriented; declarative.
            guidance: >-
              Low-level programming: understand and be able to write low-level code that uses
              various addressing modes: immediate, direct, indirect, indexed and relative.
              Imperative (procedural) programming: knowledge and understanding of structured
              programming is assumed (see AS content section 11.3); understand and be able to write
              imperative (procedural) code that uses variables, constructs, procedures and functions
              (see the AS content). Object-oriented programming (OOP): understand the terminology
              associated with OOP (including objects, properties/attributes, methods, classes,
              inheritance, polymorphism, containment (aggregation), encapsulation, getters, setters
              and instances); understand how to solve a problem by designing appropriate classes;
              understand and be able to write code that demonstrates the use of OOP. Declarative
              programming: understand and be able to solve a problem by writing appropriate facts
              and rules based on supplied information; understand and be able to write code that can
              satisfy a goal using facts and rules. Paper 4 does not assess low-level or declarative
              programming.
      - code: "20.2"
        title: File Processing and Exception Handling
        objectives:
          - code: "20.2.1"
            text: Write code to perform file-processing operations.
            guidance: >-
              Open a file (in read, write or append mode) and close a file. Read a record from a
              file and write a record to a file. Perform file-processing operations on serial,
              sequential and random files.
          - code: "20.2.2"
            text: Understand what an exception is and the importance of exception handling.
            guidance: >-
              Know when it is appropriate to use exception handling. Write program code that uses
              exception handling.
