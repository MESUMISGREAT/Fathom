id: language-translators-java-partly-compiled
subject: "9618"
topic: "5.2"
title: "Java: compiled, then interpreted"
summary: Java is compiled to bytecode, not to machine code — then the JVM interprets that bytecode, so the same compiled file runs on any machine with a JVM.
order: 3
minutes: 5
kind: core
objectives: ["5.2.3"]
prerequisites: [language-translators-compiler-versus-interpreter]
