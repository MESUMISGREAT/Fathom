id: database-concepts-relational-databases
subject: "9618"
topic: "8.1"
title: Relational databases and the DBMS
summary: How tables linked by keys, managed by a DBMS, fix the problems of separate files.
order: 2
minutes: 6
kind: core
objectives: ["8.1.2"]
prerequisites: [database-concepts-file-based-limitations]
