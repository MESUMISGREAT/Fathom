id: dbms-file-based-approach-problems
subject: "9618"
topic: "8.2"
title: "Why file-based data storage breaks down"
summary: Storing data in separate files works until the same student, customer or product appears in several of them. Then the copies drift apart, and a DBMS is the fix.
order: 1
minutes: 8
kind: core
objectives: ["8.2.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus for
    2027-2029 (Version 2, December 2025), topic 8.2, learning outcome 8.2.1 (DBMS features that
    address the issues of a file-based approach). Questions are original.

    Second-pass review (same agent, no separate reviewer model): the problem-to-feature mapping was
    checked against the 2027-2029 syllabus wording, the DBMS tool list was checked against the
