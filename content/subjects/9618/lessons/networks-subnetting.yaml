id: networks-subnetting
subject: "9618"
topic: "2.1"
title: "Subnetting and subnet masks"
summary: Why networks are split into subnets, how a subnet mask separates the network ID from the host ID, and how a device decides whether a destination is local.
order: 12
minutes: 5
kind: core
objectives: ["2.1.14"]
prerequisites: [networks-ip-addresses]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029 (Version 2, December 2025), topic 2.1, fourteenth learning outcome
    (2.1.14, how IP addresses are used in the transmission of data over the internet), the use of
