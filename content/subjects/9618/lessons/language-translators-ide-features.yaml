id: language-translators-ide-features
subject: "9618"
topic: "5.2"
title: "Inside an IDE"
summary: An Integrated Development Environment bundles an editor, translator and debugger — and its features for coding, catching errors, presenting code and debugging are examinable one by one.
order: 4
minutes: 7
kind: core
objectives: ["5.2.4"]
prerequisites: [language-translators-assembler-compiler-interpreter]
