id: sql-select-where-order-group
subject: "9618"
topic: "8.3"
title: "Asking questions: SELECT, WHERE, ORDER BY and GROUP BY"
summary: A query is a sentence with fixed slots. Learn where the filter goes, where the sorting goes, and how GROUP BY turns many rows into one summary row.
order: 4
minutes: 10
kind: core
objectives: ["8.3.5"]
prerequisites: [sql-ddl-and-dml, sql-create-table]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus
    (2027-2029, Version 2, December 2025), topic 8.3, learning outcome 8.3.5 (SELECT ... FROM,
    WHERE, ORDER BY, GROUP BY and the aggregate functions SUM, COUNT, AVG). All questions are
