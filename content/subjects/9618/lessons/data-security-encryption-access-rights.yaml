id: data-security-encryption-access-rights
subject: "9618"
topic: "6.1"
title: "Encryption and access rights: protecting the data itself"
summary: How encryption makes data unreadable without a key, and how access rights decide who may read, change, run or delete each file.
order: 7
minutes: 9
kind: core
objectives: ["6.1.6"]
prerequisites: [data-security-system-and-data]
