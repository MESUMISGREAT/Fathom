title: Programming Constructs — IF, CASE, and loop structures
summary: Write pseudocode for IF statements (with ELSE, nested), CASE structures, count-controlled loops, post-condition loops, and pre-condition loops. Justify loop choice for a given problem.
order: 2
minutes: 6
kind: core
objectives: ["11.2.1", "11.2.2"]
prerequisites: ["programming-basics", "algorithms-control-structures"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
