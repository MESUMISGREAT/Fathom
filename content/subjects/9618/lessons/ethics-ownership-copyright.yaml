id: ethics-ownership-copyright
subject: "9618"
topic: "7.1"
title: "Copyright: who owns the code"
summary: Copyright gives a creator legal control over copying and distributing their work, including software, and it is why you cannot simply sell someone else's program.
order: 2
minutes: 8
kind: core
objectives: ["7.1.3"]
prerequisites: [ethics-ownership-ethics-in-computing]
