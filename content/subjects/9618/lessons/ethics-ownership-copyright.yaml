blocks:
  - type: objective
    body: |-
      By the end you can explain what **copyright** is, why legislation is needed, what it protects
      (including software), and what counts as infringement — with the consequences for the people
      involved.

  - type: explain
    title: The problem copyright solves
    body: |-
      Writing software, composing music or taking a photograph takes time, skill and money. Digital
      copies, however, cost almost nothing and are perfect: the thousandth copy of a program is
      identical to the first.

      Without a rule, anyone could copy a program and sell it, and the person who spent a year
      building it would earn nothing. Fewer people would bother to create software at all.

      **Copyright** is the law that fixes this. It gives the creator control over copying and
      distribution for a period of time, so they can earn from their work.

  - type: definition
    term: Copyright
    body: |-
      A legal right that gives the creator of an original work control over how it is copied,
      published, distributed, adapted and performed, for a fixed period of time.

      In the UK, copyright arises **automatically** as soon as an original work is recorded in a
      fixed form. There is no registration and no fee — the © symbol is a reminder, not a
      requirement.

  - type: explain
    title: What copyright protects
    body: |-
      Copyright protects the **expression** of an idea, not the idea itself.

      | Protected | Not protected |
      |---|---|
      | source code and object code (software is treated as a literary work) | the idea or method behind a program |
      | books, articles, documentation | facts and data on their own |
      | music, lyrics, sound recordings | a title or a name (these may be trademarks) |
      | photographs, drawings, graphics | a general style or technique |
      | films, video, broadcasts | an algorithm as an abstract idea |
      | databases and their arrangement | anything you write yourself |

      That last row matters: **your** code is your copyright the moment you write it, unless your
      employment contract says otherwise (work created by an employee in the course of their job
      normally belongs to the employer).

  - type: explain
    title: Why legislation is needed
    body: |-
      Copyright law exists to balance two things: rewarding creators, and letting society use and
      build on their work. The legislation is needed because:

      1. **It gives creators a way to earn.** Without control over copying, there is no market for
         digital work.
      2. **It protects investment.** Companies fund years of development because the result cannot
         be copied legally by a competitor.
      3. **It gives a legal remedy.** The owner can go to court for an injunction (to stop the
         copying) and for damages (to recover losses).
      4. **It rewards effort and skill.** Copyright protects the work put into the expression, even
         if the idea is common.
      5. **It sets limits.** Copyright is not forever and not absolute: it expires, and there are
         narrow exceptions for things like private study, criticism and reporting the news.

  - type: intuition
    title: A copyright is a bundle of rights, not one lock
    body: |-
      The owner does not just get "the right to copy". They get several separate rights, and they
      can grant them separately:

      - to **copy** the work (for example, installing software on a machine);
      - to **distribute** copies (sell, rent or give away);
      - to **adapt** it (translate it, modify the source code, make a derivative work);
      - to **perform or show** it in public;
      - to **license** any of these to someone else, usually for a fee.

      This is why a **licence** matters so much: it is the owner's permission for you to do some of
      these things, on their terms. Buying a copy is not the same as owning the copyright.

  - type: explain
    title: How long copyright lasts
    body: |-
      Copyright is limited in time, after which the work is in the **public domain** and anyone may
      use it.

      For a typical literary, artistic or software work in the UK, copyright lasts for the life of
      the author plus **70 years**. Sound recordings and films are usually protected for 70 years
      from release, and typographical arrangements of published editions for 25 years.

      The exact numbers are less important for the exam than the principle: protection lasts a long
      time but does not last forever, so old works become free to use.

  - type: explain
    title: Infringement, and the usual forms of software piracy
    body: |-
      **Infringement** is doing any of the owner's exclusive acts without permission or a legal
      exception. For software this is usually called **software piracy**.

      | Form | What happens |
      |---|---|
      | softlifting | one licensed copy is installed on more machines than the licence allows, or shared with friends |
      | internet piracy | the program is uploaded or downloaded from unauthorised sites or file-sharing networks |
      | hard-disk loading | a seller installs an unlicensed copy on computers it sells |
      | counterfeiting | fake copies are made and packaged to look genuine and sold as real |
      | renting | copies are lent or rented out without permission |
      | cracking | technical protection (product keys, activation) is bypassed |

      Even using unlicensed images or music in a school project or a company website is
      infringement — it is not limited to programs.

  - type: explain
    title: Exceptions and consequences
    body: |-
      The law allows limited **exceptions** so that copyright does not block ordinary life: private
      study and research, criticism and review, reporting current events, parody, and some
      educational use. These are narrow, and they do not permit you to copy a program and sell it
      or to publish someone else's image as your own.

      The consequences of infringement fall on several parties:

      - **Civil action** by the owner: an injunction to stop the use, damages or an account of
        profits, and seizure of infringing copies.
      - **Criminal prosecution** for commercial-scale piracy: unlimited fines and, for serious
        cases, imprisonment.
      - **For a business:** destroyed reputation, lost contracts, and liability for what its
        employees installed.
      - **For an individual:** dismissal, a criminal record, and personal liability even if "the
        company" owned the machines.

  - type: example
    title: "Worked example: the school website"
    problem: |-
      A school's IT technician builds a new website. They download a stock photograph from an image
      search, a font from a random website, and a small JavaScript library from a code-sharing site.
      Nothing is paid for and no licence is checked.

      Explain the copyright problems and what should have been done.
    steps:
      - |-
        **The photograph.** Finding an image online does not make it free to use. Unless the licence
        allows it, publishing it on the school site is copying and distributing someone else's work.
      - |-
        **The font.** Fonts are licensed software. Many are free for personal use only; using one on
        a public website can need a commercial web licence.
      - |-
        **The JavaScript library.** Most code-sharing libraries carry a licence (MIT, Apache, GPL)
        that sets conditions — often that the copyright notice is kept, and for GPL that the
        project's own source is also released.
      - |-
        **What should be done.** Check the licence of every asset before use, keep the required
        notices, pay for a commercial licence where needed, and keep a record of what was used and
        under which licence.
      - |-
        **Why it matters for a school.** A school is an organisation, not a private individual: an
        exception for private study does not cover publishing material on a public website.
    answer: |-
      Each asset needed a licence check before publication. Free to download is not the same as free
      to use; missing notices or unpaid commercial licences are infringements with civil (and, at
      scale, criminal) consequences.

  - type: check
    title: Quick check
    questions: [copyright-definition, what-is-protected, need-for-legislation]
  - type: check
    title: Practice
    questions: [software-piracy-type, licence-permission, copyright-spot-error]

  - type: misconceptions
    items:
      - wrong: If something is on the internet, it is free to use.
        right: |-
          Being visible is not permission. A work is protected whether or not it carries a © symbol,
          unless its licence says otherwise or copyright has expired.
      - wrong: Copyright protects an idea, so nobody else may write a similar program.
        right: |-
          Copyright protects the expression — the actual code and text — not the idea or method.
          Others may write their own program that does the same job.
      - wrong: Buying a copy of a program gives you the copyright.
        right: |-
          You buy a licence to use a copy, not ownership of the rights. The copyright stays with the
          author or publisher.
      - wrong: Copyright lasts forever.
        right: |-
          It lasts for a fixed period (typically the author's life plus 70 years), after which the
          work is in the public domain.
      - wrong: Only selling pirated software is infringement.
        right: |-
          Installing one licence on extra machines, downloading from unauthorised sites, or using an
          unlicensed image on a website are all infringement.

  - type: exam
    body: |-
      - "State the need for copyright legislation" wants reasons: to protect the creator's income,
        to encourage creation, to give a legal remedy against copying, and to protect investment.
      - Give a **consequence**: "the owner can obtain an injunction and damages", or "commercial
        piracy can lead to a fine or imprisonment".
      - Use the scenario. Name the specific act — copying, distributing, adapting, renting — and say
        that it was done without a licence.
      - Do not write that copyright protects ideas; say it protects the expression of an idea.
      - Distinguish copyright (the right) from a licence (permission to do specific things).

  - type: takeaways
    items:
      - Copyright gives the creator control over copying, distribution, adaptation and performance for a fixed period.
      - It applies automatically to original work, including software, and protects expression rather than ideas.
      - Legislation is needed to protect creators' income, investment and to provide a legal remedy.
      - Software piracy includes softlifting, internet piracy, hard-disk loading, counterfeiting, renting and cracking.
      - Buying a copy gives you a licence, not the copyright itself.

questions:
  - id: copyright-definition
    format: mcq
    difficulty: 1
    objectives: ["7.1.3"]
    prompt: |-
      What does copyright give the creator of a program?
    options:
      - text: Legal control over copying, distributing and adapting the program for a fixed period
        correct: true
        why: |-
          Copyright is a bundle of exclusive rights, limited in time.
      - text: Permanent ownership of the idea behind the program
        why: |-
          Ideas are not protected by copyright, and protection is not permanent.
      - text: The right to stop anyone writing similar software
        why: |-
          Others may write their own program that does the same job; only the expression is protected.
      - text: A guarantee that the program cannot be hacked
        why: |-
          Copyright is a legal right, not a technical protection.
    explanation: |-
      Copyright controls copying, distribution, adaptation and performance for a limited time.

  - id: what-is-protected
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      Which of these is **not** protected by copyright?
    options:
      - text: The general idea of a program that sorts a list
        correct: true
        why: |-
          Copyright protects the expression of an idea, not the idea or method itself.
      - text: The source code of that program
        why: |-
          Source code is protected as a literary work.
      - text: A photograph used in its documentation
        why: |-
          Photographs are artistic works and are protected.
      - text: The music in a promotional video
        why: |-
          Music and sound recordings are protected.
    explanation: |-
      Ideas and methods are not protected; the code, text, images and music that express them are.

  - id: need-for-legislation
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      Why is copyright legislation needed for software?
    options:
      - text: Digital copies are cheap and perfect, so without legal protection developers could not earn from their work
        correct: true
        why: |-
          Copying costs almost nothing, so the law is what creates a market for the work.
      - text: To stop people writing their own similar programs
        why: |-
          Independent work is allowed; only copying the protected expression is prevented.
      - text: To make all software free to use
        why: |-
          Copyright protects the owner's rights; free software comes from the licence, not the law.
      - text: Because software is not covered by any other law
        why: |-
          Other laws also apply (contract, data protection); copyright is the one that protects the
          work itself.
    explanation: |-
      Because copying is nearly free and perfect, creators need legal control to earn from their work.

  - id: software-piracy-type
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      A company buys one licence for a program and installs it on thirty office computers. Which
      term describes this?
    options:
      - text: Softlifting
        correct: true
        why: |-
          Softlifting is installing fewer licences than installations, or sharing a licence beyond
          its terms.
      - text: Counterfeiting
        why: |-
          Counterfeiting means making fake copies packaged to look genuine.
      - text: Hard-disk loading
        why: |-
          That is a seller pre-installing unlicensed software on machines it sells.
      - text: Renting
        why: |-
          Renting is lending copies out for payment.
    explanation: |-
      Using one licence on more machines than it allows is softlifting.

  - id: licence-permission
    format: cloze
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      A copyright owner can give permission for specific uses through a {{1}}. Buying a copy of
      software does not transfer the {{2}} to the buyer.
    blanks:
      - accept: ["licence", "license"]
      - accept: ["copyright", "rights", "ownership"]
    explanation: |-
      A licence grants permission for defined uses; the copyright itself stays with the owner.

  - id: copyright-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      A student explains copyright to a classmate. Which line contains the first error?
    lines:
      - Copyright begins automatically when an original work is recorded, with no registration needed.
      - It protects the expression of an idea, such as the actual code of a program.
      - It lasts forever, so old programs can never be copied legally.
      - Infringement can lead to an injunction and to a claim for damages.
    errorLine: 3
    fix: |-
      Copyright lasts for a fixed period (typically the author's life plus 70 years). After it
      expires the work is in the public domain and may be used freely.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 wrongly says copyright never expires.
