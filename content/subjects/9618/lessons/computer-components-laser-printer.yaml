id: computer-components-laser-printer
subject: "9618"
topic: "3.1"
title: "Laser printers: printing with static electricity"
summary: How a laser printer uses a charged drum, a laser, toner and a fuser to print a page, as a step-by-step method for exam answers.
order: 3
minutes: 5
kind: core
objectives: ["3.1.3"]
prerequisites: [computer-components-io-memory-storage]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.3 (principal operations of hardware devices: the laser printer). Follows the standard
    textbook sequence with a positively charged drum and toner and a negatively charged paper.
    All questions are original; the scenarios are illustrative.
blocks:
  - type: objective
    body: |
      By the end you can describe, stage by stage, how a **laser printer** turns the data for a page into a printed sheet.

  - type: explain
    title: A static electricity machine
    body: |
      Rub a balloon on your jumper and it sticks to the wall. A laser printer is that trick, industrialised.

      **Toner** is a fine dry powder (plastic plus pigment), not ink. The whole printer is a game of **opposite charges attract** and **like charges repel**, finished off with heat.

  - type: explain
    title: What they ask
    body: |
      "**Describe** how a laser printer prints a page." Usually 4 to 6 marks.

      There's one mark per correct stage, so the marks come from **naming each stage in the right order** with the right key word: drum, charge, laser, toner, paper, fuser, discharge.

  - type: explain
    title: The method
    body: |
      1. The data for the **whole page** is sent to the printer and stored in its memory (buffer).
      2. The **printing drum** is given a positive static charge as it turns.
      3. A **laser beam**, steered by a rotating mirror, scans across the drum and **removes the charge** where the text and images will go. This leaves an electrostatic image of the page.
      4. The drum is coated with positively charged **toner**. It is repelled by the charged areas and sticks only to the discharged areas.
      5. **The paper is given a negative charge (opposite to the toner) and rolls over the drum, so the toner is pulled off the drum onto the paper.**
      6. The paper's charge is removed so it doesn't stick to the drum, then it passes through the **fuser**: heated rollers melt the toner and press it permanently onto the paper.
      7. A **discharge lamp** removes the remaining charge from the drum, ready for the next page.

      Step 5 is the one people skip. Without the charged paper there's no reason for the toner to leave the drum.

  - type: diagram
    diagram: cs-computer-components-laser-printer
    alt: >-
      A laser printer drawn around a large drum that turns clockwise. Six numbered stations sit
      around it. 1, top left: a charge roller gives the drum a positive charge, shown as plus signs
      on the drum's surface. 2, top right: a laser and mirror shine a beam onto the drum, removing
      the charge where the text and images go. 3, right: a toner box with positive toner, which
      sticks only to the discharged areas. 4, bottom: the paper, with a negative charge, moves from
      right to left under the drum and pulls the toner off. 5, bottom left: two fuser rollers use
      heat and pressure to melt the toner onto the paper before the page comes out. 6, left: a
      discharge lamp clears the drum for the next page.
    caption: |
      Follow the drum round clockwise: charge, laser, toner, paper, then the fuser and a clean drum.

  - type: example
    title: "Easy first: put the stages in order"
    problem: |
      A student's notes have the stages jumbled. Put them in order.

      - **A** The fuser melts the toner onto the paper.
      - **B** The laser removes charge from parts of the drum.
      - **C** The drum is given a positive charge.
      - **D** Toner sticks to the discharged parts of the drum.
      - **E** Negatively charged paper pulls the toner off the drum.
    steps:
      - |
        The drum must be charged before the laser can remove any charge: **C** comes first, then **B**.
      - |
        Toner can only find the image once the laser has drawn it: **D**.
      - |
        Toner moves from drum to paper: **E**.
      - |
        Heat fixes it last, otherwise the loose powder would smudge: **A**.
      - |
        Check against the method: charge, laser, toner, paper, fuser. ✓
    answer: |
      C, B, D, E, A

  - type: check
    title: Your turn
    questions: [laser-job, after-laser, fuser-name]

  - type: example
    title: Exam-style
    problem: |
      A café prints its daily menu on a laser printer. Describe how the printer produces the printed menu from the data it receives. [5]
    steps:
      - |
        "The data for the whole menu page is stored in the printer's memory." (sets up the page)
      - |
        "The drum is given a positive charge, then a laser beam removes the charge from the areas where the text and images will be." (charge + laser)
      - |
        "Positively charged toner is attracted only to the discharged areas of the drum." (toner)
      - |
        "The paper is given a negative charge so the toner is transferred from the drum to the paper." (paper)
      - |
        "The fuser heats the paper so the toner melts and is fixed to it; a discharge lamp then removes the charge from the drum." (fuser + discharge)
    answer: |
      Five stages, five marks, in drum order. Each sentence names its key part.

  - type: check
    title: Exam check
    questions: [spot-paper-charge, whole-page]

  - type: misconceptions
    items:
      - wrong: The laser burns the image onto the paper.
        right: |
          The laser never touches the paper. It only changes the **charge on the drum**.
      - wrong: The fuser is where the image is formed.
        right: |
          The image is formed on the **drum**. The fuser just melts toner that is already on the paper.
      - wrong: A laser printer sprays ink.
        right: |
          That's an inkjet. A laser printer uses **dry toner powder** moved by static charge.

  - type: exam
    body: |
      - Keep the **order**: charge drum, laser, toner, charged paper, fuser, discharge.
      - Say **what each part does**, not just its name. "The fuser" scores nothing; "the fuser melts the toner onto the paper" does.
      - Use "charge" every time it matters. Most lost marks are vague lines like "the toner goes onto the paper".

  - type: takeaways
    items:
      - The drum is charged, and a laser removes charge where the page's image goes.
      - Charged toner sticks only to the image areas of the drum.
      - Oppositely charged paper pulls the toner off; the fuser melts it on with heat and pressure.
      - A discharge lamp clears the drum so the next page can start.

  - type: deeper
    title: Why the signs don't matter much
    body: |
      Many real printers do it the other way round: a **negatively** charged drum and negatively charged toner.

      The physics is the same either way: charge the drum, let the laser change the charge where the image goes, attract toner to just those areas, pull it onto oppositely charged paper, then melt it on. Learn one consistent version and stick to it in an answer.

questions:
  - id: laser-job
    format: mcq
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      What does the laser do inside a laser printer?
    options:
      - text: It removes charge from parts of the drum, forming an electrostatic image of the page.
        correct: true
        why: |
          The laser "draws" the page in charge, not in ink.
      - text: It burns the image onto the paper.
        why: |
          The laser never reaches the paper; it only works on the drum.
      - text: It melts the toner onto the paper.
        why: |
          That's the fuser's job, using heated rollers.
      - text: It heats ink so it can be sprayed onto the paper.
        why: |
          That's mixing up laser and inkjet printers.
    explanation: |
      The laser beam, steered by a mirror, removes charge where the text and images go, so toner sticks only there.

  - id: after-laser
    format: mcq
    difficulty: 2
    objectives: ["3.1.3"]
    prompt: |
      Which stage comes **straight after** the laser has scanned the drum?
    options:
      - text: Toner is applied and sticks only to the discharged areas of the drum.
        correct: true
        why: |
          The laser has just made the image; the toner now finds it.
      - text: The drum is given a positive charge.
        why: |
          That has to happen **before** the laser, or there would be no charge to remove.
      - text: The fuser melts the toner onto the paper.
        why: |
          There's no toner on the paper yet; fusing comes near the end.
      - text: A discharge lamp clears the drum.
        why: |
          That's the last stage, after the toner has gone to the paper.
    explanation: |
      Order: charge the drum, laser, **toner**, charged paper, fuser, discharge.

  - id: fuser-name
    format: text
    style: one-line
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      Which part of a laser printer uses heat and pressure to fix the toner permanently onto the paper?
    accept: ["fuser", "the fuser", "fuser unit", "fusing unit", "fuser rollers", "heated rollers", "fuser assembly"]
    model: |
      The **fuser** (a pair of heated rollers).
    explanation: |
      Toner is a dry plastic powder. The fuser melts it so it bonds to the paper and won't smudge.

  - id: spot-paper-charge
    format: spot-error
    difficulty: 2
    objectives: ["3.1.3"]
    prompt: |
      A student describes how a laser printer works. Which line contains the error?
    lines:
      - The drum is given a positive charge.
      - A laser removes the charge where the text and images will go.
      - Positively charged toner sticks to the discharged areas of the drum.
      - The paper is given a positive charge, the same as the toner, so the toner moves onto it.
      - The fuser melts the toner onto the paper.
    errorLine: 4
    fix: |
      The paper is given a **negative** charge, opposite to the toner, so the toner is **attracted** off the drum onto the paper.
    explanation: |
      Like charges repel. Paper with the same charge as the toner would push the toner away, and the page would come out blank.

  - id: whole-page
    format: mcq
    difficulty: 3
    objectives: ["3.1.3"]
    prompt: |
      Why does a laser printer store the data for a **whole page** before it starts printing that page?
    options:
      - text: The drum images the page in one continuous pass while the paper moves through, so printing can't pause halfway for more data.
        correct: true
        why: |
          Once the sheet is moving past the drum, the page has to be finished in one go.
      - text: The laser needs the data to be stored as toner first.
        why: |
          Data is stored as binary in memory; toner is only used to print it.
      - text: The printer's memory is non-volatile, so it keeps the page if the power fails.
        why: |
          Printer memory is RAM, which is volatile.
      - text: So that it can print the page in colour.
        why: |
          Colour has nothing to do with it; black-and-white laser printers work a page at a time too.
    explanation: |
      Laser printers are "page printers": the page is built in memory first, then printed in one smooth pass of drum and paper.
