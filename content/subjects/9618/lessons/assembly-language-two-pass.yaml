id: assembly-language-two-pass
subject: "9618"
topic: "4.2"
title: "The two-pass assembler: finding everything before building anything"
summary: Follow a program through pass 1 (build a symbol table) and pass 2 (generate object code), and see why a forward jump forces the assembler to read the code twice.
order: 2
minutes: 8
kind: core
objectives: ["4.2.2"]
prerequisites: [assembly-language-machine-code]
