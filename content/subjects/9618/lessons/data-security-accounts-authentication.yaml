id: data-security-accounts-authentication
subject: "9618"
topic: "6.1"
title: "User accounts, passwords and proving who you are"
summary: How accounts create accountability, what makes a password strong, and how digital signatures and biometrics prove identity.
order: 3
minutes: 9
kind: core
objectives: ["6.1.3"]
prerequisites: [data-security-system-and-data]
