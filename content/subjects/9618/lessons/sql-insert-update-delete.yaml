id: sql-insert-update-delete
subject: "9618"
topic: "8.3"
title: "Changing the data: INSERT, UPDATE and DELETE"
summary: Three DML statements keep a table current. They look harmless — and one missing WHERE clause can rewrite every row in the table.
order: 6
minutes: 9
kind: core
objectives: ["8.3.5"]
prerequisites: [sql-select-where-order-group, sql-create-table]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus
    (2027-2029, Version 2, December 2025), topic 8.3, learning outcome 8.3.5 (data maintenance with
    INSERT INTO, UPDATE and DELETE FROM). All questions are original; the sample table is invented.
    Second-pass review by the same agent on 2026-10-29 (no separate reviewer model was available):
