  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus,
    topic 8.1 Database Concepts, learning outcome 8.1.5 (First, Second and Third Normal Form).
    This lesson covers the reasons for normalisation and 1NF to 2NF; 3NF and full design follow
