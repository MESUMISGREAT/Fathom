id: database-concepts-normalisation-1nf-2nf
subject: "9618"
topic: "8.1"
title: Normalisation, 1NF and 2NF
summary: Remove repeating groups and partial dependencies step by step, and see the update anomalies they cause.
order: 5
minutes: 6
kind: core
objectives: ["8.1.5"]
prerequisites: [database-concepts-tables-keys-terminology]
