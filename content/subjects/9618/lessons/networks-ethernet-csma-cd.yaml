id: networks-ethernet-csma-cd
subject: "9618"
topic: "2.1"
title: "Ethernet and CSMA/CD"
summary: What Ethernet is, why devices sharing a cable collide, and how CSMA/CD detects collisions and stops them happening again.
order: 9
minutes: 5
kind: core
objectives: ["2.1.10"]
prerequisites: [networks-bus-star, networks-lan-hardware]
