blocks:
  - type: objective
    body: |
      By the end you can describe how **capacitive** and **resistive** touchscreens detect the position of a touch, and pick the right one for a situation.

  - type: explain
    title: Why won't my phone work with gloves on?
    body: |
      Try swiping your phone with a woolly glove. Nothing.

      Now try a supermarket's old self-checkout with the same glove. It works.

      Two different technologies, two different physical tricks. Once you know them, the glove mystery solves itself.

  - type: explain
    title: Two kinds
    body: |
      - **Resistive**: detects **pressure**. Pressing pushes two layers together.
      - **Capacitive**: detects a **conductor** (your finger) changing an electric field. No pressure needed.

      Both are input devices laid over a display, so the whole touchscreen is **input and output**.

  - type: explain
    title: What they ask
    body: |
      "**Describe** how a capacitive (or resistive) touchscreen detects the position of the user's touch." Usually 3 to 4 marks.

      Often with a follow-up: "Give a reason why this type is suitable for [situation]."

  - type: explain
    title: The method (capacitive)
    body: |
      1. A glass screen covers a **transparent conductive layer** (a grid of electrodes).
      2. A small voltage is applied, creating a uniform **electrostatic field** across the screen.
      3. A bare finger is a **conductor**, so touching the screen draws a tiny amount of charge and **changes the capacitance** at that point.
      4. **Sensors in the controller measure where the capacitance has changed and calculate the x and y coordinates of the touch.**
      5. The coordinates are sent to the processor, which works out what was touched.

      Step 4 is the forgotten one. Saying "the screen detects the finger" doesn't explain how a **position** comes out.

  - type: explain
    title: The resistive version
    body: |
      1. A flexible top layer and a rigid bottom layer (often glass), each with a **conductive (resistive) coating**, are held apart by an **air gap** and tiny spacer dots.
      2. Pressing the screen pushes the top layer down until it **touches the bottom layer**, completing a circuit at that point.
      3. The **voltage** measured across the layers depends on where they touch, so the controller calculates the x and y position.

  - type: diagram
    diagram: cs-computer-components-touchscreens
    alt: >-
      Two cross-sections side by side. Left, resistive: a finger presses a flexible top layer down
      across an air gap held open by spacer dots, so its conductive coating touches the conductive
      coating on the glass layer below, marked by a dot. Text says press: the two layers touch,
      completing a circuit; voltages give the x and y position. A note says it works with gloves
      or any stylus. Right, capacitive: a finger rests on a glass layer above a transparent
      conductor with an electrode grid; dashed field lines run from the finger into the layer.
      Text says touch: finger draws a tiny charge, capacitance changes at that point; controller
      calculates x and y. A note says it needs a bare finger or special stylus.
    caption: |
      Resistive feels for pressure; capacitive senses a conductor. That's the glove mystery solved.

  - type: example
    title: "Easy first: the glove mystery"
    problem: |
      Explain why a phone's capacitive screen ignores a finger in a thick woolly glove, but a resistive screen responds to it.
    steps:
      - |
        A capacitive screen needs a **conductor** to draw charge and change the capacitance.
      - |
        Wool is an **insulator**, so the glove blocks that. No change in capacitance, no touch detected.
      - |
        A resistive screen only needs **pressure** to push its two layers together. A gloved finger pushes just as well.
    answer: |
      Capacitive senses conductors; resistive senses pressure. (Touchscreen gloves have conductive thread in the fingertips.)

  - type: check
    title: Your turn
    questions: [capacitive-detects, warehouse-gloves, resistive-cloze]

  - type: explain
    title: Choosing one
    body: |
      | | Capacitive | Resistive |
      | --- | --- | --- |
      | Detects | a conductor (bare finger, special stylus) | pressure from anything |
      | Multi-touch (pinch, zoom) | yes (projected capacitive) | usually single touch |
      | Image | bright and clear (glass) | less clear, can glare in sunlight |
      | Durability | hard glass surface | soft top layer can be scratched or worn |
      | Cost | higher | lower |

  - type: example
    title: Exam-style
    problem: |
      A tablet has a capacitive touchscreen. Describe how it detects the position where the user touches the screen. [4]
    steps:
      - |
        "The screen has a transparent conductive layer under the glass, with a small voltage creating an electrostatic field."
      - |
        "The user's finger is a conductor, so touching the screen draws a small charge."
      - |
        "This changes the capacitance at the point of contact."
      - |
        "Sensors measure the change and the controller calculates the x and y coordinates of the touch, which are sent to the processor."
    answer: |
      Field, conductor, capacitance change, coordinates calculated. Four marks.

  - type: check
    title: Exam check
    questions: [pinch-zoom, spot-pressure-capacitive]

  - type: misconceptions
    items:
      - wrong: A capacitive screen works by detecting how hard you press.
        right: |
          That's resistive. Capacitive detects the **change in capacitance** caused by a conductive finger; a light touch is enough.
      - wrong: Any stylus works on any touchscreen.
        right: |
          A plastic stylus works on resistive screens. Capacitive screens need a **conductive** stylus.
      - wrong: A touchscreen is only an input device.
        right: |
          The touch layer is input, but it sits on a display, so the touchscreen is **input and output**.

  - type: exam
    body: |
      - Capacitive key words: **conductive layer**, **electrostatic field**, **finger is a conductor**, **change in capacitance**, **coordinates calculated**.
      - Resistive key words: **two layers**, **pressed together**, **circuit completed**, **voltage gives the position**.
      - Suitability answers must match the context: gloves, any stylus, wet hands, low cost → resistive; multi-touch, clear image, durable glass → capacitive.

  - type: takeaways
    items:
      - "Capacitive: a conductive finger changes the capacitance at a point; the controller calculates x and y."
      - "Resistive: pressure pushes two conductive layers together, completing a circuit; voltages give x and y."
      - Capacitive needs a conductor but supports multi-touch; resistive works with gloves and any stylus.

  - type: deeper
    title: Infra-red touchscreens
    body: |
      Some large screens use a grid of **infra-red beams**: LEDs along two edges, sensors along the opposite edges.

      A finger (or anything) **breaks** some beams, and the blocked horizontal and vertical beams give the x and y position. Works with gloves, but dirt on the edges can cause false touches.

questions:
  - id: capacitive-detects
    format: mcq
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      What does a capacitive touchscreen detect when it is touched?
    options:
      - text: A change in capacitance caused by a conductive finger drawing a small charge
        correct: true
        why: |
          The finger disturbs the electrostatic field at that point.
      - text: Two flexible layers being pressed together
        why: |
          That's a resistive touchscreen.
      - text: The heat from the user's finger
        why: |
          Temperature isn't measured; a warm plastic stylus wouldn't work, and a gloved finger is warm too.
      - text: The weight of the user's hand
        why: |
          Capacitive screens respond to a light touch; weight doesn't matter.
    explanation: |
      Capacitive = conductor changes the capacitance. Resistive = pressure closes a circuit.

  - id: warehouse-gloves
    format: mcq
    difficulty: 2
    objectives: ["3.1.3"]
    prompt: |
      Warehouse staff wear thick work gloves all day and use handheld stock scanners with touchscreens. Which type of touchscreen suits the scanners best, and why?
    options:
      - text: Resistive, because it responds to pressure from any object, including a gloved finger.
        correct: true
        why: |
          Pressure pushes the layers together whether or not the finger is a conductor.
      - text: Capacitive, because it supports multi-touch gestures.
        why: |
          True of capacitive screens, but thick gloves are insulators, so the screen wouldn't respond.
      - text: Capacitive, because gloves conduct electricity well.
        why: |
          Ordinary work gloves are insulators.
      - text: Resistive, because it gives the clearest image in bright light.
        why: |
          Resistive screens usually have a less clear image; that's not the reason to choose one.
    explanation: |
      Match the reason to the situation. Gloves → the screen must respond to pressure, not conductivity.

  - id: resistive-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      In a resistive touchscreen, pressing the screen pushes the flexible top layer down until it {{1}} the bottom layer, completing a {{2}} at that point.
    blanks:
      - accept: ["touches", "contacts", "meets", "makes contact with", "presses against"]
      - accept: ["circuit", "electrical circuit", "electric circuit"]
    explanation: |
      The two conductive coatings touch, and the voltages measured across them give the position of the touch.

  - id: pinch-zoom
    format: mcq
    difficulty: 2
    objectives: ["3.1.3"]
    prompt: |
      A map app needs users to pinch with two fingers to zoom. Which touchscreen technology is the best choice?
    options:
      - text: Projected capacitive, because it can detect several touch points at the same time
        correct: true
        why: |
          Its electrode grid can sense changes at many points at once.
      - text: Resistive, because it can be used with a plastic stylus
        why: |
          A stylus doesn't help pinching, and resistive screens usually detect one touch.
      - text: Resistive, because pressing harder zooms further
        why: |
          Zooming depends on finger movement, not pressure.
      - text: Any type, because all touchscreens detect multiple touches equally well
        why: |
          Most resistive screens only register a single point of contact.
    explanation: |
      Multi-touch gestures need a screen that senses several positions at once: projected capacitive.

  - id: spot-pressure-capacitive
    format: spot-error
    difficulty: 2
    objectives: ["3.1.3"]
    prompt: |
      A student describes how a capacitive touchscreen works. Which line contains the error?
    lines:
      - Under the glass there is a transparent conductive layer.
      - A small voltage creates an electrostatic field across the screen.
      - The pressure of the finger squeezes two conductive layers together.
      - The change at the point of touch is measured by sensors.
      - The controller calculates the x and y coordinates of the touch.
    errorLine: 3
    fix: |
      The finger is a **conductor** that draws a small charge, **changing the capacitance** at that point. No pressure is needed.
    explanation: |
      Line 3 describes a resistive screen. A capacitive screen responds to the finger's conductivity, even with the lightest touch.
