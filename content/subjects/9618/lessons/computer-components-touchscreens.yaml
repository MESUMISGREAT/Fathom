  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.3 (principal operations of hardware devices: touchscreen). Covers resistive and
    capacitive screens, with infra-red screens as extra detail. All questions are original;
