id: computer-components-touchscreens
subject: "9618"
topic: "3.1"
title: "Touchscreens: resistive and capacitive"
summary: How resistive and capacitive touchscreens detect where they are touched, and how to choose between them.
order: 9
minutes: 5
kind: core
objectives: ["3.1.3"]
prerequisites: [computer-components-io-memory-storage]
