id: data-security-network-threats
subject: "9618"
topic: "6.1"
title: "Malware, hackers, phishing and pharming: threats from the network"
summary: How viruses and spyware differ, what hackers actually do, and the difference between being tricked by a message and being redirected by a poisoned server.
order: 5
minutes: 9
kind: core
objectives: ["6.1.4"]
prerequisites: [data-security-system-measures]
