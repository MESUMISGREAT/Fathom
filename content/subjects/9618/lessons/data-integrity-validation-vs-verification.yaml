id: data-integrity-validation-vs-verification
subject: "9618"
topic: "6.2"
title: "Validation and verification: two different guards"
summary: Validation stops data that is not acceptable; verification checks the data really is what was intended.
order: 1
minutes: 8
kind: core
objectives: ["6.2.1"]
prerequisites: [data-security-privacy-integrity]
