id: ethics-ownership-artificial-intelligence
subject: "9618"
topic: "7.1"
title: "Artificial intelligence: programs that learn"
summary: AI is software that does tasks we normally associate with human intelligence. Instead of following rules written by a programmer, a machine-learning system works out its own rules from examples.
order: 7
minutes: 9
kind: core
objectives: ["7.1.5"]
prerequisites: [ethics-ownership-ethics-in-computing]
