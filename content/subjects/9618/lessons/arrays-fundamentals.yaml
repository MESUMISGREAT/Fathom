id: arrays-fundamentals
subject: "9618"
topic: "10.2"
title: "Arrays — terminology, 1D/2D arrays, pseudocode, and processing"
summary: "Understand array terminology (index, bounds), choose between 1D and 2D arrays, write pseudocode for array declaration and manipulation, and implement bubble sort and linear search."
order: 1
minutes: 10
kind: core
objectives: ["10.2.1", "10.2.2", "10.2.3", "10.2.4"]
prerequisites: ["data-types-records", "programming-constructs"]
