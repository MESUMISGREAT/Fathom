id: data-security-system-and-data
subject: "9618"
topic: "6.1"
title: "Two locks: securing the system and securing the data"
summary: Why protecting the computer and protecting the data are different jobs, and why you need both.
order: 2
minutes: 8
kind: core
objectives: ["6.1.2"]
prerequisites: [data-security-privacy-integrity]
