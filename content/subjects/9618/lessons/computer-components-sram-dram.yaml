id: computer-components-sram-dram
subject: "9618"
topic: "3.1"
title: "SRAM and DRAM: two ways to build RAM"
summary: How static RAM and dynamic RAM store bits, why DRAM must be refreshed, and why cache uses SRAM while main memory uses DRAM.
order: 13
minutes: 5
kind: core
objectives: ["3.1.6"]
prerequisites: [computer-components-ram-rom]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.6 (differences between SRAM and DRAM, including their use in a range of devices and
    systems and the reasons for choosing one or the other). The 64 ms refresh period is a typical
