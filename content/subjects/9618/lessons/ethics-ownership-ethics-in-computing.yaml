id: ethics-ownership-ethics-in-computing
subject: "9618"
topic: "7.1"
title: "Ethics for computing professionals"
summary: Code that works can still be wrong. Ethics is the set of principles a computing professional uses to decide what they should build, how they should build it, and what they should refuse to do.
order: 1
minutes: 8
kind: core
objectives: ["7.1.1", "7.1.2"]
prerequisites: []
