blocks:
  - type: objective
    body: |-
      By the end you can explain why a computing professional needs **ethics**, what ethics is
      for, and the impact on people and organisations when a computing professional acts
      ethically or unethically in a given situation.

  - type: explain
    title: Working correctly is not the same as working rightly
    body: |-
      A program can do exactly what it was asked and still cause harm. Consider a system that
      works perfectly but:

      - collects the location of every user every minute, without telling them;
      - decides who gets a job interview using data that quietly favours one group of applicants;
      - shuts down a hospital's booking system for maintenance at 9 a.m.

      Nothing here is a bug. Nobody wrote the wrong line of code. The problem is that the people
      who built the system did not ask **whether they should**.

      That question — what is right and wrong in the work we do — is what **ethics** is about.

  - type: definition
    term: Ethics
    body: |-
      Principles that guide behaviour by distinguishing right from wrong. **Professional ethics**
      are the standards expected of people working in a particular profession, over and above
      what the law requires.

      Ethics is not the same as law. The law is a minimum enforced by courts; ethics asks what a
      responsible professional *ought* to do even when no law forbids the alternative.

  - type: explain
    title: Why computing needs ethics of its own
    body: |-
      Computing is unusual in how far one decision travels, and in how little the public can see
      of it. That combination is why the profession needs explicit ethical standards.

      1. **Scale.** One line of code can run on a hundred million phones. A small decision has
         enormous reach, so the consequences of getting it wrong are not small either.
      2. **Invisible consequences.** A user cannot look inside a machine-learning model or an
         algorithm that sorts their loan application. They depend on the developer to be honest.
      3. **Asymmetry of knowledge.** The developer understands the system; the user usually does
         not. With that advantage comes a duty of care.
      4. **Safety-critical use.** Software controls aircraft, medical devices, cars and power
         grids. A defect can kill, not merely annoy.
      5. **Personal data.** Systems hold information about health, money, location and
         relationships. Mishandling it can damage someone for years.
      6. **The law lags behind.** New technology arrives faster than legislation. Between the two,
         professionals need their own standards to fall back on.

  - type: intuition
    title: The trust argument in one picture
    body: |-
      Think about a pharmacist. You cannot check that the pills in the box are what the label
      says, so you trust the pharmacist and the rules of the profession.

      Software is the same, only more so: you cannot check what an app does with your data, or
      whether the algorithm that rejected your loan was fair. If users stopped trusting software
      in general, the whole industry would suffer — which is why ethical behaviour protects the
      profession as well as the public.

  - type: explain
    title: Where the standards come from
    body: |-
      Professional bodies publish **codes of conduct** that members agree to follow. The British
      Computer Society (BCS, the Chartered Institute for IT) is the usual example for this
      syllabus; the IEEE and ACM publish similar codes.

      Codes differ in wording but share the same four themes:

      | Duty | What it means in practice |
      |---|---|
      | to the public | put safety, privacy and the public interest first |
      | to competence | only take on work you are qualified to do; keep your skills current |
      | to integrity | be honest about what a system can and cannot do; do not mislead |
      | to the profession | do not bring the profession into disrepute; respect confidentiality |

      A code cannot decide every case for you, but it gives a shared standard to reason from — and
      a basis for disciplinary action if a member ignores it.

  - type: explain
    title: What acting ethically looks like
    body: |-
      In day-to-day work, ethical behaviour usually means doing something **inconvenient**:

      - telling a client that the system is not ready, rather than shipping it on time;
      - refusing to add a feature that would secretly collect data;
      - writing down known limitations so users are not misled;
      - testing on a range of users, not only people like the development team;
      - reporting a serious defect even when it is embarrassing;
      - crediting other people's code and respecting its licence.

      Unethical behaviour is often the same list, reversed: hiding a defect, exaggerating
      accuracy, taking a shortcut with someone's data, or copying code and pretending it is yours.

  - type: explain
    title: The impact of the choice
    body: |-
      Ethical and unethical decisions have consequences well beyond the individual developer.

      | Whose interests | If the professional acts ethically | If they act unethically |
      |---|---|---|
      | users and the public | kept safe, informed and fairly treated | harmed, misled, discriminated against |
      | the organisation | trust, good reputation, fewer legal problems | fines, lawsuits, recall costs, lost customers |
      | the professional | respect, career progression | dismissal, prosecution, loss of membership of a professional body |
      | the profession | public confidence in IT | suspicion of all software and IT staff |

      Some of these impacts are immediate (a crash, a data leak), some appear later (a bias
      discovered years after a system was deployed), and some cannot be undone at all (a life lost
      because a safety check was skipped).

  - type: example
    title: "Worked example: the recruitment algorithm"
    problem: |-
      A company asks a software team to build a system that ranks job applicants automatically.
      The team is told to train it on the company's own hiring records from the last ten years.

      Identify the ethical issues and say what the team should do.
    steps:
      - |-
        **Identify who is affected.** Applicants (whose careers depend on the ranking), the company
        (legal and reputational risk), and the team itself (professional responsibility).
      - |-
        **Find the ethical problem in the request.** Ten years of past hiring may contain past
        bias — for example, if one group was rarely hired before, the model learns to keep it that
        way. The system would then automate unfairness while looking neutral and objective.
      - |-
        **Notice the other issues.** Applicants are not told how they are judged; the model may be
        hard to explain; personal data is being reused for a new purpose without consent.
      - |-
        **Decide what a responsible professional does.** Raise the concern in writing before
        building, ask for the training data to be checked for bias, insist on testing outcomes
        across groups, and require that a human makes the final decision.
      - |-
        **Consider refusing.** If the company insists on an untested system with no human review,
        the professional may have to decline the work — the code of conduct puts public interest
        above the employer's wishes.
    answer: |-
      The main issue is that the model would learn and repeat past discrimination, invisibly. The
      team should raise it, test for bias, keep a human in the decision, and be prepared to refuse
      if those safeguards are rejected.

  - type: check
    title: Quick check
    questions: [ethics-definition, why-ethics-needed, code-of-conduct]
  - type: check
    title: Practice
    questions: [ethically-vs-legally, impact-on-organisation, ethics-spot-error]

  - type: misconceptions
    items:
      - wrong: If the software works, there is no ethical question.
        right: |-
          Working software can still invade privacy, discriminate or cause harm. Ethics asks
          whether the system *should* exist and be used, not only whether it runs.
      - wrong: Ethics and the law are the same thing.
        right: |-
          The law is a minimum that courts enforce; ethics asks what a responsible professional
          ought to do, including where the law is silent or out of date.
      - wrong: Ethical decisions are only the manager's responsibility.
        right: |-
          Every professional is accountable for their own part. "I was told to" is not a defence
          in a code of conduct.
      - wrong: A code of conduct is a legal document that can send you to prison.
        right: |-
          It is a professional standard. Breaking it can cost you your job or your membership of
          the professional body; criminal penalties come from the law, not the code.
      - wrong: Unethical behaviour only harms the person whose data is misused.
        right: |-
          It also harms the employer (fines, reputation), the profession (lost trust) and the
          professional (career, prosecution).

  - type: exam
    body: |-
      - "State the need for ethics" wants **reasons**, each with a consequence: for example
        "software affects large numbers of people, so a poor decision can harm many users at once".
      - For an "impact" question, name the group affected and say what happens to them — users,
        the organisation, the professional, the wider profession.
      - Use a scenario's own facts. "This system would decide who gets a mortgage, so a biased
        model would deny loans unfairly" scores; a general sentence about honesty does not.
      - Do not confuse ethics with legality, and do not claim a code of conduct is law.
      - If asked what a professional should do, give a concrete action (report it, refuse, test,
        seek advice), not just "be ethical".

  - type: takeaways
    items:
      - Ethics is about right and wrong behaviour; professional ethics sets standards above the legal minimum.
      - Computing needs ethics because of its scale, hidden workings, knowledge gap, safety-critical use and personal data.
      - Codes of conduct (for example the BCS code) cover duty to the public, competence, integrity and the profession.
      - Acting ethically protects users, the organisation, the professional and the reputation of the profession.
      - Acting unethically brings harm, legal and financial penalties, and damage to trust.

questions:
  - id: ethics-definition
    format: mcq
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |-
      What does **ethics** mean in a computing profession?
    options:
      - text: Principles that guide what is right and wrong in the work a professional does
        correct: true
        why: |-
          Ethics is about judging right from wrong, and professional ethics applies that to the
          standards of a profession.
      - text: The set of laws that punish dishonest companies
        why: |-
          Laws are separate: ethics goes beyond what the law requires.
      - text: The rules for writing correct, error-free code
        why: |-
          That is software quality, not ethics. Code can be correct and still cause harm.
      - text: The profit a company is allowed to make from software
        why: |-
          Profit is a business matter, not a definition of ethics.
    explanation: |-
      Ethics is the principles used to decide right from wrong; professional ethics adds the
      standards expected of the profession.

  - id: why-ethics-needed
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |-
      Why does computing need its own ethical standards, more than many other industries?
    options:
      - text: Software can affect very large numbers of people while its workings are hidden from them
        correct: true
        why: |-
          Scale and invisibility together mean users cannot judge for themselves whether a system
          is fair or safe, so they must rely on the developer.
      - text: Because programmers are not covered by any law
        why: |-
          Programmers are covered by law (data protection, copyright, consumer law); ethics adds
          standards beyond it.
      - text: Because computers make mistakes that people never make
        why: |-
          The mistakes come from human decisions in design, data and testing.
      - text: Because software is always safety-critical
        why: |-
          Much software is not safety-critical, though much of it handles personal data.
    explanation: |-
      The reach of one piece of software, combined with how little users can see of it, is why
      professional standards matter.

  - id: code-of-conduct
    format: cloze
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |-
      A professional body publishes a code of {{1}} that members agree to follow, covering duties
      to the public, to {{2}} and to the profession.
    blanks:
      - accept: ["conduct", "ethics", "practice"]
      - accept: ["competence", "integrity", "employers", "clients"]
    explanation: |-
      Codes of conduct set out the standards members agree to, including duty to the public,
      competence and integrity.

  - id: ethically-vs-legally
    format: mcq
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A company legally collects data that users agreed to in a long terms-and-conditions document
      nobody reads, then sells it. Which statement is correct?
    options:
      - text: The action may be legal but is ethically questionable, because users did not truly understand what they agreed to
        correct: true
        why: |-
          Consent that is not genuinely informed is a classic example of behaviour that can be
          legal yet ethically poor.
      - text: The action is ethical because the law allows it
        why: |-
          Legality is a minimum; ethics asks whether the behaviour is fair and honest.
      - text: The action is neither legal nor ethical
        why: |-
          The question says the collection was legal.
      - text: There is no ethical issue because the data was sold, not lost
        why: |-
          Selling personal data without meaningful consent is exactly the ethical issue.
    explanation: |-
      Legal permission is not the same as informed, fair treatment of users.

  - id: impact-on-organisation
    format: mcq
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A developer hides a known security flaw so that a product launch is not delayed. What is a
      likely impact on the organisation?
    options:
      - text: A data breach, followed by fines, compensation and lasting damage to its reputation
        correct: true
        why: |-
          Known flaws that are concealed tend to be exploited, and the organisation carries the
          legal and reputational cost.
      - text: No impact, because the flaw was undocumented
        why: |-
          Undocumented flaws are still exploited; hiding them makes discovery worse.
      - text: Only the developer is affected
        why: |-
          Users are harmed and the employer carries legal and financial responsibility.
      - text: The product becomes more secure over time on its own
        why: |-
          Security flaws do not repair themselves.
    explanation: |-
      Concealing a known flaw exposes users and the organisation to breach, fines and lost trust.

  - id: ethics-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |-
      A student explains why a computing professional should act ethically. Which line contains the
      first error?
    lines:
      - Software can affect millions of users, so one poor decision can cause widespread harm.
      - Users often cannot see how a system works, so they rely on the developer's honesty.
      - Acting ethically is required only when a law specifically forbids the alternative.
      - Ethical behaviour also protects the reputation of the organisation and the profession.
    errorLine: 3
    fix: |-
      Ethics goes **beyond** the law. Being legal is the minimum; a professional is also expected to
      act fairly and honestly where no law applies.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 wrongly limits ethics to cases where a law exists.
