title: Program Design — structure charts, state-transition diagrams
summary: Use structure charts to decompose problems into modules with parameter passing, and understand state-transition diagrams for documenting algorithm behaviour.
order: 2
minutes: 7
kind: core
objectives: ["12.2.1", "12.2.2"]
prerequisites: ["software-dev-life-cycles"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
