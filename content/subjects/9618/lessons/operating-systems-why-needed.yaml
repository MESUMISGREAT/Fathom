id: operating-systems-why-needed
subject: "9618"
topic: "5.1"
title: "Why a computer needs an operating system"
summary: The OS is the manager between you and the hardware — it starts programs, shares out memory and stops every application fighting over the same keyboard.
order: 1
minutes: 5
kind: core
objectives: ["5.1.1"]
prerequisites: []
