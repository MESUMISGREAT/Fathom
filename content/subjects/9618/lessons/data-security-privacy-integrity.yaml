id: data-security-privacy-integrity
subject: "9618"
topic: "6.1"
title: "Security, privacy and integrity: three promises, three failures"
summary: Tell security, privacy and integrity apart, and say exactly which one a given data disaster has broken.
order: 1
minutes: 8
kind: core
objectives: ["6.1.1"]
prerequisites: [networks-why-network]
