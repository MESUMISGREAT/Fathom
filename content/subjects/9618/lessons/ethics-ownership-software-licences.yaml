blocks:
  - type: objective
    body: |-
      By the end you can name the main types of software licence, say what each one allows, and
      **justify** which licence suits a given situation using cost, number of users, access to
      source code and the need to modify or redistribute.

  - type: explain
    title: A licence is permission, not ownership
    body: |-
      When you pay for software you normally buy a **licence to use it**, not the software itself.
      The copyright owner keeps the rights; the licence sets out what you may do.

      Two shops can sell the same program on completely different terms: one allows installation on
      a single laptop, the other on every machine in a company. The difference is the licence.

      Reading the licence answers four practical questions:

      1. **How many machines or users?** One, a fixed number, or unlimited within one organisation?
      2. **Can I see the source code?** Is it closed (compiled only) or open?
      3. **Can I change it and share my changes?** And under what conditions?
      4. **Can I pass it on?** Sell it, give it away, or use it in a product I sell?

  - type: definition
    term: Software licence
    body: |-
      A legal agreement that states what a user may and may not do with a piece of software — for
      example how many devices it may be installed on, whether the source code may be modified, and
      whether copies may be redistributed.

  - type: explain
    title: Proprietary (commercial) licences
    body: |-
      **Proprietary** software is sold by a company that keeps the source code private. The licence
      is priced by how the software will be used.

      | Licence type | What it allows | Typical use |
      |---|---|---|
      | single-user | one user, often one device | a student buying an office suite |
      | per-seat / multi-user | a fixed number of named users or devices | a small office with 12 staff |
      | site licence | unlimited installations on machines at one site or in one organisation | a school with 500 computers |
      | volume licence | a discounted bulk agreement for many machines, often with a management console | a company rolling out software to 2,000 laptops |
      | subscription | use for as long as payments continue; software may stop working if they stop | monthly accounting software in the cloud |

      The advantages are support, updates and training from the vendor. The disadvantages are cost,
      no access to the source code, and the inability to adapt the software to your own needs.

  - type: explain
    title: Open-source licences
    body: |-
      **Open-source** software is supplied with its source code, and the licence allows you to use,
      study, modify and redistribute it — on conditions. The conditions are what distinguish the
      licences from each other.

      | Licence family | Key condition | Consequence |
      |---|---|---|
      | permissive (MIT, BSD, Apache) | keep the copyright notice; often no other condition | you may use the code in closed-source commercial products |
      | copyleft (GPL) | if you distribute a modified version, you must release **your** source under the same licence | good for shared projects, a problem for a company that wants to keep its code secret |

      Open source is not automatically "no cost": a company may charge for support, hosting or
      customisation, and some open-source components have commercial support contracts. It is also
      not "no rules": ignoring the conditions is a copyright infringement.

  - type: explain
    title: Freeware, shareware and the public domain
    body: |-
      | Term | Meaning | Source code? | Payment? |
      |---|---|---|---|
      | freeware | free to use, but the author keeps the rights | usually not available | none |
      | shareware | try it free for a trial period, then pay to continue | usually not available | after the trial |
      | public domain / CC0 | the author has given up the rights | often available | none, and no conditions |

      Freeware is the one students most often confuse with open source. A free PDF reader is
      freeware: it costs nothing, but you still cannot see or change its code.

  - type: intuition
    title: How to choose, in the order that matters
    body: |-
      When a question asks you to justify a licence, work through these in order and say which one
      decides the answer:

      1. **How many installations?** Many machines in one organisation points to a site or volume
         licence.
      2. **Is money available?** No budget points to open source or freeware — but check the
         conditions.
      3. **Do you need to change the code?** If yes, it must be open source.
      4. **Will you distribute your product?** If yes and you want to keep your code private, avoid
         copyleft (GPL) and choose a permissive licence.
      5. **Do you need support and updates?** If the software is business-critical, a commercial
         licence with a support contract may be worth the cost.

      A justification always links the licence to the situation: "a site licence, because the school
      needs it on 500 machines and a single-user licence would be more expensive and harder to
      manage".

  - type: example
    title: "Worked example: choosing for a school"
    problem: |-
      A school has 480 computers used by students, a small budget, and no programmers on staff. It
      needs an office suite on every machine. Which licence should it choose, and why?
    steps:
      - |-
        **Count the installations.** 480 machines rules out single-user licences, which would mean
        480 separate purchases and constant licence administration.
      - |-
        **Consider a site licence.** It allows unlimited installation at one site for one annual
        or one-off fee, which matches "every machine in this school" exactly.
      - |-
        **Consider open source instead.** A free open-source office suite would cost nothing and
        could be installed on all 480 machines legally, which fits the small budget.
      - |-
        **Weigh the trade-offs.** Commercial software brings vendor support and staff familiarity;
        open source brings zero licence cost but may need more in-house support and training.
      - |-
        **Justify the choice.** With no programmers and a small budget, a site licence for the
        commercial suite (or a supported open-source suite) is defensible; the deciding factors are
        the number of machines, the budget and the need for support.
    answer: |-
      A site licence (or a free open-source suite) is appropriate: the school needs many
      installations, has little money and needs support rather than source-code access.

  - type: example
    title: "Worked example: choosing for a start-up"
    problem: |-
      A start-up is building a paid app. It wants to use an existing open-source library for image
      processing and to keep its own source code private. Which licence family should it look for,
      and why?
    steps:
      - |-
        The team needs to **modify** the library, so a closed proprietary licence that forbids
        modification is unsuitable.
      - |-
        It also wants to **distribute** the app and keep its own code secret, which rules out a
        copyleft licence: GPL would require the whole derived work's source to be released.
      - |-
        A **permissive** licence (MIT, BSD, Apache) allows modification and distribution in a
        closed-source product, provided the copyright notice is kept.
      - |-
        The team must still check the details: Apache, for example, also requires notices about
        modified files and includes a patent clause.
      - |-
        If no suitable open-source library exists, a commercial licence with the right to
        redistribute might be needed — at a cost.
    answer: |-
      A permissive open-source licence such as MIT or Apache: it allows modification and
      redistribution inside a closed-source product, which copyleft would not.

  - type: check
    title: Quick check
    questions: [licence-definition, freeware-vs-open, gpl-condition]
  - type: check
    title: Practice
    questions: [site-licence-justify, start-up-licence, licence-spot-error]

  - type: misconceptions
    items:
      - wrong: Freeware and open source are the same thing.
        right: |-
          Freeware is free of charge but keeps its source code closed. Open source supplies the
          source and allows modification under the licence's conditions.
      - wrong: Open source means there are no rules.
        right: |-
          Open-source licences impose conditions — keeping notices, or releasing your source if you
          distribute a modified copyleft version. Breaking them is infringement.
      - wrong: A single-user licence can be installed on every computer you own.
        right: |-
          It is for one user (and often one device). Extra installations need extra seats or a
          different licence.
      - wrong: Buying software means you own the copyright.
        right: |-
          You own a licence to use it. The copyright stays with the author or publisher.
      - wrong: A site licence means unlimited use anywhere in the world.
        right: |-
          It usually covers one site or one organisation; using it at another branch or company may
          need a separate licence.

  - type: exam
    body: |-
      - The command word is "justify", so give a **reason linked to the situation**, not just a
        definition: number of users, cost, source-code access, need to modify, need to redistribute.
      - Name the licence precisely (single-user, site, volume, subscription, open source, freeware,
        shareware) and say what it permits.
      - For open source, distinguish permissive from copyleft, because that distinction decides
        whether a company can keep its own code private.
      - Mention the drawback of your choice as well as the benefit; that is what "justify" rewards.
      - Remember that open source can still cost money for support.

  - type: takeaways
    items:
      - A licence is permission to use software on stated terms; the copyright stays with the owner.
      - "Proprietary licences are priced by users or machines: single-user, per-seat, site, volume and subscription."
      - Open-source licences allow access to and modification of source code, under conditions.
      - Permissive licences allow closed-source reuse; copyleft licences require your changes to be shared.
      - Freeware is free of charge but closed; shareware is a trial before payment.

questions:
  - id: licence-definition
    format: mcq
    difficulty: 1
    objectives: ["7.1.4"]
    prompt: |-
      What is a software licence?
    options:
      - text: A legal agreement stating what a user may do with the software
        correct: true
        why: |-
          The licence grants permission for specific uses and sets the conditions.
      - text: The installation file for the software
        why: |-
          The installer is a copy of the program; the licence is the permission that comes with it.
      - text: Proof that the user owns the copyright
        why: |-
          The copyright stays with the author or publisher; the user has a licence.
      - text: A guarantee that the software is free of bugs
        why: |-
          Licences usually disclaim such guarantees rather than provide them.
    explanation: |-
      A licence sets out what the user may and may not do with the software.

  - id: freeware-vs-open
    format: mcq
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      A program is free to download and use, but the source code is not provided and modification is
      forbidden. How is it best described?
    options:
      - text: Freeware
        correct: true
        why: |-
          Freeware is free of charge but keeps the source closed and does not allow modification.
      - text: Open source
        why: |-
          Open source requires the source code to be available and allows modification.
      - text: Shareware
        why: |-
          Shareware is a free trial followed by payment, not free permanent use.
      - text: Public domain
        why: |-
          Public domain means the rights have been given up, which would allow modification.
    explanation: |-
      Free but closed is freeware; free and modifiable is open source.

  - id: gpl-condition
    format: mcq
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      A company modifies a program released under the GPL and distributes the modified version. What
      must it do?
    options:
      - text: Release its modified source code under the same licence
        correct: true
        why: |-
          GPL is copyleft: distributing a derived work requires the source to be shared under the
          same terms.
      - text: Pay a royalty to the original author
        why: |-
          The GPL does not require royalties; it requires the source to be shared.
      - text: Nothing, because GPL software is free
        why: |-
          "Free" refers to freedom to use and modify, not freedom from conditions.
      - text: Remove the original copyright notice
        why: |-
          Notices must be kept, not removed.
    explanation: |-
      Copyleft licences require modified versions to be released under the same licence.

  - id: site-licence-justify
    format: mcq
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      A college wants to install a commercial design package on all 300 computers in one building.
      Which licence is most appropriate, and why?
    options:
      - text: A site licence, because it covers many installations at one site for one fee
        correct: true
        why: |-
          A site licence matches "many machines, one location" and avoids buying 300 single licences.
      - text: A single-user licence, because each student uses one computer
        why: |-
          That would need 300 separate licences and constant administration.
      - text: A shareware licence, because it is cheaper
        why: |-
          Shareware is a trial before payment; it does not license permanent use on 300 machines.
      - text: A public domain licence, because the college is educational
        why: |-
          Public domain applies only if the author has given up the rights, which is not the case
          for commercial software.
    explanation: |-
      Many installations at one site is exactly what a site licence is for.

  - id: start-up-licence
    format: mcq
    difficulty: 3
    objectives: ["7.1.4"]
    prompt: |-
      A start-up wants to modify an open-source library and ship it inside a paid app whose source
      code stays private. Which licence fits?
    options:
      - text: A permissive licence such as MIT or Apache
        correct: true
        why: |-
          Permissive licences allow modification and closed-source redistribution, provided notices
          are kept.
      - text: GPL
        why: |-
          GPL would require the start-up to release its own source, because the app is a derived work.
      - text: A single-user commercial licence
        why: |-
          That would not allow the library to be modified and redistributed inside a product.
      - text: Shareware
        why: |-
          Shareware is a payment model for a trial, not a licence to reuse source code.
    explanation: |-
      Keeping your code private while reusing and modifying code requires a permissive licence.

  - id: licence-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      A student compares licence types. Which line contains the first error?
    lines:
      - A single-user licence allows the software to be installed for one user, often on one device.
      - A site licence allows installation on an unlimited number of machines at one site.
      - Open-source software always has no conditions, so its code can be used in any way at all.
      - Shareware can be tried free of charge for a trial period before a payment is required.
    errorLine: 3
    fix: |-
      Open-source licences **do** impose conditions — keeping copyright notices, or releasing your
      source if you distribute a modified copyleft version. Ignoring them is infringement.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 wrongly claims open source has no conditions.
