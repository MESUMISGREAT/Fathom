id: ethics-ownership-software-licences
subject: "9618"
topic: "7.1"
title: "Software licences: what you are actually allowed to do"
summary: A licence is the permission that comes with software. It decides how many machines you may install it on, whether you can see or change the code, and whether you may pass it on.
order: 5
minutes: 9
kind: core
objectives: ["7.1.4"]
prerequisites: [ethics-ownership-copyright]
