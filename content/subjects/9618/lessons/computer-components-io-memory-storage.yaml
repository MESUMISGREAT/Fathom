id: computer-components-io-memory-storage
subject: "9618"
topic: "3.1"
title: "Input, output, memory and storage: why you need all four"
summary: Why every computer system needs input devices, output devices, primary memory and secondary storage, including removable storage.
order: 1
minutes: 4
kind: core
objectives: ["3.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.1 (the need for input, output, primary memory and secondary, including removable,
    storage). All questions are original. Device examples are illustrative.
blocks:
  - type: objective
    body: |
      By the end you can explain **why** a computer needs input, output, primary memory and secondary storage (including removable storage), and sort any device into the right group.

  - type: explain
    title: A brain in a jar
    body: |
      A processor on its own is a brain in a jar. It thinks incredibly fast, but it can't hear you, can't answer you, and forgets everything when the power goes.

      Each of the other parts fixes one of those problems:

      | Part | The problem it solves |
      | --- | --- |
      | **Input** devices | the processor can't get data from the outside world |
      | **Output** devices | nobody can see, hear or use the results |
      | **Primary memory** | the processor needs somewhere *right next to it* to hold the program and data it's working on |
      | **Secondary storage** | everything in RAM vanishes when the power goes off |

  - type: definition
    term: Input device
    body: |
      A device that captures data or instructions from outside the computer (from a user or the environment) and converts them into a digital form the computer can process. Examples: keyboard, mouse, microphone, scanner, sensor.

  - type: definition
    term: Output device
    body: |
      A device that takes the results of processing and converts them into a form that is useful outside the computer: something people can see or hear, or a physical action. Examples: screen, printer, speakers, actuator.

  - type: explain
    title: Primary memory is the workbench
    body: |
      **Primary memory** (main memory) is memory the processor can access **directly**: RAM and ROM.

      - The processor can only execute instructions and process data that are in primary memory. So a program on the disk must be **loaded into RAM** before it can run.
      - RAM is fast but **volatile**: its contents are lost when the power is switched off.
      - ROM holds the instructions needed to start the computer, because they must be there the moment it is switched on.

  - type: explain
    title: Secondary storage is the filing cabinet
    body: |
      **Secondary storage** keeps programs and data **permanently**. It is **non-volatile**, so files survive with the power off.

      - It is not directly accessed by the processor: data is copied into RAM to be used.
      - Compared with RAM it has a much larger capacity and costs less per gigabyte, but it is slower.
      - Examples: hard disk drive (HDD), solid state drive (SSD).

  - type: intuition
    body: |
      Think of a desk. **RAM is the desk top**: small, fast to reach, and cleared every evening. **Secondary storage is the filing cabinet**: huge and permanent, but you fetch things out of it before you can work on them.

      Where the picture breaks: ROM is also primary memory, but it isn't cleared at night. It's more like instructions printed on the desk itself.

  - type: diagram
    diagram: cs-computer-components-system-overview
    alt: >-
      Block diagram of a computer system. On the left, an Input box lists keyboard, mouse,
      microphone, touchscreen and sensor, with an arrow into a dashed box labelled inside the
      computer. Inside it, a Processor (CPU) box is joined by a two-way arrow to a Primary memory
      box labelled RAM and ROM, directly accessed by CPU. An arrow leaves the computer to an
      Output box listing screen, printer, speakers and actuator. A two-way arrow labelled loaded
      into RAM to be used joins primary memory to a Secondary storage (non-volatile) box at the
      bottom, split into fixed (hard disk, SSD) and removable (USB stick, SD card, DVD).
    caption: |
      Data comes in, gets worked on in primary memory, goes out, and is kept safe in secondary storage.

  - type: check
    title: Quick check
    questions: [classify-sensor, why-load-into-ram, volatile-cloze]

  - type: explain
    title: Removable storage travels with you
    body: |
      **Removable storage** is secondary storage you can unplug and carry away: USB flash drives, SD cards, external hard disks, optical discs (CD, DVD, Blu-ray).

      It's needed to:

      - **move files** between computers that aren't connected to each other;
      - keep **backup copies** away from the computer, so a fire or theft doesn't destroy everything;
      - **distribute** software, films or music;
      - add extra storage to devices such as cameras and phones.

  - type: example
    title: Sorting one device's parts
    problem: |
      A digital camera has: an image sensor, a screen on the back, RAM, and an SD card slot. For each, say which group it belongs to and why the camera needs it.
    steps:
      - |
        **Image sensor: input.** It captures light from the scene and turns it into digital data.
      - |
        **Screen: output.** It shows the photo and menus so the user can see the results.
      - |
        **RAM: primary memory.** It holds the camera's running program and the photo being processed, where the processor can reach them directly.
      - |
        **SD card: secondary (removable) storage.** Photos stay on it with the power off, and you can take it out to copy the photos to a computer.
    answer: |
      Input, output, primary memory, removable secondary storage. Each one answers a different "why".

  - type: misconceptions
    items:
      - wrong: My phone has 256 GB of memory.
        right: |
          That's **storage** (secondary, non-volatile). The phone's **memory** (RAM) is much smaller, typically a few GB. Examiners care about this difference.
      - wrong: The processor runs programs straight from the hard disk.
        right: |
          The program is first **loaded into RAM**. The processor can only fetch instructions from primary memory.
      - wrong: A touchscreen is an output device.
        right: |
          It's **both**: the screen shows output, and the touch sensor is input.
      - wrong: Removable storage is a separate category from secondary storage.
        right: |
          It's a **type** of secondary storage: still non-volatile, just designed to be unplugged and carried.

  - type: exam
    body: |
      - "Explain the **need** for…" wants a **reason**, not a description. Say what would go wrong without it.
      - Primary memory: "the processor can only directly access data and instructions held in primary memory".
      - Secondary storage: "non-volatile, so data and programs are kept when the power is off".
      - Removable storage: link it to the scenario (backup off-site, moving files, more capacity).

  - type: check
    title: Apply it
    questions: [removable-reason, touchscreen-both, explain-phone-needs]

  - type: takeaways
    items:
      - Input gets data in; output gets results out in a useful form.
      - Primary memory (RAM and ROM) is directly accessed by the processor; programs must be loaded into RAM to run.
      - RAM is volatile, so secondary storage (non-volatile, large, cheaper per GB) keeps data permanently.
      - "Removable storage is secondary storage you can carry: for transfer, off-site backup and distribution."

questions:
  - id: classify-sensor
    format: mcq
    difficulty: 1
    objectives: ["3.1.1"]
    prompt: |
      A weather station has a sensor that measures wind speed and sends the readings to its computer. What kind of device is the sensor?
    options:
      - text: An input device
        correct: true
        why: |
          It captures data from the environment and passes it into the computer.
      - text: An output device
        why: |
          Output devices present results (screen, printer) or act on the world (actuator). The sensor only measures.
      - text: Primary memory
        why: |
          Primary memory holds data the processor is working on; it doesn't capture anything.
      - text: Secondary storage
        why: |
          Secondary storage keeps data permanently; it doesn't measure the wind.
    explanation: |
      Sensors are input devices: they turn a physical quantity (here, wind speed) into data the computer can process.

  - id: why-load-into-ram
    format: mcq
    difficulty: 2
    objectives: ["3.1.1"]
    prompt: |
      Why must an app be copied from the SSD into RAM before it can run?
    options:
      - text: The processor can only directly access instructions and data held in primary memory.
        correct: true
        why: |
          That is the reason primary memory is needed at all: it's the processor's working area.
      - text: RAM is non-volatile, so the app is safer there.
        why: |
          RAM is **volatile**: it loses everything when the power goes off.
      - text: An SSD cannot store program files.
        why: |
          It can; that's where the app is kept permanently.
      - text: RAM has a larger capacity than the SSD.
        why: |
          Usually the other way round: an SSD holds far more than RAM.
    explanation: |
      Secondary storage keeps the app permanently, but the processor fetches and executes instructions only from primary memory, so the app is loaded into RAM first.

  - id: volatile-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.1"]
    prompt: |
      RAM is {{1}}: its contents are lost when the power is switched off. Secondary storage is {{2}}, so files are kept.
    blanks:
      - accept: ["volatile"]
      - accept: ["non-volatile", "nonvolatile", "non volatile"]
    explanation: |
      Volatile memory needs power to keep its contents. Non-volatile storage (HDD, SSD, USB stick) keeps data with the power off, which is why we need it.

  - id: removable-reason
    format: mcq
    difficulty: 2
    objectives: ["3.1.1"]
    prompt: |
      A small business keeps a copy of its accounts on an external hard disk that the owner takes home each night. Why is **removable** storage the right choice here?
    options:
      - text: The backup is kept off-site, so a fire or theft at the office doesn't destroy both copies.
        correct: true
        why: |
          Being able to physically carry the copy away is exactly what removable storage gives you.
      - text: The processor can access the external disk directly, like RAM.
        why: |
          Only primary memory is directly accessed by the processor.
      - text: Removable storage is volatile, so the data is more secure.
        why: |
          It's non-volatile, and volatility has nothing to do with security.
      - text: An external disk is faster than the computer's RAM.
        why: |
          RAM is much faster than any secondary storage.
    explanation: |
      Removable storage lets data move physically: between computers, or to a safe place as a backup.

  - id: touchscreen-both
    format: mcq
    difficulty: 2
    objectives: ["3.1.1"]
    prompt: |
      A self-service checkout uses a touchscreen. How should it be classified?
    options:
      - text: Both an input device and an output device
        correct: true
        why: |
          It displays prices and buttons (output) and detects where you touch (input).
      - text: Input only
        why: |
          The screen also shows information, which is output.
      - text: Output only
        why: |
          The touch-sensitive layer sends the position of your touch to the computer, which is input.
      - text: Secondary storage
        why: |
          A touchscreen doesn't keep data permanently.
    explanation: |
      Some devices do two jobs. A touchscreen is a screen (output) with a touch sensor on top (input).

  - id: explain-phone-needs
    format: explain
    difficulty: 3
    objectives: ["3.1.1"]
    prompt: |
      Explain why a smartphone needs **both** primary memory (RAM) and secondary storage.
    model: |
      The processor can only directly access the instructions and data it is using from primary memory, so running apps and the data they are working on must be in RAM, which is also fast. But RAM is volatile, so everything in it is lost when the phone is switched off. Secondary storage (flash) is non-volatile, so apps, photos and settings are kept permanently, and it has a much larger capacity at a lower cost per GB.
    keyPoints:
      - The processor can only directly access data and instructions in primary memory (RAM)
      - Running apps and current data are loaded into RAM, which is fast
      - RAM is volatile, so its contents are lost when the power is off
      - Secondary storage is non-volatile, so apps and files are kept permanently
      - Secondary storage has a larger capacity and lower cost per GB
    explanation: |
      Two jobs, two kinds of memory: RAM is the fast working area the processor can reach; secondary storage is the permanent store. Neither can do the other's job.
