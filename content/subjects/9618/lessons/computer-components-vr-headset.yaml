id: computer-components-vr-headset
subject: "9618"
topic: "3.1"
title: "Virtual reality headsets: fooling your eyes"
summary: How a VR headset uses two screens, lenses, motion sensors and fast processing to make a 3D world that responds as you move your head.
order: 10
minutes: 4
kind: core
objectives: ["3.1.3"]
prerequisites: [computer-components-io-memory-storage]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.3 (principal operations of hardware devices: virtual reality headset). Refresh rates
