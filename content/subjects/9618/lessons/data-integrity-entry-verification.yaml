id: data-integrity-entry-verification
subject: "9618"
topic: "6.2"
title: "Verification at entry: visual checks and double entry"
summary: Two ways to confirm that typed data matches the source, what each costs, and when each is worth it.
order: 4
minutes: 8
kind: core
objectives: ["6.2.3"]
prerequisites: [data-integrity-validation-vs-verification]
