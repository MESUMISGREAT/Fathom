id: data-integrity-transfer-verification
subject: "9618"
topic: "6.2"
title: "Verification in transit: parity bits, block parity and checksums"
summary: How a parity bit, a block check character and a checksum detect data corrupted while it travels, and what each one misses.
order: 5
minutes: 9
kind: core
objectives: ["6.2.3"]
prerequisites: [data-integrity-entry-verification]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029 (Version 2, December 2025), topic 6.2 outcome 6.2.3, guidance for data
    transfer: parity check (byte and block) and checksum. Every bit pattern, block check
    character and checksum in this lesson and its answer keys was recomputed in Python. All
    examples and questions are original.

    Re-checked line by line in a second adversarial pass by the same agent on 2026-10-28:
    objective 6.2.3 confirmed taught and tested, every definition and claim checked,
    every check digit, parity bit, block check character and checksum recomputed in Python,
