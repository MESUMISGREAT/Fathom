id: database-concepts-tables-keys-terminology
subject: "9618"
topic: "8.1"
title: Tables, records, fields and keys
summary: Learn the vocabulary of the relational model, from entity and tuple to primary, candidate, secondary and foreign keys.
order: 3
minutes: 6
kind: core
objectives: ["8.1.3"]
prerequisites: [database-concepts-relational-databases]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus,
    topic 8.1 Database Concepts, learning outcome 8.1.3 (terminology of the relational model,
    including entity, table, record, field, tuple, attribute, primary key, candidate key,
    secondary key, foreign key, relationships, referential integrity and indexing). All
