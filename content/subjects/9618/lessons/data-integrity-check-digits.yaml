id: data-integrity-check-digits
subject: "9618"
topic: "6.2"
title: "Check digits: a built-in arithmetic guard"
summary: Calculate a check digit, use it to test a code, and see why a single mistyped digit almost always shows up.
order: 3
minutes: 9
kind: core
objectives: ["6.2.2"]
