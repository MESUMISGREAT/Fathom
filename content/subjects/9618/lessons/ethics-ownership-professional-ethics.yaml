id: ethics-ownership-professional-ethics
subject: "9618"
topic: "7.1"
title: "Professional ethics in computing"
summary: "Why computing professionals need ethical codes, the role of BCS and IEEE, and what it means to be a responsible practitioner."
order: 2
minutes: 5
kind: core
objectives: ["7.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: draft
  notes: >
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029, topic 7.1.1: "Understand the need for, and purpose of, ethics as a
    computing professional." Guidance on BCS and IEEE included. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain why computing professionals need ethical codes, describe the
      purpose of BCS and IEEE codes of conduct, and identify situations where professional ethics
      guide your decisions.

  - type: explain
    title: Why ethics in computing?
    body: |
      Code runs the world — banking, healthcare, transport, communication. A single bug or
      malicious feature can affect millions. **Ethics** is the framework that helps us decide
      what we *should* do, not just what we *can* do.

      As a computing professional, you have power: access to data, control over systems, influence
      over decisions. Ethics turns that power into responsibility.

      **Three reasons we need professional ethics:**
      1. **Trust** — clients, employers, and the public must trust that we act in their interest.
      2. **Accountability** — when things go wrong, there must be standards to judge conduct.
      3. **Guidance** — tricky situations (pressure to cut corners, data requests, AI bias) need
         a compass, not guesswork.

  - type: definition
    term: Professional ethics
    body: |
      A set of principles and standards that govern the conduct of members of a profession,
      defining obligations to clients, employers, colleagues, and society.

  - type: explain
    title: "The big two: BCS and IEEE"
    body: |
      Two major bodies publish codes of conduct that Cambridge expects you to know:

      **BCS (British Computer Society) — The Chartered Institute for IT**
      - UK-focused but internationally recognised.
      - Four core principles: **Public Interest**, **Professional Competence and Integrity**,
        **Duty to Relevant Authority**, **Duty to the Profession**.
      - Members sign up to the **BCS Code of Conduct** — breach can mean losing chartered status.

      **IEEE (Institute of Electrical and Electronics Engineers) — IEEE Code of Ethics**
      - Global, engineering-focused (hardware, software, systems).
      - Ten clauses covering: public safety, conflicts of interest, honesty, rejecting bribery,
        improving understanding of technology, supporting colleagues, avoiding discrimination,
        avoiding injury, professional development, and supporting the code itself.

      **What they share:** honesty, competence, public safety, confidentiality, no discrimination,
      and a duty to report wrongdoing.

  - type: example
    title: "Example: Pressure to ship insecure code"
    problem: |
      Your manager asks you to deploy a feature without the security review because "the client
      needs it Friday." The feature handles personal health data. What does professional ethics
      say?
    steps:
      - |
        Identify the stakeholders: patients (data subjects), your employer, the client, the public.
      - |
        Check the codes: BCS "Public Interest" and "Professional Competence"; IEEE "public safety"
        and "disclose factors that might endanger the public."
      - |
        The ethical action: refuse to deploy without the review, document the risk, escalate if
        needed. Shipping known-insecure health data code violates both codes.
    answer: |
      Refuse to deploy. The BCS and IEEE codes both require you to prioritise public safety and
      professional competence over commercial pressure. Document your concern and escalate through
      proper channels.

  - type: check
    title: Quick check
    questions: [ethics-purpose, bcs-principles, ieee-clauses]

  - type: intuition
    title: Ethics is not the same as law
    body: |
      - **Legal** = what you *must* do (or face state punishment).
      - **Ethical** = what you *should* do (or face professional/social consequences).

      Something can be legal but unethical (selling user data with a buried consent clause).
      Something can be illegal but arguably ethical (whistleblowing in the public interest).
      Professional codes help navigate the gap.

  - type: misconceptions
    items:
      - wrong: |
          Ethics is just common sense — you don't need a code.
        right: |
          Common sense varies. Codes give a shared, explicit baseline so teams, employers, and
          regulators can hold each other accountable.
      - wrong: |
          BCS and IEEE codes are basically the same thing.
        right: |
          They overlap heavily but differ in emphasis: BCS is UK/chartered-profession focused
          with four principles; IEEE is global/engineering-focused with ten clauses. Know both.
      - wrong: |
          Only members of BCS/IEEE need to follow their codes.
        right: |
          The codes represent *professional* standards. Cambridge expects you to know and apply
          them regardless of membership — they define what "professional" means in this field.

  - type: exam
    body: |
      - "State two principles from the BCS Code of Conduct." → Public Interest, Professional
        Competence and Integrity, Duty to Relevant Authority, Duty to the Profession.
      - "Give one way the IEEE Code of Ethics protects the public." → Requires members to
        disclose factors endangering public safety, reject bribery, avoid injury.
      - "Why do professional bodies have codes of conduct?" → Trust, accountability, guidance.

  - type: takeaways
    items:
      - |
        Professional ethics = shared standards for responsible computing practice.
      - |
        BCS (UK/chartered) = four principles; IEEE (global/engineering) = ten clauses.
      - |
        Both prioritise public safety, honesty, competence, confidentiality, and non-discrimination.
      - |
        Ethics guides you when the law is silent or when pressure conflicts with responsibility.

questions:
  - id: ethics-purpose
    format: text
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |
      State the main purpose of a professional code of ethics for computing professionals.
    accept:
      - To define standards of conduct and responsibility for the profession
      - To ensure trust, accountability, and guidance for computing professionals
      - To protect the public and maintain professional standards
    model: |
      To establish shared standards of conduct that ensure trust, accountability, and guidance for
      computing professionals, protecting the public and the profession's reputation.
    explanation: |
      Codes of ethics provide a framework for professional behaviour, ensuring computing
      professionals act responsibly with the power they hold over systems and data.

  - id: bcs-principles
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |
      Which of the following is NOT one of the four core principles of the BCS Code of Conduct?
    options:
      - text: Public Interest
        why: |-
          This IS a core BCS principle.
      - text: Professional Competence and Integrity
        why: |-
          This IS a core BCS principle.
      - text: Duty to Shareholders
        correct: true
        why: |-
          BCS has "Duty to Relevant Authority" and "Duty to the Profession", not shareholders.
      - text: Duty to the Profession
        why: |-
          This IS a core BCS principle.
    explanation: |
      The BCS code is built on public interest, professional competence and integrity, duty to the profession, and duty to the relevant authority. A duty to shareholders is a commercial obligation, not one of the four principles.

  - id: ieee-clauses
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |
      The IEEE Code of Ethics requires members to:
    options:
      - text: Prioritise company profits over public safety
        why: |-
          The opposite — public safety comes first.
      - text: Disclose factors that might endanger the public or the environment
        correct: true
        why: |-
          IEEE clause 1: "hold paramount the safety, health, and welfare of the public."
      - text: Keep all technical knowledge confidential from colleagues
        why: |-
          IEEE encourages sharing knowledge and supporting colleagues.
      - text: Accept gifts from vendors to maintain good relationships
        why: |-
          IEEE clause 3: reject bribery in all its forms.
    explanation: |
      The IEEE code makes public safety, health and welfare paramount, and requires members to disclose factors that might endanger the public or the environment.