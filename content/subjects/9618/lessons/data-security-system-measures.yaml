id: data-security-system-measures
subject: "9618"
topic: "6.1"
title: "Firewalls, anti-malware and encryption: guarding the system"
summary: What a firewall actually filters, how anti-virus and anti-spyware software work, and what encryption does and does not protect.
order: 4
minutes: 9
kind: core
objectives: ["6.1.3"]
prerequisites: [data-security-accounts-authentication]
