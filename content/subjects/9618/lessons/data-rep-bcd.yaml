id: data-rep-bcd
subject: "9618"
topic: "1.1"
title: Binary Coded Decimal (BCD)
summary: Encode and decode Binary Coded Decimal one digit at a time, and explain why clocks, calculators and money calculations use it.
order: 5
minutes: 4
kind: core
objectives: ["1.1.2", "1.1.4"]
prerequisites: [data-rep-binary-denary]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Computer Science 9618
