id: programming-structured
subject: "9618"
topic: "11.3"
title: Structured Programming — procedures, functions, parameters, and efficiency
summary: Define and use procedures and functions with parameters (by value and by reference). Understand when to use each, use correct terminology, and write efficient pseudocode.
order: 3
minutes: 7
kind: core
objectives: ["11.3.1", "11.3.2", "11.3.3", "11.3.4", "11.3.5", "11.3.6", "11.3.7"]
prerequisites: ["programming-constructs"]
