id: assembly-language-tracing
subject: "9618"
topic: "4.2"
title: "Tracing a program: one row per instruction actually run"
summary: Build a trace table for a loop that counts down, showing only what changed and following every jump the processor takes.
order: 4
minutes: 9
kind: core
