id: bit-manipulation-device-control
subject: "9618"
topic: "4.3"
title: "One byte, eight devices: monitoring and control"
summary: Pack eight on/off devices into a single byte, test sensor flags with AND, and switch devices on or off with OR and an inverse mask.
order: 3
minutes: 8
kind: core
objectives: ["4.3.2"]
prerequisites: [bit-manipulation-masking]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029 (Version 2, December 2025), topic 4.3 outcome 4.3.2 ("understand how bit
    manipulation can be used to monitor or control a device") and its guidance on testing and
    setting bits with masks, bitwise AND/OR/XOR, and shifts. Device registers are modelled as memory
