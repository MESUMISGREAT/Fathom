id: algorithmic-thinking-abstraction-decomposition
subject: "9618"
topic: "9.1"
title: Computational Thinking Skills — abstraction and decomposition
summary: Understand abstraction as removing non-essential detail to model a system, and decomposition as breaking problems into manageable sub-problems that map to procedures or functions.
order: 1
minutes: 5
kind: core
objectives: ["9.1.1", "9.1.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029 (Version 2, December 2025), topic 9.1 Computational Thinking Skills.
    Covers both learning outcomes: 9.1.1 (abstraction) and 9.1.2 (decomposition).
