id: operating-systems-program-libraries
subject: "9618"
topic: "5.1"
title: "Program libraries and DLLs"
summary: Developers reuse tested code from libraries instead of rewriting it — and a dynamic link library shares that code between programs at run time.
order: 5
minutes: 6
kind: core
objectives: ["5.1.4"]
prerequisites: [operating-systems-why-needed]
