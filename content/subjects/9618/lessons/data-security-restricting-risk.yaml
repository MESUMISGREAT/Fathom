id: data-security-restricting-risk
subject: "9618"
topic: "6.1"
title: "Restricting the risk: matching the countermeasure to the threat"
summary: Practical measures that reduce the danger from malware, hackers, phishing and pharming, and how to choose the right one for a given threat.
order: 6
minutes: 9
kind: core
objectives: ["6.1.5"]
prerequisites: [data-security-network-threats]
