id: dbms-software-tools
subject: "9618"
topic: "8.2"
title: "The tools inside a DBMS"
summary: A DBMS is not just storage. It ships with tools for designing tables, writing queries, building data-entry screens and reports, setting permissions and taking backups.
order: 2
minutes: 8
kind: core
objectives: ["8.2.2"]
prerequisites: [dbms-file-based-approach-problems]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus for
    2027-2029 (Version 2, December 2025), topic 8.2, learning outcome 8.2.2 (how the software tools
    within a DBMS are used in practice). Questions are original.

    Second-pass review (same agent, no separate reviewer model): the problem-to-feature mapping was
