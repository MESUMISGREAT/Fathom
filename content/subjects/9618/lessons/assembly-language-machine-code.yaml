id: assembly-language-machine-code
subject: "9618"
topic: "4.2"
title: "Assembly language and machine code: names for the bits"
summary: See what machine code really is, why assembly language replaces it with mnemonics, and why one assembly instruction becomes exactly one machine code instruction.
order: 1
minutes: 7
kind: core
objectives: ["4.2.1"]
prerequisites: [cpu-architecture-fetch-execute]
