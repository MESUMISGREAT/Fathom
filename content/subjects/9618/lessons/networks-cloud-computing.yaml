id: networks-cloud-computing
subject: "9618"
topic: "2.1"
title: "Cloud computing: public and private"
summary: What cloud computing is, how public and private clouds differ, and the benefits and drawbacks of using the cloud.
order: 4
minutes: 5
kind: core
objectives: ["2.1.6"]
prerequisites: [networks-thin-thick-client]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029 (Version 2, December 2025), topic 2.1, sixth learning outcome (2.1.6,
    cloud computing, including public and private clouds and the benefits and drawbacks). All
