id: data-integrity-validation-checks
subject: "9618"
topic: "6.2"
title: "Seven validation checks, and when to use each"
summary: Range, length, format, presence, existence, limit and check digit — what each one tests, and how to choose the right one for a field.
order: 2
minutes: 9
kind: core
objectives: ["6.2.2"]
prerequisites: [data-integrity-validation-vs-verification]
