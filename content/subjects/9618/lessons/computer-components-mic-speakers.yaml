id: computer-components-mic-speakers
subject: "9618"
topic: "3.1"
title: "Microphones and speakers: the same trick, both ways"
summary: How a speaker turns a digital sound file into sound using a DAC, an amplifier, a coil and a magnet, and how a microphone does the reverse.
order: 5
minutes: 5
kind: core
objectives: ["3.1.3"]
prerequisites: [computer-components-io-memory-storage, multimedia-sound-sampling]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Computer Science 9618
    syllabus (2027-2029, Version 2), topic 3.1 Computers and their components, learning outcome
    3.1.3 (principal operations of hardware devices: microphone and speakers). Describes the
    moving-coil (dynamic) design. Frequencies in the questions are illustrative and checked with
