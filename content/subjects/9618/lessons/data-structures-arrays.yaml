id: data-structures-arrays
subject: "9618"
topic: "10.2"
title: Arrays — 1D and 2D arrays, indexing, bubble sort, linear search
summary: Understand array terminology (index, bounds); write pseudocode for 1D/2D arrays; implement bubble sort and linear search.
order: 2
minutes: 9
kind: core
objectives: ["10.2.1", "10.2.2", "10.2.3", "10.2.4"]
prerequisites: ["data-types-records", "programming-constructs"]
