id: language-translators-assembler-compiler-interpreter
subject: "9618"
topic: "5.2"
title: "Assembler, compiler, interpreter: why translation is needed"
summary: Processors only understand machine code, so every program must be translated — an assembler for assembly language, a compiler or interpreter for a high-level language.
order: 1
minutes: 6
kind: core
objectives: ["5.2.1"]
prerequisites: [operating-systems-why-needed]
