id: cpu-architecture-alu-cu
subject: "9618"
topic: "4.1"
title: The ALU and the Control Unit
summary: Which part of the CPU does the sums, which part gives the orders, and how one instruction travels through both.
order: 4
minutes: 4
kind: core
objectives: ["4.1.3"]
prerequisites: [cpu-architecture-fetch-registers]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus, topic 4.1, third learning outcome (purpose and roles of the ALU, the Control
    Unit, the system clock and the Immediate Access Store; the clock and IAS are covered in
    cpu-architecture-clock-ias). All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe the job of the **Arithmetic Logic Unit (ALU)** and the
      **Control Unit (CU)**, and follow one instruction through both of them.

  - type: explain
    title: Two jobs inside the CPU
    body: |
      The CPU does exactly two kinds of work, and each has its own unit:

      | Unit | Job |
      | --- | --- |
      | **Arithmetic Logic Unit (ALU)** | The *doer*: arithmetic ($+$, $-$, $\times$, $\div$) and logic (AND, OR, NOT, comparisons) |
      | **Control Unit (CU)** | The *director*: fetches instructions, decodes them, and tells everything else when and how to act |

      The ALU produces the numbers. The CU decides which numbers, when, and where the
      result goes.

  - type: definition
    term: Arithmetic Logic Unit (ALU)
    body: |
      The component of the CPU that performs **arithmetic operations** ($+$, $-$, $\times$,
      $\div$) and **logical operations** (AND, OR, NOT and comparisons such as *less than*).
      It takes its inputs from registers and writes the result back to a register, setting
      flags in the status register as a side effect.

  - type: definition
    term: Control Unit (CU)
    body: |
      The component of the CPU that **controls and coordinates** all the other parts:
      it fetches instructions, decodes them, and issues **control signals** — timed
      electrical pulses that tell memory, the registers and the ALU what to do and when.

  - type: diagram
    diagram: cs-cpu-architecture-cpu-blocks
    alt: >-
      Inside the CPU: a Control Unit connected to an ALU, a set of registers and the system
      clock, with buses leading out to main memory. Control signals (dashed arrows) run
      from the Control Unit to the ALU, the registers and memory; data flows through the
      ALU.
    caption: The CU issues control signals; data flows through the ALU.

  - type: example
    title: What happens to ADD 7
    problem: |
      The CIR holds `ADD 7` while the accumulator holds 5. Follow the instruction through
      the CPU.
    steps:
      - |
        The **CU** looks at the CIR and **decodes** `ADD 7`: it reads this as "add the value
        at address 7 to whatever is in the accumulator".
      - |
        The CU sends control signals: memory is asked for the value at address 7, and it
        arrives in the MDR.
      - |
        The CU tells the **ALU** to add: inputs are the ACC (5) and the MDR value.
      - |
        The ALU's result goes back into the **ACC**, and its flags (zero, carry, negative,
        overflow) are written to the **status register**.
    answer: |
      ACC now holds $5 + \text{value at address 7}$, and the status register reflects that
      result.

  - type: check
    title: Quick check
    questions: [alu-job, cu-job, decode-step]

  - type: misconceptions
    items:
      - wrong: The ALU stores the program while it runs.
        right: |
          The ALU is a **calculator**, not storage. The program sits in main memory; current
          values sit in registers.
      - wrong: The CU does the arithmetic.
        right: |
          The CU **directs**; the ALU **calculates**. The CU decides what the ALU does.
      - wrong: Control signals are instructions written by the programmer.
        right: |
          They are internal electrical pulses generated by the CU. A programmer writes
          instructions in a language; the CU turns them into signals.

  - type: exam
    body: |
      - "State the function of the ALU" = 1 mark: *performs arithmetic and logical
        operations*. Adding "using inputs from registers and writing results to a register"
        makes it a strong 2.
      - "Describe the role of the Control Unit" wants **fetch, decode, control signals** —
        three separate verbs.
      - A question may ask how the units *interact*: answer with the ALU doing the work
        **on the CU's instructions**.

  - type: check
    title: Check yourself
    questions: [which-unit, explain-cu-alu]

  - type: takeaways
    items:
      - The **ALU** does arithmetic and logic; results go to a register, flags to the status register.
      - The **CU** fetches, decodes and coordinates, issuing **control signals** to every other part.
      - The CU **decodes**; the ALU **executes** the calculation the decode called for.

questions:
  - id: alu-job
    format: mcq
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      Which task belongs to the **Arithmetic Logic Unit (ALU)**?
    options:
      - text: Calculating $15 \times 4$ and testing whether the result is greater than 50
        correct: true
        why: |
          One arithmetic operation and one comparison — exactly the two families of
          operation the ALU performs.
      - text: Deciding that the next instruction is at address 205
        why: |
          Fetching and choosing addresses is the **Control Unit's** job (with the PC
          supplying the address).
      - text: Holding the instruction currently being executed
        why: |
          That is the **CIR** — storage, not calculation.
      - text: Sending the program to the screen for the user to read
        why: |
          That is an output device, working through the operating system, not the ALU.
    explanation: |
      Arithmetic ($+$, $-$, $\times$, $\div$) and logic (AND, OR, NOT, comparisons) are the
      ALU's whole world.

  - id: cu-job
    format: text
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      What is the name of the CPU component that decodes instructions and sends control
      signals to the other parts of the computer?
    style: one-line
    accept: ["control unit", "the control unit", "cu", "the cu"]
    model: |
      The Control Unit (CU).
    explanation: |
      The CU fetches, decodes and coordinates — it issues the control signals that make
      everything else happen at the right moment.

  - id: decode-step
    format: cloze
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      The instruction sits in the {{1}} register. The {{2}} unit decodes it, and the
      {{3}} unit then performs the arithmetic or logic it calls for.
    blanks:
      - accept: ["cir", "current instruction register", "the cir"]
      - accept: ["control", "control unit", "cu"]
      - accept: ["alu", "arithmetic logic unit", "arithmetic and logic unit"]
    explanation: |
      CIR → decode by the CU → execution by the ALU. That is the "execute" half of the
      fetch–execute cycle.

  - id: which-unit
    format: mcq
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      During execution of an instruction, which sequence correctly matches a component to
      what it does?
    options:
      - text: CU decodes → ALU calculates → result stored in a register
        correct: true
        why: |
          Decode, then calculate, then write back. The status register's flags are updated
          at the same time.
      - text: ALU decodes → CU calculates → result stored in memory automatically
        why: |
          Backwards: the CU decodes, the ALU calculates, and results go to a register
          first, not straight to memory.
      - text: CU calculates → ALU decodes → result stored in the PC
        why: |
          The CU never calculates, and the PC holds an instruction address, not a result.
      - text: ALU calculates → CU stores the result in the PC
        why: |
          Results go to the accumulator (or another general purpose register). The PC is
          only for the next instruction's address.
    explanation: |
      CU decodes, ALU executes, ACC (or a register) holds the result.

  - id: explain-cu-alu
    format: explain
    difficulty: 3
    objectives: ["4.1.3"]
    prompt: |
      Explain how the Control Unit and the ALU work together to carry out one arithmetic
      instruction.
    model: |
      The Control Unit first fetches the instruction and places it in the CIR, then decodes
      it to work out what is required. It sends control signals that fetch any operand the
      instruction needs into a register, and tells the ALU which operation to perform. The
      ALU carries out the arithmetic or logical operation on its register inputs and returns
      the result to a register such as the accumulator, setting the relevant flags in the
      status register. The Control Unit then moves on to the next instruction.
    keyPoints:
      - The CU fetches and decodes the instruction
      - The CU issues control signals telling the parts what to do
      - The ALU performs the operation on register inputs
      - The result returns to a register; flags are updated in the status register
    explanation: |
      The examiner wants the division of labour made explicit: **CU directs, ALU computes,
      registers hold**.