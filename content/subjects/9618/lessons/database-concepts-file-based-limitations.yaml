id: database-concepts-file-based-limitations
subject: "9618"
topic: "8.1"
title: File-based storage and its limitations
summary: Why keeping data in a separate file for each program causes duplication, inconsistency and fragile code.
order: 1
minutes: 5
kind: core
objectives: ["8.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Computer Science 9618 syllabus,
    topic 8.1 Database Concepts, learning outcome 8.1.1 (limitations of the file-based approach).
    All questions are original. The school-office scenario and the address example are
