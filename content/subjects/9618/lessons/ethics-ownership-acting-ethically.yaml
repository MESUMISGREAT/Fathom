id: ethics-ownership-acting-ethically
subject: "9618"
topic: "7.1"
title: "Acting ethically: decisions and consequences"
summary: "How to recognise ethical dilemmas, apply a decision framework, and understand the real-world impact of ethical vs unethical choices in computing."
order: 3
minutes: 5
kind: core
objectives: ["7.1.2"]
prerequisites: ["ethics-ownership-professional-ethics"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >
    Written against the official Cambridge International AS & A Level Computer Science 9618
    syllabus for 2027-2029, topic 7.1.2: "Understand the need to act ethically, and the impact
    of acting ethically or unethically in a given situation." All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can identify ethical dilemmas in computing scenarios, apply a simple
      decision framework, and explain the consequences of ethical and unethical actions for
      stakeholders.

  - type: explain
    title: What does "acting ethically" look like in practice?
    body: |
      It's not about memorising rules — it's about **recognising** when a situation has an
      ethical dimension and **reasoning** through it.

      **Typical computing dilemmas:**
      - Pressure to skip testing / security reviews.
      - Requests for user data without proper consent.
      - Algorithms that discriminate (hiring, lending, policing).
      - Vulnerability disclosure: report privately or go public?
      - AI systems that hallucinate or amplify bias.
      - Code reuse without licence compliance.

      The dilemma: two (or more) values conflict — speed vs safety, profit vs privacy,
      loyalty vs whistleblowing.

  - type: definition
    term: Ethical dilemma
    body: |
      A situation where you must choose between two or more courses of action, each of which
      supports a different ethical principle, so that whatever you do, some principle is
      compromised.

  - type: explain
    title: A simple decision framework (use it in exams too)
    body: |
      **1. Identify the stakeholders** — who is affected? (users, employer, client, public,
      colleagues, yourself)
      **2. List the options** — what could you realistically do?
      **3. Apply the codes** — what do BCS/IEEE say? What does the law say?
      **4. Weigh consequences** — short-term vs long-term, harm vs benefit, for each stakeholder.
      **5. Decide and document** — pick the option that best upholds professional ethics; record
      your reasoning.

      **Exam tip:** In scenario questions, explicitly name stakeholders, cite a code principle,
      and state the consequence of each option.

  - type: example
    title: "Example: The biased hiring algorithm"
    problem: |
      Your team builds an AI screening tool for CVs. Testing shows it rejects 40% more female
      applicants for engineering roles. The product launch is in two weeks. The CEO says
      "ship it, we'll fix it later."
    steps:
      - |
        Stakeholders: applicants (fairness), company (reputation, legal risk), team (morale),
        society (trust in AI).
      - |
        Options: (A) Launch as-is. (B) Delay launch, investigate bias. (C) Launch with a
        disclaimer. (D) Remove gender data and re-test.
      - |
        BCS: "Public Interest" — discrimination harms public trust. "Professional Competence" —
        shipping known-flawed work is incompetent. IEEE: "avoid discrimination", "disclose
        factors that might endanger the public."
      - |
        Consequences: (A) Legal action, reputational damage, harm to applicants. (B) Short-term
        cost, long-term trust. (C) Still discriminates; disclaimer doesn't fix it. (D) May not
        remove proxy bias.
      - |
        Ethical choice: **B** (delay and fix). Document the bias, the decision, and the plan.
    answer: |
      Delay the launch (option B). The algorithm discriminates, violating BCS Public Interest
      and IEEE non-discrimination clauses. Shipping known-biased software is unethical and
      legally risky.

  - type: check
    title: Quick check
    questions: [ethical-dilemma-def, stakeholders-example, framework-step]

  - type: explain
    title: Consequences — why it matters
    body: |
      **Acting ethically:**
      - Builds long-term trust with users, employers, and regulators.
      - Reduces legal and reputational risk.
      - Improves team morale — people want to do good work.
      - Sustainable career: you're known as reliable.

      **Acting unethically:**
      - Short-term gain (meet deadline, save money) → long-term disaster.
      - Data breaches, discrimination lawsuits, regulatory fines, lost contracts.
      - Personal: loss of professional registration, unemployability, whistleblower retaliation.
      - Societal: erosion of trust in technology, normalisation of harm.

      **Real-world example:** Volkswagen "Dieselgate" — software cheated emissions tests.
      Result: \$30B+ in fines, criminal convictions, brand damage lasting decades. The engineers
      who wrote the cheat code faced prison.

  - type: misconceptions
    items:
      - wrong: |
          If my boss tells me to do it, I'm not responsible.
        right: |
          "Just following orders" is not a defence in professional ethics (or law). BCS and IEEE
          both say your duty to the public overrides duty to employer.
      - wrong: |
          Acting ethically always means refusing to do the work.
        right: |
          Often the ethical path is "do it *properly*" — add the test, get consent, fix the
          bias. Refusal is a last resort; constructive pushback comes first.
      - wrong: |
          The impact of unethical actions is mostly theoretical.
        right: |
          Look at Cambridge Analytica, Equifax breach, Therac-25, Post Office Horizon.
          Unethical computing decisions have ruined lives, bankrupted companies, and changed
          laws.

  - type: exam
    body: |
      - "A developer is pressured to skip accessibility testing. Identify two stakeholders and
        explain the impact on each if the developer complies." → Users with disabilities
        (excluded), company (legal risk under Equality Act), developer (professional integrity).
      - "Describe a situation where legal and ethical obligations conflict." → Whistleblowing:
        NDA (legal) vs public safety (ethical). Professional codes say public safety wins.
      - "Give two consequences of acting unethically in a professional computing role." → Legal
        penalties, loss of professional status, reputational damage, harm to users.

  - type: takeaways
    items:
      - |
        Ethical dilemmas pit values against each other — recognise them, don't ignore them.
      - |
        Use the 5-step framework: stakeholders → options → codes → consequences → decide.
      - |
        Ethical action often means "do it right" not "refuse to do it".
      - |
        Unethical choices have real, documented consequences — legal, professional, societal.

questions:
  - id: ethical-dilemma-def
    format: text
    difficulty: 1
    objectives: ["7.1.2"]
    prompt: |
      Define "ethical dilemma" in the context of computing.
    accept:
      - A situation where you must choose between actions that each support a different ethical principle
      - A conflict between two or more ethical values where any choice compromises one principle
      - A choice between right and right (not right and wrong) in a professional context
    model: |
      A situation where a computing professional must choose between two or more courses of
      action, each supporting a different ethical principle, so that whatever is chosen, some
      principle is compromised.
    explanation: |
      An ethical dilemma isn't "right vs wrong" — it's "right vs right" (e.g., loyalty to
      employer vs duty to public safety). Codes of conduct help navigate these.

  - id: stakeholders-example
    format: mcq
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |
      A company wants to sell anonymised user location data to advertisers. The data can be
      re-identified. Who are the key stakeholders?
    options:
      - text: Only the company and the advertisers
        why: |-
          Users are affected — their privacy is at risk.
      - text: Users, the company, advertisers, and regulators
        correct: true
        why: |-
          Users (privacy), company (revenue/reputation), advertisers (data quality), regulators
          (legal compliance) are all stakeholders.
      - text: Only the users whose data is being sold
        why: |-
          The company and regulators also have interests.
      - text: The developers who built the system
        why: |-
          They are affected, but not the only stakeholders.
    explanation: |
      Re-identifiable data affects the people it describes first, but the company carries the legal and reputational risk, the advertisers depend on the data, and regulators enforce data-protection law. A good stakeholder list is wider than the two parties to the deal.

  - id: framework-step
    format: mcq
    difficulty: 2
    objectives: ["7.1.2"]
    prompt: |
      In the 5-step ethical decision framework, what comes immediately after "List the options"?
    options:
      - text: Decide and document
        why: |-
          That's the final step.
      - text: Apply the codes (BCS/IEEE) and the law
        correct: true
        why: |-
          Step 3: check what professional codes and laws say about each option.
      - text: Identify the stakeholders
        why: |-
          That's step 1.
      - text: Weigh consequences
        why: |-
          That's step 4, after applying codes.
    explanation: |
      The framework runs: understand the problem, list the options, then apply the codes (BCS/IEEE) and the law to each option, before deciding and documenting the reasoning.