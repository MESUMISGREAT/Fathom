# Cambridge International AS & A Level Chemistry 9701, syllabus for 2025, 2026 and 2027.
# Transcribed from the official syllabus document (Version 1, published September 2022) and
# checked against it section by section. Objective text is a paraphrase of the official
# learning outcomes; codes match the official numbering (e.g. 3.4.2 = outcome 2 of topic 3.4).
subject:
  code: "9701"
  slug: chemistry
  name: Chemistry
  shortName: Chemistry
  description: "Find out how atoms bond, react and transform, from the structure of a single atom to the design of medicines, plastics and new materials."

syllabus:
  id: 9701-2025-2027
  label: "2025–2027"
  examYears: [2025, 2026, 2027]
  sourceUrl: "https://www.cambridgeinternational.org/Images/664563-2025-2027-syllabus.pdf"
  sourceVersion: "Version 1, published September 2022"
  checkedAt: "2026-10-19"
  wording: paraphrased
  notes: >-
    Sections are the 37 numbered topics of the subject content: 1–22 are AS Level and
    23–37 are A Level only, grouped into the strands Physical, Inorganic and Organic
    chemistry and Analysis exactly as in the content overview. Objective codes match the
    official learning-outcome numbers; lettered sub-parts (a), (b) … are kept inside the
    objective rather than split out. Parenthetical notes and limits are given in guidance,
    and topic-level scope statements (1.3, 1.4) and the functional-group tables (syllabus
    pages 29–30 and 47) are folded into the guidance of the objectives they apply to. AS
    sections list Papers 1 and 2, which are based on the AS content; A Level sections list
    Paper 4, which is based on the A Level content and also requires knowledge of the AS
    content. Practical skills (Papers 3 and 5, Practical assessment section) are not part
    of this content tree.

sections:
  # ===========================================================================
  # AS Level: Physical chemistry
  # ===========================================================================
  - code: "1"
    title: Atomic structure
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "1.1"
        title: Particles in the atom and atomic radius
        objectives:
          - code: "1.1.1"
            text: "Understand that an atom is mostly empty space around a very small, dense nucleus containing protons and neutrons, with electrons found in shells in the empty space around the nucleus."
          - code: "1.1.2"
            text: "Identify and describe protons, neutrons and electrons in terms of their relative charges and relative masses."
          - code: "1.1.3"
            text: "Understand the terms atomic number and proton number; mass number and nucleon number."
          - code: "1.1.4"
            text: "Describe how mass and charge are distributed within an atom."
          - code: "1.1.5"
            text: "Describe the behaviour in an electric field of beams of protons, neutrons and electrons moving at the same velocity."
          - code: "1.1.6"
            text: "Determine the numbers of protons, neutrons and electrons in both atoms and ions, given the atomic (proton) number, mass (nucleon) number and charge."
          - code: "1.1.7"
            text: "State and explain qualitatively how atomic radius and ionic radius vary across a period and down a group."
      - code: "1.2"
        title: Isotopes
        objectives:
          - code: "1.2.1"
            text: "Define the term isotope in terms of numbers of protons and neutrons."
          - code: "1.2.2"
            text: "Understand the isotope notation ˣ_yA, where x (written above) is the mass or nucleon number and y (written below) is the atomic or proton number."
          - code: "1.2.3"
            text: "State that isotopes of the same element have the same chemical properties, and explain why."
          - code: "1.2.4"
            text: "State that isotopes of the same element have different physical properties, limited to mass and density, and explain why."
      - code: "1.3"
        title: Electrons, energy levels and atomic orbitals
        objectives:
          - code: "1.3.1"
            text: "Understand the terms shells, sub-shells and orbitals; principal quantum number (n); and ground state (limited to electronic configuration)."
            guidance: "Scope for all of 1.3: every atom or ion described is in its ground state, and only the elements hydrogen to krypton are assessed."
          - code: "1.3.2"
            text: "Describe the number of orbitals that make up s, p and d sub-shells, and the number of electrons that can fill s, p and d sub-shells."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.3"
            text: "Describe the order of increasing energy of the sub-shells within the first three shells and of the 4s and 4p sub-shells."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.4"
            text: "Describe electronic configurations, including the number of electrons in each shell, sub-shell and orbital."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.5"
            text: "Explain electronic configurations in terms of the energy of the electrons and inter-electron repulsion."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.6"
            text: "Determine the electronic configuration of atoms and ions from the atomic or proton number and charge, using either the full or the shorthand convention."
            guidance: "For example, Fe: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² (full electronic configuration) or [Ar] 3d⁶ 4s² (shorthand electronic configuration). Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.7"
            text: "Understand and use the electrons-in-boxes notation."
            guidance: "For example, Fe drawn as [Ar] followed by five 3d boxes (one holding a spin-paired pair of electrons, four holding one electron each) and a 4s box holding a spin-paired pair, with each electron shown as an arrow. Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.8"
            text: "Describe and sketch the shapes of s and p orbitals."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.3.9"
            text: "Describe a free radical as a species with one or more unpaired electrons."
            guidance: "Scope for all of 1.3: ground-state atoms and ions only; elements hydrogen to krypton only."
      - code: "1.4"
        title: Ionisation energy
        objectives:
          - code: "1.4.1"
            text: "Define and use the term first ionisation energy, IE."
            guidance: "Scope for all of 1.4: every atom or ion described is in its ground state, and only the elements hydrogen to krypton are assessed."
          - code: "1.4.2"
            text: "Construct equations to represent first, second and subsequent ionisation energies."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.3"
            text: "Identify and explain the trends in ionisation energies across a period and down a group of the Periodic Table."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.4"
            text: "Identify and explain the variation in successive ionisation energies of an element."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.5"
            text: "Understand that ionisation energies arise from the attraction between the nucleus and the outer electron."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.6"
            text: "Explain the factors influencing the ionisation energies of elements in terms of nuclear charge, atomic/ionic radius, shielding by inner shells and sub-shells, and spin-pair repulsion."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.7"
            text: "Deduce the electronic configurations of elements from successive ionisation energy data."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."
          - code: "1.4.8"
            text: "Deduce the position of an element in the Periodic Table from successive ionisation energy data."
            guidance: "Scope for all of 1.4: ground-state atoms and ions only; elements hydrogen to krypton only."

  - code: "2"
    title: Atoms, molecules and stoichiometry
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "2.1"
        title: Relative masses of atoms and molecules
        objectives:
          - code: "2.1.1"
            text: "Define the unified atomic mass unit as one twelfth of the mass of a carbon-12 atom."
          - code: "2.1.2"
            text: "Define relative atomic mass, Ar, relative isotopic mass, relative molecular mass, Mr, and relative formula mass in terms of the unified atomic mass unit."
      - code: "2.2"
        title: The mole and the Avogadro constant
        objectives:
          - code: "2.2.1"
            text: "Define and use the term mole in terms of the Avogadro constant."
      - code: "2.3"
        title: Formulas
        objectives:
          - code: "2.3.1"
            text: "Write the formulas of ionic compounds from ionic charges and oxidation numbers (shown by a Roman numeral), including: (a) predicting ionic charge from the position of an element in the Periodic Table; (b) recalling the names and formulas of the ions NO₃⁻, CO₃²⁻, SO₄²⁻, OH⁻, NH₄⁺, Zn²⁺, Ag⁺, HCO₃⁻ and PO₄³⁻."
          - code: "2.3.2"
            text: "(a) Write and construct balanced equations, including ionic equations (which should not include spectator ions); (b) use appropriate state symbols in equations."
          - code: "2.3.3"
            text: "Define and use the terms empirical formula and molecular formula."
          - code: "2.3.4"
            text: "Understand and use the terms anhydrous, hydrated and water of crystallisation."
          - code: "2.3.5"
            text: "Calculate empirical and molecular formulas from given data."
      - code: "2.4"
        title: Reacting masses and volumes (of solutions and gases)
        objectives:
          - code: "2.4.1"
            text: "Perform calculations using the mole concept involving: (a) reacting masses (from formulas and equations), including percentage yield calculations; (b) volumes of gases (e.g. in the burning of hydrocarbons); (c) volumes and concentrations of solutions; (d) limiting reagent and excess reagent; and (e) deduce stoichiometric relationships from calculations such as those in (a)–(d)."
            guidance: "Answers should reflect the number of significant figures given or asked for in the question. When rounding up or down, significant figures should be neither lost unnecessarily nor used beyond what is justified (see also the Mathematical requirements section of the syllabus)."

  - code: "3"
    title: Chemical bonding
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "3.1"
        title: Electronegativity and bonding
        objectives:
          - code: "3.1.1"
            text: "Define electronegativity as the power of an atom to attract electrons to itself."
          - code: "3.1.2"
            text: "Explain the factors influencing the electronegativities of the elements in terms of nuclear charge, atomic radius and shielding by inner shells and sub-shells."
          - code: "3.1.3"
            text: "State and explain the trends in electronegativity across a period and down a group of the Periodic Table."
          - code: "3.1.4"
            text: "Use differences in Pauling electronegativity values to predict whether ionic or covalent bonds are formed."
            guidance: "The presence of covalent character in some ionic compounds will not be assessed. Pauling electronegativity values will be given where necessary."
      - code: "3.2"
        title: Ionic bonding
        objectives:
          - code: "3.2.1"
            text: "Define ionic bonding as the electrostatic attraction between oppositely charged ions (positively charged cations and negatively charged anions)."
          - code: "3.2.2"
            text: "Describe ionic bonding, including the examples of sodium chloride, magnesium oxide and calcium fluoride."
      - code: "3.3"
        title: Metallic bonding
        objectives:
          - code: "3.3.1"
            text: "Define metallic bonding as the electrostatic attraction between positive metal ions and delocalised electrons."
      - code: "3.4"
        title: Covalent bonding and coordinate (dative covalent) bonding
        objectives:
          - code: "3.4.1"
            text: "Define covalent bonding as the electrostatic attraction between the nuclei of two atoms and a shared pair of electrons, and: (a) describe covalent bonding in molecules including hydrogen, H₂, oxygen, O₂, nitrogen, N₂, chlorine, Cl₂, hydrogen chloride, HCl, carbon dioxide, CO₂, ammonia, NH₃, methane, CH₄, ethane, C₂H₆, and ethene, C₂H₄; (b) understand that elements in Period 3 can expand their octet, including in sulfur dioxide, SO₂, phosphorus pentachloride, PCl₅, and sulfur hexafluoride, SF₆; (c) describe coordinate (dative covalent) bonding, including in the reaction of ammonia and hydrogen chloride gases to form the ammonium ion, NH₄⁺, and in the Al₂Cl₆ molecule."
          - code: "3.4.2"
            text: "(a) Describe covalent bonds in terms of orbital overlap giving σ and π bonds: σ bonds form by direct overlap of orbitals between the bonding atoms, and π bonds form by sideways overlap of adjacent p orbitals above and below the σ bond; (b) describe how σ and π bonds form in molecules including H₂, C₂H₆, C₂H₄, HCN and N₂; (c) use the concept of hybridisation to describe sp, sp² and sp³ orbitals."
          - code: "3.4.3"
            text: "(a) Define bond energy as the energy required to break one mole of a particular covalent bond in the gaseous state, and bond length as the internuclear distance of two covalently bonded atoms; (b) use bond energy values and the concept of bond length to compare the reactivity of covalent molecules."
      - code: "3.5"
        title: Shapes of molecules
        objectives:
          - code: "3.5.1"
            text: "State and explain the shapes of, and bond angles in, molecules using VSEPR theory, including as simple examples: BF₃ (trigonal planar, 120°), CO₂ (linear, 180°), CH₄ (tetrahedral, 109.5°), NH₃ (pyramidal, 107°), H₂O (non-linear, 104.5°), SF₆ (octahedral, 90°) and PF₅ (trigonal bipyramidal, 120° and 90°)."
          - code: "3.5.2"
            text: "Predict the shapes of, and bond angles in, molecules and ions analogous to those specified in 3.5.1."
      - code: "3.6"
        title: Intermolecular forces, electronegativity and bond properties
        objectives:
          - code: "3.6.1"
            text: "(a) Describe hydrogen bonding, limited to molecules containing N–H and O–H groups, including ammonia and water as simple examples; (b) use the concept of hydrogen bonding to explain the anomalous properties of H₂O (ice and water): its relatively high melting and boiling points, its relatively high surface tension, and the density of solid ice compared with liquid water."
          - code: "3.6.2"
            text: "Use the concept of electronegativity to explain bond polarity and the dipole moments of molecules."
          - code: "3.6.3"
            text: "(a) Describe van der Waals' forces as the intermolecular forces between molecular entities other than those due to bond formation, and use 'van der Waals' forces' as a generic term for all intermolecular forces; (b) describe the types of van der Waals' forces: instantaneous dipole–induced dipole (id-id) forces, also called London dispersion forces, and permanent dipole–permanent dipole (pd-pd) forces, including hydrogen bonding; (c) describe hydrogen bonding and understand that it is a special case of permanent dipole–permanent dipole forces between molecules in which hydrogen is bonded to a highly electronegative atom."
          - code: "3.6.4"
            text: "State that, in general, ionic, covalent and metallic bonding are stronger than intermolecular forces."
      - code: "3.7"
        title: Dot-and-cross diagrams
        objectives:
          - code: "3.7.1"
            text: "Use dot-and-cross diagrams to illustrate ionic, covalent and coordinate bonding, including representing any of the compounds stated in 3.4 and 3.5."
            guidance: "Dot-and-cross diagrams may include species with atoms that have an expanded octet, or species with an odd number of electrons."

  - code: "4"
    title: States of matter
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "4.1"
        title: "The gaseous state: ideal and real gases and pV = nRT"
        objectives:
          - code: "4.1.1"
            text: "Explain the origin of pressure in a gas in terms of collisions between gas molecules and the wall of the container."
          - code: "4.1.2"
            text: "Understand that ideal gases have zero particle volume and no intermolecular forces of attraction."
          - code: "4.1.3"
            text: "State and use the ideal gas equation pV = nRT in calculations, including in the determination of Mr."
      - code: "4.2"
        title: Bonding and structure
        objectives:
          - code: "4.2.1"
            text: "Describe, in simple terms, the lattice structure of a crystalline solid which is: (a) giant ionic, including sodium chloride and magnesium oxide; (b) simple molecular, including iodine, buckminsterfullerene C₆₀ and ice; (c) giant molecular, including silicon(IV) oxide, graphite and diamond; (d) giant metallic, including copper."
          - code: "4.2.2"
            text: "Describe, interpret and predict the effect of different types of structure and bonding on the physical properties of substances, including melting point, boiling point, electrical conductivity and solubility."
          - code: "4.2.3"
            text: "Deduce the type of structure and bonding present in a substance from given information."

  - code: "5"
    title: Chemical energetics
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "5.1"
        title: Enthalpy change, ΔH
        objectives:
          - code: "5.1.1"
            text: "Understand that chemical reactions are accompanied by enthalpy changes, and that these changes can be exothermic (ΔH is negative) or endothermic (ΔH is positive)."
          - code: "5.1.2"
            text: "Construct and interpret a reaction pathway diagram in terms of the enthalpy change of the reaction and the activation energy."
          - code: "5.1.3"
            text: "Define and use the terms: (a) standard conditions, shown by ⦵; (b) enthalpy change, with particular reference to reaction, ΔHr, formation, ΔHf, combustion, ΔHc, and neutralisation, ΔHneut."
            guidance: "This syllabus takes standard conditions to be 298 K and 101 kPa."
          - code: "5.1.4"
            text: "Understand that energy transfers occur during chemical reactions because chemical bonds are broken and made."
          - code: "5.1.5"
            text: "Use bond energies (ΔH positive, i.e. bond breaking) to calculate the enthalpy change of reaction, ΔHr."
          - code: "5.1.6"
            text: "Understand that some bond energies are exact and some bond energies are averages."
          - code: "5.1.7"
            text: "Calculate enthalpy changes from appropriate experimental results, including the use of the relationships q = mcΔT and ΔH = –mcΔT/n."
      - code: "5.2"
        title: Hess's law
        objectives:
          - code: "5.2.1"
            text: "Apply Hess's law to construct simple energy cycles."
          - code: "5.2.2"
            text: "Carry out calculations using cycles and relevant energy terms, including: (a) determining enthalpy changes that cannot be found by direct experiment; (b) use of bond energy data."

  - code: "6"
    title: Electrochemistry
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "6.1"
        title: "Redox processes: electron transfer and changes in oxidation number (oxidation state)"
        objectives:
          - code: "6.1.1"
            text: "Calculate the oxidation numbers of elements in compounds and ions."
          - code: "6.1.2"
            text: "Use changes in oxidation numbers to help balance chemical equations."
          - code: "6.1.3"
            text: "Explain and use the terms redox, oxidation, reduction and disproportionation in terms of electron transfer and changes in oxidation number."
          - code: "6.1.4"
            text: "Explain and use the terms oxidising agent and reducing agent."
          - code: "6.1.5"
            text: "Use a Roman numeral to indicate the magnitude of the oxidation number of an element."

  - code: "7"
    title: Equilibria
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "7.1"
        title: "Chemical equilibria: reversible reactions, dynamic equilibrium"
        objectives:
          - code: "7.1.1"
            text: "(a) Understand what is meant by a reversible reaction; (b) understand what is meant by dynamic equilibrium, in terms of the rates of the forward and reverse reactions being equal and the concentrations of reactants and products remaining constant; (c) understand that a closed system is needed for dynamic equilibrium to be established."
          - code: "7.1.2"
            text: "Define Le Chatelier's principle as: if a change is made to a system at dynamic equilibrium, the position of equilibrium moves to minimise this change."
          - code: "7.1.3"
            text: "Use Le Chatelier's principle to deduce qualitatively (from appropriate information) the effects of changes in temperature, concentration or pressure, or of the presence of a catalyst, on a system at equilibrium."
          - code: "7.1.4"
            text: "Deduce expressions for equilibrium constants in terms of concentrations, Kc."
          - code: "7.1.5"
            text: "Use the terms mole fraction and partial pressure."
          - code: "7.1.6"
            text: "Deduce expressions for equilibrium constants in terms of partial pressures, Kp."
            guidance: "Use of the relationship between Kp and Kc is not required."
          - code: "7.1.7"
            text: "Use the Kc and Kp expressions to carry out calculations."
            guidance: "Such calculations will not require the solving of quadratic equations."
          - code: "7.1.8"
            text: "Calculate the quantities present at equilibrium, given appropriate data."
          - code: "7.1.9"
            text: "State whether changes in temperature, concentration or pressure, or the presence of a catalyst, affect the value of the equilibrium constant for a reaction."
          - code: "7.1.10"
            text: "Describe and explain the conditions used in the Haber process and the Contact process, as examples of the importance of understanding dynamic equilibrium in the chemical industry and of applying Le Chatelier's principle."
      - code: "7.2"
        title: Brønsted–Lowry theory of acids and bases
        objectives:
          - code: "7.2.1"
            text: "State the names and formulas of the common acids, limited to hydrochloric acid, HCl, sulfuric acid, H₂SO₄, nitric acid, HNO₃, and ethanoic acid, CH₃COOH."
          - code: "7.2.2"
            text: "State the names and formulas of the common alkalis, limited to sodium hydroxide, NaOH, potassium hydroxide, KOH, and ammonia, NH₃."
          - code: "7.2.3"
            text: "Describe the Brønsted–Lowry theory of acids and bases."
          - code: "7.2.4"
            text: "Describe strong acids and strong bases as fully dissociated in aqueous solution, and weak acids and weak bases as partially dissociated in aqueous solution."
          - code: "7.2.5"
            text: "Appreciate that water has a pH of 7, acid solutions a pH below 7 and alkaline solutions a pH above 7."
          - code: "7.2.6"
            text: "Explain qualitatively the differences in behaviour between strong and weak acids, including the reaction with a reactive metal and the difference in pH values shown using a pH meter, universal indicator or conductivity."
          - code: "7.2.7"
            text: "Understand that neutralisation reactions occur when H⁺(aq) and OH⁻(aq) form H₂O(l)."
          - code: "7.2.8"
            text: "Understand that salts are formed in neutralisation reactions."
          - code: "7.2.9"
            text: "Sketch the pH titration curves of titrations using combinations of strong and weak acids with strong and weak alkalis."
          - code: "7.2.10"
            text: "Select suitable indicators for acid–alkali titrations, given appropriate data."
            guidance: "pKa values will not be used."

  - code: "8"
    title: Reaction kinetics
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Physical chemistry
    topics:
      - code: "8.1"
        title: Rate of reaction
        objectives:
          - code: "8.1.1"
            text: "Explain and use the terms rate of reaction, frequency of collisions, effective collisions and non-effective collisions."
          - code: "8.1.2"
            text: "Explain qualitatively, in terms of the frequency of effective collisions, the effect of concentration and pressure changes on the rate of a reaction."
          - code: "8.1.3"
            text: "Use experimental data to calculate the rate of a reaction."
      - code: "8.2"
        title: Effect of temperature on reaction rates and the concept of activation energy
        objectives:
          - code: "8.2.1"
            text: "Define activation energy, EA, as the minimum energy required for a collision to be effective."
          - code: "8.2.2"
            text: "Sketch and use the Boltzmann distribution to explain the significance of activation energy."
          - code: "8.2.3"
            text: "Explain qualitatively, in terms of both the Boltzmann distribution and the frequency of effective collisions, the effect of a temperature change on the rate of a reaction."
      - code: "8.3"
        title: Homogeneous and heterogeneous catalysts
        objectives:
          - code: "8.3.1"
            text: "Explain and use the terms catalyst and catalysis: (a) explain that, in the presence of a catalyst, a reaction has a different mechanism, i.e. one of lower activation energy; (b) explain this catalytic effect in terms of the Boltzmann distribution; (c) construct and interpret a reaction pathway diagram for a reaction in the presence and absence of an effective catalyst."

  # ===========================================================================
  # AS Level: Inorganic chemistry
  # ===========================================================================
  - code: "9"
    title: "The Periodic Table: chemical periodicity"
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Inorganic chemistry
    topics:
      - code: "9.1"
        title: Periodicity of physical properties of the elements in Period 3
        objectives:
          - code: "9.1.1"
            text: "Describe qualitatively (and indicate the periodicity in) the variations in atomic radius, ionic radius, melting point and electrical conductivity of the elements."
          - code: "9.1.2"
            text: "Explain the variation in melting point and electrical conductivity in terms of the structure and bonding of the elements."
      - code: "9.2"
        title: Periodicity of chemical properties of the elements in Period 3
        objectives:
          - code: "9.2.1"
            text: "Describe, and write equations for, the reactions of the elements with oxygen (to give Na₂O, MgO, Al₂O₃, P₄O₁₀, SO₂), chlorine (to give NaCl, MgCl₂, AlCl₃, SiCl₄, PCl₅) and water (Na and Mg only)."
          - code: "9.2.2"
            text: "State and explain the variation in the oxidation number of the oxides (Na₂O, MgO, Al₂O₃, P₄O₁₀, SO₂ and SO₃ only) and chlorides (NaCl, MgCl₂, AlCl₃, SiCl₄, PCl₅ only) in terms of their outer shell (valence shell) electrons."
          - code: "9.2.3"
            text: "Describe, and write equations for, the reactions, if any, of the oxides Na₂O, MgO, Al₂O₃, SiO₂, P₄O₁₀, SO₂ and SO₃ with water, including the likely pHs of the solutions obtained."
          - code: "9.2.4"
            text: "Describe, explain, and write equations for, the acid/base behaviour of the oxides Na₂O, MgO, Al₂O₃, P₄O₁₀, SO₂ and SO₃ and the hydroxides NaOH, Mg(OH)₂ and Al(OH)₃, including, where relevant, amphoteric behaviour in reactions with acids and bases (sodium hydroxide only)."
          - code: "9.2.5"
            text: "Describe, explain, and write equations for, the reactions of the chlorides NaCl, MgCl₂, AlCl₃, SiCl₄ and PCl₅ with water, including the likely pHs of the solutions obtained."
          - code: "9.2.6"
            text: "Explain the variations and trends in 9.2.2, 9.2.3, 9.2.4 and 9.2.5 in terms of bonding and electronegativity."
          - code: "9.2.7"
            text: "Suggest the types of chemical bonding present in the chlorides and oxides from observations of their chemical and physical properties."
      - code: "9.3"
        title: Chemical periodicity of other elements
        objectives:
          - code: "9.3.1"
            text: "Predict the characteristic properties of an element in a given group by using knowledge of chemical periodicity."
          - code: "9.3.2"
            text: "Deduce the nature, possible position in the Periodic Table and identity of unknown elements from given information about their physical and chemical properties."

  - code: "10"
    title: Group 2
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Inorganic chemistry
    topics:
      - code: "10.1"
        title: Similarities and trends in the properties of the Group 2 metals, magnesium to barium, and their compounds
        objectives:
          - code: "10.1.1"
            text: "Describe, and write equations for, the reactions of the elements with oxygen, water and dilute hydrochloric and sulfuric acids."
          - code: "10.1.2"
            text: "Describe, and write equations for, the reactions of the oxides, hydroxides and carbonates with water and with dilute hydrochloric and sulfuric acids."
          - code: "10.1.3"
            text: "Describe, and write equations for, the thermal decomposition of the nitrates and carbonates, including the trend in thermal stabilities."
          - code: "10.1.4"
            text: "Describe, and make predictions from, the trends in physical and chemical properties of the elements involved in the reactions in 10.1.1 and of the compounds involved in 10.1.2, 10.1.3 and 10.1.5."
          - code: "10.1.5"
            text: "State the variation in the solubilities of the hydroxides and sulfates."

  - code: "11"
    title: Group 17
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Inorganic chemistry
    topics:
      - code: "11.1"
        title: Physical properties of the Group 17 elements
        objectives:
          - code: "11.1.1"
            text: "Describe the colours of chlorine, bromine and iodine and the trend in their volatility."
          - code: "11.1.2"
            text: "Describe and explain the trend in the bond strength of the halogen molecules."
          - code: "11.1.3"
            text: "Interpret the volatility of the elements in terms of instantaneous dipole–induced dipole forces."
      - code: "11.2"
        title: The chemical properties of the halogen elements and the hydrogen halides
        objectives:
          - code: "11.2.1"
            text: "Describe the relative reactivity of the elements as oxidising agents."
          - code: "11.2.2"
            text: "Describe the reactions of the elements with hydrogen and explain their relative reactivity in these reactions."
          - code: "11.2.3"
            text: "Describe the relative thermal stabilities of the hydrogen halides and explain them in terms of bond strengths."
      - code: "11.3"
        title: Some reactions of the halide ions
        objectives:
          - code: "11.3.1"
            text: "Describe the relative reactivity of halide ions as reducing agents."
          - code: "11.3.2"
            text: "Describe and explain the reactions of halide ions with: (a) aqueous silver ions followed by aqueous ammonia; (b) concentrated sulfuric acid, including balanced chemical equations."
            guidance: "For (a), the formation and formula of the [Ag(NH₃)₂]⁺ complex are not required."
      - code: "11.4"
        title: The reactions of chlorine
        objectives:
          - code: "11.4.1"
            text: "Describe and interpret, in terms of changes in oxidation number, the reaction of chlorine with cold and with hot aqueous sodium hydroxide, and recognise these as disproportionation reactions."
          - code: "11.4.2"
            text: "Explain, including by use of an equation, the use of chlorine in water purification, including the production of the active species HOCl and ClO⁻, which kill bacteria."

  - code: "12"
    title: Nitrogen and sulfur
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Inorganic chemistry
    topics:
      - code: "12.1"
        title: Nitrogen and sulfur
        objectives:
          - code: "12.1.1"
            text: "Explain the lack of reactivity of nitrogen, with reference to the strength of its triple bond and its lack of polarity."
          - code: "12.1.2"
            text: "Describe and explain: (a) the basicity of ammonia, using the Brønsted–Lowry theory; (b) the structure of the ammonium ion and its formation by an acid–base reaction; (c) the displacement of ammonia from ammonium salts by an acid–base reaction."
          - code: "12.1.3"
            text: "State and explain the natural and man-made occurrences of oxides of nitrogen and their catalytic removal from the exhaust gases of internal combustion engines."
          - code: "12.1.4"
            text: "Understand that atmospheric oxides of nitrogen (NO and NO₂) can react with unburned hydrocarbons to form peroxyacetyl nitrate, PAN, which is a component of photochemical smog."
          - code: "12.1.5"
            text: "Describe the role of NO and NO₂ in the formation of acid rain, both directly and through their catalytic role in the oxidation of atmospheric sulfur dioxide."

  # ===========================================================================
  # AS Level: Organic chemistry
  # ===========================================================================
  - code: "13"
    title: An introduction to AS Level organic chemistry
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "13.1"
        title: Formulas, functional groups and the naming of organic compounds
        objectives:
          - code: "13.1.1"
            text: "Define the term hydrocarbon as a compound made up of C and H atoms only."
          - code: "13.1.2"
            text: "Understand that alkanes are simple hydrocarbons with no functional group."
          - code: "13.1.3"
            text: "Understand that the compounds in the AS functional-group table (syllabus pages 29 and 30) contain a functional group that dictates their physical and chemical properties."
            guidance: "The table lists each homologous series with its functional group and a named example: alkene (C=C bond; propene); halogenoalkane, primary, secondary and tertiary (halogen; 1-chloropropane when X is chlorine); alcohol, primary, secondary and tertiary (hydroxyl; propan-1-ol); aldehyde (carbonyl; propanal); ketone (carbonyl; propanone); carboxylic acid (carboxyl; propanoic acid); ester (ester; methyl propanoate); amine, primary only (amine; propylamine); nitrile (nitrile; propanenitrile). Conventions: X represents a halogen atom; R and R′ represent alkyl groups (or, in some circumstances, a hydrogen atom) and can be the same or different."
          - code: "13.1.4"
            text: "Interpret and use the general, structural, displayed and skeletal formulas of the classes of compound stated in the AS functional-group table (syllabus pages 29 and 30)."
            guidance: "Classes: alkenes, halogenoalkanes, alcohols, aldehydes, ketones, carboxylic acids, esters, primary amines and nitriles."
          - code: "13.1.5"
            text: "Understand and use systematic nomenclature of simple aliphatic organic molecules with the functional groups in the AS functional-group table (syllabus pages 29 and 30), up to six carbon atoms (six plus six for esters; straight chains only for esters and nitriles)."
          - code: "13.1.6"
            text: "Deduce the molecular and/or empirical formula of a compound, given its structural, displayed or skeletal formula."
      - code: "13.2"
        title: Characteristic organic reactions
        objectives:
          - code: "13.2.1"
            text: "Interpret and use the following terminology for types of organic compounds and reactions: (a) homologous series; (b) saturated and unsaturated; (c) homolytic and heterolytic fission; (d) free radical, initiation, propagation, termination; (e) nucleophile, electrophile, nucleophilic, electrophilic; (f) addition, substitution, elimination, hydrolysis, condensation; (g) oxidation and reduction."
            guidance: "In equations for organic redox reactions, [O] can be used to represent one atom of oxygen from an oxidising agent and [H] one atom of hydrogen from a reducing agent."
          - code: "13.2.2"
            text: "Understand and use the following terminology for types of organic mechanism: (a) free-radical substitution; (b) electrophilic addition; (c) nucleophilic substitution; (d) nucleophilic addition."
            guidance: "Curly arrows are expected in organic reaction mechanisms to show the movement of electron pairs; each arrow should begin at a bond or at a lone pair of electrons."
      - code: "13.3"
        title: Shapes of organic molecules; σ and π bonds
        objectives:
          - code: "13.3.1"
            text: "Describe organic molecules as either straight-chained, branched or cyclic."
          - code: "13.3.2"
            text: "Describe and explain the shape of, and bond angles in, molecules containing sp, sp² and sp³ hybridised atoms."
          - code: "13.3.3"
            text: "Describe the arrangement of σ and π bonds in molecules containing sp, sp² and sp³ hybridised atoms."
          - code: "13.3.4"
            text: "Understand and use the term planar when describing the arrangement of atoms in organic molecules, for example ethene."
      - code: "13.4"
        title: "Isomerism: structural isomerism and stereoisomerism"
        objectives:
          - code: "13.4.1"
            text: "Describe structural isomerism and its division into chain, positional and functional group isomerism."
          - code: "13.4.2"
            text: "Describe stereoisomerism and its division into geometrical (cis/trans) and optical isomerism."
            guidance: "Use of E/Z nomenclature is acceptable but is not required."
          - code: "13.4.3"
            text: "Describe geometrical (cis/trans) isomerism in alkenes, and explain its origin in terms of restricted rotation due to the presence of π bonds."
          - code: "13.4.4"
            text: "Explain what is meant by a chiral centre and that such a centre gives rise to two optical isomers (enantiomers)."
            guidance: "Candidates should appreciate that compounds can contain more than one chiral centre, but knowledge of meso compounds, or of nomenclature such as diastereoisomers, is not required."
          - code: "13.4.5"
            text: "Identify chiral centres and geometrical (cis/trans) isomerism in a molecule of given structural formula, including cyclic compounds."
          - code: "13.4.6"
            text: "Deduce the possible isomers for an organic molecule of known molecular formula."

  - code: "14"
    title: Hydrocarbons
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "14.1"
        title: Alkanes
        objectives:
          - code: "14.1.1"
            text: "Recall the reactions (reagents and conditions) by which alkanes can be produced: (a) addition of hydrogen to an alkene in a hydrogenation reaction, H₂(g) with Pt/Ni catalyst and heat; (b) cracking of a longer-chain alkane, heating with Al₂O₃."
          - code: "14.1.2"
            text: "Describe: (a) the complete and incomplete combustion of alkanes; (b) the free-radical substitution of alkanes by Cl₂ or Br₂ in the presence of ultraviolet light, as exemplified by the reactions of ethane."
          - code: "14.1.3"
            text: "Describe the mechanism of free-radical substitution with reference to the initiation, propagation and termination steps."
          - code: "14.1.4"
            text: "Suggest how cracking can be used to obtain more useful alkanes and alkenes of lower Mr from heavier crude oil fractions."
          - code: "14.1.5"
            text: "Understand the general unreactivity of alkanes, including towards polar reagents, in terms of the strength of the C–H bonds and their relative lack of polarity."
          - code: "14.1.6"
            text: "Recognise the environmental consequences of carbon monoxide, oxides of nitrogen and unburnt hydrocarbons arising from the combustion of alkanes in the internal combustion engine, and of their catalytic removal."
      - code: "14.2"
        title: Alkenes
        objectives:
          - code: "14.2.1"
            text: "Recall the reactions (including reagents and conditions) by which alkenes can be produced: (a) elimination of HX from a halogenoalkane by ethanolic NaOH and heat; (b) dehydration of an alcohol, using a heated catalyst (e.g. Al₂O₃) or a concentrated acid (e.g. concentrated H₂SO₄); (c) cracking of a longer-chain alkane."
          - code: "14.2.2"
            text: "Describe the following reactions of alkenes: (a) the electrophilic addition of (i) hydrogen in a hydrogenation reaction, H₂(g) with Pt/Ni catalyst and heat, (ii) steam, H₂O(g) with H₃PO₄ catalyst, (iii) a hydrogen halide, HX(g), at room temperature, (iv) a halogen, X₂; (b) oxidation by cold dilute acidified KMnO₄ to form the diol; (c) oxidation by hot concentrated acidified KMnO₄, which breaks the carbon–carbon double bond, and using the identities of the products to determine the position of alkene linkages in larger molecules; (d) addition polymerisation, as exemplified by the reactions of ethene and propene."
          - code: "14.2.3"
            text: "Describe the use of aqueous bromine to show the presence of a C=C bond."
          - code: "14.2.4"
            text: "Describe the mechanism of electrophilic addition in alkenes, using bromine with ethene and hydrogen bromide with propene as examples."
          - code: "14.2.5"
            text: "Describe and explain the inductive effects of alkyl groups on the stability of the primary, secondary and tertiary cations formed during electrophilic addition, and use this to explain Markovnikov addition."

  - code: "15"
    title: Halogen compounds
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "15.1"
        title: Halogenoalkanes
        objectives:
          - code: "15.1.1"
            text: "Recall the reactions (reagents and conditions) by which halogenoalkanes can be produced: (a) free-radical substitution of alkanes by Cl₂ or Br₂ in the presence of ultraviolet light, as exemplified by the reactions of ethane; (b) electrophilic addition of a halogen, X₂, or a hydrogen halide, HX(g), to an alkene at room temperature; (c) substitution of an alcohol, e.g. by reaction with HX(g); or with KCl and concentrated H₂SO₄ or concentrated H₃PO₄; or with PCl₃ and heat; or with PCl₅; or with SOCl₂."
          - code: "15.1.2"
            text: "Classify halogenoalkanes as primary, secondary and tertiary."
          - code: "15.1.3"
            text: "Describe the following nucleophilic substitution reactions: (a) with NaOH(aq) and heat to produce an alcohol; (b) with KCN in ethanol and heat to produce a nitrile; (c) with NH₃ in ethanol heated under pressure to produce an amine; (d) with aqueous silver nitrate in ethanol as a method of identifying the halogen present, as exemplified by bromoethane."
          - code: "15.1.4"
            text: "Describe the elimination reaction with NaOH in ethanol and heat to produce an alkene, as exemplified by bromoethane."
          - code: "15.1.5"
            text: "Describe the SN1 and SN2 mechanisms of nucleophilic substitution in halogenoalkanes, including the inductive effects of alkyl groups."
          - code: "15.1.6"
            text: "Recall that primary halogenoalkanes tend to react by the SN2 mechanism, tertiary halogenoalkanes by the SN1 mechanism, and secondary halogenoalkanes by a mixture of the two, depending on structure."
          - code: "15.1.7"
            text: "Describe and explain the different reactivities of halogenoalkanes, with particular reference to the relative strengths of the C–X bonds, as exemplified by the reactions of halogenoalkanes with aqueous silver nitrate."

  - code: "16"
    title: Hydroxy compounds
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "16.1"
        title: Alcohols
        objectives:
          - code: "16.1.1"
            text: "Recall the reactions (reagents and conditions) by which alcohols can be produced: (a) electrophilic addition of steam to an alkene, H₂O(g) with H₃PO₄ catalyst; (b) reaction of alkenes with cold dilute acidified potassium manganate(VII) to form a diol; (c) substitution of a halogenoalkane using NaOH(aq) and heat; (d) reduction of an aldehyde or ketone using NaBH₄ or LiAlH₄; (e) reduction of a carboxylic acid using LiAlH₄; (f) hydrolysis of an ester using dilute acid or dilute alkali and heat."
          - code: "16.1.2"
            text: "Describe: (a) the reaction with oxygen (combustion); (b) substitution to form halogenoalkanes, e.g. by reaction with HX(g); or with KCl and concentrated H₂SO₄ or concentrated H₃PO₄; or with PCl₃ and heat; or with PCl₅; or with SOCl₂; (c) the reaction with Na(s); (d) oxidation with acidified K₂Cr₂O₇ or acidified KMnO₄ to (i) carbonyl compounds by distillation and (ii) carboxylic acids by refluxing; (e) dehydration to an alkene, using a heated catalyst, e.g. Al₂O₃, or a concentrated acid; (f) formation of esters by reaction with carboxylic acids with concentrated H₂SO₄ as catalyst, as exemplified by ethanol."
            guidance: "For (d): primary alcohols give aldehydes, which can be further oxidised to carboxylic acids; secondary alcohols give ketones; tertiary alcohols cannot be oxidised."
          - code: "16.1.3"
            text: "(a) Classify alcohols as primary, secondary and tertiary, including examples with more than one alcohol group; (b) state characteristic distinguishing reactions, e.g. mild oxidation with acidified K₂Cr₂O₇, with a colour change from orange to green."
          - code: "16.1.4"
            text: "Deduce the presence of a CH₃CH(OH)– group in an alcohol, CH₃CH(OH)–R, from its reaction with alkaline I₂(aq) to form a yellow precipitate of tri-iodomethane and an ion, RCO₂⁻."
          - code: "16.1.5"
            text: "Explain the acidity of alcohols compared with water."

  - code: "17"
    title: Carbonyl compounds
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "17.1"
        title: Aldehydes and ketones
        objectives:
          - code: "17.1.1"
            text: "Recall the reactions (reagents and conditions) by which aldehydes and ketones can be produced: (a) oxidation of primary alcohols using acidified K₂Cr₂O₇ or acidified KMnO₄ and distillation to produce aldehydes; (b) oxidation of secondary alcohols using acidified K₂Cr₂O₇ or acidified KMnO₄ and distillation to produce ketones."
          - code: "17.1.2"
            text: "Describe: (a) the reduction of aldehydes and ketones using NaBH₄ or LiAlH₄ to produce alcohols; (b) the reaction of aldehydes and ketones with HCN, KCN as catalyst, and heat to produce hydroxynitriles, as exemplified by ethanal and propanone."
          - code: "17.1.3"
            text: "Describe the mechanism of the nucleophilic addition reactions of hydrogen cyanide with aldehydes and ketones in 17.1.2(b)."
          - code: "17.1.4"
            text: "Describe the use of 2,4-dinitrophenylhydrazine (2,4-DNPH reagent) to detect the presence of carbonyl compounds."
          - code: "17.1.5"
            text: "Deduce the nature (aldehyde or ketone) of an unknown carbonyl compound from the results of simple tests (Fehling's and Tollens' reagents; ease of oxidation)."
          - code: "17.1.6"
            text: "Deduce the presence of a CH₃CO– group in an aldehyde or ketone, CH₃CO–R, from its reaction with alkaline I₂(aq) to form a yellow precipitate of tri-iodomethane and an ion, RCO₂⁻."

  - code: "18"
    title: Carboxylic acids and derivatives
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "18.1"
        title: Carboxylic acids
        objectives:
          - code: "18.1.1"
            text: "Recall the reactions by which carboxylic acids can be produced: (a) oxidation of primary alcohols and aldehydes with acidified K₂Cr₂O₇ or acidified KMnO₄ and refluxing; (b) hydrolysis of nitriles with dilute acid or dilute alkali followed by acidification; (c) hydrolysis of esters with dilute acid or dilute alkali and heat followed by acidification."
          - code: "18.1.2"
            text: "Describe: (a) the redox reaction with reactive metals to produce a salt and H₂(g); (b) the neutralisation reaction with alkalis to produce a salt and H₂O(l); (c) the acid–base reaction with carbonates to produce a salt, H₂O(l) and CO₂(g); (d) esterification with alcohols with concentrated H₂SO₄ as catalyst; (e) reduction by LiAlH₄ to form a primary alcohol."
      - code: "18.2"
        title: Esters
        objectives:
          - code: "18.2.1"
            text: "Recall the reaction (reagents and conditions) by which esters can be produced: (a) the condensation reaction between an alcohol and a carboxylic acid with concentrated H₂SO₄ as catalyst."
          - code: "18.2.2"
            text: "Describe the hydrolysis of esters by dilute acid and by dilute alkali and heat."

  - code: "19"
    title: Nitrogen compounds
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "19.1"
        title: Primary amines
        objectives:
          - code: "19.1.1"
            text: "Recall the reactions by which amines can be produced: (a) reaction of a halogenoalkane with NH₃ in ethanol heated under pressure."
            guidance: "Classification of amines will not be tested at AS Level."
      - code: "19.2"
        title: Nitriles and hydroxynitriles
        objectives:
          - code: "19.2.1"
            text: "Recall the reactions by which nitriles can be produced: (a) reaction of a halogenoalkane with KCN in ethanol and heat."
          - code: "19.2.2"
            text: "Recall the reactions by which hydroxynitriles can be produced: (a) the reaction of aldehydes and ketones with HCN, KCN as catalyst, and heat."
          - code: "19.2.3"
            text: "Describe the hydrolysis of nitriles with dilute acid or dilute alkali followed by acidification to produce a carboxylic acid."

  - code: "20"
    title: Polymerisation
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "20.1"
        title: Addition polymerisation
        objectives:
          - code: "20.1.1"
            text: "Describe addition polymerisation as exemplified by poly(ethene) and poly(chloroethene), PVC."
          - code: "20.1.2"
            text: "Deduce the repeat unit of an addition polymer obtained from a given monomer."
          - code: "20.1.3"
            text: "Identify the monomer(s) present in a given section of an addition polymer molecule."
          - code: "20.1.4"
            text: "Recognise the difficulty of disposing of poly(alkene)s, i.e. their non-biodegradability and harmful combustion products."

  - code: "21"
    title: Organic synthesis
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Organic chemistry
    topics:
      - code: "21.1"
        title: Organic synthesis
        objectives:
          - code: "21.1.1"
            text: "For an organic molecule containing several functional groups: (a) identify the organic functional groups using the reactions in the syllabus; (b) predict properties and reactions."
          - code: "21.1.2"
            text: "Devise multi-step synthetic routes for preparing organic molecules using the reactions in the syllabus."
          - code: "21.1.3"
            text: "Analyse a given synthetic route in terms of the type of reaction and the reagents used for each step, and possible by-products."

  # ===========================================================================
  # AS Level: Analysis
  # ===========================================================================
  - code: "22"
    title: Analytical techniques
    level: AS
    papers: ["Paper 1", "Paper 2"]
    strand: Analysis
    topics:
      - code: "22.1"
        title: Infrared spectroscopy
        objectives:
          - code: "22.1.1"
            text: "Analyse an infrared spectrum of a simple molecule to identify functional groups."
            guidance: "The functional groups required are those in the Data section table of characteristic infrared absorptions (wavenumber ranges in cm⁻¹): C–O in hydroxy and ester groups, 1040–1300; C=C in aromatic compounds and alkenes, 1500–1680; C=O in amides 1640–1690, in carbonyl and carboxyl groups 1670–1740, in esters 1710–1750; C≡N in nitriles, 2200–2250; C–H in alkanes, 2850–2950; N–H in amines and amides, 3300–3500; O–H in carboxyl groups 2500–3000 and in hydroxy groups 3200–3600."
      - code: "22.2"
        title: Mass spectrometry
        objectives:
          - code: "22.2.1"
            text: "Analyse mass spectra in terms of m/e values and isotopic abundances."
            guidance: "Knowledge of the working of the mass spectrometer is not required."
          - code: "22.2.2"
            text: "Calculate the relative atomic mass of an element from the relative abundances of its isotopes, or from its mass spectrum."
          - code: "22.2.3"
            text: "Deduce the molecular mass of an organic molecule from the molecular ion peak in a mass spectrum."
          - code: "22.2.4"
            text: "Suggest the identity of molecules formed by simple fragmentation in a given mass spectrum."
          - code: "22.2.5"
            text: "Deduce the number of carbon atoms, n, in a compound using the [M + 1]⁺ peak and the formula n = (100 × abundance of [M + 1]⁺ ion) / (1.1 × abundance of M⁺ ion)."
          - code: "22.2.6"
            text: "Deduce the presence of bromine and chlorine atoms in a compound using the [M + 2]⁺ peak."

  # ===========================================================================
  # A Level: Physical chemistry
  # ===========================================================================
  - code: "23"
    title: Chemical energetics
    level: A
    papers: ["Paper 4"]
    strand: Physical chemistry
    topics:
      - code: "23.1"
        title: Lattice energy and Born–Haber cycles
        objectives:
          - code: "23.1.1"
            text: "Define and use the terms: (a) enthalpy change of atomisation, ΔHat; (b) lattice energy, ΔHlatt (the change from gas-phase ions to a solid lattice)."
          - code: "23.1.2"
            text: "(a) Define and use the term first electron affinity, EA; (b) explain the factors affecting the electron affinities of elements; (c) describe and explain the trends in the electron affinities of the Group 16 and Group 17 elements."
          - code: "23.1.3"
            text: "Construct and use Born–Haber cycles for ionic solids."
            guidance: "Limited to +1 and +2 cations and –1 and –2 anions."
          - code: "23.1.4"
            text: "Carry out calculations involving Born–Haber cycles."
          - code: "23.1.5"
            text: "Explain, in qualitative terms, the effect of ionic charge and of ionic radius on the numerical magnitude of a lattice energy."
      - code: "23.2"
        title: Enthalpies of solution and hydration
        objectives:
          - code: "23.2.1"
            text: "Define and use the term enthalpy change with reference to hydration, ΔHhyd, and solution, ΔHsol."
          - code: "23.2.2"
            text: "Construct and use an energy cycle involving enthalpy change of solution, lattice energy and enthalpy change of hydration."
          - code: "23.2.3"
            text: "Carry out calculations involving the energy cycles in 23.2.2."
          - code: "23.2.4"
            text: "Explain, in qualitative terms, the effect of ionic charge and of ionic radius on the numerical magnitude of an enthalpy change of hydration."
      - code: "23.3"
        title: Entropy change, ΔS
        objectives:
          - code: "23.3.1"
            text: "Define the term entropy, S, as the number of possible arrangements of the particles and their energy in a given system."
          - code: "23.3.2"
            text: "Predict and explain the sign of the entropy changes that occur: (a) during a change in state, e.g. melting, boiling and dissolving (and their reverse); (b) during a temperature change; (c) during a reaction in which there is a change in the number of gaseous molecules."
          - code: "23.3.3"
            text: "Calculate the entropy change for a reaction, ΔS, given the standard entropies, S⦵, of the reactants and products, using ΔS⦵ = ΣS⦵(products) – ΣS⦵(reactants)."
            guidance: "Use of ΔS⦵ = ΔS⦵surr + ΔS⦵sys is not required."
      - code: "23.4"
        title: Gibbs free energy change, ΔG
        objectives:
          - code: "23.4.1"
            text: "State and use the Gibbs equation ΔG⦵ = ΔH⦵ – TΔS⦵."
          - code: "23.4.2"
            text: "Perform calculations using the equation ΔG⦵ = ΔH⦵ – TΔS⦵."
          - code: "23.4.3"
            text: "State whether a reaction or process will be feasible by using the sign of ΔG."
          - code: "23.4.4"
            text: "Predict the effect of temperature change on the feasibility of a reaction, given standard enthalpy and entropy changes."

  - code: "24"
    title: Electrochemistry
    level: A
    papers: ["Paper 4"]
    strand: Physical chemistry
    topics:
      - code: "24.1"
        title: Electrolysis
        objectives:
          - code: "24.1.1"
            text: "Predict the identities of the substances liberated during electrolysis from the state of the electrolyte (molten or aqueous), position in the redox series (electrode potential) and concentration."
          - code: "24.1.2"
            text: "State and apply the relationship F = Le between the Faraday constant, F, the Avogadro constant, L, and the charge on the electron, e."
          - code: "24.1.3"
            text: "Calculate: (a) the quantity of charge passed during electrolysis, using Q = It; (b) the mass and/or volume of substance liberated during electrolysis."
          - code: "24.1.4"
            text: "Describe the determination of a value of the Avogadro constant by an electrolytic method."
      - code: "24.2"
        title: Standard electrode potentials E⦵, standard cell potentials E⦵cell and the Nernst equation
        objectives:
          - code: "24.2.1"
            text: "Define the terms: (a) standard electrode (reduction) potential; (b) standard cell potential."
          - code: "24.2.2"
            text: "Describe the standard hydrogen electrode."
          - code: "24.2.3"
            text: "Describe methods used to measure the standard electrode potentials of: (a) metals or non-metals in contact with their ions in aqueous solution; (b) ions of the same element in different oxidation states."
          - code: "24.2.4"
            text: "Calculate a standard cell potential by combining two standard electrode potentials."
          - code: "24.2.5"
            text: "Use standard cell potentials to: (a) deduce the polarity of each electrode and hence explain/deduce the direction of electron flow in the external circuit of a simple cell; (b) predict the feasibility of a reaction."
          - code: "24.2.6"
            text: "Deduce from E⦵ values the relative reactivity of elements, compounds and ions as oxidising agents or as reducing agents."
          - code: "24.2.7"
            text: "Construct redox equations using the relevant half-equations."
          - code: "24.2.8"
            text: "Predict qualitatively how the value of an electrode potential, E, varies with the concentrations of the aqueous ions."
          - code: "24.2.9"
            text: "Use the Nernst equation, e.g. E = E⦵ + (0.059/z) log([oxidised species]/[reduced species]), to predict quantitatively how the value of an electrode potential varies with the concentrations of the aqueous ions."
            guidance: "Examples include Cu²⁺(aq) + 2e⁻ ⇌ Cu(s) and Fe³⁺(aq) + e⁻ ⇌ Fe²⁺(aq)."
          - code: "24.2.10"
            text: "Understand and use the equation ΔG⦵ = –nE⦵cell F."

  - code: "25"
    title: Equilibria
    level: A
    papers: ["Paper 4"]
    strand: Physical chemistry
    topics:
      - code: "25.1"
        title: Acids and bases
        objectives:
          - code: "25.1.1"
            text: "Understand and use the terms conjugate acid and conjugate base."
          - code: "25.1.2"
            text: "Define conjugate acid–base pairs, identifying such pairs in reactions."
          - code: "25.1.3"
            text: "Define mathematically the terms pH, Ka, pKa and Kw and use them in calculations."
            guidance: "Kb and the equation Kw = Ka × Kb will not be tested."
          - code: "25.1.4"
            text: "Calculate [H⁺(aq)] and pH values for: (a) strong acids; (b) strong alkalis; (c) weak acids."
          - code: "25.1.5"
            text: "(a) Define a buffer solution; (b) explain how a buffer solution can be made; (c) explain how buffer solutions control pH, using chemical equations in these explanations; (d) describe and explain the uses of buffer solutions, including the role of HCO₃⁻ in controlling pH in blood."
          - code: "25.1.6"
            text: "Calculate the pH of buffer solutions, given appropriate data."
          - code: "25.1.7"
            text: "Understand and use the term solubility product, Ksp."
          - code: "25.1.8"
            text: "Write an expression for Ksp."
          - code: "25.1.9"
            text: "Calculate Ksp from concentrations and vice versa."
          - code: "25.1.10"
            text: "(a) Understand and use the common ion effect to explain the different solubility of a compound in a solution containing a common ion; (b) perform calculations using Ksp values and the concentration of a common ion."
      - code: "25.2"
        title: Partition coefficients
        objectives:
          - code: "25.2.1"
            text: "State what is meant by the term partition coefficient, Kpc."
          - code: "25.2.2"
            text: "Calculate and use a partition coefficient for a system in which the solute is in the same physical state in the two solvents."
          - code: "25.2.3"
            text: "Understand the factors affecting the numerical value of a partition coefficient in terms of the polarities of the solute and the solvents used."

  - code: "26"
    title: Reaction kinetics
    level: A
    papers: ["Paper 4"]
    strand: Physical chemistry
    topics:
      - code: "26.1"
        title: Simple rate equations, orders of reaction and rate constants
        objectives:
          - code: "26.1.1"
            text: "Explain and use the terms rate equation, order of reaction, overall order of reaction, rate constant, half-life, rate-determining step and intermediate."
          - code: "26.1.2"
            text: "(a) Understand and use rate equations of the form rate = k[A]ᵐ[B]ⁿ (for which m and n are 0, 1 or 2); (b) deduce the order of a reaction from concentration–time graphs or from experimental data relating to the initial rates method and the half-life method; (c) interpret experimental data in graphical form, including concentration–time and rate–concentration graphs; (d) calculate an initial rate using concentration data; (e) construct a rate equation."
          - code: "26.1.3"
            text: "(a) Show understanding that the half-life of a first-order reaction is independent of concentration; (b) use the half-life of a first-order reaction in calculations."
          - code: "26.1.4"
            text: "Calculate the numerical value of a rate constant, for example by: (a) using the initial rates and the rate equation; (b) using the half-life, t½, and the equation k = 0.693/t½."
          - code: "26.1.5"
            text: "For a multi-step reaction: (a) suggest a reaction mechanism that is consistent with the rate equation and the equation for the overall reaction; (b) predict the order that would result from a given reaction mechanism and rate-determining step; (c) deduce a rate equation using a given reaction mechanism and rate-determining step for a given reaction; (d) identify an intermediate or catalyst from a given reaction mechanism; (e) identify the rate-determining step from a rate equation and a given reaction mechanism."
          - code: "26.1.6"
            text: "Describe qualitatively the effect of temperature change on the rate constant and hence on the rate of a reaction."
      - code: "26.2"
        title: Homogeneous and heterogeneous catalysts
        objectives:
          - code: "26.2.1"
            text: "Explain that catalysts can be homogeneous or heterogeneous."
          - code: "26.2.2"
            text: "Describe the mode of action of a heterogeneous catalyst, including adsorption of reactants, bond weakening and desorption of products, for example: (a) iron in the Haber process; (b) palladium, platinum and rhodium in the catalytic removal of oxides of nitrogen from the exhaust gases of car engines."
          - code: "26.2.3"
            text: "Describe the mode of action of a homogeneous catalyst, which is used in one step and reformed in a later step, for example: (a) atmospheric oxides of nitrogen in the oxidation of atmospheric sulfur dioxide; (b) Fe²⁺ or Fe³⁺ in the I⁻/S₂O₈²⁻ reaction."

  # ===========================================================================
  # A Level: Inorganic chemistry
  # ===========================================================================
  - code: "27"
    title: Group 2
    level: A
    papers: ["Paper 4"]
    strand: Inorganic chemistry
    topics:
      - code: "27.1"
        title: Similarities and trends in the properties of the Group 2 metals, magnesium to barium, and their compounds
        objectives:
          - code: "27.1.1"
            text: "Describe and explain qualitatively the trend in the thermal stability of the nitrates and carbonates, including the effect of ionic radius on the polarisation of the large anion."
          - code: "27.1.2"
            text: "Describe and explain qualitatively the variation in solubility, and in enthalpy change of solution, ΔH⦵sol, of the hydroxides and sulfates in terms of the relative magnitudes of the enthalpy change of hydration and the lattice energy."

  - code: "28"
    title: Chemistry of transition elements
    level: A
    papers: ["Paper 4"]
    strand: Inorganic chemistry
    topics:
      - code: "28.1"
        title: General physical and chemical properties of the first row of transition elements, titanium to copper
        objectives:
          - code: "28.1.1"
            text: "Define a transition element as a d-block element which forms one or more stable ions with incomplete d orbitals."
          - code: "28.1.2"
            text: "Sketch the shape of a 3dxy orbital and a 3dz² orbital."
          - code: "28.1.3"
            text: "Understand that transition elements have the following properties: (a) they have variable oxidation states; (b) they behave as catalysts; (c) they form complex ions; (d) they form coloured compounds."
          - code: "28.1.4"
            text: "Explain why transition elements have variable oxidation states in terms of the similarity in energy of the 3d and 4s sub-shells."
          - code: "28.1.5"
            text: "Explain why transition elements behave as catalysts in terms of having more than one stable oxidation state, and vacant d orbitals that are energetically accessible and can form dative bonds with ligands."
          - code: "28.1.6"
            text: "Explain why transition elements form complex ions in terms of vacant d orbitals that are energetically accessible."
      - code: "28.2"
        title: General characteristic chemical properties of the first set of transition elements, titanium to copper
        objectives:
          - code: "28.2.1"
            text: "Describe and explain the reactions of transition elements with ligands to form complexes, including the complexes of copper(II) and cobalt(II) ions with water and ammonia molecules and hydroxide and chloride ions."
          - code: "28.2.2"
            text: "Define the term ligand as a species that contains a lone pair of electrons that forms a dative covalent bond to a central metal atom/ion."
          - code: "28.2.3"
            text: "Understand and use the terms: (a) monodentate ligand, including as examples H₂O, NH₃, Cl⁻ and CN⁻; (b) bidentate ligand, including as examples 1,2-diaminoethane, en, H₂NCH₂CH₂NH₂, and the ethanedioate ion, C₂O₄²⁻; (c) polydentate ligand, including as an example EDTA⁴⁻."
          - code: "28.2.4"
            text: "Define the term complex as a molecule or ion formed by a central metal atom/ion surrounded by one or more ligands."
          - code: "28.2.5"
            text: "Describe the geometry (shape and bond angles) of transition element complexes that are linear, square planar, tetrahedral or octahedral."
          - code: "28.2.6"
            text: "(a) State what is meant by coordination number; (b) predict the formula and charge of a complex ion, given the metal ion, its charge or oxidation state, the ligand and its coordination number or geometry."
          - code: "28.2.7"
            text: "Explain qualitatively that ligand exchange can occur, including the complexes of copper(II) ions and cobalt(II) ions with water and ammonia molecules and hydroxide and chloride ions."
          - code: "28.2.8"
            text: "Predict, using E⦵ values, the feasibility of redox reactions involving transition elements and their ions."
          - code: "28.2.9"
            text: "Describe the reactions of, and perform calculations involving: (a) MnO₄⁻/C₂O₄²⁻ in acid solution, given suitable data; (b) MnO₄⁻/Fe²⁺ in acid solution, given suitable data; (c) Cu²⁺/I⁻, given suitable data."
          - code: "28.2.10"
            text: "Perform calculations involving other redox systems, given suitable data."
      - code: "28.3"
        title: Colour of complexes
        objectives:
          - code: "28.3.1"
            text: "Define and use the terms degenerate and non-degenerate d orbitals."
          - code: "28.3.2"
            text: "Describe the splitting of degenerate d orbitals into two non-degenerate sets of d orbitals of higher energy, and the use of ΔE, in: (a) octahedral complexes, with two higher and three lower d orbitals; (b) tetrahedral complexes, with three higher and two lower d orbitals."
          - code: "28.3.3"
            text: "Explain why transition elements form coloured compounds in terms of the frequency of light absorbed as an electron is promoted between two non-degenerate d orbitals."
          - code: "28.3.4"
            text: "Describe, in qualitative terms, the effects of different ligands on ΔE, on the frequency of light absorbed, and hence on the complementary colour that is observed."
          - code: "28.3.5"
            text: "Use the complexes of copper(II) ions and cobalt(II) ions with water and ammonia molecules and hydroxide and chloride ions as examples of ligand exchange affecting the colour observed."
      - code: "28.4"
        title: Stereoisomerism in transition element complexes
        objectives:
          - code: "28.4.1"
            text: "Describe the types of stereoisomerism shown by complexes, including those associated with bidentate ligands: (a) geometrical (cis/trans) isomerism, e.g. square planar such as [Pt(NH₃)₂Cl₂] and octahedral such as [Co(NH₃)₄(H₂O)₂]²⁺ and [Ni(H₂NCH₂CH₂NH₂)₂(H₂O)₂]²⁺; (b) optical isomerism, e.g. [Ni(H₂NCH₂CH₂NH₂)₃]²⁺ and [Ni(H₂NCH₂CH₂NH₂)₂(H₂O)₂]²⁺."
          - code: "28.4.2"
            text: "Deduce the overall polarity of complexes such as those described in 28.4.1(a) and 28.4.1(b)."
      - code: "28.5"
        title: Stability constants, Kstab
        objectives:
          - code: "28.5.1"
            text: "Define the stability constant, Kstab, of a complex as the equilibrium constant for the formation of the complex ion in a solvent (from its constituent ions or molecules)."
          - code: "28.5.2"
            text: "Write an expression for the Kstab of a complex."
            guidance: "[H₂O] should not be included in the expression."
          - code: "28.5.3"
            text: "Use Kstab expressions to perform calculations."
          - code: "28.5.4"
            text: "Describe and explain ligand exchanges in terms of Kstab values, and understand that a large Kstab is due to the formation of a stable complex ion."

  # ===========================================================================
  # A Level: Organic chemistry
  # ===========================================================================
  - code: "29"
    title: An introduction to A Level organic chemistry
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "29.1"
        title: Formulas, functional groups and the naming of organic compounds
        objectives:
          - code: "29.1.1"
            text: "Understand that the compounds in the A Level functional-group table (syllabus page 47) contain a functional group that dictates their physical and chemical properties."
            guidance: "The table lists each homologous series with its functional group and a named example: arene (arene; benzene); halogenoarene (halogen; chlorobenzene when X = Cl); phenol (phenol; phenol); acyl chloride (acyl chloride; propanoyl chloride); amines, secondary and tertiary (amine; naming of secondary and tertiary amines is not required); amide, primary, secondary and tertiary (amide; propanamide); amino acid (amine and carboxyl; 2-aminoethanoic acid)."
          - code: "29.1.2"
            text: "Interpret and use the general, structural, displayed and skeletal formulas of the classes of compound stated in the A Level functional-group table (syllabus page 47)."
            guidance: "Classes: arenes, halogenoarenes, phenols, acyl chlorides, secondary and tertiary amines, amides and amino acids. Where a benzene ring is part of the molecule, a displayed formula would not be expected to be drawn."
          - code: "29.1.3"
            text: "Understand and use systematic nomenclature of simple aliphatic organic molecules (including cyclic compounds containing a single ring of up to six carbon atoms) with the functional groups in the A Level functional-group table (syllabus page 47), up to six carbon atoms (six plus six for esters and amides; straight chains only for esters and nitriles)."
          - code: "29.1.4"
            text: "Understand and use systematic nomenclature of simple aromatic molecules with one benzene ring and one or more simple substituents, for example 3-nitrobenzoic acid or 2,4,6-tribromophenol."
      - code: "29.2"
        title: Characteristic organic reactions
        objectives:
          - code: "29.2.1"
            text: "Understand and use the following terminology for types of organic mechanism: (a) electrophilic substitution; (b) addition–elimination."
      - code: "29.3"
        title: Shapes of aromatic organic molecules; σ and π bonds
        objectives:
          - code: "29.3.1"
            text: "Describe and explain the shape of benzene and other aromatic molecules, including sp² hybridisation, in terms of σ bonds and a delocalised π system."
      - code: "29.4"
        title: "Isomerism: optical"
        objectives:
          - code: "29.4.1"
            text: "Understand that enantiomers have identical physical and chemical properties apart from their ability to rotate plane-polarised light and their potential biological activity."
          - code: "29.4.2"
            text: "Understand and use the terms optically active and racemic mixture."
          - code: "29.4.3"
            text: "Describe the effect on plane-polarised light of the two optical isomers of a single substance."
          - code: "29.4.4"
            text: "Explain the relevance of chirality to the synthetic preparation of drug molecules, including: (a) the potential different biological activity of the two enantiomers; (b) the need to separate a racemic mixture into two pure enantiomers; (c) the use of chiral catalysts to produce a single pure optical isomer."
            guidance: "Candidates should appreciate that compounds can contain more than one chiral centre, but knowledge of meso compounds and of nomenclature such as diastereoisomers is not required."

  - code: "30"
    title: Hydrocarbons
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "30.1"
        title: Arenes
        objectives:
          - code: "30.1.1"
            text: "Describe the chemistry of arenes as exemplified by the following reactions of benzene and methylbenzene: (a) substitution reactions with Cl₂ and with Br₂ in the presence of a catalyst, AlCl₃ or AlBr₃, to form halogenoarenes (aryl halides); (b) nitration with a mixture of concentrated HNO₃ and concentrated H₂SO₄ at a temperature between 25 °C and 60 °C; (c) Friedel–Crafts alkylation by CH₃Cl and AlCl₃ and heat; (d) Friedel–Crafts acylation by CH₃COCl and AlCl₃ and heat; (e) complete oxidation of the side-chain using hot alkaline KMnO₄ and then dilute acid to give a benzoic acid; (f) hydrogenation of the benzene ring using H₂ and Pt/Ni catalyst and heat to form a cyclohexane ring."
          - code: "30.1.2"
            text: "Describe the mechanism of electrophilic substitution in arenes: (a) as exemplified by the formation of nitrobenzene and bromobenzene; (b) with regard to the effect of delocalisation (aromatic stabilisation) of electrons in arenes, to explain why substitution predominates over addition."
          - code: "30.1.3"
            text: "Predict whether halogenation will occur in the side-chain or in the aromatic ring of arenes, depending on the reaction conditions."
          - code: "30.1.4"
            text: "Describe that, in the electrophilic substitution of arenes, different substituents direct to different ring positions (limited to the directing effects of –NH₂, –OH, –R, –NO₂, –COOH and –COR)."

  - code: "31"
    title: Halogen compounds
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "31.1"
        title: Halogen compounds
        objectives:
          - code: "31.1.1"
            text: "Recall the reactions by which halogenoarenes can be produced: substitution of an arene with Cl₂ or Br₂ in the presence of a catalyst, AlCl₃ or AlBr₃, to form a halogenoarene, exemplified by benzene forming chlorobenzene and methylbenzene forming 2-chloromethylbenzene and 4-chloromethylbenzene."
          - code: "31.1.2"
            text: "Explain the difference in reactivity between a halogenoalkane and a halogenoarene, as exemplified by chloroethane and chlorobenzene."

  - code: "32"
    title: Hydroxy compounds
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "32.1"
        title: Alcohols
        objectives:
          - code: "32.1.1"
            text: "Describe the reaction of alcohols with acyl chlorides to form esters, using ethyl ethanoate as the example."
      - code: "32.2"
        title: Phenol
        objectives:
          - code: "32.2.1"
            text: "Recall the reactions (reagents and conditions) by which phenol can be produced: (a) reaction of phenylamine with HNO₂, or NaNO₂ and dilute acid, below 10 °C to produce the diazonium salt, followed by further warming of the diazonium salt with H₂O to give phenol."
          - code: "32.2.2"
            text: "Recall the chemistry of phenol, as exemplified by the following reactions: (a) with bases, for example NaOH(aq), to produce sodium phenoxide; (b) with Na(s) to produce sodium phenoxide and H₂(g); (c) with diazonium salts in NaOH(aq) to give azo compounds; (d) nitration of the aromatic ring with dilute HNO₃(aq) at room temperature to give a mixture of 2-nitrophenol and 4-nitrophenol; (e) bromination of the aromatic ring with Br₂(aq) to form 2,4,6-tribromophenol."
          - code: "32.2.3"
            text: "Explain the acidity of phenol."
          - code: "32.2.4"
            text: "Describe and explain the relative acidities of water, phenol and ethanol."
          - code: "32.2.5"
            text: "Explain why the reagents and conditions for the nitration and bromination of phenol are different from those for benzene."
          - code: "32.2.6"
            text: "Recall that the hydroxyl group of a phenol directs to the 2-, 4- and 6-positions."
          - code: "32.2.7"
            text: "Apply knowledge of the reactions of phenol to those of other phenolic compounds, e.g. naphthol."

  - code: "33"
    title: Carboxylic acids and derivatives
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "33.1"
        title: Carboxylic acids
        objectives:
          - code: "33.1.1"
            text: "Recall the reaction by which benzoic acid can be produced: (a) reaction of an alkylbenzene with hot alkaline KMnO₄ and then dilute acid, exemplified by methylbenzene."
          - code: "33.1.2"
            text: "Describe the reaction of carboxylic acids with PCl₃ and heat, PCl₅ or SOCl₂ to form acyl chlorides."
          - code: "33.1.3"
            text: "Recognise that some carboxylic acids can be further oxidised: (a) the oxidation of methanoic acid, HCOOH, with Fehling's reagent or Tollens' reagent or acidified KMnO₄ or acidified K₂Cr₂O₇ to carbon dioxide and water; (b) the oxidation of ethanedioic acid, HOOCCOOH, with warm acidified KMnO₄ to carbon dioxide."
          - code: "33.1.4"
            text: "Describe and explain the relative acidities of carboxylic acids, phenols and alcohols."
          - code: "33.1.5"
            text: "Describe and explain the relative acidities of chlorine-substituted carboxylic acids."
      - code: "33.2"
        title: Esters
        objectives:
          - code: "33.2.1"
            text: "Recall the reaction by which esters can be produced: (a) reaction of alcohols with acyl chlorides, using the formation of ethyl ethanoate and phenyl benzoate as examples."
      - code: "33.3"
        title: Acyl chlorides
        objectives:
          - code: "33.3.1"
            text: "Recall the reactions (reagents and conditions) by which acyl chlorides can be produced: (a) reaction of carboxylic acids with PCl₃ and heat, PCl₅ or SOCl₂."
          - code: "33.3.2"
            text: "Describe the following reactions of acyl chlorides: (a) hydrolysis on addition of water at room temperature to give the carboxylic acid and HCl; (b) reaction with an alcohol at room temperature to produce an ester and HCl; (c) reaction with phenol at room temperature to produce an ester and HCl; (d) reaction with ammonia at room temperature to produce an amide and HCl; (e) reaction with a primary or secondary amine at room temperature to produce an amide and HCl."
          - code: "33.3.3"
            text: "Describe the addition–elimination mechanism of acyl chlorides in the reactions in 33.3.2(a)–(e)."
          - code: "33.3.4"
            text: "Explain the relative ease of hydrolysis of acyl chlorides, alkyl chlorides and halogenoarenes (aryl chlorides)."

  - code: "34"
    title: Nitrogen compounds
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "34.1"
        title: Primary and secondary amines
        objectives:
          - code: "34.1.1"
            text: "Recall the reactions (reagents and conditions) by which primary and secondary amines are produced: (a) reaction of halogenoalkanes with NH₃ in ethanol heated under pressure; (b) reaction of halogenoalkanes with primary amines in ethanol, heated in a sealed tube/under pressure; (c) the reduction of amides with LiAlH₄; (d) the reduction of nitriles with LiAlH₄ or H₂/Ni."
          - code: "34.1.2"
            text: "Describe the condensation reaction of ammonia or an amine with an acyl chloride at room temperature to give an amide."
          - code: "34.1.3"
            text: "Describe and explain the basicity of aqueous solutions of amines."
      - code: "34.2"
        title: Phenylamine and azo compounds
        objectives:
          - code: "34.2.1"
            text: "Describe the preparation of phenylamine by the nitration of benzene to form nitrobenzene, followed by reduction with hot Sn/concentrated HCl, followed by NaOH(aq)."
          - code: "34.2.2"
            text: "Describe: (a) the reaction of phenylamine with Br₂(aq) at room temperature; (b) the reaction of phenylamine with HNO₂, or NaNO₂ and dilute acid, below 10 °C to produce the diazonium salt, followed by further warming of the diazonium salt with H₂O to give phenol."
          - code: "34.2.3"
            text: "Describe and explain the relative basicities of aqueous ammonia, ethylamine and phenylamine."
          - code: "34.2.4"
            text: "Recall the following about azo compounds: (a) describe the coupling of benzenediazonium chloride with phenol in NaOH(aq) to form an azo compound; (b) identify the azo group; (c) state that azo compounds are often used as dyes; (d) recall that other azo dyes can be formed by a similar route."
      - code: "34.3"
        title: Amides
        objectives:
          - code: "34.3.1"
            text: "Recall the reactions (reagents and conditions) by which amides are produced: (a) the reaction between ammonia and an acyl chloride at room temperature; (b) the reaction between a primary amine and an acyl chloride at room temperature."
          - code: "34.3.2"
            text: "Describe the reactions of amides: (a) hydrolysis with aqueous alkali or aqueous acid; (b) the reduction of the CO group in amides with LiAlH₄ to form an amine."
          - code: "34.3.3"
            text: "State and explain why amides are much weaker bases than amines."
      - code: "34.4"
        title: Amino acids
        objectives:
          - code: "34.4.1"
            text: "Describe the acid/base properties of amino acids and the formation of zwitterions, including the isoelectric point."
          - code: "34.4.2"
            text: "Describe the formation of amide (peptide) bonds between amino acids to give di- and tripeptides."
          - code: "34.4.3"
            text: "Interpret and predict the results of electrophoresis on mixtures of amino acids and dipeptides at varying pHs."
            guidance: "The assembling of the apparatus will not be tested."

  - code: "35"
    title: Polymerisation
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "35.1"
        title: Condensation polymerisation
        objectives:
          - code: "35.1.1"
            text: "Describe the formation of polyesters: (a) by the reaction between a diol and a dicarboxylic acid or dioyl chloride; (b) by the reaction of a hydroxycarboxylic acid."
          - code: "35.1.2"
            text: "Describe the formation of polyamides: (a) by the reaction between a diamine and a dicarboxylic acid or dioyl chloride; (b) by the reaction of an aminocarboxylic acid; (c) by the reaction between amino acids."
          - code: "35.1.3"
            text: "Deduce the repeat unit of a condensation polymer obtained from a given monomer or pair of monomers."
          - code: "35.1.4"
            text: "Identify the monomer(s) present in a given section of a condensation polymer molecule."
      - code: "35.2"
        title: Predicting the type of polymerisation
        objectives:
          - code: "35.2.1"
            text: "Predict the type of polymerisation reaction for a given monomer or pair of monomers."
          - code: "35.2.2"
            text: "Deduce the type of polymerisation reaction that produces a given section of a polymer molecule."
      - code: "35.3"
        title: Degradable polymers
        objectives:
          - code: "35.3.1"
            text: "Recognise that poly(alkenes) are chemically inert and can therefore be difficult to biodegrade."
          - code: "35.3.2"
            text: "Recognise that some polymers can be degraded by the action of light."
          - code: "35.3.3"
            text: "Recognise that polyesters and polyamides are biodegradable by acidic and alkaline hydrolysis."

  - code: "36"
    title: Organic synthesis
    level: A
    papers: ["Paper 4"]
    strand: Organic chemistry
    topics:
      - code: "36.1"
        title: Organic synthesis
        objectives:
          - code: "36.1.1"
            text: "For an organic molecule containing several functional groups: (a) identify the organic functional groups using the reactions in the syllabus; (b) predict properties and reactions."
          - code: "36.1.2"
            text: "Devise multi-step synthetic routes for preparing organic molecules using the reactions in the syllabus."
          - code: "36.1.3"
            text: "Analyse a given synthetic route in terms of the type of reaction and the reagents used for each step, and possible by-products."

  # ===========================================================================
  # A Level: Analysis
  # ===========================================================================
  - code: "37"
    title: Analytical techniques
    level: A
    papers: ["Paper 4"]
    strand: Analysis
    topics:
      - code: "37.1"
        title: Thin-layer chromatography
        objectives:
          - code: "37.1.1"
            text: "Describe and understand the terms: (a) stationary phase, for example aluminium oxide (on a solid support); (b) mobile phase, a polar or non-polar solvent; (c) Rf value; (d) solvent front and baseline."
          - code: "37.1.2"
            text: "Interpret Rf values."
          - code: "37.1.3"
            text: "Explain the differences in Rf values in terms of interaction with the stationary phase and of relative solubility in the mobile phase."
      - code: "37.2"
        title: Gas/liquid chromatography
        objectives:
          - code: "37.2.1"
            text: "Describe and understand the terms: (a) stationary phase, a high boiling point non-polar liquid (on a solid support); (b) mobile phase, an unreactive gas; (c) retention time."
          - code: "37.2.2"
            text: "Interpret gas/liquid chromatograms in terms of the percentage composition of a mixture."
          - code: "37.2.3"
            text: "Explain retention times in terms of interaction with the stationary phase."
      - code: "37.3"
        title: Carbon-13 NMR spectroscopy
        objectives:
          - code: "37.3.1"
            text: "Analyse and interpret a carbon-13 NMR spectrum of a simple molecule to deduce: (a) the different environments of the carbon atoms present; (b) the possible structures for the molecule."
            guidance: "Typical carbon-13 chemical shift values (relative to TMS = 0) are given in the syllabus Data section."
          - code: "37.3.2"
            text: "Predict or explain the number of peaks in a carbon-13 NMR spectrum for a given molecule."
      - code: "37.4"
        title: Proton (¹H) NMR spectroscopy
        objectives:
          - code: "37.4.1"
            text: "Analyse and interpret a proton (¹H) NMR spectrum of a simple molecule to deduce: (a) the different environments of the protons present, using chemical shift values; (b) the relative numbers of each type of proton present, from relative peak areas; (c) the number of equivalent protons on the carbon atom adjacent to the one to which the given proton is attached, from the splitting pattern using the n + 1 rule (limited to singlet, doublet, triplet, quartet and multiplet); (d) the possible structures for the molecule."
            guidance: "Typical proton chemical shift values (relative to TMS = 0) are given in the syllabus Data section."
          - code: "37.4.2"
            text: "Predict the chemical shifts and splitting patterns of the protons in a given molecule."
          - code: "37.4.3"
            text: "Describe the use of tetramethylsilane, TMS, as the standard for chemical shift measurements."
          - code: "37.4.4"
            text: "State the need for deuterated solvents, e.g. CDCl₃, when obtaining a proton NMR spectrum."
          - code: "37.4.5"
            text: "Describe the identification of O–H and N–H protons by proton exchange using D₂O."
