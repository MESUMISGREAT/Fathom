id: chemical-equilibria\nsubject: \"9701\"\ntopic: \"7.1\"\ntitle: \"Chemical equilibria\"\nsummary: \"Lesson covering reversible reactions, dynamic equilibrium, Le'tchelier's principle, equilibrium constants.\"\norder: 1\nminutes: 5\nkind: core\nobjectives:\n  - \"7.1.1\"\n  - \"7.1.2\"\n  - \"7.1.3\"\n  - \"7.1.4\"\n  - \"7.1.5\"\n  - \"7.1.6\"\n  - \"7.1.7\"\n  - \"7.1.8\"\n  - \"7.1.9\"\n  - \"7.1.10\"\nprerequisites: []\nprovenance:\n  origin: ai-drafted\n  status: ai-checked\n  notes: Generated for CE d1\nblocks:\n  - type: objective\n    body: |\n      By the end of this lesson you can identify a reversible reaction, explain dynamic equilibrium, and state Le'tchelier's principle.\n  - type: explain\n    title: Le'tchelier's principle\n    body: |\n      If a change is applied to a system at equilibrium, the system shifts in the direction that minimises the change.\n  - type: example\n    title: Simple equilibrium\n    problem: |\n      For the reversible reaction A ⇌ B with Kc = 4 at 298K, initial [A]₀ = 1M, [B]₀ = 0 M, calculate [B]eq.\n    steps:\n      - Let x be the change; [A] = 1-x, [B] = x. Plug into Kc: 4 = x/(1-x). Solve: 4(1-x)=x → 4-4x=x → 5x = 4 → x = 0.8. So [B]eq = 0.8M.