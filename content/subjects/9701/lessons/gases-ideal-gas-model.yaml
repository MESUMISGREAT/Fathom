id: gases-ideal-gas-model
subject: "9701"
topic: "4.1"
title: "The ideal gas: two brave assumptions"
summary: What an ideal gas is — zero particle volume and no intermolecular forces — why the model exists, and when real gases stop playing along.
order: 2
minutes: 4
objectives: ["4.1.2"]
prerequisites: [gases-pressure-collisions]
