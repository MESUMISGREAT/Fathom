id: atoms-successive-ionisation-energies
subject: "9701"
topic: "1.4"
title: Successive ionisation energies
summary: Why each successive ionisation energy is larger, what the big jumps mean, and how to read an element's group and configuration from the data.
order: 3
minutes: 5
objectives: ["1.4.4", "1.4.7", "1.4.8"]
prerequisites: [atoms-first-ionisation-energy]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.4, learning outcomes 4, 7 and 8; H to Kr). Successive
    ionisation energies (kJ mol⁻¹) for Na, Mg, B, Al, Si, P and S are NIST values as
    tabulated in the Wikipedia table "Molar ionization energies of the elements",
    checked 2026-10-19 and rounded to the nearest whole number. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain the pattern in successive ionisation energies and use the data to deduce an element's electronic configuration and its position in the Periodic Table.

  - type: explain
    title: Every one is bigger than the last
    body: |
      Successive ionisation energies **always increase**: 2nd > 1st, 3rd > 2nd, and so on.

      - After each electron is removed, the same number of protons is pulling on **fewer electrons**.
      - There's less electron–electron repulsion and the ion is smaller.
      - So each remaining electron is held more tightly than the one before.

  - type: explain
    title: Big jumps mean a new, inner shell
    body: |
      Sometimes the increase is **much** bigger than usual. That happens when the next electron has to come from a shell **closer to the nucleus**:

      - it is much nearer the nucleus, and
      - it is much less shielded (fewer electrons inside it).

      So the big jumps mark the boundaries between shells.

  - type: diagram
    diagram: chem-successive-ionisation-sodium
    alt: "Graph of all eleven successive ionisation energies of sodium on a logarithmic scale from 100 to over 100 000 kJ per mole. The 1st (496) is low and highlighted as one electron from shell 3 (3s). After a big jump, the 2nd to 9th (4562 to 28 932) rise steadily, labelled eight electrons from shell 2. After a second big jump, the 10th and 11th (141 362 and 159 076) are labelled two electrons from shell 1. A note reads: Na is 2, 8, 1, so one electron before the first big jump means group 1."
    caption: |
      Sodium, real data on a log scale. The 1 + 8 + 2 pattern is the electron arrangement 2, 8, 1 read backwards.

  - type: explain
    title: Why a log scale?
    body: |
      Sodium's values run from 496 to 159 076 kJ mol⁻¹. On an ordinary scale the first few would be squashed flat against the axis. A log scale gives equal space to each factor of 10, so every jump shows up.

  - type: check
    title: Quick check
    questions: [why-increase, sodium-jump-explain, magnesium-outer]

  - type: explain
    title: Reading the group from the data
    body: |
      1. Look for the **first big jump** (on a table, compare each value with the one before; the biggest ratio stands out).
      2. Count the electrons removed **before** it. That's the number of **outer-shell electrons**.
      3. Convert to a group: 1 or 2 outer electrons → group 1 or 2; 3 to 8 → groups **13 to 18** (add 10).

      With **all** the successive IEs, the number of big jumps + 1 gives the number of occupied shells, which is the **period**. No big jump at all means every electron is in the first shell: hydrogen or helium (helium is in group 18, the one exception to the counting rule).

  - type: example
    title: Mystery element X
    problem: |
      The first six ionisation energies of X (kJ mol⁻¹) are 787, 1577, 3232, 4356, 16 091 and 19 805. Deduce the group of X. Given that X is in period 3, give its electronic configuration.
    steps:
      - |
        Compare each value with the one before: 1577/787 = 2.0, 3232/1577 = 2.0, 4356/3232 = 1.3, 16 091/4356 = 3.7, 19 805/16 091 = 1.2.
      - |
        The biggest jump is between the 4th and 5th: the 5th electron comes from an inner shell.
      - |
        So X has **4** outer-shell electrons, which puts it in **group 14**.
      - |
        Period 3, group 14: the outer shell is 3s² 3p². X is silicon: 1s² 2s² 2p⁶ 3s² 3p².
    answer: |
      Group 14; 1s² 2s² 2p⁶ 3s² 3p² (silicon).

  - type: check
    title: Deduce it
    questions: [phosphorus-group, boron-config, sulfur-group-error]

  - type: deeper
    title: Smaller jumps inside a shell
    body: |
      Look closely and there are smaller steps **within** a shell, from sub-shells. Aluminium (3s² 3p¹): 1st 578, 2nd 1817, 3rd 2745, 4th 11 577 kJ mol⁻¹.

      - 1st → 2nd is ×3.1, but 2nd → 3rd is only ×1.5. The 1st electron comes from **3p**; the 2nd and 3rd come from **3s**, which is lower in energy and less shielded.
      - 3rd → 4th is ×4.2: the big shell jump.

      So successive IEs give evidence for sub-shells as well as shells. Don't mistake a sub-shell step for a shell jump: the shell jump is the biggest.

  - type: misconceptions
    items:
      - wrong: "A big jump means the electron came from a shell further out."
        right: "It means the electron came from a shell **closer** to the nucleus: nearer, less shielded, much harder to remove."
      - wrong: "Three electrons before the jump means group 3."
        right: "Three outer electrons (s²p¹) is **group 13** in the 1–18 numbering."
      - wrong: "Successive IEs only increase at the big jumps."
        right: "Every successive IE is larger than the one before; the big jumps are just much larger increases."

  - type: exam
    body: |
      - Data questions give a table or a (often log-scale) graph. Show your working: say where the big jump is and how many electrons come before it.
      - "Explain the large increase" needs: the electron is removed from a shell closer to the nucleus, with less shielding, so a stronger attraction.
      - "Explain why each IE is larger" needs: the electron is removed from an increasingly positive ion; the same nuclear charge attracts fewer electrons.

  - type: takeaways
    items:
      - "Each successive IE is larger: the same protons hold fewer electrons, more tightly."
      - "A big jump means the next electron comes from an inner shell (closer, less shielded)."
      - "Electrons before the first big jump = outer electrons → group (1, 2, or add 10 for 13–18)."
      - "With all the data, big jumps + 1 = number of shells = period."

questions:
  - id: why-increase
    format: mcq
    difficulty: 1
    objectives: ["1.4.4"]
    prompt: |
      Why is the second ionisation energy of any element greater than its first?
    options:
      - text: |
          The second electron is removed from a positive ion, where the same number of protons attracts fewer electrons, so they are held more strongly.
        correct: true
        why: |
          Same nuclear charge, fewer electrons, less repulsion and a smaller ion: every remaining electron is held more tightly.
      - text: |
          The second electron is always removed from an inner shell.
        why: |
          Only sometimes (as for group 1). For magnesium, the first two electrons both come from 3s, yet the second IE is still larger.
      - text: |
          The nuclear charge increases after the first electron is removed.
        why: |
          Removing an electron doesn't change the nucleus; the number of protons stays the same.
      - text: |
          There is more shielding in the ion than in the atom.
        why: |
          Removing an electron can't add shielding; if anything, there's less repulsion.
    explanation: |
      Successive IEs increase because each electron is removed from an increasingly positive ion.

  - id: magnesium-outer
    format: numeric
    difficulty: 2
    objectives: ["1.4.7", "1.4.4"]
    prompt: |
      The first five ionisation energies of element Q (kJ mol⁻¹) are 738, 1451, 7733, 10 543 and 13 630. How many electrons are in the outer shell of Q?
    fields:
      - answer: 2
    explanation: |
      The ratio 7733/1451 = 5.3 is by far the biggest, so the big jump is after the 2nd electron. Q has 2 outer electrons (group 2; it is magnesium).

  - id: phosphorus-group
    format: numeric
    difficulty: 2
    objectives: ["1.4.8", "1.4.7"]
    prompt: |
      Element R has successive ionisation energies (kJ mol⁻¹) of 1012, 1907, 2914, 4964, 6274, 21 267 and 25 431. In which group (1–18) of the Periodic Table is R?
    fields:
      - answer: 15
    explanation: |
      The big jump is between the 5th and 6th (21 267/6274 = 3.4). Five outer electrons (s²p³) means group 15. R is phosphorus.

  - id: boron-config
    format: mcq
    difficulty: 3
    objectives: ["1.4.7", "1.4.4"]
    prompt: |
      An element has exactly five ionisation energies (kJ mol⁻¹): 801, 2427, 3660, 25 026 and 32 827. What is its electronic configuration?
    options:
      - text: |
          1s² 2s¹
        why: |
          The 1st → 2nd ratio (×3.0) is a sub-shell step (2p → 2s), not the shell jump. Also, five IEs means five electrons, not three.
      - text: |
          1s² 2s² 2p³
        why: |
          That's nitrogen, with seven electrons and five outer electrons. This element has only five electrons in total.
      - text: |
          1s² 2s² 2p¹
        correct: true
        why: |
          Five IEs means five electrons. The biggest jump (×6.8) is after the 3rd, so there are 3 outer electrons and 2 inner ones: boron.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p¹
        why: |
          Aluminium has 13 electrons and would have 13 ionisation energies.
    explanation: |
      Number of IEs = number of electrons (5). Biggest jump after the 3rd: 2 inner (1s²) + 3 outer (2s² 2p¹).

  - id: sodium-jump-explain
    format: explain
    difficulty: 2
    objectives: ["1.4.4"]
    prompt: |
      Explain why there is a very large increase between the 9th and 10th ionisation energies of sodium.
    model: |
      The 9th electron is removed from the second shell, but the 10th must come from the first shell (1s). The first shell is much closer to the nucleus, and the 1s electrons have no inner electrons shielding them. So the 10th electron is attracted much more strongly by the nucleus, and far more energy is needed to remove it.
    keyPoints:
      - "The 10th electron is removed from the first shell (1s), the 9th from the second"
      - "The first shell is much closer to the nucleus"
      - "1s electrons have no inner shells shielding them (much less shielding)"
      - "So the attraction is much stronger and much more energy is needed"
    explanation: |
      Big jump = new shell, closer in, less shielded.

  - id: sulfur-group-error
    format: spot-error
    difficulty: 2
    objectives: ["1.4.8", "1.4.7"]
    prompt: |
      A student analyses the successive ionisation energies of element Z. Which line contains the first error?
    lines:
      - "Z's 1st to 7th IEs (kJ mol⁻¹) are 1000, 2252, 3357, 4556, 7004, 8496 and 27 107."
      - "Ratios to the previous value: 2.3, 1.5, 1.4, 1.5, 1.2, then 3.2 for the 7th."
      - "The biggest jump is between the 6th and 7th ionisation energies."
      - "So Z has 6 electrons in its outer shell."
      - "So Z is in group 6 of the Periodic Table."
    errorLine: 5
    fix: |
      Six outer electrons (s²p⁴) puts Z in **group 16** of the 1–18 numbering. (In period 3 it would be sulfur.)
    explanation: |
      For p-block elements, group number = outer electrons + 10.
