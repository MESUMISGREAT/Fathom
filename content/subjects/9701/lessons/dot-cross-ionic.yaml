id: dot-cross-ionic
subject: "9701"
topic: "3.7"
title: Drawing ions with dots and crosses
summary: Show electron transfer, ion charges and full outer shells in ionic dot-and-cross diagrams.
order: 3
minutes: 4
objectives: ["3.7.1"]
prerequisites: [ionic-bonding-describing-ionic-compounds]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.7 learning outcome 1. All questions are original; ion diagrams are schematic and use no measured data.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can show electron transfer and the resulting charged ions in a dot-and-cross diagram.
  - type: explain
    title: Ions form by electron transfer
    body: |
      In an ionic dot-and-cross diagram, one atom's outer electrons transfer to another atom. Use dots for one element's electrons and crosses for the other's.

      Draw the final ions in square brackets with their charges outside. The ionic attraction is between the oppositely charged ions; it is not a shared electron pair.
  - type: example
    title: Sodium chloride
    problem: Show what happens to the outer electron when sodium reacts with chlorine.
    steps:
      - Sodium has one outer electron; chlorine has seven.
      - Sodium transfers its electron to chlorine. Sodium becomes Na⁺; chlorine becomes Cl⁻.
      - Put each ion in brackets and show a full outer shell on each. Mark the transferred electron with the dot or cross that identifies its original atom.
    answer: The ions are [Na]⁺ and [Cl]⁻; the chloride ion's outer shell includes one electron from sodium.
  - type: diagram
    diagram: chem-dot-cross-ionic-transfer
    alt: Sodium transfers one outer electron to chlorine to form Na⁺ and Cl⁻; chlorine's seven electrons plus the transferred electron make eight. Magnesium transfers two electrons to oxygen to form Mg²⁺ and O²⁻; oxygen's six plus two transferred electrons make eight.
    caption: The electron marks keep their original identity after transfer; brackets and charges show the ions.
  - type: check
    title: One electron or two?
    questions: ["dot-ionic-nacl", "dot-ionic-mgo"]
  - type: explain
    title: Use the charge to check your work
    body: |
      - Losing one electron makes a neutral atom 1+; gaining one makes it 1−.
      - Losing two makes a 2+ ion; gaining two makes a 2− ion.
      - The total charge must balance. In magnesium oxide, one Mg²⁺ balances one O²⁻.

      The same method works for other ionic compounds: show the electrons gained or lost, then check the charges and outer-shell counts.
  - type: check
    title: Check the finished ions
    questions: ["dot-ionic-brackets", "dot-ionic-charge"]
  - type: misconceptions
    items:
      - wrong: Draw the transferred electron as belonging to both ions.
        right: It transfers to the non-metal; the dot or cross only records which atom supplied it.
      - wrong: Leave the final ions unbracketed and uncharged.
        right: Use square brackets and put each ion's charge outside.
  - type: exam
    body: Show each transferred electron, then check electron counts and charges. Include brackets around each ion; never draw a shared pair between ions.
  - type: takeaways
    items:
      - Ionic dot-and-cross diagrams show electron transfer, not sharing.
      - Put ions in square brackets and write their charges outside.
      - Check that lost and gained electrons balance the ion charges.
questions:
  - id: dot-ionic-nacl
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: In sodium chloride, what happens to sodium's one outer electron?
    options:
      - text: It transfers to chlorine.
        correct: true
        why: Sodium loses an electron and chlorine gains it.
      - text: It is shared between sodium and chlorine.
        why: Ionic bonding forms by transfer; a shared pair describes covalent bonding.
      - text: It disappears when sodium becomes an ion.
        why: Electrons are transferred, not destroyed.
      - text: It moves from chlorine to sodium.
        why: Sodium is the atom that loses its outer electron.
    explanation: Sodium loses one electron to chlorine, producing Na⁺ and Cl⁻.
  - id: dot-ionic-mgo
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many electrons transfer from magnesium to oxygen when MgO forms?
    options:
      - text: Two
        correct: true
        why: Magnesium forms Mg²⁺ by losing two electrons; oxygen forms O²⁻ by gaining two.
      - text: One
        why: One electron would give ions with charges of 1+ and 1−.
      - text: Three
        why: Magnesium loses two outer electrons in this compound.
      - text: Zero
        why: MgO forms by transfer of two electrons from magnesium to oxygen.
    explanation: Two electrons move from Mg to O, giving Mg²⁺ and O²⁻.
  - id: dot-ionic-brackets
    format: cloze
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: In a final ionic dot-and-cross diagram, draw each ion inside {{1}} and place its charge {{2}} the bracket.
    blanks:
      - accept: ["square brackets", "brackets"]
      - accept: ["outside", "outside of"]
    explanation: Square brackets and outside charges identify the completed ions.
  - id: dot-ionic-charge
    format: mcq
    difficulty: 3
    objectives: ["3.7.1"]
    prompt: Which pair of ions makes a neutral formula unit of magnesium oxide?
    options:
      - text: Mg²⁺ and O²⁻
        correct: true
        why: "Their charges add to zero: +2 and −2."
      - text: Mg⁺ and O⁻
        why: These are not the ions formed by transferring magnesium's two outer electrons.
      - text: Mg²⁺ and O⁻
        why: The combined charge would be +1, not zero.
      - text: Mg⁺ and O²⁻
        why: The combined charge would be −1, not zero.
    explanation: A neutral MgO formula unit has one Mg²⁺ and one O²⁻; their charges balance.
