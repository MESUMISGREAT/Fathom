id: intermolecular-forces-strengths
subject: "9701"
topic: "3.6"
title: Bonds inside, attractions between
summary: Compare intermolecular forces with ionic, covalent and metallic bonding without mixing up what is broken.
order: 5
minutes: 3
objectives: ["3.6.4"]
prerequisites: [intermolecular-forces-types]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.6 learning outcome 4. All questions are original; no illustrative data are used.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can state the general strength comparison between bonding within substances and attractions between molecules.
  - type: explain
    title: The big comparison
    body: |
      In general, **ionic, covalent and metallic bonding are stronger than intermolecular forces**. An ionic lattice, a covalent bond or metallic bonding holds particles together more strongly than attractions between separate molecules.

      This is a general comparison, not a claim that every bond in every substance has one identical strength.
  - type: check
    title: Rank the categories
    questions: ["strength-general", "strength-compare"]
  - type: example
    title: What breaks when water boils?
    problem: Water boils and becomes water vapour. Did its covalent O–H bonds break?
    steps:
      - Boiling separates water molecules from one another.
      - Intermolecular attractions, including hydrogen bonds, are overcome.
      - Covalent O–H bonds stay inside each H₂O molecule.
    answer: No. Boiling overcomes intermolecular forces, not the stronger covalent bonds within each water molecule.
  - type: check
    title: Pick the broken link
    questions: ["strength-boiling", "strength-wording"]
  - type: misconceptions
    items:
      - wrong: Boiling water breaks its covalent bonds because molecules move apart.
        right: The molecules separate when intermolecular forces are overcome; covalent bonds remain.
      - wrong: Intermolecular means a bond inside one molecule.
        right: Intermolecular means between molecules; intramolecular bonds are within them.
  - type: exam
    body: Use the words **between molecules** or **within a molecule** explicitly. This prevents the common mistake of saying that boiling breaks covalent bonds.
  - type: takeaways
    items:
      - In general, ionic, covalent and metallic bonding are stronger than intermolecular forces.
      - Boiling overcomes attractions between molecules; it does not break their covalent bonds.
questions:
  - id: strength-general
    format: mcq
    difficulty: 1
    objectives: ["3.6.4"]
    prompt: Which statement matches the syllabus's general comparison?
    options:
      - text: Ionic, covalent and metallic bonding are generally stronger than intermolecular forces.
        correct: true
        why: This is the stated general rule.
      - text: All intermolecular forces are stronger than ionic bonding.
        why: That reverses the general comparison.
      - text: Intermolecular forces and covalent bonds are the same thing.
        why: One acts between molecules; the other joins atoms within a molecule.
      - text: Metallic bonding is an intermolecular force between metal molecules.
        why: Metals are not made of separate metal molecules; metallic bonding is distinct.
    explanation: The syllabus asks for the general statement that ionic, covalent and metallic bonding are stronger.
  - id: strength-compare
    format: cloze
    difficulty: 1
    objectives: ["3.6.4"]
    prompt: In general, ionic, covalent and metallic bonding are {{1}} than intermolecular forces.
    blanks:
      - accept: ["stronger", "much stronger"]
    explanation: This is the general comparison in the syllabus.
  - id: strength-boiling
    format: mcq
    difficulty: 2
    objectives: ["3.6.4"]
    prompt: When water boils, which attractions are overcome to separate the molecules?
    options:
      - text: Intermolecular attractions, including hydrogen bonds
        correct: true
        why: Boiling separates intact H₂O molecules.
      - text: Covalent O–H bonds inside each molecule
        why: Water vapour still contains H₂O molecules.
      - text: Ionic bonds in a water lattice
        why: Liquid water is not an ionic lattice.
      - text: Metallic bonds between oxygen atoms
        why: Water has no metallic bonding.
    explanation: "Boiling is a change of state: molecules separate while their covalent bonds remain."
  - id: strength-wording
    format: mcq
    difficulty: 2
    objectives: ["3.6.4"]
    prompt: "A student says: “Intermolecular forces are bonds inside a molecule.” Which correction is best?"
    options:
      - text: They act between molecules; covalent bonds act within a molecule.
        correct: true
        why: Inter- means between; intra- means within.
      - text: They are another name for an atomic nucleus.
        why: Intermolecular forces are attractions between molecular entities.
      - text: They only occur in metals.
        why: They describe attractions between molecules.
      - text: They are always stronger than covalent bonds.
        why: The general comparison is the opposite.
    explanation: Keeping “between” and “within” straight prevents a common exam error.
