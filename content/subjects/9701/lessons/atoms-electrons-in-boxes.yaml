id: atoms-electrons-in-boxes
subject: "9701"
topic: "1.3"
title: Electrons in boxes and free radicals
summary: Drawing electrons-in-boxes diagrams, counting unpaired electrons, and what makes a species a free radical.
order: 4
minutes: 4
objectives: ["1.3.7", "1.3.9", "1.3.4", "1.3.5"]
prerequisites: [atoms-electronic-configurations]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.3, learning outcomes 7 and 9, with 4 and 5 applied to
    single orbitals; ground states H to Kr). The Fe box diagram follows the syllabus
    example. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can draw electrons-in-boxes diagrams for atoms and ions, count unpaired electrons, and recognise a free radical.

  - type: explain
    title: The notation
    body: |
      - Each **box** is one **orbital**: s is one box, p is three, d is five.
      - Each **arrow** is one **electron**. The arrow direction shows its **spin**.
      - Two electrons in one box must have **opposite spins**: `[↑↓]`, a **spin pair**.
      - Label each group of boxes with its sub-shell (2s, 2p, 3d …). You can start with a noble-gas core such as [Ar].

  - type: explain
    title: Filling the boxes
    body: |
      1. Fill sub-shells in energy order (1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p).
      2. Within a sub-shell, put **one electron in each box first**, all with the **same spin** (parallel).
      3. Only then start pairing up.

      Why rule 2? Two electrons in the same orbital repel strongly (**spin-pair repulsion**). Keeping them in separate orbitals of the same energy keeps them apart and gives a lower total energy.

  - type: diagram
    diagram: chem-electrons-in-boxes
    alt: "Electrons-in-boxes diagrams for five atoms. Nitrogen: 1s and 2s each hold a spin pair, and the three 2p boxes each hold one up arrow (3 unpaired). Oxygen: as nitrogen but the first 2p box holds a pair (2 unpaired). Iron: [Ar], then five 3d boxes holding one pair and four single up arrows, and a 4s box with a pair (4 unpaired). Chromium, highlighted as an exception: [Ar], five 3d boxes each with one up arrow and a 4s box with one up arrow (6 unpaired). Copper, highlighted as an exception: [Ar], five 3d boxes each with a pair and a 4s box with one up arrow (1 unpaired)."
    caption: |
      Singles first, then pairs. Cr and Cu are the two exceptions between H and Kr.

  - type: check
    title: Quick check
    questions: [carbon-boxes, nitrogen-repulsion]

  - type: example
    title: Phosphorus and the Fe²⁺ ion
    problem: |
      Draw the outer sub-shells of a phosphorus atom (Z = 15) and of an Fe²⁺ ion in boxes, and count the unpaired electrons.
    steps:
      - |
        P is [Ne] 3s² 3p³. The 3s box holds a pair: `3s [↑↓]`.
      - |
        The three 3p electrons go one per box, same spin: `3p [↑ ][↑ ][↑ ]`. That's **3 unpaired** electrons.
      - |
        Fe is [Ar] 3d⁶ 4s². Fe²⁺ loses both 4s electrons, so it is [Ar] 3d⁶ with an **empty** 4s box.
      - |
        Six electrons in five 3d boxes: one in each, then the sixth pairs up in the first. That's **4 unpaired** electrons.

        ```
        3d [↑↓][↑ ][↑ ][↑ ][↑ ]    4s [  ]
        ```
    answer: |
      P has 3 unpaired electrons; Fe²⁺ has 4.

  - type: check
    title: Count the unpaired electrons
    questions: [iron-three-plus-unpaired, sulfur-unpaired]

  - type: definition
    term: Free radical
    body: |
      A species with one or more unpaired electrons.

  - type: explain
    title: Spotting free radicals
    body: |
      "Species" means any particle: an atom, a molecule or an ion. Draw the boxes (or count the electrons) and look for a lone arrow.

      - **Cl•**, a chlorine atom ([Ne] 3s² 3p⁵): one unpaired electron. Free radical.
      - **•CH₃**, a methyl radical: one unpaired electron on the carbon. Free radical.
      - **Cl₂, CH₄, Cl⁻**: every electron is paired. Not free radicals.

      The dot (•) in a formula marks the unpaired electron. You'll meet radicals again in organic chemistry, where Cl₂ splits into two Cl• in ultraviolet light.

  - type: check
    title: Free radicals
    questions: [define-radical, which-radical]

  - type: misconceptions
    items:
      - wrong: "Fill the first p box with a pair before moving to the next box."
        right: "One electron per box first, all with parallel spins; pair up only when every box has one."
      - wrong: "A free radical must be charged."
        right: "It's about unpaired electrons, not charge. Most radicals you meet (Cl•, •CH₃) are neutral."
      - wrong: "Two electrons in the same box can have the same spin."
        right: "A pair in one orbital always has opposite spins: `[↑↓]`."

  - type: exam
    body: |
      - Draw half-arrows or arrows clearly; paired electrons point in opposite directions.
      - Label sub-shells and leave empty boxes empty (for example, the 4s box in Fe²⁺).
      - Free radical definition: "a species with one or more unpaired electrons". Writing "molecule" instead of "species" is too narrow.

  - type: takeaways
    items:
      - "Box = orbital, arrow = electron; a pair has opposite spins."
      - "In a sub-shell, fill singly with parallel spins before pairing, to minimise repulsion."
      - "Count unpaired electrons from the boxes: N has 3, O has 2, Fe has 4, Cr has 6."
      - "Free radical: a species with one or more unpaired electrons."

questions:
  - id: carbon-boxes
    format: mcq
    difficulty: 1
    objectives: ["1.3.7", "1.3.5"]
    prompt: |
      Which electrons-in-boxes diagram shows the 2p sub-shell of a ground-state carbon atom (1s² 2s² 2p²)?
    options:
      - text: |
          `[↑↓][  ][  ]`
        why: |
          Pairing up while empty orbitals of the same energy are available means extra repulsion, so this isn't the ground state.
      - text: |
          `[↑ ][↓ ][  ]`
        why: |
          Electrons in separate orbitals of the ground state have parallel spins.
      - text: |
          `[↑ ][↑ ][  ]`
        correct: true
        why: |
          One electron in each of two orbitals, with parallel spins: the lowest-energy arrangement.
      - text: |
          `[↑↑][  ][  ]`
        why: |
          Two electrons in one orbital must have opposite spins, and they shouldn't pair here anyway.
    explanation: |
      Singly first, parallel spins, then pairing.

  - id: nitrogen-repulsion
    format: explain
    difficulty: 2
    objectives: ["1.3.5", "1.3.7"]
    prompt: |
      Explain, in terms of inter-electron repulsion, why the three 2p electrons of a nitrogen atom occupy separate 2p orbitals.
    model: |
      Electrons are all negatively charged, so they repel each other. Two electrons in the same orbital occupy the same region of space and repel strongly (spin-pair repulsion). The three 2p orbitals have the same energy, so putting one electron in each keeps the electrons further apart and reduces the repulsion. This gives the lowest-energy arrangement, which is the ground state.
    keyPoints:
      - "Electrons repel each other (all negatively charged)"
      - "Two electrons in the same orbital repel more strongly (spin-pair repulsion)"
      - "The three 2p orbitals have the same energy, so separate orbitals keep the electrons further apart"
      - "This gives the lowest energy (ground state) arrangement"
    explanation: |
      Equal-energy orbitals plus repulsion: spreading out wins.

  - id: iron-three-plus-unpaired
    format: numeric
    difficulty: 2
    objectives: ["1.3.7", "1.3.4"]
    prompt: |
      How many unpaired electrons does a ground-state Fe³⁺ ion have?
    fields:
      - answer: 5
    explanation: |
      Fe³⁺ is [Ar] 3d⁵: one electron in each of the five 3d boxes, all unpaired.

  - id: sulfur-unpaired
    format: numeric
    difficulty: 2
    objectives: ["1.3.7", "1.3.4"]
    prompt: |
      How many unpaired electrons are there in a ground-state sulfur atom (Z = 16)?
    fields:
      - answer: 2
    explanation: |
      S is [Ne] 3s² 3p⁴. In 3p: `[↑↓][↑ ][↑ ]`, so two unpaired electrons.

  - id: define-radical
    format: text
    style: definition
    difficulty: 1
    objectives: ["1.3.9"]
    prompt: |
      What is a **free radical**?
    accept:
      - "a species with one or more unpaired electrons"
      - "species with one or more unpaired electrons"
      - "a species with one or more unpaired electron"
      - "a species with an unpaired electron"
      - "a species with unpaired electrons"
      - "a species with at least one unpaired electron"
      - "a species that has one or more unpaired electrons"
      - "a particle with one or more unpaired electrons"
      - "an atom or molecule with one or more unpaired electrons"
      - "a species containing one or more unpaired electrons"
      - "a species with 1 or more unpaired electrons"
      - "species with 1 or more unpaired electrons"
      - "a species with one or more unpaired electrons in its outer shell"
      - "an atom, molecule or ion with one or more unpaired electrons"
      - "a molecule or atom with one or more unpaired electrons"
    model: |
      A free radical is a species with one or more unpaired electrons.
    explanation: |
      "Species" covers atoms, molecules and ions. The key idea is the unpaired electron.

  - id: which-radical
    format: mcq
    difficulty: 2
    objectives: ["1.3.9", "1.3.7"]
    prompt: |
      Which of these is a free radical?
    options:
      - text: |
          a bromine atom, Br
        correct: true
        why: |
          Br is [Ar] 3d¹⁰ 4s² 4p⁵: the 4p sub-shell is `[↑↓][↑↓][↑ ]`, one unpaired electron.
      - text: |
          a bromide ion, Br⁻
        why: |
          Br⁻ is [Ar] 3d¹⁰ 4s² 4p⁶: every electron is paired.
      - text: |
          a bromine molecule, Br₂
        why: |
          The two atoms share their unpaired electrons in a covalent bond, so all electrons are paired.
      - text: |
          a methane molecule, CH₄
        why: |
          Four covalent bonds, each a shared pair: no unpaired electrons.
    explanation: |
      Free radical = at least one unpaired electron. A halogen atom has one; its ion and its molecule don't.
