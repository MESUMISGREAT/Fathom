id: shapes-molecules-vsepr-basics
subject: "9701"
topic: "3.5"
title: "VSEPR: electron pairs push apart"
summary: Electron pairs around a central atom repel and get as far apart as possible, giving linear, trigonal planar, tetrahedral, trigonal bipyramidal and octahedral shapes.
order: 1
minutes: 5
objectives: ["3.5.1"]
prerequisites: [covalent-bonding-shared-pairs, covalent-bonding-expanded-octets]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.5, learning outcome 1: VSEPR shapes and bond angles of BF₃,
    CO₂, CH₄, SF₆ and PF₅; NH₃ and H₂O follow in the next lesson). All questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can state and explain the shapes and bond angles of $\text{CO}_2$, $\text{BF}_3$, $\text{CH}_4$, $\text{PF}_5$ and $\text{SF}_6$ using VSEPR theory.

  - type: explain
    title: Molecules aren't flat cartoons
    body: |
      A molecule's shape decides how it packs, how polar it is and how it fits into an enzyme. Your nose tells some molecules apart purely by shape.

      Good news: you can **predict** shapes with one simple idea.

  - type: definition
    term: VSEPR theory (valence shell electron pair repulsion)
    body: |
      The electron pairs around a central atom **repel** each other and arrange themselves **as far apart as possible**, to minimise repulsion.

  - type: explain
    title: What counts as a "pair"?
    body: |
      Count the **regions of electron density** around the central atom:
      - each **bonding pair** (single bond) is one region;
      - each **lone pair** is one region;
      - a **double or triple bond** also counts as **one** region: its electrons all point the same way.

      This lesson only has molecules with **no lone pairs** on the central atom.

  - type: intuition
    title: Balloons tied together
    body: |
      Tie two balloons at their necks and they point in opposite directions. Three make a flat triangle. Four can't stay flat: they pop into a 3D tetrahedron.

      Electron pairs do the same. Where the analogy breaks down: balloons push by touching, but electron pairs repel **electrostatically**, as negative charges.

  - type: explain
    title: The five shapes with no lone pairs
    body: |
      | regions | shape | VSEPR-predicted bond angle | example |
      | --- | --- | --- | --- |
      | 2 | **linear** | 180° | $\text{CO}_2$ |
      | 3 | **trigonal planar** | 120° | $\text{BF}_3$ |
      | 4 | **tetrahedral** | 109.5° | $\text{CH}_4$ |
      | 5 | **trigonal bipyramidal** | 120° and 90° | $\text{PF}_5$ |
      | 6 | **octahedral** | 90° | $\text{SF}_6$ |

      These are the standard VSEPR predictions used for these examples, not claims that every measured angle is exact.

  - type: diagram
    diagram: chem-shapes-molecules-five-shapes
    alt: "Five molecule drawings with bond angles. CO2: O=C=O in a straight line, 180 degrees, linear, 2 bonding regions. BF3: boron with three fluorines in a flat triangle, 120 degrees, trigonal planar. CH4: carbon with four hydrogens, one up, one in the plane to the lower left, one on a solid wedge towards you and one on a hashed wedge away from you, 109.5 degrees, tetrahedral. PF5: phosphorus with fluorines straight up and straight down and three around the middle (one in the plane, one wedge, one hashed wedge), 120 degrees around the middle and 90 degrees between the top or bottom bond and the middle ones, trigonal bipyramidal. SF6: sulfur with fluorines up, down, left, right, one wedge and one hashed wedge, 90 degrees between neighbouring bonds, octahedral. Key: line in the plane of the paper, solid wedge towards you, hashed wedge away from you."
    caption: |
      Lines are in the plane of the paper, solid wedges come towards you, hashed wedges go away.

  - type: example
    title: Boron trifluoride, BF₃
    problem: |
      State and explain the shape of $\text{BF}_3$ and its VSEPR-predicted bond angle.
    steps:
      - |
        B (Group 13) has **3** outer electrons. Each makes a B–F bond: **3 bonding pairs**.
      - |
        No electrons are left over: **0 lone pairs**.
      - |
        Three pairs repel and get as far apart as possible: a flat triangle.
    answer: |
      Trigonal planar, F–B–F = 120°. (B has only 6 electrons around it, but VSEPR only cares how many regions there are.)

  - type: explain
    title: Why tetrahedral, not a flat square?
    body: |
      Four pairs in a flat square would be 90° apart. In 3D they can do better: at the corners of a **tetrahedron** each pair is **109.5°** from every other.

      That's why $\text{CH}_4$ is not flat.

  - type: check
    title: Shapes and angles
    questions: [vsepr-cloze, bf3-shape, ch4-angle]

  - type: explain
    title: PF₅ has two different angles
    body: |
      - Three F atoms sit around the "equator" in a flat triangle: **120°** apart.
      - Two F atoms sit above and below (the **axial** positions): each is at **90°** to the equator.
      - The two axial bonds are 180° from each other.

  - type: check
    title: Five and six pairs
    questions: [pf5-angles, sf6-shape, sf6-angle-count]

  - type: misconceptions
    items:
      - wrong: "$\\text{CH}_4$ is square planar with 90° bond angles, as it looks on paper."
        right: "It's tetrahedral, 109.5°. Flat drawings hide the third dimension."
      - wrong: "$\\text{CO}_2$ has four bonds around C, so it's tetrahedral."
        right: "Each C=O double bond counts as **one** region. Two regions → linear, 180°."
      - wrong: "Electron pairs spread out because the atoms bonded to them repel."
        right: "It's the **electron pairs** that repel each other, being negative."

  - type: exam
    body: |
      - "State and explain" needs: the number of bonding pairs and lone pairs around the central atom, that the pairs **repel**, that they get **as far apart as possible** (to minimise repulsion), then the **shape name** and **angle**.
      - In a 3D drawing, use wedges and hashed wedges, and label at least one bond angle.

  - type: takeaways
    items:
      - "VSEPR: electron pairs around the central atom repel and get as far apart as possible."
      - "Count regions: each bond (single, double or triple) and each lone pair is one region."
      - "2 linear 180°; 3 trigonal planar 120°; 4 tetrahedral 109.5°."
      - "5 trigonal bipyramidal 120° and 90°; 6 octahedral 90°."

  - type: check
    title: Explain it
    questions: [explain-co2]

questions:
  - id: vsepr-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      In VSEPR theory, the electron pairs around a central atom {{1}} each other and arrange themselves as {{2}} apart as possible.
    blanks:
      - accept: ["repel"]
      - accept: ["far"]
    explanation: |
      Electron pairs are negative, so they repel, and they spread out to minimise that repulsion.

  - id: bf3-shape
    format: mcq
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      What is the shape of a $\text{BF}_3$ molecule?
    options:
      - text: Trigonal planar
        correct: true
        why: |
          3 bonding pairs and no lone pairs on B: a flat triangle with 120° angles.
      - text: Pyramidal
        why: |
          A pyramid needs a lone pair on the central atom, as in $\text{NH}_3$. B has none.
      - text: Tetrahedral
        why: |
          Tetrahedral needs 4 regions. B has only 3.
      - text: Linear
        why: |
          Linear needs only 2 regions.
    explanation: |
      B has 3 outer electrons → 3 B–F bonds, no lone pairs → trigonal planar, 120°.

  - id: ch4-angle
    format: numeric
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Using VSEPR, what is the predicted H–C–H bond angle in methane, $\text{CH}_4$?
    fields:
      - answer: 109.5
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      4 bonding pairs, no lone pairs: tetrahedral, 109.5°.

  - id: pf5-angles
    format: numeric
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      $\text{PF}_5$ is trigonal bipyramidal. Give the VSEPR-predicted F–P–F bond angles:
    fields:
      - label: "between two bonds in the middle (equatorial) triangle:"
        answer: 120
        tolerance: { abs: 0.5 }
        unit: "°"
      - label: "between a top or bottom (axial) bond and a middle bond:"
        answer: 90
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      The three equatorial F atoms form a flat triangle (120°). The two axial F atoms sit above and below it, at 90° to each equatorial bond.

  - id: sf6-shape
    format: mcq
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Which describes the shape of $\text{SF}_6$ and its VSEPR-predicted F–S–F bond angle?
    options:
      - text: Hexagonal planar, 60°
        why: |
          Six pairs in a flat ring would be crowded. In 3D they can get much further apart.
      - text: Trigonal bipyramidal, 120° and 90°
        why: |
          That's the shape for 5 regions, like $\text{PF}_5$.
      - text: Octahedral, 90°
        correct: true
        why: |
          6 bonding pairs, no lone pairs: four F around the middle and one above and below. Every F is at 90° to its four neighbours.
      - text: Tetrahedral, 109.5°
        why: |
          That's for 4 regions, like $\text{CH}_4$.
    explanation: |
      6 regions → octahedral, 90°. (S expands its octet: 12 electrons around it.)

  - id: explain-co2
    format: explain
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      Explain why a carbon dioxide molecule is **linear**.
    model: |
      The carbon atom forms two C=O double bonds and has no lone pairs. Each double bond counts as one region of electron density, so there are two regions around C. These repel each other and get as far apart as possible, on opposite sides of the carbon atom, so the molecule is linear with an O–C–O bond angle of 180°.
    keyPoints:
      - "C has two C=O double bonds and no lone pairs"
      - "Each double bond counts as one region of electron density"
      - "The two regions repel and get as far apart as possible"
      - "So the molecule is linear, bond angle 180°"
    explanation: |
      Treating each double bond as one region is the step most often missed.

  - id: sf6-angle-count
    format: numeric
    difficulty: 3
    objectives: ["3.5.1"]
    prompt: |
      $\text{SF}_6$ has 15 F–S–F bond angles (one for every pair of F atoms). How many of them are 90° and how many are 180°?
    fields:
      - label: "90° angles ="
        answer: 12
      - label: "180° angles ="
        answer: 3
    explanation: |
      Each F has one F directly opposite (180°) and four at 90°. So there are 6 × 4 ÷ 2 = 12 angles of 90° and 6 ÷ 2 = 3 angles of 180°. Check: 12 + 3 = 15.
