id: bronsted-lowry-neutralisation
subject: "9701"
topic: "7.2"
title: Neutralisation — H⁺ meets OH⁻
summary: "The essence of neutralisation: H⁺ + OH⁻ → H₂O. Writing ionic equations, enthalpy of neutralisation, and why strong acid + strong base always gives –57 kJ mol⁻¹."
order: 6
minutes: 4
objectives: ["7.2.7"]
prerequisites: ["bronsted-lowry-strong-weak"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 7; neutralisation reactions).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can write the ionic equation for neutralisation, explain why ΔH_neut for strong acid + strong base is –57 kJ mol⁻¹, and predict the pH of the resulting solution.

  - type: explain
    title: The heart of neutralisation
    body: |
      Neutralisation is **one reaction** at its core:
      $$\text{H}^+(\text{aq}) + \text{OH}^-(\text{aq}) \rightarrow \text{H}_2\text{O(l)}$$

      Everything else (spectator ions, salts, enthalpy) is just packaging around this.

  - type: example
    title: Molecular, ionic, and net ionic
    problem: |
      Write the three equations for HCl + NaOH.
    steps:
      - "Molecular: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)"
      - "Full ionic: H⁺(aq) + Cl⁻(aq) + Na⁺(aq) + OH⁻(aq) → Na⁺(aq) + Cl⁻(aq) + H₂O(l)"
      - "Cancel spectators (Na⁺, Cl⁻):"
      - "Net ionic: H⁺(aq) + OH⁻(aq) → H₂O(l)"
    answer: |
      Net ionic: H⁺(aq) + OH⁻(aq) → H₂O(l)

  - type: check
    title: Neutralisation equations
    questions: [net-ionic-h2so4-naoh, net-ionic-ch3cooh-naoh]

  - type: explain
    title: Enthalpy of neutralisation
    body: |
      **Standard enthalpy of neutralisation (ΔHₙₑᵤₜ)**: enthalpy change when 1 mole of H⁺(aq) reacts with 1 mole of OH⁻(aq) to form 1 mole of H₂O(l) under standard conditions (298 K, 100 kPa).

      For **strong acid + strong base**: ΔHₙₑᵤₜ ≈ **–57 kJ mol⁻¹** (exothermic).

      Why the same value? Because the net reaction is *always* H⁺ + OH⁻ → H₂O. The strong acid and strong base are fully dissociated — no energy needed to break bonds in the reactants.

  - type: explain
    title: Weak acid or weak base changes ΔH
    body: |
      If **either** reactant is weak:
      - Energy is **absorbed** to dissociate the weak acid/base (endothermic, +ve)
      - Net ΔHₙₑᵤₜ is **less exothermic** (less negative) than –57 kJ mol⁻¹

      Example: CH₃COOH + NaOH → ΔH ≈ –55 to –56 kJ mol⁻¹
      (The ~2 kJ mol⁻¹ difference is the energy to dissociate CH₃COOH)

      | Combination | ΔHₙₑᵤₜ (kJ mol⁻¹) |
      |-------------|-------------------|
      | Strong acid + Strong base | –57 |
      | Weak acid + Strong base | –55 to –56 |
      | Strong acid + Weak base | –55 to –56 |
      | Weak acid + Weak base | –53 to –55 |

  - type: check
    title: Enthalpy of neutralisation
    questions: [enthalpy-neutralisation-1, enthalpy-neutralisation-2]

  - type: explain
    title: What's the pH after neutralisation?
    body: |
      It depends on what you're neutralising:
      - **Strong acid + strong base** → pH = 7 (neutral salt, e.g. NaCl)
      - **Weak acid + strong base** → pH > 7 (basic salt, e.g. CH₃COONa hydrolyses: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻)
      - **Strong acid + weak base** → pH < 7 (acidic salt, e.g. NH₄Cl hydrolyses: NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺)
      - **Weak acid + weak base** → pH depends on relative Ka/Kb (could be <7, =7, or >7)

  - type: misconceptions
    items:
      - wrong: "Neutralisation always gives pH 7."
        right: "Only strong acid + strong base gives pH 7. Weak acid/base combinations give acidic or basic salts."
      - wrong: "The salt formed is always neutral."
        right: "Salts of weak acids (e.g. CH₃COO⁻) are basic. Salts of weak bases (e.g. NH₄⁺) are acidic."
      - wrong: "ΔHₙₑᵤₜ is –57 kJ mol⁻¹ for all acid–base reactions."
        right: "Only for strong + strong. Weak acid or base makes it less exothermic because energy is needed to dissociate them first."
      - wrong: "Heat is released because H⁺ and OH⁻ 'like' each other."
        right: "Heat is released because forming the O–H bonds in water releases more energy than breaking the ion–water interactions absorbs."

  - type: takeaways
    items:
      - "Core reaction: H⁺(aq) + OH⁻(aq) → H₂O(l)"
      - "Net ionic equation cancels spectator ions."
      - "Strong + strong → ΔHₙₑᵤₜ = –57 kJ mol⁻¹"
      - "Weak acid or base → ΔHₙₑᵤₜ > –57 kJ mol⁻¹ (less negative)"
      - "pH after neutralisation: strong+strong=7, weak+strong>7, strong+weak<7"
      - "Salts can be acidic, basic, or neutral depending on parent acid/base strength."

questions:
  - id: net-ionic-h2so4-naoh
    format: text
    style: short
    difficulty: 2
    objectives: ["7.2.7"]
    prompt: |
      Write the **net ionic equation** for the reaction between H₂SO₄(aq) and NaOH(aq). Use H+ for H⁺, OH- for OH⁻, H2O for H₂O.
    accept:
      - "2H+ + 2OH- -> 2H2O"
      - "H+ + OH- -> H2O"
      - "2 H+ + 2 OH- -> 2 H2O"
    model: "2H⁺ + 2OH⁻ → 2H₂O (or H⁺ + OH⁻ → H₂O)"
    explanation: |
      H₂SO₄ provides 2 H⁺ per mole. Net ionic: 2H⁺ + 2OH⁻ → 2H₂O, or simplified H⁺ + OH⁻ → H₂O per mole of H⁺.

  - id: net-ionic-ch3cooh-naoh
    format: text
    style: short
    difficulty: 2
    objectives: ["7.2.7"]
    prompt: |
      Write the **net ionic equation** for the reaction between CH₃COOH(aq) and NaOH(aq). CH₃COOH is a weak acid (write it as CH3COOH). Use OH- for OH⁻, H2O for H₂O, CH3COO- for CH₃COO⁻.
    accept:
      - "CH3COOH + OH- -> CH3COO- + H2O"
      - "CH3COOH + OH- -> H2O + CH3COO-"
    model: "CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O"
    explanation: |
      Weak acid stays as molecule; OH⁻ reacts with it directly. CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O.

  - id: enthalpy-neutralisation-1
    format: mcq
    difficulty: 2
    objectives: ["7.2.7"]
    prompt: |
      The standard enthalpy of neutralisation for HCl + NaOH is –57 kJ mol⁻¹. For CH₃COOH + NaOH it is approximately –55 kJ mol⁻¹. Why is it less exothermic?
    options:
      - text: "CH₃COOH is a weaker acid so it releases less heat"
        why: "Vague. The reason is specific: energy is needed to dissociate CH₃COOH."
      - text: "Energy is absorbed to dissociate the weak acid CH₃COOH before it can react"
        correct: true
        why: "CH₃COOH ⇌ H⁺ + CH₃COO⁻ is endothermic. This energy cost makes the overall ΔH less negative."
      - text: "The reaction produces less water"
        why: "Same moles of water are produced per mole of H⁺."
      - text: "NaOH is not fully dissociated in this reaction"
        why: "NaOH is a strong base — it IS fully dissociated."
    explanation: |
      Weak acids are not fully dissociated. Energy must be supplied to break the CH₃COOH bond (endothermic), making the overall enthalpy change less exothermic.

  - id: enthalpy-neutralisation-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.7"]
    prompt: |
      Which combination would give the **least exothermic** (closest to zero) enthalpy of neutralisation?
    options:
      - text: "HCl + NaOH"
        why: "Strong + strong = –57 kJ mol⁻¹ (most exothermic)."
      - text: "CH₃COOH + NaOH"
        why: "Weak acid + strong base ≈ –55 to –56 kJ mol⁻¹."
      - text: "HCl + NH₃"
        why: "Strong acid + weak base ≈ –55 to –56 kJ mol⁻¹."
      - text: "CH₃COOH + NH₃"
        correct: true
        why: "Weak acid + weak base. Both need energy to dissociate. ΔH ≈ –53 to –55 kJ mol⁻¹ (least exothermic)."
    explanation: |
      Weak acid + weak base requires dissociation energy for BOTH, so the net enthalpy change is least exothermic.