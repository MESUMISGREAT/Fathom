id: bronsted-lowry-theory
subject: "9701"
topic: "7.2"
title: Brønsted–Lowry — the proton-passing game
summary: "The Brønsted–Lowry definition: acids donate protons, bases accept them. Conjugate acid–base pairs and why water is the ultimate middleman."
order: 2
minutes: 4
objectives: ["7.2.3"]
prerequisites: ["bronsted-lowry-common-acids-bases"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 3; Brønsted–Lowry theory).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can state the Brønsted–Lowry definitions of acids and bases, identify conjugate acid–base pairs, and explain why water can act as both acid and base.

  - type: explain
    title: The 1923 upgrade
    body: |
      Before 1923, acids were "substances that produce H⁺ in water" (Arrhenius). That worked for HCl and NaOH but failed for ammonia and gas-phase reactions.

      **Johannes Brønsted** (Denmark) and **Thomas Lowry** (England) independently proposed the same idea:
      > **An acid is a proton donor. A base is a proton acceptor.**

      A **proton** is just a hydrogen nucleus: $\\text{H}^+$ (no electrons, just one proton).

  - type: definition
    term: Brønsted–Lowry acid
    body: |
      A species that **donates** a proton ($\\text{H}^+$) to another species.

  - type: definition
    term: Brønsted–Lowry base
    body: |
      A species that **accepts** a proton ($\\text{H}^+$) from another species.

  - type: check
    title: Acid or base?
    questions: [donor-acceptor-pick, hcl-water-acid-base]

  - type: explain
    title: Conjugate pairs — the before and after
    body: |
      When an acid donates a proton, what's left is its **conjugate base**.
      When a base accepts a proton, what's formed is its **conjugate acid**.

      $$\\text{Acid} \\rightleftharpoons \\text{H}^+ + \\text{Conjugate base}$$
      $$\\text{Base} + \\text{H}^+ \\rightleftharpoons \\text{Conjugate acid}$$

      They differ by **exactly one proton**.

  - type: example
    title: HCl and water
    problem: |
      Identify the acid, base, conjugate acid, and conjugate base in:
      $$\\text{HCl(aq)} + \\text{H}_2\\text{O(l)} \\rightarrow \\text{Cl}^-\\text{(aq)} + \\text{H}_3\\text{O}^+\\text{(aq)}$$
    steps:
      - "HCl **donates** a proton → **acid**."
      - "Water **accepts** a proton → **base**."
      - "Cl⁻ is what's left after HCl loses H⁺ → **conjugate base** of HCl."
      - "H₃O⁺ is what's formed when water gains H⁺ → **conjugate acid** of water."
    answer: |
      Acid = HCl, Base = H₂O, Conjugate base = Cl⁻, Conjugate acid = H₃O⁺.

  - type: explain
    title: Meet the hydronium ion
    body: |
      A bare proton ($\\text{H}^+$) is **tiny** and **intensely charged** — it never exists alone in water. It instantly latches onto a water molecule:

      $$\\text{H}^+ + \\text{H}_2\\text{O} \\rightarrow \\text{H}_3\\text{O}^+$$

      **Hydronium ion** $\\text{H}_3\\text{O}^+$ is what we actually have in acidic solutions. For simplicity, Cambridge often writes $\\text{H}^+\\text{(aq)}$, but $\\text{H}_3\\text{O}^+\\text{(aq)}$ is more accurate.

  - type: check
    title: Conjugate pairs
    questions: [conjugate-pair-match, nh3-conjugate]

  - type: intuition
    title: The proton hot potato
    body: |
      Think of a proton as a **hot potato**. An acid is holding it and wants to throw it away. A base has empty hands and wants to catch it. Once the base catches it, *it* becomes the new acid (it now holds the potato and could throw it back).

      The **stronger** the acid, the **more desperately** it wants to get rid of the proton — and the **weaker** its conjugate base (it doesn't want the potato back).

  - type: explain
    title: Water — the ultimate middleman
    body: |
      Water can **donate** a proton (acting as an acid):
      $$\\text{H}_2\\text{O} \\rightleftharpoons \\text{H}^+ + \\text{OH}^-$$

      Water can **accept** a proton (acting as a base):
      $$\\text{H}_2\\text{O} + \\text{H}^+ \\rightleftharpoons \\text{H}_3\\text{O}^+$$

      A species that can do both is **amphoteric** (or amphiprotic). Water is the classic example.

      This means water can react with **both** acids and bases — it's the solvent that makes Brønsted–Lowry acid–base reactions possible in aqueous solution.

  - type: check
    title: Amphoteric water
    questions: [water-amphoteric, water-donor-acceptor]

  - type: misconceptions
    items:
      - wrong: "Acids give away electrons."
        right: "Acids give away **protons** (H⁺). Electrons are for redox."
      - wrong: "The conjugate base of a strong acid is a strong base."
        right: "Opposite! Strong acid → **very weak** conjugate base (it has no desire to accept the proton back)."
      - wrong: "H⁺ and H₃O⁺ are totally different things."
        right: "H⁺(aq) is shorthand for H₃O⁺(aq). They mean the same species in aqueous solution."

  - type: takeaways
    items:
      - "Acid = proton donor. Base = proton acceptor."
      - "Conjugate pairs differ by one H⁺: acid ⇌ H⁺ + conjugate base."
      - "H⁺(aq) is really H₃O⁺(aq) — the hydronium ion."
      - "Water is amphoteric: it can donate OR accept a proton."
      - "Strong acid ⇔ weak conjugate base. Strong base ⇔ weak conjugate acid."

questions:
  - id: donor-acceptor-pick
    format: mcq
    difficulty: 1
    objectives: ["7.2.3"]
    prompt: |
      In the Brønsted–Lowry theory, a base is defined as:
    options:
      - text: "A substance that donates protons"
        why: "That's the definition of an acid."
      - text: "A substance that accepts protons"
        correct: true
        why: "Correct: a base is a proton acceptor."
      - text: "A substance that produces OH⁻ in water"
        why: "That's the Arrhenius definition of a base, not Brønsted–Lowry."
      - text: "A substance that accepts electrons"
        why: "That's a Lewis base. Brønsted–Lowry is specifically about protons."
    explanation: |
      Brønsted–Lowry base = proton acceptor. Acid = proton donor. Simple as that.

  - id: hcl-water-acid-base
    format: mcq
    difficulty: 2
    objectives: ["7.2.3"]
    prompt: |
      In the reaction $\\text{HCl(aq)} + \\text{H}_2\\text{O(l)} \\rightarrow \\text{H}_3\\text{O}^+\\text{(aq)} + \\text{Cl}^-\\text{(aq)}$, which species acts as the Brønsted–Lowry base?
    options:
      - text: "HCl"
        why: "HCl donates a proton, so it's the acid."
      - text: "H₂O"
        correct: true
        why: "Water accepts a proton from HCl, so it acts as the base."
      - text: "H₃O⁺"
        why: "H₃O⁺ is the conjugate acid of water (formed when water accepts H⁺)."
      - text: "Cl⁻"
        why: "Cl⁻ is the conjugate base of HCl (formed when HCl donates H⁺)."
    explanation: |
      The base is the proton acceptor. Water accepts H⁺ from HCl to become H₃O⁺.

  - id: conjugate-pair-match
    format: mcq
    difficulty: 1
    objectives: ["7.2.3"]
    prompt: |
      Which is a correct conjugate acid–base pair?
    options:
      - text: "HCl / Cl⁻"
        correct: true
        why: "They differ by exactly one proton: HCl ⇌ H⁺ + Cl⁻."
      - text: "H₂SO₄ / SO₄²⁻"
        why: "They differ by TWO protons. The conjugate base of H₂SO₄ is HSO₄⁻."
      - text: "NH₃ / NH₂⁻"
        why: "NH₃ + H⁺ → NH₄⁺ (conjugate acid). NH₂⁻ would be the conjugate base of NH₃⁻ (not relevant)."
      - text: "H₂O / O²⁻"
        why: "They differ by two protons. The conjugate base of H₂O is OH⁻."
    explanation: |
      Conjugate pairs ALWAYS differ by exactly one H⁺.

  - id: nh3-conjugate
    format: mcq
    difficulty: 2
    objectives: ["7.2.3"]
    prompt: |
      What is the conjugate acid of ammonia, $\\text{NH}_3$?
    options:
      - text: "NH₂⁻"
        why: "That would be the conjugate base if NH₃ acted as an acid (donating H⁺)."
      - text: "NH₄⁺"
        correct: true
        why: "NH₃ + H⁺ → NH₄⁺. Ammonia accepts a proton to form its conjugate acid."
      - text: "NH₄OH"
        why: "Not a real species; it's an outdated way of writing aqueous ammonia."
      - text: "N₂H₄"
        why: "That's hydrazine, a completely different compound."
    explanation: |
      Conjugate acid = base + H⁺. For NH₃, that's NH₄⁺ (ammonium ion).

  - id: water-amphoteric
    format: mcq
    difficulty: 2
    objectives: ["7.2.3"]
    prompt: |
      Water acts as a Brønsted–Lowry acid when it reacts with:
    options:
      - text: "HCl"
        why: "With HCl, water accepts a proton (base)."
      - text: "NH₃"
        correct: true
        why: "NH₃ + H₂O ⇌ NH₄⁺ + OH⁻. Water donates a proton to ammonia, so water is the acid."
      - text: "NaOH"
        why: "NaOH dissociates to Na⁺ + OH⁻. Water is the solvent, not donating protons."
      - text: "H₂SO₄"
        why: "With H₂SO₄, water accepts a proton (base)."
    explanation: |
      Water donates H⁺ to a stronger base (like NH₃), acting as an acid. With stronger acids, water accepts H⁺ and acts as a base.

  - id: water-donor-acceptor
    format: mcq
    difficulty: 2
    objectives: ["7.2.3"]
    prompt: |
      Which equation shows water acting as a **proton donor**?
    options:
      - text: "$\\text{H}_2\\text{O} + \\text{H}^+ \\rightarrow \\text{H}_3\\text{O}^+$"
        why: "Water accepts H⁺ here — it's acting as a base."
      - text: "$\\text{H}_2\\text{O} \\rightleftharpoons \\text{H}^+ + \\text{OH}^-$"
        correct: true
        why: "Water donates H⁺, leaving OH⁻. This is water as an acid."
      - text: "$\\text{H}_2\\text{O} + \\text{NH}_3 \\rightarrow \\text{NH}_4^+ + \\text{OH}^-$"
        why: "This is the overall reaction, but water donates H⁺ in the forward direction. The equilibrium shows it better."
      - text: "$\\text{H}_3\\text{O}^+ + \\text{OH}^- \\rightarrow 2\\text{H}_2\\text{O}$"
        why: "This is neutralisation; H₃O⁺ donates, OH⁻ accepts."
    explanation: |
      Acid = proton donor. The autoionisation of water (H₂O ⇌ H⁺ + OH⁻) shows water donating a proton.