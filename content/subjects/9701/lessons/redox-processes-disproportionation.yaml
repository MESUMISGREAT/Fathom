blocks:
  - type: objective
    body: |-
      By the end you can define **disproportionation**, recognise it from oxidation numbers, and explain the chlorine/alkali and hydrogen-peroxide examples.

  - type: explain
    title: When one atom plays both parts
    body: |-
      Usually one element is oxidised and a different element is reduced.

      Occasionally the **same element** does both in the same reaction. One atom of it loses electrons while another atom of the same element gains them.

      This is called **disproportionation**, and it is a favourite exam topic because it looks impossible at first glance.

  - type: definition
    term: Disproportionation
    body: |-
      **Disproportionation** is a redox reaction in which the **same element** is simultaneously **oxidised and reduced**.

      In oxidation-number terms, atoms of the element start at one value and end at **two different values**, one higher and one lower.

      The starting oxidation number must therefore be intermediate between the two products: it can go up or down from there.

  - type: example
    title: "Worked example: chlorine in cold dilute alkali"
    problem: |-
      Chlorine reacts with cold, dilute sodium hydroxide:

      $$\text{Cl}_2 + 2\text{NaOH} \rightarrow \text{NaCl} + \text{NaOCl} + \text{H}_2\text{O}$$

      Show that this is disproportionation.
    steps:
      - |-
        In $\text{Cl}_2$, chlorine is an uncombined element, so its oxidation number is $0$.
      - |-
        In $\text{NaCl}$, chloride is $\text{Cl}^-$, so chlorine is $-1$. It has been **reduced**.
      - |-
        In $\text{NaOCl}$, sodium is $+1$ and oxygen is $-2$. Let chlorine be $x$:

        $$+1 + x - 2 = 0 \Rightarrow x = +1$$
      - |-
        So chlorine is $+1$ in the chlorate(I) ion. It has been **oxidised**.
      - |-
        The same element, chlorine, has gone from $0$ to both $-1$ and $+1$ in one reaction.
    answer: |-
      Yes: chlorine is both reduced ($0 \rightarrow -1$) and oxidised ($0 \rightarrow +1$).

  - type: diagram
    diagram: chem-redox-disproportionation
    alt: >-
      An oxidation-number diagram for chlorine. A central box shows chlorine at oxidation number
      zero in Cl2. One arrow points down to minus one in NaCl, labelled reduction. A second arrow
      points up to plus one in NaOCl, labelled oxidation. Both arrows start from the same chlorine,
      showing that one element is simultaneously oxidised and reduced.
    caption: |-
      From oxidation number 0, chlorine can move down to $-1$ or up to $+1$ — and in cold alkali it does both at once.

  - type: intuition
    title: Why an element can go both ways
    body: |-
      Chlorine in $\text{Cl}_2$ sits at oxidation number $0$, which is between $-1$ (chloride) and $+1$ (chlorate(I)).

      Because it is in the middle, it can move either way depending on what it meets. Some chlorine atoms meet a species that takes electrons; others meet a species that gives them.

      In cold dilute alkali, both possibilities happen in the same flask.

      The same logic explains hydrogen peroxide: oxygen at $-1$ sits between $-2$ (water) and $0$ (oxygen gas), so it can disproportionate too.

  - type: example
    title: "Worked example: hydrogen peroxide"
    problem: |-
      Hydrogen peroxide decomposes:

      $$2\text{H}_2\text{O}_2 \rightarrow 2\text{H}_2\text{O} + \text{O}_2$$

      Show that this is disproportionation.
    steps:
      - |-
        In $\text{H}_2\text{O}_2$, each oxygen is $-1$ (the peroxide exception).
      - |-
        In $\text{H}_2\text{O}$, oxygen is $-2$. That is a decrease, so some oxygen is **reduced**.
      - |-
        In $\text{O}_2$, oxygen is $0$. That is an increase, so some oxygen is **oxidised**.
      - |-
        The same element, oxygen, starts at $-1$ and ends at both $-2$ and $0$.
      - |-
        Check the atom count: four oxygen atoms on the left; two in water plus two in $\text{O}_2$ on the right. ✔
    answer: |-
      Yes: oxygen is reduced from $-1$ to $-2$ and oxidised from $-1$ to $0$.

  - type: check
    title: Quick check
    questions: [disproportionation-definition, chlorate-oxidation-number, which-is-disproportionation]

  - type: explain
    title: Hot, concentrated alkali gives a different product
    body: |-
      Change the conditions and chlorine still disproportionates, but to a different oxidation state.

      With hot, concentrated sodium hydroxide:

      $$3\text{Cl}_2 + 6\text{NaOH} \rightarrow 5\text{NaCl} + \text{NaClO}_3 + 3\text{H}_2\text{O}$$

      Chlorine is still $0$ in $\text{Cl}_2$. In $\text{NaCl}$ it is $-1$ again.

      In $\text{NaClO}_3$, sodium is $+1$ and the three oxygens give $-6$, so the chlorate(V) ion has chlorine at $+5$:

      $$+1 + x + 3(-2) = 0 \Rightarrow x = +5$$

      So chlorine goes from $0$ to $-1$ (reduction) and from $0$ to $+5$ (oxidation).

      The reaction is still disproportionation — only the oxidised product has changed.

  - type: example
    title: "Worked example: copper(I) oxide with acid"
    problem: |-
      Copper(I) oxide reacts with dilute sulfuric acid:

      $$\text{Cu}_2\text{O} + \text{H}_2\text{SO}_4 \rightarrow \text{Cu} + \text{CuSO}_4 + \text{H}_2\text{O}$$

      Show that copper disproportionates.
    steps:
      - |-
        In $\text{Cu}_2\text{O}$, oxygen is $-2$, so the two coppers total $+2$ and each copper is $+1$.
      - |-
        In $\text{Cu}$, the metal is an uncombined element, so copper is $0$. That is a decrease: some copper is **reduced**.
      - |-
        In $\text{CuSO}_4$, sulfate is $-2$, so copper is $+2$. That is an increase: some copper is **oxidised**.
      - |-
        Copper starts at $+1$ and finishes at both $0$ and $+2$.
    answer: |-
      Yes: copper is reduced from $+1$ to $0$ and oxidised from $+1$ to $+2$.

  - type: check
    title: Practice
    questions: [hot-alkali-product, disproportionation-cloze, disprop-spot-error]

  - type: misconceptions
    items:
      - wrong: Disproportionation means two different elements are oxidised and reduced.
        right: |-
          It is specifically the **same element** that is both oxidised and reduced.
      - wrong: In $\text{Cl}_2 + 2\text{NaOH}$, chlorine is only reduced.
        right: |-
          Some chlorine becomes $\text{Cl}^-$ (reduced) and some becomes $\text{ClO}^-$ (oxidised).
      - wrong: The oxidation number of chlorine in $\text{NaClO}$ is $-1$.
        right: |-
          It is $+1$: $+1 + x - 2 = 0$, so $x = +1$.
      - wrong: Disproportionation can start from any oxidation number.
        right: |-
          The starting value must be intermediate, so the element can move both up and down.
      - wrong: The two products must contain equal amounts of the element.
        right: |-
          Not usually. In $3\text{Cl}_2 + 6\text{NaOH}$, five chlorines are reduced and only one is
          oxidised, which is why the equation needs coefficients.

  - type: exam
    body: |-
      - To prove disproportionation, quote the oxidation number of the element in the reactant and in **both** products, and say which is higher and which is lower.
      - Do not just say "chlorine is oxidised and reduced". Give the numbers.
      - Watch the conditions: cold dilute alkali gives chlorate(I), $\text{ClO}^-$; hot concentrated alkali gives chlorate(V), $\text{ClO}_3^-$.
      - Balance the hot-alkali equation by counting atoms: 6 Cl on the left means 5 NaCl + 1 NaClO₃ on the right.

  - type: takeaways
    items:
      - '**Disproportionation** is the simultaneous oxidation and reduction of the same element.'
      - 'The element starts at an intermediate oxidation number and ends at one higher and one lower value.'
      - 'Cold dilute alkali: $\text{Cl}_2 \rightarrow \text{Cl}^-$ and $\text{ClO}^-$ (chlorine $0 \rightarrow -1$ and $+1$).'
      - 'Hot concentrated alkali: $\text{Cl}_2 \rightarrow \text{Cl}^-$ and $\text{ClO}_3^-$ (chlorine $0 \rightarrow -1$ and $+5$).'
      - 'Hydrogen peroxide disproportionates: oxygen $-1 \rightarrow -2$ and $0$.'

  - type: deeper
    title: Why bleach is made this way
    body: |-
      The cold-alkali reaction is how household bleach is manufactured: sodium chlorate(I), $\text{NaOCl}$, is the active ingredient.

      Warm the same mixture and the chlorate(I) disproportionates again, this time to chloride and chlorate(V), which is much less useful as a bleach. That is why bleach is stored cool and away from acid — acid makes it decompose faster and release chlorine.

questions:
  - id: disproportionation-definition
    format: mcq
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      What is disproportionation?
    options:
      - text: A reaction in which the same element is simultaneously oxidised and reduced
        correct: true
        why: |-
          One element starts at a single oxidation number and ends at two different ones.
      - text: A reaction in which one element is oxidised and a different element is reduced
        why: |-
          That is ordinary redox, not disproportionation.
      - text: A reaction in which a compound splits into two simpler compounds
        why: |-
          Decomposition can be disproportionation, but splitting alone is not the definition.
      - text: A reaction in which electrons are not transferred
        why: |-
          Disproportionation is a redox reaction, so electrons are transferred.
    explanation: |-
      The defining feature is one element being both oxidised and reduced.

  - id: chlorate-oxidation-number
    format: numeric
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      What is the oxidation number of chlorine in the chlorate(I) ion, $\text{ClO}^-$?
    fields:
      - label: "Cl ="
        answer: 1
        tolerance: { abs: 0.01 }
    explanation: |-
      $x + (-2) = -1$, so $x = +1$.

  - id: which-is-disproportionation
    format: mcq
    difficulty: 2
    objectives: ["6.1.3"]
    prompt: |-
      Which reaction is a disproportionation?
    options:
      - text: $\text{Cl}_2 + 2\text{NaOH} \rightarrow \text{NaCl} + \text{NaOCl} + \text{H}_2\text{O}$
        correct: true
        why: |-
          Chlorine goes from 0 to $-1$ and to $+1$: the same element is both reduced and oxidised.
      - text: $\text{Zn} + 2\text{HCl} \rightarrow \text{ZnCl}_2 + \text{H}_2$
        why: |-
          Zinc is oxidised and hydrogen is reduced — two different elements.
      - text: $\text{NaOH} + \text{HCl} \rightarrow \text{NaCl} + \text{H}_2\text{O}$
        why: |-
          This is a neutralisation reaction with no oxidation-number changes.
      - text: $2\text{Na} + \text{Cl}_2 \rightarrow 2\text{NaCl}$
        why: |-
          Sodium is oxidised and chlorine is reduced — different elements.
    explanation: |-
      Only the chlorine/alkali reaction has one element changing to two different oxidation states.

  - id: hot-alkali-product
    format: mcq
    difficulty: 2
    objectives: ["6.1.3"]
    prompt: |-
      Chlorine reacts with **hot, concentrated** sodium hydroxide. Which chlorine-containing product is formed by **oxidation** of chlorine?
    options:
      - text: $\text{NaClO}_3$, with chlorine at $+5$
        correct: true
        why: |-
          Chlorine is oxidised from 0 to $+5$; the other product, NaCl, contains chlorine at $-1$.
      - text: $\text{NaCl}$, with chlorine at $-1$
        why: |-
          That is the reduction product.
      - text: $\text{NaClO}$, with chlorine at $+1$
        why: |-
          That is the cold, dilute alkali product.
      - text: $\text{Cl}_2$, with chlorine at 0
        why: |-
          That is the reactant, not a product of the reaction.
    explanation: |-
      Hot concentrated alkali gives chlorate(V), where chlorine is $+5$.

  - id: disproportionation-cloze
    format: cloze
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      In disproportionation, the same element is simultaneously {{1}} and {{2}}.
    blanks:
      - accept: [oxidised, oxidized]
      - accept: [reduced]
    explanation: |-
      One element moves to a higher and a lower oxidation number at the same time.

  - id: disprop-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["6.1.3"]
    prompt: |-
      A student analyses $\text{Cl}_2 + 2\text{NaOH} \rightarrow \text{NaCl} + \text{NaOCl} + \text{H}_2\text{O}$. Which line contains the first error?
    lines:
      - Chlorine in Cl2 has oxidation number 0.
      - In NaCl, chlorine is -1, so chlorine has been reduced.
      - In NaOCl, chlorine is +1, so chlorine has been oxidised.
      - This is not disproportionation, because chlorine is only reduced.
    errorLine: 4
    fix: |-
      Chlorine is both reduced (0 to $-1$) and oxidised (0 to $+1$) in the same reaction, which is exactly what disproportionation means. The conclusion in line 4 contradicts lines 2 and 3.
    explanation: |-
      Lines 1–3 are correct. Line 4 draws the wrong conclusion from them.
