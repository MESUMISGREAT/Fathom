id: redox-processes-disproportionation
subject: "9701"
topic: "6.1"
title: "Disproportionation: one element, two directions"
summary: In disproportionation the same element is oxidised and reduced at once — chlorine in cold alkali is the classic case.
order: 4
minutes: 8
kind: core
