id: period-3-chemical-oxidation-numbers
subject: "9701"
topic: "9.2"
title: Oxidation numbers in the Period 3 oxides and chlorides
summary: "Read the oxidation number straight off the outer-shell electron count: +1 to +6 in the Period 3 oxides and chlorides, and why it rises across the period."
order: 2
minutes: 5
kind: core
objectives: ["9.2.2"]
prerequisites: [period-3-chemical-oxygen-chlorine-water]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027, topic 9.2 learning outcome 2 (oxidation numbers in Na2O, MgO,
    Al2O3, P4O10, SO2, SO3 and in NaCl, MgCl2, AlCl3, SiCl4, PCl5). All questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can state the oxidation number of the Period 3 element in each of the syllabus oxides and chlorides, and explain why it rises by one across the period.

  - type: explain
    title: The bookkeeping number
    body: |
      An **oxidation number** is the charge an atom *would* have if every shared pair of electrons in its bonds belonged to the **more electronegative** atom.

      You do not have to draw those bonds for Period 3 oxides and chlorides. There is a shortcut: the oxidation number of the Period 3 element is decided by how many **outer-shell electrons** it has put towards bonding with oxygen or chlorine.

      Oxygen is more electronegative than every Period 3 element, and chlorine is more electronegative than every Period 3 element that forms a chloride here (argon forms neither oxide nor chloride). So the shared electrons are counted as belonging to oxygen or chlorine.

  - type: explain
    title: Outer electrons tell you the number
    body: |
      Across Period 3 the outer shell fills up: Na has 1 outer electron, Mg 2, Al 3, Si 4, P 5, S 6, Cl 7. That count is the **maximum positive oxidation number** each element can show.

      | element | outer electrons | oxide | oxidation number in that oxide | chloride | oxidation number in that chloride |
      | --- | --- | --- | --- | --- | --- |
      | Na | 1 | $\text{Na}_2\text{O}$ | +1 | $\text{NaCl}$ | +1 |
      | Mg | 2 | $\text{MgO}$ | +2 | $\text{MgCl}_2$ | +2 |
      | Al | 3 | $\text{Al}_2\text{O}_3$ | +3 | $\text{AlCl}_3$ | +3 |
      | Si | 4 | $\text{SiO}_2$ | +4 | $\text{SiCl}_4$ | +4 |
      | P | 5 | $\text{P}_4\text{O}_{10}$ | +5 | $\text{PCl}_5$ | +5 |
      | S | 6 | $\text{SO}_2$ and $\text{SO}_3$ | +4 in $\text{SO}_2$, +6 in $\text{SO}_3$ | — | — |

      Two things to notice.

      - Silicon is not on the syllabus list for learning outcome 2, but it slots into the pattern at +4. Sulfur does not get a chloride in the list.
      - Sulfur breaks the simple "one compound, one number" look because it forms **two** oxides. Its +4 in $\text{SO}_2$ is not its maximum; +6 in $\text{SO}_3$ is, and that matches its 6 outer electrons.

  - type: check
    title: Read it off
    questions: [oxidation-number-so3, phosphorus-in-p4o10]

  - type: example
    title: Worked example — phosphorus in P4O10
    problem: |
      What is the oxidation number of phosphorus in $\text{P}_4\text{O}_{10}$?
    steps:
      - |
        Set $x$ as the oxidation number of phosphorus. In a neutral compound the oxidation numbers add to **zero**.
      - |
        Oxygen is –2, and there are ten oxygen atoms, so they contribute $10 \times (-2) = -20$.
      - |
        There are four phosphorus atoms, so they contribute $4x$. Write the balance: $4x + (-20) = 0$.
      - |
        Solve it: $4x = 20$, so $x = +5$.
    answer: |
      Phosphorus is **+5** in $\text{P}_4\text{O}_{10}$, which matches its five outer-shell electrons.

  - type: explain
    title: Why it climbs by one
    body: |
      Look down the rows of the table: +1, +2, +3, +4, +5, +6. Each element has **one more outer-shell electron** than the one before, so it can supply one more "positive share" to balance the oxygen or chlorine.

      The atoms that are joined matter for the *sign*, not the size.

      - Each oxygen atom counts **–2**, so an oxide needs twice as much positivity per oxygen.
      - Each chlorine atom counts **–1**, so a chloride needs half as much per chlorine.

      That is why the answer is the same +3 for $\text{Al}_2\text{O}_3$ and $\text{AlCl}_3$ even though one compound has three oxygens for two aluminiums and the other has three chlorines for one aluminium. The sums both come to zero.

      For the ionic compounds — $\text{NaCl}$, $\text{MgCl}_2$, $\text{Al}_2\text{O}_3$ — the oxidation number equals the charge on the ion. For the covalent ones — $\text{SiCl}_4$, $\text{PCl}_5$, $\text{SO}_2$, $\text{SO}_3$ — it is a bookkeeping number, not a whole ion sitting there.

  - type: check
    title: Signs and two oxygens
    questions: [sulfur-in-so2-and-so3, oxidation-number-sign-error]

  - type: misconceptions
    items:
      - wrong: "The oxidation number of an element is always its group number."
        right: "Often it is the **maximum**, but sulfur is +4 in $\text{SO}_2$ and +6 in $\text{SO}_3$. Read which compound you have been given."
      - wrong: "Oxygen is –2, so the oxidation numbers in a compound add up to –2."
        right: "Oxygen's –2 is just its own number. In a neutral compound **all** the oxidation numbers add to **zero**."
      - wrong: "Phosphorus is +1 in $\text{PCl}_5$ because there are five chlorines."
        right: "Each chlorine is –1, so five chlorines give –5. Phosphorus must be **+5** to make the total zero."

  - type: exam
    body: |
      A one-mark question usually just asks you to **state** the oxidation number. Write the rule, then the value: "$x + 3(-2) = 0$, so $x = +6$." That keeps the mark safe even if your mental arithmetic slips.

      When you are asked to **explain** the trend, name the outer-shell electrons: "the number of outer-shell electrons increases by one across the period, so the element can form one more bond to oxygen or chlorine, raising the oxidation number by one."

      Keep oxygen at –2 and chlorine at –1 unless a question tells you otherwise. Those two values carry every calculation in this topic.

  - type: takeaways
    items:
      - "An oxidation number is the charge an atom would carry if shared electrons went to the more electronegative atom."
      - "For Period 3 oxides and chlorides, the value is set by the element's number of outer-shell electrons: Na +1, Mg +2, Al +3, Si +4, P +5."
      - "Sulfur is +4 in $\\text{SO}_2$ and +6 in $\\text{SO}_3$ — its maximum matches its six outer electrons."
      - "In a neutral compound the oxidation numbers sum to zero; use oxygen –2 and chlorine –1 to solve for the element."
      - "Ionic compounds: the oxidation number is the ion charge. Covalent compounds: it is a bookkeeping number."

  - type: check
    title: Stretch
    questions: [why-oxidation-number-rises, oxidation-numbers-oxide-and-chloride]

questions:
  - id: oxidation-number-so3
    format: mcq
    difficulty: 1
    objectives: ["9.2.2"]
    prompt: |
      What is the oxidation number of sulfur in $\text{SO}_3$?
    options:
      - text: |
          $+4$
        why: |
          That is sulfur in $\text{SO}_2$, which has only two oxygens.
      - text: |
          $+2$
        why: |
          Two oxygens at –2 would need only +4, not +2, to balance. This compound has three oxygens.
      - text: |
          $-2$
        why: |
          In these compounds the negative oxidation number belongs to oxygen, which is more electronegative than sulfur.
      - text: |
          $+6$
        correct: true
        why: |
          Three oxygens at –2 give –6, so sulfur must be +6 to make the total zero.
    explanation: |
      Let sulfur be $x$: $x + 3(-2) = 0$, so $x = +6$.

  - id: phosphorus-in-p4o10
    format: numeric
    difficulty: 1
    objectives: ["9.2.2"]
    prompt: |
      What is the oxidation number of phosphorus in $\text{P}_4\text{O}_{10}$?
    fields:
      - label: "oxidation number of P ="
        answer: 5
    explanation: |
      The oxygens give $10 \times (-2) = -20$, so the four phosphorus atoms must give +20 in total: $4x = 20$, $x = +5$.

  - id: sulfur-in-so2-and-so3
    format: cloze
    difficulty: 2
    objectives: ["9.2.2"]
    prompt: |
      In $\text{SO}_2$ the oxidation number of sulfur is {{1}}, and in $\text{SO}_3$ it is {{2}}.
    blanks:
      - accept: ["+4", "4", "+ 4"]
      - accept: ["+6", "6", "+ 6"]
    explanation: |
      $\text{SO}_2$: $x + 2(-2) = 0$ gives +4. $\text{SO}_3$: $x + 3(-2) = 0$ gives +6. The extra oxygen carries one more –2, so sulfur has to rise by two.

  - id: oxidation-number-sign-error
    format: spot-error
    difficulty: 2
    objectives: ["9.2.2"]
    prompt: |
      A student works out the oxidation number of phosphorus in $\text{P}_4\text{O}_{10}$. Which line contains the first error?
    lines:
      - "Oxygen has an oxidation number of –2 in oxides."
      - "There are ten oxygen atoms and four phosphorus atoms."
      - "So $4x + 10(-2) = 0$."
      - "Therefore $4x = -20$, giving $x = -5$."
    errorLine: 4
    fix: |
      $10(-2) = -20$, so $4x - 20 = 0$ and $4x = +20$, giving $x = +5$.
    explanation: |
      The equation is written correctly on line 3. Moving the –20 to the other side makes it **+20**, not –20, so phosphorus is +5, matching its five outer electrons.

  - id: why-oxidation-number-rises
    format: mcq
    difficulty: 3
    objectives: ["9.2.2"]
    prompt: |
      Why does the oxidation number of the Period 3 element rise by one from $\text{Na}_2\text{O}$ to $\text{MgO}$ to $\text{Al}_2\text{O}_3$?
    options:
      - text: |
          Each element has one more outer-shell electron available to bond with oxygen.
        correct: true
        why: |
          One more outer electron means the element can supply one more positive share, so the oxidation number rises by one.
      - text: |
          Each element has one more proton in its nucleus, so its oxidation number rises by one.
        why: |
          Nuclear charge changes attraction and ionisation energy. The oxidation-number pattern comes from outer-shell electrons, not protons.
      - text: |
          Each element is more electronegative, so it pulls electrons away from oxygen.
        why: |
          Electronegativity does increase across the period, but oxygen is more electronegative than all these elements, so the shared electrons count towards oxygen.
      - text: |
          Each element has one more inner electron shell than the one before.
        why: |
          All Period 3 elements have the same three shells. Only the number of outer-shell electrons changes.
    explanation: |
      The outer shell fills from Na (1) to Al (3), so oxygen needs +1, +2 and +3 respectively to balance its –2.

  - id: oxidation-numbers-oxide-and-chloride
    format: numeric
    difficulty: 2
    objectives: ["9.2.2"]
    prompt: |
      Give the oxidation number of the Period 3 element in each compound.
    fields:
      - label: "Mg in MgO"
        answer: 2
      - label: "Si in SiCl4"
        answer: 4
    explanation: |
      Mg: $x + (-2) = 0$, so $x = +2$. Si: $x + 4(-1) = 0$, so $x = +4$. Each matches the element's outer-shell electron count.
