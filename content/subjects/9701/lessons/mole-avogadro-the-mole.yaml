id: mole-avogadro-the-mole
subject: "9701"
topic: "2.2"
title: "The mole: chemistry's counting number"
summary: What a mole is, how it is defined with the Avogadro constant, and how to convert between moles and numbers of atoms, molecules or ions.
order: 1
minutes: 4
objectives: ["2.2.1"]
prerequisites: [relative-masses-molecular-and-formula-mass]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.2, learning outcome 2.2.1). Avogadro constant L = 6.022 ×
    10²³ mol⁻¹ as given in the Cambridge Data Booklet; the exact SI value (2019) is in a
    not-examinable enrichment block. The "mole of seconds" comparison uses 3.156 × 10⁷ s per
    year and an age of the universe of 1.38 × 10¹⁰ years. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define the **mole** using the **Avogadro constant**, and convert between an amount in moles and a number of particles.

  - type: explain
    title: A very big dozen
    body: |
      A dozen is 12 things. A pair is 2. A **mole** is 602 200 000 000 000 000 000 000 things.

      Chemists aren't being dramatic. Atoms are so small that a 30 g mouthful of water contains about $1 \times 10^{24}$ molecules. Counting in moles turns those monster numbers into friendly ones like 0.5 or 2.

  - type: definition
    term: Mole (mol)
    body: |
      The amount of substance that contains $6.022 \times 10^{23}$ particles (atoms, molecules, ions or electrons).

      This number of particles per mole is the **Avogadro constant**:

      $$L = 6.022 \times 10^{23}\ \text{mol}^{-1}\quad\text{(Data Booklet)}$$

  - type: check
    title: Quick check
    questions: [define-mole, avogadro-unit]

  - type: explain
    title: Moles and particles
    body: |
      $$N = n \times L \qquad\qquad n = \frac{N}{L}$$

      - $N$ = number of particles (no units)
      - $n$ = amount of substance, in **mol**
      - $L$ = Avogadro constant, $6.022 \times 10^{23}\ \text{mol}^{-1}$

      The unit works out: $\text{mol} \times \text{mol}^{-1}$ leaves a plain number of particles.

  - type: check
    title: Moles to particles
    questions: [molecules-co2, moles-from-atoms]

  - type: diagram
    diagram: chem-mole-avogadro-same-count
    alt: "Horizontal bar chart of the mass of one mole, from 0 to 100 g, for four substances: carbon 12.0 g, water 18.0 g, sodium chloride 58.5 g and calcium carbonate 100.1 g. Under each bar is the same particle count, 6.022 × 10²³, of C atoms, H2O molecules, NaCl formula units and CaCO3 formula units respectively. Title: 1 mol of each, the same number of particles, different masses."
    caption: Same number of particles, very different masses. A mole is a count, not a mass.

  - type: intuition
    title: A dozen eggs vs a dozen bowling balls
    body: |
      A dozen eggs and a dozen bowling balls have the same **count** but wildly different **masses**. A mole of carbon atoms and a mole of calcium carbonate are just the same.

      Where it breaks: you can picture a dozen. You can't picture a mole. A mole of **seconds** is about $1.9 \times 10^{16}$ years, more than a million times the age of the universe.

  - type: explain
    title: Always ask "a mole of what?"
    body: |
      One mole of $\text{CO}_2$ **molecules** contains:

      | particle | amount | number |
      | --- | --- | --- |
      | $\text{CO}_2$ molecules | 1 mol | $6.022 \times 10^{23}$ |
      | C atoms | 1 mol | $6.022 \times 10^{23}$ |
      | O atoms | **2 mol** | $1.204 \times 10^{24}$ |
      | atoms in total | **3 mol** | $1.807 \times 10^{24}$ |

      Same for ions: 1 mol of $\text{MgCl}_2$ gives 1 mol of $\text{Mg}^{2+}$ and 2 mol of $\text{Cl}^-$, so 3 mol of ions.

  - type: example
    title: Atoms in ammonia
    problem: |
      How many **atoms** are there in 0.200 mol of ammonia, $\text{NH}_3$? ($L = 6.022 \times 10^{23}\ \text{mol}^{-1}$)
    steps:
      - |
        Each $\text{NH}_3$ molecule has 1 N + 3 H = **4 atoms**.
      - |
        Moles of atoms: $0.200 \times 4 = 0.800$ mol
      - |
        Number of atoms: $0.800 \times 6.022 \times 10^{23} = 4.82 \times 10^{23}$
    answer: |
      $4.82 \times 10^{23}$ atoms (3 s.f.)

  - type: check
    title: A mole of what?
    questions: [most-atoms, ions-magnesium-chloride]

  - type: misconceptions
    items:
      - wrong: "A mole is a mass, like 12 g."
        right: "A mole is an **amount**: $6.022 \\times 10^{23}$ particles. Its mass depends on what the particles are."
      - wrong: "1 mol of $\\text{O}_2$ contains $6.022 \\times 10^{23}$ oxygen atoms."
        right: "It contains $6.022 \\times 10^{23}$ **molecules**, which is $2 \\times 6.022 \\times 10^{23}$ atoms."
      - wrong: "The Avogadro constant has no units."
        right: "$L = 6.022 \\times 10^{23}\\ \\text{mol}^{-1}$: particles **per mole**. The plain number is sometimes called the Avogadro number."

  - type: exam
    body: |
      - Definition: "the amount of substance containing $6.022 \times 10^{23}$ particles" (or "containing the Avogadro constant number of particles"). Say **particles**, or name them: atoms, molecules, ions.
      - You may also meet the older wording: "the amount of substance containing as many particles as there are atoms in exactly 12 g of carbon-12". Mark schemes accept it.
      - Read the question for **which** particle it wants: molecules, atoms or ions. Multiplying by the number of atoms per formula is the step most people skip.
      - Standard form: type and write $4.82 \times 10^{23}$, never "4.82 + 23" or "4.82^23".

  - type: enrichment
    title: Exactly how many?
    body: |
      Since 2019 the SI defines the Avogadro constant as **exactly** $6.022\,140\,76 \times 10^{23}\ \text{mol}^{-1}$. The mole is now fixed by that number, not by carbon-12.

      A side effect: one mole of carbon-12 is no longer *exactly* 12 g. It's 12 g to better than one part in a billion, so for every calculation you'll ever do, it's 12 g.

  - type: takeaways
    items:
      - "1 mol = the amount of substance containing $6.022 \\times 10^{23}$ particles."
      - "$L = 6.022 \\times 10^{23}\\ \\text{mol}^{-1}$ (Data Booklet)."
      - "$N = n \\times L$ and $n = N \\div L$."
      - "Always ask: a mole of what? Multiply by atoms (or ions) per formula when asked."

questions:
  - id: define-mole
    format: text
    style: definition
    difficulty: 1
    objectives: ["2.2.1"]
    prompt: |
      Define the **mole**, in terms of the Avogadro constant.
    accept:
      - "the amount of substance that contains 6.022 × 10^23 particles"
      - "amount of substance that contains 6.022 × 10^23 particles"
      - "the amount of substance containing 6.022 × 10^23 particles"
      - "the amount of substance that contains 6.022 x 10^23 particles"
      - "the amount of substance containing 6.022 x 10^23 particles"
      - "the amount of substance that contains 6.022 × 10²³ particles"
      - "the amount of substance containing 6.022 × 10²³ particles"
      - "the amount of substance that contains 6.022*10^23 particles"
      - "the amount of substance that contains 6.022e23 particles"
      - "the amount of substance that contains 6.02 × 10^23 particles"
      - "the amount of substance containing 6.02 x 10^23 particles"
      - "the amount of substance that contains 6.02 × 10²³ particles"
      - "the amount of substance that contains the avogadro constant number of particles"
      - "the amount of substance containing the avogadro constant number of particles"
      - "the amount of substance that contains avogadros number of particles"
      - "the amount of substance containing avogadros number of particles"
      - "the amount of substance that contains the avogadro number of particles"
      - "the amount of substance that contains 6.022 × 10^23 atoms, molecules or ions"
      - "the amount of substance that contains 6.022 × 10^23 elementary entities"
      - "the amount of substance that contains as many particles as there are atoms in exactly 12 g of carbon-12"
      - "the amount of substance containing as many particles as there are atoms in 12 g of carbon-12"
      - "a mole is the amount of substance that contains 6.022 × 10^23 particles"
      - "one mole is the amount of substance that contains 6.022 × 10^23 particles"
    model: |
      The amount of substance that contains $6.022 \times 10^{23}$ particles (the Avogadro constant number of atoms, molecules or ions).
    explanation: |
      Check yours for: **amount of substance**, the number $6.022 \times 10^{23}$ (or "the Avogadro constant"), and **particles**.

  - id: avogadro-unit
    format: cloze
    difficulty: 1
    objectives: ["2.2.1"]
    prompt: |
      The Avogadro constant is $6.022 \times 10^{23}$ with the unit {{1}}, because it tells you the number of particles in each {{2}}.
    blanks:
      - accept: ["mol⁻¹", "mol^-1", "mol-1", "per mole", "per mol", "/mol", "mol^(-1)"]
      - accept: ["mole", "mol", "one mole", "1 mol", "1 mole"]
    explanation: |
      Particles **per mole**: $\text{mol}^{-1}$.

  - id: molecules-co2
    format: numeric
    difficulty: 1
    objectives: ["2.2.1"]
    prompt: |
      How many **molecules** are in 0.250 mol of carbon dioxide? ($L = 6.022 \times 10^{23}\ \text{mol}^{-1}$) Type standard form like `1.23e23`.
    fields:
      - answer: 1.51e23
        tolerance: { rel: 0.005 }
    explanation: |
      $N = n \times L = 0.250 \times 6.022 \times 10^{23} = 1.51 \times 10^{23}$ molecules.

  - id: moles-from-atoms
    format: numeric
    difficulty: 2
    objectives: ["2.2.1"]
    prompt: |
      A small iron nail contains $1.505 \times 10^{22}$ iron atoms. What amount of iron is this, in mol? ($L = 6.022 \times 10^{23}\ \text{mol}^{-1}$)
    fields:
      - answer: 0.0250
        tolerance: { rel: 0.01 }
        unit: mol
    explanation: |
      $n = N \div L = 1.505 \times 10^{22} \div 6.022 \times 10^{23} = 0.0250$ mol. Dividing a smaller power of ten by a bigger one gives less than 1 mol, as expected for a nail.

  - id: most-atoms
    format: mcq
    difficulty: 2
    objectives: ["2.2.1"]
    prompt: |
      Which sample contains the greatest number of **atoms**?
    options:
      - text: |
          1.0 mol of helium, He
        why: |
          The most particles (1.0 mol), but each is a single atom: 1.0 mol of atoms.
      - text: |
          0.40 mol of ozone, $\text{O}_3$
        why: |
          $0.40 \times 3 = 1.2$ mol of atoms.
      - text: |
          0.70 mol of nitrogen, $\text{N}_2$
        why: |
          $0.70 \times 2 = 1.4$ mol of atoms. Close, but not the most.
      - text: |
          0.30 mol of methane, $\text{CH}_4$
        correct: true
        why: |
          Each molecule has 5 atoms: $0.30 \times 5 = 1.5$ mol of atoms, the largest.
    explanation: |
      Moles of atoms = moles of particles × atoms per particle. Fewest molecules can still mean most atoms.

  - id: ions-magnesium-chloride
    format: numeric
    difficulty: 3
    objectives: ["2.2.1"]
    prompt: |
      What is the total number of **ions** in 0.100 mol of magnesium chloride, $\text{MgCl}_2$? ($L = 6.022 \times 10^{23}\ \text{mol}^{-1}$) Type standard form like `1.23e23`.
    fields:
      - answer: 1.81e23
        tolerance: { rel: 0.005 }
    explanation: |
      Each formula unit is one $\text{Mg}^{2+}$ and two $\text{Cl}^-$: 3 ions. Moles of ions $= 0.100 \times 3 = 0.300$ mol, so $N = 0.300 \times 6.022 \times 10^{23} = 1.81 \times 10^{23}$.
