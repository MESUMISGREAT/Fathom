id: dot-cross-multiple-covalent
subject: "9701"
topic: "3.7"
title: Showing double and triple bonds
summary: Count shared electron pairs in oxygen, nitrogen, carbon dioxide and ethene.
order: 2
minutes: 4
objectives: ["3.7.1"]
prerequisites: [dot-cross-single-covalent]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.7 learning outcome 1, including O₂, N₂, CO₂, C₂H₄ and HCN from 3.4. All questions are original; no illustrative data are used.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can show double and triple covalent bonds by counting shared pairs.
  - type: explain
    title: More shared pairs, stronger links
    body: |
      A **double bond** contains two shared pairs; a **triple bond** contains three. Each pair has one electron from each atom, shown as a dot and a cross.

      The extra pairs sit between the same two atoms. Do not draw them as separate bonds to different atoms.
  - type: diagram
    diagram: chem-dot-cross-multiple-bonds
    alt: Dot-and-cross sketches compare double O=O and triple N≡N bonds, two double C=O bonds in carbon dioxide, and HCN with one H–C pair and three C≡N pairs.
    caption: Lone pairs stay around the atoms; only shared pairs sit between bonded atoms.
  - type: example
    title: Carbon dioxide, one bond at a time
    problem: Work out the shared pairs in one CO₂ molecule.
    steps:
      - Carbon is in the middle, with one oxygen on either side.
      - Each C=O double bond contains two shared pairs.
      - There are two C=O bonds, so four shared pairs in total connect carbon to oxygen.
      - Each oxygen also has two lone pairs; carbon has no lone pairs in this simple diagram.
    answer: CO₂ has two double bonds and four shared pairs between its carbon and oxygen atoms.
  - type: check
    title: Count shared pairs
    questions: ["dot-multiple-o2", "dot-multiple-n2"]
  - type: explain
    title: The syllabus molecules
    body: |
      - O₂ has an O=O double bond: two shared pairs. Each oxygen also has two lone pairs.
      - N₂ has an N≡N triple bond: three shared pairs. Each nitrogen has one lone pair.
      - HCN has one H–C shared pair and three shared pairs in C≡N; nitrogen keeps one lone pair.
      - C₂H₄ (ethene) has one C=C double bond and four single C–H bonds. Each carbon shares two pairs with the other carbon and one pair with each of two hydrogens.

      A double bond can also appear in CO₂: each oxygen shares two pairs with carbon.
  - type: check
    title: Apply the pattern
    questions: ["dot-multiple-co2", "dot-multiple-ethene", "dot-multiple-hcn"]
  - type: misconceptions
    items:
      - wrong: A triple bond has three lone pairs between the atoms.
        right: It has three shared electron pairs; lone pairs are not shared.
      - wrong: The two shared pairs in a double bond come from just one atom.
        right: Each shared pair contains one electron from each bonded atom.
  - type: exam
    body: Count shared pairs, then count lone pairs on each atom. For a double bond, draw two dot–cross pairs between the same atoms; for a triple bond, draw three.
  - type: takeaways
    items:
      - A double bond is two shared pairs; a triple bond is three.
      - O₂ and CO₂ contain double bonds; N₂ contains a triple bond.
      - Ethene has a C=C double bond and four C–H single bonds.
questions:
  - id: dot-multiple-o2
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: How many shared pairs are in the O=O bond in oxygen, O₂?
    options:
      - text: Two
        correct: true
        why: A double bond contains two shared electron pairs.
      - text: One
        why: One shared pair is a single bond.
      - text: Three
        why: Three shared pairs make a triple bond.
      - text: Four
        why: Four would be two double bonds, not one O=O bond.
    explanation: O₂ has an O=O double bond, represented by two shared pairs.
  - id: dot-multiple-n2
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: Nitrogen, N₂, has an N≡N triple bond. How many shared pairs does it contain?
    options:
      - text: Three
        correct: true
        why: A triple bond contains three shared pairs.
      - text: One
        why: One shared pair is a single bond.
      - text: Two
        why: Two shared pairs make a double bond.
      - text: Six
        why: The triple bond contains three pairs, or six electrons total.
    explanation: Three shared pairs means six bonding electrons in the N≡N bond.
  - id: dot-multiple-co2
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many shared pairs connect carbon to oxygen in one CO₂ molecule?
    options:
      - text: Four
        correct: true
        why: "Each of two C=O double bonds has two pairs: 2 + 2 = 4."
      - text: Two
        why: There are two C=O bonds, but each is a double bond with two shared pairs.
      - text: Three
        why: That would be the pair count for one triple bond.
      - text: Six
        why: Each C=O bond has two pairs, so the total is four.
    explanation: "CO₂ is O=C=O: two shared pairs in each of its two double bonds."
  - id: dot-multiple-ethene
    format: cloze
    difficulty: 3
    objectives: ["3.7.1"]
    prompt: In ethene, C₂H₄, the two carbon atoms share {{1}} pairs with each other; each carbon also makes {{2}} C–H single bonds.
    blanks:
      - accept: ["two", "2"]
      - accept: ["two", "2"]
    explanation: The C=C double bond has two pairs; each carbon also bonds to two hydrogens.
  - id: dot-multiple-hcn
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many shared pairs are in one HCN molecule, H–C≡N?
    options:
      - text: Four
        correct: true
        why: H–C has one shared pair and C≡N has three.
      - text: Three
        why: Three pairs are in C≡N, but H–C adds one more.
      - text: Five
        why: The nitrogen lone pair is not shared between atoms.
      - text: One
        why: That counts only the H–C single bond, not C≡N.
    explanation: H–C contributes one shared pair and C≡N contributes three, giving four.
