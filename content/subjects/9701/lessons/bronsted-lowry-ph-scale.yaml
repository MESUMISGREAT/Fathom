id: bronsted-lowry-ph-scale
subject: "9701"
topic: "7.2"
title: The pH scale — measuring acidity
summary: What pH means, the logarithmic scale, calculating pH from [H⁺], and why water sits at pH 7.
order: 4
minutes: 4
objectives: ["7.2.5"]
prerequisites: ["bronsted-lowry-reactions"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 5; pH scale).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can state that water has pH 7, acidic solutions have pH < 7, alkaline solutions have pH > 7, and calculate pH from [H⁺] using pH = –log₁₀[H⁺].

  - type: explain
    title: Why we need pH
    body: |
      [H⁺] in solutions ranges from ~10 mol dm⁻³ (concentrated acid) down to 10⁻¹⁴ mol dm⁻³ (strong base). That's **15 orders of magnitude** — impossible to compare directly.

      **Sørensen (1909)** invented pH:
      $$\text{pH} = -\log_{10}[\text{H}^+]$$

      The "p" stands for *potenz* (German for power/exponent). It compresses the huge range into a manageable 0–14 scale (usually).

  - type: definition
    term: pH
    body: |
      $\text{pH} = -\log_{10}[\text{H}^+]$ where [H⁺] is the hydrogen ion concentration in mol dm⁻³.

  - type: intuition
    title: Logarithmic = each step is 10×
    body: |
      | pH | [H⁺] (mol dm⁻³) | Relative acidity |
      |----|------------------|------------------|
      | 0  | 1                | 10⁷ × more acidic than pH 7 |
      | 1  | 0.1              | 10⁶ × |
      | 2  | 0.01             | 10⁵ × |
      | 3  | 0.001            | 10⁴ × |
      | 4  | 10⁻⁴             | 10³ × |
      | 5  | 10⁻⁵             | 10² × |
      | 6  | 10⁻⁶             | 10 × |
      | **7** | **10⁻⁷**       | **neutral** |
      | 8  | 10⁻⁸             | 10 × more alkaline |
      | 9  | 10⁻⁹             | 10² × |
      | 10 | 10⁻¹⁰            | 10³ × |
      | 11 | 10⁻¹¹            | 10⁴ × |
      | 12 | 10⁻¹²            | 10⁵ × |
      | 13 | 10⁻¹³            | 10⁶ × |
      | 14 | 10⁻¹⁴            | 10⁷ × |

      **A change of 1 pH unit = 10× change in [H⁺].** A change of 2 units = 100×. This is why "small" pH changes matter enormously in biology.

  - type: example
    title: Calculating pH from [H⁺]
    problem: |
      Calculate the pH of a solution with [H⁺] = 2.5 × 10⁻³ mol dm⁻³.
    steps:
      - "pH = –log₁₀(2.5 × 10⁻³)"
      - "= –(log₁₀ 2.5 + log₁₀ 10⁻³)"
      - "= –(0.398 – 3)"
      - "= 2.60 (to 2 d.p.)"
    answer: |
      pH = 2.60

  - type: check
    title: Calculate pH
    questions: [calc-ph-1, calc-ph-2]

  - type: example
    title: Calculating [H⁺] from pH
    problem: |
      A solution has pH = 3.20. What is [H⁺]?
    steps:
      - "[H⁺] = 10⁻ᵖᴴ"
      - "[H⁺] = 10⁻³·²⁰"
      - "[H⁺] = 6.31 × 10⁻⁴ mol dm⁻³"
    answer: |
      [H⁺] = 6.31 × 10⁻⁴ mol dm⁻³

  - type: check
    title: Calculate [H⁺]
    questions: [calc-hplus-1, calc-hplus-2]

  - type: explain
    title: Why is pure water pH 7?
    body: |
      Water autoionises:
      $$\text{H}_2\text{O(l)} \rightleftharpoons \text{H}^+(\text{aq}) + \text{OH}^-(\text{aq})$$

      At 298 K: $K_w = [\text{H}^+][\text{OH}^-] = 1.0 \times 10^{-14}$

      In pure water, $[\text{H}^+] = [\text{OH}^-] = \sqrt{1.0 \times 10^{-14}} = 1.0 \times 10^{-7}$ mol dm⁻³

      $\text{pH} = -\log_{10}(1.0 \times 10^{-7}) = 7.00$

      **Acidic**: [H⁺] > [OH⁻] → [H⁺] > 10⁻⁷ → pH < 7
      **Alkaline**: [H⁺] < [OH⁻] → [H⁺] < 10⁻⁷ → pH > 7

  - type: misconceptions
    items:
      - wrong: "pH can never be negative or above 14."
        right: "Concentrated strong acids (e.g. 10 M HCl) have pH ≈ -1. Concentrated strong bases can have pH > 14. The 0–14 range is just for *dilute* solutions."
      - wrong: "A pH of 6 is 'slightly acidic' so it's not dangerous."
        right: "pH 6 is 10× more acidic than neutral. pH 3 is 10,000× more acidic. Logarithmic scale!"
      - wrong: "pH = -log[H⁺] so I can just put the concentration in my calculator."
        right: "[H⁺] MUST be in mol dm⁻³. If given in g dm⁻³ or %, convert first."

  - type: takeaways
    items:
      - "pH = –log₁₀[H⁺]; [H⁺] = 10⁻ᵖᴴ"
      - "pH 7 = neutral (pure water at 298 K)"
      - "pH < 7 = acidic; pH > 7 = alkaline"
      - "Each pH unit = 10× change in [H⁺]"
      - "[H⁺] must be in mol dm⁻³ for the formula to work"
      - "pH can be < 0 or > 14 for concentrated solutions"

questions:
  - id: calc-ph-1
    format: numeric
    difficulty: 1
    objectives: ["7.2.5"]
    prompt: |
      Calculate the pH of a 0.01 mol dm⁻³ HCl solution. Give your answer to 2 decimal places.
    answer: 2.00
    tolerance: 0.01
    explanation: |
      HCl is a strong acid, fully dissociated: [H⁺] = 0.01 M. pH = –log₁₀(0.01) = 2.00.

  - id: calc-ph-2
    format: numeric
    difficulty: 2
    objectives: ["7.2.5"]
    prompt: |
      Calculate the pH of a solution with [H⁺] = 3.16 × 10⁻⁵ mol dm⁻³. Give your answer to 2 decimal places.
    answer: 4.50
    tolerance: 0.01
    explanation: |
      pH = –log₁₀(3.16 × 10⁻⁵) = –(log₁₀ 3.16 – 5) = –(0.50 – 5) = 4.50.

  - id: calc-hplus-1
    format: numeric
    difficulty: 2
    objectives: ["7.2.5"]
    prompt: |
      A solution has pH = 5.30. Calculate [H⁺] in mol dm⁻³. Give your answer in scientific notation to 3 significant figures (e.g. 1.23e-5).
    answer: 5.01e-6
    tolerance: 0.01e-6
    explanation: |
      [H⁺] = 10⁻⁵·³⁰ = 5.01 × 10⁻⁶ mol dm⁻³.

  - id: calc-hplus-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.5"]
    prompt: |
      If the pH of a solution increases from 3 to 5, by what factor does [H⁺] change?
    options:
      - text: "Decreases by 2×"
        why: "Each pH unit is 10×. Two units = 100×."
      - text: "Decreases by 10×"
        why: "That would be a change of 1 pH unit."
      - text: "Decreases by 100×"
        correct: true
        why: "pH increase of 2 units → [H⁺] decreases by 10² = 100×."
      - text: "Increases by 100×"
        why: "pH *increase* means [H⁺] *decreases*."
    explanation: |
      ΔpH = +2 → [H⁺] new / [H⁺] old = 10⁻² = 1/100. [H⁺] decreases by a factor of 100.