id: period-3-chemical-oxides-water
subject: "9701"
topic: "9.2"
title: "Oxides of Period 3 with water: the acid–base ladder"
summary: "What each Period 3 oxide does in water, the pH it gives, and the ladder from basic Na2O through amphoteric Al2O3 to acidic SO3."
order: 3
minutes: 7
kind: core
objectives: ["9.2.3", "9.2.4"]
prerequisites: [period-3-chemical-oxidation-numbers]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027, topic 9.2 learning outcomes 3 and 4 (reactions of the oxides with
    water and their acid/base behaviour, including amphoteric behaviour with sodium
    hydroxide). All questions are original. pH values are the approximate values examiners
    expect, not measured data.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can predict what each Period 3 oxide does with water, say roughly what pH the resulting solution has, and sort the oxides and hydroxides into basic, amphoteric and acidic — with the equations to back it up.

  - type: explain
    title: Two questions to ask about any oxide
    body: |
      Every oxide in Period 3 gets asked the same two questions.

      1. **Water test:** does it react with water at all?
      2. **Acid–base test:** does it behave as a base (reacts with acid), an acid (reacts with alkali), or both?

      The answers slide smoothly from one end of the period to the other. There is no jump, no sudden switch — just a steady change in character.

  - type: explain
    title: "Left side: ionic oxides that make alkalis"
    body: |
      Sodium and magnesium oxides are **ionic**. The oxide ion, $\text{O}^{2-}$, is a hungry base, so it grabs protons from water:

      $$\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow 2\text{NaOH}$$

      That gives a strongly alkaline solution, pH about **13–14**.

      Magnesium oxide reacts too, but the product is different:

      $$\text{MgO} + \text{H}_2\text{O} \rightarrow \text{Mg(OH)}_2$$

      $\text{Mg(OH)}_2$ is only **slightly soluble**, so few $\text{OH}^-$ ions reach the solution. The pH is about **9–10**: alkaline, but nowhere near sodium hydroxide.

      | oxide | with water | pH of the solution |
      | --- | --- | --- |
      | $\text{Na}_2\text{O}$ | $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow 2\text{NaOH}$ | 13–14 |
      | $\text{MgO}$ | $\text{MgO} + \text{H}_2\text{O} \rightarrow \text{Mg(OH)}_2$ | 9–10 |
      | $\text{Al}_2\text{O}_3$ | no reaction (insoluble) | about 7 |
      | $\text{SiO}_2$ | no reaction (insoluble) | about 7 |
      | $\text{P}_4\text{O}_{10}$ | $\text{P}_4\text{O}_{10} + 6\text{H}_2\text{O} \rightarrow 4\text{H}_3\text{PO}_4$ | 1–2 |
      | $\text{SO}_2$ | $\text{SO}_2 + \text{H}_2\text{O} \rightarrow \text{H}_2\text{SO}_3$ | 2–3 |
      | $\text{SO}_3$ | $\text{SO}_3 + \text{H}_2\text{O} \rightarrow \text{H}_2\text{SO}_4$ | about 1 |

  - type: check
    title: Left-hand end
    questions: [sodium-oxide-equation, sodium-hydroxide-concentration]

  - type: explain
    title: "Middle: the two that ignore water"
    body: |
      Aluminium oxide and silicon dioxide simply **do not react with water**. Both are insoluble, and a suspension of either stays at about pH 7.

      That does **not** make them neutral oxides — and this is where students lose marks.

      - $\text{Al}_2\text{O}_3$ is **amphoteric**: it reacts with acids and with alkalis.
      - $\text{SiO}_2$ is **acidic**: it reacts with hot concentrated sodium hydroxide.

      Water is just too weak to break into their lattices. Give them a stronger partner and they react happily.

  - type: check
    title: The middle
    questions: [silicon-dioxide-water, sulfur-trioxide-product]

  - type: explain
    title: "Right side: covalent oxides that make acids"
    body: |
      The non-metal oxides are **covalent** and react with water to release protons:

      $$\text{P}_4\text{O}_{10} + 6\text{H}_2\text{O} \rightarrow 4\text{H}_3\text{PO}_4 \qquad \text{pH about 1–2}$$

      $$\text{SO}_2 + \text{H}_2\text{O} \rightarrow \text{H}_2\text{SO}_3 \qquad \text{pH about 2–3}$$

      $$\text{SO}_3 + \text{H}_2\text{O} \rightarrow \text{H}_2\text{SO}_4 \qquad \text{pH about 1}$$

      This matters environmentally. Burning sulfur-containing fuels releases $\text{SO}_2$, and some of it is oxidised further in the air to $\text{SO}_3$. Both dissolve in cloud water to make sulfurous and sulfuric acid, which is **acid rain**.

      $\text{SO}_3$ gives the stronger acid, so it gives the lower pH — sulfuric acid is a strong acid, sulfurous acid is weak.

  - type: example
    title: Worked example — putting solutions in order
    problem: |
      Four oxides are stirred separately into water: $\text{Na}_2\text{O}$, $\text{MgO}$, $\text{Al}_2\text{O}_3$ and $\text{SO}_3$. Put the resulting mixtures in order of **increasing** pH.
    steps:
      - '$\text{SO}_3$ reacts to give $\text{H}_2\text{SO}_4$, a strong acid: pH about 1. That is the lowest.'
      - '$\text{Al}_2\text{O}_3$ does not react or dissolve, so the mixture stays at about pH 7.'
      - '$\text{MgO}$ gives $\text{Mg(OH)}_2$, which is only slightly soluble, so the pH is about 9–10.'
      - '$\text{Na}_2\text{O}$ gives completely soluble $\text{NaOH}$, the strongest alkali here: pH about 13–14.'
    answer: |
      $\text{SO}_3$ (about 1) < $\text{Al}_2\text{O}_3$ (about 7) < $\text{MgO}$ (about 9–10) < $\text{Na}_2\text{O}$ (about 13–14).

  - type: explain
    title: Basic, amphoteric, acidic — with the equations
    body: |
      **Oxides.**

      | oxide | character | reaction with $\text{HCl}$ | reaction with $\text{NaOH}$ |
      | --- | --- | --- | --- |
      | $\text{Na}_2\text{O}$ | basic | $\text{Na}_2\text{O} + 2\text{HCl} \rightarrow 2\text{NaCl} + \text{H}_2\text{O}$ | — |
      | $\text{MgO}$ | basic | $\text{MgO} + 2\text{HCl} \rightarrow \text{MgCl}_2 + \text{H}_2\text{O}$ | — |
      | $\text{Al}_2\text{O}_3$ | amphoteric | $\text{Al}_2\text{O}_3 + 6\text{HCl} \rightarrow 2\text{AlCl}_3 + 3\text{H}_2\text{O}$ | $\text{Al}_2\text{O}_3 + 2\text{NaOH} + 3\text{H}_2\text{O} \rightarrow 2\text{NaAl(OH)}_4$ |
      | $\text{SiO}_2$ | acidic | — | $\text{SiO}_2 + 2\text{NaOH} \rightarrow \text{Na}_2\text{SiO}_3 + \text{H}_2\text{O}$ |
      | $\text{P}_4\text{O}_{10}$ | acidic | — | $\text{P}_4\text{O}_{10} + 12\text{NaOH} \rightarrow 4\text{Na}_3\text{PO}_4 + 6\text{H}_2\text{O}$ |
      | $\text{SO}_2$ | acidic | — | $\text{SO}_2 + 2\text{NaOH} \rightarrow \text{Na}_2\text{SO}_3 + \text{H}_2\text{O}$ |
      | $\text{SO}_3$ | acidic | — | $\text{SO}_3 + 2\text{NaOH} \rightarrow \text{Na}_2\text{SO}_4 + \text{H}_2\text{O}$ |

      **Hydroxides behave the same way.**

      - $\text{NaOH}$, the hydroxide of the left-hand metal, is **basic**: $\text{NaOH} + \text{HCl} \rightarrow \text{NaCl} + \text{H}_2\text{O}$.
      - $\text{Mg(OH)}_2$ is **basic** too: $\text{Mg(OH)}_2 + 2\text{HCl} \rightarrow \text{MgCl}_2 + 2\text{H}_2\text{O}$.
      - $\text{Al(OH)}_3$ is **amphoteric**:

      $$\text{Al(OH)}_3 + 3\text{HCl} \rightarrow \text{AlCl}_3 + 3\text{H}_2\text{O}$$

      $$\text{Al(OH)}_3 + \text{NaOH} \rightarrow \text{NaAl(OH)}_4$$

  - type: check
    title: Acid–base behaviour
    questions: [amphoteric-hydroxide, acid-base-error]

  - type: intuition
    title: Why the ladder exists
    body: |
      Look at the bonding, then at the electronegativity difference across it.

      - **Ionic oxides** on the left ($\text{Na}_2\text{O}$, $\text{MgO}$) contain the very basic $\text{O}^{2-}$ ion. Put them in acid and that ion takes protons.
      - **Covalent oxides** on the right ($\text{SiO}_2$, $\text{P}_4\text{O}_{10}$, $\text{SO}_2$, $\text{SO}_3$) have polar bonds to a more electronegative non-metal, so the central atom is electron-deficient. Water's oxygen donates a lone pair to it and a proton is released, which is why the solution is acidic.
      - $\text{Al}_2\text{O}_3$ sits between the worlds: its bonding is ionic with real covalent character, so it reacts either way.

      The bigger the electronegativity difference between element and oxygen, the more ionic and more **basic** the oxide. The smaller it is, the more covalent and more **acidic**.

  - type: misconceptions
    items:
      - wrong: '$\text{MgO}$ gives a solution as strongly alkaline as $\text{Na}_2\text{O}$.'
        right: '$\text{Mg(OH)}_2$ is only slightly soluble, so fewer $\text{OH}^-$ ions are present: pH about 9–10, not 13–14.'
      - wrong: '$\text{Al}_2\text{O}_3$ and $\text{SiO}_2$ are neutral because they do not react with water.'
        right: 'They are amphoteric and acidic respectively. No reaction with water only means water is too weak.'
      - wrong: '$\text{SO}_2$ and $\text{SO}_3$ both give sulfuric acid.'
        right: '$\text{SO}_2$ gives $\text{H}_2\text{SO}_3$ (sulfurous acid, weak); only $\text{SO}_3$ gives $\text{H}_2\text{SO}_4$ (sulfuric acid, strong).'

  - type: exam
    body: |
      - Learn the seven water equations and the pH values as a set. Examiners ask for "the likely pH" — give a range, e.g. "about 1–2", not a definite figure.
      - **Amphoteric** in this topic means $\text{Al}_2\text{O}_3$ or $\text{Al(OH)}_3$: it reacts with both an acid and sodium hydroxide. Name both reactions in a 2-mark answer.
      - With $\text{Al}_2\text{O}_3$ and $\text{NaOH}$, include water on the left: $\text{Al}_2\text{O}_3 + 2\text{NaOH} + 3\text{H}_2\text{O} \rightarrow 2\text{NaAl(OH)}_4$.
      - If asked to **explain** the trend, name the bonding and the electronegativity difference, then link to how easily protons are released — not just "it gets more acidic".

  - type: takeaways
    items:
      - '$\text{Na}_2\text{O}$ and $\text{MgO}$ are ionic and basic; $\text{Na}_2\text{O}$ gives pH 13–14, $\text{MgO}$ only 9–10 because $\text{Mg(OH)}_2$ is sparingly soluble.'
      - '$\text{Al}_2\text{O}_3$ and $\text{SiO}_2$ do not react with water; $\text{Al}_2\text{O}_3$ is amphoteric, $\text{SiO}_2$ is acidic.'
      - '$\text{P}_4\text{O}_{10}$, $\text{SO}_2$ and $\text{SO}_3$ are covalent and acidic, giving pH 1–2, 2–3 and about 1; $\text{SO}_2$ and $\text{SO}_3$ cause acid rain.'
      - "Ionic + large electronegativity difference → basic; covalent + small difference → acidic; in between → amphoteric."

questions:
  - id: sodium-oxide-equation
    format: mcq
    difficulty: 1
    objectives: ["9.2.3"]
    prompt: |
      Which equation shows the reaction of sodium oxide with water?
    options:
      - text: |
          $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow 2\text{NaOH}$
        correct: true
        why: |
          The oxide ion takes a proton from water, giving two hydroxide ions.
      - text: |
          $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow 2\text{NaOH} + \text{H}_2$
        why: |
          Hydrogen is released when sodium **metal** reacts with water, not sodium oxide.
      - text: |
          $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow \text{Na}_2\text{O}_2 + \text{H}_2$
        why: |
          That would be a peroxide forming plus hydrogen. The product is sodium hydroxide.
      - text: |
          $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow \text{NaOH} + \text{O}_2$
        why: |
          This is not balanced (two Na on the left, one on the right) and no oxygen gas is produced.
    explanation: |
      $\text{Na}_2\text{O}$ is a basic oxide: $\text{O}^{2-} + \text{H}_2\text{O} \rightarrow 2\text{OH}^-$. The solution is strongly alkaline, pH about 13–14.

  - id: sodium-hydroxide-concentration
    format: numeric
    difficulty: 2
    objectives: ["9.2.3"]
    prompt: |
      $0.010\ \text{mol}$ of sodium oxide reacts completely with water and the solution is made up to $250\ \text{cm}^3$. Calculate the concentration of sodium hydroxide in the solution.
    fields:
      - answer: 0.08
        unit: mol dm⁻³
        tolerance:
          rel: 0.01
    explanation: |
      $\text{Na}_2\text{O} + \text{H}_2\text{O} \rightarrow 2\text{NaOH}$, so $0.010\ \text{mol}$ of oxide gives $0.020\ \text{mol}$ of hydroxide.

      $c = n / V = 0.020\ \text{mol} / 0.250\ \text{dm}^3 = 0.080\ \text{mol dm}^{-3}$.

  - id: silicon-dioxide-water
    format: mcq
    difficulty: 2
    objectives: ["9.2.3"]
    prompt: |
      Silicon dioxide is stirred with water, then filtered. The filtrate has a pH of about 7. Which statement best explains this?
    options:
      - text: |
          $\text{SiO}_2$ is insoluble and does not react with water, so no acid is released into the solution.
        correct: true
        why: |
          Its giant covalent lattice is unaffected by water, so the water stays neutral.
      - text: |
          $\text{SiO}_2$ is a neutral oxide that cannot react with alkalis either.
        why: |
          It is an acidic oxide: it reacts with hot concentrated sodium hydroxide to give sodium silicate.
      - text: |
          A little $\text{SiO}_2$ dissolves to give a weak acid, which is too dilute to change the pH.
        why: |
          Silicon dioxide is effectively insoluble in water; nothing dissolves.
      - text: |
          $\text{SiO}_2$ reacts with water to give $\text{H}_2\text{SiO}_3$, which is neutral.
        why: |
          No reaction with water occurs at all, and silicic acid would be acidic if it formed.
    explanation: |
      "No reaction with water" is not the same as "neutral oxide". $\text{SiO}_2$ is acidic — it just needs a stronger base than water, such as hot concentrated $\text{NaOH}$.

  - id: sulfur-trioxide-product
    format: cloze
    difficulty: 1
    objectives: ["9.2.3"]
    prompt: |
      Sulfur trioxide reacts with water to form {{1}}, giving a solution of pH about {{2}}.
    blanks:
      - accept: ["H2SO4", "sulfuric acid", "sulphuric acid", "H2SO4(aq)", "sulfuric(VI) acid"]
      - accept: ["1", "about 1", "1.0", "1-2", "about 1-2"]
    explanation: |
      $\text{SO}_3 + \text{H}_2\text{O} \rightarrow \text{H}_2\text{SO}_4$. Sulfuric acid is a strong acid, so even a dilute solution has a pH near 1.

  - id: amphoteric-hydroxide
    format: mcq
    difficulty: 2
    objectives: ["9.2.4"]
    prompt: |
      Which statement about aluminium hydroxide is correct?
    options:
      - text: |
          It dissolves in both hydrochloric acid and sodium hydroxide solution.
        correct: true
        why: |
          That is what amphoteric means: $\text{Al(OH)}_3 + 3\text{HCl} \rightarrow \text{AlCl}_3 + 3\text{H}_2\text{O}$ and $\text{Al(OH)}_3 + \text{NaOH} \rightarrow \text{NaAl(OH)}_4$.
      - text: |
          It dissolves in hydrochloric acid but not in sodium hydroxide solution.
        why: |
          That describes a basic hydroxide such as $\text{Mg(OH)}_2$, not $\text{Al(OH)}_3$.
      - text: |
          It dissolves in sodium hydroxide solution but not in hydrochloric acid.
        why: |
          That would be an acidic hydroxide only. $\text{Al(OH)}_3$ reacts with acid too.
      - text: |
          It is insoluble in both, because it is a covalent compound.
        why: |
          It reacts with both reagents; insolubility in water does not mean unreactive.
    explanation: |
      $\text{Al(OH)}_3$ is amphoteric: with acid it acts as a base (forming $\text{AlCl}_3$), with alkali it acts as an acid (forming $\text{NaAl(OH)}_4$).

  - id: acid-base-error
    format: spot-error
    difficulty: 3
    objectives: ["9.2.3", "9.2.4"]
    prompt: |
      A student summarises the oxides of Period 3. Which line contains the first error?
    lines:
      - '$\text{Na}_2\text{O}$ reacts with water to give $\text{NaOH}$, so its solution is strongly alkaline.'
      - '$\text{MgO}$ also gives an alkaline solution, but only about pH 9–10.'
      - '$\text{Al}_2\text{O}_3$ dissolves in water to give a neutral solution.'
      - '$\text{SO}_2$ and $\text{SO}_3$ both react with water to give acidic solutions.'
    errorLine: 3
    fix: |
      $\text{Al}_2\text{O}_3$ does not react with, or dissolve in, water; a suspension stays at about pH 7. Its amphoteric behaviour appears with acids and alkalis, not with water.
    explanation: |
      Line 3 claims the oxide dissolves. It does not — the pH of about 7 comes from water alone, not from dissolved aluminium oxide. Lines 1, 2 and 4 are correct.
