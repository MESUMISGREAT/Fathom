id: chemical-formulas-writing-ionic-formulas
subject: "9701"
topic: "2.3"
title: Writing ionic formulas
summary: A four-step method for writing the formula of any ionic compound from its ion charges or its name, including Roman numerals and brackets.
order: 3
minutes: 5
objectives: ["2.3.1"]
prerequisites: [chemical-formulas-compound-ions]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.1: writing formulas of ionic
    compounds from ionic charges and from oxidation numbers shown by Roman numerals). All
    questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can write the formula of any ionic compound from the charges of its ions or from its name (Roman numerals included), using brackets correctly.

  - type: explain
    title: The one rule
    body: |
      An ionic compound has **no overall charge**. Total positive charge = total negative charge. That's it; everything else is bookkeeping.

      **The method:**

      1. Write each ion with its charge (from the group, the Roman numeral, or your list of nine).
      2. Find the **lowest common multiple** of the charge sizes.
      3. Use just enough of each ion to reach it. Those numbers become subscripts.
      4. Put **brackets** round a compound ion if you need more than one of it. Check: charges add to zero.

  - type: diagram
    diagram: chem-chemical-formulas-charge-balance
    alt: "Charge tiles whose lengths are proportional to the size of each ion's charge, in three rows. Aluminium oxide: two Al3+ tiles (total +6) sit above three O2− tiles (total −6), the two rows equal in length, giving Al2O3. Calcium nitrate: one Ca2+ tile (+2) above two NO3− tiles (−2), giving Ca(NO3)2. Ammonium phosphate: three NH4+ tiles (+3) above one PO4 3− tile (−3), giving (NH4)3PO4. Title: total positive charge = total negative charge."
    caption: Make the positive row and the negative row the same length. Then count the tiles.

  - type: example
    title: Aluminium sulfate
    problem: |
      Write the formula of aluminium sulfate.
    steps:
      - |
        Ions: aluminium is group 13, so $\text{Al}^{3+}$; sulfate is $\text{SO}_4^{2-}$.
      - |
        Lowest common multiple of 3 and 2 is **6**.
      - |
        Two $\text{Al}^{3+}$ give +6; three $\text{SO}_4^{2-}$ give −6.
      - |
        More than one sulfate, so it needs brackets: $\text{Al}_2(\text{SO}_4)_3$. Check: $2(+3) + 3(-2) = 0$ ✓
    answer: |
      $\text{Al}_2(\text{SO}_4)_3$

  - type: check
    title: Quick check
    questions: [magnesium-nitride, calcium-hydroxide]

  - type: explain
    title: Brackets matter (a lot)
    body: |
      A subscript after a bracket multiplies **everything** inside it. Without brackets, it only applies to the atom just before it.

      | you mean | right | wrong, and why |
      | --- | --- | --- |
      | two ammonium ions | $(\text{NH}_4)_2\text{SO}_4$ | $\text{NH}_{42}\text{SO}_4$ says 42 hydrogen atoms |
      | two hydroxide ions | $\text{Ca(OH)}_2$ | $\text{CaOH}_2$ says one O and two H |
      | one hydroxide ion | $\text{NaOH}$ | $\text{Na(OH)}$ isn't wrong, just pointless |

      Brackets are only for **compound ions** you need more than one of. Never bracket a simple ion: it's $\text{MgCl}_2$, not $\text{Mg(Cl)}_2$.

  - type: check
    title: Bracket check
    questions: [atoms-in-aluminium-sulfate, zinc-phosphate-error]

  - type: example
    title: Names with Roman numerals
    problem: |
      Write formulas for (a) iron(III) hydroxide and (b) copper(II) nitrate.
    steps:
      - |
        (a) Iron(III) means $\text{Fe}^{3+}$. Hydroxide is $\text{OH}^-$. Three $\text{OH}^-$ balance one $\text{Fe}^{3+}$: $\text{Fe(OH)}_3$.
      - |
        (b) Copper(II) means $\text{Cu}^{2+}$. Nitrate is $\text{NO}_3^-$. Two nitrates balance it: $\text{Cu(NO}_3)_2$.
    answer: |
      (a) $\text{Fe(OH)}_3$ (b) $\text{Cu(NO}_3)_2$

  - type: deeper
    title: The swap-and-drop shortcut (and its trap)
    body: |
      Swap the charge numbers and drop them as subscripts: $\text{Al}^{3+}$ and $\text{O}^{2-}$ → $\text{Al}_2\text{O}_3$. Fast.

      The trap: it doesn't simplify for you. $\text{Mg}^{2+}$ and $\text{O}^{2-}$ swap to "$\text{Mg}_2\text{O}_2$", but the formula of an ionic compound is the **simplest ratio**: MgO. Lead(IV) oxide swaps to "$\text{Pb}_2\text{O}_4$", which simplifies to $\text{PbO}_2$. Always cancel down at the end.

  - type: check
    title: Formulas from names
    questions: [ammonium-sulfate, iron-three-sulfate, name-iron-nitrate]

  - type: misconceptions
    items:
      - wrong: "Charges appear in the formula: $\\text{Al}^{3+}_2\\text{O}^{2-}_3$."
        right: "Charges cancel out in a compound, so you don't write them: $\\text{Al}_2\\text{O}_3$."
      - wrong: "$\\text{MgNO}_{32}$ for magnesium nitrate."
        right: "The 2 must apply to the whole nitrate ion: $\\text{Mg(NO}_3)_2$."
      - wrong: "Copper(II) oxide is $\\text{Cu}_2\\text{O}$, because of the II."
        right: "The II is the **charge**, not the number of copper atoms. $\\text{Cu}^{2+}$ + $\\text{O}^{2-}$ gives CuO. ($\\text{Cu}_2\\text{O}$ is copper(I) oxide.)"

  - type: exam
    body: |
      - Write the ions with charges in the margin first. It takes five seconds and catches most mistakes.
      - Check the zero-charge sum every time: $2(+3) + 3(-2) = 0$.
      - Subscripts go **low** and small: $\text{Al}_2\text{O}_3$. A full-size "Al2O3" is accepted when typing, but in handwriting make it unambiguous.
      - Going the other way (formula → name)? Work out the metal's charge from the anions, then add the numeral if the metal needs one.

  - type: takeaways
    items:
      - "Total positive charge = total negative charge; no charges written in the final formula."
      - "Use the lowest common multiple of the charges, then simplify to the smallest ratio."
      - "Brackets round a compound ion only when there's more than one: $\\text{Ca(OH)}_2$, $(\\text{NH}_4)_2\\text{SO}_4$."
      - "Roman numeral = charge on the metal ion: iron(III) hydroxide is $\\text{Fe(OH)}_3$."

questions:
  - id: magnesium-nitride
    format: text
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Write the formula of magnesium nitride. (Type subscripts as normal numbers, e.g. `Al2O3`.)
    accept: ["Mg3N2", "Mg₃N₂"]
    model: |
      $\text{Mg}_3\text{N}_2$
    explanation: |
      $\text{Mg}^{2+}$ (group 2) and $\text{N}^{3-}$ (group 15). LCM of 2 and 3 is 6: three $\text{Mg}^{2+}$ (+6), two $\text{N}^{3-}$ (−6).

  - id: calcium-hydroxide
    format: mcq
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      What is the formula of calcium hydroxide?
    options:
      - text: |
          $\text{Ca(OH)}_2$
        correct: true
        why: |
          $\text{Ca}^{2+}$ needs two $\text{OH}^-$, and the bracket makes the 2 apply to both O and H.
      - text: |
          $\text{CaOH}_2$
        why: |
          Without brackets this means one O and two H atoms: not two hydroxide ions.
      - text: |
          $\text{CaOH}$
        why: |
          One $\text{OH}^-$ leaves the compound with a 1+ charge.
      - text: |
          $\text{Ca}_2\text{OH}$
        why: |
          Two $\text{Ca}^{2+}$ (+4) and one $\text{OH}^-$ (−1) don't balance.
    explanation: |
      $\text{Ca}^{2+}$ + $2\,\text{OH}^-$ → $\text{Ca(OH)}_2$. Check: $+2 + 2(-1) = 0$.

  - id: ammonium-sulfate
    format: text
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Write the formula of ammonium sulfate. (Type subscripts as normal numbers, e.g. `Ca(OH)2`.)
    accept: ["(NH4)2SO4", "(NH₄)₂SO₄"]
    model: |
      $(\text{NH}_4)_2\text{SO}_4$
    explanation: |
      $\text{NH}_4^+$ and $\text{SO}_4^{2-}$: two ammoniums balance one sulfate, and the ammonium needs brackets.

  - id: iron-three-sulfate
    format: text
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Write the formula of iron(III) sulfate. (Type subscripts as normal numbers.)
    accept: ["Fe2(SO4)3", "Fe₂(SO₄)₃"]
    model: |
      $\text{Fe}_2(\text{SO}_4)_3$
    explanation: |
      Iron(III) is $\text{Fe}^{3+}$, sulfate is $\text{SO}_4^{2-}$. LCM 6: two $\text{Fe}^{3+}$, three sulfates in brackets.

  - id: zinc-phosphate-error
    format: spot-error
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      A student writes the formula of zinc phosphate. Which line contains the first error?
    lines:
      - |
        Zinc forms $\text{Zn}^{2+}$ ions.
      - |
        Phosphate is $\text{PO}_4^{3-}$.
      - |
        The lowest common multiple of 2 and 3 is 6.
      - |
        So we need three $\text{Zn}^{2+}$ (+6) and two $\text{PO}_4^{3-}$ (−6).
      - |
        Formula: $\text{Zn}_3\text{PO}_{42}$
    errorLine: 5
    fix: |
      The 2 must apply to the whole phosphate ion, so it needs brackets: $\text{Zn}_3(\text{PO}_4)_2$.
    explanation: |
      The charge balancing is perfect; only the brackets are missing. "$\text{PO}_{42}$" would mean 42 oxygen atoms.

  - id: name-iron-nitrate
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      What is the name of $\text{Fe(NO}_3)_2$?
    options:
      - text: |
          iron(II) nitrate
        correct: true
        why: |
          Two $\text{NO}_3^-$ give 2−, so the iron must be $\text{Fe}^{2+}$: iron(II).
      - text: |
          iron(III) nitrate
        why: |
          Iron(III) nitrate would need three nitrates: $\text{Fe(NO}_3)_3$.
      - text: |
          iron(II) nitride
        why: |
          Nitride is $\text{N}^{3-}$ with no oxygen. $\text{NO}_3^-$ is nitrate.
      - text: |
          iron(VI) nitrate
        why: |
          VI would mean $\text{Fe}^{6+}$. Six is just the number of O atoms in the formula; the iron's charge comes from balancing two 1− nitrates.
    explanation: |
      Work backwards from the anion: 2 × (1−) = 2−, so $\text{Fe}^{2+}$, iron(II).

  - id: atoms-in-aluminium-sulfate
    format: numeric
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      How many atoms in total are in one formula unit of $\text{Al}_2(\text{SO}_4)_3$?
    fields:
      - answer: 17
    explanation: |
      2 Al + 3 × (1 S + 4 O) = 2 + 3 × 5 = 17 atoms.
