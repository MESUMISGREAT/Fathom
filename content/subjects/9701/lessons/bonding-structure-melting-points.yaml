blocks:
  - type: objective
    body: |
      By the end you can predict and explain the melting and boiling points of substances from their structure and bonding.

  - type: explain
    title: The one question that sorts everything
    body: |
      To melt or boil a substance, you must overcome the forces **between** its particles.

      So ask: **what has to be overcome?**

      | structure | what holds the particles together | what melting/boiling must overcome | typical melting point |
      | --- | --- | --- | --- |
      | **simple molecular** | weak intermolecular forces between molecules | those weak forces | low (iodine $114\ ^\circ\text{C}$, ice $0\ ^\circ\text{C}$) |
      | **giant ionic** | electrostatic attraction between ions | the strong ionic attraction throughout the lattice | high ($\text{NaCl}$ $801\ ^\circ\text{C}$) |
      | **giant molecular** | strong covalent bonds everywhere | covalent bonds throughout the network | very high ($\text{SiO}_2$ about $1700\ ^\circ\text{C}$; diamond sublimes near $3800\ ^\circ\text{C}$) |
      | **giant metallic** | metallic bonding (ions + delocalised electrons) | metallic bonding | generally high (copper $1085\ ^\circ\text{C}$) |

  - type: definition
    term: Melting point and structure
    body: |
      The **melting point** of a substance depends on the **strength of the forces between its particles**: stronger forces → more energy needed → higher melting (and boiling) point.

  - type: diagram
    diagram: chem-bonding-structure-melting-points
    alt: "A horizontal bar chart of approximate melting points in degrees Celsius on a scale from 0 to 3000. Ice 0, iodine 114, copper 1085, silicon(IV) oxide about 1700, sodium chloride 801, magnesium oxide about 2800. A note says diamond and graphite sublime near 3800 degrees Celsius at ordinary pressure and are not shown as normal melting points. Grouped labels read: simple molecular, low; giant metallic and giant ionic, high; giant molecular, very high."

  - type: intuition
    title: Lego vs glued Lego
    body: |
      Simple molecular solids are like Lego bricks clipped lightly together: a gentle pull separates whole bricks.

      Ionic and giant molecular solids are bricks welded at every stud: you must destroy the welds, so a blowtorch is needed.

      The syllabus data backs it up — iodine melts in a warm hand-held flame; MgO needs a furnace.

  - type: example
    title: Ranking four substances
    problem: |
      Rank these in order of **increasing** melting point, and explain: iodine ($\text{I}_2$), sodium chloride ($\text{NaCl}$), diamond, magnesium oxide ($\text{MgO}$).
    steps:
      - 'Identify each structure: $\text{I}_2$ = simple molecular; $\text{NaCl}$ = giant ionic; diamond = giant molecular; $\text{MgO}$ = giant ionic with 2+/2− ions.'
      - 'Ask what must be overcome: $\text{I}_2$ only weak van der Waals'' forces → lowest.'
      - '$\text{NaCl}$ must overcome ionic attraction between 1+ and 1− ions → high ($801\ ^\circ\text{C}$).'
      - '$\text{MgO}$ has 2+ and 2− ions, so the attraction is stronger than in $\text{NaCl}$ → higher still (about $2800\ ^\circ\text{C}$).'
      - 'Diamond must break covalent bonds throughout a 3D network → extremely high (it sublimes near $3800\ ^\circ\text{C}$).'
    answer: "I₂ < NaCl < MgO < diamond"

  - type: check
    title: Predicting melting points
    questions: [mp-ranking, mgo-vs-nacl]

  - type: misconceptions
    items:
      - wrong: "Iodine melts at a low temperature because its covalent bonds are weak."
        right: 'The I–I covalent bonds are strong. Melting overcomes only the **weak van der Waals'' forces between** the $\text{I}_2$ molecules.'
      - wrong: "Diamond melts at a 'normal' high temperature like a metal."
        right: "At atmospheric pressure diamond **sublimes** rather than melting; say 'extremely high melting/sublimation point' or quote given data."
      - wrong: "Ionic compounds always melt above 1000 °C."
        right: "The trend is high, but the exact value depends on the charges and sizes of the ions. Compare with data when the question gives it."

  - type: check
    title: Boiling points too
    questions: [boiling-point-forces, water-vs-h2s]

  - type: exam
    body: |
      - Full-mark explanations name the **structure**, the **force to be overcome**, and the **comparison**: "MgO has 2+ and 2− ions instead of 1+ and 1−, so the electrostatic attraction is stronger, so more energy is needed to overcome it."
      - For simple molecular solids, always say the covalent bonds **within** molecules are not broken — only intermolecular forces.
      - Boiling points follow the same logic as melting points; if asked about both, the same force explanation covers each.

  - type: takeaways
    items:
      - "Melting/boiling point reflects the strength of the forces between particles."
      - "Simple molecular: weak intermolecular forces → low melting/boiling points."
      - "Giant ionic and giant molecular: strong forces throughout the lattice → high melting points (MgO > NaCl because of 2+/2− charges)."
      - "Metals: metallic bonding is strong, so melting points are generally high."

questions:
  - id: mp-ranking
    format: mcq
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Which list is in order of **increasing** melting point (lowest first)?
    options:
      - text: |
          diamond, MgO, NaCl, iodine
        why: |
          Diamond and MgO are the highest-melting of the four, not the lowest. Re-order using "what must be overcome?".
      - text: |
          iodine, NaCl, MgO, diamond
        correct: true
        why: |
          Iodine (weak forces between molecules) → NaCl (ionic, 1+/1−) → MgO (ionic, 2+/2−) → diamond (giant covalent network).
      - text: |
          iodine, diamond, NaCl, MgO
        why: |
          Diamond must break covalent bonds throughout a 3D network — it is the highest of the four, not second.
      - text: |
          NaCl, MgO, iodine, diamond
        why: |
          Iodine has the lowest melting point of the four: only weak forces between molecules hold it together.
    explanation: |
      Weak intermolecular forces < ionic (1+/1−) < ionic (2+/2−) < giant covalent network.

  - id: mgo-vs-nacl
    format: text
    style: short
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Explain why magnesium oxide has a higher melting point than sodium chloride.
    accept:
      - "mgo has 2+ and 2- ions while nacl has 1+ and 1- ions, so the electrostatic attraction is stronger in mgo and more energy is needed to overcome it"
      - "the ions in mgo carry greater charges (2+ and 2-), so the electrostatic attraction between the ions is stronger than in nacl, so more energy is needed to break the lattice"
      - "mgo contains mg2+ and o2- ions which attract more strongly than the na+ and cl- ions in nacl, so more energy is needed to overcome the attraction"
      - "stronger electrostatic attraction in mgo because its ions have double the charge"
    model: |
      MgO has Mg²⁺ and O²⁻ ions, which carry greater charges than the Na⁺ and Cl⁻ ions in NaCl. The electrostatic attraction between the ions is therefore stronger in MgO, so more energy is needed to overcome it.
    explanation: |
      The chain that earns marks: greater ionic charges → stronger electrostatic attraction → more energy needed → higher melting point.

  - id: boiling-point-forces
    format: mcq
    difficulty: 1
    objectives: ["4.2.2"]
    prompt: |
      What must be overcome when a simple molecular liquid (such as liquid iodine) boils?
    options:
      - text: |
          The covalent bonds inside the molecules.
        why: |
          Breaking covalent bonds would be a chemical change (decomposition), not boiling.
      - text: |
          The weak intermolecular forces between the molecules.
        correct: true
        why: |
          Boiling separates molecules from one another; the covalent bonds inside each molecule stay intact.
      - text: |
          The ionic bonds in the lattice.
        why: |
          Iodine has no ions; its lattice is built from molecules held by weak intermolecular forces.
      - text: |
          The delocalised electrons in the structure.
        why: |
          Simple molecular substances have no delocalised electrons at all.
    explanation: |
      Boiling a molecular liquid overcomes only the intermolecular forces — that is why boiling points are low.

  - id: water-vs-h2s
    format: mcq
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      Water ($\text{H}_2\text{O}$) boils at $100\ ^\circ\text{C}$ while hydrogen sulfide ($\text{H}_2\text{S}$), a similar-sized molecule, boils at $-60\ ^\circ\text{C}$. Both are simple molecular. What best explains the difference?
    options:
      - text: |
          Water has covalent bonds and hydrogen sulfide does not.
        why: |
          Both molecules have covalent bonds (O–H and S–H). The covalent bonds are not broken during boiling in either case.
      - text: |
          Water molecules are held by hydrogen bonds, which are stronger than the van der Waals' forces between H₂S molecules.
        correct: true
        why: |
          Both are simple molecular, so boiling must overcome intermolecular forces — but water's hydrogen bonds are much stronger than the van der Waals' forces between H₂S molecules, so more energy is needed.
      - text: |
          Hydrogen sulfide is a giant molecular substance, so it boils easily.
        why: |
          $\text{H}_2\text{S}$ is simple molecular, like water. Giant molecular substances have very high, not low, boiling points.
      - text: |
          Water has a higher molar mass than hydrogen sulfide.
        why: |
          $\text{H}_2\text{S}$ ($M_r$ 38) is actually heavier than $\text{H}_2\text{O}$ ($M_r$ 18) — mass is not the explanation; the type of intermolecular force is.
    explanation: |
      Same structure type, different intermolecular force: hydrogen bonds between water molecules are stronger than van der Waals' forces between H₂S molecules.
