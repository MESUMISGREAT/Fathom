id: bonding-structure-melting-points
subject: "9701"
topic: "4.2"
title: Structure decides melting point
summary: A single question — what must be overcome? — sorts every substance's melting and boiling point, from iodine's 114 °C to MgO's 2800 °C.
order: 5
minutes: 4
objectives: ["4.2.2"]
prerequisites: [bonding-structure-giant-ionic, bonding-structure-simple-molecular, bonding-structure-giant-molecular, bonding-structure-giant-metallic]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.2, learning outcome 2: describe, interpret and predict the effect of
    different types of structure and bonding on physical properties, including melting
