id: chemical-formulas-water-of-crystallisation
subject: "9701"
topic: "2.3"
title: Hydrated salts and water of crystallisation
summary: What hydrated, anhydrous and water of crystallisation mean, how to read formulas like CuSO₄·5H₂O, and how to find x in a hydrate from heating data.
order: 9
minutes: 5
objectives: ["2.3.4", "2.3.5"]
prerequisites: [chemical-formulas-empirical-from-data]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcomes 2.3.4: anhydrous, hydrated and water
    of crystallisation; and 2.3.5: calculating formulas from given data). Ar values from
    the Cambridge Data Booklet. Heating readings for magnesium sulfate and barium chloride
    are illustrative, calculated back from the true formulas and rounded to 3 s.f. All
    questions are original.
blocks:
  - type: objective
    body: |
      By the end you can use the terms **hydrated**, **anhydrous** and **water of crystallisation**, read formulas like $\text{CuSO}_4{\cdot}5\text{H}_2\text{O}$, and calculate the number of water molecules in a hydrate from heating data.

  - type: explain
    title: Dry crystals that are a third water
    body: |
      Blue copper(II) sulfate crystals feel completely dry. Yet about **36 %** of their mass is water. Heat them and they crumble to a white powder as the water steams off.

      That water isn't wet or trapped in puddles. It's built into the crystal itself, in a fixed ratio, and it's called **water of crystallisation**.

  - type: definition
    term: Water of crystallisation
    body: |
      Water molecules that are chemically bonded into the crystal structure of a compound, in a fixed ratio.

  - type: definition
    term: Hydrated and anhydrous
    body: |
      A **hydrated** compound contains water of crystallisation. An **anhydrous** compound contains no water of crystallisation.

  - type: explain
    title: Reading the dot
    body: |
      $\text{CuSO}_4{\cdot}5\text{H}_2\text{O}$ means: in the crystal, there are **five water molecules for every $\text{CuSO}_4$ unit**. The dot means "combined with", **not** "multiplied by".

      So for the formula mass you **add**: $\text{CuSO}_4 = 159.6$, plus $5 \times 18.0 = 90.0$, gives **249.6**. (And $90.0 \div 249.6 = 36$ % water: the hook above.)

      | hydrated | colour | anhydrous | colour |
      | --- | --- | --- | --- |
      | $\text{CuSO}_4{\cdot}5\text{H}_2\text{O}$ | blue | $\text{CuSO}_4$ | white |
      | $\text{CoCl}_2{\cdot}6\text{H}_2\text{O}$ | pink | $\text{CoCl}_2$ | blue |
      | $\text{MgSO}_4{\cdot}7\text{H}_2\text{O}$ (Epsom salts) | white | $\text{MgSO}_4$ | white |
      | $\text{Na}_2\text{CO}_3{\cdot}10\text{H}_2\text{O}$ (washing soda) | white | $\text{Na}_2\text{CO}_3$ | white |

      Heating drives the water off: $\text{CuSO}_4{\cdot}5\text{H}_2\text{O(s)} \rightarrow \text{CuSO}_4\text{(s)} + 5\text{H}_2\text{O(g)}$. Add water to the white powder and it turns blue again, which is why anhydrous copper(II) sulfate is used to **test for water**.

  - type: check
    title: Quick check
    questions: [hydrates-cloze, copper-sulfate-mass]

  - type: diagram
    diagram: chem-chemical-formulas-heating-crucible
    alt: "Left: apparatus for heating a hydrated salt. A crucible containing the salt, with a loosely fitting lid, sits in a pipe-clay triangle on a tripod above a Bunsen burner flame. Right: heat to constant mass, with steps 1 weigh, 2 heat, 3 cool then reweigh, 4 repeat steps 2 and 3 until two readings agree. A table of illustrative masses of solid: before heating 2.50 g; after heating 1, 1.40 g; after heating 2, 1.25 g; after heating 3, 1.22 g; after heating 4, 1.22 g. The last two readings are highlighted: constant, all water removed."
    caption: Keep heating until the mass stops changing. Then you know all the water has gone.

  - type: example
    title: How many waters in Epsom salts?
    problem: |
      2.50 g of hydrated magnesium sulfate, $\text{MgSO}_4{\cdot}x\text{H}_2\text{O}$, is heated to constant mass. 1.22 g of anhydrous $\text{MgSO}_4$ remains. Find $x$. ($A_r$: Mg = 24.3, S = 32.1, O = 16.0, H = 1.0)
    steps:
      - |
        Mass of water lost: $2.50 - 1.22 = 1.28$ g
      - |
        Moles of water: $1.28 \div 18.0 = 0.0711$ mol
      - |
        $M(\text{MgSO}_4) = 24.3 + 32.1 + 4(16.0) = 120.4\ \text{g mol}^{-1}$, so moles of $\text{MgSO}_4$: $1.22 \div 120.4 = 0.01013$ mol
      - |
        Ratio: $x = 0.0711 \div 0.01013 = 7.02$, so $x = 7$.
    answer: |
      $\text{MgSO}_4{\cdot}7\text{H}_2\text{O}$. It's the empirical formula method again, with $\text{MgSO}_4$ and $\text{H}_2\text{O}$ as the two "elements".

  - type: check
    title: Find the water
    questions: [barium-chloride-x, washing-soda-percent]

  - type: deeper
    title: What can go wrong in the practical
    body: |
      | problem | effect on measured mass loss | effect on $x$ |
      | --- | --- | --- |
      | not heated to constant mass (some water left) | too **small** | too **low** |
      | solid spits out of the crucible | too **big** | too **high** |
      | anhydrous salt decomposes on strong heating | too **big** | too **high** |

      That's why you use a **loosely fitting lid** (steam escapes, solid doesn't), heat gently at first, and **cool before weighing** (a hot crucible gives unreliable readings).

  - type: check
    title: Practical sense
    questions: [constant-mass, incomplete-heating]

  - type: misconceptions
    items:
      - wrong: "Anhydrous just means dry."
        right: "Hydrated crystals look dry too. Anhydrous means **no water of crystallisation** in the structure."
      - wrong: "The dot in $\\text{CuSO}_4{\\cdot}5\\text{H}_2\\text{O}$ means multiply."
        right: "It means combined with: **add** the masses. 159.6 + 90.0 = 249.6."
      - wrong: "Use the mass of the hydrated salt to find moles of $\\text{MgSO}_4$."
        right: "Use the mass **left after heating** (the anhydrous salt) with the anhydrous molar mass."

  - type: exam
    body: |
      - Definitions are often a single mark each. "Anhydrous: contains no water of crystallisation" is enough; don't overthink it.
      - In calculations, label your two masses clearly: **water lost** and **anhydrous salt left**. Mixing them up is the commonest slip.
      - $x$ should come out close to a whole number. 7.02 → 7 is fine; 6.5 means recheck your arithmetic, not "round up".
      - "Heat to constant mass" questions want: repeat heating, cooling and weighing until two consecutive masses agree, to make sure all the water has been removed.

  - type: takeaways
    items:
      - "Water of crystallisation: water chemically bonded into a crystal in a fixed ratio."
      - "Hydrated contains it; anhydrous doesn't."
      - "The dot means add: $M(\\text{CuSO}_4{\\cdot}5\\text{H}_2\\text{O}) = 159.6 + 90.0 = 249.6$."
      - "To find $x$: moles of water lost ÷ moles of anhydrous salt."
      - "Heat to constant mass, or $x$ comes out too low."

questions:
  - id: hydrates-cloze
    format: cloze
    difficulty: 1
    objectives: ["2.3.4"]
    prompt: |
      Water molecules that are bonded into a salt's crystal structure in a fixed ratio are called water of {{1}}. A salt containing them is {{2}}. The same salt with all of them removed is {{3}}.
    blanks:
      - accept: ["crystallisation", "crystallization"]
      - accept: ["hydrated"]
      - accept: ["anhydrous"]
    explanation: |
      Hydrated = with water of crystallisation; anhydrous = without it.

  - id: copper-sulfate-mass
    format: numeric
    difficulty: 1
    objectives: ["2.3.4"]
    prompt: |
      Calculate the relative formula mass of hydrated copper(II) sulfate, $\text{CuSO}_4{\cdot}5\text{H}_2\text{O}$. ($A_r$: Cu = 63.5, S = 32.1, O = 16.0, H = 1.0)
    fields:
      - answer: 249.6
        tolerance: { abs: 0.05 }
    explanation: |
      $\text{CuSO}_4 = 63.5 + 32.1 + 4(16.0) = 159.6$. Add $5 \times 18.0 = 90.0$: total 249.6.

  - id: barium-chloride-x
    format: numeric
    difficulty: 2
    objectives: ["2.3.5", "2.3.4"]
    prompt: |
      2.44 g of hydrated barium chloride, $\text{BaCl}_2{\cdot}x\text{H}_2\text{O}$, is heated to constant mass, leaving 2.08 g of anhydrous $\text{BaCl}_2$. Find $x$. ($A_r$: Ba = 137.3, Cl = 35.5, H = 1.0, O = 16.0)
    fields:
      - label: "x ="
        answer: 2
    explanation: |
      Water lost: $2.44 - 2.08 = 0.36$ g, which is $0.36 \div 18.0 = 0.0200$ mol. $M(\text{BaCl}_2) = 208.3$, so $2.08 \div 208.3 = 0.00999$ mol. $x = 0.0200 \div 0.00999 = 2.00$, so $\text{BaCl}_2{\cdot}2\text{H}_2\text{O}$.

  - id: washing-soda-percent
    format: numeric
    difficulty: 2
    objectives: ["2.3.4"]
    prompt: |
      What percentage of the mass of washing soda, $\text{Na}_2\text{CO}_3{\cdot}10\text{H}_2\text{O}$, is water of crystallisation? Give your answer to 3 significant figures. ($A_r$: Na = 23.0, C = 12.0, O = 16.0, H = 1.0)
    fields:
      - answer: 62.9
        tolerance: { abs: 0.1 }
        unit: "%"
    explanation: |
      $\text{Na}_2\text{CO}_3 = 2(23.0) + 12.0 + 3(16.0) = 106.0$; water $= 10 \times 18.0 = 180.0$; total 286.0. So $180.0 \div 286.0 \times 100 = 62.9$ %. Washing soda is mostly water!

  - id: constant-mass
    format: mcq
    difficulty: 1
    objectives: ["2.3.4"]
    prompt: |
      Why is a hydrated salt heated, cooled and reweighed repeatedly until its mass stops changing?
    options:
      - text: |
          To make sure all the water of crystallisation has been removed
        correct: true
        why: |
          When two readings agree, no more water is being lost, so the solid left is fully anhydrous.
      - text: |
          To let the crystals grow larger
        why: |
          Heating breaks up the crystals as water leaves; it doesn't grow them.
      - text: |
          To decompose the anhydrous salt
        why: |
          That would spoil the result: you want the anhydrous salt left intact.
      - text: |
          To add more water of crystallisation from the air
        why: |
          Heating removes water. (Anhydrous salt left in open air can slowly reabsorb water, which is why it's weighed promptly once cool.)
    explanation: |
      Constant mass is the evidence that dehydration is complete.

  - id: incomplete-heating
    format: mcq
    difficulty: 3
    objectives: ["2.3.5", "2.3.4"]
    prompt: |
      A student stops heating hydrated copper(II) sulfate while a little blue colour remains. What effect does this have on their calculated value of $x$ in $\text{CuSO}_4{\cdot}x\text{H}_2\text{O}$?
    options:
      - text: |
          $x$ is too low.
        correct: true
        why: |
          Less water is lost, so moles of water are too small, and the "anhydrous" mass is too big, so moles of $\text{CuSO}_4$ are too large. Both push $x$ down.
      - text: |
          $x$ is too high.
        why: |
          That happens if the mass loss is too **big** (for example, solid spitting out). Here the loss is too small.
      - text: |
          $x$ is unchanged, because the ratio is fixed.
        why: |
          The real ratio is fixed, but the measured one depends on removing all of the water.
      - text: |
          It depends on the mass of the crucible.
        why: |
          The crucible's mass cancels when you take differences.
    explanation: |
      Blue means some hydrated salt remains, so not all the water has gone. Underestimating water lost always gives a low $x$.
