id: redox-processes-special-cases-roman-numerals
subject: "9701"
topic: "6.1"
title: "Peroxides, hydrides and Roman numerals"
summary: Oxygen and hydrogen break their usual rules in peroxides, hydrides and OF₂ — and a Roman numeral in a name tells you the oxidation number directly.
order: 2
minutes: 8
kind: core
objectives: ["6.1.1", "6.1.5"]
prerequisites: [redox-processes-oxidation-numbers]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027, topic 6.1, learning outcomes 6.1.1 (oxidation numbers, including the peroxide,
    hydride and OF2 exceptions) and 6.1.5 (using a Roman numeral to show the oxidation number).
    Every oxidation number and formula in the worked examples and answer keys was checked in
    Python and against the syllabus conventions on 2026-10-28. All questions are original.

    Independently re-checked line by line (definitions, every worked step, every answer key and
    each diagram's alt text) in a second adversarial pass by the same agent on 2026-10-28:
    every oxidation number and every balanced equation was re-derived from its own data in
    Python, all five outcomes 6.1.1-6.1.5 were confirmed taught and tested, and all three
    diagrams were rendered and inspected in light and dark. No separate reviewer model was
    available here. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |-
      By the end you can handle the standard exceptions to the oxygen and hydrogen rules, work out an average oxidation number when it is fractional, and read or write a **Roman numeral** in a compound's name.

  - type: explain
    title: When oxygen does not take minus two
    body: |-
      The rule "oxygen is $-2$" comes from oxygen pulling electrons away from its partner. Sometimes that picture breaks.

      In a **peroxide**, two oxygen atoms are bonded to each other: $\text{O}-\text{O}$. Each oxygen now shares with another oxygen as well as with the other element, so it does not gain two whole electrons.

      The result is an oxidation number of $-1$ for each oxygen in a peroxide.

      | Compound | Oxidation number of oxygen | Why |
      | --- | --- | --- |
      | $\text{H}_2\text{O}$ | $-2$ | usual case |
      | $\text{H}_2\text{O}_2$ | $-1$ | peroxide, O–O bond |
      | $\text{Na}_2\text{O}_2$ | $-1$ | peroxide, O–O bond |
      | $\text{OF}_2$ | $+2$ | fluorine is more electronegative, so oxygen loses |

      In $\text{OF}_2$, fluorine is $-1$ by its own rule. Two fluorines give $-2$ in total, so oxygen must be $+2$ to make the neutral compound add to zero. Oxygen is the *less* electronegative partner here, which is rare.

  - type: example
    title: "Worked example: hydrogen peroxide"
    problem: |-
      Show that the oxidation number of oxygen in $\text{H}_2\text{O}_2$ is $-1$.
    steps:
      - |-
        Hydrogen is $+1$ in this compound, because it is bonded to a non-metal.
      - |-
        Let each oxygen be $x$. There are two hydrogens and two oxygens, and the compound is neutral:

        $$2(+1) + 2x = 0$$
      - |-
        $$2 + 2x = 0$$
      - |-
        $$2x = -2$$
      - |-
        $$x = -1$$
      - |-
        Check: $2(+1) + 2(-1) = 0$. ✔
    answer: |-
      Each oxygen is $-1$ in $\text{H}_2\text{O}_2$.

  - type: explain
    title: When hydrogen does not take plus one
    body: |-
      Hydrogen is $+1$ when it is bonded to a more electronegative non-metal, which is most of the time.

      With a reactive metal, the positions reverse. Sodium is much less electronegative than hydrogen, so in sodium hydride the shared electrons sit closer to hydrogen.

      Hydrogen becomes $-1$.

      | Compound | Oxidation number of hydrogen |
      | --- | --- |
      | $\text{HCl}$ | $+1$ |
      | $\text{CH}_4$ | $+1$ |
      | $\text{NaH}$ | $-1$ |
      | $\text{CaH}_2$ | $-1$ |

  - type: check
    title: Quick check
    questions: [peroxide-oxygen, hydride-hydrogen, of2-oxygen]

  - type: explain
    title: Fractional averages are allowed
    body: |-
      In $\text{Fe}_3\text{O}_4$, oxygen is $-2$, so the three irons must total $+8$. That gives an average of

      $$+\dfrac{8}{3} \approx +2.67$$

      per iron atom. A fractional oxidation number looks strange, but it is just an average.

      $\text{Fe}_3\text{O}_4$ is really a mixed oxide containing both $\text{Fe}^{2+}$ and $\text{Fe}^{3+}$ ions: one $\text{Fe}^{2+}$ and two $\text{Fe}^{3+}$ per formula unit. The average is $+8/3$.

      Cambridge questions usually accept the average when they ask for "the oxidation number of iron in $\text{Fe}_3\text{O}_4$", but it is worth saying that it is an average of two different states.

  - type: definition
    term: Roman numeral in a compound name
    body: |-
      A **Roman numeral** after an element's name gives that element's **oxidation number** in the compound.

      It is used when the element can take more than one oxidation number — most often a transition metal.

      | Name | Formula | Oxidation number |
      | --- | --- | --- |
      | iron(II) chloride | $\text{FeCl}_2$ | Fe is $+2$ |
      | iron(III) chloride | $\text{FeCl}_3$ | Fe is $+3$ |
      | copper(I) oxide | $\text{Cu}_2\text{O}$ | Cu is $+1$ |
      | copper(II) oxide | $\text{CuO}$ | Cu is $+2$ |
      | manganese(IV) oxide | $\text{MnO}_2$ | Mn is $+4$ |
      | potassium manganate(VII) | $\text{KMnO}_4$ | Mn is $+7$ |
      | potassium dichromate(VI) | $\text{K}_2\text{Cr}_2\text{O}_7$ | Cr is $+6$ |

      The Roman numeral is **not** the number of atoms. $\text{FeCl}_3$ has one iron and three chlorines, but the (III) refers to iron's $+3$ oxidation number.

  - type: diagram
    diagram: chem-redox-oxidation-number-rules
    alt: >-
      The same oxidation-number rule table, repeated here as a reference: uncombined elements are
      zero, monatomic ions take their charge, fluorine is minus one, oxygen is minus two except in
      peroxides and OF2, hydrogen is plus one except in metal hydrides, and the totals equal zero
      for a compound or the ion charge for an ion.
    caption: |-
      Keep the priority order in mind: the oxygen and hydrogen rules are defaults, and the exceptions override them.

  - type: example
    title: "Worked example: naming a compound from its formula"
    problem: |-
      Name $\text{Cu}_2\text{O}$ and $\text{Fe}_2(\text{SO}_4)_3$ using Roman numerals.
    steps:
      - |-
        For $\text{Cu}_2\text{O}$: oxygen is $-2$, so the two coppers must total $+2$.
      - |-
        Each copper is therefore $+1$. The name is **copper(I) oxide**.
      - |-
        For $\text{Fe}_2(\text{SO}_4)_3$: the sulfate ion is $\text{SO}_4^{2-}$, so three of them give $-6$.
      - |-
        The two irons must total $+6$, so each iron is $+3$.
      - |-
        The name is **iron(III) sulfate**.
    answer: |-
      $\text{Cu}_2\text{O}$ is copper(I) oxide; $\text{Fe}_2(\text{SO}_4)_3$ is iron(III) sulfate.

  - type: example
    title: "Worked example: formula from a name"
    problem: |-
      Write the formula of lead(IV) oxide.
    steps:
      - |-
        The Roman numeral (IV) means lead is $+4$.
      - |-
        Oxide is $\text{O}^{2-}$, so each oxygen is $-2$.
      - |-
        To make the charges balance, two oxygens are needed for each lead:

        $$(+4) + 2(-2) = 0$$
      - |-
        The formula is $\text{PbO}_2$.
    answer: |-
      $\text{PbO}_2$.

  - type: check
    title: Practice
    questions: [iron-iii-chloride, roman-numeral-mcq, mno2-name, roman-cloze]

  - type: misconceptions
    items:
      - wrong: Oxygen is always $-2$ in every compound.
        right: |-
          It is $-1$ in peroxides such as $\text{H}_2\text{O}_2$ and $\text{Na}_2\text{O}_2$, and
          $+2$ in $\text{OF}_2$.
      - wrong: Hydrogen is always $+1$.
        right: |-
          It is $-1$ in metal hydrides such as $\text{NaH}$ and $\text{CaH}_2$.
      - wrong: The (III) in iron(III) chloride means there are three iron atoms.
        right: |-
          It means each iron has oxidation number $+3$. The formula $\text{FeCl}_3$ has **one**
          iron atom.
      - wrong: An oxidation number must be a whole number.
        right: |-
          An individual atom's oxidation number is a whole number, but an **average** over several
          atoms can be fractional, as in $\text{Fe}_3\text{O}_4$ ($+8/3$).
      - wrong: Roman numerals are used for every compound.
        right: |-
          They are used when the element can take more than one oxidation number. Sodium chloride
          needs no numeral because sodium is always $+1$ in its compounds.

  - type: exam
    body: |-
      - Treat peroxides and hydrides as exceptions you recognise by their formula: $\text{H}_2\text{O}_2$, $\text{Na}_2\text{O}_2$, $\text{NaH}$, $\text{CaH}_2$.
      - When a Roman numeral is given, use it directly as the oxidation number — no calculation needed for that element.
      - When asked for a name, include the Roman numeral in brackets straight after the metal name, with no space: iron(III) chloride.
      - For a fractional average, say it is an average and, if you can, name the two actual oxidation states present.

  - type: takeaways
    items:
      - 'Oxygen is $-1$ in peroxides and $+2$ in $\text{OF}_2$; otherwise it is usually $-2$.'
      - 'Hydrogen is $-1$ in metal hydrides; otherwise it is usually $+1$.'
      - 'A fractional oxidation number is an average over atoms in different states, as in $\text{Fe}_3\text{O}_4$.'
      - 'A Roman numeral gives the oxidation number of that element, not the number of atoms.'
      - 'Use Roman numerals for elements that can take more than one oxidation number.'

  - type: check
    title: One more check
    questions: [fe3o4-average]

questions:
  - id: peroxide-oxygen
    format: mcq
    difficulty: 1
    objectives: ["6.1.1"]
    prompt: |-
      What is the oxidation number of oxygen in hydrogen peroxide, $\text{H}_2\text{O}_2$?
    options:
      - text: "-1"
        correct: true
        why: |-
          $2(+1) + 2x = 0$ gives $x = -1$. The O–O bond means oxygen does not gain two electrons each.
      - text: "-2"
        why: |-
          That is oxygen's usual value, but peroxides are the exception.
      - text: "+1"
        why: |-
          That would make the compound's total $+4$, not zero.
      - text: "0"
        why: |-
          Oxygen is only 0 in the element $\text{O}_2$, not in a compound.
    explanation: |-
      In a peroxide each oxygen is $-1$.

  - id: hydride-hydrogen
    format: numeric
    difficulty: 1
    objectives: ["6.1.1"]
    prompt: |-
      What is the oxidation number of hydrogen in sodium hydride, $\text{NaH}$?
    fields:
      - label: "H ="
        answer: -1
        tolerance: { abs: 0.01 }
    explanation: |-
      Sodium is $+1$, so hydrogen must be $-1$ for the compound to be neutral.

  - id: of2-oxygen
    format: numeric
    difficulty: 1
    objectives: ["6.1.1"]
    prompt: |-
      What is the oxidation number of oxygen in $\text{OF}_2$?
    fields:
      - label: "O ="
        answer: 2
        tolerance: { abs: 0.01 }
    explanation: |-
      Fluorine is $-1$, so two fluorines give $-2$. Oxygen must be $+2$ to make the total zero.

  - id: iron-iii-chloride
    format: mcq
    difficulty: 1
    objectives: ["6.1.5"]
    prompt: |-
      Which formula is iron(III) chloride?
    options:
      - text: $\text{FeCl}_3$
        correct: true
        why: |-
          Iron is $+3$ and each chloride is $-1$, so three chlorides are needed.
      - text: $\text{FeCl}_2$
        why: |-
          That is iron(II) chloride: iron is $+2$.
      - text: $\text{Fe}_3\text{Cl}$
        why: |-
          That would mean three iron atoms for one chloride, which does not balance the charges.
      - text: $\text{Fe}_2\text{Cl}_3$
        why: |-
          That is not the formula of iron(III) chloride; the charges would not balance.
    explanation: |-
      The (III) is iron's oxidation number, $+3$, so three $\text{Cl}^-$ ions are needed.

  - id: mno2-name
    format: mcq
    difficulty: 2
    objectives: ["6.1.5"]
    prompt: |-
      What is the correct name for $\text{MnO}_2$?
    options:
      - text: manganese(IV) oxide
        correct: true
        why: |-
          Oxygen is $-2$, so two oxygens give $-4$ and manganese must be $+4$.
      - text: manganese(II) oxide
        why: |-
          That would be $\text{MnO}$, with one oxygen.
      - text: manganese dioxide
        why: |-
          "Dioxide" is an older naming style; the syllabus name uses the oxidation number.
      - text: manganese(VI) oxide
        why: |-
          That would need manganese to be $+6$, but here it is $+4$.
    explanation: |-
      $x + 2(-2) = 0$ gives $x = +4$, so the name is manganese(IV) oxide.

  - id: roman-numeral-mcq
    format: mcq
    difficulty: 1
    objectives: ["6.1.5"]
    prompt: |-
      What does the Roman numeral in copper(II) sulfate tell you?
    options:
      - text: The oxidation number of copper is +2
        correct: true
        why: |-
          The Roman numeral states the element's oxidation number directly.
      - text: There are two copper atoms in the formula
        why: |-
          The formula is $\text{CuSO}_4$: one copper atom.
      - text: The charge on the sulfate ion is -2
        why: |-
          That is true, but it is not what the (II) after copper refers to.
      - text: There are two sulfate ions
        why: |-
          There is one sulfate ion in the formula.
    explanation: |-
      The numeral belongs to the element named before it, and gives that element's oxidation number.

  - id: roman-cloze
    format: cloze
    difficulty: 1
    objectives: ["6.1.5"]
    prompt: |-
      In a compound's name, a Roman numeral after an element gives that element's {{1}}. It is needed when the element can take more than one {{2}}.
    blanks:
      - accept: [oxidation number, oxidation state]
      - accept: [oxidation number, oxidation state]
    explanation: |-
      The Roman numeral is the oxidation number, used when an element has several possible values.

  - id: fe3o4-average
    format: numeric
    difficulty: 3
    objectives: ["6.1.1"]
    prompt: |-
      What is the **average** oxidation number of iron in $\text{Fe}_3\text{O}_4$?

      Give your answer to 2 decimal places.
    fields:
      - label: "average Fe ="
        answer: 2.67
        tolerance: { abs: 0.02 }
    explanation: |-
      Oxygen is $-2$, so four oxygens give $-8$. The three irons must total $+8$, so the average is $+8/3 = +2.67$. (The solid contains one $\text{Fe}^{2+}$ and two $\text{Fe}^{3+}$ per formula unit.)
