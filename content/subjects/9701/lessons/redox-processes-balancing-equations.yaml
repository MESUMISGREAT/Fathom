id: redox-processes-balancing-equations
subject: "9701"
topic: "6.1"
title: "Balancing redox equations with oxidation numbers"
summary: Match the total increase in oxidation number to the total decrease, then balance atoms, oxygen, hydrogen and charge. No guessing.
order: 5
minutes: 9
kind: core
objectives: ["6.1.2"]
prerequisites: [redox-processes-electron-transfer, redox-processes-oxidation-numbers]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027, topic 6.1, learning outcome 6.1.2 (use changes in oxidation numbers to help balance
    chemical equations). Every coefficient in the worked examples and answer keys was derived and
    checked for atom and charge balance in Python on 2026-10-28. All questions are original.

    Independently re-checked line by line (definitions, every worked step, every answer key and
    each diagram's alt text) in a second adversarial pass by the same agent on 2026-10-28:
