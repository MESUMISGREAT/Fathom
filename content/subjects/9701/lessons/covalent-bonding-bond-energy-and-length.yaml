  - id: nitrogen-half-mole
    format: numeric
    difficulty: 1
    objectives: ["3.4.3"]
    prompt: |
      The N≡N bond energy is $944\ \text{kJ mol}^{-1}$ (Data Booklet). How much energy is needed to break all the bonds in 0.50 mol of $\text{N}_2\text{(g)}$?
    fields:
      - answer: 472
        tolerance: { abs: 0.5 }
        unit: kJ
    explanation: |
      Each $\text{N}_2$ has one N≡N bond, so 0.50 mol of molecules has 0.50 mol of bonds: 0.50 × 944 = 472 kJ.

  - id: propane-check
    format: numeric
    difficulty: 2
    objectives: ["3.4.3"]
    prompt: |
      Using Data Booklet values (C–C 350 kJ mol⁻¹, C–H 410 kJ mol⁻¹), estimate the energy needed to break **all** the bonds in 1 mol of propane gas, $\text{CH}_3\text{CH}_2\text{CH}_3\text{(g)}$.
    fields:
      - answer: 3980
        tolerance: { abs: 0.5 }
        unit: kJ
    explanation: |
      Propane has 2 C–C bonds and 8 C–H bonds: 2 × 350 + 8 × 410 = 700 + 3280 = 3980 kJ.

  - id: shortest-carbon-bond
    format: mcq
    difficulty: 1
    objectives: ["3.4.3"]
    prompt: |
      Which carbon–carbon bond is the **shortest and strongest**?
    options:
      - text: C–C
        why: |
          A single bond has just one shared pair: the longest (0.154 nm) and weakest (350 kJ mol⁻¹) of the three.
      - text: C=C
        why: |
          Two shared pairs: shorter and stronger than C–C, but not the extreme.
      - text: C≡C
        correct: true
        why: |
          Three shared pairs pull the nuclei closest together: 0.120 nm and 840 kJ mol⁻¹.
      - text: They are all the same length
        why: |
          More shared electrons between the nuclei pull them closer, so the lengths differ.
    explanation: |
      Between the same two atoms, more shared pairs mean a shorter, stronger bond.

  - id: why-hi-weaker
    format: mcq
    difficulty: 2
    objectives: ["3.4.3"]
    prompt: |
      Why is the H–I bond (299 kJ mol⁻¹) weaker than the H–Cl bond (431 kJ mol⁻¹)?
    options:
      - text: Iodine is more electronegative than chlorine
        why: |
          It's less electronegative. And the explanation needed here is about size and distance.
      - text: The I atom is larger, so the bond is longer and the shared pair is less strongly attracted
        correct: true
        why: |
          A longer bond puts the shared pair further from the I nucleus (with more shielding), so the attraction is weaker.
      - text: HI molecules have stronger intermolecular forces than HCl molecules
        why: |
          Intermolecular forces act between molecules; bond energy is about the bond inside the molecule.
      - text: The H–I bond is a double bond
        why: |
          H can only form one bond. Both are single bonds.
    explanation: |
      Larger atom → longer bond → shared pair further from the nucleus → weaker attraction → lower bond energy.

  - id: why-ff-weak
    format: mcq
    difficulty: 3
    objectives: ["3.4.3"]
    prompt: |
      The F–F bond (0.142 nm, 158 kJ mol⁻¹) is **shorter** than the Cl–Cl bond (0.199 nm, 242 kJ mol⁻¹) but **weaker**. Which is the best explanation?
    options:
      - text: Fluorine is less electronegative than chlorine, so it attracts the shared pair less
        why: |
          Fluorine is the **most** electronegative element, so this is false.
      - text: The F atoms are so small that the lone pairs on the two atoms are very close and repel strongly
        correct: true
        why: |
          In the short F–F bond, the six lone pairs are crowded close together. Their repulsion weakens the bond.
      - text: The F–F bond is a π bond, which is weaker than a σ bond
        why: |
          F–F is a single bond, so it is a σ bond.
      - text: F₂ molecules have weaker intermolecular forces than Cl₂ molecules
        why: |
          That's true, but intermolecular forces don't affect the bond **inside** the molecule.
    explanation: |
      Normally shorter means stronger, but F–F is the exception: lone-pair repulsion between two very small atoms outweighs the short bond length.
