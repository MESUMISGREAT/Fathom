id: covalent-bonding-bond-energy-and-length
subject: "9701"
topic: "3.4"
title: "Bond energy and bond length"
summary: Bond energy is the energy to break one mole of a covalent bond in the gaseous state; bond length is the internuclear distance. Shorter bonds are usually stronger.
order: 7
minutes: 5
objectives: ["3.4.3"]
prerequisites: [covalent-bonding-double-and-triple-bonds]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 3, part (a), with the trends needed for
    part (b)). Bond energies are Cambridge 9701 Data Booklet values; bond lengths (nm) are
    typical literature values used for illustration. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define bond energy and bond length, and explain why shorter bonds are usually stronger.

  - type: explain
    title: How strong is a bond?
    body: |
      Chemists measure a bond's strength by what it costs to break it. Break a mole of H–H bonds and you have to put in **436 kJ**:

      $$\text{H}_2\text{(g)} \rightarrow 2\text{H(g)} \qquad \Delta H = +436\ \text{kJ mol}^{-1}$$

      Breaking bonds always **takes in** energy, so bond energies are always **positive**.

  - type: definition
    term: Bond energy
    body: |
      The energy required to break **one mole** of a particular covalent bond in the **gaseous state**.

  - type: explain
    title: Why "gaseous"?
    body: |
      In a liquid or solid you'd also have to pull the molecules apart from each other. That extra energy isn't part of the bond.

      In the gas, molecules are already separate, so the energy measured is **just the bond**.

  - type: definition
    term: Bond length
    body: |
      The **internuclear distance** of two covalently bonded atoms: the distance between their two nuclei.

  - type: explain
    title: Exact and average values
    body: |
      - For a diatomic molecule like $\text{H}_2$ or $\text{HCl}$, the bond energy is **exact**: there's only one bond to break.
      - A C–H bond in methane is slightly different from one in ethane. The Data Booklet value (C–H, 410 kJ mol⁻¹) is an **average** over many compounds.

  - type: check
    title: Quick check
    questions: [define-bond-energy, define-bond-length]

  - type: explain
    title: "Trend 1: more shared pairs, shorter and stronger"
    body: |
      | bond | shared pairs | length / nm | bond energy / kJ mol⁻¹ |
      | --- | --- | --- | --- |
      | C–C | 1 | 0.154 | 350 |
      | C=C | 2 | 0.134 | 610 |
      | C≡C | 3 | 0.120 | 840 |

      More electrons between the nuclei pull them **closer** and hold them **tighter**.

  - type: explain
    title: "Trend 2: bigger atoms, longer and weaker"
    body: |
      | bond | length / nm | bond energy / kJ mol⁻¹ |
      | --- | --- | --- |
      | H–F | 0.092 | 562 |
      | H–Cl | 0.127 | 431 |
      | H–Br | 0.141 | 366 |
      | H–I | 0.161 | 299 |

      Down Group 17 the halogen atom gets bigger. The shared pair is **further from the halogen's nucleus** (and more shielded), so it is attracted less strongly: the bond is longer and weaker.

  - type: diagram
    diagram: chem-covalent-bonding-energy-vs-length
    alt: "Graph of bond energy in kJ per mole (0 to 900) against bond length in nm (0.08 to 0.28). Carbon–carbon bonds: C≡C at 0.120 nm and 840, C=C at 0.134 nm and 610, C–C at 0.154 nm and 350, joined by a steep line falling to the right. Hydrogen–halogen bonds: H–F at 0.092 nm and 562, H–Cl at 0.127 and 431, H–Br at 0.141 and 366, H–I at 0.161 and 299, falling to the right. Halogen–halogen bonds, dashed: F–F at 0.142 nm and 158, labelled unusually weak, then Cl–Cl at 0.199 and 242, Br–Br at 0.228 and 193, I–I at 0.267 and 151."
    caption: |
      Within each family, longer means weaker. F–F is the famous rebel.

  - type: deeper
    title: Why F–F breaks the trend
    body: |
      F–F (158 kJ mol⁻¹) is weaker than Cl–Cl (242 kJ mol⁻¹) even though it's shorter.

      Fluorine atoms are so small that, in the short F–F bond, the **lone pairs** on the two atoms are very close together and repel each other strongly. That repulsion weakens the bond.

  - type: example
    title: Using bond energies
    problem: |
      Using Data Booklet values (C–C 350 kJ mol⁻¹, C–H 410 kJ mol⁻¹), how much energy is needed to break **all** the bonds in 1 mol of ethane gas, $\text{C}_2\text{H}_6\text{(g)}$?
    steps:
      - |
        Count the bonds in one molecule: **1** C–C and **6** C–H.
      - |
        Energy for 1 mol: $1 \times 350 + 6 \times 410$
      - |
        $= 350 + 2460 = 2810\ \text{kJ}$
    answer: |
      $2810\ \text{kJ}$ (an estimate, because 410 is an average C–H value).

  - type: check
    title: Use the numbers
    questions: [nitrogen-half-mole, propane-check, shortest-carbon-bond]

  - type: misconceptions
    items:
      - wrong: "Bond energy is the energy released when a bond breaks."
        right: "Breaking a bond **takes in** energy. Energy is released when bonds **form**."
      - wrong: "Bond energy is the energy to break one bond."
        right: "It's per **mole** of bonds, in kJ mol⁻¹."
      - wrong: "Bond length is the distance between the outer edges of the two atoms."
        right: "It's the distance between the two **nuclei**."
      - wrong: "Longer bonds are stronger because there's more bond."
        right: "Usually the opposite: in a longer bond the shared pair is further from the nuclei, so the attraction is weaker."

  - type: exam
    body: |
      - Bond energy definition must-haves: **one mole**, **covalent bond**, **gaseous** state, energy **required** (to break).
      - Bond length: say "internuclear distance" or "distance between the nuclei".
      - To explain a trend, link size → distance → attraction: "I is larger than Cl, so the H–I bond is longer, the shared pair is further from the I nucleus, the attraction is weaker, so the bond energy is lower."

  - type: takeaways
    items:
      - "Bond energy: energy required to break one mole of a particular covalent bond in the gaseous state (always positive)."
      - "Bond length: the internuclear distance of two covalently bonded atoms."
      - "More shared pairs between the same atoms: shorter, stronger (C–C < C=C < C≡C)."
      - "Bigger atoms: longer, weaker bonds (H–F > H–Cl > H–Br > H–I). F–F is unusually weak."

  - type: check
    title: Explain the trend
    questions: [why-hi-weaker, why-ff-weak]

