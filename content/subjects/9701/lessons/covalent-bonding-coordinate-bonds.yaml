id: covalent-bonding-coordinate-bonds
subject: "9701"
topic: "3.4"
title: "Coordinate (dative) bonds: one atom brings both electrons"
summary: In a coordinate bond both shared electrons come from one atom, as in the ammonium ion formed from NH₃ and HCl, and in the Al₂Cl₆ molecule.
order: 4
minutes: 5
objectives: ["3.4.1"]
prerequisites: [covalent-bonding-shared-pairs]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 1, part (c): coordinate bonding in NH₄⁺
    from NH₃ and HCl gases, and in Al₂Cl₆). All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe a coordinate (dative covalent) bond and explain how one forms in the ammonium ion, $\text{NH}_4^{+}$, and in $\text{Al}_2\text{Cl}_6$.

  - type: explain
    title: Bring your own pair
    body: |
      In an ordinary covalent bond, each atom chips in **one** electron to the shared pair.

      In a **coordinate bond**, one atom brings **both**. The other atom just provides an empty space for them.

  - type: definition
    term: Coordinate (dative covalent) bond
    body: |
      A covalent bond in which **both electrons of the shared pair come from the same atom**.

  - type: explain
    title: Two things are needed
    body: |
      - A **donor**: an atom with a **lone pair** to offer (N in $\text{NH}_3$, O in $\text{H}_2\text{O}$, Cl in $\text{AlCl}_3$).
      - An **acceptor**: an atom with an **empty orbital** that can take the pair ($\text{H}^{+}$, or an electron-deficient atom like Al in $\text{AlCl}_3$).

      We draw a coordinate bond as an **arrow** pointing from the donor to the acceptor: $\text{N}\rightarrow\text{H}$.

  - type: check
    title: Quick check
    questions: [define-coordinate]

  - type: explain
    title: "Example 1: ammonia meets hydrogen chloride"
    body: |
      Open bottles of ammonia solution and concentrated hydrochloric acid side by side and a white smoke appears where the gases meet:

      $$\text{NH}_3\text{(g)} + \text{HCl(g)} \rightarrow \text{NH}_4\text{Cl(s)}$$

      1. The H–Cl bond breaks so that Cl keeps **both** bonding electrons: this gives $\text{Cl}^{-}$ and a bare $\text{H}^{+}$ with an **empty 1s orbital**.
      2. The **lone pair** on N in $\text{NH}_3$ forms a coordinate bond to $\text{H}^{+}$, giving $\text{NH}_4^{+}$.
      3. $\text{NH}_4^{+}$ and $\text{Cl}^{-}$ attract as ions in solid $\text{NH}_4\text{Cl}$.

  - type: diagram
    diagram: chem-covalent-bonding-ammonium-ion
    alt: "Top row, dot-and-cross with outer shells: NH3 (nitrogen with three hydrogens and a lone pair of two crosses on top) plus H+ (an empty dashed circle, no electrons) gives NH4+ in square brackets with a plus charge; in NH4+ the pair shared with the top hydrogen is two crosses, both from nitrogen, and is ringed. Bottom row, displayed formulae: NH3 with a lone pair on N, plus H+, gives [NH4]+ where the bond to the top H is drawn as an arrow from N to H. Above both rows is the equation NH3(g) + HCl(g) → NH4Cl(s), with a note that HCl gives up H+ while its Cl keeps both bonding electrons as Cl−."
    caption: |
      Look at the ringed pair: two crosses, both from nitrogen. That's what makes it a coordinate bond.

  - type: explain
    title: Once it's formed, nobody can tell
    body: |
      In $\text{NH}_4^{+}$ all **four N–H bonds are identical**: same length, same strength. The arrow only records where the electrons came from.

      The ion is **tetrahedral** (bond angle 109.5°), just like $\text{CH}_4$.

  - type: check
    title: The ammonium ion
    questions: [ammonium-formation, oxonium-lone-pairs]

  - type: explain
    title: "Example 2: aluminium chloride, Al₂Cl₆"
    body: |
      Al has 3 outer electrons, so in $\text{AlCl}_3$ it makes 3 bonds and has only **6 electrons** around it. It is **electron deficient**, with an empty orbital.

      Meanwhile every Cl atom has **lone pairs**. So two $\text{AlCl}_3$ molecules pair up:
      - a Cl atom on each molecule donates a lone pair to the Al of the other molecule;
      - that makes **two coordinate bonds**, and the dimer $\text{Al}_2\text{Cl}_6$;
      - each Al now has **8** electrons around it.

  - type: diagram
    diagram: chem-covalent-bonding-aluminium-chloride-dimer
    alt: "Left: two AlCl3 molecules, each a central Al bonded to three Cl, labelled 6 electrons around each Al (electron deficient). An arrow leads to the right: the Al2Cl6 dimer. Two Al atoms are bridged by two Cl atoms, one above and one below. Each bridging Cl has an ordinary bond to one Al and a dative bond, drawn as an arrow from Cl to Al, to the other Al; a lone pair is shown on each bridging Cl. Each Al also has two terminal Cl atoms. A key labels the line as an ordinary covalent bond and the arrow as a dative bond, Cl lone pair donated to Al. Note: now 8 electrons around each Al."
    caption: |
      The two bridging Cl atoms each make one ordinary bond and one dative bond.

  - type: deeper
    title: When does it dimerise?
    body: |
      Aluminium chloride vapour at temperatures not far above where the solid sublimes is mostly $\text{Al}_2\text{Cl}_6$ molecules. At much higher temperatures the dimers split back into $\text{AlCl}_3$ molecules.

      Around each Al in the dimer there are 4 bonding pairs, so the arrangement around each Al is roughly tetrahedral.

  - type: check
    title: The dimer
    questions: [dimer-counts, dimer-error, donor-acceptor]

  - type: misconceptions
    items:
      - wrong: "A coordinate bond is weaker, or different, from a normal covalent bond once it has formed."
        right: "It's still a shared pair attracted to two nuclei. In $\\text{NH}_4^{+}$ all four N–H bonds are identical."
      - wrong: "In $\\text{NH}_4^{+}$ the $\\text{H}^{+}$ donates a pair of electrons to N."
        right: "$\\text{H}^{+}$ has **no** electrons. N donates its lone pair to the empty orbital on $\\text{H}^{+}$."
      - wrong: "In $\\text{Al}_2\\text{Cl}_6$ the Al atoms donate electrons to Cl."
        right: "Al is the electron-poor **acceptor**. The **Cl** lone pairs are donated to Al."

  - type: exam
    body: |
      - Definition: "a covalent bond in which **both electrons** of the shared pair come from the **same atom**".
      - Draw the dative bond as an **arrow from the donor** (the atom with the lone pair) **to the acceptor**.
      - In a dot-and-cross diagram of $\text{NH}_4^{+}$, the dative pair is two of N's symbols (e.g. two crosses); put the whole ion in square brackets with the charge outside.
      - In $\text{Al}_2\text{Cl}_6$, draw **two** dative bonds, both from bridging Cl atoms to Al.

  - type: takeaways
    items:
      - "Coordinate (dative) bond: both electrons of the shared pair come from the same atom."
      - "Needs a donor with a lone pair and an acceptor with an empty orbital."
      - "NH₃ + H⁺ → NH₄⁺: N's lone pair bonds to H⁺; all four N–H bonds are then identical."
      - "Al₂Cl₆: two Cl→Al dative bonds; each Al goes from 6 to 8 electrons."

questions:
  - id: define-coordinate
    format: text
    style: definition
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      What is a **coordinate** (dative covalent) bond?
    accept:
      - "a covalent bond in which both electrons of the shared pair come from the same atom"
      - "covalent bond in which both electrons of the shared pair come from the same atom"
      - "a covalent bond where both electrons of the shared pair come from the same atom"
      - "a covalent bond in which both electrons in the shared pair come from the same atom"
      - "a covalent bond in which both electrons of the shared pair come from one atom"
      - "a covalent bond in which both shared electrons come from the same atom"
      - "a covalent bond in which both electrons come from the same atom"
      - "a covalent bond where both electrons come from the same atom"
      - "a covalent bond in which both electrons come from one atom"
      - "a covalent bond in which both electrons in the bond come from the same atom"
      - "a covalent bond in which one atom provides both electrons of the shared pair"
      - "a covalent bond in which one atom supplies both electrons"
      - "a covalent bond in which one atom provides both electrons"
      - "a shared pair of electrons in which both electrons come from the same atom"
    model: |
      A covalent bond in which both electrons of the shared pair come from the same atom.
    explanation: |
      The key idea: it is still a shared pair (a covalent bond), but one atom supplied both electrons.

  - id: ammonium-formation
    format: mcq
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      Which statement about the formation of $\text{NH}_4^{+}$ from $\text{NH}_3$ and $\text{H}^{+}$ is correct?
    options:
      - text: |
          $\text{H}^{+}$ donates a pair of electrons to the nitrogen atom.
        why: |
          $\text{H}^{+}$ is a bare proton with no electrons to give. It's the acceptor.
      - text: |
          N and $\text{H}^{+}$ each provide one electron for the new bond.
        why: |
          That describes an ordinary covalent bond. $\text{H}^{+}$ has no electron to provide.
      - text: |
          The lone pair on N is donated to the empty orbital of $\text{H}^{+}$.
        correct: true
        why: |
          N is the donor and $\text{H}^{+}$ the acceptor: a coordinate bond.
      - text: |
          The new N–H bond is longer and weaker than the other three.
        why: |
          Once formed, all four N–H bonds in $\text{NH}_4^{+}$ are identical.
    explanation: |
      $\text{NH}_3$ has a lone pair; $\text{H}^{+}$ has an empty 1s orbital. The lone pair becomes the shared pair of a coordinate bond.

  - id: oxonium-lone-pairs
    format: numeric
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      A water molecule, $\text{H}_2\text{O}$, forms a coordinate bond to $\text{H}^{+}$, making $\text{H}_3\text{O}^{+}$. How many **lone pairs** are left on the oxygen atom in $\text{H}_3\text{O}^{+}$?
    fields:
      - answer: 1
        unit: lone pair(s)
    explanation: |
      O in water has 2 lone pairs. One of them becomes the shared pair of the new O→H coordinate bond, so 1 lone pair is left.

  - id: dimer-counts
    format: numeric
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      In one $\text{Al}_2\text{Cl}_6$ molecule, how many **coordinate bonds** are there, and how many electrons are around **each** aluminium atom?
    fields:
      - label: "coordinate bonds ="
        answer: 2
      - label: "electrons around each Al ="
        answer: 8
    explanation: |
      Each $\text{AlCl}_3$ unit accepts one lone pair from a Cl of the other unit: 2 coordinate bonds. Each Al goes from 6 electrons (3 bonds) to 8 (4 bonds).

  - id: dimer-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      A student explains how $\text{Al}_2\text{Cl}_6$ forms. Which line contains the first error?
    lines:
      - "Al has 3 outer electrons, so in $\\text{AlCl}_3$ it forms three Al–Cl bonds."
      - "This leaves Al with only 6 electrons in its outer shell."
      - "A Cl atom in a second $\\text{AlCl}_3$ molecule has lone pairs."
      - "The Al atom donates a pair of electrons to this Cl atom, forming a dative bond."
      - "Two such bonds form, joining the molecules into $\\text{Al}_2\\text{Cl}_6$."
    errorLine: 4
    fix: |
      The Cl atom donates one of its lone pairs to the electron-deficient Al atom.
    explanation: |
      Al is the acceptor: it has an empty orbital and no spare pair. The donor is the Cl atom with lone pairs.

  - id: donor-acceptor
    format: mcq
    difficulty: 3
    objectives: ["3.4.1"]
    prompt: |
      Which pair of molecules could form a coordinate bond with each other?
    options:
      - text: |
          $\text{CH}_4$ and $\text{BF}_3$
        why: |
          $\text{BF}_3$ is a good acceptor (B has only 6 electrons), but $\text{CH}_4$ has no lone pair to donate.
      - text: |
          $\text{NH}_3$ and $\text{BF}_3$
        correct: true
        why: |
          N has a lone pair (donor) and B has only 6 electrons around it, so it has an empty orbital (acceptor). They form $\text{H}_3\text{N}{\rightarrow}\text{BF}_3$.
      - text: |
          $\text{NH}_3$ and $\text{CH}_4$
        why: |
          $\text{NH}_3$ can donate, but C in $\text{CH}_4$ already has a full octet and no empty orbital.
      - text: |
          $\text{CH}_4$ and $\text{CH}_4$
        why: |
          No lone pairs and no empty orbitals: nothing to donate and nowhere to put it.
    explanation: |
      You need a donor (lone pair) and an acceptor (empty orbital). $\text{NH}_3$ + $\text{BF}_3$ is the classic pairing, just like $\text{NH}_3$ + $\text{H}^{+}$.
