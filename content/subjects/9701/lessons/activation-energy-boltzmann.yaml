    Re-checked line by line on 2026-10-29: every statement, worked example and numerical answer was re-derived in a separate adversarial pass by the same AI model. No separate reviewer model and no teacher have reviewed it.

blocks:
  - type: objective
    body: |
      By the end you can define **activation energy**, sketch the **Boltzmann distribution**, and use it to explain why only a fraction of collisions lead to reaction.

  - type: definition
    term: Activation energy (Eₐ)
    body: |
      The **minimum energy** that colliding particles must have for the collision to be **effective**, so that a reaction occurs.

  - type: explain
    title: Most molecules are not energetic enough
    body: |
      Molecules in a gas or liquid do not all move with the same speed. They have a spread of kinetic energies, and the distribution changes constantly as they collide.

      At any moment, many molecules are moving slowly, some are moving quickly, and a very small number are moving extremely quickly.

      For a collision to be effective, the particles must arrive with at least the activation energy. Only the fastest-moving molecules in the mixture can manage that. Most collisions fail because the particles simply do not have enough energy.

      That is why reaction rates are often much slower than collision frequencies would suggest. Particles collide billions of times per second, but only a tiny fraction of those collisions has enough energy to break the bonds that need to break.

  - type: diagram
    diagram: chem-rate-reaction-boltzmann
    alt: A Boltzmann distribution curve of number of molecules against kinetic energy. The curve rises from near zero to a peak at low energy and has a long tail to high energies. The activation energy is marked on the energy axis, and the area under the curve to the right of it is shaded and labelled as the molecules with enough energy to react.
    caption: |
      The Boltzmann distribution. Only the shaded tail, beyond $E_a$, represents molecules with enough energy for an effective collision.

  - type: explain
    title: Reading the Boltzmann curve
    body: |
      The curve has three features to remember.

      1. It starts near the origin: very few molecules have near-zero kinetic energy.
      2. It peaks at a fairly low energy: most molecules have a modest amount of kinetic energy.
      3. It has a long tail to the right: a small number have very high energies.

      The **area under the whole curve** represents the total number of molecules.

      The **area under the curve to the right of $E_a$** represents the number of molecules with energy at least $E_a$. Divide by the total area and you have the **fraction** of molecules that can react on collision.

      A small change in $E_a$ can change that fraction a lot, because the tail is steep.

  - type: explain
    title: Activation energy is not the same as enthalpy change
    body: |
      The activation energy is an energy **barrier** on the way from reactants to products. The enthalpy change of reaction, $\Delta H$, is the difference in energy between the reactants and the products.

      A reaction can have a large activation energy and still be exothermic overall: the particles must climb a high hill before they can roll down the other side. The height of the hill and the net drop are separate quantities.

      A **catalyst** provides an alternative route with a **lower activation energy**. More molecules then have enough energy to take that route, so the rate increases. The catalyst does not change the enthalpy change or the position of equilibrium.

  - type: misconceptions
    items:
      - wrong: Activation energy is the energy released when the reaction happens.
        right: |
          That is the enthalpy change (or the energy released per mole). Activation energy is the **minimum energy needed to start** the reaction, not the energy given out.
      - wrong: All molecules have the same kinetic energy at a given temperature.
        right: |
          They have a **distribution** of energies. The Boltzmann curve shows how many have each energy; only a small fraction exceed $E_a$.
      - wrong: The peak of the Boltzmann curve is at the activation energy.
        right: |
          The peak is at a low energy, where most molecules sit. $E_a$ is usually far to the right, in the tail.
      - wrong: The area under the curve beyond $E_a$ is the total energy of the molecules.
        right: |
          The area represents the **number** (or fraction) of molecules with energy at least $E_a$. The axes are number of molecules against energy, not energy against energy.

  - type: exam
    body: |
      - The definition of activation energy must include **minimum energy** and **effective collision**. "Energy needed to react" is too vague.
      - When sketching the Boltzmann curve, label both axes, start the curve near the origin, show a single peak and a long tail, and mark $E_a$ on the energy axis.
      - Shade the area beyond $E_a$ and say what it represents: the molecules with enough energy to react.
      - Do not draw the curve touching the energy axis at high energy; the tail approaches it but does not meet it.
      - For a catalyst, show a **lower $E_a$** on the same axes and a larger shaded area. Do not shift the whole curve.

  - type: takeaways
    items:
      - Activation energy is the minimum energy for an effective collision.
      - Molecules have a distribution of kinetic energies.
      - The Boltzmann curve plots number of molecules against kinetic energy.
      - The area beyond Ea is the number of molecules that can react.
      - A catalyst lowers Ea, increasing the fraction of molecules that can react.

  - type: check
    title: Definitions
    questions: [activation-energy-definition, boltzmann-axes, peak-location]

  - type: check
    title: Using the curve
    questions: [area-meaning, ea-not-enthalpy, catalyst-effect, tail-shape]

questions:
  - id: activation-energy-definition
    format: mcq
    difficulty: 1
    objectives: ["8.2.1"]
    prompt: |
      What is meant by the **activation energy** of a reaction?
    options:
      - text: The minimum energy colliding particles need for the collision to be effective
        correct: true
        why: |
          It is an energy barrier: below it, the collision does not lead to reaction.
      - text: The energy released when one mole of product forms
        why: |
          That is related to the enthalpy change of reaction, not the barrier that must be overcome.
      - text: The average kinetic energy of the particles
        why: |
          The average kinetic energy depends on temperature. Activation energy is a property of the reaction.
      - text: The energy needed to melt the reactants
        why: |
          Changes of state are unrelated to the activation energy of a chemical reaction.
    explanation: |
      Activation energy is the minimum collision energy for a reaction to occur.

  - id: boltzmann-axes
    format: mcq
    difficulty: 1
    objectives: ["8.2.2"]
    prompt: |
      What is plotted on the axes of a Boltzmann distribution?
    options:
      - text: Number of molecules against kinetic energy
        correct: true
        why: |
          The curve shows how many molecules have each kinetic energy at a given temperature.
      - text: Rate of reaction against temperature
        why: |
          That is an Arrhenius-style plot, not the Boltzmann distribution.
      - text: Concentration against time
        why: |
          That is a rate curve used to measure reaction rate.
      - text: Enthalpy against reaction progress
        why: |
          That is an energy profile for the reaction pathway.
    explanation: |
      The Boltzmann distribution plots the number (or fraction) of molecules with each kinetic energy.

  - id: peak-location
    format: mcq
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      On a Boltzmann distribution, where is the peak of the curve compared with the activation energy?
    options:
      - text: At a much lower energy than the activation energy
        correct: true
        why: |
          Most molecules have modest energies, so the peak is low on the energy axis; Ea lies far out in the tail.
      - text: Exactly at the activation energy
        why: |
          If the peak were at Ea, about half the molecules would have enough energy, and reactions would be far faster than they are.
      - text: At a much higher energy than the activation energy
        why: |
          That would mean most molecules are above Ea, which contradicts the small fraction that actually react.
      - text: The curve has no peak
        why: |
          The Boltzmann curve rises to a maximum and then falls away slowly; it has one peak.
    explanation: |
      The peak is at low energy, and Ea is in the high-energy tail, so only a small fraction exceeds it.

  - id: area-meaning
    format: text
    difficulty: 2
    objectives: ["8.2.2"]
    style: short
    prompt: |
      On a Boltzmann distribution, what does the area under the curve to the right of the activation energy represent?
    accept:
      - the number of molecules with energy greater than or equal to the activation energy
      - the number of molecules with enough energy to react
      - the fraction of molecules with enough energy to react
      - the number of molecules with energy at least the activation energy
    model: |
      The number (or fraction) of molecules that have at least the activation energy, and so can react on collision.
    explanation: |
      The whole area represents all the molecules; the tail beyond Ea represents those with enough energy.

  - id: ea-not-enthalpy
    format: mcq
    difficulty: 2
    objectives: ["8.2.1"]
    prompt: |
      A reaction is exothermic overall but has a high activation energy. What does this mean?
    options:
      - text: Reactants must gain a lot of energy to react, but the products end up at lower energy than the reactants
        correct: true
        why: |
          The activation energy is the barrier to climb; the products being lower gives out energy overall.
      - text: The reaction cannot be exothermic if the activation energy is high
        why: |
          The barrier height and the overall energy change are independent.
      - text: The products have higher energy than the reactants
        why: |
          That would make the reaction endothermic. Exothermic means the products are lower in energy.
      - text: No catalyst can affect this reaction
        why: |
          A catalyst can lower the activation energy whether the reaction is exothermic or endothermic.
    explanation: |
      Activation energy is the barrier; the enthalpy change is the difference between start and finish.

  - id: catalyst-effect
    format: mcq
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      A catalyst is added to a reaction. How does the Boltzmann distribution diagram show the effect?
    options:
      - text: The activation energy is marked at a lower energy, so a larger area of the curve lies beyond it
        correct: true
        why: |
          The curve itself is unchanged at a given temperature; the catalyst lowers the barrier, so more molecules exceed it.
      - text: The whole curve shifts to higher energies
        why: |
          Shifting the curve to higher energies is what raising the temperature does. A catalyst lowers Ea instead.
      - text: The peak of the curve becomes higher
        why: |
          Adding a catalyst does not change the distribution of molecular energies at a fixed temperature.
      - text: The area under the whole curve increases
        why: |
          The total number of molecules is unchanged, so the total area stays the same.
    explanation: |
      A catalyst lowers Ea, so the same distribution has a larger fraction beyond the barrier.

  - id: tail-shape
    format: spot-error
    difficulty: 2
    objectives: ["8.2.2"]
    prompt: |
      A student describes a Boltzmann distribution. Which line contains the first error?
    lines:
      - "The curve starts near the origin because very few molecules have almost no kinetic energy."
      - "It rises to a peak at a fairly low energy, where most molecules are found."
      - "It then falls and meets the energy axis at high energy."
      - "The area beyond the activation energy represents molecules with enough energy to react."
      - "The total area under the curve represents all the molecules."
    errorLine: 3
    fix: |
      The tail approaches the energy axis but does **not** meet it. There is always a small, non-zero number of molecules with very high energy.
    explanation: |
      The high-energy tail is asymptotic: it gets closer and closer to zero without reaching it. That small tail is exactly what makes reaction possible.
