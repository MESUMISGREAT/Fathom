id: activation-energy-boltzmann
subject: "9701"
topic: "8.2"
title: Activation energy and the Boltzmann distribution
summary: Why only a small fraction of molecules can react, and how the Boltzmann curve shows that fraction.
order: 1
minutes: 6
kind: core
objectives: ["8.2.1", "8.2.2"]
prerequisites: [rate-reaction-collision-theory]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Chemistry 9701 syllabus, topic 8.2
    Effect of temperature on reaction rates and the concept of activation energy, learning
    outcomes 8.2.1 (definition of activation energy) and 8.2.2 (sketching and using the
    Boltzmann distribution). All questions are original; the curve is drawn as a schematic, not
