id: chemical-equilibria-kc-expressions
subject: "9701"
topic: "7.1"
title: "Writing $K_c$ expressions"
summary: The equilibrium constant packages the whole equilibrium mixture into one number. Build it from the balanced equation — products on top, each raised to its coefficient.
order: 4
minutes: 10
kind: core
objectives: ["7.1.4"]
prerequisites: [chemical-equilibria-reversible-dynamic]
