blocks:
  - type: objective
    body: |-
      By the end you can write a $K_c$ expression from any balanced equation, explain why each concentration is raised to its coefficient, and decide whether a large or small $K_c$ means products or reactants dominate.

  - type: explain
    title: One number for the whole mixture
    body: |-
      At a given temperature, an equilibrium mixture always settles at the same ratio of concentrations, whatever amounts you started with.

      That ratio is the **equilibrium constant**, $K_c$. It turns "the position of equilibrium" into a number you can calculate with.

  - type: definition
    term: Equilibrium constant, $K_c$
    body: |-
      For the general equilibrium

      $$a\text{A} + b\text{B} \rightleftharpoons c\text{C} + d\text{D}$$

      the equilibrium constant in terms of concentrations is

      $$K_c = \frac{[\text{C}]^c\,[\text{D}]^d}{[\text{A}]^a\,[\text{B}]^b}$$

      The square brackets mean **equilibrium concentration in $\text{mol dm}^{-3}$** — not the starting concentration.

  - type: explain
    title: Where the powers come from
    body: |-
      Each concentration is raised to the **coefficient** of that substance in the balanced equation. That is not a convention: it comes from the way the rates depend on concentrations.

      For the forward reaction the rate is proportional to $[\text{A}]^a[\text{B}]^b$; for the reverse it is proportional to $[\text{C}]^c[\text{D}]^d$.

      At equilibrium the two rates are equal, so

      $$k_{\text{forward}}[\text{A}]^a[\text{B}]^b = k_{\text{reverse}}[\text{C}]^c[\text{D}]^d$$

      Rearranging gives the ratio above, with $K_c = k_{\text{forward}}/k_{\text{reverse}}$. The expression is a statement about rates, which is why it always matches the equation.

  - type: example
    title: "Worked example: an esterification"
    problem: |-
      Ethanoic acid reacts with ethanol:

      $$\text{CH}_3\text{COOH}(aq) + \text{C}_2\text{H}_5\text{OH}(aq) \rightleftharpoons \text{CH}_3\text{COOC}_2\text{H}_5(aq) + \text{H}_2\text{O}(l)$$

      Write the $K_c$ expression.
    steps:
      - |-
        Products go on the top: $[\text{CH}_3\text{COOC}_2\text{H}_5]$ and $[\text{H}_2\text{O}]$.
      - |-
        Reactants go on the bottom: $[\text{CH}_3\text{COOH}]$ and $[\text{C}_2\text{H}_5\text{OH}]$.
      - |-
        Every coefficient is 1, so no powers appear — except that water is a **liquid** here.
      - |-
        Water as a pure liquid has a constant concentration, so it is left out. That leaves

        $$K_c = \frac{[\text{CH}_3\text{COOC}_2\text{H}_5]}{[\text{CH}_3\text{COOH}]\,[\text{C}_2\text{H}_5\text{OH}]}$$
    answer: |-
      $K_c = \dfrac{[\text{CH}_3\text{COOC}_2\text{H}_5]}{[\text{CH}_3\text{COOH}]\,[\text{C}_2\text{H}_5\text{OH}]}$, with water omitted because it is a pure liquid.

  - type: explain
    title: Leaving out solids and pure liquids
    body: |-
      The "concentration" of a pure solid or a pure liquid cannot change: its particles are packed together in the same way however much is present.

      So it is a constant, and constants are absorbed into $K_c$ rather than written out.

      A useful check: write the expression, then **cross out** any substance marked $(s)$ or $(l)$ — but keep anything marked $(aq)$ or $(g)$.

  - type: example
    title: "Worked example: a heterogeneous equilibrium"
    problem: |-
      Calcium carbonate decomposes in a closed vessel:

      $$\text{CaCO}_3(s) \rightleftharpoons \text{CaO}(s) + \text{CO}_2(g)$$

      Write the $K_c$ expression, and explain what it tells you about the amount of carbon dioxide at equilibrium.
    steps:
      - |-
        Both $\text{CaCO}_3$ and $\text{CaO}$ are solids, so both are omitted.
      - |-
        That leaves only the gas:

        $$K_c = [\text{CO}_2]$$
      - |-
        So at a fixed temperature, the concentration of carbon dioxide at equilibrium is **fixed** — it does not depend on how much solid is present.
      - |-
        Adding more calcium carbonate does not change $[\text{CO}_2]$; it simply leaves some solid unused.
    answer: |-
      $K_c = [\text{CO}_2]$. The equilibrium concentration of carbon dioxide is set by the temperature alone, not by the amount of solid.

  - type: explain
    title: What the size of $K_c$ tells you
    body: |-
      Because products sit on the top, $K_c$ is a quick read on the position of equilibrium.

      - $K_c \gg 1$: products dominate — the equilibrium lies far to the **right**.
      - $K_c \ll 1$: reactants dominate — the equilibrium lies far to the **left**.
      - $K_c \approx 1$: substantial amounts of everything.

      $K_c$ is **unitless in practice** at this level: Cambridge usually quotes it without units, and you are not required to work them out for $K_c$.

  - type: intuition
    title: Why a bigger constant means more product
    body: |-
      The expression is a fraction. To make the fraction large you need a large numerator, which means plenty of product.

      The same mixture described by the same equation always gives the same $K_c$, which is what makes the constant useful: it is a fingerprint of the reaction at that temperature.

  - type: misconceptions
    items:
      - wrong: |-
          $K_c$ is calculated from the starting concentrations.
        right: |-
          Only **equilibrium** concentrations go into $K_c$. Using the starting values gives a meaningless number.
      - wrong: |-
          Every coefficient becomes a power, so water in $\text{H}_2\text{O}(l)$ appears squared.
        right: |-
          Powers come from coefficients, but pure liquids and solids are left out of the expression altogether.
      - wrong: |-
          $K_c$ for $2\text{NO}_2 \rightleftharpoons \text{N}_2\text{O}_4$ is $[\text{N}_2\text{O}_4]/2[\text{NO}_2]$.
        right: |-
          The coefficient 2 is a **power**: $[\text{N}_2\text{O}_4]/[\text{NO}_2]^2$. Multiplying by 2 is a common slip.
      - wrong: |-
          $K_c$ changes when you add more reactant.
        right: |-
          The mixture shifts to restore the same value of $K_c$; only temperature changes the constant.
      - wrong: |-
          Reversing the equation leaves $K_c$ unchanged.
        right: |-
          Reversing the equation inverts $K_c$: the new constant is $\dfrac{1}{K_c}$.

  - type: exam
    body: |-
      - Always check the equation is **balanced** before writing the expression; every coefficient becomes a power.
      - Write square brackets with the state in mind: omit $(s)$ and $(l)$.
      - If the question says "state the $K_c$ expression", no units and no numbers are needed.
      - For "what does the value tell you", say "the equilibrium lies to the right/left" rather than "the reaction is fast/slow".
      - If the equation is reversed in a later part, say $K_c$ becomes $\dfrac{1}{K_c}$.

  - type: check
    title: Checking the idea
    questions: [eq4-mcq-powers, eq4-cloze-heterogeneous, eq4-mcq-magnitude]

  - type: check
    title: End-of-lesson check
    questions: [eq4-spot-error, eq4-explain, eq4-mcq-reverse]

  - type: takeaways
    items:
      - $K_c = \dfrac{\text{products}}{\text{reactants}}$, each raised to its coefficient.
      - Only equilibrium concentrations are used.
      - Pure solids and pure liquids are omitted.
      - $K_c \gg 1$ means products dominate; $K_c \ll 1$ means reactants dominate.
      - $K_c$ depends only on temperature.

questions:
  - id: eq4-mcq-powers
    format: mcq
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      For the equilibrium

      $$2\text{SO}_2(g) + \text{O}_2(g) \rightleftharpoons 2\text{SO}_3(g)$$

      which is the correct expression for $K_c$?
    options:
      - text: $\dfrac{[\text{SO}_3]^2}{[\text{SO}_2]^2[\text{O}_2]}$
        correct: true
        why: |-
          Each concentration is raised to its coefficient, with products on top.
      - text: $\dfrac{[\text{SO}_3]}{[\text{SO}_2][\text{O}_2]}$
        why: |-
          This ignores the coefficients, which must appear as powers.
      - text: $\dfrac{2[\text{SO}_3]}{2[\text{SO}_2][\text{O}_2]}$
        why: |-
          Coefficients become powers, not multipliers.
      - text: $\dfrac{[\text{SO}_2]^2[\text{O}_2]}{[\text{SO}_3]^2}$
        why: |-
          This is upside down: products belong on the top.
    explanation: |-
      $K_c = \dfrac{[\text{SO}_3]^2}{[\text{SO}_2]^2[\text{O}_2]}$, because the coefficients 2, 1 and 2 become powers.

  - id: eq4-cloze-heterogeneous
    format: cloze
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      For the equilibrium $\text{C}(s) + \text{CO}_2(g) \rightleftharpoons 2\text{CO}(g)$, the concentration of carbon monoxide is raised to the power {{1}} in the $K_c$ expression, because the solid carbon is {{2}}. At a fixed temperature, adding more carbon {{3}} the value of $K_c$.
    blanks:
      - accept: ["2"]
      - accept: [omitted, left out, excluded, ignored, not included]
      - accept: [does not change, doesn't change, has no effect on, leaves unchanged, does not affect]
    explanation: |-
      Carbon is a pure solid, so it does not appear; powers come from coefficients, and adding a solid cannot alter the constant.

  - id: eq4-mcq-magnitude
    format: mcq
    difficulty: 2
    objectives: ["7.1.4"]
    prompt: |-
      At 700 K a reaction has $K_c = 1.8 \times 10^{-8}$. What does this tell you about the equilibrium mixture?
    options:
      - text: It contains far more reactants than products, so the equilibrium lies well to the left.
        correct: true
        why: |-
          A small constant means a small numerator, which is the product side.
      - text: It contains far more products than reactants, so the equilibrium lies well to the right.
        why: |-
          That would need $K_c \gg 1$; here $K_c$ is tiny.
      - text: The reaction is very slow.
        why: |-
          $K_c$ says nothing about rate; it describes the final position only.
      - text: The reaction is exothermic.
        why: |-
          The size of $K_c$ does not reveal the sign of $\Delta H$, only where the equilibrium lies.
    explanation: |-
      A very small $K_c$ means the denominator (reactants) dominates, so the equilibrium lies far to the left.

  - id: eq4-spot-error
    format: spot-error
    difficulty: 3
    objectives: ["7.1.4"]
    prompt: |-
      A student writes a $K_c$ expression for a reaction carried out in water. Which line contains the first error?
    lines:
      - The equation is $\text{CH}_3\text{COOH}(aq) + \text{C}_2\text{H}_5\text{OH}(aq) \rightleftharpoons \text{CH}_3\text{COOC}_2\text{H}_5(aq) + \text{H}_2\text{O}(l)$.
      - All four substances appear in the expression, since each has a concentration.
      - The products are placed on the top of the fraction.
      - So $K_c = \dfrac{[\text{CH}_3\text{COOC}_2\text{H}_5][\text{H}_2\text{O}]}{[\text{CH}_3\text{COOH}][\text{C}_2\text{H}_5\text{OH}]}$.
    errorLine: 2
    fix: |-
      Water is a **pure liquid**, so its concentration is constant and it is left out. The correct expression is $K_c = \dfrac{[\text{CH}_3\text{COOC}_2\text{H}_5]}{[\text{CH}_3\text{COOH}][\text{C}_2\text{H}_5\text{OH}]}$.
    explanation: |-
      Line 1 is correct, so line 2 is the first mistake; line 4 repeats the error but does not introduce a new one.

  - id: eq4-explain
    format: explain
    difficulty: 3
    objectives: ["7.1.4"]
    prompt: |-
      Explain why the concentrations in a $K_c$ expression are raised to powers equal to the coefficients in the balanced equation, and why a pure solid is omitted.
    model: |-
      The rate of the forward reaction is proportional to the product of the reactant concentrations, each raised to the power of its coefficient, because the reaction depends on the particles colliding in the ratio shown by the equation. The reverse rate is proportional in the same way to the product concentrations. At equilibrium the two rates are equal, so the ratio of the product-side expression to the reactant-side expression is a constant, and that ratio is $K_c$. The powers therefore come from the equation itself. A pure solid has a fixed concentration, because its particles are packed in the same way regardless of how much solid is present. Multiplying or dividing by a constant does not change the constancy of the ratio, so it is absorbed into $K_c$ and left out of the expression. Pure liquids are treated the same way for the same reason.
    keyPoints:
      - Forward and reverse rates depend on concentrations to the power of the coefficients.
      - At equilibrium the two rates are equal, giving a constant ratio.
      - A pure solid or liquid has a constant concentration.
      - A constant factor is absorbed into $K_c$, so it is omitted.
    explanation: |-
      The powers come from rate laws; the omissions come from concentrations that cannot change.

  - id: eq4-mcq-reverse
    format: mcq
    difficulty: 3
    objectives: ["7.1.4"]
    prompt: |-
      For $\text{N}_2(g) + 3\text{H}_2(g) \rightleftharpoons 2\text{NH}_3(g)$ the equilibrium constant is $K_c$. A question then writes the same reaction in reverse, $2\text{NH}_3(g) \rightleftharpoons \text{N}_2(g) + 3\text{H}_2(g)$. What is the equilibrium constant for the reversed equation at the same temperature?
    options:
      - text: $\dfrac{1}{K_c}$
        correct: true
        why: |-
          Reversing swaps numerator and denominator, which inverts the constant.
      - text: $K_c$
        why: |-
          The constant is unchanged only if the equation is unchanged; reversing must invert it.
      - text: $-K_c$
        why: |-
          A constant cannot become negative; it is a ratio of positive concentrations.
      - text: $K_c^2$
        why: |-
          Squaring would follow from doubling every coefficient, not from reversing the equation.
    explanation: |-
      Reversing the equation inverts $K_c$, so the reversed reaction has constant $\dfrac{1}{K_c}$.
