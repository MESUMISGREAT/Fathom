id: chemical-equilibria-quantities
subject: "9701"
topic: "7.1"
title: "Finding the quantities at equilibrium"
summary: Work backwards from the constant to the mixture. One unknown, one table, one substitution — and the arithmetic stays simple because the syllabus avoids quadratics.
order: 8
minutes: 10
kind: core
objectives: ["7.1.8"]
prerequisites: [chemical-equilibria-kc-kp-calculations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027, topic 7.1, learning outcome 7.1.8 (calculating the quantities present at
    equilibrium, given appropriate data), within the guidance that quadratic equations are not
