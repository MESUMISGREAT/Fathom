id: bronsted-lowry-titration-curves
subject: "9701"
topic: "7.2"
title: Titration curves — the shape of neutralisation
summary: "Sketching and interpreting pH titration curves for all four combinations of strong/weak acid/base. Equivalence point, half-equivalence, and buffer regions."
order: 8
minutes: 6
objectives: ["7.2.9"]
prerequisites: ["bronsted-lowry-salts"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 9; titration curves).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can sketch and interpret pH titration curves for strong acid–strong base, strong acid–weak base, weak acid–strong base, and weak acid–weak base titrations, identifying equivalence points, half-equivalence points, and buffer regions.

  - type: explain
    title: What is a titration curve?
    body: |
      A **titration curve** plots **pH (y-axis)** vs **volume of titrant added (x-axis)**.

      Key features to recognise:
      - **Initial pH** (before any titrant added)
      - **Buffer region** (flat-ish part where pH changes slowly)
      - **Half-equivalence point** (pH = pKa for weak acid titrations)
      - **Equivalence point** (steep vertical jump, stoichiometric point)
      - **Final pH** (after excess titrant)

  - type: explain
    title: The four combinations
    body: |
      | Titration | Initial pH | Equivalence pH | Vertical jump | Buffer region? |
      |-----------|------------|----------------|---------------|----------------|
      | Strong acid + Strong base | Low (~1) | **7** | Large (~3–10 pH units) | No |
      | Weak acid + Strong base | Medium (~3) | **>7** (basic) | Medium (~6–10) | **Yes** (pH = pKa ± 1) |
      | Strong acid + Weak base | Low (~1) | **<7** (acidic) | Medium (~3–7) | **Yes** (pH = pKa ± 1) |
      | Weak acid + Weak base | Medium | **Depends on Ka/Kb** | Small/none | Yes (two overlapping) |

  - type: diagram
    diagramKey: chem-bronsted-lowry-titration-curves
    alt: |
      Four titration curves on one graph: Strong acid–strong base (steep jump at pH 7), Weak acid–strong base (buffer region, jump at pH >7), Strong acid–weak base (buffer region, jump at pH <7), Weak acid–weak base (shallow, no clear jump).

  - type: explain
    title: Strong acid + Strong base (e.g. HCl + NaOH)
    body: |
      - **Initial**: pH low (e.g. 0.1 M HCl → pH 1)
      - **Before equivalence**: pH rises slowly (dilution effect)
      - **Near equivalence**: **Very steep jump** (pH 3 → 11 over 0.1 mL)
      - **Equivalence point**: **pH = 7** exactly (neutral salt NaCl)
      - **After equivalence**: pH levels off at high value (excess OH⁻)

      The jump is huge because [H⁺] changes from 10⁻³ M to 10⁻¹¹ M — 8 orders of magnitude!

  - type: explain
    title: Weak acid + Strong base (e.g. CH₃COOH + NaOH)
    body: |
      - **Initial**: pH higher than strong acid (e.g. 0.1 M CH₃COOH → pH ~2.9)
      - **Buffer region**: **Flat section** where CH₃COOH/CH₃COO⁻ buffer resists pH change
      - **Half-equivalence**: **pH = pKa** (here pH = 4.76). [HA] = [A⁻]
      - **Equivalence point**: **pH > 7** (basic salt CH₃COONa hydrolyses)
      - **Jump**: Smaller than strong–strong (pH ~7 → 10)
      - **After equivalence**: Same as strong–strong (excess OH⁻)

  - type: intuition
    title: Half-equivalence = the buffer's sweet spot
    body: |
      At half-equivalence, exactly half the weak acid has been neutralised:
      $$[\text{HA}] = [\text{A}^-]$$

      Henderson–Hasselbalch:
      $$\text{pH} = \text{p}K_a + \log_{10}\frac{[\text{A}^-]}{[\text{HA}]} = \text{p}K_a + \log_{10}1 = \text{p}K_a$$

      This is the **best buffer capacity** — equal amounts of acid and conjugate base.

  - type: explain
    title: Strong acid + Weak base (e.g. HCl + NH₃)
    body: |
      Mirror image of weak acid + strong base:
      - **Initial**: pH low (strong acid)
      - **Buffer region**: NH₄⁺/NH₃ buffer (flat section)
      - **Half-equivalence**: **pH = pKa(NH₄⁺) = 9.25** (or pOH = pKb(NH₃))
      - **Equivalence point**: **pH < 7** (acidic salt NH₄Cl hydrolyses)
      - **Jump**: Medium (pH ~4 → 7)

  - type: explain
    title: Weak acid + Weak base (e.g. CH₃COOH + NH₃)
    body: |
      - No sharp equivalence point jump — the curve is **shallow throughout**
      - Two buffer regions overlap (CH₃COOH/CH₃COO⁻ and NH₄⁺/NH₃)
      - Equivalence point pH depends on relative Ka and Kb
      - **Hard to detect equivalence point** with an indicator — not used in standard titrations

  - type: check
    title: Titration curve features
    questions: [curve-identify-1, curve-identify-2, curve-half-equiv]

  - type: misconceptions
    items:
      - wrong: "The equivalence point is always at pH 7."
        right: "Only for strong acid + strong base. Weak acid + strong base → pH > 7. Strong acid + weak base → pH < 7."
      - wrong: "The vertical jump is the same size for all titrations."
        right: "Strong–strong has the biggest jump. Weak–weak has almost no jump."
      - wrong: "Half-equivalence pH = 7."
        right: "Half-equivalence pH = pKa (for weak acid titration). Only equals 7 if pKa = 7 (rare)."
      - wrong: "You can use any indicator for any titration."
        right: "Indicator must change colour in the vertical jump region. Wrong indicator = wrong endpoint."

  - type: takeaways
    items:
      - "Strong acid + strong base: equivalence pH = 7, huge vertical jump."
      - "Weak acid + strong base: equivalence pH > 7, buffer region, half-equiv pH = pKa."
      - "Strong acid + weak base: equivalence pH < 7, buffer region, half-equiv pH = pKa(conj. acid)."
      - "Weak acid + weak base: no clear jump, hard to titrate."
      - "Equivalence point ≠ endpoint. Endpoint is where indicator changes colour."
      - "Choose indicator with pH range inside the vertical jump."

questions:
  - id: curve-identify-1
    format: mcq
    difficulty: 2
    objectives: ["7.2.9"]
    prompt: |
      A titration curve shows a steep vertical jump from pH 3 to pH 11 at the equivalence point. The equivalence point pH is 7. Which titration is this?
    options:
      - text: "Strong acid + Strong base"
        correct: true
        why: "Only strong–strong gives equivalence pH = 7 with a very large jump."
      - text: "Weak acid + Strong base"
        why: "Equivalence pH > 7 for weak acid + strong base."
      - text: "Strong acid + Weak base"
        why: "Equivalence pH < 7 for strong acid + weak base."
      - text: "Weak acid + Weak base"
        why: "Weak–weak has no steep jump; curve is shallow."
    explanation: |
      Strong acid + strong base → neutral salt at equivalence → pH 7, and the jump is largest because both are fully dissociated.

  - id: curve-identify-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.9"]
    prompt: |
      In a titration of CH₃COOH with NaOH, the curve has a flat buffer region around pH 4.76. What does this pH correspond to?
    options:
      - text: "The equivalence point"
        why: "Equivalence point for CH₃COOH + NaOH is > 7 (around 8.7)."
      - text: "The half-equivalence point"
        correct: true
        why: "Half-equivalence: [CH₃COOH] = [CH₃COO⁻] → pH = pKa = 4.76."
      - text: "The initial pH"
        why: "Initial pH of 0.1 M CH₃COOH is ~2.9, not 4.76."
      - text: "The pH after excess NaOH"
        why: "After equivalence, pH is determined by excess OH⁻ (high pH)."
    explanation: |
      At half-equivalence, half the weak acid is neutralised: [HA] = [A⁻], so pH = pKa. For CH₃COOH, pKa = 4.76.

  - id: curve-half-equiv
    format: numeric
    difficulty: 2
    objectives: ["7.2.9"]
    prompt: |
      A weak acid HA (pKa = 4.20) is titrated with NaOH. What is the pH at the half-equivalence point?
    answer: 4.20
    tolerance: 0.01
    explanation: |
      At half-equivalence, [HA] = [A⁻], so pH = pKa = 4.20.