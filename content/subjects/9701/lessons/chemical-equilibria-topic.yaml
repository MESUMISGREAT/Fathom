blocks:
  - type: objective
    body: |
      By the end of this lesson you can identify a reversible reaction, explain dynamic equilibrium, and state Le\'tchelier's principle.
  - type: explain
    title: Le\'tchelier's principle
    body: |
      If a change is applied to a system at equilibrium, the system shifts in the direction that minimises the change.
  - type: example
    title: Simple equilibrium
    problem: |
      For the reversible reaction A ⇌ B with Kc = 4 at 298K, initial [A]₀ = 1M, [B]₀ = 0 M, calculate [B]eq.
    steps:
      - |
        Let x be the change; [A] = 1-x, [B] = x. Plug into Kc: 4 = x/(1-x). Solve: 4(1-x)=x → 4-4x=x → 5x = 4 → x = 0.8. So [B]eq = 0.8M.
    answer: |
      [B]eq = 0.8 M.
