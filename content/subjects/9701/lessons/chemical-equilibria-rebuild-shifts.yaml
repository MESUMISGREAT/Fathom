id: chemical-equilibria-rebuild-shifts
subject: "9701"
topic: "7.1"
title: Le Chatelier shifts and the equilibrium constant
summary: Predict how equilibrium responds to changes and separate position from K.
order: 2
minutes: 6
kind: core
objectives: ["7.1.2", "7.1.3", "7.1.9"]
prerequisites: [chemical-equilibria-rebuild-basics]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Fresh lesson drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus objectives 7.1.2, 7.1.3 and 7.1.9. All questions and illustrative examples are original.
    Independently reviewed by GitHub Copilot (AI reviewer; model identity unavailable); no human
    review claimed.
blocks:
  - type: objective
    body: By the end, you can use Le Chatelier's principle and state when the value of an equilibrium constant changes.
  - type: definition
    term: Le Chatelier's principle
    body: If a change is made to a system at dynamic equilibrium, the position of equilibrium moves to minimise that change.
  - type: explain
    title: Concentration changes
    body: |-
      For $\text{A}+\text{B}\rightleftharpoons\text{C}$, adding $\text{A}$ makes the system respond by using up some of the extra $\text{A}$.
      The equilibrium position moves to the right, forming more $\text{C}$.

      Removing $\text{C}$ also moves the position right because the system replaces some of what was removed.
  - type: check
    questions: [concentration-shift]
  - type: explain
    title: Temperature, pressure and catalysts
    body: |-
      Treat heat as a reactant in an endothermic forward reaction and as a product in an exothermic forward reaction.
      Increasing temperature therefore favours the endothermic direction.

      Increasing pressure favours the side with fewer moles of gas. A catalyst speeds both directions equally:
      it helps equilibrium arrive sooner but does not move its position.
  - type: example
    title: A pressure puzzle
    problem: For $\text{N}_2(g)+3\text{H}_2(g)\rightleftharpoons2\text{NH}_3(g)$, predict the effect of increasing pressure.
    steps:
      - The left side has 4 moles of gas; the right side has 2.
      - The system minimises the pressure increase by moving to the side with fewer gas particles.
      - The equilibrium position moves right, producing more ammonia.
    answer: It shifts right.
  - type: check
    questions: [temperature-shift, pressure-shift, catalyst-effect]
  - type: explain
    title: Position is not the same as K
    body: |-
      Changing concentration or pressure can change the equilibrium position without changing the value of $K_c$ or $K_p$.
      For a given reaction, only temperature changes the value of the equilibrium constant.
      Changing concentration, pressure or adding a catalyst does not change $K$ at constant temperature.

      A catalyst changes neither the position nor the equilibrium constant. It changes the rates, so equilibrium is reached faster.
  - type: check
    questions: [constant-temperature-effect]
  - type: misconceptions
    items:
      - wrong: A catalyst increases the equilibrium constant.
        right: A catalyst changes the rates of both directions equally, not the value of K.
      - wrong: Increasing pressure always moves equilibrium right.
        right: It favours the side with fewer moles of gas; equal gas totals give no shift.
  - type: takeaways
    items:
      - Say “the position shifts” for concentration and pressure changes.
      - Say “K changes” only when temperature changes.
questions:
  - id: concentration-shift
    format: mcq
    difficulty: 1
    objectives: ["7.1.2", "7.1.3"]
    prompt: For $\text{A}+\text{B}\rightleftharpoons\text{C}$, what happens when more $\text{A}$ is added?
    options:
      - text: The equilibrium position shifts right.
        correct: true
        why: The system uses some of the added A by forming more C.
      - text: It shifts left to make more A.
        why: That would increase the disturbance.
      - text: The equilibrium constant must increase.
        why: Concentration changes do not change K at constant temperature.
      - text: The reaction stops.
        why: The reactions continue.
    explanation: Adding a reactant favours the direction that consumes it.
  - id: temperature-shift
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: Increasing temperature favours which direction?
    options:
      - text: The endothermic direction.
        correct: true
        why: The system absorbs some of the added thermal energy.
      - text: Always the forward direction.
        why: The forward reaction may be exothermic or endothermic.
      - text: Always the direction with more gas moles.
        why: Gas moles matter for pressure, not directly for temperature.
      - text: Neither direction.
        why: Temperature can change the equilibrium position.
    explanation: Heating favours the endothermic direction.
  - id: pressure-shift
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: For $\text{N}_2+3\text{H}_2\rightleftharpoons2\text{NH}_3$, what does increasing pressure do?
    options:
      - text: Shifts the position right.
        correct: true
        why: The right side has fewer moles of gas.
      - text: Shifts the position left.
        why: The left side has more gas particles.
      - text: Has no effect because pressure never matters.
        why: Pressure matters when gas totals differ.
      - text: Increases K immediately.
        why: Pressure does not change K at constant temperature.
    explanation: Higher pressure favours the side with fewer gaseous particles.
  - id: catalyst-effect
    format: text
    difficulty: 1
    objectives: ["7.1.3", "7.1.9"]
    prompt: What does a catalyst change for a reversible reaction at equilibrium?
    explanation: A catalyst increases both the forward and reverse rates, so equilibrium is reached faster without changing its position or K.
    accept: ["the rates", "the reaction rates", "it makes equilibrium reached faster", "time to reach equilibrium"]
    model: It increases both rates and makes equilibrium reached faster; it does not change the position or K.
  - id: constant-temperature-effect
    format: mcq
    difficulty: 2
    objectives: ["7.1.9"]
    prompt: Which change affects the value of an equilibrium constant?
    options:
      - text: Changing the temperature.
        correct: true
        why: K is temperature-dependent.
      - text: Adding more reactant at constant temperature.
        why: This changes the position, not K.
      - text: Increasing pressure at constant temperature.
        why: This can shift the position but does not change K.
      - text: Adding a catalyst.
        why: A catalyst changes rates only.
    explanation: Only temperature changes the value of K for a given reaction.
