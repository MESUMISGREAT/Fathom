id: enthalpy-change-standard-conditions
subject: "9701"
topic: "5.1"
title: "Standard conditions: the fair-comparison rule"
summary: Enthalpy changes depend on temperature, pressure and the state of every substance, so chemists quote them all under one set of agreed conditions — 298 K, 101 kPa, everything in its standard state.
order: 3
minutes: 6
kind: core
objectives: ["5.1.3"]
prerequisites: [enthalpy-change-exothermic-endothermic]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027 (learning outcome 5.1.3a, standard conditions shown by ⦵; the syllabus takes standard
    conditions to be 298 K and 101 kPa). All questions are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can **state standard conditions** precisely and explain why an enthalpy change measured under other conditions cannot be compared directly with a standard value.

  - type: explain
    title: Why chemists need an agreement
    body: |
      Hold your hand near a window on a cold day and you can feel the heat leaking out — yet the same window on a hot day seems to leak heat **in**. The direction of transfer depends on the temperature difference, not on the window.

      Enthalpy changes behave the same way. They depend on:

      - the **temperature** the reaction starts at;
      - the **pressure** (especially if gases are involved);
      - the **state** of each substance — ice, water and steam all store different amounts of energy.

      If everyone measured at whatever temperature their lab happened to be, data tables would be
      nonsense. So one set of conditions is agreed.

  - type: definition
    term: Standard conditions
    body: |
      **298 K** (about $25\ ^\circ\text{C}$) and **101 kPa** (1 atmosphere).

      Every substance is in its **standard state** — its normal, stable form at that temperature and pressure. For example:

      - water is liquid;
      - carbon is graphite (not diamond);
      - bromine is liquid $\text{Br}_2$;
      - oxygen is $\text{O}_2$ gas.

      The condition is shown by the symbol **⦵** (a plimsoll with a line through it), written as a superscript: $\Delta H^{\ominus}$.

  - type: explain
    title: What the symbol really means
    body: |
      The little ⦵ is a promise. It says: this number was measured (or calculated) at 298 K and 101 kPa, with every species in its standard state.

      It does **not** mean "standard" in the everyday sense of "normal" or "typical". It is a precise label.

      You will see it attached to the name of the enthalpy change:

      - $\Delta H_\text{r}^{\ominus}$ — standard enthalpy change of reaction;
      - $\Delta H_\text{f}^{\ominus}$ — standard enthalpy change of formation;
      - $\Delta H_\text{c}^{\ominus}$ — standard enthalpy change of combustion;
      - $\Delta H_\text{neut}^{\ominus}$ — standard enthalpy change of neutralisation.

  - type: diagram
    diagram: chem-enthalpy-change-standard-state
    alt: >-
      A panel with a thermometer reading 298 K and a pressure dial at 101 kPa labelled "standard
      conditions". Around them are four boxes showing carbon as graphite, water as liquid, oxygen as
      a gas and bromine as a liquid, each labelled "standard state". A note explains that the symbol
      ⦵ marks a value measured at these conditions with every substance in its standard state, and
      that ice, steam or diamond would give a different value.
    caption: |
      Standard conditions fix the temperature, the pressure and the physical state of everything in
      the equation.

  - type: check
    title: Quick check
    questions: [standard-conditions-values, standard-state-mcq, why-standardise]

  - type: explain
    title: What changes if you ignore it
    body: |
      Suppose you burned methane at 298 K and got $-890\ \text{kJ mol}^{-1}$, then burned it again starting at 400 K and got a slightly different number. Both are "correct" experiments, but only one is the **standard** enthalpy change of combustion.

      Changing the physical state matters even more:

      $$\text{H}_2\text{O(l)} \rightarrow \text{H}_2\text{O(g)} \qquad \Delta H = +41\ \text{kJ mol}^{-1}$$

      So a combustion value that produces gaseous water is about $41\ \text{kJ mol}^{-1}$ different per mole of water from one that produces liquid water. Two marks can hinge on which you used.

      This is why questions often say "the water formed is liquid" — that is the standard state.

  - type: misconceptions
    items:
      - wrong: Standard conditions means 273 K and 100 kPa.
        right: |
          That is **STP**, used for gas volumes in old textbooks. For 9701 enthalpy changes,
          standard conditions are **298 K and 101 kPa**.
      - wrong: The ⦵ symbol means the reaction is at equilibrium.
        right: |
          It marks standard conditions only. Nothing about equilibrium is implied.
      - wrong: Standard state of carbon means "solid carbon", so diamond is fine.
        right: |
          It must be the **most stable** form at 298 K and 101 kPa, which is graphite. Using diamond
          would change $\Delta H$ by about $2\ \text{kJ mol}^{-1}$.
      - wrong: If no ⦵ is written, the measurement must have been wrong.
        right: |
          It simply means the conditions were not standard, or the value is a rough one. Mark
          schemes accept both, but the ⦵ version is the one in data tables.
      - wrong: Standard conditions say the reaction must start at 298 K and stay there.
        right: |
          They fix the **initial** temperature and pressure, and the states of the species. During
          the reaction the temperature naturally rises or falls.

  - type: exam
    body: |
      - "State standard conditions" (1 mark): both numbers are needed — **298 K and 101 kPa**. Just
        saying "room temperature and pressure" loses the mark.
      - When writing a definition, include "with all substances in their standard states" — that is
        usually the second mark.
      - The syllabus quotes 298 K and 101 kPa; use its values, not "1 atm" and "$25\ ^\circ\text{C}$" alone.
      - Do not confuse standard conditions with STP (273 K, 100 kPa) or with "standard solution"
        (1 mol dm⁻³) elsewhere in the course.

  - type: check
    title: Check yourself
    questions: [spot-standard-error, states-matter, standard-conditions-statement]

  - type: takeaways
    items:
      - Standard conditions are 298 K and 101 kPa, with each substance in its standard state.
      - The ⦵ symbol labels a value measured under those conditions.
      - Standard states are the most stable forms at 298 K and 101 kPa (carbon = graphite, water = liquid).
      - Changing the state of a substance changes the enthalpy change, so states must always be written.
      - 'Standard conditions ≠ STP: STP (273 K, 100 kPa) is for gas volumes.'

questions:
  - id: standard-conditions-values
    format: numeric
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      Give the temperature of standard conditions, in kelvin.
    fields:
      - answer: 298
        tolerance: { abs: 1 }
        unit: K
    explanation: |
      Standard conditions are 298 K and 101 kPa — 298 K is about $25\ ^\circ\text{C}$. Both values are
      needed for a full statement.

  - id: standard-state-mcq
    format: mcq
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      Which is the standard state of carbon at 298 K and 101 kPa?
    options:
      - text: Graphite
        correct: true
        why: |
          Graphite is the more stable form of carbon under standard conditions, so it is the
          standard state.
      - text: Diamond
        why: |
          Diamond is metastable at 298 K and 101 kPa; using it would change the enthalpy change.
      - text: Carbon dioxide
        why: |
          That is a compound of carbon, not the element in its standard state.
      - text: Carbon monoxide
        why: |
          Also a compound, and not the standard state of the element.
    explanation: |
      The standard state is the most stable form of the element at 298 K and 101 kPa, which for
      carbon is graphite.

  - id: why-standardise
    format: mcq
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      Why are enthalpy changes quoted at standard conditions?
    options:
      - text: So that values measured in different labs can be compared fairly
        correct: true
        why: |
          Enthalpy change depends on temperature, pressure and physical state, so a fixed reference
          makes every quoted value comparable.
      - text: Because reactions only happen at 298 K and 101 kPa
        why: |
          Reactions happen at all sorts of temperatures and pressures; standard conditions are a
          reporting convention, not a requirement.
      - text: Because enthalpy is zero at 298 K
        why: |
          There is no universal zero at 298 K; enthalpy values are always quoted as changes.
      - text: To make the activation energy zero
        why: |
          Standard conditions say nothing about activation energy or rate.
    explanation: |
      Standard conditions exist so that $\Delta H$ values from different sources mean the same thing.

  - id: spot-standard-error
    format: spot-error
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      A student states standard conditions. Which line contains the first error?
    lines:
      - Standard conditions are 298 K
      - and 101 kPa
      - with all substances in their standard states
      - The symbol for standard conditions is ΔH
    errorLine: 4
    fix: |
      $\Delta H$ is the enthalpy change itself. The symbol for standard conditions is **⦵**, written
      as a superscript on the enthalpy change, e.g. $\Delta H^{\ominus}$.
    explanation: |
      The first three lines are the definition. Line 4 confuses the quantity with the condition
      label.

  - id: states-matter
    format: numeric
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      The standard enthalpy change of combustion of hydrogen is $-286\ \text{kJ mol}^{-1}$ when the water formed is liquid.

      The enthalpy change of vaporisation of water is $+41\ \text{kJ mol}^{-1}$. Calculate $\Delta H$ for the same combustion when the water formed is a gas.
    fields:
      - answer: -245
        tolerance: { abs: 1 }
        unit: kJ mol^-1
    explanation: |
      Turning 1 mol of liquid water into steam absorbs $41\ \text{kJ mol}^{-1}$, so that much less
      energy is released overall:
      $-286 + 41 = -245\ \text{kJ mol}^{-1}$.

  - id: standard-conditions-statement
    format: text
    style: one-line
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      At what pressure are standard enthalpy changes measured? Give the value with its unit.
    accept: ["101 kPa", "101kPa", "101 kpa", "1 atm", "100 kPa", "101 000 Pa"]
    model: |
      $101\ \text{kPa}$ (1 atmosphere).
    explanation: |
      Standard conditions are 298 K and 101 kPa. Cambridge quotes 101 kPa; "1 atm" is the same
      pressure and is usually accepted.
