id: covalent-bonding-expanded-octets
subject: "9701"
topic: "3.4"
title: "Breaking the octet rule: SO₂, PCl₅ and SF₆"
summary: Period 3 atoms can have more than 8 electrons around them, as in SO₂ (10), PCl₅ (10) and SF₆ (12); the traditional shell model is clearly distinguished from modern bonding descriptions.
order: 3
minutes: 4
objectives: ["3.4.1"]
prerequisites: [covalent-bonding-double-and-triple-bonds, atoms-shells-subshells-orbitals]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 1, part (b): expanded octets in SO₂,
    PCl₅ and SF₆). The traditional shell-capacity account using available 3d orbitals is
    explicitly identified as a simplified model. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can explain why elements in Period 3 can **expand their octet**, and count the electrons around the central atom in $\text{SO}_2$, $\text{PCl}_5$ and $\text{SF}_6$.

  - type: explain
    title: A family mystery
    body: |
      Nitrogen and phosphorus are both in Group 15. Both make a trichloride: $\text{NCl}_3$ and $\text{PCl}_3$.

      But only phosphorus makes a **pentachloride**. $\text{PCl}_5$ is a real chemical you can buy; $\text{NCl}_5$ doesn't exist. Same group, different rules. Why?

  - type: explain
    title: A simple shell model
    body: |
      - In the simple shell-capacity model, **Period 2** atoms (N, O, F) have 2s and 2p orbitals in their outer shell: **at most 8** electrons.
      - The traditional A-level account includes the empty 3d orbitals in the **Period 3** shell. It uses them to account for more than 8 electrons around P or S in the examples below.

      Having more than 8 electrons around the central atom is called **expanding the octet**. Treat the 3d explanation as a simplified shell model, not a literal modern description of the bonds.

  - type: check
    title: Quick check
    questions: [why-pcl5-not-ncl5]

  - type: explain
    title: How to count
    body: |
      Around the central atom, add up:
      - **2** electrons for every shared pair (a double bond is 2 shared pairs);
      - **2** electrons for every lone pair.

  - type: diagram
    diagram: chem-covalent-bonding-expanded-octets
    alt: "Three panels show only the electrons around the central atom, enclosed in a dashed ring. SO2: S with two double bonds to O (two shared pairs each) and one lone pair; 4 shared pairs plus 1 lone pair equals 10 electrons around S. PCl5: P with five single bonds to Cl; 5 shared pairs equals 10 electrons around P. SF6: S with six single bonds to F; 6 shared pairs equals 12 electrons around S. Crosses are electrons from the central atom, dots from the outer atoms. Below, two boxes explain the traditional shell-capacity model: Period 2 outer shells contain 2s and 2p orbitals, with a maximum of 8 electrons; the traditional Period 3 account also includes empty 3d orbitals to account for the examples with more than 8. This is a simplified model, not a literal modern account of bonding."
    caption: |
      Count inside the ring: 10, 10 and 12. None of these could happen around a Period 2 atom.

  - type: example
    title: Sulfur dioxide, SO₂
    problem: |
      $\text{SO}_2$ is drawn as $\text{O}{=}\text{S}{=}\text{O}$. How many electrons are around the sulfur atom?
    steps:
      - |
        S (Group 16) has **6** outer electrons.
      - |
        Two S=O double bonds use **4** of them (2 from S for each double bond).
      - |
        The other **2** form **1 lone pair** on S.
      - |
        Around S: 4 shared pairs (8 electrons) + 1 lone pair (2 electrons) = **10**.
    answer: |
      10 electrons around S: an expanded octet.

  - type: explain
    title: PCl₅ and SF₆
    body: |
      | molecule | central atom's outer electrons | bonds | lone pairs on centre | electrons around centre |
      | --- | --- | --- | --- | --- |
      | $\text{PCl}_5$ | 5 | 5 single | 0 | 10 |
      | $\text{SF}_6$ | 6 | 6 single | 0 | 12 |
      | $\text{SO}_2$ | 6 | 2 double | 1 | 10 |

      In $\text{PCl}_5$ and $\text{SF}_6$ the central atom uses **every** outer electron in a bond.

  - type: check
    title: Count around the centre
    questions: [sf6-electrons, so2-pairs, which-expanded]

  - type: deeper
    title: A different Lewis structure for SO₂
    body: |
      Some books draw $\text{SO}_2$ with one S=O double bond and one dative bond from S to O, so S keeps exactly 8 electrons.

      The syllabus uses $\text{SO}_2$ as an example of an **expanded octet**, so draw $\text{O}{=}\text{S}{=}\text{O}$ with one lone pair on S: 10 electrons around S.

  - type: enrichment
    title: What does the 3d-orbital account mean?
    body: |
      The traditional shell-capacity explanation is a useful A-level model, but it should not be taken to mean that 3d orbitals substantially form these bonds. Modern descriptions of hypervalent molecules such as $\text{SF}_6$ use molecular orbitals and delocalised bonding.

      For this syllabus, the key point is that the Period 3 examples can have more than 8 electrons around the central atom. If you use the 3d explanation, label it as the traditional simplified model.

  - type: misconceptions
    items:
      - wrong: "Every atom must end up with exactly 8 outer electrons."
        right: "Period 2 atoms can't go **above** 8 (and some, like B in $\\text{BF}_3$, have fewer). From Period 3 onwards, the central atom can have 10 or 12."
      - wrong: "Nitrogen can't form $\\text{NCl}_5$ because nitrogen is too small to fit five Cl atoms."
        right: "The simple shell-capacity account distinguishes Period 2 from the syllabus's Period 3 examples. Avoid reducing the difference to physical size alone."
      - wrong: "Expanding the octet means the atom gains extra electrons."
        right: "The extra electrons around it are **shared** electrons from the outer atoms. P in $\\text{PCl}_5$ still contributes only its own 5."

  - type: exam
    body: |
      - The syllabus examples show Period 3 atoms expanding the octet. The traditional A-level shell model accounts for this using available 3d orbitals, but this is a simplified model rather than the modern bonding explanation.
      - When asked how many electrons are around a central atom, count shared pairs **and** lone pairs, 2 electrons each.

  - type: takeaways
    items:
      - "The Period 3 examples in the syllabus show expanded octets."
      - "The traditional shell model uses available 3d orbitals to account for this; do not present that as the literal modern bonding mechanism."
      - "SO₂: 10 electrons around S (two S=O, one lone pair). PCl₅: 10 around P. SF₆: 12 around S."
      - "Count around the centre: 2 per shared pair + 2 per lone pair."

  - type: check
    title: Last one
    questions: [expand-cloze, clf3-electrons]

questions:
  - id: why-pcl5-not-ncl5
    format: mcq
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      In the traditional A-level shell model, how is phosphorus in $\text{PCl}_5$ distinguished from nitrogen in the hypothetical $\text{NCl}_5$?
    options:
      - text: The model includes 3d orbitals in phosphorus's Period 3 shell, but no d orbitals in nitrogen's Period 2 shell
        correct: true
        why: |
          This is the traditional shell-capacity account: n = 2 has 2s and 2p, while n = 3 also has 3d. It is a simplified model, not a literal description of modern bonding.
      - text: Phosphorus is more electronegative than nitrogen
        why: |
          Electronegativity is not the distinction this traditional shell model uses.
      - text: Nitrogen has fewer outer electrons than phosphorus
        why: |
          Both are in Group 15 with 5 outer electrons. The model distinguishes their outer shells.
      - text: $\text{NCl}_5$ would be ionic, not covalent
        why: |
          The question asks for the traditional shell-model explanation, not ionic versus covalent bonding.
    explanation: |
      In the traditional shell-capacity model, Period 3 includes 3d orbitals while Period 2 does not. This is a simplified account; modern bonding descriptions do not treat substantial 3d participation as the cause.

  - id: sf6-electrons
    format: numeric
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      How many electrons are there around the sulfur atom in $\text{SF}_6$?
    fields:
      - answer: 12
        unit: electrons
    explanation: |
      Six S–F single bonds = 6 shared pairs = 12 electrons. S uses all 6 of its outer electrons, so it has no lone pairs.

  - id: so2-pairs
    format: numeric
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      In $\text{SO}_2$, drawn as $\text{O}{=}\text{S}{=}\text{O}$, how many **shared pairs** and how many **lone pairs** are around the sulfur atom?
    fields:
      - label: "shared pairs ="
        answer: 4
      - label: "lone pairs ="
        answer: 1
    explanation: |
      Two double bonds = 4 shared pairs. S has 6 outer electrons and uses 4 in bonding, so 2 remain as 1 lone pair. That's 10 electrons around S.

  - id: which-expanded
    format: mcq
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      In which molecule does the central atom have **more than 8** electrons around it?
    options:
      - text: |
          $\text{CO}_2$
        why: |
          Two C=O double bonds = 4 shared pairs = 8 electrons around C.
      - text: |
          $\text{BF}_3$
        why: |
          Three B–F bonds = only 6 electrons around B: fewer than 8, not more.
      - text: |
          $\text{NH}_3$
        why: |
          3 shared pairs + 1 lone pair = 8 electrons around N. N can't go beyond 8.
      - text: |
          $\text{PCl}_5$
        correct: true
        why: |
          5 shared pairs = 10 electrons around P: an expanded octet.
    explanation: |
      Only Period 3 (and later) atoms can expand the octet. Of the central atoms here (C, B, N and P), only P is in Period 3: 10 electrons around it in $\text{PCl}_5$.

  - id: clf3-electrons
    format: numeric
    difficulty: 3
    objectives: ["3.4.1"]
    prompt: |
      Chlorine is also in Period 3. In chlorine trifluoride, $\text{ClF}_3$, the Cl atom forms three single Cl–F bonds. How many lone pairs are on Cl, and how many electrons are there around Cl in total?
    fields:
      - label: "lone pairs on Cl ="
        answer: 2
      - label: "electrons around Cl ="
        answer: 10
    explanation: |
      Cl has 7 outer electrons. Three go into Cl–F bonds, leaving 4 = 2 lone pairs. Around Cl: 3 shared pairs (6) + 2 lone pairs (4) = 10 electrons, an expanded octet.

  - id: expand-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      The traditional shell model includes {{1}} orbitals in Period 3; it uses this to account for examples with more than {{2}} electrons around the central atom.
    blanks:
      - accept: ["d", "3d", "empty d", "empty 3d", "d-orbital", "3d-orbital"]
      - accept: ["8", "eight"]
    explanation: |
      This is the traditional simplified shell-capacity model, not a literal modern bonding mechanism.
