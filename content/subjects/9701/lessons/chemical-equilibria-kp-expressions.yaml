id: chemical-equilibria-kp-expressions
subject: "9701"
topic: "7.1"
title: "Writing $K_p$ expressions"
summary: For gas-phase equilibria the constant can be built from partial pressures instead of concentrations. The pattern is identical — but now the units need checking.
order: 6
minutes: 10
kind: core
objectives: ["7.1.6"]
prerequisites: [chemical-equilibria-mole-fraction-partial-pressure, chemical-equilibria-kc-expressions]
