id: atoms-ionisation-energy-trends
subject: "9701"
topic: "1.4"
title: Ionisation energy trends in the Periodic Table
summary: Why first ionisation energy falls down a group and rises across a period, and the two dips (groups 13 and 16) that break the pattern.
order: 2
minutes: 5
objectives: ["1.4.3", "1.4.6"]
prerequisites: [atoms-first-ionisation-energy, atoms-electrons-in-boxes]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.4, learning outcomes 3 and 6; H to Kr). First ionisation
    energies (kJ mol⁻¹) are NIST values as tabulated in the Wikipedia table "Molar
    ionization energies of the elements", checked 2026-10-19. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe and explain the trends in first ionisation energy across periods 2 and 3 and down a group, including the dips at groups 13 and 16.

  - type: diagram
    diagram: chem-first-ionisation-energy-trend
    alt: "Line graph of first ionisation energy in kJ per mole (0 to 2600) against atomic number from 1 (H) to 20 (Ca), using real data. Peaks at He (2372), Ne (2081) and Ar (1521); troughs at Li (520), Na (496) and K (419). Across periods 2 and 3 the values rise overall from the group 1 trough to the noble gas peak, with small dips at B and Al and at O and S, which are circled. Dashed lines join He, Ne, Ar and Li, Na, K, both sloping downwards to show the decrease down a group."
    caption: |
      Real data, H to Ca. Saw-tooth shape: big drop at each new period, general rise across, two small dips per period.

  - type: explain
    title: Down a group, IE decreases
    body: |
      Group 1: Li 520, Na 496, K 419 kJ mol⁻¹. Group 18: He 2372, Ne 2081, Ar 1521.

      - The outer electron is in a shell **further from the nucleus**.
      - There are **more inner shells**, so more **shielding**.
      - These outweigh the **increase in nuclear charge**, so the outer electron is attracted less strongly.

  - type: explain
    title: Across a period, IE generally increases
    body: |
      - **Nuclear charge increases** by one each step.
      - Electrons are added to the **same shell**, so shielding stays about the same.
      - The atomic radius **decreases**.
      - So the outer electron is attracted more strongly and is harder to remove.

      The biggest drop comes straight after each noble gas (Ne → Na): the next electron starts a **new shell**, further out and shielded by a full inner shell.

  - type: check
    title: Quick check
    questions: [down-group-1, across-period-cloze, highest-period-3]

  - type: explain
    title: Dip 1, group 2 to group 13 (Be → B, Mg → Al)
    body: |
      | atom | outer electrons | electron removed from |
      | --- | --- | --- |
      | Mg | 3s² | 3s |
      | Al | 3s² 3p¹ | 3p |

      The 3p electron in Al is **higher in energy** than a 3s electron, is slightly further from the nucleus on average, and is **shielded by the filled 3s sub-shell** as well as the inner shells. That outweighs the extra proton, so IE(Al) < IE(Mg). Same story for B < Be with 2s and 2p.

  - type: explain
    title: Dip 2, group 15 to group 16 (N → O, P → S)
    body: |
      ```
      N   2p  [↑ ][↑ ][↑ ]    all unpaired
      O   2p  [↑↓][↑ ][↑ ]    one pair
      ```

      In O, the electron removed is one of a **spin pair**. The **spin-pair repulsion** between the two electrons in that orbital makes one of them easier to remove, outweighing the extra proton. So IE(O) < IE(N), and in the same way IE(S) < IE(P).

  - type: example
    title: Explaining P > S
    problem: |
      The first IE of phosphorus is $1012\ \text{kJ mol}^{-1}$ and of sulfur is $1000\ \text{kJ mol}^{-1}$. Explain why sulfur's is lower, even though it has more protons.
    steps:
      - |
        Write the configurations: P is [Ne] 3s² 3p³ and S is [Ne] 3s² 3p⁴.
      - |
        Draw the 3p boxes: P is `[↑ ][↑ ][↑ ]`; S is `[↑↓][↑ ][↑ ]`.
      - |
        The electron removed from S is in a doubly occupied orbital, so it experiences spin-pair repulsion.
      - |
        This repulsion makes it easier to remove, and outweighs sulfur's extra nuclear charge.
    answer: |
      Spin-pair repulsion in sulfur's paired 3p orbital lowers its first IE below phosphorus's.

  - type: check
    title: The dips
    questions: [aluminium-explain, spin-pair-pair, sulfur-error]

  - type: deeper
    title: Period 4 (K to Kr)
    body: |
      The same ideas work, with one new feature:

      - K (419) to Ca (590): a rise, as in groups 1 to 2.
      - Sc to Cu (about 630 to 760): fairly flat. The electrons added go into the **inner 3d** sub-shell while the electron removed is a 4s electron, and the extra 3d shielding largely cancels the extra protons. Zn (906) is higher, with full 3d¹⁰ and 4s² sub-shells.
      - Ga (579): a dip, like Al. The 4p electron is shielded by the filled 3d and 4s sub-shells.
      - As (947) > Se (941): the spin-pair dip again. Then up to Br (1140) and Kr (1351).

  - type: misconceptions
    items:
      - wrong: "IE increases across a period because the atoms get bigger."
        right: "Atoms get **smaller** across a period, and the stronger attraction to the higher nuclear charge is why IE rises."
      - wrong: "Boron has a lower IE than beryllium because it has fewer protons."
        right: "Boron has more protons. Its outer electron is in 2p: higher energy and shielded by 2s."
      - wrong: "Oxygen's IE is lower because its 2p sub-shell is nearly full."
        right: "It's because the electron removed is paired: spin-pair repulsion makes it easier to remove."

  - type: exam
    body: |
      - "Identify the trend" wants a direction; "explain" wants the factors (nuclear charge, distance, shielding, spin-pair repulsion) linked to **attraction for the outer electron**.
      - For a dip, write the two configurations (or box diagrams) and say which sub-shell or orbital the electron comes from.
      - Always say what the effect **outweighs**: "the extra shielding outweighs the increase in nuclear charge".

  - type: takeaways
    items:
      - "Down a group: IE decreases (further away, more shielding, outweighing extra protons)."
      - "Across a period: IE generally increases (more protons, same shell, similar shielding, smaller radius)."
      - "Dip at group 13 (B, Al): electron removed from a p sub-shell, higher in energy and shielded by the s electrons."
      - "Dip at group 16 (O, S): electron removed from a spin pair; spin-pair repulsion makes it easier to remove."

questions:
  - id: down-group-1
    format: mcq
    difficulty: 1
    objectives: ["1.4.3", "1.4.6"]
    prompt: |
      Why does first ionisation energy decrease down group 1 from lithium to potassium?
    options:
      - text: |
          The nuclear charge decreases down the group.
        why: |
          Nuclear charge increases down a group (Li 3, Na 11, K 19 protons).
      - text: |
          The outer electron is paired in potassium but unpaired in lithium.
        why: |
          All group 1 atoms have a single unpaired outer s electron.
      - text: |
          The outer electron is further from the nucleus and more shielded by inner shells, which outweighs the increase in nuclear charge.
        correct: true
        why: |
          Distance and shielding both increase down the group and win over the extra protons.
      - text: |
          There are fewer inner electrons shielding the outer electron.
        why: |
          There are more inner shells further down the group, so shielding increases.
    explanation: |
      Down a group: more shells, more distance, more shielding, so a weaker attraction despite more protons.

  - id: across-period-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.4.3", "1.4.6"]
    prompt: |
      Across a period, nuclear charge {{1}}, electrons are added to the {{2}} shell so shielding stays about the same, and first ionisation energy generally {{3}}.
    blanks:
      - accept: ["increases", "rises", "goes up", "increase"]
      - accept: ["same", "outer", "same outer", "outermost", "same outermost"]
      - accept: ["increases", "rises", "goes up", "increase"]
    explanation: |
      More protons pulling on electrons in the same shell, with similar shielding, means a stronger attraction.

  - id: highest-period-3
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.4.3"]
    prompt: |
      Which element in period 3 (sodium to argon) has the highest first ionisation energy?
    accept: ["argon", "Ar"]
    model: |
      Argon (1521 kJ mol⁻¹).
    explanation: |
      IE rises across the period to a maximum at the noble gas.

  - id: aluminium-explain
    format: explain
    difficulty: 2
    objectives: ["1.4.3", "1.4.6"]
    prompt: |
      Explain why the first ionisation energy of aluminium is lower than that of magnesium.
    model: |
      Magnesium's outer electron is removed from the 3s sub-shell, but aluminium's is removed from 3p. The 3p electron is higher in energy and slightly further from the nucleus on average, and it is shielded by the filled 3s sub-shell as well as the inner shells. These effects outweigh aluminium's extra proton, so less energy is needed to remove its outer electron.
    keyPoints:
      - "Mg's electron is removed from 3s; Al's from 3p"
      - "The 3p electron is higher in energy / slightly further from the nucleus"
      - "The 3p electron is shielded by the 3s electrons as well as inner shells"
      - "This outweighs the extra nuclear charge, so less energy is needed"
    explanation: |
      Sub-shell shielding is the key idea: the 3s pair shields the 3p electron.

  - id: spin-pair-pair
    format: mcq
    difficulty: 2
    objectives: ["1.4.3", "1.4.6"]
    prompt: |
      In which pair does the **second** element have the lower first ionisation energy **because of spin-pair repulsion**?
    options:
      - text: |
          nitrogen, then oxygen
        correct: true
        why: |
          O is 2p⁴: the electron removed comes from a paired orbital.
      - text: |
          beryllium, then boron
        why: |
          B is lower than Be, but because its electron comes from 2p, not because of pairing.
      - text: |
          carbon, then nitrogen
        why: |
          N's IE is higher than C's, as the general trend predicts.
      - text: |
          neon, then sodium
        why: |
          Na is much lower because its outer electron is in a new shell, not because of pairing.
    explanation: |
      The group 15 → 16 dip (N → O, P → S) is the spin-pair one; the group 2 → 13 dip is the p sub-shell one.

  - id: sulfur-error
    format: spot-error
    difficulty: 2
    objectives: ["1.4.3", "1.4.6"]
    prompt: |
      A student compares the first ionisation energies of phosphorus and sulfur. Which line contains the first error?
    lines:
      - "P is [Ne] 3s² 3p³ and S is [Ne] 3s² 3p⁴."
      - "In P, each 3p orbital holds one electron."
      - "In S, one 3p orbital holds a pair of electrons."
      - "Spin-pair repulsion makes it harder to remove an electron from S, so S has a higher first IE than P."
    errorLine: 4
    fix: |
      Spin-pair repulsion makes the paired electron **easier** to remove, so S has a **lower** first IE than P (1000 vs 1012 kJ mol⁻¹).
    explanation: |
      Repulsion pushes the electron away from its partner, so less energy is needed to remove it.
