id: chemical-equilibria-what-changes-k
subject: "9701"
topic: "7.1"
title: "What changes the equilibrium constant?"
summary: Concentration, pressure and catalysts move the mixture around, but only temperature changes the value of $K_c$ or $K_p$. This is the single most examined distinction in the topic.
order: 9
minutes: 10
kind: core
objectives: ["7.1.9"]
prerequisites: [chemical-equilibria-kc-expressions, chemical-equilibria-temperature-catalyst, chemical-equilibria-kc-kp-calculations]
