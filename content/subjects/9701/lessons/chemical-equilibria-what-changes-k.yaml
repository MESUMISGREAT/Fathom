blocks:
  - type: objective
    body: |-
      By the end you can say, for any change to a system at equilibrium, whether it alters the value of the equilibrium constant — and explain why in one sentence.

  - type: explain
    title: Two different questions
    body: |-
      There are two separate questions you can ask about a change:

      1. What happens to the **position** of equilibrium — that is, the amounts in the mixture?
      2. What happens to the **value of the constant**?

      Le Chatelier's principle answers the first. The second has a much shorter answer.

  - type: definition
    term: What $K$ depends on
    body: |-
      The value of $K_c$ or $K_p$ depends on **temperature only**.

      - Changing a **concentration** does not change $K$.
      - Changing a **pressure** (or volume) does not change $K$.
      - Adding a **catalyst** does not change $K$.
      - Changing the **temperature** does change $K$.

      Everything else changes the mixture; only temperature changes the constant.

  - type: explain
    title: Why temperature is the exception
    body: |-
      $K$ is the ratio of the rate constant for the forward reaction to the rate constant for the reverse reaction:

      $$K = \frac{k_{\text{forward}}}{k_{\text{reverse}}}$$

      Rate constants depend on temperature — that is the central idea of the Arrhenius equation. They do not depend on concentration or pressure.

      So $K$ cannot change unless the temperature changes.

  - type: explain
    title: How temperature changes it
    body: |-
      The direction is set by the sign of $\Delta H$:

      - Forward reaction **exothermic**: raising the temperature **decreases** $K$.
      - Forward reaction **endothermic**: raising the temperature **increases** $K$.

      This is consistent with Le Chatelier: if heating shifts the equilibrium left, the product side of the $K$ expression must have become relatively smaller, so $K$ has fallen.

  - type: explain
    title: But the position still moves without $K$ changing
    body: |-
      Here is the point students find hardest. Raising the pressure on the Haber equilibrium shifts it right — the mixture contains proportionally more ammonia — yet $K_p$ is unchanged.

      Both statements are true because the shift restores the *same ratio*. Every partial pressure in the expression increases when the gas is compressed, but they increase by amounts that leave the ratio at its old value.

      So the composition changes while the constant does not. The constant is the *destination*; the composition is *where you are on the way there*.

  - type: explain
    title: The examinable summary
    body: |-
      | Change | Effect on position | Effect on $K$ |
      | --- | --- | --- |
      | Add a reactant | shifts right | none |
      | Remove a product | shifts right | none |
      | Increase pressure (fewer gas moles on the right) | shifts right | none |
      | Add a catalyst | no change | none |
      | Raise temperature (forward exothermic) | shifts left | decreases |
      | Raise temperature (forward endothermic) | shifts right | increases |

      Read the last column from top to bottom: only the temperature rows move.

  - type: example
    title: "Worked example: reading a table of $K$ values"
    problem: |-
      For an equilibrium, $K_c$ was measured at several temperatures. The data are illustrative:

      | $T\ /\ \text{K}$ | $K_c$ |
      | --- | --- |
      | $400$ | $1.2 \times 10^{-1}$ |
      | $500$ | $4.0 \times 10^{-3}$ |
      | $600$ | $2.5 \times 10^{-4}$ |

      (a) Is the forward reaction exothermic or endothermic? (b) State the effect of raising the temperature on the equilibrium yield of the products.
    steps:
      - |-
        Compare the values: $K_c$ falls as the temperature rises.
      - |-
        A falling $K_c$ means the product side is becoming relatively smaller, so the equilibrium is shifting left as it gets hotter.
      - |-
        Heating favours the endothermic direction, and here that direction is the reverse reaction — so the **forward** reaction must be **exothermic**.
      - |-
        Since the equilibrium shifts left when heated, the equilibrium yield of products **decreases**.
    answer: |-
      (a) The forward reaction is exothermic. (b) The equilibrium yield of products falls as the temperature rises.

  - type: intuition
    title: A useful one-line test
    body: |-
      If a change can be made without touching the thermostat, $K$ does not move.

      That single sentence answers a surprising number of exam questions — and it is exactly why pressure and concentration questions can be answered with Le Chatelier while the constant stays put.

  - type: misconceptions
    items:
      - wrong: |-
          Increasing the pressure increases $K_p$ because the yield rises.
        right: |-
          The yield can rise while $K_p$ stays constant. The new mixture satisfies the same constant.
      - wrong: |-
          Adding a catalyst increases $K$ because equilibrium is reached sooner.
        right: |-
          Reaching equilibrium sooner is a rate effect; the constant is a position effect and is unchanged.
      - wrong: |-
          Removing a product increases $K_c$.
        right: |-
          Removing a product shifts the equilibrium right, but the constant is restored at its old value.
      - wrong: |-
          $K$ increases with temperature for every reaction.
        right: |-
          It increases only for endothermic forward reactions. For exothermic ones it decreases.
      - wrong: |-
          If the position of equilibrium changes, the constant must have changed.
        right: |-
          Concentration and pressure changes alter the position without touching the constant.

  - type: exam
    body: |-
      - Answer the question that was asked: "effect on the **value of $K$**" is not the same as "effect on the **yield**".
      - Use the phrase "**K depends only on temperature**"; it is the mark scheme's own wording.
      - If a table of $K$ values is given, compare two rows explicitly: "$K_c$ falls from ... to ... as $T$ rises".
      - For pressure changes, expect two marks: one for the shift, one for "$K$ unchanged".
      - Never write that a catalyst changes $K$; it changes only the time taken to reach equilibrium.

  - type: check
    title: Checking the idea
    questions: [eq9-mcq-only-temperature, eq9-mcq-exothermic-table, eq9-cloze-catalyst, eq9-numeric-factor]

  - type: check
    title: End-of-lesson check
    questions: [eq9-mcq-pressure-k, eq9-spot-error, eq9-explain]

  - type: takeaways
    items:
      - $K_c$ and $K_p$ depend only on temperature.
      - Concentration, pressure and catalysts change the mixture, not the constant.
      - For an exothermic forward reaction, $K$ falls as temperature rises.
      - For an endothermic forward reaction, $K$ rises as temperature rises.
      - A shift in position and a change in $K$ are different events.

questions:
  - id: eq9-mcq-only-temperature
    format: mcq
    difficulty: 1
    objectives: ["7.1.9"]
    prompt: |-
      Which change alters the value of the equilibrium constant for a reaction?
    options:
      - text: Raising the temperature.
        correct: true
        why: |-
          Temperature changes the rate constants, and $K$ is their ratio.
      - text: Adding a catalyst.
        why: |-
          A catalyst lowers both activation energies equally, so the ratio of rate constants is unchanged.
      - text: Increasing the total pressure.
        why: |-
          Pressure changes the partial pressures but not the ratio that defines $K_p$.
      - text: Adding more of a reactant.
        why: |-
          Adding a reactant shifts the equilibrium, but the mixture settles back at the same value of $K$.
    explanation: |-
      Only temperature alters $K$; every other change merely moves the mixture towards the same constant.

  - id: eq9-mcq-exothermic-table
    format: mcq
    difficulty: 2
    objectives: ["7.1.9"]
    prompt: |-
      For an equilibrium the value of $K_c$ is $2.0 \times 10^{-3}$ at $400\ \text{K}$ and $1.5 \times 10^{-4}$ at $500\ \text{K}$. What can be deduced?
    options:
      - text: The forward reaction is exothermic, because $K_c$ falls as the temperature rises.
        correct: true
        why: |-
          A falling constant means the equilibrium moves left when heated, so the reverse is the endothermic direction.
      - text: The forward reaction is endothermic, because $K_c$ falls as the temperature rises.
        why: |-
          For an endothermic forward reaction, $K$ would rise with temperature, not fall.
      - text: The reaction is catalysed, because $K_c$ changes with temperature.
        why: |-
          Catalysts never change $K$; the change here is caused by temperature alone.
      - text: Nothing can be deduced without knowing the pressure.
        why: |-
          $K_c$ depends only on temperature, so the variation with temperature is enough to determine the sign of $\Delta H$.
    explanation: |-
      $K_c$ decreases as temperature increases, so heating favours the reverse reaction, making the forward reaction exothermic.

  - id: eq9-cloze-catalyst
    format: cloze
    difficulty: 2
    objectives: ["7.1.9"]
    prompt: |-
      Adding a catalyst to a system at equilibrium increases the {{1}} of both the forward and the reverse reaction, so equilibrium is reached {{2}}. The value of the equilibrium constant is {{3}}, because it depends only on {{4}}.
    blanks:
      - accept: [rate, rates, speed]
      - accept: [sooner, faster, more quickly, quicker]
      - accept: [unchanged, the same, constant, not affected, unaffected]
      - accept: [temperature]
    explanation: |-
      A catalyst changes only the rate and the time taken, leaving the constant untouched because $K$ depends solely on temperature.

  - id: eq9-mcq-pressure-k
    format: mcq
    difficulty: 3
    objectives: ["7.1.9"]
    prompt: |-
      The pressure on the equilibrium $\text{N}_2(g) + 3\text{H}_2(g) \rightleftharpoons 2\text{NH}_3(g)$ is increased at constant temperature. The yield of ammonia rises. What happens to $K_p$?
    options:
      - text: It is unchanged, because $K_p$ depends only on temperature.
        correct: true
        why: |-
          The new mixture satisfies exactly the same value of $K_p$; only the partial pressures have changed.
      - text: It increases, because the yield of ammonia increases.
        why: |-
          Yield and $K_p$ are different things; a higher yield at the same temperature is produced by the pressure change, not by a change in the constant.
      - text: It decreases, because the total pressure is in the denominator.
        why: |-
          The total pressure does not appear in a $K_p$ expression; only the individual partial pressures do.
      - text: It increases because the equilibrium shifts to the side with fewer gas molecules.
        why: |-
          The shift is real, but it restores the same ratio, so the constant is unchanged.
    explanation: |-
      A pressure change alters the composition of the equilibrium mixture without altering the constant, which is fixed by the temperature.

  - id: eq9-spot-error
    format: spot-error
    difficulty: 3
    objectives: ["7.1.9"]
    prompt: |-
      A student answers a question about the effect of adding a catalyst. Which line contains the first error?
    lines:
      - A catalyst provides an alternative reaction pathway with a lower activation energy.
      - This means the mixture reaches equilibrium more quickly at the same temperature.
      - Because the forward reaction speeds up, the value of $K_c$ increases.
      - The position of equilibrium, however, is unchanged.
    errorLine: 3
    fix: |-
      The catalyst lowers the activation energy for the **forward and reverse** reactions equally, so $K_c$ does **not** change. Line 4 is correct.
    explanation: |-
      Lines 1 and 2 are correct, so line 3 is the first error: it links a rate effect to the value of the constant.

  - id: eq9-explain
    format: explain
    difficulty: 3
    objectives: ["7.1.9"]
    prompt: |-
      Explain why increasing the pressure on a gas-phase equilibrium can change the composition of the mixture without changing the value of $K_p$.
    model: |-
      Increasing the pressure compresses the mixture, so every partial pressure rises and the system is no longer at equilibrium. The reaction that produces fewer gas molecules is then favoured, because it reduces the total number of molecules and so reduces the pressure, in accordance with Le Chatelier's principle. As that reaction proceeds, the partial pressures adjust until the ratio defined by $K_p$ is restored. Because $K_p$ depends only on temperature, and the temperature has not changed, the final mixture must satisfy exactly the same value of $K_p$ as before. The composition is therefore different — there is proportionally more of the product — while the constant itself is identical. The shift changes where the equilibrium sits, not the constant that defines it.
    keyPoints:
      - Compression raises all partial pressures, disturbing the ratio.
      - The system shifts towards fewer gas molecules.
      - The partial pressures adjust until the original ratio is restored.
      - $K_p$ depends only on temperature, which is unchanged.
    explanation: |-
      The position moves until the mixture again satisfies the same constant, so composition can change while $K_p$ cannot.

  - id: eq9-numeric-factor
    format: numeric
    difficulty: 2
    objectives: ["7.1.9"]
    prompt: |-
      For an endothermic forward reaction, $K_c = 0.0200$ at $400\ \text{K}$ and $K_c = 0.500$ at $500\ \text{K}$. By what factor has $K_c$ increased?
    fields:
      - label: "factor ="
        answer: 25
        tolerance: { rel: 0.02 }
    explanation: |-
      $0.500 / 0.0200 = 25$. An endothermic reaction has a larger constant at the higher temperature, as expected.
