id: chemical-formulas-predicting-ion-charges
subject: "9701"
topic: "2.3"
title: Predicting ion charges (and those Roman numerals)
summary: How to read an ion's charge from its group in the Periodic Table, how to name simple ions, and what Roman numerals like iron(III) tell you.
order: 1
minutes: 4
objectives: ["2.3.1"]
prerequisites: [atoms-electronic-configurations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.1, part (a) predicting ionic charge
    from Periodic Table position, and naming with oxidation numbers as Roman numerals).
    Calculating oxidation numbers is left to the redox topic. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can predict the charge on a simple ion from its **group** in the Periodic Table, name simple ions, and read Roman numerals such as iron(III).

  - type: explain
    title: The Periodic Table is a cheat sheet
    body: |
      Atoms of the main-group elements in this table form ions by losing or gaining electrons until they have the electronic configuration of a **noble gas**. How many electrons that takes depends only on the group.

      | group | electrons | ion charge | examples | ion name |
      | --- | --- | --- | --- | --- |
      | 1 | lose 1 | 1+ | $\text{Li}^+$, $\text{Na}^+$, $\text{K}^+$ | lithium, sodium… |
      | 2 | lose 2 | 2+ | $\text{Mg}^{2+}$, $\text{Ca}^{2+}$ | magnesium, calcium… |
      | 13 | lose 3 | 3+ | $\text{Al}^{3+}$ | aluminium |
      | 15 | gain 3 | 3− | $\text{N}^{3-}$, $\text{P}^{3-}$ | nitr**ide**, phosph**ide** |
      | 16 | gain 2 | 2− | $\text{O}^{2-}$, $\text{S}^{2-}$ | ox**ide**, sulf**ide** |
      | 17 | gain 1 | 1− | $\text{F}^-$, $\text{Cl}^-$, $\text{Br}^-$, $\text{I}^-$ | fluor**ide**, chlor**ide**… |

      - **Metals** (left) lose electrons and form **positive** ions, which keep the element's name.
      - **Non-metals** (right) gain electrons and form **negative** ions, which end in **-ide**.
      - Group 14 would need to lose or gain four electrons, which costs too much energy, so carbon and silicon bond covalently. (Tin and lead, lower down, are metals that form 2+ ions, like lead(II), $\text{Pb}^{2+}$.) Group 18 is already a noble gas.

  - type: diagram
    diagram: chem-chemical-formulas-ion-charges
    alt: "Periods 1 to 5 of the Periodic Table with the usual ion charge written above each main group: group 1 1+, group 2 2+, group 13 3+, group 14 none (dash), group 15 3−, group 16 2−, group 17 1−, group 18 none. Groups 1 and 2 and aluminium are shaded as positive-ion formers. The non-metals N, P, O, S, Se, F, Cl, Br and I are shaded as negative-ion formers. The d-block is labelled: many metals have variable charges, shown by a Roman numeral, for example iron(III) = Fe3+. Zinc and silver are outlined as having fixed charges you must learn: Zn2+ and Ag+. A note says that in group 14 carbon and silicon bond covalently while tin and lead form 2+ ions, and group 18 forms no ions."
    caption: Count from the nearest edge of the table. Groups 1, 2, 13 lose; groups 15, 16, 17 gain.

  - type: intuition
    title: Take the shortcut to a full shell
    body: |
      Sodium ($2,8,1$) could gain seven electrons or lose one. Losing one is far cheaper, so it becomes $\text{Na}^+$ ($2,8$, like neon). Chlorine ($2,8,7$) gains one to become $\text{Cl}^-$ ($2,8,8$, like argon).

      Where it breaks: "atoms want a full shell" is a handy story, not a reason. Forming $\text{Na}^+$ on its own actually costs energy; ionic compounds form because the attraction between oppositely charged ions in the lattice releases more.

  - type: check
    title: Quick check
    questions: [group-charges-cloze, nitrogen-ion, sulfide-name]

  - type: explain
    title: Roman numerals are charges for shape-shifters
    body: |
      Many d-block metals form ions with **different** charges. The name tells you which, using a Roman numeral for the **oxidation number**, which for a simple metal ion equals its charge.

      | name | ion |
      | --- | --- |
      | iron(II) | $\text{Fe}^{2+}$ |
      | iron(III) | $\text{Fe}^{3+}$ |
      | copper(I) | $\text{Cu}^{+}$ |
      | copper(II) | $\text{Cu}^{2+}$ |
      | lead(II) | $\text{Pb}^{2+}$ |
      | chromium(III) | $\text{Cr}^{3+}$ |

      **Zinc and silver are the exceptions you must learn:** they only ever form $\text{Zn}^{2+}$ and $\text{Ag}^+$ in compounds you'll meet, so no numeral is needed. It's "zinc sulfate" and "silver nitrate", never "zinc(II) sulfate".

  - type: deeper
    title: Numerals on negative ions mean something else
    body: |
      Exam papers sometimes write **sulfate(VI)** or **nitrate(V)**. Here the numeral is the oxidation number of the **central atom** (S is +6 in $\text{SO}_4^{2-}$), not the charge on the ion. Sulfate(VI) is still $\text{SO}_4^{2-}$, with a 2− charge.

      You'll learn to calculate oxidation numbers in the redox topic. For now: on a metal, numeral = charge; on an -ate ion, numeral ≠ charge.

  - type: check
    title: Numerals
    questions: [needs-numeral, copper-one-oxide, sulfate-six]

  - type: misconceptions
    items:
      - wrong: "Chlorine forms $\\text{Cl}^{7+}$ by losing its 7 outer electrons."
        right: "Gaining 1 is far easier than losing 7: chloride is $\\text{Cl}^-$."
      - wrong: "Iron(III) means three iron atoms."
        right: "The numeral is the **charge** on each iron ion: iron(III) is $\\text{Fe}^{3+}$. How many there are comes from the formula."
      - wrong: "Sulfate(VI) has a 6− charge."
        right: "The VI is sulfur's oxidation number. The sulfate ion is $\\text{SO}_4^{2-}$."
      - wrong: "The ion of oxygen is called oxygen."
        right: "Simple negative ions end in **-ide**: oxide, sulfide, chloride, nitride."

  - type: exam
    body: |
      - Write charges with the number **before** the sign: $\text{Ca}^{2+}$, $\text{O}^{2-}$. "Ca+2" is a common slip that some markers won't accept.
      - When a formula is given and you must **name** it, work out the metal's charge from the anion, then add the numeral: $\text{FeCl}_3$ → three $\text{Cl}^-$ → $\text{Fe}^{3+}$ → iron(III) chloride.
      - Don't put a numeral on zinc, silver or main-group metals. "Sodium(I) chloride" is technically not wrong, but it looks like you're guessing.

  - type: takeaways
    items:
      - "Groups 1, 2, 13 (Al) lose electrons: 1+, 2+, 3+. Groups 15, 16, 17 gain: 3−, 2−, 1−."
      - "Simple negative ions end in -ide: oxide, nitride, chloride."
      - "A Roman numeral on a metal is its ion charge: iron(III) = $\\text{Fe}^{3+}$."
      - "Zinc is always $\\text{Zn}^{2+}$ and silver always $\\text{Ag}^+$: no numeral needed."

questions:
  - id: group-charges-cloze
    format: cloze
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Elements in group 2 form ions with a charge of {{1}}. Elements in group 16 form ions with a charge of {{2}}.
    blanks:
      - accept: ["2+", "+2", "2 +", "plus 2", "two plus"]
      - accept: ["2−", "2-", "-2", "−2", "minus 2", "two minus"]
    explanation: |
      Group 2 loses its two outer electrons (e.g. $\text{Mg}^{2+}$); group 16 gains two (e.g. $\text{O}^{2-}$).

  - id: nitrogen-ion
    format: mcq
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Nitrogen is in group 15. What is the formula of the nitride ion?
    options:
      - text: |
          $\text{N}^{3-}$
        correct: true
        why: |
          Nitrogen ($2,5$) gains three electrons to reach the neon configuration.
      - text: |
          $\text{N}^{3+}$
        why: |
          Non-metals gain electrons, so the charge is negative.
      - text: |
          $\text{N}^{5+}$
        why: |
          Losing all five outer electrons would cost far too much energy.
      - text: |
          $\text{N}^{-}$
        why: |
          Group 17 elements form 1− ions. Group 15 needs three more electrons.
    explanation: |
      Group 15: gain 3 electrons → 3− ion. Nitride is $\text{N}^{3-}$.

  - id: sulfide-name
    format: text
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Name the ion $\text{S}^{2-}$.
    accept: ["sulfide", "sulfide ion", "sulphide", "sulphide ion", "a sulfide ion"]
    model: |
      Sulfide (simple negative ions end in **-ide**).
    explanation: |
      $\text{S}^{2-}$ is a single sulfur atom with two extra electrons: sulfide. (Not sulfate, which is $\text{SO}_4^{2-}$.)

  - id: needs-numeral
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Which compound name is **incomplete** without a Roman numeral?
    options:
      - text: |
          zinc chloride
        why: |
          Zinc only forms $\text{Zn}^{2+}$, so there's nothing to specify.
      - text: |
          silver nitrate
        why: |
          Silver only forms $\text{Ag}^+$ here, so no numeral is needed.
      - text: |
          iron chloride
        correct: true
        why: |
          Iron forms both $\text{Fe}^{2+}$ and $\text{Fe}^{3+}$. Iron(II) chloride, $\text{FeCl}_2$, and iron(III) chloride, $\text{FeCl}_3$, are different compounds.
      - text: |
          magnesium oxide
        why: |
          Group 2 metals only form 2+ ions.
    explanation: |
      Numerals are needed only for metals with more than one possible charge, like iron and copper.

  - id: copper-one-oxide
    format: text
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Give the name of the compound $\text{Cu}_2\text{O}$, including the Roman numeral.
    accept:
      - "copper(I) oxide"
      - "copper (I) oxide"
      - "copper I oxide"
      - "copper(I)oxide"
    model: |
      Copper(I) oxide.
    explanation: |
      One $\text{O}^{2-}$ carries 2−, shared between two copper ions, so each copper is $\text{Cu}^+$: copper(I) oxide.

  - id: sulfate-six
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      A bottle is labelled "sodium sulfate(VI)". What does the (VI) tell you?
    options:
      - text: |
          The sulfate ion has a charge of 6−.
        why: |
          The sulfate ion is $\text{SO}_4^{2-}$. The numeral isn't its charge.
      - text: |
          The oxidation number of sulfur in the ion is +6.
        correct: true
        why: |
          On an -ate ion, the numeral is the oxidation number of the central atom.
      - text: |
          Each sulfate ion contains six oxygen atoms.
        why: |
          Sulfate has four oxygen atoms: $\text{SO}_4^{2-}$.
      - text: |
          There are six sodium ions per sulfate ion.
        why: |
          Sodium sulfate is $\text{Na}_2\text{SO}_4$: two $\text{Na}^+$ balance one $\text{SO}_4^{2-}$.
    explanation: |
      Sulfate(VI) is just sulfate, $\text{SO}_4^{2-}$; the VI is sulfur's oxidation number (+6).
