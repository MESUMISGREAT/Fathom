id: shapes-molecules-bigger-molecules
subject: "9701"
topic: "3.5"
title: "Shapes with double bonds and more than one centre"
summary: Count a double or triple bond as one region and work out the shape around each central atom in turn, as in C₂H₄, C₂H₆, HCN, SO₂ and CH₃OH.
order: 4
minutes: 5
objectives: ["3.5.2", "3.5.1"]
prerequisites: [shapes-molecules-predicting-shapes, covalent-bonding-hybridisation]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.5, learning outcomes 2 and 1: predicting shapes and angles
    in molecules with multiple bonds and several central atoms). Angles quoted are VSEPR
    predictions by analogy with the 3.5.1 examples. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can predict the shape and bond angles around **each** central atom in molecules with double or triple bonds, such as $\text{C}_2\text{H}_4$, $\text{HCN}$, $\text{SO}_2$ and $\text{CH}_3\text{OH}$.

  - type: explain
    title: Big molecules have a shape at every atom
    body: |
      Ethanol doesn't have "a" shape the way water does. It has a shape around **each** C and around the O.

      So work one atom at a time: treat each atom with two or more neighbours as a centre, and run VSEPR on it.

  - type: explain
    title: Rule for multiple bonds
    body: |
      A **double** or **triple** bond counts as **one region** of electron density. All its electrons sit between the same two atoms, pointing the same way.

      So you count **regions**, not electrons:

      | regions around the atom | lone pairs | shape there | VSEPR-predicted angle |
      | --- | --- | --- | --- |
      | 2 | 0 | linear | 180° |
      | 3 | 0 | trigonal planar | 120° |
      | 4 | 0 | tetrahedral | 109.5° |
      | 4 | 2 | non-linear | 104.5° |

      The angles in these tables are idealized VSEPR predictions, not exact measured values for every molecule.

  - type: check
    title: Quick check
    questions: [region-cloze]

  - type: diagram
    diagram: chem-shapes-molecules-several-centres
    alt: "Three molecules. Ethane, C2H6: two carbons joined by a single bond, each with three hydrogens drawn with a line, a solid wedge and a hashed wedge; tetrahedral around each C, 109.5 degrees. Ethene, C2H4: two carbons joined by a double bond, each with two hydrogens at 120 degrees in a flat drawing; trigonal planar around each C, 120 degrees, flat molecule. Hydrogen cyanide: H–C≡N in a straight line, 180 degrees; linear around C. Note at the bottom: a double or triple bond counts as one bonding region."
    caption: |
      Single bonds only: tetrahedral carbon. One double bond: flat carbon. A triple bond: straight carbon.

  - type: explain
    title: The hydrocarbons and HCN
    body: |
      | molecule | centre | regions | shape at that atom | angle |
      | --- | --- | --- | --- | --- |
      | $\text{C}_2\text{H}_6$ | each C | 4 single bonds | tetrahedral | 109.5° |
      | $\text{C}_2\text{H}_4$ | each C | 2 C–H + C=C = 3 | trigonal planar | 120° |
      | $\text{HCN}$ | C | C–H + C≡N = 2 | linear | 180° |

      In ethene both carbons are trigonal planar **and** in the same plane, so the whole molecule is **flat**.

  - type: explain
    title: Same idea, same hybrid
    body: |
      The regions you count here match the hybridisation from topic 3.4: 4 regions ↔ **sp³**, 3 ↔ **sp²**, 2 ↔ **sp**. Ethane's carbons are sp³, ethene's are sp², HCN's carbon is sp.

  - type: check
    title: Around each carbon
    questions: [ethene-angle, hcn-angle, flat-molecule]

  - type: example
    title: Methanol, CH₃OH
    problem: |
      Predict the H–C–H and C–O–H bond angles in methanol, $\text{CH}_3\text{OH}$.
    steps:
      - |
        **Around C**: bonds to 3 H and to O, no lone pairs → 4 bonding pairs → tetrahedral, H–C–H **109.5°**.
      - |
        **Around O**: O has 6 outer electrons; it bonds to C and to H, using 2 → 4 left = **2 lone pairs**.
      - |
        2 bonding pairs + 2 lone pairs → like water: non-linear, C–O–H **104.5°**.
    answer: |
      H–C–H about 109.5°; C–O–H about 104.5°.

  - type: example
    title: Sulfur dioxide, SO₂
    problem: |
      Predict the shape of $\text{SO}_2$ ($\text{O}{=}\text{S}{=}\text{O}$, one lone pair on S).
    steps:
      - |
        Regions around S: 2 double bonds (one region each) + 1 lone pair = **3**.
      - |
        3 regions → the pairs spread out in a flat triangle, about 120° apart.
      - |
        Only two of the regions have atoms on them, so the shape is a V: **non-linear**.
      - |
        The lone pair repels more than the bonding regions, so O–S–O is **just under 120°**.
    answer: |
      Non-linear (bent), just under 120°. Compare $\text{CO}_2$: no lone pair on C, so linear.

  - type: check
    title: Double bonds and lone pairs
    questions: [methanol-angles, so2-shape]

  - type: misconceptions
    items:
      - wrong: "A double bond counts as two regions, so the C in $\\text{CO}_2$ has 4 regions and is tetrahedral."
        right: "Each double bond is **one** region. C in $\\text{CO}_2$ has 2 → linear, 180°."
      - wrong: "$\\text{SO}_2$ is linear, just like $\\text{CO}_2$."
        right: "S has a lone pair; C in $\\text{CO}_2$ doesn't. That lone pair bends $\\text{SO}_2$."
      - wrong: "Ethene's H–C–H angle is 109.5° because carbon is always tetrahedral."
        right: "Carbon is tetrahedral only with 4 regions. In ethene each C has 3 regions: trigonal planar, 120°."

  - type: exam
    body: |
      - In a big molecule, always say **which atom** you mean: "the bond angle around the O atom is 104.5°".
      - Shape answers for organic molecules: carbon with only single bonds is **tetrahedral**, carbon in C=C is **trigonal planar**, carbon in C≡C or C≡N is **linear**.

  - type: takeaways
    items:
      - "Work out the shape around each central atom separately."
      - "A double or triple bond counts as one region."
      - "C₂H₆: tetrahedral C, 109.5°. C₂H₄: trigonal planar C, 120°, flat. HCN: linear, 180°."
      - "SO₂: non-linear (lone pair on S); CH₃OH: 109.5° at C, about 104.5° at O."

questions:
  - id: region-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      In VSEPR theory a double bond counts as {{1}} region of electron density, so the carbon atom in $\text{CO}_2$ has {{2}} regions and the molecule is linear.
    blanks:
      - accept: ["one", "1", "a single"]
      - accept: ["two", "2"]
    explanation: |
      Both electron pairs of a double bond lie between the same two atoms, so they act as one region. C in $\text{CO}_2$: two double bonds → 2 regions → 180°.

  - id: ethene-angle
    format: mcq
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      What is the VSEPR-predicted H–C–H bond angle in ethene, $\text{C}_2\text{H}_4$?
    options:
      - text: 90°
        why: |
          90° appears in octahedral and trigonal bipyramidal shapes, not around a carbon with 3 regions.
      - text: 109.5°
        why: |
          That's for carbon with 4 single bonds (as in ethane). Ethene's carbons have only 3 regions.
      - text: 120°
        correct: true
        why: |
          Two C–H bonds + one C=C (one region) = 3 regions, no lone pairs → trigonal planar, 120°.
      - text: 180°
        why: |
          180° needs only 2 regions, as in HCN.
    explanation: |
      Count the C=C as one region: 3 regions around each carbon → 120°.

  - id: hcn-angle
    format: numeric
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      What is the VSEPR-predicted H–C–N bond angle in hydrogen cyanide, $\text{H}{-}\text{C}{\equiv}\text{N}$?
    fields:
      - answer: 180
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      C has two regions (C–H and C≡N) and no lone pairs → linear, 180°.

  - id: flat-molecule
    format: mcq
    difficulty: 2
    objectives: ["3.5.2"]
    prompt: |
      In which molecule do **all** the atoms lie in the same plane?
    options:
      - text: |
          $\text{C}_2\text{H}_6$
        why: |
          Each C is tetrahedral, so the H atoms stick out in 3D.
      - text: |
          $\text{C}_2\text{H}_4$
        correct: true
        why: |
          Both carbons are trigonal planar and share the same plane, so all six atoms are flat.
      - text: |
          $\text{CH}_4$
        why: |
          Tetrahedral: no plane holds all five atoms.
      - text: |
          $\text{NH}_3$
        why: |
          Pyramidal: the N sits above the plane of the three H atoms.
    explanation: |
      Trigonal planar centres give flat molecules. Ethene is the classic example.

  - id: methanol-angles
    format: numeric
    difficulty: 2
    objectives: ["3.5.2"]
    prompt: |
      Use VSEPR theory to predict these bond angles in methanol, $\text{CH}_3\text{OH}$:
    fields:
      - label: "H–C–H ="
        answer: 109.5
        tolerance: { abs: 0.5 }
        unit: "°"
      - label: "C–O–H ="
        answer: 104.5
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      C: 4 bonding pairs → tetrahedral, 109.5°. O: 2 bonding pairs + 2 lone pairs → like water, 104.5°.

  - id: so2-shape
    format: mcq
    difficulty: 3
    objectives: ["3.5.2", "3.5.1"]
    prompt: |
      $\text{CO}_2$ is linear. What is the shape of $\text{SO}_2$ ($\text{O}{=}\text{S}{=}\text{O}$ with one lone pair on S)?
    options:
      - text: Linear, like $\text{CO}_2$
        why: |
          That ignores the lone pair on S. C in $\text{CO}_2$ has no lone pair; S in $\text{SO}_2$ does.
      - text: Trigonal planar
        why: |
          The three regions are arranged in a triangle, but only two have atoms on them. The shape is named from the atoms.
      - text: Non-linear (bent)
        correct: true
        why: |
          2 double bonds + 1 lone pair = 3 regions; with atoms on only two of them, the molecule is bent, just under 120°.
      - text: Pyramidal
        why: |
          Pyramidal needs 3 bonded atoms and a lone pair around the centre, like $\text{NH}_3$.
    explanation: |
      Count regions (2 double bonds + 1 lone pair = 3), then name the shape from the atoms: non-linear.
