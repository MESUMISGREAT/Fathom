id: atoms-particles-in-the-atom
subject: "9701"
topic: "1.1"
title: Protons, neutrons and electrons
summary: What an atom is made of, where its mass and charge are, and how to count protons, neutrons and electrons in any atom or ion.
order: 1
minutes: 5
objectives: ["1.1.1", "1.1.2", "1.1.3", "1.1.4", "1.1.6"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.1, learning outcomes 1-4 and 6). Particle masses are the
    standard values (proton/electron mass ratio 1836). Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe what's inside an atom, give the relative mass and charge of a proton, neutron and electron, and count all three in any atom or ion.

  - type: explain
    title: An atom is mostly nothing
    body: |
      An atom is **mostly empty space**.

      - At the centre is a **nucleus**: very small, very dense, made of **protons** and **neutrons**.
      - The **electrons** are found in **shells** in the empty space around the nucleus.
      - The nucleus is around 10 000 to 100 000 times smaller across than the whole atom.

      If an atom were a football stadium, the nucleus would be a pea on the centre spot. Everything else is electrons and a lot of nothing.

  - type: explain
    title: The three particles
    body: |
      | particle | where it is | relative mass | relative charge |
      | --- | --- | --- | --- |
      | proton | nucleus | 1 | +1 |
      | neutron | nucleus | 1 | 0 |
      | electron | shells around the nucleus | 1/1836 | −1 |

      The electron's mass is tiny (you'll also see 1/1840), but it is **not zero**.

  - type: explain
    title: Where the mass and charge are
    body: |
      - **Mass:** protons and neutrons are each about 1836 times heavier than an electron, so almost all of the atom's mass is in the nucleus.
      - **Positive charge:** all of it is in the nucleus (the protons).
      - **Negative charge:** spread through the space around the nucleus (the electrons).
      - A neutral atom has equal numbers of protons and electrons, so the charges cancel.

  - type: definition
    term: Atomic number (proton number), Z
    body: |
      The number of protons in the nucleus of an atom.

  - type: definition
    term: Mass number (nucleon number), A
    body: |
      The total number of protons and neutrons (nucleons) in the nucleus of an atom.

  - type: check
    title: Quick check
    questions: [distribution, particle-facts, number-names]

  - type: explain
    title: Counting particles in atoms and ions
    body: |
      Three rules, and they work for everything:

      1. **protons** = atomic number, Z
      2. **neutrons** = mass number − atomic number = A − Z
      3. **electrons** = Z − (charge on the ion)

      An ion forms by **gaining or losing electrons only**. The nucleus doesn't change, so the protons and neutrons stay the same.

      - a 2+ ion has **two fewer** electrons than the atom
      - a 3− ion has **three more** electrons than the atom

  - type: example
    title: Two ions, step by step
    problem: |
      How many protons, neutrons and electrons are in ${}^{56}_{26}\text{Fe}^{3+}$ and in ${}^{32}_{16}\text{S}^{2-}$?
    steps:
      - |
        Read the numbers. For iron, A = 56 and Z = 26; the charge is 3+. For sulfur, A = 32 and Z = 16; the charge is 2−.
      - |
        Protons = Z. Iron has **26** protons; sulfur has **16**.
      - |
        Neutrons = A − Z. Iron: 56 − 26 = **30**. Sulfur: 32 − 16 = **16**.
      - |
        Electrons = Z − charge. Iron: 26 − 3 = **23** (it lost three). Sulfur: 16 − (−2) = **18** (it gained two).
    answer: |
      Fe³⁺: 26 p, 30 n, 23 e⁻. S²⁻: 16 p, 16 n, 18 e⁻.

  - type: check
    title: Count them
    questions: [count-selenide, mass-number-from-ion, potassium-ion-error]

  - type: misconceptions
    items:
      - wrong: "Forming an ion changes the number of protons."
        right: "Only electrons are gained or lost. Change the protons and you've changed the element."
      - wrong: "The electron has a relative mass of 0."
        right: "It's 1/1836: negligible next to a proton, but not zero."
      - wrong: "A positive ion has gained positive charge, so it has extra protons."
        right: "A positive ion has **lost electrons**, so protons now outnumber electrons."

  - type: exam
    body: |
      - Expect "complete the table" questions (relative mass and charge) and "deduce the numbers of protons, neutrons and electrons" in Papers 1 and 2.
      - Give the electron's relative mass as 1/1836 (or 1/1840). Writing 0 is wrong.
      - Write charges with a sign: +1 and −1, not just 1.
      - For ions, check your electron count against the charge: electrons should equal protons minus the charge.

  - type: takeaways
    items:
      - "The atom is mostly empty space; a tiny, dense nucleus holds the protons and neutrons, and the electrons are in shells around it."
      - "Relative mass: p = 1, n = 1, e = 1/1836. Relative charge: p = +1, n = 0, e = −1."
      - "Almost all the mass and all the positive charge are in the nucleus."
      - "Protons = Z, neutrons = A − Z, electrons = Z − charge."

questions:
  - id: distribution
    format: mcq
    difficulty: 1
    objectives: ["1.1.1", "1.1.4"]
    prompt: |
      Which statement best describes how mass and charge are distributed in an atom?
    options:
      - text: |
          The mass is spread evenly through the atom, with electrons dotted through a sphere of positive charge.
        why: |
          That's the old "plum pudding" model. Experiments showed the positive charge and mass are concentrated in a tiny nucleus.
      - text: |
          Most of the mass is in the electron shells, because they take up most of the volume.
        why: |
          Volume isn't mass. The shells take up the space, but electrons are about 1/1836 of the mass of a proton.
      - text: |
          The nucleus holds both the positive and the negative charge, and the electron shells are neutral.
        why: |
          The nucleus holds only positive charge (protons) and neutral neutrons; the negative charge belongs to the electrons outside it.
      - text: |
          Almost all the mass and all the positive charge are in a tiny nucleus; the negative charge is spread through the space around it.
        correct: true
        why: |
          Protons and neutrons (both in the nucleus) carry nearly all the mass, and the electrons carry the negative charge in the shells around it.
    explanation: |
      Mass and positive charge sit in the nucleus; negative charge (the electrons) is spread out around it in mostly empty space.

  - id: particle-facts
    format: mcq
    difficulty: 1
    objectives: ["1.1.2"]
    prompt: |
      Which statement about the particles in an atom is correct?
    options:
      - text: |
          Protons and electrons have the same relative mass but opposite charges.
        why: |
          Their charges are equal and opposite (+1 and −1), but an electron's mass is only 1/1836 of a proton's.
      - text: |
          The electron has relative mass 0 and relative charge −1.
        why: |
          The charge is right, but the mass is 1/1836, not 0.
      - text: |
          The neutron has relative mass 1 and relative charge 0.
        correct: true
        why: |
          Neutrons have about the same mass as protons and no charge.
      - text: |
          The proton has relative mass 1 and relative charge −1.
        why: |
          Protons are positive: relative charge +1.
    explanation: |
      Relative masses: proton 1, neutron 1, electron 1/1836. Relative charges: +1, 0, −1.

  - id: number-names
    format: cloze
    difficulty: 1
    objectives: ["1.1.3"]
    prompt: |
      The number of protons in the nucleus is the atomic number, also called the {{1}} number. The total number of protons and neutrons is the mass number, also called the {{2}} number.
    blanks:
      - accept: ["proton"]
      - accept: ["nucleon"]
    explanation: |
      Atomic number = proton number (Z). Mass number = nucleon number (A), because protons and neutrons together are called nucleons.

  - id: count-selenide
    format: numeric
    difficulty: 2
    objectives: ["1.1.6"]
    prompt: |
      How many protons, neutrons and electrons are in one ${}^{79}_{34}\text{Se}^{2-}$ ion?
    fields:
      - label: "protons ="
        answer: 34
      - label: "neutrons ="
        answer: 45
      - label: "electrons ="
        answer: 36
    explanation: |
      Protons = Z = 34. Neutrons = 79 − 34 = 45. A 2− ion has gained two electrons: 34 + 2 = 36.

  - id: mass-number-from-ion
    format: numeric
    difficulty: 2
    objectives: ["1.1.6"]
    prompt: |
      An ion $\text{X}^{3+}$ has 10 electrons and 14 neutrons. What is the mass number of X?
    fields:
      - answer: 27
    explanation: |
      A 3+ ion has lost three electrons, so the atom had 10 + 3 = 13 electrons and therefore 13 protons. Mass number = 13 + 14 = 27. (X is aluminium.)

  - id: potassium-ion-error
    format: spot-error
    difficulty: 2
    objectives: ["1.1.6"]
    prompt: |
      A student works out the particles in ${}^{39}_{19}\text{K}^{+}$. Which line contains the first error?
    lines:
      - "The proton number is 19, so there are 19 protons."
      - "Neutrons = 39 − 19 = 20."
      - "The ion has a 1+ charge, so it has one more electron than the atom: 20 electrons."
      - "So K⁺ has 19 protons, 20 neutrons and 20 electrons."
    errorLine: 3
    fix: |
      A 1+ ion has **lost** one electron, so it has 19 − 1 = 18 electrons.
    explanation: |
      Positive ions form by losing electrons. K⁺ has 19 protons, 20 neutrons and 18 electrons.
