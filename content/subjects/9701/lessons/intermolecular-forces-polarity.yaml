blocks:
  - type: objective
    body: By the end, you can use electronegativity to explain bond polarity and decide whether a molecule has an overall dipole.
  - type: explain
    title: Who pulls the shared pair harder?
    body: |
      **Electronegativity** is an atom's ability to attract the shared pair of electrons in a covalent bond. If one atom attracts the pair more strongly, the electrons spend more time nearer it.

      That end becomes slightly negative, written δ−; the other end becomes slightly positive, written δ+. The bond is **polar**.
  - type: example
    title: Compare two molecules
    problem: Decide whether CO₂ and H₂O have an overall molecular dipole.
    steps:
      - Oxygen attracts each C=O or O–H bonding pair more strongly, so those bonds are polar.
      - CO₂ is straight. Its two equal C=O bond dipoles point in opposite directions and cancel.
      - H₂O is bent. Its two O–H dipoles do not point in opposite directions, so they do not cancel.
      - "Add the bond dipoles as arrows: cancellation means no overall dipole; a leftover means the molecule has one."
    answer: CO₂ has polar bonds but no overall molecular dipole; H₂O has an overall dipole.
  - type: diagram
    diagram: chem-intermolecular-forces-molecular-dipoles
    alt: Straight CO₂ has two equal C=O dipole arrows pointing in opposite directions and cancelling; bent H₂O has two O–H arrows that do not cancel, leaving an overall dipole toward oxygen.
    caption: Dipole arrows point toward the more electronegative, slightly negative end.
  - type: check
    title: Bond or molecule?
    questions: ["polarity-electronegativity", "polarity-co2"]
  - type: explain
    title: A dipole is about the whole shape
    body: |
      A **bond dipole** belongs to one polar bond. A **molecular dipole** is the combined effect of all the bond dipoles in the molecule.

      This overall separation of charge is the molecule's **dipole moment**.

      Do not stop after spotting a polar bond: check the shape. Equal bond dipoles may cancel in a symmetrical arrangement; an uneven arrangement may leave an overall dipole.
  - type: check
    title: Predict the overall dipole
    questions: ["polarity-water", "polarity-bond-vs-molecule"]
  - type: misconceptions
    items:
      - wrong: A molecule with polar bonds must have an overall dipole.
        right: Bond dipoles can cancel, as they do in straight CO₂.
      - wrong: δ− means the atom has gained a whole electron.
        right: δ− marks a partial negative charge because bonding electrons are shared unevenly.
  - type: exam
    body: "Link the reasoning in order: difference in electronegativity → unequal sharing → partial charges and a bond dipole. Then use the molecule's shape to say whether its bond dipoles cancel."
  - type: takeaways
    items:
      - Electronegativity tells how strongly an atom attracts a shared bonding pair.
      - Unequal sharing makes a polar bond with δ+ and δ− ends.
      - A molecule has an overall dipole only if its bond dipoles do not cancel.
questions:
  - id: polarity-electronegativity
    format: cloze
    difficulty: 1
    objectives: ["3.6.2"]
    prompt: The atom that attracts a shared pair more strongly has a {{1}} electronegativity and becomes slightly {{2}}.
    blanks:
      - accept: ["higher", "greater"]
      - accept: ["negative", "negatively charged", "δ−"]
    explanation: The shared electrons spend more time near the more electronegative atom, giving it a partial negative charge.
  - id: polarity-co2
    format: mcq
    difficulty: 2
    objectives: ["3.6.2"]
    prompt: Each C=O bond in CO₂ is polar. Why does straight CO₂ have no overall molecular dipole?
    options:
      - text: Its equal bond dipoles point in opposite directions and cancel.
        correct: true
        why: The two oxygen atoms pull equally in opposite directions.
      - text: Its C=O bonds are not polar after all.
        why: Oxygen is more electronegative than carbon, so each bond is polar.
      - text: Its atoms have no electrons to share.
        why: CO₂ has covalent bonds with shared electrons.
      - text: The molecule is charged overall.
        why: CO₂ is neutral; symmetry explains the cancellation.
    explanation: Bond dipoles can cancel when equal arrows point in opposite directions.
  - id: polarity-water
    format: mcq
    difficulty: 2
    objectives: ["3.6.2"]
    prompt: Water is bent and has two polar O–H bonds. What follows?
    options:
      - text: The bond dipoles do not cancel, so water has an overall dipole.
        correct: true
        why: The bent shape means the two arrows are not opposite.
      - text: The O–H bonds are non-polar because water is neutral.
        why: A neutral molecule can still have polar bonds and partial charges.
      - text: The bond dipoles cancel because there are two.
        why: Cancellation depends on arrow direction and size, not just the number of bonds.
      - text: Oxygen has a full positive charge.
        why: Oxygen has a partial negative charge, not a full ionic charge.
    explanation: The bent shape keeps the two bond dipoles from cancelling.
  - id: polarity-bond-vs-molecule
    format: mcq
    difficulty: 3
    objectives: ["3.6.2"]
    prompt: Which statement distinguishes a bond dipole from a molecular dipole?
    options:
      - text: A bond dipole describes uneven sharing in one bond; a molecular dipole is the combined effect across the molecule.
        correct: true
        why: The whole-molecule dipole depends on all bond dipoles and the shape.
      - text: A bond dipole is a full ion; a molecular dipole is a covalent bond.
        why: Dipoles describe partial charges and their overall arrangement.
      - text: Every polar bond guarantees a molecular dipole.
        why: Bond dipoles can cancel in a symmetrical molecule.
      - text: A molecular dipole exists only if all atoms have the same electronegativity.
        why: Equal electronegativity would not create polar bonds.
    explanation: A molecular dipole is the net result after considering all bond dipoles and molecular shape.
