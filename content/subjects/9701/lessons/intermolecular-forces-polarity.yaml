id: intermolecular-forces-polarity
subject: "9701"
topic: "3.6"
title: Polar bonds and whole-molecule dipoles
summary: Use electronegativity and molecular shape to decide whether a bond or molecule has a dipole.
order: 4
minutes: 4
objectives: ["3.6.2"]
prerequisites: [intermolecular-forces-types]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.6 learning outcome 2. All questions are original; diagrams are schematic and use no measured data.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
