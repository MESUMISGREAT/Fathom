id: dot-cross-coordinate-bonds
subject: "9701"
topic: "3.7"
title: When one atom supplies both bonding electrons
summary: Show coordinate bonds from nitrogen in ammonium and from chlorine in aluminium chloride dimer.
order: 4
minutes: 4
objectives: ["3.7.1"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.7 learning outcome 1, including NH₄⁺ and Al₂Cl₆ from 3.4. All questions are original; no illustrative data are used.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
