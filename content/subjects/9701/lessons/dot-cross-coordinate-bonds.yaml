blocks:
  - type: objective
    body: By the end, you can show where both electrons in a coordinate bond came from.
  - type: explain
    title: A shared pair with one donor
    body: |
      In an ordinary covalent bond, each atom supplies one electron to the shared pair. In a **coordinate (dative covalent) bond**, one atom supplies both electrons in the shared pair.

      After the bond forms, it is still a covalent bond. The dots and crosses just let us trace where the pair started.

      A **lone pair** is two outer-shell electrons on one atom that are not shared in a bond.
  - type: example
    title: Ammonia makes ammonium
    problem: Ammonia gas reacts with hydrogen chloride gas to form ammonium chloride. Show how nitrogen's lone pair forms the new N–H bond.
    steps:
      - Nitrogen in NH₃ has a lone pair available to donate.
      - The hydrogen in HCl is slightly positive, so it can accept a lone pair from nitrogen.
      - Nitrogen donates its lone pair to that hydrogen. The H–Cl bonding pair moves to chlorine, forming Cl⁻.
      - "Write the product as NH₄Cl(s): it contains [NH₄]⁺ and Cl⁻. Both electrons in the new N–H bond came from nitrogen."
    answer: |
      NH₃(g) + HCl(g) → NH₄Cl(s). The new N–H bond in [NH₄]⁺ is coordinate because nitrogen supplied both electrons.
  - type: diagram
    diagram: chem-dot-cross-coordinate
    alt: The sketch isolates ammonia nitrogen donating its lone pair to H⁺ to make an N–H bond in bracketed NH₄⁺; both electrons in that new bond are marked as coming from nitrogen, and chloride is not shown.
    caption: The sketch isolates the new N–H bond; in the syllabus reaction, chloride is the counter-ion. All four N–H bonds in NH₄⁺ are equivalent.
  - type: check
    title: Track the donated pair
    questions: ["dot-coordinate-donor", "dot-coordinate-ammonium"]
  - type: explain
    title: "Another syllabus example: Al₂Cl₆"
    body: |
      Aluminium chloride molecules can join to form Al₂Cl₆. In the dimer, each bridging chlorine donates a lone pair to an electron-deficient aluminium atom, making coordinate bonds.

      In a dot-and-cross drawing, show the donated pair with both marks from the chlorine donor. The rest of the structure contains ordinary covalent Al–Cl bonds.
  - type: check
    title: Check the second example
    questions: ["dot-coordinate-alcl3", "dot-coordinate-drawing"]
  - type: misconceptions
    items:
      - wrong: A coordinate bond is not covalent because only one atom supplies the pair.
        right: It is a covalent bond; the name tells us both shared electrons came from one atom.
      - wrong: The donated pair vanishes after the bond forms.
        right: The pair remains shared; the donor marks show its origin in the diagram.
  - type: exam
    body: For a coordinate bond, identify the lone-pair donor and the atom or ion accepting it. Show both electrons in the shared pair as belonging to the donor before bonding, and bracket any polyatomic ion with its charge.
  - type: takeaways
    items:
      - A coordinate bond is a covalent bond whose shared pair comes from one donor atom.
      - Nitrogen donates a lone pair to hydrogen when NH₃ reacts with HCl to form NH₄Cl.
      - Bridging chlorine lone pairs donate to aluminium in Al₂Cl₆.
questions:
  - id: dot-coordinate-donor
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: In a coordinate bond, how many atoms supply electrons to the shared pair?
    options:
      - text: One atom supplies both electrons.
        correct: true
        why: That is what makes the bond coordinate (dative covalent).
      - text: Each atom supplies one electron.
        why: That describes an ordinary covalent bond.
      - text: No atom supplies electrons.
        why: A shared pair is made of electrons donated by an atom or atoms.
      - text: Three atoms supply one electron each.
        why: A shared pair contains two electrons, supplied by one donor atom here.
    explanation: A coordinate bond forms when one atom donates a lone pair to share with an acceptor.
  - id: dot-coordinate-ammonium
    format: cloze
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: In NH₃ + HCl → NH₄⁺ + Cl⁻, the {{1}} atom supplies both electrons for the new N–H bond, using its {{2}}.
    blanks:
      - accept: ["nitrogen", "N"]
      - accept: ["lone pair", "lone pair of electrons"]
    explanation: Nitrogen donates its lone pair to hydrogen; the H–Cl bonding pair moves to chlorine.
  - id: dot-coordinate-alcl3
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: In Al₂Cl₆, which atom donates an electron pair to make a coordinate bond to aluminium?
    options:
      - text: A bridging chlorine atom
        correct: true
        why: A bridging chlorine donates a lone pair to an electron-deficient aluminium atom.
      - text: Hydrogen in an H–Cl bond
        why: There is no hydrogen in Al₂Cl₆.
      - text: An aluminium atom donates a lone pair to chlorine
        why: Aluminium is electron-deficient; bridging chlorine is the donor.
      - text: A chlorine nucleus donates two protons
        why: Coordinate bonding involves electron pairs, not nuclear particles.
    explanation: Each bridging chlorine can donate a lone pair to aluminium in the dimer.
  - id: dot-coordinate-drawing
    format: mcq
    difficulty: 3
    objectives: ["3.7.1"]
    prompt: How should the shared pair in a newly formed N→H coordinate bond in NH₄⁺ be marked?
    options:
      - text: Both electrons are shown as having come from nitrogen.
        correct: true
        why: Nitrogen donated its lone pair to hydrogen from HCl.
      - text: One electron comes from H⁺ and one from nitrogen.
        why: The new pair came from nitrogen; HCl's bonding pair moves to chlorine.
      - text: No pair is shown because a coordinate bond is not a real bond.
        why: It is a covalent bond with a shared electron pair.
      - text: Both electrons come from chlorine.
        why: Chlorine accepts the H–Cl bonding pair; nitrogen supplies the new N–H pair.
    explanation: The coordinate bond is covalent; the markings simply show that the donated pair began on nitrogen.
