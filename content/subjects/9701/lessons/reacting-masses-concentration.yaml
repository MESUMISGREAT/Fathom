id: reacting-masses-concentration
subject: "9701"
topic: "2.4"
title: "Concentration: how crowded is your solution?"
summary: Concentration in mol dm⁻³ and g dm⁻³, the n = cV toolkit with the cm³ to dm³ trap, concentrations of ions, and dilution.
order: 5
minutes: 5
objectives: ["2.4.1"]
prerequisites: [mole-avogadro-mass-moles-particles]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.4, learning outcome 2.4.1(c) volumes and concentrations of
    solutions, and the guidance on significant figures). All Ar values from the Cambridge
    Data Booklet. All numerical answers were computed with Python. All questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can calculate concentrations in $\text{mol dm}^{-3}$ and $\text{g dm}^{-3}$, find the amount of solute in any volume of solution, and work out concentrations after dilution.

  - type: explain
    title: The squash problem
    body: |
      Squeeze the same squirt of orange squash into a glass and into a bucket. Same amount of flavour, wildly different drink. What matters is how much is dissolved **per volume**.

      Chemists do exactly this, but they count the solute in **moles** and measure the volume in **dm³**.

  - type: definition
    term: Concentration
    body: |
      The amount of solute, in moles, dissolved in each $1\ \text{dm}^3$ of **solution**:

      $$c = \frac{n}{V} \qquad \text{units: mol dm}^{-3}$$

      You'll also meet **mass concentration** in $\text{g dm}^{-3}$: the mass of solute per dm³ of solution.

  - type: explain
    title: The toolkit (and the trap)
    body: |
      $$n = c \times V \qquad c = \frac{n}{V} \qquad V = \frac{n}{c}$$

      **The trap:** $V$ must be in $\text{dm}^3$. Lab volumes come in $\text{cm}^3$, so divide by 1000 first:

      $$25.0\ \text{cm}^3 = \frac{25.0}{1000} = 0.0250\ \text{dm}^3$$

      Forget this and your answer is out by a factor of 1000, which is the chemistry equivalent of ordering 1000 pizzas instead of one.

  - type: example
    title: Two quick conversions
    problem: |
      (a) How many moles of NaOH are in 25.0 cm³ of 0.100 mol dm⁻³ NaOH(aq)? (b) 2.65 g of anhydrous sodium carbonate is dissolved and made up to 250 cm³ of solution. What is its concentration? ($M(\text{Na}_2\text{CO}_3) = 106.0\ \text{g mol}^{-1}$)
    steps:
      - |
        (a) $n = c \times V = 0.100 \times 0.0250 = 2.50 \times 10^{-3}$ mol
      - |
        (b) $n(\text{Na}_2\text{CO}_3) = 2.65 \div 106.0 = 0.0250$ mol
      - |
        $c = n \div V = 0.0250 \div 0.250 = 0.100\ \text{mol dm}^{-3}$
    answer: |
      (a) $2.50 \times 10^{-3}$ mol; (b) $0.100\ \text{mol dm}^{-3}$.

  - type: check
    title: Quick check
    questions: [moles-in-volume, sodium-hydroxide-concentration]

  - type: explain
    title: Grams per dm³, and counting ions
    body: |
      **mol dm⁻³ to g dm⁻³:** multiply by the molar mass. 0.200 mol dm⁻³ NaCl(aq) is $0.200 \times 58.5 = 11.7\ \text{g dm}^{-3}$. To go back, divide by $M$.

      **Ions:** an ionic solute splits up, so count the ions from the formula.

      | solution | concentration of ions |
      | --- | --- |
      | 0.100 mol dm⁻³ NaCl | $\text{Na}^+$ 0.100, $\text{Cl}^-$ 0.100 |
      | 0.100 mol dm⁻³ $\text{CaCl}_2$ | $\text{Ca}^{2+}$ 0.100, $\text{Cl}^-$ **0.200** |
      | 0.100 mol dm⁻³ $\text{Na}_2\text{SO}_4$ | $\text{Na}^+$ **0.200**, $\text{SO}_4^{2-}$ 0.100 |

  - type: check
    title: Units and ions
    questions: [sulfuric-mass-concentration, chloride-ion-concentration]

  - type: explain
    title: Dilution
    body: |
      Adding water changes the volume but **not the moles of solute**. So the moles before equal the moles after:

      $$c_1V_1 = c_2V_2$$

      Here both volumes can stay in $\text{cm}^3$, because the units are the same on both sides and cancel.

  - type: diagram
    diagram: chem-reacting-masses-dilution
    alt: "Left: a beaker containing 25.0 cm³ of 2.00 mol dm⁻³ solution, with twenty solute particles packed closely together; n = 2.00 × 0.0250 = 0.0500 mol. An arrow labelled add distilled water up to the mark, then invert to mix, points to the right: a pear-shaped volumetric flask filled to its 250 cm³ mark, with the same twenty particles spread out through the larger volume; 250 cm³ of 0.200 mol dm⁻³, n = 0.200 × 0.250 = 0.0500 mol. Title: dilution, same moles of solute, more solution. Footer: c1V1 = c2V2, 2.00 × 25.0 = 0.200 × 250."
    caption: Ten times the volume, one tenth the concentration, exactly the same particles.

  - type: check
    title: Dilution and making solutions
    questions: [dilution-concentration, stock-volume, solution-not-water]

  - type: misconceptions
    items:
      - wrong: |
          $n = c \times V = 0.100 \times 25.0 = 2.50$ mol
        right: |
          $V$ must be in dm³: $0.100 \times 0.0250 = 2.50 \times 10^{-3}$ mol. If 25 cm³ of dilute solution seems to hold moles by the bucketful, check your units.
      - wrong: |
          Dissolving 0.100 mol of solute in 1.00 dm³ of water gives 0.100 mol dm⁻³.
        right: |
          Concentration is per dm³ of **solution**. Dissolve the solute, then **make up to** 1.00 dm³ in a volumetric flask.
      - wrong: |
          0.100 mol dm⁻³ $\text{CaCl}_2$ contains 0.100 mol dm⁻³ of chloride ions.
        right: |
          Each $\text{CaCl}_2$ gives **two** $\text{Cl}^-$ ions, so $[\text{Cl}^-] = 0.200\ \text{mol dm}^{-3}$.

  - type: exam
    body: |
      - Write the unit conversion as its own step: "$V = 25.0\ \text{cm}^3 = 0.0250\ \text{dm}^3$". It shows the examiner you didn't fall in the trap.
      - Use $\text{mol dm}^{-3}$ (Cambridge style), and match the significant figures of the data (usually 3 s.f.) unless told otherwise.
      - For making a standard solution, the key phrase is "**make up to the mark** in a volumetric flask".

  - type: takeaways
    items:
      - "Concentration = moles of solute per dm³ of **solution**: $c = n/V$, in $\\text{mol dm}^{-3}$."
      - "Volumes in cm³ must be divided by 1000 before using $n = cV$."
      - "$\\text{g dm}^{-3} = \\text{mol dm}^{-3} \\times M$; count ions from the formula."
      - "Dilution keeps moles constant: $c_1V_1 = c_2V_2$."

questions:
  - id: moles-in-volume
    format: numeric
    difficulty: 1
    objectives: ["2.4.1"]
    prompt: |
      What amount of HCl, in mol, is in 20.0 cm³ of 0.150 mol dm⁻³ hydrochloric acid? Type standard form like `1.23e-3` or a decimal.
    fields:
      - answer: 0.003
        tolerance: { abs: 0.00001 }
        unit: mol
    explanation: |
      $V = 20.0 \div 1000 = 0.0200\ \text{dm}^3$, so $n = 0.150 \times 0.0200 = 3.00 \times 10^{-3}$ mol.

  - id: sodium-hydroxide-concentration
    format: numeric
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |
      4.00 g of sodium hydroxide is dissolved in water and made up to 500 cm³ of solution. What is the concentration? ($A_r$: Na = 23.0, O = 16.0, H = 1.0)
    fields:
      - answer: 0.2
        tolerance: { abs: 0.001 }
        unit: mol dm⁻³
    explanation: |
      $M(\text{NaOH}) = 40.0$, so $n = 4.00 \div 40.0 = 0.100$ mol. $V = 0.500\ \text{dm}^3$, so $c = 0.100 \div 0.500 = 0.200\ \text{mol dm}^{-3}$.

  - id: sulfuric-mass-concentration
    format: numeric
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |
      What is the concentration, in $\text{g dm}^{-3}$, of 0.0400 mol dm⁻³ sulfuric acid, $\text{H}_2\text{SO}_4$? ($A_r$: H = 1.0, S = 32.1, O = 16.0) Give your answer to 3 significant figures.
    fields:
      - answer: 3.92
        tolerance: { abs: 0.005 }
        sigFigs: 3
        unit: g dm⁻³
    explanation: |
      $M(\text{H}_2\text{SO}_4) = 2(1.0) + 32.1 + 4(16.0) = 98.1\ \text{g mol}^{-1}$. Mass concentration $= 0.0400 \times 98.1 = 3.92\ \text{g dm}^{-3}$.

  - id: chloride-ion-concentration
    format: mcq
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |
      What is the concentration of chloride ions in 0.150 mol dm⁻³ aluminium chloride solution, $\text{AlCl}_3\text{(aq)}$?
    options:
      - text: |
          0.150 mol dm⁻³
        why: |
          That's the concentration of $\text{AlCl}_3$ (and of $\text{Al}^{3+}$), not of $\text{Cl}^-$.
      - text: |
          0.300 mol dm⁻³
        why: |
          Count again: there are three Cl in $\text{AlCl}_3$, not two.
      - text: |
          0.450 mol dm⁻³
        correct: true
        why: |
          Each $\text{AlCl}_3$ releases 3 $\text{Cl}^-$ ions: $3 \times 0.150 = 0.450\ \text{mol dm}^{-3}$.
      - text: |
          0.600 mol dm⁻³
        why: |
          That's the total concentration of **all** ions (1 $\text{Al}^{3+}$ + 3 $\text{Cl}^-$), not just chloride.
    explanation: |
      $\text{AlCl}_3\text{(aq)} \rightarrow \text{Al}^{3+}\text{(aq)} + 3\text{Cl}^-\text{(aq)}$, so $[\text{Cl}^-] = 3 \times 0.150 = 0.450\ \text{mol dm}^{-3}$.

  - id: dilution-concentration
    format: numeric
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |
      10.0 cm³ of 2.00 mol dm⁻³ hydrochloric acid is diluted with distilled water to 250 cm³. What is the new concentration?
    fields:
      - answer: 0.08
        tolerance: { abs: 0.0005 }
        unit: mol dm⁻³
    explanation: |
      Moles don't change: $c_2 = c_1V_1 \div V_2 = 2.00 \times 10.0 \div 250 = 0.0800\ \text{mol dm}^{-3}$. (Check: $n = 2.00 \times 0.0100 = 0.0200$ mol, and $0.0200 \div 0.250 = 0.0800$.)

  - id: stock-volume
    format: numeric
    difficulty: 3
    objectives: ["2.4.1"]
    prompt: |
      A technician needs 250 cm³ of 0.0400 mol dm⁻³ copper(II) sulfate solution, made by diluting a 1.00 mol dm⁻³ stock solution. What volume of stock solution should she measure out?
    fields:
      - answer: 10
        tolerance: { abs: 0.05 }
        unit: cm³
    explanation: |
      Moles needed $= 0.0400 \times 0.250 = 0.0100$ mol. Volume of stock $= 0.0100 \div 1.00 = 0.0100\ \text{dm}^3 = 10.0\ \text{cm}^3$. Or: $V_1 = c_2V_2 \div c_1 = 0.0400 \times 250 \div 1.00 = 10.0\ \text{cm}^3$.

  - id: solution-not-water
    format: mcq
    difficulty: 2
    objectives: ["2.4.1"]
    prompt: |
      Which method makes a solution of sodium chloride with a concentration of exactly 0.100 mol dm⁻³? ($M(\text{NaCl}) = 58.5\ \text{g mol}^{-1}$)
    options:
      - text: |
          Dissolve 5.85 g of NaCl in exactly 1.00 dm³ of water.
        why: |
          Dissolving the salt changes the volume, so the solution isn't exactly 1.00 dm³. Concentration is per dm³ of **solution**.
      - text: |
          Dissolve 5.85 g of NaCl in some water, then make up to 1.00 dm³ in a volumetric flask.
        correct: true
        why: |
          0.100 mol (5.85 g) in exactly 1.00 dm³ of solution: 0.100 mol dm⁻³.
      - text: |
          Dissolve 0.100 g of NaCl in water and make up to 1.00 dm³.
        why: |
          0.100 g is not 0.100 mol. You need $0.100 \times 58.5 = 5.85$ g.
      - text: |
          Dissolve 58.5 g of NaCl in water and make up to 1.00 dm³.
        why: |
          58.5 g is 1.00 mol, which would make a 1.00 mol dm⁻³ solution.
    explanation: |
      Weigh out the right number of moles ($n = cV = 0.100$ mol = 5.85 g), dissolve, and make up to the final volume of **solution**.
