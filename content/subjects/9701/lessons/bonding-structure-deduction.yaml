blocks:
  - type: objective
    body: |
      By the end you can deduce a substance's structure and bonding from data such as melting point, conductivity and solubility.

  - type: explain
    title: The evidence table
    body: |
      Data questions hand you properties and ask for the structure. Here is how to read each clue:

      | clue | points to | because |
      | --- | --- | --- |
      | high melting point, does not conduct as solid, conducts when molten or aqueous | **giant ionic** | ions locked in lattice; free when molten/dissolved |
      | low melting point, does not conduct in any state | **simple molecular** | weak forces between molecules; no mobile charges |
      | very high melting point, does not conduct (except graphite) | **giant molecular** | covalent network; electrons locked in bonds |
      | very high melting point, conducts as a solid | **graphite** (giant molecular) | delocalised electrons within layers |
      | high melting point, conducts as a solid, malleable | **giant metallic** | delocalised electrons; sliding layers |
      | dissolves in water, not in a non-polar solvent | **ionic** | polar water can attract the ions |
      | dissolves in a non-polar solvent, not in water | **simple molecular (non-polar)** | like dissolves like |

  - type: definition
    term: Deduction template
    body: |
      Three sentences that always work:

      1. "The data shows **[clue]**."
      2. "This is typical of a **[structure]**, because **[reason from the table]**."
      3. "So the bonding is **[ionic / covalent / metallic / intermolecular]**."

  - type: example
    title: Substance A
    problem: |
      Substance A melts at $801\ ^\circ\text{C}$. It does not conduct electricity as a solid, but it does conduct when molten and when dissolved in water. Deduce its structure and bonding.
    steps:
      - "Clue 1: a high melting point → the forces between particles are strong; not simple molecular."
      - "Clue 2: conducts only when molten or aqueous → the charge carriers are **ions**, which are fixed in the solid but mobile once freed. That is the fingerprint of ionic structure."
      - "A giant molecular solid would never conduct when molten (and it does not dissolve); a metal conducts as a solid — A does not."
      - "Conclude: A has a **giant ionic lattice**, with **ionic bonding** (electrostatic attraction between oppositely charged ions)."
    answer: "giant ionic lattice; ionic bonding"

  - type: example
    title: Substance B
    problem: |
      Substance B melts at $114\ ^\circ\text{C}$, does not conduct electricity in any state, and dissolves in hexane but not in water. Deduce its structure and bonding.
    steps:
      - "Clue 1: low melting point → weak forces between particles → simple molecular."
      - "Clue 2: never conducts → no ions and no delocalised electrons, consistent with simple molecular."
      - "Clue 3: dissolves in non-polar hexane but not water → the molecules are non-polar (like dissolves like)."
      - "Conclude: B is **simple molecular**, with **covalent bonds within molecules** and weak intermolecular forces between them. (These data match iodine.)"
    answer: "simple molecular; covalent bonding within molecules"

  - type: check
    title: Your turn
    questions: [deduce-copper, deduce-sio2, deduce-evidence]

  - type: misconceptions
    items:
      - wrong: "High melting point means ionic."
        right: "Giant molecular solids also have very high melting points. Use **conduction** to separate them: ionic conducts when molten; giant molecular does not."
      - wrong: "'Does not conduct' means 'has no charged particles at all'."
        right: "Solid NaCl has plenty of ions — they are just fixed. The clue is about **mobile** charges."
      - wrong: "Naming the structure is enough."
        right: "Most marks come from **linking** the clue to the reason, e.g. 'high melting point, so strong forces must be overcome'."

  - type: exam
    body: |
      - Quote the data in your answer ("melting point 801 °C, so…"). Examiners reward evidence-led reasoning.
      - State **both** structure type and bonding type when asked: "giant ionic structure, ionic bonding" — they are separate marks.
      - If the substance conducts as a solid and is not a metal, it is almost certainly **graphite**; say why (delocalised electrons within layers).
      - Keep to the two-sentence template: clue → structure + reason.

  - type: takeaways
    items:
      - "Read the data like fingerprints: melting point gives force strength; conduction gives the charge carriers; solubility gives polarity."
      - "Ionic: high mp, conducts only when molten/aqueous. Simple molecular: low mp, never conducts. Giant molecular: very high mp, no conduction (graphite excepted). Metallic: conducts as solid, malleable."
      - "Answer with evidence: state the clue, then the structure and the reason."

questions:
  - id: deduce-copper
    format: mcq
    difficulty: 2
    objectives: ["4.2.3"]
    prompt: |
      Substance C melts at $1085\ ^\circ\text{C}$, conducts electricity as a solid, and can be hammered into sheets. What is its structure and bonding?
    options:
      - text: |
          Giant ionic lattice with ionic bonding.
        why: |
          Ionic solids conduct only when molten or aqueous — and they are brittle, not malleable.
      - text: |
          Simple molecular lattice with van der Waals' forces between molecules.
        why: |
          A simple molecular solid would melt at low temperature and never conduct.
      - text: |
          Giant metallic lattice with metallic bonding.
        correct: true
        why: |
          Conduction as a solid (delocalised electrons), a high melting point and malleability (sliding layers) are the classic metallic fingerprint — these data match copper.
      - text: |
          Giant molecular lattice with covalent bonding.
        why: |
          A giant molecular solid (like diamond or SiO₂) does not conduct electricity as a solid.
    explanation: |
      Conducts as a solid + high melting point + malleable = giant metallic lattice (like copper).

  - id: deduce-sio2
    format: text
    style: short
    difficulty: 3
    objectives: ["4.2.3"]
    prompt: |
      Substance D melts at about $1700\ ^\circ\text{C}$ and does not conduct electricity in any state. It is insoluble in water and in hexane. Deduce its structure and bonding.
    accept:
      - "giant molecular structure with covalent bonding"
      - "giant molecular lattice with covalent bonding"
      - "giant covalent structure with covalent bonds"
      - "giant molecular, covalent"
      - "giant covalent lattice, covalent bonding"
    model: |
      Giant molecular (giant covalent) structure with covalent bonding. A very high melting point with no conductivity in any state is typical of a giant covalent network such as silicon(IV) oxide.
    explanation: |
      Very high melting point → strong forces throughout a giant structure; never conducts → no mobile electrons or ions; insoluble in both solvent types → giant covalent network. (These data match SiO₂.)

  - id: deduce-evidence
    format: mcq
    difficulty: 1
    objectives: ["4.2.3"]
    prompt: |
      A solid does not conduct electricity, but its melt (or aqueous solution) does. Which structure does this evidence fit best?
    options:
      - text: |
          Giant metallic — metals always conduct.
        why: |
          Metals conduct as **solids** too. "Only when molten or aqueous" rules metals out.
      - text: |
          Giant ionic — the ions are fixed in the lattice but free to move when molten or dissolved.
        correct: true
        why: |
          That is the ionic fingerprint: charged particles present but locked in the solid; mobile in the melt or in solution.
      - text: |
          Simple molecular — the molecules move when molten.
        why: |
          Simple molecular liquids have no charged particles, so they never conduct.
      - text: |
          Giant molecular — the covalent network breaks when molten.
        why: |
          Giant molecular substances do not conduct even when molten (their electrons stay in bonds), and most do not dissolve at all.
    explanation: |
      Conducts only when molten or aqueous = ionic. The ions must be free to move to carry charge.
