id: bonding-structure-deduction
subject: "9701"
topic: "4.2"
title: Deducing structure from the evidence
summary: The detective routine — use melting point, conductivity and solubility data to name any substance's structure and bonding, with a mark-scheme answer template.
order: 7
minutes: 4
objectives: ["4.2.3"]
prerequisites: [bonding-structure-melting-points, bonding-structure-conductivity-solubility]
