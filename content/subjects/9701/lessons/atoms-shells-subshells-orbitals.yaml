id: atoms-shells-subshells-orbitals
subject: "9701"
topic: "1.3"
title: Shells, sub-shells and orbitals
summary: How electrons are organised into shells, sub-shells and orbitals, how many each holds, and the order of their energies up to 4p.
order: 1
minutes: 5
objectives: ["1.3.1", "1.3.2", "1.3.3"]
prerequisites: [atoms-particles-in-the-atom]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.3, learning outcomes 1-3; ground-state atoms H to Kr
    only). Sub-shell energy order 1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p as required by
    outcome 3. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain the terms shell, sub-shell, orbital, principal quantum number and ground state, say how many electrons s, p and d sub-shells hold, and put the sub-shells up to 4p in order of energy.

  - type: explain
    title: An address for every electron
    body: |
      Electrons are organised in three levels, a bit like a postal address:

      | level | analogy | what it is |
      | --- | --- | --- |
      | **shell** | town | a main energy level, numbered by the **principal quantum number, n** = 1, 2, 3, 4 … |
      | **sub-shell** | street | a group of orbitals of the same type (s, p or d) within a shell |
      | **orbital** | house | holds a maximum of **two electrons** |

      The bigger n is, the further the shell is from the nucleus and the higher its energy.

  - type: definition
    term: Orbital
    body: |
      A region of space around the nucleus where there is a high probability of finding an electron. Each orbital can hold a maximum of two electrons, with opposite spins.

  - type: explain
    title: How many fit?
    body: |
      | sub-shell | orbitals | max electrons |
      | --- | --- | --- |
      | s | 1 | 2 |
      | p | 3 | 6 |
      | d | 5 | 10 |

      | shell | sub-shells | orbitals | max electrons |
      | --- | --- | --- | --- |
      | n = 1 | 1s | 1 | 2 |
      | n = 2 | 2s, 2p | 4 | 8 |
      | n = 3 | 3s, 3p, 3d | 9 | 18 |
      | n = 4 | 4s, 4p (4d, 4f) | 16 | 32 |

      Pattern: shell n has n sub-shells, n² orbitals and room for 2n² electrons. For H to Kr you only ever use 4s and 4p from the fourth shell.

  - type: check
    title: Quick check
    questions: [third-shell, subshell-cloze, orbital-meaning]

  - type: explain
    title: The energy order (with one twist)
    body: |
      Within a shell, energy goes **s < p < d**. Up to 4p, the full order is:

      **1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p**

      The twist: **4s is lower in energy than 3d**, so 4s fills first (potassium and calcium), then 3d (scandium to zinc), then 4p (gallium to krypton).

  - type: diagram
    diagram: chem-subshell-energy-levels
    alt: "Energy-level diagram with energy increasing upwards and sub-shells drawn as rows of orbital boxes, arranged in columns for shells n = 1 to 4. From lowest to highest: 1s (one box), 2s (one box), 2p (three boxes), 3s, 3p, then 4s in the n = 4 column sitting just below 3d (five boxes) in the n = 3 column, and finally 4p at the top. Numbers in brackets give the filling order 1 to 8. A dashed line at the 3d level shows 4s lies below it."
    caption: |
      Each box is one orbital. Energies are not to scale, but the order is.

  - type: definition
    term: Ground state
    body: |
      The arrangement of electrons with the lowest possible energy. In the ground state, electrons occupy the lowest-energy orbitals available.

  - type: intuition
    title: Why the order matters
    body: |
      Electrons fill from the bottom of the diagram upwards, like water filling a container. Knowing the order is how you write electronic configurations in the next lesson, and the 4s/3d twist is the bit examiners love to test.

  - type: check
    title: Energy order
    questions: [energy-order, ground-state-term, orbitals-total]

  - type: misconceptions
    items:
      - wrong: "Shell 3 fills completely (18 electrons) before shell 4 starts."
        right: "4s fills before 3d. Potassium is 2,8,8,1, not 2,8,9."
      - wrong: "An orbital is the path an electron follows, like a planet's orbit."
        right: "An orbital is a region of space where the electron is likely to be found, not a track."
      - wrong: "A p orbital holds six electrons."
        right: "A p **sub-shell** holds six: three p orbitals with two electrons each."

  - type: enrichment
    title: Why does 4s sneak below 3d?
    body: |
      A 4s electron spends most of its time further out than a 3d electron, but it has a small chance of being very close to the nucleus, where it feels a strong, poorly shielded attraction. That "penetration" lowers its energy below 3d in potassium and calcium. Once 3d electrons are present the energies shift again, which is why 4s electrons are the first to go when transition elements form ions.

  - type: exam
    body: |
      - Paper 1 often asks you to count orbitals or electrons in a sub-shell or shell. Remember: orbitals hold 2, so s = 2, p = 6, d = 10.
      - Be precise with words: an orbital holds two electrons; a sub-shell is a set of orbitals; a shell is a set of sub-shells with the same n.
      - "Ground state" means lowest energy. All atoms and ions in this topic are in their ground state.

  - type: takeaways
    items:
      - "Shell (n) → sub-shell (s, p, d) → orbital (max 2 electrons)."
      - "s: 1 orbital, 2 e⁻; p: 3 orbitals, 6 e⁻; d: 5 orbitals, 10 e⁻. Shell n holds 2n² electrons."
      - "Energy order: 1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p."
      - "Ground state = the lowest-energy arrangement of the electrons."

questions:
  - id: third-shell
    format: numeric
    difficulty: 1
    objectives: ["1.3.2", "1.3.1"]
    prompt: |
      What is the maximum number of electrons that the third shell (n = 3) can hold?
    fields:
      - answer: 18
    explanation: |
      3s (2) + 3p (6) + 3d (10) = 18, which matches 2n² = 2 × 3² = 18.

  - id: subshell-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.3.2"]
    prompt: |
      A p sub-shell contains {{1}} orbitals and can hold up to {{2}} electrons. A d sub-shell contains {{3}} orbitals.
    blanks:
      - accept: ["3", "three"]
      - accept: ["6", "six"]
      - accept: ["5", "five"]
    explanation: |
      Every orbital holds two electrons: p has 3 orbitals (6 electrons), d has 5 orbitals (10 electrons).

  - id: orbital-meaning
    format: mcq
    difficulty: 1
    objectives: ["1.3.1", "1.3.2"]
    prompt: |
      Which statement about orbitals is correct?
    options:
      - text: |
          An orbital is the circular path an electron follows around the nucleus.
        why: |
          Electrons don't follow fixed paths. An orbital describes where an electron is likely to be.
      - text: |
          An orbital is a region of space where there is a high probability of finding an electron, and it holds at most two electrons.
        correct: true
        why: |
          That's the definition: a region of probability, with room for two electrons of opposite spin.
      - text: |
          Each p orbital can hold six electrons.
        why: |
          Each orbital holds two. Six is the capacity of the whole p sub-shell (three orbitals).
      - text: |
          All the orbitals in the third shell have the same energy.
        why: |
          Within a shell, s < p < d, so 3s, 3p and 3d have different energies. Only orbitals in the same sub-shell share an energy.
    explanation: |
      Orbital = region of high probability, max two electrons. Sub-shells group orbitals of one type; shells group sub-shells.

  - id: energy-order
    format: mcq
    difficulty: 2
    objectives: ["1.3.3"]
    prompt: |
      Which list shows sub-shells in order of increasing energy?
    options:
      - text: |
          3s < 3p < 3d < 4s
        why: |
          This fills the whole third shell first. In fact 4s is lower in energy than 3d.
      - text: |
          3p < 3d < 4s < 4p
        why: |
          3d and 4s are the wrong way round: 4s is lower.
      - text: |
          4s < 3s < 3p < 3d
        why: |
          4s is above 3s and 3p; it only sneaks below 3d.
      - text: |
          3p < 4s < 3d < 4p
        correct: true
        why: |
          4s is lower than 3d, and 4p comes after 3d.
    explanation: |
      Full order: 1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p.

  - id: ground-state-term
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.3.1"]
    prompt: |
      What term describes the lowest-energy arrangement of the electrons in an atom?
    accept: ["ground state", "the ground state", "ground-state", "ground state configuration", "ground state electronic configuration", "ground-state electronic configuration", "ground state electron configuration"]
    model: |
      The ground state.
    explanation: |
      In the ground state every electron is in the lowest-energy orbital available to it.

  - id: orbitals-total
    format: numeric
    difficulty: 2
    objectives: ["1.3.2", "1.3.1"]
    prompt: |
      How many orbitals are there altogether in the first three shells (n = 1, 2 and 3)?
    fields:
      - answer: 14
    explanation: |
      n = 1: 1 (1s). n = 2: 1 + 3 = 4. n = 3: 1 + 3 + 5 = 9. Total 1 + 4 + 9 = 14 (it's n² for each shell).
