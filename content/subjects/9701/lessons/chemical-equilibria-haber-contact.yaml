id: chemical-equilibria-haber-contact
subject: "9701"
topic: "7.1"
title: "The Haber and Contact processes: equilibrium in industry"
summary: Both processes use the same logic — push the equilibrium with pressure and removal of product, then accept a compromise temperature because a high yield at no rate earns nothing.
order: 10
minutes: 10
kind: core
objectives: ["7.1.10"]
prerequisites: [chemical-equilibria-le-chatelier, chemical-equilibria-temperature-catalyst, chemical-equilibria-what-changes-k]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027, topic 7.1, learning outcome 7.1.10 (conditions in the Haber and Contact processes
    as examples of dynamic equilibrium and Le Chatelier's principle in industry). Enthalpy values
    are the standard ones for the forward reactions as written (-92 and -197 kJ mol-1). Yields are
    described qualitatively rather than quoted as precise figures. All questions are original.

