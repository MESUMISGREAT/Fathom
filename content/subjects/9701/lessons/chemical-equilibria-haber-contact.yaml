blocks:
  - type: objective
    body: |-
      By the end you can state the conditions used in the Haber and Contact processes, justify each one with Le Chatelier's principle, and explain why the temperature chosen is not the one that gives the highest yield.

  - type: explain
    title: Three pressures on an industrial chemist
    body: |-
      A plant wants three things that pull against each other:

      - a **high equilibrium yield**, so little reactant is wasted;
      - a **fast reaction**, so the reactor does not have to be enormous;
      - **low cost**, including energy and equipment.

      Equilibrium theory controls the first. Kinetics controls the second. The conditions actually used are the compromise that makes the most money.

  - type: explain
    title: "The Haber process: making ammonia"
    body: |-
      Nitrogen from the air is combined with hydrogen from natural gas:

      $$\text{N}_2(g) + 3\text{H}_2(g) \rightleftharpoons 2\text{NH}_3(g) \qquad \Delta H = -92\ \text{kJ mol}^{-1}$$

      The forward reaction is **exothermic** and reduces the number of gas molecules from 4 to 2.

      Those two facts set the whole design.

  - type: explain
    title: Justifying each Haber condition
    body: |-
      | Condition | Value | Reason |
      | --- | --- | --- |
      | Pressure | about $200\ \text{atm}$ | 4 mol of gas become 2 mol, so high pressure shifts the equilibrium right and raises the yield |
      | Temperature | about $450\ ^\circ\text{C}$ | a compromise: lower would raise the yield but make the rate far too slow |
      | Catalyst | iron | speeds up both directions, so equilibrium is reached quickly without changing the yield |
      | Product removal | ammonia liquefied out | removing a product shifts the equilibrium right |
      | Recycling | unreacted $\text{N}_2$ and $\text{H}_2$ returned | avoids wasting raw materials and improves the overall conversion |

      The pressure is not pushed even higher because thicker reactor walls and more powerful compressors cost more than the extra ammonia is worth.

  - type: explain
    title: Why the temperature is a compromise
    body: |-
      Because the forward reaction is exothermic, cooling the reactor would shift the equilibrium to the right and give a higher percentage of ammonia.

      But at a low temperature the reaction is so slow that the gas would pass through the catalyst almost unchanged. The plant would make very little ammonia per hour, however favourable the equilibrium.

      So $450\ ^\circ\text{C}$ is chosen: hot enough for a usable rate with the iron catalyst, cool enough to keep a worthwhile yield.

  - type: diagram
    diagram: chem-equilibria-haber-tradeoff
    alt: >-
      A graph with temperature along the horizontal axis from 250 to 650 degrees Celsius. One curve,
      labelled equilibrium yield of ammonia, falls steadily as the temperature rises. A second
      curve, labelled rate of reaction, rises steeply through the middle of the graph. A dashed
      vertical line at 450 degrees Celsius is marked compromise, showing that the chosen temperature
      sits where the falling yield is still usable and the rising rate is adequate.
    caption: |-
      The two curves pull in opposite directions; 450 °C is where the compromise earns the most ammonia per hour.

  - type: explain
    title: "The Contact process: making sulfuric acid"
    body: |-
      Sulfur dioxide is oxidised to sulfur trioxide, which is then converted into sulfuric acid:

      $$2\text{SO}_2(g) + \text{O}_2(g) \rightleftharpoons 2\text{SO}_3(g) \qquad \Delta H = -197\ \text{kJ mol}^{-1}$$

      Again the forward reaction is exothermic, and again 3 mol of gas become 2 mol, so the same reasoning applies.

      - **Pressure:** about $1$–$2\ \text{atm}$ — only slightly above atmospheric.
      - **Temperature:** about $450\ ^\circ\text{C}$.
      - **Catalyst:** vanadium(V) oxide, $\text{V}_2\text{O}_5$.
      - **Product removal:** the $\text{SO}_3$ is absorbed in concentrated sulfuric acid as it forms.

  - type: explain
    title: Why the Contact process uses a low pressure
    body: |-
      This is the comparison examiners love, because it looks inconsistent with the Haber process.

      The equilibrium for $\text{SO}_3$ formation already lies **very strongly to the right**, even at one atmosphere. Raising the pressure would gain only a tiny further improvement, while the compressor and the stronger vessels would cost a great deal.

      Ammonia's equilibrium is much less favourable, so there the extra pressure genuinely buys a much better yield and the cost is worth paying.

      The rule is not "high pressure is good". It is "pay for pressure only when it buys enough product".

  - type: intuition
    title: A shop that refuses to overstock
    body: |-
      Think of a plant as a shop that must decide how hard to push each lever. Every lever has a price, and the aim is not the perfect mixture but the best profit.

      A yield of $99\%$ in a reactor that takes a week to get there is worse than a yield of $25\%$ in a reactor that cycles every minute — especially when the unreacted gas is recycled.

  - type: misconceptions
    items:
      - wrong: |-
          The Haber process uses the lowest possible temperature because that gives the highest yield.
        right: |-
          A low temperature gives a high yield but an unusably slow rate, so a compromise of about $450\ ^\circ\text{C}$ is used.
      - wrong: |-
          The Contact process uses low pressure because pressure has no effect on that equilibrium.
        right: |-
          Pressure does favour the products, but the equilibrium is already so far to the right that the extra yield is not worth the cost.
      - wrong: |-
          The iron catalyst increases the equilibrium yield of ammonia.
        right: |-
          It only increases the rate; the yield is set by the pressure, temperature and removal of ammonia.
      - wrong: |-
          Removing ammonia reduces the yield because there is less product in the mixture.
        right: |-
          Removing a product pulls the equilibrium right, so more ammonia is formed overall.
      - wrong: |-
          Higher pressure is always better in industry.
        right: |-
          Higher pressure means stronger vessels, more compression work and higher cost; it is used when it earns its keep.

  - type: exam
    body: |-
      - Give the condition **and** the reason, every time: "about 200 atm, because 4 mol of gas form 2 mol so the equilibrium shifts right".
      - For temperature, use the word **compromise** and explain both halves: yield falls as temperature rises, but rate falls as temperature falls.
      - Compare the two processes explicitly when asked: the Contact equilibrium is already far to the right, so high pressure is not worth the cost.
      - Do not claim the catalyst changes the position or the yield.
      - Remember to mention product removal and recycling for the Haber process; they are often worth marks.

  - type: check
    title: Checking the idea
    questions: [eq10-mcq-haber-temp, eq10-mcq-haber-pressure, eq10-cloze-conditions]

  - type: check
    title: End-of-lesson check
    questions: [eq10-mcq-contact-pressure, eq10-spot-error, eq10-explain]

  - type: takeaways
    items:
      - Both processes rely on exothermic forward reactions that reduce the number of gas molecules.
      - 'Haber: about $450\ ^\circ\text{C}$, $200\ \text{atm}$, iron catalyst, ammonia removed and gases recycled.'
      - 'Contact: about $450\ ^\circ\text{C}$, $1$-$2\ \text{atm}$, $\text{V}_2\text{O}_5$ catalyst, $\text{SO}_3$ absorbed continuously.'
      - Temperature is always a compromise between yield and rate.
      - Pressure is used only where the extra yield justifies the cost.

questions:
  - id: eq10-mcq-haber-temp
    format: mcq
    difficulty: 2
    objectives: ["7.1.10"]
    prompt: |-
      The Haber process is carried out at about $450\ ^\circ\text{C}$ rather than at a much lower temperature. Why?
    options:
      - text: At a lower temperature the reaction would be too slow, even though the equilibrium yield would be higher.
        correct: true
        why: |-
          This is the compromise: yield improves as the temperature falls, but rate falls too.
      - text: At a lower temperature the equilibrium would shift to the left and the yield would fall.
        why: |-
          The forward reaction is exothermic, so cooling would actually increase the yield.
      - text: The catalyst only works above $450\ ^\circ\text{C}$.
        why: |-
          The catalyst works at lower temperatures too; the issue is that everything is too slow there.
      - text: Higher temperatures increase the equilibrium yield of ammonia.
        why: |-
          Higher temperatures decrease the yield, since the forward reaction is exothermic.
    explanation: |-
      $450\ ^\circ\text{C}$ balances a worthwhile equilibrium yield against a rate fast enough to be economic.

  - id: eq10-mcq-haber-pressure
    format: mcq
    difficulty: 2
    objectives: ["7.1.10"]
    prompt: |-
      Why is the Haber process run at about $200\ \text{atm}$?
    options:
      - text: The equilibrium has 4 mol of gas on the left and 2 mol on the right, so high pressure increases the yield of ammonia.
        correct: true
        why: |-
          Fewer gas molecules on the product side means compression favours ammonia.
      - text: High pressure increases the value of $K_p$, so more ammonia forms.
        why: |-
          $K_p$ depends only on temperature, so pressure cannot change it.
      - text: High pressure is needed to make the iron catalyst work.
        why: |-
          The catalyst functions at any pressure; the pressure is there for the equilibrium.
      - text: High pressure stops the ammonia from decomposing.
        why: |-
          Ammonia decomposes to a small extent at all pressures; the pressure raises the equilibrium yield rather than preventing decomposition.
    explanation: |-
      Compressing the mixture favours the side with fewer gas molecules, which is the ammonia side, so the yield rises.

  - id: eq10-cloze-conditions
    format: cloze
    difficulty: 2
    objectives: ["7.1.10"]
    prompt: |-
      In the Haber process the catalyst is {{1}}, and in the Contact process it is {{2}}. Both processes use a temperature of about $450\ ^\circ\text{C}$ as a compromise between a high equilibrium {{3}} and a fast {{4}}.
    blanks:
      - accept: [iron, fe]
      - accept: [vanadium(V) oxide, vanadium pentoxide, "V2O5", vanadium oxide, vanadium]
      - accept: [yield]
      - accept: [rate, reaction rate, speed]
    explanation: |-
      Iron catalyses ammonia synthesis and vanadium(V) oxide catalyses sulfur dioxide oxidation; both temperatures trade yield against rate.

  - id: eq10-mcq-contact-pressure
    format: mcq
    difficulty: 3
    objectives: ["7.1.10"]
    prompt: |-
      The Contact process uses only about $1$–$2\ \text{atm}$, while the Haber process uses about $200\ \text{atm}$, although both equilibria have fewer gas molecules on the product side. Why the difference?
    options:
      - text: The $\text{SO}_3$ equilibrium already lies so far to the right that extra pressure would gain very little for a large cost.
        correct: true
        why: |-
          Pressure is used where it buys a worthwhile increase in yield, which is not the case for sulfur trioxide.
      - text: Pressure has no effect on the Contact equilibrium.
        why: |-
          It does have an effect — 3 mol of gas become 2 — but the effect on an already favourable equilibrium is negligible.
      - text: The Contact process uses a catalyst, so pressure is unnecessary.
        why: |-
          A catalyst affects rate, not position, so it cannot substitute for pressure.
      - text: Sulfur trioxide decomposes at high pressure.
        why: |-
          The equilibrium simply shifts further towards $\text{SO}_3$ at higher pressure; there is no decomposition caused by pressure.
    explanation: |-
      The comparison shows that conditions are chosen economically: pressure is worth paying for only where the equilibrium is not already strongly to the right.

  - id: eq10-spot-error
    format: spot-error
    difficulty: 3
    objectives: ["7.1.10"]
    prompt: |-
      A student explains a condition in the Haber process. Which line contains the first error?
    lines:
      - The reaction is $\text{N}_2(g) + 3\text{H}_2(g) \rightleftharpoons 2\text{NH}_3(g)$, exothermic in the forward direction.
      - A high pressure of about $200\ \text{atm}$ shifts the equilibrium to the right, increasing the yield.
      - A low temperature of about $25\ ^\circ\text{C}$ would give an even higher yield, so the plant should be run cold.
      - The temperature actually used is about $450\ ^\circ\text{C}$ because of the rate.
    errorLine: 3
    fix: |-
      A cold reactor is not usable: at $25\ ^\circ\text{C}$ the reaction is far too slow, so very little ammonia forms per hour. A **compromise** temperature of about $450\ ^\circ\text{C}$ is used.
    explanation: |-
      Lines 1 and 2 are correct, so line 3 is the first error: it considers only the yield and ignores the rate.

  - id: eq10-explain
    format: explain
    difficulty: 3
    objectives: ["7.1.10"]
    prompt: |-
      Explain the conditions used in the Haber process, including the pressure, the temperature, the catalyst and the removal of ammonia, and explain why each condition is chosen.
    model: |-
      The forward reaction is exothermic and converts 4 mol of gas into 2 mol, so the equilibrium responds to both pressure and temperature. A pressure of about 200 atm is used because the equilibrium shifts towards the side with fewer gas molecules, raising the yield of ammonia, while the cost of stronger vessels and compression limits how far this can be pushed. The temperature of about 450 °C is a compromise: a lower temperature would give a higher equilibrium yield, but the rate would be too slow for the plant to produce useful amounts, so a moderately high temperature is accepted. Iron is used as a catalyst because it speeds up both directions equally, allowing equilibrium to be reached quickly at that temperature without changing the yield or the value of the equilibrium constant. Ammonia is liquefied and removed as it forms, which lowers the concentration of a product and so pulls the equilibrium further to the right; the remaining nitrogen and hydrogen are recycled to avoid wasting raw materials.
    keyPoints:
      - High pressure shifts the equilibrium towards 2 mol of gas, raising the yield.
      - About 450 °C is a compromise between yield and rate.
      - Iron speeds up reaching equilibrium without changing the yield.
      - Removing ammonia and recycling unreacted gases shift the equilibrium right and save materials.
    explanation: |-
      Every condition follows from the equilibrium: pressure and product removal raise the yield, temperature trades yield for rate, and the catalyst buys time rather than product.
