id: gases-pressure-collisions
subject: "9701"
topic: "4.1"
title: "Why a gas pushes: pressure from collisions"
summary: Gas pressure is a hailstorm of tiny molecular hits on the container walls — where it comes from, and why heating or squeezing a gas changes it.
order: 1
minutes: 4
objectives: ["4.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.1, learning outcome 1: explain the origin of pressure in a gas in
    terms of collisions between gas molecules and the wall of the container). All
    questions are original.
    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
