blocks:
  - type: objective
    body: |
      By the end you can explain where a gas's pressure comes from, and why heating a gas or squeezing it into a smaller space raises its pressure.

  - type: explain
    title: A balloon is a trillions-of-hits-a-second storm
    body: |
      A gas is an enormous number of tiny particles flying in straight lines in every direction.

      They are far apart compared with their size, and they keep bouncing off whatever wall contains them — a balloon skin, a tyre wall, a piston.

      Each bounce gives the wall a tiny push. Trillions of pushes every second add up to a steady, outward push we can measure.

  - type: definition
    term: Pressure
    body: |
      **Pressure** is the force per unit area acting at right angles to a surface:

      $$p = \dfrac{F}{A}$$

      where $p$ is pressure, $F$ is the force and $A$ is the area. The SI unit is the **pascal**, $\text{Pa}$, and $1\ \text{Pa} = 1\ \text{N m}^{-2}$.

  - type: intuition
    title: Rain on a tin roof
    body: |
      Stand under a tin roof in rain: one drop is nothing, but millions of drops per second make a steady roar and push on the sheet.

      Gas molecules are the raindrops, the container wall is the roof, and pressure is the average push.

      Where the analogy breaks: raindrops splash and stop. Gas molecules **bounce** off the wall and keep going — that bounce is what keeps the push going.

  - type: check
    title: Quick check
    questions: [pressure-from-what, pressure-formula]

  - type: explain
    title: "Two dials: how often, and how hard"
    body: |
      The push from each collision depends on two things:

      - **How often** molecules hit the wall (collision frequency).
      - **How hard** each hit is (faster molecules hit harder).

      So anything that increases either dial raises the pressure:

      | change | what happens to the molecules | effect on pressure |
      | --- | --- | --- |
      | heat the gas (constant volume) | molecules move **faster** | hits are harder **and** more often → pressure **rises** |
      | squeeze the gas (constant temperature) | same speeds, but wall area per molecule is smaller | hits per second per unit area **rise** → pressure **rises** |
      | pump in more gas | more molecules in the same space | more hits per second → pressure **rises** |

  - type: example
    title: Pressure from a force
    problem: |
      A gas pushes on a piston of area $0.50\ \text{m}^2$ with a total force of $250\ \text{N}$. What pressure does the gas exert?
    steps:
      - 'Write down the definition: $p = \dfrac{F}{A}$.'
      - 'Substitute the numbers: $p = \dfrac{250}{0.50}$.'
      - 'Calculate: $p = 500\ \text{Pa}$ (or $500\ \text{N m}^{-2}$).'
    answer: "500 Pa"

  - type: diagram
    diagram: chem-gases-molecular-collisions
    alt: "A sealed box full of gas molecules drawn as small spheres with straight arrows showing their motion in random directions. On the right-hand wall, three highlighted molecules are shown at the moment of impact, each leaving a small arrow pushing into the wall. A label reads: each bounce pushes on the wall; billions of bounces per second give a steady force per unit area, the pressure. A second panel shows the same box with the molecules moving faster (longer arrows) after heating, with more impact marks on the wall, labelled pressure rises."

  - type: misconceptions
    items:
      - wrong: "Gas pressure comes from the weight of the gas pressing down."
        right: "Pressure comes from molecules **colliding with the walls**, in every direction — even upwards against the lid. (Weight only adds a tiny extra pressure with height.)"
      - wrong: "Gas molecules push each other apart, and that push is the pressure."
        right: "Molecules in a gas barely notice each other. The pressure is the sum of the impacts on the **walls**."
      - wrong: "A faster molecule hits the wall more often."
        right: "Faster molecules hit harder **and** cross the box more often, so both dials turn up — but the speed itself is about how hard each hit is."

  - type: check
    title: Changing the pressure
    questions: [heating-a-gas, squeezing-explanation]

  - type: exam
    body: |
      - "Explain the origin of pressure in a gas" needs three ideas: molecules move randomly and **collide with the walls**; each collision exerts a **force** on the wall; the collisions are so frequent that they give a steady **force per unit area**.
      - Use the word **collisions** — "molecules push on the walls" alone usually loses the mark.
      - If the question gives a force and an area, use $p = \dfrac{F}{A}$ and check your unit: $\text{N} \div \text{m}^2 = \text{N m}^{-2} = \text{Pa}$.

  - type: deeper
    title: Why a bounce is a force at all
    body: |
      When a molecule bounces, its velocity reverses, so its **momentum** changes.

      Newton's second law in momentum form says force = rate of change of momentum, so each molecular bounce delivers a tiny impulse.

      The wall adds up trillions of these tiny impulses per second and feels a steady average force. This is the same physics that makes a garden hose kick back when you turn the tap on.

  - type: takeaways
    items:
      - "A gas is particles in random motion; each collision with a wall gives the wall a tiny push."
      - 'Pressure = force per unit area, $p = \dfrac{F}{A}$, measured in pascals, Pa.'
      - "Heating, squeezing or adding gas all raise the pressure — by making hits harder, more frequent, or both."

questions:
  - id: pressure-from-what
    format: mcq
    difficulty: 1
    objectives: ["4.1.1"]
    prompt: |
      Where does the pressure of a gas in a sealed container come from?
    options:
      - text: |
          The weight of the gas pressing down on the bottom of the container.
        why: |
          The weight of a gas is tiny. Pressure acts on **all** the walls, including the lid, which the weight cannot explain.
      - text: |
          The collisions of gas molecules with the walls of the container.
        correct: true
        why: |
          Every bounce exerts a tiny force on the wall; the huge number of bounces per second gives a steady force per unit area.
      - text: |
          The repulsion between gas molecules pushing them away from each other.
        why: |
          Gas molecules are mostly far apart and barely attract or repel each other. It is the walls, not the other molecules, that feel the push.
      - text: |
          The attractive forces between the gas molecules and the container walls.
        why: |
          Attraction to the wall would pull the gas towards the wall, not push outwards. The push comes from impacts.
    explanation: |
      Pressure is the summed effect of countless molecular collisions with the container walls.

  - id: pressure-formula
    format: numeric
    difficulty: 1
    objectives: ["4.1.1"]
    prompt: |
      A gas pushes on a piston of area $0.40\ \text{m}^2$ with a total force of $200\ \text{N}$. What is the pressure of the gas, in Pa?
    fields:
      - answer: 500
        unit: Pa
    explanation: |
      $p = \dfrac{F}{A} = \dfrac{200}{0.40} = 500\ \text{Pa}$. The pascal is just a newton per square metre.

  - id: heating-a-gas
    format: mcq
    difficulty: 2
    objectives: ["4.1.1"]
    prompt: |
      A fixed amount of gas is kept in a rigid, sealed box and heated. Why does the pressure rise?
    options:
      - text: |
          The molecules expand, so they take up more room and hit the walls more.
        why: |
          Molecules do not expand on heating — they move **faster**. It is the average speed that changes.
      - text: |
          The molecules move faster, so each collision with the wall is harder and collisions are more frequent.
        correct: true
        why: |
          Both dials turn up: faster molecules hit with more force and cross the box more often, so the force per unit area rises.
      - text: |
          The molecules attract each other more strongly at higher temperature.
        why: |
          Intermolecular attractions do not grow with heating; if anything, faster molecules overcome them more easily.
      - text: |
          The volume of the box increases when it is heated.
        why: |
          The box is rigid, so the volume is fixed. With the same volume, the pressure rise comes purely from faster molecules.
    explanation: |
      At constant volume, heating raises the average molecular speed, so wall collisions are both harder and more frequent.

  - id: squeezing-explanation
    format: cloze
    difficulty: 2
    objectives: ["4.1.1"]
    prompt: |
      A gas is squeezed into half its volume at constant temperature. Its molecules move at the same speed, but they now hit each unit area of wall {{1}} often, so the pressure {{2}}.
    blanks:
      - accept: ["more", "more frequently", "more often", "twice as", "twice as often", "2 times as often"]
      - accept: ["rises", "increases", "goes up", "is higher", "doubles", "is doubled"]
    explanation: |
      Same speeds, but half the volume means the wall is twice as crowded with impacts per second per unit area — so the pressure rises (it doubles).
