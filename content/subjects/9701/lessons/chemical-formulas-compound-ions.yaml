id: chemical-formulas-compound-ions
subject: "9701"
topic: "2.3"
title: The nine ions to know by heart
summary: Names, formulas and charges of the nine ions the syllabus says you must recall, plus the patterns that make them stick.
order: 2
minutes: 4
objectives: ["2.3.1"]
prerequisites: [chemical-formulas-predicting-ion-charges]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.1, part (b): the names and formulas
    of NO₃⁻, CO₃²⁻, SO₄²⁻, OH⁻, NH₄⁺, Zn²⁺, Ag⁺, HCO₃⁻ and PO₄³⁻). The periodic pattern
    for the four oxo-anions is offered as a memory aid only. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can recall the name, formula and charge of all nine ions on the syllabus list, and use two patterns to rebuild them if your memory blanks.

  - type: explain
    title: Nine ions. That's the whole list.
    body: |
      The Periodic Table gives you simple ions for free. These nine you have to **learn**, and the syllabus says so by name. Learn them once and they pay out marks in every topic from here to A level.

      | ion | formula | charge |
      | --- | --- | --- |
      | ammonium | $\text{NH}_4^{+}$ | 1+ |
      | silver | $\text{Ag}^{+}$ | 1+ |
      | zinc | $\text{Zn}^{2+}$ | 2+ |
      | hydroxide | $\text{OH}^{-}$ | 1− |
      | nitrate | $\text{NO}_3^{-}$ | 1− |
      | hydrogencarbonate | $\text{HCO}_3^{-}$ | 1− |
      | carbonate | $\text{CO}_3^{2-}$ | 2− |
      | sulfate | $\text{SO}_4^{2-}$ | 2− |
      | phosphate | $\text{PO}_4^{3-}$ | 3− |

      The ions with more than one atom ($\text{NH}_4^+$, $\text{OH}^-$ and the -ate family) are **compound ions**: a group of covalently bonded atoms carrying an overall charge. They stay together as one unit in reactions and in formulas.

  - type: check
    title: Quick check
    questions: [sulfate-formula, hydrogencarbonate-name, silver-ion]

  - type: diagram
    diagram: chem-chemical-formulas-ion-patterns
    alt: "A memory map in three parts. Top left: the four -ate ions placed in a mini Periodic Table grid with columns group 14, 15, 16. In period 2, carbon holds CO3 2− carbonate and nitrogen holds NO3 − nitrate, with a note that period 2 central atoms have three O atoms. In period 3, phosphorus holds PO4 3− phosphate and sulfur holds SO4 2− sulfate, with a note that period 3 central atoms have four O atoms. An arrow pointing left says one place left along a period equals one more negative charge. Top right: add H+ and the charge goes up by 1: CO3 2− + H+ gives HCO3 − hydrogencarbonate; NH3 + H+ gives NH4 + ammonium, noting that ammonia, NH3, has no charge. Then three single cards: OH− hydroxide, Zn2+ zinc, Ag+ silver, with a note that Zn2+ and Ag+ are d-block ions with one fixed charge so need no Roman numeral. Bottom: all nine sorted by charge: 1+ NH4+ and Ag+; 2+ Zn2+; 1− OH−, NO3− and HCO3−; 2− CO3 2− and SO4 2−; 3− PO4 3−."
    caption: Two patterns rebuild six of the nine. Only OH⁻, Zn²⁺ and Ag⁺ are pure memory.

  - type: intuition
    title: Pattern 1, the -ate ions copy the Periodic Table
    body: |
      Put each -ate ion where its central atom lives:

      - **Period 2** (C, N): three oxygens. $\text{CO}_3^{2-}$, $\text{NO}_3^{-}$.
      - **Period 3** (P, S): four oxygens. $\text{PO}_4^{3-}$, $\text{SO}_4^{2-}$.
      - Step **one place left** along the period and the ion gains **one more negative charge**: N → C goes 1− → 2−; S → P goes 2− → 3−.

      Where it breaks: this is a memory trick for these four ions, not a law. Sulfur also makes $\text{SO}_3^{2-}$ (sulfite), for example, so don't use the pattern to invent new ions.

  - type: intuition
    title: Pattern 2, adding H⁺ cancels one minus
    body: |
      An $\text{H}^+$ brings one positive charge, so the overall charge goes up by one:

      $$\text{CO}_3^{2-} + \text{H}^+ \rightarrow \text{HCO}_3^{-} \qquad\qquad \text{NH}_3 + \text{H}^+ \rightarrow \text{NH}_4^{+}$$

      That's why hydrogen**carbonate** is 1− and ammon**ium** is 1+. And it's a great way to remember the difference between **ammonia** ($\text{NH}_3$, a neutral molecule) and **ammonium** ($\text{NH}_4^+$, an ion).

  - type: check
    title: Patterns
    questions: [phosphate-ammonium-cloze, positive-ion, same-charge]

  - type: misconceptions
    items:
      - wrong: "Ammonia and ammonium are the same thing."
        right: "Ammonia, $\\text{NH}_3$, is a neutral molecule. Ammonium, $\\text{NH}_4^+$, is an ion."
      - wrong: "Sulfate is $\\text{S}^{2-}$."
        right: "$\\text{S}^{2-}$ is sulf**ide**. Sulf**ate** contains oxygen: $\\text{SO}_4^{2-}$. -ide usually means just the element (hydroxide, $\\text{OH}^-$, is the famous exception); -ate means oxygen is in there too."
      - wrong: "Hydroxide is $\\text{OH}^{+}$ or $\\text{HO}_2^-$."
        right: "One O, one H, one negative charge: $\\text{OH}^-$."
      - wrong: "Phosphate is $\\text{PO}_4^{2-}$, like sulfate."
        right: "One place left of sulfur, one more minus: $\\text{PO}_4^{3-}$."

  - type: exam
    body: |
      - You'll often see systematic names on papers: **nitrate(V)**, **sulfate(VI)**, **phosphate(V)**. Same ions, same charges.
      - "Hydrogencarbonate" is one word in IUPAC style. "Bicarbonate" is the kitchen name; don't use it in an exam.
      - Build flashcards of all nine (formula on one side, name and charge on the other) and test yourself until it's instant. Spaced practice beats one long cram.

  - type: takeaways
    items:
      - "Positive: $\\text{NH}_4^+$, $\\text{Ag}^+$, $\\text{Zn}^{2+}$."
      - "Negative: $\\text{OH}^-$, $\\text{NO}_3^-$, $\\text{HCO}_3^-$ (1−); $\\text{CO}_3^{2-}$, $\\text{SO}_4^{2-}$ (2−); $\\text{PO}_4^{3-}$ (3−)."
      - "-ate ions: period 2 has three O, period 3 has four O; one place left = one more minus."
      - "Adding $\\text{H}^+$ raises the charge by one: $\\text{CO}_3^{2-} \\rightarrow \\text{HCO}_3^-$, $\\text{NH}_3 \\rightarrow \\text{NH}_4^+$."

questions:
  - id: sulfate-formula
    format: mcq
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      What is the formula of the sulfate ion?
    options:
      - text: |
          $\text{SO}_4^{2-}$
        correct: true
        why: |
          Period 3 central atom, four oxygens, 2− charge.
      - text: |
          $\text{SO}_3^{2-}$
        why: |
          That's sulfite, a different ion (sulfur in a lower oxidation state). It's not on the list.
      - text: |
          $\text{SO}_4^{-}$
        why: |
          Right atoms, wrong charge. Sulfate is 2−.
      - text: |
          $\text{S}^{2-}$
        why: |
          That's sulfide: no oxygen.
    explanation: |
      Sulfate is $\text{SO}_4^{2-}$. Name ends in -ate, so it contains oxygen.

  - id: hydrogencarbonate-name
    format: text
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Name the ion $\text{HCO}_3^{-}$.
    accept:
      - "hydrogencarbonate"
      - "hydrogen carbonate"
      - "hydrogencarbonate ion"
      - "hydrogen carbonate ion"
      - "hydrogen-carbonate"
    model: |
      Hydrogencarbonate.
    explanation: |
      Carbonate ($\text{CO}_3^{2-}$) plus $\text{H}^+$ gives $\text{HCO}_3^-$, hydrogencarbonate. (Its old name, bicarbonate, isn't used in exams.)

  - id: phosphate-ammonium-cloze
    format: cloze
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      The phosphate ion is $\text{PO}_4$ with a charge of {{1}}. The ammonium ion has the formula {{2}} (without the charge) and a charge of 1+.
    blanks:
      - accept: ["3−", "3-", "-3", "−3", "minus 3"]
      - accept: ["NH4", "NH₄", "NH4+", "NH₄⁺", "NH4^+"]
    explanation: |
      Phosphate is $\text{PO}_4^{3-}$ (one place left of sulfate, one more minus). Ammonium is $\text{NH}_4^{+}$: ammonia, $\text{NH}_3$, plus $\text{H}^+$.

  - id: positive-ion
    format: mcq
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Which of these is a **positive** compound ion?
    options:
      - text: |
          $\text{NH}_4^{+}$
        correct: true
        why: |
          Ammonium: the only positive compound ion on the list.
      - text: |
          $\text{NH}_3$
        why: |
          Ammonia is a neutral molecule, not an ion.
      - text: |
          $\text{OH}^{-}$
        why: |
          Hydroxide is negative.
      - text: |
          $\text{NO}_3^{-}$
        why: |
          Nitrate is negative.
    explanation: |
      Of the nine, the positive ones are $\text{NH}_4^+$, $\text{Ag}^+$ and $\text{Zn}^{2+}$, and only ammonium is a compound ion.

  - id: same-charge
    format: mcq
    difficulty: 2
    objectives: ["2.3.1"]
    prompt: |
      Which pair of ions have **exactly the same** charge?
    options:
      - text: |
          carbonate and sulfate
        correct: true
        why: |
          Both are 2−: $\text{CO}_3^{2-}$ and $\text{SO}_4^{2-}$.
      - text: |
          nitrate and carbonate
        why: |
          Nitrate is 1−, carbonate is 2− (one place left, one more minus).
      - text: |
          sulfate and phosphate
        why: |
          Sulfate is 2−, phosphate is 3−.
      - text: |
          ammonium and hydroxide
        why: |
          Same size of charge, opposite signs: 1+ and 1−.
    explanation: |
      Sorted by charge: 1− is $\text{OH}^-$, $\text{NO}_3^-$, $\text{HCO}_3^-$; 2− is $\text{CO}_3^{2-}$, $\text{SO}_4^{2-}$; 3− is $\text{PO}_4^{3-}$.

  - id: silver-ion
    format: text
    difficulty: 1
    objectives: ["2.3.1"]
    prompt: |
      Write the formula of the silver ion, including its charge (type it like `Na+` or `Mg2+`).
    accept: ["Ag+", "Ag^+", "Ag⁺", "Ag1+", "Ag^1+", "Ag¹⁺", "Ag +", "Ag 1+"]
    model: |
      $\text{Ag}^{+}$
    explanation: |
      Silver forms only $\text{Ag}^+$ in compounds at this level, which is why "silver nitrate" needs no Roman numeral.
