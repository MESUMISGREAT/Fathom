id: gases-mr-determination
subject: "9701"
topic: "4.1"
title: Finding Mr from gas data
summary: How to turn the ideal gas equation into a relative molecular mass — the weigh–measure–calculate routine, worked twice with full steps.
order: 4
minutes: 4
objectives: ["4.1.3"]
prerequisites: [gases-pv-nrt]
