blocks:
  - type: objective
    body: |
      By the end you can find the relative molecular mass, $M_r$, of a gas from its mass, pressure, volume and temperature.

  - type: explain
    title: "The idea: weigh the gas, count the moles"
    body: |
      Moles are the bridge between mass and formula:

      $$n = \dfrac{m}{M}$$

      where $m$ is the mass in grams and $M$ is the molar mass in $\text{g mol}^{-1}$.

      The **relative molecular mass**, $M_r$, is the same number as $M$ without units — the mass of one molecule relative to $\dfrac{1}{12}$ the mass of a carbon-12 atom.

      So if we can measure a gas's **mass** and its **moles**, we can find $M_r$.

  - type: intuition
    title: Why gas data gives moles so easily
    body: |
      Counting moles of a solid means weighing it and knowing $M_r$ — which is what we want! With a gas there is a shortcut: $pV = nRT$ counts the moles **for you** from $p$, $V$ and $T$.

      Then $M_r = \dfrac{m}{n}$: the mass you weighed, divided by the moles the gas equation counted.

      That is the whole trick: **measure $m$, $p$, $V$, $T$; get $n$ from $pV = nRT$; then $M_r = \dfrac{m}{n}$.**

  - type: definition
    term: Working formula for Mr
    body: |
      Combining $n = \dfrac{m}{M_r}$ with $pV = nRT$ gives:

      $$M_r = \dfrac{mRT}{pV}$$

      with $m$ in grams, $p$ and $V$ in your chosen recipe's units ($\text{kPa}$ and $\text{dm}^3$, or $\text{Pa}$ and $\text{m}^3$), and $T$ in kelvin.

  - type: example
    title: Mr of a gas from a syringe
    problem: |
      A gas syringe holds $120\ \text{cm}^3$ of a gas at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$. The gas in the syringe has a mass of $0.140\ \text{g}$. Calculate $M_r$ for the gas. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    steps:
      - 'List and convert: $m = 0.140\ \text{g}$, $V = 120\ \text{cm}^3 = 0.120\ \text{dm}^3$, $p = 100\ \text{kPa}$, $T = 25 + 273 = 298\ \text{K}$.'
      - 'Find the moles first: $n = \dfrac{pV}{RT} = \dfrac{100 \times 0.120}{8.31 \times 298} = \dfrac{12.0}{2476} = 0.004846\ \text{mol}$.'
      - 'Divide mass by moles: $M_r = \dfrac{m}{n} = \dfrac{0.140}{0.004846} = 28.9$.'
      - 'Or do it in one formula: $M_r = \dfrac{mRT}{pV} = \dfrac{0.140 \times 8.31 \times 298}{100 \times 0.120} = 28.9$.'
    answer: "Mr = 28.9"

  - type: example
    title: Mr from gas density
    problem: |
      At $100\ \text{kPa}$ and $25\ ^\circ\text{C}$, a gas has a density of $1.78\ \text{g dm}^{-3}$. Calculate its $M_r$.
    steps:
      - 'Density is mass per volume, so use $1\ \text{dm}^3$ of the gas: $m = 1.78\ \text{g}$, $V = 1.00\ \text{dm}^3$.'
      - 'Convert temperature: $T = 298\ \text{K}$.'
      - 'Apply the formula: $M_r = \dfrac{mRT}{pV} = \dfrac{1.78 \times 8.31 \times 298}{100 \times 1.00}$.'
      - '$M_r = 44.1$ (a gas like $\text{CO}_2$, whose $M_r$ is 44.0 — the small difference is rounding in the density).'
    answer: "Mr = 44.1"

  - type: misconceptions
    items:
      - wrong: "Use the mass of the container too."
        right: "Only the **gas**'s mass goes in: usually (mass of flask + gas) − (mass of empty flask)."
      - wrong: 'Put the mass in kg into $M_r = \dfrac{mRT}{pV}$ with $\text{kPa}$ and $\text{dm}^3$.'
        right: 'Use grams. $M_r = \dfrac{m}{n}$ works with $m$ in grams because $M$ is in $\text{g mol}^{-1}$.'
      - wrong: '$M_r$ has units of $\text{g mol}^{-1}$.'
        right: '$M_r$ is **relative**, so it has no units. The molar mass $M$ carries $\text{g mol}^{-1}$; the number is the same.'

  - type: check
    title: Try it yourself
    questions: [mr-from-syringe, mr-from-density, mass-from-mr]

  - type: exam
    body: |
      - Common setup: a flask of known volume is filled with the gas at known $p$ and $T$, and the mass of gas is found by difference.
      - Order of work that earns method marks: convert units → find $n = \dfrac{pV}{RT}$ → $M_r = \dfrac{m}{n}$.
      - Sanity check your answer: most common gases have $M_r$ between 2 (H₂) and 150. An answer like 29000 usually means a forgotten $\text{cm}^3$ conversion.

  - type: takeaways
    items:
      - '$M_r = \dfrac{m}{n}$, and $n$ comes from the ideal gas equation.'
      - 'One-formula version: $M_r = \dfrac{mRT}{pV}$, with $m$ in grams.'
      - 'For a density problem, take a $1\ \text{dm}^3$ sample so mass and density have the same number.'

questions:
  - id: mr-from-syringe
    format: numeric
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      A gas occupies $120\ \text{cm}^3$ at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$ and has a mass of $0.140\ \text{g}$. Calculate its relative molecular mass, $M_r$, to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 28.9
        tolerance: { rel: 0.01 }
        sigFigs: 3
    explanation: |
      $n = \dfrac{pV}{RT} = \dfrac{100 \times 0.120}{8.31 \times 298} = 0.004846\ \text{mol}$; $M_r = \dfrac{0.140}{0.004846} = 28.9$. ($M_r$ has no units.)

  - id: mr-from-density
    format: numeric
    difficulty: 3
    objectives: ["4.1.3"]
    prompt: |
      A gas has a density of $1.78\ \text{g dm}^{-3}$ at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$. Calculate its $M_r$ to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 44.1
        tolerance: { rel: 0.01 }
        sigFigs: 3
    explanation: |
      Use $1\ \text{dm}^3$: $m = 1.78\ \text{g}$. $M_r = \dfrac{mRT}{pV} = \dfrac{1.78 \times 8.31 \times 298}{100 \times 1.00} = 44.1$.

  - id: mass-from-mr
    format: numeric
    difficulty: 3
    objectives: ["4.1.3"]
    prompt: |
      What mass of carbon dioxide, $\text{CO}_2$ ($M_r = 44.0$), occupies $250\ \text{cm}^3$ at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$? Give your answer in grams to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 0.444
        tolerance: { rel: 0.01 }
        sigFigs: 3
        unit: g
    explanation: |
      $n = \dfrac{pV}{RT} = \dfrac{100 \times 0.250}{8.31 \times 298} = 0.01010\ \text{mol}$. Then $m = n \times M_r = 0.01010 \times 44.0 = 0.444\ \text{g}$.
