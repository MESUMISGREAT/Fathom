id: period-3-physical-melting-point-conductivity
subject: "9701"
topic: "9.1"
title: "Physical properties of Period 3 elements — radius, melting point, conductivity"
summary: "How atomic radius, ionic radius, melting point and electrical conductivity vary across Period 3, and why the changes reflect the shift from metallic to covalent bonding."
order: 1
minutes: 6
kind: core
objectives: ["9.1.1", "9.1.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027, topic 9.1 learning outcomes 1 and 2: periodicity of physical
    properties (atomic/ionic radius, melting point, electrical conductivity) and explaining
    the variation in melting point and conductivity in terms of structure and bonding.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can describe how atomic radius, ionic radius, melting point and electrical conductivity change across Period 3, and explain the trends in melting point and conductivity using the bonding and structure of each element.

  - type: explain
    title: The periodic table as a landscape
    body: |
      Period 3 runs **Na Mg Al Si P S Cl Ar**. Going left to right, the nuclear charge increases by one each step while electrons fill the **same** principal shell (n = 3). That single fact drives almost every physical trend in the period.

      The elements start as **metals** (Na, Mg, Al) with delocalised electrons, pass through a **metalloid** (Si) with giant covalent bonding, and end as **non-metals** (P, S, Cl, Ar) with simple molecular or atomic structures.

  - type: explain
    title: Atomic and ionic radius
    body: |
      **Atomic radius** decreases across the period. The increasing nuclear charge pulls the outer electrons closer, so the atoms get smaller. Argon is not assigned a covalent radius in the Data Booklet because it does not form covalent bonds.

      **Ionic radius** follows a different pattern:

      - **Cations** (Na⁺, Mg²⁺, Al³⁺) are **smaller** than their parent atoms — they have lost their outer shell, and the increased effective nuclear charge pulls the remaining electrons tighter.
      - **Anions** (P³⁻, S²⁻, Cl⁻) are **larger** than their parent atoms — they have gained electrons into the same shell, increasing electron–electron repulsion.

      The Data Booklet values (in pm) give the picture:
      - Na 186, Mg 160, Al 143, Si 117, P 110, S 104, Cl 99 (atomic, covalent radii)
      - Na⁺ 102, Mg²⁺ 72, Al³⁺ 53 (cationic radii)
      - P³⁻ 212, S²⁻ 184, Cl⁻ 181 (anionic radii)

  - type: check
    title: Radius trends
    questions: [atomic-radius-trend, cation-vs-anion-size]

  - type: explain
    title: Melting point — the bonding switch
    body: |
      The melting points (in °C) tell the bonding story:

      | element | structure | bonding | melting point / °C |
      | --- | --- | --- | --- |
      | Na | giant metallic | metallic | 98 |
      | Mg | giant metallic | metallic | 650 |
      | Al | giant metallic | metallic | 660 |
      | Si | giant covalent | covalent | 1414 |
      | P₄ | simple molecular | covalent inside P₄; van der Waals between molecules | 44 |
      | S₈ | simple molecular | covalent inside S₈; van der Waals between molecules | 115 |
      | Cl₂ | simple molecular | covalent inside Cl₂; van der Waals between molecules | −101 |
      | Ar | monatomic | van der Waals only | −189 |

      Three regimes:

      1. **Na, Mg, Al — giant metallic lattices.** The melting point depends on the strength of the metallic bond: more delocalised electrons and smaller ions give stronger attraction. Mg and Al are much higher than Na because Mg²⁺ and Al³⁺ have greater charge density.

      2. **Si — giant covalent lattice.** Every atom is bonded to four neighbours in a diamond-like network. Breaking this requires breaking **all** the strong Si–Si covalent bonds, so the melting point is very high (1414 °C).

      3. **P, S, Cl, Ar — simple molecular.** The molecules are held by weak **van der Waals forces**. Larger molecules (P₄, S₈) have more electrons and stronger van der Waals forces, so the melting points rise from Cl₂ to P₄ to S₈, but they are all very low compared to the giant structures.

  - type: check
    title: Melting point
    questions: [si-high-mp, molecular-mp-trend]

  - type: explain
    title: Electrical conductivity
    body: |
      Electrical conductivity requires **mobile charge carriers**:

      - **Na, Mg, Al** — delocalised electrons in the metallic lattice carry current. Conductivity increases from Na to Al because there are more delocalised electrons per atom (1, 2, 3) and the ions are smaller, so electrons move more freely.
      - **Si** — a semiconductor. Essentially all its outer electrons are locked in covalent bonds at room temperature, but thermal energy promotes a few across the band gap. Conductivity is very low but increases with temperature.
      - **P, S, Cl, Ar** — no delocalised electrons, no ions free to move. They are **insulators** (conductivity essentially zero).

  - type: check
    title: Conductivity
    questions: [conductivity-na-to-al, silicon-semiconductor]

  - type: example
    title: Worked example — explaining the melting point trend
    problem: |
      Explain why the melting point of silicon is much higher than that of phosphorus.
    steps:
      - "Silicon has a **giant covalent** structure: each Si atom forms four strong covalent bonds in a continuous network. Melting requires breaking these bonds throughout the lattice."
      - "Phosphorus exists as **simple P₄ molecules** held together only by weak van der Waals forces. Melting only requires overcoming these weak intermolecular forces."
      - "Covalent bonds are far stronger than van der Waals forces, so Si melts at 1414 °C while P₄ melts at 44 °C."
    answer: |
      Silicon is giant covalent (strong bonds throughout the lattice); phosphorus is simple molecular (weak van der Waals forces between P₄ molecules). Breaking covalent bonds needs much more energy.

  - type: intuition
    title: Why the trends matter
    body: |
      The physical properties are a direct read-out of the bonding. If you can explain *why* the melting point jumps at Si and collapses at P, you have understood the metal → metalloid → non-metal transition that underpins the chemical behaviour in topic 9.2.

      The same bonding shift explains the chemical trends: metallic oxides are basic, the giant covalent oxide (SiO₂) is acidic, and the molecular oxides (P₄O₁₀, SO₂, SO₃) are also acidic.

  - type: misconceptions
    items:
      - wrong: "Atomic radius increases across a period because you are adding protons."
        right: "Atomic radius **decreases** because the added protons pull the same shell of electrons closer. You are not adding a new shell until the next period."
      - wrong: "All Period 3 elements conduct electricity because they are in the same period."
        right: "Only the metals (Na, Mg, Al) conduct well. Silicon is a semiconductor; P, S, Cl, Ar are insulators."
      - wrong: "Phosphorus has a higher melting point than sulfur because it has more protons."
        right: "Phosphorus (P₄) melts at 44 °C, sulfur (S₈) at 115 °C. Sulfur's larger molecules have more electrons and stronger van der Waals forces, so its melting point is higher."

  - type: exam
    body: |
      - Questions often ask you to **describe** the trend (e.g. "atomic radius decreases") and then **explain** it (e.g. "increasing nuclear charge, same shell"). Give both parts.
      - For melting point, name the **structure** (giant metallic, giant covalent, simple molecular) and the **forces** broken (metallic bonds, covalent bonds, van der Waals forces).
      - For conductivity, name the **charge carrier** (delocalised electrons, none) and how it changes (increases Na → Al due to more electrons and smaller ions).
      - The Data Booklet gives radii and melting points — quote them when asked for evidence.

  - type: takeaways
    items:
      - "Atomic radius decreases across Period 3: increasing nuclear charge pulls the outer shell closer."
      - "Cations are smaller than their atoms; anions are larger."
      - "Melting points: Na (98), Mg (650), Al (660), Si (1414) — giant structures; then P₄ (44), S₈ (115), Cl₂ (−101), Ar (−189) — simple molecular."
      - "Conductivity: metals conduct via delocalised electrons (Na < Mg < Al); Si is a semiconductor; P, S, Cl, Ar are insulators."
      - "The physical trends are caused by the bonding change: metallic → giant covalent → simple molecular."

questions:
  - id: atomic-radius-trend
    format: mcq
    difficulty: 1
    objectives: ["9.1.1"]
    prompt: |
      How does the atomic radius change across Period 3 from sodium to chlorine?
    options:
      - text: |
          It increases because the number of protons increases.
        why: |
          More protons pull the electrons closer; the radius decreases.
      - text: |
          It decreases because the nuclear charge increases while electrons are added to the same shell.
        correct: true
        why: |
          Each step adds one proton and one electron to the n = 3 shell. The greater effective nuclear charge draws the outer electrons inwards.
      - text: |
          It stays the same because all elements are in the same period.
        why: |
          Period means the same principal quantum number, not the same size. The nuclear charge changes.
      - text: |
          It decreases then increases.
        why: |
          The trend is monotonic — each element is smaller than the one before.
    explanation: |
      Across a period, electrons enter the same shell but the nuclear charge increases by one each time. The stronger pull shrinks the atom.

  - id: cation-vs-anion-size
    format: mcq
    difficulty: 2
    objectives: ["9.1.1"]
    prompt: |
      Which statement about ionic radii in Period 3 is correct?
    options:
      - text: |
          Na⁺ is larger than Na because it has lost an electron.
        why: |
          Losing the outer shell electrons makes the ion smaller, not larger.
      - text: |
          Cl⁻ is smaller than Cl because it has gained an electron.
        why: |
          Gaining an electron increases electron–electron repulsion in the same shell, making the ion larger.
      - text: |
          Mg²⁺ is smaller than Mg because it has lost its outer shell.
        correct: true
        why: |
          Mg²⁺ has the electron configuration of neon (2,8). The outer shell is gone, so the ion is much smaller.
      - text: |
          P³⁻ is smaller than P because the nucleus pulls harder.
        why: |
          P³⁻ has three extra electrons in the same shell, increasing repulsion and expanding the ion.
    explanation: |
      Cations lose the outer shell → smaller. Anions add electrons to the same shell → larger.

  - id: si-high-mp
    format: mcq
    difficulty: 2
    objectives: ["9.1.2"]
    prompt: |
      Why does silicon have a very high melting point (1414 °C) compared to phosphorus (44 °C)?
    options:
      - text: |
          Silicon has more protons, so the atoms attract each other more strongly.
        why: |
          Proton count alone doesn't determine melting point; structure and bonding do.
      - text: |
          Silicon forms a giant covalent lattice; phosphorus forms simple P₄ molecules.
        correct: true
        why: |
          In Si, every atom is covalently bonded to four neighbours in a continuous network. Melting breaks strong covalent bonds. In P₄, only weak van der Waals forces hold the molecules together.
      - text: |
          Silicon is a metal and phosphorus is a non-metal.
        why: |
          Silicon is a metalloid, not a metal. The key difference is structure, not the metal/non-metal label.
      - text: |
          The Si–Si bond is stronger than the P–P bond.
        why: |
          The P–P single bond is actually similar in strength to Si–Si. The difference is that Si forms a giant lattice while P forms discrete molecules.
    explanation: |
      Silicon is giant covalent (diamond structure); phosphorus is simple molecular (P₄). Breaking a giant covalent lattice needs far more energy than overcoming van der Waals forces between molecules.

  - id: molecular-mp-trend
    format: mcq
    difficulty: 2
    objectives: ["9.1.2"]
    prompt: |
      The melting points of the simple molecular elements in Period 3 are: Cl₂ (−101 °C), Ar (−189 °C), P₄ (44 °C), S₈ (115 °C). What explains the order?
    options:
      - text: |
          The more protons, the higher the melting point.
        why: |
          Ar has more protons than S but a much lower melting point.
      - text: |
          Larger molecules have more electrons and stronger van der Waals forces.
        correct: true
        why: |
          Van der Waals forces increase with molecular size (number of electrons). S₈ > P₄ > Cl₂ > Ar in molecular size and melting point.
      - text: |
          The bond strength in the molecules increases across the period.
        why: |
          Covalent bond strength within the molecules is not what is overcome on melting; intermolecular forces are.
      - text: |
          Electronegativity differences control the melting point.
        why: |
          Electronegativity affects bond polarity, not the van der Waals forces between non-polar molecules.
    explanation: |
      For simple molecular elements, melting point is governed by van der Waals forces, which increase with the number of electrons in the molecule. S₈ has the most electrons and the highest melting point.

  - id: conductivity-na-to-al
    format: mcq
    difficulty: 2
    objectives: ["9.1.2"]
    prompt: |
      Why does electrical conductivity increase from sodium to aluminium?
    options:
      - text: |
          The atoms get smaller, so electrons move faster.
        why: |
          Atom size is part of it, but the main factor is the number of delocalised electrons per atom.
      - text: |
          Each atom contributes more delocalised electrons (1 → 2 → 3) and the ions are smaller, giving a greater charge density.
        correct: true
        why: |
          Na gives 1, Mg gives 2 and Al gives 3 delocalised electrons per atom, so there are more charge carriers per unit volume. The ions are also smaller and more highly charged, which strengthens the metallic bonding.
      - text: |
          Aluminium is further to the right, so it is more metallic.
        why: |
          "More metallic" is not the reason; the number of valence electrons and ion charge density are the direct causes.
      - text: |
          The metallic bond gets more covalent.
        why: |
          The bonding stays metallic; it doesn't become covalent.
    explanation: |
      More delocalised electrons per atom (1, 2, 3) and smaller, more highly charged cations (Na⁺, Mg²⁺, Al³⁺) give a denser, more mobile electron sea, so conductivity rises.

  - id: silicon-semiconductor
    format: mcq
    difficulty: 2
    objectives: ["9.1.2"]
    prompt: |
      Silicon is described as a semiconductor. What does this mean for its electrical conductivity?
    options:
      - text: |
          It conducts as well as aluminium at room temperature.
        why: |
          Silicon's conductivity is many orders of magnitude lower than metals at room temperature.
      - text: |
          It does not conduct at all, like sulfur.
        why: |
          It has a small band gap; some electrons are thermally excited, giving a small but non-zero conductivity.
      - text: |
          Its conductivity is very low at room temperature but increases with temperature.
        correct: true
        why: |
          Thermal energy promotes electrons across the band gap, creating electron–hole pairs that can carry current. This is the opposite of metals, where conductivity decreases with temperature.
      - text: |
          It only conducts when molten.
        why: |
          It conducts (poorly) as a solid due to thermal excitation; it does not need to be molten.
    explanation: |
      Silicon has a band gap of about 1.1 eV. At room temperature a few electrons are thermally excited, giving a small conductivity that rises with temperature — the hallmark of a semiconductor.