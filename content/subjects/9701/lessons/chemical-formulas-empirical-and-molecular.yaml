id: chemical-formulas-empirical-and-molecular
subject: "9701"
topic: "2.3"
title: Empirical vs molecular formulas
summary: The definitions of empirical and molecular formula, how to get one from the other, and why ionic compounds only have an empirical formula.
order: 6
minutes: 4
objectives: ["2.3.3"]
prerequisites: [relative-masses-molecular-and-formula-mass]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.3: define and use empirical formula
    and molecular formula). Ar values from the Cambridge Data Booklet. Calculating
    empirical formulas from experimental data is in the following lessons (2.3.5). All
    questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define **empirical formula** and **molecular formula**, convert a molecular formula into an empirical one, and use $M_r$ to go back the other way.

  - type: explain
    title: Same recipe, different batch size
    body: |
      Glucose is $\text{C}_6\text{H}_{12}\text{O}_6$. Ethanoic acid (the acid in vinegar) is $\text{C}_2\text{H}_4\text{O}_2$. Methanal, used to preserve specimens, is $\text{CH}_2\text{O}$.

      Three very different molecules, and all three have atoms in the **same ratio**, $1 : 2 : 1$. That ratio is the **empirical formula**, $\text{CH}_2\text{O}$. The actual atom count in each molecule is the **molecular formula**.

  - type: definition
    term: Empirical formula
    body: |
      The simplest whole-number ratio of the atoms of each element present in a compound.

  - type: definition
    term: Molecular formula
    body: |
      The actual number of atoms of each element present in one molecule of a compound.

  - type: diagram
    diagram: chem-chemical-formulas-empirical-blocks
    alt: "Three rows of building blocks, each block labelled CH2O, under the heading empirical formula CH2O, empirical formula mass 30.0. Methanal, CH2O, is one block, n = 1, Mr 30.0. Ethanoic acid, C2H4O2, is two blocks, n = 2, Mr 60.0. Glucose, C6H12O6, is six blocks, n = 6, Mr 180.0. Below: molecular formula = n × empirical formula, where n = Mr ÷ empirical formula mass, for example glucose 180.0 ÷ 30.0 = 6."
    caption: A molecular formula is a whole number of empirical-formula blocks.

  - type: explain
    title: Molecular → empirical (easy direction)
    body: |
      Divide every subscript by their **highest common factor**.

      | compound | molecular formula | divide by | empirical formula |
      | --- | --- | --- | --- |
      | butane | $\text{C}_4\text{H}_{10}$ | 2 | $\text{C}_2\text{H}_5$ |
      | benzene | $\text{C}_6\text{H}_6$ | 6 | CH |
      | hydrogen peroxide | $\text{H}_2\text{O}_2$ | 2 | HO |
      | water | $\text{H}_2\text{O}$ | 1 | $\text{H}_2\text{O}$ (already simplest) |

  - type: check
    title: Quick check
    questions: [define-empirical, butane-empirical, same-empirical]

  - type: explain
    title: Empirical → molecular (needs one more fact)
    body: |
      The empirical formula alone can't tell you the molecule. $\text{CH}_2\text{O}$ could be methanal, ethanoic acid or glucose. You need the **relative molecular mass**, $M_r$:

      $$n = \frac{M_r}{\text{empirical formula mass}} \qquad\qquad \text{molecular formula} = (\text{empirical formula})_n$$

      $n$ must come out as a whole number (or very close). If it doesn't, recheck your empirical formula.

  - type: example
    title: Find the molecule
    problem: |
      A hydrocarbon has empirical formula $\text{CH}_2$ and $M_r = 56.0$. Find its molecular formula. ($A_r$: C = 12.0, H = 1.0)
    steps:
      - |
        Empirical formula mass of $\text{CH}_2$: $12.0 + 2(1.0) = 14.0$
      - |
        $n = 56.0 \div 14.0 = 4$
      - |
        Multiply every subscript by 4: $\text{C}_4\text{H}_8$
      - |
        Check: $4(12.0) + 8(1.0) = 56.0$ ✓
    answer: |
      $\text{C}_4\text{H}_8$

  - type: check
    title: Use it
    questions: [lactic-carbon, dichloro-molecular]

  - type: intuition
    title: Why ionic compounds are always "empirical"
    body: |
      Sodium chloride has no molecules: it's a giant lattice of ions in a $1 : 1$ ratio. So "NaCl" can only ever be an empirical formula. The same goes for giant covalent substances like $\text{SiO}_2$. Molecular formulas only exist for things made of molecules.

  - type: check
    title: Big picture
    questions: [nacl-formula-type, benzene-explain]

  - type: misconceptions
    items:
      - wrong: "The empirical formula of $\\text{C}_6\\text{H}_{12}\\text{O}_6$ is $\\text{C}_3\\text{H}_6\\text{O}_3$."
        right: "That's still divisible by 3. Simplest ratio: $\\text{CH}_2\\text{O}$."
      - wrong: "If two compounds have the same empirical formula, they're the same compound."
        right: "Ethyne $\\text{C}_2\\text{H}_2$ and benzene $\\text{C}_6\\text{H}_6$ are both CH, and are completely different substances."
      - wrong: "You can work out a molecular formula from percentages alone."
        right: "Percentages only give the **ratio**, the empirical formula. You also need $M_r$."

  - type: exam
    body: |
      - The definitions are short, so every word counts: **simplest whole-number ratio** (empirical) vs **actual number** of atoms in **one molecule** (molecular).
      - When you find $n$, show the division: "$n = 56.0 \div 14.0 = 4$". It's usually a method mark.
      - Questions love asking which compounds "have the same empirical formula". Reduce each one; don't trust your eyes.

  - type: takeaways
    items:
      - "Empirical formula: simplest whole-number ratio of atoms of each element."
      - "Molecular formula: actual number of atoms of each element in one molecule."
      - "Molecular → empirical: divide by the highest common factor."
      - "Empirical → molecular: $n = M_r \\div$ empirical formula mass, then multiply."

questions:
  - id: define-empirical
    format: text
    style: definition
    difficulty: 1
    objectives: ["2.3.3"]
    prompt: |
      Define **empirical formula**.
    accept:
      - "the simplest whole-number ratio of the atoms of each element present in a compound"
      - "the simplest whole number ratio of the atoms of each element present in a compound"
      - "simplest whole number ratio of atoms of each element in a compound"
      - "the simplest whole number ratio of atoms of each element in a compound"
      - "the simplest whole number ratio of the atoms of each element in a compound"
      - "the simplest whole number ratio of atoms of the elements in a compound"
      - "the simplest whole number ratio of the elements in a compound"
      - "the simplest whole number ratio of the atoms in a compound"
      - "the simplest whole number ratio of atoms of each element present in a compound"
      - "the formula showing the simplest whole number ratio of atoms of each element in a compound"
      - "the formula that shows the simplest whole number ratio of atoms of each element in a compound"
      - "the simplest ratio of atoms of each element in a compound"
      - "the simplest whole number ratio of atoms of each element in a molecule or formula unit"
    model: |
      The simplest whole-number ratio of the atoms of each element present in a compound.
    explanation: |
      Key words: **simplest**, **whole-number ratio**, **atoms of each element**.

  - id: butane-empirical
    format: text
    difficulty: 1
    objectives: ["2.3.3"]
    prompt: |
      Butane is $\text{C}_4\text{H}_{10}$. What is its empirical formula? (Type subscripts as normal numbers, e.g. `CH4`.)
    accept: ["C2H5", "C₂H₅"]
    model: |
      $\text{C}_2\text{H}_5$
    explanation: |
      The highest common factor of 4 and 10 is 2: $\text{C}_4\text{H}_{10} \div 2 = \text{C}_2\text{H}_5$.

  - id: same-empirical
    format: mcq
    difficulty: 2
    objectives: ["2.3.3"]
    prompt: |
      Which pair of compounds have the **same** empirical formula?
    options:
      - text: |
          ethyne, $\text{C}_2\text{H}_2$, and benzene, $\text{C}_6\text{H}_6$
        correct: true
        why: |
          Both reduce to CH.
      - text: |
          ethene, $\text{C}_2\text{H}_4$, and ethane, $\text{C}_2\text{H}_6$
        why: |
          $\text{CH}_2$ and $\text{CH}_3$: same number of carbons, different ratios.
      - text: |
          water, $\text{H}_2\text{O}$, and hydrogen peroxide, $\text{H}_2\text{O}_2$
        why: |
          $\text{H}_2\text{O}$ and HO: different ratios.
      - text: |
          methane, $\text{CH}_4$, and ethane, $\text{C}_2\text{H}_6$
        why: |
          $\text{CH}_4$ and $\text{CH}_3$.
    explanation: |
      Reduce each formula to its simplest ratio, then compare.

  - id: lactic-carbon
    format: numeric
    difficulty: 2
    objectives: ["2.3.3"]
    prompt: |
      Lactic acid has empirical formula $\text{CH}_2\text{O}$ and $M_r = 90.0$. How many **carbon atoms** are in one molecule? ($A_r$: C = 12.0, H = 1.0, O = 16.0)
    fields:
      - answer: 3
    explanation: |
      Empirical formula mass $= 12.0 + 2.0 + 16.0 = 30.0$; $n = 90.0 \div 30.0 = 3$. Molecular formula $\text{C}_3\text{H}_6\text{O}_3$: 3 carbon atoms.

  - id: dichloro-molecular
    format: numeric
    difficulty: 2
    objectives: ["2.3.3"]
    prompt: |
      A compound has empirical formula $\text{CH}_2\text{Cl}$ and $M_r = 99.0$. Find its molecular formula, $\text{C}_x\text{H}_y\text{Cl}_z$. ($A_r$: C = 12.0, H = 1.0, Cl = 35.5)
    fields:
      - label: "x ="
        answer: 2
      - label: "y ="
        answer: 4
      - label: "z ="
        answer: 2
    explanation: |
      Empirical formula mass $= 12.0 + 2.0 + 35.5 = 49.5$; $n = 99.0 \div 49.5 = 2$, so $\text{C}_2\text{H}_4\text{Cl}_2$.

  - id: nacl-formula-type
    format: mcq
    difficulty: 2
    objectives: ["2.3.3"]
    prompt: |
      What kind of formula is "NaCl" for sodium chloride?
    options:
      - text: |
          An empirical formula, because sodium chloride has no molecules
        correct: true
        why: |
          It's a giant ionic lattice; NaCl gives the simplest ratio of ions, 1 : 1.
      - text: |
          A molecular formula: one NaCl molecule has one Na and one Cl
        why: |
          There are no NaCl molecules in solid sodium chloride, only a lattice of ions.
      - text: |
          Both, because the ratio is already 1 : 1
        why: |
          A molecular formula needs molecules to describe. Sodium chloride has none.
      - text: |
          Neither: ionic compounds don't have formulas
        why: |
          They do; their formulas are empirical formulas (formula units).
    explanation: |
      Giant structures (ionic or covalent) only have empirical formulas.

  - id: benzene-explain
    format: explain
    difficulty: 3
    objectives: ["2.3.3"]
    prompt: |
      A student finds from percentage composition that a hydrocarbon has the empirical formula CH. Explain why this is not enough to give its molecular formula, and what extra information would let them find it.
    model: |
      Percentage composition only gives the ratio of atoms, so it only gives the empirical formula. Many compounds share the ratio 1 : 1, such as ethyne, $\text{C}_2\text{H}_2$, and benzene, $\text{C}_6\text{H}_6$. The student needs the relative molecular mass, $M_r$. Then $n = M_r \div 13.0$ (the empirical formula mass of CH), and the molecular formula is $\text{C}_n\text{H}_n$. For example, $M_r = 78.0$ gives $n = 6$, so $\text{C}_6\text{H}_6$.
    keyPoints:
      - "Percentage data give only the ratio of atoms (the empirical formula)"
      - "Different molecules can share an empirical formula (e.g. C₂H₂ and C₆H₆)"
      - "The relative molecular mass, Mr, is also needed"
      - "n = Mr ÷ empirical formula mass (13.0 for CH); multiply the subscripts by n"
    explanation: |
      Ratio from percentages, size from $M_r$. You need both to pin down a molecule.
