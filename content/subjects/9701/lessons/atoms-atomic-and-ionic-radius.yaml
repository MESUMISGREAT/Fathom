id: atoms-atomic-and-ionic-radius
subject: "9701"
topic: "1.1"
title: Atomic and ionic radius trends
summary: Why atoms shrink across a period and grow down a group, and how the sizes of positive and negative ions compare.
order: 3
minutes: 5
objectives: ["1.1.7"]
prerequisites: [atoms-particles-in-the-atom]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.1, learning outcome 7: qualitative explanations only).
    Ionic radii in the table are Pauling's crystal radii (pm), quoted to show the
    pattern. Questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-19. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can state and explain how atomic radius and ionic radius change across a period and down a group.

  - type: explain
    title: Three things decide the size
    body: |
      The radius depends on how strongly the nucleus pulls on the **outer electrons**. Three factors:

      - **Nuclear charge**: more protons pull harder.
      - **Number of shells**: more shells put the outer electrons further out.
      - **Shielding**: inner electrons repel the outer ones, reducing the pull they feel.

  - type: explain
    title: Atoms across a period and down a group
    body: |
      **Across a period, atomic radius decreases.**

      - Nuclear charge goes up by one each step.
      - The new electrons go into the **same outer shell**, so shielding stays about the same.
      - So the outer electrons are pulled in closer.

      **Down a group, atomic radius increases.**

      - Each element has one **more shell**, so the outer electrons are further from the nucleus.
      - There's more shielding from the extra inner shell.
      - These outweigh the increase in nuclear charge.

  - type: check
    title: Quick check
    questions: [across-period, down-group]

  - type: explain
    title: Ions compared with their atoms
    body: |
      - **Positive ions are smaller than their atoms.** Na (2,8,1) → Na⁺ (2,8) loses its whole outer shell, and 11 protons now pull on only 10 electrons.
      - **Negative ions are larger than their atoms.** Cl (2,8,7) → Cl⁻ (2,8,8) gains an electron in the same shell. Same 17 protons, more electron–electron repulsion, so the electrons spread out.

  - type: explain
    title: Ions across period 3
    body: |
      | ion | Na⁺ | Mg²⁺ | Al³⁺ | P³⁻ | S²⁻ | Cl⁻ |
      | --- | --- | --- | --- | --- | --- | --- |
      | electrons | 2,8 | 2,8 | 2,8 | 2,8,8 | 2,8,8 | 2,8,8 |
      | protons | 11 | 12 | 13 | 15 | 16 | 17 |
      | radius / pm | 95 | 65 | 50 | 212 | 184 | 181 |

      - **Within each set the radius decreases.** Each set has the same electrons (they're **isoelectronic**), but nuclear charge rises, pulling them in.
      - **The big jump from Al³⁺ to P³⁻:** the negative ions have a whole extra (third) shell.
      - **Down a group ionic radius increases** (Li⁺ < Na⁺ < K⁺; F⁻ < Cl⁻ < Br⁻), because each ion has one more shell.

  - type: check
    title: Ions
    questions: [atom-or-ion, ion-order]

  - type: example
    title: Ranking an isoelectronic set
    problem: |
      Put these in order of increasing radius: Cl⁻, K⁺, S²⁻, Ca²⁺.
    steps:
      - |
        Count electrons: S²⁻ 16 + 2 = 18; Cl⁻ 17 + 1 = 18; K⁺ 19 − 1 = 18; Ca²⁺ 20 − 2 = 18. All are 2,8,8: isoelectronic.
      - |
        Same electrons, same shells, so only nuclear charge differs: S 16, Cl 17, K 19, Ca 20 protons.
      - |
        More protons pull the same 18 electrons in more tightly, so more protons means a smaller ion.
    answer: |
      Ca²⁺ < K⁺ < Cl⁻ < S²⁻

  - type: check
    title: Explain it
    questions: [fluoride-sodium, chloride-error]

  - type: misconceptions
    items:
      - wrong: "Atoms get bigger across a period because they have more protons, neutrons and electrons."
        right: "They get smaller: the extra protons pull the same outer shell in more tightly."
      - wrong: "Shielding increases a lot across a period."
        right: "The inner shells are the same across a period, so shielding stays roughly constant. Electrons in the same shell shield each other only slightly."
      - wrong: "Na⁺ is smaller than Na just because it lost an electron."
        right: "The key point is that it lost its **whole outer shell**. That, plus the same nuclear charge pulling fewer electrons, shrinks it."

  - type: deeper
    title: Why noble gases are usually left out
    body: |
      Noble gas atoms don't usually bond, so their radii are measured differently (from how close separate atoms get, not from bond lengths). That makes them look bigger than the trend suggests, so data tables often leave them out of period comparisons. The explanation of the trend itself doesn't change.

  - type: exam
    body: |
      - "State and explain" needs the **trend** (one mark) and the **reasons** (nuclear charge, shells/distance, shielding).
      - Say "nuclear charge increases" or "more protons", not "the nucleus gets bigger".
      - Talk about the **outer** electrons being attracted, not just "the electrons".
      - For isoelectronic ions, say explicitly that the electron arrangement is the same and only the number of protons changes.

  - type: takeaways
    items:
      - "Across a period: atomic radius decreases (more protons, same shell, similar shielding)."
      - "Down a group: atomic and ionic radius increase (an extra shell each time)."
      - "Positive ions are smaller than their atoms; negative ions are larger."
      - "In an isoelectronic series, more protons means a smaller ion."

questions:
  - id: across-period
    format: mcq
    difficulty: 1
    objectives: ["1.1.7"]
    prompt: |
      Why does atomic radius decrease from sodium to chlorine?
    options:
      - text: |
          Each element has one more shell than the one before it.
        why: |
          Across a period the electrons go into the same shell. An extra shell happens going down a group.
      - text: |
          Shielding increases across the period, so the electrons are pulled closer.
        why: |
          Shielding stays roughly constant across a period, and more shielding would make the atom bigger, not smaller.
      - text: |
          Nuclear charge increases while electrons are added to the same shell with similar shielding, so the outer electrons are pulled closer.
        correct: true
        why: |
          That's the full explanation: more protons, same shell, about the same shielding.
      - text: |
          Atoms with more electrons have more repulsion, which makes them shrink.
        why: |
          Repulsion between electrons pushes them apart; it can't make an atom smaller.
    explanation: |
      Across a period: nuclear charge up, same outer shell, shielding about the same, so stronger attraction and a smaller radius.

  - id: down-group
    format: cloze
    difficulty: 1
    objectives: ["1.1.7"]
    prompt: |
      Down a group, atomic radius {{1}} because each element has one more {{2}} of electrons, and the extra distance and shielding outweigh the increase in nuclear charge.
    blanks:
      - accept: ["increases", "gets bigger", "gets larger", "increase"]
      - accept: ["shell", "electron shell", "energy level", "principal shell", "principal energy level"]
    explanation: |
      Every step down a group adds a shell, so the outer electrons are further out and more shielded.

  - id: atom-or-ion
    format: text
    style: one-line
    difficulty: 1
    objectives: ["1.1.7"]
    prompt: |
      Which is larger: a magnesium atom or a magnesium ion, Mg²⁺?
    accept: ["magnesium atom", "the magnesium atom", "Mg atom", "Mg", "magnesium", "atom", "the atom", "a magnesium atom"]
    model: |
      The magnesium atom. Mg (2,8,2) loses its whole outer shell to become Mg²⁺ (2,8), and 12 protons then pull on only 10 electrons.
    explanation: |
      Positive ions are always smaller than the atoms they came from.

  - id: ion-order
    format: mcq
    difficulty: 2
    objectives: ["1.1.7"]
    prompt: |
      Which list is in order of increasing ionic radius?
    options:
      - text: |
          $\text{Na}^{+} < \text{Mg}^{2+} < \text{Al}^{3+} < \text{Cl}^{-}$
        why: |
          The cations are reversed. Al³⁺ has the most protons pulling on the same 10 electrons, so it is the smallest.
      - text: |
          $\text{Al}^{3+} < \text{Mg}^{2+} < \text{Na}^{+} < \text{Cl}^{-}$
        correct: true
        why: |
          The three cations are isoelectronic (2,8), so more protons means smaller. Cl⁻ is biggest because it has an extra shell (2,8,8).
      - text: |
          $\text{Cl}^{-} < \text{Al}^{3+} < \text{Mg}^{2+} < \text{Na}^{+}$
        why: |
          Cl⁻ has three shells while the cations have two, so Cl⁻ is the largest, not the smallest.
      - text: |
          $\text{Al}^{3+} < \text{Cl}^{-} < \text{Mg}^{2+} < \text{Na}^{+}$
        why: |
          Cl⁻ has an extra shell, so it is bigger than all three cations.
    explanation: |
      Approximate radii: Al³⁺ 50 pm, Mg²⁺ 65 pm, Na⁺ 95 pm, Cl⁻ 181 pm.

  - id: fluoride-sodium
    format: explain
    difficulty: 2
    objectives: ["1.1.7"]
    prompt: |
      F⁻ and Na⁺ both have the electron arrangement 2,8. Explain why Na⁺ is smaller.
    model: |
      Both ions have 10 electrons in the same two shells (they are isoelectronic). Na⁺ has 11 protons but F⁻ has only 9, so the nuclear charge in Na⁺ is greater. The greater nuclear charge attracts the same electrons more strongly and pulls them closer to the nucleus, so Na⁺ has the smaller radius.
    keyPoints:
      - "Same number of electrons in the same shells (isoelectronic)"
      - "Na⁺ has 11 protons, F⁻ has 9"
      - "Greater nuclear charge attracts the electrons more strongly"
      - "So the electrons are pulled closer and the radius is smaller"
    explanation: |
      When the electrons are identical, only the nuclear charge is different, so it decides the size.

  - id: chloride-error
    format: spot-error
    difficulty: 2
    objectives: ["1.1.7"]
    prompt: |
      A student explains why a chloride ion is larger than a chlorine atom. Which line contains the first error?
    lines:
      - "A chlorine atom is 2,8,7 and a chloride ion is 2,8,8."
      - "Both have 17 protons, so the nuclear charge is the same."
      - "The ion has one extra electron."
      - "The extra electron goes into a new, fourth shell, so the ion is larger."
      - "So Cl⁻ has a larger radius than Cl."
    errorLine: 4
    fix: |
      The extra electron goes into the **same** (third) shell. With the same nuclear charge, the extra electron–electron repulsion makes the electrons spread out, so the ion is larger.
    explanation: |
      2,8,8 still has three shells. The ion is bigger because of extra repulsion with an unchanged nuclear charge, not a new shell.
