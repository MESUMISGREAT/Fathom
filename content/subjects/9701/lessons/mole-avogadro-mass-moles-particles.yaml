id: mole-avogadro-mass-moles-particles
subject: "9701"
topic: "2.2"
title: Mass, moles and particles
summary: How molar mass links grams to moles, the n = m/M and N = nL toolkit, and how to find the mass of a single atom.
order: 2
minutes: 5
objectives: ["2.2.1"]
prerequisites: [mole-avogadro-the-mole]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.2, learning outcome 2.2.1, using the mole). Avogadro
    constant 6.022 × 10²³ mol⁻¹ and all Ar values from the Cambridge Data Booklet. The link
    1 u × L = 1 g mol⁻¹ uses 1 u = 1.66054 × 10⁻²⁴ g. Reacting-mass calculations are left
    to topic 2.4. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can use **molar mass** to convert between mass, amount in moles and number of particles, and calculate the mass of a single atom or molecule.

  - type: explain
    title: Weighing is counting
    body: |
      You can't count $10^{23}$ atoms one by one. But you can weigh them. The mole turns a balance into a particle counter.

      The bridge is the **molar mass**, $M$: the mass of one mole of a substance, in $\text{g mol}^{-1}$. Here's the gift: $M$ is **numerically equal** to $A_r$ or $M_r$.

      | substance | $A_r$ or $M_r$ | molar mass, $M$ |
      | --- | --- | --- |
      | C | 12.0 | $12.0\ \text{g mol}^{-1}$ |
      | $\text{H}_2\text{O}$ | 18.0 | $18.0\ \text{g mol}^{-1}$ |
      | $\text{CaCO}_3$ | 100.1 | $100.1\ \text{g mol}^{-1}$ |

  - type: diagram
    diagram: chem-mole-avogadro-mole-map
    alt: "Flow diagram with three boxes in a row: mass, m in g, on the left; amount, n in mol, highlighted in the middle; particles, number N, on the right. Arrows from mass to amount are labelled divide by M and back multiply by M; arrows from amount to particles are labelled multiply by L and back divide by L. Below: n = m ÷ M and N = n × L. Notes: M is molar mass in g mol⁻¹, numerically equal to Ar or Mr; L is the Avogadro constant, 6.022 × 10²³ mol⁻¹, from the Data Booklet. Title: every route goes through moles."
    caption: Every route goes through moles. Never jump straight from grams to particles.

  - type: explain
    title: The toolkit
    body: |
      $$n = \frac{m}{M} \qquad\qquad N = n \times L$$

      - $m$ = mass in **g** (convert kg or mg first)
      - $M$ = molar mass in $\text{g mol}^{-1}$
      - $n$ = amount in mol; $N$ = number of particles; $L = 6.022 \times 10^{23}\ \text{mol}^{-1}$

      Units check: $\text{g} \div \text{g mol}^{-1} = \text{mol}$. If your units don't cancel to mol, something's upside down.

  - type: check
    title: Quick check
    questions: [moles-in-mass, mass-from-moles, same-molecules]

  - type: example
    title: Grams to atoms in water
    problem: |
      For 9.00 g of water, find (a) the amount in mol, (b) the number of molecules, (c) the number of hydrogen atoms.
    steps:
      - |
        $M(\text{H}_2\text{O}) = 2(1.0) + 16.0 = 18.0\ \text{g mol}^{-1}$
      - |
        (a) $n = m \div M = 9.00 \div 18.0 = 0.500$ mol
      - |
        (b) $N = 0.500 \times 6.022 \times 10^{23} = 3.01 \times 10^{23}$ molecules
      - |
        (c) Each molecule has 2 H atoms: $2 \times 3.01 \times 10^{23} = 6.02 \times 10^{23}$ H atoms. That's exactly 1 mol of H atoms, from half a mole of water.
    answer: |
      0.500 mol; $3.01 \times 10^{23}$ molecules; $6.02 \times 10^{23}$ H atoms.

  - type: check
    title: Through the mole
    questions: [particles-from-mass, oxygen-error]

  - type: explain
    title: The mass of ONE atom
    body: |
      One mole of iron atoms has a mass of 55.8 g. So one atom has a mass of

      $$\frac{55.8\ \text{g mol}^{-1}}{6.022 \times 10^{23}\ \text{mol}^{-1}} = 9.27 \times 10^{-23}\ \text{g}$$

      Divide the molar mass by $L$. The $\text{mol}^{-1}$ cancels, leaving grams per atom.

  - type: intuition
    title: Why the numbers match
    body: |
      Why is $M$ in grams the same number as $A_r$? Because $L$ is the number of u in one gram:

      $$1\ \text{u} \times L = 1.66 \times 10^{-24}\ \text{g} \times 6.022 \times 10^{23}\ \text{mol}^{-1} = 1.00\ \text{g mol}^{-1}$$

      So a particle of relative mass 18.0 gives a mole of mass 18.0 g. That's not luck: it's how the mole was designed.

  - type: check
    title: Stretch
    questions: [oxygen-atoms-sulfuric, mass-one-silver-atom]

  - type: misconceptions
    items:
      - wrong: "The molar mass of oxygen gas is 16.0 g mol⁻¹."
        right: "Oxygen gas is $\\text{O}_2$: $M = 32.0\\ \\text{g mol}^{-1}$. 16.0 is for O **atoms**. Hydrogen ($\\text{H}_2$), nitrogen ($\\text{N}_2$) and the halogens are diatomic too."
      - wrong: "Equal masses contain equal numbers of particles."
        right: "Equal **moles** do. 1 g of $\\text{H}_2$ (0.5 mol) has 16 times as many molecules as 1 g of $\\text{O}_2$ (0.03125 mol)."
      - wrong: "$M_r$ and molar mass are the same thing."
        right: "Same number, different quantity. $M_r$ has no units; molar mass is in $\\text{g mol}^{-1}$."

  - type: exam
    body: |
      - Write the formula you're using, then the numbers: "$n = m/M = 9.00/18.0 = 0.500$ mol". Method marks live in that line.
      - Keep at least one extra significant figure in intermediate steps; round only at the end.
      - Molar mass carries units ($\text{g mol}^{-1}$); $A_r$ and $M_r$ don't. Examiners notice.
      - Masses in kg or mg? Convert to g before dividing by $M$.

  - type: takeaways
    items:
      - "Molar mass $M$ (g mol⁻¹) is numerically equal to $A_r$ or $M_r$."
      - "$n = m \\div M$ and $N = n \\times L$; always go through moles."
      - "Mass of one particle = $M \\div L$."
      - "Diatomic elements ($\\text{H}_2$, $\\text{O}_2$, $\\text{N}_2$, $\\text{Cl}_2$…) use the molecule's molar mass."

questions:
  - id: moles-in-mass
    format: numeric
    difficulty: 1
    objectives: ["2.2.1"]
    prompt: |
      What amount, in mol, is 11.0 g of carbon dioxide, $\text{CO}_2$? ($A_r$: C = 12.0, O = 16.0)
    fields:
      - answer: 0.250
        tolerance: { abs: 0.001 }
        unit: mol
    explanation: |
      $M(\text{CO}_2) = 12.0 + 2(16.0) = 44.0\ \text{g mol}^{-1}$, so $n = 11.0 \div 44.0 = 0.250$ mol.

  - id: mass-from-moles
    format: numeric
    difficulty: 1
    objectives: ["2.2.1"]
    prompt: |
      What is the mass of 0.150 mol of calcium carbonate, $\text{CaCO}_3$? ($A_r$: Ca = 40.1, C = 12.0, O = 16.0) Give your answer to 3 significant figures.
    fields:
      - answer: 15.0
        tolerance: { abs: 0.05 }
        unit: g
    explanation: |
      $M = 40.1 + 12.0 + 3(16.0) = 100.1\ \text{g mol}^{-1}$. Rearranging $n = m/M$: $m = n \times M = 0.150 \times 100.1 = 15.0$ g.

  - id: same-molecules
    format: mcq
    difficulty: 2
    objectives: ["2.2.1"]
    prompt: |
      Which sample contains the same number of molecules as 1.0 g of hydrogen gas, $\text{H}_2$? ($A_r$: H = 1.0, O = 16.0)
    options:
      - text: |
          1.0 g of oxygen gas, $\text{O}_2$
        why: |
          Same mass, not same moles. 1.0 g of $\text{O}_2$ is only 0.031 mol.
      - text: |
          8.0 g of oxygen gas, $\text{O}_2$
        why: |
          This uses 16.0 g mol⁻¹, the molar mass of O **atoms**. 8.0 g of $\text{O}_2$ is 0.25 mol.
      - text: |
          16.0 g of oxygen gas, $\text{O}_2$
        correct: true
        why: |
          1.0 g of $\text{H}_2$ is $1.0 \div 2.0 = 0.50$ mol; 16.0 g of $\text{O}_2$ is $16.0 \div 32.0 = 0.50$ mol. Equal moles, equal molecules.
      - text: |
          32.0 g of oxygen gas, $\text{O}_2$
        why: |
          That's 1.0 mol. It treats 1.0 g of $\text{H}_2$ as 1 mol, forgetting that hydrogen gas is diatomic ($M = 2.0$).
    explanation: |
      Compare moles, not grams: $\text{H}_2$ 0.50 mol, so you need 0.50 mol of $\text{O}_2$ = 16.0 g.

  - id: particles-from-mass
    format: numeric
    difficulty: 2
    objectives: ["2.2.1"]
    prompt: |
      How many molecules are in 8.00 g of methane, $\text{CH}_4$? ($A_r$: C = 12.0, H = 1.0; $L = 6.022 \times 10^{23}\ \text{mol}^{-1}$) Type standard form like `1.23e23`.
    fields:
      - answer: 3.01e23
        tolerance: { rel: 0.005 }
    explanation: |
      $M = 16.0\ \text{g mol}^{-1}$; $n = 8.00 \div 16.0 = 0.500$ mol; $N = 0.500 \times 6.022 \times 10^{23} = 3.01 \times 10^{23}$.

  - id: oxygen-error
    format: spot-error
    difficulty: 2
    objectives: ["2.2.1"]
    prompt: |
      A student works out the number of molecules in 3.20 g of oxygen gas. Which line contains the first error?
    lines:
      - |
        Use $n = m \div M$.
      - |
        Molar mass of oxygen gas: $M = 16.0\ \text{g mol}^{-1}$.
      - |
        $n = 3.20 \div 16.0 = 0.200$ mol
      - |
        Molecules $= 0.200 \times 6.022 \times 10^{23} = 1.20 \times 10^{23}$
    errorLine: 2
    fix: |
      Oxygen gas is $\text{O}_2$, so $M = 32.0\ \text{g mol}^{-1}$. Then $n = 0.100$ mol and there are $6.02 \times 10^{22}$ molecules.
    explanation: |
      16.0 is the molar mass of oxygen **atoms**. The rest of the method is fine, but it carries the error through.

  - id: oxygen-atoms-sulfuric
    format: numeric
    difficulty: 3
    objectives: ["2.2.1"]
    prompt: |
      How many **oxygen atoms** are in 9.81 g of sulfuric acid, $\text{H}_2\text{SO}_4$? ($M_r = 98.1$; $L = 6.022 \times 10^{23}\ \text{mol}^{-1}$) Type standard form like `1.23e23`.
    fields:
      - answer: 2.41e23
        tolerance: { rel: 0.005 }
    explanation: |
      $n(\text{H}_2\text{SO}_4) = 9.81 \div 98.1 = 0.100$ mol. Each molecule has 4 O atoms, so $n(\text{O}) = 0.400$ mol, and $N = 0.400 \times 6.022 \times 10^{23} = 2.41 \times 10^{23}$.

  - id: mass-one-silver-atom
    format: numeric
    difficulty: 3
    objectives: ["2.2.1"]
    prompt: |
      Calculate the mass, in grams, of **one** silver atom. ($A_r$: Ag = 107.9; $L = 6.022 \times 10^{23}\ \text{mol}^{-1}$) Type standard form like `1.23e-22`.
    fields:
      - answer: 1.79e-22
        tolerance: { rel: 0.005 }
        unit: g
    explanation: |
      One mole of Ag atoms is 107.9 g, so one atom is $107.9 \div 6.022 \times 10^{23} = 1.79 \times 10^{-22}$ g.
