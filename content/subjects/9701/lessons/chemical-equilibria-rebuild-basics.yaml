id: chemical-equilibria-rebuild-basics
subject: "9701"
topic: "7.1"
title: Reversible reactions and dynamic equilibrium
summary: See what reversible reactions and dynamic equilibrium mean at particle level.
order: 1
minutes: 5
kind: core
objectives: ["7.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Fresh lesson drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus objective 7.1.1. All questions and illustrative examples are original. Independently
    reviewed by GitHub Copilot (AI reviewer; model identity unavailable); no human review claimed.
blocks:
  - type: objective
    body: By the end, you can explain reversible reactions, dynamic equilibrium and why a closed system is needed.
  - type: explain
    title: Two directions, one reaction
    body: |-
      A **reversible reaction** can happen in both directions. We show this with a double arrow:
      $\text{A}+\text{B}\rightleftharpoons\text{C}+\text{D}$.

      At first, the forward reaction is usually faster because there are lots of reactant particles.
      As products build up, the reverse reaction becomes more likely too.
  - type: example
    title: What equilibrium actually means
    problem: A sealed flask contains $\text{N}_2\text{O}_4(g)\rightleftharpoons2\text{NO}_2(g)$. Describe the mixture at dynamic equilibrium.
    steps:
      - The forward reaction and reverse reaction are both still happening.
      - At equilibrium, their rates are equal.
      - Because the rates balance, the concentrations of $\text{N}_2\text{O}_4$ and $\text{NO}_2$ stay constant.
    answer: Both reactions continue at equal rates, so the concentrations remain constant.
  - type: check
    questions: [reversible-definition, equilibrium-rate]
  - type: explain
    title: Why the system must be closed
    body: |-
      A **closed system** does not allow reactants or products to escape. If a product leaks out,
      the reverse reaction cannot keep replenishing it, so a true dynamic equilibrium cannot be maintained.

      Constant concentration does not mean “nothing is happening”. It means the two ongoing rates are equal.
  - type: check
    questions: [closed-system, equilibrium-not-static]
  - type: misconceptions
    items:
      - wrong: At equilibrium, the reactants and products have equal concentrations.
        right: Their concentrations are constant, but they do not have to be equal.
      - wrong: Equilibrium means the reactions have stopped.
        right: Both directions continue; equal rates make the overall concentrations constant.
  - type: takeaways
    items:
      - Reversible reactions proceed in both directions.
      - Dynamic equilibrium needs a closed system and equal forward and reverse rates.
questions:
  - id: reversible-definition
    format: mcq
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: Which description matches a reversible reaction?
    options:
      - text: It can proceed in the forward and reverse directions.
        correct: true
        why: The double arrow means both directions are possible.
      - text: It must go to completion in one direction.
        why: That describes an irreversible reaction.
      - text: It can only happen in a closed system.
        why: A closed system is needed for dynamic equilibrium, not for the definition of reversibility.
      - text: It always has equal reactant and product concentrations.
        why: Concentrations depend on the reaction conditions.
    explanation: Reversible means that both the forward and reverse reactions can occur.
  - id: equilibrium-rate
    format: text
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: "At dynamic equilibrium, what is equal: the concentrations or the rates?"
    explanation: The forward and reverse reaction rates are equal at dynamic equilibrium, while the concentrations remain constant.
    accept: ["rates", "the rates", "forward and reverse rates", "rates of the forward and reverse reactions"]
    model: The forward and reverse reaction rates are equal.
  - id: closed-system
    format: mcq
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: Why must a system be closed for dynamic equilibrium to be established?
    options:
      - text: Reactants and products must not escape.
        correct: true
        why: Escaping material would stop the concentrations from settling into a dynamic balance.
      - text: The temperature must be zero.
        why: Equilibrium can occur at many temperatures.
      - text: The products must be removed continuously.
        why: Removing products disturbs the equilibrium.
      - text: The forward reaction must stop.
        why: Both reactions continue at equilibrium.
    explanation: A closed system keeps the reacting substances inside.
  - id: equilibrium-not-static
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: Which statement about a mixture at dynamic equilibrium is correct?
    options:
      - text: Both forward and reverse reactions continue at equal rates.
        correct: true
        why: This is the meaning of dynamic equilibrium.
      - text: No particles react.
        why: Reactions continue microscopically.
      - text: Reactants and products have equal concentrations.
        why: Equal rates do not require equal concentrations.
      - text: Only the reverse reaction continues.
        why: Both directions continue.
    explanation: Dynamic equilibrium is a balance of rates, not a stopped reaction.
