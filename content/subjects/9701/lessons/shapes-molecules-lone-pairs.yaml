id: shapes-molecules-lone-pairs
subject: "9701"
topic: "3.5"
title: "Lone pairs squeeze bond angles: NH₃ and H₂O"
summary: Lone pairs repel more strongly than bonding pairs, so NH₃ is pyramidal (107°) and H₂O is non-linear (104.5°), not tetrahedral like CH₄ (109.5°).
order: 2
minutes: 5
objectives: ["3.5.1"]
prerequisites: [shapes-molecules-vsepr-basics]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.5, learning outcome 1: NH₃ pyramidal 107°, H₂O non-linear
    104.5°, compared with CH₄ tetrahedral 109.5°). All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can explain why $\text{NH}_3$ is pyramidal (107°) and $\text{H}_2\text{O}$ is non-linear (104.5°) using VSEPR theory and lone pairs.

  - type: explain
    title: Same number of pairs, different angles
    body: |
      $\text{CH}_4$, $\text{NH}_3$ and $\text{H}_2\text{O}$ all have **4 electron pairs** around the central atom. So why aren't they all 109.5°?

      The difference is what kind of pairs they are: **bonding pairs** or **lone pairs**.

  - type: explain
    title: Lone pairs are pushier
    body: |
      A lone pair is held by **one** nucleus only, so it sits **closer** to the central atom and spreads out **wider** than a bonding pair.

      So lone pairs repel more strongly:

      $$\text{lone pair–lone pair} > \text{lone pair–bonding pair} > \text{bonding pair–bonding pair}$$

      Each lone pair pushes the bonding pairs a little closer together: about **2.5°** per lone pair.

  - type: intuition
    title: The big bag on the bus seat
    body: |
      Bonding pairs are people sitting politely in their seats. A lone pair is the bulky bag someone has dumped on the seat: it takes up more room and squashes everyone else together.

      Where it breaks down: the bag isn't just big, it's **charged**. Lone pairs push because they repel, not because they're physically larger.

  - type: check
    title: Quick check
    questions: [lone-pair-cloze]

  - type: explain
    title: The three molecules
    body: |
      | molecule | bonding pairs | lone pairs | shape | VSEPR-predicted bond angle |
      | --- | --- | --- | --- | --- |
      | $\text{CH}_4$ | 4 | 0 | tetrahedral | 109.5° |
      | $\text{NH}_3$ | 3 | 1 | **pyramidal** | **107°** |
      | $\text{H}_2\text{O}$ | 2 | 2 | **non-linear** (bent) | **104.5°** |

      These are standard VSEPR predictions for the syllabus examples, not exact measured values for every environment.

  - type: diagram
    diagram: chem-shapes-molecules-lone-pairs
    alt: "Three molecules side by side. CH4: carbon with four hydrogens drawn with lines and wedges, 109.5 degrees, tetrahedral, 4 bonding pairs and 0 lone pairs. NH3: nitrogen with a shaded lone-pair balloon pointing up and three hydrogens below (one line, one solid wedge, one hashed wedge), 107 degrees, pyramidal, 3 bonding pairs and 1 lone pair. H2O: oxygen with two lone-pair balloons pointing up-left and up-right and two hydrogens below in a V shape, 104.5 degrees, non-linear (bent), 2 bonding pairs and 2 lone pairs. A box underneath says repulsion between pairs: lone–lone greater than lone–bonding greater than bonding–bonding, and each lone pair closes the bond angle by about 2.5 degrees: 109.5 to 107 to 104.5."
    caption: |
      The four pairs always point roughly to the corners of a tetrahedron. The shape name only describes where the **atoms** are.

  - type: explain
    title: Name the shape by the atoms, not the pairs
    body: |
      - In $\text{NH}_3$ the four pairs are arranged roughly tetrahedrally, but you only "see" the N and three H atoms: a **pyramid** with N at the top.
      - In $\text{H}_2\text{O}$ you see the O and two H atoms: a **V**, called **non-linear** or bent.

  - type: example
    title: Explaining the angle in water
    problem: |
      Explain why the H–O–H bond angle in water is 104.5°.
    steps:
      - |
        O has 6 outer electrons. Two are used in O–H bonds: **2 bonding pairs**.
      - |
        The other 4 electrons form **2 lone pairs**. That's 4 pairs in total.
      - |
        The 4 pairs repel and get as far apart as possible: roughly tetrahedral.
      - |
        Lone pairs repel more strongly than bonding pairs, so they push the O–H bonds closer together: 109.5° − 2 × 2.5° = 104.5°.
    answer: |
      Non-linear, 104.5°.

  - type: check
    title: Angles and shapes
    questions: [nh3-shape, water-angle, ammonia-angle]

  - type: misconceptions
    items:
      - wrong: "Water has two bonds, so it's linear like $\\text{CO}_2$."
        right: "Water has 2 bonding pairs **and 2 lone pairs**: 4 regions. CO₂ has only 2 regions."
      - wrong: "$\\text{NH}_3$ is trigonal planar because N has three H atoms."
        right: "The lone pair on N is a fourth region, pushing the three N–H bonds down into a pyramid."
      - wrong: "Water is tetrahedral."
        right: "The **pairs** are arranged roughly tetrahedrally, but the **shape** is named from the atoms: non-linear."
      - wrong: "Lone pairs repel less than bonding pairs because they aren't in a bond."
        right: "They repel **more**: they're closer to the central atom and more spread out."

  - type: exam
    body: |
      - For "explain the bond angle" answers, examiners look for: number of bonding pairs **and** lone pairs; lone pairs repel **more** than bonding pairs; so the bond angle is **reduced** (from 109.5°).
      - Use the right shape names: **pyramidal** for $\text{NH}_3$, **non-linear** (or bent) for $\text{H}_2\text{O}$.
      - Quote the numbers: 109.5°, 107°, 104.5°.

  - type: takeaways
    items:
      - "Repulsion: lone pair–lone pair > lone pair–bonding pair > bonding pair–bonding pair."
      - "Each lone pair closes the bond angle by about 2.5°."
      - "NH₃: 3 bonding pairs + 1 lone pair → pyramidal, 107°."
      - "H₂O: 2 bonding pairs + 2 lone pairs → non-linear, 104.5°."

  - type: check
    title: Spot the slip
    questions: [why-smaller-angle, water-error, explain-nh3-vs-h2o]

questions:
  - id: lone-pair-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Lone pairs repel {{1}} strongly than bonding pairs, so in a water molecule the two O–H bonds are pushed {{2}} together.
    blanks:
      - accept: ["more"]
      - accept: ["closer", "nearer", "more closely"]
    explanation: |
      Lone pairs are closer to the central nucleus and more spread out, so they repel more and squeeze the bond angle.

  - id: nh3-shape
    format: mcq
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      What is the shape of an ammonia molecule, $\text{NH}_3$?
    options:
      - text: Trigonal planar
        why: |
          That ignores the lone pair on N. With the lone pair there are 4 regions, not 3.
      - text: Pyramidal
        correct: true
        why: |
          3 bonding pairs + 1 lone pair: the N and three H atoms form a pyramid.
      - text: Tetrahedral
        why: |
          The four **pairs** are roughly tetrahedral, but the shape is named from the atoms: pyramidal.
      - text: Non-linear
        why: |
          Non-linear describes three atoms in a V, like $\text{H}_2\text{O}$.
    explanation: |
      NH₃: 3 bonding pairs + 1 lone pair → pyramidal, 107°.

  - id: water-angle
    format: numeric
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Using VSEPR, what is the predicted H–O–H bond angle in a water molecule?
    fields:
      - answer: 104.5
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      2 bonding pairs + 2 lone pairs. Two lone pairs squeeze 109.5° by about 2 × 2.5° to 104.5°.

  - id: ammonia-angle
    format: numeric
    difficulty: 1
    objectives: ["3.5.1"]
    prompt: |
      Using VSEPR, what is the predicted H–N–H bond angle in an ammonia molecule?
    fields:
      - answer: 107
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      3 bonding pairs + 1 lone pair. One lone pair squeezes 109.5° by about 2.5° to 107°.

  - id: why-smaller-angle
    format: mcq
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      Why is the bond angle in $\text{NH}_3$ (107°) smaller than in $\text{CH}_4$ (109.5°)?
    options:
      - text: $\text{NH}_3$ has fewer electron pairs around the central atom than $\text{CH}_4$
        why: |
          Both have 4 pairs around the central atom. What differs is the type of pair.
      - text: The lone pair on N repels more strongly than the bonding pairs
        correct: true
        why: |
          Lone pair–bonding pair repulsion is greater than bonding pair–bonding pair repulsion, so the N–H bonds are pushed closer together.
      - text: Hydrogen bonds between $\text{NH}_3$ molecules pull the H atoms together
        why: |
          Hydrogen bonds act between molecules; they don't set the shape of a single molecule.
      - text: The N–H bonds are longer than the C–H bonds
        why: |
          Bond length isn't the reason. The angle is set by repulsion between electron pairs.
    explanation: |
      Same 4 pairs; one is a lone pair, which repels more and closes the angle.

  - id: water-error
    format: spot-error
    difficulty: 2
    objectives: ["3.5.1"]
    prompt: |
      A student explains the shape of a water molecule. Which line contains the first error?
    lines:
      - "O has 6 outer electrons; 2 are used in the two O–H bonds."
      - "That leaves 4 non-bonding electrons: 2 lone pairs."
      - "So there are 4 electron pairs around O, arranged roughly tetrahedrally."
      - "Lone pairs repel more than bonding pairs, so the H–O–H angle is less than 109.5°."
      - "So the shape of the molecule is tetrahedral, with a bond angle of 104.5°."
    errorLine: 5
    fix: |
      The shape is named from the positions of the atoms: water is non-linear (bent), 104.5°.
    explanation: |
      The pairs are tetrahedral, but you can only "see" three atoms in a V. Lines 1–4 are correct.

  - id: explain-nh3-vs-h2o
    format: explain
    difficulty: 3
    objectives: ["3.5.1"]
    prompt: |
      The H–N–H bond angle in ammonia is 107°, but the H–O–H bond angle in water is only 104.5°. Explain this difference.
    model: |
      Both molecules have four electron pairs around the central atom, arranged roughly tetrahedrally. NH₃ has 3 bonding pairs and 1 lone pair; H₂O has 2 bonding pairs and 2 lone pairs. Lone pairs repel more strongly than bonding pairs (lone pair–lone pair > lone pair–bonding pair > bonding pair–bonding pair). Water's two lone pairs push its bonding pairs closer together than ammonia's single lone pair does, so water's bond angle is smaller.
    keyPoints:
      - "Both have 4 electron pairs around the central atom"
      - "NH₃: 3 bonding pairs + 1 lone pair; H₂O: 2 bonding pairs + 2 lone pairs"
      - "Lone pairs repel more strongly than bonding pairs"
      - "Water has more lone pairs, so its bonding pairs are pushed closer together: smaller angle"
    explanation: |
      Each extra lone pair closes the angle by about 2.5°: 109.5° → 107° → 104.5°.
