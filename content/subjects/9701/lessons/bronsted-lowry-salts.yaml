id: bronsted-lowry-salts
subject: "9701"
topic: "7.2"
title: Salts — the neutralisation products
summary: How salts form, naming them, predicting whether a salt solution is acidic, basic, or neutral, and hydrolysis reactions.
order: 7
minutes: 4
objectives: ["7.2.8"]
prerequisites: ["bronsted-lowry-neutralisation"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 8; salts from neutralisation).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can name salts from acid–base reactions, write equations for their formation, and predict whether a salt solution is acidic, basic, or neutral based on the parent acid and base strengths.

  - type: explain
    title: What is a salt?
    body: |
      A **salt** is an ionic compound formed when the H⁺ of an acid is replaced by a metal ion (or NH₄⁺).

      General pattern:
      $$\text{Acid} + \text{Base} \rightarrow \text{Salt} + \text{Water}$$
      (or + CO₂ if carbonate, + H₂ if metal)

      The **cation** comes from the base (metal or NH₄⁺).
      The **anion** comes from the acid.

  - type: example
    title: Naming salts
    problem: |
      Name the salts formed from:
      1. HCl + NaOH
      2. H₂SO₄ + KOH
      3. CH₃COOH + Na₂CO₃
      4. HNO₃ + NH₃
    steps:
      - "1. Na⁺ from NaOH, Cl⁻ from HCl → sodium chloride"
      - "2. K⁺ from KOH, SO₄²⁻ from H₂SO₄ → potassium sulfate"
      - "3. Na⁺ from Na₂CO₃, CH₃COO⁻ from CH₃COOH → sodium ethanoate"
      - "4. NH₄⁺ from NH₃, NO₃⁻ from HNO₃ → ammonium nitrate"
    answer: |
      1. Sodium chloride, 2. Potassium sulfate, 3. Sodium ethanoate, 4. Ammonium nitrate

  - type: check
    title: Name the salt
    questions: [name-salt-1, name-salt-2]

  - type: explain
    title: Acidic, basic, or neutral salt solutions?
    body: |
      When a salt dissolves, its ions *may* react with water (**hydrolysis**). This determines the pH.

      | Salt type | Cation | Anion | Hydrolysis? | Solution pH |
      |-----------|--------|-------|-------------|-------------|
      | Strong acid + Strong base | Na⁺, K⁺, etc. | Cl⁻, NO₃⁻, SO₄²⁻ | Neither ion reacts | **7 (neutral)** |
      | Weak acid + Strong base | Na⁺, K⁺, etc. | CH₃COO⁻, CO₃²⁻, etc. | Anion + H₂O ⇌ OH⁻ | **>7 (basic)** |
      | Strong acid + Weak base | NH₄⁺ | Cl⁻, NO₃⁻, SO₄²⁻ | Cation + H₂O ⇌ H⁺ | **<7 (acidic)** |
      | Weak acid + Weak base | NH₄⁺ | CH₃COO⁻, etc. | Both hydrolyse | Depends on Ka vs Kb |

      **Rule of thumb**: The ion from the *weak* parent hydrolyses.

  - type: intuition
    title: Hydrolysis = the ion wants its partner back
    body: |
      - **CH₃COO⁻** (from weak acid CH₃COOH) is a **base**. It grabs H⁺ from water: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻ → solution becomes **basic**.
      - **NH₄⁺** (from weak base NH₃) is an **acid**. It donates H⁺ to water: NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺ → solution becomes **acidic**.
      - **Cl⁻** (from strong acid HCl) has **no interest** in H⁺. It's the conjugate base of a strong acid → negligible basicity.
      - **Na⁺** (from strong base NaOH) has **no interest** in OH⁻. It's the conjugate acid of a strong base → negligible acidity.

  - type: example
    title: Predict pH of salt solutions
    problem: |
      Predict whether 0.1 M solutions of these salts are acidic, basic, or neutral:
      NaCl, NH₄Cl, CH₃COONa, NH₄CH₃COO
    steps:
      - "NaCl: Na⁺ (strong base cation) + Cl⁻ (strong acid anion) → neutral, pH = 7"
      - "NH₄Cl: NH₄⁺ (weak base cation) + Cl⁻ (strong acid anion) → NH₄⁺ hydrolyses → acidic, pH < 7"
      - "CH₃COONa: Na⁺ (strong base cation) + CH₃COO⁻ (weak acid anion) → CH₃COO⁻ hydrolyses → basic, pH > 7"
      - "NH₄CH₃COO: NH₄⁺ (weak base cation) + CH₃COO⁻ (weak acid anion) → both hydrolyse. Ka(NH₄⁺) = 5.6×10⁻¹⁰, Kb(CH₃COO⁻) = Kw/Ka = 1.0×10⁻¹⁴/1.7×10⁻⁵ = 5.9×10⁻¹⁰. Kb > Ka → slightly basic, pH > 7"
    answer: |
      NaCl: neutral (pH 7). NH₄Cl: acidic (pH < 7). CH₃COONa: basic (pH > 7). NH₄CH₃COO: slightly basic (pH > 7).

  - type: check
    title: Salt solution pH
    questions: [salt-ph-1, salt-ph-2, salt-ph-3]

  - type: explain
    title: Preparing soluble salts — methods
    body: |
      | Method | Reactants | Example | Notes |
      |--------|-----------|---------|-------|
      | Acid + base (titration) | Acid + soluble base | HCl + NaOH | Need exact stoichiometry; evaporate to crystallise |
      | Acid + carbonate | Acid + metal carbonate | H₂SO₄ + CaCO₃ | CO₂ evolution shows completion; filter excess solid |
      | Acid + metal | Acid + reactive metal | HCl + Mg | H₂ evolution; filter excess metal |
      | Acid + insoluble base | Acid + metal oxide/hydroxide | HNO₃ + CuO | Filter excess solid; evaporate |

      **Insoluble salts**: Use precipitation (mix solutions of soluble salts). Not covered here.

  - type: misconceptions
    items:
      - wrong: "All salts are neutral (pH 7)."
        right: "Only salts from strong acid + strong base are neutral. Others hydrolyse."
      - wrong: "NH₄Cl is neutral because it's a salt."
        right: "NH₄⁺ is the conjugate acid of a weak base (NH₃) — it hydrolyses to give acidic solution."
      - wrong: "CH₃COONa is acidic because it comes from an acid."
        right: "CH₃COO⁻ is the conjugate base of a weak acid — it's a base, so solution is basic."
      - wrong: "You can't predict pH without Ka/Kb values."
        right: "For strong/weak combinations, you can predict qualitatively (acidic/basic/neutral) without numbers."

  - type: takeaways
    items:
      - "Salt = cation from base + anion from acid."
      - "Strong acid + strong base → neutral salt (pH 7)."
      - "Weak acid + strong base → basic salt (pH > 7) — anion hydrolyses."
      - "Strong acid + weak base → acidic salt (pH < 7) — cation hydrolyses."
      - "Weak acid + weak base → compare Ka (cation) vs Kb (anion)."
      - "Preparation: titration (soluble), excess solid + filter (insoluble reactants)."

questions:
  - id: name-salt-1
    format: mcq
    difficulty: 1
    objectives: ["7.2.8"]
    prompt: |
      What is the name of the salt formed when H₂SO₄ reacts with NaOH?
    options:
      - text: "Sodium sulfide"
        why: "Sulfide is S²⁻ from H₂S, not sulfate from H₂SO₄."
      - text: "Sodium sulfate"
        correct: true
        why: "Na⁺ from NaOH, SO₄²⁻ from H₂SO₄ → Na₂SO₄, sodium sulfate."
      - text: "Sodium hydrogen sulfate"
        why: "That's NaHSO₄ from 1:1 ratio, but NaOH neutralises both protons."
      - text: "Sodium sulfite"
        why: "Sulfite is SO₃²⁻ from H₂SO₃, not sulfate."
    explanation: |
      H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O. The salt is sodium sulfate.

  - id: name-salt-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.8"]
    prompt: |
      What is the formula of the salt formed from CH₃COOH and NH₃?
    options:
      - text: "CH₃COONH₄"
        correct: true
        why: "NH₄⁺ from NH₃, CH₃COO⁻ from CH₃COOH → ammonium ethanoate."
      - text: "NH₄CH₃COO"
        why: "Correct formula but unconventional order; usually written with cation first."
      - text: "CH₃COONH₃"
        why: "NH₃ is neutral; the cation is NH₄⁺."
      - text: "(CH₃COO)₂NH₄"
        why: "Wrong stoichiometry — charges are +1 and –1, so 1:1 ratio."
    explanation: |
      CH₃COOH + NH₃ → CH₃COONH₄ (ammonium ethanoate).

  - id: salt-ph-1
    format: mcq
    difficulty: 2
    objectives: ["7.2.8"]
    prompt: |
      A 0.1 mol dm⁻³ solution of KNO₃ has pH:
    options:
      - text: "< 7"
        why: "K⁺ from strong base KOH, NO₃⁻ from strong acid HNO₃ → neutral."
      - text: "= 7"
        correct: true
        why: "K⁺ (strong base cation) + NO₃⁻ (strong acid anion) = neutral salt."
      - text: "> 7"
        why: "Neither ion hydrolyses; solution is neutral."
      - text: "Cannot be determined"
        why: "We know both parents are strong → neutral."
    explanation: |
      KNO₃ comes from KOH (strong base) + HNO₃ (strong acid) → neutral salt, pH = 7.

  - id: salt-ph-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.8"]
    prompt: |
      Which salt solution would be **basic** (pH > 7)?
    options:
      - text: "NH₄NO₃"
        why: "NH₄⁺ from weak base → acidic."
      - text: "NaCl"
        why: "Strong + strong → neutral."
      - text: "Na₂CO₃"
        correct: true
        why: "CO₃²⁻ from weak acid H₂CO₃ → hydrolyses to produce OH⁻ → basic."
      - text: "FeCl₃"
        why: "Fe³⁺ is a small, highly charged cation → hydrolyses to give acidic solution."
    explanation: |
      Na₂CO₃: Na⁺ (strong base) + CO₃²⁻ (weak acid conjugate base) → CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻ → basic.

  - id: salt-ph-3
    format: mcq
    difficulty: 3
    objectives: ["7.2.8"]
    prompt: |
      Ammonium ethanoate (CH₃COONH₄) solution is slightly basic. Given Ka(CH₃COOH) = 1.7 × 10⁻⁵ and Ka(NH₄⁺) = 5.6 × 10⁻¹⁰, which statement explains this?
    options:
      - text: "Kb(CH₃COO⁻) > Ka(NH₄⁺)"
        correct: true
        why: "Kb = Kw/Ka = 1.0×10⁻¹⁴/1.7×10⁻⁵ = 5.9×10⁻¹⁰. Ka(NH₄⁺) = 5.6×10⁻¹⁰. Kb > Ka → anion hydrolysis dominates → basic."
      - text: "Ka(NH₄⁺) > Kb(CH₃COO⁻)"
        why: "Ka(NH₄⁺) = 5.6×10⁻¹⁰, Kb(CH₃COO⁻) = 5.9×10⁻¹⁰. Kb is slightly larger."
      - text: "Both ions hydrolyse equally"
        why: "They're close but not equal; Kb > Ka so slightly basic."
      - text: "Neither ion hydrolyses"
        why: "Both are from weak parents — both hydrolyse."
    explanation: |
      For salts of weak acid + weak base: compare Ka(cation) vs Kb(anion). Kb(CH₃COO⁻) = Kw/Ka(CH₃COOH) = 5.9×10⁻¹⁰. Ka(NH₄⁺) = 5.6×10⁻¹⁰. Kb > Ka → basic.