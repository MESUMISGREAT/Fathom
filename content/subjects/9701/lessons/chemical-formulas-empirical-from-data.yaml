id: chemical-formulas-empirical-from-data
subject: "9701"
topic: "2.3"
title: Calculating empirical formulas from data
summary: "The divide-divide table method for turning percentages or masses into an empirical formula, how to handle ratios like 1 : 1.5, and how to finish with the molecular formula."
order: 7
minutes: 5
objectives: ["2.3.5", "2.3.3"]
prerequisites: [chemical-formulas-empirical-and-molecular, mole-avogadro-mass-moles-particles]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.5: calculate empirical and molecular
    formulas from given data; uses 2.3.3). Ar values from the Cambridge Data Booklet.
    Percentage compositions are calculated from the formulas and rounded to 3 s.f., so the
    data are realistic but illustrative. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can calculate an empirical formula from **percentage** or **mass** data, deal with awkward ratios like $1 : 1.5$, and use $M_r$ to get the molecular formula.

  - type: explain
    title: You can't see atoms, but you can weigh them
    body: |
      An analyst hands you a white powder and a printout: "34.4 % iron, 65.6 % chlorine". No pictures of molecules, no formula. Just masses. Your job: decode it.

      The trick is the one from the mole topic. **Masses don't compare atoms; moles do.** So convert each element's mass to moles, then find the simplest ratio.

  - type: explain
    title: The divide–divide method
    body: |
      1. Write the **mass** (or percentage) of each element. A percentage is just the mass in a 100 g sample.
      2. **Divide by $A_r$** to get moles of atoms of each element.
      3. **Divide by the smallest** number of moles.
      4. If the results are whole numbers (within about 0.1), that's the ratio. If not, **multiply up** (next section).

  - type: example
    title: Decoding the white powder
    problem: |
      A chloride of iron contains 34.4 % Fe and 65.6 % Cl by mass. Find its empirical formula. ($A_r$: Fe = 55.8, Cl = 35.5)
    steps:
      - |
        | | Fe | Cl |
        | --- | --- | --- |
        | mass in 100 g | 34.4 g | 65.6 g |
        | ÷ $A_r$ (mol) | $34.4 \div 55.8 = 0.6165$ | $65.6 \div 35.5 = 1.848$ |
        | ÷ smallest | $1.00$ | $2.997$ |
      - |
        $2.997$ is within 0.1 of 3, so the ratio is $\text{Fe} : \text{Cl} = 1 : 3$.
    answer: |
      $\text{FeCl}_3$ (iron(III) chloride)

  - type: explain
    title: Got masses instead? Even easier
    body: |
      Masses work exactly like percentages: divide each element's mass in grams by its $A_r$.

      If you're given the mass of the **product** and of one element, get the other element **by subtraction**. Burn 1.20 g of magnesium to make 2.00 g of oxide, and the oxygen that combined is $2.00 - 1.20 = 0.80$ g.

  - type: check
    title: Quick check
    questions: [sulfur-oxide, aluminium-chloride-mass]

  - type: explain
    title: When the ratio isn't whole
    body: |
      Never round 1.5 to 2. A ratio like $1 : 1.5$ is real: it means $2 : 3$. Multiply **every** number by the same factor until they're all whole.

      | decimal part you see | multiply by | example |
      | --- | --- | --- |
      | ≈ .5 | 2 | $1 : 1.5 \rightarrow 2 : 3$ |
      | ≈ .33 or .67 | 3 | $1 : 1.33 \rightarrow 3 : 4$ |
      | ≈ .25 or .75 | 4 | $1 : 1.25 \rightarrow 4 : 5$ |

  - type: example
    title: Red iron oxide
    problem: |
      An oxide of iron contains 70.0 % Fe by mass. Find its empirical formula. ($A_r$: Fe = 55.8, O = 16.0)
    steps:
      - |
        The rest is oxygen: $100 - 70.0 = 30.0$ %.
      - |
        Moles: Fe $70.0 \div 55.8 = 1.254$; O $30.0 \div 16.0 = 1.875$.
      - |
        Divide by the smallest: Fe $1.00$; O $1.875 \div 1.254 = 1.495$.
      - |
        1.495 is "point five", so multiply both by 2: Fe $2.00$, O $2.99$, which is $2 : 3$.
    answer: |
      $\text{Fe}_2\text{O}_3$

  - type: check
    title: Awkward ratios
    questions: [phosphorus-oxide, ratio-thirds, chromium-rounding-error]

  - type: example
    title: All the way to the molecular formula
    problem: |
      A compound contains 54.5 % C, 9.1 % H and 36.4 % O by mass. Its $M_r$ is 88.0. Find its molecular formula. ($A_r$: C = 12.0, H = 1.0, O = 16.0)
    steps:
      - |
        Moles: C $54.5 \div 12.0 = 4.542$; H $9.1 \div 1.0 = 9.1$; O $36.4 \div 16.0 = 2.275$.
      - |
        ÷ smallest (2.275): C $1.996$, H $4.00$, O $1.00$. Empirical formula: $\text{C}_2\text{H}_4\text{O}$.
      - |
        Empirical formula mass: $2(12.0) + 4(1.0) + 16.0 = 44.0$
      - |
        $n = 88.0 \div 44.0 = 2$, so double every subscript.
    answer: |
      $\text{C}_4\text{H}_8\text{O}_2$

  - type: check
    title: The full journey
    questions: [c3h6o-molecular]

  - type: misconceptions
    items:
      - wrong: "Divide the percentages by the atomic (proton) numbers."
        right: "Divide by **$A_r$**, the relative atomic mass. You're converting mass into moles."
      - wrong: "Use 32.0 for oxygen because oxygen is $\\text{O}_2$."
        right: "You're counting **atoms** in the compound, so use $A_r(\\text{O}) = 16.0$. Same for Cl (35.5, not 71.0)."
      - wrong: "Round 1.5 to 2 and move on."
        right: "Multiply everything by 2 instead. Rounding 1.5 gives the wrong formula."
      - wrong: "Round the moles to 1 decimal place early on."
        right: "Keep at least 3 significant figures until the final ratio, or a 2.97 can turn into a 2.5."

  - type: exam
    body: |
      - Draw the table. Examiners award marks for the moles row and the ratio row separately, so a slip late on doesn't cost everything.
      - If percentages don't add up to 100 and only one element is missing, that element is the difference, often oxygen.
      - "Within about 0.1 of a whole number" is the usual tolerance. Anything further means multiply up or recheck.
      - Sense-check the final formula against charges you know: $\text{Fe}_2\text{O}_3$ fits $\text{Fe}^{3+}$ and $\text{O}^{2-}$.

  - type: takeaways
    items:
      - "Mass (or %) ÷ $A_r$ → moles; ÷ smallest → ratio."
      - "Use atom $A_r$ values (O = 16.0, Cl = 35.5), never the diatomic molecule's."
      - "Don't round .5, .33 or .25: multiply by 2, 3 or 4."
      - "Molecular formula: $n = M_r \\div$ empirical formula mass."

questions:
  - id: sulfur-oxide
    format: numeric
    difficulty: 2
    objectives: ["2.3.5"]
    prompt: |
      An oxide of sulfur contains 40.0 % S and 60.0 % O by mass. Find its empirical formula, $\text{S}_x\text{O}_y$. ($A_r$: S = 32.1, O = 16.0)
    fields:
      - label: "x ="
        answer: 1
      - label: "y ="
        answer: 3
    explanation: |
      S: $40.0 \div 32.1 = 1.246$; O: $60.0 \div 16.0 = 3.750$. Divide by 1.246: S $1.00$, O $3.01$. So $\text{SO}_3$.

  - id: aluminium-chloride-mass
    format: mcq
    difficulty: 2
    objectives: ["2.3.5"]
    prompt: |
      1.35 g of aluminium reacts with exactly 5.33 g of chlorine to form a chloride. What is its empirical formula? ($A_r$: Al = 27.0, Cl = 35.5)
    options:
      - text: |
          $\text{AlCl}_3$
        correct: true
        why: |
          Al: $1.35 \div 27.0 = 0.0500$ mol; Cl: $5.33 \div 35.5 = 0.150$ mol. Ratio $1 : 3.00$.
      - text: |
          $\text{Al}_2\text{Cl}_3$
        why: |
          This comes from dividing by 71.0 (the $M_r$ of $\text{Cl}_2$), giving $1 : 1.5$. Count chlorine **atoms**: use 35.5.
      - text: |
          $\text{AlCl}_4$
        why: |
          This compares the **masses** ($5.33 \div 1.35 \approx 4$) without converting to moles.
      - text: |
          $\text{Al}_3\text{Cl}$
        why: |
          The ratio is upside down: there are more chlorine atoms than aluminium atoms.
    explanation: |
      Moles of atoms: Al 0.0500, Cl 0.150, so $\text{AlCl}_3$. That also fits $\text{Al}^{3+}$ with three $\text{Cl}^-$.

  - id: phosphorus-oxide
    format: numeric
    difficulty: 2
    objectives: ["2.3.5"]
    prompt: |
      An oxide of phosphorus contains 43.7 % P by mass; the rest is oxygen. Find its empirical formula, $\text{P}_x\text{O}_y$. ($A_r$: P = 31.0, O = 16.0)
    fields:
      - label: "x ="
        answer: 2
      - label: "y ="
        answer: 5
    explanation: |
      O = 56.3 %. P: $43.7 \div 31.0 = 1.410$; O: $56.3 \div 16.0 = 3.519$. Ratio $1 : 2.496$, which is "point five", so double it: $2 : 4.99$, giving $\text{P}_2\text{O}_5$.

  - id: ratio-thirds
    format: mcq
    difficulty: 1
    objectives: ["2.3.5"]
    prompt: |
      After dividing by the smallest number of moles, a student gets Fe : O = 1.00 : 1.33. What is the empirical formula?
    options:
      - text: |
          $\text{Fe}_3\text{O}_4$
        correct: true
        why: |
          1.33 is "one and a third", so multiply by 3: $3.00 : 3.99$, which is $3 : 4$.
      - text: |
          FeO
        why: |
          Rounding 1.33 down to 1 throws away real information.
      - text: |
          $\text{Fe}_2\text{O}_3$
        why: |
          That's a $1 : 1.5$ ratio, not $1 : 1.33$.
      - text: |
          $\text{FeO}_{1.33}$
        why: |
          Formulas use whole numbers only.
    explanation: |
      Decimal part ≈ .33 → multiply everything by 3.

  - id: chromium-rounding-error
    format: spot-error
    difficulty: 2
    objectives: ["2.3.5"]
    prompt: |
      A student finds the empirical formula of an oxide of chromium containing 68.4 % Cr by mass ($A_r$: Cr = 52.0, O = 16.0). Which line contains the first error?
    lines:
      - |
        O = $100 - 68.4 = 31.6$ %
      - |
        Cr: $68.4 \div 52.0 = 1.315$ mol; O: $31.6 \div 16.0 = 1.975$ mol
      - |
        Divide by the smaller: Cr $1.00$, O $1.50$
      - |
        Round to the nearest whole number: Cr 1, O 2, so the formula is $\text{CrO}_2$.
    errorLine: 4
    fix: |
      1.50 is not close to a whole number. Multiply both by 2: Cr 2, O 3, so $\text{Cr}_2\text{O}_3$.
    explanation: |
      Lines 1–3 are spot on. $\text{Cr}_2\text{O}_3$ also fits chromium(III), $\text{Cr}^{3+}$.

  - id: c3h6o-molecular
    format: numeric
    difficulty: 3
    objectives: ["2.3.5", "2.3.3"]
    prompt: |
      A compound contains 62.1 % C, 10.3 % H and 27.6 % O by mass, and its $M_r$ is 116.0. Find its molecular formula, $\text{C}_x\text{H}_y\text{O}_z$. ($A_r$: C = 12.0, H = 1.0, O = 16.0)
    fields:
      - label: "x ="
        answer: 6
      - label: "y ="
        answer: 12
      - label: "z ="
        answer: 2
    explanation: |
      Moles: C $5.175$, H $10.3$, O $1.725$. ÷ 1.725: C $3.00$, H $5.97$, O $1.00$, so the empirical formula is $\text{C}_3\text{H}_6\text{O}$ (mass 58.0). $n = 116.0 \div 58.0 = 2$: $\text{C}_6\text{H}_{12}\text{O}_2$.
