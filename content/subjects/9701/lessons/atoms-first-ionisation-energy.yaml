id: atoms-first-ionisation-energy
subject: "9701"
topic: "1.4"
title: Ionisation energy and what controls it
summary: The definition of first ionisation energy, equations for first, second and later ionisations, and the four factors that decide how big it is.
order: 1
minutes: 4
objectives: ["1.4.1", "1.4.2", "1.4.5", "1.4.6"]
prerequisites: [atoms-electronic-configurations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.4, learning outcomes 1, 2, 5 and 6; ground states, H to
    Kr). Sodium first ionisation energy 496 kJ mol⁻¹ (NIST value 495.8). Questions are
    original.
    Independently re-checked line by line (facts, worked examples, every answer key)
    in a separate AI review on 2026-10-19. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can define first ionisation energy, write equations for first, second and later ionisation energies, and explain the four factors that control their size.

  - type: definition
    term: First ionisation energy, IE
    body: |
      The energy needed to remove one mole of electrons from one mole of **gaseous** atoms to form one mole of **gaseous** 1+ ions.

  - type: explain
    title: As an equation
    body: |
      For sodium:

      $$\text{Na(g)} \rightarrow \text{Na}^{+}\text{(g)} + \text{e}^{-} \qquad \text{first IE} = +496\ \text{kJ mol}^{-1}$$

      - Both the atom and the ion have the state symbol **(g)**.
      - Ionisation energies are always **positive**: removing an electron always takes energy.
      - Units: $\text{kJ mol}^{-1}$, because it's per mole.

  - type: check
    title: Quick check
    questions: [define-first-ie, sodium-moles]

  - type: explain
    title: Second, third and beyond
    body: |
      Each ionisation removes **one** electron from the ion made by the step before:

      $$\text{second:}\quad \text{Na}^{+}\text{(g)} \rightarrow \text{Na}^{2+}\text{(g)} + \text{e}^{-}$$

      $$\text{third:}\quad \text{Na}^{2+}\text{(g)} \rightarrow \text{Na}^{3+}\text{(g)} + \text{e}^{-}$$

      In general, the **nth** ionisation energy is

      $$\text{X}^{(n-1)+}\text{(g)} \rightarrow \text{X}^{n+}\text{(g)} + \text{e}^{-}$$

  - type: check
    title: Equations
    questions: [second-ie-magnesium, third-ie-error]

  - type: explain
    title: What decides the size?
    body: |
      Ionisation energy comes from the **attraction between the nucleus and the outer electron** being removed. Stronger attraction means more energy is needed.

      | factor | effect on IE |
      | --- | --- |
      | **nuclear charge** (number of protons) | more protons → stronger attraction → **higher** IE |
      | **atomic radius** (distance of the outer electron) | further away → weaker attraction → **lower** IE |
      | **shielding** by inner shells and sub-shells | more inner electrons repelling the outer one → **lower** IE |
      | **spin-pair repulsion** | electron shares its orbital with another → repelled → **lower** IE |

  - type: intuition
    title: A magnet and a paperclip
    body: |
      Pulling a paperclip off a magnet is harder if the magnet is stronger (nuclear charge) and easier if the paperclip is further away (radius). Sheets of card in between make it easier (shielding). A second paperclip squeezed into the same spot, pushing on the first, makes it easier still (spin-pair repulsion).

      Where it breaks down: shielding isn't a barrier. Inner electrons **repel** the outer electron, cancelling part of the nucleus's pull.

  - type: check
    title: The factors
    questions: [nucleus-cloze, easier-to-remove]

  - type: misconceptions
    items:
      - wrong: "Ionisation energy is the energy released when an electron is removed."
        right: "It's the energy **needed** (taken in). Ionisation is always endothermic."
      - wrong: "The second ionisation energy is $\\text{Na(g)} \\rightarrow \\text{Na}^{2+}\\text{(g)} + 2\\text{e}^{-}$."
        right: "That's the first and second added together. The second IE starts from $\\text{Na}^{+}\\text{(g)}$ and removes one electron."
      - wrong: "Electrons in the same shell shield each other well."
        right: "Shielding comes mainly from **inner** shells (and inner sub-shells). Electrons in the same shell shield each other only a little."

  - type: exam
    body: |
      - The definition has three must-haves: **one mole**, **gaseous** atoms, **1+ ions**. Missing "gaseous" is the classic lost mark.
      - In equations, put **(g)** on both sides and remove only **one** electron per step.
      - When you explain a value, name the factor **and** link it to attraction: "more shielding, so weaker attraction between the nucleus and the outer electron, so less energy needed".

  - type: takeaways
    items:
      - "First IE: energy to remove 1 mol of electrons from 1 mol of gaseous atoms, forming 1 mol of gaseous 1+ ions."
      - "nth IE: $\\text{X}^{(n-1)+}\\text{(g)} \\rightarrow \\text{X}^{n+}\\text{(g)} + \\text{e}^{-}$, always endothermic."
      - "IE is due to the attraction between the nucleus and the outer electron."
      - "Higher nuclear charge raises IE; larger radius, more shielding and spin-pair repulsion lower it."

questions:
  - id: define-first-ie
    format: text
    style: definition
    difficulty: 1
    objectives: ["1.4.1"]
    prompt: |
      Define the **first ionisation energy** of an element.
    accept:
      - "the energy needed to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "energy needed to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "the energy required to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "the energy needed to remove 1 mole of electrons from 1 mole of gaseous atoms to form 1 mole of gaseous 1+ ions"
      - "the energy required to remove 1 mol of electrons from 1 mol of gaseous atoms to form 1 mol of gaseous 1+ ions"
      - "the energy needed to remove one electron from each atom in one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "the energy required to remove one electron from each atom in one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "the energy needed to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous ions with a 1+ charge"
      - "the energy required to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous unipositive ions"
      - "the energy needed to remove one mole of electrons from one mole of atoms in the gaseous state to form one mole of gaseous 1+ ions"
      - "the energy required to remove an electron from each atom in one mole of gaseous atoms to form one mole of gaseous 1+ ions"
      - "the energy needed to remove one mole of electrons from one mole of gaseous atoms forming one mole of gaseous 1+ ions"
      - "the energy required to remove one mole of electrons from one mole of gaseous atoms producing one mole of gaseous 1+ ions"
    model: |
      The energy needed to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous 1+ ions.
    explanation: |
      Check yours for: one mole, gaseous atoms, and gaseous 1+ ions. If any is missing, it's not the full definition.

  - id: sodium-moles
    format: numeric
    difficulty: 2
    objectives: ["1.4.1"]
    prompt: |
      The first ionisation energy of sodium is $496\ \text{kJ mol}^{-1}$. How much energy is needed to convert 0.25 mol of gaseous sodium atoms into $\text{Na}^{+}\text{(g)}$ ions?
    fields:
      - answer: 124
        unit: kJ
    explanation: |
      IE is per mole of atoms: 0.25 mol × 496 kJ mol⁻¹ = 124 kJ.

  - id: second-ie-magnesium
    format: mcq
    difficulty: 1
    objectives: ["1.4.2"]
    prompt: |
      Which equation represents the **second** ionisation energy of magnesium?
    options:
      - text: |
          $\text{Mg(g)} \rightarrow \text{Mg}^{2+}\text{(g)} + 2\text{e}^{-}$
        why: |
          This removes two electrons at once: it's the first and second IEs added together.
      - text: |
          $\text{Mg}^{+}\text{(s)} \rightarrow \text{Mg}^{2+}\text{(s)} + \text{e}^{-}$
        why: |
          Ionisation energies are defined for gaseous species, so the state symbols must be (g).
      - text: |
          $\text{Mg}^{2+}\text{(g)} \rightarrow \text{Mg}^{3+}\text{(g)} + \text{e}^{-}$
        why: |
          This is the third ionisation energy.
      - text: |
          $\text{Mg}^{+}\text{(g)} \rightarrow \text{Mg}^{2+}\text{(g)} + \text{e}^{-}$
        correct: true
        why: |
          One electron removed from a gaseous 1+ ion to give a gaseous 2+ ion.
    explanation: |
      nth IE: $\text{X}^{(n-1)+}\text{(g)} \rightarrow \text{X}^{n+}\text{(g)} + \text{e}^{-}$. For n = 2, start from Mg⁺(g).

  - id: third-ie-error
    format: spot-error
    difficulty: 2
    objectives: ["1.4.2"]
    prompt: |
      A student writes the equation for the third ionisation energy of aluminium. Which line contains the first error?
    lines:
      - "The third ionisation energy removes the third electron from aluminium."
      - "It starts from the ion that has already lost two electrons, Al²⁺."
      - "Each ionisation step removes exactly one electron."
      - "So the equation is $\\text{Al}^{2+}\\text{(aq)} \\rightarrow \\text{Al}^{3+}\\text{(aq)} + \\text{e}^{-}$."
    errorLine: 4
    fix: |
      Ionisation energies refer to gaseous species: $\text{Al}^{2+}\text{(g)} \rightarrow \text{Al}^{3+}\text{(g)} + \text{e}^{-}$.
    explanation: |
      The reasoning is right up to the state symbols. (aq) describes ions in water, which is a different process.

  - id: nucleus-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.4.5", "1.4.6"]
    prompt: |
      Ionisation energy is due to the attraction between the {{1}} and the outer electron. Inner electrons reduce this attraction by repelling the outer electron; this effect is called {{2}}.
    blanks:
      - accept: ["nucleus", "positive nucleus", "nucleus (protons)", "protons"]
      - accept: ["shielding", "screening", "electron shielding"]
    explanation: |
      The positive nucleus attracts the outer electron; inner electrons shield it, so it feels less of that pull.

  - id: easier-to-remove
    format: mcq
    difficulty: 2
    objectives: ["1.4.6", "1.4.5"]
    prompt: |
      Which change would make an atom's outer electron **easier** to remove (a lower ionisation energy)?
    options:
      - text: |
          There are more protons in the nucleus, with the same shells.
        why: |
          More nuclear charge pulls harder, so the IE goes up.
      - text: |
          The outer electron is in a shell further from the nucleus.
        correct: true
        why: |
          Greater distance means weaker attraction to the nucleus, so less energy is needed.
      - text: |
          There are fewer inner shells between the nucleus and the outer electron.
        why: |
          Fewer inner shells means less shielding, so the electron is held more tightly.
      - text: |
          The outer electron is alone in its orbital instead of paired.
        why: |
          An unpaired electron has no spin-pair repulsion, so it is slightly harder to remove, not easier.
    explanation: |
      Lower IE comes from greater distance, more shielding or spin-pair repulsion; higher IE from greater nuclear charge.
