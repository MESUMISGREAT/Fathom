id: chemical-equilibria-reversible-dynamic
subject: "9701"
topic: "7.1"
title: "Reversible reactions and dynamic equilibrium"
summary: Some reactions never finish. In a closed system the forward and reverse rates become equal and the amounts stop changing, even though both reactions continue.
order: 1
minutes: 9
kind: core
objectives: ["7.1.1"]
prerequisites: []
