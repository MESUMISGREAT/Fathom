blocks:
  - type: objective
    body: |-
      By the end you can explain what a reversible reaction is, state what **dynamic equilibrium** means in terms of rates and concentrations, and explain why the system must be closed.

  - type: explain
    title: Reactions that go both ways
    body: |-
      Many reactions run to completion: you mix the reactants, they are used up, and that is the end of it.

      Some do not. As soon as products form, they start turning back into reactants. The reaction is **reversible**, and chemists show it with a half-headed arrow:

      $$\text{N}_2\text{O}_4(g) \rightleftharpoons 2\text{NO}_2(g)$$

      The arrow pointing right is the **forward reaction**; the arrow pointing left is the **reverse reaction**.

  - type: explain
    title: A familiar reversible change
    body: |-
      Heating blue hydrated copper(II) sulfate drives off water and leaves white anhydrous copper(II) sulfate:

      $$\text{CuSO}_4\cdot 5\text{H}_2\text{O}(s) \rightleftharpoons \text{CuSO}_4(s) + 5\text{H}_2\text{O}(g)$$

      Adding a drop of water to the white solid turns it blue again, producing the hydrated salt once more.

      This is the same reaction read in the opposite direction — the everyday test for water is the reverse of the everyday test for "water of crystallisation".

  - type: definition
    term: Dynamic equilibrium
    body: |-
      A system is at **dynamic equilibrium** when:

      - it is a **closed system** — no matter enters or leaves;
      - the **rate of the forward reaction equals the rate of the reverse reaction**;
      - the **concentrations** of reactants and products remain **constant** (they are not necessarily equal).

      The word *dynamic* is the important one: both reactions are still happening, at the same rate, so nothing appears to change.

  - type: explain
    title: Why the word dynamic matters
    body: |-
      A static equilibrium would be a reaction that has stopped. Dynamic equilibrium is the opposite: the reaction has not stopped, it has become a **two-way traffic** with equal flows.

      Imagine a room with two doors and people walking through both at the same rate. The number of people inside stays the same, yet people are constantly moving.

      In the same way, individual molecules keep reacting in both directions. Because the two rates match, the amount of each substance on the bench stays put.

  - type: intuition
    title: How a system settles down
    body: |-
      At the moment the reactants are mixed, only the forward reaction can happen, so it starts fast.

      As reactants are used up, the forward rate falls. Meanwhile product is building up, so the reverse reaction starts and speeds up.

      When the two rates meet, the system is at equilibrium. That is why equilibrium is reached after a period of change, not instantly.

  - type: diagram
    diagram: chem-equilibria-approach-equilibrium
    alt: >-
      Two graphs side by side. On the left, a rate–time graph: the forward reaction rate starts
      high and falls, the reverse reaction rate starts at zero and rises, and the two curves meet
      and stay level, with the meeting point marked equilibrium. On the right, a concentration–time
      graph: the reactant concentration falls and the product concentration rises, and both level
      off at constant values that are not equal to each other.
    caption: |-
      Equilibrium is where the two rates become equal — after which the concentrations stay level.

  - type: explain
    title: Why the system has to be closed
    body: |-
      Equilibrium requires **no matter to enter or leave**. If a product escapes — a gas fizzing away from an open beaker — the reverse reaction loses its raw material and can never catch up with the forward reaction.

      So the forward reaction keeps winning, and the reaction behaves as if it went to completion. That is why equilibrium experiments are done in sealed tubes or stoppered flasks.

      Energy may still be exchanged with the surroundings. Closed means closed to **matter**, not insulated.

  - type: check
    title: Checking the idea
    questions: [eq1-mcq-meaning, eq1-cloze, eq1-mcq-closed]

  - type: example
    title: Watching a system settle
    problem: |-
      Nitrogen dioxide is a brown gas and dinitrogen tetroxide is colourless. A sealed tube is filled with $\text{NO}_2$ and held at a constant temperature:

      $$2\text{NO}_2(g) \rightleftharpoons \text{N}_2\text{O}_4(g)$$

      Predict what happens to the colour, and explain what is happening to the two rates as the colour changes.
    steps:
      - |-
        **At the start**, the mixture is brown, because only $\text{NO}_2$ is present. Only the forward reaction can occur.
      - |-
        **As $\text{NO}_2$ is used up**, the brown colour fades, so the forward rate falls — there is less $\text{NO}_2$ to collide.
      - |-
        **$\text{N}_2\text{O}_4$ builds up**, so the reverse reaction starts and its rate rises.
      - |-
        **The colour stops changing** when the two rates become equal. The mixture is now a constant shade of brown.
      - |-
        **The reactions have not stopped.** Labelled atoms would still be swapped between the two gases, which is the "dynamic" part.
    answer: |-
      The brown colour fades and then stays constant. The forward rate falls and the reverse rate rises until they are equal; after that the concentrations are constant but both reactions continue.

  - type: misconceptions
    items:
      - wrong: |-
          At equilibrium the reaction has stopped.
        right: |-
          Both reactions continue at the same rate. Only the amounts change no further.
      - wrong: |-
          At equilibrium the amounts of reactants and products are equal.
        right: |-
          The **rates** are equal. The amounts are whatever the equilibrium position happens to give, and are usually unequal.
      - wrong: |-
          Equilibrium can be reached in an open beaker as long as you wait long enough.
        right: |-
          An open system lets matter escape, so the reverse reaction cannot keep up with the forward one. Equilibrium needs a closed system.
      - wrong: |-
          Equilibrium is reached as soon as the reactants are mixed.
        right: |-
          It takes time for the reverse reaction to build up to the same rate as the forward one.
      - wrong: |-
          At equilibrium the concentrations stop changing because the molecules stop moving.
        right: |-
          Molecules keep colliding and reacting; the concentrations are constant because the two rates are equal.

  - type: exam
    body: |-
      - For "state what is meant by dynamic equilibrium", earn the marks with **rate of forward reaction equals rate of reverse reaction** *and* **concentrations constant** — plus **closed system** when the question allows it.
      - Say "rates", not "amounts", when the point is about the two reactions matching.
      - Use $\rightleftharpoons$ for reversible reactions; a plain $\rightarrow$ loses the mark in an equation.
      - When asked why an open system cannot reach equilibrium, name the escaping substance: "the product leaves, so the reverse reaction cannot occur".

  - type: check
    title: End-of-lesson check
    questions: [eq1-mcq-rates, eq1-spot-error, eq1-explain]

  - type: takeaways
    items:
      - A reversible reaction can go in both directions; write it with $\rightleftharpoons$.
      - Dynamic equilibrium needs a closed system.
      - At equilibrium the forward and reverse **rates** are equal, so concentrations stay constant.
      - Both reactions continue; the word dynamic means exactly that.
      - Equilibrium takes time to establish.

questions:
  - id: eq1-mcq-meaning
    format: mcq
    difficulty: 1
    objectives: ["7.1.1"]
    prompt: |-
      Which statement describes a system at dynamic equilibrium?
    options:
      - text: The forward and reverse reactions occur at equal rates, so the concentrations remain constant.
        correct: true
        why: |-
          That is the definition: equal rates, constant concentrations, both reactions still running.
      - text: The forward reaction has stopped, leaving the products unchanged.
        why: |-
          Nothing has stopped; if the forward reaction stopped, the reverse could not be matching it.
      - text: The concentrations of reactants and products are equal.
        why: |-
          Equal **rates**, not equal amounts. Equilibrium mixtures are usually far from a 50:50 split.
      - text: All of the reactants have been converted into products.
        why: |-
          That describes a reaction that goes to completion, not one at equilibrium.
    explanation: |-
      Dynamic equilibrium means the two opposing reactions proceed at the same rate in a closed system, so the concentrations are constant.

  - id: eq1-cloze
    format: cloze
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |-
      In a closed system at equilibrium, the rate of the forward reaction is {{1}} to the rate of the reverse reaction, and the {{2}} of all substances remain constant. Because both reactions continue, the equilibrium is described as {{3}}.
    blanks:
      - accept: [equal]
      - accept: [concentrations, concentration, amounts]
      - accept: [dynamic]
    explanation: |-
      Equal forward and reverse rates keep the concentrations constant, while both reactions carry on — hence "dynamic".

  - id: eq1-mcq-closed
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |-
      Carbon dioxide is produced by heating calcium carbonate in a crucible open to the air:

      $$\text{CaCO}_3(s) \rightleftharpoons \text{CaO}(s) + \text{CO}_2(g)$$

      Why does this reaction go to completion rather than reaching equilibrium?
    options:
      - text: The carbon dioxide escapes, so the reverse reaction cannot keep up with the forward reaction.
        correct: true
        why: |-
          Equilibrium needs a closed system. With $\text{CO}_2$ leaving, only the forward reaction can proceed.
      - text: The reaction is endothermic, and endothermic reactions never reach equilibrium.
        why: |-
          Endothermic reactions reach equilibrium perfectly well; the enthalpy change is not the problem.
      - text: Calcium oxide is a solid, and solids cannot take part in equilibria.
        why: |-
          Solids appear in equilibria constantly; being a solid is not why this one runs to completion.
      - text: The temperature is too high for equilibrium to exist.
        why: |-
          Higher temperatures change the position of an equilibrium, but they do not abolish it.
    explanation: |-
      In an open crucible the gaseous product leaves the system, so the reverse reaction has nothing to react with and the forward reaction wins.

  - id: eq1-mcq-rates
    format: mcq
    difficulty: 2
    objectives: ["7.1.1"]
    prompt: |-
      A mixture reaches equilibrium. Which statement is true a minute later, assuming the conditions are unchanged?
    options:
      - text: Both reactions are still taking place, at equal rates.
        correct: true
        why: |-
          Equilibrium is dynamic: the two rates match, so no net change is seen.
      - text: Both reactions have stopped.
        why: |-
          That would be a static equilibrium, which does not exist for a reacting mixture.
      - text: Only the reverse reaction is taking place.
        why: |-
          Both directions are always occurring once equilibrium is reached.
      - text: The forward reaction is faster, which keeps the products topped up.
        why: |-
          If the forward reaction were faster, the mixture would not be at equilibrium; the amounts would still be changing.
    explanation: |-
      At equilibrium the forward and reverse rates are equal and nonzero, so the system looks static while remaining dynamic.

  - id: eq1-spot-error
    format: spot-error
    difficulty: 3
    objectives: ["7.1.1"]
    prompt: |-
      A student describes an equilibrium. Which line contains the first error?
    lines:
      - A sealed flask contains hydrogen, iodine and hydrogen iodide at equilibrium.
      - The reaction is $\text{H}_2(g) + \text{I}_2(g) \rightleftharpoons 2\text{HI}(g)$.
      - At equilibrium the reaction has stopped, so the amount of each gas stays the same.
      - The rate of the forward reaction equals the rate of the reverse reaction.
    errorLine: 3
    fix: |-
      The reaction has **not** stopped. Both the forward and the reverse reactions continue, but at equal rates, which is why the amounts stay the same.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 replaces the dynamic picture with a static one, which is the commonest misconception in this topic.

  - id: eq1-explain
    format: explain
    difficulty: 3
    objectives: ["7.1.1"]
    prompt: |-
      Explain what is meant by dynamic equilibrium, and explain why a closed system is needed for it to be established.
    model: |-
      Dynamic equilibrium is reached in a reversible reaction when the rate of the forward reaction equals the rate of the reverse reaction, so the concentrations of reactants and products remain constant even though both reactions continue. Because the rates are equal there is no net change, so the system appears to have stopped, but at the particle level reactants are still forming products and products are still forming reactants. The system must be closed, meaning no matter enters or leaves. If a gaseous product escaped, its concentration would fall, the reverse reaction would slow down, and the forward reaction would keep converting reactants, so the mixture would never settle at constant concentrations.
    keyPoints:
      - Forward and reverse rates are equal.
      - Concentrations stay constant, not necessarily equal.
      - Both reactions continue, so equilibrium is dynamic.
      - A closed system prevents matter escaping, so the reverse reaction can keep pace.
    explanation: |-
      Equilibrium is a balance of rates in a closed system, not a state of rest.
