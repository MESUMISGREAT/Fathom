id: covalent-bonding-bond-strength-and-reactivity
subject: "9701"
topic: "3.4"
title: "Using bond energies to compare reactivity"
summary: Weaker, longer bonds break more easily, which helps explain why N₂ is unreactive, HI decomposes easily, alkenes react and iodoalkanes hydrolyse fastest.
order: 8
minutes: 5
objectives: ["3.4.3"]
prerequisites: [covalent-bonding-bond-energy-and-length, covalent-bonding-sigma-and-pi]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 3, part (b): using bond energy and bond
    length to compare the reactivity of covalent molecules). Bond energies are Cambridge
    9701 Data Booklet values; the π-bond figure (610 − 350) is an estimate. All questions
    are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can use bond energies and bond lengths to compare how reactive covalent molecules are.

  - type: explain
    title: The laziest gas in the room
    body: |
      You breathe in about 78% nitrogen with every breath, and it does almost nothing. Fluorine, by contrast, attacks nearly everything it touches.

      A big part of the reason is in their bonds. Reactions usually start by **breaking** a bond, and some bonds are far harder to break than others.

  - type: explain
    title: The rule of thumb
    body: |
      When a reaction needs a particular bond to break:
      - **high bond energy** (usually a **short** bond) → hard to break → **less reactive**;
      - **low bond energy** (usually a **long** bond) → easy to break → **more reactive**.

      Only compare **similar** reactions, where the same kind of bond is breaking.

  - type: explain
    title: "Case 1: N₂, O₂ and F₂"
    body: |
      | molecule | bond | bond energy / kJ mol⁻¹ | reactivity |
      | --- | --- | --- | --- |
      | $\text{N}_2$ | N≡N | 944 | very unreactive |
      | $\text{O}_2$ | O=O | 496 | reactive |
      | $\text{F}_2$ | F–F | 158 | extremely reactive |

      Nitrogen's triple bond is so strong that $\text{N}_2$ is used to give an **unreactive atmosphere**, for example in food packaging.

  - type: check
    title: Quick check
    questions: [inert-atmosphere]

  - type: explain
    title: "Case 2: hydrogen halides on heating"
    body: |
      Push a red-hot wire into a jar of hydrogen iodide and violet iodine vapour appears: $2\text{HI(g)} \rightarrow \text{H}_2\text{(g)} + \text{I}_2\text{(g)}$. Do the same with hydrogen chloride and nothing visible happens.

      - H–I: longest bond, **299** kJ mol⁻¹: breaks easily.
      - H–Cl: shorter bond, **431** kJ mol⁻¹: much harder to break.

      So **thermal stability** falls from HCl to HBr to HI as the bonds get longer and weaker.

  - type: explain
    title: "Case 3: why alkenes react and alkanes don't"
    body: |
      A C=C bond (610) is **less than twice** a C–C bond (2 × 350 = 700). The σ part is about 350, so the **π bond** is worth only about:

      $$610 - 350 = 260\ \text{kJ mol}^{-1}$$

      The weak π bond is the easy target: alkenes react by **breaking the π bond** in addition reactions. Alkanes have only strong σ bonds (C–C 350, C–H 410), so they are much less reactive.

  - type: diagram
    diagram: chem-covalent-bonding-reactivity-bars
    alt: "Two bar charts on the same scale of bond energy in kJ per mole, 0 to 700. Left, titled why alkenes react: C–C bar at 350 and C=C bar at 610, the C=C bar split into a σ part of about 350 and a π part of about 260 on top; a dashed line at 700 is labelled 2 × C–C would be 700; note: the π bond is weaker than the σ bond, so it breaks first in addition reactions. Right, titled halogenoalkane hydrolysis: bars C–F 485, C–Cl 340, C–Br 280, C–I 240, with an arrow underneath labelled weaker bond, faster hydrolysis."
    caption: |
      Left: the π bond is the weak link. Right: down the halogens, the C–X bond gets weaker and hydrolysis gets faster.

  - type: explain
    title: "Case 4: halogenoalkanes"
    body: |
      Halogenoalkanes react with water by breaking the **C–X** bond. Rate of hydrolysis: **iodo > bromo > chloro**, with fluoro the slowest.

      That follows the bond energies (C–I 240 < C–Br 280 < C–Cl 340 < C–F 485), even though C–F is the **most polar** bond. Here bond strength matters more than polarity.

  - type: check
    title: Use the data
    questions: [pi-estimate, fastest-hydrolysis, hi-cloze]

  - type: misconceptions
    items:
      - wrong: "A double bond is twice as strong as a single bond, so alkenes should be less reactive than alkanes."
        right: "C=C (610) is less than 2 × C–C (700). The π part (about 260) is weaker than a σ bond and breaks easily."
      - wrong: "The most polar bond always reacts fastest."
        right: "Not for halogenoalkanes: C–F is the most polar but the strongest, so fluoroalkanes hydrolyse slowest."
      - wrong: "$\\text{N}_2$ is unreactive because it is a noble gas."
        right: "Nitrogen is in Group 15. It's unreactive because the N≡N triple bond is very strong (944 kJ mol⁻¹)."

  - type: exam
    body: |
      - Quote the numbers: "H–I (299 kJ mol⁻¹) is weaker than H–Cl (431 kJ mol⁻¹), so less energy is needed to break it."
      - Link to length when asked: longer bond → shared pair further from the nuclei → weaker attraction → lower bond energy → more reactive.
      - Bond energy is one factor among several (polarity, activation energy). Use it to compare **similar** molecules.

  - type: takeaways
    items:
      - "Weaker (usually longer) bonds break more easily, so the molecule is more reactive."
      - "N₂ (944) is very unreactive; F₂ (158) is extremely reactive."
      - "Thermal stability: HCl > HBr > HI, following the H–X bond energies."
      - "π bond ≈ 610 − 350 = 260 kJ mol⁻¹: why alkenes react. C–I is the weakest C–X bond: why iodoalkanes hydrolyse fastest."

  - type: check
    title: Put it together
    questions: [ethene-vs-ethane, hbr-error]

questions:
  - id: inert-atmosphere
    format: mcq
    difficulty: 1
    objectives: ["3.4.3"]
    prompt: |
      Which gas is used to provide an unreactive atmosphere because its molecules contain a very strong bond?
    options:
      - text: Nitrogen, $\text{N}_2$
        correct: true
        why: |
          N≡N has a bond energy of 944 kJ mol⁻¹, among the strongest bonds there is.
      - text: Oxygen, $\text{O}_2$
        why: |
          O=O (496 kJ mol⁻¹) is much weaker, and oxygen is very reactive.
      - text: Chlorine, $\text{Cl}_2$
        why: |
          Cl–Cl is weak (242 kJ mol⁻¹), and chlorine is a reactive gas.
      - text: Fluorine, $\text{F}_2$
        why: |
          F–F is the weakest of all (158 kJ mol⁻¹): fluorine is extremely reactive.
    explanation: |
      Strong bond → hard to break → unreactive. N₂ is the go-to unreactive gas.

  - id: pi-estimate
    format: numeric
    difficulty: 2
    objectives: ["3.4.3"]
    prompt: |
      Data Booklet bond energies: C–C 350 kJ mol⁻¹, C=C 610 kJ mol⁻¹. Assuming the σ part of C=C is the same as a C–C bond, estimate the energy of the **π bond** in C=C.
    fields:
      - answer: 260
        tolerance: { abs: 0.5 }
        unit: kJ mol⁻¹
    explanation: |
      C=C = σ + π, so π ≈ 610 − 350 = 260 kJ mol⁻¹: weaker than the σ bond, which is why alkenes react at the double bond.

  - id: fastest-hydrolysis
    format: mcq
    difficulty: 2
    objectives: ["3.4.3"]
    prompt: |
      Which of these is hydrolysed **fastest** by water under the same conditions?
    options:
      - text: 1-fluorobutane
        why: |
          C–F (485 kJ mol⁻¹) is the strongest C–X bond: slowest of all.
      - text: 1-chlorobutane
        why: |
          C–Cl (340 kJ mol⁻¹) is more polar than C–I but much stronger, so it's slower.
      - text: 1-bromobutane
        why: |
          C–Br (280 kJ mol⁻¹) is weaker than C–Cl, but C–I is weaker still.
      - text: 1-iodobutane
        correct: true
        why: |
          C–I (240 kJ mol⁻¹) is the weakest, longest C–X bond, so it breaks most easily.
    explanation: |
      Rate of hydrolysis follows C–X bond strength: C–I < C–Br < C–Cl < C–F, so iodo is fastest.

  - id: hi-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.4.3"]
    prompt: |
      Hydrogen iodide decomposes on heating more easily than hydrogen chloride, because the H–I bond is {{1}} than the H–Cl bond and has a {{2}} bond energy.
    blanks:
      - accept: ["longer", "weaker", "longer and weaker"]
      - accept: ["lower", "smaller", "lesser"]
    explanation: |
      The bigger I atom makes a longer bond; the shared pair is further from the nucleus, so the bond energy is lower (299 vs 431 kJ mol⁻¹) and it breaks more easily.

  - id: ethene-vs-ethane
    format: explain
    difficulty: 3
    objectives: ["3.4.3"]
    prompt: |
      Use bond energies to explain why ethene is much more reactive than ethane. (C–C 350 kJ mol⁻¹, C=C 610 kJ mol⁻¹, C–H 410 kJ mol⁻¹.)
    model: |
      Ethene contains a C=C double bond, made of one σ bond and one π bond. Because C=C (610 kJ mol⁻¹) is less than twice C–C (700 kJ mol⁻¹), the π bond is only about 610 − 350 = 260 kJ mol⁻¹, weaker than a σ bond, because sideways overlap of p orbitals is less effective. This weak π bond breaks easily, so ethene undergoes addition reactions. Ethane has only strong σ bonds (C–C 350, C–H 410 kJ mol⁻¹), so it is much less reactive.
    keyPoints:
      - "Ethene's C=C is one σ bond plus one π bond"
      - "C=C (610) is less than 2 × C–C (700), so the π bond is only about 260 kJ mol⁻¹"
      - "The π bond is weaker than a σ bond and breaks easily (addition reactions)"
      - "Ethane has only strong σ bonds (C–C 350, C–H 410), so it is unreactive"
    explanation: |
      The key comparison is the π bond (about 260 kJ mol⁻¹) against the σ bonds in ethane (350 and 410 kJ mol⁻¹).

  - id: hbr-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.3"]
    prompt: |
      A student compares the thermal stability of HCl and HBr. Which line contains the first error?
    lines:
      - "Bond energies: H–Cl 431 kJ mol⁻¹, H–Br 366 kJ mol⁻¹."
      - "Br atoms are larger than Cl atoms."
      - "So the H–Br bond is longer than the H–Cl bond."
      - "A longer bond is stronger, so the H–Br bond is harder to break."
      - "So HBr decomposes less easily than HCl when heated."
    errorLine: 4
    fix: |
      A longer bond is weaker (the shared pair is further from the nucleus), so the H–Br bond is easier to break.
    explanation: |
      The data in line 1 already shows it: H–Br (366) is weaker than H–Cl (431). So HBr decomposes more easily than HCl.
