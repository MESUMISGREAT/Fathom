id: period-3-chemical-chlorides-and-bonding
subject: "9701"
topic: "9.2"
title: Chlorides of Period 3 in water — and reading bonding off the evidence
summary: What the Period 3 chlorides do in water, why the pH falls across the period, and how to deduce ionic or covalent bonding from what you can see.
order: 4
minutes: 7
kind: core
objectives: ["9.2.5", "9.2.6", "9.2.7"]
prerequisites: [period-3-chemical-oxides-water]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027, topic 9.2 learning outcomes 5, 6 and 7: reactions of the chlorides
    with water and the likely pH of the solutions, explaining the trends in terms of bonding
    and electronegativity, and suggesting bonding from observed properties. All questions are
    original, and the pH values quoted are the ranges used in Cambridge mark schemes.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-29. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can write equations for each Period 3 chloride in water, predict and explain the pH it gives, and work out whether a chloride is ionic or covalent from properties you can observe.

  - type: explain
    title: Same period, wildly different behaviour
    body: |
      Drop five chlorides into water and you get five different stories. Sodium chloride just sits there and dissolves. Silicon tetrachloride hisses, gives off choking fumes and leaves a white solid.

      The difference is **how the chloride is bonded**. Ionic chlorides simply come apart into ions. Covalent chlorides are **attacked** by water and give off hydrogen chloride.

      | chloride | what you see in water | equation | likely pH |
      | --- | --- | --- | --- |
      | $\text{NaCl}$ | dissolves, no reaction | $\text{NaCl(s)} \rightarrow \text{Na}^{+}\text{(aq)} + \text{Cl}^{-}\text{(aq)}$ | about 7, neutral |
      | $\text{MgCl}_2$ | dissolves, very slight reaction | $\text{MgCl}_2\text{(s)} \rightarrow \text{Mg}^{2+}\text{(aq)} + 2\text{Cl}^{-}\text{(aq)}$ | about 6–7, very slightly acidic |
      | $\text{AlCl}_3$ | white precipitate, fumes | $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$ | about 2–3 |
      | $\text{SiCl}_4$ | white solid, choking fumes | $\text{SiCl}_4 + 2\text{H}_2\text{O} \rightarrow \text{SiO}_2 + 4\text{HCl}$ | about 1–2 |
      | $\text{PCl}_5$ | steamy fumes, clear solution | $\text{PCl}_5 + 4\text{H}_2\text{O} \rightarrow \text{H}_3\text{PO}_4 + 5\text{HCl}$ | about 1–2 |

      Read the last column: the **pH falls** as you cross the period. Something is releasing more and more $\text{H}^{+}$ ions.

  - type: check
    title: First look
    questions: [nacl-ph, alcl3-equation]

  - type: explain
    title: Why the pH falls
    body: |
      Two things release $\text{H}^{+}$ into the water: **hydrolysis** of the metal ion, and the $\text{HCl}$ produced by a covalent chloride.

      **The ionic end.** $\text{Na}^{+}$ and $\text{Mg}^{2+}$ are hydrated by water and stay largely intact, so the solution stays near neutral. $\text{Mg}^{2+}$ is small and 2+, so it pulls on the oxygen of a water molecule slightly and releases a little $\text{H}^{+}$ — that is why $\text{MgCl}_2$ is only *very* slightly acidic.

      **The covalent end.** In $\text{SiCl}_4$ and $\text{PCl}_5$ the bonds are covalent. Water's oxygen has lone pairs and attacks the $\delta+$ silicon or phosphorus. Each $\text{Cl}$ is replaced by $\text{OH}$ (or by oxide bridges), and the displaced chlorine leaves as $\text{HCl}$. One mole of $\text{PCl}_5$ gives **five** moles of $\text{HCl}$, which is why it is the most acidic of all.

      **Aluminium sits in the middle.** $\text{Al}^{3+}$ is tiny and 3+, so it polarises water strongly, and the $\text{Al}$–$\text{Cl}$ bond has real covalent character. Both effects make $\text{AlCl}_3$ hydrolyse readily, but not as completely as $\text{SiCl}_4$.

      Electronegativity tells the same story. Using the Data Booklet values (approximately Na 0.9, Mg 1.3, Al 1.6, Si 1.9, P 2.2, Cl 3.2):

      - $\text{Mg}$–$\text{Cl}$: difference about 1.9, so the bonding is **ionic**.
      - $\text{Al}$–$\text{Cl}$: difference about 1.6, **borderline**, with covalent character.
      - $\text{Si}$–$\text{Cl}$: difference about 1.3, clearly **covalent**.
      - $\text{P}$–$\text{Cl}$: difference about 1.0, clearly **covalent**.

      The smaller the electronegativity difference, the more covalent the chloride, the more readily it hydrolyses, and the lower the pH of the solution.

  - type: example
    title: Worked example — ranking three chlorides by pH
    problem: |
      Equal amounts (in moles) of $\text{NaCl}$, $\text{AlCl}_3$ and $\text{PCl}_5$ are added to equal volumes of water. Put the solutions in order of increasing pH and justify the order.
    steps:
      - "**Decide the bonding first.** $\text{NaCl}$ is ionic (large electronegativity difference), $\text{AlCl}_3$ is ionic with strong covalent character, $\text{PCl}_5$ is covalent."
      - "**Ionic chlorides only dissolve.** $\text{NaCl}$ gives $\text{Na}^{+}$ and $\text{Cl}^{-}$, neither of which hydrolyses much, so the pH stays at about 7."
      - "**The middle case hydrolyses partially.** $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$ gives a white precipitate and enough $\text{HCl}$ to reach pH 2–3."
      - "**The covalent case hydrolyses completely.** $\text{PCl}_5 + 4\text{H}_2\text{O} \rightarrow \text{H}_3\text{PO}_4 + 5\text{HCl}$ produces five moles of $\text{HCl}$ per mole of chloride, so the solution is the most acidic, pH about 1–2."
      - "Increasing pH means decreasing acidity, so the order is $\text{PCl}_5$ (lowest pH), then $\text{AlCl}_3$, then $\text{NaCl}$ (highest pH)."
    answer: |
      $\text{PCl}_5$ < $\text{AlCl}_3$ < $\text{NaCl}$ in pH, because covalent chlorides hydrolyse to give $\text{HCl}$ and ionic ones mostly just dissolve.

  - type: check
    title: Equations and pH
    questions: [sicl4-product, chloride-acidity-order]

  - type: explain
    title: Reading bonding off the evidence
    body: |
      Examiners love asking you to **suggest** the bonding from a list of properties. You do not need to be told; the evidence is enough.

      | observation | what it suggests |
      | --- | --- |
      | high melting point, does not conduct when solid, **conducts when molten or dissolved** | giant **ionic** lattice |
      | low melting point, often a liquid at room temperature, does not conduct, hydrolyses in water | **simple covalent** (molecular) |
      | very high melting point, does not conduct even when molten, hard | **giant covalent** |

      The key discriminator is **conductivity when molten**. Mobile ions carry charge in a molten ionic compound. A molecular liquid has no ions to carry anything.

      Compare two chlorides:

      - $\text{MgCl}_2$ melts at about 714 °C, conducts when molten, and dissolves to give a solution of pH about 6–7. **Ionic.**
      - $\text{SiCl}_4$ is a liquid at room temperature (melting point about −68 °C), does not conduct, and hydrolyses violently to pH 1–2. **Simple covalent.**

      Both contain chlorine and both are Period 3 chlorides, yet one is a high-melting salt and the other is a fuming liquid. Structure and bonding, not the formula, decide the properties.

  - type: check
    title: Evidence and explanation
    questions: [bonding-from-properties, electronegativity-explains, mgcl2-vs-sicl4]

  - type: misconceptions
    items:
      - wrong: "$\text{AlCl}_3$ solution is acidic because unreacted $\text{HCl}$ is mixed in with it."
        right: "It is acidic because $\text{AlCl}_3$ **hydrolyses**: $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$. The $\text{HCl}$ is produced by the reaction, not added."
      - wrong: "All Period 3 chlorides dissolve to give neutral solutions."
        right: "Only the ionic ones do, and even $\text{MgCl}_2$ is slightly acidic. The covalent chlorides hydrolyse and give strongly acidic solutions."
      - wrong: "$\text{SiCl}_4$ gives a white precipitate because silicon is a metal."
        right: "Silicon is a metalloid and the white solid is silicon dioxide, formed when water replaces the chloride: $\text{SiCl}_4 + 2\text{H}_2\text{O} \rightarrow \text{SiO}_2 + 4\text{HCl}$."
      - wrong: "A low melting point proves a compound is ionic but weak."
        right: "A low melting point points to **simple molecular** bonding. Ionic compounds have high melting points because many strong electrostatic attractions must be broken."

  - type: exam
    body: |
      - Write **state symbols** in these equations. $\text{HCl}$ leaves as a gas, the metal hydroxide or oxide is a solid, water is liquid.
      - Balance the $\text{HCl}$: three from $\text{AlCl}_3$, four from $\text{SiCl}_4$, five from $\text{PCl}_5$. The number of chlorines tells you how many $\text{HCl}$ form.
      - For a pH question, name the product that causes acidity ($\text{HCl}$ or $\text{H}_3\text{PO}_4$) and link it to hydrolysis.
      - For a "suggest the bonding" question, quote the evidence and name the structure: "conducts when molten, so the ions are free to move — giant ionic lattice".
      - "Dissolves" and "reacts" are different words. $\text{NaCl}$ dissolves; $\text{SiCl}_4$ reacts.

  - type: takeaways
    items:
      - "$\text{NaCl}$ and $\text{MgCl}_2$ are ionic: they dissolve, giving solutions of pH about 7 and about 6–7."
      - "$\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$, pH about 2–3."
      - "$\text{SiCl}_4 + 2\text{H}_2\text{O} \rightarrow \text{SiO}_2 + 4\text{HCl}$ and $\text{PCl}_5 + 4\text{H}_2\text{O} \rightarrow \text{H}_3\text{PO}_4 + 5\text{HCl}$, pH about 1–2."
      - "The smaller the electronegativity difference, the more covalent the chloride, the more it hydrolyses and the lower the pH."
      - "Ionic: conducts when molten. Simple covalent: low melting point, no conductivity, hydrolyses. Giant covalent: very high melting point, no conductivity."

questions:
  - id: nacl-ph
    format: numeric
    difficulty: 1
    objectives: ["9.2.5"]
    prompt: |
      A student dissolves some sodium chloride in pure water. What is the pH of the solution? Give your answer to the nearest whole number.
    fields:
      - answer: 7
        tolerance:
          abs: 0.5
    explanation: |
      Sodium chloride is ionic and simply dissolves into hydrated $\text{Na}^{+}$ and $\text{Cl}^{-}$ ions. Neither ion hydrolyses appreciably, so the solution stays neutral, pH about 7.

  - id: alcl3-equation
    format: mcq
    difficulty: 2
    objectives: ["9.2.5"]
    prompt: |
      Which equation shows what happens when aluminium chloride is added to cold water?
    options:
      - text: |
          $\text{AlCl}_3\text{(s)} \rightarrow \text{Al}^{3+}\text{(aq)} + 3\text{Cl}^{-}\text{(aq)}$
        why: |
          This is simple dissolving, which is what an ionic chloride would do. Aluminium chloride reacts: you see a white precipitate and fumes.
      - text: |
          $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + \text{HCl}$
        why: |
          The equation does not balance. Three chlorines leave, so three $\text{HCl}$ molecules must form, not one.
      - text: |
          $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{AlH}_3 + 3\text{HOCl}$
        why: |
          Aluminium hydride is not formed and this is not a hydrolysis. Water replaces each chloride with hydroxide, releasing hydrogen chloride.
      - text: |
          $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$
        correct: true
        why: |
          Each chloride is replaced by hydroxide from water, and the displaced chlorine leaves with hydrogen as $\text{HCl}$. That is why you see a white precipitate and acidic fumes.
    explanation: |
      Aluminium chloride hydrolyses: $\text{AlCl}_3 + 3\text{H}_2\text{O} \rightarrow \text{Al(OH)}_3 + 3\text{HCl}$. The white precipitate is $\text{Al(OH)}_3$ and the fumes are $\text{HCl}$, which turn damp blue litmus red.

  - id: sicl4-product
    format: cloze
    difficulty: 2
    objectives: ["9.2.5"]
    prompt: |
      Silicon tetrachloride reacts vigorously with water:

      $\text{SiCl}_4 + 2\text{H}_2\text{O} \rightarrow$ {{1}} + 4{{2}}
    blanks:
      - accept: ["SiO2", "silicon dioxide", "silicon(IV) oxide", "silica"]
      - accept: ["HCl", "hydrogen chloride", "hydrochloric acid"]
    explanation: |
      Water replaces the chlorides, giving the white solid silicon dioxide and four moles of hydrogen chloride gas. The $\text{HCl}$ makes the solution strongly acidic, pH about 1–2.

  - id: chloride-acidity-order
    format: mcq
    difficulty: 2
    objectives: ["9.2.5", "9.2.6"]
    prompt: |
      Equal amounts, in moles, of four chlorides are added to equal volumes of water. Which solution has the **lowest** pH?
    options:
      - text: |
          $\text{NaCl}$
        why: |
          Sodium chloride is ionic and only dissolves, giving a neutral solution of pH about 7.
      - text: |
          $\text{MgCl}_2$
        why: |
          It is ionic too. The small 2+ ion hydrolyses slightly, so the pH is about 6–7, not the lowest.
      - text: |
          $\text{AlCl}_3$
        why: |
          It hydrolyses to give three moles of $\text{HCl}$ per mole, so the pH is about 2–3 — strongly acidic, but not the most acidic here.
      - text: |
          $\text{PCl}_5$
        correct: true
        why: |
          One mole of $\text{PCl}_5$ reacts with four moles of water to give five moles of $\text{HCl}$, plus phosphoric acid, so it releases the most acid and gives the lowest pH, about 1–2.
    explanation: |
      $\text{PCl}_5 + 4\text{H}_2\text{O} \rightarrow \text{H}_3\text{PO}_4 + 5\text{HCl}$ releases the most acid per mole of chloride, so it gives the lowest pH. The order of increasing pH is $\text{PCl}_5$, $\text{AlCl}_3$, $\text{MgCl}_2$, $\text{NaCl}$.

  - id: bonding-from-properties
    format: text
    style: one-line
    difficulty: 2
    objectives: ["9.2.7"]
    prompt: |
      A white solid has a high melting point. It does not conduct electricity when solid, but it conducts when molten. It dissolves in water to give a solution of pH about 7. Name the type of bonding present.
    accept:
      - "ionic"
      - "ionic bonding"
      - "ionic bonds"
      - "ionic lattice"
      - "giant ionic"
      - "giant ionic lattice"
    model: |
      Ionic bonding in a giant ionic lattice.
    explanation: |
      Conducting when molten means there are mobile ions, so the solid is ionic. A simple molecular solid would have a low melting point and would not conduct even when melted.

  - id: electronegativity-explains
    format: mcq
    difficulty: 3
    objectives: ["9.2.6"]
    prompt: |
      Why is sulfur trioxide an acidic oxide while sodium oxide is basic?
    options:
      - text: |
          Sulfur has more outer-shell electrons than sodium, so its oxide is acidic.
        why: |
          The number of outer-shell electrons fixes the oxidation number ($+6$ in $\text{SO}_3$, $+1$ in $\text{Na}_2\text{O}$), but it is not what makes an oxide acidic.
      - text: |
          $\text{SO}_3$ is a bigger molecule than $\text{Na}_2\text{O}$, and bigger oxides are acidic.
        why: |
          Size is not the reason. Bonding and the polarity of the element–oxygen bond decide acid–base character.
      - text: |
          The electronegativity difference between S and O is much smaller than between Na and O, so $\text{SO}_3$ is covalent and acidic while $\text{Na}_2\text{O}$ is ionic and basic.
        correct: true
        why: |
          Oxygen (3.4) differs from sodium (0.9) by about 2.5, so $\text{Na}_2\text{O}$ is ionic and basic. It differs from sulfur (2.6) by only about 0.8, so $\text{SO}_3$ is covalent and acidic.
      - text: |
          $\text{Na}_2\text{O}$ reacts with water but $\text{SO}_3$ does not.
        why: |
          Both react with water: $\text{Na}_2\text{O}$ gives sodium hydroxide and $\text{SO}_3$ gives sulfuric acid. Reacting is not the distinguishing feature.
    explanation: |
      A large electronegativity difference gives an ionic oxide, which is basic. A small difference gives a covalent oxide, which is acidic. Electronegativity values: Na 0.9, S 2.6, O 3.4.

  - id: mgcl2-vs-sicl4
    format: explain
    difficulty: 3
    objectives: ["9.2.5", "9.2.6"]
    prompt: |
      Magnesium chloride dissolves in water to give a solution of pH about 6–7, but silicon tetrachloride reacts violently with water to give a solution of pH about 1–2. Explain the difference in terms of bonding and electronegativity.
    model: |
      Magnesium chloride is ionic because magnesium (1.3) and chlorine (3.2) differ greatly in electronegativity, so it simply dissolves into hydrated ions that do not hydrolyse much. Silicon (1.9) and chlorine (3.2) differ little, so $\text{SiCl}_4$ is covalent; water attacks the $\delta+$ silicon, replacing chloride with oxide or hydroxide and releasing $\text{HCl}$, so the solution is strongly acidic.
    keyPoints:
      - "$\text{MgCl}_2$ is ionic: large electronegativity difference, ions separate in water."
      - "The hydrated $\text{Mg}^{2+}$ ion hydrolyses only slightly, so pH stays about 6–7."
      - "$\text{SiCl}_4$ is covalent: silicon and chlorine have similar electronegativities."
      - 'Water''s oxygen attacks the $\delta+$ silicon, replacing $\text{Cl}$ and releasing $\text{HCl}$.'
      - "The $\text{HCl}$ produced makes the solution strongly acidic, pH about 1–2."
    explanation: |
      Magnesium chloride is ionic because magnesium (1.3) and chlorine (3.2) differ greatly in electronegativity, so it simply dissolves into hydrated ions that do not hydrolyse much. Silicon (1.9) and chlorine (3.2) differ little, so SiCl4 is covalent; water attacks the δ+ silicon, replacing chloride with oxide or hydroxide and releasing HCl, so the solution is strongly acidic.
