id: enthalpy-change-named-changes
subject: "9701"
topic: "5.1"
title: "The four enthalpy changes you must define"
summary: Reaction, formation, combustion and neutralisation each have a precise definition — and each turns on which substance is "one mole" of.
order: 4
minutes: 7
kind: core
objectives: ["5.1.3"]
prerequisites: [enthalpy-change-standard-conditions]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027 (learning outcome 5.1.3b, define and use enthalpy change with reference to reaction,
    formation, combustion and neutralisation). Tabulated values are Cambridge-style illustrative
    data; all questions are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can write the **definitions** of $\Delta H_\text{r}$, $\Delta H_\text{f}$, $\Delta H_\text{c}$ and $\Delta H_\text{neut}$ and match each one to its equation, including the "one mole of…" bit that earns the marks.

  - type: explain
    title: Same idea, four different questions
    body: |
      All four are enthalpy changes, so all four are measured in $\text{kJ mol}^{-1}$ and all four carry the ⦵ when conditions are standard.

      What differs is **what the "per mole" refers to**:

      | Name | Per mole of… |
      | --- | --- |
      | Reaction, $\Delta H_\text{r}$ | whatever the equation says — moles as written |
      | Formation, $\Delta H_\text{f}$ | **1 mol of compound formed** |
      | Combustion, $\Delta H_\text{c}$ | **1 mol of substance burned** |
      | Neutralisation, $\Delta H_\text{neut}$ | **1 mol of water formed** |

      Get that last column right and the definitions write themselves.

  - type: definition
    term: Standard enthalpy change of reaction, ΔHr⦵
    body: |
      The enthalpy change when a reaction occurs in the **molar quantities shown in the equation**, with all reactants and products in their standard states at 298 K and 101 kPa.

      For example, for

      $$2\text{H}_2\text{(g)} + \text{O}_2\text{(g)} \rightarrow 2\text{H}_2\text{O(l)}$$

      $\Delta H_\text{r}^{\ominus}$ refers to **two** moles of hydrogen reacting, so it is twice the value for one mole.

  - type: definition
    term: Standard enthalpy change of formation, ΔHf⦵
    body: |
      The enthalpy change when **one mole of a compound** is formed from its **elements in their standard states**, under standard conditions.

      Example: $\text{C(graphite)} + 2\text{H}_2\text{(g)} \rightarrow \text{CH}_4\text{(g)}$.

      Two consequences you can use in calculations:

      - the $\Delta H_\text{f}^{\ominus}$ of an **element** in its standard state is **zero**;
      - the compound must be formed from elements, not from other compounds.

  - type: definition
    term: Standard enthalpy change of combustion, ΔHc⦵
    body: |
      The enthalpy change when **one mole of a substance** is **completely burned in excess oxygen**, under standard conditions, with all reactants and products in their standard states.

      Example: $\text{CH}_4\text{(g)} + 2\text{O}_2\text{(g)} \rightarrow \text{CO}_2\text{(g)} + 2\text{H}_2\text{O(l)}$.

      "Completely" matters: partial combustion to carbon monoxide releases much less energy, so a
      value measured with a smoky flame is not $\Delta H_\text{c}^{\ominus}$.

  - type: definition
    term: Standard enthalpy change of neutralisation, ΔHneut⦵
    body: |
      The enthalpy change when **one mole of water** is formed in the reaction between an acid and a base (alkali), under standard conditions, with all species in their standard states.

      Example: $\text{H}^+\text{(aq)} + \text{OH}^-\text{(aq)} \rightarrow \text{H}_2\text{O(l)}$.

      Because this ionic equation is the same for every strong acid with every strong alkali, all
      such neutralisations have roughly the same value, about $-57\ \text{kJ mol}^{-1}$.

  - type: diagram
    diagram: chem-enthalpy-change-named-changes
    alt: >-
      Four labelled panels, each showing a balanced equation with the "one mole" substance ringed.
      Formation: "1 mol of compound made from elements", with C(graphite) + 2H2 → CH4 ringed around
      CH4. Combustion: "1 mol of fuel burned in excess oxygen", CH4 + 2O2 → CO2 + 2H2O, with CH4
      ringed. Neutralisation: "1 mol of water formed", H+ + OH− → H2O, with H2O ringed. Reaction:
      "moles exactly as written", 2H2 + O2 → 2H2O with the whole equation bracketed. A footer reads
      "per mole of the ringed species".
    caption: |
      Each named enthalpy change is "per mole" of a different thing — the ringed species.

  - type: check
    title: Quick check
    questions: [which-definition, formation-of-element, combustion-definition]

  - type: example
    title: "Worked example: which definition applies?"
    problem: |
      For each process, name the enthalpy change that is being described.

      (a) $\text{C}_2\text{H}_5\text{OH(l)} + 3\text{O}_2\text{(g)} \rightarrow 2\text{CO}_2\text{(g)} + 3\text{H}_2\text{O(l)}$

      (b) $\frac{1}{2}\text{N}_2\text{(g)} + \frac{3}{2}\text{H}_2\text{(g)} \rightarrow \text{NH}_3\text{(g)}$

      (c) $\text{KOH(aq)} + \text{HCl(aq)} \rightarrow \text{KCl(aq)} + \text{H}_2\text{O(l)}$
    steps:
      - |
        (a) One mole of ethanol is burned completely in oxygen, giving carbon dioxide and water. That
        is the **standard enthalpy change of combustion** of ethanol.
      - |
        (b) One mole of ammonia is formed from its elements in their standard states ($\text{N}_2$
        and $\text{H}_2$ are the standard states). That is the **standard enthalpy change of
        formation** of ammonia.
      - |
        (c) One mole of water is formed when an acid reacts with an alkali. That is the **standard
        enthalpy change of neutralisation**.
      - |
        In each case the "one mole" in the equation is the clue: one mole of fuel, one mole of
        compound, one mole of water.
    answer: |
      (a) combustion of ethanol (b) formation of ammonia (c) neutralisation.

  - type: misconceptions
    items:
      - wrong: ΔHf⦵ of oxygen is −1, so it must be included.
        right: |
          $\Delta H_\text{f}^{\ominus}$ of an element in its standard state is exactly **zero**:
          forming $\text{O}_2$ from $\text{O}_2$ changes nothing.
      - wrong: ΔHc⦵ of hydrogen refers to one mole of oxygen.
        right: |
          It is per mole of the **substance burned** — hydrogen. The oxygen is in excess, so its
          amount is not the reference.
      - wrong: ΔHr⦵ is always per mole of product.
        right: |
          It is per mole of reaction **as written**. In $2\text{H}_2 + \text{O}_2 \rightarrow
          2\text{H}_2\text{O}$, $\Delta H_\text{r}^{\ominus}$ is for two moles of water.
      - wrong: Neutralisation always gives −57 kJ mol⁻¹.
        right: |
          Strong acid with strong alkali gives about $-57$ because the reaction is always
          $\text{H}^+ + \text{OH}^- \rightarrow \text{H}_2\text{O}$. A weak acid gives a smaller
          magnitude, because some energy is used ionising it.
      - wrong: Formation must start from compounds, like forming CO₂ from carbon and oxygen.
        right: |
          That is formation from **elements**, which is correct — but forming one compound from
          another compound is not formation at all.
      - wrong: The ⦵ symbol is optional in definitions.
        right: |
          The definitions are of **standard** enthalpy changes. State the conditions and use
          $\Delta H^{\ominus}$; dropping them can lose a mark.

  - type: exam
    body: |
      - Learn the four definitions word for word enough to write them: "…when **one mole of** X … under **standard conditions**, with all substances in their **standard states**."
      - The three key phrases are: "one mole", "standard conditions", "standard states". Each is worth a mark.
      - For combustion, add "**in excess oxygen**" and "**completely**".
      - For formation, add "**from its elements**".
      - For neutralisation, add "**forming one mole of water**" — not "one mole of acid".
      - When a question gives an equation and asks for $\Delta H_\text{r}$, check the coefficient of the species you care about; scale accordingly.

  - type: check
    title: Check yourself
    questions: [scale-delta-h, neutralisation-weak-acid, definition-cloze, total-energy]

  - type: takeaways
    items:
      - $\Delta H_\text{r}^{\ominus}$ is per mole of reaction as written.
      - $\Delta H_\text{f}^{\ominus}$ is per mole of compound formed from its elements; elements have zero.
      - $\Delta H_\text{c}^{\ominus}$ is per mole of substance completely burned in excess oxygen.
      - $\Delta H_\text{neut}^{\ominus}$ is per mole of water formed from acid and alkali.
      - All four need standard conditions and standard states to carry the ⦵.

  - type: deeper
    title: Why −57 kJ mol⁻¹ is so reliable
    body: |
      In dilute solution, strong acids are fully ionised and strong alkalis fully dissociated. The
      only thing that actually happens is

      $$\text{H}^+\text{(aq)} + \text{OH}^-\text{(aq)} \rightarrow \text{H}_2\text{O(l)}$$

      The spectator ions do not change, so the enthalpy change is the same whatever the acid and
      alkali are — the value depends only on forming the O–H bond in water and on the hydration of
      the ions.

      A weak acid such as ethanoic acid is only partly ionised, so energy must first be supplied to
      ionise it. The magnitude of $\Delta H_\text{neut}^{\ominus}$ therefore comes out smaller —
      around $-55\ \text{kJ mol}^{-1}$ rather than $-57$.

questions:
  - id: which-definition
    format: mcq
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      Which quantity is defined as "the enthalpy change when one mole of a compound is formed from its elements in their standard states under standard conditions"?
    options:
      - text: Standard enthalpy change of formation
        correct: true
        why: |
          "One mole of compound from its elements in their standard states" is the definition of
          $\Delta H_\text{f}^{\ominus}$.
      - text: Standard enthalpy change of reaction
        why: |
          That is per mole of reaction as written, not necessarily one mole of compound formed.
      - text: Standard enthalpy change of combustion
        why: |
          Combustion is one mole of substance burned in excess oxygen.
      - text: Standard enthalpy change of neutralisation
        why: |
          Neutralisation is one mole of water formed from acid and alkali.
    explanation: |
      The phrase "one mole of compound formed from its elements" belongs only to formation.

  - id: formation-of-element
    format: numeric
    difficulty: 1
    objectives: ["5.1.3"]
    prompt: |
      What is the standard enthalpy change of formation of $\text{O}_2\text{(g)}$, in $\text{kJ mol}^{-1}$?
    fields:
      - answer: 0
        tolerance: { abs: 0.01 }
        unit: kJ mol^-1
    explanation: |
      Oxygen gas is an element in its standard state. Forming it from itself involves no change, so
      $\Delta H_\text{f}^{\ominus} = 0$ by definition.

  - id: combustion-definition
    format: mcq
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      Which statement correctly defines the standard enthalpy change of combustion of methane?
    options:
      - text: The enthalpy change when one mole of methane is completely burned in excess oxygen under standard conditions
        correct: true
        why: |
          Combustion is per mole of the substance burned, needs excess oxygen, and must be complete.
      - text: The enthalpy change when one mole of carbon dioxide is formed from methane and oxygen
        why: |
          That is per mole of product, not per mole of fuel, and omits "complete" and "excess
          oxygen".
      - text: The enthalpy change when methane reacts with a limited supply of oxygen
        why: |
          A limited supply gives incomplete combustion to CO or soot, which releases a different
          amount of energy.
      - text: The enthalpy change when one mole of methane is formed from carbon and hydrogen
        why: |
          That describes formation, not combustion.
    explanation: |
      The mark-scheme wording needs: one mole of substance, completely burned, excess oxygen,
      standard conditions.

  - id: scale-delta-h
    format: numeric
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      For the reaction $2\text{H}_2\text{(g)} + \text{O}_2\text{(g)} \rightarrow 2\text{H}_2\text{O(l)}$, $\Delta H_\text{r}^{\ominus} = -572\ \text{kJ mol}^{-1}$.

      Calculate the enthalpy change, in $\text{kJ}$, when $0.50\ \text{mol}$ of hydrogen reacts completely.
    fields:
      - answer: -143
        tolerance: { abs: 1 }
        unit: kJ
    explanation: |
      The quoted value is for **two** moles of hydrogen, so it is $-286\ \text{kJ mol}^{-1}$ of
      hydrogen. For $0.50\ \text{mol}$:
      $0.50 \times (-286) = -143\ \text{kJ}$.

  - id: neutralisation-weak-acid
    format: mcq
    difficulty: 3
    objectives: ["5.1.3"]
    prompt: |
      Neutralising hydrochloric acid with sodium hydroxide gives about $-57\ \text{kJ mol}^{-1}$. With ethanoic acid the value is about $-55\ \text{kJ mol}^{-1}$. Why?
    options:
      - text: Ethanoic acid is weak, so energy is used ionising it before it can react
        correct: true
        why: |
          Only a small fraction of ethanoic acid molecules are ionised, so some of the energy
          released on forming water is used up in ionising the rest.
      - text: Ethanoic acid is a stronger acid, so it releases more energy
        why: |
          Ethanoic acid is weaker than hydrochloric acid, not stronger.
      - text: Sodium hydroxide is a weak base in the second case
        why: |
          The alkali is the same in both experiments; only the acid changes.
      - text: The reaction is incomplete, so less water forms
        why: |
          Neutralisation of a weak acid by a strong alkali still goes essentially to completion;
          the difference is the ionisation energy, not the extent.
    explanation: |
      Ionising a weak acid absorbs energy, so the measured enthalpy change is slightly less
      negative.

  - id: definition-cloze
    format: cloze
    difficulty: 2
    objectives: ["5.1.3"]
    prompt: |
      Complete the definition. The standard enthalpy change of combustion is the enthalpy change when one mole of a substance is {{1}} burned in {{2}} oxygen under standard conditions.
    blanks:
      - accept: ["completely", "completely burned", "fully"]
      - accept: ["excess", "an excess of", "excess oxygen"]
    explanation: |
      Both words matter: "completely" rules out partial combustion to CO, and "excess" guarantees
      there is enough oxygen for that to happen.

  - id: total-energy
    format: numeric
    difficulty: 3
    objectives: ["5.1.3"]
    prompt: |
      The standard enthalpy change of combustion of ethanol is $-1367\ \text{kJ mol}^{-1}$.

      Calculate the energy released, in $\text{kJ}$, when $4.60\ \text{g}$ of ethanol burns completely. ($M_r$ of ethanol = $46.0$)
    fields:
      - answer: 137
        tolerance: { abs: 1 }
        unit: kJ
    explanation: |
      Moles of ethanol: $4.60 / 46.0 = 0.100\ \text{mol}$.
      Energy released: $0.100 \times 1367 = 137\ \text{kJ}$ (the negative sign means released; the
      question asks for the amount released).
