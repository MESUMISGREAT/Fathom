id: bronsted-lowry-indicators
subject: "9701"
topic: "7.2"
title: Choosing indicators — catching the jump
summary: "How indicators work (weak acids/bases), their pH ranges, and selecting the right one for each titration type so the colour change matches the equivalence point."
order: 9
minutes: 4
objectives: ["7.2.10"]
prerequisites: ["bronsted-lowry-titration-curves"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 10; selecting indicators).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain how indicators work, state the pH ranges of common indicators, and select the appropriate indicator for a given titration based on the vertical jump region of its titration curve.

  - type: explain
    title: What is an indicator?
    body: |
      An **indicator** is a **weak acid** (or weak base) where the **acid form (HIn)** and **conjugate base form (In⁻)** have **different colours**.

      $$\text{HIn(aq)} \rightleftharpoons \text{H}^+(\text{aq}) + \text{In}^-(\text{aq})$$
      Colour A        Colour B

      - In acid: equilibrium shifts left → Colour A dominates
      - In alkali: equilibrium shifts right → Colour B dominates
      - The **transition range** is where both colours are visible (roughly pKa ± 1)

  - type: definition
    term: Indicator transition range
    body: |
      The pH range over which an indicator changes colour, typically pKa ± 1. The **end point** is the pH at which the colour change is observed (usually the midpoint of the range).

  - type: explain
    title: Common indicators and their ranges
    body: |
      | Indicator | pH Range | Acid Colour | Alkaline Colour | pKa (approx) |
      |-----------|----------|-------------|-----------------|--------------|
      | Methyl orange | 3.1 – 4.4 | Red | Yellow | 3.7 |
      | Bromothymol blue | 6.0 – 7.6 | Yellow | Blue | 7.0 |
      | Phenolphthalein | 8.2 – 10.0 | Colourless | Pink/Fuchsia | 9.3 |
      | Thymolphthalein | 9.3 – 10.5 | Colourless | Blue | 9.9 |
      | Litmus | 5.0 – 8.0 | Red | Blue | 6.5 |

      **Methyl orange**: good for strong acid + weak base (equivalence pH ~4–6).
      **Phenolphthalein**: good for weak acid + strong base (equivalence pH ~8–10).
      **Bromothymol blue**: good for strong acid + strong base (equivalence pH = 7).

  - type: check
    title: Indicator ranges
    questions: [indicator-range-1, indicator-range-2]

  - type: explain
    title: How to choose — the golden rule
    body: |
      **The indicator's transition range must fall WITHIN the vertical jump of the titration curve.**

      - If the indicator changes colour **before** the jump → endpoint ≠ equivalence point → systematic error.
      - If the indicator changes colour **after** the jump → same problem.
      - The vertical jump is steep, so a range of indicators often works — but pick one centred in the jump.

  - type: example
    title: Selecting indicators for each titration
    problem: |
      Choose a suitable indicator for:
      1. HCl + NaOH (strong acid + strong base)
      2. CH₃COOH + NaOH (weak acid + strong base)
      3. HCl + NH₃ (strong acid + weak base)
    steps:
      - "1. Strong–strong: vertical jump ~pH 3–11. Equivalence = 7. Bromothymol blue (6.0–7.6) or phenolphthalein (8.2–10) both work. Methyl orange (3.1–4.4) also works but less ideal."
      - "2. Weak acid + strong base: vertical jump ~pH 7–10. Equivalence ~8.7. **Phenolphthalein (8.2–10)** is perfect. Methyl orange (3.1–4.4) changes WAY too early — wrong!"
      - "3. Strong acid + weak base: vertical jump ~pH 4–7. Equivalence ~5.3. **Methyl orange (3.1–4.4)** or bromothymol blue (6.0–7.6) work. Phenolphthalein (8.2–10) changes too late — wrong!"
    answer: |
      1. Bromothymol blue or phenolphthalein. 2. Phenolphthalein. 3. Methyl orange or bromothymol blue.

  - type: check
    title: Choose the indicator
    questions: [choose-indicator-1, choose-indicator-2, choose-indicator-3]

  - type: explain
    title: End point vs equivalence point
    body: |
      - **Equivalence point**: theoretical stoichiometric point (moles acid = moles base).
      - **End point**: experimental point where indicator changes colour.
      - **Indicator error**: difference between end point and equivalence point.
      - **Goal**: choose indicator so end point ≈ equivalence point (error < 0.1 mL titrant).

      For strong–strong, the jump is so huge that almost any indicator works.
      For weak–strong or strong–weak, the choice is critical.

  - type: misconceptions
    items:
      - wrong: "Phenolphthalein works for all titrations."
        right: "Phenolphthalein (8.2–10) fails for strong acid + weak base (equivalence ~5). It changes colour AFTER equivalence."
      - wrong: "Methyl orange works for all titrations."
        right: "Methyl orange (3.1–4.4) fails for weak acid + strong base (equivalence ~9). It changes colour BEFORE equivalence."
      - wrong: "The indicator changes colour exactly at its pKa."
        right: "It changes over a RANGE (pKa ± 1). The 'end point' is usually taken as the midpoint."
      - wrong: "Universal indicator is best for titrations."
        right: "Universal indicator changes gradually over a wide range — useless for detecting a sharp equivalence point. Use a single-range indicator."

  - type: takeaways
    items:
      - "Indicators are weak acids with different coloured acid/conjugate base forms."
      - "Transition range ≈ pKa ± 1."
      - "Choose indicator whose range falls INSIDE the vertical jump."
      - "Strong–strong: almost any indicator works (bromothymol blue, phenolphthalein, methyl orange)."
      - "Weak acid + strong base: use phenolphthalein (pH 8.2–10)."
      - "Strong acid + weak base: use methyl orange (pH 3.1–4.4) or bromothymol blue."
      - "End point should match equivalence point — wrong indicator = titration error."

questions:
  - id: indicator-range-1
    format: mcq
    difficulty: 1
    objectives: ["7.2.10"]
    prompt: |
      Phenolphthalein changes from colourless to pink over the pH range 8.2–10.0. What is its approximate pKa?
    options:
      - text: "8.2"
        why: "That's the start of the range."
      - text: "9.1"
        correct: true
        why: "pKa is approximately the midpoint of the transition range: (8.2 + 10.0)/2 = 9.1."
      - text: "10.0"
        why: "That's the end of the range."
      - text: "7.0"
        why: "That's neutral; phenolphthalein is colourless at pH 7."
    explanation: |
      Indicator pKa ≈ midpoint of transition range. For phenolphthalein: (8.2 + 10.0)/2 ≈ 9.1.

  - id: indicator-range-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.10"]
    prompt: |
      Which indicator would be **unsuitable** for a titration of 0.1 M HCl with 0.1 M NaOH?
    options:
      - text: "Methyl orange (3.1–4.4)"
        why: "Works — range falls within the large jump (pH 3–11)."
      - text: "Bromothymol blue (6.0–7.6)"
        why: "Works — centred on equivalence pH 7."
      - text: "Phenolphthalein (8.2–10.0)"
        why: "Works — range falls within the large jump."
      - text: "None of the above — all are suitable"
        correct: true
        why: "Strong acid + strong base has a huge vertical jump (pH ~3–11). All three indicators' ranges fall within it."
    explanation: |
      Strong acid + strong base has a very large vertical jump. All common indicators work, though bromothymol blue (centred at pH 7) is theoretically ideal.

  - id: choose-indicator-1
    format: mcq
    difficulty: 2
    objectives: ["7.2.10"]
    prompt: |
      Which indicator is **best** for the titration of CH₃COOH (weak acid) with NaOH (strong base)?
    options:
      - text: "Methyl orange (3.1–4.4)"
        why: "Changes at pH 3–4, but equivalence is at pH ~8.7. Changes far too early."
      - text: "Bromothymol blue (6.0–7.6)"
        why: "Changes at pH 6–7.6, but equivalence is ~8.7. Still too early."
      - text: "Phenolphthalein (8.2–10.0)"
        correct: true
        why: "Range 8.2–10 matches the vertical jump (pH ~7–10) and equivalence point (~8.7)."
      - text: "Litmus (5.0–8.0)"
        why: "Range too low; changes before equivalence."
    explanation: |
      Weak acid + strong base → equivalence pH > 7 (typically 8–9). Phenolphthalein's range (8.2–10) sits perfectly in the vertical jump.

  - id: choose-indicator-2
    format: mcq
    difficulty: 2
    objectives: ["7.2.10"]
    prompt: |
      Which indicator is **best** for the titration of HCl (strong acid) with NH₃ (weak base)?
    options:
      - text: "Phenolphthalein (8.2–10.0)"
        why: "Equivalence is acidic (~5.3). Phenolphthalein changes at 8.2–10 — far too late."
      - text: "Methyl orange (3.1–4.4)"
        correct: true
        why: "Equivalence pH ~5.3. Methyl orange range 3.1–4.4 is within the vertical jump (pH ~4–7)."
      - text: "Thymolphthalein (9.3–10.5)"
        why: "Changes far too late (pH > 9)."
      - text: "Bromothymol blue (6.0–7.6)"
        why: "Could work (range overlaps jump), but methyl orange is better centred."
    explanation: |
      Strong acid + weak base → equivalence pH < 7 (typically 4–6). Methyl orange (3.1–4.4) is ideal.

  - id: choose-indicator-3
    format: mcq
    difficulty: 3
    objectives: ["7.2.10"]
    prompt: |
      A student uses methyl orange (pH range 3.1–4.4) for a titration of CH₃COOH with NaOH. The equivalence point is at pH 8.7. What will happen?
    options:
      - text: "The titre volume will be exactly correct"
        why: "No — the indicator changes colour at pH ~4, long before equivalence at pH 8.7."
      - text: "The titre volume will be **less** than the true equivalence volume"
        correct: true
        why: "Methyl orange changes at pH ~4. The student stops adding NaOH early, so volume used is less than the true equivalence volume."
      - text: "The titre volume will be **greater** than the true equivalence volume"
        why: "That would happen if the indicator changed AFTER equivalence (e.g. phenolphthalein for strong acid + weak base)."
      - text: "No colour change will occur"
        why: "Methyl orange will change colour — just at the wrong pH."
    explanation: |
      Methyl orange changes at pH 3.1–4.4. The titration doesn't reach equivalence until pH 8.7. The student stops early → titre volume too small → calculated concentration of acid too high.