id: covalent-bonding-shared-pairs
subject: "9701"
topic: "3.4"
title: "Covalent bonds: sharing a pair of electrons"
summary: A covalent bond is the attraction between two nuclei and a shared pair of electrons; see it in H₂, Cl₂, HCl, CH₄, NH₃ and C₂H₆.
order: 1
minutes: 5
objectives: ["3.4.1"]
prerequisites: [electronegativity-bonding-ionic-or-covalent, atoms-electronic-configurations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 1: the definition and part (a), single
    bonds in H₂, Cl₂, HCl, CH₄, NH₃ and C₂H₆). All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can define a covalent bond and describe the bonding in $\text{H}_2$, $\text{Cl}_2$, $\text{HCl}$, $\text{CH}_4$, $\text{NH}_3$ and $\text{C}_2\text{H}_6$, counting shared pairs and lone pairs.

  - type: explain
    title: When nobody will give up an electron
    body: |
      Two chlorine atoms each want **one more** electron. Neither is going to hand one over: they attract electrons equally strongly.

      So they compromise. Each puts one electron into a **shared pair** that sits between them, and both get to count it.

  - type: definition
    term: Covalent bond
    body: |
      The **electrostatic attraction** between the **nuclei of two atoms** and a **shared pair of electrons**.

  - type: intuition
    title: Two magnets, one ball bearing
    body: |
      Put a steel ball between two magnets. Each magnet pulls on the ball, so the ball holds the magnets together.

      The two positive nuclei are the magnets and the shared pair is the ball. Where it breaks down: electrons aren't a tiny ball parked in one spot. The pair is a cloud of negative charge concentrated **between** the nuclei.

  - type: explain
    title: "The simplest case: H₂"
    body: |
      Each hydrogen atom has **one** electron. Its first shell is full with **two**.

      Share one pair and each H atom now has 2 electrons in its shell, like helium. That one shared pair is a **single covalent bond**, drawn as a line: $\text{H}{-}\text{H}$.

  - type: check
    title: Quick check
    questions: [define-covalent, what-holds-h2]

  - type: explain
    title: How many bonds does each atom make?
    body: |
      Most atoms share until they have **8** outer electrons (H stops at **2**). So the number of bonds = electrons still needed:

      | atom | outer electrons | needs | bonds it forms |
      | --- | --- | --- | --- |
      | H | 1 | 1 | 1 |
      | Cl | 7 | 1 | 1 |
      | N | 5 | 3 | 3 |
      | C | 4 | 4 | 4 |

      Outer electrons that aren't shared pair up as **lone pairs** (non-bonding pairs).

  - type: diagram
    diagram: chem-covalent-bonding-single-bonds
    alt: "Dot-and-cross diagrams with outer shells drawn as circles. Shared pairs sit where two circles overlap. Top row: H2 with one shared pair; Cl2 with one shared pair and three lone pairs on each Cl; HCl with one shared pair and three lone pairs on Cl. Bottom row: CH4, carbon with four hydrogens and four shared pairs; NH3, nitrogen with three hydrogens, three shared pairs and one lone pair on top; C2H6, two carbons sharing one pair, each bonded to three hydrogens, seven shared pairs in total. Crosses are electrons from C, N or the right-hand atom, dots from H or the left-hand atom."
    caption: |
      Count around any C, N or Cl: always 8 electrons. Count around any H: always 2.

  - type: example
    title: Drawing ammonia, NH₃
    problem: |
      Work out the bonding in $\text{NH}_3$ and describe its dot-and-cross diagram.
    steps:
      - |
        N has **5** outer electrons; each H has **1**.
      - |
        N needs 3 more to reach 8, so it shares one pair with each of **3** H atoms: 3 single bonds.
      - |
        N has used 3 of its 5 electrons in bonds. The other **2** form **1 lone pair**.
      - |
        Check: around N, 3 shared pairs + 1 lone pair = 8 electrons. Around each H, 1 shared pair = 2 electrons.
    answer: |
      Three N–H single bonds and one lone pair on N.

  - type: explain
    title: The full line-up
    body: |
      | molecule | shared pairs | lone pairs |
      | --- | --- | --- |
      | $\text{H}_2$ | 1 | 0 |
      | $\text{Cl}_2$ | 1 | 6 (3 on each Cl) |
      | $\text{HCl}$ | 1 | 3 (all on Cl) |
      | $\text{CH}_4$ | 4 | 0 |
      | $\text{NH}_3$ | 3 | 1 (on N) |
      | $\text{C}_2\text{H}_6$ | 7 (one C–C, six C–H) | 0 |

  - type: check
    title: Count the pairs
    questions: [ammonia-pairs, ethane-shared-electrons, most-lone-pairs]

  - type: misconceptions
    items:
      - wrong: "A covalent bond is the attraction between two atoms."
        right: "It's the attraction between the two **nuclei** and the **shared pair** between them. Name both."
      - wrong: "In $\\text{Cl}_2$ each chlorine owns 8 electrons."
        right: "Each Cl has 7 of its own. It reaches 8 by **counting the shared pair**, which belongs to both atoms."
      - wrong: "Covalent bonds are weak, because simple molecular substances melt easily."
        right: "The covalent bonds are strong. Simple molecular substances melt easily because the forces **between** molecules are weak."
      - wrong: "Lone pairs don't matter because they aren't in a bond."
        right: "They count towards the 8 electrons, and later they decide a molecule's shape."

  - type: exam
    body: |
      - Definition must-haves: **electrostatic attraction**, **nuclei**, **shared pair of electrons**.
      - In dot-and-cross diagrams, use dots for one atom's electrons and crosses for the other's, show **outer shells only** unless asked, and don't forget the **lone pairs**.
      - Quick self-check: every C, N, O or halogen atom should end with 8 outer electrons, every H with 2.

  - type: takeaways
    items:
      - "Covalent bond: electrostatic attraction between the nuclei of two atoms and a shared pair of electrons."
      - "Each single bond is one shared pair, usually one electron from each atom."
      - "Atoms share until they have 8 outer electrons (H: 2). Bonds formed = electrons needed."
      - "Unshared outer electrons sit in lone pairs: 1 on N in NH₃, 3 on Cl in HCl."

  - type: check
    title: Spot the slip
    questions: [hcl-error, hydrazine-pairs]

questions:
  - id: define-covalent
    format: text
    style: definition
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      Define a **covalent bond**.
    accept:
      - "the electrostatic attraction between the nuclei of two atoms and a shared pair of electrons"
      - "electrostatic attraction between the nuclei of two atoms and a shared pair of electrons"
      - "the electrostatic attraction between the nuclei of two atoms and the shared pair of electrons"
      - "the electrostatic attraction between a shared pair of electrons and the nuclei of two atoms"
      - "the electrostatic attraction between the nuclei of the two atoms and a shared pair of electrons"
      - "the electrostatic attraction between two nuclei and a shared pair of electrons"
      - "the electrostatic attraction between the nuclei of two atoms and a pair of shared electrons"
      - "the electrostatic attraction between the nuclei of two atoms and a shared electron pair"
      - "the electrostatic attraction between the nuclei of two bonded atoms and a shared pair of electrons"
      - "the electrostatic attraction between a shared pair of electrons and the nuclei of the two bonded atoms"
      - "the electrostatic attraction between the nuclei of the bonded atoms and a shared pair of electrons"
    model: |
      The electrostatic attraction between the nuclei of two atoms and a shared pair of electrons.
    explanation: |
      Check yours for: electrostatic attraction, the two nuclei, and a shared pair of electrons. "Sharing electrons" alone doesn't say what the attraction is between.

  - id: what-holds-h2
    format: mcq
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      What holds the two atoms together in a hydrogen molecule, $\text{H}_2$?
    options:
      - text: The attraction between the two nuclei
        why: |
          Two nuclei are both positive, so they **repel** each other. Something negative has to sit between them.
      - text: The attraction between an $\text{H}^{+}$ ion and an $\text{H}^{-}$ ion
        why: |
          That would be ionic bonding. Two identical H atoms attract electrons equally, so neither gains or loses an electron.
      - text: The attraction of both nuclei for a shared pair of electrons
        correct: true
        why: |
          The shared pair sits between the nuclei and both are attracted to it: that's the covalent bond.
      - text: Intermolecular forces between the two atoms
        why: |
          Intermolecular forces act **between** molecules. Inside $\text{H}_2$ it's a covalent bond.
    explanation: |
      A covalent bond is the electrostatic attraction between two nuclei and the shared pair of electrons between them.

  - id: ammonia-pairs
    format: numeric
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      In a molecule of ammonia, $\text{NH}_3$, how many **bonding pairs** and how many **lone pairs** are there around the nitrogen atom?
    fields:
      - label: "bonding pairs ="
        answer: 3
      - label: "lone pairs ="
        answer: 1
    explanation: |
      N has 5 outer electrons. Three are used in N–H bonds (3 bonding pairs); the remaining 2 form 1 lone pair. Total around N: 8.

  - id: ethane-shared-electrons
    format: numeric
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      How many electrons **in total** are shared in covalent bonds in one molecule of ethane, $\text{C}_2\text{H}_6$?
    fields:
      - answer: 14
        unit: electrons
    explanation: |
      Ethane has one C–C bond and six C–H bonds: 7 shared pairs. Each pair is 2 electrons, so 7 × 2 = 14.

  - id: most-lone-pairs
    format: mcq
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      Which molecule has the **most lone pairs** in total?
    options:
      - text: |
          $\text{CH}_4$
        why: |
          Carbon uses all 4 outer electrons in bonds, and H atoms never have lone pairs: 0 lone pairs.
      - text: |
          $\text{NH}_3$
        why: |
          Just one lone pair, on N.
      - text: |
          $\text{HCl}$
        why: |
          Three lone pairs on Cl. Close, but there's a molecule with two chlorine atoms.
      - text: |
          $\text{Cl}_2$
        correct: true
        why: |
          Each Cl has 3 lone pairs, so the molecule has 6.
    explanation: |
      A Cl atom has 7 outer electrons; 1 goes into the bond, the other 6 make 3 lone pairs. $\text{Cl}_2$ has two Cl atoms, so 6 lone pairs.

  - id: hydrazine-pairs
    format: numeric
    difficulty: 3
    objectives: ["3.4.1"]
    prompt: |
      Hydrazine, $\text{N}_2\text{H}_4$, has the structure $\text{H}_2\text{N}{-}\text{NH}_2$ with only single bonds. In one molecule, how many **shared pairs** and how many **lone pairs** are there in total?
    fields:
      - label: "shared pairs ="
        answer: 5
      - label: "lone pairs ="
        answer: 2
    explanation: |
      Bonds: one N–N and four N–H = 5 shared pairs. Each N uses 3 of its 5 outer electrons in bonds, leaving 2 = 1 lone pair per N, so 2 lone pairs in total. Check: each N has 3 shared pairs + 1 lone pair = 8 electrons.

  - id: hcl-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      A student describes the dot-and-cross diagram of hydrogen chloride. Which line contains the first error?
    lines:
      - "H has 1 outer electron and Cl has 7."
      - "They share one pair: one electron comes from each atom."
      - "After sharing, H has 2 electrons in its outer shell."
      - "Cl has 8 electrons in its outer shell, made up of 4 lone pairs."
      - "So HCl has a single covalent bond."
    errorLine: 4
    fix: |
      Cl's 8 outer electrons are 1 shared pair plus 3 lone pairs (its other 6 electrons).
    explanation: |
      The shared pair counts towards Cl's 8, so only 6 electrons are left as lone pairs: 3 lone pairs, not 4.
