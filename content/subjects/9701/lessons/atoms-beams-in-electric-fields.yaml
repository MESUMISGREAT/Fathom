id: atoms-beams-in-electric-fields
subject: "9701"
topic: "1.1"
title: Particle beams in an electric field
summary: How beams of protons, neutrons and electrons at the same velocity are deflected between charged plates, and why the electron beam bends most.
order: 2
minutes: 4
objectives: ["1.1.5", "1.1.2"]
prerequisites: [atoms-particles-in-the-atom]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.1, learning outcome 5). Deflection proportional to
    charge/mass for equal velocities follows from a = qE/m; proton/electron mass ratio
    1836. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe what happens to beams of protons, neutrons and electrons, all at the same velocity, as they pass through an electric field, and explain it using charge and mass.

  - type: explain
    title: What you'd see
    body: |
      Fire the three beams, all at the **same velocity**, between two oppositely charged plates:

      - **Protons** (+1) are attracted to the **negative** plate: a small deflection.
      - **Electrons** (−1) are attracted to the **positive** plate: the opposite direction, and a **much bigger** deflection.
      - **Neutrons** (0) feel no force and go **straight through**.

  - type: diagram
    diagram: chem-beams-electric-field
    alt: "Three beams leave a source at the same velocity and pass between a positive plate (top) and a negative plate (bottom). The electron beam curves strongly upwards towards the positive plate, the proton beam curves gently downwards towards the negative plate, and the neutron beam carries straight on. A note says the drawing is not to scale: the real electron deflection is about 1840 times the proton's."
    caption: |
      Inside the plates each charged beam curves; after the plates it carries on in a straight line.

  - type: check
    title: Quick check
    questions: [beam-behaviour]

  - type: intuition
    title: Same push, very different swerve
    body: |
      A proton and an electron have charges of the **same size**, so the field pushes on them equally hard (just in opposite directions).

      But the sideways acceleration is force ÷ mass. The electron has 1/1836 of the proton's mass, so the same push gives it about **1836 times** the sideways acceleration.

      Think of the same gust of wind hitting a ping-pong ball and a bowling ball. Where the analogy breaks: wind pushes both the same way, whereas the sign of the charge decides the direction here.

  - type: explain
    title: The rule
    body: |
      At the same velocity, the deflection is proportional to **charge ÷ mass**. The **sign** of the charge sets the direction.

      | particle | charge ÷ mass (relative) | deflection |
      | --- | --- | --- |
      | proton | +1 ÷ 1 = +1 | small, towards − plate |
      | electron | −1 ÷ (1/1836) = −1836 | large, towards + plate |
      | neutron | 0 ÷ 1 = 0 | none |

  - type: check
    title: Why does it happen?
    questions: [beam-cloze, beam-explain]

  - type: example
    title: Same rule, other particles
    problem: |
      Beams of ${}^{1}\text{H}^{+}$, ${}^{2}\text{H}^{+}$ and ${}^{4}\text{He}^{2+}$ ions pass through the same field at the same velocity. The ${}^{1}\text{H}^{+}$ beam is deflected through a small angle of 6°. Predict the other two deflections.
    steps:
      - |
        All three are positive, so all bend towards the **negative** plate.
      - |
        Work out charge ÷ mass for each: ${}^{1}\text{H}^{+}$ is 1 ÷ 1 = 1; ${}^{2}\text{H}^{+}$ is 1 ÷ 2 = 0.5; ${}^{4}\text{He}^{2+}$ is 2 ÷ 4 = 0.5.
      - |
        For small angles, the deflection is proportional to charge ÷ mass. Both ${}^{2}\text{H}^{+}$ and ${}^{4}\text{He}^{2+}$ have half the value for ${}^{1}\text{H}^{+}$.
      - |
        So each is deflected through about 6° × 0.5 = 3°.
    answer: |
      ${}^{2}\text{H}^{+}$ and ${}^{4}\text{He}^{2+}$ are both deflected about 3° towards the negative plate: twice the charge exactly makes up for four times the mass.

  - type: check
    title: Apply it
    questions: [lithium-angle, which-beam]

  - type: misconceptions
    items:
      - wrong: "Electrons are deflected more because they have a bigger charge."
        right: "The charges are the same size (+1 and −1). The electron bends more because its mass is so small."
      - wrong: "Neutrons are deflected a tiny bit because they are so heavy."
        right: "Neutrons have no charge, so there is no force on them at all: zero deflection."
      - wrong: "Protons bend towards the positive plate."
        right: "Like charges repel: protons are pushed away from the positive plate, towards the negative one."

  - type: exam
    body: |
      - "Describe" questions want **both** the direction and the relative size of each deflection; "explain" wants the reasons (sign of charge; mass).
      - Use the word **deflected**, and name the plate each beam moves towards.
      - You may be asked to sketch the paths on a diagram: electrons curve the opposite way to protons and much more sharply; neutrons are a straight line.

  - type: takeaways
    items:
      - "Protons bend slightly towards the negative plate; electrons bend strongly towards the positive plate; neutrons go straight on."
      - "Direction comes from the sign of the charge; size of deflection is proportional to charge ÷ mass (at the same velocity)."
      - "The electron's tiny mass (1/1836) is why it is deflected so much more."

questions:
  - id: beam-behaviour
    format: mcq
    difficulty: 1
    objectives: ["1.1.5"]
    prompt: |
      Beams of protons, neutrons and electrons, all moving at the same velocity, pass between two charged plates. Which describes what happens?
    options:
      - text: |
          Protons are deflected more than electrons, because protons are heavier.
        why: |
          Being heavier makes a particle harder to deflect, not easier.
      - text: |
          Electrons and protons are deflected by the same amount in opposite directions, because their charges are equal and opposite.
        why: |
          The forces are equal in size, but the electron's mass is 1/1836 of the proton's, so it is deflected far more.
      - text: |
          All three beams bend towards the negative plate, the neutrons least.
        why: |
          Neutrons have no charge, so they aren't deflected, and electrons are attracted to the positive plate.
      - text: |
          Electrons are deflected towards the positive plate, by much more than protons are deflected towards the negative plate; neutrons are not deflected.
        correct: true
        why: |
          Opposite charges give opposite directions, and the electron's tiny mass gives it a far larger deflection.
    explanation: |
      Direction depends on the sign of the charge; size depends on charge ÷ mass. Neutrons, with no charge, go straight through.

  - id: beam-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.1.5", "1.1.2"]
    prompt: |
      A neutron beam is not deflected because neutrons have no {{1}}. An electron beam is deflected much more than a proton beam because an electron's {{2}} is only about 1/1836 of a proton's.
    blanks:
      - accept: ["charge", "electric charge", "electrical charge", "overall charge"]
      - accept: ["mass", "relative mass"]
    explanation: |
      No charge means no force from the field. The same-sized force on a much smaller mass gives a much larger sideways acceleration.

  - id: beam-explain
    format: explain
    difficulty: 2
    objectives: ["1.1.5", "1.1.2"]
    prompt: |
      Explain why, in the same electric field and at the same velocity, an electron beam is deflected in the opposite direction to a proton beam and by a much larger amount.
    model: |
      The electron has charge −1 and the proton +1, so the forces on them are in opposite directions: electrons are attracted to the positive plate and protons to the negative plate. The charges are the same size, so the forces are the same size, but the electron's mass is only about 1/1836 of the proton's. The same force on a much smaller mass gives a much bigger sideways acceleration, so the electron beam is deflected far more (deflection is proportional to charge ÷ mass).
    keyPoints:
      - "Opposite charges (−1 and +1), so the forces act in opposite directions"
      - "Electrons move towards the positive plate, protons towards the negative plate"
      - "The charges are the same size, so the forces are the same size"
      - "The electron's mass is about 1/1836 of the proton's, so it is deflected much more (deflection ∝ charge ÷ mass)"
    explanation: |
      Two separate ideas: the sign of the charge decides the direction, and charge ÷ mass decides how far.

  - id: lithium-angle
    format: numeric
    difficulty: 3
    objectives: ["1.1.5"]
    prompt: |
      In a particular field, a proton beam is deflected through a small angle of 0.60°. Through what angle would a beam of ${}^{7}\text{Li}^{3+}$ ions moving at the same velocity be deflected? Give your answer to 2 significant figures.
    fields:
      - answer: 0.26
        sigFigs: 2
        unit: "°"
    explanation: |
      Charge ÷ mass for ${}^{7}\text{Li}^{3+}$ is 3 ÷ 7 = 0.429, compared with 1 for a proton. Angle ≈ 0.60° × 3/7 = 0.257°, which is 0.26° to 2 s.f. (towards the negative plate).

  - id: which-beam
    format: mcq
    difficulty: 2
    objectives: ["1.1.5"]
    prompt: |
      A beam of particles at the same velocity as a proton beam is deflected towards the **negative** plate, but by **less** than the protons. Which particles could they be?
    options:
      - text: |
          ${}^{2}\text{H}^{+}$ ions
        correct: true
        why: |
          Positive (so towards the negative plate) with charge ÷ mass = 1/2, half the proton's value.
      - text: |
          electrons
        why: |
          Electrons are negative, so they move towards the positive plate, and much more than protons.
      - text: |
          neutrons
        why: |
          Neutrons aren't deflected at all.
      - text: |
          ${}^{1}\text{H}^{-}$ ions
        why: |
          A negative ion would move towards the positive plate.
    explanation: |
      Towards the negative plate means positively charged; less deflection than protons means a smaller charge ÷ mass than 1.
