id: kinetics-catalysis-mechanism
subject: "9701"
topic: "8.3"
title: "What a catalyst really does"
summary: "A catalyst speeds a reaction by providing a different mechanism with a lower activation energy, without being used up and without changing ΔH."
order: 1
minutes: 6
kind: core
objectives: ["8.3.1"]
prerequisites: ["rate-reaction-temperature"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the Cambridge International AS & A Level Chemistry 9701 syllabus, topic 8.3
    Homogeneous and heterogeneous catalysts, learning outcome 8.3.1 (a): a catalyst provides a
    different mechanism of lower activation energy. All examples and questions are original.
