blocks:
  - type: objective
    body: |
      By the end you can explain that a catalyst changes the **mechanism** of a reaction to one
      with a **lower activation energy**, state that it is not used up, and explain why it does not
      change the enthalpy change of the reaction.

  - type: explain
    title: The same journey, a lower pass
    body: |
      Two towns on opposite sides of a mountain range. The only road goes over a high pass, and only
      the strongest walkers make it. Build a tunnel under the range and thousands more can cross —
      same two towns, same start and finish, much lower barrier.

      A catalyst is the tunnel. It does not push the reactants uphill or give them extra energy. It
      offers a **different route** — a different mechanism — whose highest point is lower.

      Because more collisions now have enough energy to get over that lower barrier, the reaction is
      faster. The reactants and products are unchanged, so the energy difference between them,
      $\Delta H$, is exactly what it was.

  - type: definition
    term: Catalyst
    body: |
      A **catalyst** is a substance that increases the rate of a reaction by providing an
      alternative pathway (mechanism) of **lower activation energy**, and is not used up in the
      overall reaction.

      **Catalysis** is the process of speeding up a reaction in this way. The catalyst may take part
      in the steps of the mechanism — it is used and then regenerated — but it does not appear in
      the overall equation.

  - type: explain
    title: Same products, same ΔH
    body: |
      Enthalpy change depends only on the **reactants** and the **products**, not on the route
      between them. The catalysed and uncatalysed reactions start at the same energy level and end
      at the same energy level, so

      $$\Delta H_{\text{catalysed}} = \Delta H_{\text{uncatalysed}}.$$

      A catalyst cannot make a reaction more exothermic, and it cannot make an impossible reaction
      happen: if the products are at a higher energy than the reactants, the catalysed reaction is
      still endothermic.

      Nor does a catalyst change the **position of equilibrium**. It lowers the barrier for the
      forward and the reverse reaction by the same amount, so both speeds increase and the balance
      point is unchanged — it is simply reached sooner.

  - type: example
    title: A catalytic converter
    problem: |
      In a car's catalytic converter, carbon monoxide and nitrogen monoxide react on a
      platinum–rhodium surface:

      $$2\text{CO} + 2\text{NO} \rightarrow 2\text{CO}_2 + \text{N}_2.$$

      Without the metal, the gases can sit mixed for years. Explain, in terms of activation energy,
      why the converter works and why it does not change $\Delta H$.
    steps:
      - |
        The gases are stable together because the reaction has a very high activation energy: almost
        no collisions at exhaust temperature have enough energy to break the bonds needed.
      - |
        The metal surface lets the gases adsorb and react through a **different mechanism**, whose
        activation energy is much lower.
      - |
        A much larger fraction of collisions now has $E \geq E_a$, so the reaction is fast enough to
        clean the exhaust.
      - |
        The reactants and products are the same as before, so the energy released per mole of CO
        reacted is unchanged. Only the route is different.
    answer: |
      The catalyst provides a lower-activation-energy mechanism; $\Delta H$ depends on reactants and
      products only, so it is unchanged.

  - type: misconceptions
    items:
      - wrong: "A catalyst gives the reactant molecules more energy."
        right: >-
          It does not add energy. It lowers the energy barrier they have to clear, so the same
          molecules are now able to react.
      - wrong: "A catalyst makes the reaction more exothermic."
        right: >-
          $\Delta H$ is fixed by the reactants and products. A catalyst changes the route, not the
          start and finish.
      - wrong: "A catalyst is used up, which is why you need more of it for more product."
        right: >-
          It is regenerated at the end of the mechanism. It can be poisoned or physically lost, but
          it is not consumed stoichiometrically.
      - wrong: "A catalyst increases the yield of an equilibrium reaction."
        right: >-
          It speeds up the forward and reverse reactions equally, so equilibrium is reached sooner
          but the position of equilibrium, and therefore the yield, is unchanged.
      - wrong: "A catalyst appears in the overall equation."
        right: >-
          It may appear in the steps of the mechanism, but it is not written in the overall
          equation because it is reformed.

  - type: exam
    body: |
      The mark scheme wants a **mechanism** statement, not just "speeds up the reaction". Write:
      "provides an alternative pathway/mechanism with lower activation energy".

      When asked why $\Delta H$ is unchanged, say that $\Delta H$ depends only on the reactants and
      products (or: the initial and final energy levels are the same).

      When asked why a catalyst does not change the equilibrium yield, say that it lowers the
      activation energy of the forward and reverse reactions by the same amount, so both rates
      increase equally.

  - type: check
    title: Check yourself
    questions: [what-a-catalyst-does, catalyst-definition]

  - type: check
    title: Energy and equations
    questions: [delta-h-unchanged, catalyst-energy-error]

  - type: check
    title: Going further
    questions: [catalyst-and-equilibrium, catalyst-not-consumed]

  - type: takeaways
    items:
      - "A catalyst provides an alternative mechanism with a lower activation energy."
      - "It is not used up in the overall reaction, so it is not written in the overall equation."
      - "It does not change ΔH, because the reactants and products are unchanged."
      - "It speeds up the forward and reverse reactions equally, so the equilibrium yield is unchanged."

questions:
  - id: what-a-catalyst-does
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Why does adding a catalyst increase the rate of a reaction?
    options:
      - text: |
          It provides an alternative mechanism with a lower activation energy.
        correct: true
        why: |
          This is the definition: a different route whose highest energy point is lower, so more
          collisions have enough energy to react.
      - text: |
          It increases the average kinetic energy of the reacting molecules.
        why: |
          That is what heating does. A catalyst does not add energy to the molecules.
      - text: |
          It increases the frequency of collisions by raising the concentration.
        why: |
          The catalyst is not a reactant, so it does not increase the concentration of the reactants.
      - text: |
          It makes the reaction release more energy, so it goes faster.
        why: |
          The energy released ($\Delta H$) is unchanged; a catalyst affects the route, not the
          start and finish.
    explanation: |
      A catalyst changes the mechanism, and the new mechanism has a lower activation energy. More
      molecules in the Boltzmann distribution then have $E \geq E_a$, so the rate increases.

  - id: catalyst-definition
    format: cloze
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Complete the definition.

      A catalyst is a substance that increases the rate of a reaction by providing an alternative
      {{1}} with a lower {{2}}, and is not {{3}} in the overall reaction.
    blanks:
      - accept: ["mechanism", "pathway", "route"]
      - accept: ["activation energy", "Ea", "activation energy (Ea)"]
      - accept: ["used up", "consumed", "used"]
    explanation: |
      "Alternative mechanism (pathway) of lower activation energy" and "not used up" are the two
      marks the examiner is looking for.

  - id: delta-h-unchanged
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      A reaction is carried out with and without a catalyst. Which quantity is the **same** in both
      cases?
    options:
      - text: |
          The enthalpy change, $\Delta H$
        correct: true
        why: |
          $\Delta H$ depends only on the reactants and the products, which are identical in both
          cases.
      - text: |
          The activation energy, $E_a$
        why: |
          Lowering $E_a$ is exactly what the catalyst does, so this changes.
      - text: |
          The rate of reaction
        why: |
          The catalysed reaction is faster; that is the point of using a catalyst.
      - text: |
          The mechanism
        why: |
          The catalyst works by changing the mechanism.
    explanation: |
      The catalysed and uncatalysed routes start and finish at the same energy levels. Only the
      height of the barrier between them differs.

  - id: catalyst-energy-error
    format: spot-error
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      A student explains how a catalyst works. One line is wrong.
    lines:
      - |
        A catalyst speeds up a reaction by lowering the activation energy.
      - |
        It does this by giving the reacting molecules extra kinetic energy, so they collide harder.
      - |
        The enthalpy change is unchanged because the reactants and products are the same.
    errorLine: 2
    fix: |
      A catalyst does not give the molecules extra energy. It provides an alternative mechanism
      whose activation energy is lower.
    explanation: |
      Adding energy is what heating does, and heating changes the Boltzmann distribution. A catalyst
      leaves the distribution alone and lowers the threshold instead.

  - id: catalyst-and-equilibrium
    format: explain
    difficulty: 3
    objectives: ["8.3.1"]
    prompt: |
      The Haber process is exothermic and reversible:

      $$\text{N}_2(\text{g}) + 3\text{H}_2(\text{g}) \rightleftharpoons 2\text{NH}_3(\text{g}).$$

      Explain why using an iron catalyst increases the rate but does not increase the equilibrium
      yield of ammonia.
    model: |
      The catalyst provides an alternative mechanism with a lower activation energy. Both the
      forward reaction (making ammonia) and the reverse reaction (decomposing it) go through this
      same lower barrier, so both rates increase by the same factor. The position of equilibrium
      depends on the energies of reactants and products, which are unchanged, so the equilibrium
      composition is unchanged — it is just reached faster.
    keyPoints:
      - "The catalyst lowers the activation energy by providing a different mechanism."
      - "The forward and reverse reactions share the same catalysed route, so both speeds increase."
      - "The energies of reactants and products are unchanged, so K and the equilibrium yield are unchanged."
      - "Equilibrium is reached sooner, not further towards the products."

  - id: catalyst-not-consumed
    format: mcq
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      A small mass of iron speeds up the Haber process for years. Why is iron not written in the
      overall equation?
    options:
      - text: |
          It is regenerated during the mechanism, so its total amount does not change.
        correct: true
        why: |
          The catalyst is used in one step and reformed in another, so it cancels out of the overall
          equation.
      - text: |
          It is a solid, and solids are never written in equations.
        why: |
          Solids are written in equations all the time, for example carbon in combustion.
      - text: |
          It reacts with nitrogen to form a compound that is not part of the equation.
        why: |
          Any such compound would have to be converted back; if it were not, the iron would be used
          up and would stop working.
      - text: |
          It only changes the rate, so it has no effect on the reaction at all.
        why: |
          It does take part in the steps of the mechanism; it simply returns to its original form.
    explanation: |
      A catalyst is consumed in one step and regenerated in a later step. Over the whole reaction
      its amount is unchanged, so it does not appear in the overall equation.
