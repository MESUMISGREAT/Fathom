id: atoms-electronic-configurations
subject: "9701"
topic: "1.3"
title: Writing electronic configurations
summary: How to write full and shorthand electronic configurations for atoms and ions from H to Kr, including chromium, copper and transition-metal ions.
order: 3
minutes: 5
objectives: ["1.3.4", "1.3.5", "1.3.6"]
prerequisites: [atoms-shells-subshells-orbitals]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.3, learning outcomes 4-6; ground-state atoms and ions H
    to Kr). Follows the syllabus convention of writing Fe as 1s2 2s2 2p6 3s2 3p6 3d6 4s2
    or [Ar] 3d6 4s2. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can write the full and shorthand electronic configuration of any atom or ion from H to Kr (chromium and copper included) and explain the filling order using energy and repulsion.

  - type: explain
    title: Three filling rules
    body: |
      1. **Lowest energy first.** Fill sub-shells in the order 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p. The ground state is the lowest-energy arrangement.
      2. **Two per orbital, maximum**, and a pair must have opposite spins.
      3. **Spread out before pairing.** In a sub-shell, electrons go into separate orbitals before any orbital gets a second electron.

      Rule 3 is about **inter-electron repulsion**: electrons are all negative, so two in the same orbital repel more than two in separate orbitals of the same energy. Spreading out gives a lower total energy.

  - type: explain
    title: Reading and writing the notation
    body: |
      In **2p⁶**, the 2 is the shell, the p is the sub-shell and the ⁶ is the number of electrons in it.

      - **Full:** list every sub-shell from 1s. Sodium: 1s² 2s² 2p⁶ 3s¹.
      - **Shorthand:** replace the inner part with the previous noble gas in square brackets. Sodium: [Ne] 3s¹.

      [He] = 1s², [Ne] = 1s² 2s² 2p⁶, [Ar] = 1s² 2s² 2p⁶ 3s² 3p⁶.

  - type: example
    title: Iron, Z = 26
    problem: |
      Write the full and shorthand electronic configurations of iron, and give the number of electrons in each shell.
    steps:
      - |
        Fill in energy order, keeping a running total: 1s² (2), 2s² (4), 2p⁶ (10), 3s² (12), 3p⁶ (18). That's [Ar].
      - |
        Next is 4s, which is lower than 3d: 4s² (20).
      - |
        The last 6 electrons go into 3d: 3d⁶ (26). Check: 26 electrons for Z = 26.
      - |
        Write it with sub-shells grouped by shell, as the syllabus does: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s², or [Ar] 3d⁶ 4s². (You'll also see …4s² 3d⁶; it's the same configuration.)
      - |
        Shell by shell: n = 1 has 2, n = 2 has 8, n = 3 has 2 + 6 + 6 = 14, n = 4 has 2.
    answer: |
      Fe: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² = [Ar] 3d⁶ 4s²; shells 2, 8, 14, 2.

  - type: check
    title: Quick check
    questions: [calcium-config, sulfur-3p, iron-third-shell]

  - type: explain
    title: The two exceptions, Cr and Cu
    body: |
      | atom | you'd predict | actual ground state |
      | --- | --- | --- |
      | Cr (Z = 24) | [Ar] 3d⁴ 4s² | **[Ar] 3d⁵ 4s¹** |
      | Cu (Z = 29) | [Ar] 3d⁹ 4s² | **[Ar] 3d¹⁰ 4s¹** |

      Why: 3d and 4s are **very close in energy**, so moving one electron from 4s to 3d costs very little.

      - **Cr:** 3d⁵ 4s¹ puts one electron in each of six orbitals, so there is no spin-pair repulsion. A half-filled 3d sub-shell is the lower-energy, more stable arrangement.
      - **Cu:** a completely filled 3d¹⁰ sub-shell is the lower-energy, more stable arrangement.

  - type: check
    title: The exceptions
    questions: [chromium-explain]

  - type: explain
    title: Configurations of ions
    body: |
      Start from the atom, then remove or add electrons.

      - **Negative ions:** add electrons to the next available orbitals. O²⁻: 1s² 2s² 2p⁶. Cl⁻: [Ne] 3s² 3p⁶.
      - **Main-group positive ions:** remove from the highest-energy sub-shell. Na⁺: 1s² 2s² 2p⁶. Al³⁺: 1s² 2s² 2p⁶.
      - **d-block ions (Sc to Zn): 4s electrons are removed before 3d.**

      | ion | from the atom | configuration |
      | --- | --- | --- |
      | Fe²⁺ | [Ar] 3d⁶ 4s² | [Ar] 3d⁶ |
      | Fe³⁺ | [Ar] 3d⁶ 4s² | [Ar] 3d⁵ |
      | Cr³⁺ | [Ar] 3d⁵ 4s¹ | [Ar] 3d³ |
      | Cu²⁺ | [Ar] 3d¹⁰ 4s¹ | [Ar] 3d⁹ |

      Slogan: **4s fills first, and 4s empties first.**

  - type: deeper
    title: Why does 4s empty first if it filled first?
    body: |
      The energy order 4s < 3d is for the empty sub-shells being filled, as in potassium and calcium. Once electrons occupy 3d, the 3d sub-shell drops below 4s in energy, and the 4s electrons are in the outermost shell (n = 4), furthest from the nucleus. So when a d-block element ionises, the 4s electrons are the easiest to remove and go first.

  - type: check
    title: Ions
    questions: [iron-three-plus, manganese-ion, copper-ion-error]

  - type: misconceptions
    items:
      - wrong: "Fe²⁺ is [Ar] 3d⁴ 4s²."
        right: "4s electrons are lost first: Fe²⁺ is [Ar] 3d⁶."
      - wrong: "Chromium is [Ar] 3d⁴ 4s²."
        right: "Cr is [Ar] 3d⁵ 4s¹ and Cu is [Ar] 3d¹⁰ 4s¹. These are the only two exceptions between H and Kr."
      - wrong: "[Ar] in a configuration means the atom contains argon."
        right: "[Ar] is shorthand for 18 inner electrons arranged as 1s² 2s² 2p⁶ 3s² 3p⁶."

  - type: exam
    body: |
      - "Full" configuration means start from 1s; "shorthand" uses a noble-gas core. Do what the question asks.
      - Add up the superscripts: they must equal Z for an atom, or Z minus the charge for an ion.
      - Transition-metal ions are a favourite: remove 4s first, and don't forget Cr and Cu.
      - Write superscripts clearly; "2p6" written on the line is ambiguous.

  - type: takeaways
    items:
      - "Fill 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p; spread out in a sub-shell before pairing, to reduce repulsion."
      - "Fe is 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s², or [Ar] 3d⁶ 4s²."
      - "Exceptions: Cr [Ar] 3d⁵ 4s¹ and Cu [Ar] 3d¹⁰ 4s¹."
      - "d-block ions (Sc to Zn) lose 4s electrons before 3d: Fe³⁺ is [Ar] 3d⁵."

questions:
  - id: calcium-config
    format: mcq
    difficulty: 1
    objectives: ["1.3.6", "1.3.4"]
    prompt: |
      Which is the ground-state electronic configuration of a calcium atom (Z = 20)?
    options:
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁶ 3d²
        why: |
          4s fills before 3d.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁶ 4s²
        correct: true
        why: |
          After 3p⁶ (18 electrons), the next two go into 4s, which is lower in energy than 3d.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁸
        why: |
          A p sub-shell holds at most 6 electrons.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d¹
        why: |
          Right number of electrons, but not the lowest-energy arrangement, so not the ground state.
    explanation: |
      Calcium is [Ar] 4s². The 3d sub-shell starts filling at scandium.

  - id: sulfur-3p
    format: numeric
    difficulty: 1
    objectives: ["1.3.4", "1.3.6"]
    prompt: |
      How many electrons are in the 3p sub-shell of a ground-state sulfur atom (Z = 16)?
    fields:
      - answer: 4
    explanation: |
      S: 1s² 2s² 2p⁶ 3s² 3p⁴. That's 2 + 2 + 6 + 2 = 12 electrons before 3p, leaving 4.

  - id: iron-third-shell
    format: numeric
    difficulty: 2
    objectives: ["1.3.4"]
    prompt: |
      How many electrons are in the **third shell** (n = 3) of a ground-state iron atom (Z = 26)?
    fields:
      - answer: 14
    explanation: |
      The third shell is 3s² 3p⁶ 3d⁶: 2 + 6 + 6 = 14. Don't count the 4s² electrons; they're in the fourth shell.

  - id: chromium-explain
    format: explain
    difficulty: 3
    objectives: ["1.3.5", "1.3.6"]
    prompt: |
      Chromium's ground state is [Ar] 3d⁵ 4s¹, not [Ar] 3d⁴ 4s². Explain why, in terms of energy and inter-electron repulsion.
    model: |
      The 3d and 4s sub-shells are very close in energy, so moving one electron from 4s into 3d costs very little energy. In 3d⁵ 4s¹ each of the six orbitals holds one electron, so there is no spin-pair repulsion, whereas 3d⁴ 4s² has a pair of electrons in 4s. The reduced repulsion (a half-filled 3d sub-shell) makes 3d⁵ 4s¹ the lower-energy, more stable arrangement.
    keyPoints:
      - "3d and 4s sub-shells are very close in energy"
      - "3d⁵ 4s¹ has one electron in each of the six orbitals (all unpaired)"
      - "This avoids spin-pair (inter-electron) repulsion"
      - "So 3d⁵ 4s¹ (half-filled 3d) has the lower energy and is more stable"
    explanation: |
      Small energy gap plus less repulsion means the "unexpected" arrangement is actually the lowest-energy one.

  - id: iron-three-plus
    format: mcq
    difficulty: 2
    objectives: ["1.3.6"]
    prompt: |
      What is the electronic configuration of the Fe³⁺ ion (Fe, Z = 26)?
    options:
      - text: |
          [Ar] 3d³ 4s²
        why: |
          This removes three 3d electrons, but 4s electrons are lost first.
      - text: |
          [Ar] 3d⁶
        why: |
          That's Fe²⁺: only two electrons have been removed.
      - text: |
          [Ar] 3d⁶ 4s²
        why: |
          That's the iron atom, with 26 electrons. Fe³⁺ has 23.
      - text: |
          [Ar] 3d⁵
        correct: true
        why: |
          Fe is [Ar] 3d⁶ 4s². Remove the two 4s electrons first, then one 3d electron.
    explanation: |
      26 − 3 = 23 electrons. Take both 4s electrons, then one from 3d: [Ar] 3d⁵.

  - id: manganese-ion
    format: numeric
    difficulty: 2
    objectives: ["1.3.6", "1.3.4"]
    prompt: |
      How many electrons are in the 3d sub-shell of a Mn²⁺ ion (Mn, Z = 25)?
    fields:
      - answer: 5
    explanation: |
      Mn is [Ar] 3d⁵ 4s². Mn²⁺ loses the two 4s electrons: [Ar] 3d⁵, so 5 electrons in 3d.

  - id: copper-ion-error
    format: spot-error
    difficulty: 2
    objectives: ["1.3.6"]
    prompt: |
      A student writes the configuration of Cu⁺. Which line contains the first error?
    lines:
      - "Copper has Z = 29, so a Cu⁺ ion has 28 electrons."
      - "A copper atom is [Ar] 3d¹⁰ 4s¹."
      - "To form Cu⁺, the electron is removed from the 3d sub-shell."
      - "So Cu⁺ is [Ar] 3d⁹ 4s¹."
    errorLine: 3
    fix: |
      The electron is removed from **4s**, not 3d, so Cu⁺ is [Ar] 3d¹⁰.
    explanation: |
      Lines 1 and 2 are right (including the copper exception). d-block elements lose their 4s electrons first.
