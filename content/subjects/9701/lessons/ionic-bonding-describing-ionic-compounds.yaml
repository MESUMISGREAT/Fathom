id: ionic-bonding-describing-ionic-compounds
subject: "9701"
topic: "3.2"
title: "Describing ionic bonding: NaCl, MgO and CaF₂"
summary: One five-step method to describe the ionic bonding in any simple ionic compound, worked through for magnesium oxide and calcium fluoride.
order: 2
minutes: 5
objectives: ["3.2.2", "3.2.1"]
prerequisites: [ionic-bonding-electrostatic-attraction]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.2, learning outcomes 3.2.2 and 3.2.1: sodium chloride,
    magnesium oxide and calcium fluoride). Ionic radii are Pauling crystal radii (Na⁺ 95 pm,
    Cl⁻ 181 pm, Mg²⁺ 65 pm, O²⁻ 140 pm); melting points NaCl 801 °C and MgO about
    2850 °C. Dot-and-cross diagrams are drawn with outer shells only, as in topic 3.7.
    All questions are original. The ionic radii are also the Cambridge Data Booklet values (Na⁺ 0.095, Cl⁻ 0.181, Mg²⁺ 0.065, O²⁻ 0.140 nm).
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-24. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |
      By the end you can describe the ionic bonding in sodium chloride, magnesium oxide and calcium fluoride: which electrons move, the ions formed, their ratio, and what holds them together.

  - type: explain
    title: What they ask
    body: |
      - "**Describe** the bonding in magnesium oxide."
      - "**Draw** a dot-and-cross diagram for calcium fluoride, showing outer electrons only."
      - "**Explain** why the formula of calcium fluoride is $\text{CaF}_2$."

      Same question in three outfits. One method answers all of them.

  - type: explain
    title: The method
    body: |
      1. Write the electron arrangement of each atom.
      2. Work out how many electrons the metal atom loses, and the non-metal atom gains, to reach a noble-gas arrangement.
      3. **Balance the electrons lost with the electrons gained: this sets the ratio of ions, and so the formula.**
      4. Write each ion with its charge and arrangement. In a diagram: square brackets, the charge at the top right, crosses for the metal's electrons and dots for the non-metal's.
      5. Name the bond: electrostatic attraction between the oppositely charged ions, acting in all directions in a giant lattice.

      You've already met the simplest case, NaCl: one electron lost, one gained, ratio 1 : 1.

  - type: diagram
    diagram: chem-ionic-bonding-magnesium-oxide-calcium-fluoride
    alt: "Dot-and-cross diagrams of ions, outer shells only; crosses are the metal's electrons, dots are the non-metal's. Top, magnesium oxide, MgO: Mg in square brackets with charge 2+ and a full shell of eight crosses, labelled Mg²⁺ 2,8; O in square brackets with charge 2− and eight electrons, six dots and two crosses, labelled O²⁻ 2,8. A note says 2 electrons move, Mg²⁺ to O²⁻ is 1 : 1. Bottom, calcium fluoride, CaF₂: three ions in a row, F⁻, Ca²⁺, F⁻. Each F is in square brackets with charge − and eight electrons, seven dots and one cross, labelled F⁻ 2,8. Ca is in square brackets with charge 2+ and eight crosses, labelled Ca²⁺ 2,8,8. A note says 2 electrons move, one to each F, Ca²⁺ to F⁻ is 1 : 2."
    caption: Look at the anions. O²⁻ holds both of magnesium's electrons (two crosses); each F⁻ holds one of calcium's (one cross each).

  - type: example
    title: Magnesium oxide
    problem: |
      Describe the ionic bonding in magnesium oxide, $\text{MgO}$.
    steps:
      - |
        **Arrangements:** Mg is 2,8,2. O is 2,6.
      - |
        **Lose and gain:** Mg loses 2 electrons → $\text{Mg}^{2+}$ (2,8, like neon). O gains 2 → $\text{O}^{2-}$ (2,8, also like neon).
      - |
        **Balance:** 2 lost = 2 gained, so one Mg for each O. Ratio 1 : 1, formula $\text{MgO}$.
      - |
        **Bond:** strong electrostatic attraction between $\text{Mg}^{2+}$ and $\text{O}^{2-}$ ions, in all directions in a giant lattice.
      - |
        **Check:** the charges cancel, $(+2) + (-2) = 0$, matching the formula $\text{MgO}$.
    answer: |
      Each Mg atom transfers 2 electrons to an O atom, forming $\text{Mg}^{2+}$ and $\text{O}^{2-}$ (both 2,8) in a 1 : 1 ratio. The oppositely charged ions are held in a giant lattice by electrostatic attraction.

  - type: check
    title: Quick check
    questions: [magnesium-electrons, magnesium-oxide-ions]

  - type: example
    title: Calcium fluoride (exam-style)
    problem: |
      Describe the bonding in calcium fluoride, and explain why its formula is $\text{CaF}_2$.
    steps:
      - |
        **Arrangements:** Ca is 2,8,8,2. F is 2,7.
      - |
        **Lose and gain:** Ca loses 2 electrons → $\text{Ca}^{2+}$ (2,8,8, like argon). But each F gains only **1** → $\text{F}^-$ (2,8, like neon).
      - |
        **Balance:** 2 electrons lost, but one F can take only 1. So each Ca needs **two** F atoms: ratio $\text{Ca}^{2+} : \text{F}^- = 1 : 2$. That's why the formula is $\text{CaF}_2$.
      - |
        **Diagram:** one $[\text{Ca}]^{2+}$ and two **separate** $[\text{F}]^-$ ions, each $\text{F}^-$ with seven dots and one cross.
      - |
        **Bond:** electrostatic attraction between the $\text{Ca}^{2+}$ and $\text{F}^-$ ions, in all directions in a giant lattice.
      - |
        **Check:** $(+2) + 2 \times (-1) = 0$. The charges cancel.
    answer: |
      Each Ca atom transfers one electron to each of two F atoms, forming $\text{Ca}^{2+}$ (2,8,8) and two $\text{F}^-$ (2,8). The 1 : 2 ratio gives $\text{CaF}_2$, and the oppositely charged ions are held in a giant lattice by electrostatic attraction.

  - type: check
    title: Exam-style practice
    questions: [calcium-fluoride-cloze, aluminium-fluoride-ratio, calcium-fluoride-error]

  - type: deeper
    title: Which ionic bonding is stronger, NaCl or MgO?
    body: |
      Bigger charges attract more strongly, and so do ions that sit closer together.

      | | NaCl | MgO |
      | --- | --- | --- |
      | ion charges | +1 and −1 | **+2 and −2** |
      | ion radii (Data Booklet) | Na⁺ 95 pm, Cl⁻ 181 pm | Mg²⁺ 65 pm, O²⁻ 140 pm (**smaller**) |
      | melting point | 801 °C | about 2850 °C |

      Double the charges and smaller ions: the ionic bonding in magnesium oxide is much stronger.

  - type: misconceptions
    items:
      - wrong: Calcium fluoride contains $\text{F}_2$ molecules. The formula says so!
        right: It contains two **separate** $\text{F}^-$ ions for every $\text{Ca}^{2+}$. The subscript 2 is a ratio, not a molecule.
      - wrong: Magnesium gives one electron to oxygen, making $\text{Mg}^+$ and $\text{O}^-$.
        right: Two electrons move, making $\text{Mg}^{2+}$ and $\text{O}^{2-}$, so both reach the neon arrangement.
      - wrong: In a dot-and-cross diagram for $\text{CaF}_2$, draw one F with two crosses.
        right: Each $\text{F}^-$ gets exactly one cross. Draw two separate $\text{F}^-$ ions.
      - wrong: The ions in an ionic compound share electrons.
        right: Nothing is shared. The electrons are transferred, and the bond is the attraction between the ions.

  - type: exam
    body: |
      - A full "describe" answer covers: electrons **transferred** (how many, from which atom to which), the **ions** with their charges, the **ratio**, and **electrostatic attraction between oppositely charged ions** in a giant lattice.
      - Dot-and-cross diagrams: square brackets round every ion, charges at the top right, crosses and dots kept distinct, and every ion drawn (two $\text{F}^-$ for $\text{CaF}_2$).
      - You can draw the metal ion with its full shell of eight crosses (as here) or as just $[\text{Mg}]^{2+}$ with no electrons shown. Both are common.

  - type: check
    title: Stretch
    questions: [strongest-ionic, describe-sodium-oxide]

  - type: takeaways
    items:
      - "Method: arrangements → lose and gain → **balance electrons to get the ratio** → ions with charges → electrostatic attraction in a giant lattice."
      - "NaCl: 1 electron moves, Na⁺ and Cl⁻, ratio 1 : 1."
      - "MgO: 2 electrons move, Mg²⁺ and O²⁻, ratio 1 : 1."
      - "CaF₂: 2 electrons move, one to each F, Ca²⁺ and 2 F⁻, ratio 1 : 2."

questions:
  - id: magnesium-electrons
    format: numeric
    difficulty: 1
    objectives: ["3.2.2"]
    prompt: |
      When magnesium oxide forms, how many electrons does each magnesium atom transfer to an oxygen atom?
    fields:
      - answer: 2
    explanation: |
      Mg (2,8,2) loses its 2 outer electrons, and O (2,6) gains 2. Both end up as 2,8.

  - id: magnesium-oxide-ions
    format: mcq
    difficulty: 1
    objectives: ["3.2.2"]
    prompt: |
      Which ions does magnesium oxide contain?
    options:
      - text: |
          $\text{Mg}^{2+}$ and $\text{O}^{2-}$
        correct: true
        why: |
          Mg loses 2 electrons and O gains 2, so both reach the neon arrangement.
      - text: |
          $\text{Mg}^{+}$ and $\text{O}^{-}$
        why: |
          Only one electron moved here, so neither ion has a noble-gas arrangement.
      - text: |
          $\text{Mg}^{2-}$ and $\text{O}^{2+}$
        why: |
          Wrong direction: the metal loses electrons and becomes positive.
      - text: |
          $\text{Mg}^{2+}$ and two $\text{O}^{-}$ ions
        why: |
          Oxygen (2,6) needs 2 electrons, so a single O atom takes both: one $\text{O}^{2-}$.
    explanation: |
      $\text{Mg}^{2+}$ and $\text{O}^{2-}$, both 2,8, in a 1 : 1 ratio.

  - id: calcium-fluoride-cloze
    format: cloze
    difficulty: 2
    objectives: ["3.2.2"]
    prompt: |
      In calcium fluoride, each calcium atom loses {{1}} electrons and each fluorine atom gains {{2}}. So there are {{3}} fluoride ions for every calcium ion, and each fluoride ion has the same electron arrangement as the noble gas {{4}}.
    blanks:
      - accept: ["2", "two"]
      - accept: ["1", "one"]
      - accept: ["2", "two"]
      - accept: ["neon", "Ne"]
    explanation: |
      Ca (2,8,8,2) loses 2; each F (2,7) gains 1, becoming 2,8 like neon. Two F⁻ balance one Ca²⁺.

  - id: aluminium-fluoride-ratio
    format: numeric
    difficulty: 2
    objectives: ["3.2.2"]
    prompt: |
      Aluminium (2,8,3) and fluorine (2,7) form an ionic compound. How many fluoride ions are there for every aluminium ion?
    fields:
      - answer: 3
    explanation: |
      Al loses 3 electrons → $\text{Al}^{3+}$. Each F gains only 1 → $\text{F}^-$. So 3 $\text{F}^-$ balance one $\text{Al}^{3+}$: the formula is $\text{AlF}_3$.

  - id: calcium-fluoride-error
    format: spot-error
    difficulty: 2
    objectives: ["3.2.2"]
    prompt: |
      A student describes how calcium fluoride forms. Which line contains the error?
    lines:
      - "Calcium is 2,8,8,2 and fluorine is 2,7."
      - "Each calcium atom loses two electrons to form $\\text{Ca}^{2+}$."
      - "Both electrons go to one fluorine atom, forming $\\text{F}^{2-}$."
      - "So the ions are $\\text{Ca}^{2+}$ and $\\text{F}^{2-}$, in a 1 : 1 ratio."
    errorLine: 3
    fix: |
      Each fluorine atom gains only **one** electron (2,7 → 2,8). The two electrons go to two different fluorine atoms, forming two $\text{F}^-$ ions.
    explanation: |
      $\text{F}^{2-}$ would have 2,8,1: no noble-gas arrangement. The correct ions are $\text{Ca}^{2+}$ and $\text{F}^-$ in a 1 : 2 ratio, which is why the formula is $\text{CaF}_2$.

  - id: strongest-ionic
    format: mcq
    difficulty: 3
    objectives: ["3.2.2"]
    prompt: |
      Which of these compounds has the **strongest** ionic bonding?
    options:
      - text: |
          Sodium chloride, $\text{NaCl}$
        why: |
          Only +1 and −1 charges, and $\text{Cl}^-$ is a large ion.
      - text: |
          Potassium chloride, $\text{KCl}$
        why: |
          +1 and −1 charges, and both ions are large, so the attraction is weaker still.
      - text: |
          Magnesium oxide, $\text{MgO}$
        correct: true
        why: |
          +2 and −2 charges on small ions: the strongest attraction of the four.
      - text: |
          Sodium fluoride, $\text{NaF}$
        why: |
          $\text{F}^-$ is smaller than $\text{Cl}^-$, which helps, but the charges are still only +1 and −1.
    explanation: |
      Higher charges and smaller ions mean stronger electrostatic attraction. That's why MgO melts at about 2850 °C.

  - id: describe-sodium-oxide
    format: explain
    difficulty: 2
    objectives: ["3.2.2", "3.2.1"]
    prompt: |
      Sodium (2,8,1) reacts with oxygen (2,6) to form sodium oxide, an ionic compound. Use the method to describe the bonding in sodium oxide.
    model: |
      Each sodium atom transfers its one outer electron to oxygen, and each oxygen atom gains two electrons, one from each of two sodium atoms. This forms $\text{Na}^+$ ions (2,8) and $\text{O}^{2-}$ ions (2,8), both with the neon arrangement. To balance the charges there are two $\text{Na}^+$ for every $\text{O}^{2-}$, so the formula is $\text{Na}_2\text{O}$. The bonding is the electrostatic attraction between the oppositely charged ions, acting in all directions in a giant lattice.
    keyPoints:
      - "Each Na atom transfers 1 electron; each O atom gains 2 (one from each of two Na atoms)."
      - "Ions formed: Na⁺ (2,8) and O²⁻ (2,8), both like neon."
      - "Ratio Na⁺ : O²⁻ = 2 : 1, so the formula is Na₂O."
      - "Bonding: electrostatic attraction between oppositely charged ions, in all directions in a giant lattice."
    explanation: |
      This time the **metal** ion appears twice: one O atom needs two electrons, but each Na can give only one.
