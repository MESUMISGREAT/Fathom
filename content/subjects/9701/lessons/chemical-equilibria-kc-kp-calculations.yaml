id: chemical-equilibria-kc-kp-calculations
subject: "9701"
topic: "7.1"
title: "Calculating with $K_c$ and $K_p$"
summary: Two routines cover almost every equilibrium calculation — turn moles into concentrations, or mole fractions into partial pressures, then substitute.
order: 7
minutes: 10
kind: core
objectives: ["7.1.7"]
prerequisites: [chemical-equilibria-kc-expressions, chemical-equilibria-kp-expressions, chemical-equilibria-mole-fraction-partial-pressure]
