id: bronsted-lowry-common-acids-bases
subject: "9701"
topic: "7.2"
title: The acids and alkalis you'll meet every day
summary: Learn the four common acids and three common alkalis by name and formula, plus why we write state symbols.
order: 1
minutes: 3
objectives: ["7.2.1", "7.2.2"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcomes 1 and 2; common acids and alkalis).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can name and write the formulas of the four common acids (HCl, H₂SO₄, HNO₃, CH₃COOH) and the three common alkalis (NaOH, KOH, NH₃), and you know when to add state symbols.

  - type: explain
    title: Why these seven?
    body: |
      Cambridge picked the acids and bases that show up **constantly** in exam questions, practicals, and real chemistry. Memorise them now and you save brain-space later.

  - type: definition
    term: Acid (for this topic)
    body: |
      A substance that donates protons (H⁺ ions) in aqueous solution. The four you must know: hydrochloric, sulfuric, nitric, and ethanoic acid.

  - type: definition
    term: Alkali (for this topic)
    body: |
      A **soluble** base that releases hydroxide ions (OH⁻) in water. The three you must know: sodium hydroxide, potassium hydroxide, and ammonia.

  - type: explain
    title: The big four acids
    body: |
      | name | formula | everyday context |
      | --- | --- | --- |
      | Hydrochloric acid | $\\text{HCl}$ | Stomach acid, pickling steel |
      | Sulfuric acid | $\\text{H}_2\\text{SO}_4$ | Car batteries, fertiliser production |
      | Nitric acid | $\\text{HNO}_3$ | Explosives, fertilisers, etching |
      | Ethanoic acid | $\\text{CH}_3\\text{COOH}$ | Vinegar (≈5 %), food preservation |

      **Key detail:** $\\text{H}_2\\text{SO}_4$ is **diprotic** — it can donate two protons, one after the other. The other three are monoprotic (one proton each).

  - type: explain
    title: The three alkalis
    body: |
      | name | formula | everyday context |
      | --- | --- | --- |
      | Sodium hydroxide | $\\text{NaOH}$ | Drain cleaner, soap making |
      | Potassium hydroxide | $\\text{KOH}$ | Biodegradable soaps, batteries |
      | Ammonia | $\\text{NH}_3$ | Cleaning products, fertiliser precursor |

      **Watch out:** ammonia isn't a hydroxide — it **accepts a proton** from water to make $\\text{NH}_4^+$ and $\\text{OH}^-$. That's why it fits the Brønsted–Lowry definition perfectly (coming up next).

  - type: check
    title: Quick recall
    questions: [acid-formula-match, alkali-formula-match, diprotic-pick]

  - type: explain
    title: State symbols matter
    body: |
      In this topic you'll almost always see **(aq)** after these formulas because the Brønsted–Lowry action happens **in water**.

      - $\\text{HCl(aq)}$ means hydrogen chloride gas dissolved in water.
      - $\\text{NH}_3\\text{(aq)}$ means ammonia gas dissolved in water.

      **Exam tip:** if a question asks for "the formula of hydrochloric acid", write $\\text{HCl}$. If it asks for "hydrochloric acid in aqueous solution", write $\\text{HCl(aq)}$.

  - type: check
    title: State symbols
    questions: [state-symbol-pick, ammonia-aq]

  - type: misconceptions
    items:
      - wrong: "Ammonia is $\\text{NH}_4\\text{OH}$."
        right: "Ammonia is $\\text{NH}_3$. In water it forms $\\text{NH}_4^+$ and $\\text{OH}^-$, but there is no stable $\\text{NH}_4\\text{OH}$ molecule."
      - wrong: "Sulfuric acid formula is $\\text{HSO}_4$."
        right: "It's $\\text{H}_2\\text{SO}_4$. $\\text{HSO}_4^-$ is the hydrogen sulfate ion (after the first proton is lost)."
      - wrong: "All acids contain oxygen."
        right: "HCl and $\\text{CH}_3\\text{COOH}$ don't. 'Acid' comes from Latin *acere* (sour), not oxygen."

  - type: takeaways
    items:
      - "Four acids: HCl, H₂SO₄, HNO₃, CH₃COOH — learn names AND formulas."
      - "Three alkalis: NaOH, KOH, NH₃ — ammonia is the odd one (no OH in formula)."
      - "H₂SO₄ is diprotic (two protons); the others are monoprotic."
      - "State symbols (aq) show the reaction happens in water."

questions:
  - id: acid-formula-match
    format: mcq
    difficulty: 1
    objectives: ["7.2.1"]
    prompt: |
      Which pair correctly matches the acid name with its formula?
    options:
      - text: "Sulfuric acid — $\\text{H}_2\\text{SO}_3$"
        why: "That's sulfurous acid. Sulfuric acid is $\\text{H}_2\\text{SO}_4$."
      - text: "Nitric acid — $\\text{HNO}_2$"
        why: "That's nitrous acid. Nitric acid is $\\text{HNO}_3$."
      - text: "Ethanoic acid — $\\text{CH}_3\\text{COOH}$"
        correct: true
        why: "Correct. Ethanoic acid (vinegar) is $\\text{CH}_3\\text{COOH}$."
      - text: "Hydrochloric acid — $\\text{HClO}$"
        why: "That's hypochlorous acid. Hydrochloric acid is simply $\\text{HCl}$."
    explanation: |
      Learn the four formulas by heart: HCl, H₂SO₄, HNO₃, CH₃COOH.

  - id: alkali-formula-match
    format: mcq
    difficulty: 1
    objectives: ["7.2.2"]
    prompt: |
      Which of the following is **not** one of the three common alkalis in the syllabus?
    options:
      - text: "Sodium hydroxide, NaOH"
        why: "This is one of the three."
      - text: "Potassium hydroxide, KOH"
        why: "This is one of the three."
      - text: "Ammonia, NH₃"
        why: "This is the third one."
      - text: "Calcium hydroxide, Ca(OH)₂"
        correct: true
        why: "Calcium hydroxide is a base, but it's only sparingly soluble, so it's not classed as an 'alkali' in the Cambridge list."
    explanation: |
      The syllabus lists exactly three alkalis: NaOH, KOH, NH₃. Calcium hydroxide is a base but not an alkali here because of its low solubility.

  - id: diprotic-pick
    format: mcq
    difficulty: 2
    objectives: ["7.2.1"]
    prompt: |
      Which statement about sulfuric acid is correct?
    options:
      - text: "It is monoprotic like HCl."
        why: "H₂SO₄ can donate two protons; it's diprotic."
      - text: "It can donate two protons, one at a time."
        correct: true
        why: "First: H₂SO₄ → H⁺ + HSO₄⁻ (strong). Second: HSO₄⁻ ⇌ H⁺ + SO₄²⁻ (weak)."
      - text: "It donates both protons simultaneously."
        why: "Protons are lost in two distinct steps with different strengths."
      - text: "It cannot donate protons because it's a solid."
        why: "It's a liquid (pure) and fully dissociates in water."
    explanation: |
      H₂SO₄ is diprotic: the first proton comes off completely (strong acid), the second partially (weak acid).

  - id: state-symbol-pick
    format: mcq
    difficulty: 1
    objectives: ["7.2.1", "7.2.2"]
    prompt: |
      A question asks: "Write the formula of aqueous sodium hydroxide." What should you write?
    options:
      - text: "NaOH"
        why: "Missing the state symbol. The question specified 'aqueous'."
      - text: "NaOH(aq)"
        correct: true
        why: "'Aqueous' means dissolved in water, so the state symbol (aq) is required."
      - text: "NaOH(s)"
        why: "That's solid sodium hydroxide, not the aqueous solution."
      - text: "Na⁺(aq) + OH⁻(aq)"
        why: "That shows the dissociated ions, not the formula of the compound."
    explanation: |
      "Aqueous" = (aq). Always include state symbols when the question specifies the state.

  - id: ammonia-aq
    format: mcq
    difficulty: 2
    objectives: ["7.2.2"]
    prompt: |
      Ammonia gas dissolves in water. Which equation best represents what happens?
    options:
      - text: "$\\text{NH}_3\\text{(g)} \\rightarrow \\text{NH}_3\\text{(aq)}$"
        why: "This only shows dissolving, not the reaction with water."
      - text: "$\\text{NH}_3\\text{(aq)} + \\text{H}_2\\text{O(l)} \\rightleftharpoons \\text{NH}_4^+\\text{(aq)} + \\text{OH}^-\\text{(aq)}$"
        correct: true
        why: "Ammonia acts as a Brønsted–Lowry base, accepting a proton from water."
      - text: "$\\text{NH}_3\\text{(aq)} \\rightarrow \\text{NH}_4\\text{OH(aq)}$"
        why: "There is no stable NH₄OH molecule; this is an outdated representation."
      - text: "$\\text{NH}_3\\text{(g)} + \\text{H}_2\\text{O(l)} \\rightarrow \\text{NH}_4^+\\text{(aq)} + \\text{OH}^-\\text{(aq)}$"
        why: "Ammonia is already aqueous when it reacts; the state symbol for NH₃ should be (aq)."
    explanation: |
      Ammonia is a weak base: it accepts a proton from water in a reversible equilibrium. The (aq) on NH₃ shows it's dissolved first.