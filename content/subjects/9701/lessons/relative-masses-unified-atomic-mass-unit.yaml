id: relative-masses-unified-atomic-mass-unit
subject: "9701"
topic: "2.1"
title: The unified atomic mass unit
summary: Why chemists weigh atoms against carbon-12, the definition of the unified atomic mass unit, and what a relative isotopic mass tells you.
order: 1
minutes: 4
objectives: ["2.1.1", "2.1.2"]
prerequisites: [atoms-isotopes]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.1, learning outcome 2.1.1, and the relative isotopic mass
    part of 2.1.2). 1 u = 1.66 × 10⁻²⁷ kg (CODATA value 1.66054 × 10⁻²⁷ kg). Relative
    isotopic masses of ¹H, ⁴He, ¹⁴N, ¹⁶O and ³⁵Cl are standard literature values, rounded.
    The history of the 1961 unified scale is in a not-examinable enrichment block. All
    questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define the **unified atomic mass unit**, define **relative isotopic mass**, and convert between the mass of one atom in kg and its relative isotopic mass.

  - type: explain
    title: Atoms are ridiculously light
    body: |
      One atom of carbon-12 has a mass of about $1.99 \times 10^{-26}\ \text{kg}$. Written out, that's 0.000 000 000 000 000 000 000 000 019 9 kg. Nobody wants to do arithmetic with that.

      So chemists don't weigh atoms in kilograms. They pick **one atom as the standard** and compare every other atom with it.

      The standard is the **carbon-12** atom, $^{12}\text{C}$.

  - type: definition
    term: Unified atomic mass unit, u
    body: |
      One twelfth of the mass of one atom of carbon-12.

      $$1\ \text{u} = \tfrac{1}{12} \times \text{mass of one } {}^{12}\text{C atom} \approx 1.66 \times 10^{-27}\ \text{kg}$$

  - type: diagram
    diagram: chem-relative-masses-carbon-12-ruler
    alt: "A to-scale bar chart on a scale of relative isotopic mass from 0 to 16. The top bar is a carbon-12 atom, exactly 12 units long and cut into 12 equal slices; the first slice is highlighted and labelled 1 u = 1/12 of the mass of one carbon-12 atom, about 1.66 × 10⁻²⁷ kg. Below it, bars for hydrogen-1 (1.008), helium-4 (4.003), nitrogen-14 (14.003) and oxygen-16 (15.995) are drawn on the same scale, so each is close to, but not exactly, a whole number of slices."
    caption: Carbon-12 is the ruler. One slice of it is 1 u.

  - type: intuition
    title: A chocolate bar with 12 squares
    body: |
      Picture a carbon-12 atom as a chocolate bar with exactly 12 squares. Snap off one square: that's **1 u**. Now weigh every other atom in squares. Hydrogen-1 is about 1 square; oxygen-16 is about 16.

      Where the analogy breaks: atoms aren't made of twelve u-sized chunks, and most atoms are **not** an exact whole number of squares. Oxygen-16 is 15.995 u, not 16 u.

  - type: check
    title: Quick check
    questions: [u-definition, define-u]

  - type: definition
    term: Relative isotopic mass
    body: |
      The mass of one atom of an isotope compared with one twelfth of the mass of one atom of carbon-12.

      $$\text{relative isotopic mass} = \frac{\text{mass of one atom of the isotope}}{1\ \text{u}}$$

  - type: explain
    title: '"Relative" means no units'
    body: |
      Relative isotopic mass is one mass **divided by** another, so the units cancel. It's just a number.

      | isotope | relative isotopic mass | mass of one atom |
      | --- | --- | --- |
      | $^{12}\text{C}$ | **12 exactly** (by definition) | 12 u |
      | $^{1}\text{H}$ | 1.008 | 1.008 u |
      | $^{16}\text{O}$ | 15.995 | 15.995 u, or about $2.66 \times 10^{-26}\ \text{kg}$ |

      - Carbon-12 is the **only** atom whose relative isotopic mass is exactly a whole number. That's how the scale is defined.
      - Everything else is close to its **mass number**, but not exactly equal. Questions often tell you to use the mass number as an approximation; do that when told.

  - type: check
    title: No units, one exact number
    questions: [relative-no-units, carbon-cloze]

  - type: example
    title: Mystery atom
    problem: |
      A single atom of an unknown isotope has a mass of $3.82 \times 10^{-26}\ \text{kg}$. Find its relative isotopic mass and suggest which isotope it is. ($1\ \text{u} = 1.66 \times 10^{-27}\ \text{kg}$)
    steps:
      - |
        Relative isotopic mass compares the atom with 1 u, so divide: $\dfrac{3.82 \times 10^{-26}\ \text{kg}}{1.66 \times 10^{-27}\ \text{kg}} = 23.0$
      - |
        The kg cancel, so the answer has **no units**.
      - |
        23.0 is very close to a mass number of 23. The stable isotope with mass number 23 is sodium-23, $^{23}\text{Na}$.
    answer: |
      Relative isotopic mass = 23.0, so it's probably $^{23}\text{Na}$.

  - type: check
    title: Your turn
    questions: [isotopic-mass-calc, helium-mass-kg]

  - type: misconceptions
    items:
      - wrong: "1 u is the mass of a proton."
        right: "Close (a proton is about 1.007 u), but 1 u is **defined** from carbon-12: one twelfth of the mass of a $^{12}\\text{C}$ atom."
      - wrong: "1 u is one twelfth of the mass of a carbon atom."
        right: "It must be **carbon-12**. Natural carbon also contains some carbon-13, which is heavier."
      - wrong: "Relative isotopic mass is measured in grams (or in u)."
        right: "It has **no units**. The *mass of the atom* is 15.995 u; its *relative isotopic mass* is 15.995."
      - wrong: "Relative isotopic mass always equals the mass number."
        right: "Only $^{12}\\text{C}$ is exactly whole (12). Others are close: $^{16}\\text{O}$ is 15.995. Use mass numbers only as an approximation when the question allows it."

  - type: exam
    body: |
      - The definition of u has three must-haves: **one twelfth**, **mass of one atom**, **carbon-12**. Writing $^{12}\text{C}$ for carbon-12 is fine.
      - For relative isotopic mass, say "mass of one atom **of an isotope**" and finish with "compared with one twelfth of the mass of one atom of carbon-12".
      - Converting kg to relative mass: divide by $1.66 \times 10^{-27}\ \text{kg}$. Converting back: multiply. If the kg don't cancel, you've flipped it.

  - type: enrichment
    title: Why "unified"?
    body: |
      Before 1961 there were **two** atomic mass scales. Physicists set the oxygen-16 atom to exactly 16; chemists set *natural* oxygen (a mixture of isotopes) to exactly 16. Their tables differed by about 0.03 %, which was annoying for everyone.

      In 1960–61 both groups agreed on carbon-12 = 12 exactly. One scale for everyone: the **unified** atomic mass unit.

      Bonus weirdness: an $^{16}\text{O}$ atom has less mass than its 8 protons, 8 neutrons and 8 electrons weighed separately. The "missing" mass is the nuclear binding energy, via $E = mc^2$. That's another reason relative isotopic masses aren't whole numbers.

  - type: takeaways
    items:
      - "1 u = one twelfth of the mass of one atom of carbon-12, about $1.66 \\times 10^{-27}$ kg."
      - "Relative isotopic mass = mass of one atom of an isotope compared with one twelfth of the mass of one carbon-12 atom."
      - "Relative masses have no units. Only carbon-12 is exactly 12."
      - "kg → relative mass: divide by $1.66 \\times 10^{-27}$ kg."

questions:
  - id: u-definition
    format: mcq
    difficulty: 1
    objectives: ["2.1.1"]
    prompt: |
      Which of these **is** the unified atomic mass unit, 1 u?
    options:
      - text: |
          The mass of one proton
        why: |
          A proton is about 1.007 u, so it's close, but the unit is defined from carbon-12, not the proton.
      - text: |
          The mass of one hydrogen-1 atom
        why: |
          $^{1}\text{H}$ is 1.008 u. Close again, but hydrogen isn't the standard.
      - text: |
          One twelfth of the mass of one carbon-12 atom
        correct: true
        why: |
          That's the definition: carbon-12 is the standard, and 1 u is one twelfth of it.
      - text: |
          One twelfth of the mass of one carbon atom
        why: |
          It must be carbon-12 specifically. "A carbon atom" could be carbon-13 or carbon-14.
    explanation: |
      1 u = $\tfrac{1}{12}$ × mass of one $^{12}\text{C}$ atom ≈ $1.66 \times 10^{-27}$ kg. Protons and $^{1}\text{H}$ atoms are close to 1 u but are not the definition.

  - id: define-u
    format: text
    style: definition
    difficulty: 1
    objectives: ["2.1.1"]
    prompt: |
      Define the **unified atomic mass unit**.
    accept:
      - "one twelfth of the mass of one atom of carbon-12"
      - "one twelfth of the mass of a carbon-12 atom"
      - "one twelfth of the mass of an atom of carbon-12"
      - "one twelfth of the mass of one carbon-12 atom"
      - "one twelfth the mass of a carbon-12 atom"
      - "one twelfth the mass of one atom of carbon-12"
      - "1/12 of the mass of one atom of carbon-12"
      - "1/12 of the mass of a carbon-12 atom"
      - "1/12 of the mass of an atom of carbon-12"
      - "1/12 of the mass of one carbon-12 atom"
      - "1/12 the mass of a carbon-12 atom"
      - "1/12 the mass of one atom of carbon-12"
      - "1/12th of the mass of a carbon-12 atom"
      - "1/12th of the mass of one atom of carbon-12"
      - "1/12 of the mass of a ¹²C atom"
      - "1/12 of the mass of one ¹²C atom"
      - "one twelfth of the mass of a ¹²C atom"
      - "1/12 of the mass of a c-12 atom"
      - "one twelfth of the mass of a c-12 atom"
      - "it is one twelfth of the mass of one atom of carbon-12"
      - "the unified atomic mass unit is one twelfth of the mass of one atom of carbon-12"
    model: |
      One twelfth of the mass of one atom of carbon-12 (about $1.66 \times 10^{-27}$ kg).
    explanation: |
      Check yours for all three parts: **one twelfth**, **mass of one atom**, **carbon-12**.

  - id: relative-no-units
    format: mcq
    difficulty: 2
    objectives: ["2.1.2"]
    prompt: |
      The relative isotopic mass of oxygen-16 is 15.995. Which statement is correct?
    options:
      - text: |
          One $^{16}\text{O}$ atom has a mass of 15.995 g.
        why: |
          A single atom is far, far lighter than a gram. (15.995 g is roughly the mass of a whole *mole* of them, which is a later lesson.)
      - text: |
          One $^{16}\text{O}$ atom is 15.995 times as heavy as one twelfth of a $^{12}\text{C}$ atom.
        correct: true
        why: |
          Exactly what "relative isotopic mass" means: compared with 1 u.
      - text: |
          One $^{16}\text{O}$ atom is 15.995 times as heavy as one $^{12}\text{C}$ atom.
        why: |
          That would make oxygen heavier than 190 u. The comparison is with **one twelfth** of the carbon-12 atom.
      - text: |
          It must really be exactly 16, because the atom has 16 nucleons.
        why: |
          Only carbon-12 is exactly whole. Protons and neutrons aren't exactly 1 u each, so other isotopes land slightly off their mass numbers.
    explanation: |
      Relative isotopic mass = mass of one atom ÷ 1 u. For $^{16}\text{O}$ that ratio is 15.995, with no units.

  - id: carbon-cloze
    format: cloze
    difficulty: 1
    objectives: ["2.1.1", "2.1.2"]
    prompt: |
      On the carbon-12 scale, the relative isotopic mass of carbon-12 is exactly {{1}}. Because relative masses compare one mass with another, they have {{2}} units.
    blanks:
      - accept: ["12", "twelve", "12.0", "12.000"]
      - accept: ["no", "zero", "0", "none"]
    explanation: |
      Carbon-12 is defined as exactly 12, and dividing a mass by a mass cancels the units.

  - id: isotopic-mass-calc
    format: numeric
    difficulty: 2
    objectives: ["2.1.2"]
    prompt: |
      One atom of a chlorine isotope has a mass of $5.81 \times 10^{-26}\ \text{kg}$. Calculate its relative isotopic mass to 3 significant figures. ($1\ \text{u} = 1.66 \times 10^{-27}\ \text{kg}$)
    fields:
      - answer: 35.0
        tolerance: { abs: 0.15 }
    explanation: |
      $\dfrac{5.81 \times 10^{-26}}{1.66 \times 10^{-27}} = 35.0$, with no units. This is chlorine-35.

  - id: helium-mass-kg
    format: numeric
    difficulty: 2
    objectives: ["2.1.1", "2.1.2"]
    prompt: |
      The relative isotopic mass of helium-4 is 4.003. What is the mass of **one** helium-4 atom in kilograms? ($1\ \text{u} = 1.66 \times 10^{-27}\ \text{kg}$) Type it like `6.5e-27`.
    fields:
      - answer: 6.64e-27
        tolerance: { rel: 0.005 }
        unit: kg
    explanation: |
      Mass = 4.003 u = $4.003 \times 1.66 \times 10^{-27}\ \text{kg} = 6.64 \times 10^{-27}\ \text{kg}$. Going from relative mass to kg, you **multiply** by the size of 1 u.
