id: enthalpy-change-bonds-broken-and-made
subject: "9701"
topic: "5.1"
title: "Bonds: pay to break, get paid to make"
summary: Breaking a bond always costs energy and forming one always releases it, so whether a reaction warms or cools you comes down to which total is bigger.
order: 5
minutes: 6
kind: core
objectives: ["5.1.4"]
prerequisites: [enthalpy-change-exothermic-endothermic]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027 (learning outcome 5.1.4, energy transfers occur because bonds are broken and made).
    All questions are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can explain **why** a reaction releases or absorbs energy in terms of bonds broken and bonds formed, and state the sign conventions for each.

  - type: explain
    title: The one rule that explains the whole topic
    body: |
      Every chemical reaction can be split into two halves:

      1. **Break the bonds in the reactants.** This always **costs** energy. Energy is needed to pull apart atoms that are attracted to each other.
      2. **Form the bonds in the products.** This always **releases** energy, because the atoms are moving to a lower, more stable arrangement.

      Compare the two totals:

      - released **more** than it cost → energy is left over → **exothermic**;
      - released **less** than it cost → the reaction is short of energy → **endothermic**, so it must take the difference from the surroundings.

  - type: definition
    term: Bond energy (bond enthalpy)
    body: |
      The energy needed to **break one mole of a particular bond** in the **gaseous** state, in $\text{kJ mol}^{-1}$.

      Because breaking bonds needs energy, bond energies are quoted as **positive** numbers. Bond
      breaking is **endothermic**: $\Delta H$ is positive. Bond making is the reverse, so it
      **releases** the same amount of energy.

  - type: diagram
    diagram: chem-enthalpy-change-bonds
    alt: >-
      A balance-style picture. On the left, a box labelled "bonds broken in reactants" with an
      upward arrow "energy in" and the sum Σ(bond energies of bonds broken), coloured as a cost. On
      the right, a box labelled "bonds formed in products" with a downward arrow "energy out" and
      Σ(bond energies of bonds formed). Below, the working ΔH = energy in to break − energy released
      on forming, with the note that a larger energy-out total means the reaction is exothermic.
    caption: |
      Energy in on the left, energy out on the right — the balance decides the sign of ΔH.

  - type: explain
    title: Why breaking costs and making pays
    body: |
      In a molecule, the atoms sit at a minimum of potential energy — the bottom of a well. The
      nuclei attract the shared electrons, and the atoms are happiest where the attraction and the
      nuclear repulsion balance.

      To **break** the bond you must drag the atoms up out of that well, so you put energy in.

      To **form** the bond, the atoms fall back into the well, releasing energy — exactly like a ball
      rolling downhill.

      This is why an isolated atom is high in energy and a bonded molecule is low. Chemistry is
      mostly the story of atoms falling into wells and climbing out of others.

  - type: example
    title: "Worked example: does it warm or cool?"
    problem: |
      In a reaction, breaking the reactant bonds costs $1200\ \text{kJ mol}^{-1}$ and forming the product bonds releases $1500\ \text{kJ mol}^{-1}$.

      Calculate $\Delta H$ and state whether the reaction is exothermic.
    steps:
      - |
        Energy in to break bonds: $+1200\ \text{kJ mol}^{-1}$.
      - |
        Energy out on forming bonds: $1500\ \text{kJ mol}^{-1}$.
      - |
        Net change:
        $$\Delta H = 1200 - 1500 = -300\ \text{kJ mol}^{-1}$$
      - |
        More energy is released than absorbed, so the reaction is **exothermic** — the surroundings
        get $300\ \text{kJ mol}^{-1}$ warmer.
    answer: |
      $\Delta H = -300\ \text{kJ mol}^{-1}$, exothermic.

  - type: check
    title: Quick check
    questions: [break-or-make, sign-of-breaking, net-energy]

  - type: misconceptions
    items:
      - wrong: Breaking bonds releases energy, which is why reactions happen.
        right: |
          Breaking bonds always **absorbs** energy. Reactions that release energy do so because
          forming product bonds releases more than breaking reactant bonds costs.
      - wrong: Bond formation absorbs energy because the atoms are getting closer.
        right: |
          Getting closer, in a bond, means falling to a lower energy state, which releases energy.
      - wrong: Bond energies are negative because forming a bond releases energy.
        right: |
          Bond energies are quoted as **positive** values for breaking the bond. The sign of
          $\Delta H$ comes from combining them, not from the bond energy itself.
      - wrong: A reaction cannot be exothermic if it involves breaking strong bonds.
        right: |
          What matters is the comparison. Burning methane breaks strong C–H and O=O bonds, but
          forms even stronger C=O and O–H bonds, so the net change is strongly exothermic.
      - wrong: ΔH tells you which bonds break first.
        right: |
          $\Delta H$ is the overall balance. The order in which bonds break is a mechanistic question
          and does not follow from the energy total.

  - type: exam
    body: |
      - Explanations in terms of bonds must say **both** halves: energy is absorbed to break bonds in the reactants, and released when bonds form in the products.
      - Give the comparison explicitly: "more energy is released than absorbed, so the reaction is exothermic".
      - Use "bonds broken" and "bonds formed", not "bonds made and broken" in a vague order.
      - Remember the state: bond energies are defined for **gaseous** species.
      - A three-mark explanation usually wants: breaking absorbs energy, forming releases energy, and the comparison that decides the sign.

  - type: check
    title: Check yourself
    questions: [explain-why-exothermic, bonds-and-state, spot-bond-error]

  - type: takeaways
    items:
      - Breaking bonds absorbs energy; forming bonds releases energy.
      - Bond energy is positive because it is the energy needed to break one mole of the bond.
      - '$\Delta H = \Sigma(\text{bonds broken}) - \Sigma(\text{bonds formed})$.'
      - More released than absorbed means exothermic; more absorbed than released means endothermic.
      - 'Bond energies refer to gaseous species: state changes cost energy too.'

  - type: deeper
    title: Where the water's energy really goes
    body: |
      Burning hydrogen in oxygen releases $286\ \text{kJ mol}^{-1}$. Split it up:

      - break $\text{H–H}$: $+436$
      - break $\tfrac{1}{2}\text{O=O}$: $+249$
      - form two $\text{O–H}$: $-928$

      Total: $436 + 249 - 928 = -243\ \text{kJ mol}^{-1}$ for gaseous water. But the reaction
      really produces liquid water, and condensing it releases a further
      $44\ \text{kJ mol}^{-1}$, giving about $-287$ — close to the tabulated $-286$.

      So bond energies alone describe the gas-phase reaction. The familiar "hydrogen is a great
      fuel" figure includes the condensation step, which is why it is bigger.

questions:
  - id: break-or-make
    format: mcq
    difficulty: 1
    objectives: ["5.1.4"]
    prompt: |
      Which statement about bonds is correct?
    options:
      - text: Breaking a bond absorbs energy, and forming a bond releases energy
        correct: true
        why: |
          Atoms are pulled apart against their attraction (energy in), and fall back into a
          lower-energy arrangement when a bond forms (energy out).
      - text: Breaking a bond releases energy, and forming a bond absorbs energy
        why: |
          That is the wrong way round, and would make every reaction endothermic.
      - text: Both breaking and forming a bond release energy
        why: |
          Energy must be conserved. If both released energy, reactions would create it.
      - text: Both breaking and forming a bond absorb energy
        why: |
          Bond formation always releases energy; otherwise molecules would be unstable.
    explanation: |
      Breaking costs energy, forming releases it — the whole sign convention follows from this.

  - id: sign-of-breaking
    format: mcq
    difficulty: 1
    objectives: ["5.1.4"]
    prompt: |
      What is the sign of $\Delta H$ for the process $\text{H}_2\text{(g)} \rightarrow 2\text{H(g)}$?
    options:
      - text: Positive, because a bond is being broken
        correct: true
        why: |
          Breaking the H–H bond requires energy, so the process is endothermic and $\Delta H$ is
          positive ($+436\ \text{kJ mol}^{-1}$).
      - text: Negative, because atoms are being produced
        why: |
          Producing atoms from a molecule costs energy; separate atoms are higher in enthalpy than
          the bonded pair.
      - text: Zero, because no new substance is formed
        why: |
          A new substance **is** formed — hydrogen atoms rather than molecules — and energy changes
          are involved.
      - text: It cannot be determined without the pressure
        why: |
          The sign is fixed by the physics of breaking the bond; the pressure only affects the
          precise value.
    explanation: |
      Bond breaking is endothermic, so $\Delta H = +436\ \text{kJ mol}^{-1}$ for one mole of H–H
      bonds.

  - id: net-energy
    format: numeric
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |
      In a reaction, breaking bonds in the reactants requires $650\ \text{kJ mol}^{-1}$ and forming bonds in the products releases $480\ \text{kJ mol}^{-1}$.

      Calculate $\Delta H$ in $\text{kJ mol}^{-1}$.
    fields:
      - answer: 170
        tolerance: { abs: 1 }
        unit: kJ mol^-1
    explanation: |
      $\Delta H = 650 - 480 = +170\ \text{kJ mol}^{-1}$. It is positive because more energy is needed
      to break the reactant bonds than is released on forming the product bonds — endothermic.

  - id: explain-why-exothermic
    format: explain
    difficulty: 3
    objectives: ["5.1.4"]
    prompt: |
      Explain, in terms of bonds broken and formed, why the combustion of methane is exothermic.
    model: |
      In the reaction $\text{CH}_4 + 2\text{O}_2 \rightarrow \text{CO}_2 + 2\text{H}_2\text{O}$,
      energy must be absorbed to break the C–H bonds in methane and the O=O bonds in oxygen.
      Energy is then released when the new C=O bonds in carbon dioxide and O–H bonds in water are
      formed. The bonds formed are stronger overall, so the energy released on forming them is
      greater than the energy absorbed in breaking the reactant bonds. The difference is
      transferred to the surroundings as heat, so the reaction is exothermic and $\Delta H$ is
      negative.
    keyPoints:
      - Energy absorbed to break C–H and O=O bonds
      - Energy released when C=O and O–H bonds form
      - More energy released than absorbed
      - Difference transferred to surroundings, so ΔH is negative
    explanation: |
      The examiner wants both halves of the story plus the comparison. "Stronger bonds are formed"
      is an acceptable way to say more energy is released than absorbed.

  - id: bonds-and-state
    format: mcq
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |
      Bond energies are defined for gaseous species. Why does that matter when calculating ΔH?
    options:
      - text: Because condensing a gas to a liquid releases energy that is not counted in the bond energies
        correct: true
        why: |
          Bond energies only cover breaking and making bonds between gaseous atoms and molecules;
          any change of state has its own enthalpy change.
      - text: Because gases have no bonds
        why: |
          Gases such as $\text{CH}_4$ and $\text{O}_2$ are full of covalent bonds.
      - text: Because bond energies change with pressure
        why: |
          The gaseous state is specified precisely so that the value does not depend on which
          liquid or solid is present; small pressure effects are ignored.
      - text: Because liquids cannot react
        why: |
          Liquids react all the time; the point is about which energy changes the numbers include.
    explanation: |
      Bond energies describe the gas-phase reaction. If the real product is a liquid, the
      condensation energy must be added separately.

  - id: spot-bond-error
    format: spot-error
    difficulty: 2
    objectives: ["5.1.4"]
    prompt: |
      A student explains an exothermic reaction. Which line contains the first error?
    lines:
      - Energy is absorbed to break the bonds in the reactants
      - Energy is released when the bonds in the products form
      - Because the reaction is exothermic, breaking bonds must have released more energy than forming them
      - The excess energy is transferred to the surroundings
    errorLine: 3
    fix: |
      Breaking bonds never releases energy. In an exothermic reaction, **forming** the product bonds
      releases more energy than **breaking** the reactant bonds absorbed.
    explanation: |
      Lines 1, 2 and 4 are correct. Line 3 reverses which process releases the greater amount.
