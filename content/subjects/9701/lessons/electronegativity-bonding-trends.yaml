id: electronegativity-bonding-trends
subject: "9701"
topic: "3.1"
title: Electronegativity trends across and down
summary: Electronegativity increases across a period and decreases down a group. Here's why, in the words examiners reward.
order: 2
minutes: 4
objectives: ["3.1.3", "3.1.2"]
prerequisites: [electronegativity-bonding-what-it-is, atoms-atomic-and-ionic-radius]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.1, learning outcomes 3.1.3 and 3.1.2). Electronegativities
    are Pauling values rounded to 1 d.p. (Li 1.0 … F 4.0; Na 0.9 … Cl 3.2; K 0.8, Ca 1.0,
    Br 3.0; Rb 0.8, I 2.7; Ga 1.8). The "protons minus inner electrons" net pull is a
    deliberately rough shielding model and is labelled as such. The gallium anomaly is
    enrichment and is labelled not examinable. All questions are original.

blocks:
  - type: objective
    body: |
      By the end you can state the trends in electronegativity across a period and down a group, and explain them using nuclear charge, atomic radius and shielding.

  - type: explain
    title: Head for the top right
    body: |
      Two arrows run the whole show:

      - **Across a period** (left to right): electronegativity **increases**.
      - **Down a group**: electronegativity **decreases**.

      So the champion sits at the top right: **fluorine**, 4.0. The weakest pullers sit at the bottom left, like caesium.

  - type: diagram
    diagram: chem-electronegativity-bonding-periodic-table
    alt: "Part of the Periodic Table showing Pauling electronegativity values, each cell with a bar proportional to the value. Period 2: Li 1.0, Be 1.6, B 2.0, C 2.6, N 3.0, O 3.4, F 4.0 (highlighted as the highest). Period 3: Na 0.9, Mg 1.3, Al 1.6, Si 1.9, P 2.2, S 2.6, Cl 3.2. Further down group 1: K 0.8, Rb 0.8; group 2: Ca 1.0; group 17: Br 3.0, I 2.7. An arrow along the top says electronegativity increases across a period; an arrow down the left side says it decreases down a group. Noble gases are left out because they rarely form bonds."
    caption: Up and to the right means more electronegative. (Groups 13 to 16 are shown for periods 2 and 3 only.)

  - type: check
    title: Quick check
    questions: [most-electronegative, trend-cloze]

  - type: explain
    title: "Across a period: why it increases"
    body: |
      Take period 3, from sodium (0.9) to chlorine (3.2). Each step to the right:

      1. **Nuclear charge increases**: one more proton.
      2. The new electron goes into the **same shell**, so **shielding stays about the same**.
      3. More pull, same shielding: the atom shrinks, so **atomic radius decreases**.
      4. So the bonding pair is attracted **more strongly**: electronegativity rises.

  - type: example
    title: Sodium vs chlorine, checked with numbers
    problem: |
      Use the rough model "net pull ≈ protons − inner electrons" to compare sodium and chlorine. Then check against their Pauling values: Na 0.9, Cl 3.2.
    steps:
      - |
        **Sodium:** 11 protons, 10 inner electrons (2,8). Net pull about $11 - 10 = +1$.
      - |
        **Chlorine:** 17 protons, also 10 inner electrons (2,8). Net pull about $17 - 10 = +7$.
      - |
        Same shielding, much bigger net pull. And chlorine's atom is smaller, so its bonding pair is closer too.
      - |
        Prediction: chlorine is far more electronegative. The Pauling values agree: 3.2 against 0.9.
    answer: |
      Chlorine: same shielding, much larger nuclear charge and smaller radius, so a much stronger pull on the bonding pair.

  - type: check
    title: The reason across
    questions: [across-reason]

  - type: explain
    title: "Down a group: why it decreases"
    body: |
      Take group 17: F 4.0, Cl 3.2, Br 3.0, I 2.7. Each step down:

      1. A **whole extra shell** is added, so **atomic radius increases**.
      2. More inner shells mean **more shielding**.
      3. Nuclear charge does increase, but the **greater distance and extra shielding outweigh it**.
      4. So the bonding pair is attracted **less strongly**: electronegativity falls.

  - type: intuition
    title: The extra protons are "paid for"
    body: |
      In the rough model, every halogen has the same net pull of +7: F is $9 - 2$, Cl is $17 - 10$, Br is $35 - 28$, I is $53 - 46$.

      So the one thing that really changes down the group is **distance**, and it keeps growing. Where the model breaks: shielding isn't perfect, so the real net pull isn't exactly +7. But the distance effect still wins.

  - type: check
    title: The reason down
    questions: [lithium-sodium, bromine-explain, diagonal-comparison]

  - type: misconceptions
    items:
      - wrong: Across a period, electronegativity increases because atoms get closer to a full outer shell.
        right: Atoms don't "want" anything. Nuclear charge rises while shielding stays about the same, so the radius shrinks and the bonding pair is attracted more strongly.
      - wrong: Down a group, the nuclear charge decreases.
        right: It **increases**. It's just outweighed by the greater distance and extra shielding.
      - wrong: Shielding increases across a period, because there are more electrons.
        right: The extra electrons go into the **same** shell, and electrons in the same shell shield each other very little. Shielding comes from inner shells.
      - wrong: Noble gases are the most electronegative, because they're furthest right.
        right: Helium, neon and argon have no Pauling values at all, because they form no stable compounds to measure.

  - type: exam
    body: |
      - "State **and explain**" means the trend plus the reason. The trend on its own won't earn the explanation marks.
      - Across a period, use three phrases: **nuclear charge increases**, **shielding similar**, **atomic radius decreases**. Then finish: "so stronger attraction for the bonding pair".
      - Down a group: **more shells**, **more shielding**, **greater distance**, and say these **outweigh** the increase in nuclear charge.

  - type: enrichment
    title: The gallium surprise
    body: |
      Down group 13, values go B 2.0, Al 1.6, then **Ga 1.8**. That's up, not down!

      Gallium comes just after the d block. Compared with aluminium it has 18 more protons, and 10 of the matching electrons sit in the full 3d sub-shell.

      That 3d sub-shell is an inner sub-shell, but it shields poorly. So gallium's outer electrons feel more of the nucleus than you'd expect.

  - type: takeaways
    items:
      - "Across a period, electronegativity increases: more nuclear charge, similar shielding, smaller radius."
      - "Down a group, it decreases: more shells, so greater distance and more shielding, which outweigh the extra nuclear charge."
      - "Fluorine (top right) is the most electronegative element."
      - "Always end with the attraction between the nucleus and the bonding pair."

questions:
  - id: most-electronegative
    format: mcq
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      Using only the trends (no data table), which of these elements is the **most** electronegative?
    options:
      - text: |
          Sulfur, S
        why: |
          Sulfur is in the same period as chlorine but further left, so it's less electronegative.
      - text: |
          Chlorine, Cl
        correct: true
        why: |
          Chlorine is above bromine (higher in group 17) and to the right of sulfur (same period). Both trends favour it.
      - text: |
          Selenium, Se
        why: |
          Selenium is below sulfur, so it's no more electronegative than sulfur, and sulfur loses to chlorine.
      - text: |
          Bromine, Br
        why: |
          Bromine is below chlorine in group 17, so it's less electronegative.
    explanation: |
      Chlorine is the furthest up and to the right of the four (Cl 3.2, Br 3.0, S 2.6, Se 2.6).

  - id: trend-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.3"]
    prompt: |
      Across a period, electronegativity {{1}}. Down a group, electronegativity {{2}}.
    blanks:
      - accept: ["increases", "increase", "goes up", "rises", "gets larger", "gets bigger"]
      - accept: ["decreases", "decrease", "goes down", "falls", "gets smaller"]
    explanation: |
      Up and to the right means more electronegative, so fluorine is the most electronegative element.

  - id: across-reason
    format: mcq
    difficulty: 2
    objectives: ["3.1.3", "3.1.2"]
    prompt: |
      Which statement best explains why electronegativity increases from sodium to chlorine across period 3?
    options:
      - text: |
          Nuclear charge increases while shielding stays about the same, so the atomic radius decreases and the bonding pair is attracted more strongly.
        correct: true
        why: |
          This has all three factors and links them to the attraction for the bonding pair.
      - text: |
          The atoms get closer to a full outer shell, so they want electrons more.
        why: |
          Atoms don't "want" anything. Examiners don't reward this.
      - text: |
          Shielding decreases across the period, so the outer electrons are less repelled.
        why: |
          Shielding stays about the same: the new electrons all go into the same (third) shell.
      - text: |
          Atomic radius increases across the period, so there is more room for electrons.
        why: |
          Atomic radius **decreases** across a period, and a larger radius would weaken the attraction anyway.
    explanation: |
      Across a period: more protons, same inner shells, smaller atoms, stronger attraction for the bonding pair.

  - id: lithium-sodium
    format: mcq
    difficulty: 2
    objectives: ["3.1.3", "3.1.2"]
    prompt: |
      Lithium (1.0) is more electronegative than sodium (0.9), even though sodium has more protons. Which is the best explanation?
    options:
      - text: |
          Sodium's bonding electrons are in a shell further from the nucleus and more shielded, which outweighs its extra protons.
        correct: true
        why: |
          More shells means a larger radius and more shielding. Together they outweigh the extra nuclear charge.
      - text: |
          Sodium has a smaller nuclear charge than lithium.
        why: |
          Sodium has 11 protons and lithium has 3, so sodium's nuclear charge is larger.
      - text: |
          Lithium has more inner electrons shielding its outer electron.
        why: |
          Lithium (2,1) has 2 inner electrons; sodium (2,8,1) has 10. Sodium is more shielded.
      - text: |
          Sodium atoms are smaller than lithium atoms.
        why: |
          Sodium has an extra shell, so its atoms are **larger**.
    explanation: |
      Down a group, extra shells add distance and shielding. That beats the extra protons, so electronegativity falls.

  - id: bromine-explain
    format: explain
    difficulty: 2
    objectives: ["3.1.3", "3.1.2"]
    prompt: |
      Explain why bromine is **less** electronegative than chlorine.
    model: |
      Bromine has more electron shells than chlorine, so its bonding pair is further from the nucleus (larger atomic radius) and is shielded by more inner shells. Bromine's nuclear charge is greater, but this is outweighed by the extra distance and shielding. So the attraction between bromine's nucleus and the bonding pair is weaker.
    keyPoints:
      - "Bromine has more shells, so the bonding pair is further from the nucleus (larger atomic radius)."
      - "Bromine has more inner shells, so more shielding."
      - "Bromine's greater nuclear charge is outweighed by the extra distance and shielding."
      - "So the nucleus attracts the bonding pair less strongly."
    explanation: |
      The same pattern explains the whole of group 17: F 4.0, Cl 3.2, Br 3.0, I 2.7.

  - id: diagonal-comparison
    format: mcq
    difficulty: 3
    objectives: ["3.1.3"]
    prompt: |
      The two trends can settle some comparisons but not others. Which comparison can **not** be decided from the trends alone?
    options:
      - text: |
          Nitrogen vs phosphorus
        why: |
          Same group (15), nitrogen higher up, so nitrogen is more electronegative.
      - text: |
          Nitrogen vs oxygen
        why: |
          Same period (2), oxygen further right, so oxygen is more electronegative.
      - text: |
          Oxygen vs chlorine
        correct: true
        why: |
          Oxygen is a period higher (favours O) but a group further left (favours Cl). The trends pull opposite ways, so you need the data: O 3.4, Cl 3.2.
      - text: |
          Fluorine vs sulfur
        why: |
          Fluorine is both higher up and further right than sulfur. Both trends favour fluorine.
    explanation: |
      When one element is higher **and** further left, the trends disagree. Then only the Pauling values can decide.
