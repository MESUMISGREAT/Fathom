id: dot-cross-single-covalent
subject: "9701"
topic: "3.7"
title: Building single covalent bonds with dots and crosses
summary: Show shared electron pairs in H₂, HCl, water, ammonia and other single-bond molecules.
order: 1
minutes: 4
objectives: ["3.7.1"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.7 learning outcome 1, including simple molecules from 3.4 and 3.5. All questions are original; no illustrative data are used.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can draw and read dot-and-cross diagrams for molecules that share single electron pairs.
  - type: explain
    title: Dots and crosses are a counting trick
    body: |
      Draw only the **outer-shell electrons**. Use dots for one atom and crosses for the other, so you can see where each electron came from.

      A **shared pair** sits between two atom symbols and counts for both atoms. The marks are just a bookkeeping trick: real electrons are not different shapes.
  - type: example
    title: Start with water
    problem: Draw a dot-and-cross diagram for H₂O.
    steps:
      - Oxygen has six outer electrons; each hydrogen has one.
      - Oxygen shares one electron with each hydrogen, making two O–H shared pairs.
      - Put the four remaining oxygen electrons in two lone pairs. Each hydrogen now shares a pair and has a full first shell.
    answer: Water has two O–H shared pairs and two lone pairs on oxygen.
  - type: diagram
    diagram: chem-dot-cross-single-bonds
    alt: Dot-and-cross examples show two shared pairs and two lone pairs on oxygen in water, and three shared pairs plus one lone pair on nitrogen in ammonia.
    caption: Dots and crosses mark which atom supplied each electron in a shared pair.
  - type: check
    title: Count the pairs
    questions: ["dot-single-hcl", "dot-single-water"]
  - type: explain
    title: Reuse the same idea
    body: |
      - H₂, Cl₂ and HCl each have one shared pair in their single bond. Each chlorine also has three lone pairs.
      - NH₃ has three N–H shared pairs and one lone pair on nitrogen; CH₄ has four C–H shared pairs.
      - In C₂H₆, each carbon makes three C–H bonds and one C–C bond. In C₂H₄, the C=C bond has two shared pairs; that double bond gets its own lesson.

      The same diagrams support the 3.5 shapes: CH₄ is tetrahedral, NH₃ is pyramidal and H₂O is bent. A dot-and-cross diagram counts electrons; it does not show the 3-D shape.
  - type: check
    title: Read a molecule
    questions: ["dot-single-ammonia", "dot-single-ethane", "dot-single-error"]
  - type: misconceptions
    items:
      - wrong: The shared pair belongs only to the atom whose dot appears in it.
        right: Both atoms count the shared pair in their outer shell.
      - wrong: Dot-and-cross diagrams show the 3-D shape.
        right: They show outer electrons; use the shape diagrams to show three-dimensional arrangement.
  - type: exam
    body: Count each atom's outer electrons first. Show every shared pair and any remaining lone pairs; hydrogen needs two electrons in its first shell, while other simple examples aim for eight.
  - type: takeaways
    items:
      - Dots and crosses show the origins of outer electrons.
      - A shared pair counts for both bonded atoms.
      - Show lone pairs as well as bonds; the diagram is not a 3-D shape drawing.
questions:
  - id: dot-single-hcl
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: In a dot-and-cross diagram of HCl, how many shared electron pairs are in the H–Cl bond?
    options:
      - text: One
        correct: true
        why: A single covalent bond is one shared pair.
      - text: Two
        why: Two shared pairs would be a double bond.
      - text: Three
        why: Three shared pairs would be a triple bond.
      - text: Zero
        why: H and Cl share one pair in their covalent bond.
    explanation: A single covalent bond is represented by one shared pair of electrons.
  - id: dot-single-water
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many lone pairs remain on the oxygen atom in a water molecule?
    options:
      - text: Two
        correct: true
        why: Oxygen starts with six outer electrons and shares one with each of two hydrogens.
      - text: Zero
        why: Oxygen has four outer electrons left after making two shared pairs.
      - text: One
        why: Four remaining electrons make two lone pairs, not one.
      - text: Four
        why: Lone pairs contain two electrons each.
    explanation: The two O–H bonds use two of oxygen's electrons; its other four make two lone pairs.
  - id: dot-single-ammonia
    format: cloze
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: An ammonia molecule has {{1}} shared N–H pairs and {{2}} lone pair on nitrogen.
    blanks:
      - accept: ["three", "3"]
      - accept: ["one", "1"]
    explanation: Nitrogen makes three N–H bonds and keeps one lone pair.
  - id: dot-single-ethane
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many shared pairs are in one ethane molecule, C₂H₆?
    options:
      - text: Seven
        correct: true
        why: Ethane has six C–H bonds and one C–C bond, each with one shared pair.
      - text: Six
        why: Six pairs are in the C–H bonds; there is also one C–C shared pair.
      - text: Eight
        why: Ethane has seven single bonds altogether.
      - text: Two
        why: Each carbon makes four single bonds, but the shared C?C bond is counted once for the molecule.
    explanation: One C–C bond plus six C–H bonds gives seven shared pairs in total.
  - id: dot-single-error
    format: spot-error
    difficulty: 3
    objectives: ["3.7.1"]
    prompt: A student draws a dot-and-cross diagram for CH₄. Which line contains the first error?
    lines:
      - Carbon has four outer-shell electrons and each hydrogen has one.
      - Carbon shares one electron with each of the four hydrogen atoms.
      - Each C–H bond is one shared pair, so carbon counts eight electrons around it.
      - Each hydrogen must have eight electrons in its first shell.
    errorLine: 4
    fix: Each hydrogen needs two electrons in its first shell, so one shared pair completes it.
    explanation: Hydrogen has only the first shell, which is full with two electrons; carbon has eight around it.
