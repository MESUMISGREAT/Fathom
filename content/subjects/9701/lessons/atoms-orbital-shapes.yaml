id: atoms-orbital-shapes
subject: "9701"
topic: "1.3"
title: Shapes of s and p orbitals
summary: s orbitals are spheres, p orbitals are dumbbells along the x, y and z axes, and how to sketch both in an exam.
order: 2
minutes: 3
objectives: ["1.3.8"]
prerequisites: [atoms-shells-subshells-orbitals]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.3, learning outcome 8). Diagram lobes follow
    r = R cos^1.5(φ), close to a real p-orbital boundary surface. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can describe and sketch the shapes of s and p orbitals.

  - type: explain
    title: s orbitals are spheres
    body: |
      - Every shell has **one s orbital**: 1s, 2s, 3s, 4s …
      - Each is **spherical**, with the nucleus at the centre.
      - Same shape every time, but **bigger as n increases**: 2s is larger than 1s, because its electrons are further from the nucleus on average.

  - type: explain
    title: p orbitals are dumbbells
    body: |
      - From n = 2 upwards, each shell has **three p orbitals** (there's no 1p).
      - Each is **dumbbell-shaped**: two lobes on opposite sides of the nucleus.
      - The three point along the **x, y and z axes**, at **90°** to each other, so they're called **$\text{p}_x$, $\text{p}_y$ and $\text{p}_z$**.
      - They have the same shape and energy; only their direction differs.

  - type: diagram
    diagram: chem-orbital-shapes
    alt: "Top row: the 1s orbital drawn as a small sphere and the 2s orbital as a larger sphere, each with the nucleus as a dot at the centre. Bottom row: three panels, each with x, y and z axes drawn in perspective. Each panel shows a 2p orbital as two teardrop-shaped lobes meeting at the nucleus: 2px along the x axis, 2py along the receding y axis, and 2pz along the vertical z axis."
    caption: |
      Boundary surfaces: each shape encloses the region where the electron spends most of its time.

  - type: check
    title: Quick check
    questions: [p-shape, compare-2s-3s]

  - type: intuition
    title: What the outline means
    body: |
      An electron doesn't have a fixed position, so we draw a **boundary surface**: the shape that contains the electron about 90–95% of the time.

      The two lobes of a p orbital are **one orbital**. An electron in it is found in either lobe; it isn't one electron per lobe.

  - type: explain
    title: How to sketch them in an exam
    body: |
      1. **s:** draw a circle with a dot (the nucleus) at the centre and label it, e.g. "1s".
      2. **p:** draw a set of axes. Draw two equal lobes along one axis, touching at the nucleus. Label it $\text{p}_x$, $\text{p}_y$ or $\text{p}_z$ to match the axis.
      3. **All three p orbitals:** draw them on one set of x, y, z axes, one pair of lobes along each axis.

  - type: check
    title: Shapes and sketches
    questions: [shape-cloze, smallest-n-p, describe-shapes]

  - type: misconceptions
    items:
      - wrong: "An electron in a p orbital travels in a figure-of-eight path."
        right: "There's no path. The dumbbell is the region where the electron is likely to be found."
      - wrong: "A p orbital has two lobes, so it holds one electron in each lobe."
        right: "It holds up to two electrons, and each one can be found in either lobe."
      - wrong: "2s and 1s have different shapes."
        right: "Both are spheres. 2s is just larger."

  - type: exam
    body: |
      - Sketch questions are usually 1–2 marks: the right shape, the nucleus at the centre, and labelled axes for p.
      - Use the words **spherical** (s) and **dumbbell-shaped** (p).
      - Keep the two p lobes the same size and on opposite sides of the nucleus.

  - type: takeaways
    items:
      - "s orbitals: spherical, nucleus at the centre, larger for larger n."
      - "p orbitals: dumbbell-shaped, two lobes either side of the nucleus."
      - "Three p orbitals per shell (from n = 2), along the x, y and z axes at 90° to each other."

questions:
  - id: p-shape
    format: mcq
    difficulty: 1
    objectives: ["1.3.8"]
    prompt: |
      Which describes the shape of a 2p orbital?
    options:
      - text: |
          Spherical, centred on the nucleus.
        why: |
          That's an s orbital.
      - text: |
          A flat ring around the nucleus.
        why: |
          No s or p orbital looks like this.
      - text: |
          Dumbbell-shaped: two lobes on opposite sides of the nucleus.
        correct: true
        why: |
          That's a p orbital, lying along one of the x, y or z axes.
      - text: |
          A figure-of-eight path that the electron travels along.
        why: |
          The outline looks a bit like a figure of eight, but an orbital is a region of space, not a path.
    explanation: |
      s = sphere; p = dumbbell along an axis.

  - id: compare-2s-3s
    format: mcq
    difficulty: 1
    objectives: ["1.3.8"]
    prompt: |
      How does a 3s orbital compare with a 2s orbital?
    options:
      - text: |
          It is the same shape (spherical) but larger.
        correct: true
        why: |
          All s orbitals are spheres; higher n means further out on average, so larger.
      - text: |
          It is the same size but a different shape.
        why: |
          The shape is the same; it's the size that changes.
      - text: |
          It is dumbbell-shaped, because the third shell is higher in energy.
        why: |
          Every s orbital is spherical, whatever the shell.
      - text: |
          It is smaller, because the third shell has more protons attracting it.
        why: |
          A higher shell is further from the nucleus, so the orbital is larger.
    explanation: |
      Every s orbital is a sphere, and it grows with n.

  - id: shape-cloze
    format: cloze
    difficulty: 1
    objectives: ["1.3.8"]
    prompt: |
      An s orbital is {{1}} in shape. The three p orbitals in a sub-shell point along the x, y and z axes, at {{2}}° to each other.
    blanks:
      - accept: ["spherical", "sphere-shaped", "sphere", "a sphere"]
      - accept: ["90", "ninety"]
    explanation: |
      s orbitals are spheres; $\text{p}_x$, $\text{p}_y$ and $\text{p}_z$ are at right angles (90°).

  - id: smallest-n-p
    format: numeric
    difficulty: 1
    objectives: ["1.3.8"]
    prompt: |
      What is the smallest value of the principal quantum number, n, for a shell that contains p orbitals?
    fields:
      - answer: 2
    explanation: |
      The first shell has only 1s. p orbitals start at n = 2 (2p).

  - id: describe-shapes
    format: explain
    difficulty: 2
    objectives: ["1.3.8"]
    prompt: |
      Describe the shapes of the s and p orbitals of the second shell, as you would to go with a sketch.
    model: |
      The 2s orbital is spherical, with the nucleus at its centre. There are three 2p orbitals; each is dumbbell-shaped, with two lobes on opposite sides of the nucleus. The three p orbitals lie along the x, y and z axes, at 90° to each other ($2\text{p}_x$, $2\text{p}_y$, $2\text{p}_z$).
    keyPoints:
      - "s orbital is spherical, with the nucleus at the centre"
      - "p orbital is dumbbell-shaped: two lobes either side of the nucleus"
      - "Three p orbitals, along the x, y and z axes"
      - "The p orbitals are at 90° (right angles) to each other"
    explanation: |
      Shape, position of the nucleus, number of p orbitals and their orientation are the four things to get in.
