id: chemical-formulas-ionic-equations
subject: "9701"
topic: "2.3"
title: "Ionic equations: kick out the spectators"
summary: How to turn a full equation into an ionic equation by splitting aqueous ionic substances and cancelling spectator ions, then checking atoms and charge.
order: 5
minutes: 5
objectives: ["2.3.2"]
prerequisites: [chemical-formulas-balancing-equations]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.2: ionic equations, which should
    not include spectator ions, with appropriate state symbols). Weak acids are mentioned
    only as a pointer to the acids topic. All equations were checked for atom and charge
    balance. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can write an **ionic equation** with state symbols, leaving out the **spectator ions**, and check that it balances in atoms and in charge.

  - type: explain
    title: Most of the ions are just watching
    body: |
      Mix silver nitrate solution with sodium chloride solution and a white solid appears instantly. But look at what actually changed: $\text{Ag}^+$ and $\text{Cl}^-$ grabbed each other. The $\text{Na}^+$ and $\text{NO}_3^-$ ions just floated about before and after, like the crowd at a football match.

      An **ionic equation** shows only the ions that react. The bystanders are left out.

  - type: definition
    term: Spectator ions
    body: |
      Ions that are present in the reaction mixture but take no part in the reaction. They are unchanged, appearing identically on both sides of the full ionic equation, so they are left out of the ionic equation.

  - type: diagram
    diagram: chem-chemical-formulas-spectator-ions
    alt: "Three beakers. The first holds AgNO3(aq), drawn as free Ag+ and NO3− ions. The second holds NaCl(aq), drawn as free Na+ and Cl− ions. An arrow labelled mix leads to a third beaker labelled after mixing: Na+ and NO3− ions are still free in the solution, while a pile of small squares at the bottom is labelled AgCl(s). Text below: spectator ions are Na+(aq) and NO3−(aq), unchanged before and after; ionic equation: Ag+(aq) + Cl−(aq) → AgCl(s). Only the ions that change appear in the ionic equation."
    caption: Na⁺ and NO₃⁻ are in the same state before and after. They're spectators.

  - type: explain
    title: The four steps
    body: |
      1. Write the **balanced full equation with state symbols**.
      2. **Split** every ionic substance that is **(aq)** into its ions. Strong acids count too: $\text{HCl(aq)}$ is $\text{H}^+\text{(aq)} + \text{Cl}^-\text{(aq)}$.
      3. **Cancel** ions that appear identically on both sides.
      4. **Check** that atoms balance **and total charge** is the same on both sides.

      **Don't split** solids (s), liquids (l) such as water, gases (g), or covalent molecules. They're not free ions.

  - type: example
    title: Silver chloride precipitate
    problem: |
      Write the ionic equation for silver nitrate solution reacting with sodium chloride solution.
    steps:
      - |
        Full equation: $\text{AgNO}_3\text{(aq)} + \text{NaCl(aq)} \rightarrow \text{AgCl(s)} + \text{NaNO}_3\text{(aq)}$
      - |
        Split the (aq) ionic substances, but **not** the solid AgCl:
        $\text{Ag}^+\text{(aq)} + \text{NO}_3^-\text{(aq)} + \text{Na}^+\text{(aq)} + \text{Cl}^-\text{(aq)} \rightarrow \text{AgCl(s)} + \text{Na}^+\text{(aq)} + \text{NO}_3^-\text{(aq)}$
      - |
        Cancel the spectators, $\text{Na}^+$ and $\text{NO}_3^-$, which appear on both sides.
      - |
        Check: one Ag and one Cl each side; charge $(+1) + (-1) = 0$ on the left, 0 on the right ✓
    answer: |
      $\text{Ag}^+\text{(aq)} + \text{Cl}^-\text{(aq)} \rightarrow \text{AgCl(s)}$

  - type: example
    title: Any acid + any alkali
    problem: |
      Write the ionic equation for hydrochloric acid neutralising sodium hydroxide solution.
    steps:
      - |
        Full: $\text{HCl(aq)} + \text{NaOH(aq)} \rightarrow \text{NaCl(aq)} + \text{H}_2\text{O(l)}$
      - |
        Split: $\text{H}^+ + \text{Cl}^- + \text{Na}^+ + \text{OH}^- \rightarrow \text{Na}^+ + \text{Cl}^- + \text{H}_2\text{O(l)}$ (water stays whole: it's a liquid).
      - |
        Cancel $\text{Na}^+$ and $\text{Cl}^-$.
    answer: |
      $\text{H}^+\text{(aq)} + \text{OH}^-\text{(aq)} \rightarrow \text{H}_2\text{O(l)}$. Swap in nitric acid and potassium hydroxide and you get the **same** ionic equation. That's the point of ionic equations: they show what really happens.

  - type: check
    title: Quick check
    questions: [barium-sulfate, spectators-nitric, neutralisation-cloze]

  - type: example
    title: Metals and charge balance
    problem: |
      Write the ionic equation for magnesium reacting with hydrochloric acid: $\text{Mg(s)} + 2\text{HCl(aq)} \rightarrow \text{MgCl}_2\text{(aq)} + \text{H}_2\text{(g)}$
    steps:
      - |
        Split the (aq) substances: $\text{Mg(s)} + 2\text{H}^+\text{(aq)} + 2\text{Cl}^-\text{(aq)} \rightarrow \text{Mg}^{2+}\text{(aq)} + 2\text{Cl}^-\text{(aq)} + \text{H}_2\text{(g)}$
      - |
        Cancel the $2\text{Cl}^-$.
      - |
        Check charge: left $2 \times (+1) = +2$; right $+2$ ✓
    answer: |
      $\text{Mg(s)} + 2\text{H}^+\text{(aq)} \rightarrow \text{Mg}^{2+}\text{(aq)} + \text{H}_2\text{(g)}$

  - type: check
    title: Charge and solids
    questions: [aluminium-acid, zinc-silver, marble-error]

  - type: misconceptions
    items:
      - wrong: "Split everything with ions in it, including solids: $\\text{CaCO}_3\\text{(s)}$ becomes $\\text{Ca}^{2+} + \\text{CO}_3^{2-}$."
        right: "Ions in a solid are locked in a lattice, not free. Only **(aq)** ionic substances are split."
      - wrong: "Balanced atoms means a balanced ionic equation."
        right: "The **total charge** must also match. $\\text{Zn} + \\text{Ag}^+ \\rightarrow \\text{Zn}^{2+} + \\text{Ag}$ has balanced atoms but +1 on the left and +2 on the right."
      - wrong: "Spectator ions should be shown, just to be complete."
        right: "The syllabus is explicit: ionic equations should **not** include spectator ions. Leaving them in loses the mark."

  - type: exam
    body: |
      - Ionic equations need **state symbols** unless told otherwise. A precipitate is always (s).
      - If the question says "ionic equation", no $\text{Na}^+$, $\text{K}^+$, $\text{NO}_3^-$ or similar bystanders should be left. Scan for any ion that appears on both sides.
      - Do the charge check out loud: "left +2, right +2". It catches more errors than any other habit.

  - type: deeper
    title: Not every acid splits completely
    body: |
      Strong acids such as HCl and $\text{HNO}_3$ are fully split into ions in water, so you write them as $\text{H}^+\text{(aq)}$. Weak acids such as ethanoic acid are mostly **molecules** in solution, so you'll see them written whole, e.g. $\text{CH}_3\text{COOH(aq)}$. You'll meet the strong/weak distinction properly in the acids and bases topic.

  - type: takeaways
    items:
      - "Spectator ions are present but unchanged; ionic equations leave them out."
      - "Split only (aq) ionic substances; keep (s), (l), (g) and molecules whole."
      - "Check atoms **and** total charge on both sides."
      - "Any strong acid + alkali: $\\text{H}^+\\text{(aq)} + \\text{OH}^-\\text{(aq)} \\rightarrow \\text{H}_2\\text{O(l)}$."

questions:
  - id: barium-sulfate
    format: mcq
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      Barium chloride solution reacts with sodium sulfate solution:

      $$\text{BaCl}_2\text{(aq)} + \text{Na}_2\text{SO}_4\text{(aq)} \rightarrow \text{BaSO}_4\text{(s)} + 2\text{NaCl(aq)}$$

      Which is the ionic equation?
    options:
      - text: |
          $\text{Ba}^{2+}\text{(aq)} + \text{SO}_4^{2-}\text{(aq)} \rightarrow \text{BaSO}_4\text{(s)}$
        correct: true
        why: |
          Only the ions that form the precipitate. Atoms and charge (0 each side) balance.
      - text: |
          $\text{Na}^+\text{(aq)} + \text{Cl}^-\text{(aq)} \rightarrow \text{NaCl(aq)}$
        why: |
          These are the spectator ions. Nothing happens to them.
      - text: |
          $\text{BaCl}_2\text{(aq)} + \text{SO}_4^{2-}\text{(aq)} \rightarrow \text{BaSO}_4\text{(s)} + 2\text{Cl}^-\text{(aq)}$
        why: |
          $\text{BaCl}_2\text{(aq)}$ should be split into ions, and then $\text{Cl}^-$ cancels as a spectator.
      - text: |
          $\text{Ba}^{2+}\text{(aq)} + \text{SO}_4^{2-}\text{(aq)} \rightarrow \text{BaSO}_4\text{(aq)}$
        why: |
          The right ions, but barium sulfate is a precipitate: (s).
    explanation: |
      Cancel $\text{Na}^+$ and $\text{Cl}^-$, and keep the solid whole.

  - id: spectators-nitric
    format: mcq
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      Which ions are **spectators** when nitric acid reacts with potassium hydroxide solution?

      $$\text{HNO}_3\text{(aq)} + \text{KOH(aq)} \rightarrow \text{KNO}_3\text{(aq)} + \text{H}_2\text{O(l)}$$
    options:
      - text: |
          $\text{K}^+$ and $\text{NO}_3^-$
        correct: true
        why: |
          They're (aq) ions on both sides, unchanged.
      - text: |
          $\text{H}^+$ and $\text{OH}^-$
        why: |
          These are the ions that react, forming water.
      - text: |
          $\text{K}^+$ only
        why: |
          $\text{NO}_3^-$ is also unchanged on both sides.
      - text: |
          all four ions
        why: |
          $\text{H}^+$ and $\text{OH}^-$ are used up to form $\text{H}_2\text{O}$, so they aren't spectators.
    explanation: |
      Ionic equation: $\text{H}^+\text{(aq)} + \text{OH}^-\text{(aq)} \rightarrow \text{H}_2\text{O(l)}$. Everything else is a spectator.

  - id: neutralisation-cloze
    format: cloze
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      Complete the ionic equation for a strong acid reacting with an alkali, including the state symbol: $\text{H}^+\text{(aq)} + \text{OH}^-\text{(aq)} \rightarrow$ {{1}}
    blanks:
      - accept: ["H2O(l)", "H₂O(l)", "H2O (l)", "H₂O (l)"]
    explanation: |
      Hydrogen ions and hydroxide ions combine to make water, a liquid: $\text{H}_2\text{O(l)}$.

  - id: aluminium-acid
    format: numeric
    difficulty: 3
    objectives: ["2.3.2"]
    prompt: |
      Balance this ionic equation with the smallest whole numbers:

      $$a\,\text{Al(s)} + b\,\text{H}^+\text{(aq)} \rightarrow c\,\text{Al}^{3+}\text{(aq)} + d\,\text{H}_2\text{(g)}$$
    fields:
      - label: "a ="
        answer: 2
      - label: "b ="
        answer: 6
      - label: "c ="
        answer: 2
      - label: "d ="
        answer: 3
    explanation: |
      Charge forces it: each $\text{Al}^{3+}$ needs $3\text{H}^+$, and $\text{H}_2$ comes in pairs of H. LCM of 3 and 2 is 6: $2\text{Al} + 6\text{H}^+ \rightarrow 2\text{Al}^{3+} + 3\text{H}_2$. Check: charge +6 = +6, H 6 = 6.

  - id: zinc-silver
    format: mcq
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |
      Zinc metal displaces silver from silver nitrate solution. Which is the correct ionic equation?
    options:
      - text: |
          $\text{Zn(s)} + \text{Ag}^+\text{(aq)} \rightarrow \text{Zn}^{2+}\text{(aq)} + \text{Ag(s)}$
        why: |
          Atoms balance, but charge doesn't: +1 on the left, +2 on the right.
      - text: |
          $\text{Zn(s)} + 2\text{Ag}^+\text{(aq)} \rightarrow \text{Zn}^{2+}\text{(aq)} + 2\text{Ag(s)}$
        correct: true
        why: |
          Atoms balance and charge balances (+2 each side). Nitrate is a spectator.
      - text: |
          $\text{Zn(s)} + 2\text{Ag}^+\text{(aq)} \rightarrow \text{Zn}^{2+}\text{(aq)} + \text{Ag}_2\text{(s)}$
        why: |
          Silver metal is written Ag, not $\text{Ag}_2$. Metals aren't diatomic.
      - text: |
          $\text{Zn}^{2+}\text{(aq)} + 2\text{Ag(s)} \rightarrow \text{Zn(s)} + 2\text{Ag}^+\text{(aq)}$
        why: |
          Balanced, but backwards: zinc metal is the reactant and silver metal is produced.
    explanation: |
      Two $\text{Ag}^+$ are needed to balance the 2+ charge of one $\text{Zn}^{2+}$.

  - id: marble-error
    format: spot-error
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |
      A student writes the ionic equation for marble (solid calcium carbonate) reacting with hydrochloric acid. Which line contains the first error?
    lines:
      - |
        Full: $\text{CaCO}_3\text{(s)} + 2\text{HCl(aq)} \rightarrow \text{CaCl}_2\text{(aq)} + \text{H}_2\text{O(l)} + \text{CO}_2\text{(g)}$
      - |
        Split the acid: $2\text{HCl(aq)} \rightarrow 2\text{H}^+\text{(aq)} + 2\text{Cl}^-\text{(aq)}$; split the product: $\text{CaCl}_2\text{(aq)} \rightarrow \text{Ca}^{2+}\text{(aq)} + 2\text{Cl}^-\text{(aq)}$
      - |
        Split the carbonate too: $\text{CaCO}_3 \rightarrow \text{Ca}^{2+} + \text{CO}_3^{2-}$
      - |
        Cancel $\text{Ca}^{2+}$ and $\text{Cl}^-$ from both sides.
      - |
        Ionic equation: $\text{CO}_3^{2-} + 2\text{H}^+ \rightarrow \text{H}_2\text{O(l)} + \text{CO}_2\text{(g)}$
    errorLine: 3
    fix: |
      $\text{CaCO}_3$ is a **solid**, so it stays whole. Only $\text{Cl}^-$ is a spectator: $\text{CaCO}_3\text{(s)} + 2\text{H}^+\text{(aq)} \rightarrow \text{Ca}^{2+}\text{(aq)} + \text{H}_2\text{O(l)} + \text{CO}_2\text{(g)}$.
    explanation: |
      Lines 1 and 2 are right. Splitting a solid makes $\text{Ca}^{2+}$ look like a spectator when it actually appears from the solid.
