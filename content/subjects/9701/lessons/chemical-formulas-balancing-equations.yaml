id: chemical-formulas-balancing-equations
subject: "9701"
topic: "2.3"
title: Balancing equations and state symbols
summary: How to balance a chemical equation by changing only the big numbers, a reliable order for doing it, and which state symbol goes where.
order: 4
minutes: 5
objectives: ["2.3.2"]
prerequisites: [chemical-formulas-writing-ionic-formulas]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.3, learning outcome 2.3.2: (a) writing and constructing
    balanced equations; (b) using appropriate state symbols). Ionic equations are in the
    next lesson. All equations were checked by atom count. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-23. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can balance a chemical equation using whole-number coefficients and add the correct **state symbols**: (s), (l), (g) and (aq).

  - type: explain
    title: Atoms don't vanish
    body: |
      In a chemical reaction, atoms are **rearranged**, never created or destroyed. So every atom on the left must turn up on the right. A balanced equation is chemistry's receipt: everything that goes in comes out.

      The rule that matters most: **change the big numbers in front (coefficients), never the small numbers inside a formula (subscripts).** Changing a subscript changes the substance. $\text{H}_2\text{O}$ is water; $\text{H}_2\text{O}_2$ is hydrogen peroxide, which you'd rather not drink.

  - type: diagram
    diagram: chem-chemical-formulas-balancing-particles
    alt: "Two rows of particle pictures. Top row: one H2 molecule plus one O2 molecule, an arrow, then one bent H2O molecule; below it H2 + O2 → H2O. A tally reads H: 2 → 2, O: 2 → 1, not balanced. Bottom row: two H2 molecules plus one O2 molecule, an arrow, then two H2O molecules; below it 2H2(g) + O2(g) → 2H2O(l). The tally reads H: 4 → 4, O: 2 → 2, balanced."
    caption: Balancing adds whole molecules. Each water molecule stays $\text{H}_2\text{O}$.

  - type: explain
    title: A method that works every time
    body: |
      1. Write the correct formula of every substance. Don't touch them again.
      2. Balance the elements that appear in **only one** substance on each side first (usually C, then H in combustions).
      3. Leave **elements on their own** (like $\text{O}_2$, $\text{H}_2$, Mg) until last: changing them doesn't mess anything else up.
      4. If you're forced into a half, double **every** coefficient.
      5. Count every element on both sides. Make sure the coefficients are the **smallest** whole numbers.

  - type: example
    title: Burning propane
    problem: |
      Balance the combustion of propane: $\text{C}_3\text{H}_8 + \text{O}_2 \rightarrow \text{CO}_2 + \text{H}_2\text{O}$
    steps:
      - |
        Carbon: 3 on the left, so $3\text{CO}_2$.
      - |
        Hydrogen: 8 on the left, so $4\text{H}_2\text{O}$.
      - |
        Oxygen last: the right now has $3 \times 2 + 4 \times 1 = 10$ O atoms, so $5\text{O}_2$.
      - |
        Count: C 3 = 3, H 8 = 8, O 10 = 10 ✓
    answer: |
      $\text{C}_3\text{H}_8 + 5\text{O}_2 \rightarrow 3\text{CO}_2 + 4\text{H}_2\text{O}$

  - type: example
    title: Ethane, and the half trick
    problem: |
      Balance $\text{C}_2\text{H}_6 + \text{O}_2 \rightarrow \text{CO}_2 + \text{H}_2\text{O}$ with whole numbers.
    steps:
      - |
        C: $2\text{CO}_2$. H: 6 atoms, so $3\text{H}_2\text{O}$.
      - |
        O on the right: $2 \times 2 + 3 = 7$, so you'd need $3\tfrac{1}{2}\,\text{O}_2$.
      - |
        Double everything to clear the half: $2\text{C}_2\text{H}_6 + 7\text{O}_2 \rightarrow 4\text{CO}_2 + 6\text{H}_2\text{O}$.
      - |
        Count: C 4, H 12, O 14 on each side ✓
    answer: |
      $2\text{C}_2\text{H}_6 + 7\text{O}_2 \rightarrow 4\text{CO}_2 + 6\text{H}_2\text{O}$

  - type: check
    title: Your turn
    questions: [balance-butane, balance-aluminium-oxide, subscript-error]

  - type: explain
    title: State symbols
    body: |
      | symbol | means | typical examples |
      | --- | --- | --- |
      | (s) | solid | metals, solid reactants, **precipitates** |
      | (l) | liquid | water at room temperature, molten substances, liquid bromine |
      | (g) | gas | $\text{H}_2$, $\text{O}_2$, $\text{CO}_2$, steam |
      | (aq) | **aqueous**: dissolved in water | acids, alkalis and salt solutions |

      Two that catch people out:

      - **Water itself is (l)**, never (aq). (aq) means "dissolved in water", and water can't dissolve in itself.
      - **Molten is (l), not (aq).** Molten sodium chloride is $\text{NaCl(l)}$; a solution of it is $\text{NaCl(aq)}$.

  - type: example
    title: Marble chips in acid
    problem: |
      Write a balanced equation, with state symbols, for solid calcium carbonate reacting with hydrochloric acid to form calcium chloride solution, water and carbon dioxide.
    steps:
      - |
        Formulas: $\text{CaCO}_3$, HCl, $\text{CaCl}_2$, $\text{H}_2\text{O}$, $\text{CO}_2$.
      - |
        Cl: two on the right, so $2\text{HCl}$. Then H: 2 = 2, O: 3 = 1 + 2, C: 1 = 1 ✓
      - |
        States: the marble is a solid; the acid and the calcium chloride are dissolved; water is a liquid; carbon dioxide fizzes off as a gas.
    answer: |
      $\text{CaCO}_3\text{(s)} + 2\text{HCl(aq)} \rightarrow \text{CaCl}_2\text{(aq)} + \text{H}_2\text{O(l)} + \text{CO}_2\text{(g)}$

  - type: check
    title: State symbols
    questions: [aqueous-symbol, sodium-water, precipitate-cloze]

  - type: misconceptions
    items:
      - wrong: "To balance oxygen in $\\text{Mg} + \\text{O}_2 \\rightarrow \\text{MgO}$, change the product to $\\text{MgO}_2$."
        right: "Never change a formula. Use coefficients: $2\\text{Mg} + \\text{O}_2 \\rightarrow 2\\text{MgO}$."
      - wrong: "Water in an equation is $\\text{H}_2\\text{O(aq)}$."
        right: "Pure water is a liquid: $\\text{H}_2\\text{O(l)}$."
      - wrong: "A coefficient only multiplies the first atom: $2\\text{H}_2\\text{O}$ has 2 H and 1 O."
        right: "It multiplies the **whole** formula: $2\\text{H}_2\\text{O}$ has 4 H and 2 O."

  - type: exam
    body: |
      - Questions often say "include state symbols". Then **every** species needs one, and a missing or wrong one can cost the mark even if the balancing is perfect.
      - Halves are fine where the question is about one mole of something (you'll see this in energetics: $\text{C}_2\text{H}_6 + 3\tfrac{1}{2}\text{O}_2$). If it asks for whole numbers, double.
      - Last step, always: tick off each element left and right. It takes ten seconds and saves the mark.

  - type: takeaways
    items:
      - "Balance with coefficients; never change subscripts."
      - "Do elements in one compound first, lone elements (like $\\text{O}_2$) last; double to clear halves."
      - "(s) solid and precipitates, (l) liquids including water and molten substances, (g) gases, (aq) dissolved in water."
      - "Finish by counting every element on both sides."

questions:
  - id: balance-butane
    format: numeric
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |
      Balance the complete combustion of butane, using the **smallest whole numbers**:

      $$a\,\text{C}_4\text{H}_{10} + b\,\text{O}_2 \rightarrow c\,\text{CO}_2 + d\,\text{H}_2\text{O}$$
    fields:
      - label: "a ="
        answer: 2
      - label: "b ="
        answer: 13
      - label: "c ="
        answer: 8
      - label: "d ="
        answer: 10
    explanation: |
      For one butane: $4\text{CO}_2$, $5\text{H}_2\text{O}$, so O on the right is $8 + 5 = 13$ atoms, needing $6\tfrac{1}{2}\,\text{O}_2$. Double everything: $2\text{C}_4\text{H}_{10} + 13\text{O}_2 \rightarrow 8\text{CO}_2 + 10\text{H}_2\text{O}$.

  - id: balance-aluminium-oxide
    format: numeric
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |
      Aluminium burns in oxygen to form aluminium oxide. Balance it with the smallest whole numbers:

      $$a\,\text{Al} + b\,\text{O}_2 \rightarrow c\,\text{Al}_2\text{O}_3$$
    fields:
      - label: "a ="
        answer: 4
      - label: "b ="
        answer: 3
      - label: "c ="
        answer: 2
    explanation: |
      O atoms: 2 on the left and 3 per $\text{Al}_2\text{O}_3$. LCM of 2 and 3 is 6, so $3\text{O}_2$ and $2\text{Al}_2\text{O}_3$. That's 4 Al: $4\text{Al} + 3\text{O}_2 \rightarrow 2\text{Al}_2\text{O}_3$.

  - id: subscript-error
    format: spot-error
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      A student balances the equation for sodium burning in chlorine. Which line contains the first error?
    lines:
      - |
        Unbalanced: $\text{Na} + \text{Cl}_2 \rightarrow \text{NaCl}$
      - |
        There are 2 Cl atoms on the left but only 1 on the right.
      - |
        Change the product to $\text{NaCl}_2$ so the chlorine balances.
      - |
        Balanced: $\text{Na} + \text{Cl}_2 \rightarrow \text{NaCl}_2$
    errorLine: 3
    fix: |
      Never change a formula ($\text{Na}^+$ and $\text{Cl}^-$ make NaCl). Use coefficients: $2\text{Na} + \text{Cl}_2 \rightarrow 2\text{NaCl}$.
    explanation: |
      Line 2 spots the problem correctly. Line 3 "fixes" it by inventing a compound that doesn't exist.

  - id: aqueous-symbol
    format: mcq
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      What is the correct state symbol for sodium chloride **dissolved in water**?
    options:
      - text: |
          (aq)
        correct: true
        why: |
          Aqueous means dissolved in water.
      - text: |
          (l)
        why: |
          (l) is for a pure liquid, such as water itself or **molten** sodium chloride.
      - text: |
          (s)
        why: |
          (s) is for solid sodium chloride, before it dissolves.
      - text: |
          (g)
        why: |
          Sodium chloride is nowhere near a gas at room temperature.
    explanation: |
      $\text{NaCl(aq)}$ is a solution; $\text{NaCl(l)}$ is molten; $\text{NaCl(s)}$ is the crystals.

  - id: sodium-water
    format: mcq
    difficulty: 2
    objectives: ["2.3.2"]
    prompt: |
      Sodium reacts with water to form sodium hydroxide solution and hydrogen gas. Which equation is fully correct?
    options:
      - text: |
          $2\text{Na(s)} + 2\text{H}_2\text{O(l)} \rightarrow 2\text{NaOH(aq)} + \text{H}_2\text{(g)}$
        correct: true
        why: |
          Balanced (2 Na, 4 H, 2 O each side), and every state symbol is right.
      - text: |
          $\text{Na(s)} + \text{H}_2\text{O(l)} \rightarrow \text{NaOH(aq)} + \text{H(g)}$
        why: |
          Balanced, but hydrogen gas is diatomic: it's $\text{H}_2$, not H.
      - text: |
          $2\text{Na(s)} + 2\text{H}_2\text{O(aq)} \rightarrow 2\text{NaOH(aq)} + \text{H}_2\text{(g)}$
        why: |
          Balanced, but water is a liquid, (l), not (aq).
      - text: |
          $\text{Na(s)} + \text{H}_2\text{O(l)} \rightarrow \text{NaOH(aq)} + \text{H}_2\text{(g)}$
        why: |
          Hydrogen doesn't balance: 2 H on the left, 3 on the right.
    explanation: |
      Correct formulas first ($\text{H}_2$), then balance, then states. Each distractor fails exactly one of those.

  - id: precipitate-cloze
    format: cloze
    difficulty: 1
    objectives: ["2.3.2"]
    prompt: |
      When silver nitrate solution is mixed with sodium chloride solution, a white precipitate of silver chloride forms, so silver chloride gets the state symbol {{1}}. The sodium nitrate stays dissolved, so it gets {{2}}.
    blanks:
      - accept: ["(s)", "s", "solid"]
      - accept: ["(aq)", "aq", "aqueous"]
    explanation: |
      A precipitate is an insoluble solid: (s). Anything still dissolved in water is (aq): $\text{AgNO}_3\text{(aq)} + \text{NaCl(aq)} \rightarrow \text{AgCl(s)} + \text{NaNO}_3\text{(aq)}$.
