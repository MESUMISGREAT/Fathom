id: kinetics-catalysis-types
subject: "9701"
topic: "8.3"
title: "Homogeneous and heterogeneous catalysis"
summary: "Same phase or different phase? That one difference decides how the catalyst meets the reactants, and what limits its performance."
order: 4
minutes: 7
kind: core
objectives: ["8.3.1"]
prerequisites: ["kinetics-catalysis-mechanism"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against 9701 syllabus topic 8.3 Homogeneous and heterogeneous catalysts. Distinguishes
    the two types, with the standard industrial examples; links back to 8.3.1 for the mechanism and
    Boltzmann explanations. All examples and questions are original. Re-checked line by line on
