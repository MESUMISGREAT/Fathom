blocks:
  - type: objective
    body: |
      By the end you can classify a catalyst as **homogeneous** or **heterogeneous**, describe how a
      solid catalyst works in terms of **adsorption**, and explain why surface area and **poisoning**
      matter.

  - type: explain
    title: Two ways for a catalyst to meet its reactants
    body: |
      A catalyst can only work where it meets the reactants. That gives two possibilities.

      - **Homogeneous catalysis:** the catalyst is in the **same phase** as the reactants. Everything
        is dissolved in one solution, or everything is gas, so the molecules mix at the molecular
        level.
      - **Heterogeneous catalysis:** the catalyst is in a **different phase**, almost always a solid
        catalyst with gaseous or liquid reactants. The reaction happens **on the surface** of the
        solid.

      The words are built from Greek: *homo* = same, *hetero* = different.

  - type: definition
    term: Homogeneous and heterogeneous catalysis
    body: |
      **Homogeneous catalysis:** the catalyst is in the same physical state as the reactants, for
      example $Fe^{2+}(aq)$ catalysing a reaction between two aqueous ions.

      **Heterogeneous catalysis:** the catalyst is in a different physical state from the reactants,
      for example iron solid catalysing the reaction of nitrogen and hydrogen gases.

  - type: diagram
    diagram: chem-catalysis-surface
    alt: >-
      A solid surface with reactant molecules A and B approaching it, then adsorbed side by side on
      the surface, then leaving as a joined product AB. The stages are labelled adsorption, reaction
      and desorption.
    caption: >-
      Heterogeneous catalysis in three stages: adsorb, react on the surface, desorb. The surface is
      left unchanged.

  - type: explain
    title: What happens on a solid surface
    body: |
      A heterogeneous catalyst works in three stages.

      1. **Adsorption.** Reactant molecules attach to the surface at **active sites**.
      2. **Reaction.** Held in place and with their bonds weakened by the surface, the molecules
         react through a lower-energy route.
      3. **Desorption.** The product molecules leave the surface, freeing the active sites.

      Because the reaction happens at the surface, only surface atoms count. A finely divided
      catalyst, or one spread over a support, has far more active sites per gram than a solid lump —
      which is why catalysts are used as powders or on honeycomb supports.

  - type: example
    title: Three industrial catalysts
    problem: |
      Classify each catalyst and say which phase each substance is in.

      (a) Iron in the Haber process:
      $\text{N}_2(g) + 3\text{H}_2(g) \rightleftharpoons 2\text{NH}_3(g)$.

      (b) Vanadium(V) oxide in the Contact process:
      $2\text{SO}_2(g) + \text{O}_2(g) \rightleftharpoons 2\text{SO}_3(g)$.

      (c) $Fe^{2+}(aq)$ ions catalysing the reaction between peroxodisulfate(VI) ions and iodide
      ions in solution.
    steps:
      - |
        In (a) the catalyst is solid iron and the reactants are gases: different phases, so
        **heterogeneous**.
      - |
        In (b) the catalyst is solid $V_2O_5$ and the reactants are gases: **heterogeneous**.
      - |
        In (c) the catalyst and both reactants are aqueous ions: same phase, so **homogeneous**.
      - |
        Notice that "solid catalyst, gaseous reactants" is the common industrial pattern, because a
        solid is easy to contain and separate from the product stream.
    answer: |
      (a) heterogeneous; (b) heterogeneous; (c) homogeneous.

  - type: deeper
    title: Why catalysts are poisoned, and why that matters
    body: |
      An **active site** is a particular patch of surface where adsorption is just right. If a
      strongly adsorbing impurity sticks there and does not leave, that site is lost. This is
      **catalyst poisoning**.

      Sulfur compounds poison the iron catalyst in the Haber process, which is why the gas mixture is
      purified first. Lead used to poison the platinum in car catalytic converters, which is one
      reason leaded petrol was phased out.

      Poisoning is not the same as the catalyst being "used up" in the reaction: the catalyst is
      still there, but part of its surface is blocked.

  - type: misconceptions
    items:
      - wrong: "Homogeneous means the catalyst is the same substance as the reactants."
        right: >-
          It means the same **phase** — same physical state. The catalyst is still a different
          substance.
      - wrong: "In heterogeneous catalysis the catalyst dissolves in the reactants."
        right: >-
          It stays as a separate solid phase; the reactants adsorb onto its surface.
      - wrong: "A catalyst works equally well as a large lump or a fine powder."
        right: >-
          Only surface atoms are active sites, so a powder with a much larger surface area is far
          more effective per gram.
      - wrong: "A poisoned catalyst has been used up in the reaction."
        right: >-
          It is still present chemically, but impurities are blocking its active sites.
      - wrong: "Enzymes are not catalysts because they are biological."
        right: >-
          Enzymes are catalysts — highly specific protein catalysts — and they work by the same
          principle of lowering activation energy.

  - type: exam
    body: |
      To classify, look at the **state symbols**: same state as the reactants means homogeneous;
      a solid with gases or solutions means heterogeneous.

      For heterogeneous catalysis, use the sequence **adsorption → reaction → desorption**, and refer
      to **active sites** and **surface area**.

      Common examples worth knowing: iron (Haber), vanadium(V) oxide (Contact), nickel
      (hydrogenation of alkenes), platinum/rhodium/palladium (catalytic converters).

  - type: check
    title: Check yourself
    questions: [classify-homogeneous, heterogeneous-stages]

  - type: check
    title: Examples and surface area
    questions: [name-a-solid-catalyst, surface-area-effect]

  - type: check
    title: Spot the error and explain
    questions: [types-error, poisoning-explain]

  - type: takeaways
    items:
      - "Homogeneous: catalyst in the same phase as the reactants."
      - "Heterogeneous: catalyst in a different phase, usually a solid with gases or solutions."
      - "A solid catalyst works by adsorption onto active sites, reaction, then desorption."
      - "Only the surface is active, so surface area matters and poisons that block sites reduce activity."

questions:
  - id: classify-homogeneous
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Which of these is an example of **homogeneous** catalysis?
    options:
      - text: |
          $Fe^{2+}(aq)$ ions speeding up a reaction between two aqueous ions.
        correct: true
        why: |
          Catalyst and reactants are all in aqueous solution — the same phase.
      - text: |
          Solid iron catalysing the reaction of nitrogen and hydrogen gases.
        why: |
          Solid catalyst with gaseous reactants is heterogeneous.
      - text: |
          Solid vanadium(V) oxide catalysing the oxidation of sulfur dioxide.
        why: |
          Solid catalyst, gaseous reactants: heterogeneous.
      - text: |
          Platinum in a car exhaust catalysing the reaction of exhaust gases.
        why: |
          Solid metal with gases: heterogeneous.
    explanation: |
      Homogeneous means the catalyst is in the same physical state as the reactants. Only the
      all-aqueous example qualifies.

  - id: heterogeneous-stages
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      In heterogeneous catalysis, what happens to the reactant molecules **first**?
    options:
      - text: |
          They are adsorbed onto active sites on the surface.
        correct: true
        why: |
          Adsorption holds the molecules in place and weakens their bonds, starting the catalysed
          route.
      - text: |
          They dissolve in the solid catalyst.
        why: |
          The catalyst is a separate solid phase; the molecules stay on its surface.
      - text: |
          They are converted into the catalyst.
        why: |
          The catalyst is not consumed; it is regenerated.
      - text: |
          They desorb from the surface.
        why: |
          Desorption is the last stage, when the products leave.
    explanation: |
      The sequence is adsorption, reaction on the surface, then desorption of the products.

  - id: name-a-solid-catalyst
    format: text
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Name **one** solid catalyst used in an industrial process, and state the process it is used
      in.
    style: short
    accept:
      - "iron in the Haber process"
      - "iron, Haber process"
      - "Fe in the Haber process"
      - "vanadium(V) oxide in the Contact process"
      - "vanadium pentoxide in the Contact process"
      - "V2O5 in the Contact process"
      - "nickel in the hydrogenation of alkenes"
      - "platinum in catalytic converters"
      - "rhodium in catalytic converters"
      - "platinum in a catalytic converter"
    model: |
      Iron (Fe) in the Haber process for ammonia; or vanadium(V) oxide ($V_2O_5$) in the Contact
      process for sulfur trioxide; or nickel in the hydrogenation of alkenes; or platinum/rhodium in
      catalytic converters.
    explanation: |
      Any correct catalyst–process pair earns the mark. All of these are solids used with gaseous or
      liquid reactants, so all are heterogeneous.

  - id: surface-area-effect
    format: mcq
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      A solid catalyst is used as a fine powder on a support rather than as one large pellet. Why is
      this faster?
    options:
      - text: |
          A larger surface area exposes more active sites, so more reactant molecules can adsorb per
          second.
        correct: true
        why: |
          Only surface atoms can act as active sites, so spreading the catalyst out increases the
          number available.
      - text: |
          Powdering the catalyst lowers its activation energy further.
        why: |
          $E_a$ depends on the mechanism, not on how the catalyst is divided up.
      - text: |
          The powder dissolves and becomes a homogeneous catalyst.
        why: |
          It stays solid; the reaction still happens on the surface.
      - text: |
          Smaller particles make the reaction more exothermic.
        why: |
          $\Delta H$ depends on reactants and products, not on particle size.
    explanation: |
      The rate of a heterogeneously catalysed reaction is limited by how fast molecules can reach
      active sites, so increasing the surface area increases the rate.

  - id: types-error
    format: spot-error
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      A student describes heterogeneous catalysis. One line is wrong.
    lines:
      - |
        In heterogeneous catalysis the catalyst is in a different phase from the reactants.
      - |
        The catalyst dissolves in the reaction mixture so that it can mix with the reactants.
      - |
        The reactants adsorb on active sites, react, and the products desorb.
    errorLine: 2
    fix: |
      The catalyst does not dissolve. It remains a separate solid phase, and the reactants adsorb
      onto its surface.
    explanation: |
      Dissolving would make the catalyst homogeneous. In heterogeneous catalysis the phases stay
      separate and the reaction happens at the surface.

  - id: poisoning-explain
    format: explain
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      Explain what is meant by catalyst poisoning, and why it reduces the rate of a heterogeneously
      catalysed reaction.
    model: |
      Poisoning happens when an impurity binds strongly to the active sites on the catalyst surface
      and is not released. Those sites can no longer adsorb reactant molecules, so the number of
      available active sites falls. With fewer sites, fewer reactant molecules can adsorb and react
      per second, so the rate decreases. The catalyst itself has not been used up; its surface has
      been blocked.
    keyPoints:
      - "An impurity binds strongly to the active sites."
      - "Blocked sites cannot adsorb reactant molecules."
      - "Fewer available active sites means fewer successful reaction events per second, so the rate falls."
      - "The catalyst is still present; it is blocked, not consumed."
    explanation: |
      Poison molecules occupy active sites without leaving, so reactants cannot adsorb there. Fewer
      working sites means fewer reaction events per second and a lower rate.
