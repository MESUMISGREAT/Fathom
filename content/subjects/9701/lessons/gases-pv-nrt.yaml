id: gases-pv-nrt
subject: "9701"
topic: "4.1"
title: "pV = nRT: the ideal gas equation"
summary: The ideal gas equation with every symbol and unit spelled out, a bulletproof unit routine, and three fully worked calculations.
order: 3
minutes: 5
objectives: ["4.1.3"]
prerequisites: [gases-ideal-gas-model]
