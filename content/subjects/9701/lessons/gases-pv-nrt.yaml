blocks:
  - type: objective
    body: |
      By the end you can state the ideal gas equation, convert every quantity into the right unit, and use it to find $p$, $V$, $n$ or $T$.

  - type: definition
    term: The ideal gas equation
    body: |
      $$pV = nRT$$

      - $p$ = pressure, in pascals ($\text{Pa}$) — or kilopascals ($\text{kPa}$), if you keep the units consistent (see below)
      - $V$ = volume, in cubic metres ($\text{m}^3$) or cubic decimetres ($\text{dm}^3$)
      - $n$ = amount of gas, in moles ($\text{mol}$)
      - $R$ = the molar gas constant, $8.31\ \text{J K}^{-1}\text{mol}^{-1}$
      - $T$ = thermodynamic temperature, in kelvin ($\text{K}$)

  - type: explain
    title: Why kelvin, and what is R?
    body: |
      **Kelvin** is the absolute temperature scale: $0\ \text{K}$ is the coldest anything can possibly be, and gas volume and pressure scale nicely from it. The conversion is simple:

      $$T(\text{K}) = T(^\circ\text{C}) + 273$$

      **$R$ is a fixed constant** that sets the scale between "how much gas" and "what $p$ and $V$ do". Its units look odd now; they make the two sides of $pV = nRT$ balance in joules.

  - type: intuition
    title: Two unit recipes that both work
    body: |
      The most common lost mark in gas calculations is a unit mismatch. There are two safe recipes:

      | recipe | pressure | volume | then $pV$ comes out in |
      | --- | --- | --- | --- |
      | **SI** | $\text{Pa}$ | $\text{m}^3$ | $\text{J}$ |
      | **chemist's** | $\text{kPa}$ | $\text{dm}^3$ | $\text{J}$ |

      Both work because $1\ \text{Pa m}^3 = 1\ \text{J}$ and $1\ \text{kPa dm}^3 = 1\ \text{J}$.

      Conversions you will need constantly:

      - $1\ \text{dm}^3 = 1000\ \text{cm}^3 = 0.001\ \text{m}^3$
      - $1\ \text{m}^3 = 10^{6}\ \text{cm}^3$
      - $1\ \text{kPa} = 1000\ \text{Pa}$

      Pick **one** recipe per question and convert everything to it before you calculate.

  - type: check
    title: Units and symbols
    questions: [equation-terms, kelvin-conversion]

  - type: example
    title: Finding the amount of gas, n
    problem: |
      A container holds $250\ \text{cm}^3$ of gas at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$. How many moles of gas are there? ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    steps:
      - 'List what you know, converting as you go: $V = 250\ \text{cm}^3 = 0.250\ \text{dm}^3$, $p = 100\ \text{kPa}$, $T = 25 + 273 = 298\ \text{K}$.'
      - 'Rearrange $pV = nRT$ for $n$: $n = \dfrac{pV}{RT}$.'
      - 'Substitute: $n = \dfrac{100 \times 0.250}{8.31 \times 298}$.'
      - 'Calculate the top and bottom first: $n = \dfrac{25.0}{2476}$.'
      - '$n = 0.0101\ \text{mol}$ (3 significant figures).'
    answer: "0.0101 mol"

  - type: example
    title: Finding the temperature, T
    problem: |
      $0.100\ \text{mol}$ of gas is held at $200\ \text{kPa}$ in a $2.00\ \text{dm}^3$ vessel. Find the temperature in $^\circ\text{C}$.
    steps:
      - 'List: $n = 0.100\ \text{mol}$, $p = 200\ \text{kPa}$, $V = 2.00\ \text{dm}^3$.'
      - 'Rearrange for $T$: $T = \dfrac{pV}{nR}$.'
      - 'Substitute: $T = \dfrac{200 \times 2.00}{0.100 \times 8.31} = \dfrac{400}{0.831}$.'
      - '$T = 481\ \text{K}$.'
      - 'The question asked for $^\circ\text{C}$, so convert back: $T = 481 - 273 = 208\ ^\circ\text{C}$.'
    answer: "208 °C (481 K)"

  - type: misconceptions
    items:
      - wrong: "Plug temperatures in degrees Celsius into $pV = nRT$."
        right: 'Always convert to **kelvin** first: $T(\text{K}) = T(^\circ\text{C}) + 273$. A Celsius value can even be negative, which would break the equation.'
      - wrong: 'Use $250\ \text{cm}^3$ directly as the volume.'
        right: 'Convert first: $250\ \text{cm}^3 = 0.250\ \text{dm}^3 = 0.000250\ \text{m}^3$. Mixing $\text{cm}^3$ into a $\text{kPa}$ recipe is off by a factor of 1000.'
      - wrong: 'The answer should always be in $\text{Pa}$ and $\text{m}^3$.'
        right: 'Both recipes are fine — $\text{kPa}$ with $\text{dm}^3$ is very common in chemistry — as long as you are **consistent**.'

  - type: check
    title: Full calculations
    questions: [n-from-pvt, p-from-nvt, t-from-pvn]

  - type: exam
    body: |
      - Write the **converted values with their units** before substituting. Examiners can award a method mark even if the arithmetic slips.
      - Show the rearrangement: $n = \dfrac{pV}{RT}$, $p = \dfrac{nRT}{V}$, $V = \dfrac{nRT}{p}$, $T = \dfrac{pV}{nR}$.
      - Give answers to **3 significant figures** unless the data has fewer.
      - If a question gives $\text{cm}^3$, convert to $\text{dm}^3$ (divide by 1000) or $\text{m}^3$ (divide by $10^6$) — do this **before** multiplying.

  - type: takeaways
    items:
      - '$pV = nRT$, with $R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$.'
      - 'Temperature is always in kelvin: $T(\text{K}) = T(^\circ\text{C}) + 273$.'
      - 'Use $\text{Pa}$ with $\text{m}^3$, or $\text{kPa}$ with $\text{dm}^3$ — never mix the recipes.'
      - "Rearrange first, substitute second, and give the answer to 3 significant figures."

questions:
  - id: equation-terms
    format: cloze
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      In the ideal gas equation $pV = nRT$, the symbol $n$ stands for the amount of gas in {{1}}, and $T$ is the thermodynamic temperature in {{2}}.
    blanks:
      - accept: ["moles", "mol", "mole", "the mole"]
      - accept: ["kelvin", "K", "kelvins", "degrees kelvin"]
    explanation: |
      $n$ is the amount in moles and $T$ is the absolute (thermodynamic) temperature in kelvin.

  - id: kelvin-conversion
    format: numeric
    difficulty: 1
    objectives: ["4.1.3"]
    prompt: |
      Convert $27\ ^\circ\text{C}$ to kelvin.
    fields:
      - answer: 300
        unit: K
    explanation: |
      $T(\text{K}) = 27 + 273 = 300\ \text{K}$.

  - id: n-from-pvt
    format: numeric
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      A gas occupies $250\ \text{cm}^3$ at $100\ \text{kPa}$ and $25\ ^\circ\text{C}$. Calculate the amount of gas, in mol, to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 0.0101
        tolerance: { rel: 0.01 }
        sigFigs: 3
        unit: mol
    explanation: |
      $V = 0.250\ \text{dm}^3$, $T = 298\ \text{K}$. $n = \dfrac{pV}{RT} = \dfrac{100 \times 0.250}{8.31 \times 298} = 0.0101\ \text{mol}$.

  - id: p-from-nvt
    format: numeric
    difficulty: 2
    objectives: ["4.1.3"]
    prompt: |
      $0.250\ \text{mol}$ of gas occupies $5.00\ \text{dm}^3$ at $27\ ^\circ\text{C}$. Calculate the pressure, in kPa, to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 125
        tolerance: { rel: 0.01 }
        sigFigs: 3
        unit: kPa
    explanation: |
      $T = 300\ \text{K}$. $p = \dfrac{nRT}{V} = \dfrac{0.250 \times 8.31 \times 300}{5.00} = 125\ \text{kPa}$ (124.65 rounds to 125).

  - id: t-from-pvn
    format: numeric
    difficulty: 3
    objectives: ["4.1.3"]
    prompt: |
      $0.100\ \text{mol}$ of gas is held at $200\ \text{kPa}$ in a $2.00\ \text{dm}^3$ vessel. Calculate the temperature in $^\circ\text{C}$, to 3 significant figures. ($R = 8.31\ \text{J K}^{-1}\text{mol}^{-1}$)
    fields:
      - answer: 208
        tolerance: { rel: 0.01 }
        sigFigs: 3
        unit: "°C"
    explanation: |
      $T = \dfrac{pV}{nR} = \dfrac{200 \times 2.00}{0.100 \times 8.31} = 481\ \text{K}$, then $481 - 273 = 208\ ^\circ\text{C}$. The final subtraction is the classic forgotten step.
