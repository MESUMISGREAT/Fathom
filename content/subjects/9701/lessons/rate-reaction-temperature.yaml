id: rate-reaction-temperature
subject: "9701"
topic: "8.2"
title: How temperature changes the rate
summary: Two effects at once — more frequent collisions and a much larger fraction with enough energy — and why the second dominates.
order: 2
minutes: 6
kind: core
objectives: ["8.2.3"]
prerequisites: [activation-energy-boltzmann]
