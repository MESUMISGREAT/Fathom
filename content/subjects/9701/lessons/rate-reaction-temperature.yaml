blocks:
  - type: objective
    body: |
      By the end you can explain, using **both** the Boltzmann distribution and collision frequency, why raising the temperature increases the rate of a reaction.

  - type: explain
    title: Two things change at once
    body: |
      Raising the temperature does two separate things to the particles.

      **1. They move faster.** Higher temperature means higher average kinetic energy, so particles travel faster and collide more often. The frequency of collisions increases.

      **2. The energy distribution shifts.** The Boltzmann curve becomes broader and its peak moves to higher energy. Far more molecules now have energy at least equal to $E_a$.

      Both effects increase the rate, but they are not equally important. The second one dominates, because the high-energy tail of the distribution grows very rapidly with temperature.

  - type: diagram
    diagram: chem-rate-reaction-temperature-curves
    alt: Two Boltzmann distribution curves at a lower and a higher temperature, with the activation energy marked. The higher-temperature curve has a lower, broader peak shifted to the right, and the shaded area beyond the activation energy is much larger than at the lower temperature.
    caption: |
      At the higher temperature, the curve is flatter and shifted right. The area beyond $E_a$, which represents the molecules that can react, grows substantially.

  - type: explain
    title: Why the tail matters so much
    body: |
      The Boltzmann tail is not a straight line; it falls away steeply. A small shift to the right can multiply the small number of molecules in the tail.

      Suppose, for illustration, that at 300 K about 1 in 100 molecules has enough energy to react. At 310 K, the fraction might be around 2 or 3 in 100. The number of collisions has increased only slightly, because the particles are only a little faster. But the number of **effective** collisions has roughly doubled or tripled.

      This is why a modest temperature rise, such as 10 K, can produce a large increase in rate. It is not mainly because particles collide more often; it is because a much larger fraction of collisions now has enough energy.

      The activation energy itself does not change with temperature. What changes is how many molecules can clear that barrier.

  - type: example
    title: Explaining a classroom observation
    problem: |
      Two identical mixtures of marble chips and hydrochloric acid are prepared. One is kept at 20 °C and the other at 30 °C. The 30 °C mixture reacts noticeably faster. Explain fully.
    steps:
      - |
        At the higher temperature, the acid particles and the particles at the marble surface have greater average kinetic energy.
      - |
        They move faster, so they collide more frequently. This is the first effect.
      - |
        More importantly, the Boltzmann distribution at 30 °C has a much larger fraction of particles with energy at least $E_a$.
      - |
        So a much larger fraction of collisions is effective, not just a slightly larger number of collisions.
      - |
        More effective collisions per second means the marble is used up faster: the rate is higher.
      - |
        The total amounts are the same, so the final yield is unchanged; only the speed differs.
    answer: |
      Higher temperature increases both collision frequency and, much more importantly, the fraction of collisions with enough energy to react.

  - type: misconceptions
    items:
      - wrong: Raising the temperature increases the rate only because particles collide more often.
        right: |
          Collision frequency does increase, but that is a small effect. The dominant effect is the much larger fraction of molecules with energy at least $E_a$.
      - wrong: Raising the temperature lowers the activation energy.
        right: |
          $E_a$ is a property of the reaction and does not change with temperature. The distribution of molecular energies changes instead, so more molecules exceed the same barrier.
      - wrong: At a higher temperature, every molecule has more energy than the activation energy.
        right: |
          The whole distribution shifts, but most molecules still have less than $E_a$. The reacting fraction is larger, not universal.
      - wrong: Temperature and concentration affect rate in the same way.
        right: |
          Concentration increases the **number of collisions**. Temperature increases collision frequency **and** the fraction of collisions that are effective. That is why temperature usually has the larger effect.

  - type: exam
    body: |
      - A complete answer mentions **both** effects: more frequent collisions and a larger fraction of molecules with energy at least $E_a$.
      - Then say which matters more: the increased fraction of effective collisions, because the Boltzmann tail grows rapidly.
      - Refer to the **Boltzmann distribution** by name and describe the change: broader curve, peak at higher energy, larger area beyond $E_a$.
      - Do not say the activation energy decreases. Only a catalyst does that.
      - If the question gives a small temperature rise with a large rate increase, use the tail argument to explain why.

  - type: takeaways
    items:
      - Higher temperature increases the average kinetic energy of the particles.
      - Particles collide more frequently, which increases the rate.
      - The Boltzmann curve broadens and shifts right, so a much larger fraction has energy at least Ea.
      - The increased fraction of effective collisions is the dominant reason for the rate increase.
      - Activation energy does not change with temperature.

  - type: check
    title: The two effects
    questions: [main-reason, curve-change, ea-unchanged]

  - type: check
    title: Explain it
    questions: [temperature-explanation, spot-the-error, temperature-vs-concentration, catalyst-or-temperature]

questions:
  - id: main-reason
    format: mcq
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      Why does a small increase in temperature often produce a large increase in reaction rate?
    options:
      - text: The fraction of molecules with energy at least the activation energy increases substantially
        correct: true
        why: |
          The high-energy tail of the Boltzmann distribution grows rapidly, so many more collisions are effective.
      - text: Every molecule gains exactly enough energy to react
        why: |
          The distribution shifts, but most molecules still have less than Ea. Only the fraction above the barrier grows.
      - text: The activation energy falls
        why: |
          Activation energy is unchanged by temperature; a catalyst is what lowers it.
      - text: The concentration of the reactants increases
        why: |
          Heating a closed mixture does not add reactant particles. The concentration may even fall slightly as the mixture expands.
    explanation: |
      The dominant effect is the much larger fraction of molecules able to clear the activation barrier.

  - id: curve-change
    format: mcq
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      How does the Boltzmann distribution change when the temperature is raised?
    options:
      - text: The peak becomes lower and moves to higher energy, and the curve becomes broader
        correct: true
        why: |
          The molecules are spread over a wider range of energies, so the peak falls and shifts right, and the tail extends further.
      - text: The peak becomes higher and moves to lower energy
        why: |
          That would mean more molecules at low energy, which is the opposite of heating.
      - text: The whole curve shifts right without changing shape
        why: |
          The distribution broadens as well as shifting; it is not a rigid translation.
      - text: The curve becomes a single vertical line at the average energy
        why: |
          Molecules never all have the same energy; the spread remains, and in fact widens.
    explanation: |
      Higher temperature broadens the distribution and shifts its peak to higher energy, while lowering the peak.

  - id: ea-unchanged
    format: mcq
    difficulty: 1
    objectives: ["8.2.3"]
    prompt: |
      What happens to the activation energy of a reaction when the temperature is increased?
    options:
      - text: It stays the same
        correct: true
        why: |
          Activation energy is a property of the reaction pathway, not of the temperature.
      - text: It decreases
        why: |
          Lowering the activation energy is what a catalyst does, not what heating does.
      - text: It increases
        why: |
          Heating does not make the barrier higher; it gives more molecules enough energy to clear the same barrier.
      - text: It becomes equal to the average kinetic energy
        why: |
          The barrier and the average energy are separate quantities and are not generally equal.
    explanation: |
      Temperature changes the distribution of energies, not the height of the barrier.

  - id: temperature-explanation
    format: explain
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      Explain, in terms of collision theory and the Boltzmann distribution, why increasing the temperature increases the rate of a reaction.
    model: |
      Increasing the temperature increases the average kinetic energy of the particles, so they move faster and collide more frequently. This increases the total number of collisions per second. More importantly, the Boltzmann distribution shifts to higher energies and becomes broader, so a much larger fraction of molecules has energy at least equal to the activation energy. Therefore a much larger fraction of collisions is effective, not merely a slightly larger number. The increase in effective collisions per second is the main reason the rate rises. The activation energy itself is unchanged.
    keyPoints:
      - Particles have greater average kinetic energy and collide more frequently
      - The Boltzmann distribution shifts to higher energy and broadens
      - A much larger fraction of molecules has energy at least Ea
      - More effective collisions per second, which is the dominant effect
      - The activation energy is unchanged
    explanation: |
      Both effects must appear, with the increased fraction of effective collisions identified as the more important one.

  - id: spot-the-error
    format: spot-error
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      A student explains the effect of temperature. Which line contains the first error?
    lines:
      - "Heating gives the particles a greater average kinetic energy."
      - "They collide more frequently, which increases the rate."
      - "Heating also lowers the activation energy, so more collisions are effective."
      - "The Boltzmann distribution shifts so that a larger fraction has energy above the activation energy."
      - "The increased fraction of effective collisions is the main reason for the faster rate."
    errorLine: 3
    fix: |
      Heating does **not** lower the activation energy. It shifts the distribution so that more molecules have enough energy to clear the same barrier. Lowering $E_a$ is the job of a catalyst.
    explanation: |
      Confusing the effect of temperature with the effect of a catalyst is a classic error.

  - id: temperature-vs-concentration
    format: mcq
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      Which statement best contrasts the effects of increasing concentration and increasing temperature?
    options:
      - text: Concentration increases the number of collisions; temperature increases both the number and the fraction that are effective
        correct: true
        why: |
          Concentration crowds more particles together, while temperature also shifts the energy distribution above Ea.
      - text: Both affect the rate only by changing the number of collisions
        why: |
          Temperature also changes the fraction of collisions with enough energy, which concentration does not.
      - text: Concentration changes the activation energy; temperature does not
        why: |
          Neither concentration nor temperature changes the activation energy.
      - text: Temperature increases the yield; concentration increases the rate
        why: |
          Neither statement is generally true. Rate and yield are separate ideas, and both factors mainly affect rate.
    explanation: |
      Temperature has an extra effect: it changes the fraction of molecules with enough energy, not just how often they meet.

  - id: catalyst-or-temperature
    format: mcq
    difficulty: 2
    objectives: ["8.2.3"]
    prompt: |
      A reaction is sped up by adding a catalyst rather than by heating. Which statement is correct?
    options:
      - text: The catalyst lowers the activation energy, while heating leaves it unchanged but increases the fraction of molecules above it
        correct: true
        why: |
          These are different mechanisms with the same visible result: a faster rate.
      - text: Both the catalyst and heating lower the activation energy
        why: |
          Heating does not lower the activation energy.
      - text: The catalyst raises the temperature of the mixture
        why: |
          A catalyst provides an alternative pathway; it does not need to raise the temperature.
      - text: The catalyst increases the total number of molecules
        why: |
          A catalyst is not used up and does not change the amount of reactant.
    explanation: |
      A catalyst lowers the barrier; heating increases the fraction of molecules that can clear the existing barrier.
