blocks:
  - type: objective
    body: |-
      By the end you can predict how a change in temperature moves an equilibrium, explain why a catalyst does not move it at all, and say which of the two changes the value of the equilibrium constant.

  - type: explain
    title: Temperature is different
    body: |-
      Pressure and concentration change how much of each substance is present. Temperature changes the **energy** the particles have, and that is a different kind of lever.

      Heating a mixture speeds up **both** the forward and the reverse reaction. The question is which one gains more.

  - type: definition
    term: Temperature rule
    body: |-
      Raising the temperature always favours the **endothermic** direction.

      Lowering the temperature always favours the **exothermic** direction.

      You can remember it from the principle itself: heating adds energy, and the system minimises that change by absorbing energy — which is exactly what an endothermic reaction does.

  - type: explain
    title: Why the endothermic direction wins
    body: |-
      Both reactions speed up when heated, because more particles have enough energy to react. But the endothermic reaction needs a bigger share of that extra energy, so its rate grows by the larger factor.

      With the endothermic reaction now faster than the exothermic one, the position of equilibrium moves in the endothermic direction.

      This is why temperature is the only change that alters the **value** of $K_c$ or $K_p$.

  - type: diagram
    diagram: chem-equilibria-temperature-energy-profile
    alt: >-
      An energy-level diagram for an exothermic reversible reaction. Reactants sit higher than
      products, with the forward activation energy marked between reactants and the peak, and the
      reverse activation energy marked between products and the peak, which is larger. A note says
      that raising the temperature favours the reverse, endothermic direction because it needs the
      larger activation energy, and that the forward reaction is exothermic with a negative
      enthalpy change.
    caption: |-
      The reverse reaction has the larger activation energy, so heating helps it more than it helps the forward reaction.

  - type: example
    title: "Worked example: heating nitrogen dioxide"
    problem: |-
      Dinitrogen tetroxide dissociates endothermically:

      $$2\text{NO}_2(g) \rightleftharpoons \text{N}_2\text{O}_4(g) \qquad \Delta H = -57\ \text{kJ mol}^{-1}$$

      A sealed tube of the equilibrium mixture is placed in a beaker of hot water. Predict the colour change, and state what happens to the value of $K_c$.
    steps:
      - |-
        Read the sign of $\Delta H$: it is negative **for the forward direction**, so the forward reaction is exothermic and the reverse reaction is endothermic.
      - |-
        Heating favours the endothermic direction, so the position of equilibrium shifts **left**.
      - |-
        Shifting left converts colourless $\text{N}_2\text{O}_4$ into brown $\text{NO}_2$, so the mixture becomes **darker brown**.
      - |-
        The equilibrium amounts have changed in a way that no concentration change could produce on its own, so $K_c$ itself has **decreased**.
    answer: |-
      The mixture becomes darker brown as the equilibrium shifts left. $K_c$ decreases, because the temperature has risen and the forward reaction is exothermic.

  - type: intuition
    title: Do not confuse this with the rate
    body: |-
      A heated mixture reaches its new equilibrium **faster** than a cold one, because every reaction is faster when hot.

      But the *final* mixture is different too. Rate tells you how quickly equilibrium arrives; temperature changes where that equilibrium sits.

  - type: explain
    title: What a catalyst does
    body: |-
      A **catalyst** provides an alternative pathway with a **lower activation energy**. Both the forward and the reverse reaction use the same pathway, so both speed up by the same factor.

      Consequences, and every one of them is examinable:

      - Equilibrium is reached **sooner**.
      - The **position** of equilibrium does not change.
      - The **value** of $K_c$ or $K_p$ does not change.
      - The **yield** at equilibrium is unchanged.

      A catalyst is a time-saver, not a yield-improver. If a reaction has a poor equilibrium yield, a catalyst will not fix it.

  - type: intuition
    title: Why both directions must speed up equally
    body: |-
      A catalyst lowers the energy barrier between reactants and products; it does not change the energies of the reactants or products themselves.

      Since the barrier is lowered by the same amount in both directions, a molecule crossing from left to right is helped exactly as much as one crossing back. The balance point cannot move.

  - type: misconceptions
    items:
      - wrong: |-
          A catalyst increases the equilibrium yield because it speeds up the forward reaction.
        right: |-
          It speeds up the forward **and** reverse reactions equally, so the position of equilibrium is unchanged.
      - wrong: |-
          Raising the temperature always increases the yield, because reactions go faster when hot.
        right: |-
          Heating favours the endothermic direction. For an exothermic forward reaction, the yield of product **falls**.
      - wrong: |-
          A catalyst increases the value of $K_c$ because more product forms.
        right: |-
          $K_c$ depends only on temperature. A catalyst leaves it exactly where it was.
      - wrong: |-
          Lowering the temperature increases the rate of the exothermic reaction.
        right: |-
          Lowering the temperature slows both reactions; it merely slows the endothermic one more, so the equilibrium shifts towards the exothermic products.
      - wrong: |-
          If the forward reaction is exothermic, heating shifts the equilibrium right because heat is a product.
        right: |-
          Treating heat as a product gives the right answer only if you apply it correctly: extra heat shifts the equilibrium **away** from the side that produces heat, i.e. left.

  - type: exam
    body: |-
      - Say **"the endothermic direction is favoured"**, then name it: "the reverse reaction is endothermic, so the equilibrium shifts to the left".
      - For a catalyst, give the full package: **faster rate, same position, same $K$, same yield**.
      - Never say a catalyst "increases the yield" or "moves the equilibrium". Both lose marks.
      - If a question asks for a **colour** change, say which species causes it and how its amount changes.
      - Distinguish clearly between "reaches equilibrium faster" and "more product at equilibrium" — they are different marks.

  - type: check
    title: Checking the idea
    questions: [eq3-mcq-exothermic, eq3-mcq-catalyst, eq3-cloze-temperature, eq3-mcq-compromise]

  - type: check
    title: End-of-lesson check
    questions: [eq3-mcq-endothermic, eq3-spot-error-catalyst, eq3-explain-temperature]

  - type: takeaways
    items:
      - Raising the temperature favours the endothermic direction; lowering it favours the exothermic direction.
      - Temperature is the only change that alters the value of $K_c$ or $K_p$.
      - A catalyst lowers the activation energy for both directions equally.
      - A catalyst shortens the time to reach equilibrium but leaves the position and the yield unchanged.
      - Rate and position of equilibrium are separate ideas; keep them separate in your answers.

questions:
  - id: eq3-mcq-exothermic
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      For the equilibrium

      $$2\text{SO}_2(g) + \text{O}_2(g) \rightleftharpoons 2\text{SO}_3(g) \qquad \Delta H = -197\ \text{kJ mol}^{-1}$$

      what is the effect of raising the temperature at constant pressure?
    options:
      - text: The equilibrium shifts to the left, because the reverse reaction is endothermic.
        correct: true
        why: |-
          Heating favours the endothermic direction, which here is the reverse reaction.
      - text: The equilibrium shifts to the right, because a higher temperature means a faster reaction.
        why: |-
          Both directions speed up; the position moves towards the endothermic direction, which is the left.
      - text: The position is unchanged, but the value of $K_c$ falls.
        why: |-
          If $K_c$ falls, the position must shift left — the two statements cannot be separated like this.
      - text: The position is unchanged, because temperature affects only the rate.
        why: |-
          Temperature is precisely the change that alters both the rate and the position.
    explanation: |-
      The forward reaction is exothermic, so the reverse is endothermic and is favoured by heating; the equilibrium shifts left and the value of $K_c$ falls.

  - id: eq3-mcq-endothermic
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      Dinitrogen tetroxide dissociates endothermically:

      $$2\text{NO}_2(g) \rightleftharpoons \text{N}_2\text{O}_4(g) \qquad \Delta H = -57\ \text{kJ mol}^{-1}$$

      The equilibrium mixture is brown because of $\text{NO}_2$. It is cooled in ice water. What is observed?
    options:
      - text: The mixture becomes paler, because the equilibrium shifts right.
        correct: true
        why: |-
          Cooling favours the exothermic direction, which is the forward reaction making colourless $\text{N}_2\text{O}_4$.
      - text: The mixture becomes darker, because cooling shifts the equilibrium left.
        why: |-
          Cooling favours the exothermic direction, and the forward reaction is the exothermic one, so the shift is right.
      - text: The colour does not change, because temperature only affects the rate.
        why: |-
          Temperature changes the position as well as the rate, so the colour must change.
      - text: The colour disappears completely, because all the $\text{NO}_2$ is used up.
        why: |-
          A shift reduces the amount of $\text{NO}_2$; it does not remove it, since equilibrium still contains all species.
    explanation: |-
      Cooling favours the exothermic forward reaction, converting brown $\text{NO}_2$ into colourless $\text{N}_2\text{O}_4$, so the mixture pales.

  - id: eq3-mcq-catalyst
    format: mcq
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      An equilibrium mixture of $\text{N}_2$, $\text{H}_2$ and $\text{NH}_3$ is left unchanged except that an iron catalyst is added. Which statement is correct?
    options:
      - text: The mixture reaches equilibrium sooner, and the equilibrium amounts are unchanged.
        correct: true
        why: |-
          A catalyst lowers the activation energy for both directions, so only the time taken changes.
      - text: The equilibrium yield of ammonia increases.
        why: |-
          A catalyst cannot change the position of equilibrium, so the yield stays the same.
      - text: The value of $K_p$ increases.
        why: |-
          $K_p$ depends only on temperature, so adding a catalyst leaves it unchanged.
      - text: The forward reaction speeds up but the reverse reaction does not.
        why: |-
          Both directions use the same catalyst and the same lowered barrier, so both speed up.
    explanation: |-
      A catalyst provides a lower-energy pathway for both directions equally, so the system reaches the same equilibrium faster.

  - id: eq3-cloze-temperature
    format: cloze
    difficulty: 2
    objectives: ["7.1.3"]
    prompt: |-
      Raising the temperature of a system at equilibrium favours the {{1}} direction, so the value of the equilibrium constant {{2}}. Adding a catalyst leaves the position of equilibrium {{3}} but makes it arrive {{4}}.
    blanks:
      - accept: [endothermic]
      - accept: [changes, decreases, increases, falls, rises]
      - accept: [unchanged, the same, constant]
      - accept: [sooner, faster, more quickly, quicker]
    explanation: |-
      Temperature is the only change that alters $K$; a catalyst alters only the rate at which equilibrium is reached.

  - id: eq3-mcq-compromise
    format: mcq
    difficulty: 3
    objectives: ["7.1.2", "7.1.3"]
    prompt: |-
      For an exothermic equilibrium, a low temperature gives a high equilibrium yield but a very slow reaction. Which statement best explains why industry does not simply use the lowest possible temperature?
    options:
      - text: The rate would be too slow, so the plant would make less product per hour despite the higher yield.
        correct: true
        why: |-
          Yield and rate pull in opposite directions, so a compromise temperature is used.
      - text: Low temperatures would change the position of equilibrium towards the reactants.
        why: |-
          Low temperatures favour the exothermic direction, so they improve the yield of this reaction rather than spoiling it.
      - text: A catalyst would stop working at low temperature.
        why: |-
          A catalyst works at both high and low temperature; the real problem is that everything is too slow when cold.
      - text: The equilibrium constant would fall at low temperature.
        why: |-
          For an exothermic reaction the constant rises as the temperature falls, which is why the yield improves.
    explanation: |-
      Industry balances a high equilibrium yield against a workable rate, which is why a moderate compromise temperature is chosen.

  - id: eq3-spot-error-catalyst
    format: spot-error
    difficulty: 3
    objectives: ["7.1.3"]
    prompt: |-
      A student explains why a catalyst is used in the Contact process. Which line contains the first error?
    lines:
      - The oxidation of sulfur dioxide is reversible and exothermic in the forward direction.
      - A vanadium(V) oxide catalyst lowers the activation energy of the forward reaction.
      - It therefore shifts the position of equilibrium to the right, giving a higher yield of sulfur trioxide.
      - The catalyst also means equilibrium is reached more quickly at the temperature used.
    errorLine: 3
    fix: |-
      A catalyst lowers the activation energies of the **forward and reverse** reactions equally, so it does **not** shift the position of equilibrium or change the yield. Only the rate changes.
    explanation: |-
      Line 2 is incomplete rather than wrong, but line 3 turns that into an incorrect conclusion about the position of equilibrium.

  - id: eq3-explain-temperature
    format: explain
    difficulty: 3
    objectives: ["7.1.3"]
    prompt: |-
      The forward reaction in an equilibrium is exothermic. Explain, in terms of the rates of the forward and reverse reactions, why raising the temperature decreases the equilibrium yield of the products and changes the value of $K_c$.
    model: |-
      Raising the temperature increases the rate of both the forward and the reverse reaction, because more particles have energy greater than or equal to the activation energy. The reverse reaction is endothermic, so it requires the greater share of the extra energy and its rate increases by the larger factor. The reverse reaction therefore temporarily exceeds the forward reaction, so the position of equilibrium moves to the left and the equilibrium yield of products decreases. Because the position at a given temperature is different, the value of $K_c$ — which depends only on temperature — must also be lower at the higher temperature. The mixture does not shift back: the new, lower constant describes the new equilibrium.
    keyPoints:
      - Both rates increase when the temperature rises.
      - The endothermic (reverse) rate increases by the larger factor.
      - The equilibrium shifts left, lowering the yield.
      - $K_c$ depends only on temperature, so it decreases for this exothermic forward reaction.
    explanation: |-
      Temperature acts on the rates unequally because the endothermic direction needs more energy, which is why it — alone — changes the equilibrium constant.
