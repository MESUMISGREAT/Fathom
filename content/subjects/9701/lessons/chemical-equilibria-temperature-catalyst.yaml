id: chemical-equilibria-temperature-catalyst
subject: "9701"
topic: "7.1"
title: "Le Chatelier's principle: temperature and catalysts"
summary: Heating an equilibrium always favours the endothermic direction, so the value of the equilibrium constant changes. A catalyst does neither — it only gets you there sooner.
order: 3
minutes: 9
kind: core
objectives: ["7.1.2", "7.1.3"]
prerequisites: [chemical-equilibria-le-chatelier]
