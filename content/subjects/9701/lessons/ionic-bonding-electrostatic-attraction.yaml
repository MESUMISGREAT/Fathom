id: ionic-bonding-electrostatic-attraction
subject: "9701"
topic: "3.2"
title: "Ionic bonding: opposites attract"
summary: Ionic bonding is the electrostatic attraction between oppositely charged ions. See how it forms in sodium chloride, from electron transfer to a giant lattice.
order: 1
minutes: 4
objectives: ["3.2.1", "3.2.2"]
prerequisites: [electronegativity-bonding-ionic-or-covalent, chemical-formulas-predicting-ion-charges]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.2, learning outcome 3.2.1, and 3.2.2 for sodium chloride).
    Pauling electronegativities Na 0.9 and Cl 3.2 (1 d.p.); ionic radii Na⁺ 95 pm and Cl⁻
    181 pm are Pauling crystal radii, used in the lattice diagram; NaCl melts at 801 °C.
    The lattice is described only as far as the bonding needs (the structure itself is
    topic 4.2). All questions are original.

blocks:
  - type: objective
    body: |
      By the end you can define **ionic bonding** and describe how it forms in sodium chloride, from electron transfer to a giant lattice of ions.

  - type: explain
    title: Two villains make table salt
    body: |
      Sodium is a soft metal that fizzes violently in water. Chlorine is a toxic green gas.

      Put them together and you get the stuff you sprinkle on chips. The bond that does it is made of nothing but the attraction between opposite charges.

  - type: explain
    title: "Step 1: an electron changes hands"
    body: |
      Sodium's electronegativity is 0.9 and chlorine's is 3.2: a difference of 2.3. Chlorine wins so completely that it **takes** sodium's outer electron.

      | | atom | ion |
      | --- | --- | --- |
      | sodium | 1s² 2s² 2p⁶ 3s¹ (2,8,1) | $\text{Na}^+$: 1s² 2s² 2p⁶ (2,8), like neon |
      | chlorine | 1s² 2s² 2p⁶ 3s² 3p⁵ (2,8,7) | $\text{Cl}^-$: 1s² 2s² 2p⁶ 3s² 3p⁶ (2,8,8), like argon |

      - Sodium **loses** an electron and becomes a positive ion: a **cation**.
      - Chlorine **gains** an electron and becomes a negative ion: an **anion**.

  - type: diagram
    diagram: chem-ionic-bonding-sodium-chloride
    alt: "A dot-and-cross diagram showing outer shells only. Top row, atoms: a sodium atom with one outer electron drawn as a cross, labelled Na 2,8,1, and a chlorine atom with seven outer electrons drawn as dots, labelled Cl 2,8,7. An arrow labelled 1 electron moves goes from sodium's cross to the chlorine atom. A downward arrow leads to the bottom row, ions: sodium in square brackets with a + charge, its outer shell now the second shell with eight crosses, labelled Na⁺ 2,8, like neon; chlorine in square brackets with a − charge and eight outer electrons, seven dots and one cross, labelled Cl⁻ 2,8,8, like argon. A double-headed arrow between the two ions is labelled electrostatic attraction. A key says crosses are sodium electrons and dots are chlorine electrons."
    caption: The lone cross in the chloride ion is the electron that came from sodium.

  - type: definition
    term: Ionic bonding
    body: |
      The **electrostatic attraction** between **oppositely charged ions**: positively charged cations and negatively charged anions.

  - type: intuition
    title: The transfer isn't the bond
    body: |
      The electron transfer **makes** the ions. The **bond** is what holds them together afterwards: the attraction between + and −.

      Think of the transfer as the introduction and the attraction as the friendship. Nobody says the introduction *is* the friendship.

      Where it breaks: this introduction is what gives the ions their charges. Without the transfer, there'd be nothing to attract.

  - type: check
    title: Quick check
    questions: [define-ionic-bonding, cation-anion-cloze, what-is-the-bond]

  - type: explain
    title: Not pairs, a giant lattice
    body: |
      Solid sodium chloride isn't made of separate "NaCl" pairs or molecules.

      - Each $\text{Na}^+$ ion is surrounded by $\text{Cl}^-$ ions, and each $\text{Cl}^-$ by $\text{Na}^+$ ions.
      - The attraction acts **in all directions**, to every neighbouring ion of opposite charge.
      - The result is a **giant ionic lattice**: a huge, regular, repeating arrangement of ions.
      - The formula $\text{NaCl}$ only gives the **ratio** of ions, 1 : 1.

  - type: diagram
    diagram: chem-ionic-bonding-lattice-slice
    alt: "One layer of the sodium chloride lattice drawn as a 5 by 4 grid of alternating ions: small circles marked + for Na⁺ and large circles marked − for Cl⁻. The sizes are in proportion (Na⁺ 95 pm, Cl⁻ 181 pm) but the gaps are stretched. One Na⁺ in the middle is circled, with four arrows pointing from it towards the four Cl⁻ ions next to it in the layer. A note says this Na⁺ is pulled towards 4 Cl⁻ in this layer, plus 1 above and 1 below, 6 in all, and that the attraction acts in all directions, with no NaCl molecules."
    caption: Every ion is surrounded by ions of the opposite charge.

  - type: intuition
    title: Why salt is so hard to melt
    body: |
      Every ion is held by several neighbours at once, all pulling. To melt salt, you have to overcome a huge number of these strong attractions.

      That's why sodium chloride melts at 801 °C, while ice melts at 0 °C.

  - type: check
    title: Ions and lattices
    questions: [chloride-configuration, lattice-statement, same-as-chloride]

  - type: misconceptions
    items:
      - wrong: The ionic bond is the transfer of an electron.
        right: The transfer forms the ions. The ionic bond is the **electrostatic attraction** between them.
      - wrong: Solid sodium chloride is made of NaCl molecules.
        right: |
          It's a giant lattice of ions with no molecules at all. $\text{NaCl}$ is just the 1 : 1 ratio.
      - wrong: Each Na⁺ is bonded only to the Cl⁻ that took its electron.
        right: Each ion attracts **all** its oppositely charged neighbours. The attraction acts in all directions.
      - wrong: In sodium chloride, the ions share electrons to fill their shells.
        right: Nothing is shared. That's covalent bonding. In ionic bonding the electron is transferred.

  - type: exam
    body: |
      - Definition must-haves: **electrostatic attraction** and **oppositely charged ions**. "Attraction between ions" without "oppositely charged" is incomplete.
      - To describe the bonding: electron **transferred** from metal to non-metal, ions with noble-gas configurations, electrostatic attraction between oppositely charged ions, in a giant lattice.
      - Never mention molecules, shared electrons or intermolecular forces for an ionic compound.

  - type: takeaways
    items:
      - "Ionic bonding: the electrostatic attraction between oppositely charged ions (cations and anions)."
      - "In NaCl, one electron moves from Na to Cl, forming Na⁺ (2,8) and Cl⁻ (2,8,8)."
      - "The transfer makes the ions; the attraction is the bond."
      - "The ions form a giant lattice, attracting in all directions. No molecules."

questions:
  - id: define-ionic-bonding
    format: text
    style: definition
    difficulty: 1
    objectives: ["3.2.1"]
    prompt: |
      Define **ionic bonding**.
    accept:
      - "the electrostatic attraction between oppositely charged ions"
      - "electrostatic attractions between oppositely charged ions"
      - "the strong electrostatic attraction between oppositely charged ions"
      - "the electrostatic force of attraction between oppositely charged ions"
      - "the electrostatic attraction between ions of opposite charge"
      - "the electrostatic attraction between positive and negative ions"
      - "the electrostatic attraction between positive ions and negative ions"
      - "the electrostatic attraction between positively and negatively charged ions"
      - "the electrostatic attraction between cations and anions"
      - "the electrostatic attraction between positively charged cations and negatively charged anions"
      - "the electrostatic attraction between oppositely charged ions, cations and anions"
      - "the electrostatic attraction between oppositely charged ions (cations and anions)"
      - "the electrostatic attraction between oppositely charged ions (positive cations and negative anions)"
      - "the electrostatic attraction between oppositely charged ions (positively charged cations and negatively charged anions)"
      - "the electrostatic attraction between oppositely charged ions, positively charged cations and negatively charged anions"
    model: |
      The electrostatic attraction between oppositely charged ions (positively charged cations and negatively charged anions).
    explanation: |
      Two must-haves: **electrostatic attraction** and **oppositely charged ions**. The electron transfer is how the ions form, not the bond itself.

  - id: cation-anion-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.2.1"]
    prompt: |
      A positively charged ion is called a {{1}}, and a negatively charged ion is called an {{2}}.
    blanks:
      - accept: ["cation", "cations"]
      - accept: ["anion", "anions"]
    explanation: |
      Cations are positive (like $\text{Na}^+$); anions are negative (like $\text{Cl}^-$).

  - id: what-is-the-bond
    format: mcq
    difficulty: 2
    objectives: ["3.2.1"]
    prompt: |
      In sodium chloride, what exactly **is** the ionic bond?
    options:
      - text: |
          The transfer of an electron from sodium to chlorine.
        why: |
          The transfer forms the ions. The bond is what holds the ions together afterwards.
      - text: |
          A pair of electrons shared between sodium and chlorine.
        why: |
          A shared pair is a covalent bond. In NaCl the electron is transferred, not shared.
      - text: |
          The electrostatic attraction between $\text{Na}^+$ and $\text{Cl}^-$ ions.
        correct: true
        why: |
          Oppositely charged ions attract: that attraction is the ionic bond.
      - text: |
          The attraction between a sodium atom and a chlorine atom.
        why: |
          Atoms are neutral. The bond is between **ions**.
    explanation: |
      Ionic bond = electrostatic attraction between oppositely charged ions.

  - id: chloride-configuration
    format: mcq
    difficulty: 1
    objectives: ["3.2.2"]
    prompt: |
      What is the electronic configuration of a chloride ion, $\text{Cl}^-$?
    options:
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁵
        why: |
          That's the chlorine **atom**. The ion has gained one electron.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁶
        correct: true
        why: |
          17 + 1 = 18 electrons, the same as argon.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁴
        why: |
          That has one electron fewer than the atom, so it would be $\text{Cl}^+$.
      - text: |
          1s² 2s² 2p⁶ 3s² 3p⁵ 4s¹
        why: |
          The 3p sub-shell has room for one more electron, so the extra electron goes into 3p, not 4s.
    explanation: |
      Chlorine (2,8,7) gains one electron to fill its 3p sub-shell: 2,8,8, like argon.

  - id: lattice-statement
    format: mcq
    difficulty: 2
    objectives: ["3.2.2"]
    prompt: |
      Which statement about solid sodium chloride is correct?
    options:
      - text: |
          It is made of NaCl molecules held together by weak forces.
        why: |
          There are no molecules. It's a giant lattice of ions held by strong electrostatic attraction.
      - text: |
          Each $\text{Na}^+$ ion is attracted only to the $\text{Cl}^-$ ion that took its electron.
        why: |
          Each ion attracts every neighbouring ion of opposite charge, not just one.
      - text: |
          Each ion is attracted to all the neighbouring ions of opposite charge, in all directions.
        correct: true
        why: |
          That's the giant ionic lattice: the attraction acts in all directions.
      - text: |
          The $\text{Na}^+$ and $\text{Cl}^-$ ions share electrons to fill their outer shells.
        why: |
          Sharing electrons is covalent bonding. In ionic bonding, electrons are transferred.
    explanation: |
      A giant lattice of oppositely charged ions, each attracting all its neighbours, with no molecules.

  - id: same-as-chloride
    format: mcq
    difficulty: 3
    objectives: ["3.2.2"]
    prompt: |
      Which ion has the **same** electron arrangement as a chloride ion, $\text{Cl}^-$?
    options:
      - text: |
          $\text{Na}^+$
        why: |
          $\text{Na}^+$ has 10 electrons (2,8), like neon. $\text{Cl}^-$ has 18.
      - text: |
          $\text{K}^+$
        correct: true
        why: |
          Potassium (2,8,8,1) loses one electron, leaving 18 electrons (2,8,8), exactly like $\text{Cl}^-$ and argon.
      - text: |
          $\text{F}^-$
        why: |
          $\text{F}^-$ has 10 electrons (2,8). Same group as chlorine, but one shell fewer.
      - text: |
          $\text{Mg}^{2+}$
        why: |
          $\text{Mg}^{2+}$ has 10 electrons (2,8), like neon.
    explanation: |
      Count electrons: $\text{Cl}^-$ has 17 + 1 = 18 and $\text{K}^+$ has 19 − 1 = 18. Both are 2,8,8, the argon arrangement.
