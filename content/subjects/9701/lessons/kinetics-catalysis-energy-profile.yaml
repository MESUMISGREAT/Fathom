id: kinetics-catalysis-energy-profile
subject: "9701"
topic: "8.3"
title: "Reaction pathway diagrams with and without a catalyst"
summary: "Read and sketch energy profiles for catalysed reactions: same start and finish, lower humps, an intermediate in between."
order: 3
minutes: 7
kind: core
objectives: ["8.3.1"]
prerequisites: ["kinetics-catalysis-boltzmann"]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against 9701 syllabus topic 8.3, learning outcome 8.3.1 (c): construct and interpret a
    reaction pathway diagram for a reaction in the presence and absence of an effective catalyst.
    All examples and questions are original. Re-checked line by line on 2026-10-29 in a separate
    adversarial pass by the same AI model. No separate reviewer model and no teacher have reviewed
    it.
blocks:
  - type: objective
    body: |
      By the end you can **draw** a reaction pathway diagram for a reaction with and without a
      catalyst, **label** reactants, products, $E_a$ and $\Delta H$, and explain every difference
      between the two curves.

  - type: explain
    title: What the diagram shows
    body: |
      A reaction pathway diagram plots **energy** (y-axis) against **reaction progress** (x-axis).
      Left to right is the story of the reaction: reactants on the left, products on the right,
      anything in between happening as the atoms rearrange.

      - The **reactants** sit at one energy level, the **products** at another.
      - The difference between those two levels is $\Delta H$: negative if the products are lower.
      - The highest point on the path is the **transition state**, and the climb from the reactants
        to that point is the **activation energy** $E_a$.

      Without a catalyst there is one hill. With a catalyst the reaction usually goes through an
      **intermediate**, so the profile has two smaller humps with a dip between them.

  - type: definition
    term: Reaction pathway diagram
    body: |
      A graph of energy against reaction progress for a reaction. The height of the highest energy
      point above the reactants is the activation energy $E_a$; the energy difference between the
      reactants and the products is $\Delta H$.

      On a **catalysed** pathway the highest point is lower and the route may pass through one or
      more **intermediates** — species formed in one step and used up in the next, sitting in dips
      between the humps.

  - type: diagram
    diagram: chem-catalysis-energy-profile
    alt: >-
      An energy profile with two routes. The blue uncatalysed route has a single high hump labelled
      Ea. The orange catalysed route goes over two lower humps, labelled Ea prime, with an
      intermediate in the dip between them. Both routes start at the same reactant level and finish
      at the same product level.
    caption: >-
      Two humps, each lower than the single uncatalysed hump: a two-step mechanism through an
      intermediate. The start and finish are unchanged, so ΔH is unchanged.

  - type: intuition
    title: Why two humps?
    body: |
      A catalyst does not wave the reaction through in one step. It reacts with a reactant to make
      an intermediate, and the intermediate then reacts on to give the products, regenerating the
      catalyst:

      $$\text{A} + \text{cat} \rightarrow \text{A–cat} \rightarrow \text{P} + \text{cat}.$$

      Each of those steps is a small journey with its own barrier. The diagram shows the energy along
      that two-step route, which is why there are two humps instead of one.

      The important comparison is not the number of humps but the **height of the highest hump**: it
      is lower than the single hump of the uncatalysed route, so $E_a$ is smaller.

  - type: example
    title: Reading the numbers off a profile
    problem: |
      For a reaction, the reactants are at $60\ \text{kJ mol}^{-1}$ and the products at
      $20\ \text{kJ mol}^{-1}$. Without a catalyst the highest point is at
      $210\ \text{kJ mol}^{-1}$; with a catalyst it is at $130\ \text{kJ mol}^{-1}$.

      Find $E_a$ with and without the catalyst, and $\Delta H$.
    steps:
      - |
        Activation energy is measured **from the reactants** up to the highest point.
      - |
        Without a catalyst: $E_a = 210 - 60 = 150\ \text{kJ mol}^{-1}$.
      - |
        With the catalyst: $E_a' = 130 - 60 = 70\ \text{kJ mol}^{-1}$.
      - |
        $\Delta H$ is from reactants to products: $20 - 60 = -40\ \text{kJ mol}^{-1}$, so the
        reaction is exothermic.
      - |
        The catalyst has more than halved $E_a$, yet $\Delta H$ is exactly the same $-40$ in both
        cases.
    answer: |
      $E_a = 150\ \text{kJ mol}^{-1}$; $E_a' = 70\ \text{kJ mol}^{-1}$; $\Delta H = -40\
      \text{kJ mol}^{-1}$.

  - type: example
    title: Sketching the pair
    problem: |
      Sketch, on the same axes, the reaction pathway for an exothermic reaction with and without a
      catalyst.
    steps:
      - |
        Draw the axes: energy vertically, reaction progress horizontally.
      - |
        Mark the reactant level on the left and a **lower** product level on the right (exothermic).
        Put a short horizontal guide at each level, and label them.
      - |
        Draw the uncatalysed curve as a single smooth hump between them. Label the climb from the
        reactant level to the top "$E_a$".
      - |
        Draw the catalysed curve starting and finishing at the **same two levels**, rising to a lower
        first hump, dipping to an intermediate, then a second lower hump. Label the climb to the
        higher of its two humps "$E_a'$".
      - |
        Label $\Delta H$ as the gap between the reactant and product levels. Nothing about this gap
        changed.
    answer: |
      Both curves share the same start and finish; the catalysed curve has two lower humps, so it
      has a smaller $E_a$ but the same $\Delta H$.

  - type: misconceptions
    items:
      - wrong: "The catalysed curve starts at a lower energy than the uncatalysed one."
        right: >-
          Both start at the same reactant energy. Only the top of the route is lower.
      - wrong: "The catalysed curve ends at a lower energy, so more energy is released."
        right: >-
          Both finish at the same product energy. $\Delta H$ is identical.
      - wrong: "Having two humps means the catalysed reaction is slower, because there are two
        barriers."
        right: >-
          The rate depends on the highest barrier on the route. Both catalysed humps are lower than
          the single uncatalysed hump.
      - wrong: "Ea is measured from the products."
        right: >-
          For the forward reaction $E_a$ is measured from the reactants to the highest point. (From
          the products you would be measuring the activation energy of the reverse reaction.)
      - wrong: "The dip between the humps is the transition state."
        right: >-
          The dip is an intermediate — a real, if short-lived, species. The transition states are at
          the tops of the humps.

  - type: exam
    body: |
      When you are asked to draw the catalysed pathway:

      - start and finish on the **same** levels as the uncatalysed curve;
      - make the highest point **lower**, not higher;
      - label $E_a$ on the uncatalysed curve and $E_a'$ (or "lower $E_a$") on the catalysed one;
      - if you draw two humps, put an intermediate in the dip and label it.

      When interpreting, remember that the reverse reaction's activation energy is measured from the
      products up to the highest point, and that a catalyst lowers that too.

  - type: check
    title: Check yourself
    questions: [profile-ea-value, profile-delta-h]

  - type: check
    title: Reading the shape
    questions: [profile-two-humps, profile-unchanged]

  - type: check
    title: Spot the error and go deeper
    questions: [profile-ea-error, profile-intermediate]

  - type: takeaways
    items:
      - "A reaction pathway diagram plots energy against reaction progress."
      - "Ea is measured from the reactants to the highest point on the route."
      - "A catalyst lowers the highest point and may introduce an intermediate, giving two humps."
      - "Both routes start and finish at the same levels, so ΔH is unchanged."

questions:
  - id: profile-ea-value
    format: numeric
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      For a reaction, the reactants are at $80\ \text{kJ mol}^{-1}$ and the products at
      $30\ \text{kJ mol}^{-1}$. Without a catalyst the highest point on the pathway is at
      $230\ \text{kJ mol}^{-1}$.

      Calculate the activation energy, in $\text{kJ mol}^{-1}$.
    fields:
      - answer: 150
        tolerance: { abs: 0.5 }
        unit: kJ mol⁻¹
    explanation: |
      $E_a = 230 - 80 = 150\ \text{kJ mol}^{-1}$. The activation energy is measured from the
      reactants, not from the products.

  - id: profile-delta-h
    format: numeric
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      The same reaction has reactants at $80\ \text{kJ mol}^{-1}$ and products at
      $30\ \text{kJ mol}^{-1}$.

      Calculate $\Delta H$, in $\text{kJ mol}^{-1}$.
    fields:
      - answer: -50
        tolerance: { abs: 0.5 }
        unit: kJ mol⁻¹
    explanation: |
      $\Delta H = 30 - 80 = -50\ \text{kJ mol}^{-1}$. The products are lower, so the reaction is
      exothermic.

  - id: profile-two-humps
    format: mcq
    difficulty: 1
    objectives: ["8.3.1"]
    prompt: |
      Why does a catalysed reaction pathway often show two humps instead of one?
    options:
      - text: |
          The reaction goes through an intermediate in two steps, each with its own barrier.
        correct: true
        why: |
          The catalyst reacts to form an intermediate, which then reacts on to give the products and
          regenerate the catalyst.
      - text: |
          The catalyst supplies energy twice during the reaction.
        why: |
          A catalyst does not supply energy; it provides a lower-energy route.
      - text: |
          Two humps mean the reaction releases energy in two stages.
        why: |
          Energy released is shown by the reactant and product levels, not by the number of humps.
      - text: |
          The second hump shows the reverse reaction happening as well.
        why: |
          A single pathway diagram follows the forward reaction only.
    explanation: |
      A catalysed mechanism usually has at least two steps: formation of an intermediate, then its
      conversion to products. Each step has its own transition state, hence two humps.

  - id: profile-unchanged
    format: mcq
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      On a reaction pathway diagram, which feature is the same for the catalysed and uncatalysed
      routes?
    options:
      - text: |
          The energy levels of the reactants and of the products.
        correct: true
        why: |
          The same reactants become the same products, so both ends of the diagram are unchanged.
      - text: |
          The height of the highest point.
        why: |
          The catalysed route has a lower highest point; that is what makes it faster.
      - text: |
          The number of transition states.
        why: |
          A catalysed route often has more than one.
      - text: |
          The value of the activation energy.
        why: |
          $E_a$ is smaller on the catalysed route.
    explanation: |
      Both curves start and finish at the same levels, so $\Delta H$ is unchanged. Everything between
      the ends can differ.

  - id: profile-ea-error
    format: spot-error
    difficulty: 2
    objectives: ["8.3.1"]
    prompt: |
      A student reads values from a reaction pathway diagram. One line is wrong.
    lines:
      - |
        The reactants are at 40 kJ mol⁻¹ and the products at 90 kJ mol⁻¹, so the reaction is
        endothermic by 50 kJ mol⁻¹.
      - |
        The uncatalysed peak is at 160 kJ mol⁻¹, so the activation energy is 160 − 90 = 70 kJ mol⁻¹.
      - |
        With a catalyst the peak falls to 110 kJ mol⁻¹, so the activation energy becomes 70 kJ mol⁻¹.
    errorLine: 2
    fix: |
      $E_a$ is measured from the reactants: $160 - 40 = 120\ \text{kJ mol}^{-1}$.
    explanation: |
      The activation energy for the forward reaction is the climb from the reactant level to the
      highest point. Measuring from the products gives the activation energy of the reverse
      reaction, not the forward one.

  - id: profile-intermediate
    format: cloze
    difficulty: 3
    objectives: ["8.3.1"]
    prompt: |
      On a catalysed pathway with two humps, the tops of the humps are {{1}} states, while the dip
      between them is an {{2}}, a species formed in one step and used up in the next.
    blanks:
      - accept: ["transition", "transitional"]
      - accept: ["intermediate"]
    explanation: |
      Transition states are energy maxima and cannot be isolated; intermediates sit in energy
      minima along the route and are real (if short-lived) species.
