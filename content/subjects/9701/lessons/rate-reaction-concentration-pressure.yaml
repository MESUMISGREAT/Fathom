blocks:
  - type: objective
    body: |
      By the end, you can explain qualitatively why increasing concentration or gas pressure changes reaction rate.

  - type: explain
    title: Crowding the reaction
    body: |
      Concentration tells us how much solute is packed into a given volume. Increasing concentration puts more reacting particles into the same space.

      With more particles nearby, a particle meets another reactant more often. Collision frequency increases, so the number of effective collisions per second usually increases and the rate rises.

  - type: intuition
    title: The busy-corridor analogy
    body: |
      In a quiet corridor, two people may pass without meeting. In a crowded corridor, meetings happen more often.

      The analogy has a limit: a chemical collision still needs enough energy and suitable orientation. Crowding raises the number of chances, not the success of every chance.

  - type: example
    title: Concentration change
    problem: |
      Hydrochloric acid reacts with magnesium. Explain why using $2.0\ \text{mol dm}^{-3}$ hydrochloric acid instead of $1.0\ \text{mol dm}^{-3}$ hydrochloric acid usually gives a faster reaction, at the same temperature.
    steps:
      - 'The higher concentration contains more acid particles in each cubic decimetre.'
      - 'Magnesium atoms encounter acid particles more frequently.'
      - 'The frequency of effective collisions per second increases, so the reaction rate increases.'
    answer: The higher concentration gives a faster reaction.

  - type: check
    title: Concentration checkpoint
    questions: [concentration-rate, effective-frequency, gas-pressure, concentration-chain]

  - type: explain
    title: "Gases: pressure is concentration in disguise"
    body: |
      For a fixed amount of gas at the same temperature, increasing pressure by reducing volume packs the gas particles into a smaller space.

      The particles then collide with reacting particles more frequently. Therefore the frequency of effective collisions rises and the reaction is faster, provided the pressure change really changes the relevant gas concentration.

  - type: misconceptions
    items:
      - wrong: "Increasing concentration gives every collision more energy."
        right: "At unchanged temperature, the particles have the same energy distribution. There are simply more encounters per second."
      - wrong: "Higher pressure always makes every reaction faster."
        right: "Pressure mainly affects reactions involving gases, and it must increase the concentration of a reacting gas."
      - wrong: "More collisions means all collisions are effective."
        right: "Only a fraction of collisions are effective; increasing concentration increases the number of opportunities."

  - type: exam
    body: |
      Build a chain: **higher concentration or pressure → more particles per unit volume → higher collision frequency → more effective collisions per second → faster rate**.

      Do not say that the particles become more energetic unless the temperature has changed.

  - type: takeaways
    items:
      - "Higher concentration means more reacting particles in the same volume."
      - "For gases, higher pressure can pack particles closer together."
      - "The key link is a greater frequency of effective collisions per second."

questions:
  - id: concentration-rate
    format: mcq
    difficulty: 1
    objectives: ["8.1.2"]
    prompt: Why does increasing the concentration of a reactant usually increase the rate?
    options:
      - text: The reactant particles become larger.
        why: Particle size does not increase when concentration changes.
      - text: There are more reacting particles per unit volume, so collisions are more frequent.
        correct: true
        why: More nearby particles increase collision frequency and therefore effective collisions per second.
      - text: Every collision becomes effective.
        why: Only some collisions are effective.
      - text: The activation energy becomes zero.
        why: Concentration does not remove the activation-energy requirement.
    explanation: More particles in the same volume gives more opportunities for effective collisions.

  - id: effective-frequency
    format: cloze
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: Increasing concentration increases collision frequency. Therefore the frequency of {{1}} collisions per second increases and the rate {{2}}.
    blanks:
      - accept: ["effective", "successful", "effective"]
      - accept: ["increases", "rises", "goes up"]
    explanation: The extra collisions provide more effective collisions each second, so the reaction is faster.

  - id: gas-pressure
    format: mcq
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: A gaseous reactant is compressed at constant temperature. What is the best explanation for the faster reaction?
    options:
      - text: Molecules move faster because the pressure is higher.
        why: At constant temperature, the energy distribution and average speed do not change in this way.
      - text: Molecules are closer together, so collisions with other reactant molecules are more frequent.
        correct: true
        why: Compression increases the number of particles per unit volume and hence collision frequency.
      - text: The activation energy is reduced by the container.
        why: Compression does not change the activation energy.
      - text: The molecules stop colliding with the container walls.
        why: Wall collisions are not the reason for the chemical rate increase.
    explanation: Compression increases gaseous concentration, giving more frequent collisions.

  - id: concentration-chain
    format: text
    style: short
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: "Complete the explanation: higher concentration leads to faster reaction because there are more particles per unit volume, causing..."
    accept: ["more frequent collisions and more effective collisions per second", "more frequent collisions, so more effective collisions per second", "an increased collision frequency and an increased frequency of effective collisions"]
    model: Higher concentration causes more frequent collisions and therefore more effective collisions per second.
    explanation: This links the concentration change to the microscopic collision model.
