id: rate-reaction-concentration-pressure
subject: "9701"
topic: "8.1"
title: "Concentration and pressure: more collisions, more chances"
summary: Explain why increasing concentration or gas pressure usually increases reaction rate through more frequent effective collisions.
order: 2
minutes: 4
objectives: ["8.1.2"]
prerequisites: [rate-reaction-meaning-and-collisions]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus objectives 8.1.1–8.1.3 and 8.2.1–8.2.3. All questions are original;
    illustrative reaction data are invented for teaching. Independently reviewed and
