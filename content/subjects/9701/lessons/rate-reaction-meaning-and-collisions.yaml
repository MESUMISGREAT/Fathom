id: rate-reaction-meaning-and-collisions
subject: "9701"
topic: "8.1"
title: "Reaction rate: counting useful collisions"
summary: Learn what reaction rate means and why only effective collisions make reactants turn into products.
order: 4
minutes: 4
objectives: ["8.1.1"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus objectives 8.1.1–8.1.3 and 8.2.1–8.2.3. All questions are original;
    illustrative reaction data are invented for teaching. Independently reviewed and
