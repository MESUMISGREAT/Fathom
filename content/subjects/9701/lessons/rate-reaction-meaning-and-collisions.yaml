blocks:
  - type: objective
    body: |
      By the end, you can define reaction rate and distinguish collision frequency, effective collisions and non-effective collisions.

  - type: explain
    title: A reaction is a busy doorway
    body: |
      Imagine reactant particles trying to get through a doorway. The **rate of reaction** tells us how quickly reactants disappear or products appear.

      A fast reaction changes noticeably in a short time. A slow reaction changes only a little in the same time.

  - type: definition
    term: Rate of reaction
    body: |
      The **rate of reaction** is the change in concentration of a reactant or product per unit time.

      For a reactant, its concentration decreases, so we usually use the magnitude of the change:

      $$\text{rate} = \dfrac{\text{change in concentration}}{\text{time taken}}$$

      A common unit is $\text{mol dm}^{-3}\text{ s}^{-1}$.

  - type: definition
    term: Collision frequency
    body: |
      **Collision frequency** is the number of collisions between reacting particles per unit time.

      More collisions per second do not automatically mean a faster reaction: the collisions must also be effective.

  - type: intuition
    title: Not every bump counts
    body: |
      A collision is **effective** if it leads to a reaction. At this level, that means the particles collide with enough energy and the correct orientation for bonds to break and new bonds to form.

      A **non-effective collision** is a collision that does not produce products. The particles may bounce apart because they lack enough energy, have the wrong orientation, or both.

  - type: check
    title: Three key words
    questions: [rate-definition, effective-collision, collision-frequency, average-rate]

  - type: example
    title: Which reaction is faster?
    problem: |
      Reaction A produces $0.20\ \text{mol}$ of product in $10\ \text{s}$. Reaction B produces $0.30\ \text{mol}$ in $30\ \text{s}$. Compare their average rates of product formation.
    steps:
      - 'For A, rate $= 0.20 \div 10 = 0.020\ \text{mol s}^{-1}$.'
      - 'For B, rate $= 0.30 \div 30 = 0.010\ \text{mol s}^{-1}$.'
      - 'A has the greater rate, even though B makes more product overall, because A makes product faster.'
    answer: Reaction A is twice as fast by this measure.

  - type: misconceptions
    items:
      - wrong: "Every collision between reactant particles causes a reaction."
        right: "Only effective collisions produce products. The rest are non-effective."
      - wrong: "Collision frequency and reaction rate mean exactly the same thing."
        right: "Collision frequency counts all collisions. Reaction rate depends on effective collisions, not merely total collisions."
      - wrong: "A reaction that eventually makes more product must have the faster rate."
        right: "Rate is about change per unit time. A reaction can make less product overall but do so more quickly."

  - type: exam
    body: |
      For a definition question, include the word **change** and **per unit time**. For collision explanations, distinguish all collisions from the smaller number that are effective.

  - type: takeaways
    items:
      - "Rate measures how quickly concentration changes."
      - "Collision frequency is the number of collisions per unit time."
      - "Only effective collisions form products; non-effective collisions do not."

questions:
  - id: rate-definition
    format: mcq
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: What is meant by the rate of a reaction?
    options:
      - text: The total amount of product made.
        why: A total amount does not include how long the change took.
      - text: The change in concentration per unit time.
        correct: true
        why: This describes how quickly a reactant or product concentration changes.
      - text: The number of particles in one collision.
        why: A collision can involve particles, but this is not a rate.
      - text: The temperature at which reactants collide.
        why: Temperature can affect rate, but it is not the definition of rate.
    explanation: Reaction rate is the change in concentration divided by the time taken.

  - id: effective-collision
    format: mcq
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: Which collision is effective?
    options:
      - text: A collision that produces no new particles.
        why: That is non-effective.
      - text: A collision that results in the formation of products.
        correct: true
        why: An effective collision causes the reaction to happen.
      - text: Any collision between two particles, whatever their energy.
        why: Many collisions do not have enough energy or the right orientation.
      - text: A collision that lasts the longest.
        why: Duration alone does not define effectiveness.
    explanation: An effective collision is one that leads to reaction and product formation.

  - id: collision-frequency
    format: text
    style: definition
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: Define collision frequency.
    accept: ["the number of collisions per unit time", "number of collisions per unit time"]
    model: Collision frequency is the number of collisions between reacting particles per unit time.
    explanation: It counts collisions each second, whether or not they are effective.

  - id: average-rate
    format: numeric
    difficulty: 2
    objectives: ["8.1.1"]
    prompt: A reaction produces $0.24\ \text{mol}$ of product in $12\ \text{s}$. Calculate the average rate of product formation in $\text{mol s}^{-1}$.
    fields:
      - answer: 0.02
        unit: mol s⁻¹
    explanation: Rate $= 0.24 \div 12 = 0.020\ \text{mol s}^{-1}$.
