id: rate-reaction-collision-theory
subject: "9701"
topic: "8.1"
title: Rate of reaction and collision theory
summary: What rate means, why only some collisions work, and why concentration and pressure change how fast a reaction goes.
order: 1
minutes: 6
kind: core
