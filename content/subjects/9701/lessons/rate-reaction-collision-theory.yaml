blocks:
  - type: objective
    body: |
      By the end you can explain what the **rate of a reaction** means, distinguish **effective** from **non-effective** collisions, and explain how changing **concentration** or **pressure** changes the rate.

  - type: explain
    title: How fast, not how far
    body: |
      Some reactions are over in a flash: a firework, a neutralisation. Others take years: iron rusting, limestone weathering.

      The **rate of reaction** measures how quickly reactants are used up, or products are formed, per unit time. It says nothing about how much product you eventually get. A reaction can be fast and still give a small yield.

      Rate is usually measured as a change in concentration per second, so its units are $\text{mol dm}^{-3}\,\text{s}^{-1}$. If you measure a volume of gas, the rate may be in $\text{cm}^3\,\text{s}^{-1}$; if you measure mass loss, in $\text{g s}^{-1}$.

  - type: definition
    term: Rate of reaction
    body: |
      The change in concentration of a reactant or product per unit time.

  - type: explain
    title: Collisions, and why most of them fail
    body: |
      For a reaction to happen, particles must **collide**. But most collisions do nothing.

      A collision is **effective** only if:

      - the particles collide with at least the **activation energy**, and
      - they are oriented in a way that lets bonds break and form.

      A collision that lacks the energy, or has the wrong orientation, is **non-effective**: the particles bounce apart unchanged.

      The **frequency of collisions** is the number of collisions per second. More collisions per second means more chances of an effective collision, so a faster rate, provided the fraction that are effective stays the same.

  - type: example
    title: Squeezing the same reaction
    problem: |
      Marble chips react with dilute hydrochloric acid. Explain why using more concentrated acid increases the rate, even though the chips are unchanged.
    steps:
      - |
        Concentrated acid has more acid particles per unit volume.
      - |
        The particles are closer together, so they collide with the marble surface more often.
      - |
        The **frequency of collisions** rises, so the number of **effective collisions per second** rises.
      - |
        More effective collisions per second means more product formed per second: a higher rate.
      - |
        The total amount of marble and acid is unchanged, so the final yield is the same; only the speed changes.
    answer: |
      Higher concentration means more frequent collisions, so more effective collisions per second and a faster rate.

  - type: explain
    title: Pressure is concentration in disguise
    body: |
      For gases, increasing the **pressure** squeezes the same number of particles into a smaller volume. That is exactly the same as increasing the concentration: more particles per unit volume.

      So the explanation is identical. Higher pressure means gas particles are closer together, collide more frequently, and produce more effective collisions per second, so the rate increases.

      Pressure only matters for reactions involving gases. Squeezing a solid or a liquid changes their volume hardly at all.

  - type: misconceptions
    items:
      - wrong: Every collision between reactant particles causes a reaction.
        right: |
          Only effective collisions do. Most collisions do not have enough energy, or the particles are badly oriented, so nothing happens.
      - wrong: Increasing concentration increases the activation energy.
        right: |
          Concentration changes how **often** particles collide, not how much energy each collision needs. The activation energy is a property of the reaction.
      - wrong: Increasing pressure always increases the rate.
        right: |
          It increases the rate of reactions involving gases, because it increases their concentration. A reaction between two solids or two liquids is essentially unaffected.
      - wrong: A faster reaction always gives more product.
        right: |
          Rate is about speed. The amount of product depends on the amounts of reactants and the yield, not on how quickly the reaction finishes.

  - type: exam
    body: |
      - Define rate precisely: change in concentration **per unit time**. "How fast a reaction goes" is too vague for a definition mark.
      - When explaining concentration or pressure, use the chain: more particles per unit volume, so more frequent collisions, so more effective collisions per second, so a faster rate.
      - Say **effective** collisions, not just collisions. Examiners specifically reward the distinction.
      - For pressure, state that it applies to gases and that it works by changing the concentration.
      - Do not say the particles "move faster" when you increase concentration. Temperature does that. Concentration changes how crowded the particles are.

  - type: takeaways
    items:
      - Rate is the change in concentration of a reactant or product per unit time.
      - Collisions must have at least the activation energy and a suitable orientation to be effective.
      - Most collisions are non-effective.
      - Higher concentration means more particles per unit volume, more frequent collisions and a faster rate.
      - For gases, higher pressure has the same effect as higher concentration.

  - type: check
    title: Definitions
    questions: [effective-collision, rate-definition, rate-units]

  - type: check
    title: Concentration and pressure
    questions: [concentration-explanation, pressure-effect, spot-the-error]

questions:
  - id: effective-collision
    format: mcq
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: |
      What is an **effective** collision?
    options:
      - text: A collision in which the particles have at least the activation energy and a suitable orientation, so a reaction occurs
        correct: true
        why: |
          Both conditions are needed: enough energy and the right geometry for bonds to break and form.
      - text: Any collision between two reactant particles
        why: |
          Most collisions do not have enough energy or the right orientation, so they are non-effective.
      - text: A collision that produces a product with a lower energy
        why: |
          The energy change of the overall reaction is not what makes a single collision effective.
      - text: A collision between a catalyst and a reactant
        why: |
          A catalyst can take part in an effective collision, but being a catalyst collision is not the definition.
    explanation: |
      An effective collision has sufficient energy and a suitable orientation, so the reaction actually happens.

  - id: rate-definition
    format: text
    difficulty: 1
    objectives: ["8.1.1"]
    style: definition
    prompt: |
      Define the **rate of a reaction**.
    accept:
      - the change in concentration of a reactant or product per unit time
      - change in concentration per unit time
      - the change in concentration of a reactant or product per unit time
      - the change in amount of reactant or product per unit time
    model: |
      The change in concentration of a reactant or product per unit time.
    explanation: |
      Rate is a change divided by a time. Specifying concentration and unit time makes the definition precise.

  - id: rate-units
    format: mcq
    difficulty: 1
    objectives: ["8.1.1"]
    prompt: |
      A rate is calculated from concentration measurements in $\text{mol dm}^{-3}$ taken over time in seconds. What are the units of the rate?
    options:
      - text: $\text{mol dm}^{-3}\,\text{s}^{-1}$
        correct: true
        why: |
          Concentration divided by time gives moles per cubic decimetre per second.
      - text: $\text{mol s}^{-1}$
        why: |
          That would be an amount per second, without the volume. Rate uses concentration.
      - text: $\text{dm}^{3}\,\text{mol}^{-1}\,\text{s}^{-1}$
        why: |
          That is the reciprocal of concentration per second, which is not how rate is defined.
      - text: $\text{s}^{-1}$
        why: |
          That is a frequency, not a change in concentration per second.
    explanation: |
      Concentration has units mol dm⁻³; dividing by time in seconds gives mol dm⁻³ s⁻¹.

  - id: concentration-explanation
    format: explain
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      Explain why increasing the concentration of a reactant increases the rate of a reaction.
    model: |
      Increasing the concentration means there are more reactant particles in the same volume, so the particles are closer together. They collide more frequently. This increases the number of effective collisions per second, because each collision still has the same chance of having enough energy and the right orientation. More effective collisions per second means the reactant is used up faster, so the rate increases.
    keyPoints:
      - More particles per unit volume
      - More frequent collisions
      - More effective collisions per second
      - The activation energy is unchanged; only the frequency changes
    explanation: |
      The chain from concentration to collision frequency to effective collisions per second is what earns the marks.

  - id: pressure-effect
    format: mcq
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      A reaction between two gases is carried out at higher pressure at constant temperature. Why does the rate increase?
    options:
      - text: The gas particles are closer together, so they collide more frequently
        correct: true
        why: |
          Higher pressure compresses the gas, increasing its concentration and therefore the collision frequency.
      - text: The particles gain kinetic energy and collide harder
        why: |
          At constant temperature the average kinetic energy is unchanged. Higher pressure changes spacing, not temperature.
      - text: The activation energy decreases
        why: |
          Pressure does not change the activation energy of the reaction.
      - text: The particles become more reactive
        why: |
          Reactivity is a chemical property of the particles, not something pressure changes.
    explanation: |
      Pressure works by increasing concentration: same particles, smaller volume, more frequent collisions.

  - id: spot-the-error
    format: spot-error
    difficulty: 2
    objectives: ["8.1.2"]
    prompt: |
      A student explains why increasing concentration speeds up a reaction. Which line contains the first error?
    lines:
      - "Increasing concentration puts more reactant particles in the same volume."
      - "The particles therefore collide more frequently."
      - "Every one of these extra collisions is effective, so the rate rises."
      - "The activation energy of the reaction does not change."
      - "More effective collisions happen per second, so product forms faster."
    errorLine: 3
    fix: |
      Only a small fraction of collisions are effective. More collisions means more **effective** collisions per second, but not every collision is effective; the fraction with sufficient energy and the right orientation is unchanged.
    explanation: |
      Concentration increases the **number** of collisions, not the fraction that are effective.
