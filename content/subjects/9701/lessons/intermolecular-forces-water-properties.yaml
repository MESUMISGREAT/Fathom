blocks:
  - type: objective
    body: By the end, you can use hydrogen bonding to explain four unusual properties of water and ice.
  - type: explain
    title: More attractions need more energy
    body: |
      Water molecules attract each other through hydrogen bonds. To melt ice or boil water, many of those attractions must be overcome, so water has **relatively high melting and boiling points** compared with similar small molecules.

      The covalent O–H bonds inside each molecule are not broken when water boils. The molecules separate; they do not fall apart into hydrogen and oxygen.
  - type: check
    title: What changes when water boils?
    questions: ["water-boiling", "water-high-points"]
  - type: explain
    title: A stretchy surface
    body: |
      A molecule in the middle of liquid water is pulled by neighbours in every direction. A molecule at the surface has fewer neighbours above it, so attractions pull the surface together.

      That strong surface cohesion gives water **relatively high surface tension**. Tiny insects can exploit it; they are not walking on a secret solid floor.
  - type: example
    title: Why ice is less dense
    problem: Compare the same number of water molecules in ice and liquid water.
    steps:
      - In ice, hydrogen bonds hold molecules in a regular, open arrangement with gaps.
      - In liquid water, some hydrogen bonds keep rearranging, letting molecules sit closer together on average.
      - The same mass in ice takes up more volume, so its density is lower.
    answer: Solid ice is less dense than liquid water, so ice floats.
  - type: diagram
    diagram: chem-intermolecular-forces-water-structure
    alt: A schematic open arrangement of water molecules in ice is compared with a closer irregular arrangement in liquid water; the same mass occupies more volume in ice, giving it lower density.
    caption: Schematic particle pictures, not to scale. Dashed links represent hydrogen bonds.
  - type: check
    title: Water's unusual properties
    questions: ["water-ice-density", "water-surface"]
  - type: misconceptions
    items:
      - wrong: Boiling water breaks its O–H covalent bonds.
        right: Boiling overcomes attractions between molecules; each water molecule stays intact.
      - wrong: Ice must be denser because it is solid.
        right: Ice has an open hydrogen-bonded structure, so the same mass occupies more volume and is less dense.
  - type: exam
    body: "For each property, connect the cause to the effect: hydrogen bonds between molecules → stronger attractions to overcome → more energy needed. For ice density, add open structure → larger volume for the same mass → lower density."
  - type: takeaways
    items:
      - Hydrogen bonds help give water relatively high melting and boiling points.
      - Cohesion at the surface gives water relatively high surface tension.
      - Ice has an open arrangement; the same mass occupies more volume, so ice is less dense than liquid water.
questions:
  - id: water-boiling
    format: mcq
    difficulty: 1
    objectives: ["3.6.1"]
    prompt: What is overcome when liquid water boils?
    options:
      - text: Hydrogen bonds between water molecules
        correct: true
        why: Boiling separates molecules by overcoming intermolecular attractions.
      - text: Every O–H covalent bond inside each water molecule
        why: Water vapour still contains H₂O molecules.
      - text: The nuclei inside each oxygen atom
        why: Boiling does not change atomic nuclei.
      - text: All electron attraction to oxygen
        why: The molecule's covalent O–H bonds remain.
    explanation: Water vapour contains intact H₂O molecules; boiling mainly overcomes attractions between them.
  - id: water-high-points
    format: cloze
    difficulty: 2
    objectives: ["3.6.1"]
    prompt: Water's relatively high melting and boiling points are explained by {{1}} between its molecules, which take energy to overcome.
    blanks:
      - accept: ["hydrogen bonds", "hydrogen bonding", "intermolecular hydrogen bonds"]
    explanation: Strong intermolecular attractions mean more energy is needed to separate water molecules.
  - id: water-ice-density
    format: mcq
    difficulty: 2
    objectives: ["3.6.1"]
    prompt: Why is ice less dense than liquid water?
    options:
      - text: Hydrogen bonds hold molecules in an open arrangement, so the same mass occupies more volume.
        correct: true
        why: More volume for the same mass means lower density.
      - text: Ice contains fewer oxygen atoms than liquid water.
        why: Molecules do not lose oxygen atoms on freezing.
      - text: Covalent bonds vanish in ice, making it lighter.
        why: Water molecules remain intact; density depends on mass and volume.
      - text: Hydrogen bonds pull every molecule into a tighter arrangement in ice.
        why: Ice's structure is open, with gaps between molecules.
    explanation: For the same mass, the open ice structure has greater volume, so its density is lower.
  - id: water-surface
    format: mcq
    difficulty: 2
    objectives: ["3.6.1"]
    prompt: What helps give liquid water relatively high surface tension?
    options:
      - text: Cohesion from hydrogen bonds between water molecules
        correct: true
        why: Attractions between molecules pull the surface together.
      - text: Covalent O–H bonds joining different molecules into one molecule
        why: O–H bonds are inside each water molecule.
      - text: Repulsion between all molecules at the surface
        why: Cohesion is attraction, not repulsion.
      - text: The open crystal structure of ice
        why: Surface tension is a property of liquid water.
    explanation: Strong attractions between neighbouring water molecules produce cohesion at the liquid surface.
