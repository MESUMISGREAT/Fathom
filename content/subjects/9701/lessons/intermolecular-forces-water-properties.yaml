id: intermolecular-forces-water-properties
subject: "9701"
topic: "3.6"
title: Why ice floats and water boils high
summary: Explain water's high melting and boiling points, surface tension and low-density ice using hydrogen bonds.
order: 3
minutes: 4
objectives: ["3.6.1"]
prerequisites: [intermolecular-forces-hydrogen-bonding]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.6 learning outcome 1. All questions are original; particle sketches are illustrative, not measured data.
