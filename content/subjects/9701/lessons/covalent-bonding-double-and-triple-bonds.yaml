id: covalent-bonding-double-and-triple-bonds
subject: "9701"
topic: "3.4"
title: "Double and triple bonds: O₂, N₂, CO₂ and C₂H₄"
summary: When atoms need two or three more electrons they share two or three pairs, giving double and triple bonds in O₂, N₂, CO₂ and C₂H₄.
order: 2
minutes: 4
objectives: ["3.4.1"]
prerequisites: [covalent-bonding-shared-pairs]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 1, part (a): multiple bonds in O₂, N₂,
    CO₂ and C₂H₄). All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can describe the double and triple covalent bonds in $\text{O}_2$, $\text{N}_2$, $\text{CO}_2$ and $\text{C}_2\text{H}_4$, and count their shared pairs and lone pairs.

  - type: explain
    title: One pair isn't always enough
    body: |
      Oxygen has 6 outer electrons, so it needs **2** more. One shared pair only gets it to 7.

      The fix: share **two** pairs. Two shared pairs between the same two atoms make a **double bond**, drawn $=$. Three shared pairs make a **triple bond**, drawn $\equiv$.

  - type: explain
    title: The rule from last time still works
    body: |
      Bonds an atom forms = electrons it needs to reach 8.

      | atom | outer electrons | needs | so it can make |
      | --- | --- | --- | --- |
      | O | 6 | 2 | one double bond (or two single bonds) |
      | N | 5 | 3 | one triple bond (or three single bonds) |
      | C | 4 | 4 | four bonds in any mix: e.g. two doubles, or one double + two singles |

  - type: check
    title: Quick check
    questions: [n2-shared-electrons]

  - type: diagram
    diagram: chem-covalent-bonding-multiple-bonds
    alt: "Dot-and-cross diagrams with outer shells as overlapping circles. O2: two O atoms share two pairs in the overlap, and each O has two lone pairs. N2: two N atoms share three pairs, and each N has one lone pair. CO2: a central C overlaps with an O on each side, sharing two pairs with each; each O has two lone pairs and C has none. C2H4: two C atoms share two pairs, each with one electron from each carbon; each C also shares one pair with each of two H atoms, with one electron from each bonded atom."
    caption: |
      Every C, N and O still ends on 8. The extra shared pairs are what lets them get there.

  - type: explain
    title: The four molecules
    body: |
      | molecule | bonds | lone pairs |
      | --- | --- | --- |
      | $\text{O}_2$ | $\text{O}{=}\text{O}$ | 2 on each O (4 in total) |
      | $\text{N}_2$ | $\text{N}{\equiv}\text{N}$ | 1 on each N (2 in total) |
      | $\text{CO}_2$ | $\text{O}{=}\text{C}{=}\text{O}$ | 2 on each O, none on C |
      | $\text{C}_2\text{H}_4$ | one $\text{C}{=}\text{C}$, four C–H | none |

  - type: example
    title: Working out O₂ step by step
    problem: |
      Describe the bonding in an oxygen molecule.
    steps:
      - |
        Each O has **6** outer electrons and needs **2** more.
      - |
        Each O puts **2** electrons into the bond: **2 shared pairs**, a double bond.
      - |
        Each O has $6 - 2 = 4$ electrons left: **2 lone pairs**.
      - |
        Check: 2 shared pairs (4 electrons) + 2 lone pairs (4 electrons) = 8 around each O.
    answer: |
      $\text{O}{=}\text{O}$, with two lone pairs on each oxygen.

  - type: check
    title: Count the pairs
    questions: [co2-pairs, oxygen-error, ethene-cloze]

  - type: misconceptions
    items:
      - wrong: "In $\\text{CO}_2$, carbon has two lone pairs because it has only two bonds."
        right: "It has two **double** bonds: 4 shared pairs, which is all 8 of its outer electrons. No lone pairs on C."
      - wrong: "A double bond means each atom gives two electrons to the other."
        right: "Each atom puts two electrons into the shared region; all four are shared by both atoms."
      - wrong: "Ethene's carbons have a lone pair each, because there are only three atoms around each C."
        right: "Each C forms two C–H bonds and one C=C (two pairs): 4 shared pairs, 8 electrons, no lone pairs."

  - type: exam
    body: |
      - Dot-and-cross for multiple bonds: put **all** the shared electrons in the overlap, in pairs (e.g. 4 electrons for a double bond), and keep lone pairs on the outer part of each circle.
      - A quick count settles most marks: every C, N and O should have 8 outer electrons around it.
      - $\text{N}_2$: one lone pair on each N is often forgotten.

  - type: takeaways
    items:
      - "Double bond = 2 shared pairs; triple bond = 3 shared pairs."
      - "O₂: O=O, 2 lone pairs on each O. N₂: N≡N, 1 lone pair on each N."
      - "CO₂: O=C=O, no lone pairs on C. C₂H₄: one C=C and four C–H."
      - "Bonds formed = electrons needed to reach 8, whatever mix of single, double and triple."

  - type: check
    title: Explain it
    questions: [nitrogen-vs-chlorine]

questions:
  - id: n2-shared-electrons
    format: mcq
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      How many electrons are **shared** between the two atoms in a nitrogen molecule, $\text{N}_2$?
    options:
      - text: "2"
        why: |
          That's one shared pair, a single bond. Each N would then have only 6 outer electrons.
      - text: "3"
        why: |
          Each N shares 3 of its electrons, but electrons are shared in **pairs**, so count both atoms' contributions.
      - text: "6"
        correct: true
        why: |
          Three shared pairs: 3 electrons from each N, 6 in total. That's the triple bond.
      - text: "10"
        why: |
          10 is the total number of outer electrons in $\text{N}_2$, including the two lone pairs that aren't shared.
    explanation: |
      Each N has 5 outer electrons and needs 3 more, so each shares 3: $\text{N}{\equiv}\text{N}$ holds 6 shared electrons. The other 4 are one lone pair on each N.

  - id: co2-pairs
    format: numeric
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      In one molecule of carbon dioxide, $\text{CO}_2$, how many **shared pairs** and how many **lone pairs** are there in total?
    fields:
      - label: "shared pairs ="
        answer: 4
      - label: "lone pairs ="
        answer: 4
    explanation: |
      $\text{O}{=}\text{C}{=}\text{O}$: two double bonds = 4 shared pairs. Each O has $6 - 2 = 4$ unshared electrons = 2 lone pairs, so 4 lone pairs in total. C has none.

  - id: oxygen-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.1"]
    prompt: |
      A student works out the bonding in $\text{O}_2$. Which line contains the first error?
    lines:
      - "Each O atom has 6 outer electrons."
      - "Each O needs 2 more electrons to reach 8."
      - "So the atoms share two pairs of electrons: a double bond."
      - "That leaves each O atom with 3 lone pairs."
      - "Each O now has 8 electrons around it."
    errorLine: 4
    fix: |
      Each O uses 2 of its 6 electrons in the bond, leaving 4 electrons: 2 lone pairs.
    explanation: |
      Check the count: 2 shared pairs + 3 lone pairs would be 10 electrons, too many. With 2 lone pairs it's 8.

  - id: ethene-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.4.1"]
    prompt: |
      In ethene, $\text{C}_2\text{H}_4$, each carbon atom forms {{1}} shared pairs in total: one with each of two hydrogen atoms and two with the other carbon, which make a {{2}} bond.
    blanks:
      - accept: ["4", "four"]
      - accept: ["double", "C=C", "C=C double", "double covalent"]
    explanation: |
      Carbon needs 4 more electrons, so it makes 4 shared pairs: two C–H single bonds and a C=C double bond.

  - id: nitrogen-vs-chlorine
    format: explain
    difficulty: 3
    objectives: ["3.4.1"]
    prompt: |
      Explain why the atoms in a nitrogen molecule are joined by a **triple** bond, but the atoms in a chlorine molecule are joined by a **single** bond.
    model: |
      A nitrogen atom has 5 outer electrons, so it needs 3 more to reach 8. Each N therefore shares 3 electrons, giving 3 shared pairs: a triple bond, with one lone pair left on each N. A chlorine atom has 7 outer electrons and needs only 1 more, so each Cl shares 1 electron: one shared pair, a single bond, with three lone pairs on each Cl.
    keyPoints:
      - "N has 5 outer electrons and needs 3 more to reach 8"
      - "So two N atoms share 3 pairs: a triple bond"
      - "Cl has 7 outer electrons and needs only 1 more"
      - "So two Cl atoms share 1 pair: a single bond"
    explanation: |
      The number of bonds an atom makes equals the number of electrons it needs to complete its outer shell of 8.
