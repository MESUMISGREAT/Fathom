id: redox-processes-oxidation-numbers
subject: "9701"
topic: "6.1"
title: "Oxidation numbers: the bookkeeping number of redox"
summary: An oxidation number is the charge an atom would have if the bonding electrons went to the more electronegative atom. A few rules let you work it out for any formula.
order: 1
minutes: 8
kind: core
objectives: ["6.1.1"]
prerequisites: [electronegativity-bonding-what-it-is, ionic-bonding-electrostatic-attraction]
