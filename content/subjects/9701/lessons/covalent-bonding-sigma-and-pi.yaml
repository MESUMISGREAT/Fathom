id: covalent-bonding-sigma-and-pi
subject: "9701"
topic: "3.4"
title: "σ and π bonds: head-on versus sideways overlap"
summary: Covalent bonds form by orbital overlap; σ bonds from direct overlap between the nuclei, π bonds from sideways overlap of p orbitals above and below.
order: 5
minutes: 5
objectives: ["3.4.2"]
prerequisites: [covalent-bonding-double-and-triple-bonds, atoms-orbital-shapes]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 2, parts (a) and (b): σ and π bonds by
    orbital overlap in H₂, C₂H₆, C₂H₄, HCN and N₂). All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can describe how σ and π bonds form by orbital overlap, and count the σ and π bonds in $\text{H}_2$, $\text{C}_2\text{H}_6$, $\text{C}_2\text{H}_4$, $\text{HCN}$ and $\text{N}_2$.

  - type: explain
    title: A double bond is not two copies of a single bond
    body: |
      Dot-and-cross diagrams tell you **how many** pairs are shared. They don't tell you **where** those electrons are.

      To see that, zoom in to orbitals. A covalent bond forms when an orbital from each atom **overlaps**, and the shared pair sits in the overlap.

  - type: explain
    title: Two ways to overlap
    body: |
      - **σ (sigma) bond**: **direct** (head-on, end-on) overlap of orbitals **between** the bonding atoms. The electron density is concentrated on the line joining the two nuclei.
      - **π (pi) bond**: **sideways** overlap of two adjacent **p orbitals**. The electron density is **above and below** the σ bond, not on the line joining the nuclei.

  - type: diagram
    diagram: chem-covalent-bonding-sigma-pi-overlap
    alt: "Three rows. Row 1: two spherical s orbitals, each with a nucleus dot, overlap head-on to give a σ bond, shown as one shaded oval around both nuclei; note: density on the line between the nuclei (e.g. H2). Row 2: two dumbbell-shaped p orbitals lying along the same line overlap end-on to give a σ bond, a shaded region between the nuclei with small lobes behind each nucleus (e.g. Cl2). Row 3: two parallel upright p orbitals side by side overlap sideways to give a π bond, shown as two shaded regions, one above and one below the dashed line joining the nuclei; note: one π bond."
    caption: |
      Head-on gives σ, between the nuclei. Sideways gives π, above and below.

  - type: check
    title: Quick check
    questions: [what-is-sigma, pi-cloze]

  - type: explain
    title: The counting rules
    body: |
      The **first** bond between two atoms is always σ. Any extra bonds are π.

      | bond | σ | π |
      | --- | --- | --- |
      | single | 1 | 0 |
      | double | 1 | 1 |
      | triple | 1 | 2 |

  - type: explain
    title: The five molecules
    body: |
      | molecule | bonds | σ | π |
      | --- | --- | --- | --- |
      | $\text{H}_2$ | H–H (two 1s orbitals overlap head-on) | 1 | 0 |
      | $\text{C}_2\text{H}_6$ | one C–C, six C–H | 7 | 0 |
      | $\text{C}_2\text{H}_4$ | one C=C, four C–H | 5 | 1 |
      | $\text{HCN}$ | one C–H, one C≡N | 2 | 2 |
      | $\text{N}_2$ | one N≡N | 1 | 2 |

  - type: diagram
    diagram: chem-covalent-bonding-ethene-pi-bond
    alt: "Ethene. Left, viewed from above: the flat σ framework, two carbons joined by a double line and each bonded to two hydrogens; each C–H bond and one of the C=C lines are labelled σ and the other C=C line is labelled π; note: 5 σ bonds in one flat plane, about 120° around each carbon. Right, side on: the plane of the molecule is a horizontal line through the two carbon nuclei; each carbon has an upright p orbital, and they overlap sideways to give two shaded regions, π above and π below the plane; note: one π bond is both shaded regions together."
    caption: |
      In ethene, the π bond is a cloud above and below the flat molecule: two regions, one bond.

  - type: example
    title: Counting in hydrogen cyanide
    problem: |
      How many σ and π bonds are there in $\text{H}{-}\text{C}{\equiv}\text{N}$?
    steps:
      - |
        C–H is a single bond: **1 σ**.
      - |
        C≡N is a triple bond: **1 σ + 2 π**.
      - |
        Add them up: $1 + 1 = 2$ σ bonds and $2$ π bonds.
    answer: |
      2 σ and 2 π.

  - type: check
    title: Count them
    questions: [ethene-count, hcn-count, propenenitrile-count]

  - type: deeper
    title: Where do two π bonds go?
    body: |
      In $\text{N}_2$ and $\text{HCN}$ there are two π bonds. If the σ bond lies along the x-axis, one π bond comes from two $p_y$ orbitals and the other from two $p_z$ orbitals.

      So the two π bonds are **at right angles** to each other, one above-and-below and one in-front-and-behind the σ bond.

  - type: intuition
    title: Why π is the weaker partner
    body: |
      Head-on overlap is like two people shaking hands: a firm, full grip. Sideways overlap is like two people standing shoulder to shoulder: they touch, but less.

      Less overlap means a weaker bond. So a π bond is weaker than a σ bond, which is why alkenes react by breaking their π bond. Where the analogy breaks down: orbitals aren't solid bodies; "overlap" means how much the two electron clouds share the same space.

  - type: misconceptions
    items:
      - wrong: "A double bond is two σ bonds."
        right: "Two atoms can only overlap head-on once. A double bond is **1 σ + 1 π**."
      - wrong: "A π bond is two bonds, because it has two lobes."
        right: "The lobes above and below the σ bond together make **one** π bond, holding one pair of electrons."
      - wrong: "π bonds can form by sideways overlap of s orbitals."
        right: "π bonds come from sideways overlap of **p** orbitals. s orbitals are spherical, so they can only overlap head-on (σ)."

  - type: exam
    body: |
      - Describe σ as "**direct** (head-on) overlap of orbitals **between** the bonding atoms" and π as "**sideways** overlap of **adjacent p orbitals**, **above and below** the σ bond". Those words are what the marks are for.
      - Count σ bonds by counting **every** bond line once (single, double or triple all have exactly one σ). Then add the π bonds from the extra lines.

  - type: takeaways
    items:
      - "σ bond: direct (head-on) overlap of orbitals; density on the line between the nuclei."
      - "π bond: sideways overlap of adjacent p orbitals; density above and below the σ bond."
      - "Single = 1σ; double = 1σ + 1π; triple = 1σ + 2π."
      - "C₂H₆: 7σ; C₂H₄: 5σ + 1π; HCN: 2σ + 2π; N₂: 1σ + 2π; H₂: 1σ."

  - type: check
    title: Spot the slip
    questions: [no-pi, n2-error]

questions:
  - id: what-is-sigma
    format: mcq
    difficulty: 1
    objectives: ["3.4.2"]
    prompt: |
      Which statement describes how a **σ bond** forms?
    options:
      - text: Sideways overlap of two adjacent p orbitals
        why: |
          That's a π bond, with electron density above and below the bond axis.
      - text: Direct (head-on) overlap of orbitals between the two bonding atoms
        correct: true
        why: |
          Head-on overlap puts the shared pair right on the line between the nuclei: a σ bond.
      - text: Complete transfer of an electron from one atom to the other
        why: |
          Transfer of electrons makes ions (ionic bonding), not a covalent bond.
      - text: Overlap of orbitals above and below the line joining the nuclei
        why: |
          Density above and below the axis describes a π bond.
    explanation: |
      σ: direct overlap, density between the nuclei. π: sideways overlap of p orbitals, density above and below.

  - id: pi-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.4.2"]
    prompt: |
      A π bond forms by the {{1}} overlap of two adjacent {{2}} orbitals, with the electron density above and below the σ bond.
    blanks:
      - accept: ["sideways", "side-on", "side on", "lateral", "parallel"]
      - accept: ["p", "2p", "p-type"]
    explanation: |
      Only p orbitals can overlap sideways like this. The result is one π bond with two lobes of electron density.

  - id: ethene-count
    format: numeric
    difficulty: 2
    objectives: ["3.4.2"]
    prompt: |
      How many σ bonds and how many π bonds are there in one molecule of ethene, $\text{C}_2\text{H}_4$?
    fields:
      - label: "σ bonds ="
        answer: 5
      - label: "π bonds ="
        answer: 1
    explanation: |
      Four C–H single bonds (4σ) plus one C=C double bond (1σ + 1π): 5σ and 1π.

  - id: hcn-count
    format: numeric
    difficulty: 2
    objectives: ["3.4.2"]
    prompt: |
      How many σ bonds and how many π bonds are there in one molecule of hydrogen cyanide, $\text{HCN}$ ($\text{H}{-}\text{C}{\equiv}\text{N}$)?
    fields:
      - label: "σ bonds ="
        answer: 2
      - label: "π bonds ="
        answer: 2
    explanation: |
      C–H is 1σ; C≡N is 1σ + 2π. Total: 2σ and 2π.

  - id: propenenitrile-count
    format: numeric
    difficulty: 3
    objectives: ["3.4.2"]
    prompt: |
      Propenenitrile has the structure $\text{H}_2\text{C}{=}\text{CH}{-}\text{C}{\equiv}\text{N}$. How many σ bonds and how many π bonds are there in one molecule?
    fields:
      - label: "σ bonds ="
        answer: 6
      - label: "π bonds ="
        answer: 3
    explanation: |
      Every bond line contributes one σ: three C–H, one C=C, one C–C and one C≡N = 6 σ. The extra π bonds: one in C=C and two in C≡N = 3 π.

  - id: no-pi
    format: mcq
    difficulty: 1
    objectives: ["3.4.2"]
    prompt: |
      Which molecule contains **no** π bonds?
    options:
      - text: |
          $\text{C}_2\text{H}_6$
        correct: true
        why: |
          Ethane has only single bonds (one C–C, six C–H), so all 7 bonds are σ.
      - text: |
          $\text{C}_2\text{H}_4$
        why: |
          The C=C double bond contains one π bond.
      - text: |
          $\text{N}_2$
        why: |
          The N≡N triple bond contains two π bonds.
      - text: |
          $\text{CO}_2$
        why: |
          Each C=O double bond contains a π bond, so $\text{CO}_2$ has two.
    explanation: |
      π bonds only appear in double and triple bonds. A molecule with only single bonds has only σ bonds.

  - id: n2-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.2"]
    prompt: |
      A student describes the bonding in $\text{N}_2$. Which line contains the first error?
    lines:
      - "$\\text{N}_2$ has a triple bond, $\\text{N}{\\equiv}\\text{N}$."
      - "One of the three bonds forms by direct, head-on overlap of orbitals: a σ bond."
      - "The other bonds form by sideways overlap of p orbitals: π bonds."
      - "So $\\text{N}_2$ contains 2 σ bonds and 1 π bond."
      - "Each N atom also keeps one lone pair."
    errorLine: 4
    fix: |
      A triple bond is 1 σ + 2 π, so $\text{N}_2$ contains 1 σ bond and 2 π bonds.
    explanation: |
      Two atoms can only overlap head-on once, so there is only ever **one** σ bond between them. The other two bonds are π.
