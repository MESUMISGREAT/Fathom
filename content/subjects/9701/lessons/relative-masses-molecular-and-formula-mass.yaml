id: relative-masses-molecular-and-formula-mass
subject: "9701"
topic: "2.1"
title: Relative molecular mass and relative formula mass
summary: How to define and calculate Mr for molecules and relative formula mass for giant structures, and how to tell which term to use.
order: 3
minutes: 4
objectives: ["2.1.2"]
prerequisites: [relative-masses-relative-atomic-mass]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 2.1, learning outcome 2.1.2, relative molecular mass and
    relative formula mass parts). All Ar values are the 1 d.p. values from the Cambridge
    Data Booklet Periodic Table. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define **relative molecular mass**, $M_r$, and **relative formula mass**, calculate both from Data Booklet $A_r$ values, and choose the right term for a substance.

  - type: explain
    title: It's just adding up
    body: |
      Once you know $A_r$ values, the mass of anything is a sum. Water, $\text{H}_2\text{O}$, has two H and one O:

      $$M_r(\text{H}_2\text{O}) = 2(1.0) + 16.0 = 18.0$$

      The only genuinely tricky part is the **name**: molecular mass or formula mass? That depends on whether the substance is made of molecules at all.

  - type: definition
    term: Relative molecular mass, Mr
    body: |
      The weighted mean mass of a molecule of a compound compared with one twelfth of the mass of one atom of carbon-12.

  - type: definition
    term: Relative formula mass
    body: |
      The weighted mean mass of a formula unit of a compound compared with one twelfth of the mass of one atom of carbon-12.

      Used for substances with **giant structures**, which have no molecules: ionic compounds such as NaCl, and giant covalent compounds such as $\text{SiO}_2$.

  - type: diagram
    diagram: chem-relative-masses-molecule-vs-lattice
    alt: "Two panels. Left, headed separate molecules: water, shows four separate bent H2O molecules, one circled and labelled one molecule; underneath: use one molecule, H2O; relative molecular mass, Mr; 2(1.0) + 16.0 = 18.0. Right, headed giant lattice: sodium chloride, shows a 2D slice of alternating small positive Na+ ions and larger negative Cl- ions in a grid, noted as continuing in every direction; one Na+ and one Cl- are boxed. Underneath: no molecules, use the formula unit, NaCl; relative formula mass; 23.0 + 35.5 = 58.5."
    caption: Molecules get Mr. Giant lattices get relative formula mass. The arithmetic is identical.

  - type: intuition
    title: Why "weighted mean" again?
    body: |
      Every element in the molecule is a mix of isotopes, so different water molecules really do have slightly different masses. $M_r$ is the average over all of them, which is why we build it from $A_r$ values (already weighted means).

  - type: check
    title: Which term?
    questions: [mr-meaning, which-term]

  - type: example
    title: Brackets and big formulas
    problem: |
      Calculate (a) $M_r$ of ethanol, $\text{CH}_3\text{CH}_2\text{OH}$, and (b) the relative formula mass of aluminium sulfate, $\text{Al}_2(\text{SO}_4)_3$.
    steps:
      - |
        (a) Count atoms first: ethanol has 2 C, 6 H (3 + 2 + 1) and 1 O.
      - |
        $M_r = 2(12.0) + 6(1.0) + 16.0 = 46.0$
      - |
        (b) The subscript 3 multiplies **everything** inside the brackets: 3 S and $3 \times 4 = 12$ O, plus 2 Al.
      - |
        $2(27.0) + 3(32.1) + 12(16.0) = 54.0 + 96.3 + 192.0 = 342.3$
    answer: |
      (a) 46.0 (b) 342.3. No units on either.

  - type: check
    title: Calculate
    questions: [mr-sulfuric, calcium-nitrate]

  - type: misconceptions
    items:
      - wrong: "NaCl has a relative molecular mass of 58.5."
        right: "NaCl is a giant ionic lattice with no molecules, so 58.5 is its **relative formula mass**. (Exam papers sometimes write $M_r$ loosely for ionic compounds; the number is the same.)"
      - wrong: "$\\text{Ca(OH)}_2$ is $40.1 + 16.0 + 1.0$."
        right: "The 2 multiplies the whole bracket: $40.1 + 2(16.0 + 1.0) = 74.1$."
      - wrong: "$M_r$ is measured in g."
        right: "$M_r$ has **no units**. The *molar mass* (next topic) is the same number in $\\text{g mol}^{-1}$."

  - type: deeper
    title: Working backwards
    body: |
      Given a total and all but one $A_r$, subtract. If $\text{X}_2\text{O}$ has $M_r = 62.0$, then $2A_r(\text{X}) = 62.0 - 16.0 = 46.0$, so $A_r(\text{X}) = 23.0$: X is sodium. Remember to divide by the number of X atoms.

  - type: check
    title: Bugs and backwards
    questions: [hydroxide-error, unknown-metal]

  - type: exam
    body: |
      - Use the $A_r$ values from the Data Booklet Periodic Table (Cl = 35.5, Mg = 24.3, Cu = 63.5…), not rounded whole numbers.
      - Write out the sum, e.g. $2(27.0) + 3(32.1) + 12(16.0)$. It makes slips visible, and method marks are real.
      - Definitions: swap "atom of an element" for "molecule" ($M_r$) or "formula unit" (relative formula mass); the carbon-12 ending stays the same.

  - type: takeaways
    items:
      - "$M_r$ = weighted mean mass of a molecule compared with one twelfth of the mass of one carbon-12 atom."
      - "Relative formula mass: the same idea for a formula unit; use it for giant ionic and giant covalent structures."
      - "Add up $A_r$ values; a subscript after a bracket multiplies everything inside it."
      - "No units, ever."

questions:
  - id: mr-meaning
    format: mcq
    difficulty: 1
    objectives: ["2.1.2"]
    prompt: |
      $M_r$ of oxygen gas, $\text{O}_2$, is 32.0. What does this mean?
    options:
      - text: |
          One $\text{O}_2$ molecule has a mass of 32.0 g.
        why: |
          One molecule is about $5 \times 10^{-23}$ g. 32.0 g is the mass of a whole mole of them.
      - text: |
          The weighted mean mass of an $\text{O}_2$ molecule is 32.0 times one twelfth of the mass of a carbon-12 atom.
        correct: true
        why: |
          That's the definition: compared with 1 u.
      - text: |
          An $\text{O}_2$ molecule is 32.0 times as heavy as a carbon-12 atom.
        why: |
          The comparison is with one **twelfth** of a carbon-12 atom.
      - text: |
          An $\text{O}_2$ molecule contains 32 protons.
        why: |
          It contains 16 protons. The 32 counts protons and neutrons together (roughly), and it's a mass ratio, not a particle count.
    explanation: |
      $M_r$ is a ratio against 1 u, so it has no units and says nothing about grams for a single molecule.

  - id: which-term
    format: mcq
    difficulty: 3
    objectives: ["2.1.2"]
    prompt: |
      For which list is **relative formula mass** (not relative molecular mass) the correct term for every substance?
    options:
      - text: |
          NaCl, $\text{CO}_2$, MgO
        why: |
          $\text{CO}_2$ is made of separate molecules, so it has an $M_r$.
      - text: |
          NaCl, MgO, $\text{SiO}_2$
        correct: true
        why: |
          Two giant ionic lattices and one giant covalent lattice. None has molecules, so all three use formula units.
      - text: |
          $\text{H}_2\text{O}$, $\text{NH}_3$, $\text{CH}_4$
        why: |
          All simple molecules: relative molecular mass for each.
      - text: |
          $\text{SiO}_2$, $\text{CO}_2$, $\text{SO}_2$
        why: |
          Similar-looking formulas, different structures. $\text{SiO}_2$ is giant covalent, but $\text{CO}_2$ and $\text{SO}_2$ are simple molecules.
    explanation: |
      Ask "does it have molecules?" Giant structures (ionic or covalent) don't, so they get relative formula mass.

  - id: mr-sulfuric
    format: numeric
    difficulty: 1
    objectives: ["2.1.2"]
    prompt: |
      Calculate $M_r$ of sulfuric acid, $\text{H}_2\text{SO}_4$. Use $A_r$: H = 1.0, S = 32.1, O = 16.0.
    fields:
      - answer: 98.1
        tolerance: { abs: 0.05 }
    explanation: |
      $2(1.0) + 32.1 + 4(16.0) = 2.0 + 32.1 + 64.0 = 98.1$

  - id: calcium-nitrate
    format: numeric
    difficulty: 2
    objectives: ["2.1.2"]
    prompt: |
      Calculate the relative formula mass of calcium nitrate, $\text{Ca(NO}_3)_2$. Use $A_r$: Ca = 40.1, N = 14.0, O = 16.0.
    fields:
      - answer: 164.1
        tolerance: { abs: 0.05 }
    explanation: |
      The bracket doubles: 2 N and 6 O. $\;40.1 + 2(14.0) + 6(16.0) = 40.1 + 28.0 + 96.0 = 164.1$

  - id: hydroxide-error
    format: spot-error
    difficulty: 2
    objectives: ["2.1.2"]
    prompt: |
      A student calculates the relative formula mass of calcium hydroxide. Which line contains the first error?
    lines:
      - |
        Calcium hydroxide is $\text{Ca(OH)}_2$.
      - |
        $A_r$ values: Ca = 40.1, O = 16.0, H = 1.0.
      - |
        Relative formula mass $= 40.1 + 16.0 + 1.0$
      - |
        $= 57.1$
    errorLine: 3
    fix: |
      The subscript 2 applies to the whole OH group: $40.1 + 2(16.0 + 1.0) = 40.1 + 34.0 = 74.1$.
    explanation: |
      Brackets exist precisely so the subscript multiplies everything inside. Line 4 is the right sum of the wrong expression.

  - id: unknown-metal
    format: numeric
    difficulty: 3
    objectives: ["2.1.2"]
    prompt: |
      The chloride of a metal X has the formula $\text{XCl}_2$ and a relative formula mass of 111.1. Calculate $A_r$ of X. ($A_r$: Cl = 35.5)
    fields:
      - answer: 40.1
        tolerance: { abs: 0.05 }
    explanation: |
      $A_r(\text{X}) = 111.1 - 2(35.5) = 111.1 - 71.0 = 40.1$, so X is calcium.
