id: bronsted-lowry-strong-weak
subject: "9701"
topic: "7.2"
title: Strong vs weak acids — it's about dissociation
summary: "Strong acids fully dissociate; weak acids partially dissociate. Ka, pKa, and what this means for conductivity, pH, and reaction rates."
order: 5
minutes: 5
objectives: ["7.2.6"]
prerequisites: ["bronsted-lowry-ph-scale"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 6; strong vs weak acids).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can explain the difference between strong and weak acids in terms of dissociation, define Ka and pKa, and compare conductivity, pH, and reaction rates for equal concentrations.

  - type: explain
    title: The key difference — dissociation
    body: |
      **Strong acid**: 100% dissociated in aqueous solution.
      $$\text{HCl(aq)} \rightarrow \text{H}^+(\text{aq}) + \text{Cl}^-(\text{aq})$$
      (Single arrow — reaction goes to completion)

      **Weak acid**: Partially dissociated — an equilibrium.
      $$\text{CH}_3\text{COOH(aq)} \rightleftharpoons \text{H}^+(\text{aq}) + \text{CH}_3\text{COO}^-(\text{aq})$$
      (Equilibrium arrow — most molecules stay intact)

      At 0.1 M: HCl gives [H⁺] = 0.1 M (pH 1.0). CH₃COOH gives [H⁺] ≈ 0.0013 M (pH 2.87).

  - type: definition
    term: Strong acid
    body: |
      An acid that is **fully dissociated** into ions in aqueous solution. Examples: HCl, HNO₃, H₂SO₄ (first proton only).

  - type: definition
    term: Weak acid
    body: |
      An acid that is **partially dissociated** in aqueous solution, establishing an equilibrium. Examples: CH₃COOH, H₂CO₃, NH₄⁺, HCOOH.

  - type: check
    title: Strong or weak?
    questions: [strong-weak-classify, dissociation-arrow]

  - type: explain
    title: The acid dissociation constant, Ka
    body: |
      For a weak acid HA:
      $$\text{HA(aq)} \rightleftharpoons \text{H}^+(\text{aq}) + \text{A}^-(\text{aq})$$

      $$K_a = \frac{[\text{H}^+][\text{A}^-]}{[\text{HA}]}$$

      Units: mol dm⁻³ (usually omitted). **Large Ka = stronger acid** (more dissociated).
      Typical weak acid Ka: 10⁻³ to 10⁻¹⁰.

      **pKa = –log₁₀Ka** (like pH but for Ka). **Smaller pKa = stronger acid.**

      | Acid | Ka (mol dm⁻³) | pKa |
      |------|---------------|-----|
      | HCl | ~10⁷ (effectively infinite) | ~–7 |
      | HNO₃ | ~10³ | ~–3 |
      | HCOOH (methanoic) | 1.6 × 10⁻⁴ | 3.80 |
      | CH₃COOH (ethanoic) | 1.7 × 10⁻⁵ | 4.76 |
      | HCN (hydrocyanic) | 4.9 × 10⁻¹⁰ | 9.31 |
      | NH₄⁺ | 5.6 × 10⁻¹⁰ | 9.25 |

  - type: intuition
    title: Ka as a "dissociation score"
    body: |
      Think of Ka as a **percentage score** for how much the acid dissociates.
      - Ka = 1 → 50% dissociated (at 1 M, roughly)
      - Ka = 10⁻⁵ → ~0.3% dissociated (at 1 M)
      - Ka = 10⁻¹⁰ → ~0.001% dissociated

      The concentration matters too — dilute a weak acid and it dissociates *more* (Le Chatelier), but [H⁺] still drops overall.

  - type: example
    title: Using Ka to find [H⁺] and pH
    problem: |
      0.10 mol dm⁻³ CH₃COOH has Ka = 1.7 × 10⁻⁵ mol dm⁻³. Calculate [H⁺] and pH.
    steps:
      - "Set up: CH₃COOH ⇌ H⁺ + CH₃COO⁻"
      - "Initial: 0.10 M, 0, 0"
      - "Equilibrium: 0.10 – x, x, x"
      - "Ka = x² / (0.10 – x) = 1.7 × 10⁻⁵"
      - "Since Ka is small, x ≪ 0.10, so 0.10 – x ≈ 0.10"
      - "x² = 1.7 × 10⁻⁵ × 0.10 = 1.7 × 10⁻⁶"
      - "x = √(1.7 × 10⁻⁶) = 1.30 × 10⁻³ M = [H⁺]"
      - "pH = –log₁₀(1.30 × 10⁻³) = 2.89"
    answer: |
      [H⁺] = 1.30 × 10⁻³ mol dm⁻³, pH = 2.89

  - type: check
    title: Ka and pH
    questions: [ka-calculation, pka-comparison]

  - type: explain
    title: Consequences of strong vs weak
    body: |
      | Property | Strong acid (0.1 M) | Weak acid (0.1 M) |
      |----------|---------------------|-------------------|
      | [H⁺] | 0.1 M | ~0.001 M (depends on Ka) |
      | pH | 1.0 | ~3 |
      | Conductivity | High (lots of ions) | Low (few ions) |
      | Reaction rate with Mg | Fast | Slow (lower [H⁺]) |
      | Reaction rate with CaCO₃ | Fast | Slow |

      **Key insight**: At the *same concentration*, strong acids have higher [H⁺], lower pH, higher conductivity, and faster reaction rates because they're fully dissociated.

  - type: misconceptions
    items:
      - wrong: "Weak acid = dilute acid."
        right: "Strength ≠ concentration. 10 M CH₃COOH is concentrated but WEAK. 0.0001 M HCl is dilute but STRONG."
      - wrong: "Weak acids don't react with metals/carbonates."
        right: "They do, just more slowly because [H⁺] is lower. Given time, they can fully react (Le Chatelier shifts equilibrium as products form)."
      - wrong: "All H₂SO₄ protons are strong."
        right: "Only the FIRST proton is strong (Ka₁ ≈ 10³). The second (HSO₄⁻ ⇌ H⁺ + SO₄²⁻) has Ka₂ = 1.2 × 10⁻² — it's a weak acid!"
      - wrong: "pKa is only for weak acids."
        right: "Strong acids have pKa too (negative values). pKa = –log₁₀Ka works for everything."

  - type: takeaways
    items:
      - "Strong acid = 100% dissociated (single arrow). Weak acid = partial dissociation (equilibrium arrow)."
      - "Ka = [H⁺][A⁻]/[HA]. Large Ka = strong acid. pKa = –log₁₀Ka. Small pKa = strong acid."
      - "At same concentration: strong acid → lower pH, higher conductivity, faster reactions."
      - "Strength ≠ concentration. A weak acid can be concentrated; a strong acid can be dilute."
      - "H₂SO₄: first proton strong, second proton weak (Ka₂ = 0.012)."

questions:
  - id: strong-weak-classify
    format: mcq
    difficulty: 1
    objectives: ["7.2.6"]
    prompt: |
      Which of these is a **weak acid**?
    options:
      - text: "HCl"
        why: "Strong acid — fully dissociated."
      - text: "HNO₃"
        why: "Strong acid — fully dissociated."
      - text: "CH₃COOH"
        correct: true
        why: "Ethanoic acid — partially dissociated, Ka = 1.7 × 10⁻⁵."
      - text: "H₂SO₄"
        why: "Strong acid (first proton)."
    explanation: |
      CH₃COOH is the classic weak acid. The others are strong acids (fully dissociated).

  - id: dissociation-arrow
    format: mcq
    difficulty: 1
    objectives: ["7.2.6"]
    prompt: |
      Which equation correctly represents a weak acid HA in water?
    options:
      - text: "HA(aq) → H⁺(aq) + A⁻(aq)"
        why: "Single arrow means 100% dissociation — that's a strong acid."
      - text: "HA(aq) ⇌ H⁺(aq) + A⁻(aq)"
        correct: true
        why: "Equilibrium arrow shows partial dissociation — a weak acid."
      - text: "HA(aq) + H₂O(l) → H₃O⁺(aq) + A⁻(aq)"
        why: "Single arrow again — implies completion."
      - text: "HA(aq) + H₂O(l) ⇌ H₃O⁺(aq) + A⁻(aq)"
        why: "Technically correct but the simplified version (without water) is preferred for Ka expressions."
    explanation: |
      Weak acids establish an equilibrium — use the equilibrium arrow ⇌.

  - id: ka-calculation
    format: numeric
    difficulty: 2
    objectives: ["7.2.6"]
    prompt: |
      A 0.050 mol dm⁻³ solution of a weak acid HA has [H⁺] = 2.0 × 10⁻³ mol dm⁻³. Calculate Ka. Give your answer in scientific notation to 2 significant figures (e.g. 1.2e-4).
    answer: 8.3e-5
    tolerance: 0.1e-5
    explanation: |
      Ka = [H⁺]² / (c – [H⁺]) ≈ (2.0 × 10⁻³)² / 0.050 = 4.0 × 10⁻⁶ / 0.050 = 8.0 × 10⁻⁵.
      (Using exact: (2.0e-3)² / (0.050 - 0.002) = 4.0e-6 / 0.048 = 8.33e-5 ≈ 8.3e-5)

  - id: pka-comparison
    format: mcq
    difficulty: 2
    objectives: ["7.2.6"]
    prompt: |
      Acid X has pKa = 3.5. Acid Y has pKa = 5.2. Which statement is correct?
    options:
      - text: "Acid X is weaker than acid Y"
        why: "Lower pKa = stronger acid."
      - text: "Acid X is stronger than acid Y"
        correct: true
        why: "pKa 3.5 < 5.2, so X has larger Ka, thus X is the stronger acid."
      - text: "They have the same strength"
        why: "Different pKa values mean different strengths."
      - text: "Cannot compare without concentrations"
        why: "pKa is an intrinsic property; concentrations don't change relative strength."
    explanation: |
      Smaller pKa → larger Ka → stronger acid. 3.5 < 5.2, so acid X is stronger.