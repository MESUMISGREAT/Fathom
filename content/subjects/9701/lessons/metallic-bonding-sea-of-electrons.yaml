id: metallic-bonding-sea-of-electrons
subject: "9701"
topic: "3.3"
title: "Metallic bonding: positive ions in a sea of electrons"
summary: Metallic bonding is the electrostatic attraction between positive metal ions and delocalised electrons; more electrons and smaller ions make it stronger.
order: 1
minutes: 5
objectives: ["3.3.1"]
prerequisites: [ionic-bonding-electrostatic-attraction, atoms-electronic-configurations]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.3, learning outcome 1). Melting and boiling points (Li, Na,
    K, Mg, Al) and ionic radii (Na⁺ 0.102 nm, Mg²⁺ 0.072 nm) are standard data-book values,
    rounded, used for illustration. All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can define metallic bonding, picture it as positive ions in a sea of delocalised electrons, and explain why the bonding is stronger in some metals than others.

  - type: explain
    title: What a lump of sodium really is
    body: |
      A sodium atom has one lonely outer electron: $1\text{s}^2\,2\text{s}^2\,2\text{p}^6\,3\text{s}^1$.

      In solid sodium, every atom lets go of that 3s electron. It isn't handed to a partner; it is released into the **whole lump** of metal.

      What's left behind:
      - a regular **lattice** of positive $\text{Na}^{+}$ **ions**;
      - a "sea" of **delocalised electrons**, one per atom, free to move through the whole structure.

  - type: definition
    term: Metallic bonding
    body: |
      The **electrostatic attraction** between **positive metal ions** and **delocalised electrons**.

  - type: diagram
    diagram: chem-metallic-bonding-sea-of-electrons
    alt: "Two panels, each a 4 by 3 grid of positive ions with small dots for delocalised electrons in the gaps between them. Left, sodium: 12 ions labelled plus, with 12 electrons, one per atom; caption says weaker metallic bonding. Right, magnesium: 12 smaller ions labelled 2 plus, with 24 electrons, two per atom; caption says stronger metallic bonding. A key says each dot is a delocalised electron, free to move through the whole lattice."
    caption: |
      Same number of ions, twice the electrons, and smaller ions with double the charge: magnesium's sea pulls much harder.

  - type: intuition
    title: A shared kitty
    body: |
      Imagine each atom throwing its outer electrons into a shared kitty. Nobody owns the money any more, but everyone stays close to it, and that keeps the group together.

      Where it breaks down: the "kitty" isn't in one place. The electrons spread through the whole metal, and the glue is **electrostatic attraction** between opposite charges, acting in **all directions**.

  - type: explain
    title: Words that earn the mark
    body: |
      - **Delocalised**: not tied to one atom or one bond. Each electron belongs to the whole lattice.
      - **Positive ions**, not atoms: the metal particles have lost their outer electrons.
      - Only the **outer** (valence) electrons are delocalised. Inner shells stay put.
      - There are **no negative ions** in a metal. The only negative particles are the electrons.

  - type: check
    title: Quick check
    questions: [define-metallic-bonding, particles-in-magnesium]

  - type: explain
    title: What makes the bonding stronger?
    body: |
      The attraction gets stronger when:
      - each atom gives **more delocalised electrons** (so the ion has a **higher charge**);
      - the ions are **smaller**, so the electron sea is closer to the ions' charge.

      Stronger metallic bonding takes more energy to overcome, so melting and boiling points go up.

  - type: explain
    title: The numbers back it up
    body: |
      | metal | ion | delocalised electrons per atom | melting point | boiling point |
      | --- | --- | --- | --- | --- |
      | sodium | $\text{Na}^{+}$ | 1 | 98 °C | 883 °C |
      | magnesium | $\text{Mg}^{2+}$ | 2 | 650 °C | 1090 °C |
      | aluminium | $\text{Al}^{3+}$ | 3 | 660 °C | about 2500 °C |

      Down Group 1 the ions get **bigger**, so the attraction gets weaker: lithium melts at 181 °C, sodium at 98 °C, potassium at 63 °C.

  - type: deeper
    title: Why boiling points show it better
    body: |
      Melting only loosens the lattice; the ions and electrons are still attracted in the liquid. Boiling separates the atoms completely, so boiling points track the strength of metallic bonding more clearly. That's why aluminium's lead over magnesium is small for melting but huge for boiling.

  - type: check
    title: Stronger or weaker?
    questions: [delocalised-moles, strongest-metal]

  - type: misconceptions
    items:
      - wrong: "Metallic bonding is the attraction between metal atoms."
        right: "It's between **positive ions** and **delocalised electrons**. Say ions, not atoms."
      - wrong: "Metals contain positive and negative ions, like a salt."
        right: "The only negative particles in a metal are the delocalised electrons. Ionic lattices have negative ions; metals don't."
      - wrong: "Metallic bonding is weak because metals are soft or bendy."
        right: "Bendiness comes from layers of ions sliding while the electron sea keeps holding them. The bonding itself is usually strong: most metals have high melting points."
      - wrong: "All the electrons in a metal are delocalised."
        right: "Only the outer (valence) electrons are. Inner-shell electrons stay with their own ion."

  - type: exam
    body: |
      - The definition needs three things: **electrostatic attraction**, **positive (metal) ions**, **delocalised electrons**.
      - To compare two metals, name the factors and link them to attraction: "Mg²⁺ has a higher charge and is smaller than Na⁺, and Mg releases two delocalised electrons per atom, so the electrostatic attraction is stronger and more energy is needed to overcome it."
      - Never say "intermolecular forces" for a metal. There are no molecules.

  - type: takeaways
    items:
      - "Metallic bonding: electrostatic attraction between positive metal ions and delocalised electrons."
      - "Picture a lattice of positive ions in a sea of delocalised (outer-shell) electrons."
      - "More delocalised electrons per atom (higher ion charge) means stronger bonding."
      - "Smaller ions mean stronger bonding; bigger ions down a group mean weaker bonding."

  - type: check
    title: Explain it like an examiner
    questions: [stronger-when, melting-point-error]

questions:
  - id: define-metallic-bonding
    format: text
    style: definition
    difficulty: 1
    objectives: ["3.3.1"]
    prompt: |
      Define **metallic bonding**.
    accept:
      - "the electrostatic attraction between positive metal ions and delocalised electrons"
      - "electrostatic attraction between positive metal ions and delocalised electrons"
      - "the electrostatic attraction between the positive metal ions and the delocalised electrons"
      - "the electrostatic attraction between positive ions and delocalised electrons"
      - "the electrostatic attraction between metal cations and delocalised electrons"
      - "the electrostatic attraction between positive metal ions and a sea of delocalised electrons"
      - "the electrostatic attraction between positive metal ions and the sea of delocalised electrons"
      - "the electrostatic attraction between a lattice of positive metal ions and delocalised electrons"
      - "the electrostatic attraction between a lattice of positive ions and a sea of delocalised electrons"
      - "the electrostatic attraction between delocalised electrons and positive metal ions"
      - "the electrostatic attraction between positive metal ions and delocalized electrons"
      - "the electrostatic attraction between positive ions and delocalized electrons"
      - "electrostatic attraction between positive ions and delocalised electrons"
    model: |
      The electrostatic attraction between positive metal ions and delocalised electrons.
    explanation: |
      Check yours for all three parts: electrostatic attraction, positive (metal) ions, delocalised electrons. "Atoms" instead of "ions" would lose the mark.

  - id: particles-in-magnesium
    format: mcq
    difficulty: 1
    objectives: ["3.3.1"]
    prompt: |
      Which best describes the particles in a piece of solid magnesium?
    options:
      - text: |
          $\text{Mg}^{2+}$ ions and $\text{O}^{2-}$ ions held together by electrostatic attraction
        why: |
          That's magnesium oxide, an ionic compound. Pure magnesium has no negative ions.
      - text: |
          $\text{Mg}$ atoms joined by shared pairs of electrons
        why: |
          Shared pairs between two atoms are covalent bonds. In a metal the electrons aren't shared by pairs of atoms; they belong to the whole lattice.
      - text: |
          $\text{Mg}^{2+}$ ions in a sea of delocalised electrons
        correct: true
        why: |
          Each Mg atom releases its two 3s electrons into the lattice, leaving $\text{Mg}^{2+}$ ions attracted to the delocalised electrons.
      - text: |
          $\text{Mg}$ molecules held together by intermolecular forces
        why: |
          Metals aren't made of molecules. They're giant lattices held by metallic bonding.
    explanation: |
      Metal = lattice of positive ions + delocalised electrons. For magnesium, two electrons per atom go into the sea.

  - id: delocalised-moles
    format: numeric
    difficulty: 3
    objectives: ["3.3.1"]
    prompt: |
      Aluminium ($1\text{s}^2\,2\text{s}^2\,2\text{p}^6\,3\text{s}^2\,3\text{p}^1$) forms $\text{Al}^{3+}$ ions in the metal lattice. How many **moles** of delocalised electrons are there in a 2.70 g piece of aluminium? Give your answer to 3 significant figures. ($A_r$: Al = 27.0)
    fields:
      - answer: 0.3
        tolerance: { rel: 0.005 }
        sigFigs: 3
        unit: mol
    explanation: |
      Moles of Al = 2.70 ÷ 27.0 = 0.100 mol. Each Al atom releases its 3 outer electrons (3s² 3p¹) to become $\text{Al}^{3+}$, so 0.100 × 3 = 0.300 mol of delocalised electrons.

  - id: strongest-metal
    format: mcq
    difficulty: 2
    objectives: ["3.3.1"]
    prompt: |
      Which of these metals has the **strongest** metallic bonding?
    options:
      - text: Lithium
        why: |
          $\text{Li}^{+}$ is small, but each atom gives only one delocalised electron.
      - text: Sodium
        why: |
          One delocalised electron per atom and a larger ion than $\text{Li}^{+}$: weaker than lithium, never mind magnesium.
      - text: Potassium
        why: |
          The largest ion here and only one electron per atom: the weakest of the four.
      - text: Magnesium
        correct: true
        why: |
          Two delocalised electrons per atom and a small, doubly charged ion ($\text{Mg}^{2+}$): the strongest attraction.
    explanation: |
      More delocalised electrons and a smaller, more highly charged ion give stronger attraction. Magnesium (melting point 650 °C) beats lithium (181 °C), sodium (98 °C) and potassium (63 °C).

  - id: stronger-when
    format: cloze
    difficulty: 1
    objectives: ["3.3.1"]
    prompt: |
      Metallic bonding is stronger when the metal ions have a higher {{1}} and a smaller {{2}}, because then the attraction between the ions and the delocalised electrons is stronger.
    blanks:
      - accept: ["charge", "positive charge", "ionic charge", "charge on the ion"]
      - accept: ["radius", "ionic radius", "size", "ion size", "radii"]
    explanation: |
      Higher charge means more delocalised electrons per ion; a smaller radius brings the electron sea closer to the ions' charge. Both strengthen the attraction.

  - id: melting-point-error
    format: spot-error
    difficulty: 2
    objectives: ["3.3.1"]
    prompt: |
      A student explains why magnesium has a higher melting point than sodium. Which line contains the first error?
    lines:
      - "Sodium forms $\\text{Na}^{+}$ ions and magnesium forms $\\text{Mg}^{2+}$ ions in their lattices."
      - "Magnesium releases two delocalised electrons per atom; sodium releases one."
      - "$\\text{Mg}^{2+}$ ions are smaller than $\\text{Na}^{+}$ ions."
      - "So the intermolecular forces between magnesium molecules are stronger."
      - "More energy is needed to overcome them, so magnesium melts at a higher temperature."
    errorLine: 4
    fix: |
      So the electrostatic attraction between the positive ions and the delocalised electrons (the metallic bonding) is stronger in magnesium.
    explanation: |
      Metals have no molecules, so "intermolecular forces" is wrong. The reasoning in lines 1–3 leads to stronger **metallic bonding**.
