id: bonding-structure-giant-molecular
subject: "9701"
topic: "4.2"
title: "Giant molecular solids: diamond, graphite and silicon(IV) oxide"
summary: Three giant covalent networks — why diamond is hard, why graphite is slippery and conducting, and why SiO2 has such a high melting point.
order: 3
minutes: 5
objectives: ["4.2.1"]
prerequisites: [covalent-bonding-shared-pairs]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.2, learning outcome 1(c): describe, in simple terms, the lattice
    structure of a giant molecular crystalline solid, including silicon(IV) oxide,
    graphite and diamond). All questions are original.
    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
    agent as the writer, not a human teacher): facts cross-checked against
    authoritative web sources, every worked example and answer key recalculated,
    syllabus coverage re-confirmed against the 9701 syllabus, and all six diagrams
    rendered and inspected in light and dark.
blocks:
  - type: objective
    body: |
      By the end you can describe the structures of diamond, graphite and silicon(IV) oxide, and link each structure to its properties.

  - type: explain
    title: One giant network of covalent bonds
    body: |
      A **giant molecular** (giant covalent) solid has no separate molecules at all.

      Every atom is joined to its neighbours by **strong covalent bonds**, and the network repeats in every direction — the whole crystal is, in effect, one giant molecule.

      Breaking such a solid means breaking covalent bonds, which takes a lot of energy. That single idea explains the very high melting points.

  - type: definition
    term: Giant molecular (giant covalent) structure
    body: |
      A **giant molecular** solid is a lattice in which all the atoms are joined by **strong covalent bonds** extending throughout the structure. There are no individual molecules.

  - type: explain
    title: Diamond
    body: |
      - Each carbon atom forms **4 covalent bonds** in a rigid **tetrahedral** arrangement.
      - The network repeats in three dimensions, so the whole crystal is one giant structure.
      - Consequence: **extremely hard** (used in cutting tools), and a **very high melting point** — every bond must be broken.
      - It does **not** conduct electricity: all its electrons are locked in covalent bonds, so nothing is free to move.

  - type: explain
    title: Graphite
    body: |
      - Each carbon atom forms **3 covalent bonds**, joining the atoms into flat **hexagonal layers**.
      - The fourth outer electron of each carbon is **delocalised within the layer** — free to move along it.
      - Consequences: graphite **conducts electricity** (the delocalised electrons carry charge), and the layers **slide over each other** easily (used as a lubricant and in pencil "lead").
      - The layers are only weakly attracted to one another, yet the atoms within a layer are strongly bonded, so graphite still sublimes at very high temperature rather than melting normally.

  - type: explain
    title: Silicon(IV) oxide, SiO₂
    body: |
      - Each silicon atom bonds to **4 oxygen atoms**; each oxygen atom bridges **2 silicon atoms**.
      - The result is a 3D giant covalent network, similar in spirit to diamond but alternating Si and O.
      - Consequence: very hard, very high melting point (about $1700\ ^\circ\text{C}$), and no electrical conduction — all electrons are in bonds.

  - type: diagram
    diagram: chem-bonding-structure-giant-molecular
    alt: "Three panels. Left, diamond: a central carbon atom joined by four solid covalent bonds to four carbons around it, each of those joined outward to another carbon, with a note that the network continues in 3D; captions read each C forms 4 covalent bonds in a rigid 3D network, very hard, very high melting point, does not conduct. Middle, graphite: two flat hexagonal sheets of carbon atoms stacked one above the other, joined within each sheet by solid bonds, dashed weak forces between the layers, dots within the sheets for delocalised electrons, and an arrow showing the sheets slide; captions read each C forms 3 bonds, the delocalised electrons let it conduct, sheets slide so it is a lubricant. Right, silicon(IV) oxide: a slice of the network, big spheres are silicon and small spheres are oxygen, each silicon joined through bridging oxygens to its neighbours; captions read each Si bonds to 4 O and each O bridges 2 Si, a giant covalent network with no SiO2 molecules, very high melting point about 1700 degrees Celsius. Footer: giant molecular solids, strong covalent bonds throughout the structure."

  - type: intuition
    title: Scaffold, sheets and chain-link fence
    body: |
      Diamond is a 3D scaffold of welded steel: rigid in every direction.

      Graphite is a stack of paper sheets — strong within a sheet, but the sheets slide. The delocalised electrons are like a layer of free charge painted on each sheet.

      $\text{SiO}_2$ is chain-link fence made of two metals (Si and O) welded alternately: tough and heat-proof.

  - type: check
    title: Structures
    questions: [diamond-4-bonds, graphite-conducts]

  - type: misconceptions
    items:
      - wrong: "Graphite conducts because the electrons move between the layers."
        right: "The delocalised electrons are **within each layer** (each carbon uses 3 of its 4 outer electrons in the layer). They move freely along the layers."
      - wrong: "Diamond melts at about 3500 °C like a normal solid."
        right: 'At ordinary pressure, diamond (like graphite) **sublimes** rather than melting — carbon''s normal-pressure transition is around $3800\ ^\circ\text{C}$. Quote ''very high melting point'' qualitatively unless data is given.'
      - wrong: "Graphite is soft because its covalent bonds are weak."
        right: "Its covalent bonds are strong. The layers slide because the **forces between layers** are weak; within a layer graphite is strong."
      - wrong: "SiO₂ exists as discrete SiO₂ molecules."
        right: 'There are no $\text{SiO}_2$ molecules — it is a giant network; the formula only gives the 1 : 2 ratio of Si to O.'

  - type: check
    title: Properties from structure
    questions: [sio2-formula, diamond-insulator]

  - type: exam
    body: |
      - "Explain why graphite conducts electricity": **delocalised electrons** that are **free to move** along the layers. Mentioning both halves earns the mark.
      - "Explain the high melting point of diamond/SiO₂": strong **covalent bonds throughout** the giant structure must be broken.
      - Comparisons must name the structure detail first (4 bonds vs 3 bonds; layers vs 3D network), then the property.

  - type: takeaways
    items:
      - "Giant molecular solids: every atom joined by strong covalent bonds in one endless network."
      - "Diamond: 4 bonds per C, tetrahedral — hard, very high melting point, non-conducting."
      - "Graphite: 3 bonds per C, hexagonal layers with delocalised electrons in the layers — conducts and slips."
      - "SiO₂: Si bonded to 4 O, O bridging 2 Si — hard, very high melting point, non-conducting."

questions:
  - id: diamond-4-bonds
    format: numeric
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      In diamond, how many covalent bonds does each carbon atom form with its neighbours?
    fields:
      - answer: 4
        unit: bonds
    explanation: |
      Each carbon uses all 4 of its outer electrons in covalent bonds, arranged tetrahedrally. That rigid 4-bond network is what makes diamond so hard.

  - id: graphite-conducts
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      Why does graphite conduct electricity while diamond does not?
    options:
      - text: |
          Graphite contains ionic bonds that free the electrons.
        why: |
          Graphite is fully covalent — there are no ions in it at all.
      - text: |
          In graphite, one outer electron per carbon is delocalised within the layers and is free to move.
        correct: true
        why: |
          Each carbon forms only 3 bonds in graphite, leaving a delocalised electron per atom that moves freely along the layers and carries current.
      - text: |
          Diamond has no electrons, so it cannot conduct.
        why: |
          Diamond has plenty of electrons — but all of them are locked in covalent bonds, with none free to move.
      - text: |
          Graphite's layers slide past each other and carry the current.
        why: |
          The sliding explains lubrication, not conductivity. It is the mobile electrons within the layers that carry charge.
    explanation: |
      Conductivity needs mobile charged particles: graphite has delocalised electrons within its layers; diamond has none free.

  - id: sio2-formula
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      What does the formula $\text{SiO}_2$ tell you about silicon(IV) oxide?
    options:
      - text: |
          It is a molecule made of one silicon and two oxygen atoms.
        why: |
          There are no discrete $\text{SiO}_2$ molecules — the structure is one giant network.
      - text: |
          It gives the ratio of silicon atoms to oxygen atoms in the giant covalent network.
        correct: true
        why: |
          Like NaCl, the formula is a ratio: 1 Si to 2 O across the whole lattice, in which each Si bonds to 4 O and each O bridges 2 Si.
      - text: |
          It shows that SiO₂ is an ionic compound of Si⁴⁺ and O²⁻.
        why: |
          SiO₂ is giant covalent — the atoms share electrons rather than transferring them.
      - text: |
          It shows that oxygen forms double bonds with silicon.
        why: |
          In the lattice each oxygen bridges two silicon atoms with single bonds; the formula is a ratio, not a bonding picture.
    explanation: |
      Giant structures use formulas as ratios. $\text{SiO}_2$ = 1 : 2 ratio of Si to O in the network.

  - id: diamond-insulator
    format: cloze
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      Diamond does not conduct electricity because all of its outer electrons are held in {{1}} bonds and none are {{2}} to move.
    blanks:
      - accept: ["covalent", "covalent bonds", "the covalent", "strong covalent", "c-c", "carbon-carbon", "c–c"]
      - accept: ["free", "delocalised", "delocalized", "free electrons", "free to move", "mobile", "free and mobile"]
    explanation: |
      Conductivity needs mobile charged particles. Diamond's electrons are all locked in C–C covalent bonds, so nothing can carry current.
