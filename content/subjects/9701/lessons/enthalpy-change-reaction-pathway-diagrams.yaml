id: enthalpy-change-reaction-pathway-diagrams
subject: "9701"
topic: "5.1"
title: "Reaction pathway diagrams: the hill between reactants and products"
summary: An energy profile shows where the reactants start, where the products end up, how steep the barrier is (activation energy) and how far the reaction drops or climbs (ΔH).
order: 2
minutes: 7
kind: core
objectives: ["5.1.2"]
prerequisites: [enthalpy-change-exothermic-endothermic]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027 (learning outcome 5.1.2, construct and interpret a reaction pathway diagram in terms
    of enthalpy change of reaction and activation energy). Numeric labels are illustrative; all
    questions are original. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can **draw** a reaction pathway diagram and **read off** three things from one: the enthalpy change of the reaction, the activation energy, and whether the reaction is exothermic or endothermic.

  - type: explain
    title: A hill you have to get over
    body: |
      Molecules do not react just by bumping into each other politely. They must collide with enough energy to start breaking bonds — like pushing a boulder over a ridge before it can roll down the other side.

      A reaction pathway diagram is a picture of that journey:

      - the **y-axis** is enthalpy (energy stored in the chemicals);
      - the **x-axis** is the progress of the reaction (no numbers — it is just "start → finish");
      - the **curve** rises to a maximum and then comes down.

  - type: diagram
    diagram: chem-enthalpy-change-pathway
    alt: >-
      Two energy profiles side by side, enthalpy on the vertical axis and reaction progress on the
      horizontal. Left (exothermic): reactants at a high level, a peak above them, products lower
      than the reactants by ΔH; the height from reactants to the peak is labelled activation
      energy Ea, and the drop from reactants to products is labelled ΔH, negative. Right
      (endothermic): reactants low, a higher peak, products above the reactants; ΔH is labelled
      positive. Both curves are single humps with the peak clearly above both levels.
    caption: |
      The height of the hump is the activation energy; the difference in levels is ΔH.

  - type: definition
    term: Activation energy, Ea
    body: |
      The **minimum energy** that colliding particles must have in order for a reaction to occur.

      On a pathway diagram it is the vertical distance from the **reactants'** level up to the **peak** of the curve.

  - type: explain
    title: Reading the three numbers
    body: |
      Once you have the picture, almost every question is a subtraction:

      1. **Is it exothermic or endothermic?** Compare the levels. Products lower than reactants = exothermic.
      2. **What is $\Delta H$?** $\Delta H = H_\text{products} - H_\text{reactants}$. Exothermic gives a negative value; endothermic a positive one.
      3. **What is $E_a$?** Peak minus reactants — always positive, because energy must be paid in.

      Careful with reverse reactions: the activation energy going **backwards** is measured from the products up to the same peak, so

      $$E_{a,\text{reverse}} = E_{a,\text{forward}} - \Delta H$$

      With an exothermic reaction the reverse activation energy is larger than the forward one — that is why the reverse reaction is harder.

  - type: example
    title: "Worked example: reading a profile"
    problem: |
      On a pathway diagram the reactants sit at $120\ \text{kJ mol}^{-1}$, the peak at $195\ \text{kJ mol}^{-1}$ and the products at $45\ \text{kJ mol}^{-1}$.

      Calculate the activation energy and $\Delta H$, and state whether the reaction is exothermic.
    steps:
      - |
        Activation energy is peak minus reactants:
        $$E_a = 195 - 120 = 75\ \text{kJ mol}^{-1}$$
      - |
        Enthalpy change is products minus reactants:
        $$\Delta H = 45 - 120 = -75\ \text{kJ mol}^{-1}$$
      - |
        $\Delta H$ is negative, so the reaction is **exothermic** — the products sit lower than the
        reactants.
      - |
        Sanity check with the reverse reaction: $E_{a,\text{reverse}} = E_a - \Delta H = 75 - (-75) = 150\ \text{kJ mol}^{-1}$. It is bigger, as it must be for an exothermic reaction.
    answer: |
      $E_a = 75\ \text{kJ mol}^{-1}$, $\Delta H = -75\ \text{kJ mol}^{-1}$, exothermic.

  - type: check
    title: Quick check
    questions: [read-ea, read-delta-h, exo-or-endo-profile]

  - type: explain
    title: Drawing one that earns the marks
    body: |
      There are four things an examiner looks for:

      1. A labelled **y-axis: enthalpy** (or "energy") and a labelled **x-axis: progress of reaction**.
      2. **Reactants** and **products** marked as horizontal levels — the products lower for an exothermic reaction, higher for an endothermic one.
      3. A **peak** above both levels, labelled "$E_a$" from the reactants' level to the peak.
      4. A labelled **$\Delta H$** between the two levels, with the arrow pointing from reactants to products.

      Use straight horizontal lines for the levels and a smooth curve for the hump. No numbers are
      needed on the x-axis.

  - type: explain
    title: What changes the picture
    body: |
      - A **catalyst** provides a different route with a **lower peak**, so $E_a$ falls. The levels of reactants and products do not move, so **$\Delta H$ is unchanged**. A catalyst can speed up the forward and reverse reactions equally.
      - **More energy in the reactants** (hotter mixture) does not change the diagram — it changes how many particles have enough energy to get over the barrier.
      - A **different reaction** entirely means new levels and a new peak.

  - type: misconceptions
    items:
      - wrong: ΔH is the height of the peak.
        right: |
          The peak height above the reactants is $E_a$. $\Delta H$ is the gap between the reactants'
          and products' levels.
      - wrong: The activation energy is measured from the bottom of the diagram to the peak.
        right: |
          Measure from the **reactants' level** to the peak. The absolute height of the y-axis
          depends on where you put zero, but $E_a$ must not.
      - wrong: A catalyst lowers ΔH, which is why the reaction is faster.
        right: |
          A catalyst lowers $E_a$ only. $\Delta H$ is fixed by the reactants and products
          themselves, so it is identical with or without the catalyst.
      - wrong: An endothermic reaction has no activation energy.
        right: |
          It still has a barrier — often a larger one. Even reactions that absorb energy overall
          must be given energy to start.
      - wrong: The curve itself is the path the particles follow in space.
        right: |
          The x-axis is reaction progress, not distance. The curve shows enthalpy as bonds break and
          re-form, not a roller-coaster track.

  - type: exam
    body: |
      - "Draw a reaction pathway diagram" for an exothermic reaction is a 3-mark question: levels the right way round, a peak, and $E_a$ and $\Delta H$ labelled.
      - If a value is asked for, show the subtraction. $E_a$ is always positive; $\Delta H$ carries a sign.
      - If a question says "the reaction is catalysed", redraw with a **lower peak only** — and say that $\Delta H$ is unchanged.
      - Watch the wording "energy released": in an exothermic reaction it equals $|\Delta H|$, not $E_a$.

  - type: check
    title: Check yourself
    questions: [catalyst-effect, reverse-ea, label-the-diagram]

  - type: takeaways
    items:
      - 'Pathway diagram: enthalpy on the y-axis, reaction progress on the x-axis.'
      - '$\Delta H = H_\text{products} - H_\text{reactants}$: products lower means exothermic.'
      - $E_a$ is the height from the reactants' level to the peak.
      - $E_{a,\text{reverse}} = E_{a,\text{forward}} - \Delta H$.
      - A catalyst lowers $E_a$ and leaves $\Delta H$ unchanged.

  - type: deeper
    title: Why there is a barrier at all
    body: |
      The barrier exists because bonds must be **stretched before they can break**. As two
      molecules approach, their electron clouds repel each other, so the energy rises; only when
      they are close and distorted enough can bonds start to rearrange and energy be released.

      The top of the curve is the **transition state**: an unstable arrangement that exists for a
      fraction of a vibration and immediately falls apart into products.

      This is also why temperature matters so much: the fraction of collisions with energy above
      $E_a$ grows very quickly with temperature, which is the subject of the rates topic.

questions:
  - id: read-ea
    format: numeric
    difficulty: 1
    objectives: ["5.1.2"]
    prompt: |
      On a reaction pathway diagram the reactants are at $80\ \text{kJ mol}^{-1}$ and the peak is at $145\ \text{kJ mol}^{-1}$.

      Calculate the activation energy.
    fields:
      - answer: 65
        tolerance: { abs: 0.5 }
        unit: kJ mol^-1
    explanation: |
      $E_a$ is the height from the reactants' level to the peak:
      $145 - 80 = 65\ \text{kJ mol}^{-1}$.

  - id: read-delta-h
    format: numeric
    difficulty: 2
    objectives: ["5.1.2"]
    prompt: |
      On a pathway diagram the reactants are at $60\ \text{kJ mol}^{-1}$, the peak at $150\ \text{kJ mol}^{-1}$ and the products at $95\ \text{kJ mol}^{-1}$.

      Calculate $\Delta H$ for the forward reaction, in $\text{kJ mol}^{-1}$.
    fields:
      - answer: 35
        tolerance: { abs: 0.5 }
        unit: kJ mol^-1
    explanation: |
      $\Delta H = H_\text{products} - H_\text{reactants} = 95 - 60 = +35\ \text{kJ mol}^{-1}$.
      It is positive because the products sit higher than the reactants, so the reaction is
      endothermic.

  - id: exo-or-endo-profile
    format: mcq
    difficulty: 1
    objectives: ["5.1.2"]
    prompt: |
      On a reaction pathway diagram, the products are drawn **higher** than the reactants. What does this tell you?
    options:
      - text: The reaction is endothermic, and ΔH is positive
        correct: true
        why: |
          The products store more enthalpy than the reactants, so energy must have been taken in:
          $\Delta H = H_\text{products} - H_\text{reactants} > 0$.
      - text: The reaction is exothermic, and ΔH is negative
        why: |
          Exothermic reactions have the products **lower** than the reactants, so energy is
          released.
      - text: The activation energy must be zero
        why: |
          A barrier is still needed to break bonds, even if the overall change absorbs energy.
      - text: The reaction cannot be catalysed
        why: |
          Catalysts lower the peak regardless of whether the products are higher or lower than the
          reactants.
    explanation: |
      Products higher than reactants means the chemicals have gained enthalpy from the
      surroundings: endothermic, $\Delta H$ positive.

  - id: catalyst-effect
    format: mcq
    difficulty: 2
    objectives: ["5.1.2"]
    prompt: |
      A catalyst is added to an exothermic reaction. What happens to the pathway diagram?
    options:
      - text: The peak is lower, so Ea falls; the reactant and product levels stay put
        correct: true
        why: |
          A catalyst provides an alternative route with a lower activation energy. It does not
          change the energy of the reactants or products, so $\Delta H$ is identical.
      - text: The products move lower, so ΔH becomes more negative
        why: |
          That would mean the catalyst had changed the chemicals formed, not the route to them.
      - text: Both the peak and the product level move down
        why: |
          Only the peak moves. The products are the same substances at the same enthalpy.
      - text: The curve becomes a straight line
        why: |
          The reaction still has a barrier; it is simply a smaller one.
    explanation: |
      Catalysts lower $E_a$ by offering a different mechanism. $\Delta H$ depends only on the
      reactants and products, so it is unchanged.

  - id: reverse-ea
    format: numeric
    difficulty: 3
    objectives: ["5.1.2"]
    prompt: |
      For an exothermic reaction, the forward activation energy is $90\ \text{kJ mol}^{-1}$ and $\Delta H = -40\ \text{kJ mol}^{-1}$.

      Calculate the activation energy of the reverse reaction.
    fields:
      - answer: 130
        tolerance: { abs: 1 }
        unit: kJ mol^-1
    explanation: |
      The reverse reaction starts at the products, which sit $40\ \text{kJ mol}^{-1}$ below the
      reactants, and must still climb to the same peak:
      $E_{a,\text{reverse}} = 90 - (-40) = 130\ \text{kJ mol}^{-1}$.

  - id: label-the-diagram
    format: mcq
    difficulty: 2
    objectives: ["5.1.2"]
    prompt: |
      Which label belongs on the **vertical gap between the reactants' level and the peak**?
    options:
      - text: Activation energy, Ea
        correct: true
        why: |
          That gap is the minimum energy colliding particles need to react.
      - text: Enthalpy change of reaction, ΔH
        why: |
          $\Delta H$ is the gap between the reactants' level and the products' level.
      - text: Bond energy
        why: |
          Bond energy is a property of one bond in one molecule, not a feature of the profile.
      - text: Enthalpy of formation
        why: |
          That is a named enthalpy change for forming one mole of a compound from its elements; it
          is not the height of the barrier.
    explanation: |
      Reactants to peak is $E_a$; reactants to products is $\Delta H$.
