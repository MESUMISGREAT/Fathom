id: bronsted-lowry-reactions
subject: "9701"
topic: "7.2"
title: Acid–base reactions — proton transfers in action
summary: "Writing Brønsted–Lowry acid–base equations, identifying conjugate pairs in reactions, and understanding the direction of proton transfer."
order: 3
minutes: 5
objectives: ["7.2.4"]
prerequisites: ["bronsted-lowry-theory"]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 7.2, learning outcome 4; acid–base reactions).
    Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can write balanced equations for Brønsted–Lowry acid–base reactions, identify both conjugate pairs, and predict the direction of proton transfer using relative acid/base strength.

  - type: explain
    title: The proton transfer equation
    body: |
      Every Brønsted–Lowry reaction is a **proton transfer** from an acid to a base:

      $$\text{Acid}_1 + \text{Base}_2 \rightleftharpoons \text{Conjugate base}_1 + \text{Conjugate acid}_2$$

      Two conjugate pairs, four species total. The proton moves from Acid₁ to Base₂.

  - type: example
    title: HCl + NH₃
    problem: |
      Write the Brønsted–Lowry equation for HCl reacting with NH₃ and label all four species.
    steps:
      - "HCl is a strong acid (proton donor). NH₃ is a base (proton acceptor)."
      - "HCl donates H⁺ to NH₃: HCl + NH₃ → Cl⁻ + NH₄⁺"
      - "Acid₁ = HCl, Base₂ = NH₃"
      - "Conjugate base of Acid₁ = Cl⁻"
      - "Conjugate acid of Base₂ = NH₄⁺"
    answer: |
      $$\text{HCl} + \text{NH}_3 \rightleftharpoons \text{Cl}^- + \text{NH}_4^+$$
      Acid₁ = HCl, Base₂ = NH₃, Conjugate base₁ = Cl⁻, Conjugate acid₂ = NH₄⁺

  - type: check
    title: Write the equation
    questions: [write-reaction-hno3-nh3, identify-pairs-h2so4-h2o]

  - type: explain
    title: Which way does the equilibrium lie?
    body: |
      Proton transfer is an **equilibrium**. The position depends on the **relative strengths** of the acids and bases involved.

      **Rule**: The equilibrium favours the side with the **weaker acid** and **weaker base**.

      - Strong acid + strong base → reaction goes to completion (products strongly favoured).
      - Weak acid + weak base → equilibrium lies somewhere in the middle.
      - Stronger acid donates to stronger base → proton transfers **towards the weaker acid/base**.

  - type: intuition
    title: The proton tug-of-war
    body: |
      Imagine two people (bases) pulling on a rope (the proton). The stronger base pulls harder.
      - If Base₂ is stronger than Conjugate base₁, it wins the proton → equilibrium shifts right.
      - If Conjugate base₁ is stronger, it pulls the proton back → equilibrium shifts left.

      **Stronger acid = more willing to give up proton.**
      **Stronger base = more eager to grab proton.**

  - type: example
    title: Predicting direction
    problem: |
      Predict the direction of equilibrium for:
      $$\text{CH}_3\text{COOH} + \text{NH}_3 \rightleftharpoons \text{CH}_3\text{COO}^- + \text{NH}_4^+$$
    steps:
      - "Acid₁ = CH₃COOH (weak acid, pKₐ ≈ 4.76). Base₂ = NH₃ (weak base, pK_b ≈ 4.75)."
      - "Conjugate base₁ = CH₃COO⁻ (weak base). Conjugate acid₂ = NH₄⁺ (weak acid, pKₐ ≈ 9.25)."
      - "Compare acid strengths: CH₃COOH (pKₐ 4.76) vs NH₄⁺ (pKₐ 9.25). CH₃COOH is the STRONGER acid."
      - "Equilibrium favours the side with the WEAKER acid (NH₄⁺)."
      - "So equilibrium lies to the **right** (products favoured)."
    answer: |
      Equilibrium lies to the right. CH₃COOH is a stronger acid than NH₄⁺, so it donates its proton to NH₃ more readily than NH₄⁺ donates to CH₃COO⁻.

  - type: check
    title: Equilibrium direction
    questions: [equilibrium-direction-1, equilibrium-direction-2]

  - type: explain
    title: Common acid–base reactions you'll see
    body: |
      | Reaction type | Example | Notes |
      |--------------|---------|-------|
      | Strong acid + strong base | HCl + NaOH → NaCl + H₂O | Goes to completion |
      | Strong acid + weak base | HCl + NH₃ → NH₄Cl | Products favoured |
      | Weak acid + strong base | CH₃COOH + NaOH → CH₃COONa + H₂O | Products favoured |
      | Weak acid + weak base | CH₃COOH + NH₃ ⇌ CH₃COO⁻ + NH₄⁺ | Equilibrium, often products favoured |
      | Acid + carbonate | 2HCl + CaCO₃ → CaCl₂ + H₂O + CO₂ | CO₂ evolution drives it |
      | Acid + metal | 2HCl + Mg → MgCl₂ + H₂ | H₂ evolution drives it |

      For **carbonates** and **metals**, the gas evolution (CO₂, H₂) pushes the equilibrium to completion — it's not just proton transfer.

  - type: example
    title: Acid + carbonate
    problem: |
      Write the ionic equation for H₂SO₄ reacting with Na₂CO₃.
    steps:
      - "Molecular: H₂SO₄ + Na₂CO₃ → Na₂SO₄ + H₂O + CO₂"
      - "Full ionic: 2H⁺ + SO₄²⁻ + 2Na⁺ + CO₃²⁻ → 2Na⁺ + SO₄²⁻ + H₂O + CO₂"
      - "Cancel spectator ions (Na⁺, SO₄²⁻):"
      - "Net ionic: 2H⁺ + CO₃²⁻ → H₂O + CO₂"
    answer: |
      $$2\text{H}^+ + \text{CO}_3^{2-} \rightarrow \text{H}_2\text{O} + \text{CO}_2$$

  - type: check
    title: Carbonate reaction
    questions: [carbonate-ionic, metal-acid-reaction]

  - type: misconceptions
    items:
      - wrong: "All acid–base reactions go to completion."
        right: "Only strong acid + strong base (or reactions producing gas/precipitate) go to completion. Weak acid/base reactions are equilibria."
      - wrong: "The conjugate base of a weak acid is a strong base."
        right: "Weak acid ⇔ weak conjugate base. Example: CH₃COOH (weak acid) ⇔ CH₃COO⁻ (weak base)."
      - wrong: "In HCl + H₂O, water is just the solvent."
        right: "Water is a reactant! It accepts the proton to become H₃O⁺. It's a base in the Brønsted–Lowry sense."

  - type: takeaways
    items:
      - "Brønsted–Lowry reaction: Acid₁ + Base₂ ⇌ Conjugate base₁ + Conjugate acid₂."
      - "Equilibrium favours the weaker acid and weaker base."
      - "Strong acid + strong base → completion. Weak + weak → equilibrium."
      - "Acid + carbonate → CO₂ + H₂O (gas drives completion)."
      - "Acid + metal → H₂ gas (gas drives completion)."
      - "Net ionic equations show the actual proton transfer."

questions:
  - id: write-reaction-hno3-nh3
    format: cloze
    difficulty: 2
    objectives: ["7.2.4"]
    prompt: |
      Complete the Brønsted–Lowry equation for nitric acid reacting with ammonia:
      HNO₃ + NH₃ ⇌ {{1}} + {{2}}
    blanks:
      - accept: ["NO3-", "NO₃⁻", "NO3^-", "NO₃-"]
      - accept: ["NH4+", "NH₄⁺", "NH4^+", "NH₄+"]
    explanation: |
      HNO₃ donates H⁺ to NH₃. Products: NO₃⁻ (conjugate base of HNO₃) and NH₄⁺ (conjugate acid of NH₃).

  - id: identify-pairs-h2so4-h2o
    format: mcq
    difficulty: 2
    objectives: ["7.2.4"]
    prompt: |
      In the reaction $\text{H}_2\text{SO}_4 + \text{H}_2\text{O} \rightleftharpoons \text{HSO}_4^- + \text{H}_3\text{O}^+$, which is the conjugate acid–base pair for water?
    options:
      - text: "H₂O / HSO₄⁻"
        why: "Different species, don't form a conjugate pair."
      - text: "H₂O / H₃O⁺"
        correct: true
        why: "Water accepts H⁺ to become H₃O⁺ — conjugate acid–base pair."
      - text: "H₂SO₄ / H₃O⁺"
        why: "Different species, don't form a conjugate pair."
      - text: "HSO₄⁻ / H₃O⁺"
        why: "Different species, don't form a conjugate pair."
    explanation: |
      Conjugate pairs differ by one H⁺. H₂O + H⁺ ⇌ H₃O⁺ makes them a conjugate pair.

  - id: equilibrium-direction-1
    format: mcq
    difficulty: 2
    objectives: ["7.2.4"]
    prompt: |
      For the equilibrium $\text{HCl} + \text{CH}_3\text{COO}^- \rightleftharpoons \text{Cl}^- + \text{CH}_3\text{COOH}$, which side is favoured?
    options:
      - text: "Left (reactants)"
        why: "HCl is a much stronger acid than CH₃COOH. Equilibrium favours the weaker acid (CH₃COOH), which is on the right."
      - text: "Right (products)"
        correct: true
        why: "HCl (strong acid) → CH₃COOH (weak acid). Proton transfers from stronger to weaker acid, so right side is favoured."
      - text: "Exactly halfway"
        why: "Not when one acid is strong and the other is weak."
      - text: "Cannot be determined"
        why: "We know relative acid strengths from the data booklet."
    explanation: |
      HCl is a strong acid (pKₐ ≈ -7), CH₃COOH is weak (pKₐ ≈ 4.76). Equilibrium favours the side with the weaker acid (right).

  - id: equilibrium-direction-2
    format: mcq
    difficulty: 3
    objectives: ["7.2.4"]
    prompt: |
      Which equilibrium lies furthest to the **left** (reactants favoured)?
    options:
      - text: "$\\text{HCl} + \\text{NH}_3 \\rightleftharpoons \\text{Cl}^- + \\text{NH}_4^+$"
        why: "HCl (strong acid) + NH₃ (weak base) → products strongly favoured (right)."
      - text: "$\\text{CH}_3\\text{COOH} + \\text{OH}^- \\rightleftharpoons \\text{CH}_3\\text{COO}^- + \\text{H}_2\\text{O}$"
        why: "OH⁻ is a stronger base than CH₃COO⁻, so equilibrium lies right."
      - text: "$\\text{NH}_4^+ + \\text{CH}_3\\text{COO}^- \\rightleftharpoons \\text{NH}_3 + \\text{CH}_3\\text{COOH}$"
        correct: true
        why: "NH₄⁺ (pKₐ 9.25) is a weaker acid than CH₃COOH (pKₐ 4.76). Equilibrium favours the weaker acid (NH₄⁺) on the LEFT."
      - text: "$\\text{H}_2\\text{SO}_4 + \\text{H}_2\\text{O} \\rightleftharpoons \\text{HSO}_4^- + \\text{H}_3\\text{O}^+$"
        why: "H₂SO₄ is strong acid, reaction favours right."
    explanation: |
      Compare the acids on each side. The equilibrium favours the WEAKER acid. NH₄⁺ (pKₐ 9.25) is weaker than CH₃COOH (pKₐ 4.76), so left side (with NH₄⁺) is favoured.

  - id: carbonate-ionic
    format: text
    style: short
    difficulty: 2
    objectives: ["7.2.4"]
    prompt: |
      Write the **net ionic equation** for the reaction between hydrochloric acid and sodium carbonate. Use H+ for H⁺, CO3^2- for CO₃²⁻, H2O for H₂O, CO2 for CO₂.
    accept:
      - "2H+ + CO3^2- -> H2O + CO2"
      - "2H+ + CO3^2- -> CO2 + H2O"
      - "2 H+ + CO3^2- -> H2O + CO2"
    model: "2H⁺ + CO₃²⁻ → H₂O + CO₂"
    explanation: |
      2H⁺ + CO₃²⁻ → H₂O + CO₂. Spectator ions (Na⁺, Cl⁻) are cancelled.

  - id: metal-acid-reaction
    format: mcq
    difficulty: 2
    objectives: ["7.2.4"]
    prompt: |
      What gas is produced when magnesium reacts with dilute hydrochloric acid?
    options:
      - text: "Oxygen"
        why: "Oxygen comes from electrolysis or peroxide decomposition, not metal + acid."
      - text: "Hydrogen"
        correct: true
        why: "Mg + 2HCl → MgCl₂ + H₂. The metal displaces hydrogen from the acid."
      - text: "Chlorine"
        why: "Chlorine comes from electrolysis of brine, not this reaction."
      - text: "Carbon dioxide"
        why: "CO₂ comes from carbonates + acid, not metals + acid."
    explanation: |
      Metal + acid → salt + hydrogen gas. Mg + 2H⁺ → Mg²⁺ + H₂.