id: shapes-molecules-predicting-shapes
subject: "9701"
topic: "3.5"
title: "Predicting the shape of any molecule or ion"
summary: A five-step electron count gives the bonding pairs and lone pairs on a central atom, so you can predict the shapes and angles of molecules and ions like NH₄⁺, H₃O⁺ and PCl₆⁻.
order: 3
minutes: 5
objectives: ["3.5.2"]
prerequisites: [shapes-molecules-lone-pairs, covalent-bonding-coordinate-bonds]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.5, learning outcome 2: predicting shapes and bond angles of
    molecules and ions analogous to those in 3.5.1). Bond angles quoted are the VSEPR
    predictions by analogy with the 3.5.1 examples. All questions are original.
blocks:
  - type: objective
    body: |
      By the end you can predict the shape and bond angle of a molecule or ion you've never seen, such as $\text{NH}_4^{+}$, $\text{H}_3\text{O}^{+}$, $\text{NH}_2^{-}$ or $\text{PCl}_6^{-}$.

  - type: explain
    title: Seven shapes, endless molecules
    body: |
      You already know seven shapes. Every new molecule or ion in this topic is one of them in disguise.

      The trick is to count the **bonding pairs** and **lone pairs** on the central atom, then match the pattern.

  - type: explain
    title: The lookup table
    body: |
      | bonding pairs | lone pairs | shape | bond angle | just like |
      | --- | --- | --- | --- | --- |
      | 2 | 0 | linear | 180° | $\text{CO}_2$ |
      | 3 | 0 | trigonal planar | 120° | $\text{BF}_3$ |
      | 4 | 0 | tetrahedral | 109.5° | $\text{CH}_4$ |
      | 3 | 1 | pyramidal | 107° | $\text{NH}_3$ |
      | 2 | 2 | non-linear | 104.5° | $\text{H}_2\text{O}$ |
      | 5 | 0 | trigonal bipyramidal | 120° and 90° | $\text{PF}_5$ |
      | 6 | 0 | octahedral | 90° | $\text{SF}_6$ |

  - type: explain
    title: The counting method
    body: |
      For a central atom with **single** bonds to H or halogen atoms:

      1. Start with the central atom's **outer electrons** (B and Al 3, C and Si 4, N and P 5, O and S 6).
      2. **Add 1** for each negative charge; **take away 1** for each positive charge.
      3. **Take away 1** for each bond (the central atom puts one electron into each).
      4. Lone pairs = electrons left ÷ 2.
      5. Look up bonding pairs + lone pairs in the table.

  - type: diagram
    diagram: chem-shapes-molecules-pair-counting
    alt: "A table of five numbered steps with two worked columns, H3O+ and NH2−. Step 1, outer-shell electrons on the central atom: O 6; N 5. Step 2, add 1 for each negative charge, take 1 for each positive charge: 6 − 1 = 5; 5 + 1 = 6. Step 3, take 1 for each single bond to H or a halogen: 5 − 3 = 2; 6 − 2 = 4. Step 4, lone pairs = electrons left ÷ 2: 1 lone pair; 2 lone pairs. Step 5, bonding pairs + lone pairs gives shape and angle: 3 + 1 pyramidal, 107°; 2 + 2 non-linear, 104.5°."
    caption: |
      Same five steps every time. $\text{H}_3\text{O}^{+}$ comes out like $\text{NH}_3$; $\text{NH}_2^{-}$ comes out like $\text{H}_2\text{O}$.

  - type: check
    title: Quick check
    questions: [h3o-shape, nh2-counts]

  - type: example
    title: The ammonium ion, NH₄⁺
    problem: |
      Predict the shape and bond angle of $\text{NH}_4^{+}$.
    steps:
      - |
        N has **5** outer electrons.
      - |
        Charge $+1$: take away 1 → **4**.
      - |
        Four N–H bonds use 4 → **0** left: no lone pairs.
      - |
        4 bonding pairs, 0 lone pairs → like $\text{CH}_4$.
    answer: |
      Tetrahedral, 109.5°.

  - type: example
    title: The hexachlorophosphate ion, PCl₆⁻
    problem: |
      Predict the shape and bond angle of $\text{PCl}_6^{-}$.
    steps:
      - |
        P has **5** outer electrons.
      - |
        Charge $-1$: add 1 → **6**.
      - |
        Six P–Cl bonds use 6 → **0** left.
      - |
        6 bonding pairs, 0 lone pairs → like $\text{SF}_6$ (P is in Period 3, so it can expand its octet).
    answer: |
      Octahedral, 90°.

  - type: explain
    title: Look-alike shortcut
    body: |
      Species with the **same numbers** of bonding pairs and lone pairs have the **same shape**:
      - $\text{NH}_4^{+}$, $\text{BF}_4^{-}$, $\text{AlCl}_4^{-}$, $\text{SiCl}_4$ → like $\text{CH}_4$: tetrahedral;
      - $\text{H}_3\text{O}^{+}$ → like $\text{NH}_3$: pyramidal;
      - $\text{NH}_2^{-}$ → like $\text{H}_2\text{O}$: non-linear;
      - $\text{BCl}_3$ → like $\text{BF}_3$: trigonal planar.

  - type: check
    title: Ions and look-alikes
    questions: [nh4-angle, pcl6-shape, sicl4-shape]

  - type: misconceptions
    items:
      - wrong: "A positive charge means add an electron."
        right: "A positive ion has **lost** an electron: take one away. A negative ion has gained one: add one."
      - wrong: "$\\text{H}_3\\text{O}^{+}$ has three bonds, so it's trigonal planar."
        right: "O still has a lone pair: 3 bonding pairs + 1 lone pair → pyramidal, 107°."
      - wrong: "Charge doesn't affect shape."
        right: "The charge changes the electron count, which changes the number of lone pairs. Compare $\\text{NH}_3$ (pyramidal) with $\\text{NH}_4^{+}$ (tetrahedral)."

  - type: exam
    body: |
      - Show your count: "N: 5 electrons, − 1 for the positive charge = 4, 4 bonding pairs, 0 lone pairs". It earns method marks even if you slip later.
      - Give the shape **and** the angle, and mention which known molecule it is like if that helps.
      - The method above is for single bonds. For double bonds, treat each double bond as one region (next lesson).

  - type: takeaways
    items:
      - "Count outer electrons on the central atom, adjust for charge, subtract one per bond, halve the rest for lone pairs."
      - "Then match bonding pairs + lone pairs to the seven shapes."
      - "NH₄⁺ tetrahedral 109.5°; H₃O⁺ pyramidal 107°; NH₂⁻ non-linear 104.5°; PCl₆⁻ octahedral 90°."
      - "Same pairs, same shape: look-alikes share shapes."

  - type: check
    title: Spot the slip
    questions: [alcl4-error, solid-pcl5-ions]

questions:
  - id: h3o-shape
    format: mcq
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      What is the shape of the oxonium ion, $\text{H}_3\text{O}^{+}$?
    options:
      - text: Trigonal planar
        why: |
          That would need 3 bonding pairs and no lone pairs. O still has a lone pair.
      - text: Pyramidal
        correct: true
        why: |
          O: 6 − 1 (positive charge) = 5; three O–H bonds use 3, leaving 2 = 1 lone pair. 3 bonding pairs + 1 lone pair, like $\text{NH}_3$.
      - text: Tetrahedral
        why: |
          Tetrahedral needs 4 bonding pairs. Here one of the 4 pairs is a lone pair.
      - text: Non-linear
        why: |
          Non-linear has 2 bonding pairs and 2 lone pairs, like water. $\text{H}_3\text{O}^{+}$ has 3 bonding pairs.
    explanation: |
      $\text{H}_3\text{O}^{+}$ has the same electron pairs as $\text{NH}_3$: pyramidal, about 107°.

  - id: nh2-counts
    format: numeric
    difficulty: 2
    objectives: ["3.5.2"]
    prompt: |
      For the amide ion, $\text{NH}_2^{-}$, give the number of bonding pairs and lone pairs on N, and the predicted H–N–H bond angle.
    fields:
      - label: "bonding pairs ="
        answer: 2
      - label: "lone pairs ="
        answer: 2
      - label: "bond angle ="
        answer: 104.5
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      N: 5 + 1 (negative charge) = 6. Two N–H bonds use 2, leaving 4 = 2 lone pairs. Like water: non-linear, 104.5°.

  - id: nh4-angle
    format: numeric
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      Predict the H–N–H bond angle in the ammonium ion, $\text{NH}_4^{+}$.
    fields:
      - answer: 109.5
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      N: 5 − 1 = 4; four N–H bonds use all 4, so no lone pairs. 4 bonding pairs → tetrahedral, 109.5°.

  - id: pcl6-shape
    format: mcq
    difficulty: 2
    objectives: ["3.5.2"]
    prompt: |
      What is the shape of the $\text{PCl}_6^{-}$ ion?
    options:
      - text: Trigonal bipyramidal
        why: |
          That's $\text{PCl}_5$ (5 bonding pairs). $\text{PCl}_6^{-}$ has six P–Cl bonds.
      - text: Octahedral
        correct: true
        why: |
          P: 5 + 1 = 6; six bonds use all 6. 6 bonding pairs, no lone pairs → octahedral, 90°.
      - text: Hexagonal planar
        why: |
          Six pairs get further apart in 3D than in a flat ring, so the shape is octahedral.
      - text: Tetrahedral
        why: |
          Tetrahedral is for 4 regions. There are 6 here.
    explanation: |
      Same pairs as $\text{SF}_6$ (6 bonding, 0 lone), so octahedral with 90° angles.

  - id: sicl4-shape
    format: text
    difficulty: 1
    objectives: ["3.5.2"]
    prompt: |
      Name the shape of a silicon tetrachloride molecule, $\text{SiCl}_4$.
    accept: ["tetrahedral", "tetrahedron", "a tetrahedron", "tetrahedral shape"]
    model: |
      Tetrahedral (109.5°): Si has 4 outer electrons, all used in 4 Si–Cl bonds, so 4 bonding pairs and no lone pairs.
    explanation: |
      Si is in Group 14 like C, so $\text{SiCl}_4$ is a look-alike of $\text{CH}_4$.

  - id: alcl4-error
    format: spot-error
    difficulty: 2
    objectives: ["3.5.2"]
    prompt: |
      A student predicts the shape of the $\text{AlCl}_4^{-}$ ion. Which line contains the first error?
    lines:
      - "Al is in Group 13, so it has 3 outer electrons."
      - "The ion has a 1− charge, so add one electron: 4."
      - "Four Al–Cl bonds use all 4 electrons, so there are no lone pairs."
      - "Four bonding pairs repel equally and get as far apart as possible."
      - "So $\\text{AlCl}_4^{-}$ is square planar, with bond angles of 90°."
    errorLine: 5
    fix: |
      Four bonding pairs with no lone pairs give a tetrahedral shape, 109.5°.
    explanation: |
      Four pairs get further apart in 3D (109.5°) than in a flat square (90°). $\text{AlCl}_4^{-}$ is a look-alike of $\text{CH}_4$.

  - id: solid-pcl5-ions
    format: numeric
    difficulty: 3
    objectives: ["3.5.2"]
    prompt: |
      Solid phosphorus pentachloride is not made of $\text{PCl}_5$ molecules: it contains $\text{PCl}_4^{+}$ and $\text{PCl}_6^{-}$ ions. Predict the Cl–P–Cl bond angle in each ion.
    fields:
      - label: "in PCl₄⁺:"
        answer: 109.5
        tolerance: { abs: 0.5 }
        unit: "°"
      - label: "in PCl₆⁻:"
        answer: 90
        tolerance: { abs: 0.5 }
        unit: "°"
    explanation: |
      $\text{PCl}_4^{+}$: P has 5 − 1 = 4 electrons, all used in 4 P–Cl bonds → 4 bonding pairs, 0 lone pairs → tetrahedral, 109.5°. $\text{PCl}_6^{-}$: 5 + 1 = 6, all used in 6 bonds → octahedral, 90°.
