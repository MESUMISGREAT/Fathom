id: rate-reaction-calculations
subject: "9701"
topic: "8.1"
title: "Calculating reaction rate from data"
summary: Turn concentration, mass, gas-volume or time data into an average reaction rate with sensible units.
order: 3
minutes: 4
objectives: ["8.1.3"]
prerequisites: [rate-reaction-meaning-and-collisions]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus objectives 8.1.1–8.1.3 and 8.2.1–8.2.3. All questions are original;
    illustrative reaction data are invented for teaching. Independently reviewed and
    found accurate by a separate GitHub Copilot review; no teacher review claimed.
blocks:
  - type: objective
    body: |
      By the end, you can calculate an average reaction rate from experimental data and choose a unit that matches the data.

  - type: explain
    title: Rate is change divided by time
    body: |
      Experimental results often give a starting value, a later value and the time between them.

      Find the change first, then divide by the time:

      $$\text{average rate} = \dfrac{\text{change in measured quantity}}{\text{time}}$$

      The measured quantity might be concentration, mass or gas volume. The unit follows automatically.

  - type: example
    title: Concentration of a reactant
    problem: |
      The concentration of a reactant falls from $0.80$ to $0.50\ \text{mol dm}^{-3}$ in $15\ \text{s}$. Calculate the average rate of disappearance.
    steps:
      - 'Find the magnitude of the change: $0.80 - 0.50 = 0.30\ \text{mol dm}^{-3}$.'
      - 'Divide by the elapsed time: $0.30 \div 15 = 0.020\ \text{mol dm}^{-3}\text{ s}^{-1}$.'
      - 'Use the magnitude for a rate of disappearance; the concentration itself decreased.'
    answer: $0.020\ \text{mol dm}^{-3}\text{ s}^{-1}$

  - type: check
    title: First calculation
    questions: [concentration-rate-calc, gas-volume-rate, product-mass-rate, rate-method]

  - type: explain
    title: Read the experiment carefully
    body: |
      Write down what is measured and its unit before calculating.

      - If a product mass increases, use final mass minus initial mass.
      - If a reactant concentration decreases, use initial minus final for the positive disappearance rate.
      - If a gas volume is collected, use volume divided by time.

      A rate over a whole interval is an **average rate**. The rate may change during the experiment as reactants are used up.

  - type: example
    title: A gas collection
    problem: |
      A reaction produces $48\ \text{cm}^3$ of gas in $40\ \text{s}$. Find the average rate of gas production.
    steps:
      - 'The change in gas volume is $48\ \text{cm}^3$.'
      - 'Divide by time: $48 \div 40 = 1.2\ \text{cm}^3\text{ s}^{-1}$.'
      - 'The unit is volume per second because volume was divided by time.'
    answer: $1.2\ \text{cm}^3\text{ s}^{-1}$

  - type: misconceptions
    items:
      - wrong: "Always divide the final value by the initial value."
        right: "Calculate the change first, then divide that change by the time."
      - wrong: "A falling reactant concentration gives a negative rate, so rates cannot be compared."
        right: "For rate of disappearance, use the positive magnitude of the decrease."
      - wrong: "The average rate is the rate at every instant."
        right: "It summarises one time interval; the instantaneous rate can change during the reaction."

  - type: exam
    body: |
      Show the subtraction as well as the division. Examiners can then see whether you used the correct direction of change.

      Keep units attached to the measured quantity: $\text{mol dm}^{-3}$ gives $\text{mol dm}^{-3}\text{ s}^{-1}$ after division by seconds.

  - type: takeaways
    items:
      - "Average rate = change in measured quantity ÷ time."
      - "For a reactant disappearing, use initial minus final."
      - "The unit is the measured quantity's unit per unit time."

questions:
  - id: concentration-rate-calc
    format: numeric
    difficulty: 2
    objectives: ["8.1.3"]
    prompt: The concentration of a reactant decreases from $0.72$ to $0.42\ \text{mol dm}^{-3}$ in $10\ \text{s}$. Calculate the average rate of disappearance in $\text{mol dm}^{-3}\text{ s}^{-1}$.
    fields:
      - answer: 0.03
        unit: mol dm⁻³ s⁻¹
    explanation: Change $=0.72-0.42=0.30\ \text{mol dm}^{-3}$; rate $=0.30\div10=0.030\ \text{mol dm}^{-3}\text{ s}^{-1}$.

  - id: gas-volume-rate
    format: numeric
    difficulty: 1
    objectives: ["8.1.3"]
    prompt: A reaction produces $75\ \text{cm}^3$ of gas in $25\ \text{s}$. Calculate the average rate in $\text{cm}^3\text{ s}^{-1}$.
    fields:
      - answer: 3
        unit: cm³ s⁻¹
    explanation: Rate $=75\div25=3\ \text{cm}^3\text{ s}^{-1}$.

  - id: product-mass-rate
    format: numeric
    difficulty: 2
    objectives: ["8.1.3"]
    prompt: The mass of a product rises from $1.20\ \text{g}$ to $2.00\ \text{g}$ in $40\ \text{s}$. Calculate the average rate of mass formation in $\text{g s}^{-1}$.
    fields:
      - answer: 0.02
        unit: g s⁻¹
    explanation: Change $=2.00-1.20=0.80\ \text{g}$; rate $=0.80\div40=0.020\ \text{g s}^{-1}$.

  - id: rate-method
    format: spot-error
    prompt: "Find the first incorrect line in this calculation of a reactant's average rate of disappearance."
    difficulty: 3
    objectives: ["8.1.3"]
    lines:
      - "A reactant concentration falls from 0.60 to 0.20 mol dm⁻³ in 20 s."
      - "Change in concentration = 0.20 − 0.60 = −0.40 mol dm⁻³."
      - "Average rate of disappearance = 0.40 ÷ 20 = 0.020 mol dm⁻³ s⁻¹."
      - "The negative sign shows the rate is impossible."
    errorLine: 4
    fix: The negative sign belongs to the concentration change; the rate of disappearance is reported as the positive magnitude, 0.020 mol dm⁻³ s⁻¹.
    explanation: A reactant's concentration change is negative, but disappearance rate is conventionally given as a positive value.
