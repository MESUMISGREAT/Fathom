id: period-3-chemical-oxygen-chlorine-water
subject: "9701"
topic: "9.2"
title: Period 3 elements with oxygen, chlorine and water
summary: How sodium, magnesium, aluminium, silicon, phosphorus and sulfur behave with oxygen, chlorine and water, with the equations and observations examiners expect.
order: 1
minutes: 6
kind: core
objectives: ["9.2.1"]
prerequisites: [period-3-physical-melting-point-conductivity]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027, topic 9.2 learning outcome 1 (reactions of Period 3 elements with
    oxygen, chlorine and water). Standard equations and observations only; every question
