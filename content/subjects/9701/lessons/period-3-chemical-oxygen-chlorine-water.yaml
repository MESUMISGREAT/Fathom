blocks:
  - type: objective
    body: |-
      By the end you can write balanced equations for the reactions of Period 3 elements with oxygen, chlorine and water, and describe what you would actually see in each case.

  - type: explain
    title: One period, two personalities
    body: |-
      Period 3 runs $\text{Na} \rightarrow \text{Ar}$. It starts with a reactive metal and ends with a noble gas that does nothing at all.

      The chemistry shifts steadily rightwards: **metals** lose electrons, **non-metals** gain them, and the middle element (aluminium) is the awkward in-betweener.

      That single idea explains almost every reaction in this lesson — how violently the element reacts, and whether its oxide turns out basic or acidic.

  - type: explain
    title: Burning in oxygen
    body: |-
      Heat a Period 3 element in air or oxygen and you usually get its **oxide**. The metal oxides are ionic and solid; the non-metal oxides are covalent and often gaseous.

      | element | equation | what you see |
      | --- | --- | --- |
      | sodium | $4\text{Na} + \text{O}_2 \rightarrow 2\text{Na}_2\text{O}$ | yellow flame, white solid |
      | magnesium | $2\text{Mg} + \text{O}_2 \rightarrow 2\text{MgO}$ | brilliant white flame, white solid |
      | aluminium | $4\text{Al} + 3\text{O}_2 \rightarrow 2\text{Al}_2\text{O}_3$ | a tough oxide layer forms first, which protects the metal |
      | silicon | $\text{Si} + \text{O}_2 \rightarrow \text{SiO}_2$ | needs strong heating; white solid |
      | phosphorus | $\text{P}_4 + 5\text{O}_2 \rightarrow \text{P}_4\text{O}_{10}$ | catches fire on its own, thick white smoke |
      | sulfur | $\text{S} + \text{O}_2 \rightarrow \text{SO}_2$ | pale blue flame, choking gas |

      Notice that sodium and magnesium burn easily because their outer electrons are cheap to lose. Silicon and sulfur need help — a flame, or strong heating.

      Under normal burning conditions sulfur gives **sulfur dioxide**, not sulfur trioxide. $\text{SO}_3$ is made industrially with a vanadium(V) oxide catalyst.

  - type: check
    title: Oxygen
    questions: [na-oxygen-equation, mg-flame-colour, sulfur-oxide-error]

  - type: explain
    title: Reactions with chlorine
    body: |-
      Chlorine is a more powerful oxidising agent than oxygen, so these reactions are often fierce. The product is a **chloride**.

      | element | equation | what you see |
      | --- | --- | --- |
      | sodium | $2\text{Na} + \text{Cl}_2 \rightarrow 2\text{NaCl}$ | burns with a bright yellow flame; white solid |
      | magnesium | $\text{Mg} + \text{Cl}_2 \rightarrow \text{MgCl}_2$ | white solid |
      | aluminium | $2\text{Al} + 3\text{Cl}_2 \rightarrow 2\text{AlCl}_3$ | white solid that fumes in moist air |
      | silicon | $\text{Si} + 2\text{Cl}_2 \rightarrow \text{SiCl}_4$ | colourless liquid, fumes in moist air |
      | phosphorus | $\text{P}_4 + 10\text{Cl}_2 \rightarrow 4\text{PCl}_5$ | pale yellow solid |

      The pattern is worth memorising: the metal chlorides are **ionic solids**, while the non-metal chlorides are **covalent** and volatile.

      Silicon tetrachloride is a liquid at room temperature — a big clue that it is covalent, because ionic lattices do not melt that low.

  - type: check
    title: Chlorine
    questions: [chlorine-silicon-product]

  - type: example
    title: From moles to mass
    problem: |-
      0.10 mol of magnesium burns completely in oxygen. What mass of magnesium oxide forms? ($A_r$: Mg = 24.3, O = 16.0)
    steps:
      - |-
        Write the equation: $2\text{Mg} + \text{O}_2 \rightarrow 2\text{MgO}$. Two moles of Mg give two moles of MgO, so the ratio is **1 : 1**.
      - |-
        Moles of MgO = moles of Mg = 0.10 mol.
      - |-
        $M_r(\text{MgO}) = 24.3 + 16.0 = 40.3$.
      - |-
        Mass = moles × $M_r$ = 0.10 × 40.3 = **4.03 g**.
    answer: |-
      4.03 g of magnesium oxide.

  - type: explain
    title: Reactions with water
    body: |-
      Only two Period 3 elements react with water in a way you need to know: **sodium** and **magnesium**. Sodium is the dramatic one.

      $$2\text{Na} + 2\text{H}_2\text{O} \rightarrow 2\text{NaOH} + \text{H}_2$$

      Sodium floats, melts into a silvery ball, fizzes across the surface, and the hydrogen often ignites with a squeaky pop. Add universal indicator and the solution turns purple — a strong alkali has been made.

      Magnesium is far calmer. With **cold water** the reaction is so slow you barely see it:

      $$\text{Mg} + 2\text{H}_2\text{O} \rightarrow \text{Mg(OH)}_2 + \text{H}_2$$

      With **steam** it is quick, and the product is different — magnesium oxide, not hydroxide:

      $$\text{Mg} + \text{H}_2\text{O(g)} \rightarrow \text{MgO} + \text{H}_2$$

      The trend is the one you would predict: sodium is further left, more metallic, and more desperate to lose its single outer electron.

      Aluminium is protected by its oxide layer and does not react with water in practice.

  - type: check
    title: Water
    questions: [sodium-water-products, magnesium-oxide-mass]

  - type: misconceptions
    items:
      - wrong: |-
          Sulfur burns in oxygen to make sulfur trioxide, $\text{SO}_3$.
        right: |-
          Ordinary burning gives **sulfur dioxide**, $\text{SO}_2$. Making $\text{SO}_3$ needs a catalyst and different conditions.
      - wrong: |-
          Magnesium reacts with steam to make magnesium hydroxide.
        right: |-
          Steam gives **magnesium oxide**: $\text{Mg} + \text{H}_2\text{O(g)} \rightarrow \text{MgO} + \text{H}_2$. The hydroxide comes from cold water.
      - wrong: |-
          Aluminium burns away in oxygen just like magnesium.
        right: |-
          Aluminium forms a **protective** layer of $\text{Al}_2\text{O}_3$ that sticks to the surface and stops the reaction going further.

  - type: exam
    body: |-
      - Balance the equation and include **state symbols** when the question mentions them. Marks are often lost on unbalanced chlorine equations.
      - Give the **observation**, not just the product: "burns with a yellow flame, white solid formed" earns more than "sodium oxide".
      - For water, read carefully whether the question says cold water or steam. The magnesium product changes, and so does the mark scheme.
      - If asked why sodium is more reactive than magnesium, say that sodium loses **one** outer electron more easily than magnesium loses two, and that the outer electron is further from the nucleus in a larger atom.

  - type: takeaways
    items:
      - |-
        Burning in oxygen: $\text{Na}_2\text{O}$, $\text{MgO}$, $\text{Al}_2\text{O}_3$, $\text{SiO}_2$, $\text{P}_4\text{O}_{10}$, $\text{SO}_2$.
      - |-
        Burning in chlorine: $\text{NaCl}$, $\text{MgCl}_2$, $\text{AlCl}_3$, $\text{SiCl}_4$, $\text{PCl}_5$.
      - |-
        Sodium with cold water gives $\text{NaOH}$ and $\text{H}_2$; magnesium with steam gives $\text{MgO}$ and $\text{H}_2$.
      - |-
        Metal oxides and chlorides are ionic; non-metal oxides and chlorides are covalent and volatile.

questions:
  - id: na-oxygen-equation
    format: mcq
    difficulty: 1
    objectives: ["9.2.1"]
    prompt: |-
      Which equation shows sodium burning in oxygen?
    options:
      - text: |-
          $\text{Na} + \text{O}_2 \rightarrow \text{NaO}_2$
        why: |-
          Sodium forms the oxide $\text{Na}_2\text{O}$, and this equation is not balanced either.
      - text: |-
          $4\text{Na} + \text{O}_2 \rightarrow 2\text{Na}_2\text{O}$
        correct: true
        why: |-
          Four sodium atoms and two oxygen atoms on each side: balanced, and it gives sodium oxide.
      - text: |-
          $2\text{Na} + \text{O}_2 \rightarrow 2\text{NaO}$
        why: |-
          Sodium is in group 1, so its oxide is $\text{Na}_2\text{O}$, not $\text{NaO}$.
      - text: |-
          $\text{Na} + \text{O}_2 \rightarrow \text{Na}_2\text{O}$
        why: |-
          The formulae are right but the atoms do not balance: one Na on the left, two on the right.
    explanation: |-
      Sodium burns with a yellow flame to give white sodium oxide: $4\text{Na} + \text{O}_2 \rightarrow 2\text{Na}_2\text{O}$.

  - id: mg-flame-colour
    format: mcq
    difficulty: 1
    objectives: ["9.2.1"]
    prompt: |-
      Magnesium is heated strongly in oxygen. What is observed?
    options:
      - text: |-
          A pale blue flame.
        why: |-
          That is sulfur burning in oxygen, not magnesium.
      - text: |-
          A yellow flame.
        why: |-
          Yellow is the sodium flame colour.
      - text: |-
          A brilliant white flame and a white solid.
        correct: true
        why: |-
          Magnesium burns with an intense white flame to form white magnesium oxide, $\text{MgO}$.
      - text: |-
          A green flame.
        why: |-
          There is no green flame in Period 3 chemistry; you may be thinking of barium or copper compounds.
    explanation: |-
      $2\text{Mg} + \text{O}_2 \rightarrow 2\text{MgO}$. The white flame is bright enough to hurt your eyes in a lab.

  - id: sulfur-oxide-error
    format: spot-error
    difficulty: 2
    objectives: ["9.2.1"]
    prompt: |-
      A student describes burning sulfur in oxygen. Which line contains the first error?
    lines:
      - "Sulfur burns in oxygen with a pale blue flame."
      - "The product is a choking, colourless gas."
      - "The equation is S + O2 -> SO2."
      - "So burning sulfur in oxygen makes sulfur trioxide, SO3."
    errorLine: 4
    fix: |-
      Burning sulfur in oxygen gives sulfur dioxide: $\text{S} + \text{O}_2 \rightarrow \text{SO}_2$. Sulfur trioxide needs a vanadium(V) oxide catalyst and different conditions.
    explanation: |-
      The observation and the equation are both right, so the mistake is the final conclusion. Ordinary combustion of sulfur stops at $\text{SO}_2$.

  - id: chlorine-silicon-product
    format: mcq
    difficulty: 2
    objectives: ["9.2.1"]
    prompt: |-
      Silicon is heated in chlorine. Which product is formed?
    options:
      - text: |-
          $\text{SiCl}$
        why: |-
          Silicon does not form a 1+ chloride; it uses all four of its outer electrons here.
      - text: |-
          $\text{SiCl}_2$
        why: |-
          This would leave two of silicon's outer electrons unused. The product is silicon(IV) chloride.
      - text: |-
          $\text{SiCl}_4$
        correct: true
        why: |-
          Silicon is in group 4, so it forms the +4 chloride, a colourless covalent liquid.
      - text: |-
          $\text{SiCl}_3$
        why: |-
          Silicon would be left with an unpaired electron; the stable product is $\text{SiCl}_4$.
    explanation: |-
      $\text{Si} + 2\text{Cl}_2 \rightarrow \text{SiCl}_4$. The product is a liquid at room temperature, which tells you it is covalent.

  - id: sodium-water-products
    format: cloze
    difficulty: 1
    objectives: ["9.2.1"]
    prompt: |-
      Sodium reacts vigorously with cold water to form the alkali {{1}} and the gas {{2}}.
    blanks:
      - accept:
          - "sodium hydroxide"
          - "NaOH"
          - "sodium hydroxide solution"
      - accept:
          - "hydrogen"
          - "H2"
          - "H₂"
    explanation: |-
      $2\text{Na} + 2\text{H}_2\text{O} \rightarrow 2\text{NaOH} + \text{H}_2$. The solution is strongly alkaline, and the hydrogen often ignites with a pop.

  - id: magnesium-oxide-mass
    format: numeric
    difficulty: 2
    objectives: ["9.2.1"]
    prompt: |-
      0.10 mol of magnesium burns completely in oxygen. What mass of magnesium oxide is formed? ($A_r$: Mg = 24.3, O = 16.0)
    fields:
      - answer: 4.03
        tolerance:
          abs: 0.05
        unit: g
    explanation: |-
      $2\text{Mg} + \text{O}_2 \rightarrow 2\text{MgO}$, so 0.10 mol Mg gives 0.10 mol MgO. $M_r(\text{MgO}) = 40.3$, so mass = 0.10 × 40.3 = 4.03 g.
