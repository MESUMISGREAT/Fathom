id: bonding-structure-giant-ionic
subject: "9701"
topic: "4.2"
title: "Giant ionic lattices: sodium chloride and magnesium oxide"
summary: How giant ionic lattices are built from alternating ions in every direction, and why that structure makes ionic solids hard, brittle and high-melting.
order: 1
minutes: 4
objectives: ["4.2.1"]
prerequisites: [ionic-bonding-electrostatic-attraction]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.2, learning outcome 1(a): describe, in simple terms, the lattice
    structure of a giant ionic crystalline solid, including sodium chloride and magnesium
