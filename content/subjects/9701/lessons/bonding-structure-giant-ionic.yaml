blocks:
  - type: objective
    body: |
      By the end you can describe the lattice structure of a giant ionic solid such as sodium chloride or magnesium oxide.

  - type: explain
    title: Not molecules — a lattice
    body: |
      An ionic compound does not exist as separate molecules. Its ions pack into a regular, repeating pattern called a **lattice**.

      In sodium chloride ($\text{NaCl}$):

      - positive $\text{Na}^+$ ions and negative $\text{Cl}^-$ ions **alternate** in every direction.
      - each $\text{Na}^+$ is surrounded by 6 $\text{Cl}^-$ ions — and each $\text{Cl}^-$ by 6 $\text{Na}^+$ ions.
      - the pattern repeats millions of times: it is one giant structure, so we call it a **giant ionic lattice**.
      - the formula $\text{NaCl}$ is a **ratio** (1 : 1), not a molecule.

  - type: definition
    term: Giant ionic lattice
    body: |
      A **giant ionic lattice** is a regular, repeating arrangement of positive and negative ions, held together by strong **electrostatic attraction** between oppositely charged ions throughout the structure.

  - type: diagram
    diagram: chem-bonding-structure-ionic-lattice
    alt: "Two panels. Left, a sodium chloride lattice: a grid of alternating small spheres marked plus (Na+) and larger spheres marked minus (Cl−), repeating in every direction; one Na+ in the centre is ringed with arrows pointing to the four Cl− ions beside it in the slice, and a note says each Na+ is attracted to 6 Cl− in total (four in this slice, one above and one below). Right, a magnesium oxide lattice: the same alternating pattern with spheres marked 2+ (Mg2+) and 2− (O2−), and a note saying the ions carry double the charge, so the attraction is stronger and the melting point is higher (MgO about 2800 degrees Celsius, NaCl 801 degrees Celsius). A footer reads: small circles are positive ions, large circles are negative ions; no molecules — the formula gives the ion ratio."

  - type: intuition
    title: Why ionic solids are brittle
    body: |
      The ions sit in tidy rows of alternating charge. Hit the crystal hard and one row slides slightly over the next.

      Now like charges line up: $+$ beside $+$, $-$ beside $-$. They **repel**, and the crystal cracks along that plane.

      Where the analogy helps: two magnets stuck in an alternating line — slide one and the line breaks apart.

  - type: explain
    title: "Magnesium oxide: same shape, stronger grip"
    body: |
      $\text{MgO}$ has the same lattice shape as $\text{NaCl}$, but its ions carry **double the charge**: $\text{Mg}^{2+}$ and $\text{O}^{2-}$.

      The electrostatic attraction is therefore much stronger, so more energy is needed to break the lattice:

      | | ion charges | melting point |
      | --- | --- | --- |
      | $\text{NaCl}$ | $1+$ and $1-$ | $801\ ^\circ\text{C}$ |
      | $\text{MgO}$ | $2+$ and $2-$ | about $2800\ ^\circ\text{C}$ |

      Both are hard, high-melting and brittle — the classic signs of ionic structure.

  - type: check
    title: Quick check
    questions: [ionic-lattice-basics, mgo-higher-mp]

  - type: misconceptions
    items:
      - wrong: "A sample of NaCl contains NaCl molecules."
        right: 'There are no molecules. The lattice is a giant array of ions; $\text{NaCl}$ just gives the 1 : 1 ratio.'
      - wrong: "The ionic bond is one attraction between one Na⁺ and one Cl⁻."
        right: "Each ion attracts **all** the oppositely charged ions around it. The bonding extends through the whole lattice."
      - wrong: "Ionic solids conduct electricity because they contain ions."
        right: "The ions must be **free to move**. In a solid lattice they are locked in place; molten or dissolved ionic compounds do conduct."

  - type: check
    title: Structure and behaviour
    questions: [no-molecules, why-brittle]

  - type: exam
    body: |
      - "Describe the structure of sodium chloride" wants: **alternating $\text{Na}^+$ and $\text{Cl}^-$ ions** in a **regular lattice** (giant structure), held by **electrostatic attraction** between oppositely charged ions.
      - If asked why $\text{MgO}$ has a higher melting point than $\text{NaCl}$: name the **stronger attraction** caused by the **greater ionic charges** ($\text{Mg}^{2+}$ and $\text{O}^{2-}$), then link to the energy needed to break the lattice.
      - Never write "NaCl molecules" — examiners watch for it.

  - type: takeaways
    items:
      - "A giant ionic lattice is a regular, repeating arrangement of alternating positive and negative ions."
      - "Electrostatic attraction between oppositely charged ions acts throughout the lattice."
      - "Higher ionic charges (e.g. MgO) mean stronger attraction and much higher melting points."
      - "Ionic solids are hard but brittle: a knock lines up like charges and the crystal splits."

questions:
  - id: ionic-lattice-basics
    format: cloze
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      A giant ionic lattice is a regular, repeating arrangement of positive and negative {{1}}, held together by {{2}} between oppositely charged ions.
    blanks:
      - accept: ["ions", "ion"]
      - accept: ["electrostatic attraction", "electrostatic forces", "electrostatic forces of attraction", "attraction", "ionic bonds", "ionic bonding", "forces of attraction"]
    explanation: |
      The particles are ions (not molecules), and the force is the electrostatic attraction between opposite charges.

  - id: mgo-higher-mp
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      Magnesium oxide ($\text{MgO}$, melting point about $2800\ ^\circ\text{C}$) melts at a much higher temperature than sodium chloride ($\text{NaCl}$, $801\ ^\circ\text{C}$). Both have the same lattice structure. What is the main reason?
    options:
      - text: |
          MgO has a giant molecular structure while NaCl is simple molecular.
        why: |
          Both are giant ionic lattices — the structures are the same type. The difference is in the ions themselves.
      - text: |
          The ions in MgO carry greater charges, so the electrostatic attraction between them is stronger.
        correct: true
        why: |
          $\text{Mg}^{2+}$ and $\text{O}^{2-}$ attract each other much more strongly than $\text{Na}^+$ and $\text{Cl}^-$, so more energy is needed to separate them.
      - text: |
          MgO has heavier ions, so more energy is needed to melt it.
        why: |
          Mass alone is not the key — charge is. Compare the charges: $2+$/$2-$ versus $1+$/$1-$.
      - text: |
          MgO contains covalent bonds as well as ionic bonds.
        why: |
          MgO is fully ionic at this level; no covalent bonds are involved.
    explanation: |
      Same structure type, greater ionic charges → stronger electrostatic attraction → higher melting point.

  - id: no-molecules
    format: mcq
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      Which statement about sodium chloride is correct?
    options:
      - text: |
          It consists of NaCl molecules held together by weak forces.
        why: |
          There are no discrete NaCl units in the solid. The lattice is one continuous giant structure.
      - text: |
          Its formula shows the ratio of Na⁺ ions to Cl⁻ ions in the lattice.
        correct: true
        why: |
          Exactly: $\text{NaCl}$ means a 1 : 1 ratio of alternating ions throughout the giant lattice.
      - text: |
          It consists of sodium atoms and chlorine atoms bonded covalently.
        why: |
          Sodium transfers its outer electron to chlorine, forming ions — that is ionic bonding, not covalent.
      - text: |
          It is made of separate Na⁺ ions with no Cl⁻ ions present.
        why: |
          The positive and negative ions alternate; you cannot have one without the other.
    explanation: |
      $\text{NaCl}$ is a ratio of ions in a giant lattice, not a molecular formula.

  - id: why-brittle
    format: text
    style: short
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      In one or two sentences, explain why a giant ionic crystal **shatters** when hit sharply.
    accept:
      - "a blow shifts one layer of ions so like charges line up and repel, splitting the crystal"
      - "when hit, layers of ions slide so like charges align and repel, causing the crystal to split"
      - "hitting it lines up like charges which repel and crack the crystal"
      - "a sharp blow moves layers of ions past each other so like charges are next to each other and repel, cracking the lattice"
      - "the impact shifts layers so that like charges line up and repel each other, breaking the crystal"
    model: |
      A sharp blow shifts one layer of ions slightly, so like charges line up next to each other. The repulsion between them splits the crystal along that layer.
    explanation: |
      The key chain: impact → layers shift → like charges align → repulsion → the crystal splits.
