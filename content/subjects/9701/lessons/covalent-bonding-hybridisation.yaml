id: covalent-bonding-hybridisation
subject: "9701"
topic: "3.4"
title: "Hybridisation: sp³, sp² and sp orbitals"
summary: Carbon mixes its 2s and 2p orbitals into sp³, sp² or sp hybrids; the hybrids make σ bonds and any leftover p orbitals make π bonds.
order: 6
minutes: 5
objectives: ["3.4.2"]
prerequisites: [covalent-bonding-sigma-and-pi, atoms-electrons-in-boxes]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.4, learning outcome 2, parts (b) and (c): hybridisation to
    describe sp, sp² and sp³ orbitals, with σ and π bonding in C₂H₆, C₂H₄, HCN and N₂).
    All questions are original.
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can use hybridisation to describe sp³, sp² and sp orbitals, and say which one each carbon uses in $\text{CH}_4$, $\text{C}_2\text{H}_6$, $\text{C}_2\text{H}_4$ and $\text{HCN}$.

  - type: explain
    title: Carbon's double puzzle
    body: |
      Ground-state carbon is $1\text{s}^2\,2\text{s}^2\,2\text{p}^2$. Only **two** unpaired electrons, so you'd expect two bonds.

      Yet methane has **four** C–H bonds, all **identical**, all at **109.5°**. Plain s and p orbitals can't explain either fact.

  - type: explain
    title: "Step 1: promote"
    body: |
      One 2s electron moves up into the empty 2p orbital:

      $$1\text{s}^2\,2\text{s}^2\,2\text{p}^2 \;\rightarrow\; 1\text{s}^2\,2\text{s}^1\,2\text{p}^3$$

      Now there are **four** unpaired electrons, so four bonds. Promotion costs a little energy, but forming two extra bonds releases much more.

  - type: explain
    title: "Step 2: hybridise (mix)"
    body: |
      The 2s orbital and some or all of the 2p orbitals **mix** to make new, identical **hybrid orbitals**.

      - Mix 1 s + **3** p → **4 sp³** orbitals.
      - Mix 1 s + **2** p → **3 sp²** orbitals (1 p left over).
      - Mix 1 s + **1** p → **2 sp** orbitals (2 p left over).

      Orbitals in = orbitals out: mixing four orbitals gives four.

  - type: diagram
    diagram: chem-covalent-bonding-hybridisation
    alt: "Electrons-in-boxes for carbon. Top: the ground state has a 2s box with a spin pair and three 2p boxes with two single electrons and one empty box; an arrow labelled promote one 2s electron leads to the promoted state, one electron in the 2s box and one in each of three 2p boxes, four unpaired electrons. 2p boxes are drawn higher in energy than 2s. Below, three columns. sp3: four hybrid boxes each with one electron; mix 2s plus three 2p; 4 sp3 orbitals 109.5 degrees apart; 4 sigma bonds; e.g. CH4, C2H6. sp2: three hybrid boxes and one higher 2p box, each with one electron; mix 2s plus two 2p; 3 sp2 orbitals 120 degrees apart, plus 1 p left over giving 1 pi bond; e.g. C2H4. sp: two hybrid boxes and two higher 2p boxes; mix 2s plus one 2p; 2 sp orbitals 180 degrees apart, plus 2 p left over giving 2 pi bonds; e.g. HCN, C2H2."
    caption: |
      Hybrids make σ bonds. Leftover p orbitals make π bonds.

  - type: check
    title: Quick check
    questions: [hybrids-from-mixing]

  - type: explain
    title: The three types side by side
    body: |
      | hybrid | orbitals mixed | hybrids point | angle | leftover p | bonds made | examples |
      | --- | --- | --- | --- | --- | --- | --- |
      | **sp³** | s + 3p | to corners of a tetrahedron | 109.5° | 0 | 4 σ | $\text{CH}_4$, both C in $\text{C}_2\text{H}_6$ |
      | **sp²** | s + 2p | to corners of a flat triangle | 120° | 1 | 3 σ + 1 π | both C in $\text{C}_2\text{H}_4$ |
      | **sp** | s + p | in a straight line | 180° | 2 | 2 σ + 2 π | C in $\text{HCN}$, both N in $\text{N}_2$ |

  - type: example
    title: Ethene from the inside
    problem: |
      Use hybridisation to describe the bonding in ethene, $\text{H}_2\text{C}{=}\text{CH}_2$.
    steps:
      - |
        Each C forms 3 σ bonds (two C–H, one C–C), so it is **sp²** hybridised: 3 sp² orbitals at 120° in a flat plane.
      - |
        The sp² orbitals overlap **head-on** with H 1s orbitals and with the other carbon's sp² orbital: **5 σ bonds**, all in one plane.
      - |
        Each C has **one unhybridised 2p orbital**, standing at right angles to the plane.
      - |
        The two p orbitals overlap **sideways**: **1 π bond**, above and below the plane.
    answer: |
      sp² carbons: 5 σ bonds in a flat framework plus 1 π bond.

  - type: intuition
    title: A smoothie shop
    body: |
      Blend one cup of "s" with three cups of "p" and you get four **identical** sp³ smoothies, each one part s to three parts p. Blend s with only two p's and the third p cup stays on the counter, unmixed.

      Where it breaks down: hybrids aren't just mixtures in a jug. The new orbitals have new **directions** (109.5°, 120°, 180°), which is the whole point.

  - type: explain
    title: Shortcut for any atom
    body: |
      Count the **σ bonds plus lone pairs** around the atom (π bonds don't count; they use leftover p orbitals):

      - 4 → **sp³** (e.g. N in $\text{NH}_3$: 3 σ + 1 lone pair)
      - 3 → **sp²**
      - 2 → **sp**

  - type: check
    title: Which hybrid?
    questions: [ethene-hybrid, leftover-p, ammonia-hybrid]

  - type: misconceptions
    items:
      - wrong: "sp³ orbitals point to the corners of a square, 90° apart."
        right: "Four regions get furthest apart in 3D at the corners of a **tetrahedron**: 109.5°."
      - wrong: "In ethene, the π bond is made by an sp² orbital."
        right: "The π bond comes from the **unhybridised** p orbital on each carbon. Hybrids only make σ bonds (or hold lone pairs)."
      - wrong: "Hybridisation happens only in carbon."
        right: "Any atom can be described this way: N in $\\text{NH}_3$ is sp³, each N in $\\text{N}_2$ is sp."

  - type: exam
    body: |
      - A full answer names the hybrid, the number of hybrid orbitals and their angle, and says what overlaps with what: "each C is sp² hybridised; sp² orbitals overlap head-on to form σ bonds; the unhybridised p orbitals overlap sideways to form the π bond".
      - Use the shortcut to check: σ bonds + lone pairs = 4, 3, 2 → sp³, sp², sp.

  - type: takeaways
    items:
      - "Promote one 2s electron, then mix orbitals into identical hybrids."
      - "sp³: s + 3p, 4 hybrids, 109.5°, all σ (CH₄, C₂H₆)."
      - "sp²: s + 2p, 3 hybrids, 120°, 1 leftover p for a π bond (C₂H₄)."
      - "sp: s + p, 2 hybrids, 180°, 2 leftover p for two π bonds (HCN, N₂)."

  - type: check
    title: Spot the slip
    questions: [methane-error]

questions:
  - id: hybrids-from-mixing
    format: numeric
    difficulty: 1
    objectives: ["3.4.2"]
    prompt: |
      How many hybrid orbitals are formed when one s orbital mixes with **two** p orbitals?
    fields:
      - answer: 3
        unit: hybrid orbitals
    explanation: |
      Orbitals in = orbitals out: 1 + 2 = 3 sp² hybrid orbitals. The third p orbital is left unhybridised.

  - id: ethene-hybrid
    format: mcq
    difficulty: 1
    objectives: ["3.4.2"]
    prompt: |
      What is the hybridisation of each carbon atom in ethene, $\text{C}_2\text{H}_4$?
    options:
      - text: sp³
        why: |
          sp³ carbons make 4 σ bonds, as in ethane. Each ethene carbon makes only 3 σ bonds.
      - text: sp²
        correct: true
        why: |
          3 σ bonds (two C–H, one C–C) → 3 sp² hybrids at 120°, plus a leftover p orbital for the π bond.
      - text: sp
        why: |
          sp carbons make 2 σ bonds and 2 π bonds, as in HCN or ethyne.
      - text: Not hybridised
        why: |
          Unhybridised carbon can't explain three identical-angled σ bonds at 120°.
    explanation: |
      Count σ bonds + lone pairs on each C: 3 + 0 = 3, so sp².

  - id: leftover-p
    format: numeric
    difficulty: 2
    objectives: ["3.4.2"]
    prompt: |
      How many **unhybridised p orbitals** does a carbon atom have when it is hybridised as each of the following?
    fields:
      - label: "sp³:"
        answer: 0
      - label: "sp²:"
        answer: 1
      - label: "sp:"
        answer: 2
    explanation: |
      Carbon has three 2p orbitals. sp³ uses all three, sp² uses two (1 left), sp uses one (2 left). Each leftover p can form a π bond.

  - id: ammonia-hybrid
    format: mcq
    difficulty: 3
    objectives: ["3.4.2"]
    prompt: |
      What is the hybridisation of the nitrogen atom in ammonia, $\text{NH}_3$?
    options:
      - text: sp
        why: |
          sp needs 2 regions (σ bonds + lone pairs). N in $\text{NH}_3$ has 4.
      - text: sp²
        why: |
          This counts only the 3 bonds and forgets the lone pair.
      - text: sp³
        correct: true
        why: |
          3 σ bonds + 1 lone pair = 4 regions → sp³. The lone pair sits in the fourth sp³ orbital.
    explanation: |
      Lone pairs occupy hybrid orbitals too. 3 σ + 1 lone pair = 4 → sp³, which is why $\text{NH}_3$ is based on a tetrahedral arrangement.

  - id: methane-error
    format: spot-error
    difficulty: 2
    objectives: ["3.4.2"]
    prompt: |
      A student explains the bonding in methane using hybridisation. Which line contains the first error?
    lines:
      - "Ground-state carbon is $1\\text{s}^2\\,2\\text{s}^2\\,2\\text{p}^2$, with two unpaired electrons."
      - "One 2s electron is promoted to the empty 2p orbital, giving $1\\text{s}^2\\,2\\text{s}^1\\,2\\text{p}^3$."
      - "The 2s orbital and all three 2p orbitals mix to form four sp³ hybrid orbitals."
      - "The four sp³ orbitals point to the corners of a square, 90° apart."
      - "Each sp³ orbital overlaps head-on with a hydrogen 1s orbital, giving four identical σ bonds."
    errorLine: 4
    fix: |
      The four sp³ orbitals point to the corners of a tetrahedron, 109.5° apart.
    explanation: |
      In 3D, four regions get furthest apart at the corners of a tetrahedron (109.5°), not in a flat square (90°).
