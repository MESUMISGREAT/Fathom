id: chemical-equilibria-le-chatelier
subject: "9701"
topic: "7.1"
title: "Le Chatelier's principle: concentration and pressure"
summary: Push an equilibrium and it pushes back. Change a concentration or a pressure and the position of equilibrium moves to oppose the change — you can predict the direction without any numbers.
order: 2
minutes: 10
kind: core
objectives: ["7.1.2", "7.1.3"]
prerequisites: [chemical-equilibria-reversible-dynamic]
