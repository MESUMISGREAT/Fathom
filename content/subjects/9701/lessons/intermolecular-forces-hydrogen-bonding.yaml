id: intermolecular-forces-hydrogen-bonding
subject: "9701"
topic: "3.6"
title: "Hydrogen bonds: a special kind of attraction"
summary: Identify hydrogen bonding in water and ammonia and separate it from covalent bonds.
order: 2
minutes: 4
objectives: ["3.6.1", "3.6.3"]
prerequisites: [intermolecular-forces-types]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.6 learning outcomes 1 and 3. All questions are original; no illustrative data are used.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can identify hydrogen bonding in molecules with N–H or O–H bonds and describe the attraction between neighbouring molecules.
  - type: explain
    title: Two molecules, one strong attraction
    body: |
      In a water molecule, oxygen pulls the shared electrons strongly. Each O–H hydrogen is slightly positive, while oxygen is slightly negative.

      A slightly positive hydrogen on one molecule is attracted to a lone pair on the oxygen of a neighbour. That dotted attraction is a **hydrogen bond**; the solid O–H bond stays inside its own molecule.
  - type: definition
    term: Hydrogen bonding
    body: A special case of permanent dipole–permanent dipole attraction between molecules, where hydrogen is bonded to a highly electronegative atom.
  - type: explain
    title: The syllabus examples
    body: |
      Focus on molecules containing **N–H** or **O–H** groups:

      - Water, H₂O, has O–H bonds; its oxygen can attract a neighbouring molecule's slightly positive hydrogen.
      - Ammonia, NH₃, has N–H bonds; its nitrogen lone pair can attract a neighbouring molecule's slightly positive hydrogen.

      The dotted link is between molecules. It is weaker than the covalent N–H or O–H bond within one molecule.
  - type: diagram
    diagram: chem-intermolecular-forces-hydrogen-bonds
    alt: Water and ammonia molecules show a solid O–H or N–H covalent bond and a dotted attraction from a slightly positive hydrogen to a neighbouring oxygen or nitrogen lone pair.
    caption: The dotted line marks a hydrogen bond; it is not another shared covalent pair.
  - type: check
    title: Find the hydrogen bond
    questions: ["hbond-where", "hbond-ammonia"]
  - type: example
    title: Does methane hydrogen-bond?
    problem: A student asks whether two methane molecules, CH₄, form hydrogen bonds with each other.
    steps:
      - "Check which atom is bonded to hydrogen: methane has C–H bonds, not N–H or O–H bonds."
      - So methane does not form the hydrogen bonds described in this syllabus topic.
      - Its molecules still attract through London dispersion forces.
    answer: No hydrogen bonding; London forces still act between methane molecules.
  - type: check
    title: Solid bond or dotted attraction?
    questions: ["hbond-difference", "hbond-criteria"]
  - type: misconceptions
    items:
      - wrong: A hydrogen bond is the O–H covalent bond in water.
        right: O–H is covalent and inside one water molecule; a hydrogen bond links separate molecules.
      - wrong: The hydrogen atom is passed to the next molecule.
        right: Hydrogen stays bonded to its original N or O; an attraction links the molecules.
  - type: exam
    body: Name the slightly positive hydrogen, the N or O it is bonded to, and the attraction to a lone pair on a neighbouring molecule. Keep the within-molecule covalent bond separate from the dotted link between molecules.
  - type: takeaways
    items:
      - The syllabus examples contain N–H or O–H bonds; ammonia and water are key cases.
      - A slightly positive hydrogen is attracted to an electron-rich lone pair on a neighbour.
      - Hydrogen bonds are intermolecular; N–H and O–H bonds are covalent and intramolecular.
questions:
  - id: hbond-where
    format: mcq
    difficulty: 1
    objectives: ["3.6.1", "3.6.3"]
    prompt: In liquid water, where is a hydrogen bond?
    options:
      - text: Between the slightly positive H of one molecule and an O lone pair on another.
        correct: true
        why: Hydrogen bonding links polar ends of separate water molecules.
      - text: Between O and H inside one water molecule.
        why: That is the covalent O–H bond, not the intermolecular hydrogen bond.
      - text: Between two oxygen nuclei inside one molecule.
        why: A water molecule has only one oxygen atom.
      - text: Between the two hydrogen atoms in one molecule.
        why: A hydrogen bond links molecules and involves an oxygen lone pair.
    explanation: Hydrogen remains covalently attached to its oxygen and is attracted to a neighbouring oxygen's lone pair.
  - id: hbond-ammonia
    format: mcq
    difficulty: 2
    objectives: ["3.6.1"]
    prompt: Which feature lets ammonia molecules form hydrogen bonds with one another?
    options:
      - text: N–H bonds and a lone pair on nitrogen
        correct: true
        why: N–H hydrogen can be slightly positive and a neighbouring nitrogen lone pair is electron-rich.
      - text: N–N covalent bonds between ammonia molecules
        why: Separate ammonia molecules do not join through N–N covalent bonds.
      - text: A hydrogen atom leaves nitrogen and becomes H⁺
        why: Hydrogen bonding is an attraction; hydrogen transfer is not required.
      - text: A permanent positive charge on every ammonia molecule
        why: Ammonia is neutral, though it has partial charges.
    explanation: Nitrogen's electronegativity polarises N–H, and its lone pair can attract a neighbouring molecule's positive hydrogen.
  - id: hbond-difference
    format: cloze
    difficulty: 1
    objectives: ["3.6.1", "3.6.3"]
    prompt: The O–H bond is {{1}} within a water molecule; the hydrogen bond is {{2}} between molecules.
    blanks:
      - accept: ["covalent", "a covalent bond"]
      - accept: ["intermolecular", "an intermolecular force", "an intermolecular attraction"]
    explanation: One bond joins atoms within a molecule; the other attraction links separate molecules.
  - id: hbond-criteria
    format: mcq
    difficulty: 2
    objectives: ["3.6.1", "3.6.3"]
    prompt: Which pair has the N–H or O–H groups for hydrogen bonding in this syllabus topic?
    options:
      - text: H₂O and NH₃
        correct: true
        why: Water has O–H bonds; ammonia has N–H bonds.
      - text: CH₄ and CO₂
        why: Neither contains N–H or O–H bonds.
      - text: HCl and Cl₂
        why: Neither contains N–H or O–H bonds.
      - text: CO₂ and CH₄
        why: Neither contains N–H or O–H bonds.
    explanation: This topic highlights molecules with N–H or O–H groups, especially ammonia and water.
