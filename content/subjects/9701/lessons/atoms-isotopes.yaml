id: atoms-isotopes
subject: "9701"
topic: "1.2"
title: Isotopes
summary: What isotopes are, how to read nuclide notation, and why isotopes share chemical properties but differ in mass and density.
order: 1
minutes: 4
objectives: ["1.2.1", "1.2.2", "1.2.3", "1.2.4"]
prerequisites: [atoms-particles-in-the-atom]
provenance:
  origin: ai-drafted
  status: draft
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 1.2, learning outcomes 1-4; physical properties limited to
    mass and density as the syllabus states). Heavy-water density (about 1.11 g cm⁻³ at
    room temperature) is a standard literature value. Questions are original.
blocks:
  - type: objective
    body: |
      By the end you can define an isotope, read the notation ${}^{x}_{y}\text{A}$, and explain why isotopes of an element react the same way but have different masses and densities.

  - type: definition
    term: Isotopes
    body: |
      Atoms of the same element with the **same number of protons** but **different numbers of neutrons**.

  - type: explain
    title: Reading the notation
    body: |
      $${}^{x}_{y}\text{A}$$

      - **x** (top left) is the **mass number** (nucleon number): protons + neutrons.
      - **y** (bottom left) is the **atomic number** (proton number).
      - **A** is the element's symbol.

      | isotope | protons | neutrons | electrons (atom) |
      | --- | --- | --- | --- |
      | ${}^{35}_{17}\text{Cl}$ | 17 | 18 | 17 |
      | ${}^{37}_{17}\text{Cl}$ | 17 | 20 | 17 |
      | ${}^{1}_{1}\text{H}$ | 1 | 0 | 1 |
      | ${}^{2}_{1}\text{H}$ (deuterium, D) | 1 | 1 | 1 |

      You'll also see isotopes named in words: chlorine-37 means mass number 37.

  - type: check
    title: Quick check
    questions: [define-isotope, isotope-pair, read-notation]

  - type: explain
    title: Same chemical properties
    body: |
      Chemical reactions are about **electrons**: losing, gaining or sharing them.

      - Isotopes of an element have the same number of protons, so their neutral atoms have the **same number of electrons**.
      - So they have the **same electronic configuration** and react in exactly the same way.
      - Neutrons sit in the nucleus and take no part in chemical reactions.

      ³⁵Cl and ³⁷Cl both form NaCl with sodium, in the same way.

  - type: explain
    title: Different physical properties (mass and density)
    body: |
      - **Mass:** different numbers of neutrons, so the atoms have different masses.
      - **Density:** isotopes' atoms are the same size (same electrons), so a heavier isotope packs more mass into the same volume and is denser.

      Heavy water, D₂O, has a density of about 1.11 g cm⁻³ compared with 1.00 g cm⁻³ for ordinary water. An ice cube made of D₂O **sinks** in a glass of ordinary water. Same chemistry, heavier molecules.

  - type: intuition
    title: Electrons drive, neutrons ride along
    body: |
      Picture two identical cars with the same driver, one with a heavy suitcase in the boot. They steer and handle the same way (chemistry), but one weighs more (mass and density).

      Where it breaks down: a heavier car really would brake a little differently. For isotopes, treat the chemistry as identical (the enrichment note below has the tiny exception), and the physical differences you need are just mass and density.

  - type: check
    title: Same and different
    questions: [same-chemistry, heavy-water, extra-neutrons]

  - type: misconceptions
    items:
      - wrong: "Isotopes have different numbers of protons."
        right: "Same protons (that's what makes them the same element), different neutrons."
      - wrong: "Isotopes react differently because their masses are different."
        right: "Reactions depend on electrons. The same electron configuration means the same chemistry."
      - wrong: "In ${}^{x}_{y}\\text{A}$ the bottom number is the mass number."
        right: "Top is the mass (nucleon) number, which is never smaller than the bottom one; bottom is the proton number."
      - wrong: "An isotope and an ion are the same idea."
        right: "Isotopes differ in **neutrons**; ions differ from their atoms in **electrons**."

  - type: exam
    body: |
      - **Definition:** you need "same number of protons" (or "same element") **and** "different number of neutrons". "Different mass number" alone is weaker; say neutrons.
      - **Same chemical properties:** "same number of electrons" or "same electronic configuration", linked to reactions involving electrons.
      - **Different physical properties:** only mass and density are required. Link density to mass with the same volume.

  - type: enrichment
    title: Not quite identical chemistry
    body: |
      For very light elements, the mass difference can slightly change **how fast** a reaction goes. A C–D bond breaks a little more slowly than a C–H bond (the kinetic isotope effect). The products are the same; only the rate differs. For the exam, isotopes have the same chemical properties.

  - type: takeaways
    items:
      - "Isotopes: same element, same number of protons, different numbers of neutrons."
      - "In ${}^{x}_{y}\\text{A}$, x is the mass (nucleon) number and y is the atomic (proton) number."
      - "Same electrons, so same electronic configuration, so same chemical properties."
      - "Different neutrons, so different mass and density."

questions:
  - id: define-isotope
    format: text
    style: definition
    difficulty: 1
    objectives: ["1.2.1"]
    prompt: |
      Define the term **isotope**.
    accept:
      - "atoms of the same element with the same number of protons but different numbers of neutrons"
      - "atoms of the same element with the same number of protons but different number of neutrons"
      - "atoms of the same element with different numbers of neutrons"
      - "atoms of the same element with different number of neutrons"
      - "atoms with the same number of protons but different numbers of neutrons"
      - "atoms with the same number of protons but different number of neutrons"
      - "atoms with the same number of protons and different numbers of neutrons"
      - "same number of protons, different number of neutrons"
      - "same number of protons but different number of neutrons"
      - "same protons, different neutrons"
      - "same proton number, different number of neutrons"
      - "atoms with same number of protons but different number of neutrons"
      - "atoms with same number of protons but different numbers of neutrons"
      - "atoms of the same element with same number of protons but different number of neutrons"
      - "atoms of the same element with same number of protons but different numbers of neutrons"
      - "atoms of an element with the same number of protons but different numbers of neutrons"
      - "atoms of the same element that have different numbers of neutrons"
      - "atoms with the same atomic number but different numbers of neutrons"
      - "atoms with the same proton number but different numbers of neutrons"
    model: |
      Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons.
    explanation: |
      Both parts matter: the same number of protons (so the same element) and a different number of neutrons.

  - id: isotope-pair
    format: mcq
    difficulty: 1
    objectives: ["1.2.1", "1.2.2"]
    prompt: |
      Which pair are isotopes of each other?
    options:
      - text: |
          ${}^{40}_{18}\text{Ar}$ and ${}^{40}_{20}\text{Ca}$
        why: |
          Same mass number, but different numbers of protons, so different elements.
      - text: |
          ${}^{12}_{6}\text{C}$ and ${}^{14}_{6}\text{C}$
        correct: true
        why: |
          Both have 6 protons; they have 6 and 8 neutrons.
      - text: |
          ${}^{35}_{17}\text{Cl}$ and ${}^{35}_{17}\text{Cl}^{-}$
        why: |
          Same protons and neutrons; they differ only in electrons. That's an atom and its ion, not two isotopes.
      - text: |
          oxygen, O₂, and ozone, O₃
        why: |
          These are two different molecules of the same element (allotropes), not atoms with different neutrons.
    explanation: |
      Isotopes have the same bottom number (protons) and a different top number (because of different neutrons).

  - id: read-notation
    format: cloze
    difficulty: 1
    objectives: ["1.2.2"]
    prompt: |
      In the symbol ${}^{37}_{17}\text{Cl}$, 37 is the {{1}} number and 17 is the {{2}} number. This atom has {{3}} neutrons.
    blanks:
      - accept: ["mass", "nucleon", "mass (nucleon)", "nucleon (mass)", "mass or nucleon", "nucleon or mass"]
      - accept: ["atomic", "proton", "atomic (proton)", "proton (atomic)", "atomic or proton", "proton or atomic"]
      - accept: ["20", "twenty"]
    explanation: |
      Top = mass (nucleon) number, bottom = atomic (proton) number. Neutrons = 37 − 17 = 20.

  - id: same-chemistry
    format: explain
    difficulty: 2
    objectives: ["1.2.3"]
    prompt: |
      Explain why ³⁵Cl and ³⁷Cl have the same chemical properties.
    model: |
      Both are chlorine, so both have 17 protons and (as atoms) 17 electrons. They therefore have the same electronic configuration, 1s² 2s² 2p⁶ 3s² 3p⁵. Chemical reactions involve the electrons (gaining, losing or sharing them), and the neutrons in the nucleus take no part, so the two isotopes react in the same way.
    keyPoints:
      - "Both have 17 protons and so 17 electrons"
      - "Same electronic configuration (same arrangement of electrons)"
      - "Chemical reactions involve electrons"
      - "Neutrons do not take part in chemical reactions"
    explanation: |
      Chemistry follows the electrons. Isotopes differ only in neutrons, which don't take part.

  - id: heavy-water
    format: mcq
    difficulty: 2
    objectives: ["1.2.4", "1.2.3"]
    prompt: |
      Heavy water, D₂O (D is ${}^{2}_{1}\text{H}$), is compared with ordinary water, H₂O. Which statement is correct?
    options:
      - text: |
          D₂O reacts differently with sodium, because deuterium has an extra electron.
        why: |
          Deuterium has one proton and one electron, just like ordinary hydrogen. The extra particle is a neutron.
      - text: |
          D₂O has the same density, because it is the same compound.
        why: |
          Chemically it behaves the same, but density is a physical property, and the heavier molecules make it denser.
      - text: |
          D₂O is denser, because deuterium atoms are much larger than hydrogen atoms.
        why: |
          The size of an atom is set by its electrons, which are the same. The difference is mass.
      - text: |
          D₂O is denser, because each molecule has a greater mass but takes up about the same volume.
        correct: true
        why: |
          Deuterium has an extra neutron, so the molecule is heavier, while the electrons (and so the size) are the same.
    explanation: |
      Isotopes differ in mass and density, not in chemistry. Heavy water is about 11% denser than ordinary water.

  - id: extra-neutrons
    format: numeric
    difficulty: 2
    objectives: ["1.2.1", "1.2.4"]
    prompt: |
      How many more neutrons are there in one molecule of D₂O than in one molecule of H₂O? (Both contain ${}^{16}\text{O}$; H is ${}^{1}_{1}\text{H}$ and D is ${}^{2}_{1}\text{H}$.)
    fields:
      - answer: 2
    explanation: |
      Each D has one neutron and each ¹H has none. Two hydrogen atoms per molecule gives two extra neutrons, which is why D₂O is heavier.
