blocks:
  - type: objective
    body: |
      By the end you can describe the giant metallic lattice of copper and link it to the typical properties of metals.

  - type: explain
    title: Ions in a sea of electrons
    body: |
      A metal such as copper is a **giant metallic lattice**:

      - regular layers of **positive metal ions**, packed closely together;
      - outer electrons that have left the atoms float freely between the ions — the **delocalised electrons**;
      - the attraction between the positive ions and the delocalised electrons is the **metallic bond**, and it acts in every direction.

      For copper, each atom gives up its one outer ($4\text{s}$) electron to the sea, so the lattice holds positive copper ion cores packed closely together. The syllabus picture to remember: **positive ions in a sea of delocalised electrons**.

  - type: definition
    term: Giant metallic lattice
    body: |
      A **giant metallic lattice** is a regular arrangement of positive metal ions surrounded by **delocalised electrons** that are free to move throughout the structure.

  - type: diagram
    diagram: chem-bonding-structure-metallic-lattice
    alt: "A grid of twelve positive copper ion cores drawn as circles marked Cu plus, packed in regular rows, with twelve small dots scattered in the gaps between them representing delocalised electrons — one per atom, so the charges balance. An arrow across the top of the lattice is labelled delocalised electrons move freely. Below the lattice, a double-headed arrow shows two layers of ions sliding over each other. Footer notes: metallic bonding is the attraction between the positive ions and the delocalised electrons; layers of ions slide over each other so the metal bends without shattering; the mobile electrons carry charge and heat, so copper conducts electricity and heat."

  - type: intuition
    title: Ball bearings in honey
    body: |
      Imagine rows of ball bearings (the ions) sitting in sticky honey (the delocalised electrons). The honey holds every ball — but if you push a row sideways, it slides without falling apart.

      That is why metals bend instead of shattering, and why a hit deforms rather than cracks them.

      Where it breaks: the electrons are not a liquid, and the attraction is electrostatic, not stickiness.

  - type: explain
    title: The three classic metal properties
    body: |
      | property | reason from the structure |
      | --- | --- |
      | **conducts electricity** | delocalised electrons are free to move and carry charge |
      | **conducts heat** | the same mobile electrons pass kinetic energy along quickly |
      | **malleable and ductile** (bends and stretches) | layers of ions slide without breaking the metallic bonding — the electrons keep holding |

      Copper adds one more famous property: it is a good conductor of both electricity and heat, which is why it is used in wiring and cooking pans.

  - type: check
    title: Quick check
    questions: [metallic-lattice-parts, metals-bend]

  - type: misconceptions
    items:
      - wrong: "Copper atoms are bonded to each other by covalent bonds."
        right: "Metal atoms release outer electrons into a shared sea; the attraction between ions and delocalised electrons is **metallic bonding**."
      - wrong: "The delocalised electrons belong to one particular copper ion."
        right: "Delocalised means they belong to **none** — they move through the whole lattice."
      - wrong: "When a metal bends, the bonds break and reform."
        right: "The layers slide while the metallic bonding keeps acting; that is why metals can be hammered into shape without shattering."

  - type: exam
    body: |
      - "Describe the structure of a metallic lattice": regular layers/arrangement of **positive metal ions** in a **sea of delocalised electrons**. Both particles and the word "delocalised" are marks.
      - "Explain why copper conducts electricity": the **delocalised electrons** are **free to move** and carry charge.
      - "Explain why metals are malleable": layers of ions **slide over each other** while the metallic bonding (attraction to delocalised electrons) is maintained.

  - type: takeaways
    items:
      - "A giant metallic lattice is positive metal ions packed in regular layers with delocalised electrons between them."
      - "Metallic bonding = attraction between the positive ions and the delocalised electrons."
      - "Mobile electrons explain electrical and thermal conduction; sliding layers explain malleability and ductility."

questions:
  - id: metallic-lattice-parts
    format: cloze
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      A giant metallic lattice consists of a regular arrangement of positive metal {{1}}, surrounded by {{2}} electrons that are free to move throughout the structure.
    blanks:
      - accept: ["ions", "ion", "ions (cations)", "cations"]
      - accept: ["delocalised", "delocalized", "the delocalised", "free", "mobile", "sea of delocalised", "outer"]
    explanation: |
      The two players are the positive ions and the delocalised electrons; their attraction is the metallic bond.

  - id: metals-bend
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      Copper can be hammered into a thin sheet without shattering. Why?
    options:
      - text: |
          The copper ions are small enough to pass through each other.
        why: |
          Ions cannot pass through one another — they stay in their layers, but the layers can shift.
      - text: |
          Layers of positive ions slide over each other, while the attraction to the delocalised electrons keeps the structure together.
        correct: true
        why: |
          The delocalised electrons are spread throughout the lattice, so the metallic bonding continues to act even when layers slide — the metal bends instead of breaking.
      - text: |
          The metallic bonds break and the metal melts slightly at the point of impact.
        why: |
          Metallic bonding stays intact; no melting is needed for a metal to be shaped.
      - text: |
          Copper contains no bonds at all, only free atoms.
        why: |
          The lattice is held by strong metallic bonding — without it the metal would fall apart into atoms.
    explanation: |
      Malleability: layers slide, bonding survives. That is the metallic-lattice answer.
