id: bonding-structure-conductivity-solubility
subject: "9701"
topic: "4.2"
title: Structure decides conductivity and solubility
summary: Who carries the charge, and what dissolves in what — conductivity and solubility explained by structure, with the graphite and MgO quirks called out.
order: 6
minutes: 4
objectives: ["4.2.2"]
prerequisites: [bonding-structure-melting-points]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.2, learning outcome 2: describe, interpret and predict the effect of
    different types of structure and bonding on physical properties, including electrical
    conductivity and solubility). All questions are original. Note: MgO is only very
    slightly soluble in water, so it is taught as essentially insoluble; this is standard
    at AS Level.
    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
    agent as the writer, not a human teacher): facts cross-checked against
