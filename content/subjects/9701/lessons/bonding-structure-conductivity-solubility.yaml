blocks:
  - type: objective
    body: |
      By the end you can predict and explain electrical conductivity and solubility from a substance's structure and bonding.

  - type: explain
    title: Conductivity needs mobile charges
    body: |
      A substance conducts electricity only if it contains charged particles that are **free to move**.

      So the checklist is simple: are there mobile ions, or mobile (delocalised) electrons?

      | structure | solid | molten | aqueous (in water) | who carries the charge |
      | --- | --- | --- | --- | --- |
      | **giant metallic** (copper) | conducts | conducts | — (insoluble) | delocalised electrons |
      | **giant ionic** (NaCl) | does **not** conduct | conducts | conducts (if soluble) | ions, free when not locked in the lattice |
      | **giant molecular** — graphite | conducts (along layers) | — (sublimes) | — (insoluble) | delocalised electrons in the layers |
      | **giant molecular** — diamond, SiO₂ | does **not** conduct | — | — (insoluble) | none: all electrons locked in bonds |
      | **simple molecular** (iodine, ice) | does **not** conduct | does **not** conduct | does **not** conduct | none: no ions, no delocalised electrons |

  - type: intuition
    title: Escaping the classroom
    body: |
      Ions in a solid lattice are pupils stuck to their seats — charges exist, but none can travel.

      Melt or dissolve the lattice and the pupils are free to move around the room: now charge flows.

      Delocalised electrons are pupils who are always roaming — metals and graphite conduct in every state.

  - type: check
    title: Conductivity
    questions: [solid-nacl-no-conduct, graphite-vs-diamond-conduct]

  - type: explain
    title: "Solubility: like dissolves like"
    body: |
      A solute dissolves when solvent particles can replace the forces holding the solute together — so **similar forces mix**:

      | structure | soluble in water (polar) | soluble in non-polar solvents (e.g. hexane) |
      | --- | --- | --- |
      | **giant ionic** (NaCl) | yes — water molecules attract and surround the ions | no |
      | **simple molecular, non-polar** (iodine, $\text{C}_{60}$) | no | yes (iodine in hexane; $\text{C}_{60}$ in toluene) |
      | **giant molecular** (diamond, graphite, SiO₂) | no | no |
      | **giant metallic** (copper) | no | no |

      For giant molecular and metallic structures, dissolving would mean breaking covalent or metallic bonds throughout the lattice — no ordinary solvent can do that.

      One careful exception to remember: $\text{MgO}$ is only **very slightly** soluble in water (much less than NaCl), so it is usually treated as insoluble at this level.

  - type: misconceptions
    items:
      - wrong: "Solid NaCl does not conduct because it has no ions."
        right: "It is full of ions — but they are **locked in the lattice**. Melt or dissolve it and the ions move, so it conducts."
      - wrong: "Graphite conducts because it is a metal."
        right: "Graphite is giant **molecular** (carbon). It conducts because of the **delocalised electrons within its layers**."
      - wrong: "Ionic compounds are insoluble in water because the lattice is strong."
        right: "Water's molecules are attracted to the ions strongly enough to pull them out of the lattice — NaCl dissolves readily."

  - type: check
    title: Solubility
    questions: [iodine-in-hexane, why-nacl-dissolves]

  - type: exam
    body: |
      - "Explain why solid NaCl does not conduct but molten NaCl does": ions are **fixed** in the solid lattice but **free to move** when molten (or in solution).
      - "Explain why copper conducts": **delocalised electrons** are free to move through the lattice.
      - Solubility answers should name the forces: "water is polar and can attract the ions" vs "both solute and solvent are non-polar, so van der Waals' forces form between them".

  - type: takeaways
    items:
      - "Conduction needs mobile charged particles: delocalised electrons (metals, graphite) or free ions (molten/dissolved ionic compounds)."
      - "Ionic solids conduct only when molten or aqueous — the ions must be free to move."
      - "Like dissolves like: ionic compounds in polar solvents; non-polar molecular solids in non-polar solvents."
      - "Giant molecular and metallic structures are insoluble: dissolving would break their strong extended bonding."

questions:
  - id: solid-nacl-no-conduct
    format: mcq
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Solid sodium chloride does not conduct electricity, but molten sodium chloride does. Why?
    options:
      - text: |
          The ions are created when NaCl melts.
        why: |
          The ions already exist in the solid — melting does not create them, it frees them.
      - text: |
          In the solid the ions are fixed in the lattice, but when molten they are free to move and carry charge.
        correct: true
        why: |
          Conductivity needs mobile charged particles. The lattice locks ions in place; melting lets them move.
      - text: |
          The covalent bonds in NaCl break when it melts.
        why: |
          NaCl is ionic, not covalent. Its melting overcomes ionic attraction between lattice positions — the ions stay as ions.
      - text: |
          Molten NaCl contains delocalised electrons.
        why: |
          Delocalised electrons belong to metals (and graphite). Molten ionic compounds conduct with their **ions**.
    explanation: |
      Same ions, different freedom: fixed in the solid → no conduction; mobile when molten → conduction.

  - id: graphite-vs-diamond-conduct
    format: cloze
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Graphite conducts electricity but diamond does not, because in graphite some electrons are {{1}} within the layers, while in diamond every outer electron is held in a {{2}} bond.
    blanks:
      - accept: ["delocalised", "delocalized", "free", "mobile", "free to move"]
      - accept: ["covalent", "c-c", "c–c", "carbon-carbon", "carbon carbon"]
    explanation: |
      Mobile charge is the whole story: graphite has delocalised electrons along its layers; diamond's electrons are locked in C–C covalent bonds.

  - id: iodine-in-hexane
    format: mcq
    difficulty: 2
    objectives: ["4.2.2"]
    prompt: |
      Iodine, $\text{I}_2$, dissolves in hexane (a non-polar solvent) but hardly at all in water. What best explains this?
    options:
      - text: |
          Iodine is ionic and reacts with hexane.
        why: |
          Iodine is a simple molecular solid of $\text{I}_2$ molecules — it is not ionic at all.
      - text: |
          Both iodine and hexane are non-polar, so van der Waals' forces form between solute and solvent ("like dissolves like").
        correct: true
        why: |
          The weak forces between $\text{I}_2$ molecules can be replaced by similar van der Waals' forces with hexane. Water, being polar, cannot offer those forces.
      - text: |
          Water is too dense to dissolve iodine.
        why: |
          Density has nothing to do with it; solubility is about the relative strengths of the forces involved.
      - text: |
          Iodine molecules break into atoms in hexane.
        why: |
          Dissolving never breaks the covalent bond inside $\text{I}_2$ — the molecules stay whole.
    explanation: |
      Non-polar solute + non-polar solvent = compatible intermolecular forces = soluble ("like dissolves like").

  - id: why-nacl-dissolves
    format: text
    style: short
    difficulty: 3
    objectives: ["4.2.2"]
    prompt: |
      Explain why sodium chloride dissolves in water but not in hexane. Mention the particles and the forces.
    accept:
      - "water is polar and its molecules attract and surround the ions, pulling them out of the lattice; hexane is non-polar and cannot attract the ions"
      - "the polar water molecules attract the na+ and cl- ions and pull them from the lattice, while hexane is non-polar and has no attraction for ions"
      - "water molecules are attracted to the ions and pull them out of the lattice; hexane is non-polar so it cannot attract the ions"
      - "polar water molecules can attract and stabilise the ions, but non-polar hexane cannot attract the ions"
    model: |
      Water is polar: its molecules attract the Na⁺ and Cl⁻ ions and pull them out of the lattice. Hexane is non-polar, so it has no attraction strong enough to pull the ions out.
    explanation: |
      Look for both halves: polar water can attract the ions (and break into the lattice); non-polar hexane cannot.
