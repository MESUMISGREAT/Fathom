id: chemical-equilibria-mole-fraction-partial-pressure
subject: "9701"
topic: "7.1"
title: "Mole fractions and partial pressures"
summary: In a gas mixture each gas contributes part of the total pressure. Work out its share with a mole fraction, then multiply by the total pressure.
order: 5
minutes: 10
kind: core
objectives: ["7.1.5"]
prerequisites: [chemical-equilibria-kc-expressions]
