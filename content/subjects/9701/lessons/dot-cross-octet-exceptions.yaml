id: dot-cross-octet-exceptions
subject: "9701"
topic: "3.7"
title: When the octet rule bends
summary: Draw dot-and-cross diagrams with expanded shells and spot an odd-electron molecule.
order: 5
minutes: 4
objectives: ["3.7.1"]
prerequisites: [dot-cross-multiple-covalent]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.7 learning outcome 1 and its expanded-octet/odd-electron guidance, including SO₂, PCl₅, SF₆ and PF₅ from 3.4/3.5. All questions are original; diagrams are schematic and use no measured data.
    Independently re-checked line by line (facts, worked examples, every answer key) in a
    separate AI review on 2026-10-25. Not yet reviewed by a teacher.
blocks:
  - type: objective
    body: By the end, you can draw dot-and-cross diagrams when a central atom has more than eight electrons, and recognise an odd-electron species.
  - type: explain
    title: Period 3 can exceed eight
    body: |
      The simple octet pattern is useful, but it is not an unbreakable rule. In the syllabus models, central atoms in Period 3 can have more than eight electrons around them.

      - PCl₅ and PF₅ have five shared pairs around phosphorus: ten electrons.
      - SF₆ has six shared pairs around sulfur: twelve electrons.
      - SO₂ can be drawn with two S=O double bonds and one lone pair on sulfur: ten electrons around sulfur.

      Keep the dots and crosses in the shared pairs. Do not erase a pair just to force the central atom back to eight.
  - type: diagram
    diagram: chem-dot-cross-octet-exceptions
    alt: Schematic central-atom electron counts show five shared pairs around phosphorus in PCl₅ (the same count as PF₅), six around sulfur in SF₆, and three around boron in BF₃; BF₃ has an incomplete octet, not an expanded one.
    caption: Only bonding pairs around the central atom are shown; outer-atom lone pairs are omitted. The sketches are not to scale.
  - type: check
    title: Count around the centre
    questions: ["dot-exception-pcl5", "dot-exception-sf6"]
  - type: explain
    title: Not every unusual count is expanded
    body: |
      BF₃ has three B–F shared pairs, so boron has only six electrons around it. That is an **incomplete octet**, not an expanded one.

      An odd-electron species has an unpaired electron. For example, NO₂ has 17 outer electrons altogether (5 from N and 6 from each O). A dot-and-cross drawing can show one unpaired electron; resonance can swap which N–O bond is drawn as the double bond.
  - type: example
    title: A quick electron-count check
    problem: Does BF₃ show an expanded octet around boron?
    steps:
      - Boron makes three B–F shared pairs.
      - "Each shared pair counts as two electrons around boron: 3 × 2 = 6."
      - Six is less than eight, so the octet is incomplete, not expanded.
    answer: BF₃ has an incomplete octet around boron.
  - type: check
    title: Avoid the label trap
    questions: ["dot-exception-bf3", "dot-exception-no2"]
  - type: misconceptions
    items:
      - wrong: Every atom must always have exactly eight electrons around it.
        right: Period 3 central atoms can have expanded octets in the specified examples; BF₃ has an incomplete octet.
      - wrong: NO₂ has an even number of outer electrons because it contains two oxygen atoms.
        right: Its total is 5 + 6 + 6 = 17, so one electron is unpaired.
  - type: exam
    body: Count electrons around the central atom, not just the bonds. For an odd-electron species, count all outer electrons first and show the unpaired electron; do not force it into a pair.
  - type: takeaways
    items:
      - PCl₅ and PF₅ have ten electrons around phosphorus; SF₆ has twelve around sulfur.
      - "BF₃ has six electrons around boron: an incomplete octet, not an expanded one."
      - NO₂ has 17 outer electrons, so one is unpaired in a valid dot-and-cross representation.
questions:
  - id: dot-exception-pcl5
    format: mcq
    difficulty: 1
    objectives: ["3.7.1"]
    prompt: How many shared pairs surround phosphorus in PCl₅ or PF₅?
    options:
      - text: Five
        correct: true
        why: Each molecule has five P–halogen covalent bonds around phosphorus.
      - text: Four
        why: Four pairs would give eight electrons, but PCl₅ has five bonds around phosphorus.
      - text: Six
        why: Six pairs surround sulfur in SF₆, not phosphorus in PCl₅ or PF₅.
      - text: Three
        why: PCl₅ and PF₅ each contain five P–halogen bonds.
    explanation: PCl₅ and PF₅ each have five shared pairs, or ten electrons, around phosphorus in the syllabus model.
  - id: dot-exception-sf6
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: How many electrons are around sulfur in the six S–F shared pairs of SF₆?
    options:
      - text: Twelve
        correct: true
        why: Six pairs contain 6 × 2 = 12 electrons.
      - text: Six
        why: Six is the number of shared pairs, not the number of electrons.
      - text: Eight
        why: SF₆ is one of the syllabus expanded-octet examples.
      - text: Fourteen
        why: The six shared pairs contain twelve electrons around sulfur.
    explanation: "Count two electrons in each of six shared pairs: twelve around sulfur."
  - id: dot-exception-bf3
    format: mcq
    difficulty: 2
    objectives: ["3.7.1"]
    prompt: Boron makes three shared pairs in BF₃. How many electrons are around boron, and what is this called?
    options:
      - text: Six electrons; an incomplete octet
        correct: true
        why: Three shared pairs count as six electrons around boron.
      - text: Ten electrons; an expanded octet
        why: Three pairs contain six electrons, not ten.
      - text: Eight electrons; a complete octet
        why: Boron has three shared pairs, or six electrons, in this simple diagram.
      - text: Twelve electrons; an expanded octet
        why: Six pairs would contain twelve electrons; boron has three.
    explanation: "BF₃ is electron-deficient in the simple dot-and-cross model: boron has six electrons around it."
  - id: dot-exception-no2
    format: numeric
    difficulty: 3
    objectives: ["3.7.1"]
    prompt: How many outer electrons are in one NO₂ molecule? Use N = 5 and O = 6.
    fields:
      - answer: 17
        unit: electrons
    explanation: NO₂ has 5 + 6 + 6 = 17 outer electrons, an odd number, so one is unpaired.
