  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus (topic 4.2, learning outcome 1(b): describe, in simple terms, the lattice
    structure of a simple molecular crystalline solid, including iodine,
    buckminsterfullerene C₆₀ and ice). All questions are original.
    Reviewed line by line on 27 Oct 2026 in a second, adversarial AI pass (same
