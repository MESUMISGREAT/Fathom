blocks:
  - type: objective
    body: |
      By the end you can describe the structure of a simple molecular solid — iodine, buckminsterfullerene or ice — and explain what holds it together.

  - type: explain
    title: Molecules first, forces between them second
    body: |
      A **simple molecular** solid is built from small, separate **molecules**.

      Inside each molecule, the atoms are joined by **strong covalent bonds**. Between one molecule and the next, the forces are **weak intermolecular forces**.

      That split — strong within, weak between — explains almost everything about these solids.

  - type: definition
    term: Simple molecular structure
    body: |
      A **simple molecular** solid is a lattice of separate molecules held together by **weak intermolecular forces** (for example van der Waals' forces or hydrogen bonds).

  - type: explain
    title: Three examples from the syllabus
    body: |
      | substance | what the molecules are | what holds the solid together |
      | --- | --- | --- |
      | **iodine**, $\text{I}_2$ | pairs of iodine atoms | van der Waals' forces between $\text{I}_2$ molecules |
      | **buckminsterfullerene**, $\text{C}_{60}$ | 60 carbon atoms in a ball-shaped molecule | van der Waals' forces between the balls |
      | **ice** | $\text{H}_2\text{O}$ molecules | **hydrogen bonds** between water molecules |

      Note the pattern: the **covalent bonds never break** when these solids melt — only the weak forces between molecules give way.

  - type: diagram
    diagram: chem-bonding-structure-simple-molecular
    alt: "Three panels. Left, solid iodine: several I2 molecules drawn as pairs of touching spheres joined by a solid covalent bond, with dashed lines between separate molecules; captions read strong covalent bonds (solid) inside each molecule, weak van der Waals forces (dashed) between molecules. Middle, buckminsterfullerene: two balls drawn as circles with a hexagonal cage pattern and spokes to the rim, joined by a dashed line; captions read each ball is one C60 molecule (60 carbon atoms), weak van der Waals forces (dashed) between the balls. Right, ice: six H2O molecules at the corners of an open hexagonal ring joined by dashed hydrogen bonds, with a gap labelled in the middle; captions read hydrogen bonds (dashed) hold an open lattice with gaps, the gaps make ice less dense than water, so ice floats. Footer: strong bonds within molecules, weak forces between molecules."

  - type: intuition
    title: The marbles-and-velcro picture
    body: |
      Picture strong velcro *inside* each marble-sized molecule and a whisper of static *between* marbles.

      To melt the solid you only need to separate the marbles — the velcro stays fastened. That is why iodine melts and sublimes without ever breaking an I–I bond.

      Where it breaks down: real intermolecular forces are electrical attractions, not sticky patches. But the "strong inside, weak outside" split is exact.

  - type: check
    title: Structure basics
    questions: [simple-molecular-hold, iodine-sublimation]

  - type: explain
    title: Why these solids behave as they do
    body: |
      - **Low melting and boiling points.** Only weak forces between molecules must be overcome, so little energy is needed.
      - **No electrical conduction.** There are no free ions and no delocalised electrons — nothing mobile to carry charge.
      - **Iodine sublimes.** Solid iodine turns straight into purple vapour when gently heated: the weak forces simply let go.
      - **$\text{C}_{60}$ dissolves in non-polar solvents.** The balls are non-polar, so van der Waals' forces let them mix with solvents like toluene (much less in hexane).
      - **Ice floats.** Hydrogen bonds hold water molecules in an **open lattice** with gaps, so ice is **less dense** than liquid water.

  - type: misconceptions
    items:
      - wrong: "Melting iodine breaks the covalent bonds between iodine atoms."
        right: 'Melting overcomes only the **weak forces between** $\text{I}_2$ molecules. Breaking I–I bonds would be a chemical change.'
      - wrong: "Ice floats because water molecules are lighter than other molecules."
        right: "It floats because the hydrogen-bonded lattice is **open**, with gaps that make ice less dense than liquid water."
      - wrong: "Simple molecular substances conduct electricity when molten, like ionic ones."
        right: "No: they have no ions and no delocalised electrons, so there is nothing to carry charge in any state."

  - type: check
    title: Properties
    questions: [ice-floats, c60-solubility]

  - type: exam
    body: |
      - Two-structure answers need both halves: **strong covalent bonds within molecules**, **weak intermolecular forces between molecules**. Marks are usually split between them.
      - "Why does iodine have a low melting point?" → weak van der Waals' forces between $\text{I}_2$ molecules are easy to overcome (do **not** say covalent bonds break).
      - When listing examples, the syllabus trio for simple molecular solids is **iodine, $\text{C}_{60}$ and ice** — use them by name.

  - type: takeaways
    items:
      - "Simple molecular solids: separate molecules held by weak intermolecular forces."
      - "Melting or boiling overcomes the weak forces only — covalent bonds stay intact."
      - "That is why they have low melting points and do not conduct electricity."
      - "Iodine sublimes, C₆₀ dissolves in non-polar solvents, and ice floats thanks to its open hydrogen-bonded lattice."

questions:
  - id: simple-molecular-hold
    format: text
    style: short
    difficulty: 1
    objectives: ["4.2.1"]
    prompt: |
      What forces hold a simple molecular solid (such as solid iodine) together?
    accept:
      - "weak intermolecular forces"
      - "intermolecular forces"
      - "weak forces between molecules"
      - "van der waals forces"
      - "van der waals' forces"
      - "weak van der waals forces"
      - "weak van der waals' forces"
      - "weak intermolecular forces between the molecules"
    model: |
      Weak intermolecular forces (for example van der Waals' forces) between the molecules.
    explanation: |
      The molecules themselves are held together internally by covalent bonds, but the solid is held together by the weak forces **between** molecules.

  - id: iodine-sublimation
    format: mcq
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      Solid iodine turns directly into a purple vapour when gently heated. What happens to the particles when this occurs?
    options:
      - text: |
          The covalent bonds inside each I₂ molecule break.
        why: |
          Breaking I–I bonds would give iodine atoms, a chemical change. Heating gently only separates the molecules.
      - text: |
          The weak forces between I₂ molecules are overcome, and whole I₂ molecules escape into the vapour.
        correct: true
        why: |
          Sublimation only overcomes the weak intermolecular forces. The vapour still contains intact I₂ molecules — that is why it is purple, not atomic iodine.
      - text: |
          The ionic bonds in the iodine lattice break.
        why: |
          Iodine is not ionic — it is a simple molecular solid made of I₂ molecules.
      - text: |
          The iodine atoms rearrange into a new crystal structure.
        why: |
          No rearrangement happens: the molecules simply leave the solid and enter the gas phase.
    explanation: |
      Sublimation = overcoming the weak forces between molecules. The covalent bonds within I₂ are untouched.

  - id: ice-floats
    format: cloze
    difficulty: 2
    objectives: ["4.2.1"]
    prompt: |
      Ice floats on water because hydrogen bonds hold the water molecules in an {{1}} lattice with gaps, making ice {{2}} dense than liquid water.
    blanks:
      - accept: ["open", "open hexagonal", "hexagonal", "ordered", "regular"]
      - accept: ["less", "lower", "slightly less", "slightly lower"]
    explanation: |
      The hydrogen-bonded arrangement leaves empty gaps, so the same mass of water occupies more volume as ice — making it less dense, so it floats.

  - id: c60-solubility
    format: mcq
    difficulty: 3
    objectives: ["4.2.1"]
    prompt: |
      Buckminsterfullerene, $\text{C}_{60}$, is a simple molecular solid of ball-shaped carbon molecules. In which liquid is it most likely to dissolve?
    options:
      - text: |
          Water, because carbon compounds always dissolve in water.
        why: |
          Many carbon compounds are non-polar and insoluble in water; $\text{C}_{60}$ is non-polar and famously insoluble in it.
      - text: |
          Toluene, a non-polar organic solvent, because the weak forces between C₆₀ molecules can be replaced by similar forces with the solvent.
        correct: true
        why: |
          "Like dissolves like": non-polar $\text{C}_{60}$ dissolves in non-polar solvents such as toluene, where van der Waals' forces take over from those between the balls.
      - text: |
          Molten sodium chloride, because ionic liquids dissolve all molecular solids.
        why: |
          Ionic liquids do not dissolve non-polar molecular solids; their ions interact with polar or ionic substances.
      - text: |
          It cannot dissolve in any solvent, because C₆₀ has covalent bonds.
        why: |
          Dissolving does not break covalent bonds — it only replaces the weak forces between molecules with solvent–solute forces.
    explanation: |
      Non-polar $\text{C}_{60}$ mixes with non-polar solvents like toluene, driven by similar intermolecular forces on both sides.
