id: bonding-structure-simple-molecular
subject: "9701"
topic: "4.2"
title: "Simple molecular solids: iodine, buckminsterfullerene and ice"
summary: Small molecules, weak forces between them — why iodine sublimes, why C60 dissolves in organic solvents, and why ice floats.
order: 2
minutes: 4
objectives: ["4.2.1"]
prerequisites: [intermolecular-forces-types]
