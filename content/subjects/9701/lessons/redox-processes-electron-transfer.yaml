blocks:
  - type: objective
    body: |-
      By the end you can write half-equations for electron loss and gain, combine them into a full redox equation, and identify the **oxidising agent** and **reducing agent** in a reaction.

  - type: explain
    title: Two halves of one change
    body: |-
      Electrons cannot simply appear or vanish. If one species loses electrons, another must gain them at the same moment.

      That is why the two processes always happen together, and why the whole thing is called **redox**: reduction plus oxidation.

      The old definitions used oxygen and hydrogen. The modern ones use electrons, which is far more useful.

  - type: definition
    term: Oxidation and reduction
    body: |-
      **Oxidation** is the **loss of electrons**. The oxidation number of the element **increases**.

      **Reduction** is the **gain of electrons**. The oxidation number of the element **decreases**.

      A useful memory aid is **OIL RIG**: **O**xidation **I**s **L**oss, **R**eduction **I**s **G**ain.

      Both halves can be written as **half-equations**, which show only the electrons and the species that change.

  - type: example
    title: "Worked example: two simple half-equations"
    problem: |-
      Write half-equations for the two changes in

      $$\text{Zn(s)} + \text{Cu}^{2+}\text{(aq)} \rightarrow \text{Zn}^{2+}\text{(aq)} + \text{Cu(s)}$$
    steps:
      - |-
        Zinc goes from $\text{Zn}$ to $\text{Zn}^{2+}$. It has lost two electrons, so this is oxidation:

        $$\text{Zn} \rightarrow \text{Zn}^{2+} + 2e^-$$
      - |-
        Copper goes from $\text{Cu}^{2+}$ to $\text{Cu}$. It has gained two electrons, so this is reduction:

        $$\text{Cu}^{2+} + 2e^- \rightarrow \text{Cu}$$
      - |-
        Check the charges: left $0$, right $+2 + 2(-1) = 0$ for zinc. Left $+2 + 2(-1) = 0$, right $0$ for copper. ✔
      - |-
        Add the two half-equations. The two electrons cancel because one half supplies exactly what the other needs:

        $$\text{Zn} + \text{Cu}^{2+} \rightarrow \text{Zn}^{2+} + \text{Cu}$$
    answer: |-
      Oxidation: $\text{Zn} \rightarrow \text{Zn}^{2+} + 2e^-$. Reduction: $\text{Cu}^{2+} + 2e^- \rightarrow \text{Cu}$.

  - type: diagram
    diagram: chem-redox-electron-transfer
    alt: >-
      Two columns linked by an electron arrow. The left column shows oxidation: a species loses
      electrons, its oxidation number increases, and it acts as the reducing agent. The right column
      shows reduction: a species gains electrons, its oxidation number decreases, and it acts as the
      oxidising agent. An arrow labelled "electrons lost equals electrons gained" connects them.
    caption: |-
      Electrons pass from the species being oxidised to the species being reduced. The two changes are inseparable.

  - type: definition
    term: Oxidising agent and reducing agent
    body: |-
      An **oxidising agent** (oxidant) is a species that **accepts electrons** and is therefore **reduced**. It causes the other species to be oxidised.

      A **reducing agent** (reductant) is a species that **donates electrons** and is therefore **oxidised**. It causes the other species to be reduced.

      The names describe what the substance does to the *other* substance, not what happens to itself.

      | Species | What it does | What happens to it |
      | --- | --- | --- |
      | Oxidising agent | takes electrons from something else | is reduced |
      | Reducing agent | gives electrons to something else | is oxidised |

  - type: intuition
    title: Why the oxidising agent is the one reduced
    body: |-
      Think of the oxidising agent as a thief of electrons. By taking electrons, it oxidises its victim — but stealing electrons is itself reduction.

      So the oxidising agent always appears on the **left** with a higher oxidation number and ends up **reduced**.

      Common oxidising agents you will meet: $\text{KMnO}_4$, $\text{K}_2\text{Cr}_2\text{O}_7$, $\text{Cl}_2$, concentrated $\text{H}_2\text{SO}_4$, $\text{H}_2\text{O}_2$ (usually).

      Common reducing agents: metals such as $\text{Zn}$ and $\text{Mg}$, $\text{Fe}^{2+}$, $\text{SO}_2$, $\text{H}_2$, carbon.

  - type: example
    title: "Worked example: permanganate and iron(II)"
    problem: |-
      For the reaction

      $$\text{MnO}_4^- + 5\text{Fe}^{2+} + 8\text{H}^+ \rightarrow \text{Mn}^{2+} + 5\text{Fe}^{3+} + 4\text{H}_2\text{O}$$

      identify what is oxidised, what is reduced, and name the oxidising and reducing agents.
    steps:
      - |-
        Oxidation numbers: Mn goes from $+7$ in $\text{MnO}_4^-$ to $+2$ in $\text{Mn}^{2+}$. That is a **decrease** of 5, so manganese is reduced.
      - |-
        Fe goes from $+2$ to $+3$. That is an **increase** of 1, so iron is oxidised.
      - |-
        The species reduced is $\text{MnO}_4^-$, so it is the **oxidising agent**.
      - |-
        The species oxidised is $\text{Fe}^{2+}$, so it is the **reducing agent**.
      - |-
        Check the electrons: each Mn gains 5 electrons; each Fe loses 1. With 5 Fe ions, the electrons balance exactly.
    answer: |-
      $\text{MnO}_4^-$ is reduced (oxidising agent); $\text{Fe}^{2+}$ is oxidised (reducing agent).

  - type: check
    title: Quick check
    questions: [oxidation-meaning, electrons-lost, oxidising-agent-magnesium]

  - type: explain
    title: Combining half-equations when the electrons do not match
    body: |-
      In the zinc/copper example, both halves involved two electrons, so they cancelled immediately.

      Often they do not match. The rule is: **multiply each half-equation so the electrons are equal**, then add.

      For $\text{Fe}^{2+}$ and $\text{MnO}_4^-$:

      - Reduction: $\text{MnO}_4^- + 8\text{H}^+ + 5e^- \rightarrow \text{Mn}^{2+} + 4\text{H}_2\text{O}$
      - Oxidation: $\text{Fe}^{2+} \rightarrow \text{Fe}^{3+} + e^-$

      The reduction needs 5 electrons, so multiply the oxidation half by 5:

      $$5\text{Fe}^{2+} \rightarrow 5\text{Fe}^{3+} + 5e^-$$

      Add and cancel the electrons:

      $$\text{MnO}_4^- + 5\text{Fe}^{2+} + 8\text{H}^+ \rightarrow \text{Mn}^{2+} + 5\text{Fe}^{3+} + 4\text{H}_2\text{O}$$

      Multiplying a half-equation never changes the chemistry; it just matches the electron count.

  - type: check
    title: Practice
    questions: [reducing-agent-zinc, oil-rig-cloze, agent-spot-error]

  - type: misconceptions
    items:
      - wrong: The oxidising agent is the species that gets oxidised.
        right: |-
          It is the species that gets **reduced**. It takes electrons from the other species, which
          is what oxidises that other species.
      - wrong: Reduction means gaining oxygen.
        right: |-
          That is the older definition. In electron terms, reduction is **gain of electrons**, and
          the oxidation number decreases.
      - wrong: Oxidation and reduction can happen separately.
        right: |-
          Electrons lost must be gained by something. The two processes always occur together in a
          redox reaction.
      - wrong: Adding the same species to both sides is needed to balance electrons.
        right: |-
          Multiply whole half-equations so the electron counts match; do not invent extra species.
      - wrong: A substance that is oxidised loses mass.
        right: |-
          Mass is conserved; oxidation is about electrons, not the amount of substance disappearing.

  - type: exam
    body: |-
      - Learn the definitions word for word: oxidation is **loss of electrons**; reduction is **gain of electrons**. Vague answers lose marks.
      - When asked for the oxidising agent, name the **reactant** that is reduced, not the product.
      - Balance half-equations in this order: atoms other than O and H, then O with $\text{H}_2\text{O}$, then H with $\text{H}^+$, then charge with electrons.
      - Always check that charge balances on both sides of a half-equation; it catches most errors instantly.

  - type: takeaways
    items:
      - '**Oxidation** is loss of electrons and an increase in oxidation number.'
      - '**Reduction** is gain of electrons and a decrease in oxidation number.'
      - 'An **oxidising agent** accepts electrons and is reduced.'
      - 'A **reducing agent** donates electrons and is oxidised.'
      - 'Half-equations are combined by matching the number of electrons, then adding and cancelling.'

  - type: deeper
    title: Where the electrons physically go
    body: |-
      In the zinc/copper reaction, the electrons travel through the metal from the zinc to the copper ions. That is why the reaction works as a battery: the electron flow can be made to do electrical work.

      In the permanganate titration, the electrons are transferred when the ions collide in solution. The purple colour fades as $\text{MnO}_4^-$ is reduced to almost colourless $\text{Mn}^{2+}$, which is why permanganate is its own indicator.

questions:
  - id: oxidation-meaning
    format: mcq
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      In terms of electrons, what is oxidation?
    options:
      - text: Loss of electrons
        correct: true
        why: |-
          OIL RIG: oxidation is loss. The oxidation number increases.
      - text: Gain of electrons
        why: |-
          That is reduction.
      - text: Gain of oxygen only
        why: |-
          Gaining oxygen is an older definition and does not cover reactions without oxygen.
      - text: Loss of protons
        why: |-
          Redox is about electrons, not protons.
    explanation: |-
      Oxidation is loss of electrons; reduction is gain.

  - id: electrons-lost
    format: numeric
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      How many electrons are lost when $\text{Fe}^{2+}$ is oxidised to $\text{Fe}^{3+}$?
    fields:
      - label: "electrons ="
        answer: 1
        tolerance: { abs: 0.01 }
    explanation: |-
      The charge rises from $+2$ to $+3$, so one electron is lost: $\text{Fe}^{2+} \rightarrow \text{Fe}^{3+} + e^-$.

  - id: oxidising-agent-magnesium
    format: mcq
    difficulty: 1
    objectives: ["6.1.4"]
    prompt: |-
      In the reaction $2\text{Mg} + \text{O}_2 \rightarrow 2\text{MgO}$, which species is the oxidising agent?
    options:
      - text: $\text{O}_2$
        correct: true
        why: |-
          Oxygen is reduced from 0 to $-2$, so it accepts electrons and oxidises the magnesium.
      - text: $\text{Mg}$
        why: |-
          Magnesium is oxidised from 0 to $+2$, so it is the reducing agent.
      - text: $\text{MgO}$
        why: |-
          That is the product, not the species doing the oxidising.
      - text: Neither; there is no redox here
        why: |-
          Magnesium's oxidation number changes from 0 to $+2$ and oxygen's from 0 to $-2$, so it is
          definitely redox.
    explanation: |-
      The oxidising agent is the reactant that is reduced: oxygen.

  - id: reducing-agent-zinc
    format: text
    difficulty: 2
    style: short
    objectives: ["6.1.4"]
    prompt: |-
      Name the reducing agent in

      $$\text{Zn} + \text{Cu}^{2+} \rightarrow \text{Zn}^{2+} + \text{Cu}$$
    accept:
      - zinc
      - Zn
      - the zinc
      - zinc metal
    model: |-
      Zinc, $\text{Zn}$, because it loses electrons and is oxidised to $\text{Zn}^{2+}$.
    explanation: |-
      Zinc donates electrons, so it is oxidised and acts as the reducing agent.

  - id: oil-rig-cloze
    format: cloze
    difficulty: 1
    objectives: ["6.1.3"]
    prompt: |-
      Oxidation is the {{1}} of electrons, while reduction is the {{2}} of electrons.
    blanks:
      - accept: [loss, losing]
      - accept: [gain, gaining]
    explanation: |-
      OIL RIG: Oxidation Is Loss, Reduction Is Gain.

  - id: agent-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["6.1.4"]
    prompt: |-
      A student describes the reaction $\text{Zn} + \text{Cu}^{2+} \rightarrow \text{Zn}^{2+} + \text{Cu}$. Which line contains the first error?
    lines:
      - Zinc is oxidised from 0 to +2, so it loses electrons.
      - Copper(II) ions are reduced from +2 to 0, so they gain electrons.
      - Copper(II) ions are the reducing agent because they gain electrons.
      - Zinc is therefore the reducing agent.
    errorLine: 3
    fix: |-
      A species that **gains** electrons is reduced, so it is the **oxidising** agent, not the reducing agent. $\text{Cu}^{2+}$ is the oxidising agent; zinc is the reducing agent.
    explanation: |-
      Lines 1, 2 and 4 are correct. Line 3 reverses the meaning of "reducing agent".
