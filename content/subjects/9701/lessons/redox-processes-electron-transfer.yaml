id: redox-processes-electron-transfer
subject: "9701"
topic: "6.1"
title: "Electron transfer: who loses, who gains, who is the agent"
summary: Oxidation is loss of electrons and reduction is gain. The species that accepts electrons is the oxidising agent — so it is the one that gets reduced.
order: 3
minutes: 8
kind: core
objectives: ["6.1.3", "6.1.4"]
prerequisites: [redox-processes-oxidation-numbers]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027, topic 6.1, learning outcomes 6.1.3 (redox, oxidation and reduction in terms of
    electron transfer and oxidation-number change) and 6.1.4 (oxidising and reducing agents).
    Every half-equation was charge- and atom-checked in Python on 2026-10-28. All questions are
