id: intermolecular-forces-types
subject: "9701"
topic: "3.6"
title: Three ways molecules attract
summary: Meet temporary London forces, permanent dipole attractions and hydrogen bonds.
order: 1
minutes: 4
objectives: ["3.6.3"]
prerequisites: []
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus,
    topic 3.6 learning outcome 3. All questions are original; no illustrative data are used.
