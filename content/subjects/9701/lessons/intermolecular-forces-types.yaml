blocks:
  - type: objective
    body: |
      By the end, you can name the forces between molecules and explain how temporary and permanent dipoles attract.
  - type: explain
    title: Inside a molecule or between molecules?
    body: |
      A water molecule has strong covalent bonds inside it. Separate water molecules also attract each other; these are **intermolecular forces**.

      Cambridge uses **van der Waals' forces** as the umbrella name for all intermolecular forces. Some books use the term more narrowly, so remember the syllabus convention.
  - type: definition
    term: van der Waals' forces
    body: |
      Intermolecular forces between molecular entities, other than forces due to bond formation. In this syllabus, van der Waals' forces is the generic term for all intermolecular forces.
  - type: explain
    title: Three attractions
    body: |
      - **Instantaneous dipole–induced dipole (id–id)** forces, also called **London dispersion forces**, begin when a brief uneven spread of electrons in one molecule nudges electrons in a neighbour. Their opposite ends attract.
      - **Permanent dipole–permanent dipole (pd–pd)** forces act between molecules that already have a slightly positive end and a slightly negative end.
      - **Hydrogen bonding** is a particularly strong, special case of pd–pd attraction. We will zoom in on it next.

      London forces can act between any molecules. Permanent dipole attractions need polar molecules.
  - type: diagram
    diagram: chem-intermolecular-forces-types
    alt: Three panels show a temporary dipole inducing an opposite end in a neighbour, opposite ends of permanent dipoles attracting, and a dotted hydrogen bond between molecules.
    caption: Dashed links are attractions between molecules, not covalent bonds within them.
  - type: check
    title: Name that attraction
    questions: ["types-umbrella", "types-id-id"]
  - type: example
    title: Sort the molecules
    problem: Which attraction acts between two carbon dioxide molecules?
    steps:
      - CO₂ has no N–H or O–H group, so it cannot hydrogen-bond in the syllabus examples.
      - Its straight shape makes the two C=O bond dipoles cancel, so it has no permanent dipole.
      - Brief electron shifts still create temporary dipoles, so London forces act.
    answer: London dispersion forces act between CO₂ molecules.
  - type: check
    title: Check the distinction
    questions: ["types-permanent", "types-hydrogen"]
  - type: misconceptions
    items:
      - wrong: Van der Waals' forces only means London forces.
        right: In this syllabus it is the generic name for all intermolecular forces.
      - wrong: London forces need a polar molecule.
        right: Temporary electron shifts can happen in any molecule.
  - type: exam
    body: Name what causes the dipoles and say why opposite ends attract. Do not call an intermolecular force a covalent bond.
  - type: takeaways
    items:
      - Van der Waals' forces is Cambridge's umbrella term for intermolecular forces.
      - London forces are temporary; permanent dipole attractions use lasting partial charges.
      - Hydrogen bonding is a special case of permanent dipole–permanent dipole attraction.
questions:
  - id: types-umbrella
    format: cloze
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: Cambridge uses {{1}} as a generic term for all intermolecular forces.
    blanks:
      - accept: ["van der Waals' forces", "van der Waals forces"]
    explanation: Here, van der Waals' forces is the umbrella term.
  - id: types-id-id
    format: mcq
    difficulty: 1
    objectives: ["3.6.3"]
    prompt: What starts an instantaneous dipole–induced dipole attraction?
    options:
      - text: A brief uneven spread of electrons in one molecule affects a neighbour.
        correct: true
        why: A temporary dipole induces another dipole nearby.
      - text: An electron pair is permanently shared between two molecules.
        why: That describes a covalent bond, not an intermolecular force.
      - text: Two positive ends are lined up beside each other.
        why: Like charges repel; opposite dipole ends attract.
      - text: A hydrogen atom moves from one molecule to another.
        why: Hydrogen bonding is an attraction, not atom transfer.
    explanation: A momentary uneven electron distribution can induce an opposite one nearby.
  - id: types-permanent
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: Two polar molecules line up with opposite ends close together. Which attraction is this?
    options:
      - text: Permanent dipole–permanent dipole attraction
        correct: true
        why: Both molecules have lasting partial charges and opposite ends attract.
      - text: Instantaneous dipole–induced dipole only
        why: That starts with temporary dipoles.
      - text: A covalent bond
        why: No electron pair joins atoms from the two molecules.
      - text: Ionic bonding
        why: These are partial charges on molecules, not oppositely charged ions.
    explanation: Permanent dipoles have lasting partial charges, so their opposite ends attract.
  - id: types-hydrogen
    format: mcq
    difficulty: 2
    objectives: ["3.6.3"]
    prompt: Which statement best describes hydrogen bonding?
    options:
      - text: A special case of permanent dipole–permanent dipole attraction between molecules.
        correct: true
        why: This is the syllabus description.
      - text: A covalent bond inside every molecule containing hydrogen.
        why: Hydrogen bonding is between molecules; covalent bonds are within molecules.
      - text: The attraction between any two hydrogen atoms.
        why: It involves a polar X–H bond and an electron-rich site on a neighbour.
      - text: The only intermolecular force acting on water.
        why: London forces also act between water molecules.
    explanation: Hydrogen bonding is a special type of permanent dipole attraction; it does not replace London forces.
