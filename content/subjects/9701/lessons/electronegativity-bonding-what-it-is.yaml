id: electronegativity-bonding-what-it-is
subject: "9701"
topic: "3.1"
title: "Electronegativity: the tug-of-war for electrons"
summary: What electronegativity means, and how nuclear charge, atomic radius and shielding decide how hard an atom pulls on bonding electrons.
order: 1
minutes: 4
objectives: ["3.1.1", "3.1.2"]
prerequisites: [atoms-first-ionisation-energy, atoms-shells-subshells-orbitals]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701
    syllabus 2025-2027 (topic 3.1, learning outcomes 3.1.1 and 3.1.2). Electronegativities
    are Pauling values rounded to 1 d.p. (F 4.0, O 3.4, Cl 3.2, S 2.6, Cs 0.8). The atomic
    (covalent) radii F 72 pm and Cl 99 pm are standard values, used for illustration. The
    "protons minus inner electrons" net pull is a deliberately rough shielding model and is
    labelled as such. All questions are original. The covalent radii match the Cambridge Data Booklet (F 0.072 nm, Cl 0.099 nm).
    Independently re-checked line by line (facts, worked examples, every answer key) in a separate AI review on 2026-10-24. Not yet reviewed by a teacher.

blocks:
  - type: objective
    body: |
      By the end you can define **electronegativity** and explain how nuclear charge, atomic radius and shielding decide how strongly an atom attracts electrons.

  - type: explain
    title: Sharing isn't always fair
    body: |
      In a covalent bond, two atoms share a pair of electrons. Picture a tug-of-war, with the electron pair as the rope.

      If both atoms pull equally, as in $\text{Cl}_2$, the pair sits right in the middle. If one pulls harder, as in $\text{HCl}$, the pair shifts towards the stronger puller: chlorine wins.

  - type: definition
    term: Electronegativity
    body: |
      The power of an atom to attract electrons to itself.

      In practice, "electrons" means the **bonding pair**: the shared electrons in a covalent bond.

  - type: explain
    title: The Pauling scale
    body: |
      - Electronegativity is a number on the **Pauling scale**. It has **no units**.
      - Fluorine is the most electronegative element, at **4.0**.
      - Caesium is down near the bottom, at about **0.8**.
      - In exams, Pauling values are given when you need them. No need to memorise a table.

  - type: check
    title: Quick check
    questions: [define-electronegativity, pauling-cloze]

  - type: explain
    title: Three things decide the pull
    body: |
      Electronegativity comes down to one thing: how strongly the **nucleus attracts the bonding pair**. Three factors set that.

      | factor | if it goes up… | electronegativity |
      | --- | --- | --- |
      | **nuclear charge** (number of protons) | stronger pull | **higher** |
      | **atomic radius** (distance to the bonding pair) | weaker pull | **lower** |
      | **shielding** by inner shells and sub-shells | more repulsion from inner electrons | **lower** |

      Sound familiar? They're the same factors that control ionisation energy.

  - type: intuition
    title: Like a Wi-Fi signal
    body: |
      Your phone gets a better signal with a stronger router (**nuclear charge**), when you're closer (**atomic radius**), and with fewer walls in between (**shielding**).

      Where it breaks down: inner electrons aren't walls that block the pull. They **repel** the bonding pair, cancelling out part of the nucleus's attraction.

  - type: check
    title: Which way?
    questions: [more-electronegative-change]

  - type: diagram
    diagram: chem-electronegativity-bonding-fluorine-vs-chlorine
    alt: "A fluorine atom and a chlorine atom side by side, each with its nucleus, inner shells and an outer shell of eight electrons, with the bonding pair at the top highlighted and an arrow from the bonding pair to the nucleus. The outer shells are drawn to scale: fluorine's radius is 72 pm and chlorine's is 99 pm, so chlorine's bonding pair is visibly further from its nucleus. Fluorine has a +9 nucleus and one inner shell of 2 electrons; chlorine has a +17 nucleus and inner shells of 2 and 8. A table underneath compares them: nuclear charge +9 and +17; inner shielding electrons 2 and 10; net pull, roughly protons minus inner electrons, +7 for both; atomic radius 72 pm and 99 pm; electronegativity 4.0 and 3.2."
    caption: Same rough net pull, but chlorine's bonding pair is further away.

  - type: example
    title: Fluorine vs chlorine
    problem: |
      Chlorine has 17 protons and fluorine has only 9. So why is **fluorine** the more electronegative one?
    steps:
      - |
        **Nuclear charge:** chlorine wins, +17 against +9.
      - |
        **Shielding:** chlorine has 10 inner electrons (2,8) between its nucleus and the bonding pair. Fluorine has only 2.

        Rough net pull, protons minus inner electrons: $17 - 10 = +7$ for Cl, and $9 - 2 = +7$ for F. A draw so far.
      - |
        **Atomic radius:** chlorine's bonding pair is in the third shell, further from the nucleus (99 pm against 72 pm). Attraction weakens with distance.
      - |
        So the nucleus attracts the bonding pair **less strongly** in chlorine, and fluorine is more electronegative: 4.0 against 3.2.
    answer: |
      Chlorine's extra protons are cancelled out by its extra shielding, and its bonding pair is further from the nucleus. So fluorine attracts the bonding pair more strongly.

  - type: check
    title: Use the factors
    questions: [chlorine-spot-error, sulfur-net-pull, oxygen-vs-sulfur]

  - type: misconceptions
    items:
      - wrong: More protons always means a higher electronegativity.
        right: Only if shielding and distance stay about the same. Chlorine has more protons than fluorine but is less electronegative, because of its extra shielding and bigger radius.
      - wrong: Electronegativity is measured in kJ mol⁻¹, like ionisation energy.
        right: It's a number on the Pauling scale, with **no units**.
      - wrong: Electronegativity is the energy needed to remove an electron.
        right: That's ionisation energy, for gaseous atoms. Electronegativity is about attracting the **bonding** electrons in a bond.

  - type: exam
    body: |
      - Definition must-haves: "**power of an atom**" and "**attract electrons**". Adding "the bonding pair in a covalent bond" never hurts.
      - When you explain a value, name the factor **and** link it to attraction: "more shielding, so weaker attraction between the nucleus and the bonding pair".
      - Never write that an atom "wants" electrons or "wants a full shell". Talk about attraction.

  - type: takeaways
    items:
      - "Electronegativity: the power of an atom to attract electrons (the bonding pair) to itself."
      - "It's measured on the Pauling scale, with no units. Fluorine tops it at 4.0."
      - "Higher nuclear charge raises it; a larger atomic radius and more shielding lower it."
      - "Every explanation comes back to the attraction between the nucleus and the bonding pair."

questions:
  - id: define-electronegativity
    format: text
    style: definition
    difficulty: 1
    objectives: ["3.1.1"]
    prompt: |
      Define **electronegativity**.
    accept:
      - "the power of an atom to attract electrons to itself"
      - "the power of an atom to attract electrons towards itself"
      - "the ability of an atom to attract electrons to itself"
      - "the ability of an atom to attract electrons towards itself"
      - "the power of an atom to attract bonding electrons to itself"
      - "the power of an atom to attract the bonding electrons to itself"
      - "the ability of an atom to attract bonding electrons to itself"
      - "the power of an atom to attract the bonding pair of electrons"
      - "the power of an atom to attract the bonding pair of electrons to itself"
      - "the power of an atom to attract the bonding pair of electrons in a covalent bond"
      - "the power of an atom to attract the bonding pair of electrons in a covalent bond to itself"
      - "the power of an atom to attract the bonding pair of electrons in a covalent bond towards itself"
      - "the ability of an atom to attract the bonding pair of electrons in a covalent bond"
      - "the ability of an atom to attract the bonding pair of electrons in a covalent bond to itself"
      - "the power of an atom to attract the pair of electrons in a covalent bond"
      - "the power of an atom to attract the shared pair of electrons in a covalent bond"
      - "the power of an atom to attract the electrons in a covalent bond to itself"
      - "the power of an atom to attract the electrons in a covalent bond"
      - "the power of an atom in a covalent bond to attract the bonding electrons"
      - "the power of an atom in a molecule to attract electrons to itself"
      - "the ability of an atom in a covalent bond to attract the bonding pair of electrons"
    model: |
      The power of an atom to attract electrons to itself (in a covalent bond, the bonding pair of electrons).
    explanation: |
      Check yours for both parts: "power (or ability) of an **atom**" and "to **attract electrons**". Electronegativity is not an energy and has no units.

  - id: pauling-cloze
    format: cloze
    difficulty: 1
    objectives: ["3.1.1"]
    prompt: |
      Electronegativity values are given on the {{1}} scale. They have {{2}} units, and the most electronegative element, {{3}}, has a value of 4.0.
    blanks:
      - accept: ["Pauling", "Pauling's", "Pauling electronegativity"]
      - accept: ["no", "zero"]
      - accept: ["fluorine", "F"]
    explanation: |
      The Pauling scale is unitless, and fluorine sits at the top with 4.0.

  - id: more-electronegative-change
    format: mcq
    difficulty: 2
    objectives: ["3.1.2"]
    prompt: |
      Which change would make an atom attract its bonding pair **more** strongly, giving a higher electronegativity?
    options:
      - text: |
          An extra inner shell of electrons between the nucleus and the bonding pair.
        why: |
          More shielding, and the bonding pair ends up further away. Both weaken the pull.
      - text: |
          More protons in the nucleus, with the same inner shells.
        correct: true
        why: |
          More nuclear charge with the same shielding means a stronger attraction for the bonding pair.
      - text: |
          The bonding pair being further from the nucleus.
        why: |
          A larger distance (atomic radius) means a weaker attraction.
      - text: |
          The atom being closer to having a full outer shell.
        why: |
          Atoms don't "want" full shells. Electronegativity depends on the attraction between the nucleus and the bonding pair.
    explanation: |
      Only a bigger nuclear charge (with shielding and distance unchanged) increases the pull. More shielding and a larger radius both decrease it.

  - id: chlorine-spot-error
    format: spot-error
    difficulty: 2
    objectives: ["3.1.2"]
    prompt: |
      A student explains why fluorine is more electronegative than chlorine. Which line contains the error?
    lines:
      - "Fluorine has 9 protons and chlorine has 17."
      - "Fluorine's bonding pair is in the second shell; chlorine's is in the third shell."
      - "So chlorine's bonding pair is further from its nucleus."
      - "Chlorine also has fewer inner electrons shielding its bonding pair."
      - "So chlorine attracts the bonding pair less strongly, and fluorine is more electronegative."
    errorLine: 4
    fix: |
      Chlorine has **more** inner electrons (10, against 2 for fluorine), so its bonding pair is **more** shielded.
    explanation: |
      Chlorine is 2,8,7, so 10 electrons sit in inner shells. Fluorine is 2,7, with only 2. More shielding plus a larger radius outweighs chlorine's extra protons.

  - id: sulfur-net-pull
    format: numeric
    difficulty: 2
    objectives: ["3.1.2"]
    prompt: |
      Use the rough model "net pull ≈ protons − inner electrons". What net charge does the bonding pair of a **sulfur** atom feel? (Sulfur: 16 protons, electrons arranged 2,8,6.)
    fields:
      - answer: 6
        label: "net pull ≈ +"
    explanation: |
      Inner shells hold 2 + 8 = 10 electrons, so the net pull is about $16 - 10 = +6$.

  - id: oxygen-vs-sulfur
    format: mcq
    difficulty: 3
    objectives: ["3.1.2"]
    prompt: |
      Oxygen (2,6) and sulfur (2,8,6) both have a rough net pull of +6 on their bonding pair. Which statement is correct?
    options:
      - text: |
          Oxygen is more electronegative, because its bonding pair is closer to the nucleus.
        correct: true
        why: |
          Same rough net pull, but oxygen's bonding pair is in the second shell, not the third. Closer means a stronger attraction (O 3.4, S 2.6).
      - text: |
          Sulfur is more electronegative, because it has more protons.
        why: |
          Sulfur's 8 extra protons are cancelled by 8 extra inner electrons.
      - text: |
          They have the same electronegativity, because the net pull is the same.
        why: |
          Net pull is only part of the story. Distance matters too, and sulfur's bonding pair is further away.
      - text: |
          Sulfur is more electronegative, because it has more shielding.
        why: |
          More shielding **lowers** electronegativity, it doesn't raise it.
    explanation: |
      When the net pull is about equal, distance decides: the closer bonding pair (oxygen's) is attracted more strongly.
