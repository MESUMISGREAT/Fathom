id: enthalpy-change-exothermic-endothermic
subject: "9701"
topic: "5.1"
title: "Reactions that warm you up and cool you down"
summary: Every reaction either releases energy to the surroundings or takes energy from them — and the sign of ΔH is just a bookkeeping convention for which way the energy went.
order: 1
minutes: 6
kind: core
objectives: ["5.1.1"]
prerequisites: [bonding-structure-giant-ionic]
provenance:
  origin: ai-drafted
  status: ai-checked
  notes: >-
    Drafted against the official Cambridge International AS & A Level Chemistry 9701 syllabus
    2025-2027 (learning outcome 5.1.1, reactions are accompanied by enthalpy changes that can be
    exothermic or endothermic). Everyday examples are illustrative; all questions are original.
    Adversarially re-checked line by line (syllabus coverage, mark-scheme wording of every
    definition, worked examples, every answer key, MCQ distractors, tolerances and spot-error
    lines) on 2026-10-28 in the same cloud chat, which has no separate reviewer model. Every
    numeric key was recomputed independently with Python from the question's own data, and all
    seven diagrams were rendered and inspected in light and dark. That pass corrected a
    gas-phase hydrogen calculation that had used a whole mole of O=O instead of half a mole,
    a wrong enthalpy key in one calorimetry question, and a claim about heat of vaporisation
    that disagreed with the figure used elsewhere in the batch. Not yet reviewed by a
    separate reviewer or by a teacher.
blocks:
  - type: objective
    body: |
      By the end you can describe a reaction as **exothermic** or **endothermic** from what happens to the surroundings, and you know which sign of $\Delta H$ goes with each.

  - type: explain
    title: Something always gets warmer
    body: |
      Drop a magnesium ribbon into dilute hydrochloric acid and the test tube gets hot. Mix ammonium nitrate with water and the tube gets **cold**.

      In both cases a chemical reaction has happened. In one, energy has been released to the surroundings; in the other, energy has been taken from them.

      Chemistry calls this the **enthalpy change** of the reaction, written $\Delta H$.

  - type: definition
    term: Exothermic reaction
    body: |
      A reaction that **releases energy to the surroundings**, so the temperature of the surroundings rises.

      $\Delta H$ is **negative** (for example $\Delta H = -890\ \text{kJ mol}^{-1}$).

  - type: definition
    term: Endothermic reaction
    body: |
      A reaction that **takes in energy from the surroundings**, so the temperature of the surroundings falls.

      $\Delta H$ is **positive** (for example $\Delta H = +178\ \text{kJ mol}^{-1}$).

  - type: explain
    title: Why negative means "released"
    body: |
      Enthalpy ($H$) is a measure of the energy stored in a substance. $\Delta H$ compares the products with the reactants:

      $$\Delta H = H_\text{products} - H_\text{reactants}$$

      If the products hold **less** energy than the reactants, the difference is negative — the surplus went to the surroundings. That is exothermic.

      If the products hold **more** energy, the difference is positive — energy came in from the surroundings. That is endothermic.

      So the sign is not saying "the reaction has negative energy". It is saying *which way the energy flowed*. A minus sign means energy left the chemicals.

  - type: diagram
    diagram: chem-enthalpy-change-exo-endo
    alt: >-
      Two panels. Left, exothermic: bars for the reactants (higher) and products (lower), with a
      downward arrow labelled "ΔH negative, energy released"; a thermometer beside it shows the
      surroundings warming from 20 °C to 45 °C. Right, endothermic: the products bar is higher
      than the reactants, with an upward arrow labelled "ΔH positive, energy absorbed", and a
      thermometer showing the surroundings cooling from 20 °C to 8 °C. A note under both reads
      "the total energy is conserved — it is only moved".
    caption: |
      Same total energy, different direction of travel: out to the surroundings, or in from them.

  - type: explain
    title: Reading the problem, not the formula
    body: |
      In the lab you cannot see $\Delta H$. You can only see the **thermometer**.

      - Temperature of the mixture rises → exothermic → $\Delta H$ negative.
      - Temperature falls → endothermic → $\Delta H$ positive.

      The thermometer measures the **surroundings** (usually the water or the solution), not the chemicals themselves. That is exactly why it is a good test: energy leaving the reaction must arrive somewhere, and it arrives in the surroundings.

  - type: check
    title: Quick check
    questions: [sign-convention, classify-reactions, thermometer-reading]

  - type: example
    title: "Worked example: which way did the energy go?"
    problem: |
      When $0.050\ \text{mol}$ of ammonium nitrate dissolves in water, the temperature of the water falls from $21.0\ ^\circ\text{C}$ to $14.5\ ^\circ\text{C}$. The enthalpy change of solution is $+26\ \text{kJ mol}^{-1}$.

      Is the process exothermic or endothermic, and how much energy is transferred?
    steps:
      - |
        The temperature of the surroundings (the water) **falls**, so energy has been taken in from the surroundings. The process is endothermic.
      - |
        The sign agrees: $\Delta H$ is positive ($+26\ \text{kJ mol}^{-1}$).
      - |
        Energy transferred per mole is $26\ \text{kJ}$, and we have $0.050\ \text{mol}$:
        $$E = 26 \times 0.050 = 1.3\ \text{kJ}$$
      - |
        So $1.3\ \text{kJ}$ ($1300\ \text{J}$) of energy has moved from the water into the dissolving ammonium nitrate — which is why the water feels cold.
    answer: |
      Endothermic; about $1.3\ \text{kJ}$ absorbed from the surroundings.

  - type: misconceptions
    items:
      - wrong: Exothermic reactions have a negative enthalpy change, so the products have negative energy.
        right: |
          Enthalpy values are measured relative to a chosen zero, and $\Delta H$ is a
          **difference**. A negative $\Delta H$ only means the products store less energy than the
          reactants did.
      - wrong: An endothermic reaction cannot happen on its own.
        right: |
          It can, as long as energy keeps arriving — for example from a Bunsen burner, from
          warmth in the room, or from the surroundings cooling down. Dissolving ammonium nitrate
          in water happens spontaneously and gets cold.
      - wrong: In an exothermic reaction, energy is destroyed.
        right: |
          Energy is conserved. It is transferred to the surroundings, which is why the mixture and
          the test tube warm up.
      - wrong: If the test tube feels hot, the chemicals themselves must be at a higher temperature than the flame.
        right: |
          The heat you feel is energy that has left the reaction and spread into the glass and the
          air. The reaction's own energy has gone **down**.
      - wrong: The sign of ΔH tells you how fast the reaction is.
        right: |
          The sign and size say nothing about rate. A reaction can be very exothermic and yet
          incredibly slow — a mixture of hydrogen and oxygen sits there happily until it is
          ignited.

  - type: exam
    body: |
      - "State whether the reaction is exothermic or endothermic" (1 mark): give the word **and**
        the evidence (temperature rises or falls).
      - When asked for the sign, write "$\Delta H$ is negative" rather than "the reaction is
        negative" — the sign belongs to the enthalpy change.
      - If the question supplies a thermometer reading, use it: a rise means energy was released
        **to the surroundings**, a fall means energy was absorbed **from** them.
      - Combustion, neutralisation and most oxidation reactions are exothermic. Thermal
        decomposition and most cracking reactions are endothermic.

  - type: check
    title: Check yourself
    questions: [explain-cold-pack, mixed-signs, energy-conserved]

  - type: takeaways
    items:
      - 'Exothermic: energy released to the surroundings, temperature rises, $\Delta H$ negative.'
      - 'Endothermic: energy absorbed from the surroundings, temperature falls, $\Delta H$ positive.'
      - '$\Delta H = H_\text{products} - H_\text{reactants}$: the sign shows the direction of transfer.'
      - Energy is always conserved; only its location changes.
      - The thermometer measures the surroundings, which is why it reveals the sign.

  - type: deeper
    title: Enthalpy, not just "heat"
    body: |
      Technically $\Delta H$ is the heat exchanged **at constant pressure** — which is why we can
      measure it in an open beaker. If a reaction is carried out at constant volume instead, the
      heat exchanged is slightly different, because some energy may go into pushing the atmosphere
      back as gases are produced.

      For Cambridge purposes, "enthalpy change" and "heat energy transferred at constant pressure"
      are the same thing, and everything in this topic is measured that way.

questions:
  - id: sign-convention
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      A reaction has $\Delta H = -450\ \text{kJ mol}^{-1}$. Which statement is correct?
    options:
      - text: It is exothermic, and energy is transferred to the surroundings
        correct: true
        why: |
          A negative $\Delta H$ means the products store less enthalpy than the reactants, so the
          difference has been released to the surroundings.
      - text: It is endothermic, and energy is taken in from the surroundings
        why: |
          Endothermic reactions have a **positive** $\Delta H$; the temperature of the surroundings
          would fall.
      - text: It is exothermic, but the surroundings get colder
        why: |
          The two halves contradict each other. Releasing energy to the surroundings makes them
          warmer.
      - text: Nothing can be said without knowing the temperature
        why: |
          The sign alone tells you the direction of energy transfer; the temperature is not needed
          to classify the reaction.
    explanation: |
      $\Delta H = H_\text{products} - H_\text{reactants}$ is negative, so the products are lower in
      enthalpy and the surplus has gone to the surroundings.

  - id: classify-reactions
    format: mcq
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      Which of these reactions is **endothermic**?
    options:
      - text: Thermal decomposition of calcium carbonate
        correct: true
        why: |
          Heating is needed continuously to break the carbonate apart, so energy is taken in:
          $\Delta H$ is positive.
      - text: Burning methane in oxygen
        why: |
          Combustion releases energy — that is the whole point of a fuel. It is strongly
          exothermic.
      - text: Neutralising hydrochloric acid with sodium hydroxide
        why: |
          The mixture warms up; neutralisation is exothermic (about $-57\ \text{kJ mol}^{-1}$).
      - text: Adding magnesium to dilute hydrochloric acid
        why: |
          The test tube gets hot and hydrogen fizzes off — exothermic.
    explanation: |
      Decomposition needs energy put in to break bonds, so it is endothermic. The other three all
      warm their surroundings.

  - id: thermometer-reading
    format: numeric
    difficulty: 1
    objectives: ["5.1.1"]
    prompt: |
      A reaction mixture's temperature rises from $19.5\ ^\circ\text{C}$ to $31.0\ ^\circ\text{C}$.

      By how many kelvin did the surroundings warm?
    fields:
      - answer: 11.5
        tolerance: { abs: 0.05 }
        unit: K
    explanation: |
      A temperature difference of $11.5\ ^\circ\text{C}$ is the same as $11.5\ \text{K}$ — kelvin
      and Celsius degrees are the same size, they just start at different places. The rise means
      energy was released, so the reaction is exothermic.

  - id: explain-cold-pack
    format: explain
    difficulty: 2
    objectives: ["5.1.1"]
    prompt: |
      A sports injury cold pack works by squeezing a bag so that ammonium nitrate mixes with water. Explain, in terms of energy transfer, why the pack becomes cold.
    model: |
      Dissolving ammonium nitrate is endothermic: the process takes in more energy from the
      surroundings than it releases. The energy comes from the water and the plastic bag, so their
      temperature falls and the pack feels cold against the skin. Energy has not been created or
      destroyed — it has been transferred from the surroundings into the chemicals, which is why
      $\Delta H$ for the process is positive.
    keyPoints:
      - Dissolving is endothermic
      - Energy is taken in from the surroundings (water, bag, skin)
      - Surroundings cool, so the pack feels cold
      - ΔH is positive; total energy is conserved
    explanation: |
      Full marks need: endothermic, energy taken from the surroundings, temperature falls, and
      $\Delta H$ positive.

  - id: mixed-signs
    format: spot-error
    difficulty: 2
    objectives: ["5.1.1"]
    prompt: |
      A student describes two reactions. Which line contains the first error?
    lines:
      - In reaction A the test tube gets hot, so the reaction is exothermic
      - The enthalpy change of reaction A is therefore negative
      - In reaction B the mixture gets colder, so energy has been released to the surroundings
      - The enthalpy change of reaction B is positive
    errorLine: 3
    fix: |
      If the mixture gets colder, energy has been **taken in from** the surroundings, not released
      to them. That is endothermic, and $\Delta H$ is positive.
    explanation: |
      Lines 1, 2 and 4 are consistent. Line 3 mixes up the direction: cooling surroundings mean the
      reaction absorbed energy.

  - id: energy-conserved
    format: mcq
    difficulty: 2
    objectives: ["5.1.1"]
    prompt: |
      In an exothermic reaction, what happens to the energy released?
    options:
      - text: It is transferred to the surroundings, which warm up
        correct: true
        why: |
          Energy is conserved, so it must go somewhere — into the surrounding air, water, glass and
          anything else in contact with the reaction.
      - text: It is destroyed as the bonds re-form
        why: |
          Energy is never destroyed. Forming bonds releases energy, which is exactly why it ends up
          in the surroundings.
      - text: It stays stored in the products
        why: |
          The products store **less** energy than the reactants — that is what makes the reaction
          exothermic.
      - text: It turns into extra mass
        why: |
          Mass–energy equivalence exists, but the change in mass here is unimaginably small and is
          not part of AS Chemistry.
    explanation: |
      The temperature rise of the surroundings is the visible evidence that the released energy has
      been transferred, not destroyed.
